<script>
const D={"name": "ep037", "file": "ep037", "dur": 1843.41665625, "segs": [], "subs": [{"t": 0.0, "x": "1976年の7月のことです。"}, {"t": 2.9833333333333334, "x": "火星の地面から、1枚の写真が届きました。"}, {"t": 6.383333333333334, "x": "写っていたのは機械の脚の先です。"}, {"t": 8.683333333333334, "x": "丸い皿のような足が、砂と小石の上に乗っていました。"}, {"t": 12.45, "x": "火星の地表で撮られた最初の写真とされています。"}, {"t": 15.583333333333334, "x": "撮ったのはアメリカの着陸機です。"}, {"t": 17.716666666666665, "x": "名前はバイキング1号です。"}, {"t": 19.683333333333334, "x": "同じ年の9月には2号も降りました。"}, {"t": 22.133333333333333, "x": "1号とは遠く離れた別の場所です。"}, {"t": 24.633333333333333, "x": "2機が運んだのはカメラだけではありません。"}, {"t": 27.166666666666668, "x": "土をすくう腕を持っていました。"}, {"t": 29.166666666666668, "x": "小さな実験室も積んでいました。"}, {"t": 31.35, "x": "目当ては火星の生き物です。"}, {"t": 33.2, "x": "土の中に、小さな生き物がいるかどうか。"}, {"t": 36.266666666666666, "x": "それを確かめに行ったのです。"}, {"t": 38.083333333333336, "x": "実験の結果は、地球に届きました。"}, {"t": 40.86666666666667, "x": "ある実験では、生き物のような反応が出ました。"}, {"t": 44.18333333333333, "x": "別の道具では、逆の向きの結果が出ました。"}, {"t": 47.36666666666667, "x": "生き物の材料になる物が見つからなかったのです。"}, {"t": 50.43333333333333, "x": "答えは一つにまとまりませんでした。"}, {"t": 52.68333333333333, "x": "それから50年がたちます。"}, {"t": 54.53333333333333, "x": "答えは今も研究者の間で割れたままです。"}, {"t": 57.416666666666664, "x": "2機の着陸機は、降りた場所に"}, {"t": 59.71666666666667, "x": "残っているのが上から確かめられています。"}, {"t": 62.21666666666667, "x": "声はもう届きません。"}, {"t": 63.71666666666667, "x": "この回は、火星の土に生命を問いかけた2機の記録です。"}, {"t": 67.8, "x": "1号が火星を回り始めたのは、1976年の6月19日です。"}, {"t": 73.41666666666667, "x": "はじめの道は、とても細長いものでした。"}, {"t": 76.4, "x": "近い所で1500キロ、遠い所で5万キロあまりです。"}, {"t": 80.53333333333333, "x": "翌日には、遠い所を3万3000キロほどまで縮めました。"}, {"t": 84.85, "x": "この道から、降りる場所を上から調べます。"}, {"t": 87.91666666666667, "x": "この機体は2つの機体の組でした。"}, {"t": 90.18333333333334, "x": "一つは周回機です。"}, {"t": 91.7, "x": "火星を回り続けて、上から写真を撮ります。"}, {"t": 95.06666666666666, "x": "もう一つは着陸機です。"}, {"t": 96.8, "x": "周回機から切りはなされて地面に降ります。"}, {"t": 99.5, "x": "着陸の日は決めてありました。"}, {"t": 101.48333333333333, "x": "7月4日です。"}, {"t": 102.8, "x": "アメリカの独立から、ちょうど200年の記念日でした。"}, {"t": 106.46666666666667, "x": "降りる場所の候補もありました。"}, {"t": 108.36666666666666, "x": "クリセ平原と呼ばれる北の平らな土地です。"}, {"t": 111.1, "x": "候補を選ぶのに使ったのは、4年ほど前の写真でした。"}, {"t": 114.9, "x": "火星を回ったマリナー9号が撮ったものです。"}, {"t": 117.73333333333333, "x": "ただ、その写真は粗いものでした。"}, {"t": 120.2, "x": "1号の周回機が、候補の土地を近くから撮りました。"}, {"t": 124.03333333333333, "x": "すると思っていたより地面が荒れていました。"}, {"t": 126.56666666666666, "x": "深く刻まれた川の跡のような地形も写っていました。"}, {"t": 129.88333333333333, "x": "このまま降りれば、岩に当たって倒れるかもしれません。"}, {"t": 133.4, "x": "チームは決めました。"}, {"t": 134.75, "x": "この場所には降りない。"}, {"t": 136.15, "x": "7月4日にも降りない。"}, {"t": 137.81666666666666, "x": "周回機の写真を見ながら、安全な場所を探し直しました。"}, {"t": 142.05, "x": "選んだのはクリセ平原の西の斜面です。"}, {"t": 144.7, "x": "この探し直しで、着陸は2週間あまり遅れました。"}, {"t": 148.61666666666667, "x": "記念日には間に合いませんでした。"}, {"t": 150.66666666666666, "x": "けれど上から確かめる目が、着陸機を守ったのです。"}, {"t": 154.38333333333333, "x": "周回機と着陸機を1組で送った"}, {"t": 156.78333333333333, "x": "意味が、最初に出た場面でした。"}, {"t": 159.06666666666666, "x": "バイキング計画では、同じ形の機体を2つ作りました。"}, {"t": 163.08333333333334, "x": "どちらも周回機と着陸機の組です。"}, {"t": 165.58333333333334, "x": "打ち上げのときの重さは、1組で3500キロあまりでした。"}, {"t": 169.8, "x": "そのうち着陸機は980キロほどです。"}, {"t": 172.78333333333333, "x": "周回機は、2340キロほどでした。"}, {"t": 176.18333333333334, "x": "着陸機は、全体の3分の1に届かない重さでした。"}, {"t": 180.16666666666666, "x": "周回機は太陽の光で電気を作りました。"}, {"t": 183.15, "x": "着陸機は太陽電池を使いません。"}, {"t": 185.65, "x": "電気の元は、放射性の物質が出す熱です。"}, {"t": 188.98333333333332, "x": "その電池を2つ積んでいました。"}, {"t": 191.03333333333333, "x": "太陽の光が無い夜でも、電気を作れます。"}, {"t": 194.33333333333334, "x": "打ち上げは1975年の夏でした。"}, {"t": 197.28333333333333, "x": "ここで順番の入れかわりが起きています。"}, {"t": 199.73333333333332, "x": "先に打ち上げる予定の機体がありました。"}, {"t": 202.26666666666668, "x": "その電池が、打ち上げ前に放電してしまったのです。"}, {"t": 205.86666666666667, "x": "そこで2番目の機体を先に打ち上げました。"}, {"t": 208.53333333333333, "x": "先に飛んだ機体が1号になりました。"}, {"t": 211.0, "x": "遅れた方が2号になりました。"}, {"t": 213.03333333333333, "x": "1号の打ち上げは8月20日です。"}, {"t": 215.46666666666667, "x": "2号は9月9日に続きました。"}, {"t": 217.76666666666668, "x": "どちらもフロリダ州のケープカナベラルからです。"}, {"t": 220.56666666666666, "x": "火星までは10か月から11か月ほどの旅でした。"}, {"t": 223.9, "x": "1号は翌年の6月に火星を回り始めます。"}, {"t": 227.16666666666666, "x": "2号は8月7日でした。"}, {"t": 229.05, "x": "2号の道は、近い所で1500キロ、"}, {"t": 232.05, "x": "遠い所で3万6000キロほどです。"}, {"t": 234.81666666666666, "x": "火星の赤道から、56度ほど傾いた道でした。"}, {"t": 238.65, "x": "のちに道はさらに傾けられ、北極や"}, {"t": 241.51666666666668, "x": "南極のあたりもよく撮れるようになります。"}, {"t": 243.91666666666666, "x": "計画を受け持ったのはNASAです。"}, {"t": 245.88333333333333, "x": "ラングレー研究所とジェット推進研究所が"}, {"t": 248.58333333333334, "x": "中心になりました。"}, {"t": 249.81666666666666, "x": "周回機は空から、着陸機は地面から、"}, {"t": 252.78333333333333, "x": "2組で火星を調べる計画でした。"}, {"t": 255.43333333333334, "x": "着陸機には、打ち上げ前の大切な準備がありました。"}, {"t": 259.26666666666665, "x": "機体を丸ごと熱で焼くことです。"}, {"t": 261.45, "x": "理由は地球の細菌です。"}, {"t": 263.31666666666666, "x": "細菌がついたまま火星に降りたら、どうなるでしょう。"}, {"t": 266.78333333333336, "x": "土の実験が地球の細菌を見つけてしまうかもしれません。"}, {"t": 270.45, "x": "そうなれば、火星の生き物かどうか区別がつきません。"}, {"t": 274.01666666666665, "x": "火星を地球の生き物で汚すおそれもありました。"}, {"t": 277.0833333333333, "x": "そこで着陸機を熱で殺菌することにしました。"}, {"t": 280.18333333333334, "x": "熱の当て方にも決まりがありました。"}, {"t": 282.4166666666667, "x": "湿り気をとても低く抑えます。"}, {"t": 284.53333333333336, "x": "空気1リットルあたりの水分は、1.3ミリグラムでした。"}, {"t": 288.56666666666666, "x": "組み立てた着陸機は、殻で包んで閉じてから熱しました。"}, {"t": 292.4166666666667, "x": "どの部分も10011.7度より下がらないように保ちます。"}, {"t": 296.03333333333336, "x": "その温度を30時間続けました。"}, {"t": 298.3, "x": "一番温度の低い所でも、この温度を"}, {"t": 301.1666666666667, "x": "下回らないようにしたのです。"}, {"t": 302.9166666666667, "x": "これで細菌の数は、およそ1万分の"}, {"t": 305.7, "x": "1に減ると見積もられました。"}, {"t": 307.4, "x": "この数字は計算で出したものです。"}, {"t": 309.6333333333333, "x": "熱に強い細菌の1種が、熱で"}, {"t": 312.1666666666667, "x": "どれだけ死ぬかをもとにしました。"}, {"t": 314.01666666666665, "x": "組み立ては、細菌の少ないきれいな部屋で行われました。"}, {"t": 317.8666666666667, "x": "組み立ての途中にも、細菌の数を何千回も調べています。"}, {"t": 322.0833333333333, "x": "生命を探す実験を積むなら、ここまでやる。"}, {"t": 325.3833333333333, "x": "のちの火星の着陸機でも、バイキングを"}, {"t": 328.1333333333333, "x": "組み立てたときの細菌の少なさが目安にされました。"}, {"t": 331.26666666666665, "x": "1976年7月20日です。"}, {"t": 334.15, "x": "着陸機が周回機から切りはなされました。"}, {"t": 336.8666666666667, "x": "8時32分、世界標準時でのことです。"}, {"t": 340.28333333333336, "x": "着陸機は火星へ落ちていきます。"}, {"t": 342.46666666666664, "x": "まず固い殻に守られて空気の中に入りました。"}, {"t": 345.53333333333336, "x": "入ったときは、1秒に4.5キロほどの速さでした。"}, {"t": 349.26666666666665, "x": "火星の空気はとても薄いものです。"}, {"t": 351.56666666666666, "x": "殻だけでは速さを落としきれません。"}, {"t": 353.8666666666667, "x": "途中でパラシュートを開きました。"}, {"t": 355.9, "x": "差し渡しは16メートルです。"}, {"t": 358.05, "x": "殻を外して、3本の脚を伸ばします。"}, {"t": 361.05, "x": "最後は下向きの3つのエンジンを噴きました。"}, {"t": 363.76666666666665, "x": "地面との間を電波で測りながら、速さを落としていきます。"}, {"t": 367.8, "x": "地面に着いたのは11時53分6秒でした。"}, {"t": 371.1333333333333, "x": "切りはなしから3時間あまりです。"}, {"t": 373.23333333333335, "x": "場所は北緯22度あまりです。"}, {"t": 375.3333333333333, "x": "クリセ平原の西の斜面でした。"}, {"t": 377.46666666666664, "x": "ねらった点からは28キロほど離れていました。"}, {"t": 380.51666666666665, "x": "それでも選び直した土地に、"}, {"t": 382.25, "x": "無事に降りることができました。"}, {"t": 384.31666666666666, "x": "この日付には、もう一つの意味があります。"}, {"t": 387.2, "x": "アポロ11号が月に降りたのも7月20日でした。"}, {"t": 390.6, "x": "1969年のことです。"}, {"t": 393.01666666666665, "x": "1号は、そのちょうど7年後に火星に降りたことになります。"}, {"t": 397.1, "x": "7月4日に降りていれば、この重なりはありませんでした。"}, {"t": 400.98333333333335, "x": "火星への着陸が本当に成功したのは、"}, {"t": 403.6666666666667, "x": "これが初めてとされています。"}, {"t": 405.75, "x": "着陸機は地球に向けてデータを送り始めます。"}, {"t": 408.85, "x": "着地から5分もたたないうちです。"}, {"t": 410.98333333333335, "x": "着陸機は写真を送り始めました。"}, {"t": 413.43333333333334, "x": "最初に写したのは足もとでした。"}, {"t": 415.55, "x": "脚の先の丸い皿が写っていました。"}, {"t": 417.95, "x": "皿の真ん中には、砂とちりが少し載っていました。"}, {"t": 421.45, "x": "降りたときに積もった物と見られています。"}, {"t": 423.8666666666667, "x": "皿のまわりには、岩と細かい粒が写っていました。"}, {"t": 427.43333333333334, "x": "カメラからは1.4メートルほど先の地面です。"}, {"t": 430.5, "x": "火星の地面が、すぐ近くから写っていました。"}, {"t": 433.7, "x": "写真は少しずつ、地球へ送られてきました。"}, {"t": 437.01666666666665, "x": "最初の1枚は、足もとのすぐ近くを写したものでした。"}, {"t": 440.95, "x": "続いてまわりの景色をぐるりと撮りました。"}, {"t": 443.56666666666666, "x": "見わたせた角度は300度ほどです。"}, {"t": 445.8333333333333, "x": "翌日には色のついた写真も届きました。"}, {"t": 448.56666666666666, "x": "地面は赤茶色でした。"}, {"t": 450.15, "x": "岩がいくつも散らばっていました。"}, {"t": 452.15, "x": "地面に立った目で見た、初めての火星の色です。"}, {"t": 455.5, "x": "カメラは、景色を撮るだけの道具ではありません。"}, {"t": 458.6666666666667, "x": "生き物らしい物が写っていないかを見ることです。"}, {"t": 461.6166666666667, "x": "けれど、2機の写真に生き物らしい形は写りませんでした。"}, {"t": 465.7, "x": "答えは目で見える大きさではなさそうです。"}, {"t": 468.28333333333336, "x": "残るのは、土の中の小さなものを調べる方法でした。"}, {"t": 472.1666666666667, "x": "着陸機は生き物を探すだけの機械ではありません。"}, {"t": 475.3333333333333, "x": "毎日、火星の天気も測っていました。"}, {"t": 478.28333333333336, "x": "気温を測ります。"}, {"t": 479.6, "x": "風の向きと速さも測ります。"}, {"t": 481.6166666666667, "x": "1号の場所の気温は、夜明け前に下がりました。"}, {"t": 485.03333333333336, "x": "マイナス86度です。"}, {"t": 486.76666666666665, "x": "昼過ぎでもマイナス33度ほどでした。"}, {"t": 489.3833333333333, "x": "1日のうちに50度以上も上がり下がりします。"}, {"t": 492.4, "x": "火星をおおう空気は、地球よりずっと薄いものです。"}, {"t": 495.93333333333334, "x": "その大部分は二酸化炭素です。"}, {"t": 498.0833333333333, "x": "薄い空気は、昼の熱をためておけません。"}, {"t": 501.15, "x": "日が沈むと、地面はすぐに冷えていきます。"}, {"t": 504.1666666666667, "x": "着陸機は地震計も積んでいました。"}, {"t": 506.5833333333333, "x": "地面の揺れを測る道具です。"}, {"t": 508.51666666666665, "x": "けれど1号の地震計は使えない状態でした。"}, {"t": 511.6, "x": "地震計で火星の中を探る仕事は、のちに引き継がれます。"}, {"t": 515.7, "x": "40年あまりのち、2018年に降りた着陸機です。"}, {"t": 519.9, "x": "バイキングの天気の観測は、"}, {"t": 521.6666666666666, "x": "1982年の11月まで続きました。"}, {"t": 525.3, "x": "実験が終わったあとも報告を送り続けます。"}, {"t": 528.2, "x": "はじめは毎日でした。"}, {"t": 529.7333333333333, "x": "のちには毎週になりました。"}, {"t": 531.6166666666667, "x": "火星の1年は地球の2年ほどです。"}, {"t": 534.1, "x": "着陸機は火星の季節が何度も回る様子を記録しました。"}, {"t": 537.9166666666666, "x": "火星の地面で何年も続けて測った、天気の記録です。"}, {"t": 541.8833333333333, "x": "着陸機の横には長い腕がついていました。"}, {"t": 544.7166666666667, "x": "先には小さなさじがついています。"}, {"t": 547.0166666666667, "x": "この腕で地面を掘って、土をすくいます。"}, {"t": 549.9666666666667, "x": "すくった土は着陸機の上の受け口へ運ばれました。"}, {"t": 553.3666666666667, "x": "受け口にはふるいがついています。"}, {"t": 555.4166666666666, "x": "細かい粒だけが中へ落ちていきます。"}, {"t": 557.8, "x": "粒の大きさは2ミリより小さい物です。"}, {"t": 560.4, "x": "1号が最初に土をすくったのは7月28日です。"}, {"t": 564.1666666666666, "x": "着地から8日目でした。"}, {"t": 565.7666666666667, "x": "腕は地面に細長い溝を掘りました。"}, {"t": 568.2666666666667, "x": "掘った跡はカメラで写して記録しました。"}, {"t": 570.7333333333333, "x": "すくった土は2つの道具に分けて入れられました。"}, {"t": 573.7, "x": "一つは生き物を探す実験室です。"}, {"t": 576.1166666666667, "x": "もう一つは土を熱してガスを調べる分析器です。"}, {"t": 579.35, "x": "土に含まれる物も調べました。"}, {"t": 581.5166666666667, "x": "硫黄が多いことが分かりました。"}, {"t": 583.5166666666667, "x": "腕を動かす命令はすべて地球から送ります。"}, {"t": 586.55, "x": "火星は遠く、電波が行って戻るにも時間がかかります。"}, {"t": 590.4166666666666, "x": "1回すくうにも、前もって手順を組んでおく作業でした。"}, {"t": 594.15, "x": "生き物を探す実験室は小さな箱でした。"}, {"t": 597.0666666666667, "x": "中には3つの実験が入っていました。"}, {"t": 599.5833333333334, "x": "3つあったのには、わけがあります。"}, {"t": 602.0333333333333, "x": "火星の生き物の暮らし方を、誰も知らなかったからです。"}, {"t": 605.8166666666667, "x": "一つの考え方だけでは、外れたときに何も分かりません。"}, {"t": 609.7666666666667, "x": "そこで考え方の違う3つを積みました。"}, {"t": 612.5333333333333, "x": "1つ目はガス交換実験です。"}, {"t": 614.65, "x": "土に水や栄養を加えます。"}, {"t": 616.7166666666667, "x": "そして箱の中の空気がどう変わるかを測ります。"}, {"t": 619.7833333333333, "x": "生き物が息をすれば、空気の成分が変わるはずです。"}, {"t": 623.5, "x": "2つ目は標識放出実験です。"}, {"t": 625.8333333333334, "x": "印をつけた栄養を土に垂らします。"}, {"t": 628.3166666666667, "x": "生き物が食べて吐き出すガスを数えます。"}, {"t": 630.85, "x": "3つ目は熱分解放出実験です。"}, {"t": 633.3833333333333, "x": "土に光を当てます。"}, {"t": 634.9166666666666, "x": "空気の中の炭素を、土の中のものが取りこむかを調べます。"}, {"t": 639.0, "x": "植物のように光で育つ生き物を考えた実験です。"}, {"t": 642.6333333333333, "x": "反応が出たときに比べる実験も用意されていました。"}, {"t": 645.9333333333333, "x": "同じ土を熱で焼いてから、同じことをするのです。"}, {"t": 649.45, "x": "生き物なら、焼けば死んで反応が消えるはずです。"}, {"t": 652.75, "x": "ただの化学反応なら、焼いても残るかもしれません。"}, {"t": 656.2666666666667, "x": "この比べ方が、のちに大きな意味を持ちます。"}, {"t": 659.4833333333333, "x": "2機には同じ実験室が一つずつ積まれていました。"}, {"t": 662.65, "x": "反応がはっきり出たのは、標識放出実験です。"}, {"t": 666.2, "x": "使う栄養は小さなガラスの入れ t": 1358.1666666666667, "x": "12月の終わりまで、返事はありませんでした。"}, {"t": 1361.3833333333334, "x": "1983年の2月には、計算機を"}, {"t": 1364.7833333333333, "x": "立ち上げ直す命令も試しました。"}, {"t": 1366.9666666666667, "x": "その後も数か月、連絡を取り戻す試みが続きました。"}, {"t": 1371.1666666666667, "x": "着陸機が自分で送信を始めるのを待つ計画も立てました。"}, {"t": 1375.0833333333333, "x": "そして1983年の4月に、区切りの発表が出ます。"}, {"t": 1379.55, "x": "連絡はおそらくとれないだろう。"}, {"t": 1381.5, "x": "1号の着陸機が火星で働いた日数は、2307日でした。"}, {"t": 1386.4333333333334, "x": "火星での一番長い記録です。"}, {"t": 1388.5833333333333, "x": "2010年に探査車オポチュニティが"}, {"t": 1390.8, "x": "越えるまで、破られませんでした。"}, {"t": 1393.1, "x": "着陸機には別の名前もついています。"}, {"t": 1395.6666666666667, "x": "1982年の1月、記念の基地として名づけられました。"}, {"t": 1400.1833333333334, "x": "撮影チームの長だった、トーマス・マッチ氏の名前です。"}, {"t": 1403.9333333333334, "x": "マッチ氏は、のちにNASAで"}, {"t": 1405.7333333333333, "x": "宇宙科学の部門を率いた人です。"}, {"t": 1407.9666666666667, "x": "その後の1980年に、ヒマラヤの山で"}, {"t": 1411.3166666666666, "x": "行方が分からなくなっていました。"}, {"t": 1413.15, "x": "2号の着陸機も、のちに別の名前で呼ばれています。"}, {"t": 1416.95, "x": "計画の中心の科学者だった、"}, {"t": 1418.9666666666667, "x": "ジェラルド・ソフェン氏の名前です。"}, {"t": 1421.15, "x": "バイキングの答えは、そのまま長く置かれました。"}, {"t": 1424.4, "x": "動きがあったのは30年あまりのちです。"}, {"t": 1426.9666666666667, "x": "2008年、別の着陸機が火星の北の土を調べました。"}, {"t": 1431.3333333333333, "x": "フェニックスです。"}, {"t": 1432.3833333333334, "x": "土を水に溶かして、中に何があるかを測りました。"}, {"t": 1436.1166666666666, "x": "そこで過塩素酸塩という物が見つかりました。"}, {"t": 1439.0166666666667, "x": "塩素と酸素が結びついた物です。"}, {"t": 1441.25, "x": "調べた3つの土の、どれにも入っていました。"}, {"t": 1444.5, "x": "量は、土の重さの1パーセントに満たないほどです。"}, {"t": 1448.0333333333333, "x": "この発表は、2008年の8月のことでした。"}, {"t": 1451.5166666666667, "x": "熱すると、強くほかの物を変える性質を持ちます。"}, {"t": 1455.1833333333334, "x": "まわりの有機物を壊してしまうのです。"}, {"t": 1457.7, "x": "これを聞いて、バイキングを"}, {"t": 1459.6, "x": "思い出した研究者たちがいました。"}, {"t": 1461.65, "x": "分析器は土を熱して調べました。"}, {"t": 1464.0333333333333, "x": "土に過塩素酸塩が入っていたらどうでしょう。"}, {"t": 1466.8333333333333, "x": "熱したときに、有機物が壊れてしまいます。"}, {"t": 1469.9666666666667, "x": "壊れたあとに何が残るのでしょう。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
