<script>
const D={"name": "ep025", "file": "ep025", "dur": 1948.7333125, "segs": [], "subs": [{"t": 0.0, "x": "地表から約三万二千キロメートル。"}, {"t": 2.3666666666666667, "x": "地球の上空を回る静止衛星よりも"}, {"t": 4.916666666666667, "x": "内側を、一つの小惑星が通ります。"}, {"t": 7.766666666666667, "x": "名前はアポフィス。"}, {"t": 8.983333333333333, "x": "少なくとも百年は地球にぶつからないと、"}, {"t": 11.633333333333333, "x": "観測で確かめられています。"}, {"t": 13.766666666666667, "x": "けれども見つかった直後は、衝突の確率が"}, {"t": 16.883333333333333, "x": "一時、二・七パーセントまで上がりました。"}, {"t": 19.933333333333334, "x": "通るのは二〇二九年四月十三日です。"}, {"t": 23.033333333333335, "x": "大きさは三百数十メートルほどです。"}, {"t": 25.55, "x": "ヨーロッパ宇宙機関によると、暗く晴れた"}, {"t": 28.316666666666666, "x": "空なら、望遠鏡を使わずに肉眼で見えます。"}, {"t": 31.716666666666665, "x": "見える場所は、ヨーロッパと"}, {"t": 33.516666666666666, "x": "アフリカの広い範囲と、アジアの一部です。"}, {"t": 36.53333333333333, "x": "その範囲に住む人は約二十億人とされています。"}, {"t": 39.75, "x": "見えるのは短いあいだだけです。"}, {"t": 41.78333333333333, "x": "ぶつからないと確かめられたのは、"}, {"t": 43.61666666666667, "x": "二〇二一年の観測でした。"}, {"t": 46.1, "x": "そこへたどり着くまでに、十七年かかっています。"}, {"t": 49.46666666666667, "x": "見つかったころは、知られている中で"}, {"t": 51.75, "x": "最も危ない小惑星の一つとされていたのです。"}, {"t": 54.78333333333333, "x": "そしてこの小惑星にはもう一つ変わったところがあります。"}, {"t": 58.2, "x": "形が分かる写真は一枚もありません。"}, {"t": 60.8, "x": "表面のようすも写っていません。"}, {"t": 62.833333333333336, "x": "望遠鏡に写るのは光の点だけです。"}, {"t": 65.48333333333333, "x": "形を知る手がかりは電波を当てて返ってきたこだまでした。"}, {"t": 69.0, "x": "光の点として見つかりました。"}, {"t": 70.96666666666667, "x": "電波で輪郭を描かれました。"}, {"t": 72.96666666666667, "x": "数字の積み重ねでぶつからないと確かめられました。"}, {"t": 76.1, "x": "その順番を、見つかった夜からたどります。"}, {"t": 79.1, "x": "話の中に出てくる数字はその時々の計算です。"}, {"t": 82.48333333333333, "x": "あとで書き換えられた数字もそのまま並べます。"}, {"t": 85.26666666666667, "x": "書き換えられていく順番こそが、"}, {"t": 87.15, "x": "この小惑星の記録だからです。"}, {"t": 89.55, "x": "二〇〇四年六月十九日。"}, {"t": 91.56666666666666, "x": "アメリカのアリゾナ州にある、キットピーク国立天文台。"}, {"t": 95.46666666666667, "x": "そこで三人の天文学者が新しい小惑星を見つけました。"}, {"t": 99.41666666666667, "x": "ロイ・タッカー、デビッド・ソーレン、"}, {"t": 101.45, "x": "ファブリツィオ・ベルナルディです。"}, {"t": 103.9, "x": "三人はハワイ大学の小惑星探しの調査に加わっていました。"}, {"t": 108.1, "x": "地球の近くを通る小惑星は、動く点として見つかります。"}, {"t": 112.3, "x": "夜空の中で、少しずつ位置を変える点です。"}, {"t": 115.51666666666667, "x": "同じ場所を、時間をおいて何度か撮ります。"}, {"t": 118.51666666666667, "x": "星はほとんど動きません。"}, {"t": 120.25, "x": "動いている点があれば、それが小惑星の候補です。"}, {"t": 123.85, "x": "見つけるだけなら、何晩かの観測で足ります。"}, {"t": 127.11666666666666, "x": "ところがその先が難しいのです。"}, {"t": 129.35, "x": "このときこの小惑星が観測されたのは二晩だけでした。"}, {"t": 132.95, "x": "二晩ぶんの位置だけでは道筋はほとんど決まりません。"}, {"t": 136.23333333333332, "x": "小惑星は空の上で少しずつ位置を変えます。"}, {"t": 139.35, "x": "その動きを長く追います。"}, {"t": 141.15, "x": "追うほど、太陽のまわりの回り方が分かります。"}, {"t": 144.5, "x": "追えた期間が短ければ、道筋の候補はいくつも残ります。"}, {"t": 148.66666666666666, "x": "この小惑星もそうでした。"}, {"t": 150.46666666666667, "x": "二晩の観測のあと、この点は"}, {"t": 152.91666666666666, "x": "いったん見失われた形になりました。"}, {"t": 155.2, "x": "次にこの小惑星がとらえられたのは半年後でした。"}, {"t": 158.5, "x": "二〇〇四年十二月十八日。"}, {"t": 160.73333333333332, "x": "場所は南半球です。"}, {"t": 162.36666666666667, "x": "オーストラリアのサイディング・スプリングでの調査です。"}, {"t": 165.26666666666668, "x": "観測者は、ゴードン・ギャラッド。"}, {"t": 167.5, "x": "彼が、この小惑星をとらえ直しました。"}, {"t": 170.56666666666666, "x": "六月の点と十二月の点は同じ天体でした。"}, {"t": 173.73333333333332, "x": "それを確かめたのは小惑星センターです。"}, {"t": 176.43333333333334, "x": "世界中の小惑星の観測を集めて、つなぎ合わせる窓口です。"}, {"t": 181.18333333333334, "x": "二つの点がつながったことで、"}, {"t": 182.95, "x": "軌道の計算が一気に進みました。"}, {"t": 185.53333333333333, "x": "付けられた仮の名前は二〇〇四エムエヌ四。"}, {"t": 188.38333333333333, "x": "見つかった年と、その年の中での順番を表す記号です。"}, {"t": 192.51666666666668, "x": "計算された軌道は地球の軌道の近くを横切る道筋でした。"}, {"t": 196.51666666666668, "x": "太陽を一周するのにかかる時間は約三百二十三日。"}, {"t": 200.36666666666667, "x": "地球の一年より、少し短い周期です。"}, {"t": 203.55, "x": "大きさは明るさから見積もられました。"}, {"t": 205.86666666666667, "x": "当時の見積もりで約四百メートルです。"}, {"t": 208.43333333333334, "x": "遠くの小惑星の大きさは形を見て測るのではありません。"}, {"t": 212.21666666666667, "x": "どれだけ光を返しているかで推し量ります。"}, {"t": 214.98333333333332, "x": "同じ明るさでも黒っぽい岩なら大きくなります。"}, {"t": 218.06666666666666, "x": "白っぽい岩なら小さくなります。"}, {"t": 220.23333333333332, "x": "表面の色が分からなければ、大きさにも幅が残ります。"}, {"t": 224.16666666666666, "x": "このころ分かっていたのは点の"}, {"t": 225.81666666666666, "x": "位置と、点の明るさだけでした。"}, {"t": 228.08333333333334, "x": "形も分かりません。"}, {"t": 229.46666666666667, "x": "色も分かりません。"}, {"t": 230.7, "x": "回っているのかどうかも分かりません。"}, {"t": 232.85, "x": "分かっているのは空のどこに"}, {"t": 234.43333333333334, "x": "いつ見えたかという数字の列です。"}, {"t": 236.45, "x": "地球の近くを通る天体はほかにも"}, {"t": 238.75, "x": "たくさん見つかっています。"}, {"t": 240.16666666666666, "x": "アメリカのジェット推進研究所には"}, {"t": 242.38333333333333, "x": "一つの仕組みがあります。"}, {"t": 243.85, "x": "そうした天体の衝突の可能性を、計算し続ける仕組みです。"}, {"t": 248.21666666666667, "x": "新しい観測が届くたびに、軌道を計算し直します。"}, {"t": 252.2, "x": "そして調べます。"}, {"t": 253.43333333333334, "x": "これから百年ほどのあいだに、"}, {"t": 255.2, "x": "地球とぶつかる道筋は残っていないか。"}, {"t": 258.1, "x": "二〇〇四エムエヌ四も、その計算にかけられました。"}, {"t": 261.75, "x": "十二月の観測を加えた計算です。"}, {"t": 264.31666666666666, "x": "結果はほかの天体とは違うものでした。"}, {"t": 266.8666666666667, "x": "計算の中に、地球とぶつかる道筋が残っていたのです。"}, {"t": 270.8333333333333, "x": "しかもその日付ははっきりしていました。"}, {"t": 273.1666666666667, "x": "この章の数字は、階段のように上がっていきます。"}, {"t": 276.53333333333336, "x": "一段目は約三百分の一。"}, {"t": 278.71666666666664, "x": "二段目は約一・六パーセント。"}, {"t": 280.96666666666664, "x": "三段目は二・七パーセント。"}, {"t": 283.1166666666667, "x": "そして最後は、一度に下まで下ります。"}, {"t": 285.96666666666664, "x": "一段目は、十二月の下旬でした。"}, {"t": 288.68333333333334, "x": "NASAの地球近傍天体の担当部署が、発表をしました。"}, {"t": 292.75, "x": "二〇〇四エムエヌ四が、二〇二九年四月十三日に"}, {"t": 296.9166666666667, "x": "地球へぶつかる可能性がある。"}, {"t": 298.73333333333335, "x": "その確率は約三百分の一。"}, {"t": 301.1, "x": "三百回に一回、という数字です。"}, {"t": 303.85, "x": "小さく聞こえます。"}, {"t": 305.15, "x": "あわせて、トリノスケールという"}, {"t": 307.18333333333334, "x": "物差しで「二」と評価されました。"}, {"t": 310.0, "x": "トリノスケールは、一つの物差しです。"}, {"t": 312.71666666666664, "x": "小惑星や彗星がぶつかる危険を、伝えるためのものです。"}, {"t": 316.81666666666666, "x": "〇から十までの整数で表します。"}, {"t": 319.3, "x": "一九九九年に、国際天文学連合が採り入れました。"}, {"t": 323.95, "x": "〇は、ぶつかる見込みが無いことを表します。"}, {"t": 326.85, "x": "または、無いのと同じくらい低いことです。"}, {"t": 329.76666666666665, "x": "二段目は、十二月二十四日です。"}, {"t": 332.51666666666665, "x": "この日、数字が書き換えられました。"}, {"t": 335.03333333333336, "x": "二〇二九年四月十三日の衝突の確率は約一・六パーセント。"}, {"t": 340.05, "x": "トリノスケールは「四」に上がりました。"}, {"t": 343.15, "x": "一・六パーセントは六十回に一回ほどの割合です。"}, {"t": 346.6666666666667, "x": "発表の言葉ではぶつからない見込みが六十対一。"}, {"t": 350.03333333333336, "x": "まだ、ぶつからない側のほうがずっと大きい数字です。"}, {"t": 353.51666666666665, "x": "それでも数字は、数日のうちに大きく動きました。"}, {"t": 357.1166666666667, "x": "物差しの説明では、四は天文学者が"}, {"t": 360.1, "x": "注目すべき近い接近を意味します。"}, {"t": 362.46666666666664, "x": "計算では一パーセント以上の確率で衝突する。"}, {"t": 365.76666666666665, "x": "その衝突はある地域に大きな被害を"}, {"t": 368.1666666666667, "x": "出しうる、という段階です。"}, {"t": 370.18333333333334, "x": "ヨーロッパ宇宙機関は、こう記しています。"}, {"t": 373.2, "x": "これは、トリノスケールでこれまでで最も高い評価だった。"}, {"t": 377.0, "x": "三段目は、そのあとに来ました。"}, {"t": 379.3666666666667, "x": "ヨーロッパ宇宙機関の記録では、"}, {"t": 381.3333333333333, "x": "最も高いときで二・七パーセントです。"}, {"t": 384.35, "x": "なぜ、観測が増えるほど確率が上がったのでしょうか。"}, {"t": 388.0, "x": "軌道の計算にはいつも幅があります。"}, {"t": 390.45, "x": "二〇二九年のその日、小惑星はどこにいるのか。"}, {"t": 394.3833333333333, "x": "その答えは、点ではありません。"}, {"t": 396.68333333333334, "x": "細長い雲のような広がりになります。"}, {"t": 399.1333333333333, "x": "観測が増えると、その広がりは小さく絞られていきます。"}, {"t": 403.1166666666667, "x": "広がりの中に、地球が残っていたとします。"}, {"t": 406.26666666666665, "x": "すると、地球が占める割合は大きくなります。"}, {"t": 409.56666666666666, "x": "その結果、確率の数字は上がって見えます。"}, {"t": 412.78333333333336, "x": "広がりが絞られて、地球から"}, {"t": 415.03333333333336, "x": "外れれば、確率は一気に下がります。"}, {"t": 417.81666666666666, "x": "どちらになるかはさらに長い期間の観測で決まります。"}, {"t": 421.1166666666667, "x": "つまり、確率が上がったのは決まったからではありません。"}, {"t": 424.68333333333334, "x": "まだ絞りきれていない、という意味でした。"}, {"t": 427.4166666666667, "x": "当時の発表には、もう一つの数字がありました。"}, {"t": 430.8, "x": "地球にいちばん近づく距離です。"}, {"t": 432.8833333333333, "x": "約七十八万キロメートル。"}, {"t": 434.9, "x": "地球と月の距離の、約二倍です。"}, {"t": 437.6, "x": "ただしその数字はとても不確かだ、と"}, {"t": 440.1, "x": "書き添えられていました。"}, {"t": 441.43333333333334, "x": "答えは新しい観測ではなく、"}, {"t": 443.48333333333335, "x": "古い記録の中から出てきました。"}, {"t": 445.9166666666667, "x": "場所は、アメリカのアリゾナ州。"}, {"t": 448.18333333333334, "x": "ツーソンの近くにある、スペースウォッチという"}, {"t": 451.0, "x": "観測所です。"}, {"t": 451.95, "x": "ジェフ・ラーセンとアン・デスクール。"}, {"t": 453.65, "x": "二人が、過去の画像を調べ直しました。"}, {"t": 456.6, "x": "そしてとても暗い姿の二〇〇四エムエヌ四を見つけました。"}, {"t": 460.3833333333333, "x": "写っていたのは二〇〇四年三月十五日の画像です。"}, {"t": 463.73333333333335, "x": "見つかった六月十九日より、三か月前の記録でした。"}, {"t": 467.75, "x": "三月の時点ではまだ誰も気づいていませんでした。"}, {"t": 470.85, "x": "画像の中に、暗い点として写っていただけです。"}, {"t": 474.18333333333334, "x": "見つける前から、記録は残っていたことになります。"}, {"t": 477.6166666666667, "x": "この三か月ぶん、観測の期間が延びました。"}, {"t": 480.8833333333333, "x": "軌道の計算はそれだけ確かになりました。"}, {"t": 483.56666666666666, "x": "十二月二十七日、ジェット推進研究所の"}, {"t": 487.01666666666665, "x": "研究者たちが発表しました。"}, {"t": 488.93333333333334, "x": "二〇二九年四月十三日の地球への衝突はもう無いと言える。"}, {"t": 493.31666666666666, "x": "その年に、地球にも月にもぶつかる道筋は残っていない。"}, {"t": 497.3833333333333, "x": "発表はさらにこう続けています。"}, {"t": 499.51666666666665, "x": "今世紀のこの先の接近にも心配の要るものは無い。"}, {"t": 502.9166666666667, "x": "十二月十八日にとらえ直されてから、"}, {"t": 505.5, "x": "十日たたないうちの出来事でした。"}, {"t": 507.8833333333333, "x": "三段上がった階段を、一度に下まで下ろしたもの。"}, {"t": 511.55, "x": "それは新しい観測ではなく、古い画像でした。"}, {"t": 515.0833333333334, "x": "数字が上がったのも、下がったのも、理由は同じです。"}, {"t": 518.9166666666666, "x": "観測の期間の長さでした。"}, {"t": 520.8, "x": "二〇二九年にぶつからないことは分かりました。"}, {"t": 523.8833333333333, "x": "けれどもどこまで近づくのかは"}, {"t": 525.6333333333333, "x": "まだ定まっていませんでした。"}, {"t": 527.2833333333333, "x": "二〇〇五年二月三日、ジェット推進研究所が"}, {"t": 530.7, "x": "新しい発表をしました。"}, {"t": 532.3166666666667, "x": "内容は、レーダーの観測についてでした。"}, {"t": 535.2666666666667, "x": "二〇〇四エムエヌ四の動きが、さらに絞られたのです。"}, {"t": 539.0666666666667, "x": "二〇二九年の衝突は引き続き無い。"}, {"t": 541.8333333333334, "x": "ただし近づく距離の見積もりは大きく変わりました。"}, {"t": 544.8666666666667, "x": "地球の中心から、約三万六千三百五十キロメートル。"}, {"t": 549.1166666666667, "x": "地球の半径の、約五・七倍です。"}, {"t": 552.1166666666667, "x": "十二月には約七十八万キロメートルとされていました。"}, {"t": 555.75, "x": "その約二十分の一です。"}, {"t": 557.6, "x": "ぶつかりはしない。"}, {"t": 558.7333333333333, "x": "けれども思っていたよりずっと近くを通る。"}, {"t": 561.2833333333333, "x": "レーダーの観測でそれが分かりました。"}, {"t": 563.6, "x": "地球の半径の五・七倍。"}, {"t": 565.6666666666666, "x": "地表からなら、およそ三万キロメートルです。"}, {"t": 568.7666666666667, "x": "静止衛星の高さよりも内側にあたります。"}, {"t": 571.7166666666667, "x": "二〇〇五年の時点でその近さはもう見えていました。"}, {"t": 574.8666666666667, "x": "十二月の発表では、月の二倍ほど遠くとされていました。"}, {"t": 578.9166666666666, "x": "二か月後には、月よりずっと内側になりました。"}, {"t": 582.3166666666667, "x": "数字は、近づく方向へ書き換えられました。"}, {"t": 585.45, "x": "この年、この小惑星には番号と名前が付きました。"}, {"t": 589.3833333333333, "x": "番号は九万九千九百四十二。"}, {"t": 592.0666666666667, "x": "名前はアポフィスです。"}, {"t": 593.4666666666667, "x": "番号は軌道がしっかり決まった"}, {"t": 595.2833333333333, "x": "小惑星に、順番に付けられます。"}, {"t": 597.9166666666666, "x": "仮の名前から、番号のある小惑星になったことになります。"}, {"t": 602.05, "x": "軌道が確かになった、というしるしです。"}, {"t": 604.8833333333333, "x": "名前の説明は小惑星センターの記録に残っています。"}, {"t": 608.5, "x": "アポフィスはエジプトの神話に出てくる神です。"}, {"t": 611.2666666666667, "x": "アペプとも呼ばれます。"}, {"t": 612.7, "x": "悪と破壊の神で永遠の闇に住むとされています。"}, {"t": 615.85, "x": "同じ記録にはもう一文が添えられています。"}, {"t": 618.6, "x": "二〇二九年四月十三日、この小惑星は"}, {"t": 622.3, "x": "地球の四万キロメートル以内を通る。"}, {"t": 624.6666666666666, "x": "その接近によって、小惑星の分類が変わる。"}, {"t": 628.1333333333333, "x": "アテン群から、アポロ群へ移る、という一文です。"}, {"t": 632.0333333333333, "x": "アテン群は軌道の大きさが地球より"}, {"t": 634.2833333333333, "x": "小さい小惑星の仲間です。"}, {"t": 636.25, "x": "アポロ群は地球より大きい仲間です。"}, {"t": 638.7666666666667, "x": "地球のそばを通るだけで、小惑星の軌道そのものが変わる。"}, {"t": 642.8666666666667, "x": "名前が付いた時点でそれは記録に書かれていました。"}, {"t": 646.0166666666667, "x": "軌道は太陽のまわりを回る道筋です。"}, {"t": 648.7333333333333, "x": "その道筋がたった一度の接近で別の形になります。"}, {"t": 652.35, "x": "それほど近くを通る、ということです。"}, {"t": 655.1333333333333, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 656.9166666666666, "x": "最初は可能性が三つありました。"}, {"t": 659.4333333333333, "x": "二〇二九年と、二〇三六年と、二〇六八年です。"}, {"t": 664.65, "x": "二〇二九年は三月の古い画像で消えました。"}, {"t": 667.95, "x": "二〇三六年もその後の観測で消えました。"}, {"t": 671.0666666666667, "x": "最後まで残ったのは二〇六八年でした。"}, {"t": 674.0666666666667, "x": "ここで大きさの数字についても触れておきます。"}, {"t": 676.95, "x": "アポフィスの大きさは資料によって違います。"}, {"t": 679.65, "x": "二〇〇四年の見積もりは約四百メートルでした。"}, {"t": 682.6333333333333, "x": "NASAのジェット推進研究所は"}, {"t": 684.4833333333333, "x": "二〇二一年に発表しています。"}, {"t": 686.7833333333333, "x": "その数字は、約三百四十メートルです。"}, {"t": 689.9833333333333, "x": "ヨーロッパ宇宙機関は平均で"}, {"t": 691.8833333333333, "x": "約三百七十五メートルとしています。"}, {"t": 694.35, "x": "どの数字も写真で形を見て測ったものではありません。"}, {"t": 697.75, "x": "この回ではそれぞれの出どころと一緒に数字を言います。"}, {"t": 701.15, "x": "ヨーロッパ宇宙機関は、その大きさを"}, {"t": 703.8333333333334, "x": "大型の客船ほどと例えています。"}, {"t": 706.0, "x": "客船ほどの岩のかたまりが、静止衛星より内側を通ります。"}, {"t": 710.4166666666666, "x": "では写真が無いのに、形はどこまで"}, {"t": 712.9666666666667, "x": "分かっているのでしょうか。"}, {"t": 714.35, "x": "その答えは地上の大きなアンテナから"}, {"t": 716.5666666666667, "x": "送られた電波にありました。"}, {"t": 718.2, "x": "二〇一二年十二月二十一日から、"}, {"t": 720.7666666666667, "x": "二〇一三年三月十六日まで。"}, {"t": 723.5666666666667, "x": "アポフィスが、地球に近づいたのです。"}, {"t": 726.2166666666667, "x": "その機会に、レーダーの観測が行われました。"}, {"t": 729.5666666666667, "x": "使われたのは二つのアンテナです。"}, {"t": 731.65, "x": "一つはカリフォルニア州にあるNASAのゴールドストーン。"}, {"t": 734.6833333333333, "x": "もう一つはプエルトリコのアレシボ天文台です。"}, {"t": 737.6333333333333, "x": "ゴールドストーンで十四日、"}, {"t": 739.2666666666667, "x": "アレシボで五日、観測しました。"}, {"t": 742.1666666666666, "x": "いちばん近づいたのは二〇一三年一月九日です。"}, {"t": 745.7, "x": "距離は太陽と地球の距離の約〇・〇九七倍。"}, {"t": 749.15, "x": "およそ千四百五十万キロメートルです。"}, {"t": 751.8, "x": "レーダーの観測はカメラで撮るのとは仕組みが違います。"}, {"t": 755.1333333333333, "x": "アンテナから電波を送ります。"}, {"t": 756.9833333333333, "x": "電波は小惑星に当たって、跳ね返ってきます。"}, {"t": 760.35, "x": "返ってきたこだまの、届くまでの時間を測ります。"}, {"t": 763.8, "x": "近い部分からの電波は早く、"}, {"t": 765.75, "x": "遠い部分からの電波は遅く戻ります。"}, {"t": 768.5833333333334, "x": "もう一つこだまの周波数のずれも測ります。"}, {"t": 771.35, "x": "小惑星は回っています。"}, {"t": 773.1333333333333, "x": "こちらへ近づく側の面からの電波は"}, {"t": 775.4166666666666, "x": "周波数が少し高くなります。"}, {"t": 777.35, "x": "遠ざかる側の面からの電波は少し低くなります。"}, {"t": 780.5666666666667, "x": "この時間と周波数のずれを並べると、"}, {"t": 783.0, "x": "一枚の画像になります。"}, {"t": 785.0333333333333, "x": "ただしそれは目で見た姿ではありません。"}, {"t": 787.4333333333333, "x": "距離と速さで並べ直した、こだまの地図です。"}, {"t": 790.6666666666666, "x": "写真なら、光の当たり方で影ができます。"}, {"t": 793.7833333333333, "x": "こだまの地図では横と縦の意味が違います。"}, {"t": 796.55, "x": "一方の向きはアンテナからの距離です。"}, {"t": 798.85, "x": "もう一方の向きは回る速さです。"}, {"t": 801.05, "x": "形を知るには何日分ものこだまの地図を集めます。"}, {"t": 804.4666666666667, "x": "それを計算機に入れて、全部のこだまに合う形を探します。"}, {"t": 808.6666666666666, "x": "そうして組み立てた形は模型として公開されています。"}, {"t": 812.0, "x": "最も細かい画像では一つの点が"}, {"t": 814.25, "x": "約二十メートルにあたりました。"}, {"t": 816.1833333333333, "x": "論文によると、アポフィスは細長い形です。"}, {"t": 819.5666666666667, "x": "左右も、そろっていません。"}, {"t": 821.6333333333333, "x": "二つのかたまりがくっついた形かも"}, {"t": 823.75, "x": "しれない、とも書かれています。"}, {"t": 825.8166666666667, "x": "ただしそれは「かもしれない」という書き方です。"}, {"t": 829.25, "x": "いちばん長い向きの長さは少なくとも四百五十メートル。"}, {"t": 832.8666666666667, "x": "これは短く見積もった値です。"}, {"t": 835.0166666666667, "x": "実際は、もっと長いかもしれません。"}, {"t": 837.7166666666667, "x": "同じ体積の球に直すと、直径は約三百四十メートルです。"}, {"t": 842.3166666666667, "x": "上下に四十メートルの幅がつきます。"}, {"t": 844.75, "x": "表面がどれだけ光を返すかも見積もられました。"}, {"t": 847.85, "x": "返す割合は約〇・三五。"}, {"t": 850.1, "x": "暗い炭のような岩ではなく、比較的明るい岩の仲間です。"}, {"t": 854.3, "x": "NASAはアポフィスを石の多い小惑星としています。"}, {"t": 857.35, "x": "ケイ素を含む岩に、金属のニッケルや"}, {"t": 860.0666666666667, "x": "鉄がまじったものです。"}, {"t": 861.4666666666667, "x": "回り方も変わっていました。"}, {"t": 863.2333333333333, "x": "二〇一四年の研究があります。"}, {"t": 865.4166666666666, "x": "アポフィスは一本の軸で素直に"}, {"t": 867.3833333333333, "x": "回っていない、という結果です。"}, {"t": 869.5666666666667, "x": "こまが首を振るように、向きを変えながら回っています。"}, {"t": 873.1333333333333, "x": "小惑星の多くは決まった軸のまわりを回ります。"}, {"t": 876.3166666666667, "x": "アポフィスはその決まった軸を持っていません。"}, {"t": 878.8833333333333, "x": "明るさの変化から求めた周期は約三十時間半です。"}, {"t": 882.55, "x": "形の分かる写真は無い。"}, {"t": 884.3, "x": "けれども、ここまでは分かってきました。"}, {"t": 886.9166666666666, "x": "手がかりは、こだまの地図と明るさの変化です。"}, {"t": 890.1333333333333, "x": "一方で、二〇一八年に出たレーダーの"}, {"t": 892.9833333333333, "x": "論文には、別の宿題も書かれていました。"}, {"t": 895.93333 "t": 1007.6666666666666, "x": "二〇二九年の接近でぶつからないことは、"}, {"t": 1010.5, "x": "しばらく前から分かっている。"}, {"t": 1012.4666666666667, "x": "問題はその先でした。"}, {"t": 1014.05, "x": "二〇二九年、アポフィスは地球のすぐそばを通ります。"}, {"t": 1018.05, "x": "そのとき、地球の重力で軌道が大きく曲げられます。"}, {"t": 1021.8333333333334, "x": "前の章で触れたとおり、分類が変わるほどの変化です。"}, {"t": 1025.6166666666666, "x": "近づくときの通り道が少し違うとします。"}, {"t": 1028.4333333333334, "x": "すると、曲げられたあとの軌道も変わります。"}, {"t": 1031.4333333333334, "x": "年に百七十メートルのずれがどの道筋につながるのか。"}, {"t": 1035.05, "x": "それを確かめるにはさらに細かい観測が要りました。"}, {"t": 1038.3, "x": "ちょうど、その機会が近づいていました。"}, {"t": 1041.0166666666667, "x": "二〇二一年の三月、アポフィスがまた地球に近づくのです。"}, {"t": 1045.4166666666667, "x": "アポフィスはほぼ八年ごとに地球へ近づいてきました。"}, {"t": 1048.8, "x": "二〇〇四年の十二月。"}, {"t": 1050.45, "x": "二〇一三年の一月。"}, {"t": 1052.25, "x": "そして二〇二一年の三月です。"}, {"t": 1054.7, "x": "どの回も距離は太陽と地球の距離の約十分の一ほどでした。"}, {"t": 1058.6666666666667, "x": "ウェストバージニア州に、グリーンバンク望遠鏡という"}, {"t": 1062.1166666666666, "x": "大きなアンテナがあります。"}, {"t": 1063.5833333333333, "x": "直径は百メートルです。"}, {"t": 1065.2666666666667, "x": "二〇二一年三月の初め、この望遠鏡が、"}, {"t": 1068.8666666666666, "x": "とても弱いこだまを受けました。"}, {"t": 1070.9666666666667, "x": "電波を送ったのは、別の場所です。"}, {"t": 1073.5666666666666, "x": "ゴールドストーンのアンテナで、"}, {"t": 1075.1333333333334, "x": "直径は七十メートルあります。"}, {"t": 1077.4833333333333, "x": "場所はバーストーという町の近くです。"}, {"t": 1079.8333333333333, "x": "こだまの元は、アポフィスでした。"}, {"t": 1082.1666666666667, "x": "地球から約千七百万キロメートルのところを"}, {"t": 1085.0833333333333, "x": "通っていたのです。"}, {"t": 1086.15, "x": "地球と月の距離の、四十倍を超える遠さです。"}, {"t": 1089.6666666666667, "x": "二〇二九年の距離と比べると、五百倍以上遠くです。"}, {"t": 1093.9166666666667, "x": "それでもこの距離ならレーダーが届きます。"}, {"t": 1096.3833333333334, "x": "ただし八年前とは組み合わせが違います。"}, {"t": 1099.0666666666666, "x": "送る側と受ける側を、分けたのです。"}, {"t": 1101.8, "x": "これで、受け取る信号の強さは二倍になりました。"}, {"t": 1105.3166666666666, "x": "アポフィスまでの距離は、約百五十メートルの"}, {"t": 1108.35, "x": "細かさで測られました。"}, {"t": 1109.8166666666666, "x": "千七百万キロメートル先の、百五十メートルです。"}, {"t": 1113.65, "x": "割合にすると、一億分の一ほどの細かさです。"}, {"t": 1117.3666666666666, "x": "こだまの地図も作られました。"}, {"t": 1119.2166666666667, "x": "八年前の観測よりも、遠くからの観測です。"}, {"t": 1122.7833333333333, "x": "一つの点が三十八・七五メートルにあたる細かさです。"}, {"t": 1126.5, "x": "アポフィスの大きさは三百数十メートルです。"}, {"t": 1129.4, "x": "縦に並べると、十個ほどの点で"}, {"t": 1131.8833333333334, "x": "全体が収まる計算になります。"}, {"t": 1133.9666666666667, "x": "粗い画像です。"}, {"t": 1135.1, "x": "それでも千七百万キロメートル先の岩の輪郭です。"}, {"t": 1138.6666666666667, "x": "ジェット推進研究所のマリナ・ブロゾビッチは"}, {"t": 1141.7333333333333, "x": "こう話しています。"}, {"t": 1142.8666666666666, "x": "小惑星は、千七百万キロメートルも離れていた。"}, {"t": 1146.6666666666667, "x": "それを考えると、驚くほどの細かさだ。"}, {"t": 1149.7666666666667, "x": "この観測をもとに、軌道が計算し直されました。"}, {"t": 1153.35, "x": "二〇二一年三月二十五日。"}, {"t": 1155.8833333333334, "x": "ジェット推進研究所が、結果を発表しました。"}, {"t": 1159.3, "x": "アポフィスが地球にぶつかる危険は"}, {"t": 1161.25, "x": "少なくともこの先百年は無い。"}, {"t": 1163.25, "x": "最後まで残っていた二〇六八年の可能性も消えました。"}, {"t": 1167.15, "x": "ダビデ・ファルノッキアも、こう話しています。"}, {"t": 1170.4166666666667, "x": "地球近傍天体研究センターの研究者です。"}, {"t": 1173.6, "x": "二〇六八年の衝突はもはや起こりうる範囲に無い。"}, {"t": 1177.1833333333334, "x": "翌日は、三月二十六日。"}, {"t": 1179.8, "x": "ヨーロッパ宇宙機関も、動きました。"}, {"t": 1182.4833333333333, "x": "アポフィスを、危険のある天体の一覧から外したのです。"}, {"t": 1186.2666666666667, "x": "見つかった日から数えると、十七年近くがたっていました。"}, {"t": 1190.2333333333333, "x": "ここでもう一度確かめておきます。"}, {"t": 1192.3833333333334, "x": "この十七年のあいだに、撮られていないものがあります。"}, {"t": 1195.9166666666667, "x": "アポフィスの姿を写した写真です。"}, {"t": 1198.2333333333333, "x": "望遠鏡は光の点の位置を測り続けました。"}, {"t": 1201.3, "x": "レーダーはこだまの時間と周波数を測り続けました。"}, {"t": 1204.6, "x": "安全だという答えはその二つの"}, {"t": 1206.6, "x": "数字の積み重ねから出たものです。"}, {"t": 1208.7166666666667, "x": "計算は、細かくなりました。"}, {"t": 1211.0166666666667, "x": "すると、二〇二九年の接近の近さもはっきりしてきました。"}, {"t": 1215.35, "x": "地球の上空には地球の自転と"}, {"t": 1217.5, "x": "同じ速さで回る衛星があります。"}, {"t": 1219.6666666666667, "x": "地上から見ると、いつも同じ場所に"}, {"t": 1222.1833333333334, "x": "止まって見える衛星です。"}, {"t": 1223.7333333333333, "x": "静止衛星と呼ばれます。"}, {"t": 1225.4833333333333, "x": "天気の観測や放送に使われています。"}, {"t": 1228.1333333333334, "x": "その高さは地表から約三万六千キロメートル。"}, {"t": 1231.3166666666666, "x": "この高さを、物差しとして覚えておいてください。"}, {"t": 1234.7166666666667, "x": "ジェット推進研究所には、接近の記録があります。"}, {"t": 1238.3166666666666, "x": "そこに、二〇二九年の数字が載っています。"}, {"t": 1241.7166666666667, "x": "最も近づくのは二〇二九年四月十三日。"}, {"t": 1245.2, "x": "世界時で午後九時四十五分ごろです。"}, {"t": 1247.7666666666667, "x": "日本時間では十四日の午前六時四十五分ごろにあたります。"}, {"t": 1251.9, "x": "地球の中心からの距離は約三万八千キロメートル。"}, {"t": 1255.35, "x": "地球の半径を引くと、地表から"}, {"t": 1257.7333333333333, "x": "約三万二千キロメートルです。"}, {"t": 1259.7166666666667, "x": "地球と月の距離は約三十八万キロメートルです。"}, {"t": 1263.0666666666666, "x": "アポフィスが通るのはその十二分の一ほどのところです。"}, {"t": 1266.4333333333334, "x": "地球の直径に直すと、二・五個分ほどです。"}, {"t": 1269.95, "x": "宇宙の大きさで見れば、すれすれの距離です。"}, {"t": 1272.9666666666667, "x": "このときの地球に対する速さは"}, {"t": 1274.9666666666667, "x": "秒速約七・四キロメートルです。"}, {"t": 1277.35, "x": "三万二千と三万六千。"}, {"t": 1279.2333333333333, "x": "さきほどの物差しより、四千キロメートルほど"}, {"t": 1282.4, "x": "低い位置です。"}, {"t": 1283.2833333333333, "x": "アポフィスは静止衛星の高さよりも内側を通り抜けます。"}, {"t": 1286.9666666666667, "x": "NASAによると、東半球の人たちが見られます。"}, {"t": 1290.3333333333333, "x": "望遠鏡も双眼鏡も、要りません。"}, {"t": 1293.1333333333334, "x": "ヨーロッパ宇宙機関の説明も、ほぼ同じです。"}, {"t": 1296.5166666666667, "x": "ヨーロッパやアフリカの広い範囲と、アジアの一部です。"}, {"t": 1300.2666666666667, "x": "見える範囲に住む人は約二十億人です。"}, {"t": 1303.0333333333333, "x": "ジェット推進研究所は二〇一九年に、"}, {"t": 1305.7166666666667, "x": "空での通り道も示しました。"}, {"t": 1308.05, "x": "最初に肉眼で見えるのは、南半球の夜空です。"}, {"t": 1311.8, "x": "オーストラリアの上空を、東の海岸から"}, {"t": 1314.7, "x": "西の海岸へと横切っていきます。"}, {"t": 1316.7833333333333, "x": "そのあとインド洋を渡り、赤道を"}, {"t": 1319.2, "x": "越えるころにはアフリカの上空へ。"}, {"t": 1321.2166666666667, "x": "向きは、ずっと西のままです。"}, {"t": 1323.45, "x": "最も近づく瞬間、アポフィスは大西洋の上にいます。"}, {"t": 1327.5, "x": "その大西洋を、わずか一時間ほどで"}, {"t": 1330.2333333333333, "x": "渡りきるとされています。"}, {"t": 1331.7, "x": "アメリカ合衆国の上空を過ぎるのは、"}, {"t": 1334.1833333333334, "x": "さらにその一時間後です。"}, {"t": 1336.15, "x": "近づくにつれて光の点は明るくなり、動きも速くなります。"}, {"t": 1340.4, "x": "一分以内に、満月の幅より長い距離を"}, {"t": 1343.4166666666667, "x": "空の上で動く場面もあるそうです。"}, {"t": 1345.6166666666666, "x": "いちばん明るいときは、こぐま座の"}, {"t": 1347.95, "x": "星と同じくらいだといいます。"}, {"t": 1349.7166666666667, "x": "ヨーロッパ宇宙機関は、ある数字も出しています。"}, {"t": 1353.05, "x": "これほど大きな天体が、これほど近くを通る。"}, {"t": 1356.35, "x": "それは、五千年から一万年に一度だと見積もられている。"}, {"t": 1360.3166666666666, "x": "比べる相手として、二つの例が挙げられています。"}, {"t": 1363.7166666666667, "x": "皆既日食は地球のどこかで約一年半に一度起きます。"}, {"t": 1367.4333333333334, "x": "ハレー彗星は七十六年ごとに戻ってきます。"}, {"t": 1370.5333333333333, "x": "それと比べてもずっと間の空いた出来事だということです。"}, {"t": 1374.0166666666667, "x": "ヨーロッパ宇宙機関はもう一つの言い方もしています。"}, {"t": 1377.25, "x": "この大きさの小惑星が、ここまで近づく。"}, {"t": 1380.4, "x": "しかも、前もって知られた上で。"}, {"t": 1382.75, "x": "それは、人類が知る限り初めてだ。"}, {"t": 1385.4833333333333, "x": "前もって知られている、ということには意味があります。"}, {"t": 1388.8666666666666, "x": "見えない場所から急に近づくのではありません。"}, {"t": 1391.6333333333334, "x": "日付と時刻と距離が十年以上前から分かっています。"}, {"t": 1395.0, "x": "観測の準備をしておくことができるのです。"}, {"t": 1397.6666666666667, "x": "どの望遠鏡を向けるか。"}, {"t": 1399.3666666666666, "x": "どのアンテナで電波を送るか。"}, {"t": 1401.25, "x": "どの探査機を先に送っておくか。"}, {"t": 1403.4166666666667, "x": "それを、何年も前から決めておけます。"}, {"t": 1406.3, "x": "第6章で話を紹介したブロゾビッチは、"}, {"t": 1409.1, "x": "二〇一九年に観測の段取りも語っています。"}, {"t": 1412.5166666666667, "x": "光の望遠鏡と、電波のレーダーの両方で見る。"}, {"t": 1416.0833333333333, "x": "レーダーなら、数メートルほどの大きさの"}, {"t": 1418.65, "x": "表面のようすまで分かるかもしれない。"}, {"t": 1420.8333333333333, "x": "同じ年、地球近傍天体研究センターの所長"}, {"t": 1424.45, "x": "ポール・チョーダスも話しています。"}, {"t": 1426.2333333333333, "x": "アポフィスは、当時知られていた約二千個の「潜在的に"}, {"t": 1430.3, "x": "危険な小惑星」を代表する一つだ。"}, {"t": 1433.1833333333334, "x": "この接近を観測して得る知識は、いつか地球を"}, {"t": 1436.5333333333333, "x": "守る役に立つかもしれない、という言葉です。"}, {"t": 1439.6, "x": "この呼び名には、決まった線引きがあります。"}, {"t": 1442.4833333333333, "x": "地球の軌道に、約七百五十万キロメートルまで"}, {"t": 1446.05, "x": "近づく道筋を持つこと。"}, {"t": 1447.75, "x": "大きさが、およそ百四十メートル以上あること。"}, {"t": 1451.1166666666666, "x": "その両方を満たす小惑星が、そう呼ばれます。"}, {"t": 1454.4666666666667, "x": "二〇〇四年のクリスマスのころ。"}, {"t": 1456.4166666666667, "x": "この日付は、衝突の候補として発表されました。"}, {"t": 1459.9833333333333, "x": "いま、同じ日付は観測の予定として書かれています。"}, {"t": 1463.7, "x": "日付は同じです。"}, {"t": 1465.0, "x": "変わったのはその日付の意味でした。"}, {"t": 1467.1, "x": "では、地球のすぐそばで何が起きるのでしょうか。"}, {"t": 1470.3833333333334, "x": "ぶつからなくても何も起きないわけではありません。"}, {"t": 1473.15, "x": "二〇二九年の接近には、答えの"}, {"t": 1475.95, "x": "出ていない問いが残っています。"}, {"t": 1477.6666666666667, "x": "一つ目の問いは、岩そのものがどう変わるかです。"}, {"t": 1480.9166666666667, "x": "地球の重力は近いほど強く働きます。"}, {"t": 1483.75, "x": "アポフィスにも、地球に近い側と遠い側があります。"}, {"t": 1487.3, "x": "その二つでは、引かれる強さがわずかに違います。"}, {"t": 1490.75, "x": "その差が、小惑星を引き伸ばしたり、押し縮めたりします。"}, {"t": 1495.1166666666666, "x": "海の満ち引きを起こすのと同じ種類の"}, {"t": 1497.3833333333334, "x": "力で、潮汐力と呼ばれます。"}, {"t": 1499.8166666666666, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 1501.6166666666666, "x": "アポフィスはこの力を受けます。"}, {"t": 1503.9166666666667, "x": "引き伸ばされ、押し縮められるのです。"}, {"t": 1506.5666666666666, "x": "それによって、小惑星の中で揺れが起きるかもしれません。"}, {"t": 1510.5666666666666, "x": "表面で土砂崩れが起きるかもしれません。"}, {"t": 1513.1666666666667, "x": "回り方が変わるかもしれません。"}, {"t": 1515.2, "x": "どれもまだ「かもしれない」です。"}, {"t": 1517.8166666666666, "x": "起きるかどうかも、まだ分かりません。"}, {"t": 1520.2666666666667, "x": "起きたとして、どのくらいの大きさかも分かりません。"}, {"t": 1523.5333333333333, "x": "アポフィスの重さは約二千万トンと見積もられています。"}, {"t": 1526.8666666666666, "x": "これも、見積もりの数字です。"}, {"t": 1529.0833333333333, "x": "重さを直接はかった人はいません。"}, {"t": 1531.35, "x": "その岩のかたまりがどのくらいの力でどう変わるのか。"}, {"t": 1534.6, "x": "それを近くで確かめた例はこれまでありません。"}, {"t": 1537.5166666666667, "x": "二つ目の問いは、問いというより、"}, {"t": 1539.7833333333333, "x": "すでに答えの見えている変化です。"}, {"t": 1542.1833333333334, "x": "太陽のまわりを回る軌道が、確実に変わります。"}, {"t": 1545.8, "x": "ヨーロッパ宇宙機関の数字があります。"}, {"t": 1548.2, "x": "接近の前のアポフィスは、約〇・九年で太陽を一周します。"}, {"t": 1552.7166666666667, "x": "接近のあとは約一・二年で一周するようになります。"}, {"t": 1556.2, "x": "これまでは、地球より速く太陽を回っていました。"}, {"t": 1559.6333333333334, "x": "これからは、地球よりゆっくり回ることになります。"}, {"t": 1563.0, "x": "一周の長さが三割ほど延びることになります。"}, {"t": 1566.0, "x": "第3章で触れた分類の変化はこのことです。"}, {"t": 1568.9833333333333, "x": "軌道が地球より小さい仲間から、大きい仲間へ移ります。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
