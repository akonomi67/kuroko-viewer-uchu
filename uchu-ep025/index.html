<script>
const D={"name": "ep025", "file": "ep025", "dur": 1953.6333125, "segs": [], "subs": [{"t": 0.0, "x": "地表から約三万二千キロメートル。"}, {"t": 2.3666666666666667, "x": "地球の上空を回る静止衛星よりも"}, {"t": 4.916666666666667, "x": "内側を、一つの小惑星が通ります。"}, {"t": 7.766666666666667, "x": "名前はアポフィス。"}, {"t": 8.983333333333333, "x": "少なくとも百年は地球にぶつからないと、"}, {"t": 11.633333333333333, "x": "観測で確かめられています。"}, {"t": 13.766666666666667, "x": "けれども見つかった直後は、衝突の確率が"}, {"t": 16.883333333333333, "x": "一時、二・七パーセントまで上がりました。"}, {"t": 19.933333333333334, "x": "通るのは二〇二九年四月十三日です。"}, {"t": 23.033333333333335, "x": "大きさは三百数十メートルほどです。"}, {"t": 25.55, "x": "ヨーロッパ宇宙機関によると、暗く晴れた"}, {"t": 28.316666666666666, "x": "空なら、望遠鏡を使わずに肉眼で見えます。"}, {"t": 31.716666666666665, "x": "見える場所は、ヨーロッパと"}, {"t": 33.516666666666666, "x": "アフリカの広い範囲と、アジアの一部です。"}, {"t": 36.53333333333333, "x": "その範囲に住む人は約二十億人とされています。"}, {"t": 39.75, "x": "見えるのは短いあいだだけです。"}, {"t": 41.78333333333333, "x": "ぶつからないと確かめられたのは、"}, {"t": 43.61666666666667, "x": "二〇二一年の観測でした。"}, {"t": 46.1, "x": "そこへたどり着くまでに、十七年かかっています。"}, {"t": 49.46666666666667, "x": "見つかったころは、知られている中で"}, {"t": 51.75, "x": "最も危ない小惑星の一つとされていたのです。"}, {"t": 54.78333333333333, "x": "そしてこの小惑星にはもう一つ変わったところがあります。"}, {"t": 58.2, "x": "形が分かる写真は一枚もありません。"}, {"t": 60.8, "x": "表面のようすも写っていません。"}, {"t": 62.833333333333336, "x": "望遠鏡に写るのは光の点だけです。"}, {"t": 65.48333333333333, "x": "形を知る手がかりは電波を当てて返ってきたこだまでした。"}, {"t": 69.0, "x": "光の点として見つかりました。"}, {"t": 70.96666666666667, "x": "電波で輪郭を描かれました。"}, {"t": 72.96666666666667, "x": "数字の積み重ねでぶつからないと確かめられました。"}, {"t": 76.1, "x": "その順番を、見つかった夜からたどります。"}, {"t": 79.1, "x": "話の中に出てくる数字はその時々の計算です。"}, {"t": 82.48333333333333, "x": "あとで書き換えられた数字もそのまま並べます。"}, {"t": 85.26666666666667, "x": "書き換えられていく順番こそが、"}, {"t": 87.15, "x": "この小惑星の記録だからです。"}, {"t": 89.55, "x": "二〇〇四年六月十九日。"}, {"t": 91.56666666666666, "x": "アメリカのアリゾナ州にある、キットピーク国立天文台。"}, {"t": 95.46666666666667, "x": "そこで三人の天文学者が新しい小惑星を見つけました。"}, {"t": 99.41666666666667, "x": "ロイ・タッカー、デビッド・ソーレン、"}, {"t": 101.45, "x": "ファブリツィオ・ベルナルディです。"}, {"t": 103.9, "x": "三人はハワイ大学の小惑星探しの調査に加わっていました。"}, {"t": 108.1, "x": "地球の近くを通る小惑星は、動く点として見つかります。"}, {"t": 112.3, "x": "夜空の中で、少しずつ位置を変える点です。"}, {"t": 115.51666666666667, "x": "同じ場所を、時間をおいて何度か撮ります。"}, {"t": 118.51666666666667, "x": "星はほとんど動きません。"}, {"t": 120.25, "x": "動いている点があれば、それが小惑星の候補です。"}, {"t": 123.85, "x": "見つけるだけなら、何晩かの観測で足ります。"}, {"t": 127.11666666666666, "x": "ところがその先が難しいのです。"}, {"t": 129.35, "x": "このときこの小惑星が観測されたのは二晩だけでした。"}, {"t": 132.95, "x": "二晩ぶんの位置だけでは道筋はほとんど決まりません。"}, {"t": 136.23333333333332, "x": "小惑星は空の上で少しずつ位置を変えます。"}, {"t": 139.35, "x": "その動きを長く追います。"}, {"t": 141.15, "x": "追うほど、太陽のまわりの回り方が分かります。"}, {"t": 144.5, "x": "追えた期間が短ければ、道筋の候補はいくつも残ります。"}, {"t": 148.66666666666666, "x": "この小惑星もそうでした。"}, {"t": 150.46666666666667, "x": "二晩の観測のあと、この点は"}, {"t": 152.91666666666666, "x": "いったん見失われた形になりました。"}, {"t": 155.2, "x": "次にこの小惑星がとらえられたのは半年後でした。"}, {"t": 158.5, "x": "二〇〇四年十二月十八日。"}, {"t": 160.73333333333332, "x": "場所は南半球です。"}, {"t": 162.36666666666667, "x": "オーストラリアのサイディング・スプリングでの調査です。"}, {"t": 165.26666666666668, "x": "観測者は、ゴードン・ギャラッド。"}, {"t": 167.5, "x": "彼が、この小惑星をとらえ直しました。"}, {"t": 170.56666666666666, "x": "六月の点と十二月の点は同じ天体でした。"}, {"t": 173.73333333333332, "x": "それを確かめたのは小惑星センターです。"}, {"t": 176.43333333333334, "x": "世界中の小惑星の観測を集めて、つなぎ合わせる窓口です。"}, {"t": 181.18333333333334, "x": "二つの点がつながったことで、"}, {"t": 182.95, "x": "軌道の計算が一気に進みました。"}, {"t": 185.53333333333333, "x": "付けられた仮の名前は2004 MN4。"}, {"t": 188.76666666666668, "x": "見つかった年と、その年の中での順番を表す記号です。"}, {"t": 192.9, "x": "計算された軌道は地球の軌道の近くを横切る道筋でした。"}, {"t": 196.9, "x": "太陽を一周するのにかかる時間は約三百二十三日。"}, {"t": 200.75, "x": "地球の一年より、少し短い周期です。"}, {"t": 203.93333333333334, "x": "大きさは明るさから見積もられました。"}, {"t": 206.25, "x": "当時の見積もりで約四百メートルです。"}, {"t": 208.81666666666666, "x": "遠くの小惑星の大きさは形を見て測るのではありません。"}, {"t": 212.6, "x": "どれだけ光を返しているかで推し量ります。"}, {"t": 215.36666666666667, "x": "同じ明るさでも黒っぽい岩なら大きくなります。"}, {"t": 218.45, "x": "白っぽい岩なら小さくなります。"}, {"t": 220.61666666666667, "x": "表面の色が分からなければ、大きさにも幅が残ります。"}, {"t": 224.55, "x": "このころ分かっていたのは点の"}, {"t": 226.2, "x": "位置と、点の明るさだけでした。"}, {"t": 228.46666666666667, "x": "形も分かりません。"}, {"t": 229.85, "x": "色も分かりません。"}, {"t": 231.08333333333334, "x": "回っているのかどうかも分かりません。"}, {"t": 233.23333333333332, "x": "分かっているのは空のどこに"}, {"t": 234.81666666666666, "x": "いつ見えたかという数字の列です。"}, {"t": 236.83333333333334, "x": "地球の近くを通る天体はほかにも"}, {"t": 239.13333333333333, "x": "たくさん見つかっています。"}, {"t": 240.55, "x": "アメリカのジェット推進研究所には"}, {"t": 242.76666666666668, "x": "一つの仕組みがあります。"}, {"t": 244.23333333333332, "x": "そうした天体の衝突の可能性を、計算し続ける仕組みです。"}, {"t": 248.6, "x": "新しい観測が届くたびに、軌道を計算し直します。"}, {"t": 252.58333333333334, "x": "そして調べます。"}, {"t": 253.81666666666666, "x": "これから百年ほどのあいだに、"}, {"t": 255.58333333333334, "x": "地球とぶつかる道筋は残っていないか。"}, {"t": 258.48333333333335, "x": "2004 MN4も、その計算にかけられました。"}, {"t": 262.53333333333336, "x": "十二月の観測を加えた計算です。"}, {"t": 265.1, "x": "結果はほかの天体とは違うものでした。"}, {"t": 267.65, "x": "計算の中に、地球とぶつかる道筋が残っていたのです。"}, {"t": 271.6166666666667, "x": "しかもその日付ははっきりしていました。"}, {"t": 273.95, "x": "この章の数字は、階段のように上がっていきます。"}, {"t": 277.31666666666666, "x": "一段目は約三百分の一。"}, {"t": 279.5, "x": "二段目は約一・六パーセント。"}, {"t": 281.75, "x": "三段目は二・七パーセント。"}, {"t": 283.9, "x": "そして最後は、一度に下まで下ります。"}, {"t": 286.75, "x": "一段目は、十二月の下旬でした。"}, {"t": 289.46666666666664, "x": "NASAの地球近傍天体の担当部署が、発表をしました。"}, {"t": 293.53333333333336, "x": "2004 MN4が、二〇二九年四月十三日に"}, {"t": 298.1, "x": "地球へぶつかる可能性がある。"}, {"t": 299.9166666666667, "x": "その確率は約三百分の一。"}, {"t": 302.28333333333336, "x": "三百回に一回、という数字です。"}, {"t": 305.03333333333336, "x": "小さく聞こえます。"}, {"t": 306.3333333333333, "x": "あわせて、トリノスケールという"}, {"t": 308.3666666666667, "x": "物差しで「二」と評価されました。"}, {"t": 311.18333333333334, "x": "トリノスケールは、一つの物差しです。"}, {"t": 313.9, "x": "小惑星や彗星がぶつかる危険を、伝えるためのものです。"}, {"t": 318.0, "x": "〇から十までの整数で表します。"}, {"t": 320.48333333333335, "x": "一九九九年に、国際天文学連合が採り入れました。"}, {"t": 325.1333333333333, "x": "〇は、ぶつかる見込みが無いことを表します。"}, {"t": 328.03333333333336, "x": "または、無いのと同じくらい低いことです。"}, {"t": 330.95, "x": "二段目は、十二月二十四日です。"}, {"t": 333.7, "x": "この日、数字が書き換えられました。"}, {"t": 336.21666666666664, "x": "二〇二九年四月十三日の衝突の確率は約一・六パーセント。"}, {"t": 341.23333333333335, "x": "トリノスケールは「四」に上がりました。"}, {"t": 344.3333333333333, "x": "一・六パーセントは六十回に一回ほどの割合です。"}, {"t": 347.85, "x": "発表の言葉ではぶつからない見込みが六十対一。"}, {"t": 351.21666666666664, "x": "まだ、ぶつからない側のほうがずっと大きい数字です。"}, {"t": 354.7, "x": "それでも数字は、数日のうちに大きく動きました。"}, {"t": 358.3, "x": "物差しの説明では、四は天文学者が"}, {"t": 361.28333333333336, "x": "注目すべき近い接近を意味します。"}, {"t": 363.65, "x": "計算では一パーセント以上の確率で衝突する。"}, {"t": 366.95, "x": "その衝突はある地域に大きな被害を"}, {"t": 369.35, "x": "出しうる、という段階です。"}, {"t": 371.3666666666667, "x": "ヨーロッパ宇宙機関は、こう記しています。"}, {"t": 374.3833333333333, "x": "これは、トリノスケールでこれまでで最も高い評価だった。"}, {"t": 378.18333333333334, "x": "三段目は、そのあとに来ました。"}, {"t": 380.55, "x": "ヨーロッパ宇宙機関の記録では、"}, {"t": 382.51666666666665, "x": "最も高いときで二・七パーセントです。"}, {"t": 385.53333333333336, "x": "なぜ、観測が増えるほど確率が上がったのでしょうか。"}, {"t": 389.18333333333334, "x": "軌道の計算にはいつも幅があります。"}, {"t": 391.6333333333333, "x": "二〇二九年のその日、小惑星はどこにいるのか。"}, {"t": 395.56666666666666, "x": "その答えは、点ではありません。"}, {"t": 397.8666666666667, "x": "細長い雲のような広がりになります。"}, {"t": 400.31666666666666, "x": "観測が増えると、その広がりは小さく絞られていきます。"}, {"t": 404.3, "x": "広がりの中に、地球が残っていたとします。"}, {"t": 407.45, "x": "すると、地球が占める割合は大きくなります。"}, {"t": 410.75, "x": "その結果、確率の数字は上がって見えます。"}, {"t": 413.96666666666664, "x": "広がりが絞られて、地球から"}, {"t": 416.21666666666664, "x": "外れれば、確率は一気に下がります。"}, {"t": 419.0, "x": "どちらになるかはさらに長い期間の観測で決まります。"}, {"t": 422.3, "x": "つまり、確率が上がったのは決まったからではありません。"}, {"t": 425.8666666666667, "x": "まだ絞りきれていない、という意味でした。"}, {"t": 428.6, "x": "当時の発表には、もう一つの数字がありました。"}, {"t": 431.98333333333335, "x": "地球にいちばん近づく距離です。"}, {"t": 434.06666666666666, "x": "約七十八万キロメートル。"}, {"t": 436.0833333333333, "x": "地球と月の距離の、約二倍です。"}, {"t": 438.78333333333336, "x": "ただしその数字はとても不確かだ、と"}, {"t": 441.28333333333336, "x": "書き添えられていました。"}, {"t": 442.6166666666667, "x": "答えは新しい観測ではなく、"}, {"t": 444.6666666666667, "x": "古い記録の中から出てきました。"}, {"t": 447.1, "x": "場所は、アメリカのアリゾナ州。"}, {"t": 449.3666666666667, "x": "ツーソンの近くにある、スペースウォッチという"}, {"t": 452.18333333333334, "x": "観測所です。"}, {"t": 453.1333333333333, "x": "ジェフ・ラーセンとアン・デスクール。"}, {"t": 454.8333333333333, "x": "二人が、過去の画像を調べ直しました。"}, {"t": 457.78333333333336, "x": "そしてとても暗い姿の2004 MN4を見つけました。"}, {"t": 461.95, "x": "写っていたのは二〇〇四年三月十五日の画像です。"}, {"t": 465.3, "x": "見つかった六月十九日より、三か月前の記録でした。"}, {"t": 469.31666666666666, "x": "三月の時点ではまだ誰も気づいていませんでした。"}, {"t": 472.4166666666667, "x": "画像の中に、暗い点として写っていただけです。"}, {"t": 475.75, "x": "見つける前から、記録は残っていたことになります。"}, {"t": 479.18333333333334, "x": "この三か月ぶん、観測の期間が延びました。"}, {"t": 482.45, "x": "軌道の計算はそれだけ確かになりました。"}, {"t": 485.1333333333333, "x": "十二月二十七日、ジェット推進研究所の"}, {"t": 488.5833333333333, "x": "研究者たちが発表しました。"}, {"t": 490.5, "x": "二〇二九年四月十三日の地球への衝突はもう無いと言える。"}, {"t": 494.8833333333333, "x": "その年に、地球にも月にもぶつかる道筋は残っていない。"}, {"t": 498.95, "x": "発表はさらにこう続けています。"}, {"t": 501.0833333333333, "x": "今世紀のこの先の接近にも心配の要るものは無い。"}, {"t": 504.48333333333335, "x": "十二月十八日にとらえ直されてから、"}, {"t": 507.06666666666666, "x": "十日たたないうちの出来事でした。"}, {"t": 509.45, "x": "三段上がった階段を、一度に下まで下ろしたもの。"}, {"t": 513.1166666666667, "x": "それは新しい観測ではなく、古い画像でした。"}, {"t": 516.65, "x": "数字が上がったのも、下がったのも、理由は同じです。"}, {"t": 520.4833333333333, "x": "観測の期間の長さでした。"}, {"t": 522.3666666666667, "x": "二〇二九年にぶつからないことは分かりました。"}, {"t": 525.45, "x": "けれどもどこまで近づくのかは"}, {"t": 527.2, "x": "まだ定まっていませんでした。"}, {"t": 528.85, "x": "二〇〇五年二月三日、ジェット推進研究所が"}, {"t": 532.2666666666667, "x": "新しい発表をしました。"}, {"t": 533.8833333333333, "x": "内容は、レーダーの観測についてでした。"}, {"t": 536.8333333333334, "x": "2004 MN4の動きが、さらに絞られたのです。"}, {"t": 541.0333333333333, "x": "二〇二九年の衝突は引き続き無い。"}, {"t": 543.8, "x": "ただし近づく距離の見積もりは大きく変わりました。"}, {"t": 546.8333333333334, "x": "地球の中心から、約三万六千三百五十キロメートル。"}, {"t": 551.0833333333334, "x": "地球の半径の、約五・七倍です。"}, {"t": 554.0833333333334, "x": "十二月には約七十八万キロメートルとされていました。"}, {"t": 557.7166666666667, "x": "その約二十分の一です。"}, {"t": 559.5666666666667, "x": "ぶつかりはしない。"}, {"t": 560.7, "x": "けれども思っていたよりずっと近くを通る。"}, {"t": 563.25, "x": "レーダーの観測でそれが分かりました。"}, {"t": 565.5666666666667, "x": "地球の半径の五・七倍。"}, {"t": 567.6333333333333, "x": "地表からなら、およそ三万キロメートルです。"}, {"t": 570.7333333333333, "x": "静止衛星の高さよりも内側にあたります。"}, {"t": 573.6833333333333, "x": "二〇〇五年の時点でその近さはもう見えていました。"}, {"t": 576.8333333333334, "x": "十二月の発表では、月の二倍ほど遠くとされていました。"}, {"t": 580.8833333333333, "x": "二か月後には、月よりずっと内側になりました。"}, {"t": 584.2833333333333, "x": "数字は、近づく方向へ書き換えられました。"}, {"t": 587.4166666666666, "x": "この年、この小惑星には番号と名前が付きました。"}, {"t": 591.35, "x": "番号は九万九千九百四十二。"}, {"t": 594.0333333333333, "x": "名前はアポフィスです。"}, {"t": 595.4333333333333, "x": "番号は軌道がしっかり決まった"}, {"t": 597.25, "x": "小惑星に、順番に付けられます。"}, {"t": 599.8833333333333, "x": "仮の名前から、番号のある小惑星になったことになります。"}, {"t": 604.0166666666667, "x": "軌道が確かになった、というしるしです。"}, {"t": 606.85, "x": "名前の説明は小惑星センターの記録に残っています。"}, {"t": 610.4666666666667, "x": "アポフィスはエジプトの神話に出てくる神です。"}, {"t": 613.2333333333333, "x": "アペプとも呼ばれます。"}, {"t": 614.6666666666666, "x": "悪と破壊の神で永遠の闇に住むとされています。"}, {"t": 617.8166666666667, "x": "同じ記録にはもう一文が添えられています。"}, {"t": 620.5666666666667, "x": "二〇二九年四月十三日、この小惑星は"}, {"t": 624.2666666666667, "x": "地球の四万キロメートル以内を通る。"}, {"t": 626.6333333333333, "x": "その接近によって、小惑星の分類が変わる。"}, {"t": 630.1, "x": "アテン群から、アポロ群へ移る、という一文です。"}, {"t": 634.0, "x": "アテン群は軌道の大きさが地球より"}, {"t": 636.25, "x": "小さい小惑星の仲間です。"}, {"t": 638.2166666666667, "x": "アポロ群は地球より大きい仲間です。"}, {"t": 640.7333333333333, "x": "地球のそばを通るだけで、小惑星の軌道そのものが変わる。"}, {"t": 644.8333333333334, "x": "名前が付いた時点でそれは記録に書かれていました。"}, {"t": 647.9833333333333, "x": "軌道は太陽のまわりを回る道筋です。"}, {"t": 650.7, "x": "その道筋がたった一度の接近で別の形になります。"}, {"t": 654.3166666666667, "x": "それほど近くを通る、ということです。"}, {"t": 657.1, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 658.8833333333333, "x": "最初は可能性が三つありました。"}, {"t": 661.4, "x": "二〇二九年と、二〇三六年と、二〇六八年です。"}, {"t": 666.6166666666667, "x": "二〇二九年は三月の古い画像で消えました。"}, {"t": 669.9166666666666, "x": "二〇三六年もその後の観測で消えました。"}, {"t": 673.0333333333333, "x": "最後まで残ったのは二〇六八年でした。"}, {"t": 676.0333333333333, "x": "ここで大きさの数字についても触れておきます。"}, {"t": 678.9166666666666, "x": "アポフィスの大きさは資料によって違います。"}, {"t": 681.6166666666667, "x": "二〇〇四年の見積もりは約四百メートルでした。"}, {"t": 684.6, "x": "NASAのジェット推進研究所は"}, {"t": 686.45, "x": "二〇二一年に発表しています。"}, {"t": 688.75, "x": "その数字は、約三百四十メートルです。"}, {"t": 691.95, "x": "ヨーロッパ宇宙機関は平均で"}, {"t": 693.85, "x": "約三百七十五メートルとしています。"}, {"t": 696.3166666666667, "x": "どの数字も写真で形を見て測ったものではありません。"}, {"t": 699.7166666666667, "x": "この回ではそれぞれの出どころと一緒に数字を言います。"}, {"t": 703.1166666666667, "x": "ヨーロッパ宇宙機関は、その大きさを"}, {"t": 705.8, "x": "大型の客船ほどと例えています。"}, {"t": 707.9666666666667, "x": "客船ほどの岩のかたまりが、静止衛星より内側を通ります。"}, {"t": 712.3833333333333, "x": "では写真が無いのに、形はどこまで"}, {"t": 714.9333333333333, "x": "分かっているのでしょうか。"}, {"t": 716.3166666666667, "x": "その答えは地上の大きなアンテナから"}, {"t": 718.5333333333333, "x": "送られた電波にありました。"}, {"t": 720.1666666666666, "x": "二〇一二年十二月二十一日から、"}, {"t": 722.7166666666667, "x": "二〇一三年三月十六日まで。"}, {"t": 725.5333333333333, "x": "アポフィスが、地球に近づいたのです。"}, {"t": 728.1833333333333, "x": "その機会に、レーダーの観測が行われました。"}, {"t": 731.5333333333333, "x": "使われたのは二つのアンテナです。"}, {"t": 733.6166666666667, "x": "一つはカリフォルニア州にあるNASAのゴールドストーン。"}, {"t": 736.65, "x": "もう一つはプエルトリコのアレシボ天文台です。"}, {"t": 739.6, "x": "ゴールドストーンで十四日、"}, {"t": 741.2333333333333, "x": "アレシボで五日、観測しました。"}, {"t": 744.1333333333333, "x": "いちばん近づいたのは二〇一三年一月九日です。"}, {"t": 747.6666666666666, "x": "距離は太陽と地球の距離の約〇・〇九七倍。"}, {"t": 751.1166666666667, "x": "およそ千四百五十万キロメートルです。"}, {"t": 753.7666666666667, "x": "レーダーの観測はカメラで撮るのとは仕組みが違います。"}, {"t": 757.1, "x": "アンテナから電波を送ります。"}, {"t": 758.95, "x": "電波は小惑星に当たって、跳ね返ってきます。"}, {"t": 762.3166666666667, "x": "返ってきたこだまの、届くまでの時間を測ります。"}, {"t": 765.7666666666667, "x": "近い部分からの電波は早く、"}, {"t": 767.7166666666667, "x": "遠い部分からの電波は遅く戻ります。"}, {"t": 770.55, "x": "もう一つこだまの周波数のずれも測ります。"}, {"t": 773.3166666666667, "x": "小惑星は回っています。"}, {"t": 775.1, "x": "こちらへ近づく側の面からの電波は"}, {"t": 777.3833333333333, "x": "周波数が少し高くなります。"}, {"t": 779.3166666666667, "x": "遠ざかる側の面からの電波は少し低くなります。"}, {"t": 782.5333333333333, "x": "この時間と周波数のずれを並べると、"}, {"t": 784.9666666666667, "x": "一枚の画像になります。"}, {"t": 787.0, "x": "ただし、それはカメラで写した姿ではありません。"}, {"t": 790.3666666666667, "x": "距離と速さで並べ直した、こだまの地図です。"}, {"t": 793.6, "x": "写真なら、光の当たり方で影ができます。"}, {"t": 796.7166666666667, "x": "こだまの地図では横と縦の意味が違います。"}, {"t": 799.4833333333333, "x": "一方の向きはアンテナからの距離です。"}, {"t": 801.7833333333333, "x": "もう一方の向きは回る速さです。"}, {"t": 803.9833333333333, "x": "形を知るには何日分ものこだまの地図を集めます。"}, {"t": 807.4, "x": "それを計算機に入れて、全部のこだまに合う形を探します。"}, {"t": 811.6, "x": "そうして組み立てた形は模型として公開されています。"}, {"t": 814.9333333333333, "x": "最も細かい画像では一つの点が"}, {"t": 817.1833333333333, "x": "約二十メートルにあたりました。"}, {"t": 819.1166666666667, "x": "論文によると、アポフィスは細長い形です。"}, {"t": 822.5, "x": "左右も、そろっていません。"}, {"t": 824.5666666666667, "x": "二つのかたまりがくっついた形かも"}, {"t": 826.6833333333333, "x": "しれない、とも書かれています。"}, {"t": 828.75, "x": "ただしそれは「かもしれない」という書き方です。"}, {"t": 832.1833333333333, "x": "いちばん長い向きの長さは少なくとも四百五十メートル。"}, {"t": 835.8, "x": "これは短く見積もった値です。"}, {"t": 837.95, "x": "実際は、もっと長いかもしれません。"}, {"t": 840.65, "x": "同じ体積の球に直すと、直径は約三百四十メートルです。"}, {"t": 845.25, "x": "上下に四十メートルの幅がつきます。"}, {"t": 847.6833333333333, "x": "表面がどれだけ光を返すかも見積もられました。"}, {"t": 850.7833333333333, "x": "返す割合は約〇・三五。"}, {"t": 853.0333333333333, "x": "暗い炭のような岩ではなく、比較的明るい岩の仲間です。"}, {"t": 857.2333333333333, "x": "NASAはアポフィスを石の多い小惑星としています。"}, {"t": 860.2833333333333, "x": "ケイ素を含む岩に、金属のニッケルや"}, {"t": 863.0, "x": "鉄がまじったものです。"}, {"t": 864.4, "x": "回り方も変わっていました。"}, {"t": 866.1666666666666, "x": "二〇一四年の研究があります。"}, {"t": 868.35, "x": "アポフィスは一本の軸で素直に"}, {"t": 870.3166666666667, "x": "回っていない、という結果です。"}, {"t": 872.5, "x": "こまが首を振るように、向きを変えながら回っています。"}, {"t": 876.0666666666667, "x": "小惑星の多くは決まった軸のまわりを回ります。"}, {"t": 879.25, "x": "アポフィスはその決まった軸を持っていません。"}, {"t": 881.8166666666667, "x": "明るさの変化から求めた周期は約三十時間半です。"}, {"t": 885.4833333333333, "x": "形の分かる写真は無い。"}, {"t": 887.2333333333333, "x": "けれども、ここまでは分かってきました。"}, {"t": 889.85, "x": "手がかりは、こだまの地図と明るさの変化です。"}, {"t": 893.0666666666667, "x": "一方で、二〇一八年に出たレーダーの"}, {"t": 895.9166666666666, "x": "論文には、別の宿題も書かれていました。"}, {"t": 898.8666666666667, "x": "軌道をわずかにずらす、ある力の効き目です t": 1010.6, "x": "二〇二九年の接近でぶつからないことは、"}, {"t": 1013.4333333333333, "x": "しばらく前から分かっている。"}, {"t": 1015.4, "x": "問題はその先でした。"}, {"t": 1016.9833333333333, "x": "二〇二九年、アポフィスは地球のすぐそばを通ります。"}, {"t": 1020.9833333333333, "x": "そのとき、地球の重力で軌道が大きく曲げられます。"}, {"t": 1024.7666666666667, "x": "前の章で触れたとおり、分類が変わるほどの変化です。"}, {"t": 1028.55, "x": "近づくときの通り道が少し違うとします。"}, {"t": 1031.3666666666666, "x": "すると、曲げられたあとの軌道も変わります。"}, {"t": 1034.3666666666666, "x": "年に百七十メートルのずれがどの道筋につながるのか。"}, {"t": 1037.9833333333333, "x": "それを確かめるにはさらに細かい観測が要りました。"}, {"t": 1041.2333333333333, "x": "ちょうど、その機会が近づいていました。"}, {"t": 1043.95, "x": "二〇二一年の三月、アポフィスがまた地球に近づくのです。"}, {"t": 1048.35, "x": "アポフィスはほぼ八年ごとに地球へ近づいてきました。"}, {"t": 1051.7333333333333, "x": "二〇〇四年の十二月。"}, {"t": 1053.3833333333334, "x": "二〇一三年の一月。"}, {"t": 1055.1833333333334, "x": "そして二〇二一年の三月です。"}, {"t": 1057.6333333333334, "x": "どの回も距離は太陽と地球の距離の約十分の一ほどでした。"}, {"t": 1061.6, "x": "ウェストバージニア州に、グリーンバンク望遠鏡という"}, {"t": 1065.05, "x": "大きなアンテナがあります。"}, {"t": 1066.5166666666667, "x": "直径は百メートルです。"}, {"t": 1068.2, "x": "二〇二一年三月の初め、この望遠鏡が、"}, {"t": 1071.8, "x": "とても弱いこだまを受けました。"}, {"t": 1073.9, "x": "電波を送ったのは、別の場所です。"}, {"t": 1076.5, "x": "ゴールドストーンのアンテナで、"}, {"t": 1078.0666666666666, "x": "直径は七十メートルあります。"}, {"t": 1080.4166666666667, "x": "場所はバーストーという町の近くです。"}, {"t": 1082.7666666666667, "x": "こだまの元は、アポフィスでした。"}, {"t": 1085.1, "x": "地球から約千七百万キロメートルのところを"}, {"t": 1088.0166666666667, "x": "通っていたのです。"}, {"t": 1089.0833333333333, "x": "地球と月の距離の、四十倍を超える遠さです。"}, {"t": 1092.6, "x": "二〇二九年の距離と比べると、五百倍以上遠くです。"}, {"t": 1096.85, "x": "それでもこの距離ならレーダーが届きます。"}, {"t": 1099.3166666666666, "x": "ただし八年前とは組み合わせが違います。"}, {"t": 1102.0, "x": "送る側と受ける側を、分けたのです。"}, {"t": 1104.7333333333333, "x": "これで、受け取る信号の強さは二倍になりました。"}, {"t": 1108.25, "x": "アポフィスまでの距離は、約百五十メートルの"}, {"t": 1111.2833333333333, "x": "細かさで測られました。"}, {"t": 1112.75, "x": "千七百万キロメートル先の、百五十メートルです。"}, {"t": 1116.5833333333333, "x": "割合にすると、一億分の一ほどの細かさです。"}, {"t": 1120.3, "x": "こだまの地図も作られました。"}, {"t": 1122.15, "x": "八年前の観測よりも、遠くからの観測です。"}, {"t": 1125.7166666666667, "x": "一つの点が三十八・七五メートルにあたる細かさです。"}, {"t": 1129.4333333333334, "x": "アポフィスの大きさは三百数十メートルです。"}, {"t": 1132.3333333333333, "x": "縦に並べると、十個ほどの点で"}, {"t": 1134.8166666666666, "x": "全体が収まる計算になります。"}, {"t": 1136.9, "x": "粗い画像です。"}, {"t": 1138.0333333333333, "x": "それでも千七百万キロメートル先の岩の輪郭です。"}, {"t": 1141.6, "x": "ジェット推進研究所のマリナ・ブロゾビッチは"}, {"t": 1144.6666666666667, "x": "こう話しています。"}, {"t": 1145.8, "x": "小惑星は、千七百万キロメートルも離れていた。"}, {"t": 1149.6, "x": "それを考えると、驚くほどの細かさだ。"}, {"t": 1152.7, "x": "この観測をもとに、軌道が計算し直されました。"}, {"t": 1156.2833333333333, "x": "二〇二一年三月二十五日。"}, {"t": 1158.8166666666666, "x": "ジェット推進研究所が、結果を発表しました。"}, {"t": 1162.2333333333333, "x": "アポフィスが地球にぶつかる危険は"}, {"t": 1164.1833333333334, "x": "少なくともこの先百年は無い。"}, {"t": 1166.1833333333334, "x": "最後まで残っていた二〇六八年の可能性も消えました。"}, {"t": 1170.0833333333333, "x": "ダビデ・ファルノッキアも、こう話しています。"}, {"t": 1173.35, "x": "地球近傍天体研究センターの研究者です。"}, {"t": 1176.5333333333333, "x": "二〇六八年の衝突はもはや起こりうる範囲に無い。"}, {"t": 1180.1166666666666, "x": "翌日は、三月二十六日。"}, {"t": 1182.7333333333333, "x": "ヨーロッパ宇宙機関も、動きました。"}, {"t": 1185.4166666666667, "x": "アポフィスを、危険のある天体の一覧から外したのです。"}, {"t": 1189.2, "x": "見つかった日から数えると、十七年近くがたっていました。"}, {"t": 1193.1666666666667, "x": "ここでもう一度確かめておきます。"}, {"t": 1195.3166666666666, "x": "この十七年のあいだに、撮られていないものがあります。"}, {"t": 1198.85, "x": "アポフィスの姿を写した写真です。"}, {"t": 1201.1666666666667, "x": "望遠鏡は光の点の位置を測り続けました。"}, {"t": 1204.2333333333333, "x": "レーダーはこだまの時間と周波数を測り続けました。"}, {"t": 1207.5333333333333, "x": "安全だという答えはその二つの"}, {"t": 1209.5333333333333, "x": "数字の積み重ねから出たものです。"}, {"t": 1211.65, "x": "計算は、細かくなりました。"}, {"t": 1213.95, "x": "すると、二〇二九年の接近の近さもはっきりしてきました。"}, {"t": 1218.2833333333333, "x": "地球の上空には地球の自転と"}, {"t": 1220.4333333333334, "x": "同じ速さで回る衛星があります。"}, {"t": 1222.6, "x": "地上から見ると、いつも同じ場所に"}, {"t": 1225.1166666666666, "x": "止まって見える衛星です。"}, {"t": 1226.6666666666667, "x": "静止衛星と呼ばれます。"}, {"t": 1228.4166666666667, "x": "天気の観測や放送に使われています。"}, {"t": 1231.0666666666666, "x": "その高さは地表から約三万六千キロメートル。"}, {"t": 1234.25, "x": "この高さを、物差しとして覚えておいてください。"}, {"t": 1237.65, "x": "ジェット推進研究所には、接近の記録があります。"}, {"t": 1241.25, "x": "そこに、二〇二九年の数字が載っています。"}, {"t": 1244.65, "x": "最も近づくのは二〇二九年四月十三日。"}, {"t": 1248.1333333333334, "x": "世界時で午後九時四十五分ごろです。"}, {"t": 1250.7, "x": "日本時間では十四日の午前六時四十五分ごろにあたります。"}, {"t": 1254.8333333333333, "x": "地球の中心からの距離は約三万八千キロメートル。"}, {"t": 1258.2833333333333, "x": "地球の半径を引くと、地表から"}, {"t": 1260.6666666666667, "x": "約三万二千キロメートルです。"}, {"t": 1262.65, "x": "地球と月の距離は約三十八万キロメートルです。"}, {"t": 1266.0, "x": "アポフィスが通るのはその十二分の一ほどのところです。"}, {"t": 1269.3666666666666, "x": "地球の直径に直すと、二・五個分ほどです。"}, {"t": 1272.8833333333334, "x": "宇宙の大きさで見れば、すれすれの距離です。"}, {"t": 1275.9, "x": "このときの地球に対する速さは"}, {"t": 1277.9, "x": "秒速約七・四キロメートルです。"}, {"t": 1280.2833333333333, "x": "三万二千と三万六千。"}, {"t": 1282.1666666666667, "x": "さきほどの物差しより、四千キロメートルほど"}, {"t": 1285.3333333333333, "x": "低い位置です。"}, {"t": 1286.2166666666667, "x": "アポフィスは静止衛星の高さよりも内側を通り抜けます。"}, {"t": 1289.9, "x": "NASAによると、東半球の人たちが見られます。"}, {"t": 1293.2666666666667, "x": "望遠鏡も双眼鏡も、要りません。"}, {"t": 1296.0666666666666, "x": "ヨーロッパ宇宙機関の説明も、ほぼ同じです。"}, {"t": 1299.45, "x": "ヨーロッパやアフリカの多くの地域と、"}, {"t": 1301.7, "x": "アジアの一部の空に見えます。"}, {"t": 1304.0, "x": "見える範囲に住む人は約二十億人です。"}, {"t": 1306.7666666666667, "x": "ジェット推進研究所は二〇一九年に、"}, {"t": 1309.45, "x": "空での通り道も示しました。"}, {"t": 1311.7833333333333, "x": "最初に肉眼で見えるのは、南半球の夜空です。"}, {"t": 1315.5333333333333, "x": "オーストラリアの上空を、東の海岸から"}, {"t": 1318.4333333333334, "x": "西の海岸へと横切っていきます。"}, {"t": 1320.5166666666667, "x": "そのあとインド洋を渡り、赤道を"}, {"t": 1322.9333333333334, "x": "越えるころにはアフリカの上空へ。"}, {"t": 1324.95, "x": "向きは、ずっと西のままです。"}, {"t": 1327.1833333333334, "x": "最も近づく瞬間、アポフィスは大西洋の上にいます。"}, {"t": 1331.2333333333333, "x": "その大西洋を、わずか一時間ほどで"}, {"t": 1333.9666666666667, "x": "渡りきるとされています。"}, {"t": 1335.4333333333334, "x": "アメリカ合衆国の上空を過ぎるのは、"}, {"t": 1337.9166666666667, "x": "さらにその一時間後です。"}, {"t": 1339.8833333333334, "x": "近づくにつれて光の点は明るくなり、動きも速くなります。"}, {"t": 1344.1333333333334, "x": "一分以内に、満月の幅より長い距離を"}, {"t": 1347.15, "x": "空の上で動く場面もあるそうです。"}, {"t": 1349.35, "x": "いちばん明るいときは、こぐま座の"}, {"t": 1351.6833333333334, "x": "星と同じくらいだといいます。"}, {"t": 1353.45, "x": "ヨーロッパ宇宙機関は、ある数字も出しています。"}, {"t": 1356.7833333333333, "x": "これほど大きな天体が、これほど近くを通る。"}, {"t": 1360.0833333333333, "x": "それは、五千年から一万年に一度だと見積もられている。"}, {"t": 1364.05, "x": "比べる相手として、二つの例が挙げられています。"}, {"t": 1367.45, "x": "皆既日食は地球のどこかで約一年半に一度起きます。"}, {"t": 1371.1666666666667, "x": "ハレー彗星は七十六年ごとに戻ってきます。"}, {"t": 1374.2666666666667, "x": "それと比べてもずっと間の空いた出来事だということです。"}, {"t": 1377.75, "x": "ヨーロッパ宇宙機関はもう一つの言い方もしています。"}, {"t": 1380.9833333333333, "x": "この大きさの小惑星が、ここまで近づく。"}, {"t": 1384.1333333333334, "x": "しかも、前もって知られた上で。"}, {"t": 1386.4833333333333, "x": "それは、人類が知る限り初めてだ。"}, {"t": 1389.2166666666667, "x": "前もって知られている、ということには意味があります。"}, {"t": 1392.6, "x": "見えない場所から急に近づくのではありません。"}, {"t": 1395.3666666666666, "x": "日付と時刻と距離が十年以上前から分かっています。"}, {"t": 1398.7333333333333, "x": "観測の準備をしておくことができるのです。"}, {"t": 1401.4, "x": "どの望遠鏡を向けるか。"}, {"t": 1403.1, "x": "どのアンテナで電波を送るか。"}, {"t": 1404.9833333333333, "x": "どの探査機を先に送っておくか。"}, {"t": 1407.15, "x": "それを、何年も前から決めておけます。"}, {"t": 1410.0333333333333, "x": "第6章に出てきたブロゾビッチは、二〇一九年、"}, {"t": 1413.55, "x": "どう観測するかの段取りも説明しています。"}, {"t": 1416.6833333333334, "x": "光の望遠鏡と、電波のレーダーの両方で見る。"}, {"t": 1420.25, "x": "レーダーなら、数メートルほどの大きさの"}, {"t": 1422.8166666666666, "x": "表面のようすまで分かるかもしれない。"}, {"t": 1425.0, "x": "同じ年、地球近傍天体研究センターの所長"}, {"t": 1428.6166666666666, "x": "ポール・チョーダスも話しています。"}, {"t": 1430.4, "x": "アポフィスは、当時知られていた約二千個の「潜在的に"}, {"t": 1434.4666666666667, "x": "危険な小惑星」を代表する一つだ。"}, {"t": 1437.35, "x": "この接近を観測して得る知識は、いつか地球を"}, {"t": 1440.7, "x": "守る役に立つかもしれない、という言葉です。"}, {"t": 1443.7666666666667, "x": "この呼び名には、決まった線引きがあります。"}, {"t": 1446.65, "x": "地球の軌道に、約七百五十万キロメートルまで"}, {"t": 1450.2166666666667, "x": "近づく道筋を持つこと。"}, {"t": 1451.9166666666667, "x": "大きさが、およそ百四十メートル以上あること。"}, {"t": 1455.2833333333333, "x": "その両方を満たす小惑星が、そう呼ばれます。"}, {"t": 1458.6333333333334, "x": "二〇〇四年のクリスマスのころ。"}, {"t": 1460.5833333333333, "x": "この日付は、衝突の候補として発表されました。"}, {"t": 1464.15, "x": "いま、同じ日付は観測の予定として書かれています。"}, {"t": 1467.8666666666666, "x": "日付は同じです。"}, {"t": 1469.1666666666667, "x": "変わったのはその日付の意味でした。"}, {"t": 1471.2666666666667, "x": "では、地球のすぐそばで何が起きるのでしょうか。"}, {"t": 1474.55, "x": "ぶつからなくても何も起きないわけではありません。"}, {"t": 1477.3166666666666, "x": "二〇二九年の接近には、答えの"}, {"t": 1480.1166666666666, "x": "出ていない問いが残っています。"}, {"t": 1481.8333333333333, "x": "一つ目の問いは、岩そのものがどう変わるかです。"}, {"t": 1485.0833333333333, "x": "地球の重力は近いほど強く働きます。"}, {"t": 1487.9166666666667, "x": "アポフィスにも、地球に近い側と遠い側があります。"}, {"t": 1491.4666666666667, "x": "その二つでは、引かれる強さがわずかに違います。"}, {"t": 1494.9166666666667, "x": "その差が、小惑星を引き伸ばしたり、押し縮めたりします。"}, {"t": 1499.2833333333333, "x": "海の満ち引きを起こすのと同じ種類の"}, {"t": 1501.55, "x": "力で、潮汐力と呼ばれます。"}, {"t": 1503.9833333333333, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 1505.7833333333333, "x": "アポフィスはこの力を受けます。"}, {"t": 1508.0833333333333, "x": "引き伸ばされ、押し縮められるのです。"}, {"t": 1510.7333333333333, "x": "それによって、小惑星の中で揺れが起きるかもしれません。"}, {"t": 1514.7333333333333, "x": "表面で土砂崩れが起きるかもしれません。"}, {"t": 1517.3333333333333, "x": "回り方が変わるかもしれません。"}, {"t": 1519.3666666666666, "x": "どれもまだ「かもしれない」です。"}, {"t": 1521.9833333333333, "x": "起きるかどうかも、まだ分かりません。"}, {"t": 1524.4333333333334, "x": "仮に起きたとしても、どれほどの"}, {"t": 1526.65, "x": "大きさになるかは見積もれていません。"}, {"t": 1528.7166666666667, "x": "アポフィスの重さは約二千万トンと見積もられています。"}, {"t": 1532.05, "x": "これも、見積もりの数字です。"}, {"t": 1534.2666666666667, "x": "重さを直接はかった人はいません。"}, {"t": 1536.5333333333333, "x": "その岩のかたまりがどのくらいの力でどう変わるのか。"}, {"t": 1539.7833333333333, "x": "それを近くで確かめた例はこれまでありません。"}, {"t": 1542.7, "x": "二つ目の問いは、問いというより、"}, {"t": 1544.9666666666667, "x": "すでに答えの見えている変化です。"}, {"t": 1547.3666666666666, "x": "太陽のまわりを回る軌道が、確実に変わります。"}, {"t": 1550.9833333333333, "x": "ヨーロッパ宇宙機関の数字があります。"}, {"t": 1553.3833333333334, "x": "接近の前のアポフィスは、約〇・九年で太陽を一周します。"}, {"t": 1557.9, "x": "接近のあとは約一・二年で一周するようになります。"}, {"t": 1561.3833333333334, "x": "これまでは、地球より速く太陽を回っていました。"}, {"t": 1564.8166666666666, "x": "これからは、地球よりゆっくり回ることになります。"}, {"t": 15 function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;

    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
