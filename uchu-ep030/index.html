<script>
const D={"name": "ep030", "file": "ep030", "dur": 1806.7, "segs": [], "subs": [{"t": 0.0, "x": "地球から約百五十万キロメートル。"}, {"t": 2.466666666666667, "x": "その場所で十一年働いた宇宙望遠鏡が、"}, {"t": 5.416666666666667, "x": "二〇二五年三月に電源を切られました。"}, {"t": 8.616666666666667, "x": "二度と目を覚まさないようにする手順でした。"}, {"t": 11.233333333333333, "x": "機体の記憶には、約千五百人の名前が書き込まれています。"}, {"t": 15.483333333333333, "x": "いまは、太陽を回る軌道にあります。"}, {"t": 18.166666666666668, "x": "空の細い帯を撮った画像に、小さな点が一つありました。"}, {"t": 22.266666666666666, "x": "撮ったのは、ヨーロッパの宇宙望遠鏡ガイアです。"}, {"t": 25.6, "x": "二〇二二年二月十八日の朝のことでした。"}, {"t": 28.816666666666666, "x": "明るさは十九・三等。"}, {"t": 30.733333333333334, "x": "とても暗い点です。"}, {"t": 32.11666666666667, "x": "その点をつくった光の粒は、千個に少し足りない数でした。"}, {"t": 36.28333333333333, "x": "太陽の光が、ある機械に当たって跳ね返りました。"}, {"t": 39.86666666666667, "x": "そのわずかな光がガイアの望遠鏡に届いたのです。"}, {"t": 43.25, "x": "跳ね返した機械は、"}, {"t": 44.483333333333334, "x": "ジェイムズ・ウェッブ宇宙望遠鏡でした。"}, {"t": 47.11666666666667, "x": "二つの望遠鏡のあいだは約百二万キロメートル。"}, {"t": 50.333333333333336, "x": "それでも二機は、同じ場所のまわりを回っています。"}, {"t": 53.733333333333334, "x": "地球から見て太陽と反対の方向へ、"}, {"t": 56.21666666666667, "x": "約百五十万キロメートル。"}, {"t": 58.36666666666667, "x": "そこはラグランジュ点のエルツーと呼ばれています。"}, {"t": 61.1, "x": "ただし、その場所の真ん中には何もありません。"}, {"t": 64.31666666666666, "x": "岩もありません。"}, {"t": 65.48333333333333, "x": "ちりの雲もありません。"}, {"t": 66.96666666666667, "x": "望遠鏡を向けても、エルツーという場所は写りません。"}, {"t": 70.51666666666667, "x": "写すものが無いからです。"}, {"t": 72.11666666666666, "x": "画像に残るのは、まわりを回る機体の小さな光だけです。"}, {"t": 76.25, "x": "電源を切られたのは、この点を撮ったガイアです。"}, {"t": 79.51666666666667, "x": "この回の主役は、場所そのものです。"}, {"t": 82.2, "x": "地図に印をつけても、行けば何もない場所。"}, {"t": 85.36666666666666, "x": "そこへ向かった機体と、そこを去った機体の話です。"}, {"t": 88.91666666666667, "x": "何もない点に、なぜ望遠鏡が集まるのか。"}, {"t": 92.21666666666667, "x": "そこで十一年を過ごした機体は、どう仕事を終えたのか。"}, {"t": 96.15, "x": "その記録をたどります。"}, {"t": 97.7, "x": "始まりは紙の上の計算でした。"}, {"t": 99.9, "x": "一七七二年、一本の論文が賞を受けました。"}, {"t": 103.93333333333334, "x": "書いたのはラグランジュです。"}, {"t": 105.5, "x": "十八世紀のイタリアの天文学者で、数学者でもありました。"}, {"t": 109.7, "x": "題は「三体問題についての試論」。"}, {"t": 112.41666666666667, "x": "三つの天体が引き合うとき、それぞれがどう動くか。"}, {"t": 116.05, "x": "それを考えた論文です。"}, {"t": 117.86666666666666, "x": "三つの天体の動きは、ふつうはとても複雑になります。"}, {"t": 121.7, "x": "けれども特別な場合があります。"}, {"t": 123.78333333333333, "x": "大きな天体が二つあり、そこへ"}, {"t": 126.16666666666667, "x": "小さな天体が一つ加わる場合です。"}, {"t": 128.6, "x": "たとえば太陽と地球です。"}, {"t": 130.45, "x": "そこへ小さな探査機を一つ置くとします。"}, {"t": 133.11666666666667, "x": "すると探査機が二つの天体と並び方を"}, {"t": 135.68333333333334, "x": "保ったまま回れる点が、五つあります。"}, {"t": 138.51666666666668, "x": "これがラグランジュ点です。"}, {"t": 140.06666666666666, "x": "五つの点は計算で見つかりました。"}, {"t": 142.41666666666666, "x": "望遠鏡で見つけたものではありません。"}, {"t": 144.8, "x": "点には、目に見える目印が何もないからです。"}, {"t": 148.08333333333334, "x": "なぜそんな点ができるのでしょうか。"}, {"t": 150.2, "x": "地球は一年かけて太陽を一周します。"}, {"t": 152.93333333333334, "x": "回るものには、外へ飛び出そうとする力がかかります。"}, {"t": 156.61666666666667, "x": "その力と、太陽と地球の重力の合計が打ち消し合う。"}, {"t": 160.71666666666667, "x": "そういう場所が五つあるのです。"}, {"t": 162.68333333333334, "x": "五つの点には、一から五までの番号が付いています。"}, {"t": 166.35, "x": "エルワンは、太陽と地球のあいだにあります。"}, {"t": 169.38333333333333, "x": "地球から太陽までの距離の、約百分の一のところです。"}, {"t": 173.43333333333334, "x": "太陽から吹き出す粒の流れを太陽風といいます。"}, {"t": 176.65, "x": "太陽風は、地球に届く約一時間前にこの点を通ります。"}, {"t": 181.08333333333334, "x": "そのためここは太陽を見張る場所として使われています。"}, {"t": 184.4, "x": "ヨーロッパとアメリカの太陽の見張り"}, {"t": 186.53333333333333, "x": "役、ソーホーがそこにいます。"}, {"t": 188.68333333333334, "x": "エルスリーは太陽の向こう側です。"}, {"t": 190.91666666666666, "x": "ここにあるものは地球からは見えません。"}, {"t": 193.31666666666666, "x": "ヨーロッパ宇宙機関は、太陽の裏側を見られる"}, {"t": 196.58333333333334, "x": "場所になるかもしれないとしています。"}, {"t": 198.6, "x": "エルフォーとエルファイブは、地球の前と後ろにあります。"}, {"t": 202.08333333333334, "x": "太陽から見て地球の六十度前と、六十度後ろです。"}, {"t": 206.11666666666667, "x": "ヨーロッパ宇宙機関はESAと呼ばれます。"}, {"t": 208.65, "x": "ESAは、この二つをお椀の中のボールにたとえています。"}, {"t": 212.41666666666666, "x": "少し押されても底へ戻ってくる。"}, {"t": 214.6, "x": "そういう安定した点です。"}, {"t": 216.36666666666667, "x": "残りの三つは違います。"}, {"t": 218.13333333333333, "x": "こちらは丘のてっぺんに置いた"}, {"t": 219.83333333333334, "x": "ボールにたとえられています。"}, {"t": 221.38333333333333, "x": "少しでもずれると転がり落ちていきます。"}, {"t": 223.83333333333334, "x": "エルツーは、その丘の上の点です。"}, {"t": 226.35, "x": "NASAの解説には、日数も書かれています。"}, {"t": 229.41666666666666, "x": "エルワンとエルツーでは、約二十三日で"}, {"t": 232.2, "x": "つり合いが崩れていきます。"}, {"t": 233.78333333333333, "x": "そのため機体は、定期的にエンジンを"}, {"t": 236.36666666666667, "x": "吹かして位置を直します。"}, {"t": 237.86666666666667, "x": "この回の舞台はエルツーです。"}, {"t": 239.78333333333333, "x": "太陽から見て地球の真後ろ。"}, {"t": 241.8, "x": "月までの、およそ四倍の遠さです。"}, {"t": 244.56666666666666, "x": "ただし、エルツーは止まった点ではありません。"}, {"t": 247.55, "x": "地球と歩調を合わせて、太陽のまわりを回ります。"}, {"t": 251.15, "x": "止まっているのは、地球と太陽から見たときの"}, {"t": 254.16666666666666, "x": "位置だけです。"}, {"t": 254.95, "x": "地球が一年で太陽を一周すれば、"}, {"t": 257.31666666666666, "x": "エルツーも一年で一周します。"}, {"t": 259.7, "x": "いつも地球の真後ろについていく点です。"}, {"t": 262.3, "x": "ウェッブ宇宙望遠鏡は、地球を"}, {"t": 264.65, "x": "出て約三日で月の軌道の距離まで来ました。"}, {"t": 267.3333333333333, "x": "NASAによると、そこまでで"}, {"t": 269.2, "x": "エルツーへの道のりの約四分の一です。"}, {"t": 271.76666666666665, "x": "エルツーに着くまでには約三十日かかりました。"}, {"t": 274.76666666666665, "x": "では、そこへ行くと何があるのか。"}, {"t": 277.18333333333334, "x": "答えは短いものでした。"}, {"t": 278.8833333333333, "x": "ESAの運用センターで軌道を担当する"}, {"t": 281.26666666666665, "x": "ランドグラフは、こう話しています。"}, {"t": 283.6166666666667, "x": "ラグランジュ点は特別だ。"}, {"t": 285.31666666666666, "x": "そこに何もないのは本当のことだ。"}, {"t": 287.5833333333333, "x": "ESAの記事も書いています。"}, {"t": 289.26666666666665, "x": "エルツーという点は、まさに何もないものでできている。"}, {"t": 292.75, "x": "あるのは計算で決まる一つの位置だけです。"}, {"t": 295.4, "x": "のちにガイアがここへ着いたとき、"}, {"t": 297.3333333333333, "x": "ESAは記事に一つの題を付けました。"}, {"t": 300.0, "x": "何もない場所への到着。"}, {"t": 301.76666666666665, "x": "その言葉どおりの場所です。"}, {"t": 303.53333333333336, "x": "それなのに天文学者は、この点を選んできました。"}, {"t": 307.1, "x": "理由の一つ目は、太陽と地球と"}, {"t": 309.6, "x": "月が空の同じ側に集まることです。"}, {"t": 312.0, "x": "エルツーから見ると、三つはほとんど同じ方向に並びます。"}, {"t": 315.98333333333335, "x": "だから一枚の日よけで、三つの光と"}, {"t": 318.7, "x": "熱をまとめてさえぎれます。"}, {"t": 320.3666666666667, "x": "二つ目は影です。"}, {"t": 321.68333333333334, "x": "地球を回るハッブル宇宙望遠鏡は、"}, {"t": 324.1, "x": "約九十分ごとに地球の影に出入りします。"}, {"t": 327.26666666666665, "x": "温まったり冷えたりを、何度も繰り返すことになります。"}, {"t": 331.05, "x": "エルツーの近くでは、そういう出入りがありません。"}, {"t": 334.2, "x": "日の当たり方も、ほとんど変わりません。"}, {"t": 336.8833333333333, "x": "機体の温度が落ち着きます。"}, {"t": 338.6666666666667, "x": "三つ目は放射線です。"}, {"t": 340.31666666666666, "x": "ESAによると、エルツーの放射線は"}, {"t": 342.9166666666667, "x": "それほど厳しくありません。"}, {"t": 344.51666666666665, "x": "そのぶん観測装置が長持ちします。"}, {"t": 346.96666666666664, "x": "ただし、機体は点の上にじっと止まるわけではありません。"}, {"t": 350.6666666666667, "x": "点のまわりを大きな輪を描いて回ります。"}, {"t": 353.28333333333336, "x": "ESAはウェッブについてこう書いています。"}, {"t": 355.6333333333333, "x": "エルツーちょうどではなく、そのまわりを回る。"}, {"t": 358.6166666666667, "x": "そうすれば太陽が地球に隠されることは一度もない。"}, {"t": 361.95, "x": "中心には何もない。"}, {"t": 363.4166666666667, "x": "それでも、そのまわりを回り続ける。"}, {"t": 366.03333333333336, "x": "この場所の機体は、みなそうやって働いてきました。"}, {"t": 369.43333333333334, "x": "ラグランジュの論文から、二百年あまりがたちました。"}, {"t": 372.95, "x": "二〇〇一年六月三十日。"}, {"t": 375.15, "x": "フロリダの発射場から、一機の"}, {"t": 377.3666666666667, "x": "探査機が宇宙へ向かいました。"}, {"t": 379.1333333333333, "x": "打ち上げのときの名前はマップです。"}, {"t": 381.31666666666666, "x": "宇宙のはじまりに近い時代の"}, {"t": 383.0833333333333, "x": "光を、空全体で測る探査機です。"}, {"t": 385.9, "x": "計画を立ち上げた一人に、ウィルキンソンという"}, {"t": 388.96666666666664, "x": "研究者がいました。"}, {"t": 390.23333333333335, "x": "ウィルキンソンは二〇〇二年九月に亡くなりました。"}, {"t": 393.1, "x": "探査機には、その名前の頭文字が足されました。"}, {"t": 396.5, "x": "それからはダブリューマップと呼ばれました。"}, {"t": 398.8333333333333, "x": "ダブリューマップは、約三か月かけて"}, {"t": 401.3333333333333, "x": "エルツーへ向かいました。"}, {"t": 402.6333333333333, "x": "NASAは、エルツーを観測の場所として"}, {"t": 405.18333333333334, "x": "使った最初の宇宙機としています。"}, {"t": 407.21666666666664, "x": "測ったのは、宇宙が生まれて約三十八万年後の光です。"}, {"t": 411.3833333333333, "x": "その光の温度は、空の場所によってわずかに違います。"}, {"t": 415.21666666666664, "x": "その違いは、一九九二年に別の"}, {"t": 418.3833333333333, "x": "衛星が初めて捉えていました。"}, {"t": 420.3333333333333, "x": "ダブリューマップは、それをもっと細かく測りました。"}, {"t": 423.65, "x": "二〇一〇年に発表された結果はこうでした。"}, {"t": 426.48333333333335, "x": "宇宙の年齢は百三十七億五千万年。"}, {"t": 429.48333333333335, "x": "誤差は約一パーセントです。"}, {"t": 431.3666666666667, "x": "ふつうの原子は、宇宙の中身の四・六パーセント。"}, {"t": 435.05, "x": "正体の分からない暗黒物質が二十三パーセント。"}, {"t": 438.45, "x": "宇宙の膨張を速めている暗黒エネルギーが"}, {"t": 441.15, "x": "七十二パーセントです。"}, {"t": 442.65, "x": "ダブリューマップは九年にわたって空を走査しました。"}, {"t": 445.8, "x": "最後の観測データを取ったのは、"}, {"t": 447.81666666666666, "x": "二〇一〇年八月二十日です。"}, {"t": 450.1166666666667, "x": "九月八日にはエンジンを吹かし、"}, {"t": 452.06666666666666, "x": "働いていた軌道を離れました。"}, {"t": 454.3666666666667, "x": "二〇〇九年五月十四日には、ヨーロッパの"}, {"t": 457.4, "x": "二機がそろって打ち上げられました。"}, {"t": 459.3, "x": "ハーシェルとプランクです。"}, {"t": 460.76666666666665, "x": "打ち上げの場所はフランス領ギアナ。"}, {"t": 462.9166666666667, "x": "ロケットはアリアン5でした。"}, {"t": 464.56666666666666, "x": "一つのロケットに二機が載っていました。"}, {"t": 466.9, "x": "ハーシェルの鏡の直径は三・五メートル。"}, {"t": 469.65, "x": "とても冷たく遠い天体から届く、"}, {"t": 471.85, "x": "波長の長い赤外線を集めました。"}, {"t": 474.65, "x": "装置は液体のヘリウムで冷やされていました。"}, {"t": 477.45, "x": "そのヘリウムが尽きたのは、二〇一三年四月二十九日です。"}, {"t": 481.73333333333335, "x": "プランクは、ダブリューマップと同じ古い光を測りました。"}, {"t": 485.51666666666665, "x": "装置は、絶対零度より約〇・一度だけ"}, {"t": 488.6333333333333, "x": "高い温度まで冷やされました。"}, {"t": 490.4166666666667, "x": "そのおかげで、百万分の数度という"}, {"t": 493.0, "x": "温度の違いを捉えられました。"}, {"t": 494.85, "x": "目標は空全体を二回測ることでした。"}, {"t": 497.6666666666667, "x": "実際には五回測りました。"}, {"t": 499.5833333333333, "x": "プランクの観測は、約四年半続きました。"}, {"t": 502.8, "x": "測った電波の周波数は九つです。"}, {"t": 505.28333333333336, "x": "冷たい装置は、少しずつ止まっていきました。"}, {"t": 508.3833333333333, "x": "高い周波数を測る装置は、二〇一二年一月に"}, {"t": 512.2, "x": "ヘリウムを使い切りました。"}, {"t": 513.7666666666667, "x": "低い周波数を測る装置は、二〇一三年十月三日まで"}, {"t": 517.9333333333333, "x": "観測を続けました。"}, {"t": 519.2833333333333, "x": "二〇一三年、二機ともエルツーを"}, {"t": 521.8166666666667, "x": "離れて太陽を回る軌道へ移されました。"}, {"t": 524.4166666666666, "x": "ハーシェルへの最後の命令は、六月十七日に送られました。"}, {"t": 528.7166666666667, "x": "中央ヨーロッパ夏時間の午後二時二十五分です。"}, {"t": 531.95, "x": "プランクは、最後の作業で残りの"}, {"t": 534.35, "x": "燃料をすべて使い切りました。"}, {"t": 536.2, "x": "最後の命令は十月二十三日です。"}, {"t": 538.9333333333333, "x": "送ったのは、計画の科学者のタウバーでした。"}, {"t": 542.0833333333334, "x": "命令の中身は、プランクの送信機を切ることでした。"}, {"t": 545.6833333333333, "x": "エルツーで仕事を終えた機体は、点の"}, {"t": 548.2, "x": "まわりにとどまりません。"}, {"t": 549.5166666666667, "x": "ほかの機体のじゃまにならないよう、"}, {"t": 551.4, "x": "そこを離れていきます。"}, {"t": 553.1666666666666, "x": "働いているあいだだけ、点のまわりにいる。"}, {"t": 556.1166666666667, "x": "この場所の使い方は、最初の住人のときから同じでした。"}, {"t": 560.1, "x": "二〇一三年十二月十九日。"}, {"t": 562.5166666666667, "x": "南アメリカのフランス領ギアナにある、ヨーロッパの射場。"}, {"t": 566.3666666666667, "x": "そこからソユーズのロケットが打ち上げられました。"}, {"t": 569.1333333333333, "x": "載っていたのはESAの望遠鏡ガイアです。"}, {"t": 571.7333333333333, "x": "ガイアの仕事は、きれいな写真を撮ることではありません。"}, {"t": 575.3666666666667, "x": "星の位置を測ることです。"}, {"t": 577.15, "x": "どの星が空のどこにあるか。"}, {"t": 579.0333333333333, "x": "どれだけ遠いか。"}, {"t": 580.2166666666667, "x": "どの向きへ、どれだけの速さで動いているか。"}, {"t": 583.2666666666667, "x": "それを約二十億個の天体について測ります。"}, {"t": 586.3333333333334, "x": "天の川銀河の立体の地図を作るためです。"}, {"t": 589.2333333333333, "x": "ガイアがエルツーに着くまでの旅は、約一か月でした。"}, {"t": 592.9166666666666, "x": "途中、二時間近くエンジンを吹かした日がありました。"}, {"t": 596.4666666666667, "x": "その噴射で、ガイアはエルツーの"}, {"t": 598.6833333333333, "x": "まわりの曲がりくねった道に乗りました。"}, {"t": 600.95, "x": "最後の噴射は二〇一四年一月十四日です。"}, {"t": 604.2166666666667, "x": "グリニッジ標準時の十五時三十分すぎでした。"}, {"t": 607.3, "x": "ここでガイアは決められた輪の上に落ち着きました。"}, {"t": 610.25, "x": "打ち上げから二十六日目のことでした。"}, {"t": 612.7166666666667, "x": "ガイアが点のまわりを一周するのには、"}, {"t": 615.0, "x": "約百八十日かかります。"}, {"t": 617.2, "x": "半年に一回、点のまわりを回る計算です。"}, {"t": 620.55, "x": "ただし、この輪は放っておくと崩れます。"}, {"t": 623.4666666666667, "x": "運用責任者のミリガンは、こう話しています。"}, {"t": 626.7666666666667, "x": "ガイアをとどめるには、毎月位置を"}, {"t": 629.2166666666667, "x": "直す噴射をしなければならない。"}, {"t": 631.1833333333333, "x": "そうしないと点から落ちてしまう。"}, {"t": 633.1833333333333, "x": "ガイアの体には大きな特徴がありました。"}, {"t": 635.8833333333333, "x": "円い日よけです。"}, {"t": 637.0833333333334, "x": "広げると、大きな円盤になります。"}, {"t": 639.8333333333334, "x": "差し渡しは十メートルを少し超えます。"}, {"t": 642.4166666666666, "x": "日よけは打ち上げのあと、すぐに広げられました。"}, {"t": 645.6833333333333, "x": "ガイアはいつも太陽に背を向けていました。"}, {"t": 648.3333333333334, "x": "日よけが光と熱をさえぎり、"}, {"t": 650.2, "x": "その陰に二つの望遠鏡が入ります。"}, {"t": 653.0666666666667, "x": "望遠鏡とカメラは、零下百度より冷たく保たれました。"}, {"t": 657.0166666666667, "x": "二つの望遠鏡は、それぞれ違う方向を向いています。"}, {"t": 660.7666666666667, "x": "主な鏡が光を集める面は、一つに"}, {"t": 663.7166666666667, "x": "つき約〇・七平方メートルです。"}, {"t": 666.0166666666667, "x": "集めた光は鏡のあいだで何度も折り返されます。"}, {"t": 669.2666666666667, "x": "カメラに届くまでの道のりは、合わせて三十五メートル。"}, {"t": 673.0333333333333, "x": "その先には、写真を撮るための大きな面がありました。"}, {"t": 676.6666666666666, "x": "並んでいるのは、百六枚の小さな受光の板です。"}, {"t": 680.3333333333334, "x": "一枚につき八百万を超える画素があります。"}, {"t": 683.2, "x": "合わせると、十億に近い画素です。"}, {"t": 685.9333333333333, "x": "面の広さは〇・三八平方メートル。"}, {"t": 688.65, "x": "宇宙へ送られた中で、最も大きな面でした。"}, {"t": 692.0, "x": "ESAはこれを、十億画素のカメラと呼んでいます。"}, {"t": 695.3833333333333, "x": "エルツーに着いたあと、ガイアは"}, {"t": 697.4833333333333, "x": "約三か月かけて調整を受けました。"}, {"t": 699.8666666666667, "x": "装置がきちんと動くか。"}, {"t": 701.4833333333333, "x": "測った位置がずれていないか。"}, {"t": 703.2833333333333, "x": "それを確かめてから本番の観測が始まります。"}, {"t": 706.3833333333333, "x": "二〇一四年七月のことでした。"}, {"t": 708.65, "x": "地球を出てから、約七か月がたっていました。"}, {"t": 711.9, "x": "予定されていた観測の期間は五年でした。"}, {"t": 714.6166666666667, "x": "ガイアはゆっくりと回りながら空を見ます。"}, {"t": 717.2333333333333, "x": "体ごと回転させて、空を帯のようになぞっていくのです。"}, {"t": 721.25, "x": "星の見つけ役の装置は、六時間ごとに"}, {"t": 724.1333333333333, "x": "空を一周する細い帯をなぞります。"}, {"t": 726.5333333333333, "x": "それを何年も続けるうちに、"}, {"t": 728.3666666666667, "x": "空のすべてが何度もなぞられます。"}, {"t": 730.75, "x": "ESAによると、一つの天体を"}, {"t": 732.9833333333333, "x": "見る回数は一年に約十四回です。"}, {"t": 735.5, "x": "同じ星を時間をあけて何度も測る。"}, {"t": 737.9666666666667, "x": "すると、星がわずかに動いているのが分かります。"}, {"t": 741.3, "x": "地球は半年ごとに太陽の反対側へ移ります。"}, {"t": 744.5833333333334, "x": "そのため近い星は、遠い星を"}, {"t": 746.9166666666666, "x": "背景にして小さく揺れて見えます。"}, {"t": 749.0333333333333, "x": "この揺れの大きさが分かれば、"}, {"t": 750.7333333333333, "x": "星までの距離を計算できます。"}, {"t": 753.1, "x": "遠い星ほど、揺れは小さくなります。"}, {"t": 755.8333333333334, "x": "ガイアはその揺れをとても細かく測りました。"}, {"t": 758.55, "x": "十五等より明るい天体では、位置を"}, {"t": 761.2333333333333, "x": "二十四マイクロ秒角の細かさで測りました。"}, {"t": 764.1666666666666, "x": "秒角は角度の単位です。"}, {"t": 766.0, "x": "一度の三千六百分の一が一秒角。"}, {"t": 768.8833333333333, "x": "マイクロ秒角は、その百万分の一です。"}, {"t": 772.0333333333333, "x": "ESAのたとえはこうです。"}, {"t": 773.6666666666666, "x": "千キロメートル先から、人の髪の毛の太さを測るほど。"}, {"t": 777.5833333333334, "x": "近い星までの距離は、誤差〇・〇〇一パーセント。"}, {"t": 781.4333333333333, "x": "天の川銀河の中心近くの星は、約三万光年先にあります。"}, {"t": 786.1833333333333, "x": "その距離でも、誤差は二十パーセント以内です。"}, {"t": 789.4, "x": "測った数字は、何回かに分けて世界へ公開されました。"}, {"t": 793.4166666666666, "x": "一回目は二〇一六年九月十四日。"}, {"t": 796.1333333333333, "x": "二回目は二〇一八年四月二十五日。"}, {"t": 799.05, "x": "三回目は二〇二二年六月十三日です。"}, {"t": 802.2666666666667, "x": "誰でもその数字を使って調べられます。"}, {"t": 804.8333333333334, "x": "そこから多くのことが分かりました。"}, {"t": 807.0, "x": "天の川銀河の真ん中には、棒のような形の部分があります。"}, {"t": 811.2833333333333, "x": "その回り方が描き直されました。"}, {"t": 813.4666666666667, "x": "円盤のふちが曲がっている様子も描き直されました。"}, {"t": 816.5666666666667, "x": "渦を巻く腕の形もです。"}, {"t": 818.4166666666666, "x": "天の川銀河の昔の姿も見えてきました。"}, {"t": 821.35, "x": "ずっと前に、ほかの銀河がのみ込まれた跡が"}, {"t": 824.3166666666667, "x": "見つかりました。"}, {"t": 825.2166666666667, "x": "ESAはそれを、ほかの銀河の幽霊と呼んでいます。"}, {"t": 828.6, "x": "古い星の流れもいくつも見つかりました。"}, {"t": 831.1666666666666, "x": "いて座の方向には、小さな銀河があります。"}, {"t": 834.2166666666667, "x": "その銀河とは、いまもぶつかり合っている"}, {"t": 836.7833333333333, "x": "証拠が得られました。"}, {"t": 838.0166666666667, "x": "わし座の方向にはブラックホールが見つかりました。"}, {"t": 840.9666666666667, "x": "距離は二千光年足らず。"}, {"t": 842.6666666666666, "x": "重さは太陽の約三十三倍です。"}, {"t": 845.2, "x": "星から生まれたブラックホールです。"}, {"t": 847.2, "x": "ここまで重いものは、天の川銀河で初めてでした。"}, {"t": 850.8, "x": "近くの小さな天体も測りました。"}, {"t": 853.1333333333333, "x": "十五万個を超える小惑星について、"}, {"t": 855.55, "x": "軌道を細かく決めました。"}, {"t": 857.5, "x": "そのうち何百個かには、小さな衛星が"}, {"t": 860.35, "x": "あるかもしれないとされています。"}, {"t": 862.0833333333334, "x": "遠くでは、約百三十万個のクエーサーの"}, {"t": 865.1, "x": "立体の地図を作りました。"}, {"t": 866.7666666666667, "x": "クエーサーは、遠い銀河の中心で強く光る天体です。"}, {"t": 870.7, "x": "ESAは、ガイアの仕事をこうまとめています。"}, {"t": 873.7833333333333, "x": "数百万のクエーサーと銀河を地図にした。"}, {"t": 876.5, "x": "数十万の小惑星と彗星を追いかけた。"}, {"t": 879.4166666666666, "x": "ガイアが観測した天体は約二十億個。"}, {"t": 882.2166666666667, "x": "観測の回数は三兆回を超えます。"}, {"t": 884.7833333333333, "x": "その全部が、何もない点のまわりを"}, {"t": 887.3, "x": "回る機体から測られました。"}, {"t": 889.05, "x": "そこへ、別の望遠鏡がやって来ます。"}, {"t": 891.8833333333333, "x": "二〇二一年十二月二十五日。"}, {"t": 894.5333333333333, "x": "フランス領ギアナの発射場を、"}, {"t": 896.3666666666667, "x": "アリアン5のロケットが飛び立ちました。"}, {"t": 898.9, "x": "載っていたのはジェイムズ・ウェッブ宇宙望遠鏡です。"}, {"t": 901.85, "x": "NASAとESAとカナダの宇宙機関による望遠鏡です。"}, {"t": 905.1166666666667, "x": "ロケットはESAが用意しました。"}, {"t": 907.0833333333334, "x": "ガイアと同じ、フランス領ギアナの射場からの出発でした。"}, {"t": 911.1166666666667, "x": "ウェッブは赤外線で空を見ます。"}, {"t": 913.2666666666667, "x": "人の目には見えない光です。"}, {"t": 915.1666666666666, "x": "赤外線は、熱を持つものから出る光です。"}, {"t": 918.5333333333333, "x": "望遠鏡そのものが温かいと、"}, {"t": 920.5333333333333, "x": "自分の熱でかすんでしまいます。"}, {"t": 922.8666666666667, "x": "ウェッブの観測装置は、零下約二百二十五度で働きます。"}, {"t": 927.1, "x": "そこまで冷やすために、ウェッブには"}, {"t": 929.3666666666667, "x": "大きな日よけが付いています。"}, {"t": 931.0833333333334, "x": "NASAは、その効き目を日焼け止めにたとえています。"}, {"t": 934.3, "x": "日焼けを防ぐ強さで言えば、百万の値に相当する。"}, {"t": 938.2, "x": "ウェッブもガイアと同じエルツーを目指しました。"}, {"t": 940.9166666666666, "x": "太陽と地球と月を、日よけ一枚の"}, {"t": 943.6333333333333, "x": "向こうに置ける場所だからです。"}, {"t": 945.35, "x": "NASAによると、ウェッブの輪は地球の影に入りません。"}, {"t": 948.95, "x": "月の影にも入りません。"}, {"t": 950.6666666666666, "x": "打ち上げのあと、ウェッブは何回か"}, {"t": 953.0166666666667, "x": "エンジンを吹かして道筋を直しました。"}, {"t": 955.3666666666667, "x": "二〇二一年十二月二十九日、"}, {"t": 957.9333333333333, "x": "NASAは一つの見通しを発表しました。"}, {"t": 960.7666666666667, "x": "ウェッブには、観測を十年より"}, {"t": 963.0, "x": "かなり長く続けられる燃料がある。"}, {"t": 965.15, "x": "もともと最低限の目標は五年でした。"}, {"t": 967.7833333333333, "x": "燃料が余った大きな理由は、打ち上げの正確さでした。"}, {"t": 971.7166666666667, "x": "ロケットは、求められた以上に"}, {"t": 973.85, "x": "正しい道筋へウェッブを送り出しました。"}, {"t": 976.3833333333333, "x": "そのため道筋を直す燃料が、"}, {"t": 978.55, "x": "予定より少なくて済んだのです。"}, {"t": 980.85, "x": "二〇二二年一月二十四日。"}, {"t": 983.2333333333333, "x": "アメリカ東部時間の午後二時のことです。"}, {"t": 985.75, "x": "ウェッブは約五分間エンジンを吹かしました。"}, {"t": 988.3833333333333, "x": "正確には二百九十七秒です。"}, {"t": 990.8333333333334, "x": "速さの変化は秒速一・六メートル。"}, {"t": 993.4333333333333, "x": "時速に直すと約五・八キロメートルです。"}, {"t": 996.3333333333334, "x": "それでウェッブはエルツーのまわりの輪に乗りました。"}, {"t": 999.1166666666667, "x": "打ち上げから三十日目でした。"}, {"t": 1001.1666666666666, "x": "NASAの長官は、こう呼びかけました。"}, {"t": 1003.85, "x": "ウェッブ、ようこそわが家へ。"}, {"t": 1005.85, "x": "宇宙の謎を解き明かすことに、また一歩近づいた。"}, {"t": 1009.3333333333334, "x": "計画を率いるオークスも話しています。"}, {"t": 1011.8666666666667, "x": "私たちはいま、鏡を合わせ、"}, {"t": 1014.25, "x": "装置を動かす段階の入り口にいる。"}, {"t": 1016.9833333333333, "x": "ウェッブも、約六か月で点のまわりを一回りします。"}, {"t": 1020.6, "x": "NASAによると、その輪は"}, {"t": 1022.35, "x": "月が地球を回る軌道ほどの大きさです。"}, {"t": 1024.9666666666667, "x": "ESAの図では、ウェッブの輪は"}, {"t": 1026.9333333333334, "x": "ガイアの輪より地球に近い側にあります。"}, {"t": 1029.4333333333334, "x": "その差は平均で約十万キロメートルです。"}, {"t": 1032.2666666666667, "x": "二機の道筋には、別々の名前があります。"}, {"t": 1035.5, "x": "ガイアの道筋はリサージュ軌道と呼ばれます。"}, {"t": 1038.2166666666667, "x": "ESAの記事の言葉を借りれば、点の"}, {"t": 1040.6833333333334, "x": "まわりの曲がりくねった道です。"}, {"t": 1042.5, "x": "ウェッブの道筋はハロー軌道と呼ばれます。"}, {"t": 1045.1, "x": "ハローは、光の輪という意味の言葉です。"}, {"t": 1047.9666666666667, "x": "どちらも、中心にあるのは何もない点です。"}, {"t": 1051.05, "x": "同じ点のまわりにいても、二機が"}, {"t": 1053.3333333333333, "x": "ぶつかるほど近づくことはありません。"}, {"t": 1055.4, "x": "二機の距離は、輪の上の位置によって変わります。"}, {"t": 1058.6166666666666, "x": "近いときは四十万キロメートル。"}, {"t": 1060.8, "x": "遠いときは百十万キロメートルです。"}, {"t": 1063.25, "x": "ウェッブと地球との交信は、一日に最大二回です。"}, {"t": 1067.0833333333333, "x": "地上の三つの大きなアンテナを使います。"}, {"t": 1069.7, "x": "命令はふつう、一週間分をまとめて送り込みます。"}, {"t": 1073.45, "x": "組み立てるのは、アメリカの宇宙望遠鏡科学研究所です。"}, {"t": 1077.6, "x": "エルツーに着くと、次の作業が始まりました。"}, {"t": 1080.8, "x": "約三か月かけて鏡を合わせる作業です。"}, {"t": 1083.6833333333334, "x": "ガイアにとって、ウェッブは新しい隣人でした。"}, {"t": 1086.9, "x": "ガイアがエルツーに着いたのは、二〇一四年の初めです。"}, {"t": 1090.6666666666667, "x": "ウェッブが着いたのは、それからほぼ八年後でした。"}, {"t": 1093.9166666666667, "x": "八年のあいだ、ガイアはこの点の"}, {"t": 1096.3166666666666, "x": "近くで空を測り続けていました。"}, {"t": 1098.5, "x": "ガイアの科学者たちは、ある計算を始めます。"}, {"t": 1101.8, "x": "この隣人は、ガイアの目に入るだろうか。"}, {"t": 1104.7666666666667, "x": "ガイアは空のすべてを繰り返しなぞっています。"}, {"t": 1107.6166666666666, "x": "それなら、近くを回るウェッブもいつか帯に入るはずです。"}, {"t": 1111.4166666666667, "x": "そう気づいたのは、ガイアの"}, {"t": 1113.2666666666667, "x": "科学者のバスティアンとミニャールでした。"}, {"t": 1115.4333333333334, "x": "二人は、ウェッブがガイアの視野を"}, {"t": 1117.5666666666666, "x": "横切るかもしれないと考えました。"}, {"t": 1119.7, "x": "ウェッブがエルツーに着いたあと、"}, {"t": 1121.4, "x": "科学者たちは計算をしました。"}, {"t": 1123.7333333333333, "x": "最初の機会はいつ来るのか。"}, {"t": 1125.6166666666666, "x": "答えは二〇二二年二月十八日でした。"}, {"t": 1128.6333333333334, "x": "その日、二つの望遠鏡は約百二万キロメートル"}, {"t": 1132.2166666666667, "x": "離れていました。"}, {"t": 1133.2166666666667, "x": "二機がとりうる距離の、ほぼいちばん遠いところです。"}, {"t": 1136.6, "x": "星の見つけ役の装置は、一回二・五秒の"}, {"t": 1139.8833333333334, "x": "露出で空を撮っていました。"}, {"t": 1141.5, "x": "一回目の画像は、中央ヨーロッパ時間の"}, {"t": 1144.4166666666667, "x": "八時五十三分に撮られました。"}, {"t": 1146.45, "x": "二回目は十時三十八分。"}, {"t": 1148.4166666666667, "x": "あいだは百六・五分です。"}, {"t": 1150.35, "x": "ガイアの二つの望遠鏡が、それぞれ"}, {"t": 1152.9833333333333, "x": "同じ相手をとらえた形です。"}, {"t": 1154.9, "x": "けれども画像はすぐには見られません。"}, {"t": 1157.1166666666666, "x": "データは地球へ送られてから調べられます。"}, {"t": 1159.7833333333333, "x": "ガイアは六時間ごとに空を一回りします。"}, {"t": 1162.5833333333333, "x": "そのたびに、たくさんの点の記録がたまります。"}, {"t": 1165.7166666666667, "x": "それを待って、さらに何日かがかかりました。"}, {"t": 1168.7833333333333, "x": "候補を探すのは簡単ではありませんでした。"}, {"t": 1171.5166666666667, "x": "見つけ役が拾う点の約一割は、"}, {"t": 1173.8, "x": "本物の天体ではないからです。"}, {"t": 1176.15, "x": "見つけ役の視野の幅は、〇・四度です。"}, {"t": 1179.2333333333333, "x": "太陽系には約百万個の小惑星が で測った記録だけです。"}, {"t": 1719.0, "x": "その記録は、電波になって地球へ届きました。"}, {"t": 1722.25, "x": "エルツーは、とどまる場所ではありません。"}, {"t": 1724.85, "x": "働くあいだだけ借りる場所です。"}, {"t": 1726.9, "x": "二〇二二年二月、ガイアは隣の望遠鏡を写しました。"}, {"t": 1731.2666666666667, "x": "写したのは、千個に足りない光の粒でした。"}, {"t": 1734.45, "x": "画像には、日よけを真横から見た小さな点が残りました。"}, {"t": 1738.4, "x": "撮ったガイアは、三年後に自分の"}, {"t": 1740.7666666666667, "x": "噴射でエルツーを離れました。"}, {"t": 1742.55, "x": "記憶の一部には、約千五百人の名前と"}, {"t": 1745.6166666666666, "x": "別れの言葉が残されました。"}, {"t": 1747.45, "x": "その記憶を読み出す命令は、もう届きません。"}, {"t": 1750.7333333333333, "x": "名前は、ガイアと一緒に太陽の"}, {"t": 1753.1333333333334, "x": "まわりへ運ばれていきました。"}, {"t": 1754.8, "x": "地上には、三兆回を超える観測が残りました。"}, {"t": 1758.4, "x": "その数字は、まだ全部は公開されていません。"}, {"t": 1761.65, "x": "四回目の公開は、二〇二六年十二月の予定です。"}, {"t": 1765.8, "x": "ガイアが測った星の動き。"}, {"t": 1767.6333333333334, "x": "それはこれから何年もかけて、"}, {"t": 1769.4833333333333, "x": "数字の表になって出てきます。"}, {"t": 1771.6333333333334, "x": "一方、エルツーの真ん中は何も変わっていません。"}, {"t": 1775.05, "x": "一七七二年の論文が、計算で示した位置です。"}, {"t": 1779.2333333333333, "x": "目印になる石一つありません。"}, {"t": 1781.4166666666667, "x": "ダブリューマップが来ても、ガイアが来ても同じでした。"}, {"t": 1784.7166666666667, "x": "そこには何も置かれませんでした。"}, {"t": 1786.7833333333333, "x": "ウェッブが来たあとも同じです。"}, {"t": 1788.5666666666666, "x": "機体はいつも、点から離れた輪の上を回りました。"}, {"t": 1792.0666666666666, "x": "これからも、新しい望遠鏡がこの輪へやって来るはずです。"}, {"t": 1796.0666666666666, "x": "約二百五十年前に紙の上に書かれた一つの点。"}, {"t": 1799.4333333333334, "x": "そのまわりを、望遠鏡は大きな輪を描いて回ります。"}, {"t": 1803.2166666666667, "x": "輪の真ん中は、からっぽのままです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
