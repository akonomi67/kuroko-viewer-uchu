<script>
const D={"name": "ep030", "file": "ep030", "dur": 1804.6833125, "segs": [], "subs": [{"t": 0.0, "x": "地球から約百五十万キロメートル。"}, {"t": 2.466666666666667, "x": "その場所で十一年働いた宇宙望遠鏡が、"}, {"t": 5.416666666666667, "x": "二〇二五年三月に電源を切られました。"}, {"t": 8.616666666666667, "x": "二度と目を覚まさないようにする手順でした。"}, {"t": 11.233333333333333, "x": "機体の記憶には、約千五百人の名前が書き込まれています。"}, {"t": 15.483333333333333, "x": "いまは、太陽を回る軌道にあります。"}, {"t": 18.166666666666668, "x": "空の細い帯を撮った画像に、小さな点が一つありました。"}, {"t": 22.266666666666666, "x": "撮ったのは、ヨーロッパの宇宙望遠鏡ガイアです。"}, {"t": 25.6, "x": "二〇二二年二月十八日の朝のことでした。"}, {"t": 28.816666666666666, "x": "明るさは十九・三等。"}, {"t": 30.733333333333334, "x": "とても暗い点です。"}, {"t": 32.11666666666667, "x": "その点をつくった光の粒は、千個に少し足りない数でした。"}, {"t": 36.28333333333333, "x": "太陽の光が、ある機械に当たって跳ね返りました。"}, {"t": 39.86666666666667, "x": "そのわずかな光がガイアの望遠鏡に届いたのです。"}, {"t": 43.25, "x": "跳ね返した機械は、"}, {"t": 44.483333333333334, "x": "ジェイムズ・ウェッブ宇宙望遠鏡でした。"}, {"t": 47.11666666666667, "x": "二つの望遠鏡のあいだは約百二万キロメートル。"}, {"t": 50.333333333333336, "x": "それでも二機は、同じ場所のまわりを回っています。"}, {"t": 53.733333333333334, "x": "地球から見て太陽と反対の方向へ、"}, {"t": 56.21666666666667, "x": "約百五十万キロメートル。"}, {"t": 58.36666666666667, "x": "そこはラグランジュ点のエルツーと呼ばれています。"}, {"t": 61.1, "x": "ただし、その場所の真ん中には何もありません。"}, {"t": 64.31666666666666, "x": "岩もありません。"}, {"t": 65.48333333333333, "x": "ちりの雲もありません。"}, {"t": 66.96666666666667, "x": "エルツーそのものを写した写真はありません。"}, {"t": 69.53333333333333, "x": "写すものが無いからです。"}, {"t": 71.13333333333334, "x": "画像に残るのは、まわりを回る機体の小さな光だけです。"}, {"t": 75.26666666666667, "x": "電源を切られたのは、この点を撮ったガイアです。"}, {"t": 78.53333333333333, "x": "この回の主役は、場所そのものです。"}, {"t": 81.21666666666667, "x": "地図に印をつけても、行けば何もない場所。"}, {"t": 84.38333333333334, "x": "そこへ向かった機体と、そこを去った機体の話です。"}, {"t": 87.93333333333334, "x": "何もない点に、なぜ望遠鏡が集まるのか。"}, {"t": 91.23333333333333, "x": "そこで十一年を過ごした機体は、どう仕事を終えたのか。"}, {"t": 95.16666666666667, "x": "その記録をたどります。"}, {"t": 96.71666666666667, "x": "始まりは紙の上の計算でした。"}, {"t": 98.91666666666667, "x": "一七七二年、一本の論文が賞を受けました。"}, {"t": 102.95, "x": "書いたのはラグランジュです。"}, {"t": 104.51666666666667, "x": "十八世紀のイタリアの天文学者で、数学者でもありました。"}, {"t": 108.71666666666667, "x": "題は「三体問題についての試論」。"}, {"t": 111.43333333333334, "x": "三つの天体が引き合うとき、それぞれがどう動くか。"}, {"t": 115.06666666666666, "x": "それを考えた論文です。"}, {"t": 116.88333333333334, "x": "三つの天体の動きは、ふつうはとても複雑になります。"}, {"t": 120.71666666666667, "x": "けれども特別な場合があります。"}, {"t": 122.8, "x": "大きな天体が二つあり、そこへ"}, {"t": 125.18333333333334, "x": "小さな天体が一つ加わる場合です。"}, {"t": 127.61666666666666, "x": "たとえば太陽と地球です。"}, {"t": 129.46666666666667, "x": "そこへ小さな探査機を一つ置くとします。"}, {"t": 132.13333333333333, "x": "すると探査機が二つの天体と並び方を"}, {"t": 134.7, "x": "保ったまま回れる点が、五つあります。"}, {"t": 137.53333333333333, "x": "これがラグランジュ点です。"}, {"t": 139.08333333333334, "x": "五つの点は計算で見つかりました。"}, {"t": 141.43333333333334, "x": "望遠鏡で見つけたものではありません。"}, {"t": 143.81666666666666, "x": "点には、目に見える目印が何もないからです。"}, {"t": 147.1, "x": "なぜそんな点ができるのでしょうか。"}, {"t": 149.21666666666667, "x": "地球は太陽のまわりを回っています。"}, {"t": 151.61666666666667, "x": "回るものには、外へ飛び出そうとする力がかかります。"}, {"t": 155.3, "x": "その力と、太陽と地球の重力の合計が打ち消し合う。"}, {"t": 159.4, "x": "そういう場所が五つあるのです。"}, {"t": 161.36666666666667, "x": "五つの点には、一から五までの番号が付いています。"}, {"t": 165.03333333333333, "x": "エルワンは、太陽と地球のあいだにあります。"}, {"t": 168.06666666666666, "x": "地球から太陽までの距離の、約百分の一のところです。"}, {"t": 172.11666666666667, "x": "太陽から吹き出す粒の流れを太陽風といいます。"}, {"t": 175.33333333333334, "x": "太陽風は、地球に届く約一時間前にこの点を通ります。"}, {"t": 179.76666666666668, "x": "そのためここは太陽を見張る場所として使われています。"}, {"t": 183.08333333333334, "x": "ヨーロッパとアメリカの太陽の見張り"}, {"t": 185.21666666666667, "x": "役、ソーホーがそこにいます。"}, {"t": 187.36666666666667, "x": "エルスリーは太陽の向こう側です。"}, {"t": 189.6, "x": "ここにあるものは地球からは見えません。"}, {"t": 192.0, "x": "ヨーロッパ宇宙機関は、太陽の裏側を見られる"}, {"t": 195.26666666666668, "x": "場所になるかもしれないとしています。"}, {"t": 197.28333333333333, "x": "エルフォーとエルファイブは、地球の前と後ろにあります。"}, {"t": 200.76666666666668, "x": "太陽から見て地球の六十度前と、六十度後ろです。"}, {"t": 204.8, "x": "ヨーロッパ宇宙機関はESAと呼ばれます。"}, {"t": 207.33333333333334, "x": "ESAは、この二つをお椀の中のボールにたとえています。"}, {"t": 211.1, "x": "少し押されても底へ戻ってくる。"}, {"t": 213.28333333333333, "x": "そういう安定した点です。"}, {"t": 215.05, "x": "残りの三つは違います。"}, {"t": 216.81666666666666, "x": "こちらは丘のてっぺんに置いた"}, {"t": 218.51666666666668, "x": "ボールにたとえられています。"}, {"t": 220.06666666666666, "x": "少しでもずれると転がり落ちていきます。"}, {"t": 222.51666666666668, "x": "エルツーは、その丘の上の点です。"}, {"t": 225.03333333333333, "x": "NASAの解説には、日数も書かれています。"}, {"t": 228.1, "x": "エルワンとエルツーでは、約二十三日で"}, {"t": 230.88333333333333, "x": "つり合いが崩れていきます。"}, {"t": 232.46666666666667, "x": "そのため機体は、定期的にエンジンを"}, {"t": 235.05, "x": "吹かして位置を直します。"}, {"t": 236.55, "x": "この回の舞台はエルツーです。"}, {"t": 238.46666666666667, "x": "太陽から見て地球の真後ろ。"}, {"t": 240.48333333333332, "x": "地球から約百五十万キロメートル離れています。"}, {"t": 243.7, "x": "ただし、エルツーは止まった点ではありません。"}, {"t": 246.68333333333334, "x": "地球と歩調を合わせて、太陽のまわりを回ります。"}, {"t": 250.28333333333333, "x": "止まっているのは、地球と太陽から見たときの"}, {"t": 253.3, "x": "位置だけです。"}, {"t": 254.08333333333334, "x": "地球が一年で太陽を一周すれば、"}, {"t": 256.45, "x": "エルツーも一年で一周します。"}, {"t": 258.8333333333333, "x": "いつも地球の真後ろについていく点です。"}, {"t": 261.43333333333334, "x": "ウェッブ宇宙望遠鏡は、地球を"}, {"t": 263.78333333333336, "x": "出て約三日で月の軌道の距離まで来ました。"}, {"t": 266.46666666666664, "x": "NASAによると、そこまでで"}, {"t": 268.3333333333333, "x": "エルツーへの道のりの約四分の一です。"}, {"t": 270.9, "x": "エルツーに着くまでには約三十日かかりました。"}, {"t": 273.9, "x": "では、そこへ行くと何があるのか。"}, {"t": 276.31666666666666, "x": "答えは短いものでした。"}, {"t": 278.01666666666665, "x": "ESAの運用センターで軌道を担当する"}, {"t": 280.4, "x": "ランドグラフは、こう話しています。"}, {"t": 282.75, "x": "ラグランジュ点は特別だ。"}, {"t": 284.45, "x": "そこに何もないのは本当のことだ。"}, {"t": 286.71666666666664, "x": "ESAの記事も書いています。"}, {"t": 288.4, "x": "エルツーという点は、まさに何もないものでできている。"}, {"t": 291.8833333333333, "x": "あるのは計算で決まる一つの位置だけです。"}, {"t": 294.53333333333336, "x": "のちにガイアがここへ着いたとき、"}, {"t": 296.46666666666664, "x": "ESAは記事に一つの題を付けました。"}, {"t": 299.1333333333333, "x": "何もない場所への到着。"}, {"t": 300.9, "x": "その言葉どおりの場所です。"}, {"t": 302.6666666666667, "x": "それなのに天文学者は、この点を選んできました。"}, {"t": 306.23333333333335, "x": "理由の一つ目は、太陽と地球と"}, {"t": 308.73333333333335, "x": "月が空の同じ側に集まることです。"}, {"t": 311.1333333333333, "x": "エルツーから見ると、三つはほとんど同じ方向に並びます。"}, {"t": 315.1166666666667, "x": "だから一枚の日よけで、三つの光と"}, {"t": 317.8333333333333, "x": "熱をまとめてさえぎれます。"}, {"t": 319.5, "x": "二つ目は影です。"}, {"t": 320.81666666666666, "x": "地球を回るハッブル宇宙望遠鏡は、"}, {"t": 323.23333333333335, "x": "約九十分ごとに地球の影に出入りします。"}, {"t": 326.4, "x": "温まったり冷えたりを、何度も繰り返すことになります。"}, {"t": 330.18333333333334, "x": "エルツーの近くでは、そういう出入りがありません。"}, {"t": 333.3333333333333, "x": "日の当たり方も、ほとんど変わりません。"}, {"t": 336.01666666666665, "x": "機体の温度が落ち着きます。"}, {"t": 337.8, "x": "三つ目は放射線です。"}, {"t": 339.45, "x": "ESAによると、エルツーの放射線は"}, {"t": 342.05, "x": "それほど厳しくありません。"}, {"t": 343.65, "x": "そのぶん観測装置が長持ちします。"}, {"t": 346.1, "x": "ただし、機体は点の上にじっと止まるわけではありません。"}, {"t": 349.8, "x": "点のまわりを大きな輪を描いて回ります。"}, {"t": 352.4166666666667, "x": "ESAはウェッブについてこう書いています。"}, {"t": 354.76666666666665, "x": "エルツーちょうどではなく、そのまわりを回る。"}, {"t": 357.75, "x": "そうすれば太陽が地球に隠されることは一度もない。"}, {"t": 361.0833333333333, "x": "中心には何もない。"}, {"t": 362.55, "x": "それでも、そのまわりを回り続ける。"}, {"t": 365.1666666666667, "x": "この場所の機体は、みなそうやって働いてきました。"}, {"t": 368.56666666666666, "x": "ラグランジュの論文から、二百年あまりがたちました。"}, {"t": 372.0833333333333, "x": "二〇〇一年六月三十日。"}, {"t": 374.28333333333336, "x": "アメリカで一機の探査機が打ち上げられました。"}, {"t": 377.0, "x": "打ち上げのときの名前はマップです。"}, {"t": 379.18333333333334, "x": "宇宙のはじまりに近い時代の"}, {"t": 380.95, "x": "光を、空全体で測る探査機です。"}, {"t": 383.76666666666665, "x": "計画を立ち上げた一人に、ウィルキンソンという"}, {"t": 386.8333333333333, "x": "研究者がいました。"}, {"t": 388.1, "x": "ウィルキンソンは二〇〇二年九月に亡くなりました。"}, {"t": 390.96666666666664, "x": "探査機には、その名前の頭文字が足されました。"}, {"t": 394.3666666666667, "x": "それからはダブリューマップと呼ばれました。"}, {"t": 396.7, "x": "ダブリューマップは、約三か月かけて"}, {"t": 399.2, "x": "エルツーへ向かいました。"}, {"t": 400.5, "x": "NASAは、エルツーを観測の場所として"}, {"t": 403.05, "x": "使った最初の宇宙機としています。"}, {"t": 405.0833333333333, "x": "測ったのは、宇宙が生まれて約三十八万年後の光です。"}, {"t": 409.25, "x": "その光の温度は、空の場所によってわずかに違います。"}, {"t": 413.0833333333333, "x": "その違いは、一九九二年に別の"}, {"t": 416.25, "x": "衛星が初めて捉えていました。"}, {"t": 418.2, "x": "ダブリューマップは、それをもっと細かく測りました。"}, {"t": 421.51666666666665, "x": "二〇一〇年に発表された結果はこうでした。"}, {"t": 424.35, "x": "宇宙の年齢は百三十七億五千万年。"}, {"t": 427.35, "x": "誤差は約一パーセントです。"}, {"t": 429.23333333333335, "x": "ふつうの原子は、宇宙の中身の四・六パーセント。"}, {"t": 432.9166666666667, "x": "正体の分からない暗黒物質が二十三パーセント。"}, {"t": 436.31666666666666, "x": "宇宙の膨張を速めている暗黒エネルギーが"}, {"t": 439.01666666666665, "x": "七十二パーセントです。"}, {"t": 440.51666666666665, "x": "ダブリューマップは九年にわたって空を走査しました。"}, {"t": 443.6666666666667, "x": "最後の観測データを取ったのは、"}, {"t": 445.68333333333334, "x": "二〇一〇年八月二十日です。"}, {"t": 447.98333333333335, "x": "九月八日にはエンジンを吹かし、"}, {"t": 449.93333333333334, "x": "働いていた軌道を離れました。"}, {"t": 452.23333333333335, "x": "二〇〇九年五月十四日には、ヨーロッパの"}, {"t": 455.26666666666665, "x": "二機がそろって打ち上げられました。"}, {"t": 457.1666666666667, "x": "ハーシェルとプランクです。"}, {"t": 458.6333333333333, "x": "打ち上げの場所はフランス領ギアナ。"}, {"t": 460.78333333333336, "x": "ロケットはアリアン5でした。"}, {"t": 462.43333333333334, "x": "一つのロケットに二機が載っていました。"}, {"t": 464.76666666666665, "x": "ハーシェルの鏡の直径は三・五メートル。"}, {"t": 467.51666666666665, "x": "とても冷たく遠い天体から届く、"}, {"t": 469.71666666666664, "x": "波長の長い赤外線を集めました。"}, {"t": 472.51666666666665, "x": "装置は液体のヘリウムで冷やされていました。"}, {"t": 475.31666666666666, "x": "そのヘリウムが尽きたのは、二〇一三年四月二十九日です。"}, {"t": 479.6, "x": "プランクは、ダブリューマップと同じ古い光を測りました。"}, {"t": 483.3833333333333, "x": "装置は、絶対零度より約〇・一度だけ"}, {"t": 486.5, "x": "高い温度まで冷やされました。"}, {"t": 488.28333333333336, "x": "そのおかげで、百万分の数度という"}, {"t": 490.8666666666667, "x": "温度の違いを捉えられました。"}, {"t": 492.71666666666664, "x": "目標は空全体を二回測ることでした。"}, {"t": 495.53333333333336, "x": "実際には五回測りました。"}, {"t": 497.45, "x": "プランクの観測は、約四年半続きました。"}, {"t": 500.6666666666667, "x": "測った電波の周波数は九つです。"}, {"t": 503.15, "x": "冷たい装置は、少しずつ止まっていきました。"}, {"t": 506.25, "x": "高い周波数を測る装置は、二〇一二年一月に"}, {"t": 510.06666666666666, "x": "ヘリウムを使い切りました。"}, {"t": 511.6333333333333, "x": "低い周波数を測る装置は、二〇一三年十月三日まで"}, {"t": 515.8, "x": "観測を続けました。"}, {"t": 517.15, "x": "二〇一三年、二機ともエルツーを"}, {"t": 519.6833333333333, "x": "離れて太陽を回る軌道へ移されました。"}, {"t": 522.2833333333333, "x": "ハーシェルへの最後の命令は、六月十七日に送られました。"}, {"t": 526.5833333333334, "x": "中央ヨーロッパ夏時間の午後二時二十五分です。"}, {"t": 529.8166666666667, "x": "プランクは、最後の作業で残りの"}, {"t": 532.2166666666667, "x": "燃料をすべて使い切りました。"}, {"t": 534.0666666666667, "x": "最後の命令は十月二十三日です。"}, {"t": 536.8, "x": "送ったのは、計画の科学者のタウバーでした。"}, {"t": 539.95, "x": "命令の中身は、プランクの送信機を切ることでした。"}, {"t": 543.55, "x": "エルツーで仕事を終えた機体は、点の"}, {"t": 546.0666666666667, "x": "まわりにとどまりません。"}, {"t": 547.3833333333333, "x": "ほかの機体のじゃまにならないよう、"}, {"t": 549.2666666666667, "x": "そこを離れていきます。"}, {"t": 551.0333333333333, "x": "働いているあいだだけ、点のまわりにいる。"}, {"t": 553.9833333333333, "x": "この場所の使い方は、最初の住人のときから同じでした。"}, {"t": 557.9666666666667, "x": "二〇一三年十二月十九日。"}, {"t": 560.3833333333333, "x": "南アメリカのフランス領ギアナにある、ヨーロッパの射場。"}, {"t": 564.2333333333333, "x": "そこからソユーズのロケットが打ち上げられました。"}, {"t": 567.0, "x": "載っていたのはESAの望遠鏡ガイアです。"}, {"t": 569.6, "x": "ガイアの仕事は、きれいな写真を撮ることではありません。"}, {"t": 573.2333333333333, "x": "星の位置を測ることです。"}, {"t": 575.0166666666667, "x": "どの星が空のどこにあるか。"}, {"t": 576.9, "x": "どれだけ遠いか。"}, {"t": 578.0833333333334, "x": "どの向きへ、どれだけの速さで動いているか。"}, {"t": 581.1333333333333, "x": "それを約二十億個の天体について測ります。"}, {"t": 584.2, "x": "天の川銀河の立体の地図を作るためです。"}, {"t": 587.1, "x": "ガイアは約一か月かけてエルツーへ向かいました。"}, {"t": 590.0666666666667, "x": "途中、二時間近くエンジンを吹かした日がありました。"}, {"t": 593.6166666666667, "x": "その噴射で、ガイアはエルツーの"}, {"t": 595.8333333333334, "x": "まわりの曲がりくねった道に乗りました。"}, {"t": 598.1, "x": "最後の噴射は二〇一四年一月十四日です。"}, {"t": 601.3666666666667, "x": "グリニッジ標準時の十五時三十分すぎでした。"}, {"t": 604.45, "x": "ここでガイアは決められた輪の上に落ち着きました。"}, {"t": 607.4, "x": "打ち上げから二十六日目のことでした。"}, {"t": 609.8666666666667, "x": "ガイアが点のまわりを一周するのには、"}, {"t": 612.15, "x": "約百八十日かかります。"}, {"t": 614.35, "x": "半年に一回、点のまわりを回る計算です。"}, {"t": 617.7, "x": "ただし、この輪は放っておくと崩れます。"}, {"t": 620.6166666666667, "x": "運用責任者のミリガンは、こう話しています。"}, {"t": 623.9166666666666, "x": "ガイアをとどめるには、毎月位置を"}, {"t": 626.3666666666667, "x": "直す噴射をしなければならない。"}, {"t": 628.3333333333334, "x": "そうしないと点から落ちてしまう。"}, {"t": 630.3333333333334, "x": "ガイアの体には大きな特徴がありました。"}, {"t": 633.0333333333333, "x": "円い日よけです。"}, {"t": 634.2333333333333, "x": "広げると、大きな円盤になります。"}, {"t": 636.9833333333333, "x": "差し渡しは十メートルを少し超えます。"}, {"t": 639.5666666666667, "x": "日よけは打ち上げのあと、すぐに広げられました。"}, {"t": 642.8333333333334, "x": "ガイアはいつも太陽に背を向けていました。"}, {"t": 645.4833333333333, "x": "日よけが光と熱をさえぎり、"}, {"t": 647.35, "x": "その陰に二つの望遠鏡が入ります。"}, {"t": 650.2166666666667, "x": "望遠鏡とカメラは、零下百度より冷たく保たれました。"}, {"t": 654.1666666666666, "x": "二つの望遠鏡は、それぞれ違う方向を向いています。"}, {"t": 657.9166666666666, "x": "主な鏡が光を集める面は、一つに"}, {"t": 660.8666666666667, "x": "つき約〇・七平方メートルです。"}, {"t": 663.1666666666666, "x": "集めた光は鏡のあいだで何度も折り返されます。"}, {"t": 666.4166666666666, "x": "カメラに届くまでの道のりは、合わせて三十五メートル。"}, {"t": 670.1833333333333, "x": "その先には、写真を撮るための大きな面がありました。"}, {"t": 673.8166666666667, "x": "並んでいるのは、百六枚の小さな受光の板です。"}, {"t": 677.4833333333333, "x": "一枚につき八百万を超える画素があります。"}, {"t": 680.35, "x": "合わせると、十億に近い画素です。"}, {"t": 683.0833333333334, "x": "面の広さは〇・三八平方メートル。"}, {"t": 685.8, "x": "宇宙へ送られた中で、最も大きな面でした。"}, {"t": 689.15, "x": "ESAはこれを、十億画素のカメラと呼んでいます。"}, {"t": 692.5333333333333, "x": "エルツーに着いたあと、ガイアは"}, {"t": 694.6333333333333, "x": "約三か月かけて調整を受けました。"}, {"t": 697.0166666666667, "x": "装置がきちんと動くか。"}, {"t": 698.6333333333333, "x": "測った位置がずれていないか。"}, {"t": 700.4333333333333, "x": "それを確かめてから本番の観測が始まります。"}, {"t": 703.5333333333333, "x": "二〇一四年七月のことでした。"}, {"t": 705.8, "x": "地球を出てから、約七か月がたっていました。"}, {"t": 709.05, "x": "予定されていた観測の期間は五年でした。"}, {"t": 711.7666666666667, "x": "ガイアはゆっくりと回りながら空を見ます。"}, {"t": 714.3833333333333, "x": "体ごと回転させて、空を帯のようになぞっていくのです。"}, {"t": 718.4, "x": "星の見つけ役の装置は、六時間ごとに"}, {"t": 721.2833333333333, "x": "空を一周する細い帯をなぞります。"}, {"t": 723.6833333333333, "x": "それを何年も続けるうちに、"}, {"t": 725.5166666666667, "x": "空のすべてが何度もなぞられます。"}, {"t": 727.9, "x": "ESAによると、一つの天体を"}, {"t": 730.1333333333333, "x": "見る回数は一年に約十四回です。"}, {"t": 732.65, "x": "同じ星を時間をあけて何度も測る。"}, {"t": 735.1166666666667, "x": "すると、星がわずかに動いているのが分かります。"}, {"t": 738.45, "x": "地球は半年ごとに太陽の反対側へ移ります。"}, {"t": 741.7333333333333, "x": "そのため近い星は、遠い星を"}, {"t": 744.0666666666667, "x": "背景にして小さく揺れて見えます。"}, {"t": 746.1833333333333, "x": "この揺れの大きさが分かれば、"}, {"t": 747.8833333333333, "x": "星までの距離を計算できます。"}, {"t": 750.25, "x": "遠い星ほど、揺れは小さくなります。"}, {"t": 752.9833333333333, "x": "ガイアはその揺れをとても細かく測りました。"}, {"t": 755.7, "x": "十五等より明るい天体では、位置を"}, {"t": 758.3833333333333, "x": "二十四マイクロ秒角の細かさで測りました。"}, {"t": 761.3166666666667, "x": "秒角は角度の単位です。"}, {"t": 763.15, "x": "一度の三千六百分の一が一秒角。"}, {"t": 766.0333333333333, "x": "マイクロ秒角は、その百万分の一です。"}, {"t": 769.1833333333333, "x": "ESAのたとえはこうです。"}, {"t": 770.8166666666667, "x": "千キロメートル先から、人の髪の毛の太さを測るほど。"}, {"t": 774.7333333333333, "x": "近い星までの距離は、誤差〇・〇〇一パーセント。"}, {"t": 778.5833333333334, "x": "天の川銀河の中心近くの星は、約三万光年先にあります。"}, {"t": 783.3333333333334, "x": "その距離でも、誤差は二十パーセント以内です。"}, {"t": 786.55, "x": "測った数字は、何回かに分けて世界へ公開されました。"}, {"t": 790.5666666666667, "x": "一回目は二〇一六年九月十四日。"}, {"t": 793.2833333333333, "x": "二回目は二〇一八年四月二十五日。"}, {"t": 796.2, "x": "三回目は二〇二二年六月十三日です。"}, {"t": 799.4166666666666, "x": "誰でもその数字を使って調べられます。"}, {"t": 801.9833333333333, "x": "そこから多くのことが分かりました。"}, {"t": 804.15, "x": "天の川銀河の真ん中には、棒のような形の部分があります。"}, {"t": 808.4333333333333, "x": "その回り方が描き直されました。"}, {"t": 810.6166666666667, "x": "円盤のふちが曲がっている様子も描き直されました。"}, {"t": 813.7166666666667, "x": "渦を巻く腕の形もです。"}, {"t": 815.5666666666667, "x": "天の川銀河の昔の姿も見えてきました。"}, {"t": 818.5, "x": "ずっと前に、ほかの銀河がのみ込まれた跡が"}, {"t": 821.4666666666667, "x": "見つかりました。"}, {"t": 822.3666666666667, "x": "ESAはそれを、ほかの銀河の幽霊と呼んでいます。"}, {"t": 825.75, "x": "古い星の流れもいくつも見つかりました。"}, {"t": 828.3166666666667, "x": "いて座の方向には、小さな銀河があります。"}, {"t": 831.3666666666667, "x": "その銀河とは、いまもぶつかり合っている"}, {"t": 833.9333333333333, "x": "証拠が得られました。"}, {"t": 835.1666666666666, "x": "わし座の方向にはブラックホールが見つかりました。"}, {"t": 838.1166666666667, "x": "距離は二千光年足らず。"}, {"t": 839.8166666666667, "x": "重さは太陽の約三十三倍です。"}, {"t": 842.35, "x": "星から生まれたブラックホールです。"}, {"t": 844.35, "x": "ここまで重いものは、天の川銀河で初めてでした。"}, {"t": 847.95, "x": "近くの小さな天体も測りました。"}, {"t": 850.2833333333333, "x": "十五万個を超える小惑星について、"}, {"t": 852.7, "x": "軌道を細かく決めました。"}, {"t": 854.65, "x": "そのうち何百個かには、小さな衛星が"}, {"t": 857.5, "x": "あるかもしれないとされています。"}, {"t": 859.2333333333333, "x": "遠くでは、約百三十万個のクエーサーの"}, {"t": 862.25, "x": "立体の地図を作りました。"}, {"t": 863.9166666666666, "x": "クエーサーは、遠い銀河の中心で強く光る天体です。"}, {"t": 867.85, "x": "ESAは、ガイアの仕事をこうまとめています。"}, {"t": 870.9333333333333, "x": "数百万のクエーサーと銀河を地図にした。"}, {"t": 873.65, "x": "数十万の小惑星と彗星を追いかけた。"}, {"t": 876.5666666666667, "x": "ガイアが観測した天体は約二十億個。"}, {"t": 879.3666666666667, "x": "観測の回数は三兆回を超えます。"}, {"t": 881.9333333333333, "x": "その全部が、何もない点のまわりを"}, {"t": 884.45, "x": "回る機体から測られました。"}, {"t": 886.2, "x": "そこへ、別の望遠鏡がやって来ます。"}, {"t": 889.0333333333333, "x": "二〇二一年十二月二十五日。"}, {"t": 891.6833333333333, "x": "フランス領ギアナから、アリアン5の"}, {"t": 894.0666666666667, "x": "ロケットが打ち上げられました。"}, {"t": 895.7166666666667, "x": "載っていたのはジェイムズ・ウェッブ宇宙望遠鏡です。"}, {"t": 898.6666666666666, "x": "NASAとESAとカナダの宇宙機関による望遠鏡です。"}, {"t": 901.9333333333333, "x": "ロケットはESAが用意しました。"}, {"t": 903.9, "x": "ガイアと同じ、フランス領ギアナの射場からの出発でした。"}, {"t": 907.9333333333333, "x": "ウェッブは赤外線で空を見ます。"}, {"t": 910.0833333333334, "x": "人の目には見えない光です。"}, {"t": 911.9833333333333, "x": "赤外線は、熱を持つものから出る光です。"}, {"t": 915.35, "x": "望遠鏡そのものが温かいと、"}, {"t": 917.35, "x": "自分の熱でかすんでしまいます。"}, {"t": 919.6833333333333, "x": "ウェッブの観測装置は、零下約二百二十五度で働きます。"}, {"t": 923.9166666666666, "x": "そこまで冷やすために、ウェッブには"}, {"t": 926.1833333333333, "x": "大きな日よけが付いています。"}, {"t": 927.9, "x": "NASAは、その効き目を日焼け止めにたとえています。"}, {"t": 931.1166666666667, "x": "日焼けを防ぐ強さで言えば、百万の値に相当する。"}, {"t": 935.0166666666667, "x": "ウェッブもガイアと同じエルツーを目指しました。"}, {"t": 937.7333333333333, "x": "太陽と地球と月を、日よけ一枚の"}, {"t": 940.45, "x": "向こうに置ける場所だからです。"}, {"t": 942.1666666666666, "x": "NASAによると、ウェッブの輪は地球の影に入りません。"}, {"t": 945.7666666666667, "x": "月の影にも入りません。"}, {"t": 947.4833333333333, "x": "打ち上げのあと、ウェッブは何回か"}, {"t": 949.8333333333334, "x": "エンジンを吹かして道筋を直しました。"}, {"t": 952.1833333333333, "x": "二〇二一年十二月二十九日、"}, {"t": 954.75, "x": "NASAは一つの見通しを発表しました。"}, {"t": 957.5833333333334, "x": "ウェッブには、観測を十年より"}, {"t": 959.8166666666667, "x": "かなり長く続けられる燃料がある。"}, {"t": 961.9666666666667, "x": "もともと最低限の目標は五年でした。"}, {"t": 964.6, "x": "燃料が余った大きな理由は、打ち上げの正確さでした。"}, {"t": 968.5333333333333, "x": "ロケットは、求められた以上に"}, {"t": 970.6666666666666, "x": "正しい道筋へウェッブを送り出しました。"}, {"t": 973.2, "x": "そのため道筋を直す燃料が、"}, {"t": 975.3666666666667, "x": "予定より少なくて済んだのです。"}, {"t": 977.6666666666666, "x": "二〇二二年一月二十四日。"}, {"t": 980.05, "x": "アメリカ東部時間の午後二時のことです。"}, {"t": 982.5666666666667, "x": "ウェッブは約五分間エンジンを吹かしました。"}, {"t": 985.2, "x": "正確には二百九十七秒です。"}, {"t": 987.65, "x": "速さの変化は秒速一・六メートル。"}, {"t": 990.25, "x": "時速に直すと約五・八キロメートルです。"}, {"t": 993.15, "x": "それでウェッブはエルツーのまわりの輪に乗りました。"}, {"t": 995.9333333333333, "x": "打ち上げから三十日目でした。"}, {"t": 997.9833333333333, "x": "NASAの長官は、こう呼びかけました。"}, {"t": 1000.6666666666666, "x": "ウェッブ、ようこそわが家へ。"}, {"t": 1002.6666666666666, "x": "宇宙の謎を解き明かすことに、また一歩近づいた。"}, {"t": 1006.15, "x": "計画を率いるオークスも話しています。"}, {"t": 1008.6833333333333, "x": "私たちはいま、鏡を合わせ、"}, {"t": 1011.0666666666667, "x": "装置を動かす段階の入り口にいる。"}, {"t": 1013.8, "x": "ウェッブが点のまわりを一周するのには、"}, {"t": 1016.0833333333334, "x": "約六か月かかります。"}, {"t": 1017.9333333333333, "x": "NASAによると、その輪は"}, {"t": 1019.6833333333333, "x": "月が地球を回る軌道ほどの大きさです。"}, {"t": 1022.3, "x": "ESAの図では、ウェッブの輪は"}, {"t": 1024.2666666666667, "x": "ガイアの輪より地球に近い側にあります。"}, {"t": 1026.7666666666667, "x": "その差は平均で約十万キロメートルです。"}, {"t": 1029.6, "x": "二機の道筋には、別々の名前があります。"}, {"t": 1032.8333333333333, "x": "ガイアの道筋はリサージュ軌道と呼ばれます。"}, {"t": 1035.55, "x": "ESAの記事の言葉を借りれば、点の"}, {"t": 1038.0166666666667, "x": "まわりの曲がりくねった道です。"}, {"t": 1039.8333333333333, "x": "ウェッブの道筋はハロー軌道と呼ばれます。"}, {"t": 1042.4333333333334, "x": "ハローは、光の輪という意味の言葉です。"}, {"t": 1045.3, "x": "どちらも、中心にあるのは何もない点です。"}, {"t": 1048.3833333333334, "x": "同じ点のまわりにいても、二機が"}, {"t": 1050.6666666666667, "x": "ぶつかるほど近づくことはありません。"}, {"t": 1052.7333333333333, "x": "二機の距離は、輪の上の位置によって変わります。"}, {"t": 1055.95, "x": "近いときは四十万キロメートル。"}, {"t": 1058.1333333333334, "x": "遠いときは百十万キロメートルです。"}, {"t": 1060.5833333333333, "x": "ウェッブと地球との交信は、一日に最大二回です。"}, {"t": 1064.4166666666667, "x": "地上の三つの大きなアンテナを使います。"}, {"t": 1067.0333333333333, "x": "命令はふつう、一週間分をまとめて送り込みます。"}, {"t": 1070.7833333333333, "x": "組み立てるのは、アメリカの宇宙望遠鏡科学研究所です。"}, {"t": 1074.9333333333334, "x": "エルツーに着くと、次の作業が始まりました。"}, {"t": 1078.1333333333334, "x": "約三か月かけて鏡を合わせる作業です。"}, {"t": 1081.0166666666667, "x": "ガイアにとって、ウェッブは新しい隣人でした。"}, {"t": 1084.2333333333333, "x": "ガイアがエルツーに着いたのは、二〇一四年の初めです。"}, {"t": 1088.0, "x": "ウェッブが着いたのは、それからほぼ八年後でした。"}, {"t": 1091.25, "x": "八年のあいだ、ガイアはこの点の"}, {"t": 1093.65, "x": "近くで空を測り続けていました。"}, {"t": 1095.8333333333333, "x": "ガイアの科学者たちは、ある計算を始めます。"}, {"t": 1099.1333333333334, "x": "この隣人は、ガイアの目に入るだろうか。"}, {"t": 1102.1, "x": "ガイアは空のすべてを繰り返しなぞっています。"}, {"t": 1104.95, "x": "それなら、近くを回るウェッブもいつか帯に入るはずです。"}, {"t": 1108.75, "x": "そう気づいたのは、ガイアの"}, {"t": 1110.6, "x": "科学者のバスティアンとミニャールでした。"}, {"t": 1112.7666666666667, "x": "二人は、ウェッブがガイアの視野を"}, {"t": 1114.9, "x": "横切るかもしれないと考えました。"}, {"t": 1117.0333333333333, "x": "ウェッブがエルツーに着いたあと、"}, {"t": 1118.7333333333333, "x": "科学者たちは計算をしました。"}, {"t": 1121.0666666666666, "x": "最初の機会はいつ来るのか。"}, {"t": 1122.95, "x": "答えは二〇二二年二月十八日でした。"}, {"t": 1125.9666666666667, "x": "その日、二つの望遠鏡は約百二万キロメートル"}, {"t": 1129.55, "x": "離れていました。"}, {"t": 1130.55, "x": "二機がとりうる距離の、ほぼいちばん遠いところです。"}, {"t": 1133.9333333333334, "x": "星の見つけ役の装置は、一回二・五秒の"}, {"t": 1137.2166666666667, "x": "露出で空を撮っていました。"}, {"t": 1138.8333333333333, "x": "一回目の画像は、中央ヨーロッパ時間の"}, {"t": 1141.75, "x": "八時五十三分に撮られました。"}, {"t": 1143.7833333333333, "x": "二回目は十時三十八分。"}, {"t": 1145.75, "x": "あいだは百六・五分です。"}, {"t": 1147.6833333333334, "x": "ガイアの二つの望遠鏡が、それぞれ"}, {"t": 1150.3166666666666, "x": "同じ相手をとらえた形です。"}, {"t": 1152.2333333333333, "x": "けれども画像はすぐには見られません。"}, {"t": 1154.45, "x": "データは地球へ送られてから調べられます。"}, {"t": 1157.1166666666666, "x": "ガイアは六時間ごとに空を一回りします。"}, {"t": 1159.9166666666667, "x": "そのたびに、たくさんの点の記録がたまります。"}, {"t": 1163.05, "x": "それを待って、さらに何日かがかかりました。"}, {"t": 1166.1166666666666, "x": "候補を探すのは簡単ではありませんでした。"}, {"t": 1168.85, "x": "見つけ役が拾う点の約一割は、"}, {"t": 1171.1333333333334, "x": "本物の天体ではないからです。"}, {"t": 1173.4833333333333, "x": "見つけ役の視野の幅は、〇・四度です。"}, {"t": 1176.5666666666666, "x": "太陽系には約百万個の小惑星が知られています。"}, {"t": 1180.0833333333333, "x": "ただしウェッブの位置には、"}, {"t": 1181.45, "x": "小惑星は一つもないはずでした。"}, {"t": 1183.9833333333333, "x": "予想された位置と実際の点のずれは、約四十キロメートル。"}, {"t": 1188.1166666666666, "x": "ウェッブの軌道の予想に含まれる誤差の範囲です。"}, {"t": 1191.0833333333333, "x": "一つの天体は、少なくとも九枚の受光の板で測られます。"}, {"t": 1195.35, "x": "板から板へ移るあいだは四・八五秒です。"}, {"t": 1198.3333333333333, "x": "その数秒のうちにも、点は星とは"}, {"t": 1200.8833333333334, "x": "違って少しずつ動いていました。"}, {"t": 1202.8666666666666, "x": "ガイアの調整を担当する技術者が、その点を見つけました。"}, {"t": 1207.0333333333333, "x": "名前はマルティン・フレイタスです。"}, {"t": 1208.9333333333334, "x": "彼は仲間にこう書きました。"}, {"t": 1210.75, "x": "目標を見つけた。"}, {"t": 1212.0666666666666, "x": "メールの件名はこうでした。"}, {"t": 1213.8333333333333, "x": "JWST、捕まえた。"}, {"t": 1216.2, "x": "JWSTは、ジェイムズ・ウェッブ宇宙望遠鏡の"}, {"t": 1219.8333333333333, "x": "英語の頭文字です。"}, {"t": 1221.2166666666667, "x": "バスティアンも返事を書いています。"}, {"t": 1223.25, "x": "候補は、もうウェッブと呼び直してかまわない。"}, {"t": 1226.2, "x": "こうして、点に名前が付きました。"}, {"t": 1228.6666666666667, "x": "ガイアが見たのは、ウェッブの"}, {"t": 1230.5166666666667, "x": "大きな日よけをほぼ真横から見た姿でした。"}, {"t": 1233.2, "x": "ガイアの方向へ跳ね返る光は、ほとんどありませんでした。"}, {"t": 1237.1166666666666, "x": "そのためウェッブは、十九・三等の"}, {"t": 1239.7166666666667, "x": "暗い点としてしか写りませんでした。"}, {"t": 1241.9, "x": "一枚の画像をつくった光の粒は、千個に少し足りません。"}, {"t": 1245.9666666666667, "x": "ESAはこの画像を、二〇二二年三月十六日に公開しました。"}, {"t": 1250.7833333333333, "x": "写っているのは、星のような小さな点です。"}, {"t": 1253.85, "x": "日よけの形も、鏡の形も見えません。"}, {"t": 1256.9166666666667, "x": "大きさも分かりません。"}, {"t": 1258.35, "x": "それでも位置は分かります。"}, {"t": 1260.0333333333333, "x": "それでもこの点は、一つの機体が"}, {"t": 1262.4333333333334, "x": "別の機体を撮った記録です。"}, {"t": 1264.2, "x": "場所は、何もない点のすぐそばでした。"}, {"t": 1266.9166666666667, "x": "ESAは、その先の機会も数えていました。"}, {"t": 1270.0, "x": "ウェッブがガイアの視野を通るのは、数年のうちに数十回。"}, {"t": 1273.9166666666667, "x": "二機の望遠鏡は、おたがいを"}, {"t": 1276.0833333333333, "x": "確かめ合えるところまで来ていました。"}, {"t": 1278.2, "x": "ただ、ガイアに残された時間は、"}, {"t": 1280.55, "x": "もう長くありませんでした。"}, {"t": 1282.5166666666667, "x": "ガイアは回り続けることで空を測ります。"}, {"t": 1285.2, "x": "その回り方は、いつも同じでなければなりません。"}, {"t": 1288.6, "x": "回る速さや向きが少しでもずれると、"}, {"t": 1290.9333333333334, "x": "測った位置がずれてしまいます。"}, {"t": 1293.1166666666666, "x": "回り方を整えるのに使うのは、冷たいガスです。"}, {"t": 1296.6166666666666, "x": "ガスを少しずつ吹き出して向きを細かく直します。"}, {"t": 1299.6833333333334, "x": "燃やすのではなく、ただ吹き出すだけのガスです。"}, {"t": 1302.8666666666666, "x": "ESAによると、使う量は一日に十数グラム。"}, {"t": 1306.2833333333333, "x": "一年では、数キログラムになる計算です。"}, {"t": 1309.3833333333334, "x": "小さな量ですが、毎日減っていきます。"}, {"t": 1312.2666666666667, "x": "予定の五年が過ぎても、ガイアは観測を続けました。"}, {"t": 1315.9833333333333, "x": "期間は延ばされ、十年を超えました。"}, {"t": 1318.7666666666667, "x": "そのあいだに、ガスのタンクは空に近づいていきました。"}, {"t": 1322.3333333333333, "x": "二〇二五年一月十日。"}, {"t": 1324.45, "x": "ガイアは、狙いを決めた最後の観測をしました。"}, {"t": 1327.8666666666666, "x": "相手は、はくちょう座六十一番星です。"}, {"t": 1330.8666666666666, "x": "二つの星が組になった連星です。"}, {"t": 1333.2, "x": "十九世紀の天文学者たちが、この星に注目しました。"}, {"t": 1337.4, "x": "星の動きと星までの距離を測った、"}, {"t": 1339.7166666666667, "x": "最初期の例の一つになった星です。"}, {"t": 1342.3666666666666, "x": "星までの距離を測るために生まれたガイア。"}, {"t": 1344.95, "x": "その最後の相手が、この星でした。"}, {"t": 1347.6333333333334, "x": "十九世紀の測定と、二十一世紀の測定。"}, {"t": 1351.1833333333334, "x": "同じ星が、二つの時代をつないだ形です。"}, {"t": 1354.4333333333334, "x": "そして二〇二五年一月十五日。"}, {"t": 1357.1, "x": "ESAで科学部門を率いるマンデルが発表しました。"}, {"t": 1360.35, "x": "今日で科学の観測は終わる。"}, {"t": 1362.25, "x": "ガイアの運用を率いてきたのはランマースです。"}, {"t": 1364.9666666666667, "x": "彼は、引退を前にしたガイアをこう表しました。"}, {"t": 1368.5, "x": "星々の中で、輝いている。"}, {"t": 1370.8833333333334, "x": "打ち上げから十一年あまり。"}, {"t": 1372.8166666666666, "x": "初めに見込まれていた期間の、ほぼ二倍です。"}, {"t": 1376.0333333333333, "x": "観測の回数は三兆回を超えました。"}, {"t": 1378.7166666666667, "x": "測ったのは位置だけではありません。"}, {"t": 1380.7666666666667, "x": "明るさの変わり方も測りました。"}, {"t": 1382.9166666666667, "x": "星が何でできているかの手がかりも集めました。"}, {"t": 1385.8, "x": "計画の科学者のザールマンは、こう話しています。"}, {"t": 1389.2833333333333, "x": "これからは、みなの目が次のデータ公開の準備に向かう。"}, {"t": 1393.1166666666666, "x": "観測が終わっても、ガイアにはまだ仕事がありました。"}, {"t": 1396.6166666666666, "x": "数週間の技術の試験です。"}, {"t": 1398.6833333333334, "x": "十年を超えて宇宙にいた機体で、"}, {"t": 1400.7666666666667, "x": "ガスを細かく吹き出す装置がどう動くか。"}, {"t": 1403.6833333333334, "x": "厳しい条件の中で、それを確かめました。"}, {"t": 1406.8333333333333, "x": "試験の結果で、測定の調整が"}, {"t": 1409.25, "x": "さらに良くなるかもしれませんでした。"}, {"t": 1411.3, "x": "その試験が終わると、最後の仕事が残ります。"}, {"t": 1414.6333333333334, "x": "エルツーのまわりを離れることです。"}, {"t": 1416.75, "x": "ESAの説明では、燃料が無ければ"}, {"t": 1419.3666666666666, "x": "エルツーのまわりの輪は保てません。"}, {"t": 1421.3, "x": "保てない機体は、やがて輪から外れていきます。"}, {"t": 1424.5166666666667, "x": "近くにはウェッブがいます。"}, {"t": 1426.1666666666667, "x": "二〇二三年七月一日には、ESAの"}, {"t": 1429.3166666666666, "x": "ユークリッドも打ち上げられていました。"}, {"t": 1431.3666666666666, "x": "ユークリッドもエルツーで観測する望遠鏡です。"}, {"t": 1434.4166666666667, "x": "打ち上げの場所はアメリカのフロリダ州でした。"}, {"t": 1437.1333333333334, "x": "ロケットはスペースXのファルコン9です。"}, {"t": 1439.8166666666666, "x": "止まったガイアが漂えば、ほかの"}, {"t": 1442.1, "x": "機体のじゃまになるかもしれません。"}, {"t": 1444.0, "x": "だから燃料が残っているうちに、"}, {"t": 1445.9333333333334, "x": "自分の力で離れる必要がありました。"}, {"t": 1448.7666666666667, "x": "二〇二五年三月七日。"}, {"t": 1450.8, "x": "ガイアは最初の噴射をしました。"}, {"t": 1452.8833333333334, "x": "エルツーのまわりを離れるための噴射です。"}, {"t": 1455.4333333333334, "x": "二回目の、そして最後の噴射は三月二十七日でした。"}, {"t": 1459.55, "x": "行き先は太陽を回る軌道です。"}, {"t": 1461.7333333333333, "x": "ほかのエルツーの機体からも、地球からも離れた道筋です。"}, {"t": 1465.7833333333333, "x": "この軌道には条件がありました。"}, {"t": 1467.8666666666666, "x": "少なくともこの先百年は、地球に"}, {"t": 1470.55, "x": "一千万キロメートルより近づかない。"}, {"t": 1472.7333333333333, "x": "その可能性をできるだけ小さくする道筋が選ばれました。"}, {"t": 1476.4166666666667, "x": "一千万キロメートルは、エルツーまでの"}, {"t": 1479.0666666666666, "x": "距離の六倍あまりです。"}, {"t": 1480.5333333333333, "x": "ただ、遠くへ送るだけでは足りませんでした。"}, {"t": 1483.5, "x": "ガイアには、ある性質があったからです。"}, {"t": 1486.2333333333333, "x": "ガイアは、故障が起きても自分で"}, {"t": 1488.5333333333333, "x": "立ち直るよう .0666666666666, "x": "ハーシェルとプランクも、ガイアもそうでした。"}, {"t": 1709.8, "x": "どの機体も、点に"}, {"t": 1711.25, "x": "何かを置いていくことはありませんでした。"}, {"t": 1713.5833333333333, "x": "置いていったのは、点のまわりで測った記録だけです。"}, {"t": 1716.9833333333333, "x": "その記録は、電波になって地球へ届きました。"}, {"t": 1720.2333333333333, "x": "エルツーは、とどまる場所ではありません。"}, {"t": 1722.8333333333333, "x": "働くあいだだけ借りる場所です。"}, {"t": 1724.8833333333334, "x": "二〇二二年二月、ガイアは隣の望遠鏡を写しました。"}, {"t": 1729.25, "x": "写したのは、千個に足りない光の粒でした。"}, {"t": 1732.4333333333334, "x": "画像には、日よけを真横から見た小さな点が残りました。"}, {"t": 1736.3833333333334, "x": "撮ったガイアは、三年後に自分の"}, {"t": 1738.75, "x": "噴射でエルツーを離れました。"}, {"t": 1740.5333333333333, "x": "記憶の一部には、約千五百人の名前と"}, {"t": 1743.6, "x": "別れの言葉が残されました。"}, {"t": 1745.4333333333334, "x": "その記憶を読み出す命令は、もう届きません。"}, {"t": 1748.7166666666667, "x": "名前は、ガイアと一緒に太陽の"}, {"t": 1751.1166666666666, "x": "まわりへ運ばれていきました。"}, {"t": 1752.7833333333333, "x": "地上には、三兆回を超える観測が残りました。"}, {"t": 1756.3833333333334, "x": "その数字は、まだ全部は公開されていません。"}, {"t": 1759.6333333333334, "x": "四回目の公開は、二〇二六年十二月の予定です。"}, {"t": 1763.7833333333333, "x": "ガイアが測った星の動き。"}, {"t": 1765.6166666666666, "x": "それはこれから何年もかけて、"}, {"t": 1767.4666666666667, "x": "数字の表になって出てきます。"}, {"t": 1769.6166666666666, "x": "一方、エルツーの真ん中は何も変わっていません。"}, {"t": 1773.0333333333333, "x": "一七七二年の論文が、計算で示した位置です。"}, {"t": 1777.2166666666667, "x": "目印になる石一つありません。"}, {"t": 1779.4, "x": "ダブリューマップが来ても、ガイアが来ても同じでした。"}, {"t": 1782.7, "x": "そこには何も置かれませんでした。"}, {"t": 1784.7666666666667, "x": "ウェッブが来たあとも同じです。"}, {"t": 1786.55, "x": "機体はいつも、点から離れた輪の上を回りました。"}, {"t": 1790.05, "x": "これからも、新しい望遠鏡がこの輪へやって来るはずです。"}, {"t": 1794.05, "x": "約二百五十年前に紙の上に書かれた一つの点。"}, {"t": 1797.4166666666667, "x": "そのまわりを、望遠鏡は大きな輪を描いて回ります。"}, {"t": 1801.2, "x": "輪の真ん中は、からっぽのままです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
