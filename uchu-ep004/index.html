33333, "x": "ガリレオ█"}, {"t": 10.833333333333334, "x": "四百年あまり前に、望遠鏡でこの衛星たちを"}, {"t": 14.45, "x": "見つけた天文学者の名前をもらった探査機です。"}, {"t": 17.383333333333333, "x": "一九八九年に打ち上げられ、一九九五年の"}, {"t": 21.783333333333335, "x": "十二月から木星のまわりを回っていた探査機です。"}, {"t": 24.95, "x": "回った数は三十四周。"}, {"t": 26.8, "x": "燃料は、残りわずかになっていました。"}, {"t": 29.533333333333335, "x": "壊れたから落ちたのではありません。"}, {"t": 31.6, "x": "落とすと決めたのは、地上の運用チームでした。"}, {"t": 34.733333333333334, "x": "理由は、この探査機が自分で見つけたものにあります。"}, {"t": 38.31666666666667, "x": "木星の衛星の一つ、エウロパ。"}, {"t": 40.06666666666667, "x": "エウロパ█"}, {"t": 41.03333333333333, "x": "その氷の下に、塩を含んだ液体の水の層があるらしい。"}, {"t": 45.18333333333333, "x": "その証拠を集めたのが、ほかならぬこの探査機でした。"}, {"t": 48.75, "x": "燃料が尽きれば、探査機は向きも"}, {"t": 51.18333333333333, "x": "軌道も変えられなくなります。"}, {"t": 52.88333333333333, "x": "そのまま木星のまわりを漂い続ければ、"}, {"t": 55.53333333333333, "x": "いつかエウロパにぶつかるかもしれません。"}, {"t": 58.166666666666664, "x": "機体には、地球から連れてきた微生物が"}, {"t": 61.03333333333333, "x": "ついているかもしれません。"}, {"t": 62.483333333333334, "x": "それを避ける方法は、一つでした。"}, {"t": 65.08333333333333, "x": "ぶつかっても困らない場所に、"}, {"t": 66.75, "x": "先に落としてしまうことです。"}, {"t": 68.86666666666666, "x": "こうして、エウロパの海の手がかりを持ち帰った機械は、"}, {"t": 72.53333333333333, "x": "その海を守るために、自分から消えました。"}, {"t": 75.86666666666666, "x": "エウロパの表面の写真はあります。"}, {"t": 78.06666666666666, "x": "ひびだらけの、白い氷の写真です。"}, {"t": 80.83333333333333, "x": "けれど、その下にあるとされる海を"}, {"t": 83.25, "x": "写した写真は、一枚もありません。"}, {"t": 85.76666666666667, "x": "一九七二年に、最初の探査機が"}, {"t": 88.86666666666666, "x": "木星へ向けて地球を離れてから、五十四年。"}, {"t": 91.16666666666667, "x": "五十四年█"}, {"t": 92.1, "x": "人類がエウロパの表面に降ろした"}, {"t": 94.15, "x": "機械は、まだ一つもありません。"}, {"t": 96.38333333333334, "x": "この回では、その理由を、記録の順にたどります。"}, {"t": 100.18333333333334, "x": "何が分かっていて、何が分かっていないのか。"}, {"t": 103.25, "x": "そして、なぜ降りないのか、なぜ降りられないのかを。"}, {"t": 107.1, "x": "最初にエウロパを見た人間は、"}, {"t": 109.06666666666666, "x": "それを、光の点として見ました。"}, {"t": 111.76666666666667, "x": "一六一〇年の一月、イタリアのガリレオ・"}, {"t": 111.76666666666667, "x": "一六一〇年█"}, {"t": 114.35, "x": "ガリレオ・ガリレイ█"}, {"t": 115.43333333333334, "x": "ガリレイは、自分で作った望遠鏡を木星に向け、"}, {"t": 119.45, "x": "そのそばに並ぶ小さな光に気づきました。"}, {"t": 122.86666666666666, "x": "彼は一月七日から三月六日まで、"}, {"t": 125.36666666666666, "x": "ほとんど毎晩、木星を見続けています。"}, {"t": 128.68333333333334, "x": "光は夜ごとに位置を変え、木星の"}, {"t": 131.21666666666667, "x": "右に出たり、左に出たりしました。"}, {"t": 133.73333333333332, "x": "数が減る夜もありました。"}, {"t": 135.45, "x": "木星の後ろに隠れたか、前を横切っていたからです。"}, {"t": 139.23333333333332, "x": "星ではない。"}, {"t": 140.16666666666666, "x": "木星のまわりを回っているものだ。"}, {"t": 142.33333333333334, "x": "彼はそう結論し、同じ年の三月に"}, {"t": 145.26666666666668, "x": "出した『星界の報告』に書き残しています。"}, {"t": 148.88333333333333, "x": "見つかった光は四つ。"}, {"t": 150.45, "x": "いまガリレオ衛星と呼ばれる、"}, {"t": 152.23333333333332, "x": "イオ、エウロパ、ガニメデ、カリストです。"}, {"t": 156.06666666666666, "x": "いまでは木星の衛星はずっと多く知られていますが、"}, {"t": 159.2, "x": "エウロパは、その中で四番目に大きく、木星に"}, {"t": 163.31666666666666, "x": "近いほうから数えて六番目を回っています。"}, {"t": 166.01666666666668, "x": "エウロパという名前をつけたのは、"}, {"t": 167.9, "x": "ガリレオではありません。"}, {"t": 169.58333333333334, "x": "ドイツの天文学者シモン・マリウスが、"}, {"t": 171.76666666666668, "x": "ギリシャ神話に出てくる女性の名前をあてました。"}, {"t": 174.98333333333332, "x": "ガリレオ自身はこの名前を使わず、番号で呼びました。"}, {"t": 178.83333333333334, "x": "エウロパは「木星の二番目」でした。"}, {"t": 181.9, "x": "マリウスの名前が広く使われるようになったのは、"}, {"t": 184.71666666666667, "x": "二十世紀の半ばになってからだとされています。"}, {"t": 187.81666666666666, "x": "それから三百六十年あまり、エウロパは、点のままでした。"}, {"t": 192.33333333333334, "x": "変化は、光を色ごとに分けて調べる観測から来ました。"}, {"t": 196.26666666666668, "x": "一九七二年、アメリカ・アリゾナ州の"}, {"t": 196.26666666666668, "x": "一九七二年█"}, {"t": 199.46666666666667, "x": "キットピーク国立天文台で、エウロパの"}, {"t": 202.35, "x": "光を分けて調べたところ、表面のほとんどが"}, {"t": 205.46666666666667, "x": "水の氷でできていることが分かりました。"}, {"t": 207.88333333333333, "x": "点の正体は、氷の球でした。"}, {"t": 210.48333333333332, "x": "同じ一九七二年の三月二日、"}, {"t": 213.0, "x": "パイオニア十号█"}, {"t": 213.56666666666666, "x": "パイオニア十号が打ち上げられます。"}, {"t": 216.28333333333333, "x": "火星の軌道より外へ行くことを"}, {"t": 218.13333333333333, "x": "前提に作られた、初めての探査機でした。"}, {"t": 221.15, "x": "一九七三年十二月三日、パイオニア十号は、木星から"}, {"t": 226.35, "x": "約十三万二千キロメートルのところを通り過ぎます。"}, {"t": 229.6, "x": "このとき、衛星イオを撮った画像が一枚、"}, {"t": 232.63333333333333, "x": "木星のまわりの強い放射線のために"}, {"t": 235.33333333333334, "x": "失われた、とNASAは記録しています。"}, {"t": 237.88333333333333, "x": "木星のまわりがどういう場所なのか。"}, {"t": 240.16666666666666, "x": "人類が最初に受け取った知らせの一つは、"}, {"t": 242.68333333333334, "x": "失われた一枚の写真でした。"}, {"t": 245.06666666666666, "x": "エウロパの姿がはっきりしたのは、その六年後です。"}, {"t": 248.58333333333334, "x": "一九七九年、ボイジャー一号と"}, {"t": 248.58333333333334, "x": "一九七九年█"}, {"t": 251.7, "x": "二号が相次いで木星を通過しました。"}, {"t": 254.13333333333333, "x": "一号がいちばん木星に近づいたのは三月四日。"}, {"t": 257.4166666666667, "x": "二号がエウロパにいちばん近づいたのは、七月九日でした。"}, {"t": 261.48333333333335, "x": "送られてきた画像には、白い球の上を、"}, {"t": 264.35, "x": "細い筋が縦横に走っていました。"}, {"t": 266.9166666666667, "x": "NASAの画像の説明は、この筋模様を、"}, {"t": 269.75, "x": "外側の殻が割れ、そこを内側から来た物質が"}, {"t": 273.55, "x": "埋めたあとだ、と書いています。"}, {"t": 275.46666666666664, "x": "そして、もう一つ。"}, {"t": 277.18333333333334, "x": "クレーターが、ほとんどありませんでした。"}, {"t": 279.8333333333333, "x": "隣のガニメデやカリストは、"}, {"t": 281.55, "x": "隕石がぶつかった跡だらけです。"}, {"t": 283.8833333333333, "x": "エウロパだけが、つるりとしていました。"}, {"t": 286.43333333333334, "x": "クレーターが少ないということは、"}, {"t": 288.26666666666665, "x": "表面が新しいということです。"}, {"t": 290.6333333333333, "x": "いまのNASAの資料では、エウロパの表面は、"}, {"t": 293.6, "x": "古くても四千万年から九千万年ほどとされています。"}, {"t": 297.46666666666664, "x": "四十五億年ほど前からある天体にとって、それはつい最近、"}, {"t": 301.71666666666664, "x": "塗り直されたばかりだ、ということになります。"}, {"t": 305.03333333333336, "x": "何が、塗り直しているのか。"}, {"t": 307.28333333333336, "x": "一九七九年のボイジャーの画像説明には、"}, {"t": 310.68333333333334, "x": "すでに、ひとつの見立てが書かれていました。"}, {"t": 313.75, "x": "表面が平らで地形に起伏が少ないのは、"}, {"t": 316.3333333333333, "x": "表面から数キロメートル下が、若くて"}, {"t": 319.45, "x": "温かいからではないか、というものです。"}, {"t": 322.15, "x": "氷の下に、何かがある。"}, {"t": 324.31666666666666, "x": "その見立ては、ここから始まりました。"}, {"t": 326.96666666666664, "x": "氷の下に海があるかどうかを確かめるには、ふつうに"}, {"t": 330.43333333333334, "x": "考えれば、氷を掘るか、氷の下を撮るしかありません。"}, {"t": 334.6666666666667, "x": "どちらも、まだ誰もしていません。"}, {"t": 337.0, "x": "それでも、いま多くの研究者は、"}, {"t": 339.45, "x": "エウロパの氷の下に塩水の海があることを、"}, {"t": 342.53333333333336, "x": "ほぼ確かなものとして扱っています。"}, {"t": 345.06666666666666, "x": "NASAの資料にも、科学者たちは"}, {"t": 347.31666666666666, "x": "ほぼ確信している、と書かれています。"}, {"t": 349.9166666666667, "x": "写真が一枚もないのに、なぜそう言えるのか。"}, {"t": 353.1666666666667, "x": "手がかりの中心は、序章の探査機、"}, {"t": 355.93333333333334, "x": "ガリレオが積んでいた磁力計でした。"}, {"t": 358.4, "x": "ガリレオは一九八九年十月十八日、スペースシャトル・"}, {"t": 359.18333333333334, "x": "一九八九年十月十八日█"}, {"t": 363.28333333333336, "x": "アトランティスから打ち上げられました。"}, {"t": 365.35, "x": "途中で、大きなつまずきがありました。"}, {"t": 368.0833333333333, "x": "一九九一年、傘のように開くはずだった"}, {"t": 371.7, "x": "大きなアンテナが、開ききらなかったのです。"}, {"t": 374.5, "x": "十八本ある骨のうち、おそらく三本が、摩擦で"}, {"t": 378.3666666666667, "x": "閉じたまま動かなくなった、とNASAは記録しています。"}, {"t": 381.71666666666664, "x": "このアンテナは、たくさんの"}, {"t": 383.46666666666664, "x": "データを地球へ送るためのものでした。"}, {"t": 385.71666666666664, "x": "運用チームは、小さな予備のアンテナで送れるように、"}, {"t": 389.15, "x": "地上の受信設備を強化し、機体のソフトウェアを"}, {"t": 392.8833333333333, "x": "作り直して、ミッションを続けました。"}, {"t": 395.5, "x": "送れるデータの量は大きく減りました。"}, {"t": 397.8833333333333, "x": "どれだけの画像を撮り、どれだけを諦めたのか。"}, {"t": 401.18333333333334, "x": "その全体を一次資料で数え直すことは、"}, {"t": 403.93333333333334, "x": "今回できていません。"}, {"t": 405.5833333333333, "x": "それでもガリレオは、一九九五年十二月七日に"}, {"t": 409.5, "x": "木星のまわりの軌道に入り、"}, {"t": 411.4, "x": "エウロパのそばを何度も通り過ぎました。"}, {"t": 414.1, "x": "木星は、強い磁場をまとっています。"}, {"t": 416.81666666666666, "x": "NASAによれば、地球の磁場のおよそ二万倍です。"}, {"t": 420.0833333333333, "x": "しかも、その磁場の向きは、エウロパのいる"}, {"t": 423.0833333333333, "x": "場所から見ると、五時間半ごとに入れ替わります。"}, {"t": 426.26666666666665, "x": "ここに、ひとつの仕掛けがあります。"}, {"t": 428.6333333333333, "x": "もし、エウロパの内側に、電気を通すものが"}, {"t": 432.18333333333334, "x": "広い層になって存在していれば、外の磁場の"}, {"t": 435.21666666666664, "x": "向きが変わるたびに、その層に電流が流れます。"}, {"t": 438.46666666666664, "x": "そうするとエウロパ自身が、"}, {"t": 440.06666666666666, "x": "小さな磁石のようにふるまうはずです。"}, {"t": 442.7, "x": "しかもその磁石の向きは、外の"}, {"t": 444.95, "x": "磁場に合わせて、ひっくり返るはずです。"}, {"t": 447.6, "x": "氷は、電気をほとんど通しません。"}, {"t": 450.28333333333336, "x": "けれど、塩を溶かした水は、かなりよく電気を通します。"}, {"t": 454.46666666666664, "x": "二〇〇〇年一月三日、ガリレオは、この違いを"}, {"t": 454.46666666666664, "x": "二〇〇〇年一月三日█"}, {"t": 458.1, "x": "見分けられる向きで、エウロパのそばを通過しました。"}, {"t": 461.46666666666664, "x": "エウロパがもともと持っている磁石なのか。"}, {"t": 463.9, "x": "外の磁場に応じて生まれる磁石なのか。"}, {"t": 466.46666666666664, "x": "測った結果は、後者でした。"}, {"t": 468.7, "x": "エウロパの磁石の北の向きは、"}, {"t": 470.51666666666665, "x": "外の磁場に合わせて反転していました。"}, {"t": 473.18333333333334, "x": "一週間後の一月十日、NASAはこの結果を発表します。"}, {"t": 477.3833333333333, "x": "研究を率いたマーガレット・キヴェルソンは、"}, {"t": 478.3, "x": "マーガレット・キヴェルソン█"}, {"t": 480.06666666666666, "x": "エウロパの表面の下に液体の水の層が"}, {"t": 483.35, "x": "たしかにあることを示していると思う、と述べました。"}, {"t": 486.96666666666664, "x": "同じ年の八月、結果は学術誌『サイエンス』に"}, {"t": 491.53333333333336, "x": "論文として載りました。"}, {"t": 492.9, "x": "ただし、この方法で分かるのは、電気を"}, {"t": 496.0833333333333, "x": "通す層がある、というところまでです。"}, {"t": 498.6333333333333, "x": "深さについて、NASAの発表は、"}, {"t": 501.0, "x": "表面から約百キロメートルまでの"}, {"t": 503.45, "x": "外側のどこか、としか言っていません。"}, {"t": 506.0, "x": "二十一世紀に入ると、別の方向からの"}, {"t": 509.06666666666666, "x": "手がかりが加わります。"}, {"t": 510.48333333333335, "x": "二〇一三年、ハッブル宇宙望遠鏡の紫外線の"}, {"t": 514.05, "x": "観測から、エウロパの南極のあたりで、水蒸気が"}, {"t": 517.85, "x": "噴き上がっている可能性が報告されました。"}, {"t": 520.4, "x": "二〇一六年には、別のチームが別の方法でハッブルを使い、"}, {"t": 524.7, "x": "十五か月のあいだに十回観測して、そのうち三回、"}, {"t": 528.8166666666667, "x": "噴き出しらしいものをとらえた、と発表しました。"}, {"t": 532.2333333333333, "x": "高さは、およそ二百キロメートルと見積もられています。"}, {"t": 535.8, "x": "けれど、NASAはその発表の中で、"}, {"t": 538.2333333333333, "x": "この噴き出しは確認されていない、と書いています。"}, {"t": 541.7833333333333, "x": "二つのチームが、同じときに同じものを"}, {"t": 544.5666666666667, "x": "とらえたことは、まだありません。"}, {"t": 546.6333333333333, "x": "出たり、出なかったりするように見えるのです。"}, {"t": 549.6166666666667, "x": "二〇一九年十一月には、NASAが率いる"}, {"t": 552.7, "x": "国際チームが、地上の望遠鏡を使って、"}, {"t": 555.8, "x": "エウロパの表面の上に水蒸気があることを、"}, {"t": 558.7666666666667, "x": "初めて直接とらえた、と発表しました。"}, {"t": 561.9833333333333, "x": "それでも、噴き出しがいつ、どこから、どれくらいの"}, {"t": 565.8166666666667, "x": "頻度で出ているのかは、いまも決まっていません。"}, {"t": 568.7333333333333, "x": "もし噴き出しが確かなら、氷を掘らなくても、"}, {"t": 571.7666666666667, "x": "宇宙に出てきた海の水を調べられるかもしれない。"}, {"t": 575.1333333333333, "x": "この点が、のちに、着陸機の運命にも関わってきます。"}, {"t": 579.3833333333333, "x": "二〇二三年九月には、ジェイムズ・ウェッブ宇宙望遠鏡が、"}, {"t": 579.3833333333333, "x": "二〇二三年九月█"}, {"t": 583.8166666666667, "x": "エウロパの表面に二酸化炭素を見つけました。"}, {"t": 587.1666666666666, "x": "いちばん多かったのは、タラ・レジオと呼ばれる地域です。"}, {"t": 588.7833333333333, "x": "タラ・レジオ█"}, {"t": 591.15, "x": "表面が割れて崩れ、作り直されたような、"}, {"t": 594.1666666666666, "x": "カオス地形と呼ばれる場所です。"}, {"t": 596.3166666666667, "x": "同じ場所では、以前にハッブルが、"}, {"t": 598.6666666666666, "x": "海から来たと考えられる塩を見つけていました。"}, {"t": 601.9, "x": "研究者は、表面の炭素が海から来た、という"}, {"t": 605.4833333333333, "x": "観測上の証拠がある、と述べています。"}, {"t": 608.3166666666667, "x": "炭素は、生き物にとって欠かせない元素です。"}, {"t": 611.4333333333333, "x": "ただし、炭素があることは、"}, {"t": 613.4333333333333, "x": "生き物がいることを意味しません。"}, {"t": 615.6666666666666, "x": "磁場の反転。"}, {"t": 616.6666666666666, "x": "噴き出しの可能性。"}, {"t": 618.0333333333333, "x": "表面に出てきた塩と炭素。"}, {"t": 620.0, "x": "どれも、海を直接見たものではありません。"}, {"t": 623.0, "x": "海があるなら、こう見えるはずだ、という"}, {"t": 625.8333333333334, "x": "形が、何本も重なっている。"}, {"t": 628.1666666666666, "x": "エウロパの海は、いまそういう状態にあります。"}, {"t": 631.3166666666667, "x": "エウロパの直径は、赤道で約三千百キロメートルです。"}, {"t": 635.3666666666667, "x": "地球の月の、およそ九割の大きさしかありません。"}, {"t": 638.9333333333333, "x": "それなのに、NASAの資料には、その海には"}, {"t": 642.2833333333333, "x": "地球の海をすべて合わせた量の、およそ二倍の"}, {"t": 644.4666666666667, "x": "およそ二倍の水█"}, {"t": 645.65, "x": "水があるかもしれない、と書かれています。"}, {"t": 648.45, "x": "小さな天体に多くの水が入るのは、海が深いからです。"}, {"t": 652.5, "x": "NASAの見積もりでは、氷の殻の厚さが"}, {"t": 655.2833333333333, "x": "十五キロメートルから二十五キロメートル。"}, {"t": 657.6833333333333, "x": "その下の海の深さが、六十キロメートルから"}, {"t": 660.8166666666667, "x": "百五十キロメートルです。"}, {"t": 662.4166666666666, "x": "天体の外側が、丸ごと水でできている、と言ってもいい"}, {"t": 666.55, "x": "形です。"}, {"t": 667.2666666666667, "x": "「二倍」という数字は、この深さの"}, {"t": 670.0333333333333, "x": "見積もりから出てきたものです。"}, {"t": 671.7333333333333, "x": "海の深さそのものは、測られたものではありません。"}, {"t": 675.1166666666667, "x": "幅のある推定です。"}, {"t": 676.5666666666667, "x": "二倍という数字にも、同じだけの幅があります。"}, {"t": 679.8833333333333, "x": "二〇二五年十二月、この見積もりのうち、"}, {"t": 679.8833333333333, "x": "二〇二五年十二月█"}, {"t": 683.1666666666666, "x": "氷の厚さについて、新しい数字が出ました。"}, {"t": 686.8666666666667, "x": "測ったのは、木星を回っている別の探査機、ジュノーです。"}, {"t": 690.4666666666667, "x": "ジュノー█"}, {"t": 691.7333333333333, "x": "ジュノーは二〇二二年九月二十九日、エウロパの"}, {"t": 695.3166666666667, "x": "表面から約三百六十キロメートルのところを"}, {"t": 698.2166666666667, "x": "通過し、マイクロ波放射計という装置で、"}, {"t": 701.1833333333333, "x": "氷の中から出てくる電波を測りました。"}, {"t": 704.05, "x": "見えていたのは、エウロパの表面のおよそ半分です。"}, {"t": 707.5166666666667, "x": "それまで、氷の厚さの見立ては、"}, {"t": 709.9666666666667, "x": "研究者によって大きく割れていました。"}, {"t": 712.65, "x": "薄いとする考えでは一キロメートルに満たず、"}, {"t": 715.4, "x": "厚いとする考えでは数十キロメートル。"}, {"t": 718.3333333333334, "x": "薄ければ、いつか掘り抜けるかもしれない。"}, {"t": 721.1333333333333, "x": "厚ければ、それは難しい。"}, {"t": 723.3833333333333, "x": "どちらなのかで、降りたあとに"}, {"t": 725.3666666666667, "x": "何ができるかが大きく変わります。"}, {"t": 727.4166666666666, "x": "NASAの発表は、ジュノーの測定が、"}, {"t": 729.9166666666666, "x": "この二つを初めて見分けたものだとしています。"}, {"t": 733.0166666666667, "x": "学術誌『ネイチャー・アストロノミー』に"}, {"t": 736.2333333333333, "x": "載った結果は、二十九キロメートルでした。"}, {"t": 737.2333333333333, "x": "二十九キロメートル█"}, {"t": 739.35, "x": "誤差は、プラスマイナス十キロメートル。"}, {"t": 742.0166666666667, "x": "氷に塩が混じっていれば、数キロ"}, {"t": 744.55, "x": "薄くなる可能性がある、とされています。"}, {"t": 747.2333333333333, "x": "研究チームの説明によれば、この数字は、純粋な水の"}, {"t": 751.6, "x": "氷を仮定したときの、冷たく硬い外側の層の厚さです。"}, {"t": 755.6333333333333, "x": "同じ観測で、氷の表面近くに、数センチほどの"}, {"t": 759.65, "x": "割れ目やすき間が、数百メートルの深さまで"}, {"t": 762.5333333333333, "x": "散らばっていることも分かりました。"}, {"t": 764.3333333333334, "x": "ただ、その大きさと浅さから見て、表面から海へ、"}, {"t": 768.1, "x": "酸素や栄養分を運ぶ主な通り道にはなりそうにない、と"}, {"t": 772.3833333333333, "x": "研究チームは書いています。"}, {"t": 774.0666666666667, "x": "二十九キロメートル。"}, {"t": 775.5666666666667, "x": "それが、海の上にかぶさっている蓋の厚さの、"}, {"t": 778.6666666666666, "x": "いまのところ最も新しい見積もりです。"}, {"t": 781.5333333333333, "x": "NASAのそれまでの見積もりの、"}, {"t": 783.1833333333333, "x": "いちばん厚い値より、さらに厚い数字でした。"}, {"t": 786.9, "x": "では、なぜその下の水は、凍らないのか。"}, {"t": 790.2833333333333, "x": "木星は、太陽から約七億八千万キロメートル、"}, {"t": 793.9666666666667, "x": "地球と太陽の距離のおよそ五・二倍のところにあります。"}, {"t": 797.8, "x": "エウロパの表面の温度は、いちばん暖かいところでも、"}, {"t": 801.3833333333333, "x": "マイナス百六十度を上回りません。"}, {"t": 804.05, "x": "太陽の光は、地球で受ける光の"}, {"t": 806.6833333333333, "x": "二十五分の一ほどの弱さです。"}, {"t": 808.7, "x": "太陽を出た光がエウロパに届くまでに、"}, {"t": 811.2, "x": "約四十五分かかります。"}, {"t": 813.25, "x": "空気と呼べるものはほとんどなく、"}, {"t": 815.15, "x": "酸素のごく薄い大気があるだけです。"}, {"t": 817.7333333333333, "x": "太陽の熱だけで、海を溶かしておくことはできません。"}, {"t": 821.3666666666667, "x": "熱のもとは、木星の重力だと考えられています。"}, {"t": 825.0833333333334, "x": "エウロパは、木星から"}, {"t": 826.7666666666667, "x": "約六十七万一千キロメートルのところを、"}, {"t": 829.5333333333333, "x": "およそ三日半で一周しています。"}, {"t": 831.95, "x": "そして、隣の衛星と、決まったリズムで回っています。"}, {"t": 836.1, "x": "ガニメデが一周するあいだに、"}, {"t": 837.8666666666667, "x": "エウロパは二周、イオは四周します。"}, {"t": 840.9666666666667, "x": "このリズムがあるために、エウロパの軌道は、"}, {"t": 843.7666666666667, "x": "きれいな円になりきらず、木星に近づいたり、"}, {"t": 847.25, "x": "離れたりを繰り返す、と考えられています。"}, {"t": 850.6833333333333, "x": "近づくと、木星の重力はエウロパを"}, {"t": 853.4333333333333, "x": "強く引き伸ばし、離れるとゆるめます。"}, {"t": 856.1833333333333, "x": "天体全体が、わずかに押しつぶされては戻る。"}, {"t": 859.5166666666667, "x": "そのとき内側で生まれる熱が、"}, {"t": 861.4666666666667, "x": "氷を下から温め続けている、というのが、"}, {"t": 864.8666666666667, "x": "いま広く受け入れられている説明です。"}, {"t": 867.4833333333333, "x": "地球の二倍の水。"}, {"t": 868.9166666666666, "x": "それを包む、二十九キロメートルの氷。"}, {"t": 872.0666666666667, "x": "そのどちらも、一度も、目で見られたことはありません。"}, {"t": 875.8666666666667, "x": "エウロパに降りるのが難しい理由として、"}, {"t": 878.3333333333334, "x": "まず挙げられるのは、遠さでも、寒さでもありません。"}, {"t": 882.4, "x": "放射線です。"}, {"t": 882.4, "x": "放射線█"}, {"t": 883.9833333333333, "x": "木星の強い磁場は、まわりを飛ぶ電気を帯びた粒子を"}, {"t": 887.6333333333333, "x": "捕まえ、とてつもない速さで振り回しています。"}, {"t": 890.7166666666667, "x": "NASAの説明によれば、木星の"}, {"t": 893.0, "x": "まわりは、太陽そのものを除けば、"}, {"t": 895.4, "x": "太陽系でいちばん激しい放射線の環境です。"}, {"t": 898.8333333333334, "x": "エウロパは、そのまっただ中を回っています。"}, {"t": 901.7666666666667, "x": "エウロパの表面に立った人間が、一日に浴びる"}, {"t": 905.0833333333334, "x": "放射線の量は、およそ五・四シーベルト。"}, {"t": 908.2166666666667, "x": "そういう数字が、広く引用されています。"}, {"t": 911.2, "x": "人間が一度に浴びれば、重い病気や"}, {"t": 913.8666666666667, "x": "死につながるとされる量です。"}, {"t": 915.6, "x": "ただ、この数字が、どの観測や計算から出たものなのか。"}, {"t": 919.9, "x": "今回、一次資料でたどることはできていません。"}, {"t": 923.2, "x": "ここでは、よく引かれる目安として扱います。"}, {"t": 926.3333333333334, "x": "一次資料ではっきりしているのは、機械のほうです。"}, {"t": 929.7166666666667, "x": "パイオニア十号がイオの画像を"}, {"t": 931.6666666666666, "x": "失ったことは、第一章で触れました。"}, {"t": 934.3666666666667, "x": "それから半世紀たって、同じ問題が、"}, {"t": 937.1666666666666, "x": "もっと大きな形で表に出ます。"}, {"t": 939.5333333333333, "x": "二〇二四年五月。"}, {"t": 939.5333333333333, "x": "二〇二四年五月█"}, {"t": 941.1666666666666, "x": "打ち上げを五か月後に控えたNASAの"}, {"t": 943.3666666666667, "x": "探査機、エウロパ・クリッパーの"}, {"t": 944.5166666666667, "x": "エウロパ・クリッパー█"}, {"t": 946.1333333333333, "x": "開発チームに、ひとつの知らせが届きました。"}, {"t": 949.4, "x": "この探査機に使っているものと同じ種類の"}, {"t": 951.85, "x": "トランジスタが、想定より低い放射線の"}, {"t": 954.6666666666666, "x": "量で壊れている、という知らせでした。"}, {"t": 957.2, "x": "トランジスタは、電気を入れたり切ったりする、"}, {"t": 960.0166666666667, "x": "小さなスイッチの役目をする部品です。"}, {"t": 962.7833333333333, "x": "報道によれば、NASAはこれを、業界が"}, {"t": 965.8, "x": "それまで気づいていなかった現象で、放射線への"}, {"t": 969.0333333333333, "x": "強さを確かめる業界の標準的な試験に、"}, {"t": 971.8833333333333, "x": "新しく見つかった穴がある、と説明しました。"}, {"t": 975.4, "x": "部品を積み替える時間は、ありませんでした。"}, {"t": 978.4666666666667, "x": "チームは約四か月かけて、ジェット推進研究所、"}, {"t": 982.05, "x": "ジョンズ・ホプキンス大学の応用物理研究所、"}, {"t": 985.2333333333333, "x": "ゴダード宇宙飛行センターで試験を重ねました。"}, {"t": 988.3833333333333, "x": "出た結論は、部品を温めると、放射線で乱れた"}, {"t": 992.3333333333334, "x": "状態がある程度元に戻る、というものでした。"}, {"t": 995.45, "x": "クリッパーは、木星のまわりを約三週間かけて"}, {"t": 998.75, "x": "一周し、強い放射線を浴びるのは、"}, {"t": 1001.4833333333333, "x": "エウロパに近づく、そのうちの一日ほどです。"}, {"t": 1005.0, "x": "残りの日に部品を温めれば、"}, {"t": 1006.9166666666666, "x": "回復が進む、と説明されています。"}, {"t": 1010.05, "x": "二〇二四年九月九日、NASAは、"}, {"t": 1010.05, "x": "二〇二四年九月九日█"}, {"t": 1012.8666666666667, "x": "打ち上げに進む判断を下しました。"}, {"t": 1015.5, "x": "報道では、この探査機にかかる費用は、"}, {"t": 1018.3166666666667, "x": "全体でおよそ五十億ドルとされています。"}, {"t": 1021.3166666666667, "x": "その金額の探査機が、打ち上げの直前になって、"}, {"t": 1024.75, "x": "小さなスイッチ一つの放射線への強さを、"}, {"t": 1027.85, "x": "あらためて確かめ直していたことになります。"}, {"t": 1030.6833333333334, "x": "では、エウロパの表面に降りた機械は、どうなるのか。"}, {"t": 1034.6833333333334, "x": "二〇一七年にNASAの研究チームが"}, {"t": 1037.0166666666667, "x": "示した着陸機の計画資料には、地表での"}, {"t": 1040.2, "x": "任務のあいだに、着陸機が一・五メガラドの"}, {"t": 1043.25, "x": "放射線にさらされる、と書かれています。"}, {"t": 1045.9166666666667, "x": "電子機器を守るために、主な装置は放射線を"}, {"t": 1049.2333333333333, "x": "さえぎる箱の中に収める設計でした。"}, {"t": 1051.6833333333334, "x": "そして、放射線が壊すのは、機械だけではありません。"}, {"t": 1055.75, "x": "探したいもの、そのものも壊します。"}, {"t": 1058.4666666666667, "x": "二〇一八年に発表された研究によれば、エウロパの"}, {"t": 1058.4666666666667, "x": "二〇一八年█"}, {"t": 1062.3333333333333, "x": "表面の氷は、放射線によって、場所によっては"}, {"t": 1066.1333333333334, "x": "深さ一センチメートルほどまで、別の場所では"}, {"t": 1069.25, "x": "十センチメートルから二十センチメートルまで、"}, {"t": 1071.95, "x": "中身が作り変えられています。"}, {"t": 1074.15, "x": "深く作り変えられているのは、エウロパが"}, {"t": 1076.7833333333333, "x": "木星のまわりを進む向きの、前の面と後ろの"}, {"t": 1080.0333333333333, "x": "面の中ほどにある、レンズのような形をした地域です。"}, {"t": 1083.7, "x": "中緯度から高緯度では、その深さは"}, {"t": 1086.2333333333333, "x": "一センチメートルほどにとどまります。"}, {"t": 1088.3333333333333, "x": "どこに降りるかで、掘らなければならない"}, {"t": 1090.8333333333333, "x": "深さが、十倍以上変わる、ということです。"}, {"t": 1094.25, "x": "もし、海から上がってきた有機物が表面にあったとしても、"}, {"t": 1098.0333333333333, "x": "いちばん上の層では、元の形のままでは"}, {"t": 1101.3333333333333, "x": "残っていない可能性が高い、ということです。"}, {"t": 1104.3166666666666, "x": "同じ研究は、場所を選べば、数センチメートル"}, {"t": 1107.8666666666666, "x": "掘るだけで、調べられる状態の有機物が"}, {"t": 1110.7666666666667, "x": "残っているかもしれない、とも書いています。"}, {"t": 1113.5, "x": "生命の手がかりを探すなら、表面の"}, {"t": 1116.25, "x": "数センチより下を掘らなければならない。"}, {"t": 1118.5833333333333, "x": "着陸機の設計は、この条件から始まりました。"}, {"t": 1122.2, "x": "降りられない理由のもう半分は、"}, {"t": 1124.1166666666666, "x": "技術ではなく、決まりの話です。"}, {"t": 1127.0, "x": "宇宙に探査機を送る国々には、ほかの天体を"}, {"t": 1130.3833333333334, "x": "地球の生き物で汚さないための取り決めがあります。"}, {"t": 1133.4166666666667, "x": "惑星保護と呼ばれる考え方です。"}, {"t": 1133.4166666666667, "x": "惑星保護█"}, {"t": 1136.25, "x": "エウロパについて、NASAの着陸機の検討が"}, {"t": 1139.3, "x": "前提にした基準は、次のようなものでした。"}, {"t": 1142.3166666666666, "x": "地球の生き物が、うっかりエウロパの海を"}, {"t": 1145.2833333333333, "x": "汚してしまう確率を、一万分の一より小さくすること。"}, {"t": 1147.2, "x": "一万分の一█"}, {"t": 1149.7333333333333, "x": "同じ着陸機を一万機送ったとしても、"}, {"t": 1152.25, "x": "海を汚すのは一機に満たない。"}, {"t": 1154.5166666666667, "x": "そういう水準です。"}, {"t": 1155.9166666666667, "x": "これは、消毒をすればすむ、という話だけではありません。"}, {"t": 1160.1666666666667, "x": "うまく降りられなかったとき、予定と違う場所に"}, {"t": 1163.2, "x": "落ちたときも含めて、確率として見積もり、"}, {"t": 1166.15, "x": "その小ささを示すことが求められます。"}, {"t": 1168.9166666666667, "x": "序章の探査機ガリレオが木星に"}, {"t": 1170.9833333333333, "x": "落とされたのは、この考え方によるものです。"}, {"t": 1174.05, "x": "打ち上げから十四年。"}, {"t": 1175.5166666666667, "x": "木星のまわりで八年近く。"}, {"t": 1177.6, "x": "探査機は、木星の濃い大気の"}, {"t": 1179.8833333333334, "x": "中でばらばらになり、消えました。"}, {"t": 1182.15, "x": "ガリレオが設計され、打ち上げられたのは、エウロパに"}, {"t": 1185.9833333333333, "x": "海があるとはまだ分かっていなかった時代でした。"}, {"t": 1188.5666666666666, "x": "そのため、エウロパに触れてもよいほどの"}, {"t": 1191.1833333333334, "x": "消毒はされていなかった、とされています。"}, {"t": 1194.0, "x": "自分の見つけた海を、自分が汚すかもしれない。"}, {"t": 1197.3166666666666, "x": "ガリレオの最後の軌道は、その可能性を"}, {"t": 1200.2, "x": "消すために組まれました。"}, {"t": 1201.5666666666666, "x": "土星を回った探査機カッシーニも、同じ理由で、"}, {"t": 1204.9, "x": "最後は土星に突入させられた、とされています。"}, {"t": 1208.55, "x": "同じ考え方は、いま飛んでいる"}, {"t": 1210.8833333333334, "x": "探査機にも受け継がれています。"}, {"t": 1212.7, "x": "エウロパ・クリッパーは、主な任務が終わった"}, {"t": 1216.2166666666667, "x": "あと、ガニメデに落とす計画です。"}, {"t": 1216.7166666666667, "x": "ガニメデ█"}, {"t": 1218.8833333333334, "x": "NASAの資料によれば、予定は二〇三四年九月。"}, {"t": 1222.6, "x": "なぜエウロパではなく、ガニメデなのか。"}, {"t": 1225.3833333333334, "x": "ガニメデにも、氷の下に海があると考えられています。"}, {"t": 1229.1833333333334, "x": "ただ、ガニメデの氷はエウロパよりずっと厚く、"}, {"t": 1232.3666666666666, "x": "表面がいまも動いているようには見えません。"}, {"t": 1235.35, "x": "探査機がぶつかっても、その下の海までは"}, {"t": 1238.0666666666666, "x": "届かないと判断されている、と説明されています。"}, {"t": 1241.4333333333334, "x": "ここで、着陸の話に戻ります。"}, {"t": 1244.1333333333334, "x": "着陸機は、エウロパの表面に"}, {"t": 1246.45, "x": "触れることそのものが目的です。"}, {"t": 1248.3833333333334, "x": "しかも、生命の手がかりを探しに行くのなら、"}, {"t": 1251.4, "x": "機体に地球の生き物がついていては、"}, {"t": 1253.9166666666667, "x": "見つけたものが地球から持ち込んだものなのか、"}, {"t": 1256.9, "x": "エウロパのものなのか、区別がつかなくなります。"}, {"t": 1260.3833333333334, "x": "つまり、降りられない理由は、二つ重なっています。"}, {"t": 1264.1166666666666, "x": "一つは、降りた機械が、長くはもたないこと。"}, {"t": 1267.65, "x": "もう一つは、降りた機械が、そこにあるかも"}, {"t": 1270.8166666666666, "x": "しれないものを、台なしにしてしまうおそれがあること。"}, {"t": 1274.15, "x": "前の章が一つ目の話なら、この章は二つ目の話です。"}, {"t": 1278.3166666666666, "x": "電気のつくり方も、この決まりに縛られました。"}, {"t": 1281.5, "x": "遠い惑星へ行く探査機の多くは、放射性物質が"}, {"t": 1285.0333333333333, "x": "出す熱で電気を作る装置を積んでいます。"}, {"t": 1287.65, "x": "ところが、二〇一七年の着陸機の検討資料は、"}, {"t": 1291.3166666666666, "x": "この方式を採らない理由として、二つを挙げています。"}, {"t": 1295.2833333333333, "x": "重く、複雑になりすぎること。"}, {"t": 1297.7833333333333, "x": "そして、惑星保護がかなり難しくなること。"}, {"t": 1301.1333333333334, "x": "代わりに選ばれたのは、電池でした。"}, {"t": 1303.6833333333334, "x": "充電して使い続けることを前提にしない、"}, {"t": 1306.35, "x": "蓄えた分だけを使う電池です。"}, {"t": 1308.85, "x": "電池しかない着陸機は、電気が尽きたら終わります。"}, {"t": 1312.3333333333333, "x": "充電も、交換も、できません。"}, {"t": 1315.1666666666667, "x": "長く働かせるための方式を、"}, {"t": 1317.1833333333334, "x": "惑星保護と重さのために手放す。"}, {"t": 1319.75, "x": "着陸機の寿命が日数で数えられるのは、"}, {"t": 1322.4833333333333, "x": "この選択の結果でもあります。"}, {"t": 1324.7166666666667, "x": "放射線の強い場所で、限られた電気で、"}, {"t": 1327.6, "x": "地球の生き物を持ち込まない基準を"}, {"t": 1330.0333333333333, "x": "守りながら、氷の下の手がかりを掘る。"}, {"t": 1332.8166666666666, "x": "エウロパに降りるということは、この条件を、"}, {"t": 1335.7666666666667, "x": "全部同時に満たすということでした。"}, {"t": 1338.2666666666667, "x": "その条件を満たす着陸機は、"}, {"t": 1340.2333333333333, "x": "紙の上では、一度描かれています。"}, {"t": 1343.2333333333333, "x": "二〇一六年六月、NASAは"}, {"t": 1343.2333333333333, "x": "二〇一六年六月█"}, {"t": 1345.5666666666666, "x": "二十一人の科学者を集め、エウロパ着陸機の"}, {"t": 1349.0666666666666, "x": "科学の目標を決めるチームを作りました。"}, {"t": 1351.6666666666667, "x": "議会からの指示を受けた検討でした。"}, {"t": 1354.0, "x": "報告書は、二〇一七年二月七日に"}, {"t": 1356.9333333333334, "x": "NASAへ提出されています。"}, {"t": 1358.5, "x": "目標は、優先する順に三つ。"}, {"t": 1361.0833333333333, "x": "エウロパで生命の証拠を探すこと。"}, {"t": 1363.4666666666667, "x": "着陸機でなければできない方法で、"}, {"t": 1365.75, "x": "生き物が住める環境かどうかを調べること。"}, {"t": 1368.9, "x": "将来の探査のために、着陸した場所の"}, {"t": 1371.7833333333333, "x": "表面と地下の性質を調べること。"}, {"t": 1374.05, "x": "報告書のあとに示された計画の"}, {"t": 1376.2, "x": "姿は、次のようなものでした。"}, {"t": 1378.5, "x": "打ち上げは、NASAの大型ロケットで、"}, {"t": 1381.0, "x": "二〇二四年を目標とする。"}, {"t": 1383.4333333333334, "x": "着陸機は、クリッパーとは別に打ち上げる。"}, {"t": 1386.5333333333333, "x": "木星に着いたら、軌道を少しずつ下げてエウロパに"}, {"t": 1389.8333333333333, "x": "近づき、最後は、空中で機体をつり下げて降ろす、"}, {"t": 1393.8, "x": "スカイクレーンと呼ばれる方式で着地する。"}, {"t": 1396.6666666666667, "x": "狙った地点からのずれは、百メートル。"}, {"t": 1399.3833333333334, "x": "地表での仕事は、二十日あまり。"}, {"t": 1400.65, "x": "二十日あまり█"}, {"t": 1401.7666666666667, "x": "電池に蓄えた四十五キロワット時の電気が、すべてです。"}, {"t": 1405.7333333333333, "x": "ロボットアームで、深さ十センチメートルか、"}, {"t": 1408.65, "x": "それより下から、五か所の試料を採る。"}, {"t": 1411.6, "x": "一か所につき七立方センチメートル以上。"}, {"t": 1414.3166666666666, "x": "それを機内の装置で調べる。"}, {"t": 1416.2666666666667, "x": "一回の採取と分析は、地球の一日ほどで終える計画でした。"}, {"t": 1420.7333333333333, "x": "調べるための道具として、資料には、試料に"}, {"t": 1424.15, "x": "含まれる物質を分けて重さを量る装置、〇・"}, {"t": 1426.8833333333334, "x": "二マイクロメートルの細かさまで見える顕微鏡、"}, {"t": 1430.3666666666666, "x": "光の散らばり方で成分を調べる装置、そして、"}, {"t": 1434.25, "x": "地面の揺れを感じ取る地震計が挙げられています。"}, {"t": 1437.5166666666667, "x": "地震計は、木星の重力で氷が伸び縮みする"}, {"t": 1441.05, "x": " const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
