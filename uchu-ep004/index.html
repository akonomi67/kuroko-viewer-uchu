<script>
const D={"name": "ep004", "file": "ep004", "dur": 1958.76665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇〇三年九月二十一日。"}, {"t": 0.0, "x": "二〇〇三年九月二十一日█"}, {"t": 2.2333333333333334, "x": "木星を八年近く回り続けた一機の探査機が、"}, {"t": 5.416666666666667, "x": "木星の大気に向かって、まっすぐ落ちていきました。"}, {"t": 9.15, "x": "名前はガリレオ。"}, {"t": 9.6, "x": "ガリレオ█"}, {"t": 10.35, "x": "四百年あまり前に、望遠鏡でこの衛星たちを"}, {"t": 13.966666666666667, "x": "見つけた天文学者の名前をもらった探査機です。"}, {"t": 16.9, "x": "一九八九年に打ち上げられ、一九九五年の"}, {"t": 21.3, "x": "十二月から木星のまわりを回っていた探査機です。"}, {"t": 24.466666666666665, "x": "回った数は三十四周。"}, {"t": 26.316666666666666, "x": "燃料は、残りわずかになっていました。"}, {"t": 29.05, "x": "壊れたから落ちたのではありません。"}, {"t": 31.116666666666667, "x": "落とすと決めたのは、地上の運用チームでした。"}, {"t": 34.25, "x": "理由は、この探査機が自分で見つけたものにあります。"}, {"t": 37.833333333333336, "x": "木星の衛星の一つ、エウロパ。"}, {"t": 39.583333333333336, "x": "エウロパ█"}, {"t": 40.55, "x": "その氷の下に、塩を含んだ液体の水の層があるらしい。"}, {"t": 44.7, "x": "その証拠を集めたのが、ほかならぬこの探査機でした。"}, {"t": 48.266666666666666, "x": "燃料が尽きれば、探査機は向きも"}, {"t": 50.7, "x": "軌道も変えられなくなります。"}, {"t": 52.4, "x": "そのまま木星のまわりを漂い続ければ、"}, {"t": 55.05, "x": "いつかエウロパにぶつかるかもしれません。"}, {"t": 57.68333333333333, "x": "機体には、地球から連れてきた微生物が"}, {"t": 60.55, "x": "ついているかもしれません。"}, {"t": 62.0, "x": "それを避ける方法は、一つでした。"}, {"t": 64.6, "x": "ぶつかっても困らない場所に、"}, {"t": 66.26666666666667, "x": "先に落としてしまうことです。"}, {"t": 68.38333333333334, "x": "こうして、エウロパの海の手がかりを持ち帰った機械は、"}, {"t": 72.05, "x": "その海を守るために、自分から消えました。"}, {"t": 75.38333333333334, "x": "エウロパの表面の写真はあります。"}, {"t": 77.58333333333333, "x": "ひびだらけの、白い氷の写真です。"}, {"t": 80.35, "x": "けれど、その下にあるとされる海を"}, {"t": 82.76666666666667, "x": "写した写真は、一枚もありません。"}, {"t": 85.28333333333333, "x": "一九七二年に、最初の探査機が"}, {"t": 88.38333333333334, "x": "木星へ向けて地球を離れてから、五十四年。"}, {"t": 90.68333333333334, "x": "五十四年█"}, {"t": 91.61666666666666, "x": "人類がエウロパの表面に降ろした"}, {"t": 93.66666666666667, "x": "機械は、まだ一つもありません。"}, {"t": 95.9, "x": "この回では、その理由を、記録の順にたどります。"}, {"t": 99.7, "x": "何が分かっていて、何が分かっていないのか。"}, {"t": 102.76666666666667, "x": "そして、なぜ降りないのか、なぜ降りられないのかを。"}, {"t": 106.61666666666666, "x": "最初にエウロパを見た人間は、"}, {"t": 108.58333333333333, "x": "それを、光の点として見ました。"}, {"t": 111.28333333333333, "x": "一六一〇年の一月、イタリアのガリレオ・"}, {"t": 111.28333333333333, "x": "一六一〇年█"}, {"t": 113.53333333333333, "x": "ガリレオ・ガリレイ█"}, {"t": 114.46666666666667, "x": "ガリレイは、自分で作った望遠鏡を木星に向け、"}, {"t": 117.96666666666667, "x": "そのそばに並ぶ小さな光に気づきました。"}, {"t": 120.93333333333334, "x": "彼は一月七日から三月六日まで、"}, {"t": 123.43333333333334, "x": "ほとんど毎晩、木星を見続けています。"}, {"t": 126.75, "x": "光は夜ごとに位置を変え、木星の"}, {"t": 129.28333333333333, "x": "右に出たり、左に出たりしました。"}, {"t": 131.8, "x": "数が減る夜もありました。"}, {"t": 133.51666666666668, "x": "木星の後ろに隠れたか、前を横切っていたからです。"}, {"t": 137.3, "x": "星ではない。"}, {"t": 138.23333333333332, "x": "木星のまわりを回っているものだ。"}, {"t": 140.4, "x": "彼はそう結論し、同じ年の三月に"}, {"t": 143.33333333333334, "x": "出した『星界の報告』に書き残しています。"}, {"t": 146.96666666666667, "x": "見つかった光は四つ。"}, {"t": 148.53333333333333, "x": "いまガリレオ衛星と呼ばれる、"}, {"t": 150.31666666666666, "x": "イオ、エウロパ、ガニメデ、カリストです。"}, {"t": 154.15, "x": "いまでは木星の衛星はずっと多く知られていますが、"}, {"t": 157.28333333333333, "x": "エウロパは、その中で四番目に大きく、木星に"}, {"t": 161.4, "x": "近いほうから数えて六番目を回っています。"}, {"t": 164.1, "x": "エウロパという名前をつけたのは、"}, {"t": 165.98333333333332, "x": "ガリレオではありません。"}, {"t": 167.66666666666666, "x": "ドイツの天文学者シモン・マリウスが、"}, {"t": 169.85, "x": "ギリシャ神話に出てくる女性の名前をあてました。"}, {"t": 173.06666666666666, "x": "ガリレオ自身はこの名前を使わず、番号で呼びました。"}, {"t": 176.91666666666666, "x": "エウロパは「木星の二番目」でした。"}, {"t": 179.98333333333332, "x": "マリウスの名前が広く使われるようになったのは、"}, {"t": 182.8, "x": "二十世紀の半ばになってからだとされています。"}, {"t": 185.9, "x": "それから三百六十年あまり、エウロパは、点のままでした。"}, {"t": 190.41666666666666, "x": "変化は、光を色ごとに分けて調べる観測から来ました。"}, {"t": 194.35, "x": "一九七二年、アメリカ・アリゾナ州の"}, {"t": 194.35, "x": "一九七二年█"}, {"t": 197.55, "x": "キットピーク国立天文台で、エウロパの"}, {"t": 200.43333333333334, "x": "光を分けて調べたところ、表面のほとんどが"}, {"t": 203.55, "x": "水の氷でできていることが分かりました。"}, {"t": 205.96666666666667, "x": "点の正体は、氷の球でした。"}, {"t": 208.56666666666666, "x": "同じ一九七二年の三月二日、"}, {"t": 210.88333333333333, "x": "パイオニア十号█"}, {"t": 211.4, "x": "パイオニア十号が打ち上げられます。"}, {"t": 213.9, "x": "火星の軌道より外へ行くことを"}, {"t": 215.75, "x": "前提に作られた、初めての探査機でした。"}, {"t": 218.76666666666668, "x": "一九七三年十二月三日、パイオニア十号は、木星から"}, {"t": 223.96666666666667, "x": "約十三万二千キロメートルのところを通り過ぎます。"}, {"t": 227.21666666666667, "x": "このとき、衛星イオを撮った画像が一枚、"}, {"t": 230.25, "x": "木星のまわりの強い放射線のために"}, {"t": 232.95, "x": "失われた、とNASAは記録しています。"}, {"t": 235.5, "x": "木星のまわりがどういう場所なのか。"}, {"t": 237.78333333333333, "x": "人類が最初に受け取った知らせの一つは、"}, {"t": 240.3, "x": "失われた一枚の写真でした。"}, {"t": 242.68333333333334, "x": "エウロパの姿がはっきりしたのは、その六年後です。"}, {"t": 246.2, "x": "一九七九年、ボイジャー一号と"}, {"t": 246.2, "x": "一九七九年█"}, {"t": 249.31666666666666, "x": "二号が相次いで木星を通過しました。"}, {"t": 251.75, "x": "一号がいちばん木星に近づいたのは三月四日。"}, {"t": 255.03333333333333, "x": "二号がエウロパにいちばん近づいたのは、七月九日でした。"}, {"t": 259.1, "x": "送られてきた画像には、白い球の上を、"}, {"t": 261.96666666666664, "x": "細い筋が縦横に走っていました。"}, {"t": 264.53333333333336, "x": "NASAの画像の説明は、この筋模様を、"}, {"t": 267.3666666666667, "x": "外側の殻が割れ、そこを内側から来た物質が"}, {"t": 271.1666666666667, "x": "埋めたあとだ、と書いています。"}, {"t": 273.0833333333333, "x": "そして、もう一つ。"}, {"t": 274.8, "x": "クレーターが、ほとんどありませんでした。"}, {"t": 277.45, "x": "隣のガニメデやカリストは、"}, {"t": 279.1666666666667, "x": "隕石がぶつかった跡だらけです。"}, {"t": 281.5, "x": "エウロパだけが、つるりとしていました。"}, {"t": 284.05, "x": "クレーターが少ないということは、"}, {"t": 285.8833333333333, "x": "表面が新しいということです。"}, {"t": 288.25, "x": "いまのNASAの資料では、エウロパの表面は、"}, {"t": 291.21666666666664, "x": "古くても四千万年から九千万年ほどとされています。"}, {"t": 295.0833333333333, "x": "四十五億年ほど前からある天体にとって、それはつい最近、"}, {"t": 299.3333333333333, "x": "塗り直されたばかりだ、ということになります。"}, {"t": 302.65, "x": "何が、塗り直しているのか。"}, {"t": 304.9, "x": "一九七九年のボイジャーの画像説明には、"}, {"t": 308.3, "x": "すでに、ひとつの見立てが書かれていました。"}, {"t": 311.3666666666667, "x": "表面が平らで地形に起伏が少ないのは、"}, {"t": 313.95, "x": "表面から数キロメートル下が、若くて"}, {"t": 317.06666666666666, "x": "温かいからではないか、というものです。"}, {"t": 319.76666666666665, "x": "氷の下に、何かがある。"}, {"t": 321.93333333333334, "x": "その見立ては、ここから始まりました。"}, {"t": 324.5833333333333, "x": "氷の下に海があるかどうかを確かめるには、ふつうに"}, {"t": 328.05, "x": "考えれば、氷を掘るか、氷の下を撮るしかありません。"}, {"t": 332.28333333333336, "x": "どちらも、まだ誰もしていません。"}, {"t": 334.6166666666667, "x": "それでも、いま多くの研究者は、"}, {"t": 337.06666666666666, "x": "エウロパの氷の下に塩水の海があることを、"}, {"t": 340.15, "x": "ほぼ確かなものとして扱っています。"}, {"t": 342.68333333333334, "x": "NASAの資料にも、科学者たちは"}, {"t": 344.93333333333334, "x": "ほぼ確信している、と書かれています。"}, {"t": 347.53333333333336, "x": "写真が一枚もないのに、なぜそう言えるのか。"}, {"t": 350.78333333333336, "x": "手がかりの中心は、序章の探査機、"}, {"t": 353.55, "x": "ガリレオが積んでいた磁力計でした。"}, {"t": 356.01666666666665, "x": "ガリレオは一九八九年十月十八日、スペースシャトル・"}, {"t": 356.75, "x": "一九八九年十月十八日█"}, {"t": 360.5833333333333, "x": "アトランティスから打ち上げられました。"}, {"t": 362.51666666666665, "x": "途中で、大きなつまずきがありました。"}, {"t": 365.25, "x": "一九九一年、傘のように開くはずだった"}, {"t": 368.8666666666667, "x": "大きなアンテナが、開ききらなかったのです。"}, {"t": 371.6666666666667, "x": "十八本ある骨のうち、おそらく三本が、摩擦で"}, {"t": 375.53333333333336, "x": "閉じたまま動かなくなった、とNASAは記録しています。"}, {"t": 378.8833333333333, "x": "このアンテナは、たくさんの"}, {"t": 380.6333333333333, "x": "データを地球へ送るためのものでした。"}, {"t": 382.8833333333333, "x": "運用チームは、小さな予備のアンテナで送れるように、"}, {"t": 386.31666666666666, "x": "地上の受信設備を強化し、機体のソフトウェアを"}, {"t": 390.05, "x": "作り直して、ミッションを続けました。"}, {"t": 392.6666666666667, "x": "送れるデータの量は大きく減りました。"}, {"t": 395.05, "x": "どれだけの画像を撮り、どれだけを諦めたのか。"}, {"t": 398.35, "x": "その全体を一次資料で数え直すことは、"}, {"t": 401.1, "x": "今回できていません。"}, {"t": 402.75, "x": "それでもガリレオは、一九九五年十二月七日に"}, {"t": 406.6666666666667, "x": "木星のまわりの軌道に入り、"}, {"t": 408.56666666666666, "x": "エウロパのそばを何度も通り過ぎました。"}, {"t": 411.26666666666665, "x": "木星は、強い磁場をまとっています。"}, {"t": 413.98333333333335, "x": "NASAによれば、地球の磁場のおよそ二万倍です。"}, {"t": 417.25, "x": "しかも、その磁場の向きは、エウロパのいる"}, {"t": 420.25, "x": "場所から見ると、五時間半ごとに入れ替わります。"}, {"t": 423.43333333333334, "x": "ここに、ひとつの仕掛けがあります。"}, {"t": 425.8, "x": "もし、エウロパの内側に、電気を通すものが"}, {"t": 429.35, "x": "広い層になって存在していれば、外の磁場の"}, {"t": 432.3833333333333, "x": "向きが変わるたびに、その層に電流が流れます。"}, {"t": 435.6333333333333, "x": "そうするとエウロパ自身が、"}, {"t": 437.23333333333335, "x": "小さな磁石のようにふるまうはずです。"}, {"t": 439.8666666666667, "x": "しかもその磁石の向きは、外の"}, {"t": 442.1166666666667, "x": "磁場に合わせて、ひっくり返るはずです。"}, {"t": 444.76666666666665, "x": "氷は、電気をほとんど通しません。"}, {"t": 447.45, "x": "けれど、塩を溶かした水は、かなりよく電気を通します。"}, {"t": 451.6333333333333, "x": "二〇〇〇年一月三日、ガリレオは、この違いを"}, {"t": 451.6333333333333, "x": "二〇〇〇年一月三日█"}, {"t": 455.26666666666665, "x": "見分けられる向きで、エウロパのそばを通過しました。"}, {"t": 458.6333333333333, "x": "エウロパがもともと持っている磁石なのか。"}, {"t": 461.06666666666666, "x": "外の磁場に応じて生まれる磁石なのか。"}, {"t": 463.6333333333333, "x": "測った結果は、後者でした。"}, {"t": 465.8666666666667, "x": "エウロパの磁石の北の向きは、"}, {"t": 467.68333333333334, "x": "外の磁場に合わせて反転していました。"}, {"t": 470.35, "x": "一週間後の一月十日、NASAはこの結果を発表します。"}, {"t": 474.55, "x": "研究を率いたマーガレット・キヴェルソンは、"}, {"t": 475.3666666666667, "x": "マーガレット・キヴェルソン█"}, {"t": 476.95, "x": "エウロパの表面の下に液体の水の層が"}, {"t": 479.8833333333333, "x": "たしかにあることを示していると思う、と述べました。"}, {"t": 483.1333333333333, "x": "同じ年の八月、結果は学術誌『サイエンス』に"}, {"t": 487.7, "x": "論文として載りました。"}, {"t": 489.06666666666666, "x": "ただし、この方法で分かるのは、電気を"}, {"t": 492.25, "x": "通す層がある、というところまでです。"}, {"t": 494.8, "x": "深さについて、NASAの発表は、"}, {"t": 497.1666666666667, "x": "表面から約百キロメートルまでの"}, {"t": 499.6166666666667, "x": "外側のどこか、としか言っていません。"}, {"t": 502.1666666666667, "x": "二十一世紀に入ると、別の方向からの"}, {"t": 505.23333333333335, "x": "手がかりが加わります。"}, {"t": 506.65, "x": "二〇一三年、ハッブル宇宙望遠鏡の紫外線の"}, {"t": 510.21666666666664, "x": "観測から、エウロパの南極のあたりで、水蒸気が"}, {"t": 514.0166666666667, "x": "噴き上がっている可能性が報告されました。"}, {"t": 516.5666666666667, "x": "二〇一六年には、別のチームが別の方法でハッブルを使い、"}, {"t": 520.8666666666667, "x": "十五か月のあいだに十回観測して、そのうち三回、"}, {"t": 524.9833333333333, "x": "噴き出しらしいものをとらえた、と発表しました。"}, {"t": 528.4, "x": "高さは、およそ二百キロメートルと見積もられています。"}, {"t": 531.9666666666667, "x": "けれど、NASAはその発表の中で、"}, {"t": 534.4, "x": "この噴き出しは確認されていない、と書いています。"}, {"t": 537.95, "x": "二つのチームが、同じときに同じものを"}, {"t": 540.7333333333333, "x": "とらえたことは、まだありません。"}, {"t": 542.8, "x": "出たり、出なかったりするように見えるのです。"}, {"t": 545.7833333333333, "x": "二〇一九年十一月には、NASAが率いる"}, {"t": 548.8666666666667, "x": "国際チームが、地上の望遠鏡を使って、"}, {"t": 551.9666666666667, "x": "エウロパの表面の上に水蒸気があることを、"}, {"t": 554.9333333333333, "x": "初めて直接とらえた、と発表しました。"}, {"t": 558.15, "x": "それでも、噴き出しがいつ、どこから、どれくらいの"}, {"t": 561.9833333333333, "x": "頻度で出ているのかは、いまも決まっていません。"}, {"t": 564.9, "x": "もし噴き出しが確かなら、氷を掘らなくても、"}, {"t": 567.9333333333333, "x": "宇宙に出てきた海の水を調べられるかもしれない。"}, {"t": 571.3, "x": "この点が、のちに、着陸機の運命にも関わってきます。"}, {"t": 575.55, "x": "二〇二三年九月には、ジェイムズ・ウェッブ宇宙望遠鏡が、"}, {"t": 575.55, "x": "二〇二三年九月█"}, {"t": 579.6833333333333, "x": "エウロパの表面に二酸化炭素を見つけました。"}, {"t": 582.8, "x": "いちばん多かったのは、タラ・レジオと呼ばれる地域です。"}, {"t": 584.2333333333333, "x": "タラ・レジオ█"}, {"t": 586.3333333333334, "x": "表面が割れて崩れ、作り直されたような、"}, {"t": 589.35, "x": "カオス地形と呼ばれる場所です。"}, {"t": 591.5, "x": "同じ場所では、以前にハッブルが、"}, {"t": 593.85, "x": "海から来たと考えられる塩を見つけていました。"}, {"t": 597.0833333333334, "x": "研究者は、表面の炭素が海から来た、という"}, {"t": 600.6666666666666, "x": "観測上の証拠がある、と述べています。"}, {"t": 603.5, "x": "炭素は、生き物にとって欠かせない元素です。"}, {"t": 606.6166666666667, "x": "ただし、炭素があることは、"}, {"t": 608.6166666666667, "x": "生き物がいることを意味しません。"}, {"t": 610.85, "x": "磁場の反転。"}, {"t": 611.85, "x": "噴き出しの可能性。"}, {"t": 613.2166666666667, "x": "表面に出てきた塩と炭素。"}, {"t": 615.1833333333333, "x": "どれも、海を直接見たものではありません。"}, {"t": 618.1833333333333, "x": "海があるなら、こう見えるはずだ、という"}, {"t": 621.0166666666667, "x": "形が、何本も重なっている。"}, {"t": 623.35, "x": "エウロパの海は、いまそういう状態にあります。"}, {"t": 626.5, "x": "エウロパの直径は、赤道で約三千百キロメートルです。"}, {"t": 630.55, "x": "地球の月の、およそ九割の大きさしかありません。"}, {"t": 634.1166666666667, "x": "それなのに、NASAの資料には、その海には"}, {"t": 637.2666666666667, "x": "地球の海をすべて合わせた量の、およそ二倍の"}, {"t": 639.3166666666667, "x": "およそ二倍の水█"}, {"t": 640.45, "x": "水があるかもしれない、と書かれています。"}, {"t": 643.0833333333334, "x": "小さな天体に多くの水が入るのは、海が深いからです。"}, {"t": 647.1333333333333, "x": "NASAの見積もりでは、氷の殻の厚さが"}, {"t": 649.9166666666666, "x": "十五キロメートルから二十五キロメートル。"}, {"t": 652.3166666666667, "x": "その下の海の深さが、六十キロメートルから"}, {"t": 655.45, "x": "百五十キロメートルです。"}, {"t": 657.05, "x": "天体の外側が、丸ごと水でできている、と言ってもいい"}, {"t": 661.1833333333333, "x": "形です。"}, {"t": 661.9, "x": "「二倍」という数字は、この深さの"}, {"t": 664.6666666666666, "x": "見積もりから出てきたものです。"}, {"t": 666.3666666666667, "x": "海の深さそのものは、測られたものではありません。"}, {"t": 669.75, "x": "幅のある推定です。"}, {"t": 671.2, "x": "二倍という数字にも、同じだけの幅があります。"}, {"t": 674.5166666666667, "x": "二〇二五年十二月、この見積もりのうち、"}, {"t": 674.5166666666667, "x": "二〇二五年十二月█"}, {"t": 677.8, "x": "氷の厚さについて、新しい数字が出ました。"}, {"t": 681.5, "x": "測ったのは、木星を回っている別の探査機、ジュノーです。"}, {"t": 684.7833333333333, "x": "ジュノー█"}, {"t": 685.9333333333333, "x": "ジュノーは二〇二二年九月二十九日、エウロパの"}, {"t": 689.5166666666667, "x": "表面から約三百六十キロメートルのところを"}, {"t": 692.4166666666666, "x": "通過し、マイクロ波放射計という装置で、"}, {"t": 695.3833333333333, "x": "氷の中から出てくる電波を測りました。"}, {"t": 698.25, "x": "見えていたのは、エウロパの表面のおよそ半分です。"}, {"t": 701.7166666666667, "x": "それまで、氷の厚さの見立ては、"}, {"t": 704.1666666666666, "x": "研究者によって大きく割れていました。"}, {"t": 706.85, "x": "薄いとする考えでは一キロメートルに満たず、"}, {"t": 709.6, "x": "厚いとする考えでは数十キロメートル。"}, {"t": 712.5333333333333, "x": "薄ければ、いつか掘り抜けるかもしれない。"}, {"t": 715.3333333333334, "x": "厚ければ、それは難しい。"}, {"t": 717.5833333333334, "x": "どちらなのかで、降りたあとに"}, {"t": 719.5666666666667, "x": "何ができるかが大きく変わります。"}, {"t": 721.6166666666667, "x": "NASAの発表は、ジュノーの測定が、"}, {"t": 724.1166666666667, "x": "この二つを初めて見分けたものだとしています。"}, {"t": 727.2166666666667, "x": "学術誌『ネイチャー・アストロノミー』に"}, {"t": 730.1833333333333, "x": "載った結果は、二十九キロメートルでした。"}, {"t": 731.1, "x": "二十九キロメートル█"}, {"t": 733.05, "x": "誤差は、プラスマイナス十キロメートル。"}, {"t": 735.7166666666667, "x": "氷に塩が混じっていれば、数キロ"}, {"t": 738.25, "x": "薄くなる可能性がある、とされています。"}, {"t": 740.9333333333333, "x": "研究チームの説明によれば、この数字は、純粋な水の"}, {"t": 745.3, "x": "氷を仮定したときの、冷たく硬い外側の層の厚さです。"}, {"t": 749.3333333333334, "x": "同じ観測で、氷の表面近くに、数センチほどの"}, {"t": 753.35, "x": "割れ目やすき間が、数百メートルの深さまで"}, {"t": 756.2333333333333, "x": "散らばっていることも分かりました。"}, {"t": 758.0333333333333, "x": "ただ、その大きさと浅さから見て、表面から海へ、"}, {"t": 761.8, "x": "酸素や栄養分を運ぶ主な通り道にはなりそうにない、と"}, {"t": 766.0833333333334, "x": "研究チームは書いています。"}, {"t": 767.7666666666667, "x": "二十九キロメートル。"}, {"t": 769.2666666666667, "x": "それが、海の上にかぶさっている蓋の厚さの、"}, {"t": 772.3666666666667, "x": "いまのところ最も新しい見積もりです。"}, {"t": 775.2333333333333, "x": "NASAのそれまでの見積もりの、"}, {"t": 776.8833333333333, "x": "いちばん厚い値より、さらに厚い数字でした。"}, {"t": 780.6, "x": "では、なぜその下の水は、凍らないのか。"}, {"t": 783.9833333333333, "x": "木星は、太陽から約七億八千万キロメートル、"}, {"t": 787.6666666666666, "x": "地球と太陽の距離のおよそ五・二倍のところにあります。"}, {"t": 791.5, "x": "エウロパの表面の温度は、いちばん暖かいところでも、"}, {"t": 795.0833333333334, "x": "マイナス百六十度を上回りません。"}, {"t": 797.75, "x": "太陽の光は、地球で受ける光の"}, {"t": 800.3833333333333, "x": "二十五分の一ほどの弱さです。"}, {"t": 802.4, "x": "太陽を出た光がエウロパに届くまでに、"}, {"t": 804.9, "x": "約四十五分かかります。"}, {"t": 806.95, "x": "空気と呼べるものはほとんどなく、"}, {"t": 808.85, "x": "酸素のごく薄い大気があるだけです。"}, {"t": 811.4333333333333, "x": "太陽の熱だけで、海を溶かしておくことはできません。"}, {"t": 815.0666666666667, "x": "熱のもとは、木星の重力だと考えられています。"}, {"t": 818.7833333333333, "x": "エウロパは、木星から"}, {"t": 820.4666666666667, "x": "約六十七万一千キロメートルのところを、"}, {"t": 823.2333333333333, "x": "およそ三日半で一周しています。"}, {"t": 825.65, "x": "そして、隣の衛星と、決まったリズムで回っています。"}, {"t": 829.8, "x": "ガニメデが一周するあいだに、"}, {"t": 831.5666666666667, "x": "エウロパは二周、イオは四周します。"}, {"t": 834.6666666666666, "x": "このリズムがあるために、エウロパの軌道は、"}, {"t": 837.4666666666667, "x": "きれいな円になりきらず、木星に近づいたり、"}, {"t": 840.95, "x": "離れたりを繰り返す、と考えられています。"}, {"t": 844.3833333333333, "x": "近づくと、木星の重力はエウロパを"}, {"t": 847.1333333333333, "x": "強く引き伸ばし、離れるとゆるめます。"}, {"t": 849.8833333333333, "x": "天体全体が、わずかに押しつぶされては戻る。"}, {"t": 853.2166666666667, "x": "そのとき内側で生まれる熱が、"}, {"t": 855.1666666666666, "x": "氷を下から温め続けている、というのが、"}, {"t": 858.5666666666667, "x": "いま広く受け入れられている説明です。"}, {"t": 861.1833333333333, "x": "地球の二倍の水。"}, {"t": 862.6166666666667, "x": "それを包む、二十九キロメートルの氷。"}, {"t": 865.7666666666667, "x": "そのどちらも、一度も、目で見られたことはありません。"}, {"t": 869.5666666666667, "x": "エウロパに降りるのが難しい理由として、"}, {"t": 872.0333333333333, "x": "まず挙げられるのは、遠さでも、寒さでもありません。"}, {"t": 876.1, "x": "放射線です。"}, {"t": 876.1, "x": "放射線█"}, {"t": 877.1833333333333, "x": "木星の強い磁場は、まわりを飛ぶ電気を帯びた粒子を"}, {"t": 880.8333333333334, "x": "捕まえ、とてつもない速さで振り回しています。"}, {"t": 883.9166666666666, "x": "NASAの説明によれば、木星の"}, {"t": 886.2, "x": "まわりは、太陽そのものを除けば、"}, {"t": 888.6, "x": "太陽系でいちばん激しい放射線の環境です。"}, {"t": 892.0333333333333, "x": "エウロパは、そのまっただ中を回っています。"}, {"t": 894.9666666666667, "x": "エウロパの表面に立った人間が、一日に浴びる"}, {"t": 898.2833333333333, "x": "放射線の量は、およそ五・四シーベルト。"}, {"t": 901.4166666666666, "x": "そういう数字が、広く引用されています。"}, {"t": 904.4, "x": "人間が一度に浴びれば、重い病気や"}, {"t": 907.0666666666667, "x": "死につながるとされる量です。"}, {"t": 908.8, "x": "ただ、この数字が、どの観測や計算から出たものなのか。"}, {"t": 913.1, "x": "今回、一次資料でたどることはできていません。"}, {"t": 916.4, "x": "ここでは、よく引かれる目安として扱います。"}, {"t": 919.5333333333333, "x": "一次資料ではっきりしているのは、機械のほうです。"}, {"t": 922.9166666666666, "x": "パイオニア十号がイオの画像を"}, {"t": 924.8666666666667, "x": "失ったことは、第一章で触れました。"}, {"t": 927.5666666666667, "x": "それから半世紀たって、同じ問題が、"}, {"t": 930.3666666666667, "x": "もっと大きな形で表に出ます。"}, {"t": 932.8833333333333, "x": "二〇二四年五月。"}, {"t": 932.8833333333333, "x": "二〇二四年五月█"}, {"t": 934.5166666666667, "x": "打ち上げを五か月後に控えたNASAの"}, {"t": 936.5833333333334, "x": "探査機、エウロパ・クリッパーの"}, {"t": 937.6666666666666, "x": "エウロパ・クリッパー█"}, {"t": 939.2, "x": "開発チームに、ひとつの知らせが届きました。"}, {"t": 942.2666666666667, "x": "この探査機に使っているものと同じ種類の"}, {"t": 944.7166666666667, "x": "トランジスタが、想定より低い放射線の"}, {"t": 947.5333333333333, "x": "量で壊れている、という知らせでした。"}, {"t": 950.0666666666667, "x": "トランジスタは、電気を入れたり切ったりする、"}, {"t": 952.8833333333333, "x": "小さなスイッチの役目をする部品です。"}, {"t": 955.65, "x": "報道によれば、NASAはこれを、業界が"}, {"t": 958.6666666666666, "x": "それまで気づいていなかった現象で、放射線への"}, {"t": 961.9, "x": "強さを確かめる業界の標準的な試験に、"}, {"t": 964.75, "x": "新しく見つかった穴がある、と説明しました。"}, {"t": 968.2666666666667, "x": "部品を積み替える時間は、ありませんでした。"}, {"t": 971.3333333333334, "x": "チームは約四か月かけて、ジェット推進研究所、"}, {"t": 974.9166666666666, "x": "ジョンズ・ホプキンス大学の応用物理研究所、"}, {"t": 978.1, "x": "ゴダード宇宙飛行センターで試験を重ねました。"}, {"t": 981.25, "x": "出た結論は、部品を温めると、放射線で乱れた"}, {"t": 985.2, "x": "状態がある程度元に戻る、というものでした。"}, {"t": 988.3166666666667, "x": "クリッパーは、木星のまわりを約三週間かけて"}, {"t": 991.6166666666667, "x": "一周し、強い放射線を浴びるのは、"}, {"t": 994.35, "x": "エウロパに近づく、そのうちの一日ほどです。"}, {"t": 997.8666666666667, "x": "残りの日に部品を温めれば、"}, {"t": 999.7833333333333, "x": "回復が進む、と説明されています。"}, {"t": 1002.9166666666666, "x": "二〇二四年九月九日、NASAは、"}, {"t": 1002.9166666666666, "x": "二〇二四年九月九日█"}, {"t": 1005.7333333333333, "x": "打ち上げに進む判断を下しました。"}, {"t": 1008.3666666666667, "x": "報道では、この探査機にかかる費用は、"}, {"t": 1011.1833333333333, "x": "全体でおよそ五十億ドルとされています。"}, {"t": 1014.1833333333333, "x": "その金額の探査機が、打ち上げの直前になって、"}, {"t": 1017.6166666666667, "x": "小さなスイッチ一つの放射線への強さを、"}, {"t": 1020.7166666666667, "x": "あらためて確かめ直していたことになります。"}, {"t": 1023.55, "x": "では、エウロパの表面に降りた機械は、どうなるのか。"}, {"t": 1027.55, "x": "二〇一七年にNASAの研究チームが"}, {"t": 1029.8833333333334, "x": "示した着陸機の計画資料には、地表での"}, {"t": 1033.0666666666666, "x": "任務のあいだに、着陸機が一・五メガラドの"}, {"t": 1036.1166666666666, "x": "放射線にさらされる、と書かれています。"}, {"t": 1038.7833333333333, "x": "電子機器を守るために、主な装置は放射線を"}, {"t": 1042.1, "x": "さえぎる箱の中に収める設計でした。"}, {"t": 1044.55, "x": "そして、放射線が壊すのは、機械だけではありません。"}, {"t": 1048.6166666666666, "x": "探したいもの、そのものも壊します。"}, {"t": 1051.3333333333333, "x": "二〇一八年に発表された研究によれば、エウロパの"}, {"t": 1051.3333333333333, "x": "二〇一八年█"}, {"t": 1055.0666666666666, "x": "表面の氷は、放射線によって、場所によっては"}, {"t": 1058.75, "x": "深さ一センチメートルほどまで、別の場所では"}, {"t": 1061.7666666666667, "x": "十センチメートルから二十センチメートルまで、"}, {"t": 1064.3833333333334, "x": "中身が作り変えられています。"}, {"t": 1066.5166666666667, "x": "深く作り変えられているのは、エウロパが"}, {"t": 1069.15, "x": "木星のまわりを進む向きの、前の面と後ろの"}, {"t": 1072.4, "x": "面の中ほどにある、レンズのような形をした地域です。"}, {"t": 1076.0666666666666, "x": "中緯度から高緯度では、その深さは"}, {"t": 1078.6, "x": "一センチメートルほどにとどまります。"}, {"t": 1080.7, "x": "どこに降りるかで、掘らなければならない"}, {"t": 1083.2, "x": "深さが、十倍以上変わる、ということです。"}, {"t": 1086.6166666666666, "x": "もし、海から上がってきた有機物が表面にあったとしても、"}, {"t": 1090.4, "x": "いちばん上の層では、元の形のままでは"}, {"t": 1093.7, "x": "残っていない可能性が高い、ということです。"}, {"t": 1096.6833333333334, "x": "同じ研究は、場所を選べば、数センチメートル"}, {"t": 1100.2333333333333, "x": "掘るだけで、調べられる状態の有機物が"}, {"t": 1103.1333333333334, "x": "残っているかもしれない、とも書いています。"}, {"t": 1105.8666666666666, "x": "生命の手がかりを探すなら、表面の"}, {"t": 1108.6166666666666, "x": "数センチより下を掘らなければならない。"}, {"t": 1110.95, "x": "着陸機の設計は、この条件から始まりました。"}, {"t": 1114.5666666666666, "x": "降りられない理由のもう半分は、"}, {"t": 1116.4833333333333, "x": "技術ではなく、決まりの話です。"}, {"t": 1119.3666666666666, "x": "宇宙に探査機を送る国々には、ほかの天体を"}, {"t": 1122.75, "x": "地球の生き物で汚さないための取り決めがあります。"}, {"t": 1125.7833333333333, "x": "惑星保護と呼ばれる考え方です。"}, {"t": 1125.7833333333333, "x": "惑星保護█"}, {"t": 1128.1333333333334, "x": "エウロパについて、NASAの着陸機の検討が"}, {"t": 1131.1833333333334, "x": "前提にした基準は、次のようなものでした。"}, {"t": 1134.2, "x": "地球の生き物が、うっかりエウロパの海を"}, {"t": 1136.95, "x": "汚してしまう確率を、一万分の一より小さくすること。"}, {"t": 1138.7333333333333, "x": "一万分の一█"}, {"t": 1141.0666666666666, "x": "同じ着陸機を一万機送ったとしても、"}, {"t": 1143.5833333333333, "x": "海を汚すのは一機に満たない。"}, {"t": 1145.85, "x": "そういう水準です。"}, {"t": 1147.25, "x": "これは、消毒をすればすむ、という話だけではありません。"}, {"t": 1151.5, "x": "うまく降りられなかったとき、予定と違う場所に"}, {"t": 1154.5333333333333, "x": "落ちたときも含めて、確率として見積もり、"}, {"t": 1157.4833333333333, "x": "その小ささを示すことが求められます。"}, {"t": 1160.25, "x": "序章の探査機ガリレオが木星に"}, {"t": 1162.3166666666666, "x": "落とされたのは、この考え方によるものです。"}, {"t": 1165.3833333333334, "x": "打ち上げから十四年。"}, {"t": 1166.85, "x": "木星のまわりで八年近く。"}, {"t": 1168.9333333333334, "x": "探査機は、木星の濃い大気の"}, {"t": 1171.2166666666667, "x": "中でばらばらになり、消えました。"}, {"t": 1173.4833333333333, "x": "ガリレオが設計され、打ち上げられたのは、エウロパに"}, {"t": 1177.3166666666666, "x": "海があるとはまだ分かっていなかった時代でした。"}, {"t": 1179.9, "x": "そのため、エウロパに触れてもよいほどの"}, {"t": 1182.5166666666667, "x": "消毒はされていなかった、とされています。"}, {"t": 1185.3333333333333, "x": "自分の見つけた海を、自分が汚すかもしれない。"}, {"t": 1188.65, "x": "ガリレオの最後の軌道は、その可能性を"}, {"t": 1191.5333333333333, "x": "消すために組まれました。"}, {"t": 1192.9, "x": "土星を回った探査機カッシーニも、同じ理由で、"}, {"t": 1196.2333333333333, "x": "最後は土星に突入させられた、とされています。"}, {"t": 1199.8833333333334, "x": "同じ考え方は、いま飛んでいる"}, {"t": 1202.2166666666667, "x": "探査機にも受け継がれています。"}, {"t": 1204.0333333333333, "x": "エウロパ・クリッパーは、主な任務が終わった"}, {"t": 1207.25, "x": "あと、ガニメデに落とす計画です。"}, {"t": 1207.7166666666667, "x": "ガニメデ█"}, {"t": 1209.7, "x": "NASAの資料によれば、予定は二〇三四年九月。"}, {"t": 1213.4166666666667, "x": "なぜエウロパではなく、ガニメデなのか。"}, {"t": 1216.2, "x": "ガニメデにも、氷の下に海があると考えられています。"}, {"t": 1220.0, "x": "ただ、ガニメデの氷はエウロパよりずっと厚く、"}, {"t": 1223.1833333333334, "x": "表面がいまも動いているようには見えません。"}, {"t": 1226.1666666666667, "x": "探査機がぶつかっても、その下の海までは"}, {"t": 1228.8833333333334, "x": "届かないと判断されている、と説明されています。"}, {"t": 1232.25, "x": "ここで、着陸の話に戻ります。"}, {"t": 1234.95, "x": "着陸機は、エウロパの表面に"}, {"t": 1237.2666666666667, "x": "触れることそのものが目的です。"}, {"t": 1239.2, "x": "しかも、生命の手がかりを探しに行くのなら、"}, {"t": 1242.2166666666667, "x": "機体に地球の生き物がついていては、"}, {"t": 1244.7333333333333, "x": "見つけたものが地球から持ち込んだものなのか、"}, {"t": 1247.7166666666667, "x": "エウロパのものなのか、区別がつかなくなります。"}, {"t": 1251.2, "x": "つまり、降りられない理由は、二つ重なっています。"}, {"t": 1254.9333333333334, "x": "一つは、降りた機械が、長くはもたないこと。"}, {"t": 1258.4666666666667, "x": "もう一つは、降りた機械が、そこにあるかも"}, {"t": 1261.6333333333334, "x": "しれないものを、台なしにしてしまうおそれがあること。"}, {"t": 1264.9666666666667, "x": "前の章が一つ目の話なら、この章は二つ目の話です。"}, {"t": 1269.1333333333334, "x": "電気のつくり方も、この決まりに縛られました。"}, {"t": 1272.3166666666666, "x": "遠い惑星へ行く探査機の多くは、放射性物質が"}, {"t": 1275.85, "x": "出す熱で電気を作る装置を積んでいます。"}, {"t": 1278.4666666666667, "x": "ところが、二〇一七年の着陸機の検討資料は、"}, {"t": 1282.1333333333334, "x": "この方式を採らない理由として、二つを挙げています。"}, {"t": 1286.1, "x": "重く、複雑になりすぎること。"}, {"t": 1288.6, "x": "そして、惑星保護がかなり難しくなること。"}, {"t": 1291.95, "x": "代わりに選ばれたのは、電池でした。"}, {"t": 1294.5, "x": "充電して使い続けることを前提にしない、"}, {"t": 1297.1666666666667, "x": "蓄えた分だけを使う電池です。"}, {"t": 1299.6666666666667, "x": "電池しかない着陸機は、電気が尽きたら終わります。"}, {"t": 1303.15, "x": "充電も、交換も、できません。"}, {"t": 1305.9833333333333, "x": "長く働かせるための方式を、"}, {"t": 1308.0, "x": "惑星保護と重さのために手放す。"}, {"t": 1310.5666666666666, "x": "着陸機の寿命が日数で数えられるのは、"}, {"t": 1313.3, "x": "この選択の結果でもあります。"}, {"t": 1315.5333333333333, "x": "放射線の強い場所で、限られた電気で、"}, {"t": 1318.4166666666667, "x": "地球の生き物を持ち込まない基準を"}, {"t": 1320.85, "x": "守りながら、氷の下の手がかりを掘る。"}, {"t": 1323.6333333333334, "x": "エウロパに降りるということは、この条件を、"}, {"t": 1326.5833333333333, "x": "全部同時に満たすということでした。"}, {"t": 1329.0833333333333, "x": "その条件を満たす着陸機は、"}, {"t": 1331.05, "x": "紙の上では、一度描かれています。"}, {"t": 1334.05, "x": "二〇一六年六月、NASAは"}, {"t": 1334.05, "x": "二〇一六年六月█"}, {"t": 1336.3833333333334, "x": "二十一人の科学者を集め、エウロパ着陸機の"}, {"t": 1339.8833333333334, "x": "科学の目標を決めるチームを作りました。"}, {"t": 1342.4833333333333, "x": "議会からの指示を受けた検討でした。"}, {"t": 1344.8166666666666, "x": "報告書は、二〇一七年二月七日に"}, {"t": 1347.75, "x": "NASAへ提出されています。"}, {"t": 1349.3166666666666, "x": "目標は、優先する順に三つ。"}, {"t": 1351.9, "x": "エウロパで生命の証拠を探すこと。"}, {"t": 1354.2833333333333, "x": "着陸機でなければできない方法で、"}, {"t": 1356.5666666666666, "x": "生き物が住める環境かどうかを調べること。"}, {"t": 1359.7166666666667, "x": "将来の探査のために、着陸した場所の"}, {"t": 1362.6, "x": "表面と地下の性質を調べること。"}, {"t": 1364.8666666666666, "x": "報告書のあとに示された計画の"}, {"t": 1367.0166666666667, "x": "姿は、次のようなものでした。"}, {"t": 1369.3166666666666, "x": "打ち上げは、NASAの大型ロケットで、"}, {"t": 1371.8166666666666, "x": "二〇二四年を目標とする。"}, {"t": 1374.25, "x": "着陸機は、クリッパーとは別に打ち上げる。"}, {"t": 1377.35, "x": "木星に着いたら、軌道を少しずつ下げてエウロパに"}, {"t": 1380.65, "x": "近づき、最後は、空中で機体をつり下げて降ろす、"}, {"t": 1384.6166666666666, "x": "スカイクレーンと呼ばれる方式で着地する。"}, {"t": 1387.4833333333333, "x": "狙った地点からのずれは、百メートル。"}, {"t": 1390.2, "x": "地表での仕事は、二十日あまり。"}, {"t": 1391.4666666666667, "x": "二十日あまり█"}, {"t": 1392.5833333333333, "x": "電池に蓄えた四十五キロワット時の電気が、すべてです。"}, {"t": 1396.55, "x": "ロボットアームで、深さ十センチメートルか、"}, {"t": 1399.4666666666667, "x": "それより下から、五か所の試料を採る。"}, {"t": 1402.4166666666667, "x": "一か所につき七立方センチメートル以上。"}, {"t": 1405.1333333333334, "x": "それを機内の装置で調べる。"}, {"t": 1407.0833333333333, "x": "一回の採取と分析は、地球の一日ほどで終える計画でした。"}, {"t": 1411.55, "x": "調べるための道具として、資料には、試料に"}, {"t": 1414.9666666666667, "x": "含まれる物質を分けて重さを量る装置、〇・"}, {"t": 1417.7, "x": "二マイクロメートルの細かさまで見える顕微鏡、"}, {"t": 1421.1833333333334, "x": "光の散らばり方で成分を調べる装置、そして、"}, {"t": 1425.0666666666666, "x": "地面の揺れを感じ取る地震計が挙げられています。"}, {"t": 1428.3333333333333, "x": "地震計は、木星の重力で氷が伸び縮みする"}, {"t": 1431.8666666666666, "x": "周期を、少なくとも二回、地球の日数で七日"}, {"t": 1435.55, "x": "ぶん聞き続けることが求められていました。"}, {"t": 1437.9166666666667, "x": "同じ資料には、火星の着陸機との比べ方も載っています。"}, {"t": 1441.9833333333333, "x": "火星探査車キュリオシティは、深さ二十ミリメートルから"}, {"t": 1445.4666666666667, "x": "五十ミリメートルの試料を採り、主な任務の"}, {"t": 1448.4166666666667, "x": "期間は、地球の日数で六百八十三日でした。"}, {"t": 1452.0333333333333, "x": "エウロパの着陸機は、深さ百ミリメートル以上から"}, {"t": 1455.4666666666667, "x": "試料を採り、任務の期間は、地球の日数で二十日。"}, {"t": 1459.45, "x": "掘る深さは二倍から五倍。"}, {"t": 1461.2666666666667, "x": "使える日数は、三十四分の一ほどです。"}, {"t": 1464.5666666666666, "x": "二十日で終わるのは、電池のせいだけではありません。"}, {"t": 1467.85, "x": "着陸機は、地球と直接やりとりできるほど"}, {"t": 1471.05, "x": "大きなアンテナを積めません。"}, {"t": 1472.5833333333333, "x": "上空を回る中継機を通して通信します。"}, {"t": 1475.5833333333333, "x": "その中継機の寿命が、放射線のために、"}, {"t": 1478.5833333333333, "x": "およそ三十日に限られる、と資料には書かれています。"}, {"t": 1482.6666666666667, "x": "中継機が先に力尽きれば、着陸機がどれだけ"}, {"t": 1486.1, "x": "元気でも、結果は地球に届きません。"}, {"t": 1488.75, "x": "機体全体の重さの三分の二は、進むことと"}, {"t": 1491.9333333333334, "x": "止まることのために使われる、とも書かれています。"}, {"t": 1495.1, "x": "木星まで行き、エウロパに近づき、減速して降りる。"}, {"t": 1499.2833333333333, "x": "そのための燃料と装置が大半を占め、"}, {"t": 1501.7666666666667, "x": "科学のための装置に割けるのは、"}, {"t": 1504.0833333333333, "x": "余裕を含めて四十二・五キログラムでした。"}, {"t": 1505.1333333333334, "x": "四十二・五キログラム█"}, {"t": 1507.2833333333333, "x": "二〇一七年の段階で、この計画は、"}, {"t": 1510.2333333333333, "x": "二〇二四年の打ち上げ、二〇二九年の"}, {"t": 1513.7666666666667, "x": "木星到着という日程を描いていました。"}, {"t": 1516.4, "x": "その日程は、実現しませんでした。"}, {"t": 1519.0833333333333, "x": "二〇二一年度の予算からは、着陸機を"}, {"t": 1522.2166666666667, "x": "名指しする文言が消えた、とされています。"}, {"t": 1525.0333333333333, "x": "決め手になったのは、二〇二二年四月に、"}, {"t": 1526.6, "x": "二〇二二年四月█"}, {"t": 1528.0, "x": "アメリカの科学者の団体である全米アカデミーズが"}, {"t": 1531.35, "x": "出した、次の十年の惑星探査の優先順位でした。"}, {"t": 1535.0166666666667, "x": "報告は、氷の衛星に生命の手がかりを探しに行く"}, {"t": 1538.7833333333333, "x": "大型の計画として、エウロパではなく、"}, {"t": 1541.6333333333334, "x": "土星の衛星エンケラドスを選びました。"}, {"t": 1544.4166666666667, "x": "軌道の上から噴き出しを調べた"}, {"t": 1546.3666666666666, 。"}, {"t": 1767.9833333333333, "x": "ジュースは、ガニメデ、カリスト、エウロパの"}, {"t": 1771.3666666666666, "x": "三つの衛星のそばを、合わせて三十五回通る計画です。"}, {"t": 1775.4333333333334, "x": "こちらも、エウロパのそばは"}, {"t": 1777.3166666666666, "x": "通り過ぎるだけで、降りる予定はありません。"}, {"t": 1780.15, "x": "二つの探査機が、同じ時期に、"}, {"t": 1782.4833333333333, "x": "同じ木星のまわりを回ることになります。"}, {"t": 1785.45, "x": "どちらも、エウロパの氷には触れません。"}, {"t": 1788.2833333333333, "x": "クリッパーには、もうひとつ、積み荷があります。"}, {"t": 1791.65, "x": "電子機器の箱に、タンタルという金属の"}, {"t": 1792.7666666666667, "x": "タンタル█"}, {"t": 1794.4666666666667, "x": "板が取り付けられています。"}, {"t": 1796.0, "x": "大きさは、縦横およそ十八センチメートルと"}, {"t": 1799.1333333333334, "x": "二十八センチメートル。"}, {"t": 1800.5666666666666, "x": "そこには、百三の言語で録音された「水」という"}, {"t": 1804.85, "x": "言葉の音の形が刻まれています。"}, {"t": 1807.0666666666666, "x": "アメリカの桂冠詩人エイダ・リモンがエウロパのために"}, {"t": 1808.2333333333333, "x": "エイダ・リモン█"}, {"t": 1810.0, "x": "書いた詩も、本人の手書きの文字で刻まれました。"}, {"t": 1813.3, "x": "題は「神秘をたたえて」。"}, {"t": 1815.35, "x": "詩は二〇二三年六月一日に発表され、その年の"}, {"t": 1819.4166666666667, "x": "六月から十二月まで、NASAはこの詩に名前を"}, {"t": 1822.6, "x": "添えて送る呼びかけを、世界に向けて行いました。"}, {"t": 1825.9666666666667, "x": "板には、親指の爪ほどのシリコンの"}, {"t": 1828.6333333333334, "x": "小片も添えられています。"}, {"t": 1830.2, "x": "この詩に名前を寄せた、二百六十万人あまりの名前が、"}, {"t": 1834.15, "x": "髪の毛の千分の一より細い線で書き込まれています。"}, {"t": 1837.8333333333333, "x": "計画どおりにいけば、この板は二〇三四年、"}, {"t": 1841.1833333333334, "x": "クリッパーとともに、ガニメデに落ちます。"}, {"t": 1844.2333333333333, "x": "エウロパの表面に、触れることはありません。"}, {"t": 1847.1833333333334, "x": "一六一〇年に光の点として見つかったエウロパは、"}, {"t": 1850.4166666666667, "x": "一九七九年にひびの入った氷の球になり、"}, {"t": 1854.25, "x": "二〇〇〇年には、磁場の向きから、その下に"}, {"t": 1857.6, "x": "水があると言われる天体になりました。"}, {"t": 1859.8166666666666, "x": "いま手元にあるエウロパのいちばん細かい写真は、"}, {"t": 1862.6666666666667, "x": "ガリレオが撮ったもので、一つの画素が約六メートルです。"}, {"t": 1866.7166666666667, "x": "氷の割れ目や、崩れた塊の一つ一つが見えます。"}, {"t": 1870.5, "x": "けれど、そこに写っているのは、"}, {"t": 1872.6166666666666, "x": "どこまでいっても、氷の表面です。"}, {"t": 1875.5666666666666, "x": "その下、二十九キロメートルほどのところから"}, {"t": 1878.65, "x": "始まるとされる海を、撮った者はいません。"}, {"t": 1881.45, "x": "どれだけ塩辛いのか。"}, {"t": 1882.9833333333333, "x": "どれだけ温かいのか。"}, {"t": 1884.5, "x": "何かが住んでいるのか。"}, {"t": 1886.05, "x": "記録にあるのは、磁場の反転と、表面に出てきた塩と"}, {"t": 1890.1333333333334, "x": "炭素と、出たり出なかったりする水蒸気の影だけです。"}, {"t": 1893.7166666666667, "x": "ガリレオが磁場の反転をとらえてから、二十六年。"}, {"t": 1897.15, "x": "海があるという見立ては、そのあいだ、"}, {"t": 1899.55, "x": "一度も崩れていません。"}, {"t": 1901.4, "x": "そして、一度も、目で確かめられていません。"}, {"t": 1904.8666666666666, "x": "二〇一六年に描かれた着陸機も、"}, {"t": 1907.2833333333333, "x": "氷を割るための機械ではありませんでした。"}, {"t": 1910.15, "x": "深さ十センチメートルの試料を採るための機械です。"}, {"t": 1913.35, "x": "二十九キロメートルの氷の、"}, {"t": 1915.2833333333333, "x": "およそ三十万分の一の深さです。"}, {"t": 1917.9833333333333, "x": "二〇三〇年、クリッパーは木星に着きます。"}, {"t": 1921.35, "x": "四十九回の接近で、氷の厚さや、"}, {"t": 1924.35, "x": "中にたまった水や、表面に出てきた物質の"}, {"t": 1927.8166666666666, "x": "地図が、少しずつ埋まっていくはずです。"}, {"t": 1930.3666666666666, "x": "それでも、その地図の中に、"}, {"t": 1932.4333333333334, "x": "海そのものを写した一枚は入りません。"}, {"t": 1935.3, "x": "一九七二年に最初の探査機が出発してから、五十四年。"}, {"t": 1940.0666666666666, "x": "人類がエウロパに届けたのは、光と電波と、"}, {"t": 1943.25, "x": "そばを通り過ぎる機械だけです。"}, {"t": 1945.5333333333333, "x": "氷に触れたものは、まだありません。"}, {"t": 1948.0833333333333, "x": "触れないと決めたのは、海を見つけた側でした。"}, {"t": 1951.2666666666667, "x": "海があると分かったから、降りられなくなった。"}, {"t": 1954.2, "x": "エウロパの五十四年は、その順番で進んでいます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
