<script>
const D={"name": "ep019", "file": "ep019", "dur": 1955.65, "segs": [], "subs": [{"t": 0.0, "x": "二〇二五年七月一日。"}, {"t": 2.216666666666667, "x": "南米チリの山あいにある望遠鏡が、"}, {"t": 4.616666666666666, "x": "いつもどおり夜空を撮っていました。"}, {"t": 6.966666666666667, "x": "一枚あたり三十秒。"}, {"t": 8.683333333333334, "x": "同じ場所を、時間をおいて四回です。"}, {"t": 11.466666666666667, "x": "この望遠鏡の仕事は、地球にぶつかるかも"}, {"t": 14.516666666666667, "x": "しれない小さな天体を、早めに見つけることです。"}, {"t": 17.883333333333333, "x": "NASAが資金を出している観測網の一つで、"}, {"t": 20.483333333333334, "x": "チリのリオウルタドという場所に置かれています。"}, {"t": 23.333333333333332, "x": "名前はATLAS。"}, {"t": 25.166666666666668, "x": "英語の頭文字を並べた略称で、"}, {"t": 27.45, "x": "日本語にすれば「小惑星が地球にぶつかる"}, {"t": 30.9, "x": "前の最後の警報」といった意味になります。"}, {"t": 33.833333333333336, "x": "四枚の画像の中で、一つの光の点が、"}, {"t": 36.9, "x": "少しずつ位置を変えていました。"}, {"t": 39.06666666666667, "x": "動く点そのものは、珍しくありません。"}, {"t": 41.93333333333333, "x": "毎晩いくつも見つかります。"}, {"t": 43.71666666666667, "x": "ところが、この点の動きから道筋を計算すると、"}, {"t": 47.21666666666667, "x": "どうしても太陽のまわりを回る形になりませんでした。"}, {"t": 50.85, "x": "太陽に一度だけ近づき、そのまま出ていく。"}, {"t": 54.1, "x": "二度と戻らない道筋です。"}, {"t": 55.96666666666667, "x": "翌日、世界の観測をまとめている小惑星センターが、"}, {"t": 60.016666666666666, "x": "この天体に新しい名前を付けました。"}, {"t": 62.833333333333336, "x": "3I/ATLAS。"}, {"t": 65.16666666666667, "x": "頭の「3」は、三番目という意味です。"}, {"t": 68.95, "x": "「I」は、恒星と恒星のあいだ、という"}, {"t": 72.38333333333334, "x": "意味の英語の頭文字です。"}, {"t": 74.1, "x": "太陽系の外から来たと確かめられた天体の、三番目。"}, {"t": 78.15, "x": "人類がこうした天体を見つけたのは、"}, {"t": 80.43333333333334, "x": "それまでに二回しかありませんでした。"}, {"t": 82.93333333333334, "x": "一つ目は細長いかもしれない岩のような何か。"}, {"t": 85.96666666666667, "x": "二つ目は、ちゃんと尾を引いた彗星。"}, {"t": 88.51666666666667, "x": "そして三つ目。"}, {"t": 89.6, "x": "三つとも、望遠鏡には写っています。"}, {"t": 92.43333333333334, "x": "ただ、どれも本体の形は写っていません。"}, {"t": 95.45, "x": "写っているのは、光の点か、ぼんやりしたしみです。"}, {"t": 99.31666666666666, "x": "この回では、太陽系の外から来た三つの天体に"}, {"t": 102.8, "x": "ついて、残っている記録を読んでいきます。"}, {"t": 105.6, "x": "写らなかったものを、人はどんな手がかりで、"}, {"t": 108.38333333333334, "x": "どこまで言い当てようとしたのか。"}, {"t": 110.53333333333333, "x": "それを、言えることと言えないことに分けて並べます。"}, {"t": 113.96666666666667, "x": "最初の一つが見つかったのは、二〇一七年十月十九日です。"}, {"t": 118.48333333333333, "x": "場所は、ハワイのマウイ島にある山、ハレアカラの頂上。"}, {"t": 122.56666666666666, "x": "そこに置かれた口径一・八メートルの望遠鏡、"}, {"t": 125.7, "x": "パンスターズ1が、夜空の中に速く動く点を捉えました。"}, {"t": 129.98333333333332, "x": "この望遠鏡も、地球に近づく"}, {"t": 132.4, "x": "小さな天体を探すためのものです。"}, {"t": 134.61666666666667, "x": "ヨーロッパ南天天文台の発表によれば、"}, {"t": 137.21666666666667, "x": "動く点に最初に気づいたのは、"}, {"t": 139.41666666666666, "x": "ハワイ大学のロバート・ウェリクでした。"}, {"t": 141.86666666666667, "x": "見つかったとき、この天体は"}, {"t": 143.93333333333334, "x": "すでに太陽のそばを通り過ぎていました。"}, {"t": 146.41666666666666, "x": "太陽にいちばん近づいたのは、九月九日です。"}, {"t": 149.83333333333334, "x": "そのときの距離は、太陽から"}, {"t": 151.91666666666666, "x": "地球までの距離の四分の一ほどでした。"}, {"t": 154.4, "x": "水星の軌道よりも内側です。"}, {"t": 156.58333333333334, "x": "地球にいちばん近づいたのは、十月十四日。"}, {"t": 159.91666666666666, "x": "距離は、およそ二千四百二十万キロメートル。"}, {"t": 163.28333333333333, "x": "月までの距離の六十倍あまりです。"}, {"t": 165.66666666666666, "x": "JPLの記録では、そのときの地球との"}, {"t": 168.66666666666666, "x": "速さの差は、秒速六十キロメートルほど。"}, {"t": 171.75, "x": "一秒で、東京から横浜までより遠くへ進む速さです。"}, {"t": 175.9, "x": "つまり、見つかったのは、地球の"}, {"t": 178.45, "x": "そばを過ぎてから五日後でした。"}, {"t": 180.28333333333333, "x": "もう、遠ざかり始めていたのです。"}, {"t": 182.78333333333333, "x": "小惑星センターが最初の知らせを"}, {"t": 184.98333333333332, "x": "出したのは、十月二十五日。"}, {"t": 187.33333333333334, "x": "見つかってから六日後のことです。"}, {"t": 189.36666666666667, "x": "その六日のあいだに、いくつもの望遠鏡が"}, {"t": 192.31666666666666, "x": "位置を測り、道筋の計算がくり返されました。"}, {"t": 195.7, "x": "では、なぜこれが太陽系の外から来たと分かったのか。"}, {"t": 199.36666666666667, "x": "手がかりは、道筋の形でした。"}, {"t": 201.93333333333334, "x": "太陽のまわりを回る天体は、楕円を描きます。"}, {"t": 205.45, "x": "細長い楕円もありますが、いつかは戻ってきます。"}, {"t": 208.9, "x": "楕円がどれだけつぶれているかを表す数に、"}, {"t": 211.51666666666668, "x": "離心率というものがあります。"}, {"t": 213.63333333333333, "x": "ちょうど円ならゼロ。"}, {"t": 214.86666666666667, "x": "つぶれるほど一に近づきます。"}, {"t": 216.83333333333334, "x": "一より小さいあいだは、どれだけ"}, {"t": 219.13333333333333, "x": "細長くても、いつか戻ってくる道筋です。"}, {"t": 222.2, "x": "一をちょうど超えると、道筋は閉じなくなります。"}, {"t": 225.65, "x": "太陽のそばで向きを変えたあと、"}, {"t": 227.61666666666667, "x": "二度と戻らない線になります。"}, {"t": 229.81666666666666, "x": "小惑星センターが十月二十五日に出した最初の知らせには、"}, {"t": 233.75, "x": "離心率はおよそ一・一九と書かれていました。"}, {"t": 237.03333333333333, "x": "知らせは、こう続きます。"}, {"t": 239.1, "x": "強い双曲線の軌道だけが、成り立つ答えである。"}, {"t": 242.63333333333333, "x": "これは、はっきりした恒星間の"}, {"t": 244.78333333333333, "x": "彗星の、最初の例かもしれない。"}, {"t": 247.3, "x": "一・一九という数字は、小さく見えるかもしれません。"}, {"t": 251.08333333333334, "x": "ただ、大事なのは一を超えているかどうかです。"}, {"t": 254.25, "x": "この天体は、太陽に向かって落ちてくる前から、"}, {"t": 257.53333333333336, "x": "太陽系を出ていけるほどの速さを持っていました。"}, {"t": 260.81666666666666, "x": "NASAの記録では、太陽から十分遠くにいたときの"}, {"t": 264.23333333333335, "x": "速さは、秒速およそ二十六キロメートル。"}, {"t": 267.28333333333336, "x": "太陽のそばを回るときには、"}, {"t": 269.05, "x": "秒速八十七キロメートルあまりまで速くなりました。"}, {"t": 272.75, "x": "太陽の引力で速くなり、また遅くなる。"}, {"t": 275.85, "x": "それでも、捕まえられるほどには遅くならない。"}, {"t": 278.95, "x": "来た方向も計算されました。"}, {"t": 280.95, "x": "こと座の明るい星、ベガのある方角です。"}, {"t": 284.06666666666666, "x": "ただ、ベガから来たという意味ではありません。"}, {"t": 286.8666666666667, "x": "NASAの説明では、オウムアムアがその方角の"}, {"t": 289.93333333333334, "x": "あたりにいたのは、およそ三十万年前。"}, {"t": 292.75, "x": "旅に時間がかかりすぎて、そのころのベガは、"}, {"t": 295.8, "x": "その場所にはいなかったとしています。"}, {"t": 298.1333333333333, "x": "どこで生まれたのかは、分かっていません。"}, {"t": 300.78333333333336, "x": "ヨーロッパ南天天文台は、こう書いています。"}, {"t": 304.0, "x": "この天体は、何億年ものあいだ、どの恒星にも属さずに、"}, {"t": 308.45, "x": "天の川の中をさまよっていたのかもしれない。"}, {"t": 311.45, "x": "長い時間ひとりで旅をしてきたものが、"}, {"t": 313.71666666666664, "x": "たまたま太陽のそばを通った。"}, {"t": 315.95, "x": "そして人間の望遠鏡が気づいたのは、"}, {"t": 318.35, "x": "すでに帰り道に入ってからでした。"}, {"t": 320.81666666666666, "x": "見つかった直後、この天体には「C」で"}, {"t": 324.4, "x": "始まる符号が付きました。"}, {"t": 325.98333333333335, "x": "C/2017 U1。"}, {"t": 328.75, "x": "「C」は、彗星を表す記号です。"}, {"t": 331.9, "x": "太陽のそばを速く通り抜ける天体は、"}, {"t": 334.4, "x": "たいてい氷を含んだ彗星だからです。"}, {"t": 337.15, "x": "ところが、彗星なら見えるはずのものが、"}, {"t": 339.93333333333334, "x": "見えませんでした。"}, {"t": 341.35, "x": "彗星は、太陽に温められると、"}, {"t": 343.96666666666664, "x": "表面の氷が気体になって噴き出します。"}, {"t": 346.85, "x": "そのとき、細かい塵もいっしょに飛び出し、"}, {"t": 349.75, "x": "本体のまわりにぼんやりした雲を作ります。"}, {"t": 352.7, "x": "この雲をコマと呼びます。"}, {"t": 354.3666666666667, "x": "さらに太陽の光や風に押されて、尾が伸びます。"}, {"t": 357.93333333333334, "x": "この天体は、太陽の四分の一の距離まで近づいていました。"}, {"t": 362.1333333333333, "x": "ふつうの彗星なら、何かが出ていても"}, {"t": 364.78333333333336, "x": "おかしくない距離です。"}, {"t": 366.01666666666665, "x": "ヨーロッパ南天天文台の大型望遠鏡、VLTで、"}, {"t": 370.06666666666666, "x": "何枚もの画像を重ね合わせて、かすかな光まで探しました。"}, {"t": 374.5833333333333, "x": "ハワイ大学のカレン・ミーチは、"}, {"t": 376.3833333333333, "x": "その結果を小惑星センターに伝えました。"}, {"t": 379.3833333333333, "x": "非常に深く重ね合わせた画像で、"}, {"t": 381.56666666666666, "x": "この天体は、完全に星のように見える。"}, {"t": 384.85, "x": "星のように見える、というのは、"}, {"t": 387.05, "x": "ただの点だということです。"}, {"t": 388.96666666666664, "x": "まわりにぼんやりした広がりが無い、という意味です。"}, {"t": 392.26666666666665, "x": "同じ十月二十五日、符号は書き換えられました。"}, {"t": 395.95, "x": "A/2017 U1。"}, {"t": 398.6, "x": "「A」は、小惑星の記号です。"}, {"t": 401.43333333333334, "x": "一九九五年に決められた、彗星の符号の"}, {"t": 405.05, "x": "付け方の決まりに合わせた変更でした。"}, {"t": 407.3666666666667, "x": "中身を調べて決めたのではありません。"}, {"t": 409.7, "x": "見た目で決めたのです。"}, {"t": 411.1333333333333, "x": "ぼんやりしていれば彗星。"}, {"t": 412.76666666666665, "x": "点なら小惑星。"}, {"t": 414.15, "x": "この天体について手に入った材料は、"}, {"t": 416.53333333333336, "x": "その見た目しかありませんでした。"}, {"t": 418.7, "x": "ただ、この名札も長くは続きませんでした。"}, {"t": 421.8, "x": "太陽系の外から来た天体を、太陽系の中の"}, {"t": 425.25, "x": "小惑星や彗星と同じ棚に並べてよいのか。"}, {"t": 428.3, "x": "そういう問題が出てきたからです。"}, {"t": 430.4, "x": "十一月六日、小惑星センターは、"}, {"t": 433.25, "x": "新しい番号の列を作ったと知らせました。"}, {"t": 436.4, "x": "太陽系の外から来た天体のための、「I」の番号です。"}, {"t": 440.81666666666666, "x": "最初の一つには、1Iが与えられました。"}, {"t": 443.96666666666664, "x": "名前も付けられました。"}, {"t": 445.43333333333334, "x": "見つけたパンスターズのチームが"}, {"t": 447.18333333333334, "x": "選んだ、ハワイ語の名前です。"}, {"t": 449.3, "x": "オウムアムア。"}, {"t": 450.18333333333334, "x": "小惑星センターの知らせによれば、「オウ」は"}, {"t": 453.51666666666665, "x": "手を伸ばす、という意味。"}, {"t": 455.3666666666667, "x": "「ムア」は、最初の、先に、という意味で、"}, {"t": 459.18333333333334, "x": "二つ重ねることで強めています。"}, {"t": 461.5833333333333, "x": "遠い過去から、私たちに手を伸ばすために"}, {"t": 464.3833333333333, "x": "送られてきた、斥候、あるいは使者。"}, {"t": 467.4, "x": "知らせには、そういう説明が添えられていました。"}, {"t": 470.7, "x": "彗星として登録され、小惑星に書き換えられ、"}, {"t": 474.18333333333334, "x": "最後にはどちらでもない新しい棚ができた。"}, {"t": 477.25, "x": "見つかってから三週間足らずのあいだに、"}, {"t": 479.56666666666666, "x": "名札は二度書き換えられました。"}, {"t": 481.75, "x": "名札が決まらなかったのは、"}, {"t": 483.31666666666666, "x": "中身が分からなかったからです。"}, {"t": 485.53333333333336, "x": "そして、その中身を確かめる時間は、"}, {"t": 488.31666666666666, "x": "ほとんど残っていませんでした。"}, {"t": 490.43333333333334, "x": "オウムアムアは、見つかった時点で、"}, {"t": 492.73333333333335, "x": "すでに地球からも太陽からも遠ざかっていました。"}, {"t": 496.01666666666665, "x": "NASAの記録では、火星の"}, {"t": 497.9, "x": "軌道を越えたのが十一月一日ごろ。"}, {"t": 500.45, "x": "十一月二十日には、地球から"}, {"t": 502.76666666666665, "x": "二億キロメートルほど離れていました。"}, {"t": 504.96666666666664, "x": "火星と木星の軌道のあいだほどの距離です。"}, {"t": 507.73333333333335, "x": "太陽に対する速さは、そのころでも"}, {"t": 510.3833333333333, "x": "時速十三万キロメートルあまり。"}, {"t": 512.4666666666667, "x": "遠ざかるほど、跳ね返す光は弱くなります。"}, {"t": 515.7666666666667, "x": "日ごとに暗くなっていく点を、世界中の"}, {"t": 518.6, "x": "望遠鏡が追いかけることになります。"}, {"t": 520.8166666666667, "x": "オウムアムアの本体は、どの望遠鏡でも点にしか"}, {"t": 524.25, "x": "写りませんでした。"}, {"t": 525.3166666666667, "x": "それでも、いまでは「細長い"}, {"t": 527.75, "x": "形をしていたらしい」と言われています。"}, {"t": 530.45, "x": "写っていないのに、なぜ形の話ができるのか。"}, {"t": 533.8333333333334, "x": "手がかりは、明るさの揺れでした。"}, {"t": 536.2666666666667, "x": "天体は、自分では光りません。"}, {"t": 538.6833333333333, "x": "太陽の光を跳ね返して光っています。"}, {"t": 541.2333333333333, "x": "丸い天体なら、どちらを向いても、"}, {"t": 543.6833333333333, "x": "跳ね返す光の量はあまり変わりません。"}, {"t": 546.45, "x": "ところが、細長い天体が回っていると、話が変わります。"}, {"t": 550.8833333333333, "x": "横腹をこちらに向けたときは、光を"}, {"t": 553.5166666666667, "x": "跳ね返す面が広くなって明るく見えます。"}, {"t": 556.05, "x": "端をこちらに向けたときは、面が狭くなって暗く見えます。"}, {"t": 559.9833333333333, "x": "つまり、明るさの変わり方を"}, {"t": 562.1166666666667, "x": "測れば、形の見当がつけられます。"}, {"t": 564.8333333333334, "x": "ヨーロッパ南天天文台のVLTは、四種類の色の"}, {"t": 568.6333333333333, "x": "フィルターを使って、オウムアムアの明るさを測りました。"}, {"t": 572.25, "x": "その結果は、二〇一七年十一月二十日、"}, {"t": 575.5166666666667, "x": "科学誌ネイチャーに報告されました。"}, {"t": 578.0166666666667, "x": "明るさは、十倍も変わっていました。"}, {"t": 580.6666666666666, "x": "その揺れが、およそ七・三時間ごとに"}, {"t": 583.4666666666667, "x": "くり返されていました。"}, {"t": 584.8, "x": "一回転にかかる時間です。"}, {"t": 586.6333333333333, "x": "十倍という揺れは、太陽系の"}, {"t": 588.9, "x": "小惑星と比べても、とても大きなものです。"}, {"t": 592.0166666666667, "x": "そこから計算すると、長さは幅の十倍ほど。"}, {"t": 595.5, "x": "長さは少なくとも四百メートル。"}, {"t": 597.7, "x": "暗い赤色で、太陽系の外側にある"}, {"t": 600.55, "x": "天体の色に近い、とされました。"}, {"t": 603.0, "x": "細長い岩が、宇宙を回りながら飛んでいる。"}, {"t": 606.2166666666667, "x": "当時、そういう絵がたくさん描かれました。"}, {"t": 609.2166666666667, "x": "ただ、ここは正確に言っておく必要があります。"}, {"t": 612.4833333333333, "x": "その絵は、写真ではありません。"}, {"t": 614.7666666666667, "x": "明るさの揺れを説明できる形を、計算で考えたものです。"}, {"t": 619.1, "x": "同じ揺れは、別の形でも起こりえます。"}, {"t": 622.0333333333333, "x": "表面の場所によって、光を跳ね返す強さが"}, {"t": 625.2666666666667, "x": "違えば、それだけで明るさは変わります。"}, {"t": 628.0333333333333, "x": "回り方が単純な一定の回転ではなく、"}, {"t": 630.7, "x": "いくつもの軸で転がるように回っていれば、"}, {"t": 633.55, "x": "揺れ方はもっと複雑になります。"}, {"t": 635.9333333333333, "x": "実際、その後の解析では、オウムアムアは"}, {"t": 639.25, "x": "一つの軸でまっすぐ回っているのではなく、"}, {"t": 641.7666666666667, "x": "転がるように回っていたと考えられています。"}, {"t": 644.7666666666667, "x": "こまのように一定に回るのではなく、"}, {"t": 646.95, "x": "投げられた棒のように、向きを変えながら回る。"}, {"t": 650.4, "x": "そうなると、明るさの揺れから"}, {"t": 652.55, "x": "形を逆算するのは、ずっと難しくなります。"}, {"t": 655.9, "x": "細長い形というのは、いくつかある答えの中で、"}, {"t": 659.3333333333334, "x": "いちばん素直な答えだった、ということです。"}, {"t": 662.6166666666667, "x": "もう一つ、大きさを測る別の手がかりがありました。"}, {"t": 666.2166666666667, "x": "熱です。"}, {"t": 667.0166666666667, "x": "太陽に温められた天体は、目に見えない赤外線を出します。"}, {"t": 671.4, "x": "温かいものほど、たくさん出します。"}, {"t": 673.9666666666667, "x": "大きい天体ほど、たくさん出します。"}, {"t": 676.5833333333334, "x": "明るさだけでは、大きくて暗い色なのか、"}, {"t": 679.4833333333333, "x": "小さくて白っぽいのかを区別できません。"}, {"t": 682.3, "x": "赤外線を測れば、それを見分けられます。"}, {"t": 685.4333333333333, "x": "二〇一七年十一月、NASAの赤外線の宇宙望遠鏡、"}, {"t": 689.7333333333333, "x": "スピッツァーが、オウムアムアに向けられました。"}, {"t": 692.9833333333333, "x": "結果は、写りませんでした。"}, {"t": 695.1333333333333, "x": "暗すぎて、赤外線が検出できなかったのです。"}, {"t": 698.6166666666667, "x": "ところが、写らなかったこと自体が、"}, {"t": 701.1166666666667, "x": "答えの一部になりました。"}, {"t": 703.0666666666667, "x": "これだけ探して写らないなら、大きさには上限がある。"}, {"t": 706.75, "x": "北アリゾナ大学のチームは二〇一八年、"}, {"t": 709.5, "x": "そう考えて計算しました。"}, {"t": 711.65, "x": "三つの方向の長さは、九十八メートル、"}, {"t": 714.7333333333333, "x": "百四十メートル、四百メートルより小さい。"}, {"t": 718.3333333333334, "x": "そして、もしその大きさなら、太陽系の"}, {"t": 721.4666666666667, "x": "彗星よりも最大で十倍ほど、光をよく跳ね返す"}, {"t": 725.1, "x": "表面だったことになる、としています。"}, {"t": 727.5666666666667, "x": "明るさの揺れから、細長いらしいと分かった。"}, {"t": 730.7666666666667, "x": "熱が見えなかったことから、大きさの上限が分かった。"}, {"t": 734.4333333333333, "x": "どちらも、姿を見たわけではありません。"}, {"t": 737.2, "x": "点の明るさと、点が見えなかったことから、"}, {"t": 740.1, "x": "形と大きさの範囲を絞り込んだ記録です。"}, {"t": 743.2333333333333, "x": "オウムアムアの本当の姿を知っている者は、"}, {"t": 745.9333333333333, "x": "いまもいません。"}, {"t": 747.1833333333333, "x": "オウムアムアの記録には、もう一つ、"}, {"t": 749.65, "x": "説明に長い時間がかかったものがあります。"}, {"t": 752.6166666666667, "x": "道筋のずれです。"}, {"t": 753.9666666666667, "x": "天体がどこを通るかは、太陽や惑星の引力を"}, {"t": 757.4, "x": "足し合わせれば、かなり正確に計算できます。"}, {"t": 760.6166666666667, "x": "望遠鏡でその位置を何度も測り、計算と比べます。"}, {"t": 764.5, "x": "見つかってからの数か月、ハッブル宇宙望遠鏡や、ハワイ、"}, {"t": 768.8333333333334, "x": "チリの大型望遠鏡がオウムアムアを追い続けました。"}, {"t": 772.45, "x": "集めた位置を並べると、少しだけ"}, {"t": 774.9833333333333, "x": "合わないところがありました。"}, {"t": 776.4833333333333, "x": "引力だけで計算した場所より、ほんの少し先にいたのです。"}, {"t": 780.5333333333333, "x": "二〇一八年六月二十七日、ヨーロッパ宇宙機関の"}, {"t": 784.5333333333333, "x": "マルコ・ミケーリらのチームが、"}, {"t": 786.0833333333334, "x": "これを科学誌ネイチャーに報告しました。"}, {"t": 788.7833333333333, "x": "何かが、オウムアムアを後ろからそっと押していた。"}, {"t": 792.1166666666667, "x": "引力以外の力が働いていた、という結論です。"}, {"t": 795.7833333333333, "x": "報告によれば、六月一日の時点で、"}, {"t": 798.7666666666667, "x": "オウムアムアは太陽に対して時速"}, {"t": 801.1833333333333, "x": "およそ十一万四千キロメートルで遠ざかっていました。"}, {"t": 804.4833333333333, "x": "そのわずかな上乗せが、何か月もの位置の"}, {"t": 807.3666666666667, "x": "記録に積み重なって、ずれとして現れたのです。"}, {"t": 810.7, "x": "しかも、その押す力は、太陽から"}, {"t": 813.5333333333333, "x": "離れるほど弱くなっていました。"}, {"t": 815.4, "x": "チームは、これは彗星によく見られる特徴だとしました。"}, {"t": 819.2166666666667, "x": "太陽に温められて、表面から気体が噴き出す。"}, {"t": 822.8, "x": "噴き出した気体が、ロケットのように本体を押す。"}, {"t": 826.05, "x": "太陽から遠ざかって冷えれば、噴き出しは弱まる。"}, {"t": 829.4333333333333, "x": "ここで、第2章の話に戻ります。"}, {"t": 832.2, "x": "オウムアムアには、コマも尾も見えませんでした。"}, {"t": 835.2, "x": "気体が出ていたなら、塵も出ていたはずです。"}, {"t": 838.15, "x": "なぜ見えなかったのか。"}, {"t": 839.6, "x": "チームは一つの可能性を挙げています。"}, {"t": 842.1, "x": "長い恒星間の旅のあいだに、表面の細かい塵は"}, {"t": 845.7666666666667, "x": "削られてなくなり、大きく粗い粒だけが残っていた。"}, {"t": 849.35, "x": "大きな粒は、ぼんやりした雲を作りにくい。"}, {"t": 852.3833333333333, "x": "だから見えなかったのかもしれない、という考えです。"}, {"t": 855.75, "x": "そして、同じ発表の中で、もう一つの"}, {"t": 859.0333333333333, "x": "可能性も検討されています。"}, {"t": 860.8833333333333, "x": "オウムアムアが、恒星間を飛ぶ"}, {"t": 863.1333333333333, "x": "宇宙船だったのではないか、という考えです。"}, {"t": 866.2166666666667, "x": "チームは、これを退けました。"}, {"t": 868.55, "x": "理由は二つ書かれています。"}, {"t": 870.3333333333334, "x": "速さの変わり方がなめらかで、途切れずに続いていたこと。"}, {"t": 874.1666666666666, "x": "推進装置の動き方らしくない。"}, {"t": 876.3833333333333, "x": "もう一つは、オウムアムアが三つの"}, {"t": 878.75, "x": "軸すべてで転がるように回っていたことです。"}, {"t": 881.3833333333333, "x": "二〇一九年には、十四人の研究者による国際チームが、"}, {"t": 885.65, "x": "それまでの観測をまとめた論文を出しました。"}, {"t": 888.7833333333333, "x": "題名は「オウムアムアの自然史」。"}, {"t": 891.3, "x": "結論は、観測されたことは、すべて純粋に自然の"}, {"t": 895.2666666666667, "x": "天体として説明できる、というものでした。"}, {"t": 898.2166666666667, "x": "では、何が押していたのか。"}, {"t": 900.2833333333333, "x": "ここは、いまも一つに決まっていません。"}, {"t": 902.95, "x": "いくつもの説が出されてきました。"}, {"t": 904.9833333333333, "x": "その一つが、二〇二三年三月に"}, {"t": 907.8, "x": "ネイチャーに載った、水素の説です。"}, {"t": 910.2333333333333, "x": "オウムアムアが、もともと水の"}, {"t": 912.3333333333334, "x": "氷を多く含んだ天体だったとします。"}, {"t": 914.8166666666667, "x": "恒星と恒星のあいだを旅するあいだ、宇宙を"}, {"t": 917.9666666666667, "x": "飛び交う高いエネルギーの粒子、宇宙線を浴び続けます。"}, {"t": 921.85, "x": "すると、氷の中の水の分子が壊れて、水素ができます。"}, {"t": 926.4166666666666, "x": "できた水素は、氷のすき間に"}, {"t": 928.6, "x": "閉じこめられたまま、何百万年も運ばれます。"}, {"t": 931.9, "x": "太陽に近づいて氷が温まると、氷の並び方が"}, {"t": 935.6666666666666, "x": "変わり、閉じこめられていた水素が抜け出す。"}, {"t": 938.5333333333333, "x": "それがオウムアムアを押した、という説明です。"}, {"t": 941.6666666666666, "x": "水素は、目に見える塵をほとんど"}, {"t": 944.1, "x": "連れ出さずに抜けていけます。"}, {"t": 945.7333333333333, "x": "だから、コマが見えなくても説明がつく、としています。"}, {"t": 949.7333333333333, "x": "論文は、無理に数字を合わせなくても、オウムアムアの"}, {"t": 953.5833333333334, "x": "変わった性質の多くを説明できる、と書いています。"}, {"t": 957.0666666666667, "x": "ただ、これも、確かめられた答えではありません。"}, {"t": 960.55, "x": "オウムアムアはとうに遠ざかり、"}, {"t": 962.3166666666667, "x": "もう一度測り直すことはできないからです。"}, {"t": 965.2333333333333, "x": "NASAの記録によれば、オウムアムアは"}, {"t": 967.6166666666667, "x": "二〇一八年五月に木星の軌道を、"}, {"t": 970.1166666666667, "x": "二〇一九年一月に土星の軌道を越えました。"}, {"t": 973.6166666666667, "x": "向かっている先は、ペガスス座の方角です。"}, {"t": 976.6166666666667, "x": "最後まで、それは点のままでした。"}, {"t": 979.1833333333333, "x": "残ったのは、明るさの揺れの記録と、予定より"}, {"t": 982.7666666666667, "x": "少しだけ先にいたという位置の記録です。"}, {"t": 985.2166666666667, "x": "二つ目は、二年後にやってきました。"}, {"t": 987.7833333333333, "x": "二〇一九年八月三十日。"}, {"t": 990.2333333333333, "x": "見つけたのは、プロの天文台ではありませんでした。"}, {"t": 993.5833333333334, "x": "クリミア半島の町、ナウチニにある、"}, {"t": 996.2333333333333, "x": "MARGOと呼ばれる小さな観測所。"}, {"t": 999.5666666666667, "x": "そこで口径〇・六五メートルの望遠鏡を使っていた、"}, {"t": 1003.1833333333333, "x": "アマチュアの天文家、ゲンナジー・ボリソフです。"}, {"t": 1006.6, "x": "ボリソフは、この天体を彗星の候補として報告しました。"}, {"t": 1010.7, "x": "小惑星センターがこの天体に"}, {"t": 1012.7, "x": "ついての知らせを出したのは、九月十一日。"}, {"t": 1015.8833333333333, "x": "見つかってから十二日後です。"}, {"t": 1017.8333333333334, "x": "符号はC/2019 Q4。"}, {"t": 1020.9333333333333, "x": "「C」は彗星の記号です。"}, {"t": 1023.2, "x": "今度は、書き換えられることはありませんでした。"}, {"t": 1026.25, "x": "オウムアムアとの大きな違いは、"}, {"t": 1028.1, "x": "最初からはっきりしていました。"}, {"t": 1030.2, "x": "この天体は、ぼんやりしていました。"}, {"t": 1032.7666666666667, "x": "コマがあり、尾がありました。"}, {"t": 1034.7666666666667, "x": "小惑星センターが九月十一日に"}, {"t": 1037.1166666666666, "x": "出した知らせにも、いくつもの観測所が"}, {"t": 1039.7166666666667, "x": "コマと尾を確かめたことが書かれています。"}, {"t": 1042.0166666666667, "x": "オウムアムアは、彗星なのか"}, {"t": 1044.05, "x": "小惑星なのかで名札が揺れました。"}, {"t": 1046.3333333333333, "x": "二つ目は、誰が見ても彗星でした。"}, {"t": 1049.0166666666667, "x": "ただ、同じ知らせの中の、ある数字が目を引きました。"}, {"t": 1053.05, "x": "離心率です。"}, {"t": 1054.15, "x": "およそ三・〇八。"}, {"t": 1055.7, "x": "一を超えれば戻ってこない道筋です。"}, {"t": 1058.25, "x": "オウムアムアは一・二ほどでした。"}, {"t": 1060.2833333333333, "x": "この天体は三を超えていました。"}, {"t": 1062.4, "x": "太陽のそばでわずかに曲がるだけで、"}, {"t": 1064.5333333333333, "x": "ほとんどまっすぐに通り抜けていく道筋です。"}, {"t": 1067.5666666666666, "x": "この時点では、まだ見つかって二週間ほどです。"}, {"t": 1070.75, "x": "位置を測った日数が少ないうちは、計算の答えも揺れます。"}, {"t": 1074.95, "x": "離心率が大きいという答えが、"}, {"t": 1076.95, "x": "測り間違いのせいなのか、本当なのか。"}, {"t": 1080.25, "x": "それを見分けるには、もっと長く"}, {"t": 1082.5833333333333, "x": "追いかける必要がありました。"}, {"t": 1084.3, "x": "観測が続き、計算がくり返されました。"}, {"t": 1087.4666666666667, "x": "九月二十四日、小惑星センターは、この天体に"}, {"t": 1091.4333333333334, "x": "二つ目の「I」の番号を与えました。"}, {"t": 1094.6, "x": "2I/ボリソフ。"}, {"t": 1096.1666666666667, "x": "知らせには、観測と解析を続けた結果、双曲線の軌道と、"}, {"t": 1100.95, "x": "恒星間の起源が確かめられた、と書かれています。"}, {"t": 1104.6833333333334, "x": "ボリソフ彗星は、オウムアムアとは違って、"}, {"t": 1107.6833333333334, "x": "太陽に近づく前に見つかりました。"}, {"t": 1110.25, "x": "太陽にいちばん近づいたのは、二〇一九年十二月八日。"}, {"t": 1114.5, "x": "距離は、太陽から地球までの距離のおよそ二倍でした。"}, {"t": 1118.15, "x": "火星の軌道よりも外側です。"}, {"t": 1120.2333333333333, "x": "地球にいちばん近づいたのは、十二月の下旬。"}, {"t": 1123.5666666666666, "x": "距離は、およそ二億九千万キロメートルでした。"}, {"t": 1126.8833333333334, "x": "速さも記録されています。"}, {"t": 1128.6, "x": "ハッブル宇宙望遠鏡のチームによれば、"}, {"t": 1130.9666666666667, "x": "時速十七万五千キロメートルを超えていました。"}, {"t": 1134.3, "x": "これまでに観測された中で、最も速い彗星の一つです。"}, {"t": 1138.4833333333333, "x": "二〇一九年十月十二日にハッブルが撮ったとき、彗星は"}, {"t": 1142.7666666666667, "x": "地球から約四億千八百万キロメートルのところにいました。"}, {"t": 1146.5833333333333, "x": "そこから二か月あまりで、一億キロメートル以上"}, {"t": 1149.95, "x": "近づいてきたことになります。"}, {"t": 1151.6333333333334, "x": "オウムアムアは、見つかったときにはもう帰り道でした。"}, {"t": 1155.15, "x": "ボリソフ彗星は、まだ来る途中でした。"}, {"t": 1157.9833333333333, "x": "そのぶん、準備をする時間がありました。"}, {"t": 1160.85, "x": "世界中の望遠鏡が、この彗星の到着を待ち、"}, {"t": 1164.6, "x": "何か月もかけて追いかけることができました。"}, {"t": 1167.6, "x": "太陽系の外から来た天体を、近づいてくるところから、"}, {"t": 1171.3333333333333, "x": "離れていくところまで、長く見続けられた。"}, {"t": 1174.6, "x": "それは、このときが初めてでした。"}, {"t": 1177.0666666666666, "x": "そして、尾があるということは、"}, {"t": 1179.1333333333334, "x": "中から何かが出ているということです。"}, {"t": 1181.7833333333333, "x": "出ているものを調べれば、中身が分かるかもしれない。"}, {"t": 1185.2666666666667, "x": "オウムアムアでは叶わなかったことが、"}, {"t": 1187.35, "x": "今度はできるかもしれませんでした。"}, {"t": 1189.7666666666667, "x": "ボリソフ彗星には、はっきりした尾がありました。"}, {"t": 1192.95, "x": "ところが、そのせいで、別のものが見えにくくなりました。"}, {"t": 1196.8833333333334, "x": "彗星の芯、核です。"}, {"t": 1198.95, "x": "彗星の本体は、氷と塵が固まった小さなかたまりです。"}, {"t": 1203.2, "x": "これが核です。"}, {"t": 1204.3, "x": "その核から出た気体と塵が、まわりに大きな雲を作ります。"}, {"t": 1208.3666666666666, "x": "雲は核よりずっと大きく、ずっと明るく光ります。"}, {"t": 1211.9333333333334, "x": "遠くから見ると、光っているのはほとんどが雲です。"}, {"t": 1215.3, "x": "核は、その明るい雲の中に埋もれて見えません。"}, {"t": 1218.7, "x": "ハッブル宇宙望遠鏡が、二〇一九年の十月、"}, {"t": 1222.3166666666666, "x": "十一月、十二月と、ボリソフ彗星を撮りました。"}, {"t": 1226.8, "x": "十月には地球から約四億二千万キロメートル、"}, {"t": 1230.0, "x": "十二月には約二億九千八百万キロメートルの距離です。"}, {"t": 1234.2, "x": "ハッブルの画像にも、核そのものは写っていません。"}, {"t": 1237.5333333333333, "x": "写っているのは、明るい雲の広がりです。"}, {"t": 1240.4666666666667, "x": "そこで、カリフォルニア大学ロサンゼルス校のデビッド・"}, {"t": 1243.9, "x": "ジューイットらのチームが、別のやり方を試しました。"}, {"t": 1247.2666666666667, "x": "雲の明るさが、中心からの距離によって"}, {"t": 1250.0666666666666, "x": "どう変わるかを、細かく測ったのです。"}, {"t": 1252.65, "x": "雲の光を差し引いて、中心に"}, {"t": 1255.05, "x": "残るはずの核の光を見積もったのです。"}, {"t": 1257.5666666666666, "x": "結果は、核の半径は〇・五キロメートルより"}, {"t": 1260.75, "x": "小さい、というものでした。"}, {"t": 1262.6833333333334, "x": "それまでの見積もりより、十五倍以上も小さい値です。"}, {"t": 1266.6666666666667, "x": "別の手がかりも使われました。"}, {"t": 1268.6333333333334, "x": "第4章と同じ、気体の噴き出しによる押す力です。"}, {"t": 1272.3666666666666, "x": "核が小さすぎれば、噴き出しで押されて、"}, {"t": 1275.1833333333334, "x": "道筋がもっと大きくずれるはずです。"}, {"t": 1277.7833333333333, "x": "その計算から、半径は〇・二キロメートルより"}, {"t": 1281.1, "x": "大きいとされました。"}, {"t": 1282.2833333333333, "x": "〇・二キロメートルより大きく、"}, {"t": 1284.2666666666667, "x": "〇・五キロメートルより小さい。"}, {"t": 1286.7166666666667, "x": "それが、ボリソフ彗星の核に"}, {"t": 1289.0166666666667, "x": "ついて言えることのすべてです。"}, {"t": 1290.7333333333333, "x": "形は分かっていません。"}, {"t": 1292.3166666666666, "x": "雲の中身については、もっと多くのことが分かりました。"}, {"t": 1296.0, "x": "光を散らしているのは、〇・一ミリメートルほどの、"}, {"t": 1299.45, "x": "比較的大きな塵の粒でした。"}, {"t": 1301.8166666666666, "x": "そして二〇一九年十二月、チリの高原にある"}, {"t": 1305.2833333333333, "x": "電波望遠鏡の集まり、アルマ望遠鏡が、"}, {"t": 1308.4833333333333, "x": "雲から出る気体を調べました。"}, {"t": 1310.7166666666667, "x": "見つかったのは、シアン化水素と、一酸化炭素です。"}, {"t": 1314.5666666666666, "x": "シアン化水素の量は、太陽系の彗星とだいたい同じでした。"}, {"t": 1318.8333333333333, "x": "遠い恒星のまわりでできた氷のかたまりが、中身の"}, {"t": 1322.3666666666666, "x": "一部では、太陽系の彗星とよく似ていたことになります。"}, {"t": 1326.2, "x": "ところが一酸化炭素は、太陽から地球までの"}, {"t": 1329.35, "x": "距離の二倍より内側で調べられた彗星の"}, {"t": 1332.0, "x": "中で、最も多い部類に入りました。"}, {"t": 1334.7, "x": "一酸化炭素は、とても低い温度でなければ氷になりません。"}, {"t": 1338.7833333333333, "x": "論文は、この彗星が、生まれた恒星から遠く離れた、"}, {"t": 1343.0333333333333, "x": "とても寒い場所でできたはずだ、としています。"}, {"t": 1346.2666666666667, "x": "太陽系でいえば、冥王星のあたりの氷の"}, {"t": 1349.4333333333334, "x": "天体が生まれた場所に近い、としています。"}, {"t": 1352.3, "x": "太陽ではない、どこかの恒星のまわり。"}, {"t": 1355.25, "x": "その外れの寒い場所で、この氷のかたまりはできた。"}, {"t": 1358.9333333333334, "x": "どの恒星なのかは、分かっていません。"}, {"t": 1361.55, "x": "太陽のそばを過ぎたあと、ボリソフ彗星には"}, {"t": 1364.7, "x": "もう一つ出来事がありました。"}, {"t": 1366.4333333333334, "x": "NASAの記録によれば、二〇二〇年三月、ハッブルで、"}, {"t": 1370.5333333333333, "x": "核から破片が割れて離れた兆候が見られました。"}, {"t": 1373.8333333333333, "x": "ボリソフ彗星は、太陽の引力で道筋を"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
