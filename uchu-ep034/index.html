<script>
const D={"name": "ep034", "file": "ep034", "dur": 1816.6333125, "segs": [], "subs": [{"t": 0.0, "x": "その探査機の中には、15枚の写真が残っています。"}, {"t": 3.8666666666666667, "x": "撮ったのに、地球へ送られなかった写真です。"}, {"t": 7.0, "x": "機体の名前はマリナー9号。"}, {"t": 8.95, "x": "1971年、ほかの惑星を回る"}, {"t": 12.333333333333334, "x": "軌道に初めて入った探査機です。"}, {"t": 14.433333333333334, "x": "回った惑星は火星でした。"}, {"t": 16.333333333333332, "x": "着いたとき、火星は砂嵐に包まれていました。"}, {"t": 19.733333333333334, "x": "星全体が、黄色いちりにおおわれていたのです。"}, {"t": 23.016666666666666, "x": "地面はほとんど見えません。"}, {"t": 24.733333333333334, "x": "マリナー9号は、ちりが落ち着くのを待ちました。"}, {"t": 27.983333333333334, "x": "待つあいだも、火星のまわりを回り続けました。"}, {"t": 31.25, "x": "嵐が晴れたあと、機体は火星の地図を作り始めます。"}, {"t": 35.13333333333333, "x": "写真は全部で7329枚にのぼりました。"}, {"t": 38.733333333333334, "x": "それまで誰も見たことのない火星が写っていました。"}, {"t": 41.8, "x": "巨大な火山。"}, {"t": 42.81666666666667, "x": "長さ4000キロの谷。"}, {"t": 44.46666666666667, "x": "水が流れたように見える跡。"}, {"t": 46.45, "x": "そして1972年10月27日。"}, {"t": 49.81666666666667, "x": "機体の向きを保つガスが、尽きました。"}, {"t": 52.53333333333333, "x": "地上からの最後の命令で、送信機が切られます。"}, {"t": 56.06666666666667, "x": "そのとき記録装置の中には、"}, {"t": 57.93333333333333, "x": "まだ15枚の写真が残っていました。"}, {"t": 60.63333333333333, "x": "当時の見積もりでは、機体は50年以上、"}, {"t": 63.666666666666664, "x": "火星を回り続けるはずでした。"}, {"t": 66.0, "x": "その50年は、もう過ぎています。"}, {"t": 68.56666666666666, "x": "機体がまだ回っているのか。"}, {"t": 70.31666666666666, "x": "それとも火星の空気の中に落ちたのか。"}, {"t": 72.86666666666666, "x": "確かめた人は誰もいません。"}, {"t": 74.71666666666667, "x": "この回の記録は、火星を初めて回った"}, {"t": 77.55, "x": "機体と、送られなかった写真の話です。"}, {"t": 80.48333333333333, "x": "火星は昔から、地球によく似た星だと思われていました。"}, {"t": 84.46666666666667, "x": "望遠鏡で見ると、表面に濃い模様が見えます。"}, {"t": 87.95, "x": "模様は季節によって形を変えていました。"}, {"t": 90.6, "x": "南と北の極には、白く光る部分があります。"}, {"t": 94.01666666666667, "x": "その白い部分も、季節によって"}, {"t": 96.35, "x": "大きくなったり小さくなったりしました。"}, {"t": 98.6, "x": "火星には何があるのか。"}, {"t": 100.25, "x": "それを近くで見るために、探査機が"}, {"t": 102.75, "x": "送られるようになります。"}, {"t": 104.18333333333334, "x": "1965年7月14日。"}, {"t": 106.93333333333334, "x": "アメリカのマリナー4号が、火星のそばを通りました。"}, {"t": 110.55, "x": "いちばん近づいた距離は、9846キロです。"}, {"t": 114.48333333333333, "x": "マリナー4号が撮った写真は、21枚と少しでした。"}, {"t": 118.38333333333334, "x": "写っていたのは、くぼみだらけの地面です。"}, {"t": 121.26666666666667, "x": "まるで月の表面のようでした。"}, {"t": 123.28333333333333, "x": "マリナー4号が打ち上げられたのは1964年11月28日です。"}, {"t": 128.56666666666666, "x": "火星まで7か月半ほどの旅でした。"}, {"t": 131.05, "x": "写真は火星のそばを通った翌日から送られ始めました。"}, {"t": 134.71666666666667, "x": "機体の送信機の強さは10ワットしかありません。"}, {"t": 137.75, "x": "地球のアンテナに届くころには"}, {"t": 139.51666666666668, "x": "信じられないほど弱い電波になっていました。"}, {"t": 142.11666666666667, "x": "連絡は1965年10月1日まで続きました。"}, {"t": 146.06666666666666, "x": "そのとき機体は地球から3億キロ以上離れていました。"}, {"t": 149.61666666666667, "x": "2年後には一度だけ目を覚まされています。"}, {"t": 152.25, "x": "次の探査機のための試験でした。"}, {"t": 154.4, "x": "連絡が終わったのは1967年の大みそかです。"}, {"t": 158.15, "x": "マリナー4号は空気の重さも調べました。"}, {"t": 160.91666666666666, "x": "火星の空気は思っていたよりずっとうすいものでした。"}, {"t": 164.06666666666666, "x": "地面に機体を降ろすならパラシュートだけでは足りません。"}, {"t": 167.23333333333332, "x": "逆向きに噴かすロケットも要ることが分かりました。"}, {"t": 170.15, "x": "昼の地面の温度は零下100度ほどでした。"}, {"t": 172.76666666666668, "x": "1969年にはマリナー6号と7号が続きます。"}, {"t": 176.86666666666667, "x": "どちらも、火星のそばを通り過ぎる機体でした。"}, {"t": 180.06666666666666, "x": "写真の枚数は増えました。"}, {"t": 181.88333333333333, "x": "けれども見えたのは、通り過ぎる短い時間だけです。"}, {"t": 185.43333333333334, "x": "写った場所も、火星の一部にすぎませんでした。"}, {"t": 188.71666666666667, "x": "火星は、くぼみの多い乾いた星らしい。"}, {"t": 191.66666666666666, "x": "それが、このころの見方でした。"}, {"t": 194.01666666666668, "x": "マリナー6号と7号は空気の中身も調べていました。"}, {"t": 197.55, "x": "火星の空気は9割以上が二酸化炭素でした。"}, {"t": 200.7, "x": "オゾンもわずかに見つかっています。"}, {"t": 202.66666666666666, "x": "その量は地球の100分の1ほどでした。"}, {"t": 205.31666666666666, "x": "火星全体を写すには、そばを通るだけでは足りません。"}, {"t": 209.1, "x": "火星のまわりを回り続ける機体が必要でした。"}, {"t": 212.11666666666667, "x": "次の計画は、2機で1組でした。"}, {"t": 214.85, "x": "名前は、マリナー火星一九七一計画です。"}, {"t": 218.81666666666666, "x": "まとめ役は、アメリカのジェット推進研究所です。"}, {"t": 222.35, "x": "NASAのために、探査機を作って動かす研究所でした。"}, {"t": 226.06666666666666, "x": "計画では、2機の探査機を火星のまわりに送り込みます。"}, {"t": 229.98333333333332, "x": "期間は少なくとも90日です。"}, {"t": 232.25, "x": "1機目は、火星の表面の7割までを地図にします。"}, {"t": 235.91666666666666, "x": "2機目は、同じ場所が時間とともにどう変わるかを見ます。"}, {"t": 239.66666666666666, "x": "火星の模様は、季節で変わって見えます。"}, {"t": 242.55, "x": "その理由を確かめるためでした。"}, {"t": 244.58333333333334, "x": "2機の名前は、マリナー8号と9号です。"}, {"t": 247.78333333333333, "x": "重さはどちらも約1トンでした。"}, {"t": 249.9, "x": "積んだ装置は同じです。"}, {"t": 251.55, "x": "写真を撮るテレビカメラが2台。"}, {"t": 253.63333333333333, "x": "広い範囲を写すカメラと、細かく写すカメラです。"}, {"t": 257.21666666666664, "x": "ほかに、赤外線と紫外線で空気と"}, {"t": 259.95, "x": "地面を調べる装置が3つありました。"}, {"t": 262.3, "x": "いちばん細かく写すカメラは、"}, {"t": 264.1, "x": "100メートルほどのものまで見分けられます。"}, {"t": 266.85, "x": "マリナー4号の写真とくらべると、ずっと細かい写真です。"}, {"t": 270.8666666666667, "x": "計画では90日のあいだに5000枚を超える写真を撮ります。"}, {"t": 274.8833333333333, "x": "それまでのすべての惑星探査を合わせたより"}, {"t": 277.6, "x": "多くの記録を集める計画でした。"}, {"t": 279.81666666666666, "x": "写した画像は、すぐには送りません。"}, {"t": 282.45, "x": "機体の中にためておき、あとでまとめて地球へ届けます。"}, {"t": 286.3666666666667, "x": "1971年5月8日。"}, {"t": 288.95, "x": "先に打ち上げられたのは、マリナー8号でした。"}, {"t": 292.28333333333336, "x": "使ったのは、アトラスとセントールを重ねたロケットです。"}, {"t": 295.8666666666667, "x": "打ち上げは途中まで順調でした。"}, {"t": 298.06666666666666, "x": "ところが2段目のセントールで、異変が起きます。"}, {"t": 301.3, "x": "火がついてから265秒後に、機体が揺れ始めました。"}, {"t": 305.5, "x": "365秒のところで、エンジンが止まります。"}, {"t": 309.1666666666667, "x": "マリナー8号は宇宙へ届かず、大西洋に落ちました。"}, {"t": 313.1, "x": "アメリカの惑星探査機がロケットの故障で"}, {"t": 315.65, "x": "失われたのは、これが最後です。"}, {"t": 318.1, "x": "原因は、回路の板についていた小さな部品の不良でした。"}, {"t": 322.1166666666667, "x": "電気の流れを一つの向きにそろえる部品です。"}, {"t": 325.03333333333336, "x": "2機で1組の計画は、1機を失いました。"}, {"t": 328.3333333333333, "x": "残ったマリナー9号の打ち上げまでは、"}, {"t": 330.6333333333333, "x": "3週間ほどしかありません。"}, {"t": 332.7, "x": "マリナー9号のロケットには、"}, {"t": 334.43333333333334, "x": "作り直した回路の板が取り付けられました。"}, {"t": 337.4, "x": "そして計画は書きかえられました。"}, {"t": 339.5, "x": "マリナー9号が、2機ぶんの仕事を1機でこなすのです。"}, {"t": 343.28333333333336, "x": "1971年5月30日。"}, {"t": 346.2, "x": "マリナー9号は、アメリカの"}, {"t": 348.25, "x": "フロリダから打ち上げられました。"}, {"t": 350.03333333333336, "x": "重さは90097.9キロです。"}, {"t": 352.75, "x": "左右に開く太陽電池の板まで"}, {"t": 354.8833333333333, "x": "含めた幅は、6.9メートルです。"}, {"t": 357.6166666666667, "x": "打ち上げから6日後の6月5日。"}, {"t": 359.93333333333334, "x": "マリナー9号は、進む道を少しだけ直しました。"}, {"t": 363.6, "x": "そのあとは、道を直す必要がありませんでした。"}, {"t": 367.0, "x": "予定では10月の終わりにもう一度直すはずでした。"}, {"t": 370.15, "x": "その1回も要らなかったのです。"}, {"t": 372.1166666666667, "x": "旅の86日目には地球から約2900万キロ離れていました。"}, {"t": 376.8333333333333, "x": "それまでに進んだ道のりは2億キロを超えています。"}, {"t": 380.03333333333336, "x": "火星までの旅は、167日です。"}, {"t": 383.1666666666667, "x": "着くころの火星は地球から約1億2000万キロ先です。"}, {"t": 386.95, "x": "電波でも片道7分ほどかかります。"}, {"t": 389.43333333333334, "x": "命令を送っても届くのは7分後です。"}, {"t": 392.06666666666666, "x": "返事が戻るのはさらに7分後でした。"}, {"t": 394.51666666666665, "x": "同じころ、火星へ向かう機体はほかにもありました。"}, {"t": 398.0, "x": "旧ソ連の探査機です。"}, {"t": 399.5833333333333, "x": "5月10日の1機は、地球を"}, {"t": 401.75, "x": "回る軌道から出られませんでした。"}, {"t": 403.76666666666665, "x": "ソ連はこの機体に別の名前を付けて発表しました。"}, {"t": 407.1333333333333, "x": "火星へ向かう機体だったことを伏せたのです。"}, {"t": 409.7, "x": "5月19日にはマルス2号。"}, {"t": 411.81666666666666, "x": "5月28日にはマルス3号が出発します。"}, {"t": 415.15, "x": "どちらも火星を回る機体を積んでいました。"}, {"t": 417.8666666666667, "x": "地球と火星は25か月ほどごとに近づきます。"}, {"t": 421.1, "x": "1971年は、ちょうどその時期に当たっていました。"}, {"t": 425.26666666666665, "x": "8月12日には、2つの星の距離は約5600万キロでした。"}, {"t": 430.1666666666667, "x": "このときを逃すと次の機会は2年あまり先になります。"}, {"t": 433.6, "x": "マルス2号は、マリナー9号より"}, {"t": 436.03333333333336, "x": "11日早く出発していました。"}, {"t": 438.23333333333335, "x": "3つの機体が、同じ年に火星をめざしたのです。"}, {"t": 441.75, "x": "5月の1か月のあいだに5つの機体が火星へ"}, {"t": 444.6166666666667, "x": "向けて打ち上げられたことになります。"}, {"t": 446.6666666666667, "x": "そのうち地球を離れることができたのは3つでした。"}, {"t": 449.8, "x": "マリナー9号が旅をしていた、1971年9月22日。"}, {"t": 454.8666666666667, "x": "地上の望遠鏡が、火星に黄色い雲を見つけました。"}, {"t": 458.65, "x": "南半球のなかほどに現れた雲です。"}, {"t": 461.3333333333333, "x": "雲は、すごい速さで広がっていきました。"}, {"t": 464.2, "x": "2週間ほどで、南の極の白い部分も見えなくなります。"}, {"t": 468.3333333333333, "x": "5週目には、嵐はいちばん強くなりました。"}, {"t": 471.53333333333336, "x": "それまでに見られたどの砂嵐よりも、激しいものでした。"}, {"t": 475.35, "x": "1924年以来、最も広い砂嵐でした。"}, {"t": 479.3, "x": "火星全体が、ちりの雲におおわれていました。"}, {"t": 482.51666666666665, "x": "地上の天文学者たちは、何か月もこの嵐を見続けました。"}, {"t": 486.8666666666667, "x": "マリナー9号は、その嵐の中へ向かっていました。"}, {"t": 490.3666666666667, "x": "火星に近づくと、カメラは火星全体の写真を撮りました。"}, {"t": 494.43333333333334, "x": "軌道に入る前の写真です。"}, {"t": 496.3666666666667, "x": "写ったのは、のっぺりとした黄色い円でした。"}, {"t": 499.31666666666666, "x": "模様がほとんどありません。"}, {"t": 500.98333333333335, "x": "地上の望遠鏡もこの嵐を写していました。"}, {"t": 503.98333333333335, "x": "アメリカのニューメキシコ州立大学の望遠鏡です。"}, {"t": 507.3666666666667, "x": "10月20日から22日の写真でも"}, {"t": 509.81666666666666, "x": "火星はぼんやりとした円でした。"}, {"t": 511.7, "x": "マリナー9号が着くおよそ3週間前のことです。"}, {"t": 514.8833333333333, "x": "嵐がいつ晴れるのかは誰にも分かりませんでした。"}, {"t": 517.8333333333334, "x": "アメリカの日付で、1971年11月13日。"}, {"t": 522.4666666666667, "x": "マリナー9号は、火星を回る軌道に"}, {"t": 525.2, "x": "入るための噴射を始めました。"}, {"t": 527.15, "x": "速すぎれば、火星のそばを通り過ぎてしまいます。"}, {"t": 530.5833333333334, "x": "ブレーキをかけて、火星の重力につかまるのです。"}, {"t": 533.9666666666667, "x": "エンジンを噴かした時間は、約15分でした。"}, {"t": 537.15, "x": "噴射はうまくいきました。"}, {"t": 538.75, "x": "マリナー9号は火星を回り始めます。"}, {"t": 541.3666666666667, "x": "惑星のまわりを回る機体は、"}, {"t": 543.25, "x": "地球のほかではこれが最初でした。"}, {"t": 545.7, "x": "先に出発していたマルス2号より、早く着きました。"}, {"t": 549.4833333333333, "x": "軌道は細長い形です。"}, {"t": 551.35, "x": "いちばん近いところで、火星の表面から約1400キロ。"}, {"t": 555.4333333333333, "x": "いちばん遠いところで、約1万8000キロです。"}, {"t": 558.85, "x": "1回りにかかる時間は、約12時間でした。"}, {"t": 562.1666666666666, "x": "1日に2回、火星のまわりを回る計算です。"}, {"t": 565.6333333333333, "x": "軌道を整えるときには、地球の受信所のことも考えます。"}, {"t": 569.7333333333333, "x": "アメリカのカリフォルニアには、"}, {"t": 571.3666666666667, "x": "大きなアンテナがあります。"}, {"t": 573.2666666666667, "x": "ゴールドストーンという受信所の、"}, {"t": 575.1, "x": "直径64メートルのアンテナです。"}, {"t": 577.8, "x": "1秒間に1万6000ビットの速さで、記録を"}, {"t": 581.3166666666667, "x": "受け取れるのはこのアンテナだけでした。"}, {"t": 583.3166666666667, "x": "軌道に入って2日後、このアンテナが見える"}, {"t": 586.1666666666666, "x": "時間に合わせて、軌道が整えられました。"}, {"t": 589.0833333333334, "x": "軌道に入ったマリナー9号は、写真を撮り始めました。"}, {"t": 592.95, "x": "けれども、地面はほとんど写りません。"}, {"t": 595.6666666666666, "x": "ちりのもやが、火星全体をおおっていたからです。"}, {"t": 598.9333333333333, "x": "近づく途中で撮った写真に、"}, {"t": 600.7166666666667, "x": "はっきり見えたものは5つだけでした。"}, {"t": 603.15, "x": "一つは、南の極の白い部分です。"}, {"t": 605.9833333333333, "x": "白い部分は小さくなっていましたが、まだ残っていました。"}, {"t": 609.8166666666667, "x": "残りの4つは、暗い点です。"}, {"t": 612.1666666666666, "x": "ちりの海の上に、黒い点がぽつんぽつんと"}, {"t": 615.25, "x": "浮かんでいました。"}, {"t": 616.15, "x": "一つの点は、昔から望遠鏡で"}, {"t": 618.75, "x": "知られていた場所にありました。"}, {"t": 620.4333333333333, "x": "ときどき白く光って見える場所です。"}, {"t": 622.7166666666667, "x": "オリンポスの雪という意味の名前で呼ばれていました。"}, {"t": 625.7333333333333, "x": "ほかの3つの点には、まだ名前もありません。"}, {"t": 628.8166666666667, "x": "チームは仮に、北の点、中の点、南の点と呼びました。"}, {"t": 633.7166666666667, "x": "黒い点が何なのかは、まだ分かりませんでした。"}, {"t": 636.8666666666667, "x": "くぼみか、雲の切れ目か、それとも山なのか。"}, {"t": 640.4666666666667, "x": "答えは嵐の中から少しずつ見えてきます。"}, {"t": 643.2666666666667, "x": "南の極の白い部分はくり返し写されました。"}, {"t": 646.4166666666666, "x": "11月19日と28日と12月1日。"}, {"t": 649.95, "x": "同じ場所を細かく写し、3回の写真で見比べたのです。"}, {"t": 654.1333333333333, "x": "広く写した別の写真では、白い"}, {"t": 656.65, "x": "部分全体の広さも測られました。"}, {"t": 658.8833333333333, "x": "11月18日には、火星の表面で"}, {"t": 661.9666666666667, "x": "角度にして10度ほどの広がりでした。"}, {"t": 664.2, "x": "12月24日には8度ほどに縮んでいます。"}, {"t": 667.35, "x": "白い部分の中には段のような筋がいくつも走っていました。"}, {"t": 671.0666666666667, "x": "平らな面と面のあいだの高さの違いと考えられました。"}, {"t": 674.5833333333334, "x": "計画は大きく変わりました。"}, {"t": 676.4833333333333, "x": "もともとの90日の予定では、"}, {"t": 678.5166666666667, "x": "地図づくりはすぐ始まるはずでした。"}, {"t": 680.95, "x": "けれども、このまま撮っても写るのはちりだけです。"}, {"t": 684.2166666666667, "x": "チームは決めました。"}, {"t": 685.5666666666667, "x": "急がない。"}, {"t": 686.3833333333333, "x": "ちりが落ち着くまで、待つことにしたのです。"}, {"t": 689.25, "x": "カメラは止めませんで  "火星を1回りするたびに、機体が火星の影に入るのです。"}, {"t": 1351.3833333333334, "x": "影に入っているあいだは、太陽電池に光が届きません。"}, {"t": 1355.3166666666666, "x": "長いときには、100分近くも影の中にいました。"}, {"t": 1358.8333333333333, "x": "そのあいだ、機体は電池だけで生き延びます。"}, {"t": 1361.85, "x": "チームは、ほとんどの装置を止めました。"}, {"t": 1364.5833333333333, "x": "機体が生き残ることを、いちばんに考えたのです。"}, {"t": 1368.0166666666667, "x": "影の季節は、6月の初めまで続きました。"}, {"t": 1371.35, "x": "6月11日、観測が再開されます。"}, {"t": 1374.7166666666667, "x": "電池は影の季節で弱っていました。"}, {"t": 1377.0666666666666, "x": "写真を地球へ送るのは1週間に1回ほどに減りました。"}, {"t": 1380.7833333333333, "x": "送れる量も電池の具合しだいでした。"}, {"t": 1383.1166666666666, "x": "マリナー9号は、もとの90日をとっくに過ぎていました。"}, {"t": 1387.1333333333334, "x": "設計で考えていた期間もとうに越えていました。"}, {"t": 1390.1666666666667, "x": "それでも機体は元気でした。"}, {"t": 1391.9833333333333, "x": "影の季節を越えて機体は生き残ったのです。"}, {"t": 1394.8166666666666, "x": "地図づくりは、火星の表面の"}, {"t": 1397.0166666666667, "x": "全部を目指して広げられました。"}, {"t": 1398.9166666666667, "x": "9月には、もう一つの実験が行われました。"}, {"t": 1402.2666666666667, "x": "火星が、地球から見て太陽の向こう側に回った時期です。"}, {"t": 1406.3, "x": "機体からの電波は、太陽のすぐそばを"}, {"t": 1409.0166666666667, "x": "通って地球に届きます。"}, {"t": 1410.5666666666666, "x": "太陽の重力で、電波の届く時間はわずかに遅れます。"}, {"t": 1414.55, "x": "その遅れを測って、アインシュタインの"}, {"t": 1417.0166666666667, "x": "考えを確かめる実験でした。"}, {"t": 1418.9833333333333, "x": "記録の分析はそのあとも続けられました。"}, {"t": 1421.6333333333334, "x": "マリナー9号は、写真を撮るだけの"}, {"t": 1424.15, "x": "機体ではなくなっていました。"}, {"t": 1425.75, "x": "火星のまわりに置かれた、ものさしにもなったのです。"}, {"t": 1429.1666666666667, "x": "マリナー9号には、決まった寿命がありました。"}, {"t": 1432.3166666666666, "x": "機体の向きを変えるためのガスです。"}, {"t": 1434.4833333333333, "x": "カメラを火星に向けるにも、アンテナを"}, {"t": 1436.9833333333333, "x": "地球に向けるにも、このガスを使います。"}, {"t": 1439.8333333333333, "x": "ガスがなくなれば、機体は向きを保てません。"}, {"t": 1442.9, "x": "アンテナが地球を向かなければ、記録は送れません。"}, {"t": 1446.3833333333334, "x": "チームは、ガスが続くかぎり観測を"}, {"t": 1448.9833333333333, "x": "続けることにしていました。"}, {"t": 1450.5333333333333, "x": "計画の上での終わりの日も決まっていました。"}, {"t": 1453.1833333333334, "x": "1972年11月13日です。"}, {"t": 1456.45, "x": "火星に着いてちょうど1年の日でした。"}, {"t": 1458.7833333333333, "x": "1972年10月17日。"}, {"t": 1461.7, "x": "記録装置にためた写真が、地球へ送られました。"}, {"t": 1465.1833333333334, "x": "これで、送られた写真は7329枚になりました。"}, {"t": 1469.5666666666666, "x": "けれども記録装置には、まだ写真が残っていました。"}, {"t": 1473.1, "x": "その数は15枚です。"}, {"t": 1474.7166666666667, "x": "次の再生で、地球へ送る予定でした。"}, {"t": 1477.7833333333333, "x": "写真はまず磁気テープに記録されます。"}, {"t": 1480.1833333333334, "x": "テープの写真はまとめて地球へ送ります。"}, {"t": 1482.8166666666666, "x": "そのときにアンテナを地球へ向けなければなりません。"}, {"t": 1485.9, "x": "向きを変えるにもガスが要りました。"}, {"t": 1487.9666666666667, "x": "10月27日。"}, {"t": 1489.5666666666666, "x": "火星を回り始めてから、698周目のことです。"}, {"t": 1493.7, "x": "最後の写真を送ろうとする、数分前でした。"}, {"t": 1497.0666666666666, "x": "姿勢を保つためのガスが、そこで底をつきました。"}, {"t": 1500.5, "x": "機体は向きを保てなくなり、記録が届かなくなりました。"}, {"t": 1504.35, "x": "地上のチームは、最後の命令を送りました。"}, {"t": 1507.6, "x": "送信機を切る命令です。"}, {"t": 1509.4333333333334, "x": "打ち上げから数えて、4万5960個目の命令でした。"}, {"t": 1514.0166666666667, "x": "このとき、地球と火星は約3億8400万キロ離れていました。"}, {"t": 1518.9166666666667, "x": "電波でも片道20分ほどかかる距離です。"}, {"t": 1521.7833333333333, "x": "火星を回った日数は、349日です。"}, {"t": 1525.35, "x": "計画の上での終わりの日まで、あと17日でした。"}, {"t": 1529.0166666666667, "x": "15枚の写真は、記録装置の中に残されました。"}, {"t": 1532.7666666666667, "x": "送られるはずだった最後の15枚です。"}, {"t": 1535.25, "x": "何が写っていたのかは、分かっていません。"}, {"t": 1538.05, "x": "マリナー9号が送った写真から、"}, {"t": 1540.1166666666666, "x": "火星の地図が作られました。"}, {"t": 1542.1833333333334, "x": "火星全体を写した、初めての地図です。"}, {"t": 1545.2833333333333, "x": "火星の地球儀も作られました。"}, {"t": 1547.3166666666666, "x": "写真が写した広さは、表面の85パーセントです。"}, {"t": 1551.2666666666667, "x": "1キロから2キロほどのものまで、"}, {"t": 1553.2166666666667, "x": "見分けられる細かさでした。"}, {"t": 1555.1666666666667, "x": "フォボスとダイモスの写真も、80枚を超えています。"}, {"t": 1558.8, "x": "この地図は、次の計画に引きつがれました。"}, {"t": 1561.9, "x": "1975年に打ち上げられた、バイキング計画です。"}, {"t": 1566.1833333333334, "x": "火星の地面に機体を降ろし、"}, {"t": 1568.0333333333333, "x": "生き物の手がかりを探す計画でした。"}, {"t": 1570.8, "x": "どこに降ろすかを選ぶとき、"}, {"t": 1572.4666666666667, "x": "マリナー9号の写真 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
