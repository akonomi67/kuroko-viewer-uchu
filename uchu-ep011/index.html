<script>
const D={"name": "ep011", "file": "ep011", "dur": 1965.4833125, "segs": [], "subs": [{"t": 0.0, "x": "二〇二四年十二月二十四日、"}, {"t": 2.35, "x": "アメリカ東部時間の午前六時五十三分。"}, {"t": 5.533333333333333, "x": "一機の探査機が、太陽の表面から、"}, {"t": 8.233333333333333, "x": "およそ六百十万キロメートルのところを通り過ぎました。"}, {"t": 11.966666666666667, "x": "人類が作った物が、太陽にこれほど"}, {"t": 14.7, "x": "近づいたのは、初めてのことです。"}, {"t": 17.083333333333332, "x": "速さは、時速およそ六十九万キロメートル。"}, {"t": 20.433333333333334, "x": "これも、人が作った物の中で、最も速い記録でした。"}, {"t": 24.7, "x": "ただ、その瞬間を地上で確かめた者はいません。"}, {"t": 28.133333333333333, "x": "探査機は、最も近づく前後の数日間、地上と"}, {"t": 32.166666666666664, "x": "連絡を取らずに飛ぶように作られています。"}, {"t": 34.68333333333333, "x": "太陽のすぐそばでは、電波のやりとりができないからです。"}, {"t": 38.46666666666667, "x": "そのあいだ、探査機は自分の判断だけで姿勢を保ちます。"}, {"t": 42.45, "x": "地上の管制室に、無事を知らせる短い信号が"}, {"t": 45.96666666666667, "x": "届いたのは、二日後の十二月二十六日の夜遅くでした。"}, {"t": 50.11666666666667, "x": "機体の詳しい状態が送られてきたのは、"}, {"t": 52.65, "x": "年が明けた一月一日です。"}, {"t": 54.93333333333333, "x": "探査機の名前は、パーカー・ソーラー・プローブ。"}, {"t": 57.81666666666667, "x": "この探査機は、太陽の外側に広がる大気、コロナの"}, {"t": 61.96666666666667, "x": "中を、これまでに何度も通り抜けています。"}, {"t": 64.86666666666666, "x": "けれども、太陽の表面を、すぐ近くから"}, {"t": 68.21666666666667, "x": "写した写真は、一枚もありません。"}, {"t": 70.75, "x": "探査機に積まれたカメラは、"}, {"t": 72.31666666666666, "x": "太陽のほうを向いていないからです。"}, {"t": 74.7, "x": "写っていないのは、失われたからではありません。"}, {"t": 77.9, "x": "はじめから、写さないように作られていました。"}, {"t": 81.0, "x": "この回では、太陽に最も近づいた"}, {"t": 83.68333333333334, "x": "人工物の記録を読んでいきます。"}, {"t": 85.81666666666666, "x": "なぜ半世紀以上も待つことになったのか。"}, {"t": 88.38333333333334, "x": "どうやって熱に耐えているのか。"}, {"t": 90.26666666666667, "x": "何が写り、何が写っていないのか。"}, {"t": 92.98333333333333, "x": "そして、機体に何が積まれたまま、いまも太陽を"}, {"t": 96.61666666666666, "x": "回っているのかを、残っている記録の範囲で並べます。"}, {"t": 100.18333333333334, "x": "太陽には、昔から一つの謎がありました。"}, {"t": 103.35, "x": "太陽は、半径がおよそ七十万キロメートルあります。"}, {"t": 107.15, "x": "地球のおよそ百倍の幅です。"}, {"t": 109.2, "x": "NASAの解説によれば、その表面の"}, {"t": 111.76666666666667, "x": "温度は、およそ五千五百度です。"}, {"t": 114.18333333333334, "x": "ところが、その外側に広がるコロナは、"}, {"t": 116.93333333333334, "x": "最大でおよそ二百万度に達します。"}, {"t": 119.65, "x": "熱の出どころから遠いほうが、熱い。"}, {"t": 122.4, "x": "たき火から離れるほど暖かくなるようなもので、"}, {"t": 125.2, "x": "ふつうの考え方では説明がつきません。"}, {"t": 128.1, "x": "この謎は、いまも完全には解けていません。"}, {"t": 131.1, "x": "太陽のそばまで何かを送り込んで、直接測ってみたい。"}, {"t": 135.08333333333334, "x": "そういう考えが、はっきりと文書に"}, {"t": 137.53333333333333, "x": "書かれたのは、一九五八年のことです。"}, {"t": 140.83333333333334, "x": "この年、アメリカの科学者たちの委員会が、"}, {"t": 143.96666666666667, "x": "宇宙で調べるべきことの長い一覧をまとめました。"}, {"t": 147.45, "x": "委員長は、物理学者のジョン・シンプソン。"}, {"t": 150.36666666666667, "x": "その一覧の中に、太陽そのものに近づく"}, {"t": 153.35, "x": "探査機、という項目が入っていました。"}, {"t": 156.13333333333333, "x": "長い先を見越した計画の一つとして、"}, {"t": 158.6, "x": "書き込まれたものでした。"}, {"t": 160.3, "x": "同じころ、もう一つの提案が、"}, {"t": 162.7, "x": "別の場所で書かれていました。"}, {"t": 164.8, "x": "書いたのは、シカゴ大学の物理学者、"}, {"t": 167.56666666666666, "x": "ユージン・パーカーです。"}, {"t": 169.13333333333333, "x": "パーカーは、太陽からは、ガスが絶えず外へ"}, {"t": 172.43333333333334, "x": "吹き出しているはずだ、と考えました。"}, {"t": 174.88333333333333, "x": "コロナがあまりに熱いため、太陽の重力でも"}, {"t": 178.01666666666668, "x": "引き止めきれず、四方八方へ流れ出していく。"}, {"t": 181.18333333333334, "x": "その流れは、太陽系のすみずみまで届いている。"}, {"t": 184.65, "x": "のちに太陽風と呼ばれることになる考えです。"}, {"t": 187.61666666666667, "x": "パーカーは一九五七年に、この論文を学術誌に送りました。"}, {"t": 192.51666666666668, "x": "シカゴ大学の記録によれば、査読をした"}, {"t": 195.36666666666667, "x": "研究者は、この論文を退けました。"}, {"t": 198.21666666666667, "x": "まったくのナンセンスだ、図書館へ行って"}, {"t": 200.7, "x": "勉強し直すように、と書いたとされています。"}, {"t": 203.76666666666668, "x": "論文を救ったのは、雑誌の編集者だった"}, {"t": 206.66666666666666, "x": "天文学者、チャンドラセカールでした。"}, {"t": 209.23333333333332, "x": "チャンドラセカール自身も、"}, {"t": 210.71666666666667, "x": "中身には懐疑的だったとされています。"}, {"t": 213.48333333333332, "x": "それでも、計算の中に誤りを"}, {"t": 215.88333333333333, "x": "見つけることができませんでした。"}, {"t": 217.7, "x": "誤りが見つからない以上、載せない理由はない。"}, {"t": 221.0, "x": "論文は一九五八年に掲載されました。"}, {"t": 224.3, "x": "考えは、すぐには受け入れられませんでした。"}, {"t": 227.26666666666668, "x": "シカゴ大学の訃報は、太陽風の考えが最初、疑いと、"}, {"t": 231.93333333333334, "x": "あからさまなあざけりで迎えられた、と書いています。"}, {"t": 235.53333333333333, "x": "パーカーは後年、こう振り返っています。"}, {"t": 238.45, "x": "自分が何か大事な提案をするたびに、"}, {"t": 240.86666666666667, "x": "そんなはずはない、ありえない、と言う人たちがいた。"}, {"t": 244.8, "x": "四年後の一九六二年、金星へ向かったNASAの"}, {"t": 248.61666666666667, "x": "探査機、マリナー2号が、それを捉えました。"}, {"t": 252.03333333333333, "x": "宇宙空間を、粒子が途切れずに流れてきていたのです。"}, {"t": 255.8, "x": "太陽風は、実際に吹いていました。"}, {"t": 258.53333333333336, "x": "これで、風があることは分かりました。"}, {"t": 261.1333333333333, "x": "けれども、その風がどこで生まれ、"}, {"t": 263.48333333333335, "x": "どうやって速さを得ているのか。"}, {"t": 265.68333333333334, "x": "コロナはなぜ、表面より熱いのか。"}, {"t": 268.4, "x": "遠くで流れを測るだけでは、答えは出ませんでした。"}, {"t": 271.93333333333334, "x": "太陽から吹く風や、太陽で起きる嵐に"}, {"t": 274.93333333333334, "x": "ついて、NASAはこう書いています。"}, {"t": 277.21666666666664, "x": "宇宙飛行士や人工衛星だけでなく、飛行機の"}, {"t": 280.6333333333333, "x": "運航や、地上の送電網にまで影響を及ぼしうる。"}, {"t": 284.26666666666665, "x": "風の生まれ方を知ることは、遠い星の話にとどまりません。"}, {"t": 288.3333333333333, "x": "答えがありそうな場所は、太陽の"}, {"t": 290.6666666666667, "x": "すぐそば、コロナの中です。"}, {"t": 292.7, "x": "一九五八年の二つの提案は、同じ場所を指していました。"}, {"t": 297.3666666666667, "x": "そこへ実際に探査機が入るまでには、"}, {"t": 299.75, "x": "それから六十年以上かかります。"}, {"t": 302.23333333333335, "x": "太陽は、遠くから見れば、宇宙で"}, {"t": 305.03333333333336, "x": "いちばん行きやすい場所のようにも思えます。"}, {"t": 307.46666666666664, "x": "何もしなくても、重力で引き寄せられそうだからです。"}, {"t": 311.03333333333336, "x": "実際には、その逆でした。"}, {"t": 313.21666666666664, "x": "NASAの解説によれば、太陽へ行くには、"}, {"t": 316.01666666666665, "x": "火星へ行くのに比べて、五十五倍のエネルギーが要ります。"}, {"t": 320.23333333333335, "x": "理由は、地球の動きにあります。"}, {"t": 322.68333333333334, "x": "地球は、太陽に対して横向きに、時速"}, {"t": 325.96666666666664, "x": "およそ十万八千キロメートルで動いています。"}, {"t": 328.76666666666665, "x": "地球から打ち上げた探査機も、はじめから"}, {"t": 331.5, "x": "同じ横向きの速さを持っています。"}, {"t": 333.6666666666667, "x": "横向きに速く動いている物は、太陽に落ちていきません。"}, {"t": 337.5833333333333, "x": "太陽のまわりを回り続けます。"}, {"t": 339.7, "x": "太陽に近づくには、この横向きの速さを、"}, {"t": 342.8333333333333, "x": "ほとんど打ち消さなければなりません。"}, {"t": 345.18333333333334, "x": "計画は、紙の上では何度も練られました。"}, {"t": 348.25, "x": "アメリカ物理学協会の歴史のまとめに"}, {"t": 350.71666666666664, "x": "よれば、一九七八年には、太陽の近くで何を"}, {"t": 355.06666666666666, "x": "調べるべきかを話し合う会合が開かれています。"}, {"t": 358.05, "x": "けれども、一九九〇年代半ばから"}, {"t": 361.03333333333336, "x": "二〇〇〇年代のはじめにかけては、予算や"}, {"t": 363.65, "x": "優先順位の都合で、後回しにされ続けました。"}, {"t": 367.15, "x": "ロシアと組んで進めるという"}, {"t": 368.76666666666665, "x": "構想も、取りやめになりました。"}, {"t": 371.06666666666666, "x": "一九九八年には、外側の惑星へ"}, {"t": 374.43333333333334, "x": "向かう計画とまとめられ、二〇〇七年二月の"}, {"t": 377.55, "x": "打ち上げを目標にしたこともありました。"}, {"t": 379.8, "x": "二〇〇三年には、太陽の研究で"}, {"t": 382.3, "x": "最も優先すべき計画の一つとされています。"}, {"t": 385.23333333333335, "x": "それでも、探査機は飛びませんでした。"}, {"t": 387.9166666666667, "x": "当時の案は、いったん木星まで行き、その重力を"}, {"t": 391.7, "x": "借りて向きを変え、太陽へ向かうというものでした。"}, {"t": 394.9, "x": "電気は、放射性物質の熱から"}, {"t": 397.3833333333333, "x": "作る装置でまかなう計画でした。"}, {"t": 399.48333333333335, "x": "大きな転機は、二〇〇七年です。"}, {"t": 402.01666666666665, "x": "NASAは、この計画の費用に"}, {"t": 404.1166666666667, "x": "七億五千万ドルという上限を設けました。"}, {"t": 406.95, "x": "そして、放射性物質の電源ではなく、"}, {"t": 409.95, "x": "太陽電池を使うように求めました。"}, {"t": 412.6666666666667, "x": "木星へ行く道は、使えなくなりました。"}, {"t": 415.6333333333333, "x": "代わりに選ばれたのが、金星です。"}, {"t": 418.2, "x": "金星のそばを何度も通り、そのたびに金星の"}, {"t": 421.46666666666664, "x": "重力を借りて、横向きの速さを少しずつ削っていく。"}, {"t": 425.26666666666665, "x": "一度で太陽に落ちるのではなく、七年かけて、"}, {"t": 428.6666666666667, "x": "軌道を少しずつ太陽へ寄せていく道筋でした。"}, {"t": 431.98333333333335, "x": "木星を使う案に比べて、最も近づく距離は遠くなります。"}, {"t": 436.3333333333333, "x": "その代わり、太陽の近くにいる"}, {"t": 438.6333333333333, "x": "時間は長くなる、とされました。"}, {"t": 440.93333333333334, "x": "新しい計画には、ソーラー・"}, {"t": 443.0833333333333, "x": "プローブ・プラスという名前が付きました。"}, {"t": 445.3, "x": "打ち上げは、二〇一八年八月十二日、"}, {"t": 448.5833333333333, "x": "世界時の七時三十一分。"}, {"t": 450.8, "x": "フロリダ州のケープカナベラルから、デルタ"}, {"t": 453.53333333333336, "x": "フォー・ヘビーという大型ロケットで打ち上げられました。"}, {"t": 456.46666666666664, "x": "探査機の重さは、六百八十五キログラムです。"}, {"t": 459.9166666666667, "x": "最初に太陽へ近づいたのは、打ち上げから"}, {"t": 462.85, "x": "三か月もたたない、二〇一八年十一月五日でした。"}, {"t": 466.85, "x": "太陽の表面から、およそ二千四百万キロメートル。"}, {"t": 470.65, "x": "それまでの記録は、一九七六年に探査機ヘリオス二号が"}, {"t": 475.1, "x": "作った、およそ四千二百七十万キロメートルでした。"}, {"t": 478.85, "x": "四十二年ぶりに、記録が塗りかえられました。"}, {"t": 482.03333333333336, "x": "この最初の接近のための観測は、"}, {"t": 484.26666666666665, "x": "十月三十一日から十一月十一日まで行われました。"}, {"t": 488.8, "x": "そのうち最接近をはさんだ数日間は、"}, {"t": 491.31666666666666, "x": "太陽の電波にさえぎられて、地上との"}, {"t": 494.3833333333333, "x": "連絡が完全に途切れる見込みでした。"}, {"t": 496.68333333333334, "x": "打ち上げから三か月もたたないうちに、"}, {"t": 499.01666666666665, "x": "最初の試験が来たことになります。"}, {"t": 501.4166666666667, "x": "誰とも話せない状態で、自分の姿勢を自分で守る試験です。"}, {"t": 505.8, "x": "そこから探査機は、金星のそばを七回通り、"}, {"t": 509.06666666666666, "x": "そのたびに太陽へ近づいていきます。"}, {"t": 511.65, "x": "七回目、最後の金星の通過は、"}, {"t": 514.35, "x": "二〇二四年十一月六日でした。"}, {"t": 517.1333333333333, "x": "金星の地表から、約三百七十五キロメートルのところを"}, {"t": 521.1833333333333, "x": "通っています。"}, {"t": 522.0333333333333, "x": "この通過で、探査機は最後の軌道に入りました。"}, {"t": 525.5333333333333, "x": "それが、序章で読んだ、十二月二十四日の"}, {"t": 529.0333333333333, "x": "最接近につながります。"}, {"t": 530.6, "x": "太陽に近づくとき、探査機の前には、"}, {"t": 533.4666666666667, "x": "いつも一枚の盾があります。"}, {"t": 535.6, "x": "正式には、熱防護システムと呼ばれます。"}, {"t": 538.7, "x": "直径は約二・四メートル。"}, {"t": 540.7666666666667, "x": "厚さは、十一・四三センチメートルです。"}, {"t": 543.95, "x": "中身は、二枚の炭素の板のあいだに、"}, {"t": 546.6166666666667, "x": "炭素でできた発泡材を挟んだものです。"}, {"t": 549.5166666666667, "x": "NASAによれば、この発泡材は、地上では"}, {"t": 552.75, "x": "体積の九十七パーセントが空気です。"}, {"t": 555.3333333333334, "x": "盾全体の重さは、約七十三キログラムしかありません。"}, {"t": 559.4, "x": "太陽に向く側には、白い塗料が吹き付けられています。"}, {"t": 563.15, "x": "太陽の光をできるだけはね返すためです。"}, {"t": 565.8833333333333, "x": "盾は、打ち上げの一か月半前、"}, {"t": 568.35, "x": "二〇一八年六月二十七日に探査機に取り付けられました。"}, {"t": 572.6833333333333, "x": "NASAの説明では、この盾が守るのは、盾が"}, {"t": 576.1833333333333, "x": "作る影、本影の中に入っている物すべてです。"}, {"t": 579.6666666666666, "x": "逆に言えば、影の外にある物は、守られません。"}, {"t": 583.4833333333333, "x": "探査機の本体も、観測装置の多くも、盾の後ろの"}, {"t": 587.5833333333334, "x": "細長い影の中に収まるように並べられています。"}, {"t": 590.7, "x": "この盾について、NASAが挙げていた数字は三つあります。"}, {"t": 594.5, "x": "太陽に最も近づいたとき、盾の表面は、"}, {"t": 597.8166666666667, "x": "およそ千四百度になる見込み。"}, {"t": 600.15, "x": "地上の試験では、千六百五十度まで耐えることを確かめた。"}, {"t": 604.4, "x": "そして、盾の陰にある機体と"}, {"t": 606.5833333333334, "x": "観測装置は、およそ三十度に保たれる。"}, {"t": 609.5666666666667, "x": "厚さ十一センチの板の、表と裏で、千度以上の差です。"}, {"t": 614.0, "x": "言いかえれば、この探査機が太陽の"}, {"t": 616.45, "x": "そばで生きていられるのは、盾という一枚の"}, {"t": 619.2666666666667, "x": "板の、表と裏の差のおかげです。"}, {"t": 621.6333333333333, "x": "盾が割れたり、外れたりすれば、陰は消えます。"}, {"t": 625.35, "x": "代わりになる二枚目の盾は、積まれていません。"}, {"t": 628.4166666666666, "x": "ここで、一つの疑問が出てきます。"}, {"t": 630.9333333333333, "x": "コロナは、百万度を超えます。"}, {"t": 633.2, "x": "探査機はその中を通ります。"}, {"t": 635.15, "x": "それなのに、なぜ盾は千四百度で済むのか。"}, {"t": 638.45, "x": "NASAは、温度と熱は別のものだ、と説明しています。"}, {"t": 642.55, "x": "温度は、粒子がどれだけ速く動いているかを表します。"}, {"t": 646.4, "x": "熱は、粒子がどれだけのエネルギーを"}, {"t": 648.9166666666666, "x": "運んでくるかの合計です。"}, {"t": 650.6, "x": "コロナの粒子は、とても速く動いています。"}, {"t": 653.6333333333333, "x": "だから温度は高い。"}, {"t": 655.0, "x": "けれども、コロナはとても薄く、粒子の数がわずかです。"}, {"t": 659.15, "x": "ぶつかってくる粒子が少なければ、"}, {"t": 661.0833333333334, "x": "運ばれてくるエネルギーも少なくなります。"}, {"t": 663.95, "x": "NASAは、これをたとえで説明しています。"}, {"t": 666.8166666666667, "x": "熱いオーブンの中に手を入れるのと、"}, {"t": 668.95, "x": "沸騰したお湯に手を入れるのとの違いだ、と。"}, {"t": 672.3666666666667, "x": "オーブンの空気は、お湯よりずっと高い温度になります。"}, {"t": 675.9666666666667, "x": "それでも、しばらくなら手を入れていられます。"}, {"t": 678.8666666666667, "x": "空気の粒子はまばらで、手に当たる数が少ないからです。"}, {"t": 682.5833333333334, "x": "お湯は温度が低くても、粒子が"}, {"t": 684.8, "x": "びっしり詰まっていて、手に次々とぶつかります。"}, {"t": 687.9666666666667, "x": "コロナは、オーブンの中の空気に近い、ということです。"}, {"t": 691.95, "x": "では、盾を熱くしているのは何なのか。"}, {"t": 694.7833333333333, "x": "コロナの粒子よりも大きいのは、太陽の光そのものです。"}, {"t": 698.7, "x": "太陽のすぐそばでは、光が強烈に降りそそぎます。"}, {"t": 702.45, "x": "盾の白い面は、その光をはね返します。"}, {"t": 705.7, "x": "はね返しきれなかった分は、九十七パーセントが"}, {"t": 709.05, "x": "空気の発泡材が、裏側へ伝えにくくしています。"}, {"t": 712.6166666666667, "x": "実際の温度も、記録に残っています。"}, {"t": 715.4333333333333, "x": "二〇二五年六月の最接近について、NASAは、"}, {"t": 719.0333333333333, "x": "盾がおよそ八百七十度から九百三十度の"}, {"t": 722.4, "x": "温度から機体を守った、と書いています。"}, {"t": 725.0666666666667, "x": "設計で見込んでいた千四百度には、届いていませんでした。"}, {"t": 729.0666666666667, "x": "白い面を太陽に向け続けているかぎり、盾の"}, {"t": 732.3666666666667, "x": "陰は、人が過ごせるほどの温度に保たれます。"}, {"t": 735.4833333333333, "x": "問題は、その陰から、何かがはみ出したときです。"}, {"t": 739.2833333333333, "x": "盾の陰に入っているのは、機体の"}, {"t": 741.7, "x": "本体と、ほとんどの観測装置です。"}, {"t": 744.45, "x": "けれども、どうしても陰に収めきれない部分があります。"}, {"t": 748.05, "x": "一つは、電気を作る太陽電池の板です。"}, {"t": 751.2333333333333, "x": "太陽電池は、光を浴びなければ働きません。"}, {"t": 754.6166666666667, "x": "かといって、太陽のすぐそばで"}, {"t": 756.8, "x": "光を浴び続ければ、熱で壊れてしまいます。"}, {"t": 760.0333333333333, "x": "そこで探査機は、太陽に近づくと、太陽電池の"}, {"t": 763.9, "x": "板を盾の陰へ折りたたむように引き込みます。"}, {"t": 766.5333333333333, "x": "光を受けるのは、陰からわずかに出た、"}, {"t": 769.25, "x": "小さな部分だけになります。"}, {"t": 771.3166666666667, "x": "それでも、板は熱くなります。"}, {"t": 773.6333333333333, "x": "そのため、板には冷やすための水が流れています。"}, {"t": 777.0666666666667, "x": "量は、約一ガロン。"}, {"t": 778.8833333333333, "x": "三・七リットルです。"}, {"t": 780.4333333333333, "x": "ミネラルを取り除いた水が、ポンプで回され、"}, {"t": 783.4666666666667, "x": "板の熱を放熱板へ運んで、宇宙へ逃がしています。"}, {"t": 787.6666666666666, "x": "仕組みは、温められたタンク、水を送るポンプ、"}, {"t": 791.4, "x": "そしてアルミニウムのひれを付けた放熱板でできています。"}, {"t": 795.0833333333334, "x": "NASAは、その冷やす力を、ふつうの"}, {"t": 797.8166666666667, "x": "広さの居間を冷やせるほど、と書いています。"}, {"t": 800.7, "x": "NASAの解説によれば、この水は、"}, {"t": 803.1833333333333, "x": "十度から百二十五度までの範囲で使われます。"}, {"t": 806.5, "x": "凍っても、沸いても困る。"}, {"t": 808.4833333333333, "x": "その範囲で扱いやすい液体として、水が選ばれました。"}, {"t": 812.4333333333333, "x": "二つ目は、姿勢です。"}, {"t": 814.25, "x": "盾が少しでも傾けば、陰の形が変わります。"}, {"t": 817.8166666666667, "x": "陰から出た部分に、太陽の光がじかに当たります。"}, {"t": 821.4666666666667, "x": "探査機は、最も近づく前後には地上と連絡が取れません。"}, {"t": 825.6333333333333, "x": "二〇二六年九月の接近では、最接近をはさんだ"}, {"t": 829.4666666666667, "x": "九日間、地上との連絡がないまま飛んでいました。"}, ": "八回目に太陽へ近づいたときのことです。"}, {"t": 1181.5666666666666, "x": "探査機は、太陽の半径の十八・八倍のところで、"}, {"t": 1185.3666666666666, "x": "磁場と粒子の様子が変わったことを記録しました。"}, {"t": 1188.6, "x": "キロメートルにすると、太陽から"}, {"t": 1190.9, "x": "およそ千三百万キロメートルです。"}, {"t": 1193.1166666666666, "x": "それまでの見積もりの幅の中では、外側寄りの位置でした。"}, {"t": 1197.1333333333334, "x": "境目は、思っていたよりも"}, {"t": 1199.2166666666667, "x": "少し遠くにあったことになります。"}, {"t": 1201.1833333333334, "x": "境目を越え、コロナの中に入ったことを示す記録でした。"}, {"t": 1205.2333333333333, "x": "最初の通過は、数時間でした。"}, {"t": 1207.75, "x": "探査機は、その接近のあいだに、"}, {"t": 1210.05, "x": "境目の内と外を何度か出入りしています。"}, {"t": 1212.9833333333333, "x": "境目はきれいな球の面ではなく、"}, {"t": 1215.1666666666667, "x": "でこぼこしていると考えられています。"}, {"t": 1217.7666666666667, "x": "この記録が発表されたのは、半年以上あとの、"}, {"t": 1221.0833333333333, "x": "二〇二一年十二月十四日です。"}, {"t": 1224.0, "x": "アメリカ地球物理学連合の大会で、NASAは、"}, {"t": 1227.4166666666667, "x": "探査機が初めて太陽の大気に入った、と発表しました。"}, {"t": 1231.75, "x": "NASAはこの成果を、人類が"}, {"t": 1233.85, "x": "初めて月に降りたことになぞらえています。"}, {"t": 1236.35, "x": "データは、通り過ぎたあとに、少しずつ地上へ送られます。"}, {"t": 1240.5666666666666, "x": "境目を越えたことが分かったのは、"}, {"t": 1242.6666666666667, "x": "その記録を読み解いたあとでした。"}, {"t": 1244.9666666666667, "x": "コロナに入る前から、探査機はすでに、"}, {"t": 1247.7166666666667, "x": "いくつかの思いがけないものを見つけていました。"}, {"t": 1250.6666666666667, "x": "二〇一九年十二月、最初の二回の接近の結果が、"}, {"t": 1254.7166666666667, "x": "科学誌ネイチャーに四本の論文として出ています。"}, {"t": 1257.9833333333333, "x": "その一つが、スイッチバックと呼ばれるものでした。"}, {"t": 1261.2, "x": "太陽から外へ向かっていた磁場の向きが、ほんの数秒から"}, {"t": 1264.9333333333334, "x": "数分のあいだ、急に折れ曲がって、逆向きになる。"}, {"t": 1268.6333333333334, "x": "それが、太陽の近くで何度も起きていました。"}, {"t": 1271.85, "x": "報道によれば、この折り返しは、水星の軌道より内側、"}, {"t": 1276.15, "x": "太陽のすぐ近くで目立って起きていました。"}, {"t": 1278.9666666666667, "x": "遠くを回る探査機では、見つけようのないものでした。"}, {"t": 1282.5, "x": "似た現象は、以前にも遠くで観測されていました。"}, {"t": 1286.1333333333334, "x": "けれども、これほど多く、これほど大きく"}, {"t": 1289.2333333333333, "x": "起きているとは知られていませんでした。"}, {"t": 1291.2666666666667, "x": "風がどうやって速さを得ているのかを知る、"}, {"t": 1293.75, "x": "手がかりの一つと考えられて   const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
