<script>
const D={"name": "ep022", "file": "ep022", "dur": 1840.7, "segs": [], "subs": [{"t": 0.0, "x": "五メートルの予定が、四十センチ。"}, {"t": 2.6166666666666667, "x": "地面を掘る棒は、四十センチより深くは進めませんでした。"}, {"t": 6.733333333333333, "x": "棒の頭は、いまも地面のすぐ下に"}, {"t": 9.35, "x": "埋まったまま止まっています。"}, {"t": 10.85, "x": "同じ機械は火星の揺れを千三百十九回聞き取りました。"}, {"t": 14.666666666666666, "x": "火星の地面は、ときどきかすかに震えます。"}, {"t": 17.75, "x": "その揺れは地下を通り抜けてきます。"}, {"t": 19.966666666666665, "x": "届き方を調べると、地下の層と"}, {"t": 22.416666666666668, "x": "真ん中の核の大きさが描き出せます。"}, {"t": 24.766666666666666, "x": "聞き取れた深さは千キロ単位でした。"}, {"t": 27.083333333333332, "x": "もう一つの仕事は、自分で地面を掘り進み、"}, {"t": 30.283333333333335, "x": "五メートルの深さで温度を測ることでした。"}, {"t": 33.166666666666664, "x": "掘る役は細い棒でした。"}, {"t": 34.9, "x": "長さは四十センチ。"}, {"t": 36.5, "x": "太さは約二・七センチ。"}, {"t": 38.38333333333333, "x": "二年近く、たたき続けました。"}, {"t": 40.85, "x": "後ろの端のひもは、すぐそばの機械まで延びています。"}, {"t": 44.5, "x": "機械はもう動いていません。"}, {"t": 46.266666666666666, "x": "地面の下を写した写真はありません。"}, {"t": 48.6, "x": "カメラは地上にしかなかったからです。"}, {"t": 50.833333333333336, "x": "目では見られなかった地下を、耳で測る。"}, {"t": 53.63333333333333, "x": "これはその着陸機の記録です。"}, {"t": 55.75, "x": "火星の表面は写真で何度も調べられてきました。"}, {"t": 58.96666666666667, "x": "山も谷も平らな野原も上からは見えています。"}, {"t": 61.95, "x": "分からないのはその下です。"}, {"t": 63.65, "x": "地面の下には何があるのか。"}, {"t": 65.56666666666666, "x": "殻のような地殻はどれくらいの厚さなのか。"}, {"t": 68.21666666666667, "x": "真ん中の核はどれくらいの大きさなのか。"}, {"t": 70.73333333333333, "x": "とけているのか、固まっているのか。"}, {"t": 73.28333333333333, "x": "この問いに答えるために作られた機械が、インサイトです。"}, {"t": 77.05, "x": "英語の長い名前の、頭の文字をつないだ呼び名です。"}, {"t": 80.81666666666666, "x": "意味は、地震を使って星の中身を調べる探査。"}, {"t": 84.35, "x": "そこに星の形と熱の流れの測定も加わっています。"}, {"t": 87.91666666666667, "x": "アメリカ航空宇宙局、NASAの計画です。"}, {"t": 91.2, "x": "選ばれたのは二〇一二年八月でした。"}, {"t": 93.85, "x": "NASAには費用をおさえた小さな探査の枠があります。"}, {"t": 97.01666666666667, "x": "インサイトはその枠の十二番目でした。"}, {"t": 99.43333333333334, "x": "火星へはそれまでにも多くの機械が降りています。"}, {"t": 102.43333333333334, "x": "けれども、仕事を火星の中身に"}, {"t": 104.71666666666667, "x": "ほぼしぼった着陸機は、初めてでした。"}, {"t": 107.45, "x": "測るための道具は三つです。"}, {"t": 109.38333333333334, "x": "一つ目は地震計です。"}, {"t": 111.0, "x": "火星の揺れを聞く道具です。"}, {"t": 112.81666666666666, "x": "フランスの宇宙機関が中心になって作りました。"}, {"t": 115.8, "x": "二つ目は熱を測る道具です。"}, {"t": 117.88333333333334, "x": "地面の下に潜って、地中の温度を測ります。"}, {"t": 121.15, "x": "ドイツの航空宇宙センターが作りました。"}, {"t": 123.75, "x": "三つ目は電波です。"}, {"t": 125.13333333333334, "x": "地球と電波をやりとりします。"}, {"t": 127.1, "x": "そこから、火星の自転のわずかなふらつきを測ります。"}, {"t": 130.73333333333332, "x": "最初の打ち上げの予定は、二〇一六年三月でした。"}, {"t": 134.6, "x": "ところが、その前の年の十二月、計画は止まります。"}, {"t": 138.83333333333334, "x": "地震計の部品から、空気がもれていたのです。"}, {"t": 142.03333333333333, "x": "この地震計には、揺れを感じ取る"}, {"t": 144.43333333333334, "x": "大事な部分が三つあります。"}, {"t": 146.18333333333334, "x": "それを、真空の容器で囲む作りでした。"}, {"t": 149.18333333333334, "x": "その容器に、もれが見つかったのです。"}, {"t": 151.81666666666666, "x": "一度は直しました。"}, {"t": 153.23333333333332, "x": "けれども試験で、またもれが出ました。"}, {"t": 155.83333333333334, "x": "フランス側の責任者はこう話しています。"}, {"t": 158.53333333333333, "x": "これほど敏感な装置を作ったのは、初めてのことだ。"}, {"t": 162.16666666666666, "x": "火星への出発の機会はおよそ二十六か月に"}, {"t": 165.16666666666666, "x": "一度しか来ません。"}, {"t": 166.23333333333332, "x": "次の機会は二〇一八年でした。"}, {"t": 168.58333333333334, "x": "NASAの研究所の所長は、こう述べています。"}, {"t": 171.73333333333332, "x": "正しくやることのほうが、受け入れられない"}, {"t": 174.4, "x": "危険をおかすより大事だ。"}, {"t": 175.95, "x": "二〇一八年五月五日。"}, {"t": 177.91666666666666, "x": "インサイトはカリフォルニア州の"}, {"t": 179.58333333333334, "x": "空軍基地から打ち上げられました。"}, {"t": 181.56666666666666, "x": "惑星へ向かう機械が、アメリカの西の海岸から出発する。"}, {"t": 185.78333333333333, "x": "それは初めてのことでした。"}, {"t": 187.56666666666666, "x": "着陸機そのものの重さは、三百六十キロ。"}, {"t": 190.96666666666667, "x": "機体の中心は、直径二メートルほどの台です。"}, {"t": 194.36666666666667, "x": "そこに三本の脚がついています。"}, {"t": 196.51666666666668, "x": "道具も、アンテナも、燃料の"}, {"t": 199.05, "x": "タンクも、この台に載っていました。"}, {"t": 201.33333333333334, "x": "台の上には二枚のチップが貼られていました。"}, {"t": 204.03333333333333, "x": "刻まれているのは、人の名前です。"}, {"t": 206.61666666666667, "x": "計画に申し込んだ人たちの名前が、"}, {"t": 208.9, "x": "とても小さな文字で並んでいます。"}, {"t": 211.31666666666666, "x": "その数は合わせて二百四十万人分です。"}, {"t": 214.15, "x": "同じロケットで小さな箱型の衛星が"}, {"t": 216.61666666666667, "x": "二機、火星へ向かいました。"}, {"t": 218.61666666666667, "x": "これほど小さな衛星が地球を遠く離れたのは初めてでした。"}, {"t": 222.53333333333333, "x": "この二機は着陸の知らせを地球へ"}, {"t": 224.71666666666667, "x": "中継する役目を受け持ちました。"}, {"t": 226.81666666666666, "x": "約七か月、四億八千五百万キロの旅でした。"}, {"t": 230.68333333333334, "x": "二〇一八年十一月二十六日。"}, {"t": 233.45, "x": "インサイトは時速一万九千八百キロで、"}, {"t": 236.16666666666666, "x": "火星の大気に飛び込みました。"}, {"t": 238.33333333333334, "x": "地面に降り立つまでにかかったのは六分半です。"}, {"t": 241.25, "x": "アメリカの西海岸の時刻で、昼の十一時五十二分。"}, {"t": 245.23333333333332, "x": "着陸を知らせる信号が届きました。"}, {"t": 247.73333333333332, "x": "降りた場所はエリシウム平原と呼ばれる野原です。"}, {"t": 250.75, "x": "北緯四・五度、東経百三十五・九度。"}, {"t": 254.16666666666666, "x": "ここが選ばれたのは目立つものが何もないからでした。"}, {"t": 257.25, "x": "太陽の光で電気を作るので、"}, {"t": 259.3666666666667, "x": "赤道から離れすぎてはいけない。"}, {"t": 261.76666666666665, "x": "平らで岩が少ないこと。"}, {"t": 263.45, "x": "着陸の安全と測る道具の置きやすさ。"}, {"t": 266.1333333333333, "x": "その両方から決まった、何もない平原でした。"}, {"t": 269.5, "x": "着陸の目標は、ひとつの点ではありません。"}, {"t": 272.71666666666664, "x": "大気の中で、降りる道すじは少しずれます。"}, {"t": 275.96666666666664, "x": "だから、降りてよい範囲を楕円で決めます。"}, {"t": 278.85, "x": "インサイトの楕円は、長さ百四十キロ、幅三十キロでした。"}, {"t": 283.48333333333335, "x": "一・六三六メートル。"}, {"t": 285.1333333333333, "x": "着陸機から、地震計を置いた場所までの距離です。"}, {"t": 288.6666666666667, "x": "インサイトの腕が届く、ほぼいっぱいの距離でした。"}, {"t": 292.06666666666666, "x": "着陸のあと、インサイトはまず太陽電池の羽を広げました。"}, {"t": 296.3666666666667, "x": "羽は十角形のものが左右に二枚です。"}, {"t": 299.05, "x": "次の仕事は長い腕を使うことでした。"}, {"t": 301.68333333333334, "x": "インサイトの台の上には、地震計と"}, {"t": 304.2, "x": "熱を測る道具が載っていました。"}, {"t": 306.2, "x": "それを腕でつかみ、一つずつ地面へ降ろします。"}, {"t": 309.6, "x": "ほかの惑星の地面に、ロボットの腕で地震計を置く。"}, {"t": 313.48333333333335, "x": "それをした機械は、それまでにありませんでした。"}, {"t": 316.6333333333333, "x": "二〇一八年十二月十九日。"}, {"t": 319.06666666666666, "x": "地震計が着陸機のすぐ前の地面に置かれました。"}, {"t": 322.28333333333336, "x": "インサイトの研究の責任者、バナートはこう話しています。"}, {"t": 326.26666666666665, "x": "この地震計がなければ、科学の"}, {"t": 328.6, "x": "目標の四つに三つほどが果たせない。"}, {"t": 330.96666666666664, "x": "地震計の上にはそのあと覆いがかぶせられました。"}, {"t": 333.95, "x": "風と温度の変化から守るための覆いです。"}, {"t": 336.6333333333333, "x": "火星の風は敏感な地震計をゆらしてしまいます。"}, {"t": 339.8833333333333, "x": "昼と夜の寒暖の差も測る値をくるわせます。"}, {"t": 342.95, "x": "次は熱を測る道具の番でした。"}, {"t": 345.28333333333336, "x": "二〇一九年二月十二日。"}, {"t": 347.51666666666665, "x": "熱を測る道具が地震計から約一メートル"}, {"t": 350.3333333333333, "x": "離れた地面に置かれました。"}, {"t": 352.0, "x": "この道具は箱のような形をしています。"}, {"t": 354.6, "x": "箱は支えの台と呼ばれます。"}, {"t": 356.53333333333336, "x": "その中に一本の棒が納められていました。"}, {"t": 359.3, "x": "研究者たちはこの棒をモグラと呼びました。"}, {"t": 361.98333333333335, "x": "モグラは地面にもぐる動物です。"}, {"t": 364.1666666666667, "x": "この棒も自分の力で地面にもぐる作りでした。"}, {"t": 367.23333333333335, "x": "モグラのうしろにはひもがつながっています。"}, {"t": 369.73333333333335, "x": "ひもには温度を測る部分が間をあけて並んでいます。"}, {"t": 372.8666666666667, "x": "モグラが深く進めば、ひもも"}, {"t": 375.01666666666665, "x": "一緒に地面の中へ引き込まれます。"}, {"t": 377.06666666666666, "x": "目標は地面の下、五メートルでした。"}, {"t": 379.93333333333334, "x": "それまで火星に降りたどの機械よりも深い場所です。"}, {"t": 383.1, "x": "ほかの天体の地下で熱の流れを測る。"}, {"t": 385.71666666666664, "x": "それは一九七二年の"}, {"t": 387.7, "x": "アポロ十七号以来のことになるはずでした。"}, {"t": 390.3666666666667, "x": "途中、モグラは五十センチごとに止まる予定でした。"}, {"t": 393.93333333333334, "x": "止まるとまず三日ほど、まわりの"}, {"t": 396.1333333333333, "x": "熱が落ち着くのを待ちます。"}, {"t": 397.76666666666665, "x": "それから自分を一日かけて温めます。"}, {"t": 400.4, "x": "温まり方の速さから、土が熱を"}, {"t": 403.01666666666665, "x": "どれくらい伝えるかが分かります。"}, {"t": 404.8833333333333, "x": "少なくとも三メートルまで潜れれば、"}, {"t": 407.0833333333333, "x": "地中の熱を測り始められる。"}, {"t": 409.4166666666667, "x": "そう説明されていました。"}, {"t": 411.1166666666667, "x": "なぜ、地面の下なのでしょうか。"}, {"t": 413.53333333333336, "x": "地面の表面は昼に温まり、夜に冷えます。"}, {"t": 416.9166666666667, "x": "季節によっても温度が変わります。"}, {"t": 419.0, "x": "けれども深く潜るほど、その変化は届きにくくなります。"}, {"t": 422.8333333333333, "x": "深い場所の温度がさらに深くなるに"}, {"t": 424.95, "x": "つれて、どれだけ上がっていくか。"}, {"t": 427.15, "x": "それが分かれば、計算ができます。"}, {"t": 429.71666666666664, "x": "火星の奥から外へ、どれだけの熱が流れ出ているかです。"}, {"t": 433.5833333333333, "x": "惑星は、生まれたときに熱をため込みました。"}, {"t": 436.76666666666665, "x": "その熱を長い時間をかけて外へ逃がし続けています。"}, {"t": 440.2, "x": "火星がいまどれくらい冷えているのか。"}, {"t": 442.46666666666664, "x": "それを知る手がかりが地中の温度でした。"}, {"t": 444.95, "x": "熱を測る道具には、もう一つの部品がありました。"}, {"t": 448.48333333333335, "x": "地面の表面の温度を測る装置です。"}, {"t": 450.98333333333335, "x": "着陸機の台に取り付けられていました。"}, {"t": 453.45, "x": "地中の温度を正しく読むには、表面の温度の"}, {"t": 456.5833333333333, "x": "変化も知っておく必要があったからです。"}, {"t": 458.95, "x": "ドイツ側の責任者、スポーンは"}, {"t": 461.25, "x": "出発の前にこう話しています。"}, {"t": 463.28333333333336, "x": "火星でいくつか記録を破れるのを楽しみにしている。"}, {"t": 466.4166666666667, "x": "二〇一九年二月二十八日。"}, {"t": 468.9, "x": "モグラが最初に地面をたたきました。"}, {"t": 471.2, "x": "けれども思ったほど進みません。"}, {"t": 473.1666666666667, "x": "石に当たったのではないか。"}, {"t": 474.8666666666667, "x": "最初はそうも考えられました。"}, {"t": 476.8833333333333, "x": "なぜ進まないのか。"}, {"t": 478.26666666666665, "x": "それを考えるには、モグラの作りを知る必要があります。"}, {"t": 482.1666666666667, "x": "モグラはドリルではありません。"}, {"t": 483.95, "x": "くるくる回って穴をあけるのではなく、たたいて進みます。"}, {"t": 487.78333333333336, "x": "中には、ばねと小さな槌が入っています。"}, {"t": 490.81666666666666, "x": "槌はタングステンという重い金属でできています。"}, {"t": 493.8333333333333, "x": "小さなモーターがばねをゆっくり縮めます。"}, {"t": 496.46666666666664, "x": "縮めきったところでばねを放します。"}, {"t": 498.75, "x": "すると槌が前へ飛び出し、モグラの先の内側を打ちます。"}, {"t": 502.8, "x": "その衝撃でモグラは少しだけ前へ進みます。"}, {"t": 505.75, "x": "この槌の仕組みは、ポーランドの会社と"}, {"t": 508.3333333333333, "x": "研究所の協力で作られました。"}, {"t": 510.46666666666664, "x": "どちらも首都ワルシャワにあります。"}, {"t": 512.3833333333333, "x": "打つ間隔は三・七秒に一回。"}, {"t": 514.7333333333333, "x": "一回の衝撃は地球の重力の最大一万四千倍にもなります。"}, {"t": 519.1666666666666, "x": "モグラの中には温度を測る部分もあります。"}, {"t": 521.9333333333333, "x": "その部分は特別なばねで衝撃から守られていました。"}, {"t": 525.4166666666666, "x": "なぜ、ドリルにしなかったのか。"}, {"t": 527.6833333333333, "x": "回すドリルには大きく力の強いモーターが要ります。"}, {"t": 531.0166666666667, "x": "電気もたくさん使います。"}, {"t": 532.6833333333333, "x": "回す力を受け止める重い支えも必要です。"}, {"t": 535.65, "x": "インサイトの台の上には、そこまでの重さを"}, {"t": 538.5166666666667, "x": "載せる余裕がありませんでした。"}, {"t": 540.25, "x": "モグラは軽く小さく作られました。"}, {"t": 542.5166666666667, "x": "使う電気は、家庭の無線の機械より少ない。"}, {"t": 545.7666666666667, "x": "そう説明されていました。"}, {"t": 547.4666666666667, "x": "設計の前提はさらさらとした砂でした。"}, {"t": 550.1, "x": "それまでの着陸地点で見られた、細かい砂です。"}, {"t": 553.6333333333333, "x": "砂ならば、まわりの粒がモグラの胴を押さえます。"}, {"t": 557.0333333333333, "x": "その押さえる力、摩擦があるから、"}, {"t": 559.4666666666667, "x": "たたいた力が前へ進む力に変わります。"}, {"t": 562.4666666666667, "x": "最初の日のあとも、たたいては休み、"}, {"t": 565.0666666666667, "x": "またたたくをくり返しました。"}, {"t": 567.1833333333333, "x": "二〇一九年六月の初め、NASAは"}, {"t": 570.0166666666667, "x": "モグラの位置を計算で示しました。"}, {"t": 572.15, "x": "先は地面の下三十センチから三十五センチ。"}, {"t": 575.3333333333334, "x": "傾きは約十九度。"}, {"t": 576.9833333333333, "x": "頭の一部はまだ支えの台の中に残っていました。"}, {"t": 580.25, "x": "支えの台の中でモグラがどうなっているのか。"}, {"t": 583.0166666666667, "x": "外からは見えません。"}, {"t": 584.4166666666666, "x": "ここで意外なものが役に立ちました。"}, {"t": 586.6666666666666, "x": "すぐそばに置かれた地震計です。"}, {"t": 588.7833333333333, "x": "地震計は、モグラがたたく一回ごとの"}, {"t": 591.5, "x": "揺れを聞き取っていました。"}, {"t": 592.9166666666666, "x": "一回ずつのわずかな違いを調べます。"}, {"t": 595.3666666666667, "x": "そうすれば、槌の仕組みが壊れていないかが分かります。"}, {"t": 598.9666666666667, "x": "調べた結果、槌は地球で試したときと"}, {"t": 601.9333333333333, "x": "同じように動いていました。"}, {"t": 603.5166666666667, "x": "壊れているのは機械ではない。"}, {"t": 605.3833333333333, "x": "問題は土のほうにありそうでした。"}, {"t": 607.5833333333334, "x": "たたいても進まない。"}, {"t": 608.9666666666667, "x": "まわりの土が、モグラを押さえていないということです。"}, {"t": 612.4166666666666, "x": "槌が前へ打つたびにモグラは少しはね返ります。"}, {"t": 615.4333333333333, "x": "押さえがあれば、そのはね返りは止まります。"}, {"t": 618.35, "x": "押さえがなければ、モグラは"}, {"t": 620.2833333333333, "x": "その場で跳ねるだけになります。"}, {"t": 622.05, "x": "モグラはほぼ同じ深さで跳ね続けていました。"}, {"t": 624.8833333333333, "x": "モグラの上には、支えの台がかぶさっていました。"}, {"t": 628.1666666666666, "x": "様子を見るには、それをどかすしかありません。"}, {"t": 631.2, "x": "けれども、それには危険がありました。"}, {"t": 633.7666666666667, "x": "台を持ち上げたとき、モグラが"}, {"t": 636.0333333333333, "x": "一緒に引き抜かれるかもしれない。"}, {"t": 637.8833333333333, "x": "いったん穴から出てしまえば、"}, {"t": 639.5166666666667, "x": "もう一度立てる方法はありません。"}, {"t": 641.9333333333333, "x": "モグラそのものには腕でつかむための"}, {"t": 643.9833333333333, "x": "取っ手がありませんでした。"}, {"t": 645.3833333333333, "x": "台の中に納めて使う前提で作られていたからです。"}, {"t": 648.7, "x": "運用の班は地球の試験場で同じ動きを何度も試しました。"}, {"t": 652.7666666666667, "x": "二〇一九年六月二十八日。"}, {"t": 655.35, "x": "インサイトの腕が支えの台をつかみました。"}, {"t": 657.95, "x": "持ち上げは三回に分けて、少しずつ行われました。"}, {"t": 661.6833333333333, "x": "モグラが土から抜けないよう、確かめながらの作業です。"}, {"t": 665.4333333333333, "x": "台がどいたあと、腕のカメラが"}, {"t": 667.6166666666667, "x": "地面に刺さったモグラを写しました。"}, {"t": 669.7166666666667, "x": "モグラのまわりには穴が広がっていました。"}, {"t": 672.25, "x": "モグラが跳ねるうちにまわりの土を"}, {"t": 674.2833333333333, "x": "押し広げたとみられています。"}, {"t": 675.9333333333333, "x": "胴と土のあいだにはすき間ができていました。"}, {"t": 678.5333333333333, "x": "穴の壁はくずれずに立っていました。"}, {"t": 680.8, "x": "さらさらの砂なら、壁はくずれてすき間を埋めるはずです。"}, {"t": 684.6, "x": "くずれないのは土の粒どうしがくっついているからでした。"}, {"t": 687.9, "x": "研究者たちは地面の表面近くに"}, {"t": 690.2, "x": "固まった層があると考えました。"}, {"t": 692.2333333333333, "x": "粒どうしが軽く固まった層です。"}, {"t": 694.45, "x": "モグラが押し広げた穴は、その層の中で"}, {"t": 697.35, "x": "形を保っていました。"}, {"t": 698.8166666666667, "x": "ここで運用の班は、腕を本来とは"}, {"t": 701.5166666666667, "x": "違うやり方で使うことにしました。"}, {"t": 703.6333333333333, "x": "腕の先にある、小さなスコップです。"}, {"t": 706.35, "x": "もともとは道具を地面に置くための腕でした。"}, {"t": 709.0333333333333, "x": "土を掘ったり押したりする仕事は、"}, {"t": 711.1, "x": "計画にありませんでした。"}, {"t": 713.0166666666667, "x": "二〇一九年十月、班はスコップを"}, {"t": 715.9, "x": "モグラの胴の横に押し当てました。"}, {"t": 717.9666666666667, "x": "足りない摩擦をスコップで外から補う。"}, {"t": 720.4666666666667, "x": "モグラを穴の壁へ押しつける。"}, {"t": 722.4, "x": "このやり方はピン止めと呼ばれました。"}, {"t": 724.6833333333333, "x": "効果はありました。"}, {"t": 725.9166666666666, "x": "十月八日からの十日ほどで、"}, {"t": 727.85, "x": "モグラは二百二十回たたきました。"}, {"t": 730.4, "x": "三回に分けての作業です。"}, {"t": 732.3, "x": "この一週間ほどで約二センチ進みました。"}, {"t": 735.0666666666667, "x": "モグラは地面の中へほぼ全部、隠れかけていました。"}, {"t": 738.7666666666667, "x": "ピン止めには限りがありました。"}, {"t": 740.6833333333333, "x": "モグラが地面に潜っていくほど、"}, {"t": 742.5666666666667, "x": "スコップで押せる部分は短くなります。"}, {"t": 745.35, "x": "頭まで潜りかけるともう横から押すことはできません。"}, {"t": 748.6166666666667, "x": "スコップを離して、モグラだけでたたかせた。"}, {"t": 751.5666666666667, "x": "その直後のことでした。"}, {"t": 753.15, "x": "二〇一九年十月の終わりの週末でした。"}, {"t": 756.1333333333333, "x": "モグラが、穴から逆に出てきてしまったのです。"}, {"t": 759.35, "x": "戻ったのは長さのおよそ半分です。"}, {"t": 761.6666666666666, "x": "進むはずの棒が、たたくたびに後ろへ上がってきました。"}, {"t": 765.3166666666667, "x": "十一月三日、腕のカメラが画像を撮りました。"}, {"t": 768.8833333333333, "x": "穴から斜めに突き出たモグラが写っています。"}, {"t": 771.6, "x": "その上を腕の影が横切っていきます。"}, {"t": 774.05, "x": "なぜ戻ったのか。"}, {"t": 775.25, "x": "岩に当たってはね返されたという見方もありました。"}, {"t": 778.2666666666667, "x": "けれどもドイツ側の班の多くは、"}, {"t": 780.25, "x": "そう考えていませんでした。"}, {"t": 782.2333333333333, "x": "着陸地点は見える岩がとても少ない"}, {"t": 784.6, "x": "場所として選ばれていました。"}, {"t": 786.2333333333333, "x": "見える岩が少なければ、地下の"}, {"t": 788.45, "x": "大きな岩も少ないと考えられます。"}, {"t": 790.65, "x": "モグラ自身も小さな石なら押しのけられます。"}, {"t": 793.5, "x": "直径十センチより小さな石なら、"}, {"t": 795.7, "x": "よけて進めるように作られていました。"}, {"t": 798.2833333333333, "x": "残る答えはやはり土でした。"}, {"t": 800.2333333333333, "x": "ドイツの航空宇宙センターは、班の考えをまとめています。"}, {"t": 804.2833333333333, "x": "質問と答えの形です。"}, {"t": 806.1, "x": "モグラを別の場所に移せないのか。"}, {"t": 808.3166666666667, "x": "それは難しいと答えています。"}, {"t": 810.4, "x": "まず、モグラには取っ手がありません。"}, {"t": 812.9, "x": "それに別の場所へ移しても土は同じです。"}, {"t": 815.7, "x": "同じことが起きる見込みが高いという理由でした。"}, {"t": 818.6333333333333, "x": "地球で火星と同じ条件を試せないのか。"}, {"t": 821.4666666666667, "x": "それにも限りがありました。"}, {"t": 823.2, "x": "火星の重力は地球より弱いのです。"}, {"t": 825.7333333333333, "x": "地球の上では低い重力そのものを作り出せません。"}, {"t": 828.9833333333333, "x": "軽い模型を作れば、今度はたたく力が"}, {"t": 831.9666666666667, "x": "火星のモグラと同じになりません。"}, {"t": 833.9833333333333, "x": "それでもこの土からは、新しいことが"}, {"t": 836.7333333333333, "x": "分かり始めていました。"}, {"t": 838.1166666666667, "x": "モグラのまわりにできた穴。"}, {"t": 839.8166666666667, "x": "その穴がくずれないこと。"}, {"t": 841.4833333333333, "x": "そして、モグラが自分で抜け出てきたこと。"}, {"t": 844.4333333333333, "x": "どれもそれまでの着陸地点の土とは、"}, {"t": 846.8166666666667, "x": "違う性質を示していました。"}, {"t": 849.0666666666667, "x": "火星の土のでき方の考えを見直すことになる。"}, {"t": 852.2, "x": "研究者たちはそう書いています。"}, {"t": 854.2333333333333, "x": "運用の班は次の手を考えました。"}, {"t": 856.6666666666666, "x": "スコップでモグラの上の方を押さえる。"}, {"t": 858.9333333333333, "x": "あるいは土をかき寄せて、モグラの上にかぶせる。"}, {"t": 862.2833333333333, "x": "重さを足して、はね返りを止めるためです。"}, {"t": 865.2666666666667, "x": "ただしモグラの頭からは、あのひもが出ています。"}, {"t": 868.5333333333333, "x": "温度を測る部分と電気を運ぶ線が通っています。"}, {"t": 871.7666666666667, "x": "真上から強く押せば、ひもを傷つけるおそれがありました。"}, {"t": 875.5333333333333, "x": "二〇二〇年、班は少しずつ手を"}, {"t": 878.05, "x": "変えながら作業を続けました。"}, {"t": 879.85, "x": "モグラをもう一度地面へ戻す。"}, {"t": 881.95, "x": "スコップで横から押す。"}, {"t": 883.45, "x": "斜め上から押さえる。"}, {"t": 884.9333333333333, "x": "ひもを避けながら、モグラの頭のふちにスコップを当てる。"}, {"t": 888.5833333333334, "x": "最後はスコップで土をかき集め、"}, {"t": 890.7166666666667, "x": "モグラの上にかぶせて押し固めました。"}, {"t": 893.3666666666667, "x": "モグラは少しずつ地面の中へ戻っていきました。"}, {"t": 896.3166666666667, "x": "やがて、頭まですっかり隠れました。"}, {"t": 899.1166666666667, "x": "NASAの説明では、モグラの上の端は"}, {"t": 901.8166666666667, "x": "地面の二、三センチ下にありました。"}, {"t": 904.35, "x": "ここまで来れば、あとはモグラ自身の力で"}, {"t": 907.2666666666667, "x": "進めるかもしれない。"}, {"t": 908.55, "x": "そう期待されていました。"}, {"t": 910.1166666666667, "x": "けれどもモグラは進みませんでした。"}, {"t": 912.3, "x": "二〇二一年一月九日、土曜日。"}, {"t": 915.5333333333333, "x": "モグラは最後に五百回たたきました。"}, {"t": 917.9166666666666, "x": "深さは変わりませんでした。"}, {"t": 919.65, "x": "五日後の一月十四日。"}, {"t": 921.4666666666667, "x": "NASAは、モグラを潜らせる試みを終えると発表しました。"}, {"t": 925.45, "x": "最初にたたいてから、約二年がたっていました。"}, {"t": 928.6333333333333, "x": "ドイツ側の責任者、スポーンはこう話しています。"}, {"t": 932.1166666666667, "x": "われわれは持てる力をすべて出した。"}, {"t": 934.35, "x": "けれども、火星とわれわれの勇敢な"}, {"t": 936.7833333333333, "x": "モグラは、相性が合わないままだった。"}, {"t": 939.35, "x": "NASAの研究所でモグラを"}, {"t": 940.8666666666667, "x": "担当した技術者は、こう述べています。"}, {"t": 943.6, "x": "モグラは前例のない装置だった。"}, {"t": 945.7333333333333, "x": "前に同じものを使った経験がない。"}, {"t": 948.1166666666667, "x": "だから試すしかなかったということです。"}, {"t": 950.4666666666667, "x": "NASAの科学の責任者も、言葉を残しています。"}, {"t": 953.8833333333333, "x": "これこそ、NASAが危険を引き受ける理由だ。"}, {"t": 956.8666666666667, "x": "うまくいかなかった経験から、"}, {"t": 958.5666666666667, "x": "次の探査に役立つことを学んだ。"}, {"t": 961.0333333333333, "x": "そういう意味の言葉です。"}, {"t": 962.6666666666666, "x": "モグラは結局、どこまで進んだのでしょうか。"}, {"t": 965.9, "x": "その後にまとめられた論文は、こう書いています。"}, {"t": 969.25, "x": "モグラは自分の長さである四十センチより"}, {"t": 971.8166666666667, "x": "深くは、進めなかった。"}, {"t": 973.65, "x": "目標は五メートルでした。"}, {"t": 975.3666666666667, "x": "届いた深さは、その一割にもなりません。"}, {"t": 978.3666666666667, "x": "論文は、主な原因を一つ挙げています。"}, {"t": 981.4833333333333, "x": "地面の近くにある、厚さ数十センチの固まった層です。"}, {"t": 985.5, "x": "粒がくっついているので、モグラの胴を押さえてくれない。"}, {"t": 989.0666666666667, "x": "だからたたいた力が前へ進む力に"}, {"t": 991.3833333333333, "x": "変わらなかったという見方です。"}, {"t": 993.15, "x": "火星の土は、予想よりずっと強く押し返してきた。"}, {"t": 996.7333333333333, "x": "論文は、そのことも書いています。"}, {"t": 999.2333333333333, "x": "もっと重く作れれば、はね返りの"}, {"t": 1001.6166666666667, "x": "少ない丈夫な仕組みにできた。"}, {"t": 1003.4, "x": "もっと強い槌も使えた。"}, {"t": 1005.1833333333333, "x": "支えの台も重くできた。"}, {"t": 1006.8833333333333, "x": "それが論文に書かれた教訓です。"}, {"t": 1009.1166666666667, "x": "ただし、モグラが何も測れなかったわけではありません。"}, {"t": 1012.7333333333333, "x": "モグラの先が、地面の下三十七センチにあったときです。"}, {"t": 1016.6833333333333, "x": "モグラは、自分を温める測定を行いました。"}, {"t": 1020.1666666666666, "x": "その結果、土は熱をとても伝えにくいことが分かりました。"}, {"t": 1024.1666666666667, "x": "粒は細かく、ほとんどが〇・二ミリより小さい。"}, {"t": 1027.7333333333333, "x": "粒のあいだのすき間は全体の約六割。"}, {"t": 1030.3833333333334, "x": "空気を多く含んだ、細かい砂のような土です。"}, {"t": 1033.8333333333333, "x": "地面の下の熱の流れは測れませんでした。"}, {"t": 1036.6, "x": "けれども火星の地面のすぐ下の土が、どんな性質なのか。"}, {"t": 1040.6166666666666, "x": "その最初の確かな測定が残りました。"}, {"t": 1043.2, "x": "スポーンは、このデータが将来役に立つと話しています。"}, {"t": 1046.9666666666667, "x": "人やロボットが、火星の地下を掘ろうとするときです。"}, {"t": 1050.4166666666667, "x": "モグラが止まったあと腕には"}, {"t": 1052.0, "x": "もう一つの仕事が残っていました。"}, {"t": 1054.1, "x": "地震計と着陸機をつなぐ、もう一本のひもです。"}, {"t": 1057.7, "x": "昼と夜の温度差でこのひもが伸び縮みします。"}, {"t": 1060.6166666666666, "x": "そのたびに、地震計の記録に雑音が入りました。"}, {"t": 1064.2333333333333, "x": "ぱちっ、ぴしっ、という音のような雑音です。"}, {"t": 1067.5333333333333, "x": "腕のスコップでそのひもの上に"}, {"t": 1069.3, "x": "土をかけ、温度の変化をやわらげる。"}, {"t": 1072.05, "x": "モグラのために覚えた土の扱い方は、"}, {"t": 1074.55, "x": "地震計を守るために使われました。"}, {"t": 1077.1666666666667, "x": "モグラが土と格闘していたあいだのことです。"}, {"t": 1079.85, "x": "すぐそばの地震計は、別の記録を集めていました。"}, {"t": 1083.55, "x": "地震計が動き始めたのは、二〇一九年の初めです。"}, {"t": 1087.5333333333333, "x": "ところが最初の数週間、火星の揺れは"}, {"t": 1090.4333333333334, "x": "一つも見つかりませんでした。"}, {"t": 1092.1333333333334, "x": "ドイツの地震学者、クナップマイヤーは、"}, {"t": 1094.8666666666666, "x": "当時をこう振り返っています。"}, {"t": 1096.9833333333333, "x": "揺れが一つも記録されなかったら、どうなるのか。"}, {"t": 1100.2666666666667, "x": "われわれの理論にとって、何を意味するのか。"}, {"t": 1103.4, "x": "もう、その計算を始めていた。"}, {"t": 1105.8333333333333, "x": "二〇一九年四月六日。"}, {"t": 1107.8333333333333, "x": "火星の一日で数えて、着陸から百二十八日目のことでした。"}, {"t": 1112.5, "x": "火星の一日は、二十四時間三十九分です。"}, {"t": 1116.0666666666666, "x": "地震計が小さな揺れをとらえました。"}, {"t": 1118.4, "x": "火星の中から来たとみられる、最初の揺れです。"}, {"t": 1121.7, "x": "その揺れは小さく、長く続きました。"}, {"t": 1124.5666666666666, "x": "NASAの惑星科学の責任者は、月の揺れと比べました。"}, {"t": 1128.5166666666667, "x": "アポロ計画のとき、月で記録された揺れです。"}, {"t": 1131.8166666666666, "x": "大きさも長さもそれに似ていると述べました。"}, {"t": 1134.4666666666667, "x": "この揺れの記録には三つの音が含まれていました。"}, {"t": 1137.5666666666666, "x": "火星の風の音。"}, {"t": 1138.9166666666667, "x": "揺れそのもの。"}, {"t": 1139.9, "x": "そして、写真を撮るために動いた、"}, {"t": 1142.4333333333334, "x": "インサイトの腕の音です。"}, {"t": 1144.3666666666666, "x": "地震計の敏感さは、班の期待を上回っていました。"}, {"t": 1148.15, "x": "フランス側の地震計の責任者は、こう話しています。"}, {"t": 1151.95, "x": "何か月もこういう信号を待っていた。"}, {"t": 1154.3166666666666, "x": "火星はいまも揺れている。"}, {"t": 1155.9333333333334, "x": "その証拠でした。"}, {"t": 1157.1333333333334, "x": "バナートは、こう述べています。"}, {"t": 1159.3, "x": "この最初の揺れが、火星の地震学という"}, {"t": 1162.1833333333334, "x": "新しい分野の始まりだ。"}, {"t": 1163.85, "x": "では最初の数週間、揺れが見つからなかったのはなぜか。"}, {"t": 1167.6833333333334, "x": "あとになって理由が分かりました。"}, {"t": 1169.65, "x": "風です。"}, {"t": 1170.75, "x": "インサイトのいた場所は、そのとき冬でした。"}, {"t": 1173.6833333333334, "x": "冬の風の雑音が火星の小さな揺れを"}, {"t": 1176.2666666666667, "x": "すべて覆い隠していたのです。"}, {"t": 1178.0833333333333, "x": "しかも火星の揺れそのものも、"}, {"t": 1179.8, "x": "冬は夏より少ないことが分かりました。"}, {"t": 1182.55, "x": "春と夏になると条件が変わりました。"}, {"t": 1185.0166666666667, "x": "暖かい季節の夕方には風がほとんどやみます。"}, {"t": 1188.1333333333334, "x": "日がしずんでから、真夜中まで。"}, {"t": 1190.45, "x": "その時間が揺れを聞くのにいちばん向いていました。"}, {"t": 1193.3333333333333, "x": "火星の夕方、静まった平原で"}, {"t": 1195.8, "x": "地震計は耳をすませていました。"}, {"t": 1197.8666666666666, "x": "揺れの多くは、ある一つの地域から来ていました。"}, {"t": 1201.2, "x": "インサイトから千五百キロ離れた、ケルベロス地溝帯です。"}, {"t": 1205.2333333333333, "x": "地面に長い割れ目が何本も走っている地域です。"}, {"t": 1208.3666666666666, "x": "この地域の火山が最後に活動したのは、"}, {"t": 1210.95, "x": "二十万年前より新しい時代とされています。"}, {"t": 1214.25, "x": "ここから来る揺れには、特徴がありました。"}, {"t": 1217.1333333333334, "x": "地球の、火山のある地域の揺れと似ていたのです。"}, {"t": 1220.5333333333333, "x": "ただし研究者は付け加えています。"}, {"t": 1222.8166666666666, "x": "近いうちに新しい噴火が起きるという意味ではない。"}, {"t": 1225.9833333333333, "x": "地面の中にたまった力が、ときどき外れる。"}, {"t": 1229.1666666666667, "x": "それが火星の揺れの多くを起こしていました。"}, {"t": 1231.8, "x": "その小さな揺れが地下を通り抜けて、"}, {"t": 1234.0666666666666, "x": "地震計に届いていました。"}, {"t": 1236.1, "x": "火星の核の半径はどれくらいか。"}, {"t": 1238.3666666666666, "x": "いまの資料には、違う数字が並んでいます。"}, {"t": 1241.4, "x": "千八百三十キロ。"}, {"t": 1243.0166666666667, "x": "千六百七十五キロ。"}, {"t": 1244.7666666666667, "x": "千六百五十キロ。"}, {"t": 1246.3, "x": "千八百三十五キロ。"}, {"t": 1248.0, "x": "測る方法と考え方が違うからです。"}, {"t": 1250.6333333333334, "x": "けれどもどの数字も、インサイトの地震計と"}, {"t": 1253.5666666666666, "x": "電波から出てきたものです。"}, {"t": 1255.1, "x": "数字がどう出てきたのか。"}, {"t": 1256.6833333333334, "x": "年の順にたどります。"}, {"t": 1258.15, "x": "揺れは星の中を伝わっていきます。"}, {"t": 1260.4166666666667, "x": "地下に性質の違う層の境目があると、"}, {"t": 1263.0333333333333, "x": "揺れの一部はそこで跳ね返ります。"}, {"t": 1265.5, "x": "跳ね返った揺れは少し遅れて地上 "}, {"t": 1379.3166666666666, "x": "その陰で起きた揺れは、届きにくくなります。"}, {"t": 1382.3833333333334, "x": "インサイトが聞き取れる揺れの数にも、"}, {"t": 1384.5166666666667, "x": "限りがあったかもしれません。"}, {"t": 1386.5166666666667, "x": "NASAの発表は、地球と比べています。"}, {"t": 1389.3333333333333, "x": "地球の核を測るのに、科学者は何百年もかかった。"}, {"t": 1393.2, "x": "この論文をまとめたスイスの研究者は、こう話しています。"}, {"t": 1397.2166666666667, "x": "インサイトはわずか二年で火星の核を測った。"}, {"t": 1400.1, "x": "バナートはこの十年の、すべての仕事と"}, {"t": 1402.8833333333334, "x": "心配が実った、と述べました。"}, {"t": 1405.1666666666667, "x": "ところが話はここで終わりませんでした。"}, {"t": 1407.6833333333334, "x": "二〇二三年十月、イギリスの科学雑誌に"}, {"t": 1411.0833333333333, "x": "二本の論文が並んで載りました。"}, {"t": 1413.0833333333333, "x": "二本とも核のすぐ外側にもう一つの層があると考えました。"}, {"t": 1416.9833333333333, "x": "岩がすっかりとけた、厚さ約百五十キロの層です。"}, {"t": 1420.8, "x": "この層があるとすると核そのものは"}, {"t": 1422.8, "x": "思われていたより小さくなります。"}, {"t": 1424.85, "x": "一本は核の半径を千六百七十五キロ。"}, {"t": 1427.9333333333334, "x": "もう一本は千六百五十キロとしました。"}, {"t": 1430.65, "x": "小さくなった分、核は重く、詰まっていることになります。"}, {"t": 1434.9, "x": "核に混ざっている、軽い元素の量も変わります。"}, {"t": 1438.25, "x": "火星の材料から考えて、無理のない量に収まる。"}, {"t": 1441.8833333333334, "x": "論文はそう書いています。"}, {"t": 1443.5833333333333, "x": "このときの手がかりは、核のふちを"}, {"t": 1445.95, "x": "かすめて回り込んできた揺れでした。"}, {"t": 1448.0166666666667, "x": "同じ年、インサイトの三つ目の道具、"}, {"t": 1450.7833333333333, "x": "電波の測定からも結果が出ています。"}, {"t": 1453.45, "x": "地球から電波を送り、インサイトがそれを送り返す。"}, {"t": 1457.1666666666667, "x": "その電波のわずかなずれから、"}, {"t": 1458.9, "x": "火星の自転を細かく測りました。"}, {"t": 1461.4333333333334, "x": "使われたのは火星の一日で数えて、"}, {"t": 1463.8833333333334, "x": "最初の九百日分の記録です。"}, {"t": 1466.4666666666667, "x": "とけた核があると火星の自転はわずかにふらつきます。"}, {"t": 1469.7, "x": "そのふらつきから、核の半径は"}, {"t": 1471.9833333333333, "x": "千八百三十五キロと見積もられました。"}, {"t": 1474.5166666666667, "x": "地震計とは別の方法です。"}, {"t": 1476.5833333333333, "x": "さらにこの測定は、思いがけないことを示しました。"}, {"t": 1480.1833333333334, "x": "火星の自転がほんの少しずつ速くなっているのです。"}, {"t": 1483.3666666666666, "x": "一年に一ミリ秒にも満たない分だけ、"}, {"t": 1485.85, "x": "火星の一日が短くなっている。"}, {"t": 1488.3333333 Aは、この穴をその中で"}, {"t": 1589.0833333333333, "x": "最も大きいものの一つとしています。"}, {"t": 1591.3333333333333, "x": "二〇二一年の後半には、新しい"}, {"t": 1594.2666666666667, "x": "大きな穴が二つできていました。"}, {"t": 1596.2, "x": "どちらも直径百三十メートルを超えます。"}, {"t": 1598.9666666666667, "x": "二つともインサイトの記録の中で、"}, {"t": 1601.0666666666666, "x": "大きいほうの揺れを起こしていました。"}, {"t": 1603.5333333333333, "x": "この二つは、火星を回る探査機が十六年の運用で"}, {"t": 1607.2166666666667, "x": "見つけた新しい穴の中で、最も大きいものでした。"}, {"t": 1610.85, "x": "震源までの距離が穴の場所から正確に分かる。"}, {"t": 1613.8833333333334, "x": "火星の内部の模型を、答えの分かった揺れで試せる。"}, {"t": 1617.5, "x": "それは、初めての機会でした。"}, {"t": 1619.7833333333333, "x": "二〇二二年五月四日。"}, {"t": 1621.7166666666667, "x": "火星の一日で数えて、千二百二十二日目。"}, {"t": 1625.3666666666666, "x": "地震計がそれまでで最も大きな揺れを記録しました。"}, {"t": 1628.7333333333333, "x": "マグニチュード五と見積もられました。"}, {"t": 1630.8166666666666, "x": "ほかの惑星で記録された揺れとして、最も大きいものです。"}, {"t": 1634.9166666666667, "x": "それまでの最大は、マグニチュード四・二。"}, {"t": 1638.0166666666667, "x": "前の年の八月の揺れでした。"}, {"t": 1640.1333333333334, "x": "その三日後、インサイトの使える電気は、"}, {"t": 1642.9666666666667, "x": "安全のために休む基準をわずかに下回りました。"}, {"t": 1646.4333333333334, "x": "季節は冬に向かっていました。"}, {"t": 1648.3833333333334, "x": "空のほこりが日の光をさえぎっていたのです。"}, {"t": 1651.1666666666667, "x": "バナートはこう話しています。"}, {"t": 1652.9666666666667, "x": "地震計を置いてから、ずっと大きな一発を待っていた。"}, {"t": 1656.6666666666667, "x": "その後も地震計の記録の読み解きは続きました。"}, {"t": 1659.8333333333333, "x": "二〇二四年には、別の研究が結果を出しています。"}, {"t": 1663.65, "x": "インサイトの真下の地殻についてです。"}, {"t": 1665.9833333333333, "x": "地下約十一・五キロから二十キロの深さ。"}, {"t": 1668.8833333333334, "x": "そこにある、ひびの入った岩の"}, {"t": 1671.0333333333333, "x": "すき間を、液体の水が満たしている。"}, {"t": 1673.5666666666666, "x": "そう考えると揺れの伝わる速さと"}, {"t": 1675.7, "x": "重力の測定を、いちばんよく説明できる。"}, {"t": 1678.8, "x": "そういう研究です。"}, {"t": 1680.2166666666667, "x": "かつて火星の表面を流れていた水の一部は、"}, {"t": 1683.0833333333333, "x": "地下に閉じ込められたのではないか。"}, {"t": 1685.4, "x": "そう考えられてきました。"}, {"t": 1687.1, "x": "その水がどこへ行ったのか。"}, {"t": 1688.8666666666666, "x": "この研究は、それを考える手がかりの"}, {"t": 1691.5833333333333, "x": "一つになるとしています。"}, {"t": 1693.0333333333333, "x": "ただしこれは揺れの速さからの推定です。"}, {"t": 1695.6333333333334, "x": "その深さまで掘って、水を確かめた機械はありません。"}, {"t": 1699.2833333333333, "x": "モグラが掘れたのは地下四十センチまででした。"}, {"t": 1702.0833333333333, "x": "インサイトの電気は太陽電池から来ていました。"}, {"t": 1704.95, "x": "その羽の上に少しずつ、火星の"}, {"t": 1707.45, "x": "ほこりが積もっていきました。"}, {"t": 1708.9833333333333, "x": "羽は、ほこりが積もることも見込んで作られていました。"}, {"t": 1712.5666666666666, "x": "火星の一年、地球の約二年は持つ作りです。"}, {"t": 1716.1666666666667, "x": "実際にはもう一年、任務をのばすことができました。"}, {"t": 1719.8333333333333, "x": "二〇二二年四月二十四日。"}, {"t": 1722.0833333333333, "x": "インサイトは腕のカメラで最後の自分撮りをしました。"}, {"t": 1725.25, "x": "火星の一日で数えて、千二百十一日目。"}, {"t": 1728.85, "x": "着陸した年の自分撮りより、機体は"}, {"t": 1731.5833333333333, "x": "ずっと多くのほこりに覆われていました。"}, {"t": 1733.85, "x": "腕のスコップは羽のほこりを払う手伝いにも使われました。"}, {"t": 1737.4833333333333, "x": "道具を置くための腕でした。"}, {"t": 1739.2166666666667, "x": "その腕が土をかけ、モグラを押さえ、"}, {"t": 1741.8, "x": "最後は羽の掃除までしました。"}, {"t": 1744.1166666666666, "x": "二〇二二年十二月十一日。"}, {"t": 1746.65, "x": "インサイトは最後の画像の一枚を撮りました。"}, {"t": 1749.4833333333333, "x": "写っているのは地面に置かれた地震計です。"}, {"t": 1752.1833333333334, "x": "火星の一日で数えて、千四百三十六日目でした。"}, {"t": 1756.35, "x": "二〇二二年十二月十五日。"}, {"t": 1758.7333333333333, "x": "それがインサイトと地球の、最後の交信になりました。"}, {"t": 1762.4666666666667, "x": "その後NASAは二回続けて呼びかけました。"}, {"t": 1765.0, "x": "返事はありませんでした。"}, {"t": 1766.5666666666666, "x": "二〇二二年十二月二十一日。"}, {"t": 1769.2166666666667, "x": "NASAはインサイトの任務が終わったと発表しました。"}, {"t": 1772.2666666666667, "x": "火星にいたのは火星の一日で数えて、千四百四十六日。"}, {"t": 1776.9333333333334, "x": "予定のおよそ二倍です。"}, {"t": 1778.5333333333333, "x": "地震計が記録した火星の揺れは、千三百十九回。"}, {"t": 1782.4833333333333, "x": "その中には空から落ちてきた石が"}, {"t": 1784.6166666666666, "x": "起こした揺れも含まれています。"}, {"t": 1786.4, "x": "バナートはこう話しています。"}, {"t": 1788.2, "x": "この四年間、インサイトを火星にいる友人だと思ってきた。"}, {"t": 1792.1833333333334, "x": "仕事の仲間だと思ってきた。"}, {"t": 1794.1166666666666, "x": "だから、お別れを言うのはつらい。"}, {"t": 1796.4666666666667, "x": "エリシウム平原にはいまも着陸機が立っています。"}, {"t": 1799.55, "x": "羽の上 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
