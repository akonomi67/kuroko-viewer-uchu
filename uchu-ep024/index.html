<script>
const D={"name": "ep024", "file": "ep024", "dur": 1860.5833125, "segs": [], "subs": [{"t": 0.0, "x": "ハレー彗星の核を近くから見られたのは、"}, {"t": 2.5166666666666666, "x": "一九八六年三月の九日ほどのあいだだけです。"}, {"t": 6.633333333333334, "x": "いちばん近づいた探査機は、核から"}, {"t": 9.116666666666667, "x": "五百九十六キロメートルまで迫りました。"}, {"t": 11.766666666666667, "x": "そのカメラは、最も近づいた一夜で止まりました。"}, {"t": 15.216666666666667, "x": "その彗星の粒は、毎年十月、夜の空で流れ星になります。"}, {"t": 20.233333333333334, "x": "オリオン座の方角から飛んでくるように見えます。"}, {"t": 23.116666666666667, "x": "そのためオリオン座流星群と呼ばれています。"}, {"t": 25.9, "x": "暗い空なら一時間に十個から二十個ほどです。"}, {"t": 28.983333333333334, "x": "流れ星の正体は宇宙を漂う小さな粒です。"}, {"t": 32.28333333333333, "x": "粒は秒速六十六キロメートルで大気に飛び込みます。"}, {"t": 35.85, "x": "そして燃えて一瞬だけ光ります。"}, {"t": 37.95, "x": "ハレー彗星は、およそ七十六年ごとに、"}, {"t": 41.03333333333333, "x": "太陽のそばへ戻ってきます。"}, {"t": 43.13333333333333, "x": "五月にも流星群があります。"}, {"t": 45.13333333333333, "x": "みずがめ座エータ流星群です。"}, {"t": 47.166666666666664, "x": "こちらも同じ彗星の粒から生まれています。"}, {"t": 49.9, "x": "地球はハレー彗星の通り道を横切っています。"}, {"t": 53.0, "x": "それも一年に二回です。"}, {"t": 54.733333333333334, "x": "ただ、粒を落とした本体は、"}, {"t": 56.833333333333336, "x": "いま太陽からずっと遠くにいます。"}, {"t": 59.28333333333333, "x": "最後に太陽のそばへ来たのは、一九八六年でした。"}, {"t": 63.6, "x": "その年の三月、五機の探査機が"}, {"t": 66.15, "x": "次々とこの彗星に近づきました。"}, {"t": 68.46666666666667, "x": "日本の二機と、ソビエト連邦の"}, {"t": 70.88333333333334, "x": "二機と、ヨーロッパの一機です。"}, {"t": 73.05, "x": "彗星の中心には、核と呼ばれるかたまりがあります。"}, {"t": 76.68333333333334, "x": "氷とちりが固まったものです。"}, {"t": 78.75, "x": "太陽に近づくと氷がとけて、ガスとちりが噴き出します。"}, {"t": 82.68333333333334, "x": "それが核のまわりに広がります。"}, {"t": 84.76666666666667, "x": "そしてぼんやりした雲と長い尾になります。"}, {"t": 87.3, "x": "地上から見える彗星の姿は、ほとんどがこの雲と尾です。"}, {"t": 91.35, "x": "核そのものは見えません。"}, {"t": 92.93333333333334, "x": "その核を近くから写した画像は残っています。"}, {"t": 95.9, "x": "撮られたのは、一九八六年三月の九日ほどのあいだです。"}, {"t": 100.61666666666666, "x": "それより前に、核を近くで見た機体はありません。"}, {"t": 104.03333333333333, "x": "それより後にもありません。"}, {"t": 105.73333333333333, "x": "いちばん近づいたのは、ヨーロッパの探査機"}, {"t": 108.53333333333333, "x": "ジオットでした。"}, {"t": 109.41666666666667, "x": "核からの距離は五百九十六キロメートル。"}, {"t": 112.18333333333334, "x": "最も近づく七・六秒前に、機体に"}, {"t": 115.26666666666667, "x": "一つの粒がぶつかりました。"}, {"t": 116.96666666666667, "x": "機体は揺さぶられ、地球との通信がとだえました。"}, {"t": 120.45, "x": "これはその九日間とその後の記録です。"}, {"t": 123.1, "x": "ハレー彗星という名前は、一人の天文学者からきています。"}, {"t": 127.16666666666667, "x": "イギリスのエドモンド・ハレーです。"}, {"t": 129.05, "x": "一七〇五年、ハレーはいくつもの"}, {"t": 131.61666666666667, "x": "彗星の軌道を計算しました。"}, {"t": 133.6, "x": "その中で三つの明るい彗星に目をとめます。"}, {"t": 136.5, "x": "一五三一年と一六〇七年、そして"}, {"t": 140.0, "x": "一六八二年に現れた彗星です。"}, {"t": 142.83333333333334, "x": "ハレーは、この三つが同じ一つの彗星だと考えました。"}, {"t": 146.78333333333333, "x": "そして、次は一七五八年に戻ってくると予言しました。"}, {"t": 151.26666666666668, "x": "彗星は予言どおりに戻ってきました。"}, {"t": 153.73333333333332, "x": "計算が正しかったのです。"}, {"t": 155.5, "x": "彗星の帰りを前もって言い当てたのは、"}, {"t": 157.93333333333334, "x": "これが初めてでした。"}, {"t": 159.58333333333334, "x": "そのため、この彗星にはハレーの名前がつけられています。"}, {"t": 163.45, "x": "ただ、ハレー自身は一七四二年に亡くなっています。"}, {"t": 167.46666666666667, "x": "予言した年より十六年前のことです。"}, {"t": 170.08333333333334, "x": "自分の計算が当たった空を、ハレーは見ていません。"}, {"t": 173.5, "x": "彗星の名前は、予言した人の名前として残りました。"}, {"t": 177.31666666666666, "x": "それまで彗星は、いつ現れるか分からないものでした。"}, {"t": 181.05, "x": "ハレーの計算で、彗星は戻ってくる"}, {"t": 183.73333333333332, "x": "天体の一つになりました。"}, {"t": 185.38333333333333, "x": "その後の研究で、この彗星の記録は"}, {"t": 188.23333333333332, "x": "さらに昔までたどられました。"}, {"t": 190.06666666666666, "x": "さかのぼれるのは二千年以上前の観測です。"}, {"t": 193.15, "x": "一〇六六年の記録もあります。"}, {"t": 195.46666666666667, "x": "イングランドでの戦いを描いた、刺しゅうの布です。"}, {"t": 198.91666666666666, "x": "描かれたのはヘイスティングズの戦いです。"}, {"t": 201.45, "x": "この布は、バイユーのタペストリーと呼ばれています。"}, {"t": 204.75, "x": "その中にハレー彗星が縫い込まれています。"}, {"t": 207.45, "x": "地球にいちばん近づいたのは、"}, {"t": 209.23333333333332, "x": "八三七年の四月十日とされています。"}, {"t": 212.56666666666666, "x": "距離は、太陽と地球のあいだの〇・〇三三倍です。"}, {"t": 216.41666666666666, "x": "キロメートルに直すと、約五百万キロメートルになります。"}, {"t": 220.36666666666667, "x": "そのときの明るさも見積もられています。"}, {"t": 222.78333333333333, "x": "マイナス三・五等ほどです。"}, {"t": 224.7, "x": "一周にかかる年数は、いつも同じではありません。"}, {"t": 228.13333333333333, "x": "平均すると七十六年です。"}, {"t": 230.25, "x": "人の一生ほどの長さです。"}, {"t": 232.11666666666667, "x": "短いときは七十四・四二年でした。"}, {"t": 234.91666666666666, "x": "一八三五年から一九一〇年までの一周です。"}, {"t": 238.8, "x": "長いときは七十九・二五年。"}, {"t": 241.21666666666667, "x": "四五一年から五三〇年までの一周です。"}, {"t": 244.85, "x": "軌道は、地球の軌道に対して十八度傾いています。"}, {"t": 248.68333333333334, "x": "そして、惑星とは逆の向きに太陽を回っています。"}, {"t": 252.43333333333334, "x": "地球とも逆向きです。"}, {"t": 254.01666666666668, "x": "この逆向きの動きが、のちに"}, {"t": 256.15, "x": "探査機を苦しめることになります。"}, {"t": 258.21666666666664, "x": "探査機は地球と同じ向きに進みます。"}, {"t": 260.78333333333336, "x": "そのため彗星とは、正面からすれちがう形になります。"}, {"t": 264.71666666666664, "x": "すれちがう速さはとても大きくなります。"}, {"t": 267.18333333333334, "x": "秒速にして、七十キロメートル前後から"}, {"t": 270.1666666666667, "x": "八十キロメートル近くです。"}, {"t": 271.96666666666664, "x": "前回、太陽にいちばん近づいたのは、"}, {"t": 274.7, "x": "一九八六年二月九日でした。"}, {"t": 277.8666666666667, "x": "太陽からの距離は、太陽と地球の距離の約〇・五九倍です。"}, {"t": 282.48333333333335, "x": "このとき、地上からの眺めは"}, {"t": 284.6666666666667, "x": "派手なものではありませんでした。"}, {"t": 286.45, "x": "NASAがそのときの明るさを書いています。"}, {"t": 288.8833333333333, "x": "地球に近づいたときでも、北極星より"}, {"t": 291.73333333333335, "x": "少し明るい程度でした。"}, {"t": 293.28333333333336, "x": "しかもその光は点ではありません。"}, {"t": 295.43333333333334, "x": "星よりずっと広い範囲に、ぼんやり広がっていました。"}, {"t": 299.01666666666665, "x": "地上から見えるのは、核を包むガスとちりの雲です。"}, {"t": 302.68333333333334, "x": "雲の中の核は、地上の望遠鏡では見分けられません。"}, {"t": 306.55, "x": "核の姿を見るには、そばまで行くしかありませんでした。"}, {"t": 310.28333333333336, "x": "ヨーロッパの国々が共同で運営する、ヨーロッパ宇宙機関。"}, {"t": 314.5, "x": "ここで、ハレー彗星へ向かう計画が認められました。"}, {"t": 318.1666666666667, "x": "一九八〇年のことです。"}, {"t": 320.35, "x": "もともとはアメリカとの共同の計画でした。"}, {"t": 323.0833333333333, "x": "ところが途中でアメリカが抜けました。"}, {"t": 325.3333333333333, "x": "それでも計画は続きました。"}, {"t": 327.3333333333333, "x": "ヨーロッパは、自分たちの一機で行くことになります。"}, {"t": 330.73333333333335, "x": "ヨーロッパにとって、初めての計画になりました。"}, {"t": 334.1, "x": "遠い宇宙へ向かう探査機です。"}, {"t": 336.1, "x": "認められてから、機体は急いで組み立てられました。"}, {"t": 339.5, "x": "彗星が戻ってくる日は、待ってくれないからです。"}, {"t": 342.8, "x": "ハレー彗星を見逃せば、次の機会は"}, {"t": 345.55, "x": "七十五年ほど先になります。"}, {"t": 347.51666666666665, "x": "ヨーロッパ宇宙機関もそう書いています。"}, {"t": 349.93333333333334, "x": "打ち上げの計画も変わりました。"}, {"t": 352.01666666666665, "x": "はじめは、大きなアリアン3型に載せる予定でした。"}, {"t": 355.51666666666665, "x": "別の衛星と一緒の打ち上げです。"}, {"t": 357.75, "x": "最後は、一機だけでアリアン1型に載ることになります。"}, {"t": 361.53333333333336, "x": "機体の名前はジオット。"}, {"t": 363.15, "x": "少し変わった名前です。"}, {"t": 364.71666666666664, "x": "イタリアの画家、ジョット・"}, {"t": 366.4, "x": "ディ・ボンドーネからとられました。"}, {"t": 368.0833333333333, "x": "ジョットは、一三〇一年にハレー彗星を"}, {"t": 371.06666666666666, "x": "見たとされています。"}, {"t": 372.2, "x": "そして一つの絵を描きました。"}, {"t": 374.18333333333334, "x": "場所は、イタリアのパドバにある礼拝堂の壁です。"}, {"t": 377.5833333333333, "x": "東方の三人の博士が、生まれたばかりの"}, {"t": 380.48333333333335, "x": "イエスを訪ねる場面です。"}, {"t": 382.06666666666666, "x": "その絵の空には、ベツレヘムの星が描かれています。"}, {"t": 385.65, "x": "ジョットは、その星をハレー彗星の"}, {"t": 388.05, "x": "姿で描いたとされています。"}, {"t": 389.81666666666666, "x": "それから六百八十年あまり。"}, {"t": 391.95, "x": "その画家の名前を背負って、"}, {"t": 393.6666666666667, "x": "ヨーロッパの一機が同じ彗星へ向かいます。"}, {"t": 396.71666666666664, "x": "機体の重さは九百六十キログラム。"}, {"t": 399.3, "x": "軽自動車ほどの重さです。"}, {"t": 401.1166666666667, "x": "差し渡し約二メートル、高さ"}, {"t": 403.4, "x": "約一メートルの太い筒の形です。"}, {"t": 405.75, "x": "上には、直径一・五メートルのアンテナが載っています。"}, {"t": 409.4, "x": "機体はこまのように回りながら進みます。"}, {"t": 412.01666666666665, "x": "一分間に十五回の速さです。"}, {"t": 414.21666666666664, "x": "いちばんの工夫は前に取り付けた盾でした。"}, {"t": 416.8833333333333, "x": "彗星のまわりには、細かな粒が飛び交っています。"}, {"t": 420.3333333333333, "x": "すれちがう速さは、秒速六十八キロメートルです。"}, {"t": 424.06666666666666, "x": "この速さなら小さな粒でも強くぶつかります。"}, {"t": 427.06666666666666, "x": "一秒で六十八キロメートル進む速さです。"}, {"t": 430.1, "x": "銃の弾の数十倍にあたります。"}, {"t": 432.3333333333333, "x": "そこで二枚の板を重ねた盾が作られました。"}, {"t": 435.25, "x": "一枚目は、厚さ一ミリメートルのアルミニウムの板です。"}, {"t": 439.1166666666667, "x": "二枚目は、厚さ十二ミリメートルのケブラーの板です。"}, {"t": 442.75, "x": "ケブラーはとても丈夫な人工の繊維です。"}, {"t": 445.4, "x": "二枚のあいだは、二十三センチメートル空けてあります。"}, {"t": 449.03333333333336, "x": "粒を一枚目で受けて二枚目で止める作りです。"}, {"t": 452.01666666666665, "x": "盾の役目は一つです。"}, {"t": 453.68333333333334, "x": "高速の粒から機体を守ることでした。"}, {"t": 456.23333333333335, "x": "電気は太陽電池でまかないます。"}, {"t": 458.43333333333334, "x": "彗星に出会うときの電力は、百九十ワットでした。"}, {"t": 462.1666666666667, "x": "ほかに、銀とカドミウムを使った電池を四つ積んでいます。"}, {"t": 466.06666666666666, "x": "観測機器は十一種類です。"}, {"t": 468.06666666666666, "x": "磁場を測る機器があります。"}, {"t": 469.76666666666665, "x": "ガスや粒の中身を調べる機器もあります。"}, {"t": 472.4166666666667, "x": "粒がぶつかるのを数える機器も積まれました。"}, {"t": 475.1166666666667, "x": "その中の一つが、核を色ごとに撮るカメラでした。"}, {"t": 478.65, "x": "この記録の主役になるカメラです。"}, {"t": 480.85, "x": "一九八五年七月二日、世界時の十一時二十三分。"}, {"t": 485.71666666666664, "x": "ジオットは、アリアン1型ロケットの"}, {"t": 488.2, "x": "十四号機で打ち上げられました。"}, {"t": 490.18333333333334, "x": "彗星に着くまで八か月あまりの旅です。"}, {"t": 492.93333333333334, "x": "ただ、ジオットだけでは足りないものがありました。"}, {"t": 496.0, "x": "核のそばへ確実にたどり着ける保証です。"}, {"t": 498.73333333333335, "x": "核がどこにあるのかを、前もって"}, {"t": 500.96666666666664, "x": "細かく知る必要があったのです。"}, {"t": 502.95, "x": "ハレー彗星に向かったのは、ジオットだけではありません。"}, {"t": 506.48333333333335, "x": "まずソビエト連邦のベガ1号と2号です。"}, {"t": 509.31666666666666, "x": "二機で一組です。"}, {"t": 510.6333333333333, "x": "ベガという名前にも意味があります。"}, {"t": 512.7, "x": "二つのロシア語を縮めたものです。"}, {"t": 514.9333333333333, "x": "金星を表すベネラと、ハレーを表すガレイです。"}, {"t": 518.5666666666667, "x": "名前のとおり、一機で二つの仕事をこなす探査機でした。"}, {"t": 522.4166666666666, "x": "金星に着陸機と気球を届けてから、"}, {"t": 524.8833333333333, "x": "ハレー彗星へ向かうのです。"}, {"t": 526.9666666666667, "x": "二機は同じ作りです。"}, {"t": 528.5166666666667, "x": "一機がうまくいかなくても、もう一機があります。"}, {"t": 531.55, "x": "両方が成功すれば観測の量は二倍になります。"}, {"t": 534.8666666666667, "x": "彗星はいつ、どれだけガスを噴くか分かりません。"}, {"t": 538.2833333333333, "x": "三日ずれて二回見られることにも、意味がありました。"}, {"t": 541.65, "x": "打ち上げは一九八四年十二月です。"}, {"t": 544.75, "x": "十五日に1号、二十一日に2号が飛び立ちました。"}, {"t": 548.7, "x": "バイコヌールから、プロトンロケットでの打ち上げです。"}, {"t": 551.9666666666667, "x": "一九八五年六月、二機は金星に着きました。"}, {"t": 556.1, "x": "十一日と十五日に、金星の大気に気球を送り込みました。"}, {"t": 560.5333333333333, "x": "金星の大気に気球が入ったのは、これが初めてです。"}, {"t": 564.25, "x": "ここまでが一つ目の仕事です。"}, {"t": 566.25, "x": "そのあと、金星の重力を使って進路を変えました。"}, {"t": 569.9166666666666, "x": "向かう先はハレー彗星です。"}, {"t": 571.8666666666667, "x": "これが二つ目の仕事です。"}, {"t": 573.6166666666667, "x": "ベガは金星を回り道にして彗星へ向かったのです。"}, {"t": 576.9833333333333, "x": "機体を動かしたのはソビエト連邦の機関です。"}, {"t": 579.9666666666667, "x": "観測の計画と機器には、九つの"}, {"t": 582.5833333333334, "x": "国の研究機関が加わっていました。"}, {"t": 584.9, "x": "日本からも二機が向かいました。"}, {"t": 586.9166666666666, "x": "一機目はさきがけです。"}, {"t": 588.4166666666666, "x": "名前のとおり先に出発した機体です。"}, {"t": 590.9833333333333, "x": "一九八五年一月、鹿児島県の"}, {"t": 594.3333333333334, "x": "内之浦から打ち上げられました。"}, {"t": 596.1333333333333, "x": "ロケットはM-3SIIの一号機です。"}, {"t": 598.7833333333333, "x": "目的の一つは、試験機を惑星のあいだの"}, {"t": 601.75, "x": "軌道に乗せることでした。"}, {"t": 603.2333333333333, "x": "日本の探査機としては初めての挑戦です。"}, {"t": 606.0833333333334, "x": "遠くと通信する技術も確かめます。"}, {"t": 608.55, "x": "機体の姿勢を決める技術もです。"}, {"t": 610.75, "x": "二機目はすいせいです。"}, {"t": 612.1833333333333, "x": "打ち上げは一九八五年八月です。"}, {"t": 615.1833333333333, "x": "同じ内之浦から、M-3SIIの二号機で飛び立ちました。"}, {"t": 619.3833333333333, "x": "すいせいの目は紫外線のカメラです。"}, {"t": 621.6833333333333, "x": "人の目には見えない光で撮ります。"}, {"t": 623.8833333333333, "x": "彗星のまわりの雲を紫外線で撮ります。"}, {"t": 626.55, "x": "そこから核の自転を調べます。"}, {"t": 628.6333333333333, "x": "水が出てくる量の変化も調べる計画でした。"}, {"t": 631.6166666666667, "x": "すいせいは打ち上げのあと、"}, {"t": 633.1833333333333, "x": "約四十日をかけて機器を確かめました。"}, {"t": 636.1666666666666, "x": "十一月十四日には、ハレー彗星へ"}, {"t": 638.9833333333333, "x": "向けて軌道を修正しています。"}, {"t": 640.8, "x": "アメリカの探査機アイスも、この観測に加わりました。"}, {"t": 644.5666666666667, "x": "日本の宇宙科学研究所の記録にも、その名前があります。"}, {"t": 648.7333333333333, "x": "すいせいは、ほかの機体と協力して観測しました。"}, {"t": 652.3, "x": "相手はベガとジオットとアイスです。"}, {"t": 654.4666666666667, "x": "これらの探査機はまとめて呼ばれました。"}, {"t": 656.8166666666667, "x": "ハレー艦隊です。"}, {"t": 658.0666666666667, "x": "ただし、核のすぐそばまで行く計画は一つだけです。"}, {"t": 661.7333333333333, "x": "数百キロメートルまで近づくジオットでした。"}, {"t": 664.5666666666667, "x": "ねらいは、核から六百キロメートルのところを"}, {"t": 667.5666666666667, "x": "通ることです。"}, {"t": 668.4666666666667, "x": "近づくほど核は大きく写ります。"}, {"t": 670.7166666666667, "x": "その代わり粒にぶつかる危険も増えます。"}, {"t": 673.1833333333333, "x": "六百キロメートルは、その二つのあいだで"}, {"t": 675.9166666666666, "x": "選ばれた距離でした。"}, {"t": 677.1166666666667, "x": "問題は雲の中のどこに核があるかです。"}, {"t": 679.7666666666667, "x": "ジオットを、正しい場所へ通さなければなりません。"}, {"t": 683.1333333333333, "x": "そのためには、核の位置をもっと正確に"}, {"t": 685.9166666666666, "x": "知る必要がありました。"}, {"t": 687.3166666666667, "x": "その役目を任されたのが、先に着くベガの二機でした。"}, {"t": 691.0, "x": "ジオットより一週間ほど早く、彗星のそばを通る予定です。"}, {"t": 695.3166666666667, "x": "一九八六年二月、ベガの二機は"}, {"t": 698.5166666666667, "x": "カメラの台の固定を外しました。"}, {"t": 700.55, "x": "ベガ1号は二月十四日、ベガ2号は二月十八日です。"}, {"t": 704.9166666666666, "x": "カメラは、木星と土星を撮って確かめられました。"}, {"t": 708.3333333333334, "x": "どちらのカメラも問題なく動いていました。"}, {"t": 711.0, "x": "彗星と出会う二日前。"}, {"t": 712.7, "x": "カメラがハレー彗星に向けられました。"}, {"t": 715.0333333333333, "x": "動かしたのは二時間だけです。"}, {"t": 716.95, "x": "そして一九八六年三月六日。"}, {"t": 719.9, "x": "世界時で七時二十分の数分前のことです。"}, {"t": 722.9333333333333, "x": "ベガ1号の画像に、ハレー彗星の核が写りました。"}, {"t": 726.7166666666667, "x": "雲の奥に隠れていた本体です。"}, {"t": 728.9, "x": "記録はこの瞬間をこう書いています。"}, {"t": 731.2666666666667, "x": "人類の歴史で初めて、ハレー彗星の"}, {"t": 734.1333333333333, "x": "核が人の目の前に姿を現した。"}, {"t": 736.4833333333333, "x": "研究者の多くは、モスクワの"}, {"t": 738.7, "x": "宇宙研究所に集まっていました。"}, {"t": 740.7333333333333, "x": "データはそこで、ほぼその場で受け取られました。"}, {"t": 743.75, "x": "電波を受けたのは二つの大きなアンテナです。"}, {"t": 746.4333333333333, "x": "一つはクリミアにある直径七十メートルのアンテナです。"}, {"t": 749.8833333333333, "x": "もう一つは、モスクワ近くの"}, {"t": 751.95, "x": "六十四メートルのアンテナでした。"}, {"t": 753.9333333333333, "x": "ベガ1号が最も近づいたのは、"}, {"t": 756.0333333333333, "x": "世界時の七時二十分六秒でした。"}, {"t": 758.8166666666667, "x": "核からの距離は八千八百九十キロメートル。"}, {"t": 761.85, "x": "地球の直径の七割ほどの距離です。"}, {"t": 764.3666666666667, "x": "すれちがう速さは、秒速七十九・二キロメートルでした。"}, {"t": 768.5, "x": "この速さでちりの粒が機体に当たりました。"}, {"t": 771.1833333333333, "x": "粒の速さは、秒速約八十キロメートルとされています。"}, {"t": 775.2, "x": "観測機器の一部と、むき出しの"}, {"t": 777.5333333333333, "x": "太陽電池の板が傷つきました。"}, {"t": 779.65, "x": "それでも観測は続きました。"}, {"t": 781.65, "x": "三日後の三月九日。"}, {"t": 783.3833333333333, "x": "世界時の七時二十分ちょうどに、"}, {"t": 785.5333333333333, "x": "ベガ2号が最も近づきました。"}, {"t": 787.9333333333333, "x": "核からの距離は八千三十キロメートル。"}, {"t": 790.55, "x": "速さは秒速七十六・八キロメートルでした。"}, {"t": 793.7833333333333, "x": "ベガ1号より、八百六十キロメートル近い位置です。"}, {"t": 797.6166666666667, "x": "二機のカメラは、同じ核を少し違う時刻に写しました。"}, {"t": 801.5333333333333, "x": "核はそのあいだも、ガスを噴きながら回っています。"}, {"t": 804.8666666666667, "x": "三日のずれは、核の変化を見る手がかりにもなりました。"}, {"t": 808.6, "x": "二機の観測は、同じ彗星の二つの記録になりました。"}, {"t": 812.55, "x": "あいだは三日です。"}, {"t": 813.8333333333334, "x": "日本のすいせいが最も近づいたのは、"}, {"t": 816.25, "x": "そのあいだの三月八日でした。"}, {"t": 818.4833333333333, "x": "距離は、核の太陽側から約十五万一千キロメートルです。"}, {"t": 822.75, "x": "地球と月のあいだの半分より近い距離です。"}, {"t": 825.6166666666667, "x": "ベガよりずっと遠い位置です。"}, {"t": 827.4166666666666, "x": "すいせいの役目は、核に近づくことではありません。"}, {"t": 830.8333333333334, "x": "彗星を包む大きな雲の全体を見ることでした。"}, {"t": 834.1, "x": "すいせいは紫外線で、彗星の雲を撮り続けました。"}, {"t": 837.8166666666667, "x": "彗星から出たイオンも記録しています。"}, {"t": 840.2333333333333, "x": "イオンが、太陽から吹く風にとらえられる様子です。"}, {"t": 843.7333333333333, "x": "さきがけが最も近づいたのは、三月十一日でした。"}, {"t": 847.6666666666666, "x": "さきがけが測ったのは、彗星のそばを流れる太陽風です。"}, {"t": 851.7666666666667, "x": "記録したのはその磁場です。"}, {"t": 853.5166666666667, "x": "電気を帯びたガスの動きと、"}, {"t": 855.2166666666667, "x": "その中に生まれる波も測りました。"}, {"t": 857.7833333333333, "x": "ここまでで、ハレー彗星のそばを通った機体は四機です。"}, {"t": 861.6666666666666, "x": "残るは、いちばん近くを通るジオットだけでした。"}, {"t": 865.0666666666667, "x": "そのジオットの進路を決めるのに、"}, {"t": 867.05, "x": "ベガの画像が使われます。"}, {"t": 869.0333333333333, "x": "ベガの二機にはもう一つの役目がありました。"}, {"t": 871.7166666666667, "x": "ジオットの道しるべです。"}, {"t": 873.3666666666667, "x": "道案内と言ってもよい役目です。"}, {"t": 875.55, "x": "ヨーロッパ宇宙機関は、ベガを"}, {"t": 877.7166666666667, "x": "先導役と位置づけていました。"}, {"t": 879.6, "x": "核の場所を突き止める役です。"}, {"t": 881.6, "x": "ベガが先に核の近くを通れば、核の位置が分かります。"}, {"t": 885.4833333333333, "x": "その位置を使って、あとから来るジオットの進路を直す。"}, {"t": 889.2833333333333, "x": "そういう段取りです。"}, {"t": 890.6666666666666, "x": "先に行く機体が、後の機体に場所を教えるのです。"}, {"t": 894.3, "x": "この取り組みには、三つの宇宙機関が加わりました。"}, {"t": 897.8833333333333, "x": "ソビエト連邦とヨーロッパとアメリカです。"}, {"t": 900.45, "x": "ただ、一枚の画像だけでは核の場所は決まりません。"}, {"t": 904.0666666666667, "x": "画像から分かるのは核の見えた方角です。"}, {"t": 906.8, "x": "距離までは分かりません。"}, {"t": 908.3, "x": "そこでもう一つの手がかりが要ります。"}, {"t": 910.5666666666667, "x": "しかも写した側のベガも動いています。"}, {"t": 913.0333333333333, "x": "その速さは秒速八十キロメートル近くです。"}, {"t": 916.1333333333333, "x": "手がかりは二つありました。"}, {"t": 917.8666666666667, "x": "一つ目はベガのカメラに写った核の向きです。"}, {"t": 920.6833333333333, "x": "画像の中で核がどこに写っているか。"}, {"t": 923.1, "x": "そこから、ベガから見た核の方角が分かります。"}, {"t": 926.3666666666667, "x": "二つ目はベガそのものの位置です。"}, {"t": 928.45, "x": "見ている側の位置がずれていたら、どうなるか。"}, {"t": 931.5, "x": "方角が分かっても、核の場所はずれてしまいます。"}, {"t": 934.9166666666666, "x": "そこで使われたのが、NASAの"}, {"t": 936.9666666666667, "x": "深宇宙通信網のアンテナでした。"}, {"t": 939.1666666666666, "x": "まず、地球上の離れた場所に二つのアンテナを用意します。"}, {"t": 943.2, "x": "その二つで同じ探査機の電波を受けます。"}, {"t": 945.9, "x": "電波が届く時刻には、ごくわずかな差が出ます。"}, {"t": 949.2, "x": "その差から、探査機の位置を細かく割り出すのです。"}, {"t": 952.6833333333333, "x": "この方法には強みがありました。"}, {"t": 954.8166666666667, "x": "計算に入れていない小さな力に、左右されにくいのです。"}, {"t": 958.7666666666667, "x": "ベガの軌道は、この方法で五十キロメートルの"}, {"t": 961.9666666666667, "x": "精度で決められました。"}, {"t": 963.3166666666667, "x": "ベガの位置と、ベガから見た核の方角。"}, {"t": 966.1666666666666, "x": "二つを組み合わせて、ジオットが"}, {"t": 968.4166666666666, "x": "着くときの核の場所が予測されました。"}, {"t": 970.7, "x": "ジオットの最後の進路の修正には、"}, {"t": 973.0, "x": "この予測が使われています。"}, {"t": 975.1, "x": "ソビエト連邦の探査機が写した画像。"}, {"t": 977.6666666666666, "x": "アメリカのアンテナが受けた電波。"}, {"t": 979.6333333333333, "x": "その二つで、ヨーロッパの探査機の進路が決まりました。"}, {"t": 983.2833333333333, "x": "ベガ2号の結果も、ベガ1号から"}, {"t": 985.7666666666667, "x": "出した見積もりとほぼ同じでした。"}, {"t": 987.6833333333333, "x": "二機の答えがそろったことで、予測は確かめられました。"}, {"t": 991.3166666666667, "x": "ねらうのは、核から六百キロメートルの一点です。"}, {"t": 994.7, "x": "そこを、秒速六十八キロメートルで通り抜けます。"}, {"t": 998.3666666666667, "x": "ジオットに残された準備は、それで整いました。"}, {"t": 1001.7333333333333, "x": "あとは盾がどこまで持ちこたえるかでした。"}, {"t": 1004.1833333333333, "x": "一九八六年三月十三日から十四日にかけての夜。"}, {"t": 1008.5, "x": "ヨーロッパ宇宙機関の管制室に、人が集まっていました。"}, {"t": 1012.4666666666667, "x": "研究者と運用の担当者と技術者です。"}, {"t": 1015.2666666666667, "x": "ジオットは秒速六十八キロメートルで、"}, {"t": 1017.85, "x": "核へ向かっていました。"}, {"t": 1019.5166666666667, "x": "時速にすると、約二十四万五千キロメートルです。"}, {"t": 1023.2333333333333, "x": "彗星とは、ほぼ正面からぶつかり合う向きです。"}, {"t": 1026.6166666666666, "x": "最初の粒がジオットに当たったのは、"}, {"t": 1028.7666666666667, "x": "最も近づく百二十二分前でした。"}, {"t": 1031.6166666666666, "x": "そこから粒の当たる回数が増えていきます。"}, {"t": 1034.25, "x": "この夜に記録された粒の衝突は、一万二千回にのぼります。"}, {"t": 1038.7166666666667, "x": "盾には細かな粒が次々と当たっていました。"}, {"t": 1041.6833333333334, "x": "そのたびに、機体の中の計器が衝突を数えていきます。"}, {"t": 1045.65, "x": "カメラは近づきながら核を撮り続けました。"}, {"t": 1048.3666666666666, "x": "画像は地球へ送られ続けました。"}, {"t": 1050.6333333333334, "x": "最後の画像は、核まで"}, {"t": 1052.5333333333333, "x": "千三百七十二キロメートルのところです。"}, {"t": 1055.2666666666667, "x": "そして最も近づく七・六秒前。"}, {"t": 1057.85, "x": "一つの粒が機体に当たりました。"}, {"t": 1059.9666666666667, "x": "重さは、〇・一グラムから一グラムほどと"}, {"t": 1063.0, "x": "見積もられています。"}, {"t": 1064.1166666666666, "x": "一グラムに満たないかもしれない粒です。"}, {"t": 1066.65, "x": "けれども速さが違います。"}, {"t": 1068.4166666666667, "x": "秒速六十八キロメートルなら、"}, {"t": 1070.5333333333333, "x": "機体を揺さぶるには十分でした。"}, {"t": 1072.9333333333334, "x": "ジオットは姿勢を乱されました。"}, {"t": 1074.9666666666667, "x": "地球との通信が一時とだえました。"}, {"t": 1077.3, "x": "機体は、通信がとぎれたまま核のそばを通りすぎます。"}, {"t": 1081.0833333333333, "x": "最も近づいたときの距離は、"}, {"t": 1082.9, "x": "五百九十六キロメートルでした。"}, {"t": 1085.3833333333334, "x": "ジオットの機体は、差し渡し約二メートルです。"}, {"t": 1088.65, "x": "その機体が、長さ十五キロメートルの"}, {"t": 1091.2666666666667, "x": "核の横を通りすぎました。"}, {"t": 1092.9666666666667, "x": "ベガよりも十倍以上近い距離です。"}, {"t": 1095.3166666666666, "x": "機体の噴射装置が働き、揺れはおさまっていきました。"}, {"t": 1099.15, "x": "通信が完全に戻ったのは、それから"}, {"t": 1101.8166666666666, "x": "三十二分かけてのことです。"}, {"t": 1103.6166666666666, "x": "最も近づいた瞬間のデータは、"}, {"t": 1105.7166666666667, "x": "とぎれとぎれにしか届いていません。"}, {"t": 1108.05, "x": "画像も、核のいちばん近くの姿は写っていません。"}, {"t": 1111.7, "x": "最も近い一枚でも、核から"}, {"t": 1114.05, "x": "千三百キロメートル以上離れていました。"}, {"t": 1116.6333333333334, "x": "ジオットは、遠ざかりながらもデータを送り続けました。"}, {"t": 1120.2666666666667, "x": "その時間は約二十四時間です。"}, {"t": 1122.4833333333333, "x": "丸一日です。"}, {"t": 1123.7166666666667, "x": "観測機器が切られたのは、三月十五日の世界時二時でした。"}, {"t": 1127.9666666666667, "x": "通信が乱れるまでに届いた画像は、二千百十二枚です。"}, {"t": 1132.1333333333334, "x": "一晩で二千枚を超えました。"}, {"t": 1134.15, "x": "のちに確かめられた機器の状態は、次のとおりでした。"}, {"t": 1137.8166666666666, "x": "完全に動く機器が三つ。"}, {"t": 1139.55, "x": "傷を負いながらも使える機器が四つ。"}, {"t": 1142.0, "x": "動かなくなった機器が三つ。"}, {"t": 1143.8, "x": "動かなくなった中に、カメラが入っていました。"}, {"t": 1146.95, "x": "ヨーロッパ宇宙機関は、この夜のことを"}, {"t": 1149.7, "x": "振り返る記事を出しています。"}, {"t": 1151.3833333333334, "x": "計画の副科学責任者だった人物も、そこで話しています。"}, {"t": 1155.6166666666666, "x": "ゲルハルト・シュベームです。"}, {"t": 1157.1166666666666, "x": "シュベームは、一生に一度の"}, {"t": 1159.1833333333334, "x": "出来事だったと振り返っています。"}, {"t": 1161.1666666666667, "x": "そして、いちばんよかったのは"}, {"t": 1163.2333333333333, "x": "画像だった、と語っています。"}, {"t": 1165.3666666666666, "x": "それを見た瞬間だったと。"}, {"t": 1167.1, "x": "秒速六十八キロメートルのちりは、"}, {"t": 1169.4666666666667, "x": "盾と観測機器を削っていました。"}, {"t": 1171.9, "x": "カメラはその一夜で役目を終えました。"}, {"t": 1174.3, "x": "けれども届いた画像は残りました。"}, {"t": 1176.5, "x": "そこに写っていたものを次に見ていきます。"}, {"t": 1179.0, "x": "ジオットの画像に写っていたのは、"}, {"t": 1180.9333333333334, "x": "細長い黒いかたまりでした。"}, {"t": 1183.0833333333333, "x": "ヨーロッパ宇宙機関は、その形を落花生にたとえています。"}, {"t": 1187.1833333333334, "x": "長さは約十五キロメートル。"}, {"t": 1189.1333333333334, "x": "幅は、七キロメートルから十キロメートルほどです。"}, {"t": 1192.5833333333333, "x": "球ではなく引きのばしたような形でした。"}, {"t": 1195.1833333333334, "x": "二つの丸みが、くびれでつながったような形です。"}, {"t": 1198.6333333333334, "x": "表面は石炭よりも黒いものでした。"}, {"t": 1201.0666666666666, "x": "予想よりずっと暗い表面でした。"}, {"t": 1203.2666666666667, "x": "当たった光のうち、はね返すのは約四パーセントだけです。"}, {"t": 1207.2166666666667, "x": "表面が厚いちりの層に覆われているためだと"}, {"t": 1210.0, "x": "考えられています。"}, {"t": 1211.2, "x": "ガスは、かたまり全体から出ていたのではありません。"}, {"t": 1214.5166666666667, "x": "活動していたのは表面の約一割だけです。"}, {"t": 1217.4833333333333, "x": "ほかの大部分は静かなままでした。"}, {"t": 1219.7166666666667, "x": "それまでは、表面全体からガスが"}, {"t": 1222.25, "x": "わき出すと考える見方もありました。"}, {"t": 1224.45, "x": "実際には、噴き出しは決まった場所に限られていました。"}, {"t": 1228.0833333333333, "x": "日の当たる暖かい側から、明るい噴き出しが"}, {"t": 1231.1333333333334, "x": "少なくとも三本見えました。"}, {"t": 1232.8666666666666, "x": "数えていくと、噴き出しは七つ見分けられました。"}, {"t": 1236.1333333333334, "x": "噴き出しは、まとめて大量の物質を吐き出していました。"}, {"t": 1239.8166666666666, "x": "一秒に約三トンです。"}, {"t": 1241.5166666666667, "x": "一分なら約百八十トンです。"}, {"t": 1243.6833333333334, "x": "一時間なら一万トンを超えます。"}, {"t": 1245.8666666666666, "x": "この噴き出しは、核の回り方も変えていました。"}, {"t": 1249.1166666666666, "x": "核は、ふらつくように回っていると考えられています。"}, {"t": 1252.65, "x": "そのふらつきは、とても長く続いているかもしれません。"}, {"t": 1256.2166666666667, "x": "何百年、何千年という長さです。"}, {"t": 1259.0833333333333, "x": "かたまりの密度も見積もられました。"}, {"t": 1261.2833333333333, "x": "一立方センチメートルあたり、〇・三グラムほどです。"}, {"t": 1265.15, "x": "水の約三分の一です。"}, {"t": 1266.9666666666667, "x": "同じ大きさの氷より、ずっと軽いことになります。"}, {"t": 1270.5333333333333, "x": "中はすきまが多く、ふわふわした"}, {"t": 1272.95, "x": "作りだと考えられています。"}, {"t": 1274.7, "x": "吐き出されたガスも調べられました。"}, {"t": 1276.85, "x": "約八割は水です。"}, {"t": 1278.4333333333334, "x": "彗星は水の氷を多く抱えた天体でした。"}, {"t": 1281.5, "x": "一酸化炭素が約一割、二酸化炭素が"}, {"t": 1284.5666666666666, "x": "約二・五パーセントでした。"}, {"t": 1286.3666666666666, "x": "メタンやアンモニアも含まれていました。"}, {"t": 1288.6666666666667, "x": "ほかに、わずかな炭化水素や"}, {"t": 1290.7833333333333, "x": "鉄やナトリウムも見つかっています。"}, {"t": 1292.8333333333333, "x": "ちりの粒の多くは、たばこの煙の粒ほどの細かさでした。"}, {"t": 1296.8666666666666, "x": "見つかった中で最も大きな粒は、四十ミリグラムです。"}, {"t": 1300.7666666666667, "x": "粒には二つの種類がありました。"}, {"t": 1302.8666666666666, "x": "一つは、炭素と水素と酸素と窒素が多い粒です。"}, {"t": 1306.5, "x": "もう一つは金属や岩の成分が多い粒です。"}, {"t": 1309.5666666666666, "x": "ナトリウムとマグネシウムとケイ素が含まれていました。"}, {"t": 1312.7166666666667, "x": "鉄とカルシウムもありました。"}, {"t": 1314.5, "x": "核の表面は、炭素を多く含む"}, {"t": 1317.0166666666667, "x": "有機物の層で覆われていました。"}, {"t": 1319.1333333333334, "x": "窒素をのぞく軽い元素の割合は、"}, {"t": 1321.3333333333333, "x": "太陽とほとんど同じでした。"}, {"t": 1323.45, "x": "そのため、この彗星は古い姿を"}, {"t": 1326.0666666666666, "x": "とどめた物質だとされています。"}, {"t": 1327.9666666666667, "x": "知られている中でも、最も古いものの一つです。"}, {"t": 1331.4166666666667, "x": "画像はその後も組み立て直されました。"}, {"t": 1333.95, "x": "スイスのベルン大学に、この画像を"}, {"t": 1336.45, "x": "調べた研究グループがあります。"}, {"t": 1338.4166666666667, "x": "その記録に、よく知られた核の"}, {"t": 1340.6166666666666, "x": "姿の作り方が書かれています。"}, {"t": 1342.65, "x": "六十八枚の画像を合わせたものです。"}, {"t": 1345.2, "x": "いちばん明るいところでは、"}, {"t": 1346.75, "x": "約五十メートルの細かさまで見分けられます。"}, {"t": 1349.9, "x": "彗星がはっきり写り始めたのは、ずっと手前からでした。"}, {"t": 1353.8, "x": "約十二万四千キロメートル手前です。"}, {"t": 1356.4166666666667, "x": "ヨーロッパ宇宙機関は、ジオットの"}, {"t": 1358.8333333333333, "x": "成果をこうまとめています。"}, {"t": 1360.45, "x": "彗星の核を初めて近くから写した探査機。"}, {"t": 1363.5166666666667, "x": "その画像は、彗星の核の形を初めて示しました。"}, {"t": 1367.4333333333334, "x": "彗星に有機物があることを示す、"}, {"t": 1369.7666666666667, "x": "最初の手がかりも見つけました。"}, {"t": 1372.0333333333333, "x": "ベガの画像とジオットの画像。"}, {"t": 1373.9666666666667, "x": "ハレー彗星の核の形は、この二つの記録から"}, {"t": 1377.3666666666666, "x": "知られています。"}, {"t": 1378.2666666666667, "x": "一九九二年七月十日。"}, {"t": 1380.8, "x": "ジオットは、二つ目の彗星とすれちがいます。"}, {"t": 1384.0166666666667, "x": "そこへ着くまでの道のりは、長い眠りから始まりました。"}, {"t": 1387.8833333333334, "x": "ハレー彗星を離れたジオットは、まだ動いていました。"}, {"t": 1391.5333333333333, "x": "役目はまだ残っていました。"}, {"t": 1393.35, "x": "カメラは失われましたが、ほかの機器の一部は使えます。"}, {"t": 1397.1666666666667, "x": "燃料も約六十キログラム残っていました。"}, {"t": 1400.0, "x": "一九八六年四月二日、ジオットは眠らされました。"}, {"t": 1404.3833333333334, "x": "機器を止めて、太陽のまわりを回り続ける状態です。"}, {"t": 1408.1833333333334, "x": "起こされたのは一九九〇年二月でした。"}, {"t": 1411.1, "x": "千四百十九日ぶりです。"}, {"t": 1413.2, "x": "四年近い眠りでした。"}, {"t": 1414.8166666666666, "x": "一週間のうちに、地上は機体の制御を取り戻しました。"}, {"t": 1418.7833333333333, "x": "一九九〇年七月二日。"}, {"t": 1421.2, "x": "ジオットは地球のそばを通りました。"}, {"t": 1423.4666666666667, "x": "雲の上、二万二千七百三十キロメートルのところです。"}, {"t": 1427.5333333333333, "x": "深い宇宙から探査機が戻ってきたのです。"}, {"t": 1430.1333333333334, "x": "そして地球の重力で進路を変えました。"}, {"t": 1432.75, "x": "こうした使い方はこれが初めてです。"}, {"t": 1435.0833333333333, "x": "行き先はもう一つの彗星でした。"}, {"t": 1437.2833333333333, "x": "グリッグ・シェレルップ彗星です。"}, {"t": 1439.25, "x": "候補は五つありました。"}, {"t": 1440.8666666666666, "x": "軌道がよく分かっていて、地球を"}, {"t": 1443.2166666666667, "x": "通ってから二年以内に行ける。"}, {"t": 1445.0, "x": "その条件でこの彗星が選ばれています。"}, {"t": 1447.7166666666667, "x": "一九九二年七月九日の夜、観測機器の"}, {"t": 1451.75, "x": "スイッチが入りました。"}, {"t": 1453.0666666666666, "x": "そして七月十日。"}, {"t": 1454.55, "x": "場所は、地球から約二億千五百万キロメートルです。"}, {"t": 1458.35, "x": "ジオットは、ついに二つ目の彗星の前に来ました。"}, {"t": 1461.7666666666667, "x": "最初にとらえたのは彗星のイオンでした。"}, {"t": 1464.3166666666666, "x": "核から四十四万キロメートルの地点です。"}, {"t": 1467.0666666666666, "x": "ちりの雲に入ったのは、核から"}, {"t": 1469.3, "x": "約一万七千キロメートルのところです。"}, {"t": 1471.8833333333334, "x": "核からの距離は、百キロメートルから"}, {"t": 1474.4, "x": "二百キロメートルです。"}, {"t": 1475.75, "x": "ハレー彗星のときより、さらに近い距離でした。"}, {"t": 1479.0166666666667, "x": "探査機が彗星のそばを通った中で、"}, {"t": 1481.3333333333333, "x": "それまでで最も近いものです。"}, {"t": 1483.6, "x": "ただ、すれちがう速さは秒速十四キロメートルでした。"}, {"t": 1487.35, "x": "ハレーのときの五分の一ほどです。"}, {"t": 1489.5166666666667, "x": "カメラは動かないままでした。"}, {"t": 1491.3166666666666, "x": "ハレー彗星の夜から六年がたっています。"}, {"t": 1493.9666666666667, "x": "この彗星の核の姿は写っていません。"}, {"t": 1496.6333333333334, "x": "使えた八つの観測で、ちりや磁場が測られました。"}, {"t": 1500.2333333333333, "x": "ちりの出る量は、ハレー彗星の約二百分の一でした。"}, {"t": 1504.1166666666666, "x": "大きな粒は三つしか見つかりませんでした。"}, {"t": 1506.7333333333333, "x": "いちばん大きくても約三十ミリグラムです。"}, {"t": 1509.5166666666667, "x": "機体の傷はごくわずかで済みました。"}, {"t": 1511.8166666666666, "x": "記録には説明のつかない点も残りました。"}, {"t": 1514.6, "x": "ちりの明るさには二つの山がありました。"}, {"t": 1517.1833333333334, "x": "二つ目の山は、最も近づいてから"}, {"t": 1519.8333333333333, "x": "一分あまりあとに来ています。"}, {"t": 1521.5333333333333, "x": "その理由はまだ分かっていません。"}, {"t": 1523.5166666666667, "x": "磁場は、ハレー彗星のときより少し強いものでした。"}, {"t": 1527.0833333333333, "x": "核が小さいため、ハレーのときのような"}, {"t": 1529.7166666666667, "x": "磁場のない空洞はできていませんでした。"}, {"t": 1532.0166666666667, "x": "二つの彗星に出会った探査機は、ジオットが初めてです。"}, {"t": 1535.8333333333333, "x": "ハレー彗星の夜を越えた機体の、二つ目の仕事でした。"}, {"t": 1539.7, "x": "一九九二年七月二十三日、ジオットは"}, {"t": 1543.5333333333333, "x": "最後に電源を切られました。"}, {"t": 1545.3, "x": "もう一度起こす予定はありませんでした。"}, {"t": 1547.6833333333334, "x": "機体はそのまま静かになりました。"}, {"t": 1549.8333333333333, "x": "ほかの機体も、同じころに役目を終えていきます。"}, {"t": 1553.2, "x": "ベガの二機は、出会いから数週間で運用を終えました。"}, {"t": 1556.8833333333334, "x": "機体の状態はまだよく、燃料もかなり残っていました。"}, {"t": 1560.7833333333333, "x": "カメラも、木星を撮って確かめると、"}, {"t": 1563.3833333333334, "x": "目立った衰えはありませんでした。"}, {"t": 1565.6833333333334, "x": "けれども、二度目の出会いに"}, {"t": 1567.5666666666666, "x": "向かう天体が見つかりませんでした。"}, {"t": 1569.6666666666667, "x": "行き先のないまま運用は終わりました。"}, {"t": 1572.0333333333333, "x": "すいせいは、その後も太陽風を測り続けました。"}, {"t": 1575.5666666666666, "x": "進路を直すための燃料が尽きたのは、"}, {"t": 1577.8666666666666, "x": "一九九一年二月二十二日です。"}, {"t": 1581.1833333333334, "x": "翌年の八月二十日に地球のそばを通り、運用を終えました。"}, {"t": 1585.5666666666666, "x": "さきがけは、一九九九年一月まで太陽風を測り続けました。"}, {"t": 1590.8, "x": "十四年にわたる観測でした。"}, {"t": 1592.7666666666667, "x": "日本の二機の中で最も長い運用です。"}, {"t": 1595.5666666666666, "x": "ハレー彗星の核を見た三機は、こうして"}, {"t": 1598.4, "x": "一機ずつ、声を出さなくなりました。"}, {"t": 1600.9166666666667, "x": "八十一枚の画像を重ねて、ようやく浮かんだ一つの点。"}, {"t": 1604.9333333333334, "x": "それが、二〇〇三年に写ったハレー彗星です。"}, {"t": 1608.2, "x": "そこに至るまで、ハレー彗星は"}, {"t": 1610.5333333333333, "x": "地上から追いかけられていました。"}, {"t": 1612.4166666666667, "x": "一九九四年には、チリの望遠鏡が"}, {"t": 1615.7, "x": "この彗星をとらえています。"}, {"t": 1617.3833333333334, "x": "ヨーロッパ南天天文台の望遠鏡です。"}, {"t": 1620.1833333333334, "x": "そのときの距離は、太陽から約十八・八天文単位です。"}, {"t": 1624.3833333333334, "x": "天文単位は、太陽と地球のあいだの"}, {"t": 1627.1, "x": "距離を一とする物差しです。"}, {"t": 1628.85, "x": "二〇〇三年三月。"}, {"t": 1630.3166666666666, "x": "同じ天文台の超大型望遠鏡が、"}, {"t": 1632.8666666666666, "x": "もう一度この彗星に向けられました。"}, {"t": 1635.45, "x": "使ったのは、直径八・二メートルの望遠鏡三台です。"}, {"t": 1639.4666666666667, "x": "三晩続けて撮った画像は合わせて八十一枚。"}, {"t": 1642.45, "x": "露出の時間は合計で九時間近くになります。"}, {"t": 1645.4666666666667, "x": "それを重ねて、ようやく点が浮かんだのです。"}, {"t": 1648.5, "x": "八十一枚を重ねて初めて見える暗さでした。"}, {"t": 1651.6333333333334, "x": "明るさは二十八・二等です。"}, {"t": 1653.7666666666667, "x": "目で見える最も暗い星の、十億分の一ほどの暗さです。"}, {"t": 1658.0, "x": "そのときの太陽からの距離は、"}, {"t": 1659.8333333333333, "x": "約四十二億キロメートルでした。"}, {"t": 1662.2833333333333, "x": "光の速さでも四時間近くかかります。"}, {"t": 1664.8333333333333, "x": "二十八・〇六天文単位で、海王星と"}, {"t": 1668.05, "x": "ほとんど同じくらい遠い位置です。"}, {"t": 1669.9666666666667, "x": "彗星の観測としては、それまでで最も遠いものでした。"}, {"t": 1673.9, "x": "それまでの記録は、太陽から二十天文単位の彗星です。"}, {"t": 1678.0666666666666, "x": "一九九七年に、ハワイのケック望遠鏡が観測していました。"}, {"t": 1682.9833333333333, "x": "暗さの記録も塗りかえられました。"}, {"t": 1685.1, "x": "それまでで最も暗かった彗星の観測は、二十六・五等です。"}, {"t": 1689.65, "x": "今回の点はその約五分の一の明るさでした。"}, {"t": 1692.75, "x": "写っていたのは尾も雲もない点でした。"}, {"t": 1695.1, "x": "核がむき出しのまま写っていたのです。"}, {"t": 1697.4333333333334, "x": "その明るさは、核だけがあると"}, {"t": 1699.6166666666666, "x": "考えたときの値とぴったり合っていました。"}, {"t": 1702.1666666666667, "x": "冷たい場所で、彗星の活動はすっかり止まっていたのです。"}, {"t": 1706.1666666666667, "x": "天文台の発表は、核の大きさを"}, {"t": 1708.8166666666666, "x": "約十キロメートルとしています。"}, {"t": 1710.6833333333334, "x": "表面がはね返す光は約四パーセントです。"}, {"t": 1713.6666666666667, "x": "この観測は、海王星より遠くの小さな天体を"}, {"t": 1717.2166666666667, "x": "探す調査の中で行われました。"}, {"t": 1719.3666666666666, "x": "ハレー彗星は、暗さがよく分かっている天体です。"}, {"t": 1722.8666666666666, "x": "そのため、画像の処理が正しいかを"}, {"t": 1725.3666666666666, "x": "確かめる目印に使われました。"}, {"t": 1727.4333333333334, "x": "ジオットが近くで見た黒いかたまりは、"}, {"t": 1729.6833333333334, "x": "その点の中にあります。"}, {"t": 1731.5, "x": "けれども点の中に形は写りません。"}, {"t": 1733.95, "x": "形を知る手がかりは点の明るさだけです。"}, {"t": 1736.6833333333334, "x": "落花生の形も七つの噴き出しも見えません。"}, {"t": 1739.5666666666666, "x": "四十二億キロメートル先では、一つの光の点です。"}, {"t": 1743.3666666666666, "x": "同じ発表は、この先 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
