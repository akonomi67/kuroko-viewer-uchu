<script>
const D={"name": "ep024", "file": "ep024", "dur": 1864.91665625, "segs": [], "subs": [{"t": 0.0, "x": "ハレー彗星の核を近くから見られたのは、"}, {"t": 2.5166666666666666, "x": "一九八六年三月の九日ほどのあいだだけです。"}, {"t": 6.633333333333334, "x": "いちばん近づいた探査機は、核から"}, {"t": 9.116666666666667, "x": "五百九十六キロメートルまで迫りました。"}, {"t": 11.766666666666667, "x": "そのカメラは、最も近づいた一夜で止まりました。"}, {"t": 15.216666666666667, "x": "その彗星の粒は、毎年十月、夜の空で流れ星になります。"}, {"t": 20.233333333333334, "x": "オリオン座の方角から飛んでくるように見えます。"}, {"t": 23.116666666666667, "x": "そのためオリオン座流星群と呼ばれています。"}, {"t": 25.9, "x": "暗い空なら一時間に十個から二十個ほどです。"}, {"t": 28.983333333333334, "x": "流れ星の正体は宇宙を漂う小さな粒です。"}, {"t": 32.28333333333333, "x": "粒は秒速六十六キロメートルで大気に飛び込みます。"}, {"t": 35.85, "x": "そして燃えて一瞬だけ光ります。"}, {"t": 37.95, "x": "ハレー彗星は、およそ七十六年ごとに、"}, {"t": 41.03333333333333, "x": "太陽のそばへ戻ってきます。"}, {"t": 43.13333333333333, "x": "五月にも流星群があります。"}, {"t": 45.13333333333333, "x": "みずがめ座エータ流星群です。"}, {"t": 47.166666666666664, "x": "こちらも同じ彗星の粒から生まれています。"}, {"t": 49.9, "x": "地球はハレー彗星の通り道を横切っています。"}, {"t": 53.0, "x": "それも一年に二回です。"}, {"t": 54.733333333333334, "x": "ただ、粒を落とした本体は、"}, {"t": 56.833333333333336, "x": "いま太陽からずっと遠くにいます。"}, {"t": 59.28333333333333, "x": "最後に太陽のそばへ来たのは、一九八六年でした。"}, {"t": 63.6, "x": "その年の三月、五機の探査機が"}, {"t": 66.15, "x": "次々とこの彗星に近づきました。"}, {"t": 68.46666666666667, "x": "日本の二機と、ソビエト連邦の"}, {"t": 70.88333333333334, "x": "二機と、ヨーロッパの一機です。"}, {"t": 73.05, "x": "彗星の中心には、核と呼ばれるかたまりがあります。"}, {"t": 76.68333333333334, "x": "氷とちりが固まったものです。"}, {"t": 78.75, "x": "太陽に近づくと氷がとけて、ガスとちりが噴き出します。"}, {"t": 82.68333333333334, "x": "それが核のまわりに広がります。"}, {"t": 84.76666666666667, "x": "そしてぼんやりした雲と長い尾になります。"}, {"t": 87.3, "x": "地上から見える彗星の姿は、ほとんどがこの雲と尾です。"}, {"t": 91.35, "x": "核そのものは見えません。"}, {"t": 92.93333333333334, "x": "その核を近くから写した画像は残っています。"}, {"t": 95.9, "x": "撮られたのは、一九八六年三月の九日ほどのあいだです。"}, {"t": 100.61666666666666, "x": "それより前に、核を近くで見た機体はありません。"}, {"t": 104.03333333333333, "x": "それより後にもありません。"}, {"t": 105.73333333333333, "x": "いちばん近づいたのは、ヨーロッパの探査機"}, {"t": 108.53333333333333, "x": "ジオットでした。"}, {"t": 109.41666666666667, "x": "核からの距離は五百九十六キロメートル。"}, {"t": 112.18333333333334, "x": "最も近づく七・六秒前に、機体に"}, {"t": 115.26666666666667, "x": "一つの粒がぶつかりました。"}, {"t": 116.96666666666667, "x": "機体は揺さぶられ、地球との通信がとだえました。"}, {"t": 120.45, "x": "これはその九日間とその後の記録です。"}, {"t": 123.1, "x": "ハレー彗星という名前は、一人の天文学者からきています。"}, {"t": 127.16666666666667, "x": "イギリスのエドモンド・ハレーです。"}, {"t": 129.05, "x": "一七〇五年、ハレーはいくつもの"}, {"t": 131.61666666666667, "x": "彗星の軌道を計算しました。"}, {"t": 133.6, "x": "その中で三つの明るい彗星に目をとめます。"}, {"t": 136.5, "x": "一五三一年と一六〇七年、そして"}, {"t": 140.0, "x": "一六八二年に現れた彗星です。"}, {"t": 142.83333333333334, "x": "ハレーは、この三つが同じ一つの彗星だと考えました。"}, {"t": 146.78333333333333, "x": "そして、次は一七五八年に戻ってくると予言しました。"}, {"t": 151.26666666666668, "x": "彗星は予言どおりに戻ってきました。"}, {"t": 153.73333333333332, "x": "計算が正しかったのです。"}, {"t": 155.5, "x": "彗星の帰りを前もって言い当てたのは、"}, {"t": 157.93333333333334, "x": "これが初めてでした。"}, {"t": 159.58333333333334, "x": "そのため、この彗星にはハレーの名前がつけられています。"}, {"t": 163.45, "x": "ただ、ハレー自身は一七四二年に亡くなっています。"}, {"t": 167.46666666666667, "x": "予言した年より十六年前のことです。"}, {"t": 170.08333333333334, "x": "自分の計算が当たった空を、ハレーは見ていません。"}, {"t": 173.5, "x": "彗星の名前は、予言した人の名前として残りました。"}, {"t": 177.31666666666666, "x": "それまで彗星は、いつ現れるか分からないものでした。"}, {"t": 181.05, "x": "ハレーの計算で、彗星は戻ってくる"}, {"t": 183.73333333333332, "x": "天体の一つになりました。"}, {"t": 185.38333333333333, "x": "その後の研究で、この彗星の記録は"}, {"t": 188.23333333333332, "x": "さらに昔までたどられました。"}, {"t": 190.06666666666666, "x": "さかのぼれるのは二千年以上前の観測です。"}, {"t": 193.15, "x": "一〇六六年の記録もあります。"}, {"t": 195.46666666666667, "x": "イングランドでの戦いを描いた、刺しゅうの布です。"}, {"t": 198.91666666666666, "x": "描かれたのはヘイスティングズの戦いです。"}, {"t": 201.45, "x": "この布は、バイユーのタペストリーと呼ばれています。"}, {"t": 204.75, "x": "その中にハレー彗星が縫い込まれています。"}, {"t": 207.45, "x": "地球にいちばん近づいたのは、"}, {"t": 209.23333333333332, "x": "八三七年の四月十日とされています。"}, {"t": 212.56666666666666, "x": "距離は、太陽と地球のあいだの〇・〇三三倍です。"}, {"t": 216.41666666666666, "x": "キロメートルに直すと、約五百万キロメートルになります。"}, {"t": 220.36666666666667, "x": "そのときの明るさも見積もられています。"}, {"t": 222.78333333333333, "x": "マイナス三・五等ほどです。"}, {"t": 224.7, "x": "一周にかかる年数は、いつも同じではありません。"}, {"t": 228.13333333333333, "x": "平均すると七十六年です。"}, {"t": 230.25, "x": "人の一生ほどの長さです。"}, {"t": 232.11666666666667, "x": "短いときは七十四・四二年でした。"}, {"t": 234.91666666666666, "x": "一八三五年から一九一〇年までの一周です。"}, {"t": 238.8, "x": "長いときは七十九・二五年。"}, {"t": 241.21666666666667, "x": "四五一年から五三〇年までの一周です。"}, {"t": 244.85, "x": "軌道は、地球の軌道に対して十八度傾いています。"}, {"t": 248.68333333333334, "x": "そして、惑星とは逆の向きに太陽を回っています。"}, {"t": 252.43333333333334, "x": "地球とも逆向きです。"}, {"t": 254.01666666666668, "x": "この逆向きの動きが、のちに"}, {"t": 256.15, "x": "探査機を苦しめることになります。"}, {"t": 258.21666666666664, "x": "探査機は地球と同じ向きに進みます。"}, {"t": 260.78333333333336, "x": "そのため彗星とは、正面からすれちがう形になります。"}, {"t": 264.71666666666664, "x": "すれちがう速さはとても大きくなります。"}, {"t": 267.18333333333334, "x": "秒速にして、七十キロメートル前後から"}, {"t": 270.1666666666667, "x": "八十キロメートル近くです。"}, {"t": 271.96666666666664, "x": "太陽への前回の最接近は、一九八六年二月九日でした。"}, {"t": 277.23333333333335, "x": "太陽からの距離は、太陽と地球の距離の約〇・五九倍です。"}, {"t": 281.85, "x": "このとき、地上からの眺めは"}, {"t": 284.03333333333336, "x": "派手なものではありませんでした。"}, {"t": 285.81666666666666, "x": "NASAがそのときの明るさを書いています。"}, {"t": 288.25, "x": "地球に近づいたときでも、北極星より"}, {"t": 291.1, "x": "少し明るい程度でした。"}, {"t": 292.65, "x": "しかもその光は点ではありません。"}, {"t": 294.8, "x": "星よりずっと広い範囲に、ぼんやり広がっていました。"}, {"t": 298.3833333333333, "x": "地上から見えるのは、核を包むガスとちりの雲です。"}, {"t": 302.05, "x": "雲の中の核は、地上の望遠鏡では見分けられません。"}, {"t": 305.9166666666667, "x": "核の姿を見るには、そばまで行くしかありませんでした。"}, {"t": 309.65, "x": "ヨーロッパの国々が共同で運営する、ヨーロッパ宇宙機関。"}, {"t": 313.8666666666667, "x": "ここで、ハレー彗星へ向かう計画が認められました。"}, {"t": 317.53333333333336, "x": "一九八〇年のことです。"}, {"t": 319.71666666666664, "x": "もともとはアメリカとの共同の計画でした。"}, {"t": 322.45, "x": "ところが途中でアメリカが抜けました。"}, {"t": 324.7, "x": "それでも計画は続きました。"}, {"t": 326.7, "x": "ヨーロッパは、自分たちの一機で行くことになります。"}, {"t": 330.1, "x": "ヨーロッパにとって、初めての計画になりました。"}, {"t": 333.46666666666664, "x": "遠い宇宙へ向かう探査機です。"}, {"t": 335.46666666666664, "x": "認められてから、機体は急いで組み立てられました。"}, {"t": 338.8666666666667, "x": "彗星が戻ってくる日は、待ってくれないからです。"}, {"t": 342.1666666666667, "x": "ハレー彗星を見逃せば、次の機会は"}, {"t": 344.9166666666667, "x": "七十五年ほど先になります。"}, {"t": 346.8833333333333, "x": "ヨーロッパ宇宙機関の解説も同じです。"}, {"t": 349.51666666666665, "x": "打ち上げの計画も変わりました。"}, {"t": 351.6, "x": "はじめは、大きなアリアン3型に載せる予定でした。"}, {"t": 355.1, "x": "別の衛星と一緒の打ち上げです。"}, {"t": 357.3333333333333, "x": "最後は、一機だけでアリアン1型に載ることになります。"}, {"t": 361.1166666666667, "x": "機体の名前はジオット。"}, {"t": 362.73333333333335, "x": "少し変わった名前です。"}, {"t": 364.3, "x": "イタリアの画家、ジョット・"}, {"t": 365.98333333333335, "x": "ディ・ボンドーネからとられました。"}, {"t": 367.6666666666667, "x": "ジョットは、一三〇一年にハレー彗星を"}, {"t": 370.65, "x": "見たとされています。"}, {"t": 371.78333333333336, "x": "そして一つの絵を描きました。"}, {"t": 373.76666666666665, "x": "場所は、イタリアのパドバにある礼拝堂の壁です。"}, {"t": 377.1666666666667, "x": "東方の三人の博士が、生まれたばかりの"}, {"t": 380.06666666666666, "x": "イエスを訪ねる場面です。"}, {"t": 381.65, "x": "その絵の空には、ベツレヘムの星が描かれています。"}, {"t": 385.23333333333335, "x": "ジョットは、その星をハレー彗星の"}, {"t": 387.6333333333333, "x": "姿で描いたとされています。"}, {"t": 389.4, "x": "それから六百八十年あまり。"}, {"t": 391.53333333333336, "x": "その画家の名前を背負って、"}, {"t": 393.25, "x": "ヨーロッパの一機が同じ彗星へ向かいます。"}, {"t": 396.3, "x": "機体の重さは九百六十キログラム。"}, {"t": 398.8833333333333, "x": "軽自動車ほどの重さです。"}, {"t": 400.7, "x": "差し渡し約二メートル、高さ"}, {"t": 402.98333333333335, "x": "約一メートルの太い筒の形です。"}, {"t": 405.3333333333333, "x": "上には、直径一・五メートルのアンテナが載っています。"}, {"t": 408.98333333333335, "x": "機体はこまのように回りながら進みます。"}, {"t": 411.6, "x": "一分間に十五回の速さです。"}, {"t": 413.8, "x": "いちばんの工夫は前に取り付けた盾でした。"}, {"t": 416.46666666666664, "x": "彗星のまわりには、細かな粒が飛び交っています。"}, {"t": 419.9166666666667, "x": "すれちがう速さは、秒速六十八キロメートルです。"}, {"t": 423.65, "x": "この速さなら小さな粒でも強くぶつかります。"}, {"t": 426.65, "x": "一秒で六十八キロメートル進む速さです。"}, {"t": 429.68333333333334, "x": "銃の弾の数十倍にあたります。"}, {"t": 431.9166666666667, "x": "そこで二枚の板を重ねた盾が作られました。"}, {"t": 434.8333333333333, "x": "一枚目は、厚さ一ミリメートルのアルミニウムの板です。"}, {"t": 438.7, "x": "二枚目は、厚さ十二ミリメートルのケブラーの板です。"}, {"t": 442.3333333333333, "x": "ケブラーはとても丈夫な人工の繊維です。"}, {"t": 444.98333333333335, "x": "二枚のあいだは、二十三センチメートル空けてあります。"}, {"t": 448.6166666666667, "x": "粒を一枚目で受けて二枚目で止める作りです。"}, {"t": 451.6, "x": "盾の役目は一つです。"}, {"t": 453.26666666666665, "x": "高速の粒から機体を守ることでした。"}, {"t": 455.81666666666666, "x": "電気は太陽電池でまかないます。"}, {"t": 458.01666666666665, "x": "彗星に出会うときの電力は、百九十ワットでした。"}, {"t": 461.75, "x": "ほかに、銀とカドミウムを使った電池を四つ積んでいます。"}, {"t": 465.65, "x": "観測機器は十一種類です。"}, {"t": 467.65, "x": "磁場を測る機器があります。"}, {"t": 469.35, "x": "ガスや粒の中身を調べる機器もあります。"}, {"t": 472.0, "x": "粒がぶつかるのを数える機器も積まれました。"}, {"t": 474.7, "x": "その中の一つが、核を色ごとに撮るカメラでした。"}, {"t": 478.23333333333335, "x": "この記録の主役になるカメラです。"}, {"t": 480.43333333333334, "x": "一九八五年七月二日、世界時の十一時二十三分。"}, {"t": 485.3, "x": "ジオットは、アリアン1型ロケットの"}, {"t": 487.78333333333336, "x": "十四号機で打ち上げられました。"}, {"t": 489.76666666666665, "x": "彗星に着くまで八か月あまりの旅です。"}, {"t": 492.51666666666665, "x": "ただ、ジオットだけでは足りないものがありました。"}, {"t": 495.5833333333333, "x": "核のそばへ確実にたどり着ける保証です。"}, {"t": 498.31666666666666, "x": "核がどこにあるのかを、前もって"}, {"t": 500.55, "x": "細かく知る必要があったのです。"}, {"t": 502.53333333333336, "x": "ハレー彗星に向かったのは、ジオットだけではありません。"}, {"t": 506.06666666666666, "x": "まずソビエト連邦のベガ1号と2号です。"}, {"t": 508.9, "x": "二機で一組です。"}, {"t": 510.21666666666664, "x": "ベガという名前にも意味があります。"}, {"t": 512.2833333333333, "x": "二つのロシア語を縮めたものです。"}, {"t": 514.5166666666667, "x": "金星を表すベネラと、ハレーを表すガレイです。"}, {"t": 518.15, "x": "名前のとおり、一機で二つの仕事をこなす探査機でした。"}, {"t": 522.0, "x": "金星に着陸機と気球を届けてから、"}, {"t": 524.4666666666667, "x": "ハレー彗星へ向かうのです。"}, {"t": 526.55, "x": "二機は同じ作りです。"}, {"t": 528.1, "x": "一機がうまくいかなくても、もう一機があります。"}, {"t": 531.1333333333333, "x": "両方が成功すれば観測の量は二倍になります。"}, {"t": 534.45, "x": "彗星はいつ、どれだけガスを噴くか分かりません。"}, {"t": 537.8666666666667, "x": "三日ずれて二回見られることにも、意味がありました。"}, {"t": 541.2333333333333, "x": "打ち上げは一九八四年十二月です。"}, {"t": 544.3333333333334, "x": "十五日に1号、二十一日に2号が飛び立ちました。"}, {"t": 548.2833333333333, "x": "バイコヌールから、プロトンロケットでの打ち上げです。"}, {"t": 551.55, "x": "一九八五年六月、二機は金星に着きました。"}, {"t": 555.6833333333333, "x": "十一日と十五日に、金星の大気に気球を送り込みました。"}, {"t": 560.1166666666667, "x": "ほかの惑星の空に気球が浮かんだのは、これが初めてです。"}, {"t": 564.1333333333333, "x": "ここまでが一つ目の仕事です。"}, {"t": 566.1333333333333, "x": "そのあと、金星の重力を使って進路を変えました。"}, {"t": 569.8, "x": "向かう先はハレー彗星です。"}, {"t": 571.75, "x": "これが二つ目の仕事です。"}, {"t": 573.5, "x": "ベガは金星を回り道にして彗星へ向かったのです。"}, {"t": 576.8666666666667, "x": "機体を動かしたのはソビエト連邦の機関です。"}, {"t": 579.85, "x": "観測の計画と機器には、九つの"}, {"t": 582.4666666666667, "x": "国の研究機関が加わっていました。"}, {"t": 584.7833333333333, "x": "日本からも二機が向かいました。"}, {"t": 586.8, "x": "一機目はさきがけです。"}, {"t": 588.3, "x": "名前のとおり先に出発した機体です。"}, {"t": 590.8666666666667, "x": "一九八五年一月、鹿児島県の"}, {"t": 594.2166666666667, "x": "内之浦から打ち上げられました。"}, {"t": 596.0166666666667, "x": "ロケットはM-3SIIの一号機です。"}, {"t": 598.6666666666666, "x": "目的の一つは、試験機を惑星のあいだの"}, {"t": 601.6333333333333, "x": "軌道に乗せることでした。"}, {"t": 603.1166666666667, "x": "日本の探査機としては初めての挑戦です。"}, {"t": 605.9666666666667, "x": "遠くと通信する技術も確かめます。"}, {"t": 608.4333333333333, "x": "機体の姿勢を決める技術もです。"}, {"t": 610.6333333333333, "x": "二機目はすいせいです。"}, {"t": 612.0666666666667, "x": "七か月後の、一九八五年八月です。"}, {"t": 615.8, "x": "同じ内之浦から、M-3SIIの二号機で飛び立ちました。"}, {"t": 620.0, "x": "すいせいの目は紫外線のカメラです。"}, {"t": 622.3, "x": "人の目には見えない光で撮ります。"}, {"t": 624.5, "x": "彗星のまわりの雲を紫外線で撮ります。"}, {"t": 627.1666666666666, "x": "そこから核の自転を調べます。"}, {"t": 629.25, "x": "水が出てくる量の変化も調べる計画でした。"}, {"t": 632.2333333333333, "x": "すいせいは打ち上げのあと、"}, {"t": 633.8, "x": "約四十日をかけて機器を確かめました。"}, {"t": 636.7833333333333, "x": "十一月十四日には、ハレー彗星へ"}, {"t": 639.6, "x": "向けて軌道を修正しています。"}, {"t": 641.4166666666666, "x": "アメリカの探査機アイスも、この観測に加わりました。"}, {"t": 645.1833333333333, "x": "日本の宇宙科学研究所の記録にも、その名前があります。"}, {"t": 649.35, "x": "すいせいは、ほかの機体と協力して観測しました。"}, {"t": 652.9166666666666, "x": "相手はベガとジオットとアイスです。"}, {"t": 655.0833333333334, "x": "これらの探査機はまとめて呼ばれました。"}, {"t": 657.4333333333333, "x": "ハレー艦隊です。"}, {"t": 658.6833333333333, "x": "ただし、核のすぐそばまで行く計画は一つだけです。"}, {"t": 662.35, "x": "数百キロメートルまで近づくジオットでした。"}, {"t": 665.1833333333333, "x": "ねらいは、核から六百キロメートルのところを"}, {"t": 668.1833333333333, "x": "通ることです。"}, {"t": 669.0833333333334, "x": "近づくほど核は大きく写ります。"}, {"t": 671.3333333333334, "x": "その代わり粒にぶつかる危険も増えます。"}, {"t": 673.8, "x": "六百キロメートルは、その二つのあいだで"}, {"t": 676.5333333333333, "x": "選ばれた距離でした。"}, {"t": 677.7333333333333, "x": "問題は雲の中のどこに核があるかです。"}, {"t": 680.3833333333333, "x": "ジオットを、正しい場所へ通さなければなりません。"}, {"t": 683.75, "x": "そのためには、核の位置をもっと正確に"}, {"t": 686.5333333333333, "x": "知る必要がありました。"}, {"t": 687.9333333333333, "x": "その役目を任されたのが、先に着くベガの二機でした。"}, {"t": 691.6166666666667, "x": "ジオットより一週間ほど早く、彗星のそばを通る予定です。"}, {"t": 695.9333333333333, "x": "一九八六年二月、ベガの二機は"}, {"t": 699.1333333333333, "x": "カメラの台の固定を外しました。"}, {"t": 701.1666666666666, "x": "ベガ1号は二月十四日、ベガ2号は二月十八日です。"}, {"t": 705.5333333333333, "x": "カメラは、木星と土星を撮って確かめられました。"}, {"t": 708.95, "x": "どちらのカメラも問題なく動いていました。"}, {"t": 711.6166666666667, "x": "彗星と出会う二日前。"}, {"t": 713.3166666666667, "x": "カメラがハレー彗星に向けられました。"}, {"t": 715.65, "x": "動かしたのは二時間だけです。"}, {"t": 717.5666666666667, "x": "そして一九八六年三月六日。"}, {"t": 720.5166666666667, "x": "世界時で七時二十分の数分前のことです。"}, {"t": 723.55, "x": "ベガ1号の画像に、ハレー彗星の核が写りました。"}, {"t": 727.3333333333334, "x": "雲の奥に隠れていた本体です。"}, {"t": 729.5166666666667, "x": "記録はこの瞬間をこう書いています。"}, {"t": 731.8833333333333, "x": "人類の歴史で初めて、ハレー彗星の"}, {"t": 734.75, "x": "核が人の目の前に姿を現した。"}, {"t": 737.1, "x": "研究者の多くは、モスクワの"}, {"t": 739.3166666666667, "x": "宇宙研究所に集まっていました。"}, {"t": 741.35, "x": "データはそこで、ほぼその場で受け取られました。"}, {"t": 744.3666666666667, "x": "電波を受けたのは二つの大きなアンテナです。"}, {"t": 747.05, "x": "一つはクリミアにある直径七十メートルのアンテナです。"}, {"t": 750.5, "x": "もう一つは、モスクワ近くの"}, {"t": 752.5666666666667, "x": "六十四メートルのアンテナでした。"}, {"t": 754.55, "x": "ベガ1号が最も近づいたのは、"}, {"t": 756.65, "x": "世界時の七時二十分六秒でした。"}, {"t": 759.4333333333333, "x": "ベガ1号と核のあいだは、"}, {"t": 761.0833333333334, "x": "八千八百九十キロメートルありました。"}, {"t": 764.05, "x": "地球の直径の七割ほどの距離です。"}, {"t": 766.5666666666667, "x": "秒速七十九・二キロメートルで、核の横を駆け抜けました。"}, {"t": 770.9166666666666, "x": "この速さで、ちりの粒がぶつかりました。"}, {"t": 773.7833333333333, "x": "粒の速さは、秒速約八十キロメートルとされています。"}, {"t": 777.8, "x": "観測機器の一部と、むき出しの"}, {"t": 780.1333333333333, "x": "太陽電池の板が傷つきました。"}, {"t": 782.25, "x": "それでも観測は続きました。"}, {"t": 784.25, "x": "三日後の三月九日。"}, {"t": 785.9833333333333, "x": "世界時の七時二十分ちょうどに、"}, {"t": 788.1333333333333, "x": "ベガ2号が最も近づきました。"}, {"t": 790.5333333333333, "x": "核までは八千三十キロメートルでした。"}, {"t": 793.1666666666666, "x": "速さは秒速七十六・八キロメートルでした。"}, {"t": 796.4, "x": "ベガ1号より、八百六十キロメートル近い位置です。"}, {"t": 800.2333333333333, "x": "二機のカメラは、同じ核を少し違う時刻に写しました。"}, {"t": 804.15, "x": "核はそのあいだも、ガスを噴きながら回っています。"}, {"t": 807.4833333333333, "x": "三日のずれは、核の変化を見る手がかりにもなりました。"}, {"t": 811.2166666666667, "x": "二機の観測は、同じ彗星の二つの記録になりました。"}, {"t": 815.1666666666666, "x": "あいだは三日です。"}, {"t": 816.45, "x": "日本のすいせいが最も近づいたのは、"}, {"t": 818.8666666666667, "x": "そのあいだの三月八日でした。"}, {"t": 821.1, "x": "距離は、核の太陽側から約十五万一千キロメートルです。"}, {"t": 825.3666666666667, "x": "地球と月のあいだの半分より近い距離です。"}, {"t": 828.2333333333333, "x": "ベガよりずっと遠い位置です。"}, {"t": 830.0333333333333, "x": "すいせいの役目は、核に近づくことではありません。"}, {"t": 833.45, "x": "彗星を包む大きな雲の全体を見ることでした。"}, {"t": 836.7166666666667, "x": "すいせいは紫外線で、彗星の雲を撮り続けました。"}, {"t": 840.4333333333333, "x": "彗星から出たイオンも記録しています。"}, {"t": 842.85, "x": "イオンが、太陽から吹く風にとらえられる様子です。"}, {"t": 846.35, "x": "さきがけが最も近づいたのは、三月十一日でした。"}, {"t": 850.2833333333333, "x": "さきがけが測ったのは、彗星のそばを流れる太陽風です。"}, {"t": 854.3833333333333, "x": "記録したのはその磁場です。"}, {"t": 856.1333333333333, "x": "電気を帯びたガスの動きと、"}, {"t": 857.8333333333334, "x": "その中に生まれる波も測りました。"}, {"t": 860.4, "x": "ここまでで、ハレー彗星のそばを通った機体は四機です。"}, {"t": 864.2833333333333, "x": "残るは、いちばん近くを通るジオットだけでした。"}, {"t": 867.6833333333333, "x": "そのジオットの進路を決めるのに、"}, {"t": 869.6666666666666, "x": "ベガの画像が使われます。"}, {"t": 871.65, "x": "ベガの二機にはもう一つの役目がありました。"}, {"t": 874.3333333333334, "x": "ジオットの道しるべです。"}, {"t": 875.9833333333333, "x": "道案内と言ってもよい役目です。"}, {"t": 878.1666666666666, "x": "ヨーロッパ宇宙機関は、ベガを"}, {"t": 880.3333333333334, "x": "先導役と位置づけていました。"}, {"t": 882.2166666666667, "x": "核の場所を突き止める役です。"}, {"t": 884.2166666666667, "x": "ベガが先に核の近くを通れば、核の位置が分かります。"}, {"t": 888.1, "x": "その位置を使って、あとから来るジオットの進路を直す。"}, {"t": 891.9, "x": "そういう段取りです。"}, {"t": 893.2833333333333, "x": "先に行く機体が、後の機体に場所を教えるのです。"}, {"t": 896.9166666666666, "x": "この取り組みには、三つの宇宙機関が加わりました。"}, {"t": 900.5, "x": "ソビエト連邦とヨーロッパとアメリカです。"}, {"t": 903.0666666666667, "x": "ただ、一枚の画像だけでは核の場所は決まりません。"}, {"t": 906.6833333333333, "x": "画像から分かるのは核の見えた方角です。"}, {"t": 909.4166666666666, "x": "距離までは分かりません。"}, {"t": 910.9166666666666, "x": "そこでもう一つの手がかりが要ります。"}, {"t": 913.1833333333333, "x": "しかも写した側のベガも動いています。"}, {"t": 915.65, "x": "その速さは秒速八十キロメートル近くです。"}, {"t": 918.75, "x": "手がかりは二つありました。"}, {"t": 920.4833333333333, "x": "一つ目はベガのカメラに写った核の向きです。"}, {"t": 923.3, "x": "画像の中で核がどこに写っているか。"}, {"t": 925.7166666666667, "x": "そこから、ベガから見た核の方角が分かります。"}, {"t": 928.9833333333333, "x": "二つ目はベガそのものの位置です。"}, {"t": 931.0666666666667, "x": "見ている側の位置がずれていたら、どうなるか。"}, {"t": 934.1166666666667, "x": "方角が分かっても、核の場所はずれてしまいます。"}, {"t": 937.5333333333333, "x": "そこで使われたのが、NASAの"}, {"t": 939.5833333333334, "x": "深宇宙通信網のアンテナでした。"}, {"t": 941.7833333333333, "x": "まず、地球上の離れた場所に二つのアンテナを用意します。"}, {"t": 945.8166666666667, "x": "その二つで同じ探査機の電波を受けます。"}, {"t": 948.5166666666667, "x": "電波が届く時刻には、ごくわずかな差が出ます。"}, {"t": 951.8166666666667, "x": "その差から、探査機の位置を細かく割り出すのです。"}, {"t": 955.3, "x": "この方法には強みがありました。"}, {"t": 957.4333333333333, "x": "計算に入れていない小さな力に、左右されにくいのです。"}, {"t": 961.3833333333333, "x": "ベガの軌道は、この方法で五十キロメートルの"}, {"t": 964.5833333333334, "x": "精度で決められました。"}, {"t": 965.9333333333333, "x": "ベガの位置と、ベガから見た核の方角。"}, {"t": 968.7833333333333, "x": "二つを組み合わせて、ジオットが"}, {"t": 971.0333333333333, "x": "着くときの核の場所が予測されました。"}, {"t": 973.3166666666667, "x": "ジオットの最後の進路の修正には、"}, {"t": 975.6166666666667, "x": "この予測が使われています。"}, {"t": 977.7166666666667, "x": "ソビエト連邦の探査機が写した画像。"}, {"t": 980.2833333333333, "x": "アメリカのアンテナが受けた電波。"}, {"t": 982.25, "x": "その二つで、ヨーロッパの探査機の進路が決まりました。"}, {"t": 985.9, "x": "ベガ2号の結果も、ベガ1号から"}, {"t": 988.3833333333333, "x": "出した見積もりとほぼ同じでした。"}, {"t": 990.3, "x": "二機の答えがそろったことで、予測は確かめられました。"}, {"t": 993.9333333333333, "x": "ねらうのは、核から六百キロメートルの一点です。"}, {"t": 997.3166666666667, "x": "そこを、秒速六十八キロメートルで通り抜けます。"}, {"t": 1000.9833333333333, "x": "ジオットに残された準備は、それで整いました。"}, {"t": 1004.35, "x": "あとは盾がどこまで持ちこたえるかでした。"}, {"t": 1006.8, "x": "一九八六年三月十三日から十四日にかけての夜。"}, {"t": 1011.1166666666667, "x": "ヨーロッパ宇宙機関の管制室に、人が集まっていました。"}, {"t": 1015.0833333333334, "x": "研究者と運用の担当者と技術者です。"}, {"t": 1017.8833333333333, "x": "ジオットは秒速六十八キロメートルで、"}, {"t": 1020.4666666666667, "x": "核へ向かっていました。"}, {"t": 1022.1333333333333, "x": "時速にすると、約二十四万五千キロメートルです。"}, {"t": 1025.85, "x": "彗星とは、ほぼ正面からぶつかり合う向きです。"}, {"t": 1029.2333333333333, "x": "最初の粒がジオットに当たったのは、"}, {"t": 1031.3833333333334, "x": "最も近づく百二十二分前でした。"}, {"t": 1034.2333333333333, "x": "そこから粒の当たる回数が増えていきます。"}, {"t": 1036.8666666666666, "x": "この夜に記録された粒の衝突は、一万二千回にのぼります。"}, {"t": 1041.3333333333333, "x": "盾には細かな粒が次々と当たっていました。"}, {"t": 1044.3, "x": "そのたびに、機体の中の計器が衝突を数えていきます。"}, {"t": 1048.2666666666667, "x": "カメラは近づきながら核を撮り続けました。"}, {"t": 1050.9833333333333, "x": "画像は地球へ送られ続けました。"}, {"t": 1053.25, "x": "最後の画像は、核まで"}, {"t": 1055.15, "x": "千三百七十二キロメートルのところです。"}, {"t": 1057.8833333333334, "x": "そして最も近づく七・六秒前。"}, {"t": 1060.4666666666667, "x": "一つの粒が機体に当たりました。"}, {"t": 1062.5833333333333, "x": "重さは、〇・一グラムから一グラムほどと"}, {"t": 1065.6166666666666, "x": "見積もられています。"}, {"t": 1066.7333333333333, "x": "一グラムに満たないかもしれない粒です。"}, {"t": 1069.2666666666667, "x": "けれども速さが違います。"}, {"t": 1071.0333333333333, "x": "秒速六十八キロメートルなら、"}, {"t": 1073.15, "x": "機体を揺さぶるには十分でした。"}, {"t": 1075.55, "x": "ジオットは姿勢を乱されました。"}, {"t": 1077.5833333333333, "x": "地球との通信が一時とだえました。"}, {"t": 1079.9166666666667, "x": "機体は、通信がとぎれたまま核のそばを通りすぎます。"}, {"t": 1083.7, "x": "最も近づいたときの距離は、"}, {"t": 1085.5166666666667, "x": "五百九十六キロメートルでした。"}, {"t": 1088.0, "x": "ジオットの機体は、差し渡し約二メートルです。"}, {"t": 1091.2666666666667, "x": "その機体が、長さ十五キロメートルの"}, {"t": 1093.8833333333334, "x": "核の横を通りすぎました。"}, {"t": 1095.5833333333333, "x": "ベガよりも十倍以上近い距離です。"}, {"t": 1097.9333333333334, "x": "機体の噴射装置が働き、揺れはおさまっていきました。"}, {"t": 1101.7666666666667, "x": "通信が完全に戻ったのは、それから"}, {"t": 1104.4333333333334, "x": "三十二分かけてのことです。"}, {"t": 1106.2333333333333, "x": "最も近づいた瞬間のデータは、"}, {"t": 1108.3333333333333, "x": "とぎれとぎれにしか届いていません。"}, {"t": 1110.6666666666667, "x": "画像も、核のいちばん近くの姿は写っていません。"}, {"t": 1114.3166666666666, "x": "最も近い一枚でも、核から"}, {"t": 1116.6666666666667, "x": "千三百キロメートル以上離れていました。"}, {"t": 1119.25, "x": "ジオットは、遠ざかりながらもデータを送り続けました。"}, {"t": 1122.8833333333334, "x": "その時間は約二十四時間です。"}, {"t": 1125.1, "x": "丸一日です。"}, {"t": 1126.3333333333333, "x": "観測機器が切られたのは、三月十五日の世界時二時でした。"}, {"t": 1130.5833333333333, "x": "通信が乱れるまでに届いた画像は、二千百十二枚です。"}, {"t": 1134.75, "x": "一晩で二千枚を超えました。"}, {"t": 1136.7666666666667, "x": "のちに確かめられた機器の状態は、次のとおりでした。"}, {"t": 1140.4333333333334, "x": "完全に動く機器が三つ。"}, {"t": 1142.1666666666667, "x": "傷を負いながらも使える機器が四つ。"}, {"t": 1144.6166666666666, "x": "動かなくなった機器が三つ。"}, {"t": 1146.4166666666667, "x": "動かなくなった中に、カメラが入っていました。"}, {"t": 1149.5666666666666, "x": "ヨーロッパ宇宙機関は、この夜のことを"}, {"t": 1152.3166666666666, "x": "振り返る記事を出しています。"}, {"t": 1154.0, "x": "計画の副科学責任者だった人物も、そこで話しています。"}, {"t": 1158.2333333333333, "x": "ゲルハルト・シュベームです。"}, {"t": 1159.7333333333333, "x": "シュベームは、一生に一度の"}, {"t": 1161.8, "x": "出来事だったと振り返っています。"}, {"t": 1163.7833333333333, "x": "そして、いちばんよかったのは"}, {"t": 1165.85, "x": "画像だった、と語っています。"}, {"t": 1167.9833333333333, "x": "それを見た瞬間だったと。"}, {"t": 1169.7166666666667, "x": "秒速六十八キロメートルのちりは、"}, {"t": 1172.0833333333333, "x": "盾と観測機器を削っていました。"}, {"t": 1174.5166666666667, "x": "カメラはその一夜で役目を終えました。"}, {"t": 1176.9166666666667, "x": "けれども届いた画像は残りました。"}, {"t": 1179.1166666666666, "x": "そこに写っていたものを次に見ていきます。"}, {"t": 1181.6166666666666, "x": "ジオットの画像に写っていたのは、"}, {"t": 1183.55, "x": "細長い黒いかたまりでした。"}, {"t": 1185.7, "x": "ヨーロッパ宇宙機関は、その形を落花生にたとえています。"}, {"t": 1189.8, "x": "長さは約十五キロメートル。"}, {"t": 1191.75, "x": "幅は、七キロメートルから十キロメートルほどです。"}, {"t": 1195.2, "x": "球ではなく引きのばしたような形でした。"}, {"t": 1197.8, "x": "二つの丸みが、くびれでつながったような形です。"}, {"t": 1201.25, "x": "表面は石炭よりも黒いものでした。"}, {"t": 1203.6833333333334, "x": "予想よりずっと暗い表面でした。"}, {"t": 1205.8833333333334, "x": "当たった光のうち、はね返すのは約四パーセントだけです。"}, {"t": 1209.8333333333333, "x": "表面が厚いちりの層に覆われているためだと"}, {"t": 1212.6166666666666, "x": "考えられています。"}, {"t": 1213.8166666666666, "x": "ガスは、かたまり全体から出ていたのではありません。"}, {"t": 1217.1333333333334, "x": "活動していたのは表面の約一割だけです。"}, {"t": 1220.1, "x": "ほかの大部分は静かなままでした。"}, {"t": 1222.3333333333333, "x": "それまでは、表面全体からガスが"}, {"t": 1224.8666666666666, "x": "わき出すと考える見方もありました。"}, {"t": 1227.0666666666666, "x": "実際には、噴き出しは決まった場所に限られていました。"}, {"t": 1230.7, "x": "日の当たる暖かい側から、明るい噴き出しが"}, {"t": 1233.75, "x": "少なくとも三本見えました。"}, {"t": 1235.4833333333333, "x": "数えていくと、噴き出しは七つ見分けられました。"}, {"t": 1238.75, "x": "噴き出しは、まとめて大量の物質を吐き出していました。"}, {"t": 1242.4333333333334, "x": "一秒に約三トンです。"}, {"t": 1244.1333333333334, "x": "一分なら約百八十トンです。"}, {"t": 1246.3, "x": "一時間なら一万トンを超えます。"}, {"t": 1248.4833333333333, "x": "この噴き出しは、核の回り方も変えていました。"}, {"t": 1251.7333333333333, "x": "核は、ふらつくように回っていると考えられています。"}, {"t": 1255.2666666666667, "x": "そのふらつきは、とても長く続いているかもしれません。"}, {"t": 1258.8333333333333, "x": "何百年、何千年という長さです。"}, {"t": 1261.7, "x": "かたまりの密度も見積もられました。"}, {"t": 1263.9, "x": "一立方センチメートルの重さにすると、"}, {"t": 1266.4, "x": "わずか〇・三グラムほどです。"}, {"t": 1268.6833333333334, "x": "水の約三分の一です。"}, {"t": 1270.5, "x": "同じ大きさの氷より、ずっと軽いことになります。"}, {"t": 1274.0666666666666, "x": "中はすきまが多く、ふわふわした"}, {"t": 1276.4833333333333, "x": "作りだと考えられています。"}, {"t": 1278.2333333333333, "x": "吐き出されたガスも調べられました。"}, {"t": 1280.3833333333334, "x": "約八割は水です。"}, {"t": 1281.9666666666667, "x": "彗星は水の氷を多く抱えた天体でした。"}, {"t": 1285.0333333333333, "x": "一酸化炭素が約一割、二酸化炭素が"}, {"t": 1288.1, "x": "約二・五パーセントでした。"}, {"t": 1289.9, "x": "メタンやアンモニアも含まれていました。"}, {"t": 1292.2, "x": "ほかに、わずかな炭化水素や"}, {"t": 1294.3166666666666, "x": "鉄やナトリウムも見つかっています。"}, {"t": 1296.3666666666666, "x": "ちりの粒の多くは、たばこの煙の粒ほどの細かさでした。"}, {"t": 1300.4, "x": "見つかった中で最も大きな粒は、四十ミリグラムです。"}, {"t": 1304.3, "x": "粒には二つの種類がありました。"}, {"t": 1306.4, "x": "一つは、炭素と水素と酸素と窒素が多い粒です。"}, {"t": 1310.0333333333333, "x": "もう一つは金属や岩の成分が多い粒です。"}, {"t": 1313.1, "x": "ナトリウムとマグネシウムとケイ素が含まれていました。"}, {"t": 1316.25, "x": "鉄とカルシウムもありました。"}, {"t": 1318.0333333333333, "x": "核の表面は、炭素を多く含む"}, {"t": 1320.55, "x": "有機物の層で覆われていました。"}, {"t": 1322.6666666666667, "x": "窒素をのぞく軽い元素の割合は、"}, {"t": 1324.8666666666666, "x": "太陽とほとんど同じでした。"}, {"t": 1326.9833333333333, "x": "そのため、この彗星は古い姿を"}, {"t": 1329.6, "x": "とどめた物質だとされています。"}, {"t": 1331.5, "x": "知られている中でも、最も古いものの一つです。"}, {"t": 1334.95, "x": "画像はその後も組み立て直されました。"}, {"t": 1337.4833333333333, "x": "スイスのベルン大学に、この画像を"}, {"t": 1339.9833333333333, "x": "調べた研究グループがあります。"}, {"t": 1341.95, "x": "その記録に、よく知られた核の"}, {"t": 1344.15, "x": "姿の作り方が書かれています。"}, {"t": 1346.1833333333334, "x": "六十八枚の画像を合わせたものです。"}, {"t": 1348.7333333333333, "x": "いちばん明るいところでは、"}, {"t": 1350.2833333333333, "x": "約五十メートルの細かさまで見分けられます。"}, {"t": 1353.4333333333334, "x": "彗星がはっきり写り始めたのは、ずっと手前からでした。"}, {"t": 1357.3333333333333, "x": "約十二万四千キロメートル手前です。"}, {"t": 1359.95, "x": "ヨーロッパ宇宙機関は、ジオットの"}, {"t": 1362.3666666666666, "x": "成果をこうまとめています。"}, {"t": 1363.9833333333333, "x": "彗星の核を初めて近くから写した探査機。"}, {"t": 1367.05, "x": "その画像は、彗星の核の形を初めて示しました。"}, {"t": 1370.9666666666667, "x": "彗星に有機物があることを示す、"}, {"t": 1373.3, "x": "最初の手がかりも見つけました。"}, {"t": 1375.5666666666666, "x": "ベガの画像とジオットの画像。"}, {"t": 1377.5, "x": "ハレー彗星の核の形は、この二つの記録から"}, {"t": 1380.9, "x": "知られています。"}, {"t": 1381.8, "x": "一九九二年七月十日。"}, {"t": 1384.3333333333333, "x": "ジオットは、二つ目の彗星とすれちがいます。"}, {"t": 1387.55, "x": "そこへ着くまでの道のりは、長い眠りから始まりました。"}, {"t": 1391.4166666666667, "x": "ハレー彗星を離れたジオットは、まだ動いていました。"}, {"t": 1395.0666666666666, "x": "役目はまだ残っていました。"}, {"t": 1396.8833333333334, "x": "カメラは失われましたが、ほかの機器の一部は使えます。"}, {"t": 1400.7, "x": "燃料も約六十キログラム残っていました。"}, {"t": 1403.5333333333333, "x": "一九八六年四月二日、ジオットは眠らされました。"}, {"t": 1407.9166666666667, "x": "機器を止めて、太陽のまわりを回り続ける状態です。"}, {"t": 1411.7166666666667, "x": "起こされたのは一九九〇年二月でした。"}, {"t": 1414.6333333333334, "x": "千四百十九日ぶりです。"}, {"t": 1416.7333333333333, "x": "四年近い眠りでした。"}, {"t": 1418.35, "x": "一週間のうちに、地上は機体の制御を取り戻しました。"}, {"t": 1422.3166666666666, "x": "一九九〇年七月二日。"}, {"t": 1424.733333  1758.6166666666666, "x": "そのときでも、明るさはこの観測の"}, {"t": 1761.2166666666667, "x": "二・五分の一ほどになるだけです。"}, {"t": 1763.4333333333334, "x": "同じ望遠鏡なら、軌道のどこにいても見ることが"}, {"t": 1766.8166666666666, "x": "できる、としています。"}, {"t": 1768.4, "x": "前回、太陽から最も遠い点にいたのは、一九四八年でした。"}, {"t": 1773.8333333333333, "x": "その距離は三十五・二五天文単位です。"}, {"t": 1776.8333333333333, "x": "二〇二三年の折り返しはもう過ぎました。"}, {"t": 1779.6666666666667, "x": "ハレー彗星は、いま太陽の方へ戻り始めています。"}, {"t": 1783.45, "x": "NASAは、ハレー彗星が次に"}, {"t": 1785.5166666666667, "x": "戻ってくるのは二〇六一年だとしています。"}, {"t": 1788.45, "x": "前回から数えて七十五年後です。"}, {"t": 1790.9166666666667, "x": "一九八六年に生まれた人が、七十五歳になる年です。"}, {"t": 1795.6, "x": "核を近くから見た記録は、一九八六年三月の"}, {"t": 1799.75, "x": "九日ほどで止まっています。"}, {"t": 1801.4, "x": "ベガ1号が写し、ベガ2号が写しました。"}, {"t": 1804.5833333333333, "x": "そしてジオットが、五百九十六キロメートルまで"}, {"t": 1807.9166666666667, "x": "近づきました。"}, {"t": 1808.8333333333333, "x": "その九日間です。"}, {"t": 1810.2833333333333, "x": "そのあとに残ったのは、四十二億キロメートル先の"}, {"t": 1813.7166666666667, "x": "形のない点でした。"}, {"t": 1815.0333333333333, "x": "二〇六一年に戻ってきたとき、核はまた雲に包まれます。"}, {"t": 1819.3333333333333, "x": "地上の望遠鏡から見えるのは、また雲と尾です。"}, {"t": 1822.8166666666666, "x": "それでも、ハレー彗星のかけらは、"}, {"t": 1825.2333333333333, "x": "毎年地球に届いています。"}, {"t": 1827.4166666666667, "x": "十月と五月です。"}, {"t": 1828.85, "x": "地球が、彗星の通り道を横切る月です。"}, {"t": 1832.1666666666667, "x": "二〇二六年のオリオン座流星群は、"}, {"t": 1834.7666666666667, "x": "十月二日から十一月七日まで流れました。"}, {"t": 1838.1833333333334, "x": "核からこぼれた粒が大気に飛び込みます。"}, {"t": 1840.8166666666666, "x": "秒速六十六キロメートルで燃えて、一瞬だけ光ります。"}, {"t": 1844.8833333333334, "x": "ジョットが一三〇一年に見上げたのと、同じ彗星の粒です。"}, {"t": 1849.3, "x": "ハレーが計算した彗星の粒でもあります。"}, {"t": 1851.9833333333333, "x": "本体が戻ってくるまであと三十五年ほど。"}, {"t": 1854.7833333333333, "x": "そのあいだも、人の目にじかに見えるものがあります。"}, {"t": 1858.0833333333333, "x": "ハレー彗星から来た粒です。"}, {"t": 1860.05, "x": "秋と春の夜に走る、細い光の線になって見えます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
