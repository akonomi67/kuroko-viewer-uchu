<script>
const D={"name": "ep039", "file": "ep039", "dur": 1774.5333125, "segs": [], "subs": [{"t": 0.0, "x": "2005年の7月4日のことです。"}, {"t": 2.4, "x": "アメリカでは祝日にあたる日でした。"}, {"t": 4.633333333333334, "x": "場所は地球から4億キロ以上はなれた宇宙です。"}, {"t": 7.733333333333333, "x": "そこで小さな機体が彗星にぶつかりました。"}, {"t": 10.55, "x": "ぶつかったのは、370キロほどの重さの塊です。"}, {"t": 14.533333333333333, "x": "その半分ほどは銅でできていました。"}, {"t": 16.85, "x": "回収する予定のない塊です。"}, {"t": 19.033333333333335, "x": "ぶつけたのはアメリカの探査機、"}, {"t": 20.866666666666667, "x": "ディープ・インパクトです。"}, {"t": 22.516666666666666, "x": "目的は彗星の中を見ることでした。"}, {"t": 25.033333333333335, "x": "壊すためではありません。"}, {"t": 26.533333333333335, "x": "調べるためにぶつけたのです。"}, {"t": 28.433333333333334, "x": "外からいくら写真を撮っても、彗星の中身は分かりません。"}, {"t": 32.4, "x": "だから穴をあけて、内側から"}, {"t": 34.65, "x": "出てくる物を見ようとしたのです。"}, {"t": 36.516666666666666, "x": "とても思い切った計画でした。"}, {"t": 38.483333333333334, "x": "その瞬間に彗星から白い光が広がりました。"}, {"t": 41.68333333333333, "x": "母船は近くを通り過ぎながら、その様子を撮り続けました。"}, {"t": 45.75, "x": "けれど一つだけ、写らなかった物があります。"}, {"t": 48.9, "x": "あけたはずの穴です。"}, {"t": 50.28333333333333, "x": "舞い上がったちりが濃すぎて、"}, {"t": 51.916666666666664, "x": "穴の底まで見えなかったのです。"}, {"t": 54.266666666666666, "x": "その穴が初めて写真に写ったのは、"}, {"t": 56.516666666666666, "x": "6年近くたってからでした。"}, {"t": 58.61666666666667, "x": "撮ったのは別の探査機です。"}, {"t": 60.45, "x": "その探査機は穴を写すためだけに、"}, {"t": 62.61666666666667, "x": "遠い道を回ってきました。"}, {"t": 64.65, "x": "そしてぶつけた側の母船は、"}, {"t": 66.45, "x": "その2年後に声がとだえました。"}, {"t": 68.76666666666667, "x": "原因として名前が挙がったのは、機体の中の時計でした。"}, {"t": 72.53333333333333, "x": "これは彗星に置いてきた銅の塊と、"}, {"t": 75.01666666666667, "x": "見えなかった穴の記録です。"}, {"t": 77.08333333333333, "x": "この彗星の記録は150年以上前から始まります。"}, {"t": 80.78333333333333, "x": "1867年の4月3日のことです。"}, {"t": 83.91666666666667, "x": "場所はフランスの港町マルセイユです。"}, {"t": 86.45, "x": "一人の天文学者が夜空を見ていました。"}, {"t": 89.06666666666666, "x": "名前はヴィルヘルム・テンペルです。"}, {"t": 91.03333333333333, "x": "テンペルはぼんやりとした小さな光を見つけました。"}, {"t": 94.1, "x": "肉眼では見えない暗い光です。"}, {"t": 96.31666666666666, "x": "星とはちがい、輪郭のはっきりしない光です。"}, {"t": 99.65, "x": "その光は、日にちがたつと少しずつ位置を変えました。"}, {"t": 103.28333333333333, "x": "彗星でした。"}, {"t": 104.35, "x": "彗星は氷とちりでできた小さな天体です。"}, {"t": 107.38333333333334, "x": "太陽に近づくと氷がとけ出します。"}, {"t": 109.83333333333333, "x": "するとガスとちりが外へ出てきます。"}, {"t": 112.03333333333333, "x": "そのガスとちりが、ぼんやりした光の雲になります。"}, {"t": 115.56666666666666, "x": "光の雲の中心には、本体と呼ばれる固い塊があります。"}, {"t": 119.9, "x": "本体は小さすぎて、地上の望遠鏡では形が見えません。"}, {"t": 124.18333333333334, "x": "この彗星はのちにテンペル第1彗星と呼ばれます。"}, {"t": 127.51666666666667, "x": "テンペルが見つけた周期彗星の、1つ目という意味です。"}, {"t": 131.3, "x": "周期彗星とは決まった道を回って"}, {"t": 133.55, "x": "何度も戻ってくる彗星のことです。"}, {"t": 135.73333333333332, "x": "この彗星は火星と木星のあいだのあたりを回っていました。"}, {"t": 139.36666666666667, "x": "見つかったころの周期はおよそ5.7年でした。"}, {"t": 142.4, "x": "5年と8か月ほどで太陽を1周していたのです。"}, {"t": 145.55, "x": "大きな尾を引いて空を横切るような、"}, {"t": 147.73333333333332, "x": "目立つ彗星ではありません。"}, {"t": 149.71666666666667, "x": "望遠鏡で見て、やっと分かるほどの暗い彗星です。"}, {"t": 153.36666666666667, "x": "それでも天文学者たちは記録を続けました。"}, {"t": 156.3, "x": "戻ってくるたびに位置を書き残したのです。"}, {"t": 158.91666666666666, "x": "1873年に戻り、1879年にも戻りました。"}, {"t": 163.98333333333332, "x": "ここまでは予定どおりでした。"}, {"t": 165.78333333333333, "x": "天文学者たちは次の戻りを待ちました。"}, {"t": 168.5, "x": "ところが、その次の戻りで、彗星は見つかりませんでした。"}, {"t": 172.78333333333333, "x": "計算した場所を探しても、何も写りません。"}, {"t": 175.95, "x": "1898年には、写真を使って探されました。"}, {"t": 180.05, "x": "1905年にも探されました。"}, {"t": 182.38333333333333, "x": "どちらも見つかりませんでした。"}, {"t": 184.21666666666667, "x": "天文学者たちは考えました。"}, {"t": 186.31666666666666, "x": "この彗星はくずれてしまったのだろうと。"}, {"t": 188.81666666666666, "x": "彗星は氷とちりの塊です。"}, {"t": 191.13333333333333, "x": "太陽に近づくたびに氷がとけて、少しずつやせていきます。"}, {"t": 195.25, "x": "ばらばらになって消えてしまう彗星も、実際にあります。"}, {"t": 198.91666666666666, "x": "テンペル第1彗星も、そうなったと思われたのです。"}, {"t": 202.51666666666668, "x": "名前だけが古い記録に残りました。"}, {"t": 204.85, "x": "けれど本当の理由は、別の所にありました。"}, {"t": 208.11666666666667, "x": "1881年、この彗星は木星のそばを通っていました。"}, {"t": 212.9, "x": "木星は太陽系で一番大きな惑星です。"}, {"t": 216.0, "x": "その重力に引かれて、彗星の通る道が変わっていたのです。"}, {"t": 220.13333333333333, "x": "太陽を1周する年月は、およそ6.5年にのびました。"}, {"t": 224.2, "x": "太陽に一番近づく所も、前より遠くなりました。"}, {"t": 228.0, "x": "遠くなれば、氷はあまりとけず、彗星は暗いままです。"}, {"t": 232.28333333333333, "x": "彗星はなくなったのではありませんでした。"}, {"t": 234.85, "x": "計算とちがう道を、暗いまま回り続けていたのです。"}, {"t": 238.56666666666666, "x": "そのまま、80年以上が過ぎました。"}, {"t": 241.43333333333334, "x": "その間に、写真の技術も望遠鏡も大きく変わりました。"}, {"t": 245.5, "x": "それでもこの彗星の名前は記録の中に残っていました。"}, {"t": 249.08333333333334, "x": "1960年代になって、この彗星を探し直した人がいました。"}, {"t": 254.1, "x": "アメリカの天文学者、ブライアン・マースデンです。"}, {"t": 257.3666666666667, "x": "マースデンは木星の重力が彗星の道を"}, {"t": 260.1333333333333, "x": "どう変えたかを計算しました。"}, {"t": 261.8833333333333, "x": "古い記録から、今どこにいるはずかを割り出したのです。"}, {"t": 265.45, "x": "その計算を手がかりに、別の"}, {"t": 267.65, "x": "天文学者が古い写真を調べました。"}, {"t": 270.1, "x": "カタリナ天文台のエリザベス・ローマーです。"}, {"t": 272.71666666666664, "x": "手がかりは1967年に撮った写真でした。"}, {"t": 276.1333333333333, "x": "ローマーはその中にごく暗い点を見つけました。"}, {"t": 278.98333333333335, "x": "その点が彗星だと分かったのは、"}, {"t": 280.98333333333335, "x": "1968年の終わりごろでした。"}, {"t": 284.03333333333336, "x": "けれど点が一つだけでは道は決まりません。"}, {"t": 286.71666666666664, "x": "点が一つでは、どちらへ動いているのかが"}, {"t": 289.56666666666666, "x": "分からないからです。"}, {"t": 290.68333333333334, "x": "もう一度、別の時に写す必要がありました。"}, {"t": 293.95, "x": "そのためには彗星が次に戻ってくるのを"}, {"t": 296.45, "x": "待つしかありません。"}, {"t": 297.56666666666666, "x": "待つ時間は数年です。"}, {"t": 299.1666666666667, "x": "そして1972年の1月11日です。"}, {"t": 302.7, "x": "ローマーたちは、スチュワード天文台で"}, {"t": 305.18333333333334, "x": "彗星をとらえ直しました。"}, {"t": 306.8833333333333, "x": "最後に記録されてから、90年以上がたっていました。"}, {"t": 310.6666666666667, "x": "見失われた彗星は、計算によって取り戻されたのです。"}, {"t": 314.6166666666667, "x": "その後この彗星は戻ってくるたびに"}, {"t": 316.8, "x": "観測されるようになりました。"}, {"t": 318.5833333333333, "x": "ただ、地上の望遠鏡で見えるのは、"}, {"t": 321.18333333333334, "x": "ぼんやりした光だけです。"}, {"t": 323.0833333333333, "x": "中心にある本体の形は、まだ誰も知りませんでした。"}, {"t": 326.8833333333333, "x": "中身となると、なおさらです。"}, {"t": 329.2, "x": "見当もつきませんでした。"}, {"t": 330.9, "x": "彗星は太陽系ができたころの材料を"}, {"t": 333.43333333333334, "x": "残していると考えられています。"}, {"t": 335.3833333333333, "x": "46億年前のことです。"}, {"t": 337.51666666666665, "x": "惑星ができたときに使われなかった"}, {"t": 339.65, "x": "氷とちりが彗星になりました。"}, {"t": 341.7, "x": "それが冷たい場所に残っているかもしれません。"}, {"t": 344.51666666666665, "x": "ほとんど変わらないままです。"}, {"t": 346.23333333333335, "x": "けれど彗星の表面は太陽の光に何度も焼かれています。"}, {"t": 350.01666666666665, "x": "外側はもとの姿から変わっているはずです。"}, {"t": 352.8666666666667, "x": "本当に古い材料を見るには、中を見なければなりません。"}, {"t": 356.8333333333333, "x": "けれど彗星の中へもぐる機械はありません。"}, {"t": 359.55, "x": "掘る機械を降ろすのも、とても難しいことです。"}, {"t": 362.85, "x": "彗星の重力はとても弱く、物を"}, {"t": 365.6666666666667, "x": "置いてもはね返ってしまうからです。"}, {"t": 367.56666666666666, "x": "そこで考えられたのが、彗星に物を"}, {"t": 370.28333333333336, "x": "ぶつけるという方法でした。"}, {"t": 371.9, "x": "掘るのではなく、ぶつけるのです。"}, {"t": 374.28333333333336, "x": "ぶつけて穴をあければ、中の物が外へ飛び出します。"}, {"t": 377.9166666666667, "x": "飛び出した物を、近くで調べればよいのです。"}, {"t": 381.01666666666665, "x": "穴の大きさや形も手がかりになります。"}, {"t": 383.6166666666667, "x": "表面のかたさが分かるのです。"}, {"t": 385.6166666666667, "x": "この計画を進めたのは一人の天文学者でした。"}, {"t": 388.8, "x": "アメリカのメリーランド大学の研究者です。"}, {"t": 391.53333333333336, "x": "名前はマイケル・エイハーンです。"}, {"t": 393.3833333333333, "x": "計画はNASAに選ばれ、ディープ・インパクトと"}, {"t": 396.23333333333335, "x": "名付けられました。"}, {"t": 397.23333333333335, "x": "ねらう彗星には、テンペル第1彗星が選ばれました。"}, {"t": 401.03333333333336, "x": "見つかってから、130年以上がたった彗星です。"}, {"t": 404.71666666666664, "x": "一度見失われ、計算で取り戻された、あの彗星です。"}, {"t": 409.1166666666667, "x": "本体は長い所でおよそ7.6キロです。"}, {"t": 412.1, "x": "短い所はおよそ4.9キロです。"}, {"t": 414.6666666666667, "x": "およそ40時間かけて1回、ゆっくりと回っています。"}, {"t": 418.3833333333333, "x": "地球の1日より、ずっとゆっくりです。"}, {"t": 421.26666666666665, "x": "その表面に、狙って物を当てる計画でした。"}, {"t": 424.5833333333333, "x": "ディープ・インパクトは、2つの機体を"}, {"t": 426.9, "x": "組み合わせた探査機でした。"}, {"t": 428.48333333333335, "x": "一つは彗星のそばを通り過ぎる母船です。"}, {"t": 431.26666666666665, "x": "もう一つは彗星にぶつかる子機です。"}, {"t": 433.6, "x": "子機には、戻ってくる仕組みはありません。"}, {"t": 436.3666666666667, "x": "2つ合わせた重さは、およそ650キロでした。"}, {"t": 440.0, "x": "そのうち母船は、およそ601キロです。"}, {"t": 443.1333333333333, "x": "子機の重さの数字は、資料ごとにわずかにずれています。"}, {"t": 446.85, "x": "370キロとも372キロとも書かれています。"}, {"t": 450.65, "x": "大きさは合わせて大きめの乗用車ほどだったと"}, {"t": 453.3833333333333, "x": "伝えられています。"}, {"t": 454.48333333333335, "x": "母船には望遠鏡のついたカメラが2台ありました。"}, {"t": 457.68333333333334, "x": "1台は細かい所まで写すカメラです。"}, {"t": 460.3666666666667, "x": "もう1台は広く写すカメラです。"}, {"t": 462.56666666666666, "x": "細かい所を写す側には別の道具もついていました。"}, {"t": 466.01666666666665, "x": "光を色ごとに分けて調べる道具です。"}, {"t": 468.6, "x": "子機にも、カメラが1台積まれていました。"}, {"t": 471.48333333333335, "x": "子機のカメラは、帰ってくることのないカメラです。"}, {"t": 474.6333333333333, "x": "ぶつかる直前まで、彗星の表面を"}, {"t": 477.4, "x": "写し続けるためのカメラです。"}, {"t": 479.15, "x": "2つの機体は彗星に近づくまで一つになって飛びます。"}, {"t": 482.6333333333333, "x": "そしてぶつかる1日前に切りはなされます。"}, {"t": 485.3666666666667, "x": "切りはなされた子機は、そのまま彗星へ向かって進みます。"}, {"t": 489.2, "x": "母船は向きを変えて、少しだけ横へそれます。"}, {"t": 492.5, "x": "子機がぶつかった後も母船は進みます。"}, {"t": 494.98333333333335, "x": "横を通り過ぎながら穴と飛び散る物を写すのです。"}, {"t": 498.23333333333335, "x": "一つは消えるための機体です。"}, {"t": 500.15, "x": "もう一つは見届けるための機体でした。"}, {"t": 502.56666666666666, "x": "どちらが欠けても、計画は成り立ちません。"}, {"t": 505.46666666666664, "x": "子機の中でも、一番重い部分は銅でできていました。"}, {"t": 509.21666666666664, "x": "重さはおよそ113キロです。"}, {"t": 511.4, "x": "大人の男の人、2人分ほどの重さです。"}, {"t": 514.5833333333334, "x": "子機全体の重さの、およそ半分にあたります。"}, {"t": 517.95, "x": "この部分は穴をあけるための重りでした。"}, {"t": 520.45, "x": "なぜ鉄やアルミではなく、銅だったのでしょうか。"}, {"t": 523.7166666666667, "x": "理由は彗星から飛び出す物を調べる方法にあります。"}, {"t": 527.1666666666666, "x": "母船は飛び散った物から届く"}, {"t": 528.9833333333333, "x": "光を、色ごとに分けて調べます。"}, {"t": 531.5666666666667, "x": "物によって、光の色の並びにちがいが出るからです。"}, {"t": 535.25, "x": "ぶつけた物と同じ材料が彗星にもあったらどうでしょう。"}, {"t": 538.65, "x": "見分けがつかなくなります。"}, {"t": 540.3, "x": "銅は彗星の中にはほとんど無いと考えられていました。"}, {"t": 543.7666666666667, "x": "銅が混ざっても見分けやすいのです。"}, {"t": 545.9166666666666, "x": "調べる邪魔になりにくいのです。"}, {"t": 547.95, "x": "この銅の塊は彗星に置いてくるための物でした。"}, {"t": 551.25, "x": "回収する予定はありません。"}, {"t": 553.0833333333334, "x": "役目はぶつかって穴をあけることだけです。"}, {"t": 555.65, "x": "使い捨ての重りです。"}, {"t": 557.1166666666667, "x": "けれどそれが計画の中心でした。"}, {"t": 559.35, "x": "子機の電池は切りはなされてからの"}, {"t": 561.2666666666667, "x": "24時間ほどを動かすための物でした。"}, {"t": 563.8, "x": "それより長く動く必要は、初めから無かったのです。"}, {"t": 567.5166666666667, "x": "24時間のうちに、すべてが終わる予定でした。"}, {"t": 570.8666666666667, "x": "子機にはもう一つ積まれていた物があります。"}, {"t": 573.4833333333333, "x": "小さな円盤です。"}, {"t": 574.8333333333334, "x": "円盤にはたくさんの人の名前が書きこまれていました。"}, {"t": 578.05, "x": "打ち上げの前にNASAは呼びかけていました。"}, {"t": 580.5833333333334, "x": "彗星へ名前を送ろうというのです。"}, {"t": 582.9333333333333, "x": "名前はたくさん集まりました。"}, {"t": 584.85, "x": "およそ62万5000人分だったと伝えられています。"}, {"t": 588.25, "x": "その名前が、小さな円盤に収められました。"}, {"t": 591.5, "x": "円盤は子機に取り付けられ、"}, {"t": 593.1666666666666, "x": "子機といっしょに彗星へ向かいました。"}, {"t": 595.6666666666666, "x": "ぶつかれば、円盤も銅の重りといっしょに彗星へ届きます。"}, {"t": 599.6833333333333, "x": "それでも彗星に名前を残したい"}, {"t": 601.7333333333333, "x": "人が、60万人以上いたのです。"}, {"t": 604.3833333333333, "x": "子機の中には2度と戻らない物が"}, {"t": 606.4666666666667, "x": "2つ積まれていたことになります。"}, {"t": 608.3666666666667, "x": "一つは穴をあけるための銅です。"}, {"t": 610.45, "x": "もう一つは地球の人たちの名前でした。"}, {"t": 612.9833333333333, "x": "どちらも今はテンペル第1彗星にあるはずです。"}, {"t": 616.05, "x": "表面か、その中のどこかです。"}, {"t": 618.5833333333334, "x": "2つの物を写した写真は1枚もありません。"}, {"t": 621.5, "x": "これからも撮られる予定はありません。"}, {"t": 623.6166666666667, "x": "名前は彗星といっしょに太陽を回り続けています。"}, {"t": 626.8666666666667, "x": "2005年の1月12日です。"}, {"t": 629.2, "x": "ディープ・インパクトが打ち上げられました。"}, {"t": 631.4333333333333, "x": "飛び立ったのはフロリダ州のケープカナベラルです。"}, {"t": 634.3166666666667, "x": "使われたのはデルタ2という種類のロケットです。"}, {"t": 637.1333333333333, "x": "彗星までの道のりは、およそ4億2900万キロでした。"}, {"t": 641.5333333333333, "x": "地球と太陽のあいだの距離の、3倍近くです。"}, {"t": 644.9666666666667, "x": "地球から月までの距離の、1000倍を超えます。"}, {"t": 648.2, "x": "その道のりを、探査機は半年かけて進みました。"}, {"t": 651.6833333333333, "x": "止まることなく進み続けました。"}, {"t": 653.7333333333333, "x": "探査機は少しずつ彗星へ近づいていきました。"}, {"t": 656.7166666666667, "x": "彗星の見え方も変わっていき const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
