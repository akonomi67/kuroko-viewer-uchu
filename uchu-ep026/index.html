<script>
const D={"name": "ep026", "file": "ep026", "dur": 1860.05, "segs": [], "subs": [{"t": 0.0, "x": "小惑星プシケの中身は、体積の三割から"}, {"t": 3.25, "x": "六割が金属だと見積もられています。"}, {"t": 5.583333333333333, "x": "鉄やニッケルです。"}, {"t": 6.883333333333334, "x": "場所は火星と木星のあいだの、小惑星の帯です。"}, {"t": 10.5, "x": "ただし、近くから写した写真はまだありません。"}, {"t": 13.733333333333333, "x": "地上の大きな望遠鏡でも、にじんだ"}, {"t": 16.5, "x": "輪郭しか得られていません。"}, {"t": 18.1, "x": "そこへ向かう探査機が一機あります。"}, {"t": 20.333333333333332, "x": "探査機の名前はサイキ。"}, {"t": 22.0, "x": "着くのは二〇二九年の夏の予定です。"}, {"t": 24.783333333333335, "x": "手のひらに硬貨を三枚のせます。"}, {"t": 26.966666666666665, "x": "アメリカの二十五セント硬貨です。"}, {"t": 29.15, "x": "そのとき手に感じる、わずかな重さ。"}, {"t": 31.866666666666667, "x": "それが、サイキを押している力です。"}, {"t": 34.483333333333334, "x": "その後ろから青い光が細く伸びています。"}, {"t": 37.25, "x": "光の正体はキセノンという気体の粒です。"}, {"t": 40.06666666666667, "x": "粒は電気を帯びています。"}, {"t": 41.8, "x": "それを後ろへ吹き出して、反動で前へ進みます。"}, {"t": 45.28333333333333, "x": "押す力はとても弱いものです。"}, {"t": 47.31666666666667, "x": "そのかわり、ほとんど休まずに吹き続けます。"}, {"t": 50.43333333333333, "x": "着くまで表面の色も形も誰も知りません。"}, {"t": 53.31666666666667, "x": "小惑星も探査機も、英語では同じ名前です。"}, {"t": 56.833333333333336, "x": "この回では、小惑星をプシケと呼びます。"}, {"t": 59.916666666666664, "x": "探査機はサイキと呼び分けます。"}, {"t": 61.85, "x": "ここから先は、まだ見えていない金属の天体の記録です。"}, {"t": 65.86666666666666, "x": "写真のない小惑星です。"}, {"t": 67.7, "x": "そして、そこへ向かう一機の記録です。"}, {"t": 70.5, "x": "一八五二年三月十七日。"}, {"t": 73.26666666666667, "x": "イタリアの天文学者が一つの小惑星を見つけました。"}, {"t": 76.78333333333333, "x": "名前はアンニーバレ・デ・ガスパリスです。"}, {"t": 78.95, "x": "小惑星として見つかったのは十六番目でした。"}, {"t": 81.95, "x": "そのため、いまも十六番の番号を"}, {"t": 84.61666666666666, "x": "つけて呼ばれることがあります。"}, {"t": 86.28333333333333, "x": "名前は古代ギリシャの神話からとられました。"}, {"t": 88.96666666666667, "x": "プシケは魂をあらわす女神です。"}, {"t": 91.3, "x": "神話の中のプシケは人間として生まれました。"}, {"t": 94.23333333333333, "x": "のちに愛の神エロスと結ばれます。"}, {"t": 96.53333333333333, "x": "エロスはローマの神話ではキューピッドと呼ばれます。"}, {"t": 99.43333333333334, "x": "見つかった当時、この天体は一つの光の点でした。"}, {"t": 103.18333333333334, "x": "星と見分けがつかない点です。"}, {"t": 105.08333333333333, "x": "それから百七十年あまりがたちました。"}, {"t": 107.7, "x": "人々はこの点から少しずつ情報を引き出してきました。"}, {"t": 111.13333333333334, "x": "まず大きさです。"}, {"t": 112.36666666666666, "x": "NASAの資料を見てみます。"}, {"t": 114.01666666666667, "x": "最も長いところで約二百八十キロメートルあります。"}, {"t": 117.46666666666667, "x": "別の向きでは約二百三十二キロメートルです。"}, {"t": 120.5, "x": "もう一つの向きでは"}, {"t": 121.61666666666666, "x": "約百八十九キロメートルとされています。"}, {"t": 124.35, "x": "丸くはありません。"}, {"t": 125.58333333333333, "x": "ジャガイモのような、いびつな形です。"}, {"t": 128.18333333333334, "x": "完全な球にならすと、直径は"}, {"t": 130.51666666666668, "x": "約二百二十六キロメートルになります。"}, {"t": 133.01666666666668, "x": "表面の広さは約十六万五千八百平方キロメートルと"}, {"t": 136.91666666666666, "x": "見積もられています。"}, {"t": 138.03333333333333, "x": "次に場所です。"}, {"t": 139.16666666666666, "x": "プシケは太陽から三億七千八百万キロメートルのところまで"}, {"t": 143.15, "x": "近づきます。"}, {"t": 143.96666666666667, "x": "遠いときは四億九千七百万キロメートルまで離れます。"}, {"t": 147.76666666666668, "x": "太陽と地球の距離を一とすると、二・五から三・三です。"}, {"t": 152.11666666666667, "x": "平均すると地球の約三倍の遠さです。"}, {"t": 154.91666666666666, "x": "小惑星の帯の中でも外側に近いところです。"}, {"t": 158.18333333333334, "x": "地球と比べると、太陽の光はずっと弱くなります。"}, {"t": 161.98333333333332, "x": "このことは、のちに探査機の設計にも関わってきます。"}, {"t": 165.66666666666666, "x": "太陽のまわりを一周するのに約五年かかります。"}, {"t": 168.81666666666666, "x": "一方で、自分自身は速く回っています。"}, {"t": 171.88333333333333, "x": "一回転にかかるのは四時間と少しです。"}, {"t": 174.53333333333333, "x": "プシケの上では、一日がとても短いことになります。"}, {"t": 178.25, "x": "ここまでは地上からの観測と計算で分かったことです。"}, {"t": 181.7, "x": "けれども、注目された理由は"}, {"t": 183.85, "x": "大きさでも場所でもありませんでした。"}, {"t": 185.95, "x": "注目されたのは中身です。"}, {"t": 187.76666666666668, "x": "その中身を確かめた者は、まだいません。"}, {"t": 190.68333333333334, "x": "地球の中心には核と呼ばれる部分があります。"}, {"t": 193.63333333333333, "x": "NASAの資料では、いちばん内側は固い球です。"}, {"t": 197.08333333333334, "x": "鉄とニッケルでできています。"}, {"t": 198.85, "x": "半径は約千二百二十一キロメートルです。"}, {"t": 201.85, "x": "温度は最も高いところで五千四百度に"}, {"t": 204.5, "x": "達するとされています。"}, {"t": 205.83333333333334, "x": "そのまわりを、とけた鉄とニッケルの層が包んでいます。"}, {"t": 209.45, "x": "厚さは約二千三百キロメートルです。"}, {"t": 212.03333333333333, "x": "さらにその外に、岩でできたマントルがあります。"}, {"t": 215.25, "x": "厚さは約二千九百キロメートルです。"}, {"t": 217.85, "x": "いちばん外側は地殻です。"}, {"t": 219.73333333333332, "x": "陸の上では平均約三十キロメートルの深さまでです。"}, {"t": 223.36666666666667, "x": "つまり核は、足もとから二千九百キロメートル以上も"}, {"t": 227.1, "x": "下にあります。"}, {"t": 227.96666666666667, "x": "人が掘った穴は、そこまでまったく届いていません。"}, {"t": 231.26666666666668, "x": "地球の核を直接見ることはできないのです。"}, {"t": 234.13333333333333, "x": "地球の核は鉄とニッケルでできています。"}, {"t": 236.7, "x": "プシケの中身として考えられているのも、"}, {"t": 239.13333333333333, "x": "同じ鉄とニッケルです。"}, {"t": 240.95, "x": "だからこそ、プシケは地球の"}, {"t": 242.98333333333332, "x": "核の代わりとして注目されました。"}, {"t": 245.13333333333333, "x": "二〇一七年一月、NASAが一つの発表をしました。"}, {"t": 249.11666666666667, "x": "その中で、ある研究者がこう話しました。"}, {"t": 252.21666666666667, "x": "これが、人類が核を訪れるただ一つの方法だ。"}, {"t": 255.81666666666666, "x": "話したのはリンディ・エルキンス＝タントンです。"}, {"t": 258.73333333333335, "x": "当時はアメリカのアリゾナ州立大学にいました。"}, {"t": 261.78333333333336, "x": "サイキの計画を率いる研究者です。"}, {"t": 264.31666666666666, "x": "彼女が指していたのがプシケでした。"}, {"t": 266.45, "x": "プシケは、ある天体の核の名残かもしれない。"}, {"t": 269.6666666666667, "x": "そう考えられてきたのです。"}, {"t": 271.46666666666664, "x": "ある天体とは、太陽系ができたころの小さな天体です。"}, {"t": 275.45, "x": "惑星のもとになった天体です。"}, {"t": 277.53333333333336, "x": "その中には、内側がとけたものがありました。"}, {"t": 280.7, "x": "とけると重い金属は中心へ沈みます。"}, {"t": 283.43333333333334, "x": "軽い岩は外側に残ります。"}, {"t": 285.51666666666665, "x": "こうして金属の核と岩の外側に分かれます。"}, {"t": 288.53333333333336, "x": "もし、その天体が何度もぶつかって外側の岩がはがれたら。"}, {"t": 292.6666666666667, "x": "あとには金属の核だけが残るかもしれません。"}, {"t": 295.6166666666667, "x": "ただし、これは確かめられた話ではありません。"}, {"t": 298.8666666666667, "x": "金属が多いと考えられた手がかりは、"}, {"t": 301.28333333333336, "x": "いくつかの観測でした。"}, {"t": 303.1, "x": "一つは、表面で跳ね返った光の性質です。"}, {"t": 306.51666666666665, "x": "もう一つは電波です。"}, {"t": 307.98333333333335, "x": "地上から電波を当てて、跳ね返り方を調べます。"}, {"t": 311.55, "x": "すると表面の性質の手がかりが得られます。"}, {"t": 314.3333333333333, "x": "プシケは、この跳ね返りが強いことが分かりました。"}, {"t": 317.81666666666666, "x": "さらに、温度の変わりにくさも測られました。"}, {"t": 320.95, "x": "これらを合わせて、表面に金属が"}, {"t": 323.55, "x": "多いと考えられてきました。"}, {"t": 325.26666666666665, "x": "もう一つの手がかりが重さです。"}, {"t": 327.3333333333333, "x": "プシケの近くを別の小惑星が通ることがあります。"}, {"t": 330.6333333333333, "x": "そのとき、通った小惑星の軌道がわずかに曲がります。"}, {"t": 334.48333333333335, "x": "その曲がり方から、プシケの重さが見積もられてきました。"}, {"t": 338.1666666666667, "x": "重さと大きさが分かれば密度が出ます。"}, {"t": 340.6666666666667, "x": "密度とは、同じ大きさあたりの重さです。"}, {"t": 343.73333333333335, "x": "岩より金属のほうが重いものです。"}, {"t": 346.1166666666667, "x": "ですから、密度が高ければ金属が多いと考えられます。"}, {"t": 350.06666666666666, "x": "ただし、中にすき間があると密度は下がります。"}, {"t": 353.35, "x": "金属の量と、すき間の量。"}, {"t": 355.65, "x": "その二つを同時に決めなければなりません。"}, {"t": 358.26666666666665, "x": "二〇二〇年、それまでの記録をまとめた論文が出ました。"}, {"t": 362.25, "x": "エルキンス＝タントンら二十二人の研究者による論文です。"}, {"t": 366.3833333333333, "x": "論文の見積もりでは、プシケの密度は"}, {"t": 368.96666666666664, "x": "水の約三・四倍から四・一倍です。"}, {"t": 371.76666666666665, "x": "ここから論文は金属の割合を見積もりました。"}, {"t": 374.9, "x": "体積の約三十パーセントから六十パーセントです。"}, {"t": 378.26666666666665, "x": "残りは鉄の少ない岩だと考えられています。"}, {"t": 381.25, "x": "すき間は多くても二十パーセントほどとされました。"}, {"t": 384.2, "x": "以前は、ほとんどが金属だという見方が強くありました。"}, {"t": 388.1333333333333, "x": "それが、半分前後が金属という見方へ変わってきたのです。"}, {"t": 392.2, "x": "NASAの資料も、いまは幅をつけて書いています。"}, {"t": 395.3833333333333, "x": "三十パーセントから六十パーセントです。"}, {"t": 398.01666666666665, "x": "プシケは、地上からはどう見えているのでしょうか。"}, {"t": 401.2, "x": "ふつうの望遠鏡では、ほとんど点にしか見えません。"}, {"t": 404.6666666666667, "x": "けれども、大気のゆらぎを打ち消す装置があります。"}, {"t": 408.0, "x": "それを使うと、形が少しだけ浮かび上がります。"}, {"t": 411.45, "x": "南米チリの山の上に、ヨーロッパ南天天文台の"}, {"t": 415.0833333333333, "x": "大型望遠鏡があります。"}, {"t": 416.73333333333335, "x": "その装置でプシケが撮られました。"}, {"t": 418.8, "x": "二〇一八年と二〇一九年の観測です。"}, {"t": 421.9166666666667, "x": "二つの年の観測を合わせて、"}, {"t": 423.9166666666667, "x": "表面のほぼ全体が覆われました。"}, {"t": 426.51666666666665, "x": "結果をまとめた論文は二〇二〇年に出ています。"}, {"t": 429.65, "x": "写っているのは、にじんだ輪郭です。"}, {"t": 432.3, "x": "表面の細かな模様までは分かりません。"}, {"t": 434.8666666666667, "x": "小さなクレーターを一つずつ数えることもできません。"}, {"t": 438.05, "x": "それでも形の特徴は読み取れました。"}, {"t": 440.6, "x": "形は楕円から少しずれていました。"}, {"t": 442.96666666666664, "x": "赤道に沿って三つの大きなくぼみがありました。"}, {"t": 445.9, "x": "密度も出ました。"}, {"t": 447.1, "x": "一立方センチメートルあたり約四・二グラムです。"}, {"t": 450.3666666666667, "x": "ただし、上下に〇・六グラムほどの幅があります。"}, {"t": 453.96666666666664, "x": "論文はこの値を、地球型の四つの"}, {"t": 456.75, "x": "惑星に次いで高いとしています。"}, {"t": 458.73333333333335, "x": "太陽系の天体の中での話です。"}, {"t": 461.25, "x": "形の平たさにも意味がありました。"}, {"t": 463.48333333333335, "x": "いまの一回転は約四・二時間です。"}, {"t": 466.06666666666666, "x": "ところが、その平たさに合うのは別の回り方でした。"}, {"t": 469.7, "x": "一回転が約三時間のときの形です。"}, {"t": 472.3833333333333, "x": "論文は、昔はもっと速く回っていたと考えました。"}, {"t": 476.18333333333334, "x": "あとから何かがぶつかって、回転が遅くなった。"}, {"t": 479.53333333333336, "x": "そのときに、くぼみもできたのかもしれない。"}, {"t": 482.4, "x": "そういう見方です。"}, {"t": 483.71666666666664, "x": "論文は、形が決まった時期に"}, {"t": 485.98333333333335, "x": "ついても二つの見方を挙げています。"}, {"t": 488.15, "x": "一つは、中がすでに冷えて固まったあとの大きな衝突です。"}, {"t": 492.1666666666667, "x": "もう一つは、中がまだとけていたころです。"}, {"t": 495.0833333333333, "x": "太陽系ができたばかりのころには、"}, {"t": 497.18333333333334, "x": "熱を出す物質がありました。"}, {"t": 499.31666666666666, "x": "アルミニウムの仲間で、短い時間で"}, {"t": 501.9, "x": "別の物質に変わっていくものです。"}, {"t": 503.98333333333335, "x": "その熱で、中がとけていた可能性があるというのです。"}, {"t": 507.6666666666667, "x": "どちらなのかも、遠くからの観測では決められません。"}, {"t": 511.18333333333334, "x": "これとは別に、立体の模型も作られています。"}, {"t": 514.55, "x": "電波と光の観測を合わせたものです。"}, {"t": 517.1, "x": "NASAの資料では、模型に"}, {"t": 519.0166666666667, "x": "クレーターのような二つのくぼみがあります。"}, {"t": 521.4166666666666, "x": "場所によって金属の多さや色が違うことも示されました。"}, {"t": 525.05, "x": "二〇二四年には、別の望遠鏡の結果も公表されました。"}, {"t": 529.4166666666666, "x": "宇宙にあるジェイムズ・ウェッブ宇宙望遠鏡です。"}, {"t": 532.2833333333333, "x": "プシケから来る赤外線を、細かく分けて調べたものです。"}, {"t": 536.2666666666667, "x": "すると、ある印が見つかりました。"}, {"t": 538.9, "x": "水素と酸素が一つずつ結びついたものの印です。"}, {"t": 542.2, "x": "印は二回の観測のどちらでも見つかりました。"}, {"t": 545.3, "x": "印の深さは四・三パーセントから六パーセントでした。"}, {"t": 548.9, "x": "一方で、水そのものの量はとても少ないとされました。"}, {"t": 552.65, "x": "上限は百万分の三十九です。"}, {"t": 555.1, "x": "金属の天体と考えられてきた表面に、なぜそれがあるのか。"}, {"t": 559.4, "x": "論文は二つの道を挙げています。"}, {"t": 561.6666666666666, "x": "一つは、水を含む天体がぶつかって"}, {"t": 564.2833333333333, "x": "外から持ち込まれた道です。"}, {"t": 566.0166666666667, "x": "もう一つは、プシケができたときから持っていた道です。"}, {"t": 569.4666666666667, "x": "どちらなのかは、まだ決まっていません。"}, {"t": 572.0, "x": "どちらの観測も、遠く離れた場所からのものです。"}, {"t": 575.45, "x": "近くで確かめた者はいません。"}, {"t": 577.45, "x": "記録を並べると、プシケの姿は"}, {"t": 579.9, "x": "少しずつ複雑になってきました。"}, {"t": 581.9333333333333, "x": "金属のかたまりという一言では、"}, {"t": 584.0166666666667, "x": "まとめられなくなっています。"}, {"t": 585.95, "x": "では、プシケはどのようにしてできたのでしょうか。"}, {"t": 588.9666666666667, "x": "その手がかりは、地球の上にもあります。"}, {"t": 591.7833333333333, "x": "隕石です。"}, {"t": 592.7166666666667, "x": "隕石は、宇宙を飛んでいた天体のかけらです。"}, {"t": 595.9666666666667, "x": "手に取って調べられる、数少ない宇宙の石です。"}, {"t": 599.3666666666667, "x": "二〇二〇年の論文は、プシケを"}, {"t": 601.8, "x": "こうした隕石と比べています。"}, {"t": 603.6166666666667, "x": "金属と岩がまじった、ある種類の隕石があります。"}, {"t": 607.2166666666667, "x": "これはプシケの密度とも光の性質とも合うとされました。"}, {"t": 610.75, "x": "パラサイトと呼ばれる隕石もあります。"}, {"t": 613.05, "x": "金属の中に緑色の鉱物が入った隕石です。"}, {"t": 616.45, "x": "その一部も合うことがあるとされています。"}, {"t": 618.9, "x": "一方で、プシケ全体の材料としては"}, {"t": 621.6333333333333, "x": "考えにくいとされた隕石もありました。"}, {"t": 624.0333333333333, "x": "石との比べ合いは、候補を消すことはできます。"}, {"t": 627.3166666666667, "x": "けれども、一つに決めることはできません。"}, {"t": 630.1166666666667, "x": "そこで、生まれ方の筋書きも並べられています。"}, {"t": 633.4166666666666, "x": "計画の公式サイトがあります。"}, {"t": 635.5, "x": "置かれているのは、カリフォルニア大学バークレー校です。"}, {"t": 639.1, "x": "その資料にあるのは、まず第2章で触れた筋書きです。"}, {"t": 642.8666666666667, "x": "岩の外側と鉄の核を持つ天体がありました。"}, {"t": 645.9666666666667, "x": "その天体が激しい衝突で外側を失いました。"}, {"t": 649.3333333333334, "x": "残ったのが核の部分だ、というものです。"}, {"t": 652.2333333333333, "x": "同じ資料は、衝突の生き残りという筋書きも挙げています。"}, {"t": 656.3166666666667, "x": "かすめるような衝突を、何度もくり返した天体です。"}, {"t": 660.1, "x": "太陽系ができたころには、こうした衝突が"}, {"t": 663.1166666666667, "x": "よく起きていたとされています。"}, {"t": 664.8, "x": "ぶつかっては離れる。"}, {"t": 666.1166666666667, "x": "そのたびに岩の部分がはがれていった、という考え方です。"}, {"t": 670.05, "x": "資料には、もう一つの道も書かれています。"}, {"t": 673.15, "x": "まだ誰も思いついていない、もっと変わった道です。"}, {"t": 676.5, "x": "答えの候補に、まだ知らない答えまで含めているのです。"}, {"t": 680.3333333333334, "x": "二〇二〇年の論文は、さらに別の見方にも触れています。"}, {"t": 684.4166666666666, "x": "プシケが一度もとけたことのない"}, {"t": 686.2, "x": "材料でできている、という見方です。"}, {"t": 688.7833333333333, "x": "とけていなければ、金属と岩は分かれていません。"}, {"t": 692.15, "x": "核という考え方そのものが当てはまらなくなります。"}, {"t": 695.3333333333334, "x": "つまり答えの候補は、一つにしぼられていません。"}, {"t": 698.6833333333333, "x": "二〇一七年の発表で、エルキンス＝"}, {"t": 701.6166666666667, "x": "タントンはこう話していました。"}, {"t": 703.7166666666667, "x": "これは、岩でも氷でもない、金属の世界を調べる機会だ。"}, {"t": 708.2333333333333, "x": "宇宙の外を訪ねることで、内側の世界を"}, {"t": 711.3666666666667, "x": "学ぶのだ、とも語っています。"}, {"t": 713.4833333333333, "x": "同じ発表で、NASAの担当者も話しました。"}, {"t": 716.7833333333333, "x": "プシケは惑星の内部をじかに見ることになる、と。"}, {"t": 720.2, "x": "計画を説明したNASAの記事もあります。"}, {"t": 722.7666666666667, "x": "その中で、エルキンス＝タントンはこうも話しています。"}, {"t": 726.8333333333334, "x": "本当のところは分からない。"}, {"t": 728.6166666666667, "x": "着くまでは何一つ確かには分からない。"}, {"t": 731.0666666666667, "x": "同じ記事で、彼女は道具の選び方にも触れています。"}, {"t": 734.7833333333333, "x": "どんなプシケを思い描いても、"}, {"t": 736.5166666666667, "x": "積んでいく道具で調べられる。"}, {"t": 738.6, "x": "そういうプシケしか、まだ誰も思いつけていない、と。"}, {"t": 742.4, "x": "金属が多くても少なくても、"}, {"t": 744.2333333333333, "x": "答えが出るように道具が選ばれたのです。"}, {"t": 747.0166666666667, "x": "どの筋書きが正しいのか。"}, {"t": 748.8166666666667, "x": "それを決めるには、近くへ行くしかありません。"}, {"t": 751.85, "x": "表面に何があるのか。"}, {"t": 753.4666666666667, "x": "重さが中でどう分かれているのか。"}, {"t": 755.6166666666667, "x": "古い磁石の性質が残っているのか。"}, {"t": 758.0833333333334, "x": "その答えを持ち帰るために、サイキの計画が始まりました。"}, {"t": 762.1833333333333, "x": "計画の資料には、確かめたい問いが並んでいます。"}, {"t": 765.6333333333333, "x": "プシケは核の名残なのか。"}, {"t": 767.4166666666666, "x": "どれくらい古いのか。"}, {"t": 768.7666666666667, "x": "地球の核と似た条件でできたのか。"}, {"t": 771.1166666666667, "x": "表面はどんな様子なのか。"}, {"t": 772.95, "x": "どの問いも、近くで見なければ答えが出ません。"}, {"t": 776.05, "x": "二〇二二年六月二十四日。"}, {"t": 778.4, "x": "NASAは、この年の打ち上げを見送ると発表しました。"}, {"t": 782.0666666666667, "x": "理由は二つの遅れでした。"}, {"t": 783.8333333333334, "x": "探査機を動かすソフトウェアの遅れです。"}, {"t": 786.3333333333334, "x": "そして、それを試すための設備の遅れです。"}, {"t": 789.5, "x": "試験の設備の中で、ソフトウェアとの"}, {"t": 792.05, "x": "相性の問題も見つかりました。"}, {"t": 793.9666666666667, "x": "問題そのものは直されました。"}, {"t": 795.95, "x": "けれども、打ち上げまでにすべてを"}, {"t": 798.2166666666667, "x": "確かめる時間が足りなかったのです。"}, {"t": 800.3333333333334, "x": "NASAの科学部門の責任者は話しました。"}, {"t": 803.0666666666667, "x": "NASAは、計画の費用と日程の約束を"}, {"t": 806.0, "x": "とても重く受け止めている。"}, {"t": 807.5333333333333, "x": "ジェット推進研究所の所長も話しました。"}, {"t": 810.3833333333333, "x": "見送りの判断は簡単ではなかったが、正しい判断だ。"}, {"t": 814.2166666666667, "x": "エルキンス＝タントンも話しています。"}, {"t": 816.8333333333334, "x": "あと少し時間が要るだけだ。"}, {"t": 818.5833333333334, "x": "これも乗り越えてみせる。"}, {"t": 820.0833333333334, "x": "この判断で何が動いたのか。"}, {"t": 822.05, "x": "それを見るには、五年さかのぼる必要があります。"}, {"t": 825.45, "x": "二〇一七年一月四日。"}, {"t": 827.5333333333333, "x": "NASAは二つの探査計画を選んだと発表しました。"}, {"t": 830.8333333333334, "x": "一つは、別の小惑星へ向かう計画です。"}, {"t": 834.0833333333334, "x": "もう一つがサイキでした。"}, {"t": 835.65, "x": "どちらもディスカバリー計画の一つです。"}, {"t": 838.1, "x": "比べると小さな予算で、太陽系を調べる計画の枠です。"}, {"t": 842.4, "x": "候補は五つありました。"}, {"t": 844.0166666666667, "x": "その中から二つが選ばれたのです。"}, {"t": 846.3166666666667, "x": "発表の時点で、開発費の上限は"}, {"t": 849.0333333333333, "x": "約四億五千万ドルとされていました。"}, {"t": 851.4666666666667, "x": "選ばれたときの予定はこうです。"}, {"t": 853.45, "x": "二〇二三年十月に打ち上げます。"}, {"t": 855.9666666666667, "x": "二〇二四年に地球のそばを通り、"}, {"t": 858.3, "x": "二〇二五年に火星のそばを通ります。"}, {"t": 861.25, "x": "そしてプシケには二〇三〇年に着きます。"}, {"t": 863.9166666666666, "x": "その後、予定は早められました。"}, {"t": 866.3833333333333, "x": "二〇二二年の八月一日から十月十一日のあいだに"}, {"t": 870.3333333333334, "x": "打ち上げる計画です。"}, {"t": 871.7, "x": "この日程なら、着くのは二〇二六年のはずでした。"}, {"t": 875.3333333333334, "x": "このころの計画では、二〇二六年一月に"}, {"t": 878.7333333333333, "x": "最初の軌道に入る予定でした。"}, {"t": 880.7333333333333, "x": "高さは約七百キロメートルです。"}, {"t": 883.0333333333333, "x": "そこから二十か月かけて高さを下げていきます。"}, {"t": 885.95, "x": "最後は、地面から約八十五キロメートルまで"}, {"t": 889.1333333333333, "x": "近づく計画でした。"}, {"t": 890.4666666666667, "x": "六月の発表は、この早めた日程を手放すものでした。"}, {"t": 894.4666666666667, "x": "次の機会として、二〇二三年と"}, {"t": 897.2333333333333, "x": "二〇二四年が挙げられました。"}, {"t": 899.1666666666666, "x": "二〇二三年なら、着くのは二〇二九年です。"}, {"t": 902.85, "x": "二〇二四年なら二〇三〇年です。"}, {"t": 905.45, "x": "同じころ、NASAは外部の専門家に"}, {"t": 908.0333333333333, "x": "よる調査の場も設けました。"}, {"t": 909.7166666666667, "x": "調査を率いたのは、元航空宇宙企業の"}, {"t": 912.8166666666667, "x": "幹部トーマス・ヤングです。"}, {"t": 914.2833333333333, "x": "報告は、遅れの一因として働き手の問題を挙げました。"}, {"t": 918.35, "x": "新型コロナの流行と結びついた問題です。"}, {"t": 921.35, "x": "ただ、それだけではないとも書いています。"}, {"t": 924.0333333333333, "x": "人の配置にも問題がありました。"}, {"t": 926.15, "x": "連絡のしかたにも、管理の目の届き方にも"}, {"t": 929.1833333333333, "x": "問題があったとされました。"}, {"t": 930.7333333333333, "x": "計画を続けるか、打ち切るか。"}, {"t": 933.2333333333333, "x": "その検討も行われました。"}, {"t": 935.15, "x": "二〇二二年十月二十八日、NASAは"}, {"t": 938.35, "x": "計画を続けると発表しました。"}, {"t": 940.4666666666667, "x": "打ち上げは二〇二三年十月です。"}, {"t": 943.0, "x": "プシケに着くのは、二〇二九年八月の予定とされました。"}, {"t": 947.2333333333333, "x": "同じロケットに乗る予定だった探査機もありました。"}, {"t": 950.1833333333333, "x": "ジェイナスという小さな探査機です。"}, {"t": 952.3, "x": "二つの小惑星が回り合う、ふたごの"}, {"t": 954.9833333333333, "x": "小惑星を調べる計画でした。"}, {"t": 957.1166666666667, "x": "その計画は、ここで切り離されて"}, {"t": 959.5833333333334, "x": "見直されることになりました。"}, {"t": 961.2833333333333, "x": "二〇二三年五月、調査の場がもう一度報告を出しました。"}, {"t": 965.75, "x": "それまでの取り組みは、期待を上回ったという内容でした。"}, {"t": 969.6833333333333, "x": "六月の見送りで、着く年は三年遅れたことになります。"}, {"t": 973.75, "x": "はじめの予定と比べれば、一年早い年です。"}, {"t": 977.15, "x": "この回を作った時点でも、到着は"}, {"t": 979.7166666666667, "x": "二〇二九年の予定のままです。"}, {"t": 981.9333333333333, "x": "二〇二三年の打ち上げの期間は、"}, {"t": 984.25, "x": "十月五日から二十五日まででした。"}, {"t": 986.9833333333333, "x": "はじめは十月十二日が予定されていました。"}, {"t": 989.9333333333333, "x": "けれども天気が悪く、一日遅らせることになりました。"}, {"t": 993.9166666666666, "x": "二〇二三年十月十三日、アメリカ東部の"}, {"t": 997.4833333333333, "x": "時間で午前十時十九分。"}, {"t": 999.3333333333334, "x": "フロリダ州のケネディ宇宙センターです。"}, {"t": 1001.6833333333333, "x": "ファルコン・ヘビーというロケットが打ち上げられました。"}, {"t": 1004.5166666666667, "x": "先端にはサイキが載っていました。"}, {"t": 1006.6, "x": "ロケットまで含めた重さは、約百四十三万キログラムです。"}, {"t": 1010.9166666666666, "x": "その九十九パーセント以上はロケットでした。"}, {"t": 1013.7833333333333, "x": "サイキだけの重さは、最大で"}, {"t": 1015.9666666666667, "x": "約二千七百四十七キログラムです。"}, {"t": 1018.5666666666667, "x": "推進剤を除くと約千六百十六キログラムでした。"}, {"t": 1022.1833333333333, "x": "探査機の本体は、地球を回る"}, {"t": 1024.6, "x": "衛星の仕組みをもとに作られています。"}, {"t": 1026.9333333333334, "x": "作ったのは、カリフォルニア州"}, {"t": 1028.9666666666667, "x": "パロアルトにあるマクサー社の部門です。"}, {"t": 1031.2, "x": "その仕組みは、地球のまわりで"}, {"t": 1033.2666666666667, "x": "三十年以上使われてきたものでした。"}, {"t": 1035.6666666666667, "x": "頭脳にあたる計算機もあります。"}, {"t": 1037.7166666666667, "x": "これとソフトウェアは、ジェット推進研究所が"}, {"t": 1040.7166666666667, "x": "用意しました。"}, {"t": 1041.6, "x": "本体の高さは二本の腕を含めて約四・九メートルあります。"}, {"t": 1045.7, "x": "腕の長さは、それぞれ約二メートルです。"}, {"t": 1048.6333333333334, "x": "腕の先には観測の装置が取りつけられています。"}, {"t": 1051.7666666666667, "x": "本体の両側には太陽電池の翼があります。"}, {"t": 1054.9333333333334, "x": "翼は五枚ずつのパネルでできています。"}, {"t": 1057.45, "x": "広げると、端から端まで約二十四・八メートルです。"}, {"t": 1061.4666666666667, "x": "NASAは、テニスコートを"}, {"t": 1063.1, "x": "ほとんど覆う大きさだと説明しています。"}, {"t": 1065.6, "x": "翼の面積は、二枚合わせて約七十五平方メートルです。"}, {"t": 1070.0333333333333, "x": "並んだ電池の数は二万二千七百三十個にのぼります。"}, {"t": 1073.7833333333333, "x": "電気は、地球の近くでは約二十一キロワットつくれます。"}, {"t": 1077.8, "x": "けれども、プシケのそばでは"}, {"t": 1079.6166666666666, "x": "約二・三キロワットに減ります。"}, {"t": 1081.75, "x": "太陽から遠く、光が弱くなるからです。"}, {"t": 1084.9666666666667, "x": "本体のあちこちには、約三百の"}, {"t": 1087.4833333333333, "x": "温度の計測器がついています。"}, {"t": 1089.3333333333333, "x": "地球との連絡には、直径二メートルのアンテナを使います。"}, {"t": 1093.3666666666666, "x": "旅のあいだは、地球の大きなアンテナと連絡をとります。"}, {"t": 1097.15, "x": "少なくとも週に一度です。"}, {"t": 1098.9666666666667, "x": "この電気で動くのが、序章の青い光です。"}, {"t": 1102.1666666666667, "x": "ホール効果推進機と呼ばれる装置が四つ積まれています。"}, {"t": 1105.7, "x": "使うのは一度に一つだけです。"}, {"t": 1107.7166666666667, "x": "四つは二つずつ組になっています。"}, {"t": 1109.9166666666667, "x": "一つの力は最大で二百四十ミリニュートンです。"}, {"t": 1113.2333333333333, "x": "NASAは、単三電池一本を手のひらに"}, {"t": 1115.95, "x": "のせたくらいの力だと説明しています。"}, {"t": 1118.3666666666666, "x": "この種類の推進機は、地球の"}, {"t": 1120.7, "x": "まわりの衛星で使われてきました。"}, {"t": 1122.8166666666666, "x": "月の軌道より遠くで使うのは、サイキが初めてです。"}, {"t": 1126.4833333333333, "x": "燃料のキセノンは約千八十五キログラムです。"}, {"t": 1129.6166666666666, "x": "七つのタンクに分けて積まれました。"}, {"t": 1131.7666666666667, "x": "それまでのどの探査機よりも多い量だとされています。"}, {"t": 1134.9, "x": "使う量は一日に〇・三五キログラムから"}, {"t": 1137.8333333333333, "x": "一・三キログラムです。"}, {"t": 1139.3, "x": "青い光の推進機のほかに、小さな噴射口も十二個あります。"}, {"t": 1143.7666666666667, "x": "こちらは窒素の気体を吹き出すだけの簡単なものです。"}, {"t": 1147.1, "x": "探査機の向きを整えるときや、予備として使います。"}, {"t": 1150.6666666666667, "x": "窒素は三つのタンクに約四十六キログラム積まれています。"}, {"t": 1154.35, "x": "二〇二四年五月、NASAは"}, {"t": 1156.6333333333334, "x": "推進機が本格的に動き出したと伝えました。"}, {"t": 1159.5833333333333, "x": "このとき、地球からの距離は"}, {"t": 1161.6666666666667, "x": "三億キロメートルを超えていました。"}, {"t": 1163.7666666666667, "x": "地球に対する速さは秒速約三十七キロメートルでした。"}, {"t": 1167.6666666666667, "x": "最終的には、時速約二十万キロメートルに"}, {"t": 1170.9666666666667, "x": "達するとされています。"}, {"t": 1172.3, "x": "計画の責任者は、推進機はすばらしく"}, {"t": 1175.2833333333333, "x": "働いていると話しました。"}, {"t": 1176.9, "x": "ただ、旅は順調なことばかりではありませんでした。"}, {"t": 1180.35, "x": "二〇二五年四月一日のことです。"}, {"t": 1182.95, "x": "キセノンを推進機へ送る管の中で、圧力が下がりました。"}, {"t": 1187.1166666666666, "x": "一平方インチあたり三十六ポンドから、"}, {"t": 1189.6833333333334, "x": "約二十六ポンドへの低下です。"}, {"t": 1192.05, "x": "探査機は自分で推進機を止めました。"}, {"t": 1194.5333333333333, "x": "地球から遠く離れた場所で起きたことです。"}, {"t": 1197.2666666666667, "x": "人が直しに行くことはできません。"}, {"t": 1199.3666666666666, "x": "地上のチームが、試験と分析を重ねて原因を探しました。"}, {"t": 1203.6166666666666, "x": "調べた結果、原因は主な管の弁の不具合と見られました。"}, {"t": 1207.8666666666666, "x": "五月の終わり、運用チームは予備の管に切り替えました。"}, {"t": 1211.7333333333333, "x": "主な管とまったく同じ造りの管です。"}, {"t": 1214.3, "x": "予備の管の弁は、開いたままにしておくことにしました。"}, {"t": 1217.8333333333333, "x": "動く部分で、また不具合が起きないようにするためです。"}, {"t": 1221.5, "x": "二〇二五年六月十六日、サイキは"}, {"t": 1224.65, "x": "休まず吹かす運転に戻りました。"}, {"t": 1226.7666666666667, "x": "二〇二六年五月の火星への接近にも、"}, {"t": 1229.65, "x": "これで間に合うとされました。"}, {"t": 1231.5666666666666, "x": "サイキには、別の役目を持つ装置も積まれていました。"}, {"t": 1235.2833333333333, "x": "光で通信する実験の装置です。"}, {"t": 1237.7166666666667, "x": "ふだん探査機は電波で地球と話します。"}, {"t": 1240.3166666666666, "x": "これをレーザーの光に置きかえる。"}, {"t": 1242.3833333333334, "x": "そうすれば、一度にずっと多くの"}, {"t": 1244.7166666666667, "x": "情報を送れるのではないか。"}, {"t": 1246.4833333333333, "x": "それを月より遠くで試す実験でした。"}, {"t": 1249.05, "x": "地上の受け手は二か所でした。"}, {"t": 1250.8833333333334, "x": "一つはカリフォルニア州のパロマー天文台です。"}, {"t": 1253.8666666666666, "x": "口径五メートルあまりの望遠鏡で、"}, {"t": 1256.2, "x": "探査機からの光を受け取ります。"}, {"t": 1258.5333333333333, "x": "もう一つはテーブルマウンテンの施設です。"}, {"t": 1261.05, "x": "ここから三キロワットのレーザーを"}, {"t": 1262.9166666666667, "x": "探査機へ向けて送ります。"}, {"t": 1264.5666666666666, "x": "装置が初めて地上と光をやりとりしたのは、"}, {"t": 1267.3833333333334, "x": "二〇二三年十一月十四日です。"}, {"t": 1270.35, "x": "そして二〇二三年十二月十一日。"}, {"t": 1273.3, "x": "約三千万キロメートル離れたところから、"}, {"t": 1275.8833333333334, "x": "一本の動画が届きました。"}, {"t": 1278.0, "x": "地球と月の距離の約八十倍です。"}, {"t": 1280.5, "x": "動画の長さは十五秒でした。"}, {"t": 1282.5666666666666, "x": "映っていたのは、オレンジ色のしま模様の猫です。"}, {"t": 1285.95, "x": "レーザーの光の点を追いかけています。"}, {"t": 1288.3, "x": "名前はテイターズ。"}, {"t": 1289.6, "x": "ジェット推進研究所で働く人の飼い猫です。"}, {"t": 1292.75, "x": "動画には、サイキの軌道の図が重ねてありました。"}, {"t": 1296.05, "x": "パロマー天文台の建物の絵もありました。"}, {"t": 1298.7666666666667, "x": "猫の心拍数や毛の色、種類まで書き込まれていました。"}, {"t": 1302.7166666666667, "x": "この動画は、打ち上げの前に"}, {"t": 1304.8166666666666, "x": "探査機に入れておいたものです。"}, {"t": 1306.6166666666666, "x": "宇宙で撮ったものではありません。"}, {"t": 1308.5333333333333, "x": "信号が地球に届くまでに、百一秒かかりました。"}, {"t": 1312.3333333333333, "x": "速さは最大で一秒あたり二百六十七メガビットです。"}, {"t": 1316.1166666666666, "x": "パロマーで受け取った信号は、"}, {"t": 1317.8666666666666, "x": "ジェット推進研究所へ送られました。"}, {"t": 1320.6333333333334, "x": "そこで動画は、届いたそばから再生されました。"}, {"t": 1323.9666666666667, "x": "二〇二四年四月には、サイキ本体の"}, {"t": 1326.8833333333334, "x": "情報もこの装置で送られました。"}, {"t": 1328.9833333333333, "x": "距離は約二億二千六百万キロメートルでした。"}, {"t": 1332.0666666666666, "x": "二〇二四年十二月三日には、"}, {"t": 1334.2833333333333, "x": "さらに遠くとの通信が行われました。"}, {"t": 1337.0833333333333, "x": "距離は約四億九千万キロメートルです。"}, {"t": 1339.85, "x": "そして二〇二五年九月、実験は終わりました。"}, {"t": 1343.4333333333334, "x": "六十五回目の通信が最後でした。"}, {"t": 1345.9, "x": "最後の通信のときの距離は、"}, {"t": 1347.7666666666667, "x": "約三億五千万キロメートルです。"}, {"t": 1350.3666666666666, "x": "サイキから受け取った情報は、"}, {"t": 1352.05, "x": "全部で十三・六テラビットになりました。"}, {"t": 1355.0333333333333, "x": "NASAは、実験が技術の目標を"}, {"t": 1357.4333333333334, "x": "すべて上回ったとしています。"}, {"t": 1359.1666666666667, "x": "この実験の開発と運用には、"}, {"t": 1361.1833333333334, "x": "約二億六百万ドルがかかりました。"}, {"t": 1363.8666666666666, "x": "サイキの計画全体とは別の、"}, {"t": 1365.9166666666667, "x": "技術の実験として行われたものです。"}, {"t": 1368.7666666666667, "x": "光で遠くまで情報を届けられることが確かめられました。"}, {"t": 1372.3833333333334, "x": "けれども、届いた映像の中にプシケの姿はありません。"}, {"t": 1376.2, "x": "サイキの目は、まだ目的地をとらえていないのです。"}, {"t": 1379.5833333333333, "x": "サイキの目は二台のカメラです。"}, {"t": 1381.55, "x": "二台はまったく同じ造りです。"}, {"t": 1383.5833333333333, "x": "いくつかの色のフィルターを"}, {"t": 1385.0, "x": "切りかえて撮ることができます。"}, {"t": 1386.75, "x": "カメラの運用はアリゾナ州立大学が担っています。"}, {"t": 1390.0166666666667, "x": "設計と製造には、マリン宇宙科学システムズという"}, {"t": 1393.6166666666666, "x": "会社が加わりました。"}, {"t": 1395.0166666666667, "x": "カメラが初めて光をとらえたのは、"}, {"t": 1397.1166666666666, "x": "二〇二三年十二月四日です。"}, {"t": 1399.7666666666667, "x": "撮ったのは、うお座の星の並びでした。"}, {"t": 1402.5, "x": "二台合わせて六十八枚です。"}, {"t": 1404.65, "x": "このときの地球からの距離は、"}, {"t": 1406.3833333333334, "x": "約二千六百万キロメートルでした。"}, {"t": 1409.1, "x": "カメラの責任者はジム・ベルです。"}, {"t": 1411.2, "x": "彼は、この最初の画像は幕開けにすぎないと話しています。"}, {"t": 1415.2166666666667, "x": "ほかの装置も、少しずつ目を覚ましていきました。"}, {"t": 1418.5, "x": "磁場を測る装置は、二〇二三年十月の"}, {"t": 1421.8, "x": "終わりに電源が入りました。"}, {"t": 1423.4666666666667, "x": "その直後、太陽から吹き出した"}, {"t": 1425.7666666666667, "x": "ガスのかたまりをとらえました。"}, {"t": 1427.45, "x": "装置がとても弱い磁場まで測れることが確かめられました。"}, {"t": 1430.9666666666667, "x": "探査機そのものが、磁場の面で"}, {"t": 1433.0833333333333, "x": "静かなことも確かめられました。"}, {"t": 1435.0166666666667, "x": "ガンマ線を数える部分も、このころ電源が入りました。"}, {"t": 1438.8833333333334, "x": "中性子を数える部分は、十二月の"}, {"t": 1441.7, "x": "半ばに電源が入る予定でした。"}, {"t": 1443.7666666666667, "x": "二〇二五年七月二十日と二十三日。"}, {"t": 1446.7333333333333, "x": "カメラは、うしろをふり返るように地球と月を撮りました。"}, {"t": 1450.5833333333333, "x": "距離は約二億九千万キロメートルです。"}, {"t": 1453.2666666666667, "x": "主な画像は一台目のカメラで撮りました。"}, {"t": 1455.9, "x": "予備の二台目のカメラでも撮っています。"}, {"t": 1458.2333333333333, "x": "長い時間をかけて光を集めた画像です。"}, {"t": 1461.0166666666667, "x": "その中で、地球と月はおひつじ座の星の中の点でした。"}, {"t": 1465.05, "x": "小さな点が二つ並んでいるだけです。"}, {"t": 1467.4333333333334, "x": "地球から見れば、プシケは点です。"}, {"t": 1469.9333333333334, "x": "プシケへ向かう探査機から見ても、地球は点でした。"}, {"t": 1473.35, "x": "この撮影は、カメラの調子を確かめるためのものでした。"}, {"t": 1477.1833333333334, "x": "調子がずれていないかを、時間をおいて比べるのです。"}, {"t": 1480.7166666666667, "x": "地球も月も、太陽の光を跳ね返して光っています。"}, {"t": 1484.5333333333333, "x": "その点はプシケと同じです。"}, {"t": 1486.4166666666667, "x": "だから点検の相手に選ばれました。"}, {"t": 1488.6833333333334, "x": "そして二〇二六年五月。"}, {"t": 1490.75, "x": "サイキは火星に近づきました。"}, {"t": 1492.7333333333333, "x": "五月三日には、約四百八十万キロメートル先から"}, {"t": 1496.5666666666666, "x": "火星を撮っています。"}, {"t": 1497.7833333333333, "x": "火星のそばを通るときの速さも見込まれていました。"}, {"t": 1500.9166666666667, "x": "時速約一万九千八百キロメートルです。"}, {"t": 1503.9, "x": "最も近づいたのは五月十五日です。"}, {"t": 1506.5166666666667, "x": "火星の地面から約四千六百九キロメートルのところを"}, {"t": 1510.1, "x": "通りました。"}, {"t": 1510.8666666666666, "x": "この接近には目的がありました。"}, {"t": 1513.05, "x": "燃料を使わずに、向きと速さを変えることです。"}, {"t": 1516.45, "x": "火星の引力を借りて、サイキは"}, {"t": 1518.75, "x": "時速約千六百キロメートル速くなりました。"}, {"t": 1521.6166666666666, "x": "太陽を回る軌道の面も、約一度傾きました。"}, {"t": 1525.25, "x": "この一度がプシケへの道筋をつくります。"}, {"t": 1527.8833333333334, "x": "すれちがう前後に、カメラは火星を撮り続けました。"}, {"t": 1531.4, "x": "カメラの責任者は、数千枚を撮ったと話しています。"}, {"t": 1535.0666666666666, "x": "細い三日月の形の火星がありました。"}, {"t": 1537.6833333333334, "x": "ほぼ丸く満ちた火星もありました。"}, {"t": 1539.8333333333333, "x": "氷の多い南極の白い部分は、端から"}, {"t": 1542.8, "x": "端まで七百キロメートル以上あります。"}, {"t": 1545.2, "x": "直径約四百七十キロメートルの"}, {"t": 1547.5333333333333, "x": "ホイヘンス・クレーターも写りました。"}, {"t": 1549.4833333333333, "x": "風が地面に残したすじの模様もありました。"}, {"t": 1552.2666666666667, "x": "長さは約五十キロメートルです。"}, {"t": 1554.4833333333333, "x": "こうした撮影は、カメラの調子を"}, {"t": 1556.9333333333334, "x": "合わせる練習にもなります。"}, {"t": 1558.6, "x": "火星を撮ることは、接近のあとも"}, {"t": 1560.9833333333333, "x": "月末まで続ける予定とされました。"}, {"t": 1563.2666666666667, "x": "エルキンス＝タントンは、赤い"}, {"t": 1565.7666666666667, "x": "惑星に感謝できると話しました。"}, {"t": 1567.8666666666666, "x": "さらに遠くへ投げ出してくれる力を"}, {"t": 1570.0, "x": "もらえたから、という意味です。"}, {"t": 1572.0, "x": "けれども、本番の相手のプシケはまだ写っていません。"}, {"t": 1575.5333333333333, "x": "火星を過ぎたサイキは、再び推進機を吹かしています。"}, {"t": 1579.3666666666666, "x": "向かう先は小惑星の帯です。"}, {"t": 1581.5333333333333, "x": "航法の責任者はドン・ハンです。"}, {"t": 1583.65, "x": "彼は、二〇二九年の夏に着く道筋に乗ったと話しました。"}, {"t": 1588.0666666666666, "x": "ここからは、まだ起きていない予定の話です。"}, {"t": 1591.2, "x": "先に、サイキが何を持っていくのかを見ておきます。"}, {"t": 1594.6333333333334, "x": "積んでいる道具は大きく四つです。"}, {"t": 1596.8166666666666, "x": "それぞれが、違う面からプシケを調べます。"}, {"t": 1599.9166666666667, "x": "色と形。"}, {"t": 1600.9, "x": "元素。"}, {"t": 1602.0166666666667, "x": "磁場。"}, {"t": 1603.1333333333334, "x": "そして重さです。"}, {"t": 1604.3666666666666, "x": "色と形を受け持つのは、第8章のカメラです。"}, {"t": 1607.85, "x": "見える光と、それより少し波長の長い光で表面を写します。"}, {"t": 1612.3666666666666, "x": "元素を受け持つのは、ガンマ線と中性子を数える装置です。"}, {"t": 1616.5666666666666, "x": "ジョンズ・ホプキンス大学の"}, {"t": 1618.0666666666666, "x": "応用物理研究所が手がけました。"}, {"t": 1620.2333333333333, "x": "宇宙から飛んでくる粒が表面に当たります。"}, {"t": 1622.95, "x": "すると、表面からガンマ線や中性子が出ます。"}, {"t": 1626.3666666666666, "x": "それを数えると、表面にどんな元素が"}, {"t": 1629.25, "x": "あるのかが分かります。"}, {"t": 1630.4666666666667, "x": "鉄やニッケルがどれだけあるのか。"}, {"t": 1632.55, "x": "その答えに、いちばん直接つながる道具です。"}, {"t": 1635.8833333333334, "x": "磁場を受け持つのは、磁場を測る装置です。"}, {"t": 1638.9166666666667, "x": "地球のような惑星は、とけた"}, {"t": 1641.0833333333333, "x": "金属の核の中で磁場をつくります。"}, {"t": 1643.4, "x": "けれども、小惑星は冷えて固まっているので"}, {"t": 1646.45, "x": "磁場をつくりません。"}, {"t": 1647.5666666666666, "x": "もしプシケに古い磁場の名残が見つかれば。"}, {"t": 1650.1166666666666, "x": "それは、プシケが惑星の核からできたことの"}, {"t": 1653.1166666666666, "x": "強い証拠になるとされています。"}, {"t": 1655.0833333333333, "x": "重さを受け持つのは、道具というより電波の使い方です。"}, {"t": 1658.9666666666667, "x": "地球と探査機は電波をやりとりします。"}, {"t": 1661.4666666666667, "x": "地球の側で受けるのは、直径三十四メートルの"}, {"t": 1664.9666666666667, "x": "大きなアンテナです。"}, {"t": 1666.0666666666666, "x": "その電波のわずかな変化を測ります。"}, {"t": 1668.4833333333333, "x": "そこから、プシケの重さや回り方が分かります。"}, {"t": 1671.75, "x": "重さのかたよりも分かります。"}, {"t": 1673.5833333333333, "x": "中で重さがどう分かれているのか。"}, {"t": 1675.7833333333333, "x": "それが分かれば手がかりになります。"}, {"t": 1677.9, "x": "中心に重い金属が集まっているかどうかの手がかりです。"}, {"t": 1681.4333333333334, "x": "この四つを持って、サイキは"}, {"t": 1683.4666666666667, "x": "プシケのまわりを下りていきます。"}, {"t": 1685.2333333333333, "x": "NASAの日程では、引力にとらえられるのは"}, {"t": 1688.1166666666666, "x": "二〇二九年七月の終わりごろです。"}, {"t": 1690.7, "x": "本格的な観測は二〇二九年八月からの予定です。"}, {"t": 1694.65, "x": "終わりは二〇三一年十一月とされています。"}, {"t": 1697.9, "x": "サイキは、高さの違ういくつかの軌道を順番に回ります。"}, {"t": 1701.8666666666666, "x": "軌道には、高いほうからAから"}, {"t": 1704.1333333333334, "x": "Dまでの記号がつけられています。"}, {"t": 1706.1333333333334, "x": "ただし、回る順番は記号の順ではありません。"}, {"t": 1709.5, "x": "最初の軌道Aは、地面から約七百九キロメートルの"}, {"t": 1713.4, "x": "高さです。"}, {"t": 1714.1, "x": "ここに約五十六日とどまります。"}, {"t": 1716.3833333333334, "x": "表面の地図づくりを始めます。"}, {"t": 1718.4666666666667, "x": "磁場と重さの測定も始めます。"}, {"t": 1720.6333333333334, "x": "そこから十七日かけて、高さ"}, {"t": 1722.9666666666667, "x": "約三百三キロメートルまで下ります。"}, {"t": 1725.3, "x": "この軌道は軌道B1と呼ばれます。"}, {"t": 1727.6166666666666, "x": "約九十二日回って、二〇三〇年一月の終わりまで続きます。"}, {"t": 1732.4666666666667, "x": "いちばん低い軌道Dは、地面から"}, {"t": 1734.9166666666667, "x": "七十五キロメートル以内です。"}, {"t": 1736.7833333333333, "x": "二〇三〇年五月ごろから、約百日この高さを回る予定です。"}, {"t": 1741.4666666666667, "x": "そのあと、高さを上げた軌道も回ります。"}, {"t": 1744.5, "x": "高さ約百九十キロメートルの軌道Cです。"}, {"t": 1747.4833333333333, "x": "移るのは、二〇三一年一月の半ばの予定です。"}, {"t": 1751.4833333333333, "x": "最後は、再び高さ約三百三キロメートルの軌道を回ります。"}, {"t": 1755.95, "x": "こちらは軌道B2と呼ばれ、約百日の予定です。"}, {"t": 1759.55, "x": "プシケのそばでつくれる電気は、"}, {"t": 1761.3666666666666, "x": "地球の近くの十分の一ほどです。"}, {"t": 1764.0166666666667, "x": "その電気で、推進機も装置も動かすことになります。"}, {"t": 1767.7333333333333, "x": "NASAは、この計画を初めての試みだとしています。"}, {"t": 1771.3666666666666, "x": "表面に金属を多く含む小惑星を調べる計画です。"}, {"t": 1775.2333333333333, "x": "計画全体の費用は約十二億ドルと見積もられています。"}, {"t": 1778.95, "x": "旅の長さは約三十六億キロメートルです。"}, {"t": 1781.9666666666667, "x": "かかる時間は六年近くです。"}, {"t": 1784.0333333333333, "x": "その途中で、火星のそばを一度通ります。"}, {"t": 1787.1166666666666, "x": "それはもう済みました。"}, {"t": 1788.55, "x": "軌道Aで地図づくりが始まります。"}, {"t": 1790.8333333333333, "x": "そのとき初めて、プシケは地面を"}, {"t": 1793.2166666666667, "x": "持つ場所として記録される予定です。"}, {"t": 1795.3166666666666, "x": "一八五二年に見つかった十六番目の小惑星。"}, {"t": 1799.0666666666666, "x": "それから百七十年あまり、分かったことは"}, {"t": 1802.0666666666666, "x": "すべて遠くからの記録です。"}, {"t": 1803.7666666666667, "x": "跳ね返った光と電波。"}, {"t": 1805.4666666666667, "x": "近くを通る天体の動き。"}, {"t": 1807.4, "x": "にじんだ輪郭。"}, {"t": 1808.5666666666666, "x": "赤外線の小さな印。"}, {"t": 1810.5, "x": "二〇二三年の秋に出発した探査機は、"}, {"t": 1813.3, "x": "三年近くで火星のそばまで来ました。"}, {"t": 1816.0166666666667, "x": "そこから先も、三年あまりの道のりがあります。"}, {"t": 1819.3833333333334, "x": "着いたあとも、いちばん低い軌道まで"}, {"t": 1821.85, "x": "下りるのには時間がかかります。"}, {"t": 1823.6833333333334, "x": "予定では、最初の軌道に入ってから九か月ほどあとです。"}, {"t": 1827.7, "x": "その間に、表面の地図が少しずつ"}, {"t": 1830.4, "x": "埋まっていくことになります。"}, {"t": 1831.8666666666666, "x": "そこから一つの見積もりが出ました。"}, {"t": 1834.0166666666667, "x": "金属は体積の三十パーセントから六十パーセント。"}, {"t": 1837.55, "x": "核の名残かもしれない。"}, {"t": 1839.1666666666667, "x": "一度もとけたことのない材料かもしれない。"}, {"t": 1841.7833333333333, "x": "まだ誰も思いついていない道かもしれない。"}, {"t": 1844.3666666666666, "x": "サイキの計画を率いるエルキンス＝"}, {"t": 1846.6, "x": "タントンは、こう話しています。"}, {"t": 1849.15, "x": "何が見つかるのかは分からない。"}, {"t": 1851.1, "x": "すっかり驚かされることになると思っている。"}, {"t": 1853.7833333333333, "x": "二〇二九年の夏、サイキは驚かされる準備を"}, {"t": 1857.4666666666667, "x": "してプシケに着く予定です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
