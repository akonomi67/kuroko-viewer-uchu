<script>
const D={"name": "ep016", "file": "ep016", "dur": 1964.5333125, "segs": [], "subs": [{"t": 0.0, "x": "地球のまわりを、いまも回り続けている"}, {"t": 2.716666666666667, "x": "小さな球があります。"}, {"t": 4.05, "x": "直径は十六センチメートルあまり。"}, {"t": 6.35, "x": "片手に乗るほどの大きさです。"}, {"t": 8.233333333333333, "x": "打ち上げられたのは、一九五八年三月十七日。"}, {"t": 12.566666666666666, "x": "それから、六十八年が過ぎました。"}, {"t": 15.3, "x": "この球は、一九六〇年代のなかばに"}, {"t": 18.5, "x": "電波を出さなくなりました。"}, {"t": 20.083333333333332, "x": "それでも、落ちてきていません。"}, {"t": 22.25, "x": "いまも、一日に十周あまり、地球のまわりを回っています。"}, {"t": 26.733333333333334, "x": "名前は、ヴァンガード一号。"}, {"t": 28.85, "x": "人類が打ち上げた人工衛星のうち、いまも軌道に"}, {"t": 32.46666666666667, "x": "残っているものの中で、最も古いものです。"}, {"t": 35.53333333333333, "x": "追跡の目録で、この球より前の番号が"}, {"t": 38.733333333333334, "x": "付いている物は、四つしかありません。"}, {"t": 41.2, "x": "その四つには、どれも、落ちた日付が書き込まれています。"}, {"t": 45.3, "x": "この球の欄にだけ、その日付がありません。"}, {"t": 48.3, "x": "一緒に軌道に乗ったロケットの三段目の筒も、同じです。"}, {"t": 52.25, "x": "打ち上げから六十八年、球と筒は、別々の軌道に"}, {"t": 56.43333333333333, "x": "分かれながら、どちらもまだ回っています。"}, {"t": 59.083333333333336, "x": "地球のまわりには、もう一つ、人が"}, {"t": 62.0, "x": "意図して物を置いてきた場所があります。"}, {"t": 64.05, "x": "赤道の真上、高さ三万五千七百八十六キロメートルの"}, {"t": 68.36666666666666, "x": "静止軌道。"}, {"t": 69.13333333333334, "x": "そのさらに上に、役目を終えた衛星を"}, {"t": 71.93333333333334, "x": "送り上げる高さがあります。"}, {"t": 73.6, "x": "そこは、墓場軌道と呼ばれています。"}, {"t": 76.23333333333333, "x": "落ちてこないように作ったわけではないのに、"}, {"t": 78.65, "x": "落ちてこない球。"}, {"t": 80.0, "x": "落とすことができないので、"}, {"t": 81.43333333333334, "x": "最後の燃料で上へ送られる衛星たち。"}, {"t": 84.48333333333333, "x": "この回では、地球のまわりに置かれたまま"}, {"t": 87.16666666666667, "x": "回り続けている、この二つの記録を読んでいきます。"}, {"t": 90.63333333333334, "x": "一九五七年十月四日、ソビエト連邦が、最初の"}, {"t": 95.35, "x": "人工衛星スプートニク一号を打ち上げました。"}, {"t": 98.31666666666666, "x": "ひと月後の十一月三日には、スプートニク二号が続きます。"}, {"t": 102.56666666666666, "x": "そのころアメリカでは、別の計画が進んでいました。"}, {"t": 106.16666666666667, "x": "国際地球観測年という、世界の科学者が"}, {"t": 109.45, "x": "協力して地球を調べる期間がありました。"}, {"t": 112.08333333333333, "x": "そのあいだに、人工衛星を一つ、軌道に乗せる。"}, {"t": 116.05, "x": "それが計画の目的でした。"}, {"t": 117.98333333333333, "x": "計画の名前は、ヴァンガード計画。"}, {"t": 120.63333333333334, "x": "中心になったのは、アメリカ海軍の研究所です。"}, {"t": 124.16666666666667, "x": "計画の責任者たちが、最初の軌道投入に"}, {"t": 127.4, "x": "使うつもりでいた衛星は、直径二十インチの球でした。"}, {"t": 131.2, "x": "およそ五十一センチメートル。"}, {"t": 133.13333333333333, "x": "重さは二十一・五ポンド、約九・八キログラムです。"}, {"t": 137.15, "x": "ところが研究所の技術者たちは、"}, {"t": 139.23333333333332, "x": "それよりずっと小さな球を作りました。"}, {"t": 141.91666666666666, "x": "直径六・四インチ。"}, {"t": 143.56666666666666, "x": "およそ十六センチメートルです。"}, {"t": 145.6, "x": "重さは、二キログラムに満たないものでした。"}, {"t": 148.55, "x": "開発の記録には、この小さな球が「グレープフルーツ」と"}, {"t": 153.18333333333334, "x": "呼ばれていたことが書かれています。"}, {"t": 155.03333333333333, "x": "なぜ小さな球に切り替えたのか。"}, {"t": 157.15, "x": "開発の歴史をまとめた本は、公式の記録には"}, {"t": 160.6, "x": "理由が残っていない、と書いています。"}, {"t": 163.06666666666666, "x": "当事者の記憶から語られているだけです。"}, {"t": 165.58333333333334, "x": "記録に残っているのは、この球を"}, {"t": 167.95, "x": "載せる打ち上げの目的です。"}, {"t": 169.7, "x": "上空の空気の濃さと、地球の形を調べること。"}, {"t": 173.41666666666666, "x": "衛星の熱の設計を確かめること。"}, {"t": 175.91666666666666, "x": "そして、太陽電池が軌道の上で"}, {"t": 178.38333333333333, "x": "どれだけもつかを確かめることでした。"}, {"t": 180.5, "x": "中身は、ごく簡単なものでした。"}, {"t": 182.98333333333332, "x": "二つの送信機と、殻の温度を測る二つの小さな温度計。"}, {"t": 187.23333333333332, "x": "載っていたのは、それだけです。"}, {"t": 189.35, "x": "殻の外側には、六枚の太陽電池が付けられました。"}, {"t": 193.2, "x": "一九五七年十二月六日、このグレープフルーツを"}, {"t": 197.35, "x": "載せた最初の打ち上げが行われました。"}, {"t": 199.7, "x": "ロケットは発射台を離れてすぐ、推力を失いました。"}, {"t": 203.56666666666666, "x": "浮き上がった高さは、およそ四フィート、"}, {"t": 206.18333333333334, "x": "一メートルあまり。"}, {"t": 207.7, "x": "機体は台の上に崩れ落ち、爆発しました。"}, {"t": 211.01666666666668, "x": "翌年の二月五日、同じ形のロケットで二回目が行われます。"}, {"t": 215.65, "x": "五十七秒のあいだは正常に飛びましたが、"}, {"t": 218.31666666666666, "x": "姿勢を保てなくなり、機体は壊れました。"}, {"t": 221.65, "x": "そのあいだの一九五八年二月一日、陸軍のチームが"}, {"t": 226.16666666666666, "x": "打ち上げたエクスプローラー一号が、軌道に乗りました。"}, {"t": 229.63333333333333, "x": "アメリカで最初の人工衛星は、"}, {"t": 231.78333333333333, "x": "ヴァンガードではありませんでした。"}, {"t": 233.88333333333333, "x": "グレープフルーツは、まだ地上にありました。"}, {"t": 236.76666666666668, "x": "三回目の打ち上げは、一九五八年三月十七日でした。"}, {"t": 241.61666666666667, "x": "場所は、フロリダ州のケープカナベラル。"}, {"t": 244.33333333333334, "x": "現地の時刻で、朝の七時十五分四十一秒です。"}, {"t": 248.31666666666666, "x": "開発の歴史をまとめた本によれば、"}, {"t": 250.61666666666667, "x": "その日はよく晴れていました。"}, {"t": 252.58333333333334, "x": "空には、小さな白い雲が浮かんでいたとあります。"}, {"t": 256.03333333333336, "x": "点火のあと、ロケットはなかなか動き出しませんでした。"}, {"t": 259.6666666666667, "x": "発射台ごと持ち上げてしまいそうになってから、"}, {"t": 262.31666666666666, "x": "ようやく上がっていきました。"}, {"t": 264.18333333333334, "x": "百五十秒後、二段目が切り離されます。"}, {"t": 267.31666666666666, "x": "四百九十秒後、三段目が切り離されました。"}, {"t": 270.8833333333333, "x": "ただ、切り離しがうまくいっても、"}, {"t": 273.0833333333333, "x": "軌道に乗ったかどうかはまだ分かりません。"}, {"t": 275.75, "x": "それを確かめるのは、地上で電波を聞く追跡の基地でした。"}, {"t": 279.76666666666665, "x": "ヴァンガード計画は、衛星の電波をとらえて"}, {"t": 282.7, "x": "位置を割り出す基地を、各地に置いていました。"}, {"t": 285.65, "x": "ミニトラックと呼ばれる仕組みです。"}, {"t": 287.6333333333333, "x": "ワシントンの研究所で、関係者たちは、カリフォルニア州"}, {"t": 291.7, "x": "サンディエゴの基地からの知らせを待っていました。"}, {"t": 294.28333333333336, "x": "開発の歴史をまとめた本は、"}, {"t": 296.23333333333335, "x": "そのときの様子を、生まれてくる子を待つ"}, {"t": 299.23333333333335, "x": "父親たちのようだった、と書いています。"}, {"t": 301.95, "x": "祝いの準備は、確かめがとれるまでお預けでした。"}, {"t": 305.43333333333334, "x": "朝の九時半ごろ、二つの場所を結ぶ文字の"}, {"t": 308.46666666666664, "x": "通信機が、音を立てて動き出します。"}, {"t": 311.1666666666667, "x": "最初に届いたのは、こうでした。"}, {"t": 313.5833333333333, "x": "まだ信号は来ていない。"}, {"t": 315.1666666666667, "x": "続いて、待て、来たかもしれない、と届きます。"}, {"t": 319.18333333333334, "x": "研究所の側が、分かりしだい"}, {"t": 321.3833333333333, "x": "知らせてくれ、と打ち返しました。"}, {"t": 323.6666666666667, "x": "そして、すぐにこう返ってきました。"}, {"t": 326.25, "x": "これだ。"}, {"t": 327.35, "x": "百八・〇三。"}, {"t": 328.6666666666667, "x": "百八・〇〇も。"}, {"t": 330.1666666666667, "x": "信号良好。"}, {"t": 331.3333333333333, "x": "間違いない。"}, {"t": 332.28333333333336, "x": "おめでとう。"}, {"t": 333.4, "x": "百八・〇三と百八・〇〇は、"}, {"t": 335.93333333333334, "x": "衛星に積まれた二つの送信機の周波数です。"}, {"t": 339.3333333333333, "x": "単位はメガヘルツ。"}, {"t": 340.6333333333333, "x": "二つの電波が、そろって地上に届いていました。"}, {"t": 344.0, "x": "計画の責任者は、全米科学財団の長官に"}, {"t": 347.55, "x": "電話をかけ、こう伝えたと記録されています。"}, {"t": 350.56666666666666, "x": "軌道に乗った。"}, {"t": 351.6333333333333, "x": "大統領に知らせてかまわない。"}, {"t": 353.56666666666666, "x": "記録に残る最初の軌道は、地球にいちばん近いところで"}, {"t": 357.31666666666666, "x": "高さ四百六マイル、およそ六百五十キロメートル。"}, {"t": 361.0, "x": "いちばん遠いところで二千四百六十五マイル、"}, {"t": 363.95, "x": "およそ三千九百七十キロメートル。"}, {"t": 366.8, "x": "一周は、百三十四分でした。"}, {"t": 369.4, "x": "このとき軌道に乗ったのは、"}, {"t": 370.95, "x": "グレープフルーツだけではありません。"}, {"t": 373.25, "x": "燃え尽きたロケットの三段目の"}, {"t": 374.98333333333335, "x": "筒も、一緒に回り始めました。"}, {"t": 377.3833333333333, "x": "重さは五十三ポンド、およそ二十四キログラム。"}, {"t": 380.9166666666667, "x": "球よりずっと重い筒が、球の"}, {"t": 383.18333333333334, "x": "後ろを追いかけるように回っていました。"}, {"t": 385.3333333333333, "x": "当時の計算では、この球と三段目の筒は、"}, {"t": 388.56666666666666, "x": "二千年ほど軌道に残るとされました。"}, {"t": 391.25, "x": "同じ本は、計画の人々について、こうも書いています。"}, {"t": 395.53333333333336, "x": "世間から見れば、宇宙時代の英雄は、最初の"}, {"t": 399.1666666666667, "x": "衛星を上げた陸軍のチームのままだった。"}, {"t": 401.68333333333334, "x": "それでも計画の人々には、手ごたえがあった。"}, {"t": 404.9, "x": "三段式のロケット、世界に広がる"}, {"t": 407.51666666666665, "x": "追跡の仕組み、打ち上げの設備。"}, {"t": 410.0833333333333, "x": "それを、二年六か月と八日という"}, {"t": 412.6333333333333, "x": "短さで、一から作り上げたからだ。"}, {"t": 415.31666666666666, "x": "そして、国際地球観測年のあいだに衛星を一つ軌道に"}, {"t": 419.43333333333334, "x": "乗せるという、自分たちの役目を果たした。"}, {"t": 422.3, "x": "先に上がったスプートニク一号は、"}, {"t": 424.43333333333334, "x": "そのとき、もう軌道にありませんでした。"}, {"t": 427.43333333333334, "x": "ヴァンガード一号の二つの送信機は、"}, {"t": 429.7, "x": "電気のもらい方が違っていました。"}, {"t": 432.1, "x": "一つは、水銀電池で動くもの。"}, {"t": 434.6666666666667, "x": "もう一つは、殻の表面に付けた"}, {"t": 436.98333333333335, "x": "六枚の太陽電池で動くものです。"}, {"t": 439.26666666666665, "x": "開発の記録は、この打ち上げの成果の"}, {"t": 441.96666666666664, "x": "一つとして、太陽電池で衛星の機器に電気を"}, {"t": 445.21666666666664, "x": "送った初めての例だった、と書いています。"}, {"t": 448.01666666666665, "x": "水銀電池は、一九五八年の六月に止まりました。"}, {"t": 452.4, "x": "打ち上げから、三か月ほどです。"}, {"t": 454.85, "x": "太陽電池のほうは、止まりませんでした。"}, {"t": 457.71666666666664, "x": "打ち上げの前、計画の資金を話し合う場では、"}, {"t": 460.95, "x": "太陽電池を積むことに費用の心配もありました。"}, {"t": 464.4, "x": "衛星が長く電波を出せば、追跡の"}, {"t": 467.06666666666666, "x": "基地やデータを整理する作業も、そのぶん"}, {"t": 469.8, "x": "長く続けなければならないからです。"}, {"t": 471.9166666666667, "x": "それでも、これからの衛星に太陽の電気を"}, {"t": 474.96666666666664, "x": "使うのは当然のことに思えた、と記録にあります。"}, {"t": 478.4166666666667, "x": "同じころのエクスプローラーは、回路を作り直すと"}, {"t": 481.71666666666664, "x": "打ち上げが遅れるため、ふつうの電池に頼っていました。"}, {"t": 485.18333333333334, "x": "同じころ、陸軍のチームも衛星を上げていました。"}, {"t": 488.78333333333336, "x": "成功した最初の三機のエクスプローラーは、"}, {"t": 491.4166666666667, "x": "どれも、働いていた期間が短いものでした。"}, {"t": 494.85, "x": "一機目は四か月足らず。"}, {"t": 496.51666666666665, "x": "二機目は三か月足らず。"}, {"t": 498.1666666666667, "x": "三機目は十週間あまりです。"}, {"t": 500.25, "x": "ヴァンガード一号の電波は、月が"}, {"t": 502.56666666666666, "x": "変わっても、はっきりと届き続けました。"}, {"t": 505.18333333333334, "x": "開発の歴史をまとめた本は、地上の受信機は、"}, {"t": 508.6166666666667, "x": "そのあと七年にわたって、この球の"}, {"t": 511.4166666666667, "x": "信号を拾うことができた、と書いています。"}, {"t": 514.3, "x": "ただし、電波が止まった年は、資料によって"}, {"t": 517.6166666666667, "x": "一九六四年とも、一九六五年とも書かれています。"}, {"t": 522.3166666666667, "x": "この回では、一九六〇年代の"}, {"t": 525.1166666666667, "x": "なかば、とだけ言っておきます。"}, {"t": 527.1666666666666, "x": "電波が長く続いたことは、分かりました。"}, {"t": 530.0833333333334, "x": "では、その電波で何が分かったのか。"}, {"t": 532.6833333333333, "x": "調べるための装置は、ほとんど積んでいませんでした。"}, {"t": 536.1833333333333, "x": "あるのは、送信機と、二つの温度計だけです。"}, {"t": 539.8166666666667, "x": "それでも、送信機そのものが、"}, {"t": 541.9833333333333, "x": "一つの測る道具になりました。"}, {"t": 544.25, "x": "送信機の周波数は、温度によってわずかにずれます。"}, {"t": 548.0, "x": "そのずれ方を地上で前もって"}, {"t": 549.7666666666667, "x": "調べておいたので、届いた電波の周波数から、"}, {"t": 553.0, "x": "球の温度を読み取ることができたのです。"}, {"t": 555.6166666666667, "x": "計画の責任者は、そうして得られたデータが、"}, {"t": 558.6, "x": "スプートニクやエクスプローラーの"}, {"t": 560.6666666666666, "x": "観測を補った、と述べています。"}, {"t": 563.1333333333333, "x": "打ち上げのすぐあとには、この球から得られる"}, {"t": 566.0333333333333, "x": "科学の情報は、乏しいものに見えていました。"}, {"t": 569.2166666666667, "x": "同じころにソビエトが上げた大きな衛星と"}, {"t": 571.75, "x": "比べれば、なおさらでした。"}, {"t": 573.75, "x": "それでも、この球には、ほかの"}, {"t": 576.3, "x": "衛星にない強みが一つありました。"}, {"t": 578.5333333333333, "x": "軌道の高さです。"}, {"t": 579.85, "x": "国際地球観測年のあいだに上がった衛星の中で、"}, {"t": 583.15, "x": "いちばん遠いところまで上がったのが、この球でした。"}, {"t": 586.8166666666667, "x": "記録には、非常に役に立つ軌道、という"}, {"t": 590.0166666666667, "x": "言葉が残っています。"}, {"t": 591.3833333333333, "x": "高いところを回るほど、空気に"}, {"t": 593.65, "x": "こすられにくく、長く軌道に残ります。"}, {"t": 596.5166666666667, "x": "長く残れば、それだけ長いあいだ、軌道の"}, {"t": 599.8166666666667, "x": "変わり方を追いかけることができます。"}, {"t": 601.9333333333333, "x": "電波が止まったあとも、観測は終わりませんでした。"}, {"t": 605.3, "x": "望遠鏡で光をとらえて追いかける方法で、"}, {"t": 608.1166666666667, "x": "軌道が少しずつ下がっていく"}, {"t": 610.1, "x": "様子を、見続けることができたからです。"}, {"t": 612.8, "x": "この球が役に立ったのは、何かを"}, {"t": 615.2833333333333, "x": "測ったからではありませんでした。"}, {"t": 617.1166666666667, "x": "自分がどう動くかを、長いあいだ見せ続けたからでした。"}, {"t": 620.8666666666667, "x": "人工衛星の軌道は、同じ形の楕円を、"}, {"t": 624.1166666666667, "x": "ずっとなぞり続けているわけではありません。"}, {"t": 626.8666666666667, "x": "地球の形のわずかなゆがみ。"}, {"t": 628.8666666666667, "x": "月と太陽が引く力。"}, {"t": 630.5166666666667, "x": "上空に残るわずかな空気。"}, {"t": 632.4833333333333, "x": "太陽の光が押す力。"}, {"t": 634.25, "x": "そうしたものが少しずつ積み重なって、"}, {"t": 636.5333333333333, "x": "軌道はゆっくりと形を変えていきます。"}, {"t": 639.25, "x": "逆に言えば、軌道の変わり方を細かく測れば、"}, {"t": 642.5166666666667, "x": "何がどれだけ衛星を引っぱっているのかを、"}, {"t": 645.3833333333333, "x": "さかのぼって求めることができます。"}, {"t": 647.7333333333333, "x": "ヴァンガード一号の軌道が使われたのは、そのためでした。"}, {"t": 651.4666666666667, "x": "海軍の研究所と、スミソニアン天体物理観測所の"}, {"t": 655.2833333333333, "x": "研究者たちは、この球の軌道を調べて、"}, {"t": 658.2666666666667, "x": "いくつかのことを報告しました。"}, {"t": 660.5166666666667, "x": "一つ目。"}, {"t": 661.6166666666667, "x": "地球は、極の方向に少しつぶれた球というだけではない。"}, {"t": 665.5166666666667, "x": "洋なしのような形をしている。"}, {"t": 667.5166666666667, "x": "二つ目。"}, {"t": 668.6166666666667, "x": "月と太陽の重力が、人工衛星の軌道を変えている。"}, {"t": 672.6166666666667, "x": "三つ目。"}, {"t": 673.75, "x": "太陽の光の圧力が、衛星の動きに影響している。"}, {"t": 677.7333333333333, "x": "四つ目。"}, {"t": 678.85, "x": "金属でできた衛星の回転は、"}, {"t": 680.95, "x": "磁気の働きで、しだいに弱められていく。"}, {"t": 684.1833333333333, "x": "開発の歴史は、打ち上げの直後、"}, {"t": 686.7833333333333, "x": "この球から得られる情報は乏しく見えた、と"}, {"t": 690.1666666666666, "x": "書いたうえで、こう続けています。"}, {"t": 692.3833333333333, "x": "この小さな衛星は、たいていの"}, {"t": 694.6166666666667, "x": "人が思っていたより、ずっと役に立った。"}, {"t": 697.4, "x": "これで終わりではありませんでした。"}, {"t": 699.4, "x": "この小さな球は、何度も何度も上空を通り過ぎました。"}, {"t": 703.35, "x": "その記録を重ねることで、赤道の方向と極の"}, {"t": 706.7666666666667, "x": "方向の、地球の直径を求めることができました。"}, {"t": 710.2333333333333, "x": "上空の空気の濃さが、太陽の"}, {"t": 712.5833333333334, "x": "自転に合わせて変わることも示されました。"}, {"t": 715.0666666666667, "x": "そして、上空の空気は、それまで考えられていたよりも"}, {"t": 719.2, "x": "ずっと濃い、ということが分かりました。"}, {"t": 721.6666666666666, "x": "最初の打ち上げの目的に書かれていた、"}, {"t": 724.1, "x": "空気の濃さと地球の形。"}, {"t": 726.2666666666667, "x": "それを実際に調べたのは、測る装置を積んだ衛星ではなく、"}, {"t": 730.45, "x": "ほとんど何も積んでいない、この球の軌道でした。"}, {"t": 734.05, "x": "一九六一年、打ち上げから三年がたったころ、計画の"}, {"t": 738.8666666666667, "x": "責任者だったジョン・ヘイゲンは、こう述べています。"}, {"t": 741.95, "x": "この衛星が、太陽の活動の周期である"}, {"t": 745.0, "x": "十一年を通して軌道にとどまるとします。"}, {"t": 747.6666666666666, "x": "そうすれば、空気の濃さが衛星の寿命に"}, {"t": 750.5333333333333, "x": "どう効くのかを、正確に見積もれるようになる。"}, {"t": 753.5166666666667, "x": "そして、打ち上げのときに二千年とされた"}, {"t": 756.3833333333333, "x": "寿命の見積もりは、のちに書き直されました。"}, {"t": 759.4333333333333, "x": "一九七〇年にまとめられた開発の"}, {"t": 762.15, "x": "歴史の巻末の一覧には、こうあります。"}, {"t": 765.05, "x": "当初は最大二千年もつと見込まれた。"}, {"t": 767.6166666666667, "x": "のちの見積もりでは、二百四十年。"}, {"t": 770.35, "x": "見積もりが縮んだ理由を、一つ"}, {"t": 772.6333333333333, "x": "一つ書いた資料は、確認できていません。"}, {"t": 775.5166666666667, "x": "ただ、上空の空気が考えられていたより濃いこと。"}, {"t": 779.05, "x": "太陽の光が衛星を押すこと。"}, {"t": 781.2333333333333, "x": "どちらも、この球が自分の軌道で示したことでした。"}, {"t": 784.8333333333334, "x": "地球のまわりを回る物には、"}, {"t": 786.65, "x": "追跡のための番号が付けられています。"}, {"t": 789.4333333333333, "x": "アメリカの追跡網がまとめている人工物の"}, {"t": 792.1833333333333, "x": "目録で、ヴァンガード一号の番号は、五番です。"}, {"t": 795.9833333333333, "x": "では、一番から四番は何なのか。"}, {"t": 798.65, "x": "目録を順に見ていきます。"}, {"t": 800.4833333333333, "x": "一番は、スプートニク一号を打ち上げたロケットの本体。"}, {"t": 804.4333333333333, "x": "二番が、スプートニク一号。"}, {"t": 806.7, "x": "三番が、スプートニク二号。"}, {"t": 808.9833333333333, "x": "四番が、エクスプローラー一号です。"}, {"t": 811.7833333333333, "x": "目録には、四つとも、落ちた日付が書き込まれています。"}, {"t": 815.95, "x": "ロケットの本体は、一九五七年十二月一日。"}, {"t": 820.1666666666666, "x": "スプートニク一号は、一九五八年一月三日。"}, {"t": 824.4, "x": "スプートニク二号は、一九五八年四月十四日。"}, {"t": 828.5666666666667, "x": "いちばん長く残ったエクスプローラー一号も、"}, {"t": 831.2333333333333, "x": "一九七〇年三月三十一日に落ちています。"}, {"t": 835.1833333333333, "x": "打ち上げから、十二年あまりでした。"}, {"t": 837.8, "x": "目録に残るエクスプローラー一号の最後の軌道は、"}, {"t": 841.0833333333334, "x": "いちばん高いところでも二百十五キロメートル。"}, {"t": 844.1833333333333, "x": "ヴァンガード一号のいちばん低いところより、"}, {"t": 846.6333333333333, "x": "四百キロメートル以上低い高さです。"}, {"t": 849.3833333333333, "x": "五番、ヴァンガード一号の欄には、"}, {"t": 851.7833333333333, "x": "落ちた日付がありません。"}, {"t": 853.55, "x": "目録を先へ進むと、十六番に、"}, {"t": 856.4, "x": "ヴァンガードのロケット本体が出てきます。"}, {"t": 858.9666666666667, "x": "あのとき一緒に軌道に乗った、三段目の筒です。"}, {"t": 862.45, "x": "こちらの欄にも、落ちた日付はありません。"}, {"t": 865.3166666666667, "x": "筒の軌道は、いちばん低いところが"}, {"t": 867.7166666666667, "x": "約六百五十六キロメートル、"}, {"t": 869.65, "x": "いちばん高いところが約四千二百十キロメートル。"}, {"t": 873.1833333333333, "x": "一周は約百三十七分です。"}, {"t": 875.5166666666667, "x": "球より少し高いところまで上がり、"}, {"t": 877.6333333333333, "x": "少しゆっくりと回っています。"}, {"t": 879.7666666666667, "x": "同じ日に同じロケットから離れた二つは、"}, {"t": 882.2833333333333, "x": "六十八年のあいだに、少しずつ"}, {"t": 885.0666666666667, "x": "違う道を回るようになりました。"}, {"t": 887.05, "x": "翌年の一九五九年に打ち上げられた"}, {"t": 889.9666666666667, "x": "ヴァンガード二号と三号も、同じです。"}, {"t": 892.6666666666666, "x": "番号は十一番と二十番。"}, {"t": 894.7, "x": "どちらも、いまも軌道にあります。"}, {"t": 897.0833333333334, "x": "ヴァンガード計画が軌道に届けた三つの衛星は、"}, {"t": 900.0833333333334, "x": "三つとも、まだ落ちてきていないことになります。"}, {"t": 903.4333333333333, "x": "いまの軌道は、どうなっているのか。"}, {"t": 905.9333333333333, "x": "二〇二六年九月の軌道の値では、"}, {"t": 908.5333333333333, "x": "いちばん低いところが約六百五十二キロメートル。"}, {"t": 911.9666666666667, "x": "いちばん高いところが、約三千八百十九キロメートルです。"}, {"t": 916.2, "x": "一周は約百三十二・六分。"}, {"t": 918.65, "x": "一日に、十・八六周しています。"}, {"t": 921.5666666666667, "x": "軌道の傾きは、赤道に対して約三十四度です。"}, {"t": 925.4333333333333, "x": "打ち上げの直後の値と並べてみます。"}, {"t": 927.95, "x": "いちばん低いところは、ほとんど変わっていません。"}, {"t": 931.0833333333334, "x": "いちばん高いところは、百五十キロメートルほど"}, {"t": 934.2333333333333, "x": "下がっています。"}, {"t": 935.1166666666667, "x": "六十八年をかけて、百五十キロメートルほどです。"}, {"t": 938.8166666666667, "x": "軌道のいちばん低いところで、わずかな空気に"}, {"t": 941.85, "x": "こすられると、衛星は少しずつ勢いを失います。"}, {"t": 945.6, "x": "すると、反対側のいちばん高いところが下がっていきます。"}, {"t": 949.4833333333333, "x": "ヴァンガード一号の軌道にも、その跡が残っています。"}, {"t": 953.0666666666667, "x": "ただ、その下がり方が、とても遅いのです。"}, {"t": 956.35, "x": "いつ落ちてくるのかを、日付で"}, {"t": 958.4, "x": "示した資料は、確認できていません。"}, {"t": 961.0833333333334, "x": "電波を出さなくなってから、六十年あまり。"}, {"t": 964.15, "x": "この球は、目録の中の一行と、ときどき更新される軌道の"}, {"t": 968.85, "x": "数字としてだけ、そこにあり続けています。"}, {"t": 971.7166666666667, "x": "ここで、もっと高いところに目を移します。"}, {"t": 974.7166666666667, "x": "赤道の真上、高さ三万五千七百八十六キロメートル。"}, {"t": 979.0666666666667, "x": "この高さを回る衛星は、二十三時間五十六分四秒で、"}, {"t": 983.45, "x": "地球を一周します。"}, {"t": 985.1666666666666, "x": "地球が一回自転するのと、同じ時間です。"}, {"t": 988.4333333333333, "x": "速さは、一秒間に約三キロメートル。"}, {"t": 991.4166666666666, "x": "そのため、地上から見ると、衛星は空の"}, {"t": 994.8, "x": "同じ場所に止まっているように見えます。"}, {"t": 996.9666666666667, "x": "これが、静止軌道です。"}, {"t": 998.9, "x": "アンテナを一つの方向に向けたままで、通信ができます。"}, {"t": 1002.7333333333333, "x": "放送や通信の衛星、気象の衛星にとって、"}, {"t": 1006.2, "x": "これほど都合のいい場所はありません。"}, {"t": 1008.6166666666667, "x": "この高さに最初に衛星を届けたのは、"}, {"t": 1011.0833333333334, "x": "一九六三年七月二十六日に打ち上げられた、"}, {"t": 1015.25, "x": "シンコム二号でした。"}, {"t": 1016.8333333333334, "x": "一周の時間は、二十四時間に合わせられました。"}, {"t": 1020.2333333333333, "x": "ただし、軌道が赤道に対して三十三度傾いていたため、"}, {"t": 1024.35, "x": "完全には止まって見えませんでした。"}, {"t": 1026.7666666666667, "x": "空の上で、南北に細長い八の字を描いて"}, {"t": 1030.2166666666667, "x": "動いていた、とNASAの記録にあります。"}, {"t": 1032.8, "x": "位置は、大西洋とブラジルの上空、西経五十五度でした。"}, {"t": 1037.3833333333334, "x": "打ち上げのあと、少しずつ流れながら目的の"}, {"t": 1040.4833333333333, "x": "場所へ向かい、八月十六日に、ほぼ止まりました。"}, {"t": 1044.4166666666667, "x": "そこから、音声や文字、ファクシミリを"}, {"t": 1047.3666666666666, "x": "送る試験が行われ、この高さでの"}, {"t": 1049.9166666666667, "x": "通信ができることが確かめられました。"}, {"t": 1052.2, "x": "一九六五年の一月一日には、運用が"}, {"t": 1055.95, "x": "アメリカの国防総省に引き継がれています。"}, {"t": 1058.5333333333333, "x": "衛星は、高さ三十九センチメートル、"}, {"t": 1061.4166666666667, "x": "直径七十一センチメートルの筒の形です。"}, {"t": 1064.8166666666666, "x": "側面は、三千八百四十枚の太陽電池で覆われていました。"}, {"t": 1069.4833333333333, "x": "二年後の一九六五年四月六日、アーリーバードと"}, {"t": 1073.5666666666666, "x": "呼ばれる衛星が打ち上げられます。"}, {"t": 1075.55, "x": "正式な名前は、インテルサット一号です。"}, {"t": 1078.6833333333334, "x": "打ち上げのあと、衛星は西経二十七・"}, {"t": 1081.6333333333334, "x": "五度の上空に置かれました。"}, {"t": 1083.5333333333333, "x": "軌道の傾きは、〇・一度。"}, {"t": 1086.0333333333333, "x": "こちらは、ほとんど止まって見える衛星でした。"}, {"t": 1089.1166666666666, "x": "五月二日には、初めての公開の"}, {"t": 1091.6333333333334, "x": "テレビ中継が行われています。"}, {"t": 1093.65, "x": "NASAの記録は、これを、初めて実際に"}, {"t": 1096.7666666666667, "x": "使われた商業の通信衛星と書いています。"}, {"t": 1099.65, "x": "大西洋をまたいで、決まった時間にテレビを"}, {"t": 1102.6666666666667, "x": "中継した最初の衛星でもありました。"}, {"t": 1105.0666666666666, "x": "重さは三十八・六キログラム。"}, {"t": 1107.3166666666666, "x": "電話なら二百四十回線、あるいは"}, {"t": 1110.05, "x": "テレビ一つを運ぶことができました。"}, {"t": 1112.25, "x": "表面は、六千枚の太陽電池で覆われていました。"}, {"t": 1116.05, "x": "作り出す電気は、四十五ワットです。"}, {"t": 1118.8166666666666, "x": "ヴァンガード一号の殻に付けられた"}, {"t": 1120.7666666666667, "x": "太陽電池は、六枚でした。"}, {"t": 1123.0, "x": "その七年後、静止軌道の商業衛星は、六千枚の"}, {"t": 1127.2833333333333, "x": "太陽電池で動いていたことになります。"}, {"t": 1129.6666666666667, "x": "商業の運用は、一九六五年六月二十八日に"}, {"t": 1133.9833333333333, "x": "始まり、一九六九年一月まで続きました。"}, {"t": 1137.9833333333333, "x": "そのあと、別の衛星の故障の"}, {"t": 1140.3, "x": "穴を埋めるため、同じ年の六月二十九日から"}, {"t": 1143.6666666666667, "x": "八月十三日まで、もう一度使われています。"}, {"t": 1147.0, "x": "そして、役目を終えました。"}, {"t": 1149.1666666666667, "x": "アーリーバードは、いまどこにいるのか。"}, {"t": 1151.7333333333333, "x": "追跡の目録にある値では、いちばん低いところが"}, {"t": 1155.2666666666667, "x": "三万五千七百六十四キロメートル。"}, {"t": 1157.8666666666666, "x": "いちばん高いところが、"}, {"t": 1159.1666666666667, "x": "三万五千八百三十七キロメートルです。"}, {"t": 1162.4166666666667, "x": "静止軌道の高さから、上下に"}, {"t": 1164.7166666666667, "x": "数十キロメートルしか離れていません。"}, {"t": 1166.9833333333333, "x": "シンコム二号も、似たような場所にいます。"}, {"t": 1169.9333333333334, "x": "目録では、三万五千七百五十五キロメートルから、"}, {"t": 1173.7166666666667, "x": "三万五千八百十四キロメートルのあいだを回っています。"}, {"t": 1177.6833333333334, "x": "役目を終えた衛星をどこへやるのか。"}, {"t": 1180.1166666666666, "x": "各国の宇宙機関でつくる、調整の委員会があります。"}, {"t": 1183.9, "x": "この委員会が、いまの形の指針の最初の"}, {"t": 1186.95, "x": "版をまとめたのは、二〇〇二年のことです。"}, {"t": 1189.75, "x": "アーリーバードの打ち上げから、三十七年後でした。"}, {"t": 1193.2, "x": "最初の静止衛星たちは、その指針ができる"}, {"t": 1196.2833333333333, "x": "ずっと前に役目を終え、この高さに残りました。"}, {"t": 1199.5833333333333, "x": "低い軌道を回る衛星は、放っておけば、"}, {"t": 1202.5333333333333, "x": "いずれ落ちてきます。"}, {"t": 1204.1, "x": "わずかに残る空気が、少しずつ高さを奪うからです。"}, {"t": 1207.7666666666667, "x": "ヴァンガード一号のように高く"}, {"t": 1209.5333333333333, "x": "上がったものは、長い時間がかかります。"}, {"t": 1212.2166666666667, "x": "それでも、仕組みは同じです。"}, {"t": 1214.4166666666667, "x": "静止軌道には、その仕組みがありません。"}, {"t": 1217.1833333333334, "x": "ヨーロッパ宇宙機関は、二〇二六年九月の"}, {"t": 1220.5666666666666, "x": "報告で、こう書いています。"}, {"t": 1222.5833333333333, "x": "低い軌道と違って、静止軌道の保護された"}, {"t": 1225.5833333333333, "x": "領域には、物体が自然に出ていく仕組みがない。"}, {"t": 1228.8166666666666, "x": "同じ報告は、太陽の光の圧力があるために、"}, {"t": 1232.2833333333333, "x": "この高さでの長い先の予測には、無視できない"}, {"t": 1235.8, "x": "不確かさが残る、とも書いています。"}, {"t": 1238.2833333333333, "x": "役目を終えた衛星を、そのままにしておけば、"}, {"t": 1241.3333333333333, "x": "同じ高さにずっと残り続けることになります。"}, {"t": 1244.5333333333333, "x": "そこは、いま働いている衛星が"}, {"t": 1246.8833333333334, "x": "並んでいる高さでもあります。"}, {"t": 1248.5833333333333, "x": "そのために決められたのが、"}, {"t": 1250.1166666666666, "x": "この高さを守るための決まりです。"}, {"t": 1252.6166666666666, "x": "第6章で触れた調整の委員会の指針は、"}, {"t": 1255.4666666666667, "x": "その後も改訂を重ねてきました。"}, {"t": 1257.8666666666666, "x": "いまの版は、二〇二〇年のものです。"}, {"t": 1260.65, "x": "指針は、静止軌道の高さから上下に"}, {"t": 1263.3666666666666, "x": "二百キロメートル、南北には緯度十五度までの"}, {"t": 1266.5333333333333, "x": "範囲を、守るべき領域と定めています。"}, {"t": 1269.3833333333334, "x": "そして、役目を終えた衛星は、この領域より"}, {"t": 1273.0, "x": "上に残る軌道へ移すよう求めています。"}, {"t": 1275.4833333333333, "x": "どれだけ上げればいいのか。"}, {"t": 1277.1333333333334, "x": "指針には、計算の式まで付いています。"}, {"t": 1280.0166666666667, "x": "基本になるのは、二百三十五キロメートルです。"}, {"t": 1283.35, "x": "これは、守るべき領域の上の端までの二百キロメートルに、"}, {"t": 1287.3666666666666, "x": "三十五キロメートルを足した数です。"}, {"t": 1289.8833333333334, "x": "三十五キロメートルは、月や太陽の引く力、"}, {"t": 1293.1, "x": "地球の重力のかたよりによって、移したあとの"}, {"t": 1296.6166666666666, "x": "衛星が下がってきうる、最大の幅です。"}, {"t": 1299.45, "x": "これに、衛星ごとの上乗せが加わります。"}, {"t": 1302.5833333333333, "x": "衛星の面積と重さの比、そして太陽の"}, {"t": 1305.5666666666666, "x": "光をどれだけ受けやすいかで決まる分です。"}, {"t": 1308.1166666666666, "x": "軽くて面積の広い衛星ほど、太陽の"}, {"t": 1311.1166666666666, "x": "光に押されて、軌道がゆれやすくなります。"}, {"t": 1314.1166666666666, "x": "その分を見込んで、余計に高く上げる、という考え方です。"}, {"t": 1318.6, "x": "さらに、移したあとの軌道が、"}, {"t": 1320.8166666666666, "x": "ほぼ円であることも条件です。"}, {"t": 1323.0833333333333, "x": "軌道のつぶれ具合を表す値を、"}, {"t": 1325.3, "x": "〇・〇〇三以下にするよう求めています。"}, {"t": 1328.4, "x": "ヨーロッパ宇宙機関の報告は、"}, {"t": 1330.4, "x": "もう一つの道も挙げています。"}, {"t": 1332.5666666666666, "x": "長い時間の中で引っぱられても、"}, {"t": 1334.5166666666667, "x": "百年のあいだは守るべき領域に入ってこない。"}, {"t": 1337.8, "x": "それだけの高さに上げることです。"}, {"t": 1339.9, "x": "指針は、衛星を運んだロケットの側にも"}, {"t": 1342.95, "x": "注文をつけています。"}, {"t": 1344.3, "x": "静止軌道の衛星の推進の装置は、できるだけ切り離さない。"}, {"t": 1348.6, "x": "やむをえず切り離すなら、守るべき"}, {"t": 1351.0833333333333, "x": "領域の外に残るようにする。"}, {"t": 1352.9666666666667, "x": "第4章で、ヴァンガード一号の軌道が"}, {"t": 1355.6333333333334, "x": "示したことの一つは、太陽の光の圧力が"}, {"t": 1358.85, "x": "衛星の動きに影響する、ということでした。"}, {"t": 1361.8666666666666, "x": "静止軌道の上の決まりには、その力が、式の"}, {"t": 1365.4833333333333, "x": "一部として書き込まれています。"}, {"t": 1367.2166666666667, "x": "こうして役目を終えた衛星が送られていく"}, {"t": 1369.65, "x": "高さが、墓場軌道と呼ばれる場所です。"}, {"t": 1372.4, "x": "国連の宇宙空間平和利用委員会も、二〇〇"}, {"t": 1375.7333333333333, "x": "七年に同じ考え方を指針に入れました。"}, {"t": 1378.4666666666667, "x": "静止軌道を通る衛星やロケットの段は、"}, {"t": 1381.0166666666667, "x": "役目を終えたあと、静止軌道の邪魔にならず、"}, {"t": 1384.4833333333333, "x": "戻ってもこない軌道に残すこと。"}, {"t": 1386.8666666666666, "x": "国連総会は、同じ年の十二月二十二日に、"}, {"t": 1390.6166666666666, "x": "この指針を支持しています。"}, {"t": 1392.5666666666666, "x": "では、実際にどれだけ守られているのか。"}, {"t": 1395.5, "x": "ヨーロッパ宇宙機関の報告は、この十年に"}, {"t": 1398.5666666666666, "x": "静止軌道で役目を終えた衛星を数えています。"}, {"t": 1401.5666666666666, "x": "そのうち、八十五パーセントから百パーセントが、"}, {"t": 1404.9333333333334, "x": "決まりに従おうと試みています。"}, {"t": 1407.4166666666667, "x": "決まりどおりに移すことができたのは、"}, {"t": 1409.5, "x": "七十パーセントから九十パーセントとされています。"}, {"t": 1412.9666666666667, "x": "試みたものの、決まりの高さに"}, {"t": 1415.25, "x": "届かなかった衛星もある、ということです。"}, {"t": 1418.1166666666666, "x": "二〇〇二年、アメリカの衛星放送の会社が、"}, {"t": 1421.3333333333333, "x": "一機の放送衛星を打ち上げました。"}, {"t": 1423.9666666666667, "x": "エコースター七号です。"}, {"t": 1425.55, "x": "二〇一二年、会社は、役目を終えたあとの処分の"}, {"t": 1429.4, "x": "計画を出し、アメリカの連邦通信委員会に認められました。"}, {"t": 1433.75, "x": "約束した行き先は、静止軌道の三百キロメートル上です。"}, {"t": 1437.85, "x": "その後の届け出で、会社は、"}, {"t": 1439.9333333333334, "x": "残りの燃料から見て、処分のための噴射は"}, {"t": 1443.3666666666666, "x": "二〇二二年の五月になると見込んでいました。"}, {"t": 1446.2166666666667, "x": "ところが、二〇二二年の二月。"}, {"t": 1448.8333333333333, "x": "会社は、衛星の燃料がほとんど"}, {"t": 1451.35, "x": "残っていないことに気づきました。"}, {"t": 1453.2, "x": "見込みより三か月早く、燃料が"}, {"t": 1455.8166666666666, "x": "尽きかけていたことになります。"}, {"t": 1457.5, "x": "計画どおりの処分は、もうできませんでした。"}, {"t": 1460.65, "x": "衛星が最後にたどり着いたのは、静止軌道の"}, {"t": 1463.75, "x": "約百二十二キロメートル上でした。"}, {"t": 1466.0, "x": "約束の三百キロメートルには、届きませんでした。"}, {"t": 1469.55, "x": "百二十二キロメートルというのは、"}, {"t": 1471.5833333333333, "x": "前の章で見た、守るべき領域の内側です。"}, {"t": 1475.2833333333333, "x": "領域は、静止軌道の上下二百キロメートルまででした。"}, {"t": 1479.1166666666666, "x": "委員会の発表は、この低い高さでは、宇宙の"}, {"t": 1482.7666666666667, "x": "ごみとしての懸念が生じうる、と書いています。"}, {"t": 1485.7666666666667, "x": "委員会の決まりでは、衛星から電波を出して"}, {"t": 1488.8333333333333, "x": "運用するには、委員会の許可が要ります。"}, {"t": 1491.65, "x": "そして、その許可の条件どおりに"}, {"t": 1494.0833333333333, "x": "運用しなければなりません。"}, {"t": 1495.7166666666667, "x": "役目を終えたあとの処分の約束も、その条件の一つでした。"}, {"t": 1499.9333333333334, "x": "二〇二三年十月二日、委員会は、"}, {"t": 1503.05, "x": "会社との和解を発表しました。"}, {"t": 1505.4, "x": "会社は責任を認め、決まりを守るための"}, {"t": 1508.3666666666666, "x": "計画に従い、十五万ドルを支払う。"}, {"t": 1511.2333333333333, "x": "委員会は、これを、委員会として初めての宇宙の"}, {"t": 1515.05, "x": "ごみに関する取り締まりだと書いています。"}, {"t": 1517.3833333333334, "x": "取り締まりを担当した部門の責任者は、"}, {"t": 1519.9, "x": "発表の中でこう述べています。"}, {"t": 1522.15, "x": "衛星の運用が広がり、宇宙での"}, {"t": 1524.65, "x": "経済活動が速まる中で、事業者が約束を"}, {"t": 1528.0833333333333, "x": "守っていることを確かめなければならない。"}, {"t": 1530.4333333333334, "x": "墓場軌道に上げるための燃料は、衛星が働いているあいだ、"}, {"t": 1534.5833333333333, "x": "使わずに残しておかなければなりません。"}, {"t": 1537.2666666666667, "x": "燃料が残っている限り、衛星は"}, {"t": 1539.8833333333334, "x": "もう少し働き続けることができます。"}, {"t": 1542.2, "x": "それでも、最後の上昇の分は、手をつけずに取っておく。"}, {"t": 1546.3833333333334, "x": "どこで仕事を切り上げて、残りを最後の上昇に回すのか。"}, {"t": 1550.6, "x": "その見極めを誤れば、墓場の高さには届きません。"}, {"t": 1554.3833333333334, "x": "エコースター七号は、二十年ほど働いたあと、"}, {"t": 1557.6666666666667, "x": "その最後の上昇で、決まりの高さに届きませんでした。"}, {"t": 1561.7833333333333, "x": "十五万ドルという金額が大きいのか、"}, {"t": 1564.2166666666667, "x": "小さいのかは、ここでは言いません。"}, {"t": 1566.95, "x": "記録に残っているのは、決まりの高さに"}, {"t": 1569.6, "x": "届かなかった衛星が一機あったことです。"}, {"t": 1572.05, "x": "そして、それが、この委員会にとって初めての"}, {"t": 1575.5, "x": "取り締まりの対象になった、ということです。"}, {"t": 1578.4333333333334, "x": "墓場軌道の高さに上げられた衛星が、"}, {"t": 1580.9, "x": "もう一度仕事に戻った例があります。"}, {"t": 1583.55, "x": "インテルサット九〇一号という通信衛星です。"}, {"t": 1586.8, "x": "まだ動いていましたが、燃料が少なくなっていました。"}, {"t": 1590.35, "x": "二〇一九年十月九日、一機の"}, {"t": 1593.2, "x": "変わった宇宙機が打ち上げられました。"}, {"t": 1595.2666666666667, "x": " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
