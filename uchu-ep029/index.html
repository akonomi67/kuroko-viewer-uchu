<script>
const D={"name": "ep029", "file": "ep029", "dur": 1834.5333125, "segs": [], "subs": [{"t": 0.0, "x": "ほかの惑星の衛星のまわりを"}, {"t": 1.9, "x": "回った探査機は、これまでにゼロです。"}, {"t": 4.55, "x": "一機もありません。"}, {"t": 5.733333333333333, "x": "最初の一機になる予定の機体は、"}, {"t": 7.783333333333333, "x": "木星の衛星ガニメデを目指しています。"}, {"t": 10.616666666666667, "x": "まわりに入るのは二〇三四年十二月の予定です。"}, {"t": 14.083333333333334, "x": "地球の月のまわりを回った探査機なら、たくさんあります。"}, {"t": 17.883333333333333, "x": "アメリカ、旧ソ連、日本、ヨーロッパ、中国、インド。"}, {"t": 23.416666666666668, "x": "多くの国が月へ機体を送りました。"}, {"t": 25.8, "x": "では地球の月ではない衛星はどうでしょうか。"}, {"t": 28.683333333333334, "x": "火星にも木星にも土星にも衛星があります。"}, {"t": 31.65, "x": "けれども火星の二つの月にも、土星のタイタンにも、"}, {"t": 35.083333333333336, "x": "そばにとどまって調べた機体はまだないのです。"}, {"t": 38.083333333333336, "x": "近くを通り過ぎた機体はあります。"}, {"t": 40.31666666666667, "x": "写真を撮って去っていった機体もあります。"}, {"t": 42.75, "x": "この空いた欄に初めて名前が"}, {"t": 44.483333333333334, "x": "入る予定なのが、ESAの探査機です。"}, {"t": 47.18333333333333, "x": "ESAはヨーロッパ宇宙機関のことです。"}, {"t": 49.6, "x": "名前はジュースといいます。"}, {"t": 51.21666666666667, "x": "英語の正式な名前は、木星の"}, {"t": 53.733333333333334, "x": "氷の衛星の探検機という意味です。"}, {"t": 56.11666666666667, "x": "その頭文字をつなぐとジュースと読めます。"}, {"t": 58.68333333333333, "x": "行き先は木星の衛星ガニメデです。"}, {"t": 61.13333333333333, "x": "まわりに入るのは、いまから八年あまり先のことです。"}, {"t": 64.81666666666666, "x": "ガニメデは太陽系でいちばん大きな衛星です。"}, {"t": 67.86666666666666, "x": "惑星の水星よりも大きいとされています。"}, {"t": 70.6, "x": "その氷の下には海があると考えられています。"}, {"t": 73.63333333333334, "x": "そして、自分で磁場を作るただ一つの衛星でもあります。"}, {"t": 77.58333333333333, "x": "四百年あまり前に、小さな光の点として見つかった天体。"}, {"t": 81.83333333333333, "x": "そこを目指していまも宇宙を飛んでいる一機。"}, {"t": 84.45, "x": "この回はその二つの記録をたどります。"}, {"t": 86.98333333333333, "x": "ガニメデには写真があります。"}, {"t": 88.75, "x": "けれども、その写真は"}, {"t": 90.41666666666667, "x": "すべて通りがかりに撮られたものです。"}, {"t": 92.58333333333333, "x": "そして、いちばん知りたい場所は写真には写りません。"}, {"t": 96.15, "x": "氷の下の海です。"}, {"t": 97.63333333333334, "x": "一六一〇年一月七日。"}, {"t": 99.86666666666666, "x": "イタリアに、一人の天文学者がいました。"}, {"t": 102.81666666666666, "x": "ガリレオ・ガリレイです。"}, {"t": 104.2, "x": "その夜、ガリレオは望遠鏡を木星に向けました。"}, {"t": 107.81666666666666, "x": "木星のそばに小さな光の点が並んでいました。"}, {"t": 110.95, "x": "最初は遠くの星のように見えました。"}, {"t": 113.38333333333334, "x": "たまたま木星の近くに見えているだけだ、とも思えました。"}, {"t": 117.18333333333334, "x": "ところが次の夜に見ると様子が違いました。"}, {"t": 120.0, "x": "点の並び方が変わっていたのです。"}, {"t": 122.16666666666667, "x": "その次の夜もまた変わっていました。"}, {"t": 124.43333333333334, "x": "遠くの星ならこんなふうに並びは変わりません。"}, {"t": 127.31666666666666, "x": "数日のうちにガリレオは答えにたどりつきました。"}, {"t": 130.31666666666666, "x": "これらの点は木星のまわりを回る月だ、という答えです。"}, {"t": 134.26666666666668, "x": "地球ではない天体のまわりを、別の天体が回っている。"}, {"t": 138.11666666666667, "x": "当時は、すべてが地球を中心に回ると考えられていました。"}, {"t": 142.36666666666667, "x": "木星の月はその考えに合わない証拠になりました。"}, {"t": 145.73333333333332, "x": "ガリレオが見つけた月は四つでした。"}, {"t": 147.98333333333332, "x": "ガリレオはこの四つを、メディチ家の星と呼びました。"}, {"t": 151.4, "x": "メディチ家はガリレオを支えた名家です。"}, {"t": 153.8, "x": "ガリレオは月に番号もつけました。"}, {"t": 156.05, "x": "木星に近い順に、一、二、三、四。"}, {"t": 160.38333333333333, "x": "番号はローマ数字で書かれました。"}, {"t": 162.58333333333334, "x": "三番目の月がのちのガニメデです。"}, {"t": 164.88333333333333, "x": "同じころ、ドイツにもう一人いました。"}, {"t": 167.6, "x": "木星の月を見ていたかもしれない人です。"}, {"t": 170.28333333333333, "x": "天文学者のシモン・マリウスです。"}, {"t": 172.43333333333334, "x": "ただ、マリウスはすぐには記録を出しませんでした。"}, {"t": 175.78333333333333, "x": "そのため、見つけた人として"}, {"t": 177.75, "x": "名前が残ったのはガリレオでした。"}, {"t": 179.76666666666668, "x": "一方で、月の名前のほうはマリウスの案が残りました。"}, {"t": 183.6, "x": "一六一四年のことです。"}, {"t": 185.65, "x": "マリウスが出したのは、ギリシャ神話の人物の名前でした。"}, {"t": 189.4, "x": "それを四つの月につけようという案です。"}, {"t": 191.96666666666667, "x": "この案は、天文学者ケプラーの"}, {"t": 194.23333333333332, "x": "助言から生まれたとされています。"}, {"t": 196.08333333333334, "x": "神話の神々の王ゼウスは、ローマでは"}, {"t": 198.88333333333333, "x": "ユピテルと呼ばれます。"}, {"t": 200.13333333333333, "x": "英語ではジュピター。"}, {"t": 201.4, "x": "つまり木星のことです。"}, {"t": 203.05, "x": "四つの月には、ゼウスにゆかりのある者の"}, {"t": 205.95, "x": "名前が選ばれました。"}, {"t": 207.28333333333333, "x": "イオ。"}, {"t": 208.4, "x": "エウロパ。"}, {"t": 209.51666666666668, "x": "ガニメデ。"}, {"t": 210.61666666666667, "x": "カリスト。"}, {"t": 211.7, "x": "木星に近い順に並べるとこうなります。"}, {"t": 214.4, "x": "ガニメデは内側から三番目です。"}, {"t": 216.61666666666667, "x": "ガリレオの番号の三と同じ順番です。"}, {"t": 219.26666666666668, "x": "ガニメデは神話の中では一人の少年です。"}, {"t": 222.06666666666666, "x": "ゼウスは鷲の姿になって少年をさらいました。"}, {"t": 225.1, "x": "そして神々の住む山へ連れていきました。"}, {"t": 227.66666666666666, "x": "少年はそこで、神々に飲み物を"}, {"t": 230.21666666666667, "x": "つぐ役目をつとめたといいます。"}, {"t": 232.03333333333333, "x": "いま使われているのは、マリウスが"}, {"t": 234.33333333333334, "x": "出したこの四つの名前です。"}, {"t": 236.01666666666668, "x": "ガリレオの記録の中で、ガニメデはローマ数字の三でした。"}, {"t": 239.95, "x": "マリウスの案では神話の少年でした。"}, {"t": 242.36666666666667, "x": "一つの天体に、番号と名前の二つが"}, {"t": 245.31666666666666, "x": "与えられたことになります。"}, {"t": 246.83333333333334, "x": "番号は、見つけた人の数え方です。"}, {"t": 249.63333333333333, "x": "名前は、物語から借りたものです。"}, {"t": 252.41666666666666, "x": "望遠鏡で見えたのはただの光の点でした。"}, {"t": 255.25, "x": "形も色も分かりません。"}, {"t": 256.93333333333334, "x": "分かったのは、木星のまわりを"}, {"t": 259.0833333333333, "x": "回っているということだけでした。"}, {"t": 260.9166666666667, "x": "その点がどんな世界なのか。"}, {"t": 262.76666666666665, "x": "答えが出始めるのは、それから"}, {"t": 264.98333333333335, "x": "三百七十年ほどあとのことです。"}, {"t": 267.26666666666665, "x": "ガニメデの直径は、約五千二百六十キロメートルです。"}, {"t": 271.25, "x": "比べる相手として水星を見てみます。"}, {"t": 273.68333333333334, "x": "水星の半径は約二千四百四十キロメートル。"}, {"t": 277.0833333333333, "x": "二倍にすると、直径は約四千八百八十キロメートルです。"}, {"t": 281.51666666666665, "x": "つまり、ガニメデは水星よりも幅が広いのです。"}, {"t": 284.98333333333335, "x": "衛星でありながら惑星よりも大きい。"}, {"t": 287.45, "x": "準惑星の冥王星よりも大きな天体です。"}, {"t": 290.45, "x": "土星の衛星タイタンよりも大きく、衛星の中では一番です。"}, {"t": 294.9166666666667, "x": "けれども、ガニメデは太陽の"}, {"t": 296.98333333333335, "x": "まわりを直接は回っていません。"}, {"t": 298.96666666666664, "x": "回っている相手は木星です。"}, {"t": 300.93333333333334, "x": "惑星のまわりを回る天体を、衛星と呼びます。"}, {"t": 304.48333333333335, "x": "地球にとっての月がそれにあたります。"}, {"t": 306.8666666666667, "x": "どんなに大きくても、惑星を回っていれば衛星です。"}, {"t": 310.5, "x": "だからガニメデも、木星を回る衛星の一つです。"}, {"t": 314.0833333333333, "x": "木星には、ほかにもたくさんの衛星があります。"}, {"t": 317.4166666666667, "x": "その中で、ガニメデは別格の大きさです。"}, {"t": 320.48333333333335, "x": "木星との間は約百七万キロメートル。"}, {"t": 323.31666666666666, "x": "地球と月の距離の、およそ三倍にあたります。"}, {"t": 326.6666666666667, "x": "ガニメデはこの道を約七日で一周します。"}, {"t": 329.55, "x": "もう少しくわしく言うと七・一五五日です。"}, {"t": 332.51666666666665, "x": "そして木星と一緒に、約十二年かけて太陽を一周します。"}, {"t": 336.85, "x": "ガニメデはいつも同じ面を木星に向けています。"}, {"t": 339.81666666666666, "x": "夜空の月の模様が、いつ見ても"}, {"t": 342.2, "x": "変わらないのと同じ仕組みです。"}, {"t": 344.03333333333336, "x": "木星の側から見ると、ガニメデは"}, {"t": 346.56666666666666, "x": "いつも同じ顔を見せています。"}, {"t": 348.3, "x": "反対側の面は木星からは一度も見えません。"}, {"t": 351.3666666666667, "x": "ガニメデより内側には、イオとエウロパが回っています。"}, {"t": 354.96666666666664, "x": "この三つの月の動きには、きれいな決まりがあります。"}, {"t": 358.46666666666664, "x": "いちばん内側のイオは足の速い月です。"}, {"t": 361.1666666666667, "x": "その外のエウロパはイオの半分の速さで回ります。"}, {"t": 364.35, "x": "さらに外のガニメデは、エウロパの半分の速さで回ります。"}, {"t": 368.3833333333333, "x": "ガニメデが木星を一周するあいだに、"}, {"t": 370.73333333333335, "x": "エウロパはちょうど二周します。"}, {"t": 372.9, "x": "イオはちょうど四周します。"}, {"t": 374.6, "x": "この比は崩れません。"}, {"t": 376.01666666666665, "x": "何周しても同じです。"}, {"t": 377.56666666666666, "x": "一対二対四。"}, {"t": 378.76666666666665, "x": "三つの月はたがいに引き合いながら、"}, {"t": 380.8833333333333, "x": "この比を保って回り続けています。"}, {"t": 383.4, "x": "木星のまわりでは、三つが一つの"}, {"t": 385.9166666666667, "x": "組になって動いているのです。"}, {"t": 387.68333333333334, "x": "ガニメデの地面はとても冷たい場所です。"}, {"t": 390.21666666666664, "x": "昼の温度は絶対温度で九十度から百六十度。"}, {"t": 393.6, "x": "セ氏にすると、マイナス約百八十三度から"}, {"t": 396.81666666666666, "x": "マイナス約百十三度です。"}, {"t": 398.6166666666667, "x": "表面は茶色がかった灰色をしています。"}, {"t": 401.25, "x": "岩の成分と氷が混ざってこの色になっています。"}, {"t": 404.3333333333333, "x": "地面の上には厚い空気がありません。"}, {"t": 406.6666666666667, "x": "雲も雨もありません。"}, {"t": 408.1166666666667, "x": "青い空もありません。"}, {"t": 409.55, "x": "昼でも空は黒いままです。"}, {"t": 411.4, "x": "木星に向いた側の空には、大きな木星が"}, {"t": 414.6666666666667, "x": "浮かんでいるはずです。"}, {"t": 415.81666666666666, "x": "大きさは惑星なみでも体の多くは氷です。"}, {"t": 418.8833333333333, "x": "水星より幅の広い氷の玉が、"}, {"t": 421.18333333333334, "x": "七日ごとに木星のまわりを回っています。"}, {"t": 424.1166666666667, "x": "ガニメデが近くから写されたのは、"}, {"t": 426.1, "x": "一九七〇年代の終わりのことでした。"}, {"t": 429.23333333333335, "x": "一九七九年のことです。"}, {"t": 431.6666666666667, "x": "アメリカのボイジャー1号と2号が、木星に着きました。"}, {"t": 435.51666666666665, "x": "二機は木星のそばを通り過ぎながら、その月も撮りました。"}, {"t": 439.46666666666664, "x": "一九七九年三月五日。"}, {"t": 442.1166666666667, "x": "ボイジャー1号の撮った一枚に、"}, {"t": 444.0833333333333, "x": "ガニメデの姿が残っています。"}, {"t": 446.3833333333333, "x": "写真から、ガニメデには二種類の"}, {"t": 448.75, "x": "地面があることが分かりました。"}, {"t": 450.53333333333336, "x": "一つは暗い色の地面です。"}, {"t": 452.4166666666667, "x": "ここにはクレーターがたくさんあります。"}, {"t": 454.65, "x": "クレーターが多い地面は、長いあいだ"}, {"t": 457.23333333333335, "x": "作り変えられていません。"}, {"t": 458.6333333333333, "x": "暗い地面は、ガニメデの中でも"}, {"t": 460.93333333333334, "x": "古い場所と考えられています。"}, {"t": 462.78333333333336, "x": "表面のおよそ四十パーセントを占めます。"}, {"t": 465.3833333333333, "x": "もう一つは明るい色の地面です。"}, {"t": 467.53333333333336, "x": "こちらは表面のおよそ六十パーセントを占めます。"}, {"t": 470.6, "x": "明るい地面には、溝のような筋が何本も走っています。"}, {"t": 474.53333333333336, "x": "筋に沿って、尾根が盛り上がっている場所もあります。"}, {"t": 477.95, "x": "高さは七百メートルほどです。"}, {"t": 480.01666666666665, "x": "明るい地面は、暗い地面より若いと考えられています。"}, {"t": 483.95, "x": "地殻が動いて、割れて、作り変えられた跡だとされます。"}, {"t": 488.05, "x": "地面の上には点々と光る明るいしみもあります。"}, {"t": 491.15, "x": "新しくできたクレーターと、そのとき飛び散ったものです。"}, {"t": 494.8666666666667, "x": "古い地面と、若い地面。"}, {"t": 497.01666666666665, "x": "暗い場所と、明るい場所。"}, {"t": 499.1666666666667, "x": "ガニメデの表面は、何度も作り変えられてきたのです。"}, {"t": 502.8833333333333, "x": "ただ、どうやって作り変えられたのかは分かっていません。"}, {"t": 506.3333333333333, "x": "くわしく調べるには、もっと近くで"}, {"t": 508.75, "x": "長く見る必要がありました。"}, {"t": 510.51666666666665, "x": "ボイジャーの次に来たのは、"}, {"t": 512.0, "x": "NASAの探査機ガリレオでした。"}, {"t": 514.0833333333334, "x": "ガリレオはガニメデのそばを何度も通りました。"}, {"t": 516.85, "x": "最初は一九九六年六月です。"}, {"t": 519.7666666666667, "x": "ガニメデの上空約八百三十五キロメートルを通りました。"}, {"t": 523.4833333333333, "x": "このときの観測で、ガニメデが"}, {"t": 525.7166666666667, "x": "自分の磁場を持つことが分かりました。"}, {"t": 527.9166666666666, "x": "この話は次の章でくわしく触れます。"}, {"t": 530.5166666666667, "x": "ガリレオが最後に近くを通ったのは、"}, {"t": 532.7166666666667, "x": "二〇〇〇年五月のことです。"}, {"t": 534.6833333333333, "x": "それからしばらく、ここまで"}, {"t": 536.6833333333333, "x": "近づく機体はありませんでした。"}, {"t": 538.55, "x": "二〇二一年六月七日。"}, {"t": 540.7166666666667, "x": "NASAの探査機ジュノーが、ガニメデのそばを通りました。"}, {"t": 544.2, "x": "最も近づいたときの距離は約千三十八キロメートル。"}, {"t": 547.8, "x": "これほど近づいた機体は二十年あまりぶりでした。"}, {"t": 550.8166666666667, "x": "ジュノーは時速約六万七千キロメートルの"}, {"t": 553.5, "x": "速さで横切っていきました。"}, {"t": 555.15, "x": "その記録からは、表面に塩や"}, {"t": 557.5166666666667, "x": "有機物があることも見えてきました。"}, {"t": 559.6333333333333, "x": "こうして、ガニメデの写真はいくつも残されています。"}, {"t": 563.15, "x": "ただし、どれも通り過ぎながら撮ったものです。"}, {"t": 566.25, "x": "近づいて、離れて、それで終わり。"}, {"t": 569.2, "x": "同じ地面を何度も上から見続けた機体は、まだありません。"}, {"t": 573.2166666666667, "x": "地面の下を、長い時間をかけて"}, {"t": 575.5833333333334, "x": "測り続けた機体もありません。"}, {"t": 577.4166666666666, "x": "いまあるガニメデの記録は、"}, {"t": 578.9833333333333, "x": "短い出会いをつなぎ合わせたものです。"}, {"t": 581.65, "x": "方位磁石の針は北を指します。"}, {"t": 583.8, "x": "それは地球が大きな磁石になっているからです。"}, {"t": 586.7166666666667, "x": "地球の中心にはとけた鉄が流れています。"}, {"t": 589.5166666666667, "x": "その流れが地球全体を包む磁場を作っています。"}, {"t": 592.7833333333333, "x": "この磁場は、目に見えない大きな傘のようなものです。"}, {"t": 596.3, "x": "宇宙から飛んでくる電気を帯びた"}, {"t": 598.1666666666666, "x": "粒を、横へそらしてくれます。"}, {"t": 600.3666666666667, "x": "惑星の中には、自分の磁場を持つものがいくつもあります。"}, {"t": 604.25, "x": "水星も、木星も、土星も持っています。"}, {"t": 607.6833333333333, "x": "けれども衛星となると話が変わります。"}, {"t": 610.2333333333333, "x": "自分の磁場を持つと分かっている"}, {"t": 612.05, "x": "衛星は、ガニメデだけです。"}, {"t": 614.1333333333333, "x": "この磁場を見つけたのが、一九九六年の"}, {"t": 617.55, "x": "探査機ガリレオでした。"}, {"t": 618.8833333333333, "x": "なぜガニメデだけが磁場を持つのでしょうか。"}, {"t": 621.4166666666666, "x": "ガニメデの中心には、金属の鉄でできた"}, {"t": 624.3666666666667, "x": "核があると考えられています。"}, {"t": 626.1666666666666, "x": "この核が磁場を生んでいるとされます。"}, {"t": 628.3833333333333, "x": "核のまわりを岩の層が包んでいます。"}, {"t": 630.8333333333334, "x": "岩の層のまわりをさらに氷の層が包んでいます。"}, {"t": 634.0166666666667, "x": "中心に鉄。"}, {"t": 635.0833333333334, "x": "その外に岩。"}, {"t": 636.1666666666666, "x": "いちばん外に氷。"}, {"t": 637.5833333333334, "x": "ガニメデは、三重の玉のような作りだと考えられています。"}, {"t": 641.4166666666666, "x": "いちばん外の氷の殻の中に、海があるとされています。"}, {"t": 645.2833333333333, "x": "その話は少しあとに出てきます。"}, {"t": 647.55, "x": "ここでガニメデのいる場所を思い出してみます。"}, {"t": 650.2, "x": "ガニメデが回っているのは木星のまわりです。"}, {"t": 652.95, "x": "木星はとても強い磁場を持っています。"}, {"t": 655.4666666666667, "x": "木星の磁場のほうが、ずっと大きな広がりを持っています。"}, {"t": 659.3333333333334, "x": "その磁場は、木星から遠く離れた場所まで広がっています。"}, {"t": 663.35, "x": "ガニメデはその磁場の中を回っているのです。"}, {"t": 666.0666666666667, "x": "木星の磁場の中では、電気を"}, {"t": 668.4, "x": "帯びた粒がたくさん飛び回っています。"}, {"t": 670.5833333333334, "x": "ガニメデ自身の磁場は、その中に"}, {"t": 672.9333333333333, "x": "小さな空間を作っています。"}, {"t": 674.8333333333334, "x": "大きな磁石の中に小さな磁石が入っている。"}, {"t": 677.7666666666667, "x": "ガニメデのまわりはそんな形になっています。"}, {"t": 680.4333333333333, "x": "ガニメデの磁場には目に見える印もあります。"}, {"t": 683.1666666666666, "x": "オーロラです。"}, {"t": 684.0833333333334, "x": "地球では、北極や南極に近い空でオーロラが光ります。"}, {"t": 688.1833333333333, "x": "ガニメデでも、北と南の極を輪のように"}, {"t": 691.0166666666667, "x": "取り囲んでオーロラが光っています。"}, {"t": 693.1, "x": "ガニメデには地球のような厚い空気はありません。"}, {"t": 696.05, "x": "あるのは、酸素のとても薄い大気だと考えられています。"}, {"t": 699.85, "x": "その薄い大気の中で、紫外線のオーロラが光っています。"}, {"t": 703.6833333333333, "x": "紫外線は人の目には見えない光です。"}, {"t": 706.3166666666667, "x": "ガニメデのそばに立っても、このオーロラは見えません。"}, {"t": 709.5833333333334, "x": "特別な目を持つ望遠鏡でなければとらえられない光です。"}, {"t": 713.3666666666667, "x": "この光を宇宙から見ていたのが、"}, {"t": 715.3333333333334, "x": "ハッブル宇宙望遠鏡でした。"}, {"t": 717.5333333333333, "x": "そしてこのオーロラの揺れ方が、"}, {"t": 719.3, "x": "氷の下のことを教えてくれます。"}, {"t": 721.7833333333333, "x": "ガニメデのまわりの木星の磁場は、"}, {"t": 723.85, "x": "いつも同じではありません。"}, {"t": 725.7333333333333, "x": "時間とともに変わっていきます。"}, {"t": 727.6, "x": "木星の磁場が変わると、ガニメデの"}, {"t": 730.1833333333333, "x": "オーロラの輪もつられて動きます。"}, {"t": 732.0, "x": "輪は行ったり来たりと揺れるのです。"}, {"t": 734.0166666666667, "x": "ここに一つの考え方が生まれました。"}, {"t": 736.4666666666667, "x": "もしガニメデの地下に、塩を"}, {"t": 738.5166666666667, "x": "含んだ水の海があったらどうなるか。"}, {"t": 740.6666666666666, "x": "塩水は電気を通します。"}, {"t": 742.4666666666667, "x": "電気を通す海が、変わり続ける"}, {"t": 744.9, "x": "磁場の中に置かれたとします。"}, {"t": 746.6333333333333, "x": "すると海の中に電気の流れが生まれます。"}, {"t": 749.3333333333334, "x": "その流れは新しい磁場を作ります。"}, {"t": 751.7333333333333, "x": "この新しい磁場は、木星の磁場に逆らう向きに働きます。"}, {"t": 755.85, "x": "研究チームはこれを磁気の摩擦と呼びました。"}, {"t": 758.65, "x": "この摩擦がオーロラの揺れを抑えるのです。"}, {"t": 761.2333333333333, "x": "つまり、地下に海があればオーロラの揺れは"}, {"t": 764.0166666666667, "x": "小さくなります。"}, {"t": 765.0833333333334, "x": "海がなければオーロラは大きく揺れます。"}, {"t": 767.5833333333334, "x": "この違いを確かめた研究者たちがいます。"}, {"t": 770.3, "x": "ドイツのケルン大学のヨアヒム・ザウアーたちです。"}, {"t": 773.1, "x": "使ったのはハッブル宇宙望遠鏡です。"}, {"t": 775.6, "x": "地球の空気は紫外線の多くをさえぎります。"}, {"t": 778.5666666666667, "x": "地上の望遠鏡ではこの光はとらえにくいのです。"}, {"t": 781.8, "x": "空気の外にあるハッブルならそれができます。"}, {"t": 784.4833333333333, "x": "紫外線で光るオーロラを観測しました。"}, {"t": 787.1166666666667, "x": "そしてその輪がどれだけ揺れるかを測りました。"}, {"t": 789.8333333333334, "x": "計算では海がない場合は約六度揺れるはずでした。"}, {"t": 793.0833333333334, "x": "六度と二度。"}, {"t": 794.05, "x": "違いはわずかです。"}, {"t": 795.4, "x": "けれどもその差は海があるかないかの差でした。"}, {"t": 798.0166666666667, "x": "海がある場合は、揺れが約二度に抑えられるはずでした。"}, {"t": 801.7, "x": "観測から導かれたのは海があるほうの答えでした。"}, {"t": 804.9, "x": "揺れは小さかったのです。"}, {"t": 806.5666666666667, "x": "二〇一五年三月十二日、NASAはこの結果を発表しました。"}, {"t": 811.1166666666667, "x": "ガニメデの地下に海がある、"}, {"t": 812.6666666666666, "x": "これまでで最も強い証拠だという内容です。"}, {"t": 815.9666666666667, "x": "その海は地面のすぐ下にあるわけではありません。"}, {"t": 818.9, "x": "海の上には主に氷でできた殻がかぶさっています。"}, {"t": 822.15, "x": "殻の厚さは約百五十キロメートルと見積もられました。"}, {"t": 825.6166666666667, "x": "そして海の厚さは約百キロメートル。"}, {"t": 828.0666666666667, "x": "地球の海の深さの、およそ十倍にあたります。"}, {"t": 831.4666666666667, "x": "地球の表面には、海や川や湖があります。"}, {"t": 834.9333333333333, "x": "その水を全部集めても、この海の水には"}, {"t": 838.0, "x": "かなわないと考えられています。"}, {"t": 839.8666 }, {"t": 1153.2833333333333, "x": "機体そのものが出す磁場から、離しておくためです。"}, {"t": 1156.55, "x": "地球へデータを送るのは、直径二・五メートルの"}, {"t": 1160.0333333333333, "x": "大きなアンテナです。"}, {"t": 1161.1333333333334, "x": "ジュースの重さは、燃料をのぞいて"}, {"t": 1163.4666666666667, "x": "約二千四百二十キログラム。"}, {"t": 1165.5, "x": "燃料を満タンにすると、さらに約三千六百五十キログラムが"}, {"t": 1169.85, "x": "加わります。"}, {"t": 1170.6666666666667, "x": "積まれた観測の装置は十種類です。"}, {"t": 1173.1666666666667, "x": "地面を撮るカメラ。"}, {"t": 1174.4666666666667, "x": "地面の成分を調べる装置。"}, {"t": 1176.5833333333333, "x": "紫外線で大気やオーロラを見る装置。"}, {"t": 1179.1166666666666, "x": "磁場を測る装置もあります。"}, {"t": 1180.9666666666667, "x": "電気を帯びた粒は、別の装置で数えます。"}, {"t": 1184.15, "x": "重力は、電波を使った実験で調べます。"}, {"t": 1187.3333333333333, "x": "レーザーの光を地面に当てて、高さを測る装置もあります。"}, {"t": 1191.45, "x": "その名前はガラといいます。"}, {"t": 1193.2, "x": "そして、氷の中を電波で探るレーダーがあります。"}, {"t": 1196.7666666666667, "x": "名前はライムです。"}, {"t": 1198.05, "x": "集めた記録は、機体の中にためておけます。"}, {"t": 1201.1833333333334, "x": "その量は一・二五テラバイト。"}, {"t": 1203.3833333333334, "x": "地球へは、一日に二ギガビットを"}, {"t": 1205.85, "x": "超える量を送れるとされています。"}, {"t": 1207.8166666666666, "x": "ライムは、氷の地面の下を調べます。"}, {"t": 1210.75, "x": "届く深さは約九キロメートルです。"}, {"t": 1213.1666666666667, "x": "このライムで、打ち上げの直後に問題が起きました。"}, {"t": 1216.7, "x": "ライムのアンテナは長さが十六メートルあります。"}, {"t": 1219.5833333333333, "x": "ロケットの先端には入りきらないので、"}, {"t": 1221.9166666666667, "x": "折りたたんで積まれていました。"}, {"t": 1223.9333333333334, "x": "宇宙で、それを伸ばそうとしました。"}, {"t": 1226.4666666666667, "x": "ところが、最初の部分しか開きませんでした。"}, {"t": 1229.6, "x": "小さなピンが引っかかって、"}, {"t": 1231.1833333333334, "x": "残りを押さえているようでした。"}, {"t": 1233.3333333333333, "x": "運用チームは、ジュースのエンジンを小さく噴かしました。"}, {"t": 1236.9666666666667, "x": "機体を揺さぶって、ピンを外そうとしたのです。"}, {"t": 1240.1333333333334, "x": "太陽の光を当てて、温めてもみました。"}, {"t": 1243.2833333333333, "x": "アンテナは日ごとに少しずつ動きました。"}, {"t": 1245.75, "x": "けれども、開ききりません。"}, {"t": 1247.7833333333333, "x": "二〇二三年五月十二日。"}, {"t": 1250.0666666666666, "x": "チームは、引っかかった部分にある装置を作動させました。"}, {"t": 1253.8166666666666, "x": "その衝撃で、ピンが数ミリメートル動きました。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
