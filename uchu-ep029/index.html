<script>
const D={"name": "ep029", "file": "ep029", "dur": 1833.31665625, "segs": [], "subs": [{"t": 0.0, "x": "ほかの惑星の衛星のまわりを"}, {"t": 1.9, "x": "回った探査機は、これまでにゼロです。"}, {"t": 4.55, "x": "一機もありません。"}, {"t": 5.733333333333333, "x": "最初の一機になる予定の機体は、"}, {"t": 7.783333333333333, "x": "木星の衛星ガニメデを目指しています。"}, {"t": 10.616666666666667, "x": "まわりに入るのは二〇三四年十二月の予定です。"}, {"t": 14.083333333333334, "x": "地球の月のまわりを回った探査機なら、たくさんあります。"}, {"t": 17.883333333333333, "x": "アメリカ、旧ソ連、日本、ヨーロッパ、中国、インド。"}, {"t": 23.416666666666668, "x": "多くの国が月へ機体を送りました。"}, {"t": 25.8, "x": "では地球の月ではない衛星はどうでしょうか。"}, {"t": 28.683333333333334, "x": "火星にも木星にも土星にも衛星があります。"}, {"t": 31.65, "x": "けれども火星の二つの月にも、土星のタイタンにも、"}, {"t": 35.083333333333336, "x": "そばにとどまって調べた機体はまだないのです。"}, {"t": 38.083333333333336, "x": "近くを通り過ぎた機体はあります。"}, {"t": 40.31666666666667, "x": "写真を撮って去っていった機体もあります。"}, {"t": 42.75, "x": "この空いた欄に初めて名前が"}, {"t": 44.483333333333334, "x": "入る予定なのが、ESAの探査機です。"}, {"t": 47.18333333333333, "x": "ESAはヨーロッパ宇宙機関のことです。"}, {"t": 49.6, "x": "名前はジュースといいます。"}, {"t": 51.21666666666667, "x": "英語の正式な名前は、木星の"}, {"t": 53.733333333333334, "x": "氷の衛星の探検機という意味です。"}, {"t": 56.11666666666667, "x": "その頭文字をつなぐとジュースと読めます。"}, {"t": 58.68333333333333, "x": "行き先は木星の衛星ガニメデです。"}, {"t": 61.13333333333333, "x": "まわりに入るのは、いまから八年あまり先のことです。"}, {"t": 64.81666666666666, "x": "ガニメデは太陽系でいちばん大きな衛星です。"}, {"t": 67.86666666666666, "x": "惑星の水星よりも大きいとされています。"}, {"t": 70.6, "x": "その氷の下には海があると考えられています。"}, {"t": 73.63333333333334, "x": "そして、自分で磁場を作るただ一つの衛星でもあります。"}, {"t": 77.58333333333333, "x": "四百年あまり前に、小さな光の点として見つかった天体。"}, {"t": 81.83333333333333, "x": "そこを目指していまも宇宙を飛んでいる一機。"}, {"t": 84.45, "x": "この回はその二つの記録をたどります。"}, {"t": 86.98333333333333, "x": "ガニメデには写真があります。"}, {"t": 88.75, "x": "けれども、その写真は"}, {"t": 90.41666666666667, "x": "すべて通りがかりに撮られたものです。"}, {"t": 92.58333333333333, "x": "そして、いちばん知りたい場所は写真には写りません。"}, {"t": 96.15, "x": "氷の下の海です。"}, {"t": 97.63333333333334, "x": "一六一〇年一月七日。"}, {"t": 99.86666666666666, "x": "イタリアに、一人の天文学者がいました。"}, {"t": 102.81666666666666, "x": "ガリレオ・ガリレイです。"}, {"t": 104.2, "x": "その夜、ガリレオは望遠鏡を木星に向けました。"}, {"t": 107.81666666666666, "x": "木星のそばに小さな光の点が並んでいました。"}, {"t": 110.95, "x": "最初は遠くの星のように見えました。"}, {"t": 113.38333333333334, "x": "たまたま木星の近くに見えているだけだ、とも思えました。"}, {"t": 117.18333333333334, "x": "ところが次の夜に見ると様子が違いました。"}, {"t": 120.0, "x": "点の並び方が変わっていたのです。"}, {"t": 122.16666666666667, "x": "その次の夜もまた変わっていました。"}, {"t": 124.43333333333334, "x": "遠くの星ならこんなふうに並びは変わりません。"}, {"t": 127.31666666666666, "x": "数日のうちにガリレオは答えにたどりつきました。"}, {"t": 130.31666666666666, "x": "これらの点は木星のまわりを回る月だ、という答えです。"}, {"t": 134.26666666666668, "x": "地球ではない天体のまわりを、別の天体が回っている。"}, {"t": 138.11666666666667, "x": "当時は、すべてが地球を中心に回ると考えられていました。"}, {"t": 142.36666666666667, "x": "木星の月はその考えに合わない証拠になりました。"}, {"t": 145.73333333333332, "x": "ガリレオが見つけた月は四つでした。"}, {"t": 147.98333333333332, "x": "ガリレオはこの四つを、メディチ家の星と呼びました。"}, {"t": 151.4, "x": "メディチ家はガリレオを支えた名家です。"}, {"t": 153.8, "x": "ガリレオは月に番号もつけました。"}, {"t": 156.05, "x": "木星に近い順に、一、二、三、四。"}, {"t": 160.38333333333333, "x": "番号はローマ数字で書かれました。"}, {"t": 162.58333333333334, "x": "三番目の月がのちのガニメデです。"}, {"t": 164.88333333333333, "x": "同じころ、ドイツにもう一人いました。"}, {"t": 167.6, "x": "木星の月を見ていたかもしれない人です。"}, {"t": 170.28333333333333, "x": "天文学者のシモン・マリウスです。"}, {"t": 172.43333333333334, "x": "ただ、マリウスはすぐには記録を出しませんでした。"}, {"t": 175.78333333333333, "x": "そのため、見つけた人として"}, {"t": 177.75, "x": "名前が残ったのはガリレオでした。"}, {"t": 179.76666666666668, "x": "一方で、月の名前のほうはマリウスの案が残りました。"}, {"t": 183.6, "x": "一六一四年のことです。"}, {"t": 185.65, "x": "マリウスが出したのは、ギリシャ神話の人物の名前でした。"}, {"t": 189.4, "x": "それを四つの月につけようという案です。"}, {"t": 191.96666666666667, "x": "この案は、天文学者ケプラーの"}, {"t": 194.23333333333332, "x": "助言から生まれたとされています。"}, {"t": 196.08333333333334, "x": "神話の神々の王ゼウスは、ローマでは"}, {"t": 198.88333333333333, "x": "ユピテルと呼ばれます。"}, {"t": 200.13333333333333, "x": "英語ではジュピター。"}, {"t": 201.4, "x": "つまり木星のことです。"}, {"t": 203.05, "x": "四つの月には、ゼウスにゆかりのある者の"}, {"t": 205.95, "x": "名前が選ばれました。"}, {"t": 207.28333333333333, "x": "イオ。"}, {"t": 208.4, "x": "エウロパ。"}, {"t": 209.51666666666668, "x": "ガニメデ。"}, {"t": 210.61666666666667, "x": "カリスト。"}, {"t": 211.7, "x": "木星に近い順に並べるとこうなります。"}, {"t": 214.4, "x": "ガニメデは内側から三番目です。"}, {"t": 216.61666666666667, "x": "ガリレオの番号の三と同じ順番です。"}, {"t": 219.26666666666668, "x": "ガニメデは神話の中では一人の少年です。"}, {"t": 222.06666666666666, "x": "ゼウスは鷲の姿になって少年をさらいました。"}, {"t": 225.1, "x": "そして神々の住む山へ連れていきました。"}, {"t": 227.66666666666666, "x": "少年はそこで、神々に飲み物を"}, {"t": 230.21666666666667, "x": "つぐ役目をつとめたといいます。"}, {"t": 232.03333333333333, "x": "いま使われているのは、マリウスが"}, {"t": 234.33333333333334, "x": "出したこの四つの名前です。"}, {"t": 236.01666666666668, "x": "ガリレオの記録の中で、ガニメデはローマ数字の三でした。"}, {"t": 239.95, "x": "マリウスの案では神話の少年でした。"}, {"t": 242.36666666666667, "x": "一つの天体に、番号と名前の二つが"}, {"t": 245.31666666666666, "x": "与えられたことになります。"}, {"t": 246.83333333333334, "x": "番号は、見つけた人の数え方です。"}, {"t": 249.63333333333333, "x": "名前は、物語から借りたものです。"}, {"t": 252.41666666666666, "x": "望遠鏡で見えたのはただの光の点でした。"}, {"t": 255.25, "x": "形も色も分かりません。"}, {"t": 256.93333333333334, "x": "分かったのは、木星のまわりを"}, {"t": 259.0833333333333, "x": "回っているということだけでした。"}, {"t": 260.9166666666667, "x": "その点がどんな世界なのか。"}, {"t": 262.76666666666665, "x": "答えが出始めるのは、それから"}, {"t": 264.98333333333335, "x": "三百七十年ほどあとのことです。"}, {"t": 267.26666666666665, "x": "ガニメデの直径は、約五千二百六十キロメートルです。"}, {"t": 271.25, "x": "比べる相手として水星を見てみます。"}, {"t": 273.68333333333334, "x": "水星の半径は約二千四百四十キロメートル。"}, {"t": 277.0833333333333, "x": "二倍にすると、直径は約四千八百八十キロメートルです。"}, {"t": 281.51666666666665, "x": "つまり、ガニメデは水星よりも幅が広いのです。"}, {"t": 284.98333333333335, "x": "衛星でありながら惑星よりも大きい。"}, {"t": 287.45, "x": "準惑星の冥王星よりも大きな天体です。"}, {"t": 290.45, "x": "土星の衛星タイタンよりも大きく、衛星の中では一番です。"}, {"t": 294.9166666666667, "x": "けれども、ガニメデは太陽の"}, {"t": 296.98333333333335, "x": "まわりを直接は回っていません。"}, {"t": 298.96666666666664, "x": "回っている相手は木星です。"}, {"t": 300.93333333333334, "x": "惑星のまわりを回る天体を、衛星と呼びます。"}, {"t": 304.48333333333335, "x": "地球にとっての月がそれにあたります。"}, {"t": 306.8666666666667, "x": "どんなに大きくても、惑星を回っていれば衛星です。"}, {"t": 310.5, "x": "ガニメデは、その衛星の中でいちばん大きいのです。"}, {"t": 314.06666666666666, "x": "木星には、ほかにもたくさんの衛星があります。"}, {"t": 317.4, "x": "その中で、ガニメデは別格の大きさです。"}, {"t": 320.46666666666664, "x": "木星からの距離は約百七万キロメートル。"}, {"t": 323.35, "x": "地球と月の距離の、およそ三倍にあたります。"}, {"t": 326.7, "x": "ガニメデはこの道を約七日で一周します。"}, {"t": 329.5833333333333, "x": "もう少しくわしく言うと七・一五五日です。"}, {"t": 332.55, "x": "そして木星と一緒に、約十二年かけて太陽を一周します。"}, {"t": 336.8833333333333, "x": "ガニメデはいつも同じ面を木星に向けています。"}, {"t": 339.85, "x": "地球の月が、いつも同じ面を"}, {"t": 342.18333333333334, "x": "地球に向けているのと同じです。"}, {"t": 344.1333333333333, "x": "木星の側から見ると、ガニメデは"}, {"t": 346.6666666666667, "x": "いつも同じ顔を見せています。"}, {"t": 348.4, "x": "反対側の面は木星からは一度も見えません。"}, {"t": 351.46666666666664, "x": "ガニメデより内側には、イオとエウロパが回っています。"}, {"t": 355.06666666666666, "x": "この三つの月の動きには、きれいな決まりがあります。"}, {"t": 358.56666666666666, "x": "いちばん内側のイオは足の速い月です。"}, {"t": 361.26666666666665, "x": "その外のエウロパはイオの半分の速さで回ります。"}, {"t": 364.45, "x": "さらに外のガニメデは、エウロパの半分の速さで回ります。"}, {"t": 368.48333333333335, "x": "ガニメデが木星を一周するあいだに、"}, {"t": 370.8333333333333, "x": "エウロパはちょうど二周します。"}, {"t": 373.0, "x": "イオはちょうど四周します。"}, {"t": 374.7, "x": "この比は崩れません。"}, {"t": 376.1166666666667, "x": "何周しても同じです。"}, {"t": 377.6666666666667, "x": "一対二対四。"}, {"t": 378.8666666666667, "x": "三つの月はたがいに引き合いながら、"}, {"t": 380.98333333333335, "x": "この比を保って回り続けています。"}, {"t": 383.5, "x": "木星のまわりでは、三つが一つの"}, {"t": 386.01666666666665, "x": "組になって動いているのです。"}, {"t": 387.78333333333336, "x": "ガニメデの地面はとても冷たい場所です。"}, {"t": 390.31666666666666, "x": "昼の温度は絶対温度で九十度から百六十度。"}, {"t": 393.7, "x": "セ氏にすると、マイナス約百八十三度から"}, {"t": 396.9166666666667, "x": "マイナス約百十三度です。"}, {"t": 398.71666666666664, "x": "表面は茶色がかった灰色をしています。"}, {"t": 401.35, "x": "岩の成分と氷が混ざってこの色になっています。"}, {"t": 404.43333333333334, "x": "地面の上には厚い空気がありません。"}, {"t": 406.76666666666665, "x": "雲も雨もありません。"}, {"t": 408.21666666666664, "x": "青い空もありません。"}, {"t": 409.65, "x": "昼でも空は黒いままです。"}, {"t": 411.5, "x": "木星に向いた側の空には、大きな木星が"}, {"t": 414.76666666666665, "x": "浮かんでいるはずです。"}, {"t": 415.9166666666667, "x": "大きさは惑星なみでも体の多くは氷です。"}, {"t": 418.98333333333335, "x": "水星より幅の広い氷の玉が、"}, {"t": 421.28333333333336, "x": "七日ごとに木星のまわりを回っています。"}, {"t": 424.21666666666664, "x": "ガニメデが近くから写されたのは、"}, {"t": 426.2, "x": "一九七〇年代の終わりのことでした。"}, {"t": 429.3333333333333, "x": "一九七九年のことです。"}, {"t": 431.76666666666665, "x": "アメリカのボイジャー1号と2号が、木星に着きました。"}, {"t": 435.6166666666667, "x": "二機は木星のそばを通り過ぎながら、その月も撮りました。"}, {"t": 439.56666666666666, "x": "一九七九年三月五日。"}, {"t": 442.21666666666664, "x": "ボイジャー1号の撮った一枚に、"}, {"t": 444.18333333333334, "x": "ガニメデの姿が残っています。"}, {"t": 446.48333333333335, "x": "写真から、ガニメデには二種類の"}, {"t": 448.85, "x": "地面があることが分かりました。"}, {"t": 450.6333333333333, "x": "一つは暗い色の地面です。"}, {"t": 452.51666666666665, "x": "ここにはクレーターがたくさんあります。"}, {"t": 454.75, "x": "クレーターが多い地面は、長いあいだ"}, {"t": 457.3333333333333, "x": "作り変えられていません。"}, {"t": 458.73333333333335, "x": "暗い地面は、ガニメデの中でも"}, {"t": 461.03333333333336, "x": "古い場所と考えられています。"}, {"t": 462.8833333333333, "x": "表面のおよそ四十パーセントを占めます。"}, {"t": 465.48333333333335, "x": "もう一つは明るい色の地面です。"}, {"t": 467.6333333333333, "x": "こちらは表面のおよそ六十パーセントを占めます。"}, {"t": 470.7, "x": "明るい地面には、溝のような筋が何本も走っています。"}, {"t": 474.6333333333333, "x": "筋に沿って、尾根が盛り上がっている場所もあります。"}, {"t": 478.05, "x": "高さは七百メートルほどです。"}, {"t": 480.1166666666667, "x": "明るい地面は、暗い地面より若いと考えられています。"}, {"t": 484.05, "x": "地殻が動いて、割れて、作り変えられた跡だとされます。"}, {"t": 488.15, "x": "地面の上には点々と光る明るいしみもあります。"}, {"t": 491.25, "x": "新しくできたクレーターと、そのとき飛び散ったものです。"}, {"t": 494.96666666666664, "x": "古い地面と、若い地面。"}, {"t": 497.1166666666667, "x": "暗い場所と、明るい場所。"}, {"t": 499.26666666666665, "x": "ガニメデの表面は、何度も作り変えられてきたのです。"}, {"t": 502.98333333333335, "x": "ただ、どうやって作り変えられたのかは分かっていません。"}, {"t": 506.43333333333334, "x": "くわしく調べるには、もっと近くで"}, {"t": 508.85, "x": "長く見る必要がありました。"}, {"t": 510.6166666666667, "x": "ボイジャーの次に来たのは、"}, {"t": 512.1, "x": "NASAの探査機ガリレオでした。"}, {"t": 514.1833333333333, "x": "ガリレオはガニメデのそばを何度も通りました。"}, {"t": 516.95, "x": "最初は一九九六年六月です。"}, {"t": 519.8666666666667, "x": "ガニメデの上空約八百三十五キロメートルを通りました。"}, {"t": 523.5833333333334, "x": "このときの観測で、ガニメデが"}, {"t": 525.8166666666667, "x": "自分の磁場を持つことが分かりました。"}, {"t": 528.0166666666667, "x": "この話は次の章でくわしく触れます。"}, {"t": 530.6166666666667, "x": "ガリレオが最後に近くを通ったのは、"}, {"t": 532.8166666666667, "x": "二〇〇〇年五月のことです。"}, {"t": 534.7833333333333, "x": "それからしばらく、ここまで"}, {"t": 536.7833333333333, "x": "近づく機体はありませんでした。"}, {"t": 538.65, "x": "二〇二一年六月七日。"}, {"t": 540.8166666666667, "x": "NASAの探査機ジュノーが、ガニメデのそばを通りました。"}, {"t": 544.3, "x": "最も近づいたときの距離は約千三十八キロメートル。"}, {"t": 547.9, "x": "これほど近づいた機体は二十年あまりぶりでした。"}, {"t": 550.9166666666666, "x": "ジュノーは時速約六万七千キロメートルの"}, {"t": 553.6, "x": "速さで横切っていきました。"}, {"t": 555.25, "x": "その記録からは、表面に塩や"}, {"t": 557.6166666666667, "x": "有機物があることも見えてきました。"}, {"t": 559.7333333333333, "x": "こうして、ガニメデの写真はいくつも残されています。"}, {"t": 563.25, "x": "ただし、どれも通り過ぎながら撮ったものです。"}, {"t": 566.35, "x": "近づいて、離れて、それで終わり。"}, {"t": 569.3, "x": "同じ地面を何度も上から見続けた機体は、まだありません。"}, {"t": 573.3166666666667, "x": "地面の下を、長い時間をかけて"}, {"t": 575.6833333333333, "x": "測り続けた機体もありません。"}, {"t": 577.5166666666667, "x": "いまあるガニメデの記録は、"}, {"t": 579.0833333333334, "x": "短い出会いをつなぎ合わせたものです。"}, {"t": 581.75, "x": "方位磁石の針は北を指します。"}, {"t": 583.9, "x": "それは地球が大きな磁石になっているからです。"}, {"t": 586.8166666666667, "x": "地球の中心にはとけた鉄が流れています。"}, {"t": 589.6166666666667, "x": "その流れが地球全体を包む磁場を作っています。"}, {"t": 592.8833333333333, "x": "この磁場は、目に見えない大きな傘のようなものです。"}, {"t": 596.4, "x": "宇宙から飛んでくる電気を帯びた"}, {"t": 598.2666666666667, "x": "粒を、横へそらしてくれます。"}, {"t": 600.4666666666667, "x": "惑星の中には、自分の磁場を持つものがいくつもあります。"}, {"t": 604.35, "x": "水星も、木星も、土星も持っています。"}, {"t": 607.7833333333333, "x": "けれども衛星となると話が変わります。"}, {"t": 610.3333333333334, "x": "自分の磁場を持つと分かっている"}, {"t": 612.15, "x": "衛星は、ガニメデだけです。"}, {"t": 614.2333333333333, "x": "この磁場を見つけたのが、一九九六年の"}, {"t": 617.65, "x": "探査機ガリレオでした。"}, {"t": 618.9833333333333, "x": "なぜガニメデだけが磁場を持つのでしょうか。"}, {"t": 621.5166666666667, "x": "ガニメデの中心には、金属の鉄でできた"}, {"t": 624.4666666666667, "x": "核があると考えられています。"}, {"t": 626.2666666666667, "x": "この核が磁場を生んでいるとされます。"}, {"t": 628.4833333333333, "x": "核のまわりを岩の層が包んでいます。"}, {"t": 630.9333333333333, "x": "岩の層のまわりをさらに氷の層が包んでいます。"}, {"t": 634.1166666666667, "x": "中心に鉄。"}, {"t": 635.1833333333333, "x": "その外に岩。"}, {"t": 636.2666666666667, "x": "いちばん外に氷。"}, {"t": 637.6833333333333, "x": "ガニメデは、三重の玉のような作りだと考えられています。"}, {"t": 641.5166666666667, "x": "いちばん外の氷の殻の中に、海があるとされています。"}, {"t": 645.3833333333333, "x": "その話は少しあとに出てきます。"}, {"t": 647.65, "x": "ここでガニメデのいる場所を思い出してみます。"}, {"t": 650.3, "x": "ガニメデが回っているのは木星のまわりです。"}, {"t": 653.05, "x": "木星はとても強い磁場を持っています。"}, {"t": 655.5666666666667, "x": "木星の磁場のほうが、ずっと大きな広がりを持っています。"}, {"t": 659.4333333333333, "x": "その磁場は、木星から遠く離れた場所まで広がっています。"}, {"t": 663.45, "x": "ガニメデはその磁場の中を回っているのです。"}, {"t": 666.1666666666666, "x": "木星の磁場の中では、電気を"}, {"t": 668.5, "x": "帯びた粒がたくさん飛び回っています。"}, {"t": 670.6833333333333, "x": "ガニメデ自身の磁場は、その中に"}, {"t": 673.0333333333333, "x": "小さな空間を作っています。"}, {"t": 674.9333333333333, "x": "大きな磁石の中に小さな磁石が入っている。"}, {"t": 677.8666666666667, "x": "ガニメデのまわりはそんな形になっています。"}, {"t": 680.5333333333333, "x": "ガニメデの磁場には目に見える印もあります。"}, {"t": 683.2666666666667, "x": "オーロラです。"}, {"t": 684.1833333333333, "x": "地球では、北極や南極に近い空でオーロラが光ります。"}, {"t": 688.2833333333333, "x": "ガニメデでも、北と南の極を輪のように"}, {"t": 691.1166666666667, "x": "取り囲んでオーロラが光っています。"}, {"t": 693.2, "x": "ガニメデには地球のような厚い空気はありません。"}, {"t": 696.15, "x": "あるのは、酸素のとても薄い大気だと考えられています。"}, {"t": 699.95, "x": "その薄い大気の中で、紫外線のオーロラが光っています。"}, {"t": 703.7833333333333, "x": "紫外線は人の目には見えない光です。"}, {"t": 706.4166666666666, "x": "ガニメデのそばに立っても、このオーロラは見えません。"}, {"t": 709.6833333333333, "x": "特別な目を持つ望遠鏡でなければとらえられない光です。"}, {"t": 713.4666666666667, "x": "この光を宇宙から見ていたのが、"}, {"t": 715.4333333333333, "x": "ハッブル宇宙望遠鏡でした。"}, {"t": 717.6333333333333, "x": "そしてこのオーロラの揺れ方が、"}, {"t": 719.4, "x": "氷の下のことを教えてくれます。"}, {"t": 721.8833333333333, "x": "ガニメデのまわりの木星の磁場は、"}, {"t": 723.95, "x": "いつも同じではありません。"}, {"t": 725.8333333333334, "x": "時間とともに変わっていきます。"}, {"t": 727.7, "x": "木星の磁場が変わると、ガニメデの"}, {"t": 730.2833333333333, "x": "オーロラの輪もつられて動きます。"}, {"t": 732.1, "x": "輪は行ったり来たりと揺れるのです。"}, {"t": 734.1166666666667, "x": "ここに一つの考え方が生まれました。"}, {"t": 736.5666666666667, "x": "もしガニメデの地下に、塩を"}, {"t": 738.6166666666667, "x": "含んだ水の海があったらどうなるか。"}, {"t": 740.7666666666667, "x": "塩水は電気を通します。"}, {"t": 742.5666666666667, "x": "電気を通す海が、変わり続ける"}, {"t": 745.0, "x": "磁場の中に置かれたとします。"}, {"t": 746.7333333333333, "x": "すると海の中に電気の流れが生まれます。"}, {"t": 749.4333333333333, "x": "その流れは新しい磁場を作ります。"}, {"t": 751.8333333333334, "x": "この新しい磁場は、木星の磁場に逆らう向きに働きます。"}, {"t": 755.95, "x": "研究チームはこれを磁気の摩擦と呼びました。"}, {"t": 758.75, "x": "この摩擦がオーロラの揺れを抑えるのです。"}, {"t": 761.3333333333334, "x": "つまり、地下に海があればオーロラの揺れは"}, {"t": 764.1166666666667, "x": "小さくなります。"}, {"t": 765.1833333333333, "x": "海がなければオーロラは大きく揺れます。"}, {"t": 767.6833333333333, "x": "この違いを確かめた研究者たちがいます。"}, {"t": 770.4, "x": "ドイツのケルン大学のヨアヒム・ザウアーたちです。"}, {"t": 773.2, "x": "使ったのはハッブル宇宙望遠鏡です。"}, {"t": 775.7, "x": "地球の空気は紫外線の多くをさえぎります。"}, {"t": 778.6666666666666, "x": "地上の望遠鏡ではこの光はとらえにくいのです。"}, {"t": 781.9, "x": "空気の外にあるハッブルならそれができます。"}, {"t": 784.5833333333334, "x": "紫外線で光るオーロラを観測しました。"}, {"t": 787.2166666666667, "x": "そしてその輪がどれだけ揺れるかを測りました。"}, {"t": 789.9333333333333, "x": "計算では海がない場合は約六度揺れるはずでした。"}, {"t": 793.1833333333333, "x": "六度と二度。"}, {"t": 794.15, "x": "違いはわずかです。"}, {"t": 795.5, "x": "けれどもその差は海があるかないかの差でした。"}, {"t": 798.1166666666667, "x": "海がある場合は、揺れが約二度に抑えられるはずでした。"}, {"t": 801.8, "x": "観測から導かれたのは海があるほうの答えでした。"}, {"t": 805.0, "x": "揺れは小さかったのです。"}, {"t": 806.6666666666666, "x": "二〇一五年三月十二日、NASAはこの結果を発表しました。"}, {"t": 811.2166666666667, "x": "ガニメデの地下に海がある、"}, {"t": 812.7666666666667, "x": "これまでで最も強い証拠だという内容です。"}, {"t": 816.0666666666667, "x": "その海は地面のすぐ下にあるわけではありません。"}, {"t": 819.0, "x": "海の上には主に氷でできた殻がかぶさっています。"}, {"t": 822.25, "x": "殻の厚さは約百五十キロメートルと見積もられました。"}, {"t": 825.7166666666667, "x": "そして海の厚さは約百キロメートル。"}, {"t": 828.1666666666666, "x": "地球の海の深さの、およそ十倍にあたります。"}, {"t": 831.5666666666667, "x": "地球の表面には、海や川や湖があります。"}, {"t": 835.0333333333333, "x": "その水を全部集めても、この海の水には"}, {"t": 838.1, "x": "かなわないと考えられています。"}, {"t": 839.9666666666667, "x": "ここではっきりさせておくことがあります。"}, {"t": 842.3, "x": "この海を写した写真はありません。"}, {"t": 844.4666666666667, "x": "これからもすぐには撮れません。"}, {"t": 846.3, "x": "氷の殻は百五十キロメートルの厚さです。"}, {"t": 849.2166666666667, "x": "どんなカメラでもその奥の水は写せません。"}, {"t": 851.8333333333334, "x": "光は、氷の奥までは届きません。"}, {"t": 854.65, "x": "探査機が近くを通っても、見えるのは氷の表面だけです。"}, {"t": 858.75, "x": "海があるという答えは、オーロラの"}, {"t": 861.0666666666667, "x": "揺れ方から導かれました。"}, {"t": 862.8, "x": "水そのものを見た者はまだ誰もいません。"}, {"t": 865.3, "x": "それでも、紫外線の光が二度しか"}, {"t": 867.8166666666667, "x": "揺れなかったという記録が残りました。"}, {"t": 870.0666666666667, "x": "その記録が氷の下の暗い水を指し示しています。"}, {"t": 873.4333333333333, "x": "ガニメデの海は一枚の水の層とは限りません。"}, {"t": 876.5333333333333, "x": "二〇一四年五月、一つの研究が発表されました。"}, {"t": 880.4333333333333, "x": "NASAのジェット推進研究所からです。"}, {"t": 882.85, "x": "中心になったのは、スティーブ・ヴァンスたちの"}, {"t": 885.5333333333333, "x": "チームです。"}, {"t": 886.2666666666667, "x": "それまで、ガニメデの海は二枚の氷に"}, {"t": 889.05, "x": "はさまれていると考えられていました。"}, {"t": 891.2, "x": "上に氷。"}, {"t": 892.1333333333333, "x": "まんなかに海。"}, {"t": 893.2, "x": "下にまた氷。"}, {"t": 894.3833333333333, "x": "ヴァンスたちはこの形を計算しなおしました。"}, {"t": 897.1833333333333, "x": "手がかりになったのは塩です。"}, {"t": 899.05, "x": "ガニメデの奥では、とても強い圧力がかかっています。"}, {"t": 902.7333333333333, "x": "その中で塩を含んだ水はどれだけ重くなるのか。"}, {"t": 905.9666666666667, "x": "チームは実験で確かめました。"}, {"t": 907.9666666666667, "x": "塩を多く含んだ水は重くなります。"}, {"t": 910.5166666666667, "x": "重くなった水は、氷の下へ沈んでいくことができます。"}, {"t": 914.35, "x": "すると、水と氷が何層にも重なった"}, {"t": 917.2, "x": "形がありうることになります。"}, {"t": 918.95, "x": "チームの計算では、海が最大三枚の"}, {"t": 921.8333333333334, "x": "氷の層と重なり合っていました。"}, {"t": 923.9, "x": "そしていちばん下には岩の海底がありました。"}, {"t": 926.6666666666666, "x": "何枚もの具をはさんだ、背の高い"}, {"t": 929.0833333333334, "x": "サンドイッチのような作りです。"}, {"t": 930.8333333333334, "x": "それまでは、岩の海底は氷で"}, {"t": 933.2666666666667, "x": "おおわれていると考えられていました。"}, {"t": 935.3833333333333, "x": "もし水が岩にじかにふれているなら、話は変わります。"}, {"t": 939.1333333333333, "x": "水と岩がふれ合う場所は、大切だとされているからです。"}, {"t": 942.85, "x": "生き物が生まれるうえで、という意味です。"}, {"t": 945.5833333333334, "x": "地球の生き物も、そうした場所で"}, {"t": 947.85, "x": "生まれたのかもしれません。"}, {"t": 949.2833333333333, "x": "海の底で熱い水がわき出る場所です。"}, {"t": 951.85, "x": "ただし、この重なった形がどれだけ続くのかは"}, {"t": 955.1666666666666, "x": "分かっていません。"}, {"t": 956.1, "x": "同じ研究所のクリストフ・ソタンは、そう話しています。"}, {"t": 959.7666666666667, "x": "形が変わったり戻ったりを、"}, {"t": 961.5166666666667, "x": "くり返しているのかもしれません。"}, {"t": 963.7666666666667, "x": "ガニメデの外側でも、新しく分かったことがあります。"}, {"t": 967.4333333333333, "x": "二〇二一年、ある研究が発表されました。"}, {"t": 970.9666666666667, "x": "ハッブル宇宙望遠鏡の記録を調べなおした研究です。"}, {"t": 974.5666666666667, "x": "ガニメデの薄い大気に、水蒸気があるという結果です。"}, {"t": 978.2333333333333, "x": "それまで、ガニメデの大気で"}, {"t": 980.25, "x": "見つかっていたのは酸素でした。"}, {"t": 981.9833333333333, "x": "酸素は、電気を帯びた粒が氷を"}, {"t": 984.5333333333333, "x": "削ることで生まれるとされます。"}, {"t": 986.3666666666667, "x": "水蒸気の出どころはそれとは違いました。"}, {"t": 989.0, "x": "ガニメデの赤道の近くでは、"}, {"t": 990.8166666666667, "x": "正午のころに地面が少し温まります。"}, {"t": 993.7, "x": "その熱で、氷が液体を通らずに"}, {"t": 996.3666666666667, "x": "気体になって立ちのぼるのです。"}, {"t": 998.1333333333333, "x": "とけて水になる段階を飛ばします。"}, {"t": 1000.4333333333333, "x": "氷からいきなり水蒸気になるのです。"}, {"t": 1002.9166666666666, "x": "量はほんのわずかです。"}, {"t": 1004.4166666666666, "x": "冬の寒い日に、干した洗濯物が"}, {"t": 1006.9666666666667, "x": "凍ったまま乾くことがあります。"}, {"t": 1008.85, "x": "それと似たことが、ガニメデの地面でも起きているのです。"}, {"t": 1012.4666666666667, "x": "大事な点があります。"}, {"t": 1013.85, "x": "この水蒸気は、地下の海から来たものではありません。"}, {"t": 1017.35, "x": "表面の氷から生まれた水蒸気でした。"}, {"t": 1019.9666666666667, "x": "氷の下に何枚の水があるのか。"}, {"t": 1022.3, "x": "いちばん下の水は岩にふれているのか。"}, {"t": 1024.7666666666667, "x": "その答えを出すには、遠くから"}, {"t": 1026.9833333333333, "x": "一度見るだけでは足りません。"}, {"t": 1028.6, "x": "ガニメデのまわりを回り続ける必要があります。"}, {"t": 1031.5166666666667, "x": "一度通り過ぎるだけでは、変化は見えません。"}, {"t": 1034.6166666666666, "x": "同じ場所を、何度もくり返し見なければなりません。"}, {"t": 1038.1333333333334, "x": "地面の形のわずかな変化を測り、磁場の細かな動きを測る。"}, {"t": 1042.5166666666667, "x": "それを長いあいだ続けなければなりません。"}, {"t": 1045.1166666666666, "x": "そのために作られたのがジュースでした。"}, {"t": 1047.3833333333334, "x": "二〇二三年四月十四日。"}, {"t": 1049.5833333333333, "x": "南アメリカのフランス領ギアナに、"}, {"t": 1051.7333333333333, "x": "ヨーロッパの発射場があります。"}, {"t": 1053.95, "x": "その日の中央ヨーロッパ夏時間で午後二時十四分。"}, {"t": 1057.3666666666666, "x": "アリアン5ロケットが打ち上げられました。"}, {"t": 1059.85, "x": "先端に積まれていたのがジュースです。"}, {"t": 1062.0666666666666, "x": "約五十分後、地上局が電波をとらえました。"}, {"t": 1065.45, "x": "オーストラリアのニューノルシアにある地上局です。"}, {"t": 1068.3333333333333, "x": "ジュースからの最初の声です。"}, {"t": 1070.1666666666667, "x": "打ち上げは、うまくいったのです。"}, {"t": 1072.45, "x": "さらに三十分ほどして、太陽電池のパネルが開きました。"}, {"t": 1076.6166666666666, "x": "パネルは十字の形に広がりました。"}, {"t": 1079.0333333333333, "x": "端から端までの長さは二十七メートルあります。"}, {"t": 1082.1166666666666, "x": "太陽電池の面積は、合わせて八十五平方メートル。"}, {"t": 1086.1, "x": "惑星のあいだを旅する探査機のために"}, {"t": 1088.4166666666667, "x": "作られた中で、最も大きなものです。"}, {"t": 1091.2, "x": "なぜ、これほど大きな太陽電池が必要なのでしょうか。"}, {"t": 1095.0333333333333, "x": "木星は太陽から遠く離れています。"}, {"t": 1097.5833333333333, "x": "そこに届く太陽の光は、地球の"}, {"t": 1100.1833333333334, "x": "近くよりずっと弱くなります。"}, {"t": 1102.0166666666667, "x": "弱い光から電気を集めるには、広い面が要るのです。"}, {"t": 1105.9166666666667, "x": "それでも、木星で得られる電力は"}, {"t": 1108.4, "x": "約八百五十ワットとされています。"}, {"t": 1110.5833333333333, "x": "木星のあたりは、セ氏マイナス"}, {"t": 1112.7666666666667, "x": "約二百三十度という寒さです。"}, {"t": 1114.9, "x": "ジュースは、その寒さの中で動くように作られました。"}, {"t": 1118.4333333333334, "x": "温度の幅は大きなものです。"}, {"t": 1120.3333333333333, "x": "寒い木星と、熱い金星の近く。"}, {"t": 1123.3, "x": "その両方に耐えなければなりません。"}, {"t": 1125.5666666666666, "x": "木星のまわりでは、強い放射線も飛び交っています。"}, {"t": 1129.2333333333333, "x": "そのため、電子機器の一部には"}, {"t": 1131.45, "x": "放射線に強い部品が選ばれました。"}, {"t": 1133.7666666666667, "x": "さらに、特別な守りの箱や覆いで包まれています。"}, {"t": 1137.55, "x": "ジュースは大きな機体です。"}, {"t": 1139.2166666666667, "x": "打ち上げのときは、小さくたたまれていました。"}, {"t": 1142.2833333333333, "x": "大きさは四メートル前後です。"}, {"t": 1144.25, "x": "宇宙で太陽電池やアンテナを広げると、"}, {"t": 1146.7666666666667, "x": "幅は二十七メートルを超えます。"}, {"t": 1149.1666666666667, "x": "磁場を測る装置は、長さ十・六メートルの"}, {"t": 1152.3833333333334, "x": "腕の先についています。"}, {"t": 1153.8333333333333, "x": "機体そのものが出す磁場から、離しておくためです。"}, {"t": 1157.1, "x": "地球と話すためのアンテナは、直径二・五メートルです。"}, {"t": 1161.0, "x": "ジュースの重さは、燃料をのぞいて"}, {"t": 1163.3333333333333, "x": "約二千四百二十キログラム。"}, {"t": 1165.3666666666666, "x": "燃料を満タンにすると、さらに約三千六百五十キログラムが"}, {"t": 1169.7166666666667, "x": "加わります。"}, {"t": 1170.5333333333333, "x": "積まれた観測の装置は十種類です。"}, {"t": 1173.0333333333333, "x": "地面を撮るカメラ。"}, {"t": 1174.3333333333333, "x": "地面の成分を調べる装置。"}, {"t": 1176.45, "x": "紫外線で大気やオーロラを見る装置。"}, {"t": 1178.9833333333333, "x": "磁場を測る装置もあります。"}, {"t": 1180.8333333333333, "x": "電気を帯びた粒を数える装置もあります。"}, {"t": 1183.55, "x": "電波を使って重力を調べる実験もあります。"}, {"t": 1186.5666666666666, "x": "レーザーの光を地面に当てて、高さを測る装置もあります。"}, {"t": 1190.6833333333334, "x": "その名前はガラといいます。"}, {"t": 1192.4333333333334, "x": "そして、氷の中を電波で探るレーダーがあります。"}, {"t": 1196.0, "x": "名前はライムです。"}, {"t": 1197.2833333333333, "x": "集めた記録は、機体の中にためておけます。"}, {"t": 1200.4166666666667, "x": "その量は一・二五テラバイト。"}, {"t": 1202.6166666666666, "x": "地球へは、一日に二ギガビットを"}, {"t": 1205.0833333333333, "x": "超える量を送れるとされています。"}, {"t": 1207.05, "x": "ライムは、氷の地面の下を調べます。"}, {"t": 1209.9833333333333, "x": "届く深さは約九キロメートルです。"}, {"t": 1212.4, "x": "このライムで、打ち上げの直後に問題が起きました。"}, {"t": 1215.9333333333334, "x": "ライムのアンテナは長さが十六メートルあります。"}, {"t": 1218.8166666666666, "x": "ロケットの先端には入りきらないので、"}, {"t": 1221.15, "x": "折りたたんで積まれていました。"}, {"t": 1223.1666666666667, "x": "宇宙で、それを伸ばそうとしました。"}, {"t": 1225.7, "x": "ところが、最初の部分しか開きませんでした。"}, {"t": 1228.8333333333333, "x": "小さなピンが引っかかって、"}, {"t": 1230.4166666666667, "x": "残りを押さえているようでした。"}, {"t": 1232.5666666666666, "x": "運用チームは、ジュースのエンジンを小さく噴かしました。"}, {"t": 1236.2, "x": "機体を揺さぶって、ピンを外そうとしたのです。"}, {"t": 1239.3666666666666, "x": "太陽の光を当てて、温めてもみました。"}, {"t": 1242.5166666666667, "x": "アンテナは日ごとに少しずつ動きました。"}, {"t": 1244.9833333333333, "x": "けれども、開ききりません。"}, {"t": 1247.0166666666667, "x": "二〇二三年五月十二日。"}, {"t": 1249.3, "x": "チームは、引っかかった部分にある装置を作動させました。"}, {"t": 1253.05, "x": "その衝撃で、ピンが数ミリメートル動きました。"}, {"t": 1256.35, "x": "すると、アンテナが開きました。"}, {"t": 1258.75, "x": "最後に一つだけ折れたまま残った部分がありました。"}, {"t": 1261.9, "x": "そこも、もう一つの装置を作動させて伸ばしました。"}, {"t": 1265.4166666666667, "x": "最初の試みから、三週間あまりがたっていました。"}, {"t": 1269.0166666666667, "x": "アンテナが開かなければ、氷の下を"}, {"t": 1271.6833333333334, "x": "電波で探ることはできません。"}, {"t": 1273.4833333333333, "x": "数ミリメートルのピンの動き。"}, {"t": 1275.4333333333334, "x": "それが、九キロメートルの深さへの道を開きました。"}, {"t": 1279.0333333333333, "x": "ジュースは、木星へ"}, {"t": 1280.55, "x": "まっすぐ飛んでいるわけではありません。"}, {"t": 1282.5666666666666, "x": "まっすぐ向かうとしたら、燃料はどれだけ要るのか。"}, {"t": 1285.8833333333334, "x": "ESAによると、約六万キログラムです。"}, {"t": 1288.8333333333333, "x": "それは積むことのできない量です。"}, {"t": 1290.9166666666667, "x": "そこで、ほかの天体の重力を借ります。"}, {"t": 1293.9, "x": "天体のそばを通るたびに、進む向きと"}, {"t": 1296.6333333333334, "x": "速さを変えてもらうのです。"}, {"t": 1298.2166666666667, "x": "予定された重力の手助けは、地球と金星で合わせて四回。"}, {"t": 1302.5, "x": "木星までの旅には約八年がかかります。"}, {"t": 1305.3, "x": "一回目は二〇二四年八月でした。"}, {"t": 1307.9333333333334, "x": "八月十九日の夜、ジュースはまず月のそばを通りました。"}, {"t": 1312.0666666666666, "x": "そして翌日の夜、地球のそばを通りました。"}, {"t": 1315.4, "x": "月から地球までは二十四時間あまり。"}, {"t": 1317.9166666666667, "x": "月と地球を続けて使う、世界で初めての飛び方でした。"}, {"t": 1321.9333333333334, "x": "ESAは、これを危ない挑戦だとしていました。"}, {"t": 1325.1333333333334, "x": "これまでどの計画も挑んだことがなかったからです。"}, {"t": 1328.1666666666667, "x": "わずかな狂いで、進む道を外れるおそれがあったからです。"}, {"t": 1332.0833333333333, "x": "月は、ジュースの速さを太陽に対して"}, {"t": 1334.8333333333333, "x": "秒速約〇・九キロメートル上げました。"}, {"t": 1337.45, "x": "続く地球は、速さを秒速約四・八キロメートル下げました。"}, {"t": 1341.9333333333334, "x": "あえて速さを落としたのは、金星へ向かうためです。"}, {"t": 1345.3833333333334, "x": "地球に最も近づいたときの場所は、"}, {"t": 1347.65, "x": "東南アジアと太平洋の上空です。"}, {"t": 1350.4166666666667, "x": "その高さは約六千八百四十キロメートルでした。"}, {"t": 1353.8333333333333, "x": "月を先に使ったおかげで、燃料も節約できました。"}, {"t": 1357.7, "x": "その量は百キログラムから"}, {"t": 1359.3, "x": "百五十キログラムほどとされています。"}, {"t": 1361.6, "x": "月のそばでは、十種類の装置がすべて動かされました。"}, {"t": 1365.4333333333334, "x": "二回目は金星でした。"}, {"t": 1367.05, "x": "二〇二五年八月三十一日、ジュースは"}, {"t": 1370.45, "x": "金星のそばを通りました。"}, {"t": 1372.1, "x": "日本の時計では、その日の午後のことです。"}, {"t": 1375.1666666666667, "x": "ここで難しかったのは熱でした。"}, {"t": 1377.35, "x": "ジュースは木星の寒さに合わせて作られています。"}, {"t": 1380.3666666666666, "x": "太陽に近い金星のあたりは、とても熱い場所です。"}, {"t": 1384.0, "x": "機体はセ氏約二百五十度にさらされるおそれがありました。"}, {"t": 1387.55, "x": "そこで、大きなアンテナを太陽に向けました。"}, {"t": 1390.6833333333334, "x": "直径二・五メートルのアンテナです。"}, {"t": 1393.0166666666667, "x": "アンテナを日よけとして使ったのです。"}, {"t": 1395.2166666666667, "x": "機体を熱から守るため、遠くを"}, {"t": 1397.65, "x": "見る装置は動かせませんでした。"}, {"t": 1399.6166666666666, "x": "そのため、このとき金星の写真は撮られていません。"}, {"t": 1403.15, "x": "金星へ近づく前の七月には、"}, {"t": 1405.3, "x": "地球との通信がうまくいかなくなりました。"}, {"t": 1408.2333333333333, "x": "調べたところ、壊れた装置はありませんでした。"}, {"t": 1411.5666666666666, "x": "通信は約二十時間で戻りました。"}, {"t": 1414.0833333333333, "x": "問題は、金星に着く前に片づきました。"}, {"t": 1417.1666666666667, "x": "三回目は、二〇二六年九月二十八日です。"}, {"t": 1421.0166666666667, "x": "四回のうち、三回目にあたる出来事です。"}, {"t": 1424.2166666666667, "x": "ジュースは、もう一度地球へ戻ってきました。"}, {"t": 1427.2333333333333, "x": "最も近づいたのは、インド洋の"}, {"t": 1429.5666666666666, "x": "上空約八千六百四十キロメートル。"}, {"t": 1432.2166666666667, "x": "この地球の重力で、ジュースの進む"}, {"t": 1434.8166666666666, "x": "向きは約二十度曲がりました。"}, {"t": 1436.6666666666667, "x": "速さは秒速約三・五キロメートル上がりました。"}, {"t": 1439.8666666666666, "x": "地球に近づく前、道を直す機会は六回用意されていました。"}, {"t": 1444.2666666666667, "x": "実際に使ったのは、ごく小さな一回だけでした。"}, {"t": 1447.6833333333334, "x": "九月二十三日から十月三日まで、"}, {"t": 1450.1666666666667, "x": "十種類の装置が動かされました。"}, {"t": 1452.6333333333334, "x": "地球のまわりの磁場の中も、数日かけて通り抜けました。"}, {"t": 1456.4833333333333, "x": "木星で使う装置の、試しの場にもなったのです。"}, {"t": 1459.9666666666667, "x": "このとき、ジュースは見張り用の"}, {"t": 1462.15, "x": "カメラで地球を撮りました。"}, {"t": 1463.7833333333333, "x": "遠ざかっていく地球の写真は、ESAから公開されています。"}, {"t": 1467.8333333333333, "x": "地球との出会いは、これが最後ではありません。"}, {"t": 1470.9833333333333, "x": "二〇二九年一月、ジュースは"}, {"t": 1473.6, "x": "もう一度だけ地球のそばを通る予定です。"}, {"t": 1476.1333333333334, "x": "その重力で、木星へ向かう最後の道に乗ります。"}, {"t": 1479.8, "x": "月と地球、金星、また地球、そしてもう一度地球。"}, {"t": 1484.3666666666666, "x": "木星まで最短の線 t": 1807.7833333333333, "x": "それを終えた機体は、氷の地面の上に置いていかれます。"}, {"t": 1811.6833333333334, "x": "その下には、百五十キロメートルの氷があります。"}, {"t": 1815.2166666666667, "x": "さらにその下には、地球の海より"}, {"t": 1817.6833333333334, "x": "多いとされる水があります。"}, {"t": 1819.3, "x": "機体がその水にふれることはありません。"}, {"t": 1821.7166666666667, "x": "ただ、水の上にかぶさる氷の上に、静かに残ります。"}, {"t": 1825.9666666666667, "x": "ゼロだった欄に入る最初の名前。"}, {"t": 1828.1666666666667, "x": "その機体は、そのままガニメデの"}, {"t": 1830.35, "x": "氷の上に残される予定です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
