, "x": "そのとき、地球でそれを見ていた者はいません。"}, {"t": 17.233333333333334, "x": "見られなかった、と言ったほうが正確です。"}, {"t": 20.116666666666667, "x": "探査機からの電波は、光の速さで進んでも、"}, {"t": 23.333333333333332, "x": "地球に届くまでに六時間あまりかかりました。"}, {"t": 26.483333333333334, "x": "しかも探査機は、通り過ぎるまで、"}, {"t": 28.883333333333333, "x": "撮った画像を地球へ送りませんでした。"}, {"t": 31.533333333333335, "x": "撮ることを先にする計画だったからです。"}, {"t": 34.05, "x": "通り過ぎたあとも、画像はすぐには届きませんでした。"}, {"t": 37.65, "x": "一日に送れる量には限りがあり、全部を"}, {"t": 40.68333333333333, "x": "地球に下ろし終えるまでには、二〇二〇年の"}, {"t": 43.766666666666666, "x": "終わりごろまでかかる見込みだとされました。"}, {"t": 46.03333333333333, "x": "探査機の名前は、ニューホライズンズ。"}, {"t": 47.18333333333333, "x": "ニューホライズンズ█"}, {"t": 48.63333333333333, "x": "通り過ぎた天体は、いまはアロコスと呼ばれています。"}, {"t": 50.78333333333333, "x": "アロコス█"}, {"t": 53.11666666666667, "x": "人類が宇宙船を近づけて撮った"}, {"t": 55.15, "x": "天体のうち、これが最も遠いものです。"}, {"t": 58.083333333333336, "x": "そして、カイパーベルトと呼ばれる帯の"}, {"t": 58.71666666666667, "x": "カイパーベルト█"}, {"t": 60.733333333333334, "x": "中で、近くから形を撮れた小さな天体は、"}, {"t": 64.15, "x": "いまのところこれ一つしかありません。"}, {"t": 66.68333333333334, "x": "帯の中には、直径百キロメートルを超えるものだけで、"}, {"t": 70.36666666666666, "x": "数十万個あると見積もられています。"}, {"t": 72.91666666666667, "x": "そのうち、形が分かるほど近くに寄れたのは、"}, {"t": 76.05, "x": "冥王星とその衛星を別にすれば、この一つだけです。"}, {"t": 80.25, "x": "しかも、そのアロコスでさえ、写っているのは半分です。"}, {"t": 84.28333333333333, "x": "この回では、冥王星のさらに先に広がる帯と、そこで"}, {"t": 88.48333333333333, "x": "たった一度だけ行われた接近の記録を読んでいきます。"}, {"t": 91.83333333333333, "x": "何が写り、何が写らず、写らなかった部分が"}, {"t": 95.48333333333333, "x": "どうやって「分かった」ことにされたのかを、"}, {"t": 98.56666666666666, "x": "残っている記録の範囲で並べます。"}, {"t": 101.06666666666666, "x": "最初に、この帯がいつから知られていたのかを"}, {"t": 104.03333333333333, "x": "確かめておきます。"}, {"t": 105.2, "x": "カイパーベルトという名前は、天文学者の"}, {"t": 108.05, "x": "ジェラルド・カイパーから来ています。"}, {"t": 109.86666666666666, "x": "カイパーは一九五一年の論文で、冥王星より"}, {"t": 113.86666666666666, "x": "外側にある天体について考えを述べました。"}, {"t": 116.73333333333333, "x": "それより前、一九四〇年代には、ケネス・エッジワースも"}, {"t": 121.16666666666667, "x": "冥王星の外にある天体について書いています。"}, {"t": 124.03333333333333, "x": "そのため、エッジワース・カイパーベルトと"}, {"t": 127.15, "x": "呼ばれることもあります。"}, {"t": 128.48333333333332, "x": "ただ、それは考えの話でした。"}, {"t": 130.95, "x": "実物は、長いあいだ一つも見つかっていませんでした。"}, {"t": 134.58333333333334, "x": "そのあいだに、帯のある方角へ向かって、"}, {"t": 137.35, "x": "二機の探査機が飛んでいきました。"}, {"t": 139.6, "x": "一九七七年に打ち上げられた、ボイジャー一号と二号です。"}, {"t": 142.31666666666666, "x": "ボイジャー█"}, {"t": 144.83333333333334, "x": "NASAの記録には、二機が観測装置を"}, {"t": 147.58333333333334, "x": "いつ止めたかが一つずつ書かれています。"}, {"t": 149.8, "x": "撮影装置の項には、こうあります。"}, {"t": 152.58333333333334, "x": "ボイジャー二号、一九八九年十月十日と"}, {"t": 156.25, "x": "十二月五日、広角と狭角のカメラを停止。"}, {"t": 159.73333333333332, "x": "電力節約のため。"}, {"t": 161.28333333333333, "x": "ボイジャー一号、一九九〇年二月十四日、"}, {"t": 164.95, "x": "広角と狭角のカメラを停止。"}, {"t": 167.4, "x": "電力節約のため。"}, {"t": 168.95, "x": "一号がカメラを止めた日は、"}, {"t": 170.65, "x": "有名な写真が撮られた日でもあります。"}, {"t": 173.36666666666667, "x": "太陽から六十億キロメートルほどの位置から"}, {"t": 176.05, "x": "振り返って、地球を小さな点として写した一枚です。"}, {"t": 179.81666666666666, "x": "それが、一号のカメラが撮った"}, {"t": 182.03333333333333, "x": "最後の写真の一つになりました。"}, {"t": 184.1, "x": "六十億キロメートルというのは、"}, {"t": 186.05, "x": "太陽と地球の距離のおよそ四十倍です。"}, {"t": 189.03333333333333, "x": "いまの知識で言えば、そこはもう、"}, {"t": 191.28333333333333, "x": "カイパーベルトが広がっている距離でした。"}, {"t": 193.98333333333332, "x": "つまりボイジャーは、帯のあたりを、"}, {"t": 196.26666666666668, "x": "目を閉じて通り過ぎていたことになります。"}, {"t": 198.98333333333332, "x": "ただ、カメラを止めた一九九〇年の時点では、"}, {"t": 202.45, "x": "帯にどんな天体があるのか、そもそも本当に"}, {"t": 205.86666666666667, "x": "帯があるのかも、まだ確かめられていませんでした。"}, {"t": 208.98333333333332, "x": "最初の一つが望遠鏡で見つかったのは、"}, {"t": 211.75, "x": "その二年後の、一九九二年です。"}, {"t": 213.9, "x": "一九九二年█"}, {"t": 215.46666666666667, "x": "仮の符号は、一九九二キュービーワン。"}, {"t": 218.78333333333333, "x": "見つけたのは、デビッド・ジューイットと"}, {"t": 220.96666666666667, "x": "ジェーン・ルーの二人で、翌年、"}, {"t": 222.98333333333332, "x": "科学誌ネイチャーに「カイパーベルト天体の"}, {"t": 226.16666666666666, "x": "候補の発見」という題で報告しました。"}, {"t": 229.11666666666667, "x": "冥王星は、それより前の一九三〇年に見つかっていました。"}, {"t": 233.7, "x": "いまでは冥王星も、この帯に"}, {"t": 235.95, "x": "属する天体の一つとして数えられています。"}, {"t": 238.66666666666666, "x": "一九九二年の発見は、冥王星が"}, {"t": 241.98333333333332, "x": "一人きりではなかったことを示した、最初の一件でした。"}, {"t": 245.66666666666666, "x": "そこから、見つかる数は増えていきました。"}, {"t": 248.46666666666667, "x": "NASAの解説によれば、登録された"}, {"t": 250.96666666666667, "x": "天体は二千個を超えています。"}, {"t": 252.85, "x": "それでも、あると考えられている"}, {"t": 255.13333333333333, "x": "数のほんの一部にすぎません。"}, {"t": 256.96666666666664, "x": "帯の範囲も、おおよそ決められています。"}, {"t": 259.73333333333335, "x": "内側の端は、太陽から地球までの"}, {"t": 262.48333333333335, "x": "距離の約三十倍、海王星の軌道のあたり。"}, {"t": 265.76666666666665, "x": "主な部分は、その約五十倍の"}, {"t": 268.2, "x": "あたりで終わるとされてきました。"}, {"t": 270.0, "x": "その外側には、さらに遠くまで散らばった天体の"}, {"t": 273.3, "x": "群れが、約千倍の距離まで続いています。"}, {"t": 276.21666666666664, "x": "中身はどうか。"}, {"t": 277.3666666666667, "x": "直径百キロメートルを超えるものが数十万個。"}, {"t": 280.48333333333335, "x": "もっと小さいものは、さらに多いと考えられています。"}, {"t": 284.06666666666666, "x": "数は多いのですが、全部を集めても、重さは"}, {"t": 287.65, "x": "地球の十分の一を超えないと見積もられています。"}, {"t": 290.6666666666667, "x": "数十万個という数字は、望遠鏡で"}, {"t": 293.5, "x": "見えた一部から、全体を見積もった数です。"}, {"t": 296.55, "x": "一つ一つを数えた人はいません。"}, {"t": 298.73333333333335, "x": "そして、見つかった二千個あまりの大半は、"}, {"t": 301.6666666666667, "x": "地球の望遠鏡から見ると、ただの光の点です。"}, {"t": 305.51666666666665, "x": "形も、色の濃淡も、表面の様子も写りません。"}, {"t": 309.65, "x": "帯の天体は小さく、暗く、遠すぎるからです。"}, {"t": 313.6166666666667, "x": "ボイジャーは目を閉じて通り過ぎ、"}, {"t": 315.46666666666664, "x": "望遠鏡には点しか映らない。"}, {"t": 317.8333333333333, "x": "一九九〇年代から二〇一〇年代まで、"}, {"t": 320.8833333333333, "x": "カイパーベルトの天体は、そういうものでした。"}, {"t": 324.21666666666664, "x": "ニューホライズンズが打ち上げられたのは、"}, {"t": 326.55, "x": "二〇〇六年一月十九日です。"}, {"t": 327.3666666666667, "x": "二〇〇六年一月十九日█"}, {"t": 329.4166666666667, "x": "目的地は冥王星でした。"}, {"t": 331.31666666666666, "x": "重さは四百七十八キログラム。"}, {"t": 333.7, "x": "太陽から遠く、太陽電池では電気が足りないため、"}, {"t": 337.3666666666667, "x": "放射性物質の熱で電気を作る装置を積んでいます。"}, {"t": 341.18333333333334, "x": "土星探査機カッシーニの予備として作られたものでした。"}, {"t": 344.45, "x": "打ち上げのときに約二百五十ワット、冥王星に"}, {"t": 347.93333333333334, "x": "着くころには約二百ワットに減る設計です。"}, {"t": 350.6333333333333, "x": "木星の重力を借りて速度を上げ、"}, {"t": 352.93333333333334, "x": "九年半かけて冥王星に着きました。"}, {"t": 355.71666666666664, "x": "二〇一五年七月十四日、冥王星の地表から"}, {"t": 355.71666666666664, "x": "二〇一五年七月十四日█"}, {"t": 359.43333333333334, "x": "約七千八百キロメートルのところを通過しています。"}, {"t": 362.6666666666667, "x": "冥王星については、一つだけ記録を引いておきます。"}, {"t": 366.4, "x": "冥王星とその衛星で集めたデータは、"}, {"t": 368.9166666666667, "x": "全部で約六・二五ギガバイトでした。"}, {"t": 371.8, "x": "これを地球に送り終えるのに、"}, {"t": 373.65, "x": "十五か月以上かかっています。"}, {"t": 375.9166666666667, "x": "完了は二〇一六年十月二十五日。"}, {"t": 378.8333333333333, "x": "探査機から地球まで、光の速さで約四時間半。"}, {"t": 382.46666666666664, "x": "一秒間に送れるのは、一千ビットから二千ビットでした。"}, {"t": 386.45, "x": "冥王星を通り過ぎたあとも、"}, {"t": 388.3833333333333, "x": "探査機には燃料が少し残る計画でした。"}, {"t": 391.53333333333336, "x": "その燃料で進路を少しだけ曲げ、"}, {"t": 393.71666666666664, "x": "帯の中の別の天体にもう一度近づく。"}, {"t": 396.75, "x": "探査チームは、冥王星に着く前から、"}, {"t": 399.53333333333336, "x": "その相手を探していました。"}, {"t": 401.55, "x": "問題は、行き先が決まっていなかったことです。"}, {"t": 404.65, "x": "探査機はすでに、決まった方角へ、"}, {"t": 407.1333333333333, "x": "決まった速さで飛んでいます。"}, {"t": 409.1166666666667, "x": "残った燃料で曲げられる角度は、わずかです。"}, {"t": 412.3666666666667, "x": "その狭い範囲の中に、ちょうどいい時期にちょうどいい"}, {"t": 415.6166666666667, "x": "場所を通る天体がなければ、行き先はありません。"}, {"t": 418.9166666666667, "x": "しかも、その範囲にある帯の天体は、"}, {"t": 421.5833333333333, "x": "どれも小さく、暗いものばかりです。"}, {"t": 424.5833333333333, "x": "候補探しに使われたのが、ハッブル宇宙望遠鏡でした。"}, {"t": 426.71666666666664, "x": "ハッブル宇宙望遠鏡█"}, {"t": 429.01666666666665, "x": "二〇一四年六月二十六日、探査チームの"}, {"t": 432.46666666666664, "x": "一員だったマーク・ビュイが、ハッブルの"}, {"t": 434.8333333333333, "x": "画像の中に、一つの暗い点を見つけました。"}, {"t": 437.9, "x": "探索の中で付けられた番号は、一一一〇一一三ワイ。"}, {"t": 442.31666666666666, "x": "仲間内では短く「イレブン」と"}, {"t": 445.2, "x": "呼ばれていたとされています。"}, {"t": 446.75, "x": "二〇一四年十月に行き先の候補として"}, {"t": 449.35, "x": "発表されたときには、候補の一番目という意味で、"}, {"t": 452.73333333333335, "x": "ピーティーワンと呼ばれたとされています。"}, {"t": 455.1, "x": "二〇一五年三月には、正式な仮符号として、"}, {"t": 458.68333333333334, "x": "二〇一四エムユー六十九が付いたとされています。"}, {"t": 462.25, "x": "NASAの解説は、この天体をこう書いています。"}, {"t": 465.51666666666665, "x": "候補の中で、最も暗く、最も小さかった。"}, {"t": 469.4166666666667, "x": "しかし、ミッションの期限の中で、最も行きやすかった。"}, {"t": 473.46666666666664, "x": "いちばん見栄えのする相手ではなく、いちばん手の"}, {"t": 476.5833333333333, "x": "届く相手が選ばれた、ということです。"}, {"t": 479.28333333333336, "x": "二〇一五年の秋、冥王星を通り過ぎたあと、"}, {"t": 482.81666666666666, "x": "探査機はエンジンを噴いて、"}, {"t": 484.75, "x": "進路をこの暗い点のほうへ曲げました。"}, {"t": 487.3666666666667, "x": "ただ、行き先が決まっても、相手のことは"}, {"t": 490.46666666666664, "x": "ほとんど分かっていませんでした。"}, {"t": 492.2, "x": "ハッブルで見えるのは、点だけです。"}, {"t": 494.6666666666667, "x": "大きさは、明るさから推し量るしかありません。"}, {"t": 497.81666666666666, "x": "どのくらい光を反射する表面なのかが"}, {"t": 500.21666666666664, "x": "分からなければ、大きさも決まりません。"}, {"t": 502.8333333333333, "x": "形は、まったく分かりませんでした。"}, {"t": 505.45, "x": "どこにあるのかも、ぴったりとは分かっていませんでした。"}, {"t": 508.85, "x": "探査機を数千キロメートルの距離まで寄せるには、"}, {"t": 511.75, "x": "相手の位置を、それより細かく知っておく必要があります。"}, {"t": 515.8833333333333, "x": "点を何度か撮っただけでは、"}, {"t": 517.5, "x": "その精度には足りませんでした。"}, {"t": 519.7166666666667, "x": "そこで探査チームは、もう一つ別の"}, {"t": 522.3166666666667, "x": "方法を使うことにしました。"}, {"t": 524.05, "x": "相手が、遠くの星の前を横切る瞬間を待つ方法です。"}, {"t": 528.2166666666667, "x": "小さな天体が、遠くの星の前を横切ると、"}, {"t": 531.5166666666667, "x": "その星の光が、ほんの一瞬だけ消えます。"}, {"t": 534.9166666666666, "x": "これを掩蔽と呼びます。"}, {"t": 535.6166666666667, "x": "掩蔽█"}, {"t": 537.4833333333333, "x": "地上のあちこちに望遠鏡を並べておけば、"}, {"t": 540.1333333333333, "x": "ある場所では星が消え、ある場所では"}, {"t": 543.0, "x": "消えない、という違いが出ます。"}, {"t": 545.1166666666667, "x": "消えた場所と、消えた長さを並べていけば、"}, {"t": 547.9833333333333, "x": "天体の影の形を、地面の上に写しとることができます。"}, {"t": 552.35, "x": "写真には写らない大きさの天体でも、影の形なら測れる。"}, {"t": 556.6333333333333, "x": "それが、この方法の考え方です。"}, {"t": 559.3666666666667, "x": "ただし、条件は厳しいものでした。"}, {"t": 562.1, "x": "相手は直径数十キロメートル。"}, {"t": 564.2833333333333, "x": "影が地球の上を横切る幅も、"}, {"t": 566.4, "x": "それと同じくらいしかありません。"}, {"t": 568.6166666666667, "x": "影が通る時刻と場所を先に正確に"}, {"t": 570.9833333333333, "x": "予測しておかなければ、望遠鏡を並べても、"}, {"t": 574.0666666666667, "x": "影は外れた場所を通り過ぎてしまいます。"}, {"t": 576.9333333333333, "x": "それを可能にしたのは、ヨーロッパ宇宙機関の"}, {"t": 580.35, "x": "衛星ガイアが作っていた、星の位置の一覧でした。"}, {"t": 580.8166666666667, "x": "ガイア█"}, {"t": 584.35, "x": "探査チームは、正式に公開される前の"}, {"t": 587.1833333333333, "x": "版を使うことができ、それで影の通り道を"}, {"t": 590.3166666666667, "x": "細かく予測したと、論文に書いています。"}, {"t": 593.2833333333333, "x": "最初の挑戦は、二〇一七年六月三日でした。"}, {"t": 594.7833333333333, "x": "二〇一七年六月三日█"}, {"t": 597.5833333333334, "x": "アルゼンチン北部と南アフリカに、持ち運べる"}, {"t": 600.7666666666667, "x": "望遠鏡を二十五か所に置き、固定された望遠鏡も"}, {"t": 604.45, "x": "加えて、星が消える瞬間を待ちました。"}, {"t": 607.3166666666667, "x": "星は、一つの観測点でも消えませんでした。"}, {"t": 610.5333333333333, "x": "検出はゼロです。"}, {"t": 611.8333333333334, "x": "影は、並べた望遠鏡のどこにもかかりませんでした。"}, {"t": 615.5166666666667, "x": "ただ、何も写らなかったこと自体も記録として残りました。"}, {"t": 619.45, "x": "この範囲には環やちりはなかった、という"}, {"t": 622.15, "x": "意味での記録です。"}, {"t": 623.2833333333333, "x": "二回目は、同じ年の七月十日。"}, {"t": 626.1333333333333, "x": "今度は地上ではなく、空の上からでした。"}, {"t": 629.2333333333333, "x": "大型の旅客機に望遠鏡を積んだ空飛ぶ天文台、"}, {"t": 632.7833333333333, "x": "ソフィアが、影の通り道の上を飛びました。"}, {"t": 632.8833333333333, "x": "ソフィア█"}, {"t": 636.3666666666667, "x": "得られたのは、影のふちをかすめた、"}, {"t": 638.7833333333333, "x": "ごく短い一本の記録だけでした。"}, {"t": 641.3666666666667, "x": "三回目は、その一週間後の二〇一七年七月十七日。"}, {"t": 644.0333333333333, "x": "二〇一七年七月十七日█"}, {"t": 646.4833333333333, "x": "場所は、アルゼンチンの南部です。"}, {"t": 648.85, "x": "観測点は二十四か所。"}, {"t": 650.7, "x": "影の通り道を横切るように、"}, {"t": 652.7, "x": "望遠鏡が一列に並べられました。"}, {"t": 655.3833333333333, "x": "このとき、五つの観測点で、星が消えました。"}, {"t": 659.1833333333333, "x": "五本の線が、影を横切って引かれたことになります。"}, {"t": 662.7833333333333, "x": "それぞれの線の長さを並べると、"}, {"t": 664.8833333333333, "x": "影の形が浮かび上がりました。"}, {"t": 667.2, "x": "全体でおよそ縦二十キロメートル、横三十キロメートル。"}, {"t": 671.25, "x": "そして、一つの丸ではありませんでした。"}, {"t": 674.0833333333334, "x": "二つの丸がくっついたような、くびれのある形でした。"}, {"t": 677.6666666666666, "x": "この時点では、探査機はまだ一年半先を飛んでいました。"}, {"t": 681.6, "x": "誰もその天体を近くから見たことはありません。"}, {"t": 684.5166666666667, "x": "それでも、星の光が消えた長さだけから、二つの"}, {"t": 688.2833333333333, "x": "丸がくっついているらしい、というところまでは"}, {"t": 691.1833333333333, "x": "分かっていました。"}, {"t": 692.15, "x": "四回目は、二〇一八年八月四日。"}, {"t": 695.2833333333333, "x": "二十二か所に望遠鏡が置かれ、二本の記録が得られました。"}, {"t": 699.4166666666666, "x": "四回の挑戦で分かったのは、おおよその大きさと"}, {"t": 702.6666666666666, "x": "形、周りに環やちりが見つからないこと。"}, {"t": 705.6166666666667, "x": "そして探査機にとって最も大事な、"}, {"t": 707.7666666666667, "x": "天体の細かい位置でした。"}, {"t": 709.7833333333333, "x": "この位置の情報があったので、探査機は、目標から"}, {"t": 713.4833333333333, "x": "三千五百キロメートルあまりという近さまで"}, {"t": 716.0666666666667, "x": "寄せることができ、しかもカメラの視野の中に天体を"}, {"t": 719.45, "x": "きちんと収めることができた、と後の論文は書いています。"}, {"t": 723.1666666666666, "x": "同じころ、この天体には愛称が付けられました。"}, {"t": 726.5833333333334, "x": "二〇一八年三月、一般から寄せられた"}, {"t": 729.7, "x": "案の中から、「ウルティマ・"}, {"t": 731.3166666666667, "x": "トゥーレ」が選ばれたとされています。"}, {"t": 733.65, "x": "古い文学に出てくる、知られた世界の"}, {"t": 736.3166666666667, "x": "果てのさらに先、という意味の言葉です。"}, {"t": 739.1166666666667, "x": "のちに、この言葉が歴史の中で別の意味にも"}, {"t": 742.2666666666667, "x": "使われてきたことを指摘する声が上がりました。"}, {"t": 744.9333333333333, "x": "正式な名前は、フライバイのあとで、"}, {"t": 747.5166666666667, "x": "あらためて決められることになります。"}, {"t": 749.9, "x": "二〇一八年の年末、探査機は天体に"}, {"t": 753.05, "x": "向かって、最後の距離を詰めていました。"}, {"t": 755.7166666666667, "x": "十二月三十日、最接近の二日前。"}, {"t": 758.9833333333333, "x": "細かい画像を撮れるカメラ、"}, {"t": 760.7666666666667, "x": "ロリが、初めて天体の輪郭を捉えました。"}, {"t": 761.25, "x": "ロリ█"}, {"t": 764.5833333333334, "x": "それまでは点だったものが、"}, {"t": 766.15, "x": "ようやく細長い形として写った瞬間です。"}, {"t": 769.3166666666667, "x": "後の論文は、この時の輪郭を「ボウリングの"}, {"t": 772.9166666666666, "x": "ピンのような」と書いています。"}, {"t": 774.9, "x": "ところが、この先の画像は、"}, {"t": 777.0166666666667, "x": "すぐには地球に送られてきませんでした。"}, {"t": 779.7833333333333, "x": "探査機は撮ることに専念し、送るのは"}, {"t": 782.5833333333334, "x": "通り過ぎたあとに回す計画だったからです。"}, {"t": 785.2, "x": "そして、二〇一九年一月一日、"}, {"t": 786.0166666666667, "x": "二〇一九年一月一日█"}, {"t": 788.2333333333333, "x": "世界時の五時三十三分二十二秒。"}, {"t": 791.1333333333333, "x": "探査機は、天体の中心から"}, {"t": 793.3, "x": "三千五百三十八キロメートル█"}, {"t": 793.7, "x": "三千五百三十八キロメートルのところを通過しました。"}, {"t": 797.8166666666667, "x": "すれ違う速さは、一秒間に十四・四三キロメートル。"}, {"t": 801.9666666666667, "x": "東京から大阪までのおよそ四百キロメートルを、"}, {"t": 804.9666666666667, "x": "三十秒足らずで進む速さです。"}, {"t": 807.4833333333333, "x": "最も細かい画像が撮られたのは、天体から"}, {"t": 810.5333333333333, "x": "六千六百五十キロメートルのところでした。"}, {"t": 813.2666666666667, "x": "一つの画素が、地面の上の三十三メートル四方に"}, {"t": 816.8, "x": "あたります。"}, {"t": 817.4833333333333, "x": "ただし、論文はこの数字に但し書きを付けています。"}, {"t": 821.2166666666667, "x": "探査機が速く動いていたため画像は"}, {"t": 823.4333333333333, "x": "わずかにぶれ、光も弱かった。"}, {"t": 825.7333333333333, "x": "そのため、実際にどこまで細かく"}, {"t": 828.1333333333333, "x": "見分けられるかでいえば、別のカメラで"}, {"t": 830.5666666666667, "x": "撮った一画素百三十メートルの画像の、"}, {"t": 833.0333333333333, "x": "約二倍の細かさにとどまる、というものです。"}, {"t": 836.4166666666666, "x": "三十三メートルは、カメラの目盛りの数字です。"}, {"t": 839.7666666666667, "x": "実際に見分けられた細かさは、それよりも粗いものでした。"}, {"t": 843.6, "x": "最接近の前後に、形が分かる画像の"}, {"t": 846.5666666666667, "x": "撮影は三十回行われました。"}, {"t": 848.8333333333334, "x": "それが、この天体について、"}, {"t": 851.0, "x": "人類が持っているすべての画像です。"}, {"t": 853.5666666666667, "x": "最初の画像が地球に届いたのは、フライバイのあとでした。"}, {"t": 857.4333333333333, "x": "そこに写っていたのは、二つの丸い部分が"}, {"t": 860.2666666666667, "x": "くっついた、雪だるまのような形です。"}, {"t": 862.9833333333333, "x": "一年半前、アルゼンチンで星が消えた"}, {"t": 865.8166666666667, "x": "長さから推し量った形と、合っていました。"}, {"t": 868.8333333333334, "x": "チームは、大きいほうの丸を「ウルティマ」、"}, {"t": 871.9166666666666, "x": "小さいほうを「トゥーレ」と呼んだとされています。"}, {"t": 875.5833333333334, "x": "全体の長さは、およそ三十五キロメートル。"}, {"t": 878.7666666666667, "x": "二つの丸が、細いくびれでつながっています。"}, {"t": 881.8333333333334, "x": "色は赤く、冥王星よりも赤いものでした。"}, {"t": 885.0833333333334, "x": "データの受信は、その後も長く続きました。"}, {"t": 888.1333333333333, "x": "フライバイの一週間あまりあとにまとめられた"}, {"t": 890.6833333333333, "x": "最初の報告には、その時点で手元にあるのは"}, {"t": 893.8, "x": "四日分のデータだけだと記されています。"}, {"t": 896.1833333333333, "x": "最も細かい画像を含むデータが届き、それを"}, {"t": 899.4666666666667, "x": "使った論文がそろって出たのは、翌二〇二〇年の二月です。"}, {"t": 903.6, "x": "そのときも、全部を下ろし終えるには、"}, {"t": 906.2, "x": "二〇二〇年の終わりまでかかると書かれていました。"}, {"t": 909.4833333333333, "x": "撮影にかかったのは、最接近をはさんだ数日間です。"}, {"t": 913.4666666666667, "x": "それを受け取るのに、およそ二年かかりました。"}, {"t": 916.5333333333333, "x": "同じ二〇一九年の十一月、天体には"}, {"t": 919.85, "x": "正式な名前が付きました。"}, {"t": 921.55, "x": "アロコス。"}, {"t": 921.55, "x": "アロコス█"}, {"t": 922.6666666666666, "x": "アメリカ東部の、いまのバージニア州と"}, {"t": 925.2333333333333, "x": "メリーランド州の沿岸に暮らしてきたポウハタンの"}, {"t": 927.9, "x": "人々のことばで、「空」を意味するとされる言葉です。"}, {"t": 931.75, "x": "ハッブル望遠鏡の運用拠点も、探査機を作って"}, {"t": 935.1833333333333, "x": "動かしている研究所も、同じ地域にあったことから、"}, {"t": 938.6333333333333, "x": "この言葉が選ばれたとされています。"}, {"t": 941.0666666666667, "x": "NASAは、ポウハタンの部族の長老の"}, {"t": 943.55, "x": "同意を得て名前を決めたと書いています。"}, {"t": 945.85, "x": "ポウハタンの言葉は、十八世紀の"}, {"t": 948.35, "x": "終わりごろには話されなくなりました。"}, {"t": 950.45, "x": "残っているのは、十七世紀のはじめにイギリス人が"}, {"t": 953.9166666666666, "x": "書き留めた、短い単語の一覧だけだとされています。"}, {"t": 957.4333333333333, "x": "その一覧では「空」と訳されていますが、本来は「雲」を"}, {"t": 962.8833333333333, "x": "意味していた可能性もあると指摘されています。"}, {"t": 965.4666666666667, "x": "大きいほうの丸はウェヌ、小さいほうは"}, {"t": 966.8333333333334, "x": "ウェヌ█"}, {"t": 968.55, "x": "ウィーヨ█"}, {"t": 968.8166666666667, "x": "ウィーヨという正式な名前になりました。"}, {"t": 971.8, "x": "ウェヌは南アメリカのマプチェ語、ウィーヨは"}, {"t": 974.4666666666667, "x": "西アフリカのプラール語で、どちらも「空」を"}, {"t": 978.15, "x": "意味する言葉だとされています。"}, {"t": 979.9, "x": "名前は、写真の上で付けられていきました。"}, {"t": 982.85, "x": "ただ、その写真には、写っていない部分がありました。"}, {"t": 986.65, "x": "アロコスは、横倒しになって回っています。"}, {"t": 989.65, "x": "自転の軸が、公転する面に対して、九十八度傾いています。"}, {"t": 994.6166666666667, "x": "地球の軸の傾きが二十三度あまりですから、"}, {"t": 997.55, "x": "ほとんど寝転んだ状態です。"}, {"t": 999.7, "x": "一回転するのに、約十五・九時間かかります。"}, {"t": 1003.2833333333333, "x": "軸が寝ていると、一方の極が長いあいだ太陽を向き続け、"}, {"t": 1007.45, "x": "反対側の極はそのあいだずっと夜になります。"}, {"t": 1010.6666666666666, "x": "アロコスが太陽を一周するのには、"}, {"t": 1012.8166666666667, "x": "約二百九十三年かかります。"}, {"t": 1015.3333333333334, "x": "そして、探査機が通り過ぎた二〇一九年、アロコスは、"}, {"t": 1019.6, "x": "南極をほとんど真っすぐ太陽に向けていました。"}, {"t": 1022.8, "x": "加えて、探査機が近づいてきた方向も、"}, {"t": 1025.7833333333333, "x": "太陽の方向とほぼそろっていました。"}, {"t": 1028.4, "x": "つまり探査機は、太陽を背にして、"}, {"t": 1030.8833333333334, "x": "昼の側からまっすぐ近づいたことになります。"}, {"t": 1033.95, "x": "接近の最後の十数時間、探査機は天体を撮り続け、"}, {"t": 1038.0166666666667, "x": "自転一回ぶんの時間の八十五パーセントをカバーしました。"}, {"t": 1041.9333333333334, "x": "天体は探査機の目の前で、ほぼ一回転したことになります。"}, {"t": 1046.0833333333333, "x": "それでも、見えたのは片方の半球だけでした。"}, {"t": 1049.35, "x": "軸が探査機のほうを向いていたので、"}, {"t": 1051.4333333333334, "x": "いくら回っても、見えている面は同じ南側のままです。"}, {"t": 1055.65, "x": "北側は、回転の向こう側ではなく、"}, {"t": 1058.4166666666667, "x": "軸の反対側にありました。"}, {"t": 1060.5833333333333, "x": "回るのを待っても、こちらを向いてはくれません。"}, {"t": 1063.6666666666667, "x": "そしてそこは、長い冬の夜の中にありました。"}, {"t": 1066.95, "x": "二〇二六年に発表された形の解析は、"}, {"t": 1070.0166666666667, "x": "この点をはっきり書いています。"}, {"t": 1072.15, "x": "照らされていて、画像に写っていたのは、"}, {"t": 1074.85, "x": "南半分だけだった。"}, {"t": 1076.65, "x": "では、北半分の形はどうやって決めたのか。"}, {"t": 1079.8333333333333, "x": "答えは、第3章と同じ方法でした。"}, {"t": 1082.8333333333333, "x": "星が消えるかどうかです。"}, {"t": 1084.4666666666667, "x": "最接近を過ぎたあと、探査機はカメラを後ろに向け、"}, {"t": 1088.1833333333334, "x": "遠ざかっていく天体を振り返って撮りました。"}, {"t": 1091.6833333333334, "x": "このとき天体は、太陽の光を後ろから受けています。"}, {"t": 1095.4333333333334, "x": "探査機から見えるのは、ふちだけが"}, {"t": 1097.6833333333334, "x": "光る、細い三日月の形です。"}, {"t": 1100.1166666666666, "x": "二つの丸があるので、三日月も二つ並びます。"}, {"t": 1103.45, "x": "この振り返りの撮影では、全部で"}, {"t": 1105.9833333333333, "x": "三百三十六枚が撮られました。"}, {"t": 1108.15, "x": "そのうち、薄い二重の三日月が"}, {"t": 1110.6, "x": "写っていたのは、十三枚です。"}, {"t": 1112.85, "x": "光の当たっていない部分は、何も写りません。"}, {"t": 1116.0833333333333, "x": "けれども、その向こうには遠くの星があります。"}, {"t": 1119.2666666666667, "x": "暗い半分が星の前にかかれば、"}, {"t": 1121.3333333333333, "x": "その星は隠れて見えなくなります。"}, {"t": 1123.85, "x": "かからなければ、見えたままです。"}, {"t": 1126.2, "x": "研究チームは、写っている星の一つ一つについて、"}, {"t": 1129.85, "x": "隠れたか、隠れなかったかを調べました。"}, {"t": 1133.1, "x": "隠れた星の位置を結ぶと、暗い側が"}, {"t": 1135.9333333333334, "x": "どこまで張り出しているのかが分かります。"}, {"t": 1138.15, "x": "アルゼンチンの地上で待った方法を、今度は"}, {"t": 1141.1166666666666, "x": "探査機のカメラの中で行ったことになります。"}, {"t": 1143.9, "x": "分かったのは、厚みの限界でした。"}, {"t": 1146.4666666666667, "x": "北半分はここより厚くはない、"}, {"t": 1148.45, "x": "ここまでは張り出している、という幅です。"}, {"t": 1151.55, "x": "表面にどんなくぼみや盛り上がりがあるのかは、"}, {"t": 1154.25, "x": "分かりません。"}, {"t": 1155.4166666666667, "x": "二〇二六年の形の解析では、"}, {"t": 1157.8, "x": "北側の凹凸による形の不確かさは、最大で"}, {"t": 1161.5333333333333, "x": "一キロメートルほどだろうとされています。"}, {"t": 1163.7666666666667, "x": "図では、その部分が赤く塗られています。"}, {"t": 1166.5333333333333, "x": "凡例には、こう書かれています。"}, {"t": 1168.8833333333334, "x": "撮影されておらず、写っていないことからのみ"}, {"t": 1172.0166666666667, "x": "制約された領域。"}, {"t": 1173.4166666666667, "x": "この「見えていない半分」は、天体の"}, {"t": 1176.7333333333333, "x": "姿の理解そのものを一度変えています。"}, {"t": 1179.1666666666667, "x": "フライバイの翌月、二〇一九年の二月には、"}, {"t": 1182.55, "x": "振り返りの画像をもとに、アロコスは"}, {"t": 1185.3166666666666, "x": "雪だるまというより、平たいパンケーキのような"}, {"t": 1188.2666666666667, "x": "形だという見方が示されたとされています。"}, {"t": 1190.8833333333334, "x": "二〇二〇年に発表された形の"}, {"t": 1193.05, "x": "モデルも、平たく薄いものでした。"}, {"t": 1195.4166666666667, "x": "ところが、二〇二六年、すべての画像を新しい"}, {"t": 1199.35, "x": "方法で解析しなおしたモデルでは、アロコスは、"}, {"t": 1202.5166666666667, "x": "それより「はっきり厚く、体積も大きい」とされました。"}, {"t": 1207.2333333333333, "x": "小さいほうの丸はほぼ球に近く、大きいほうの丸は平たい。"}, {"t": 1211.55, "x": "体積の比は、ほぼ二対一です。"}, {"t": 1214.0833333333333, "x": "新しい写真が届いたわけではありません。"}, {"t": 1216.6833333333334, "x": "探査機はもう、はるか遠くを飛んでいます。"}, {"t": 1219.5166666666667, "x": "同じ三十本の撮影の記録を、別の方法で"}, {"t": 1222.9833333333333, "x": "読みなおしただけで、形が変わりました。"}, {"t": 1225.7, "x": "それだけ、写っていない部分が"}, {"t": 1227.9333333333334, "x": "大きかったということでもあります。"}, {"t": 1229.8666666666666, "x": "見えていない側の温度も、測られています。"}, {"t": 1232.7833333333333, "x": "探査機には、電波を使って天体の"}, {"t": 1235.35, "x": "温度を測る仕組みもありました。"}, {"t": 1237.1333333333334, "x": "通り過ぎたあとに夜の側を測ると、"}, {"t": 1239.4, "x": "温度は零下二百四十四度前後。"}, {"t": 1242.2, "x": "数字で言えば二十九ケルビン、"}, {"t": 1244.0666666666666, "x": "誤差はプラスマイナス五ケルビンです。"}, {"t": 1246.55, "x": "昼の側の平衡温度として予想されていた"}, {"t": 1249.1333333333334, "x": "約五十ケルビンより、ずっと低い値でした。"}, {"t": 1252.2833333333333, "x": "ただし電波は、表面より少し深いところから出てきます。"}, {"t": 1256.1666666666667, "x": "地下にまだ残っている温かさを拾っている"}, {"t": 1258.65, "x": "可能性がある、と考えられています。"}, {"t": 1261.3, "x": "写真には写らなかった北半分について、"}, {"t": 1263.8166666666666, "x": "いま手元にあるのは、星が隠れた位置と、"}, {"t": 1267.0, "x": "電波で測った温度の二つです。"}, {"t": 1269.3333333333333, "x": "北半分に、次に日が当たるのはいつなのか。"}, {"t": 1272.45, "x": "季節が約二百九十三年の公転に合わせて"}, {"t": 1275.4333333333334, "x": "巡ることは分かっていますが、その時期を"}, {"t": 1278.0666666666666, "x": "具体的に示した資料は、確認できていません。"}, {"t": 1281.3166666666666, "x": "いずれにせよ、そのとき近くにいる探査機は、ありません。"}, {"t": 1285.3666666666666, "x": "では、写っていた南半分には、何があったのか。"}, {"t": 1289.1666666666667, "x": "最初に目立つのは、傷の少なさです。"}, {"t": 1291.95, "x": "アロコスの表面には、衝突でできたくぼみ、"}, {"t": 1295.0333333333333, "x": "クレーターが、ほとんどありません。"}, {"t": 1297.6, "x": "月や水星の表面が、無数のクレーターで"}, {"t": 1300.65, "x": "覆われているのとは対照的です。"}, {"t": 1302.7166666666667, "x": "これは、帯の中での衝突が、とても少なく、"}, {"t": 1306.2666666666667, "x": "とても遅いからだと考えられています。"}, {"t": 1308.9, "x": "帯の天体は、ほぼ同じ向きに、"}, {"t": 1311.3, "x": "ゆっくりと太陽を回っています。"}, {"t": 1313.5666666666666, "x": "ぶつかることはまれで、ぶつかっても速さは"}, {"t": 1316.2333333333333, "x": "一秒間に三百メートルほどが多いとされます。"}, {"t": 1319.1666666666667, "x": "惑星の近くで起きる衝突に比べれば、ずっとおだやかです。"}, {"t": 1323.3, "x": "それでも、少ないクレーターの数を"}, {"t": 1325.6333333333334, "x": "数えることで、表面の年齢は推し量れます。"}, {"t": 1328.9, "x": "論文の見積もりは、約四十億年以上。"}, {"t": 1332.1, "x": "アロコスの表面は、太陽系ができたころの姿を"}, {"t": 1335.5666666666666, "x": "ほとんどそのまま保っている可能性が高い、とされました。"}, {"t": 1339.2333333333333, "x": "この古さは、アロコスが属している"}, {"t": 1341.6333333333334, "x": "群れの性質とも合っています。"}, {"t": 1343.3666666666666, "x": "アロコスは、「コールド・クラシカル」と"}, {"t": 1346.0166666666667, "x": "呼ばれる群れに属しています。"}, {"t": 1347.7166666666667, "x": "コールド、冷たいという言葉が"}, {"t": 1349.8833333333334, "x": "付いていますが、温度の話ではありません。"}, {"t": 1352.8333333333333, "x": "軌道の話です。"}, {"t": 1354.15, "x": "軌道がほぼ円く、傾きも小さい。"}, {"t": 1357.0166666666667, "x": "大きな惑星の重力で揺さぶられた跡がなく、"}, {"t": 1359.8833333333334, "x": "生まれたときからほぼ同じ場所を"}, {"t": 1362.0333333333333, "x": "回り続けてきたと考えられている群れです。"}, {"t": 1364.6166666666666, "x": "二つ目は、形そのものです。"}, {"t": 1366.9166666666667, "x": "二つの丸は、それぞれ別々にできたと考えられています。"}, {"t": 1370.8666666666666, "x": "さらに、それぞれの丸も、もっと小さなかたまりが"}, {"t": 1374.3833333333334, "x": "たくさん、ゆっくりと集まってできたらしいことが、"}, {"t": 1377.4666666666667, "x": "表面の模様から読み取られました。"}, {"t": 1379.8666666666666, "x": "大きいほうの丸の表面には、大きさのそろった"}, {"t": 1383.0, "x": "塊のような区画がいくつも並んでいます。"}, {"t": 1385.5666666666666, "x": "そうしてできた二つの丸は、しばらくのあいだ、"}, {"t": 1388.4833333333333, "x": "互いの周りを回っていたと考えられています。"}, {"t": 1391.6, "x": "やがて少しずつ近づき、ぶつかるというより、"}, {"t": 1394.6333333333334, "x": "そっと触れるようにしてくっついた。"}, {"t": 1396.8666666666666, "x": "くびれの部分がつぶれずに残っているのは、"}, {"t": 1399.2833333333333, "x": "合わさったときの速さが、"}, {"t": 1401.1, "x": "とても遅かったためだとされています。"}, {"t": 1403.5166666666667, "x": "太陽系の惑星は、小さなかたまりが"}, {"t": 1406.3333333333333, "x": "集まって大きくなったと考えられています。"}, {"t": 1408.85, "x": "ただ、その最初の段階、かたまりどうしが"}, {"t": 1411.9833333333333, "x": "どんなふうに集まったのかを、直接見られる"}, {"t": 1414.7666666666667, "x": "場所は、ほとんど残っていません。"}, {"t": 1416.9166666666667, "x": "惑星になったものは、そのあとの熱や"}, {"t": 1419.5166666666667, "x": "衝突で、はじめの姿を失っているからです。"}, {"t": 1422.7666666666667, "x": "アロコスは、その途中で止まったまま、"}, {"t": 1425.2333333333333, "x": "四十億年以上そこにあった、とされています。"}, {"t": 1428.8333333333333, "x": "三つ目は、色と成分です。"}, {"t": 1431.05, "x": "アロコスは赤い天体です。"}, {"t": 1432.8333333333333, "x": "冥王星よりも赤く、これまでに"}, {"t": 1435.25, "x": "探査機が訪れた外側の太陽系の天体の中で、"}, {"t": 1438.6333333333334, "x": "最も赤いとNASAは書いています。"}, {"t": 1440.9666666666667, "x": "表面の分析からは、メタノール、水の氷、そして"}, {"t": 1445.2833333333333, "x": "複雑な有機物の手がかりが見つかりました。"}, {"t": 1448.0, "x": "赤い色は、長いあいだ紫外線や"}, {"t": 1450.4666666666667, "x": "宇宙から降りそそぐ粒子を浴びて、表面の"}, {"t": 1453.4166666666667, "x": "物質が変わったためだと考えられています。"}, {"t": 1455.9333333333334, "x": "周りに、ほかの天体もありませんでした。"}, {"t": 1458.8333333333333, "x": "半径八千キロメートルの範囲に、直径百八十メートルを"}, {"t": 1462.9833333333333, "x": "超える衛星はなく、環も見つかりませんでした。"}, {"t": 1466.1166666666666, "x": "表面の地形には、少しずつ名前が付けられています。"}, {"t": 1469.8, "x": "国際天文学連合は二〇二〇年、アロコスの地形の"}, {"t": 1473.7, "x": "名前は、世界の過去と現在の言語の「空」という"}, {"t": 1477.8333333333333, "x": "言葉から取る、と決めたとされています。"}, {"t": 1480.4166666666667, "x": "小さいほうの丸にある大きなくぼみは、"}, {"t": 1482.7666666666667, "x": "英語で空を意味する「スカイ」。"}, {"t": 1485.35, "x": "二つの丸のつなぎめにある明るい帯は、"}, {"t": 1487.8, "x": "ベンガル語で空を意味する「アカサ」。"}, {"t": 1490.6666666666667, "x": "大きいほうの丸の真ん中を丸く囲む筋は、"}, {"t": 1493.3833333333334, "x": "マヤの言葉で空を意味する「カアン」と"}, {"t": 1496.7666666666667, "x": "名付けられたとされています。"}, {"t": 1498.3, "x": "写っていた南半分には、こうして空の名前が並んでいます。"}, {"t": 1502.4333333333334, "x": "写っていない北半分には、まだ一つもありません。"}, {"t": 1505.7833333333333, "x": "アロコスを過ぎたあとも、探査機は"}, {"t": 1508.1166666666666, "x": "帯の中を進み続けました。"}, {"t": 1509.9833333333333, "x": "近くを通るほかの天体を、遠くから撮る"}, {"t": 1512.8166666666666, "x": "観測は、冥王星の前後から始まっていました。"}, {"t": 1516.2, "x": "最初の例は、一九九四ジェイアールワンという天体です。"}, {"t": 1517.3333333333333, "x": "一九九四ジェイアールワン█"}, {"t": 1521.1333333333334, "x": "探査機は二〇一五年十一月に約二・八億キロメートル、"}, {"t": 1525.1666666666667, "x": "二〇一六年四月には約一億キロメートルの"}, {"t": 1528.55, "x": "距離から、この天体を撮りました。"}, {"t": 1530.8833333333334, "x": "太陽と地球の距離の〇・七一倍です。"}, {"t": 1533.7166666666667, "x": "冥王星以外の帯の天体を、これほど"}, {"t": 1536.5833333333333, "x": "近くから観測したのは初めてでした。"}, {"t": 1538.9166666666667, "x": "ただ、一億キロメートル離れていれば、"}, {"t": 1541.5666666666666, "x": "直径数十キロメートルの天体は、やはり光の点です。"}, {"t": 1545.8333333333333, "x": "形は写りません。"}, {"t": 1547.2333333333333, "x": "分かったのは、自転が約五・五時間であることなど、点の"}, {"t": 1551.4666666666667, "x": "明るさの変化から読み取れる性質でした。"}, {"t": 1554.0, "x": "そのあと、探査機は帯の中の五つの天体に、地球の"}, {"t": 1558.1666666666667, "x": "望遠鏡では届かない距離まで近づいて撮影しています。"}, {"t": 1561.6666666666667, "x": "距離は、太陽と地球の距離の〇・〇九二倍から〇・二九倍。"}, {"t": 1566.5, "x": "それでも、見分けられる細かさは、"}, {"t": 1568.8166666666666, "x": "百三十六キロメートルから四百三十キロメートルでした。"}, {"t": 1572.8333333333333, "x": "天体そのものの大きさより、見分けられる"}, {"t": 1575.6166666666666, "x": "細かさのほうが大きい、ということです。"}, {"t": 1578.3333333333333, "x": "表面は写りません。"}, {"t": 1579.8, "x": "それでも、分かったことはありました。"}, {"t": 1582.25, "x": "二〇一一ジェイワイサーティーワンと名付けられた"}, {"t": 1584.8666666666666, "x": "天体は、一つの点ではなく、二つの点でした。"}, {"t": 1588.5833333333333, "x": "明るさのほぼ等しい二つの天体が、"}, {"t": 1590.8666666666666, "x": "約百九十九キロメートル離れて、約一・"}, {"t": 1594.35, "x": "九四日で互いの周りを回っていました。"}, {"t": 1597.05, "x": "互いの周りを回る、二つの天体。"}, {"t": 1599.8166666666666, "x": "アロコスの二つの丸も、くっつく前は"}, {"t": 1602.4, "x": "こうだったと考えられています。"}, {"t": 1604.2333333333333, "x": "NASAは二〇二六年、フライバイのあと探査機が"}, {"t": 1607.5333333333333, "x": "観測した帯の天体は数十にのぼる、と書いています。"}, {"t": 1611.2833333333333, "x": "けれども、その中で形が写ったものは、"}, {"t": 1614.0666666666666, "x": "アロコスのほかにはありません。"}, {"t": 1616.05, "x": "もう一度、どれかに近づくことはできないのか。"}, {"t": 1619.2166666666667, "x": "探査チームは、地上の望遠鏡で、残りの"}, {"t": 1622.6333333333334, "x": "燃料で届く範囲の天体を探し続けています。"}, {"t": 1625.65, "x": "そこで使われている望遠鏡の一つが、"}, {"t": 1628.5666666666666, "x": "ハワイにある日本のすばる望遠鏡です。"}, {"t": 1630.3833333333334, "x": "すばる望遠鏡█"}, {"t": 1632.0166666666667, "x": "探査機の進む先は、夜空で言えば、"}, {"t": 1634.6666666666667, "x": "いて座の方角にあたります。"}, {"t": 1636.75, "x": "天の川の中でも星がとても込み合っていて、"}, {"t": 1639.4833333333333, "x": "暗い天体を見つけるのが難しい方角です。"}, {"t": 1642.75, "x": "二〇二四年の報告では、機械学習の技術を"}, {"t": 1646.3166666666666, "x": "使って大量の偽物の候補をふるい落とし、"}, {"t": 1649.0333333333333, "x": "二百三十九個の天体を見つけたとされています。"}, {"t": 1652.5166666666667, "x": "ただし、二〇二四年の時点で、"}, {"t": 1655.1, "x": "NASAは次のように書いています。"}, {"t": 1657.3333333333333, "x": "科学界は現在、到達できるカイパーベルト天体を"}, {"t": 1661.0, "x": "把握していない。"}, {"t": 1661.9, "x": "候補は見つかっていても、残りの燃料で進路を"}, {"t": 1665.0333333333333, "x": "曲げて届く相手は、まだ一つもない、という意味です。"}, {"t": 1668.7666666666667, "x": "その代わりに、別のことが分かり始めています。"}, {"t": 1671.9833333333333, "x": "すばる望遠鏡での探索では、太陽から"}, {"t": 1674.9666666666667, "x": "地球までの距離の七十倍より遠いところに、"}, {"t": 1677.7166666666667, "x": "予想よりも多くの天体が見つかりました。"}, {"t": 1680.5333333333333, "x": "帯は五十倍あたりで終わると"}, {"t": 1682.3166666666666, "x": "考えられてきたので、その外側にまだ天体がある"}, {"t": 1685.6666666666667, "x": "可能性が出てきたことになります。"}, {"t": 1687.65, "x": "もう一つの手がかりは、探査機に"}, {"t": 1689.9166666666667, "x": "積まれた、ちりを数える装置です。"}, {"t": 1692.3666666666666, "x": "この装置は、大学の学生たちが専門の技術者の"}, {"t": 1695.9666666666667, "x": "指導を受けて設計し、作ったものです。"}, {"t": 1698.8, "x": "NASAの惑星探査で、学生が"}, {"t": 1701.1166666666666, "x": "作った初めての科学機器でした。"}, {"t": 1703.1333333333334, "x": "二〇二四年の報告によれば、太陽からの距離が"}, {"t": 1706.65, "x": "四十五倍から五十五倍のあたりで、この装置が"}, {"t": 1709.9333333333334, "x": "数えたちりは、予想よりも多いものでした。"}, {"t": 1712.7833333333333, "x": "その後の報告では、六十一倍の距離まで、予想の"}, {"t": 1716.7666666666667, "x": "二倍から三倍という値が続いているとされています。"}, {"t": 1719.9666666666667, "x": "ちりは、帯の天体どうしがぶつかったり、"}, {"t": 1722.7166666666667, "x": "外からの細かい粒に削られたりしてできます。"}, {"t": 1725.9, "x": "天体の数が減っていくはずの場所で、ちりが減っていない。"}, {"t": 1729.5833333333333, "x": "NASAはこれについて、帯の外側の端が、"}, {"t": 1732.4833333333333, "x": "これまでの見積もりより数十億キロメートル先まで"}, {"t": 1735.8166666666666, "x": "延びているか、あるいは、知られている帯の外に、"}, {"t": 1739.3, "x": "もう一つ別の帯がある可能性がある、と書いています。"}, {"t": 1743.1666666666667, "x": "ただし、どれもまだ確定した話ではありません。"}, {"t": 1746.4666666666667, "x": "太陽の光に押されて内側のちりが外へ運ばれている"}, {"t": 1749.8833333333334, "x": "可能性など、ほかの説明も検討されています。"}, {"t": 1753.2333333333333, "x": "帯の外側には、まだ誰も形を見たことのない"}, {"t": 1756.4833333333333, "x": "天体が、あるのかもしれないし、ないのかもしれない。"}, {"t": 1760.3833333333334, "x": "いまの記録で言えるのは、そこまでです。"}, {"t": 1763.1, "x": "ニューホライズンズは、いまも飛び続けています。"}, {"t": 1766.1166666666666, "x": "二〇二四年十月一日、探査機は、太陽から"}, {"t": 1770.1833333333334, "x": "地球までの距離の六十倍の地点を越えました。"}, {"t": 1773.0666666666666, "x": "冥王星のそばを通ったときの、ちょうど二倍の遠さです。"}, {"t": 1776.9, "x": "一年に、約四億八千万キロメートルずつ遠ざかっています。"}, {"t": 1781.1166666666666, "x": "NASAは二〇二四年、この探査機の役目を少し変えました。"}, {"t": 1785.3666666666666, "x": "二〇二五会計年度からは、太陽から吹き出す"}, {"t": 1788.7333333333333, "x": "粒子の流れや、太陽の影響が及ぶ範囲の"}, {"t": 1791.85, "x": "外側の様子を調べることが中心になります。"}, {"t": 1794.7666666666667, "x": "帯の天体に近づく機会が来たときのために、"}, {"t": 1797.5666666666666, "x": "燃料は取っておく。"}, {"t": 1799.1833333333334, "x" を見越した作り替えです。"}, {"t": 1920.0166666666667, "x": "NASAの見通しでは、推進剤と電力は、"}, {"t": 1922.95, "x": "二〇四〇年代まで、太陽から地球までの距離の"}, {"t": 1926.7833333333333, "x": "百倍を超える遠さまで持つとされています。"}, {"t": 1929.3666666666666, "x": "ただ、どれだけ遠くへ行っても、"}, {"t": 1931.4, "x": "あのとき後ろを振り返って撮った三百三十六枚の"}, {"t": 1934.9333333333334, "x": "画像を、撮りなおすことはできません。"}, {"t": 1937.3166666666666, "x": "探査機は同じ道を戻りません。"}, {"t": 1939.4666666666667, "x": "アロコスの北半分を、もう一度見に行く"}, {"t": 1942.2666666666667, "x": "機会は、この探査機にはありません。"}, {"t": 1944.7333333333333, "x": "NASAの言葉で言えば、カイパーベルトの"}, {"t": 1947.2166666666667, "x": "中で動き、新しい情報を集めている探査機は、"}, {"t": 1950.8, "x": "いまもニューホライズンズ一機だけです。"}, {"t": 1953.2, "x": "冥王星の先には、数十万個の氷の"}, {"t": 1956.2166666666667, "x": "天体が回っていると見積もられています。"}, {"t": 1958.5666666666666, "x": "そのうち、近くから形を撮られたものは、一つだけです。"}, {"t": 1962.75, "x": "その一つも、南半分しか写っていません。"}, {"t": 1965.9166666666667, "x": "北半分について分かっているのは、遠くの星を"}, {"t": 1969.0833333333333, "x": "隠したかどうかと、電波で測った冷たさだけです。"}, {"t": 1972.45, "x": "名前は、空。"}, {"t": 1973.8833333333334, "x": "ただ、その言葉は、本当は雲を指していたのかも"}, {"t": 1977.4, "x": "しれない、とも言われています。"}, {"t": 1979.4166666666667, "x": "写った半分には、世界の言葉で"}, {"t": 1981.8333333333333, "x": "空を意味する名前が付いています。"}, {"t": 1983.9, "x": "写らなかった半分には、まだ名前がありません。"}, {"t": 1987.0833333333333, "x": "アロコスは、約二百九十三年かけて"}, {"t": 1989.9166666666667, "x": "太陽を回り続けています。"}, {"t": 1991.6666666666667, "x": "季節が巡れば、いつか北半分にも"}, {"t": 1994.3166666666666, "x": "日が当たる時期が来るはずです。"}, {"t": 1996.0166666666667, "x": "そのとき、それを近くで見る探査機がいるか"}, {"t": 1998.9833333333333, "x": "どうかは、どの記録にも書かれていません。"}], "w": 720, "h": 405, "n_cuts": 720, "noimage": false};
const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
