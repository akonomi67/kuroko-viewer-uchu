66664, "x": "水ではありません。"}, {"t": 45.88333333333333, "x": "メタンとエタンの海です。"}, {"t": 47.43333333333333, "x": "液体に覆われた広さを合わせると、表面の"}, {"t": 50.666666666666664, "x": "およそ二パーセントになると報告されています。"}, {"t": 53.28333333333333, "x": "深いところでは、百六十メートル。"}, {"t": 55.96666666666667, "x": "こうした数字は、あとから別の探査機が、"}, {"t": 58.733333333333334, "x": "電波と赤外線を使って測りました。"}, {"t": 61.53333333333333, "x": "けれども、その海を、岸に立って"}, {"t": 64.13333333333334, "x": "撮った写真は、一枚もありません。"}, {"t": 66.58333333333333, "x": "海の上に浮かんで撮った写真もありません。"}, {"t": 69.11666666666666, "x": "ホイヘンスが降りた場所は、海ではありませんでした。"}, {"t": 72.41666666666667, "x": "乾いた川原でした。"}, {"t": 73.8, "x": "しかも、タイタンに液体の海があると確かめられたのは、"}, {"t": 77.35, "x": "ホイヘンスが降りた、あとのことです。"}, {"t": 80.15, "x": "降りた機械は、海のことを知らないまま、"}, {"t": 82.8, "x": "海のない場所に着きました。"}, {"t": 84.75, "x": "タイタンの地面から撮った写真は、"}, {"t": 86.71666666666667, "x": "ホイヘンスが送ってきたものだけです。"}, {"t": 89.18333333333334, "x": "着いたあとの写真は、動くことのできない"}, {"t": 91.91666666666667, "x": "機械が、一つの方向を見たまま撮ったものです。"}, {"t": 95.15, "x": "この回では、その一か所に残された記録を、"}, {"t": 98.21666666666667, "x": "降りる前から順に読んでいきます。"}, {"t": 100.53333333333333, "x": "何が撮れて、何が撮れなかったのか。"}, {"t": 103.25, "x": "そして、撮れなかったものについて、"}, {"t": 105.65, "x": "いまどこまで分かっているのかを。"}, {"t": 107.8, "x": "記録は、写真と、数字と、途切れた電波でできています。"}, {"t": 112.35, "x": "タイタンが見つかったのは、一六五五年三月二十五日です。"}, {"t": 114.81666666666666, "x": "一六五五年三月二十五日█"}, {"t": 117.46666666666667, "x": "見つけたのは、オランダのクリスティアーン・ホイヘンス。"}, {"t": 119.13333333333334, "x": "クリスティアーン・ホイヘンス█"}, {"t": 121.2, "x": "三百五十年後にこの衛星へ降りる着陸機は、"}, {"t": 124.41666666666667, "x": "この人の名前をもらっています。"}, {"t": 126.63333333333334, "x": "タイタンは、土星のまわりを回る"}, {"t": 128.91666666666666, "x": "衛星のなかで、いちばん大きな天体です。"}, {"t": 131.91666666666666, "x": "半径は、およそ二千五百七十五キロメートル。"}, {"t": 135.41666666666666, "x": "地球の月より、幅がおよそ半分広い大きさです。"}, {"t": 139.11666666666667, "x": "直径だけで比べると、惑星の"}, {"t": 141.5, "x": "水星よりも大きいとされています。"}, {"t": 143.61666666666667, "x": "土星からは、およそ百二十万キロメートル"}, {"t": 146.53333333333333, "x": "離れたところを回っています。"}, {"t": 148.25, "x": "一周にかかるのは、十五日と二十二時間。"}, {"t": 151.45, "x": "土星そのものが太陽のまわりを一周するのに、"}, {"t": 154.26666666666668, "x": "地球の時間でおよそ二十九年かかるので、"}, {"t": 157.35, "x": "タイタンの一年も二十九年です。"}, {"t": 159.85, "x": "季節の一つが、七年より長く続きます。"}, {"t": 163.0, "x": "見つかってから三百年あまりのあいだ、"}, {"t": 165.2, "x": "タイタンは、望遠鏡のなかの小さな光の点でした。"}, {"t": 169.23333333333332, "x": "表面がどうなっているのかを、"}, {"t": 170.95, "x": "確かめる方法はありませんでした。"}, {"t": 173.36666666666667, "x": "その機会が来たのは、一九八〇年十一月十二日です。"}, {"t": 175.51666666666668, "x": "一九八〇年十一月十二日█"}, {"t": 178.51666666666668, "x": "探査機ボイジャー一号が、土星のそばを通り過ぎました。"}, {"t": 179.06666666666666, "x": "ボイジャー一号█"}, {"t": 183.28333333333333, "x": "土星にいちばん近づいたのは、"}, {"t": 185.05, "x": "協定世界時の二十三時四十六分。"}, {"t": 188.0, "x": "土星から、およそ十二万六千キロメートルのところでした。"}, {"t": 191.98333333333332, "x": "ボイジャー一号は、このときタイタンを"}, {"t": 194.46666666666667, "x": "よく見るための道筋を選んでいました。"}, {"t": 196.83333333333334, "x": "そのために、土星を過ぎたあとの行き先が決まりました。"}, {"t": 200.5, "x": "探査機は、惑星がほぼ同じ面に並んでいる、"}, {"t": 203.7, "x": "その面の北側へ抜けていきます。"}, {"t": 206.08333333333334, "x": "天王星や海王星へ向かう道は、とれなくなりました。"}, {"t": 209.91666666666666, "x": "ほかの惑星へ行く機会と引きかえに、タイタンを"}, {"t": 213.05, "x": "間近から見る道を選んだことになります。"}, {"t": 215.56666666666666, "x": "ボイジャー一号にとって、タイタンは、"}, {"t": 218.01666666666668, "x": "行き先を減らしてまで見ておくべき場所でした。"}, {"t": 221.03333333333333, "x": "そのかわり、この探査機が天王星と"}, {"t": 223.68333333333334, "x": "海王星を見ることは、ありませんでした。"}, {"t": 226.48333333333332, "x": "そうして近づいて、分かったことがあります。"}, {"t": 229.36666666666667, "x": "タイタンには、厚い大気がありました。"}, {"t": 231.98333333333332, "x": "そして、その大気が、表面をすっかり隠していました。"}, {"t": 236.11666666666667, "x": "探査機の目に映ったのは、もやに包まれた球でした。"}, {"t": 239.65, "x": "地面は、どこにも見えませんでした。"}, {"t": 242.25, "x": "アメリカ航空宇宙局の記録は、この大気を、"}, {"t": 245.5, "x": "表面を完全に隠す、厚い大気、と書いています。"}, {"t": 249.93333333333334, "x": "窒素を主にして、メタンなどの炭化水素を含んでいました。"}, {"t": 253.86666666666667, "x": "ほかの惑星をあきらめて近づいた先で、"}, {"t": 256.3833333333333, "x": "見えたのは、中身ではなく、覆いのほうでした。"}, {"t": 260.25, "x": "大気は、およそ九十五パーセントが窒素で、"}, {"t": 263.3333333333333, "x": "残りのおよそ五パーセントがメタンです。"}, {"t": 265.93333333333334, "x": "高さは、六百キロメートル近くまで広がっています。"}, {"t": 269.53333333333336, "x": "地面の上の気圧は、地球より"}, {"t": 271.85, "x": "およそ六割高いとされています。"}, {"t": 273.85, "x": "太陽の光も、ここまで来ると弱くなります。"}, {"t": 277.1, "x": "光がタイタンに届くまでに、およそ八十分。"}, {"t": 280.4, "x": "明るさは、地球で見る太陽の、およそ百分の一です。"}, {"t": 284.68333333333334, "x": "地面の上に立ったとしても、"}, {"t": 286.25, "x": "弱い光が、もやを通って届くだけです。"}, {"t": 289.55, "x": "見えないなかで、一つの推理がありました。"}, {"t": 292.4166666666667, "x": "メタンは、大気の上のほうで太陽の光に当たると、"}, {"t": 295.9166666666667, "x": "少しずつ壊れて、ほかの炭化水素に変わっていきます。"}, {"t": 299.9, "x": "変わったものは、元のメタンには戻りません。"}, {"t": 302.8833333333333, "x": "それでも、大気にはメタンが残っています。"}, {"t": 305.8, "x": "ということは、どこかにメタンをためておく場所があり、"}, {"t": 309.03333333333336, "x": "そこから補われているはずだ、という考え方です。"}, {"t": 312.8, "x": "これは、見た結果ではありません。"}, {"t": 315.0833333333333, "x": "計算から出てきた考えです。"}, {"t": 317.01666666666665, "x": "海があるかもしれない、という"}, {"t": 318.98333333333335, "x": "話は、見る前から始まっていました。"}, {"t": 321.6666666666667, "x": "ホイヘンスの記録をまとめた論文は、"}, {"t": 323.8833333333333, "x": "その冒頭で、この点をこう書いています。"}, {"t": 327.05, "x": "メタンが上空で壊れ続けている以上、地表か"}, {"t": 330.26666666666665, "x": "地下に、メタンのたまり場があるはずだ。"}, {"t": 332.6666666666667, "x": "けれども、周回する探査機のカメラには、世界全体を"}, {"t": 336.8, "x": "覆うような大きなたまり場は見えていない。"}, {"t": 339.05, "x": "見えないのは、大気が邪魔をしているからでした。"}, {"t": 342.1166666666667, "x": "メタンと、もやそのものが、"}, {"t": 344.05, "x": "上からの視線をさえぎっていました。"}, {"t": 346.53333333333336, "x": "上から見ても、分からない。"}, {"t": 348.51666666666665, "x": "けれども、分からないなりに、"}, {"t": 350.46666666666664, "x": "数字だけはそろっていきました。"}, {"t": 352.56666666666666, "x": "大きさ、大気の成分、地面の上の気圧。"}, {"t": 356.25, "x": "足りないのは、地面そのものの姿でした。"}, {"t": 359.1333333333333, "x": "外から見て分からないなら、中に入るしかありません。"}, {"t": 362.65, "x": "もやの下へ降りて、地面を自分の目で見る。"}, {"t": 365.75, "x": "そのための機械が作られることになりました。"}, {"t": 368.4166666666667, "x": "それも、一度きりです。"}, {"t": 370.35, "x": "降りた機械を、持ち帰る方法はありません。"}, {"t": 373.3333333333333, "x": "一九九七年十月十五日、協定世界時の八時四十三分。"}, {"t": 373.3333333333333, "x": "一九九七年十月十五日█"}, {"t": 378.8, "x": "土星へ向かう探査機が打ち上げられました。"}, {"t": 381.3333333333333, "x": "アメリカ航空宇宙局の周回機カッシーニと、"}, {"t": 383.6333333333333, "x": "カッシーニ█"}, {"t": 384.75, "x": "ヨーロッパ宇宙機関の着陸機ホイヘンス。"}, {"t": 388.21666666666664, "x": "二つを合わせた重さは、およそ五・六トンでした。"}, {"t": 391.81666666666666, "x": "ヨーロッパ宇宙機関によると、この重さは、"}, {"t": 394.76666666666665, "x": "土星へまっすぐ向かわせるには重すぎました。"}, {"t": 397.75, "x": "そのため、探査機は、ほかの"}, {"t": 400.1, "x": "惑星のそばを通るたびに、その重力を借りて"}, {"t": 403.23333333333335, "x": "速さを上げながら、遠回りで進みました。"}, {"t": 406.18333333333334, "x": "ホイヘンスは、そのうちの三百十八キログラムです。"}, {"t": 409.78333333333336, "x": "幅は、およそ二・七メートル。"}, {"t": 412.23333333333335, "x": "カッシーニに取りつけられたまま、"}, {"t": 414.0, "x": "土星まで運ばれていきました。"}, {"t": 416.1666666666667, "x": "二つが土星に着いたのは、二〇〇四年です。"}, {"t": 419.1666666666667, "x": "打ち上げから、およそ七年がたっていました。"}, {"t": 422.15, "x": "ホイヘンスの本番は、ここからです。"}, {"t": 424.75, "x": "二〇〇四年十二月二十五日、協定世界時の二時。"}, {"t": 424.75, "x": "二〇〇四年十二月二十五日█"}, {"t": 428.75, "x": "ホイヘンスは、カッシーニから切り離されました。"}, {"t": 431.8666666666667, "x": "ヨーロッパ宇宙機関は、そのときの発表で、"}, {"t": 434.9, "x": "七年いっしょに暮らしたあとの、"}, {"t": 437.0, "x": "円満な別れだった、と書いています。"}, {"t": 439.93333333333334, "x": "切り離されたホイヘンスは、そのまま眠りにつきました。"}, {"t": 443.56666666666666, "x": "タイタンまでの、およそ二十日間。"}, {"t": 445.9166666666667, "x": "電源をほとんど使わず、ただ慣性で進んでいきます。"}, {"t": 449.68333333333334, "x": "目を覚ますのは、大気に入る直前です。"}, {"t": 452.65, "x": "大気に入る予定の時刻は、二〇〇五年一月十四日の、"}, {"t": 456.68333333333334, "x": "協定世界時九時六分ごろ。"}, {"t": 458.9166666666667, "x": "その少し前に、眠っていた仕組みが動き"}, {"t": 461.76666666666665, "x": "出すように、あらかじめ決められていました。"}, {"t": 464.5, "x": "この着陸機が、どれだけ長く働けるかは、"}, {"t": 467.6166666666667, "x": "はじめから決められていました。"}, {"t": 469.6666666666667, "x": "ヨーロッパ宇宙機関の資料によると、電池を"}, {"t": 472.68333333333334, "x": "はじめとする持ち物は、降りるのにかかる"}, {"t": 475.3, "x": "時間を最大で百五十分、そして、地面に"}, {"t": 478.81666666666666, "x": "着いてから少なくとも三分動けるように、と"}, {"t": 481.73333333333335, "x": "見積もって用意されていました。"}, {"t": 483.4, "x": "地面の上で、少なくとも三分。"}, {"t": 485.9, "x": "これが、設計の上での約束でした。"}, {"t": 488.6666666666667, "x": "三分を超えて動けば、それは"}, {"t": 490.8833333333333, "x": "予定より多く働いたことになります。"}, {"t": 493.2, "x": "設計の数字の上では、仕事の大部分は、"}, {"t": 496.31666666666666, "x": "降りていくあいだに割り当てられていました。"}, {"t": 498.98333333333335, "x": "そもそも、降りた先が固い地面なのか、"}, {"t": 501.78333333333336, "x": "液体なのかも、降りるまで分かりませんでした。"}, {"t": 505.21666666666664, "x": "上から見て、それを確かめる方法がなかったからです。"}, {"t": 508.8333333333333, "x": "ホイヘンスには、六つの観測装置が積まれていました。"}, {"t": 512.5166666666667, "x": "大気の温度と気圧を測る装置。"}, {"t": 514.8333333333334, "x": "風を測る仕組み。"}, {"t": 516.2, "x": "写真を撮り、光の色を測るカメラ。"}, {"t": 518.9833333333333, "x": "空気の成分を調べる装置。"}, {"t": 521.1, "x": "もやの粒を集めて調べる装置。"}, {"t": 523.3833333333333, "x": "そして、地面に着いたときの手ごたえや、"}, {"t": 526.1166666666667, "x": "地面の性質を調べる装置です。"}, {"t": 528.6833333333333, "x": "地面の上で何分動けたとしても、そのあいだの"}, {"t": 531.75, "x": "記録を受け取って、地球へ中継するのは、"}, {"t": 534.7166666666667, "x": "上空を通り過ぎていくカッシーニの役目でした。"}, {"t": 537.9, "x": "カッシーニが空に見えているあいだだけ、話ができる。"}, {"t": 541.5, "x": "カッシーニが地平線の向こうへ"}, {"t": 543.2833333333333, "x": "去れば、話はそこで終わります。"}, {"t": 545.6833333333333, "x": "切り離しの日の発表では、地面に着いたあと動けるのは、"}, {"t": 549.5, "x": "百三十分を超えない見込みだとされていました。"}, {"t": 552.7166666666667, "x": "しかも、電波は、タイタンから地球まで、"}, {"t": 555.8166666666667, "x": "およそ六十七分かかって届きます。"}, {"t": 558.4833333333333, "x": "地球で記録を受け取るとき、そこに書かれていることは、"}, {"t": 562.0333333333333, "x": "いつも一時間以上前に起きたことでした。"}, {"t": 564.9, "x": "もう一つ、備えがありました。"}, {"t": 567.1666666666666, "x": "ホイヘンスは、同じ記録の多くを、二つの別々の"}, {"t": 571.0333333333333, "x": "電波に乗せて送るように作られていました。"}, {"t": 573.55, "x": "周波数は二千四十メガヘルツと、二千九十メガヘルツ。"}, {"t": 577.8333333333334, "x": "どちらか一方がうまくいかなくても、"}, {"t": 579.9333333333333, "x": "もう一方が残るようにするためです。"}, {"t": 582.5, "x": "この二つは、チャンネルAと"}, {"t": 583.5666666666667, "x": "チャンネルA█"}, {"t": 584.8, "x": "チャンネルB█"}, {"t": 585.1666666666666, "x": "チャンネルBと呼ばれていました。"}, {"t": 587.6333333333333, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 589.4, "x": "この計画には、十九の国が関わりました。"}, {"t": 593.0333333333333, "x": "科学者はおよそ二百六十人。"}, {"t": 595.2, "x": "技術者などを含めると、最大で一万人が"}, {"t": 598.2833333333333, "x": "関わり、準備には二十年がかかっています。"}, {"t": 601.35, "x": "そのすべてが、二時間あまりの降下と、少なくとも"}, {"t": 605.05, "x": "三分の地上のために、積み上げられていました。"}, {"t": 608.2166666666667, "x": "二〇〇五年一月十四日。"}, {"t": 608.2166666666667, "x": "二〇〇五年一月十四日█"}, {"t": 610.2, "x": "ホイヘンスは、タイタンの大気に入りました。"}, {"t": 613.15, "x": "ここから地面に着くまでに、二時間二十七分かかりました。"}, {"t": 615.3, "x": "二時間二十七分█"}, {"t": 617.6166666666667, "x": "パラシュートにつるされたまま、"}, {"t": 619.2333333333333, "x": "ゆっくりと降りていく時間です。"}, {"t": 621.35, "x": "分に直すと、百四十七分。"}, {"t": 623.85, "x": "設計で見こんでいた最大の百五十分の、三分手前でした。"}, {"t": 628.2333333333333, "x": "降り始めたばかりのころ、カメラに"}, {"t": 630.6333333333333, "x": "映っていたのは、もやだけでした。"}, {"t": 632.85, "x": "遠くの地面は、かすんでいて見えません。"}, {"t": 635.6166666666667, "x": "ヨーロッパ宇宙機関によると、もやが晴れ始めたのは、"}, {"t": 639.1333333333333, "x": "高さがおよそ六十キロメートルまで下がってからです。"}, {"t": 642.5666666666667, "x": "そこでようやく、百メートルほどの大きさの"}, {"t": 645.4666666666667, "x": "地形が見分けられるようになりました。"}, {"t": 647.5833333333334, "x": "晴れ始めた、といっても、もやが"}, {"t": 650.15, "x": "消えたわけではありません。"}, {"t": 651.5666666666667, "x": "降下の画像を調べた論文によると、もやの粒の数は、"}, {"t": 655.35, "x": "高さ百五十キロメートルから地面までのあいだで、"}, {"t": 658.65, "x": "数倍ほどにしか増えていませんでした。"}, {"t": 661.15, "x": "途中に、ここから下はすっきり晴れている、という"}, {"t": 664.65, "x": "層は、見つかりませんでした。"}, {"t": 666.7166666666667, "x": "もやは、地面の近くまで、"}, {"t": 668.7166666666667, "x": "ずっと続いていたことになります。"}, {"t": 670.9666666666667, "x": "降り始めてから十分ほどのころ、"}, {"t": 672.9666666666667, "x": "高さおよそ百二十キロメートルの"}, {"t": 675.4, "x": "あたりで、強い風が吹いていました。"}, {"t": 677.8666666666667, "x": "風の速さは、秒速およそ百二十メートル。"}, {"t": 681.2333333333333, "x": "時速にすると、およそ四百三十キロメートルです。"}, {"t": 684.9, "x": "風は、ほとんどの高さで、西から東へ、"}, {"t": 688.2666666666667, "x": "タイタンが回るのと同じ向きに吹いていました。"}, {"t": 691.25, "x": "地面に近づくにつれて、風は弱くなっていきました。"}, {"t": 694.85, "x": "パラシュートにつるされた機体は、"}, {"t": 696.65, "x": "この風に流されながら降りていきました。"}, {"t": 699.4166666666666, "x": "この風の数字には、事情があります。"}, {"t": 702.15, "x": "風を測る仕組みは、二つの電波のうち、"}, {"t": 705.1, "x": "チャンネルAのほうにだけ組みこまれていました。"}, {"t": 708.0, "x": "ホイヘンスがチャンネルAで送る電波を、"}, {"t": 710.25, "x": "カッシーニが受け取り、その周波数の"}, {"t": 713.0333333333333, "x": "ずれから、探査機が風にどれだけ"}, {"t": 715.2666666666667, "x": "流されたかを割り出す、という仕組みです。"}, {"t": 718.0, "x": "ところが、カッシーニ側のチャンネルAの"}, {"t": 720.5333333333333, "x": "受信機は、一度もホイヘンスの"}, {"t": 722.75, "x": "電波をつかむことができませんでした。"}, {"t": 724.8666666666667, "x": "ヨーロッパ宇宙機関の説明では、受信に"}, {"t": 727.7333333333333, "x": "必要な設定が、中継のための手順に正しく"}, {"t": 730.95, "x": "組みこまれていなかった、とされています。"}, {"t": 733.5, "x": "その結果、チャンネルAで送られた記録は、"}, {"t": 736.4333333333333, "x": "風の測定も、探査機の状態を知らせる記録も"}, {"t": 740.1833333333333, "x": "含めて、すべて失われました。"}, {"t": 742.4833333333333, "x": "失われたのは、風の記録だけではありませんでした。"}, {"t": 746.05, "x": "カメラの画像の一部も、チャンネルAのほうに"}, {"t": 748.9666666666667, "x": "乗っていたとされています。"}, {"t": 750.35, "x": "どれだけの枚数が失われたのかは、"}, {"t": 752.5, "x": "資料によって、三百枚とも、三百五十枚とも"}, {"t": 756.6833333333333, "x": "書かれていて、数え方がそろっていません。"}, {"t": 759.4166666666666, "x": "それでも、風の数字は残りました。"}, {"t": 762.1166666666667, "x": "チャンネルAの電波は、カッシーニには"}, {"t": 764.5666666666667, "x": "受け取られませんでしたが、宇宙には出ていました。"}, {"t": 767.65, "x": "地球では、アメリカのグリーンバンクと、"}, {"t": 769.45, "x": "グリーンバンク█"}, {"t": 770.6166666666667, "x": "オーストラリアのパークスをはじめ、各地の"}, {"t": 772.5, "x": "パークス█"}, {"t": 774.2833333333333, "x": "大きな電波望遠鏡が、およそ六十七分遅れで"}, {"t": 778.3666666666667, "x": "届くその電波に、耳をすませていました。"}, {"t": 781.6833333333333, "x": "地上の望遠鏡がとらえた周波数のずれを、全部"}, {"t": 785.1666666666666, "x": "合わせて調べると、その精度は、カッシーニで"}, {"t": 788.4166666666666, "x": "測るはずだったものと、ほぼ同じくらいになりました。"}, {"t": 791.7166666666667, "x": "風の数字は、地球の側から取り戻されたことになります。"}, {"t": 795.7, "x": "一方で、チャンネルBは、カッシーニに"}, {"t": 798.6333333333333, "x": "きちんと受け取られていました。"}, {"t": 800.25, "x": "二つの電波に分けるという備えは、チャンネルBが、"}, {"t": 803.6, "x": "ほかの多くの記録を運んだことで、役に立ちました。"}, {"t": 807.45, "x": "降下のあいだに、カメラは地面を撮り続けていました。"}, {"t": 811.0, "x": "高さ十六・二キロメートルから撮った一枚は、一つの点が、"}, {"t": 815.1, "x": "およそ四十メートル四方にあたる細かさでした。"}, {"t": 818.3166666666667, "x": "そこには、短く太い溝のような筋が、何本も、"}, {"t": 822.2166666666667, "x": "一本の境目へ向かって流れこむように写っていました。"}, {"t": 825.8666666666667, "x": "境目の形は、海岸線のように見えました。"}, {"t": 829.2666666666667, "x": "明るい土地と暗い土地 の空気には、メタンが四・五パーセント"}, {"t": 1060.2, "x": "含まれていたことも分かりました。"}, {"t": 1062.0, "x": "降下の画像を調べた論文は、"}, {"t": 1063.9333333333334, "x": "地面の光の返し方について、太陽系のほかの"}, {"t": 1067.7166666666667, "x": "どの天体とも似ていない、と書いています。"}, {"t": 1070.4, "x": "目に見える光では赤みを帯びていて、"}, {"t": 1072.7, "x": "有機物のようなものがあることと合う。"}, {"t": 1075.25, "x": "水の氷らしい吸収も見える。"}, {"t": 1077.4333333333334, "x": "けれども、赤外線に近いところでは、"}, {"t": 1080.1, "x": "正体の分からない何かの特徴が出ている。"}, {"t": 1083.0833333333333, "x": "その何かが何なのかは、書かれていません。"}, {"t": 1086.05, "x": "水の氷についても、別の論文では、証拠は"}, {"t": 1089.6666666666667, "x": "はっきりしないとされていて、見方が分かれています。"}, {"t": 1092.95, "x": "では、地面の中に、液体のメタンはあったのでしょうか。"}, {"t": 1096.9666666666667, "x": "この測定を調べた論文の答えは、慎重です。"}, {"t": 1100.5, "x": "液体のメタンがあるという証拠は、見つからなかった。"}, {"t": 1103.9333333333334, "x": "けれども、数センチ下の土が"}, {"t": 1106.0666666666666, "x": "湿っている可能性は、否定できない。"}, {"t": 1108.6333333333334, "x": "別の装置は、においをかぐように、"}, {"t": 1111.0666666666666, "x": "まわりの空気を吸いこんで調べていました。"}, {"t": 1113.9, "x": "この装置の吸いこみ口は、中に入ったものが"}, {"t": 1117.0166666666667, "x": "固まらないように、温められていました。"}, {"t": 1119.7833333333333, "x": "着陸したあと、その温かい吸いこみ口が、"}, {"t": 1122.9333333333334, "x": "すぐ下の地面を温めました。"}, {"t": 1125.2, "x": "すると、地面から、メタンが蒸発してきました。"}, {"t": 1128.8166666666666, "x": "ほかにも、エタン、アセチレン、シアン、二酸化炭素が、"}, {"t": 1133.5, "x": "少しずつ出てきたことが記録されています。"}, {"t": 1136.3, "x": "地面の上で測った成分の割合は、"}, {"t": 1138.5833333333333, "x": "しばらく一定に保たれたあと、記録の終わりに"}, {"t": 1142.0, "x": "向けて、ゆっくりと下がっていきました。"}, {"t": 1144.4333333333334, "x": "メタンでも、同じような下がり方が見られました。"}, {"t": 1147.6833333333334, "x": "なぜ下がったのかについて、この論文は、"}, {"t": 1150.45, "x": "その時点では説明がついていない、と書いています。"}, {"t": 1154.15, "x": "地面は、乾いて見えました。"}, {"t": 1156.3666666666666, "x": "けれども、温めると、メタンが出てきました。"}, {"t": 1159.7666666666667, "x": "地面のすぐ上のメタンの湿り気は、"}, {"t": 1161.8666666666666, "x": "五十パーセントだったとされています。"}, {"t": 1164.3166666666666, "x": "その温度で空気が含むことのできるメタンの、"}, {"t": 1166.9833333333333, "x": "半分ほどが、実際に含まれていた、ということです。"}, {"t": 1171.2666666666667, "x": "設計の上での約束は、地面の上で、少なくとも三分でした。"}, {"t": 1176.05, "x": "ホイヘンスは、およそ七十二分、"}, {"t": 1177.8666666666666, "x": "七十二分█"}, {"t": 1178.6833333333334, "x": "地面の上から記録を送り続けました。"}, {"t": 1181.85, "x": "七十二分は、三分の、二十四倍です。"}, {"t": 1185.55, "x": "終わりは、ホイヘンスが"}, {"t": 1187.1833333333334, "x": "止まったからではありませんでした。"}, {"t": 1189.0333333333333, "x": "上空のカッシーニが、地平線の"}, {"t": 1191.3833333333334, "x": "向こうへ去っていったからです。"}, {"t": 1192.9666666666667, "x": "中継役がいなくなり、送られてくる"}, {"t": 1195.5666666666666, "x": "記録は、そこで途切れました。"}, {"t": 1197.6333333333334, "x": "カメラは、降りる前から数えて、"}, {"t": 1200.0, "x": "およそ四時間動いていたとされています。"}, {"t": 1202.7, "x": "地球の電波望遠鏡は、そのあとも、"}, {"t": 1205.4166666666667, "x": "ホイヘンスの電波を聞いていました。"}, {"t": 1207.7666666666667, "x": "オーストラリアのパークスで受信にあたった"}, {"t": 1209.9333333333334, "x": "人は、電池が切れると思っていたのに、"}, {"t": 1212.4666666666667, "x": "ずっと続いた、と語っています。"}, {"t": 1215.0333333333333, "x": "最後の電波が、いつ、どのように途切れたのかに"}, {"t": 1218.6333333333334, "x": "ついて、ここでは細かい時刻を扱いません。"}, {"t": 1221.7333333333333, "x": "一次の資料で確かめることができなかったからです。"}, {"t": 1224.8333333333333, "x": "ヨーロッパ宇宙機関は、この着陸を、"}, {"t": 1227.5666666666666, "x": "人の作った探査機が、地球から最も遠くに"}, {"t": 1231.0333333333333, "x": "着陸したもの、と記録しています。"}, {"t": 1233.4833333333333, "x": "地面の上の七十二分は、そのまま、"}, {"t": 1236.2, "x": "タイタンの地面について人間が持っている、"}, {"t": 1238.9833333333333, "x": "ただ一つの直接の記録になりました。"}, {"t": 1241.7, "x": "その記録の中で、カメラが見ていたのは、"}, {"t": 1244.4666666666667, "x": "ずっと同じ方向でした。"}, {"t": 1246.4, "x": "十五センチの小石と、四センチの小石と、"}, {"t": 1249.4333333333334, "x": "その向こうに続く、乾いた地面です。"}, {"t": 1252.5333333333333, "x": "ホイヘンスを降ろしたあとも、カッシーニは、"}, {"t": 1255.1833333333334, "x": "土星のまわりを回り続けました。"}, {"t": 1257.5666666666666, "x": "タイタンのそばを狙って通り過ぎた"}, {"t": 1259.5166666666667, "x": "回数は、百回を超えています。"}, {"t": 1261.8833333333334, "x": "カッシーニには、もやの下を見る方法がありました。"}, {"t": 1265.3, "x": "レーダーです。"}, {"t": 1265.3, "x": "レーダー█"}, {"t": 1266.6166666666666, "x": "レーダーは、電波を地面に向けて出し、"}, {"t": 1269.2166666666667, "x": "はね返ってくる電波の強さを測ります。"}, {"t": 1272.0666666666666, "x": "表面がでこぼこしていれば、電波は"}, {"t": 1274.5833333333333, "x": "あちこちに散って、強く返ってきます。"}, {"t": 1277.2, "x": "表面がなめらかなら、電波は向こうへ"}, {"t": 1279.8333333333333, "x": "抜けてしまい、ほとんど返ってきません。"}, {"t": 1282.3666666666666, "x": "返ってきた強さを並べると、"}, {"t": 1284.1833333333334, "x": "白と黒の地図のようなものになります。"}, {"t": 1286.8666666666666, "x": "それは写真に似ていますが、"}, {"t": 1288.5166666666667, "x": "光で撮ったものではありません。"}, {"t": 1290.7, "x": "電波の返りを、並べたものです。"}, {"t": 1293.2, "x": "二〇〇六年七月二十一日。"}, {"t": 1293.2, "x": "二〇〇六年七月二十一日█"}, {"t": 1295.5833333333333, "x": "カッシーニのレーダーは、タイタンの北極の"}, {"t": 1298.2833333333333, "x": "近くで、真っ黒な場所をいくつも見つけました。"}, {"t": 1301.35, "x": "周りから水路のような筋が流れこみ、"}, {"t": 1303.7333333333333, "x": "縁どりのある、湖のような形をしていました。"}, {"t": 1307.4666666666667, "x": "電波がほとんど返ってこないほど、なめらかな表面。"}, {"t": 1310.9833333333333, "x": "アメリカ航空宇宙局は、これを、炭化水素の"}, {"t": 1314.6166666666666, "x": "湖がある、とても強い証拠だと発表しました。"}, {"t": 1318.1166666666666, "x": "タイタンの寒さでは、水は液体でいられないので、"}, {"t": 1321.3833333333334, "x": "中身はメタンか、エタンだと考えられました。"}, {"t": 1324.8833333333334, "x": "地球のほかに、湖があると分かっている天体は、"}, {"t": 1328.2833333333333, "x": "このとき、タイタンだけになりました。"}, {"t": 1331.0833333333333, "x": "二〇〇八年には、その湖と海に、どれだけの"}, {"t": 1331.0833333333333, "x": "二〇〇八年█"}, {"t": 1335.1, "x": "液体があるかの見積もりが出ました。"}, {"t": 1337.3166666666666, "x": "地球で知られている石油と天然ガスの埋蔵量の、数百倍。"}, {"t": 1341.7166666666667, "x": "この時点で、レーダーで地図にできていたのは、"}, {"t": 1344.6, "x": "タイタンの表面の、およそ五分の一だけでした。"}, {"t": 1348.25, "x": "数十の湖は、一つだけで、地球の"}, {"t": 1351.4333333333334, "x": "石油と天然ガスの埋蔵量を上回る液体を"}, {"t": 1354.4666666666667, "x": "たたえている、とも発表されています。"}, {"t": 1357.0, "x": "そのころ、南極のあたりは一度しか観測されておらず、"}, {"t": 1360.7833333333333, "x": "見えていた湖は、小さなものが二つだけでした。"}, {"t": 1364.5, "x": "けれども、なめらかに見えるだけでは、"}, {"t": 1366.9333333333334, "x": "本当に液体なのかは分かりません。"}, {"t": 1369.4833333333333, "x": "乾いた、なめらかな平地かもしれないからです。"}, {"t": 1372.7333333333333, "x": "それを確かめたのは、一つの光でした。"}, {"t": 1375.6166666666666, "x": "二〇〇九年七月八日。"}, {"t": 1375.6166666666666, "x": "二〇〇九年七月八日█"}, {"t": 1377.5, "x": "カッシーニの別の装置が、およそ二十万キロメートル"}, {"t": 1381.0166666666667, "x": "離れたところから、タイタンの北の .75, "x": "二〇一四年八月二十一日█"}, {"t": 1489.2333333333333, "x": "沿って二百キロメートルほどの線の上で、"}, {"t": 1491.5833333333333, "x": "深さは二十メートルから三十五メートル。"}, {"t": 1494.4, "x": "けれども、海の真ん中のほうでは、"}, {"t": 1496.7666666666667, "x": "電波が底から返ってきませんでした。"}, {"t": 1499.3666666666666, "x": "底が深すぎて、電波が届かなかったと考えられています。"}, {"t": 1503.3833333333334, "x": "その深さは、百メートル以上、場合によっては"}, {"t": 1506.8333333333333, "x": "三百メートルを超えるかもしれない、と報じられています。"}, {"t": 1510.4833333333333, "x": "リゲイア海では、奇妙なものも見つかりました。"}, {"t": 1513.65, "x": "二〇一三年の七月、それまで何もなかった海の上に、"}, {"t": 1517.6666666666667, "x": "明るく光る部分が、レーダーの地図に現れました。"}, {"t": 1521.4333333333334, "x": "二〇一四年八月にも、まだ見えていました。"}, {"t": 1524.7, "x": "広さは、およそ七十五平方キロメートルから、"}, {"t": 1527.9666666666667, "x": "百六十平方キロメートルへと、倍ほどに広がっていました。"}, {"t": 1532.4166666666667, "x": "それが何なのかは、分かっていません。"}, {"t": 1535.0, "x": "アメリカ航空宇宙局は、波、立ちのぼる泡、浮かんでいる"}, {"t": 1539.55, "x": "固まり、水面のすぐ下に漂う固まり、あるいは、"}, {"t": 1543.45, "x": "もっと思いがけないもの、と候補を並べています。"}, {"t": 1546.95, "x": "北の半球に夏が近づく、季節の変わり目と"}, {"t": 1550.15, "x": "関係があるのかもしれない、とも書いています。"}, {"t": 1553.1, "x": "海の広さを全部合わせると、タイタンの表面のうち、"}, {"t": 1556.7166666666667, "x": "百六十万平方キロメートル以上、およそ二パーセントが、"}, {"t": 1561.1, "x": "液体に覆われていると報告されています。"}, {"t": 1564.0166666666667, "x": "液体は、地面の上だけにあるのではありません。"}, {"t": 1567.2166666666667, "x": "カッシーニの測定から、タイタンの氷の地面の、"}, {"t": 1570.4666666666667, "x": "五十五キロメートルから八十キロメートルほど下に、"}, {"t": 1573.8833333333334, "x": "水とアンモニアの海が隠れていると考えられています。"}, {"t": 1577.4166666666667, "x": "こちらも、写真は一枚もありません。"}, {"t": 1580.1166666666666, "x": "深さも、中身も、広さも、測られました。"}, {"t": 1583.9166666666667, "x": "明るい部分が、現れたことも分かりました。"}, {"t": 1587.0166666666667, "x": "それでも、ここまでの記録の中に、"}, {"t": 1589.5, "x": "海を撮った写真は一枚もありません。"}, {"t": 1592.15, "x": "どれも、電波の返りか、赤外線の反射で測ったものです。"}, {"t": 1596.6333333333334, "x": "波が立っていたのかどうかも、泡だったのか"}, {"t": 1599.4, "x": "どうかも、岸から見た者はいません。"}, {"t": 1601.8333333333333, "x": "その海へ、船を降ろそうとした計画がありました。"}, {"t": 1605.2, "x": "名前は、タイタン・マーレ・エクスプローラー。"}, {"t": 1605.6833333333334, "x": "タイタン・マーレ・エクスプローラー█"}, {"t": 1607.883 : "次の探査機は、海ではなく、"}, {"t": 1826.7666666666667, "x": "砂の上に降りることになっています。"}, {"t": 1829.25, "x": "タイタンの海を、岸から撮った写真。"}, {"t": 1831.8, "x": "それは、いまも一枚も存在せず、撮りに行く"}, {"t": 1835.2666666666667, "x": "計画も、いまのところ公表されていません。"}, {"t": 1838.1833333333334, "x": "ホイヘンスは、いまも、あの川原にあるはずです。"}, {"t": 1841.6666666666667, "x": "着いたときにくぼみを作り、少し滑って、"}, {"t": 1844.5833333333333, "x": "十度傾いて止まった、その場所です。"}, {"t": 1847.6166666666666, "x": "着陸したあと、その姿を確かめた者はいません。"}, {"t": 1851.2166666666667, "x": "上から撮ることも、もやの下にあるので、できていません。"}, {"t": 1855.1833333333334, "x": "もやは、いまもその上を覆っています。"}, {"t": 1857.8333333333333, "x": "タイタンの一年は、地球の二十九年です。"}, {"t": 1861.05, "x": "ホイヘンスが降りた二〇〇五年から、"}, {"t": 1863.0333333333333, "x": "地球ではおよそ二十一年がたちました。"}, {"t": 1865.85, "x": "タイタンでは、まだ一年がたっていません。"}, {"t": 1868.6333333333334, "x": "そのあいだに、タイタンは、"}, {"t": 1870.4333333333334, "x": "土星のまわりを五百回近く回りました。"}, {"t": 1873.3833333333334, "x": "季節も、移り変わっています。"}, {"t": 1875.65, "x": "この長い一年のあいだに、あの川原に雨が降ったのか、"}, {"t": 1879.3, "x": "流れが来たのか、それとも乾いたままなのか。"}, {"t": 1882.6833333333334, "x": "記録はありません。"}, {"t": 1883.9, "x": "ホイヘンスの電池は、とうに尽きていると考えられます。"}, {"t": 1887.4666666666667, "x": "送られてくるものは、もうありません。"}, {"t": 1889.9833333333333, "x": "あの小石の根元を削ったものが"}, {"t": 1891.9, "x": "何だったのかも、確かめた者はいません。"}, {"t": 1894.65, "x": "地球では、ホイヘンスが送ってきた写真が、"}, {"t": 1897.5833333333333, "x": "いまもそのまま残っています。"}, {"t": 1899.65, "x": "海については、電波の返りと、赤外線の"}, {"t": 1903.0833333333333, "x": "きらめきと、深さの数字があります。"}, {"t": 1905.5833333333333, "x": "地面については、一つの方向から撮った、"}, {"t": 1908.4833333333333, "x": "乾いた川原の写真があります。"}, {"t": 1910.75, "x": "岸から海を見た写真は、まだありません。"}, {"t": 1913.6333333333334, "x": "十五センチの小石と、四センチの小石。"}, {"t": 1916.7333333333333, "x": "八十五センチ先。"}, {"t": 1918.2333333333333, "x": "削られた根元。"}, {"t": 1919.45, "x": "タイタンの地面について、人間が"}, {"t": 1921.8666666666666, "x": "持っている写真は、それだけです。"}], "w": 720, "h": 405, "n_cuts": 711, "noimage": false};
const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
