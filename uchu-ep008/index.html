<script>
const D={"name": "ep008", "file": "ep008", "dur": 1814.0333125, "segs": [], "subs": [{"t": 0.0, "x": "土星の衛星タイタンの地面を写した一枚の"}, {"t": 0.7333333333333333, "x": "タイタン█"}, {"t": 2.6333333333333333, "x": "写真に、小石が二つ写っています。"}, {"t": 5.133333333333334, "x": "左の一つは、差し渡しおよそ十五センチ。"}, {"t": 8.316666666666666, "x": "そのとなりのもう一つは、およそ四センチ。"}, {"t": 11.183333333333334, "x": "どちらも、写した機械からおよそ八十五センチ先に"}, {"t": 14.5, "x": "転がっていました。"}, {"t": 15.5, "x": "表面は、水の氷と、炭化水素の"}, {"t": 18.516666666666666, "x": "氷が混ざったものと考えられています。"}, {"t": 20.766666666666666, "x": "根元には、何かに削られたような跡がありました。"}, {"t": 24.033333333333335, "x": "写したのは、ホイヘンスという着陸機です。"}, {"t": 24.883333333333333, "x": "ホイヘンス█"}, {"t": 26.866666666666667, "x": "日付は、二〇〇五年一月十四日。"}, {"t": 27.583333333333332, "x": "二〇〇五年一月十四日█"}, {"t": 29.533333333333335, "x": "人間の作った機械が、太陽系の外側の天体で"}, {"t": 33.03333333333333, "x": "地面に降りたのは、この一回だけです。"}, {"t": 35.55, "x": "そして、いまも、この一回だけです。"}, {"t": 38.416666666666664, "x": "タイタンには、液体の海があります。"}, {"t": 40.88333333333333, "x": "水ではありません。"}, {"t": 42.03333333333333, "x": "メタンとエタンの海です。"}, {"t": 43.483333333333334, "x": "液体に覆われた広さを合わせると、表面の"}, {"t": 46.55, "x": "およそ二パーセントになると報告されています。"}, {"t": 49.03333333333333, "x": "深いところでは、百六十メートル。"}, {"t": 51.583333333333336, "x": "こうした数字は、あとから別の探査機が、"}, {"t": 54.233333333333334, "x": "電波と赤外線を使って測りました。"}, {"t": 56.9, "x": "けれども、その海を、岸に立って"}, {"t": 59.35, "x": "撮った写真は、一枚もありません。"}, {"t": 61.666666666666664, "x": "海の上に浮かんで撮った写真もありません。"}, {"t": 64.06666666666666, "x": "ホイヘンスが降りた場所は、海ではありませんでした。"}, {"t": 67.21666666666667, "x": "乾いた川原でした。"}, {"t": 68.5, "x": "しかも、タイタンに液体の海があると確かめられたのは、"}, {"t": 71.85, "x": "ホイヘンスが降りた、あとのことです。"}, {"t": 74.48333333333333, "x": "降りた機械は、海のことを知らないまま、"}, {"t": 77.01666666666667, "x": "海のない場所に着きました。"}, {"t": 78.88333333333334, "x": "タイタンの地面から撮った写真は、"}, {"t": 80.76666666666667, "x": "ホイヘンスが送ってきたものだけです。"}, {"t": 83.13333333333334, "x": "着いたあとの写真は、動くことのできない"}, {"t": 85.68333333333334, "x": "機械が、一つの方向を見たまま撮ったものです。"}, {"t": 88.73333333333333, "x": "この回では、その一か所に残された記録を、"}, {"t": 91.61666666666666, "x": "降りる前から順に読んでいきます。"}, {"t": 93.8, "x": "何が撮れて、何が撮れなかったのか。"}, {"t": 96.36666666666666, "x": "そして、撮れなかったものについて、"}, {"t": 98.63333333333334, "x": "いまどこまで分かっているのかを。"}, {"t": 100.68333333333334, "x": "記録は、写真と、数字と、途切れた電波でできています。"}, {"t": 105.0, "x": "タイタンが見つかったのは、一六五五年三月二十五日です。"}, {"t": 107.11666666666666, "x": "一六五五年三月二十五日█"}, {"t": 109.4, "x": "見つけたのは、オランダのクリスティアーン・ホイヘンス。"}, {"t": 110.75, "x": "クリスティアーン・ホイヘンス█"}, {"t": 112.45, "x": "三百五十年後にこの衛星へ降りる着陸機は、"}, {"t": 115.5, "x": "この人の名前をもらっています。"}, {"t": 117.6, "x": "タイタンは、土星のまわりを回る"}, {"t": 119.78333333333333, "x": "衛星のなかで、いちばん大きな天体です。"}, {"t": 122.65, "x": "半径は、およそ二千五百七十五キロメートル。"}, {"t": 125.98333333333333, "x": "地球の月より、幅がおよそ半分広い大きさです。"}, {"t": 129.53333333333333, "x": "直径だけで比べると、惑星の"}, {"t": 131.81666666666666, "x": "水星よりも大きいとされています。"}, {"t": 133.83333333333334, "x": "土星からは、およそ百二十万キロメートル"}, {"t": 136.63333333333333, "x": "離れたところを回っています。"}, {"t": 138.26666666666668, "x": "一周にかかるのは、十五日と二十二時間。"}, {"t": 141.31666666666666, "x": "土星そのものが太陽のまわりを一周するのに、"}, {"t": 144.0, "x": "地球の時間でおよそ二十九年かかるので、"}, {"t": 146.93333333333334, "x": "タイタンの一年も二十九年です。"}, {"t": 149.31666666666666, "x": "季節の一つが、七年より長く続きます。"}, {"t": 152.33333333333334, "x": "見つかってから三百年あまりのあいだ、"}, {"t": 154.43333333333334, "x": "タイタンは、望遠鏡のなかの小さな光の点でした。"}, {"t": 158.3, "x": "表面がどうなっているのかを、"}, {"t": 159.93333333333334, "x": "確かめる方法はありませんでした。"}, {"t": 162.23333333333332, "x": "その機会が来たのは、一九八〇年十一月十二日です。"}, {"t": 164.03333333333333, "x": "一九八〇年十一月十二日█"}, {"t": 166.56666666666666, "x": "探査機ボイジャー一号が、土星のそばを通り過ぎました。"}, {"t": 166.98333333333332, "x": "ボイジャー一号█"}, {"t": 170.15, "x": "土星にいちばん近づいたのは、"}, {"t": 171.83333333333334, "x": "協定世界時の二十三時四十六分。"}, {"t": 174.63333333333333, "x": "土星から、およそ十二万六千キロメートルのところでした。"}, {"t": 178.38333333333333, "x": "ボイジャー一号は、このときタイタンを"}, {"t": 180.73333333333332, "x": "よく見るための道筋を選んでいました。"}, {"t": 182.96666666666667, "x": "そのために、土星を過ぎたあとの行き先が決まりました。"}, {"t": 186.4, "x": "探査機は、惑星がほぼ同じ面に並んでいる、"}, {"t": 189.41666666666666, "x": "その面の北側へ抜けていきます。"}, {"t": 191.68333333333334, "x": "天王星や海王星へ向かう道は、とれなくなりました。"}, {"t": 195.31666666666666, "x": "ほかの惑星へ行く機会と引きかえに、タイタンを"}, {"t": 198.31666666666666, "x": "間近から見る道を選んだことになります。"}, {"t": 200.7, "x": "ボイジャー一号にとって、タイタンは、"}, {"t": 203.05, "x": "行き先を減らしてまで見ておくべき場所でした。"}, {"t": 205.93333333333334, "x": "そのかわり、この探査機が天王星と"}, {"t": 208.46666666666667, "x": "海王星を見ることは、ありませんでした。"}, {"t": 211.15, "x": "そうして近づいて、分かったことがあります。"}, {"t": 213.88333333333333, "x": "タイタンには、厚い大気がありました。"}, {"t": 216.36666666666667, "x": "そして、その大気が、表面をすっかり隠していました。"}, {"t": 220.23333333333332, "x": "探査機の目に映ったのは、もやに包まれた球でした。"}, {"t": 223.53333333333333, "x": "地面は、どこにも見えませんでした。"}, {"t": 225.95, "x": "アメリカ航空宇宙局の記録は、この大気を、"}, {"t": 229.05, "x": "表面を完全に隠す、厚い大気、と書いています。"}, {"t": 233.28333333333333, "x": "窒素を主にして、メタンなどの炭化水素を含んでいました。"}, {"t": 237.01666666666668, "x": "ほかの惑星をあきらめて近づいた先で、"}, {"t": 239.41666666666666, "x": "見えたのは、中身ではなく、覆いのほうでした。"}, {"t": 243.1, "x": "大気は、およそ九十五パーセントが窒素で、"}, {"t": 245.98333333333332, "x": "残りのおよそ五パーセントがメタンです。"}, {"t": 248.41666666666666, "x": "高さは、六百キロメートル近くまで広がっています。"}, {"t": 251.81666666666666, "x": "地面の上の気圧は、地球より"}, {"t": 254.01666666666668, "x": "およそ六割高いとされています。"}, {"t": 255.91666666666666, "x": "太陽の光も、ここまで来ると弱くなります。"}, {"t": 259.01666666666665, "x": "光がタイタンに届くまでに、およそ八十分。"}, {"t": 262.1333333333333, "x": "明るさは、地球で見る太陽の、およそ百分の一です。"}, {"t": 266.23333333333335, "x": "地面の上に立ったとしても、"}, {"t": 267.71666666666664, "x": "弱い光が、もやを通って届くだけです。"}, {"t": 270.81666666666666, "x": "見えないなかで、一つの推理がありました。"}, {"t": 273.53333333333336, "x": "メタンは、大気の上のほうで太陽の光に当たると、"}, {"t": 276.8333333333333, "x": "少しずつ壊れて、ほかの炭化水素に変わっていきます。"}, {"t": 280.6, "x": "変わったものは、元のメタンには戻りません。"}, {"t": 283.3833333333333, "x": "それでも、大気にはメタンが残っています。"}, {"t": 286.1333333333333, "x": "ということは、どこかにメタンをためておく場所があり、"}, {"t": 289.21666666666664, "x": "そこから補われているはずだ、という考え方です。"}, {"t": 292.81666666666666, "x": "これは、見た結果ではありません。"}, {"t": 295.0, "x": "計算から出てきた考えです。"}, {"t": 296.85, "x": "海があるかもしれない、という"}, {"t": 298.7, "x": "話は、見る前から始まっていました。"}, {"t": 301.25, "x": "ホイヘンスの記録をまとめた論文は、"}, {"t": 303.3833333333333, "x": "その冒頭で、この点をこう書いています。"}, {"t": 306.4, "x": "メタンが上空で壊れ続けている以上、地表か"}, {"t": 309.48333333333335, "x": "地下に、メタンのたまり場があるはずだ。"}, {"t": 311.78333333333336, "x": "けれども、周回する探査機のカメラには、世界全体を"}, {"t": 315.7, "x": "覆うような大きなたまり場は見えていない。"}, {"t": 317.8333333333333, "x": "見えないのは、大気が邪魔をしているからでした。"}, {"t": 320.73333333333335, "x": "メタンと、もやそのものが、"}, {"t": 322.5833333333333, "x": "上からの視線をさえぎっていました。"}, {"t": 324.93333333333334, "x": "上から見ても、分からない。"}, {"t": 326.81666666666666, "x": "けれども、分からないなりに、"}, {"t": 328.68333333333334, "x": "数字だけはそろっていきました。"}, {"t": 330.7, "x": "大きさ、大気の成分、地面の上の気圧。"}, {"t": 334.15, "x": "足りないのは、地面そのものの姿でした。"}, {"t": 336.9166666666667, "x": "外から見て分からないなら、中に入るしかありません。"}, {"t": 340.28333333333336, "x": "もやの下へ降りて、地面を自分の目で見る。"}, {"t": 343.2, "x": "そのための機械が作られることになりました。"}, {"t": 345.75, "x": "それも、一度きりです。"}, {"t": 347.56666666666666, "x": "降りた機械を、持ち帰る方法はありません。"}, {"t": 350.3833333333333, "x": "一九九七年十月十五日、協定世界時の八時四十三分。"}, {"t": 350.3833333333333, "x": "一九九七年十月十五日█"}, {"t": 355.55, "x": "土星へ向かう探査機が打ち上げられました。"}, {"t": 357.93333333333334, "x": "アメリカ航空宇宙局の周回機カッシーニと、"}, {"t": 359.8, "x": "カッシーニ█"}, {"t": 360.71666666666664, "x": "ヨーロッパ宇宙機関の着陸機ホイヘンス。"}, {"t": 363.55, "x": "二つを合わせた重さは、およそ五・六トンでした。"}, {"t": 366.95, "x": "ヨーロッパ宇宙機関によると、この重さは、"}, {"t": 369.71666666666664, "x": "土星へまっすぐ向かわせるには重すぎました。"}, {"t": 372.5, "x": "そのため、探査機は、ほかの"}, {"t": 374.71666666666664, "x": "惑星のそばを通るたびに、その重力を借りて"}, {"t": 377.6666666666667, "x": "速さを上げながら、遠回りで進みました。"}, {"t": 380.45, "x": "ホイヘンスは、そのうちの三百十八キログラムです。"}, {"t": 383.85, "x": "幅は、およそ二・七メートル。"}, {"t": 386.15, "x": "カッシーニに取りつけられたまま、"}, {"t": 387.8333333333333, "x": "土星まで運ばれていきました。"}, {"t": 389.8833333333333, "x": "二つが土星に着いたのは、二〇〇四年です。"}, {"t": 392.78333333333336, "x": "打ち上げから、およそ七年がたっていました。"}, {"t": 395.6166666666667, "x": "ホイヘンスの本番は、ここからです。"}, {"t": 398.0833333333333, "x": "二〇〇四年十二月二十五日、協定世界時の二時。"}, {"t": 398.0833333333333, "x": "二〇〇四年十二月二十五日█"}, {"t": 401.8333333333333, "x": "ホイヘンスは、カッシーニから切り離されました。"}, {"t": 404.78333333333336, "x": "ヨーロッパ宇宙機関は、そのときの発表で、"}, {"t": 407.68333333333334, "x": "七年いっしょに暮らしたあとの、"}, {"t": 409.7, "x": "円満な別れだった、と書いています。"}, {"t": 412.5, "x": "切り離されたホイヘンスは、そのまま眠りにつきました。"}, {"t": 415.9166666666667, "x": "タイタンまでの、およそ二十日間。"}, {"t": 418.1166666666667, "x": "電源をほとんど使わず、ただ慣性で進んでいきます。"}, {"t": 421.68333333333334, "x": "目を覚ますのは、大気に入る直前です。"}, {"t": 424.51666666666665, "x": "大気に入る予定の時刻は、二〇〇五年一月十四日の、"}, {"t": 428.31666666666666, "x": "協定世界時九時六分ごろ。"}, {"t": 430.43333333333334, "x": "その少し前に、眠っていた仕組みが動き"}, {"t": 433.1666666666667, "x": "出すように、あらかじめ決められていました。"}, {"t": 435.76666666666665, "x": "この着陸機が、どれだけ長く働けるかは、"}, {"t": 438.7, "x": "はじめから決められていました。"}, {"t": 440.6333333333333, "x": "ヨーロッパ宇宙機関の資料によると、電池を"}, {"t": 443.5, "x": "はじめとする持ち物は、降りるのにかかる"}, {"t": 445.98333333333335, "x": "時間を最大で百五十分、そして、地面に"}, {"t": 449.31666666666666, "x": "着いてから少なくとも三分動けるように、と"}, {"t": 452.0833333333333, "x": "見積もって用意されていました。"}, {"t": 453.6666666666667, "x": "地面の上で、少なくとも三分。"}, {"t": 456.03333333333336, "x": "これが、設計の上での約束でした。"}, {"t": 458.68333333333334, "x": "三分を超えて動けば、それは"}, {"t": 460.8, "x": "予定より多く働いたことになります。"}, {"t": 463.01666666666665, "x": "設計の数字の上では、仕事の大部分は、"}, {"t": 466.0, "x": "降りていくあいだに割り当てられていました。"}, {"t": 468.55, "x": "そもそも、降りた先が固い地面なのか、"}, {"t": 471.23333333333335, "x": "液体なのかも、降りるまで分かりませんでした。"}, {"t": 474.5, "x": "上から見て、それを確かめる方法がなかったからです。"}, {"t": 477.95, "x": "ホイヘンスには、六つの観測装置が積まれていました。"}, {"t": 481.4166666666667, "x": "大気の温度と気圧を測る装置。"}, {"t": 483.6166666666667, "x": "風を測る仕組み。"}, {"t": 484.9, "x": "写真を撮り、光の色を測るカメラ。"}, {"t": 487.55, "x": "空気の成分を調べる装置。"}, {"t": 489.55, "x": "もやの粒を集めて調べる装置。"}, {"t": 491.7, "x": "そして、地面に着いたときの手ごたえや、"}, {"t": 494.28333333333336, "x": "地面の性質を調べる装置です。"}, {"t": 496.7, "x": "地面の上で何分動けたとしても、そのあいだの"}, {"t": 499.6166666666667, "x": "記録を受け取って、地球へ中継するのは、"}, {"t": 502.4166666666667, "x": "上空を通り過ぎていくカッシーニの役目でした。"}, {"t": 505.45, "x": "カッシーニが空に見えているあいだだけ、話ができる。"}, {"t": 508.81666666666666, "x": "カッシーニが地平線の向こうへ"}, {"t": 510.5, "x": "去れば、話はそこで終わります。"}, {"t": 512.7833333333333, "x": "切り離しの日の発表では、地面に着いたあと動けるのは、"}, {"t": 516.3833333333333, "x": "百三十分を超えない見込みだとされていました。"}, {"t": 519.4333333333333, "x": "しかも、電波は、タイタンから地球まで、"}, {"t": 522.3833333333333, "x": "およそ六十七分かかって届きます。"}, {"t": 524.9166666666666, "x": "地球で記録を受け取るとき、そこに書かれていることは、"}, {"t": 528.3166666666667, "x": "いつも一時間以上前に起きたことでした。"}, {"t": 531.0666666666667, "x": "もう一つ、備えがありました。"}, {"t": 533.2333333333333, "x": "ホイヘンスは、同じ記録の多くを、二つの別々の"}, {"t": 536.9166666666666, "x": "電波に乗せて送るように作られていました。"}, {"t": 539.3, "x": "周波数は二千四十メガヘルツと、二千九十メガヘルツ。"}, {"t": 543.3666666666667, "x": "どちらか一方がうまくいかなくても、"}, {"t": 545.3666666666667, "x": "もう一方が残るようにするためです。"}, {"t": 547.8, "x": "この二つは、チャンネルAと"}, {"t": 548.5333333333333, "x": "チャンネルA█"}, {"t": 549.3833333333333, "x": "チャンネルB█"}, {"t": 549.6333333333333, "x": "チャンネルBと呼ばれていました。"}, {"t": 551.3166666666667, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 552.9833333333333, "x": "この計画には、十九の国が関わりました。"}, {"t": 556.4, "x": "科学者はおよそ二百六十人。"}, {"t": 558.45, "x": "技術者などを含めると、最大で一万人が"}, {"t": 561.4, "x": "関わり、準備には二十年がかかっています。"}, {"t": 564.3333333333334, "x": "そのすべてが、二時間あまりの降下と、少なくとも"}, {"t": 567.8, "x": "三分の地上のために、積み上げられていました。"}, {"t": 570.7833333333333, "x": "二〇〇五年一月十四日。"}, {"t": 570.7833333333333, "x": "二〇〇五年一月十四日█"}, {"t": 572.6166666666667, "x": "ホイヘンスは、タイタンの大気に入りました。"}, {"t": 575.4333333333333, "x": "ここから地面に着くまでに、二時間二十七分かかりました。"}, {"t": 577.25, "x": "二時間二十七分█"}, {"t": 579.2166666666667, "x": "パラシュートにつるされたまま、"}, {"t": 580.75, "x": "ゆっくりと降りていく時間です。"}, {"t": 582.7833333333333, "x": "分に直すと、百四十七分。"}, {"t": 585.1666666666666, "x": "設計で見こんでいた最大の百五十分の、三分手前でした。"}, {"t": 589.3833333333333, "x": "降り始めたばかりのころ、カメラに"}, {"t": 591.6333333333333, "x": "映っていたのは、もやだけでした。"}, {"t": 593.7166666666667, "x": "遠くの地面は、かすんでいて見えません。"}, {"t": 596.35, "x": "ヨーロッパ宇宙機関によると、もやが晴れ始めたのは、"}, {"t": 599.6666666666666, "x": "高さがおよそ六十キロメートルまで下がってからです。"}, {"t": 602.8833333333333, "x": "そこでようやく、百メートルほどの大きさの"}, {"t": 605.6666666666666, "x": "地形が見分けられるよ ": 1248.6, "x": "地球のほかに、湖があると分かっている天体は、"}, {"t": 1251.8666666666666, "x": "このとき、タイタンだけになりました。"}, {"t": 1254.55, "x": "二〇〇八年には、その湖と海に、どれだけの"}, {"t": 1254.55, "x": "二〇〇八年█"}, {"t": 1258.05, "x": "液体があるかの見積もりが出ました。"}, {"t": 1259.9833333333333, "x": "地球で知られている石油と天然ガスの埋蔵量の、数百倍。"}, {"t": 1264.15, "x": "この時点で、レーダーで地図にできていたのは、"}, {"t": 1266.8833333333334, "x": "タイタンの表面の、およそ五分の一だけでした。"}, {"t": 1270.3333333333333, "x": "数十の湖は、一つだけで、地球の"}, {"t": 1273.35, "x": "石油と天然ガスの埋蔵量を上回る液体を"}, {"t": 1276.2166666666667, "x": "たたえている、とも発表されています。"}, {"t": 1278.6166666666666, "x": "そのころ、南極のあたりは一度しか観測されておらず、"}, {"t": 1282.2333333333333, "x": "見えていた湖は、小さなものが二つだけでした。"}, {"t": 1285.7666666666667, "x": "けれども、なめらかに見えるだけでは、"}, {"t": 1288.0833333333333, "x": "本当に液体なのかは分かりません。"}, {"t": 1290.5166666666667, "x": "乾いた、なめらかな平地かもしれないからです。"}, {"t": 1293.5333333333333, "x": "それを確かめたのは、一つの光でした。"}, {"t": 1296.2833333333333, "x": "二〇〇九年七月八日。"}, {"t": 1296.2833333333333, "x": "二〇〇九年七月八日█"}, {"t": 1298.0833333333333, "x": "カッシーニの別の装置が、およそ二十万キロメートル"}, {"t": 1301.3833333333334, "x": "離れたところから、タイタンの北のほうを見ていました。"}, {"t": 1304.5333333333333, "x": "そして、ジンポ湖と呼ばれる湖の上で、太陽の光が、"}, {"t": 1305.1666666666667, "x": "ジンポ湖█"}, {"t": 1308.6333333333334, "x": "鏡のように一か所ではね返る瞬間をとらえました。"}, {"t": 1311.9833333333333, "x": "光は、目に見える色ではありません。"}, {"t": 1314.4666666666667, "x": "波長五ミクロンの、赤外線です。"}, {"t": 1317.0166666666667, "x": "タイタンの厚い大気は、目に見える光を"}, {"t": 1319.6333333333334, "x": "通しにくいのですが、この赤外線は通り抜けてきます。"}, {"t": 1323.2166666666667, "x": "鏡のような反射が起きるのは、"}, {"t": 1325.0333333333333, "x": "表面がとてもなめらかなときです。"}, {"t": 1327.3333333333333, "x": "それまで液体があると考えられていたのは、"}, {"t": 1329.7333333333333, "x": "南のオンタリオ湖でした。"}, {"t": 1330.2333333333333, "x": "オンタリオ湖█"}, {"t": 1331.55, "x": "北の湖にも液体がある。"}, {"t": 1333.1666666666667, "x": "そのことが、ひとすじの光で確かめられました。"}, {"t": 1336.2, "x": "ジンポ湖の広さは、およそ二万八百平方キロメートル。"}, {"t": 1339.9166666666667, "x": "四国より少し大きいくらいの湖です。"}, {"t": 1342.5166666666667, "x": "二〇一三年五月二十三日には、レーダーを"}, {"t": 1342.5166666666667, "x": "二〇一三年五月二十三日█"}, {"t": 1345.6333333333334, "x": "真下に向けて、海の深さが測られました。"}, {"t": 1348.45, "x": "相手は、タイタンで二番目に大きな海、リゲイア海です。"}, {"t": 1351.2666666666667, "x": "リゲイア海█"}, {"t": 1352.5166666666667, "x": "電波は、海の表面ではね返り、一部は液体の"}, {"t": 1356.15, "x": "中を通って、海の底でもう一度はね返りました。"}, {"t": 1359.45, "x": "二つの返りの時間の差から、深さが分かります。"}, {"t": 1362.6666666666667, "x": "いちばん深いところは、およそ百六十メートルでした。"}, {"t": 1364.6166666666666, "x": "百六十メートル█"}, {"t": 1366.15, "x": "電波は、液体の中でほとんど弱まりませんでした。"}, {"t": 1369.5166666666667, "x": "そのことから、中身は、ほぼ混じりけのない"}, {"t": 1372.5166666666667, "x": "メタンとエタンだと考えられています。"}, {"t": 1374.55, "x": "さらにあとの調べで、主な中身はメタンだ、と"}, {"t": 1377.8666666666666, "x": "ヨーロッパ宇宙機関は伝えています。"}, {"t": 1379.9333333333334, "x": "海の底には、空から沈んできた有機物が、"}, {"t": 1382.95, "x": "泥のように積もっていると考えられています。"}, {"t": 1385.7333333333333, "x": "海と岸の温度を比べると、ほとんど差がありませんでした。"}, {"t": 1389.3666666666666, "x": "岸の地面にも液体がしみこんでいるのかも"}, {"t": 1391.7666666666667, "x": "しれない、と考えられています。"}, {"t": 1393.8833333333334, "x": "いちばん大きな海、クラーケン海も測られました。"}, {"t": 1395.15, "x": "クラーケン海█"}, {"t": 1397.1166666666666, "x": "二〇一四年八月二十一日、東の岸に"}, {"t": 1397.1166666666666, "x": "二〇一四年八月二十一日█"}, {"t": 1400.4333333333334, "x": "沿って二百キロメートルほどの線の上で、"}, {"t": 1402.6833333333334, "x": "深さは二十メートルから三十五メートル。"}, {"t": 1405.3666666666666, "x": "けれども、海の真ん中のほうでは、"}, {"t": 1407.6, "x": "電波が底から返ってきませんでした。"}, {"t": 1410.05, "x": "底が深すぎて、電波が届かなかったと考えられています。"}, {"t": 1413.85, "x": "その深さは、百メートル以上、場合によっては"}, {"t": 1417.1333333333334, "x": "三百メートルを超えるかもしれない、と報じられています。"}, {"t": 1420.6333333333334, "x": "リゲイア海では、奇妙なものも見つかりました。"}, {"t": 1423.65, "x": "二〇一三年の七月、それまで何もなかった海の上に、"}, {"t": 1427.4666666666667, "x": "明るく光る部分が、レーダーの地図に現れました。"}, {"t": 1431.0666666666666, "x": "二〇一四年八月にも、まだ見えていました。"}, {"t": 1434.1333333333334, "x": "広さは、およそ七十五平方キロメートルから、"}, {"t": 1437.25, "x": "百六十平方キロメートルへと、倍ほどに広がっていました。"}, {"t": 1441.5, "x": "それが何なのかは、分かっていません。"}, {"t": 1443.9166666666667, "x": "アメリカ航空宇宙局は、波、立ちのぼる泡、浮かんでいる"}, {"t": 1448.2666666666667, "x": "固まり、水面のすぐ下に漂う固まり、あるいは、"}, {"t": 1451.9833333333333, "x": "もっと思いがけないもの、と候補を並べています。"}, {"t": 1455.3333333333333, "x": "北の半球に夏が近づく、季節の変わり目と"}, {"t": 1458.4333333333334, "x": "関係があるのかもしれない、とも書いています。"}, {"t": 1461.2666666666667, "x": "海の広さを全部合わせると、タイタンの表面のうち、"}, {"t": 1464.7166666666667, "x": "百六十万平方キロメートル以上、およそ二パーセントが、"}, {"t": 1468.9, "x": "液体に覆われていると報告されています。"}, {"t": 1471.6833333333334, "x": "液体は、地面の上だけにあるのではありません。"}, {"t": 1474.6833333333334, "x": "カッシーニの測定から、タイタンの氷の地面の、"}, {"t": 1477.7833333333333, "x": "五十五キロメートルから八十キロメートルほど下に、"}, {"t": 1481.0333333333333, "x": "水とアンモニアの海が隠れていると考えられています。"}, {"t": 1484.4, "x": "こちらも、写真は一枚もありません。"}, {"t": 1486.9666666666667, "x": "深さも、中身も、広さも、測られました。"}, {"t": 1490.5166666666667, "x": "明るい部分が、現れたことも分かりました。"}, {"t": 1493.5, "x": "それでも、ここまでの記録の中に、"}, {"t": 1495.9, "x": "海を撮った写真は一枚もありません。"}, {"t": 1498.45, "x": "どれも、電波の返りか、赤外線の反射で測ったものです。"}, {"t": 1502.6666666666667, "x": "波が立っていたのかどうかも、泡だったのか"}, {"t": 1505.2666666666667, "x": "どうかも、岸から見た者はいません。"}, {"t": 1507.5666666666666, "x": "その海へ、船を降ろそうとした計画がありました。"}, {"t": 1510.7833333333333, "x": "名前は、タイタン・マーレ・エクスプローラー。"}, {"t": 1511.2333333333333, "x": "タイタン・マーレ・エクスプローラー█"}, {"t": 1513.3, "x": "海に着水して、浮かんだまま調べる探査機です。"}, {"t": 1516.6666666666667, "x": "計画書の上では、行き先はリゲイア海、"}, {"t": 1519.4333333333334, "x": "予備はクラーケン海とされていました。"}, {"t": 1521.75, "x": "カメラは二台。"}, {"t": 1522.75, "x": "一台は降りていくときに、もう一台は、海の上から、"}, {"t": 1526.4333333333334, "x": "海面を撮るためのものだった、と伝えられています。"}, {"t": 1529.9166666666667, "x": "打ち上げは二〇一六年、着水は"}, {"t": 1532.4166666666667, "x": "二〇二三年ごろ、という予定だったとされています。"}, {"t": 1535.8333333333333, "x": "実現していれば、タイタンの海を、その上から"}, {"t": 1539.0666666666666, "x": "撮った、はじめての写真になるはずでした。"}, {"t": 1541.7166666666667, "x": "二〇一一年、アメリカ航空宇宙局は、"}, {"t": 1544.7, "x": "次の探査計画の候補を三つにしぼり、"}, {"t": 1547.45, "x": "それぞれに準備のための資金を出しました。"}, {"t": 1550.1833333333334, "x": "そのうちの一つが、この船の計画でした。"}, {"t": 1553.1333333333334, "x": "二〇一二年八月二十日。"}, {"t": 1553.1333333333334, "x": "二〇一二年八月二十日█"}, {"t": 1554.9666666666667, "x": "アメリカ航空宇宙局は、三つのなかから、火星の"}, {"t": 1558.6166666666666, "x": "内部を調べる探査機を選んだと発表しました。"}, {"t": 1561.4333333333334, "x": "発表には、選ばれなかったほかの"}, {"t": 1563.6833333333334, "x": "二つについて、一行だけ書かれています。"}, {"t": 1566.5, "x": "ほかの二つは、彗星へ向かう計画と、"}, {"t": 1569.2, "x": "土星の衛星タイタンへ向かう計画だった。"}, {"t": 1572.0333333333333, "x": "船は、作られませんでした。"}, {"t": 1574.0833333333333, "x": "予定どおりに進んでいれば、この船が海に降りてから、"}, {"t": 1577.4666666666667, "x": "いまで三年ほどがたっていたことになります。"}, {"t": 1580.1666666666667, "x": "カッシーニのほうも、いつまでも"}, {"t": 1582.1666666666667, "x": "回り続けることはできませんでした。"}, {"t": 1584.2333333333333, "x": "燃料には限りがあります。"}, {"t": 1585.9333333333334, "x": "打ち上げから、およそ二十年。"}, {"t": 1588.1, "x": "土星のまわりで過ごした時間は、十三年を超えていました。"}, {"t": 1591.9, "x": "二〇一七年九月十五日。"}, {"t": 1591.9, "x": "二〇一七年九月十五日█"}, {"t": 1593.9833333333333, "x": "カッシーニは、自分から土星の"}, {"t": 1595.9833333333333, "x": "中へ飛びこみ、燃えつきました。"}, {"t": 1598.1, "x": "アメリカ航空宇宙局によると、その理由は、"}, {"t": 1601.1166666666666, "x": "土星の衛星を汚さないためでした。"}, {"t": 1603.6, "x": "とくに、氷の下に海を持つ衛星エンケラドゥスと、"}, {"t": 1606.8833333333334, "x": "そして、タイタンです。"}, {"t": 1608.75, "x": "いつか、地球から持ちこんだものに邪魔されずに、"}, {"t": 1611.6666666666667, "x": "次の探査機が調べられるように、という判断でした。"}, {"t": 1615.2833333333333, "x": "カッシーニは、タイタンのまわりには残りませんでした。"}, {"t": 1618.5333333333333, "x": "タイタンに残っているのは、ホイヘンスだけです。"}, {"t": 1621.45, "x": "次にタイタンへ向かう予定の"}, {"t": 1623.05, "x": "探査機は、ドラゴンフライです。"}, {"t": 1623.8, "x": "ドラゴンフライ█"}, {"t": 1625.1166666666666, "x": "アメリカ航空宇宙局の計画で、打ち上げは"}, {"t": 1628.15, "x": "早くて二〇二八年の七月、タイタンに"}, {"t": 1631.1166666666666, "x": "着くのは二〇三四年の後半とされています。"}, {"t": 1633.8666666666666, "x": "ドラゴンフライは、回転する羽根で空を飛ぶ機体です。"}, {"t": 1637.2833333333333, "x": "ほかの天体を飛び回る、はじめての"}, {"t": 1639.7166666666667, "x": "回転翼機になるはずです。"}, {"t": 1641.35, "x": "着いてからの主な活動期間は、三・三年。"}, {"t": 1644.5666666666666, "x": "タイタンの一日は、地球のおよそ十六日に"}, {"t": 1647.55, "x": "あたり、一日から二日に一度くらいの"}, {"t": 1650.1, "x": "割合で飛んで、場所を移していく計画です。"}, {"t": 1653.0, "x": "二〇二六年の七月には、機体に電気を通すための"}, {"t": 1656.6666666666667, "x": "配線の束が、飛ぶための本体に取りつけられました。"}, {"t": 1660.0, "x": "電線の長さは、合わせておよそ一万七千三百十 ": 1767.0166666666667, "x": "この長い一年のあいだに、あの川原に雨が降ったのか、"}, {"t": 1770.5166666666667, "x": "流れが来たのか、それとも乾いたままなのか。"}, {"t": 1773.75, "x": "記録はありません。"}, {"t": 1774.9, "x": "ホイヘンスの電池は、とうに尽きていると考えられます。"}, {"t": 1778.35, "x": "送られてくるものは、もうありません。"}, {"t": 1780.7333333333333, "x": "あの小石の根元を削ったものが"}, {"t": 1782.55, "x": "何だったのかも、確かめた者はいません。"}, {"t": 1785.1333333333334, "x": "地球では、ホイヘンスが送ってきた写真が、"}, {"t": 1787.9166666666667, "x": "いまもそのまま残っています。"}, {"t": 1789.8833333333334, "x": "海については、電波の返りと、赤外線の"}, {"t": 1793.15, "x": "きらめきと、深さの数字があります。"}, {"t": 1795.5333333333333, "x": "地面については、一つの方向から撮った、"}, {"t": 1798.2833333333333, "x": "乾いた川原の写真があります。"}, {"t": 1800.4333333333334, "x": "岸から海を見た写真は、まだありません。"}, {"t": 1803.1666666666667, "x": "十五センチの小石と、四センチの小石。"}, {"t": 1806.0833333333333, "x": "八十五センチ先。"}, {"t": 1807.4833333333333, "x": "削られた根元。"}, {"t": 1808.6, "x": "タイタンの地面について、人間が"}, {"t": 1810.8666666666666, "x": "持っている写真は、それだけです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
