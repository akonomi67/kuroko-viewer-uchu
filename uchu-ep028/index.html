<script>
const D={"name": "ep028", "file": "ep028", "dur": 1829.7, "segs": [], "subs": [{"t": 0.0, "x": "太陽系をまるごとつつむとされる、"}, {"t": 2.1666666666666665, "x": "氷の天体の雲があります。"}, {"t": 4.416666666666667, "x": "オールトの雲です。"}, {"t": 5.683333333333334, "x": "中にある天体は、数千億個とも、数兆個ともいわれます。"}, {"t": 10.183333333333334, "x": "けれども、見えたものは一つもありません。"}, {"t": 13.0, "x": "その雲から来た彗星を最も近くで撮った"}, {"t": 15.65, "x": "写真でも、明るい点は画素二つか三つでした。"}, {"t": 18.95, "x": "二〇一四年十月十九日のことです。"}, {"t": 21.666666666666668, "x": "火星を回るアメリカの探査機が、"}, {"t": 23.7, "x": "一つの彗星にカメラを向けました。"}, {"t": 26.216666666666665, "x": "探査機の名前は、マーズ・リコネッサンス・オービター。"}, {"t": 29.5, "x": "積んでいたのは、火星の地面を細かく撮るカメラです。"}, {"t": 33.06666666666667, "x": "彗星は火星のすぐそばを通り過ぎるところでした。"}, {"t": 36.266666666666666, "x": "最も近いとき、カメラと彗星の距離は"}, {"t": 39.166666666666664, "x": "約十三万八千キロメートル。"}, {"t": 41.2, "x": "一つの画素が約百三十八メートルにあたります。"}, {"t": 44.4, "x": "撮れた画像で、いちばん明るい点は"}, {"t": 46.95, "x": "画素二つか三つぶんでした。"}, {"t": 48.63333333333333, "x": "その点が、彗星の芯にあたる核だと考えられています。"}, {"t": 52.583333333333336, "x": "地上の望遠鏡では、核の幅は"}, {"t": 55.13333333333333, "x": "約一キロメートルとされていました。"}, {"t": 57.25, "x": "画像からはその半分より小さいと読み取れました。"}, {"t": 60.35, "x": "アメリカ航空宇宙局、NASAの研究所はこう書いています。"}, {"t": 64.48333333333333, "x": "オールトの雲から来た彗星の最も細かい画像だと。"}, {"t": 67.9, "x": "そして、彗星が来た場所は写っていません。"}, {"t": 70.96666666666667, "x": "オールトの雲そのものは、一度も写っていないのです。"}, {"t": 74.45, "x": "NASAは、遠すぎるので直接の"}, {"t": 76.7, "x": "画像は無いと説明しています。"}, {"t": 78.56666666666666, "x": "雲の中にいる天体の姿を見た者はいません。"}, {"t": 81.6, "x": "一つもです。"}, {"t": 82.56666666666666, "x": "望遠鏡の中にも。"}, {"t": 84.03333333333333, "x": "探査機のカメラにも。"}, {"t": 85.43333333333334, "x": "見えないものが、なぜ「ある」とされているのか。"}, {"t": 89.33333333333333, "x": "この回はその根拠を一つずつたどります。"}, {"t": 91.96666666666667, "x": "根拠の中心にあるのは、ときどき太陽へ"}, {"t": 94.88333333333334, "x": "落ちてくる彗星です。"}, {"t": 96.25, "x": "その軌道が遠い雲の形を描いてきました。"}, {"t": 99.15, "x": "写真は一枚もありません。"}, {"t": 100.96666666666667, "x": "あるのは彗星の通り道を記した数字の列です。"}, {"t": 104.21666666666667, "x": "その数字を一九五〇年から順に見ていきます。"}, {"t": 107.61666666666666, "x": "彗星には大きく分けて二つの種類があります。"}, {"t": 110.61666666666666, "x": "一つは太陽を回るのに二百年かからないものです。"}, {"t": 113.91666666666667, "x": "短い周期の彗星と呼ばれます。"}, {"t": 116.21666666666667, "x": "何度も戻ってきます。"}, {"t": 117.68333333333334, "x": "来る年も予報できます。"}, {"t": 119.33333333333333, "x": "NASAによると、その多くは海王星の外の帯から来ます。"}, {"t": 123.25, "x": "氷の天体が集まった、カイパーベルトと呼ばれる帯です。"}, {"t": 127.23333333333333, "x": "もう一つが長い周期の彗星です。"}, {"t": 129.6, "x": "こちらは、めったに戻ってきません。"}, {"t": 132.03333333333333, "x": "その多くはオールトの雲から来る、と"}, {"t": 134.6, "x": "NASAは説明しています。"}, {"t": 136.08333333333334, "x": "一周に長いものでは三千万年かかるとされます。"}, {"t": 139.33333333333334, "x": "三千万年前の地球にはまだ人類はいませんでした。"}, {"t": 142.81666666666666, "x": "前に来たときを書き残した人はいないのです。"}, {"t": 145.58333333333334, "x": "そのため、長い周期の彗星の多くは"}, {"t": 148.45, "x": "一度しか記録がありません。"}, {"t": 150.01666666666668, "x": "次に来るとき、見上げる人がいるかどうかも分かりません。"}, {"t": 153.71666666666667, "x": "NASAはこうも書いています。"}, {"t": 155.38333333333333, "x": "人の目に一度も見られていない"}, {"t": 157.1, "x": "長い周期の彗星は、数えきれない。"}, {"t": 159.86666666666667, "x": "序章の彗星もその一つでした。"}, {"t": 162.05, "x": "二〇一三年に見つかった、サイディング・"}, {"t": 164.75, "x": "スプリング彗星です。"}, {"t": 166.11666666666667, "x": "NASAの研究所は、この彗星についてこう書いています。"}, {"t": 169.85, "x": "オールトの雲から、太陽にここまで近づく初めての旅だと。"}, {"t": 174.01666666666668, "x": "二〇一四年十月のことです。"}, {"t": 176.15, "x": "彗星は、火星から約十四万キロメートルを通りました。"}, {"t": 180.16666666666666, "x": "地球と月の距離の三分の一ほどです。"}, {"t": 182.78333333333333, "x": "尾のちりは、火星に対して秒速約五十三キロメートル。"}, {"t": 186.78333333333333, "x": "とても速い粒でした。"}, {"t": 188.28333333333333, "x": "火星の上空では探査機がこの彗星を待ち受けました。"}, {"t": 191.75, "x": "NASAの探査機メイブンもその一つです。"}, {"t": 194.08333333333334, "x": "彗星が通るあいだ、その様子を観測しました。"}, {"t": 197.56666666666666, "x": "彗星は、何百万年も前から太陽系の"}, {"t": 200.81666666666666, "x": "内側へ向かっていたとされます。"}, {"t": 202.61666666666667, "x": "そして火星をかすめてまた遠ざかっていきました。"}, {"t": 205.45, "x": "NASAによると、次に戻るのは約七十四万年後です。"}, {"t": 209.41666666666666, "x": "その一年前にも、別の彗星が太陽をめざしていました。"}, {"t": 213.41666666666666, "x": "アイソン彗星です。"}, {"t": 214.76666666666668, "x": "太陽のすぐそばを通る彗星でした。"}, {"t": 217.2, "x": "ヨーロッパ宇宙機関ESAの説明があります。"}, {"t": 220.03333333333333, "x": "この彗星が太陽へ向かい始めたのは、約三百万年前だと。"}, {"t": 224.53333333333333, "x": "二〇一三年十一月の終わりのことです。"}, {"t": 227.4, "x": "アイソン彗星は、太陽の表面"}, {"t": 229.83333333333334, "x": "すれすれを通る軌道にいました。"}, {"t": 231.73333333333332, "x": "その距離は約百十六万五千キロメートルです。"}, {"t": 234.86666666666667, "x": "太陽を見張る衛星がその様子を追いました。"}, {"t": 237.66666666666666, "x": "二十七日には急に明るくなりました。"}, {"t": 240.28333333333333, "x": "あとで記録を調べなおすと、"}, {"t": 242.01666666666668, "x": "核はばらばらになっていました。"}, {"t": 244.18333333333334, "x": "太陽に最も近づくその直前です。"}, {"t": 246.76666666666668, "x": "三百万年かけた旅は、一回目で終わったことになります。"}, {"t": 250.81666666666666, "x": "NASAは、オールトの雲の"}, {"t": 252.6, "x": "彗星の例としてこの彗星を挙げています。"}, {"t": 255.28333333333333, "x": "その旅の終わりを、人は見届けたことになります。"}, {"t": 258.68333333333334, "x": "長い周期の彗星はとても遠くからやって来ます。"}, {"t": 261.8, "x": "来る方角も、来る遠さも、短い"}, {"t": 264.65, "x": "周期の彗星とは違っていました。"}, {"t": 266.76666666666665, "x": "その違いを数字で並べたのが一本の論文です。"}, {"t": 269.9166666666667, "x": "出たのは一九五〇年でした。"}, {"t": 272.15, "x": "その論文を書いたのは、オランダの"}, {"t": 274.48333333333335, "x": "天文学者ヤン・オールトです。"}, {"t": 276.25, "x": "載ったのは、オランダの天文学の"}, {"t": 278.55, "x": "研究所が出す学術誌でした。"}, {"t": 280.51666666666665, "x": "題名は、太陽系をとりまく彗星の"}, {"t": 283.28333333333336, "x": "雲の構造と、その起源についての仮説。"}, {"t": 286.31666666666666, "x": "雲という言葉は題名の時点でもう使われています。"}, {"t": 289.51666666666665, "x": "けれどもその雲を見た人はいませんでした。"}, {"t": 292.01666666666665, "x": "いまもいません。"}, {"t": 293.0833333333333, "x": "オールトが使ったのは、よく観測された彗星の軌道です。"}, {"t": 296.98333333333335, "x": "論文の冒頭の要約によるとその数は二十ほど。"}, {"t": 300.26666666666665, "x": "彗星は、太陽に近づくと惑星の重力で軌道を曲げられます。"}, {"t": 304.75, "x": "そこでオールトは、曲げられる"}, {"t": 306.75, "x": "前のもとの軌道を使いました。"}, {"t": 308.6, "x": "太陽系に入る前の姿を計算で戻したのです。"}, {"t": 311.96666666666664, "x": "惑星のそばを通るたびに軌道は少し変わります。"}, {"t": 315.1, "x": "大きな惑星の近くでは変わり方も大きくなります。"}, {"t": 318.3666666666667, "x": "曲げられたあとの軌道では、ふるさとが分かりません。"}, {"t": 321.71666666666664, "x": "だから曲げられる前に戻す必要がありました。"}, {"t": 324.55, "x": "するとある傾向が見えました。"}, {"t": 326.5, "x": "遠さがそろっていたのです。"}, {"t": 328.1666666666667, "x": "初めて来た長い周期の彗星は、とても遠くから来ている。"}, {"t": 332.15, "x": "その遠さは、太陽と地球の距離の"}, {"t": 334.71666666666664, "x": "五万倍から十五万倍ほどでした。"}, {"t": 336.9, "x": "太陽と地球の距離は一天文単位と呼ばれます。"}, {"t": 340.03333333333336, "x": "一天文単位は約一億五千万キロメートルです。"}, {"t": 343.4, "x": "彗星たちは、五万から十五万天文単位あたりから"}, {"t": 347.05, "x": "落ちてきていたのです。"}, {"t": 348.26666666666665, "x": "海王星までの距離の千倍を軽く超える遠さです。"}, {"t": 351.6, "x": "しかも、それらの彗星の軌道は放物線に近い形でした。"}, {"t": 355.8, "x": "放物線に近い軌道とは、太陽から"}, {"t": 358.53333333333336, "x": "逃げ出しそうな軌道のことです。"}, {"t": 360.35, "x": "太陽につながれてはいます。"}, {"t": 362.1666666666667, "x": "けれどもそのひもはとても細い。"}, {"t": 364.1, "x": "長い周期の彗星の多くは、そういう軌道を回っています。"}, {"t": 368.1166666666667, "x": "オールトはここから一つの姿を描きました。"}, {"t": 370.9, "x": "太陽は彗星の大きな雲にとりまかれている。"}, {"t": 373.8333333333333, "x": "雲には見える大きさの彗星がおよそ千億個ある。"}, {"t": 377.05, "x": "重さを合わせると、地球の十分の一から百分の一ほど。"}, {"t": 381.18333333333334, "x": "これが論文の要約に書かれた数字です。"}, {"t": 383.81666666666666, "x": "では、遠くの彗星は、なぜ太陽のそばまで落ちてくるのか。"}, {"t": 388.21666666666664, "x": "オールトが挙げたのは太陽の近くを通る星でした。"}, {"t": 391.35, "x": "ほかの星の重力が雲の彗星を揺さぶる。"}, {"t": 394.26666666666665, "x": "そのため、新しい彗星が絶えず太陽の方へ送られてくる。"}, {"t": 398.46666666666664, "x": "そういう考えです。"}, {"t": 399.85, "x": "似た考えはオールトより前にも出ていました。"}, {"t": 402.6166666666667, "x": "一九三二年のことです。"}, {"t": 404.9, "x": "天文学者エルンスト・エピックが、"}, {"t": 406.81666666666666, "x": "短い論文を書いています。"}, {"t": 408.95, "x": "題名は、放物線に近い軌道が星の重力で"}, {"t": 412.3833333333333, "x": "乱されることについての覚え書き。"}, {"t": 414.43333333333334, "x": "遠くまで行く彗星の軌道をほかの星が乱す。"}, {"t": 417.43333333333334, "x": "そのことを論じたものです。"}, {"t": 419.15, "x": "二人の名前をとって、エピック・オールトの"}, {"t": 422.5, "x": "雲と呼ぶこともあります。"}, {"t": 423.96666666666664, "x": "ただ、どちらの論文も、雲の中の天体を見てはいません。"}, {"t": 428.3, "x": "手がかりは雲を出てしまった彗星だけでした。"}, {"t": 431.06666666666666, "x": "雲にいたころの姿は、計算で逆にたどるしかありません。"}, {"t": 435.01666666666665, "x": "その計算の出発点が二十ほどの軌道でした。"}, {"t": 438.0833333333333, "x": "二十という数はいまから見ると多くありません。"}, {"t": 440.9166666666667, "x": "それでもオールトは、そこから千億という数を導きました。"}, {"t": 444.9166666666667, "x": "見えた二十から、見えない千億へ。"}, {"t": 447.51666666666665, "x": "雲の話は、最初からこの形をしています。"}, {"t": 450.76666666666665, "x": "オールトの雲は球の形をしているとされます。"}, {"t": 453.65, "x": "それにも理由があります。"}, {"t": 455.23333333333335, "x": "太陽系の惑星は、ほぼ一枚の平らな面の上を回っています。"}, {"t": 459.73333333333335, "x": "小惑星の帯もだいたいその面に沿っています。"}, {"t": 462.65, "x": "カイパーベルトの天体も多くはその面の近くです。"}, {"t": 465.8333333333333, "x": "太陽系の大部分は、平たい円盤のような形をしています。"}, {"t": 470.1166666666667, "x": "ところが長い周期の彗星は違いました。"}, {"t": 472.85, "x": "NASAによると、オールトが"}, {"t": 474.7, "x": "雲を考えた理由の一つがこれです。"}, {"t": 477.05, "x": "長い周期の彗星は、あらゆる方角から来るように見える。"}, {"t": 481.1, "x": "惑星の面に沿って来るわけではない。"}, {"t": 483.3666666666667, "x": "上からも来ます。"}, {"t": 484.51666666666665, "x": "下からも来ます。"}, {"t": 485.7, "x": "斜めからも来ます。"}, {"t": 487.01666666666665, "x": "たとえば、ある彗星が北の空の"}, {"t": 489.46666666666664, "x": "高いところから来たとします。"}, {"t": 491.18333333333334, "x": "次の彗星は南の低い空から来ます。"}, {"t": 493.98333333333335, "x": "その次は東の方から来ます。"}, {"t": 496.1666666666667, "x": "一つだけなら偶然かもしれません。"}, {"t": 498.3833333333333, "x": "けれども何十と重なると話は変わります。"}, {"t": 501.15, "x": "偏りが無いことそのものが手がかりになるのです。"}, {"t": 504.06666666666666, "x": "もし彗星のふるさとが平たい円盤ならどうなるか。"}, {"t": 507.21666666666664, "x": "来る方角は面の近くに偏るはずです。"}, {"t": 509.93333333333334, "x": "偏っていないのなら、ふるさとは"}, {"t": 512.1166666666667, "x": "太陽をまるくつつむ形をしている。"}, {"t": 514.2666666666667, "x": "そう考えると、来る方角がばらばらなことに"}, {"t": 517.35, "x": "説明がつきます。"}, {"t": 518.5166666666667, "x": "NASAはオールトの雲を球の殻と書いています。"}, {"t": 521.2833333333333, "x": "太陽系をとりまくとても遠い氷の天体の殻です。"}, {"t": 524.75, "x": "別の説明では、氷のかけらでできた"}, {"t": 527.5166666666667, "x": "分厚い泡とも書かれています。"}, {"t": 529.3333333333334, "x": "ヨーロッパ南天天文台は、分厚い"}, {"t": 531.9833333333333, "x": "シャボン玉にたとえました。"}, {"t": 533.4833333333333, "x": "太陽をとりまく巨大なシャボン玉です。"}, {"t": 535.9333333333333, "x": "ただし、どの形も、雲を見て描いたものではありません。"}, {"t": 540.05, "x": "彗星が来た向きをたくさん重ねて描いた形です。"}, {"t": 543.3, "x": "夜空に一本の線を引くように来た向きを書き込む。"}, {"t": 546.4166666666666, "x": "それを何十回何百回とくり返す。"}, {"t": 548.9833333333333, "x": "すると、太陽のまわりのどの方角にも線が引かれます。"}, {"t": 552.8166666666667, "x": "その線の出どころが、まるい雲として描かれているのです。"}, {"t": 556.5666666666667, "x": "形だけではありません。"}, {"t": 558.1166666666667, "x": "中身もまだ誰も見ていません。"}, {"t": 560.05, "x": "一つの天体もです。"}, {"t": 561.5166666666667, "x": "NASAによると、雲の氷の天体は数千億個とされます。"}, {"t": 565.5833333333334, "x": "数兆個かもしれないとも書かれています。"}, {"t": 568.0833333333334, "x": "オールトの見積もりは千億個でした。"}, {"t": 570.3166666666667, "x": "見積もりは十倍以上も違っています。"}, {"t": 572.75, "x": "見えないものを数えるとこうした幅が出てきます。"}, {"t": 575.6166666666667, "x": "数えたのは天体そのものではありません。"}, {"t": 578.1, "x": "来た彗星の数から雲の中の数を見積もったのです。"}, {"t": 581.4833333333333, "x": "そして、数と同じく幅が大きいのが、雲までの距離です。"}, {"t": 585.85, "x": "オールトの雲はどこから始まるのか。"}, {"t": 588.1166666666667, "x": "そしてどこで終わるのか。"}, {"t": 589.7, "x": "まずNASAの説明です。"}, {"t": 591.25, "x": "内側の端は、太陽から二千から五千天文単位のあいだ。"}, {"t": 595.4666666666667, "x": "外側の端は、一万から十万天文単位のどこかとされます。"}, {"t": 599.8833333333333, "x": "内側の端だけで二・五倍の幅があります。"}, {"t": 602.8833333333333, "x": "外側の端は十倍の幅です。"}, {"t": 605.1333333333333, "x": "同じNASAのページには別の書き方もあります。"}, {"t": 608.0, "x": "雲は五千から十万天文単位のあいだを"}, {"t": 610.55, "x": "占める、という書き方です。"}, {"t": 612.5166666666667, "x": "内側の端を二千とするか、五千とするか。"}, {"t": 615.8666666666667, "x": "一つのページの中でも数字が揺れています。"}, {"t": 618.5833333333334, "x": "境目がはっきりしないので、"}, {"t": 620.35, "x": "数字も幅で書くしかありません。"}, {"t": 622.6, "x": "比べるために海王星までの距離を置いてみます。"}, {"t": 625.6333333333333, "x": "ESAの説明では、海王星は"}, {"t": 628.0, "x": "太陽から約四十五億キロメートル。"}, {"t": 630.3833333333333, "x": "天文単位でいうと約三十です。"}, {"t": 632.6666666666666, "x": "地球の三十倍の遠さです。"}, {"t": 634.7, "x": "内側の端が二千天文単位なら、"}, {"t": 637.0, "x": "海王星の六十倍以上も遠くなります。"}, {"t": 640.0833333333334, "x": "外側の端が十万天文単位なら三千倍を超えます。"}, {"t": 643.8166666666667, "x": "ESAの書き方はこうです。"}, {"t": 645.55, "x": "雲は、太陽から十五兆キロメートルまで"}, {"t": 648.4333333333333, "x": "広がると考えられている。"}, {"t": 650.0333333333333, "x": "十五兆キロメートルは、太陽と地球の距離の十万倍です。"}, {"t": 654.1833333333333, "x": "NASAのハッブル宇宙望遠鏡の"}, {"t": 656.0666666666667, "x": "発表は、別の言い方をしています。"}, {"t": 658.6666666666666, "x": "雲の外側は、とても遠くまで広がっているかもしれない。"}, {"t": 662.4833333333333, "x": "いちばん近い恒星までの、少なくとも四分の一まで。"}, {"t": 666.2833333333333, "x": "別のNASAの発表では、雲は"}, {"t": 668.4666666666667, "x": "直径が一光年近い球の領域とされています。"}, {"t": 671.5833333333334, "x": "言い方は資料ごとに違います。"}, {"t": 673.65, "x": "どの言い方も、外側の端が決まっていないことを"}, {"t": 676.8666666666667, "x": "示しています。"}, {"t": 677.7833333333333, "x": "それでも遠さをつかむ手がかりはあります。"}, {"t": 680.2833333333333, "x": "いま最も遠くを飛ぶ探査機の一つは、ボイジャー1号です。"}, {"t": 684.3833333333333, "x": "NASAによると、いまの速さなら雲に"}, {"t": 686.9166666666666, "x": "入るまで約三百年かかります。"}, {"t": 689.05, "x": "雲の外側を抜けるには、三万年ほどかかるかもしれません。"}, {"t": 693.1166666666667, "x": "人類が送った最も遠い機体でも、雲の入口はまだ先です。"}, {"t": 697.55, "x": "三百年前といえば、日本は江戸時代の半ばです。"}, {"t": 701.3333333333334, "x": "それと同じ長さを、この先もう一度待つことになります。"}, {"t": 705.2666666666667, "x": "それでやっと入口です。"}, {"t": 706.9166666666666, "x": "それほど遠くを回る天体も、太陽の重力に"}, {"t": 710.3166666666667, "x": "つなぎ止められているとされます。"}, {"t": 712.1166666666667, "x": "ただし、遠くなるほど、太陽が引く力は弱くなります。"}, {"t": 716.45, "x": "どこまでが雲なのか。"}, {"t": 717.9166666666666, "x": "その線はまだ引かれていません。"}, {"t": 719.85, "x": "内側の端は二千か五千か。"}, {"t": 722.0333333333333, "x": "外側の端は一万か十万か。"}, {"t": 724.4333333333333, "x": "どの数字を選ぶかで、雲の大きさは何倍にも変わります。"}, {"t": 728.4333333333333, "x": "この回では、その幅をそのまま使います。"}, {"t": 731.4166666666666, "x": "なぜ雲の天体は一つも見えないのでしょうか。"}, {"t": 734.3, "x": "一つ目の理由は小ささです。"}, {"t": 736.2333333333333, "x": "NASAによると、彗星の核は"}, {"t": 738.4333333333333, "x": "多くが数キロメートルほどです。"}, {"t": 740.3333333333334, "x": "二つ目の理由は自分で光らないことです。"}, {"t": 742.95, "x": "彗星の核も小惑星も、太陽の光をはね返して見えています。"}, {"t": 747.5833333333334, "x": "遠くなるほど当たる太陽の光は弱くなります。"}, {"t": 750.6666666666666, "x": "はね返った光も、地球へ戻るまでにさらに弱くなります。"}, {"t": 754.6833333333333, "x": "距離が十倍になると届く明るさは一万分の一です。"}, {"t": 758.2166666666667, "x": "行きで百分の一、帰りでまた百分の一になるからです。"}, {"t": 762.2666666666667, "x": "海王星のあたりでも、数キロメートルの"}, {"t": 765.0333333333333, "x": "氷は見つけにくいものです。"}, {"t": 766.7666666666667, "x": "雲はそのさらに六十倍以上も遠くにあります。"}, {"t": 769.8, "x": "距離が六十倍なら明るさは六十の四乗分の一です。"}, {"t": 773.3666666666667, "x": "計算すると、千二百九十六万分の一になります。"}, {"t": 777.3166666666667, "x": "同じ氷の塊でも、それだけ暗く見えることになります。"}, {"t": 781.3666666666667, "x": "三つ目の理由は冷たさです。"}, {"t": 783.2833333333333, "x": "雲の中は、とても冷えています。"}, {"t": 785.6833333333333, "x": "雲のあたりの温度も、ハッブルの発表に書かれています。"}, {"t": 789.3166666666667, "x": "華氏でマイナス四百四十度ほどです。"}, {"t": 791.7833333333333, "x": "摂氏にするとマイナス二百六十度を下回ります。"}, {"t": 795.0333333333333, "x": "最も低い温度とされる絶対零度は、"}, {"t": 797.5, "x": "マイナス約二百七十三度です。"}, {"t": 800.0833333333334, "x": "雲のあたりはそこから十数度しか離れていません。"}, {"t": 803.1166666666667, "x": "これほど冷たいと、氷はガスになって噴き出しません。"}, {"t": 806.7166666666667, "x": "尾もぼんやりした頭も出しません。"}, {"t": 808.7666666666667, "x": "ただの暗い塊として、真っ暗な空間に浮かんでいます。"}, {"t": 812.6666666666666, "x": "NASAのハッブルの発表は、はっきり書いています。"}, {"t": 815.8666666666667, "x": "オールトの雲はいまも理論のままだと。"}, {"t": 818.1833333333333, "x": "雲をつくる無数の彗星は暗すぎる。"}, {"t": 820.65, "x": "そして遠すぎる。"}, {"t": 821.8166666666667, "x": "だから直接は観測できないという説明です。"}, {"t": 824.7666666666667, "x": "ではどうやって雲の天体を知るのか。"}, {"t": 827.1166666666667, "x": "答えは、雲を出て太陽へ落ちてきたときに見ることです。"}, {"t": 830.8833333333333, "x": "太陽に近づくと氷がガスになって噴き出します。"}, {"t": 833.95, "x": "ちりも一緒に広がります。"}, {"t": 835.6833333333333, "x": "小さな核が、何万キロメートルもの光の雲をまといます。"}, {"t": 839.7666666666667, "x": "その光なら地上の望遠鏡でもとらえられます。"}, {"t": 842.8333333333334, "x": "雲の天体を見る方法はいまのところ一つです。"}, {"t": 845.9, "x": "雲を出てきたものを見ることだけです。"}, {"t": 848.0833333333334, "x": "たとえるなら、中が見えない暗い森です。"}, {"t": 851.0666666666667, "x": "森から出てきた鳥だけを見て森の広さを考える。"}, {"t": 854.2833333333333, "x": "雲の研究は、それに近い形で進んできました。"}, {"t": 857.8833333333333, "x": "けれども、彗星が雲を出るには、きっかけが要ります。"}, {"t": 861.75, "x": "オールトが挙げたきっかけは近くを通る星でした。"}, {"t": 864.7166666666667, "x": "その星の一つが記録に残っています。"}, {"t": 867.2333333333333, "x": "二〇一五年二月のことです。"}, {"t": 869.2666666666667, "x": "アメリカのロチェスター大学が、"}, {"t": 871.0333333333333, "x": "一つの研究を発表しました。"}, {"t": 873.4333333333333, "x": "主役はショルツ星と呼ばれる星です。"}, {"t": 875.7666666666667, "x": " ら雲の外を通ったことになります。"}, {"t": 992.1, "x": "この星はもう遠ざかっています。"}, {"t": 994.1, "x": "ではこれから来る星はあるのでしょうか。"}, {"t": 996.45, "x": "二〇一七年八月のことです。"}, {"t": 998.7166666666667, "x": "ESAが、天文衛星ガイアの記録を"}, {"t": 1001.4166666666666, "x": "使った研究を紹介しました。"}, {"t": 1003.4166666666666, "x": "ガイアは星の位置と動きを細かく測る衛星です。"}, {"t": 1006.6666666666666, "x": "五年の観測を予定して打ち上げられました。"}, {"t": 1009.4333333333333, "x": "この研究のころには最初の星の目録が出ていました。"}, {"t": 1012.95, "x": "十億個を超える星が載った目録です。"}, {"t": 1015.5666666666667, "x": "そのうち二百万個を超える星は、"}, {"t": 1017.7, "x": "距離と動きも測られていました。"}, {"t": 1019.9833333333333, "x": "次の目録では星の数が約二十倍になるとされていました。"}, {"t": 1023.95, "x": "さかのぼれる時間も、過去と"}, {"t": 1026.0333333333333, "x": "未来の二千五百万年に広がる見込みでした。"}, {"t": 1028.95, "x": "研究は三十万個を超える星の動きを調べました。"}, {"t": 1032.4, "x": "過去と未来の五百万年のあいだを見たのです。"}, {"t": 1035.3166666666666, "x": "その中で太陽の近くを通る星を探しました。"}, {"t": 1038.5166666666667, "x": "百五十兆キロメートル以内を"}, {"t": 1040.45, "x": "通る星は、九十七個ありました。"}, {"t": 1043.0333333333333, "x": "そのうち十六個は、約六十兆キロメートル以内まで来ます。"}, {"t": 1047.15, "x": "中でも目立つ星が一つありました。"}, {"t": 1049.45, "x": "グリーゼ七百十という星です。"}, {"t": 1051.5833333333333, "x": "いまは、まだ遠くにいます。"}, {"t": 1053.6333333333334, "x": "いまから約百三十万年後に、この星は太陽に近づきます。"}, {"t": 1058.1, "x": "最も近づくときは約二兆三千億キロメートル。"}, {"t": 1061.4, "x": "太陽と地球の距離の約一万六千倍です。"}, {"t": 1064.5, "x": "それより前の見積もりは、もっと遠くを"}, {"t": 1067.2, "x": "通るとしていました。"}, {"t": 1068.3833333333334, "x": "ガイアの記録で測りなおすと、ぐっと近くなったのです。"}, {"t": 1072.0666666666666, "x": "前の見積もりは、三兆一千億から"}, {"t": 1074.7333333333333, "x": "十三兆六千億キロメートルでした。"}, {"t": 1077.1166666666666, "x": "九十パーセントの確からしさで、という幅です。"}, {"t": 1080.4166666666667, "x": "新しい数字は、その下の端よりも近い値です。"}, {"t": 1084.1333333333334, "x": "いちばんありそうな値は二兆三千億キロメートル。"}, {"t": 1087.3833333333334, "x": "幅は、一兆五千億から三兆二千億キロメートルとされます。"}, {"t": 1091.7833333333333, "x": "この星の重さは太陽の六割ほどです。"}, {"t": 1094.5, "x": "小さな星ではありません。"}, {"t": 1096.1666666666667, "x": "近づくときの速さは時速五万キロメートル近く。"}, {"t": 1099.35, "x": "近くを通る星の平均は、時速十万キロメートルほどです。"}, {"t": 1103.6166666666666, "x": "その半分の速さでゆっくり通ることになります。"}, {"t": 1106.6166666666666, "x": "一万六千天文単位は、NASAの言う雲の範囲の中です。"}, {"t": 1110.7166666666667, "x": "ESAも、雲の範囲の十分に内側だと書いています。"}, {"t": 1114.3833333333334, "x": "星の重力が雲の彗星の道すじを乱すかもしれない。"}, {"t": 1118.0333333333333, "x": "彗星が太陽系の内側へ送り込まれるかもしれない。"}, {"t": 1121.5666666666666, "x": "地球やほかの惑星にぶつかる道に"}, {"t": 1123.75, "x": "乗る彗星も、出てくるかもしれない。"}, {"t": 1126.2833333333333, "x": "ただしESAはこうも書いています。"}, {"t": 1128.3333333333333, "x": "星が通っても彗星が内側へ来るとは限らない。"}, {"t": 1131.5, "x": "地球に影響が出るかどうかも分からない。"}, {"t": 1134.0333333333333, "x": "百三十万年後の話です。"}, {"t": 1136.1833333333334, "x": "遠い先です。"}, {"t": 1137.2333333333333, "x": "文字を使い始めてからの人類の歴史の、何百倍も先です。"}, {"t": 1141.6666666666667, "x": "研究によると、百万年ごとに約五百五十個の星が通ります。"}, {"t": 1146.3666666666666, "x": "百五十兆キロメートル以内を、です。"}, {"t": 1149.1333333333334, "x": "もっと近くを通るものも、平均して"}, {"t": 1151.7, "x": "約五万年に一度あるとされます。"}, {"t": 1153.8166666666666, "x": "三十兆キロメートルより近くまで来る星もあります。"}, {"t": 1157.1166666666666, "x": "百万年に約二十個とされます。"}, {"t": 1159.3833333333334, "x": "太陽は、こうした客を何度も迎えてきたことになります。"}, {"t": 1163.2166666666667, "x": "そのたびに、雲は少しずつ揺さぶられてきたと"}, {"t": 1166.2666666666667, "x": "考えられています。"}, {"t": 1167.4666666666667, "x": "近づく星の数は、これからも測りなおされていきます。"}, {"t": 1171.2333333333333, "x": "ただ、雲を揺さぶるのは、通り過ぎる"}, {"t": 1174.1166666666666, "x": "星だけではありません。"}, {"t": 1175.4, "x": "太陽は、天の川銀河という星の大きな集まりの中にいます。"}, {"t": 1179.7833333333333, "x": "太陽系は、ほかの星と一緒に銀河の中を回っています。"}, {"t": 1183.85, "x": "銀河全体の重力は、場所によって"}, {"t": 1186.4, "x": "わずかに違う引き方をします。"}, {"t": 1188.2333333333333, "x": "太陽に近い惑星には、その違いはほとんど効きません。"}, {"t": 1192.1333333333334, "x": "けれども、何千天文単位も離れた天体には効いてきます。"}, {"t": 1196.25, "x": "太陽が引く力がとても弱くなっているからです。"}, {"t": 1199.2833333333333, "x": "この違いから生まれる力を、銀河の潮汐力と呼びます。"}, {"t": 1203.2333333333333, "x": "海の満ち引きを起こす月の力と、仕組みが似ています。"}, {"t": 1206.9833333333333, "x": "月は地球の近い側と遠い側を、少し違う強さで引きます。"}, {"t": 1211.3333333333333, "x": "その差が海の水を引き伸ばすように動かします。"}, {"t": 1214.35, "x": "銀河の場合は、太陽の側と雲の"}, {"t": 1216.9, "x": "天体の側で引く強さが違います。"}, {"t": 1219.1833333333334, "x": "その差が雲の天体の軌道をじわじわと変えていきます。"}, {"t": 1222.55, "x": "NASAは、雲ができるときの話でこう書いています。"}, {"t": 1225.95, "x": "最も強く効いたのは、おそらく銀河"}, {"t": 1228.55, "x": "そのものの潮汐力だった。"}, {"t": 1230.2666666666667, "x": "この力は、遠くの天体の軌道を"}, {"t": 1232.8166666666666, "x": "長い時間をかけて変えるとされます。"}, {"t": 1234.95, "x": "天体を、惑星のそばまで戻る細長い軌道から引き離す。"}, {"t": 1239.1666666666667, "x": "そういう働きもあると考えられています。"}, {"t": 1241.7833333333333, "x": "二〇二五年、この力について新しい計算が出ました。"}, {"t": 1246.0333333333333, "x": "アメリカのサウスウエスト研究所などのチームの論文です。"}, {"t": 1249.5666666666666, "x": "論文の原稿が公開されたのは二〇二五年二月でした。"}, {"t": 1253.45, "x": "著者は八人です。"}, {"t": 1254.8, "x": "チームは計算機を使いました。"}, {"t": 1256.8833333333334, "x": "太陽系ができてからの天体の動きを、再現したのです。"}, {"t": 1260.8666666666666, "x": "海王星などの惑星が天体をはじき飛ばす。"}, {"t": 1263.85, "x": "天体は遠くまで運ばれる。"}, {"t": 1265.7333333333333, "x": "そこへ銀河の潮汐力が効いて、軌道を少しずつ動かす。"}, {"t": 1269.8166666666666, "x": "すると、雲の内側の部分に、"}, {"t": 1272.2, "x": "渦を巻くような形が現れました。"}, {"t": 1274.8166666666666, "x": "長さは約一万五千天文単位。"}, {"t": 1277.2833333333333, "x": "とても大きな渦です。"}, {"t": 1278.75, "x": "雲の内側の端と比べると、その三倍から"}, {"t": 1281.9166666666667, "x": "七倍ほどの長さです。"}, {"t": 1283.3833333333334, "x": "論文はこの形をオールトのらせんと呼んでいます。"}, {"t": 1286.45, "x": "計算ではらせんは長く残ります。"}, {"t": 1288.7166666666667, "x": "いまの雲の内側にもあるとされました。"}, {"t": 1291.1666666666667, "x": "ただしこれは計算機の中の模擬実験です。"}, {"t": 1293.9833333333333, "x": "本物のらせんを見た人はいません。"}, {"t": 1296.1666666666667, "x": "あるかどうかを決めるのはこれからの観測です。"}, {"t": 1298.9833333333333, "x": "論文自身も、観測で見つける"}, {"t": 1301.3666666666666, "x": "見込みは乏しいと書いています。"}, {"t": 1303.2333333333333, "x": "見つけるにはとても遠い天体がたくさん要ります。"}, {"t": 1306.1666666666667, "x": "そしてその並び方を調べなければなりません。"}, {"t": 1309.0166666666667, "x": "雲の形は見えないまま描きなおされ続けています。"}, {"t": 1312.2833333333333, "x": "では、雲の材料の氷は、そもそも"}, {"t": 1315.3333333333333, "x": "どこで生まれたのでしょうか。"}, {"t": 1316.8333333333333, "x": "NASAが紹介する、いちばん有力な考えはこうです。"}, {"t": 1320.5666666666666, "x": "太陽ができたころのことです。"}, {"t": 1322.4833333333333, "x": "まわりには、惑星の材料になる"}, {"t": 1324.8666666666666, "x": "小さな天体が const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
