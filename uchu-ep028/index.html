<script>
const D={"name": "ep028", "file": "ep028", "dur": 1843.75, "segs": [], "subs": [{"t": 0.0, "x": "太陽系をまるごとつつむとされる、"}, {"t": 2.1666666666666665, "x": "氷の天体の雲があります。"}, {"t": 4.416666666666667, "x": "オールトの雲です。"}, {"t": 5.683333333333334, "x": "中にある天体は、数千億個とも、数兆個ともいわれます。"}, {"t": 10.183333333333334, "x": "けれども、見えたものは一つもありません。"}, {"t": 13.0, "x": "その雲から来た彗星を最も近くで撮った"}, {"t": 15.65, "x": "写真でも、明るい点は画素二つか三つでした。"}, {"t": 18.95, "x": "二〇一四年十月十九日のことです。"}, {"t": 21.666666666666668, "x": "火星を回るアメリカの探査機が、"}, {"t": 23.7, "x": "一つの彗星にカメラを向けました。"}, {"t": 26.216666666666665, "x": "探査機の名前は、マーズ・リコネッサンス・オービター。"}, {"t": 29.5, "x": "積んでいたのは、アリゾナ大学が運用する、"}, {"t": 32.45, "x": "火星の地面を細かく撮るカメラです。"}, {"t": 35.1, "x": "彗星は火星のすぐそばを通り過ぎるところでした。"}, {"t": 38.3, "x": "最も近いとき、カメラと彗星の距離は"}, {"t": 41.2, "x": "約十三万八千キロメートル。"}, {"t": 43.233333333333334, "x": "一つの画素が約百三十八メートルにあたります。"}, {"t": 46.43333333333333, "x": "撮れた画像で、いちばん明るい点は"}, {"t": 48.983333333333334, "x": "画素二つか三つぶんでした。"}, {"t": 50.666666666666664, "x": "その点が、彗星の芯にあたる核だと考えられています。"}, {"t": 54.61666666666667, "x": "地上の望遠鏡では、核の幅は"}, {"t": 57.166666666666664, "x": "約一キロメートルとされていました。"}, {"t": 59.28333333333333, "x": "画像からはその半分より小さいと読み取れました。"}, {"t": 62.38333333333333, "x": "アメリカ航空宇宙局、NASAの研究所はこう書いています。"}, {"t": 66.51666666666667, "x": "オールトの雲から来た彗星の最も細かい画像だと。"}, {"t": 69.93333333333334, "x": "そして、彗星が来た場所は写っていません。"}, {"t": 73.0, "x": "オールトの雲そのものは、一度も写っていないのです。"}, {"t": 76.48333333333333, "x": "NASAは、遠すぎるので直接の"}, {"t": 78.73333333333333, "x": "画像は無いと説明しています。"}, {"t": 80.6, "x": "雲の中にいる天体の姿を見た者はいません。"}, {"t": 83.63333333333334, "x": "一つもです。"}, {"t": 84.6, "x": "望遠鏡の中にも。"}, {"t": 86.06666666666666, "x": "探査機のカメラにも。"}, {"t": 87.46666666666667, "x": "見えないものが、なぜ「ある」とされているのか。"}, {"t": 91.36666666666666, "x": "この回はその根拠を一つずつたどります。"}, {"t": 94.0, "x": "根拠の中心にあるのは、ときどき太陽へ"}, {"t": 96.91666666666667, "x": "落ちてくる彗星です。"}, {"t": 98.28333333333333, "x": "その軌道が遠い雲の形を描いてきました。"}, {"t": 101.18333333333334, "x": "写真は一枚もありません。"}, {"t": 103.0, "x": "あるのは彗星の通り道を記した数字の列です。"}, {"t": 106.25, "x": "その数字を一九五〇年から順に見ていきます。"}, {"t": 109.65, "x": "彗星には大きく分けて二つの種類があります。"}, {"t": 112.65, "x": "一つは太陽を回るのに二百年かからないものです。"}, {"t": 115.95, "x": "短い周期の彗星と呼ばれます。"}, {"t": 118.25, "x": "何度も戻ってきます。"}, {"t": 119.71666666666667, "x": "来る年も予報できます。"}, {"t": 121.36666666666666, "x": "NASAによると、その多くは海王星の外の帯から来ます。"}, {"t": 125.28333333333333, "x": "氷の天体が集まった、カイパーベルトと呼ばれる帯です。"}, {"t": 129.26666666666668, "x": "もう一つが長い周期の彗星です。"}, {"t": 131.63333333333333, "x": "こちらは、めったに戻ってきません。"}, {"t": 134.06666666666666, "x": "その多くはオールトの雲から来る、と"}, {"t": 136.63333333333333, "x": "NASAは説明しています。"}, {"t": 138.11666666666667, "x": "一周に長いものでは三千万年かかるとされます。"}, {"t": 141.36666666666667, "x": "三千万年前の地球にはまだ人類はいませんでした。"}, {"t": 144.85, "x": "前に来たときを書き残した人はいないのです。"}, {"t": 147.61666666666667, "x": "そのため、長い周期の彗星の多くは"}, {"t": 150.48333333333332, "x": "一度しか記録がありません。"}, {"t": 152.05, "x": "次に来るとき、見上げる人がいるかどうかも分かりません。"}, {"t": 155.75, "x": "NASAはこう続けます。"}, {"t": 157.21666666666667, "x": "人の目に一度も見られていない"}, {"t": 158.93333333333334, "x": "長い周期の彗星は、数えきれない。"}, {"t": 161.7, "x": "序章の彗星もその一つでした。"}, {"t": 163.88333333333333, "x": "二〇一三年に見つかった、サイディング・"}, {"t": 166.63333333333333, "x": "スプリング彗星です。"}, {"t": 167.98333333333332, "x": "NASAの研究所は、この彗星の旅をこう紹介しました。"}, {"t": 171.96666666666667, "x": "オールトの雲から、太陽にここまで近づく初めての旅だと。"}, {"t": 176.13333333333333, "x": "二〇一四年十月のことです。"}, {"t": 178.26666666666668, "x": "彗星は、火星から約十四万キロメートルを通りました。"}, {"t": 182.28333333333333, "x": "地球と月の距離の三分の一ほどです。"}, {"t": 184.9, "x": "尾のちりは、火星に対して秒速約五十三キロメートル。"}, {"t": 188.9, "x": "とても速い粒でした。"}, {"t": 190.4, "x": "火星の上空では探査機がこの彗星を待ち受けました。"}, {"t": 193.86666666666667, "x": "NASAの探査機メイブンもその一つです。"}, {"t": 196.2, "x": "彗星が通るあいだ、その様子を観測しました。"}, {"t": 199.68333333333334, "x": "彗星は、何百万年も前から太陽系の"}, {"t": 202.93333333333334, "x": "内側へ向かっていたとされます。"}, {"t": 204.73333333333332, "x": "そして火星をかすめてまた遠ざかっていきました。"}, {"t": 207.56666666666666, "x": "NASAによると、次に戻るのは約七十四万年後です。"}, {"t": 211.53333333333333, "x": "その一年前にも、別の彗星が太陽をめざしていました。"}, {"t": 215.53333333333333, "x": "アイソン彗星です。"}, {"t": 216.88333333333333, "x": "太陽のすぐそばを通る彗星でした。"}, {"t": 219.31666666666666, "x": "ヨーロッパ宇宙機関ESAの説明があります。"}, {"t": 222.15, "x": "この彗星が太陽へ向かい始めたのは、約三百万年前だと。"}, {"t": 226.65, "x": "二〇一三年十一月の終わりのことです。"}, {"t": 229.56666666666666, "x": "アイソン彗星は、太陽の表面"}, {"t": 232.0, "x": "すれすれを通る軌道にいました。"}, {"t": 233.9, "x": "その距離は約百十六万五千キロメートルです。"}, {"t": 237.03333333333333, "x": "太陽を見張る衛星がその様子を追いました。"}, {"t": 239.83333333333334, "x": "二十七日には急に明るくなりました。"}, {"t": 242.45, "x": "あとで記録を調べなおすと、"}, {"t": 244.18333333333334, "x": "核はばらばらになっていました。"}, {"t": 246.35, "x": "太陽に最も近づくその直前です。"}, {"t": 248.93333333333334, "x": "三百万年かけた旅は、一回目で終わったことになります。"}, {"t": 252.98333333333332, "x": "NASAは、オールトの雲の"}, {"t": 254.76666666666668, "x": "彗星の例としてこの彗星を挙げています。"}, {"t": 257.45, "x": "その旅の終わりを、人は見届けたことになります。"}, {"t": 260.85, "x": "長い周期の彗星はとても遠くからやって来ます。"}, {"t": 263.96666666666664, "x": "来る方角も、来る遠さも、短い"}, {"t": 266.81666666666666, "x": "周期の彗星とは違っていました。"}, {"t": 268.93333333333334, "x": "その違いを数字で並べたのが一本の論文です。"}, {"t": 272.0833333333333, "x": "出たのは一九五〇年でした。"}, {"t": 274.31666666666666, "x": "その論文を書いたのは、オランダの"}, {"t": 276.65, "x": "天文学者ヤン・オールトです。"}, {"t": 278.4166666666667, "x": "載ったのは、オランダの天文学の"}, {"t": 280.71666666666664, "x": "研究所が出す学術誌でした。"}, {"t": 282.68333333333334, "x": "第十一巻の九十一ページからです。"}, {"t": 285.25, "x": "全部で二十ページの論文でした。"}, {"t": 287.43333333333334, "x": "題名は、太陽系をとりまく彗星の"}, {"t": 290.2, "x": "雲の構造と、その起源についての仮説。"}, {"t": 293.23333333333335, "x": "雲という言葉は題名の時点でもう使われています。"}, {"t": 296.43333333333334, "x": "けれどもその雲を見た人はいませんでした。"}, {"t": 298.93333333333334, "x": "いまもいません。"}, {"t": 300.0, "x": "オールトが使ったのは、よく観測された彗星の軌道です。"}, {"t": 303.9, "x": "論文の冒頭の要約によるとその数は二十ほど。"}, {"t": 307.18333333333334, "x": "彗星は、太陽に近づくと惑星の重力で軌道を曲げられます。"}, {"t": 311.6666666666667, "x": "そこでオールトは、曲げられる"}, {"t": 313.6666666666667, "x": "前のもとの軌道を使いました。"}, {"t": 315.51666666666665, "x": "太陽系に入る前の姿を計算で戻したのです。"}, {"t": 318.8833333333333, "x": "惑星のそばを通るたびに軌道は少し変わります。"}, {"t": 322.01666666666665, "x": "大きな惑星の近くでは変わり方も大きくなります。"}, {"t": 325.28333333333336, "x": "曲げられたあとの軌道では、ふるさとが分かりません。"}, {"t": 328.6333333333333, "x": "だから曲げられる前に戻す必要がありました。"}, {"t": 331.46666666666664, "x": "するとある傾向が見えました。"}, {"t": 333.4166666666667, "x": "遠さがそろっていたのです。"}, {"t": 335.0833333333333, "x": "初めて来た長い周期の彗星は、とても遠くから来ている。"}, {"t": 339.06666666666666, "x": "その遠さは、太陽と地球の距離の"}, {"t": 341.6333333333333, "x": "五万倍から十五万倍ほどでした。"}, {"t": 343.81666666666666, "x": "太陽と地球の距離は一天文単位と呼ばれます。"}, {"t": 346.95, "x": "一天文単位は約一億五千万キロメートルです。"}, {"t": 350.31666666666666, "x": "光でも約八分二十秒かかります。"}, {"t": 352.85, "x": "彗星たちは、五万から十五万天文単位あたりから"}, {"t": 356.5, "x": "落ちてきていたのです。"}, {"t": 357.71666666666664, "x": "海王星までの距離の千倍を軽く超える遠さです。"}, {"t": 361.05, "x": "しかも、それらの彗星の軌道は放物線に近い形でした。"}, {"t": 365.25, "x": "放物線に近い軌道とは、太陽から"}, {"t": 367.98333333333335, "x": "逃げ出しそうな軌道のことです。"}, {"t": 369.8, "x": "太陽につながれてはいます。"}, {"t": 371.6166666666667, "x": "けれどもそのひもはとても細い。"}, {"t": 373.55, "x": "長い周期の彗星の多くは、そういう軌道を回っています。"}, {"t": 377.56666666666666, "x": "オールトはここから一つの姿を描きました。"}, {"t": 380.35, "x": "太陽は彗星の大きな雲にとりまかれている。"}, {"t": 383.28333333333336, "x": "雲には見える大きさの彗星がおよそ千億個ある。"}, {"t": 386.5, "x": "重さを合わせると、地球の十分の一から百分の一ほど。"}, {"t": 390.6333333333333, "x": "これが論文の要約に書かれた数字です。"}, {"t": 393.26666666666665, "x": "では、遠くの彗星は、なぜ太陽のそばまで落ちてくるのか。"}, {"t": 397.6666666666667, "x": "オールトが挙げたのは太陽の近くを通る星でした。"}, {"t": 400.8, "x": "ほかの星の重力が雲の彗星を揺さぶる。"}, {"t": 403.71666666666664, "x": "そのため、新しい彗星が絶えず太陽の方へ送られてくる。"}, {"t": 407.9166666666667, "x": "そういう考えです。"}, {"t": 409.3, "x": "似た考えはオールトより前にも出ていました。"}, {"t": 412.06666666666666, "x": "一九三二年のことです。"}, {"t": 414.35, "x": "天文学者エルンスト・エピックが、"}, {"t": 416.26666666666665, "x": "短い論文を書いています。"}, {"t": 418.4, "x": "題名は、放物線に近い軌道が星の重力で"}, {"t": 421.8333333333333, "x": "乱されることについての覚え書き。"}, {"t": 423.8833333333333, "x": "遠くまで行く彗星の軌道をほかの星が乱す。"}, {"t": 426.8833333333333, "x": "そのことを論じたものです。"}, {"t": 428.6, "x": "二人の名前をとって、エピック・オールトの"}, {"t": 431.95, "x": "雲と呼ぶこともあります。"}, {"t": 433.4166666666667, "x": "ただ、どちらの論文も、雲の中の天体を見てはいません。"}, {"t": 437.75, "x": "手がかりは雲を出てしまった彗星だけでした。"}, {"t": 440.51666666666665, "x": "雲にいたころの姿は、計算で逆にたどるしかありません。"}, {"t": 444.46666666666664, "x": "その計算の出発点が二十ほどの軌道でした。"}, {"t": 447.53333333333336, "x": "二十という数はいまから見ると多くありません。"}, {"t": 450.3666666666667, "x": "それでもオールトは、そこから千億という数を導きました。"}, {"t": 454.3666666666667, "x": "見えた二十から、見えない千億へ。"}, {"t": 456.96666666666664, "x": "雲の話は、最初からこの形をしています。"}, {"t": 460.21666666666664, "x": "オールトの雲は球の形をしているとされます。"}, {"t": 463.1, "x": "それにも理由があります。"}, {"t": 464.68333333333334, "x": "太陽系の惑星は、ほぼ一枚の平らな面の上を回っています。"}, {"t": 469.18333333333334, "x": "小惑星の帯もだいたいその面に沿っています。"}, {"t": 472.1, "x": "カイパーベルトの天体も多くはその面の近くです。"}, {"t": 475.28333333333336, "x": "太陽系の大部分は、平たい円盤のような形をしています。"}, {"t": 479.56666666666666, "x": "ところが長い周期の彗星は違いました。"}, {"t": 482.3, "x": "NASAによると、オールトが"}, {"t": 484.15, "x": "雲を考えた理由の一つがこれです。"}, {"t": 486.5, "x": "長い周期の彗星は、あらゆる方角から来るように見える。"}, {"t": 490.55, "x": "惑星の面に沿って来るわけではない。"}, {"t": 492.81666666666666, "x": "上からも来ます。"}, {"t": 493.96666666666664, "x": "下からも来ます。"}, {"t": 495.15, "x": "斜めからも来ます。"}, {"t": 496.46666666666664, "x": "たとえば、ある彗星が北の空の"}, {"t": 498.9166666666667, "x": "高いところから来たとします。"}, {"t": 500.6333333333333, "x": "次の彗星は南の低い空から来ます。"}, {"t": 503.43333333333334, "x": "その次は東の方から来ます。"}, {"t": 505.6166666666667, "x": "一つだけなら偶然かもしれません。"}, {"t": 507.8333333333333, "x": "けれども何十と重なると話は変わります。"}, {"t": 510.6, "x": "偏りが無いことそのものが手がかりになるのです。"}, {"t": 513.5166666666667, "x": "もし彗星のふるさとが平たい円盤ならどうなるか。"}, {"t": 516.6666666666666, "x": "来る方角は面の近くに偏るはずです。"}, {"t": 519.3833333333333, "x": "偏っていないのなら、ふるさとは"}, {"t": 521.5666666666667, "x": "太陽をまるくつつむ形をしている。"}, {"t": 523.7166666666667, "x": "そう考えると、来る方角がばらばらなことに"}, {"t": 526.8, "x": "説明がつきます。"}, {"t": 527.9666666666667, "x": "NASAはオールトの雲を球の殻と書いています。"}, {"t": 530.7333333333333, "x": "太陽系をとりまくとても遠い氷の天体の殻です。"}, {"t": 534.2, "x": "別の説明では、氷のかけらでできた"}, {"t": 536.9666666666667, "x": "分厚い泡とも書かれています。"}, {"t": 538.7833333333333, "x": "ヨーロッパ南天天文台は、分厚い"}, {"t": 541.4333333333333, "x": "シャボン玉にたとえました。"}, {"t": 542.9333333333333, "x": "太陽をとりまく巨大なシャボン玉です。"}, {"t": 545.3833333333333, "x": "ただし、どの形も、雲を見て描いたものではありません。"}, {"t": 549.5, "x": "彗星が来た向きをたくさん重ねて描いた形です。"}, {"t": 552.75, "x": "夜空に一本の線を引くように来た向きを書き込む。"}, {"t": 555.8666666666667, "x": "それを何十回何百回とくり返す。"}, {"t": 558.4333333333333, "x": "すると、太陽のまわりのどの方角にも線が引かれます。"}, {"t": 562.2666666666667, "x": "その線の出どころが、まるい雲として描かれているのです。"}, {"t": 566.0166666666667, "x": "形だけではありません。"}, {"t": 567.5666666666667, "x": "中身もまだ誰も見ていません。"}, {"t": 569.5, "x": "一つの天体もです。"}, {"t": 570.9666666666667, "x": "NASAによると、雲の氷の天体は数千億個とされます。"}, {"t": 575.0333333333333, "x": "数兆個かもしれないとも書かれています。"}, {"t": 577.5333333333333, "x": "オールトの見積もりは千億個でした。"}, {"t": 579.7666666666667, "x": "見積もりは十倍以上も違っています。"}, {"t": 582.2, "x": "見えないものを数えるとこうした幅が出てきます。"}, {"t": 585.0666666666667, "x": "数えたのは天体そのものではありません。"}, {"t": 587.55, "x": "来た彗星の数から雲の中の数を見積もったのです。"}, {"t": 590.9333333333333, "x": "そして、数と同じく幅が大きいのが、雲までの距離です。"}, {"t": 595.3, "x": "オールトの雲はどこから始まるのか。"}, {"t": 597.5666666666667, "x": "そしてどこで終わるのか。"}, {"t": 599.15, "x": "まずNASAの説明です。"}, {"t": 600.7, "x": "内側の端は、太陽から二千から五千天文単位のあいだ。"}, {"t": 604.9166666666666, "x": "外側の端は、一万から十万天文単位のどこかとされます。"}, {"t": 609.3333333333334, "x": "内側の端だけで二・五倍の幅があります。"}, {"t": 612.3333333333334, "x": "外側の端は十倍の幅です。"}, {"t": 614.5833333333334, "x": "同じNASAのページには別の書き方もあります。"}, {"t": 617.45, "x": "雲は五千から十万天文単位のあいだを"}, {"t": 620.0, "x": "占める、という書き方です。"}, {"t": 621.9666666666667, "x": "内側の端を二千とするか、五千とするか。"}, {"t": 625.3166666666667, "x": "一つのページの中でも数字が揺れています。"}, {"t": 628.0333333333333, "x": "境目がはっきりしないので、"}, {"t": 629.8, "x": "数字も幅で書くしかありません。"}, {"t": 632.05, "x": "比べるために海王星までの距離を置いてみます。"}, {"t": 635.0833333333334, "x": "ESAの説明では、海王星は"}, {"t": 637.45, "x": "太陽から約四十五億キロメートル。"}, {"t": 639.8333333333334, "x": "天文単位でいうと約三十です。"}, {"t": 642.1166666666667, "x": "地球の三十倍の遠さです。"}, {"t": 644.15, "x": "内側の端が二千天文単位なら、"}, {"t": 646.45, "x": "海王星の六十倍以上も遠くなります。"}, {"t": 649.5333333333333, "x": "外側の端が十万天文単位なら三千倍を超えます。"}, {"t": 653.2666666666667, "x": "ESAの書き方はこうです。"}, {"t": 655.0, "x": "雲は、太陽から十五兆キロメートルまで"}, {"t": 657.8833333333333, "x": "広がると考えられている。"}, {"t": 659.4833333333333, "x": "十五兆キロメートルは、太陽と地球の距離の十万倍です。"}, {"t": 663.6333333333333, "x": "NASAのハッブル宇宙望遠鏡の"}, {"t": 665.5166666666667, "x": "発表は、別の言い方をしています。"}, {"t": 668.1166666666667, "x": "雲の外側は、とても遠くまで広がっているかもしれない。"}, {"t": 671.9333333333333, "x": "いちばん近い恒星までの、少なくとも四分の一まで。"}, {"t": 675.7333333333333, "x": "別のNASAの発表では、雲は"}, {"t": 677.9166666666666, "x": "直径が一光年近い球の領域とされています。"}, {"t": 681.0333333333333, "x": "言い方は資料ごとに違います。"}, {"t": 683.1, "x": "どの言い方も、外側の端が決まっていないことを"}, {"t": 686.3166666666667, "x": "示しています。"}, {"t": 687.2333333333333, "x": "それでも遠さをつかむ手がかりはあります。"}, {"t": 689.7333333333333, "x": "いま最も遠くを飛ぶ探査機の一つは、ボイジャー1号です。"}, {"t": 693.8333333333334, "x": "NASAによると、いまの速さなら雲に"}, {"t": 696.3666666666667, "x": "入るまで約三百年かかります。"}, {"t": 698.5, "x": "雲の外側を抜けるには、三万年ほどかかるかもしれません。"}, {"t": 702.5666666666667, "x": "人類が送った最も遠い機体でも、雲の入口はまだ先です。"}, {"t": 707.0, "x": "三百年前といえば、日本は江戸時代の半ばです。"}, {"t": 710.7833333333333, "x": "それと同じ長さを、この先もう一度待つことになります。"}, {"t": 714.7166666666667, "x": "それでやっと入口です。"}, {"t": 716.3666666666667, "x": "それほど遠くを回る天体も、太陽の重力に"}, {"t": 719.7666666666667, "x": "つなぎ止められているとされます。"}, {"t": 721.5666666666667, "x": "ただし、遠くなるほど、太陽が引く力は弱くなります。"}, {"t": 725.9, "x": "どこまでが雲なのか。"}, {"t": 727.3666666666667, "x": "その線はまだ引かれていません。"}, {"t": 729.3, "x": "内側の端は二千か五千か。"}, {"t": 731.4833333333333, "x": "外側の端は一万か十万か。"}, {"t": 733.8833333333333, "x": "どの数字を選ぶかで、雲の大きさは何倍にも変わります。"}, {"t": 737.8833333333333, "x": "この回では、その幅をそのまま使います。"}, {"t": 740.8666666666667, "x": "なぜ雲の天体は一つも見えないのでしょうか。"}, {"t": 743.75, "x": "一つ目の理由は小ささです。"}, {"t": 745.6833333333333, "x": "NASAによると、彗星の核は"}, {"t": 747.8833333333333, "x": "多くが数キロメートルほどです。"}, {"t": 749.7833333333333, "x": "二つ目の理由は自分で光らないことです。"}, {"t": 752.4, "x": "彗星の核も小惑星も、太陽の光をはね返して見えています。"}, {"t": 757.0333333333333, "x": "遠くなるほど当たる太陽の光は弱くなります。"}, {"t": 760.1166666666667, "x": "はね返った光も、地球へ戻るまでにさらに弱くなります。"}, {"t": 764.1333333333333, "x": "距離が十倍になると届く明るさは一万分の一です。"}, {"t": 767.6666666666666, "x": "行きで百分の一、帰りでまた百分の一になるからです。"}, {"t": 771.7166666666667, "x": "海王星のあたりでも、数キロメートルの"}, {"t": 774.4833333333333, "x": "氷は見つけにくいものです。"}, {"t": 776.2166666666667, "x": "雲はそのさらに六十倍以上も遠くにあります。"}, {"t": 779.25, "x": "距離が六十倍なら明るさは六十の四乗分の一です。"}, {"t": 782.8166666666667, "x": "計算すると、千二百九十六万分の一になります。"}, {"t": 786.7666666666667, "x": "同じ氷の塊でも、それだけ暗く見えることになります。"}, {"t": 790.8166666666667, "x": "三つ目の理由は冷たさです。"}, {"t": 792.7333333333333, "x": "雲の中は、とても冷えています。"}, {"t": 795.1333333333333, "x": "雲のあたりの温度も、ハッブルの発表に書かれています。"}, {"t": 798.7666666666667, "x": "華氏でマイナス四百四十度ほどです。"}, {"t": 801.2333333333333, "x": "摂氏にするとマイナス二百六十度を下回ります。"}, {"t": 804.4833333333333, "x": "最も低い温度とされる絶対零度は、"}, {"t": 806.95, "x": "マイナス約二百七十三度です。"}, {"t": 809.5333333333333, "x": "雲のあたりはそこから十数度しか離れていません。"}, {"t": 812.5666666666667, "x": "これほど冷たいと、氷はガスになって噴き出しません。"}, {"t": 816.1666666666666, "x": "尾もぼんやりした頭も出しません。"}, {"t": 818.2166666666667, "x": "ただの暗い塊として、真っ暗な空間に浮かんでいます。"}, {"t": 822.1166666666667, "x": "NASAのハッブルの発表は、はっきり書いています。"}, {"t": 825.3166666666667, "x": "オールトの雲はいまも理論のままだと。"}, {"t": 827.6333333333333, "x": "雲をつくる無数の彗星は暗すぎる。"}, {"t": 830.1, "x": "そして遠すぎる。"}, {"t": 831.2666666666667, "x": "だから直接は観測できないという説明です。"}, {"t": 834.2166666666667, "x": "ではどうやって雲の天体を知るのか。"}, {"t": 836.5666666666667, "x": "答えは、雲を出て太陽へ落ちてきたときに見ることです。"}, {"t": 840.3333333333334, "x": "太陽に近づくと氷がガスになって噴き出します。"}, {"t": 843.4, "x": "ちりも一緒に広がります。"}, {"t": 845.1333333333333, "x": "小さな核が、何万キロメートルもの光の雲をまといます。"}, {"t": 849.2166666666667, "x": "その光なら地上の望遠鏡でもとらえられます。"}, {"t": 852.2833333333333, "x": "雲の天体を見る方法はいまのところ一つです。"}, {"t": 855.35, "x": "雲を出てきたものを見ることだけです。"}, {"t": 857.5333333333333, "x": "たとえるなら、中が見えない暗い森です。"}, {"t": 860.5166666666667, "x": "森から出てきた鳥だけを見て森の広さを考える。"}, {"t": 863.7333333333333, "x": "雲の研究は、それに近い形で進んできました。"}, {"t": 867.3333333333334, "x": "けれども、彗星が雲を出るには、きっかけが要ります。"}, {"t": 871.2, "x": "オールトが挙げたきっかけは近くを通る星でした。"}, {"t": 874.1666666666666, "x": "その星の一つが記録に残っています。"}, {"t": 876.6833333333333, "x": "二〇一五年二月のことです。"}, {"t": 878.7166666666667, "x": "アメリカのロチェスター大学が、"}, {"t": 880.4833333333333, "x": "一つの研究を発表しました。"}, {"t": 882.8833333333333, "x": "主役はショルツ星と呼ばれる星です。"}, {"t": 885.2166666666667, "x": "とても小さな星です。"}, {"t": 886.8, "x": "軽い星が二つ組になった、連星です。"}, {"t": 889.8333333333334, "x": "二つ合わせた重さは、太陽の約十五パーセントです。"}, {"t": 893.6666666666666, "x": "発表は、最近見つかった暗い星と書いています。"}, {"t": 897.1166666666667, "x": "いまは地球から約二十光年のところにあります。"}, {"t": 900.25, "x": "論文は天体物理学の学術誌の速報版に載りました。"}, {"t": 904.15, "x": "研究のチームは、この星の動きを過去へさかのぼりました。"}, {"t": 908.1333333333333, "x": "すると、分かったことがありました。"}, {"t": 910.5166666666667, "x": "約七万年前に、太陽のそばを通っていたのです。"}, {"t": 914.2, "x": "最も近づいたときの距離は約五万二千天文単位。"}, {"t": 917.7166666666667, "x": "約〇・八光年です。"}, {"t": 919.5166666666667, "x": "太陽系の外とはいえ、星どうしとしては近い距離です。"}, {"t": 923.3833333333333, "x": "チームは、星の動きの測りちがいも考えに入れました。"}, {"t": 927.1666666666666, "x": "ありうる道すじを一万通り計算したのです。"}, {"t": 930.1166666666667, "x": "結果は九十八パーセントでした。"}, {"t": 932.3333333333334, "x": "それだけの道すじで、星は雲の"}, {"t": 934.7666666666667, "x": "外側の部分を通り抜けていました。"}, {"t": 937.0, "x": "内側の部分まで入ったのは、"}, {"t": 938.8666666666667, "x": "一万通りのうち一つだけでした。"}, {"t": 941.3333333333334, "x": "もし内側まで入れば、彗星が"}, {"t": 943.7833333333333, "x": "まとめて降ってくることもありえた。"}, {"t": 945.6666666666666, "x": "発表はそうも書いています。"}, {"t": 947.4666666666667, "x": "けれども、ショルツ星は小さく、速く通り過ぎました。"}, {"t": 951.5166666666667, "x": "そのため、雲への影響はわずかだったと考えられています。"}, {"t": 955.5, "x": "七万年前の空にこの星は見えていたのでしょうか。"}, {"t": 958.8166666666667, "x": "ふだんはとても暗い星です。"}, {"t": 960.6166666666667, "x": "当時の人の目に見えたかどうかは、記録がありません。"}, {"t": 964.1166666666667, "x": "文字が生まれるよりずっと前のことです。"}, {"t": 966.45, "x": "七万年は人の暮らしでは気の遠くなる長さです。"}, {"t": 969.65, "x": "けれども星の動きの物差しでは、"}, {"t": 971.7333333333333, "x": "ついこのあいだのことです。"}, {"t": 973.5833333333334, "x": "確かめられているのは逆算した道すじだけです。"}, {"t": 976.6, "x": "星の速さと向きを測り、その動きを"}, {"t": 979.3333333333334, "x": "過去へ戻して計算したものです。"}, {"t": 981.2833333333333, "x": "星が雲を横切った、というのも、"}, {"t": 983.7, "x": "雲がそこにあるとしての話です。"}, {"t": 986.1, "x": "雲の外側の端は一万天文単位なのか。"}, {"t": 989.1166666666667, "x": "それとも十万天文単位なのか。"}, {"t": 991.3166666666667, "x": "それによって、五万二千という数字の意味も変わります。"}, {"t": 995.0666666666667, "x": "外側の端が十万天文単位なら、"}, {"t": 997.5, "x": "星は雲の中を通ったことになります。"}, {"t": 1000.25, "x": "一万天文単位なら雲の外を通ったことになります。"}, {"t": 1003.65, "x": "この星はもう遠ざかっています。"}, {"t": 1005.65, "x": "ではこれから来る星はあるのでしょうか。"}, {"t": 1008.0, "x": "二〇一七年八月のことです。"}, {"t": 1010.2666666666667, "x": "ESAが、天文衛星ガイアの記録を"}, {"t": 1012.9666666666667, "x": "使った研究を紹介しました。"}, {"t": 1014.9666666666667, "x": "ガイアは星の位置と動きを細かく測る衛星です。"}, {"t": 1018.2166666666667, "x": "五年の観測を予定して打ち上げられました。"}, {"t": 1020.9833333333333, "x": "この研究のころには最初の星の目録が出ていました。"}, {"t": 1024.5, "x": "十億個を超える星が載った目録です。"}, {"t": 1027.1166666666666, "x": "そのうち二百万個を超える星は、"}, {"t": 1029.25, "x": "距離と動きも測られていました。"}, {"t": 1031.5333333333333, "x": "次の目録では星の数が約二十倍になるとされていました。"}, {"t": 1035.5, "x": "さかのぼれる時間も、過去と"}, {"t": 1037.5833333333333, "x": "未来の二千五百万年に広がる見込みでした。"}, {"t": 1040.5, "x": "研究は三十万個を超える星の動きを調べました。"}, {"t": 1043.95, "x": "過去と未来の五百万年のあいだを見たのです。"}, {"t": 1046.8666666666666, "x": "その中で太陽の近くを通る星を探しました。"}, {"t": 1050.0666666666666, "x": "百五十兆キロメートル以内を"}, {"t": 1052.0, "x": "通る星は、九十七個ありました。"}, {"t": 1054.5833333333333, "x": "そのうち十六個は、約六十兆キロメートル以内まで来ます。"}, {"t": 1058.7, "x": "中でも目立つ星が一つありました。"}, {"t": 1061.0, "x": "グリーゼ七百十という星です。"}, {"t": 1063.1333333333334, "x": "いまは、まだ遠くにいます。"}, {"t": 1065.1833333333334, "x": "いまから約百三十万年後に、この星は太陽に近づきます。"}, {"t": 1069.65, "x": "最も近づくときは約二兆三千億キロメートル。"}, {"t": 1072.95, "x": "太陽と地球の距離の約一万六千倍です。"}, {"t": 1076.05, "x": "それより前の見積もりは、もっと遠くを"}, {"t": 1078.75, "x": "通るとしていました。"}, {"t": 1079.9333333333334, "x": "ガイアの記録で測りなおすと、ぐっと近くなったのです。"}, {"t": 1083.6166666666666, "x": "前の見積もりは、三兆一千億から"}, {"t": 1086.2833333333333, "x": "十三兆六千億キロメートルでした。"}, {"t": 1088.6666666666667, "x": "九十パーセントの確からしさで、という幅です。"}, {"t": 1091.9666666666667, "x": "新しい数字は、その下の端よりも近い値です。"}, {"t": 1095.6833333333334, "x": "いちばんありそうな値は二兆三千億キロメートル。"}, {"t": 1098.9333333333334, "x": "幅は、一兆五千億から三兆二千億キロメートルとされます。"}, {"t": 1103.3333333333333, "x": "この星の重さは太陽の六割ほどです。"}, {"t": 1106.05, "x": "小さな星ではありません。"}, {"t": 1107.7166666666667, "x": "近づくときの速さは時速五万キロメートル近く。"}, {"t": 1110.9, "x": "近くを通る星の平均は、時速十万キロメートルほどです。"}, {"t": 1115.1666666666667, "x": "その半分の速さでゆっくり通ることになります。"}, {"t": 1118.1666666666667, "x": "一万六千天文単位は、NASAの言う雲の範囲の中です。"}, {"t": 1122.2666666666667, "x": "ESAも、雲の範囲の十分に内側だと書いています。"}, {"t": 1125.9333333333334, "x": "星の重力が雲の彗星の道すじを乱すかもしれない。"}, {"t": 1129.5833333333333, "x": "彗星が太陽系の内側へ送り込まれるかもしれない。"}, {"t": 1133.1166666666666, "x": "地球やほかの惑星にぶつかる道に"}, {"t": 1135.3, "x": "乗る彗星も、出てくるかもしれない。"}, {"t": 1137.8333333333333, "x": "ただしESAは慎重です。"}, {"t": 1139.5833333333333, "x": "星が通っても彗星が内側へ来るとは限らない。"}, {"t": 1142.75, "x": "地球に影響が出るかどうかも分からない。"}, {"t": 1145.2833333333333, "x": "グリーゼ七百十が最も近づく、百三十万年後の話です。"}, {"t": 1149.95, "x": "遠い先です。"}, {"t": 1151.0, "x": "文字を使い始めてからの人類の歴史の、何百倍も先です。"}, {"t": 1155.4333333333334, "x": "研究によると、百万年ごとに約五百五十個の星が通ります。"}, {"t": 1160.1333333333334, "x": "百五十兆キロメートル以内を、です。"}, {"t": 1162.9, "x": "もっと近くを通るものも、平均して"}, {"t": 1165.4666666666667, "x": "約五万年に一度あるとされます。"}, {"t": 1167.5833333333333, "x": "三十兆キロメートルより近くまで来る星もあります。"}, {"t": 1170.8833333333334, "x": "百万年に約二十個とされます。"}, {"t": 1173.15, "x": "太陽は、こうした客を何度も迎えてきたことになります。"}, {"t": 1176.9833333333333, "x": "そのたびに、雲は少しずつ揺さぶられてきたと"}, {"t": 1180.0333333333333, "x": "考えられています。"}, {"t": 1181.2333333333333, "x": "近づく星の数は、これからも測りなおされていきます。"}, {"t": 1185.0, "x": "ただ、雲を揺さぶるのは、通り過ぎる"}, {"t": 1187.8833333333334, "x": "星だけではありません。"}, {"t": 1189.1666666666667, "x": "太陽は、天の川銀河という星の大きな集まりの中にいます。"}, {"t": 1193.55, "x": "太陽系は、ほかの星と一緒に銀河の中を回っています。"}, {"t": 1197.6166666666666, "x": "銀河全体の重力は、場所によって"}, {"t": 1200.1666666666667, "x": "わずかに違う引き方をします。"}, {"t": 1202.0, "x": "太陽に近い惑星には、その違いはほとんど効きません。"}, {"t": 1205.9, "x": "けれども、何千天文単位も離れた天体には効いてきます。"}, {"t": 1210.0166666666667, "x": "太陽が引く力がとても弱くなっているからです。"}, {"t": 1213.05, "x": "この違いから生まれる力を、銀河の潮汐力と呼びます。"}, {"t": 1217.0, "x": "海の満ち引きを起こす月の力と、仕組みが似ています。"}, {"t": 1220.75, "x": "月は地球の近い側と遠い側を、少し違う強さで引きます。"}, {"t": 1225.1, "x": "その差が海の水を引き伸ばすように動かします。"}, {"t": 1228.1166666666666, "x": "銀河の場合は、太陽の側と雲の"}, {"t": 1230.6666666666667, "x": "天体の側で引く強さが違います。"}, {"t": 1232.95, "x": "その差が雲の天体の軌道をじわじわと変えていきます。"}, {"t": 1236.3166666666666, "x": "NASAは、雲ができるときの話でこう書いています。"}, {"t": 1239.7166666666667, "x": "最も強く効いたのは、おそらく銀河"}, {"t": 1242.3166666666666, "x": "そのものの潮汐力だった。"}, {"t": 1244.0333333333333, "x": "この力は、遠くの天体の軌道を"}, {"t": 1246.5833333333333, "x": "長い時間をかけて変えるとされます。"}, {"t": 1248.7166666666667, "x": "天体を、惑星のそばまで戻る細長い軌道から引き離す。"}, {"t": 1252.9333333333334, "x": "そういう働きもあると考えられています。"}, {"t": 1255.55, "x": "二〇二五年、この力について新しい計算が出ました。"}, {"t": 1259.8, "x": "アメリカのサウスウエスト研究所などのチームの論文です。"}, {"t": 1263.3333333333333, "x": "論文の原稿が公開されたのは二〇二五年二月でした。"}, {"t": 1267.2166666666667, "x": "著者は八人です。"}, {"t": 1268.5666666666666, "x": "チームは計算機を使いました。"}, {"t": 1270.65, "x": "太陽系ができてからの天体の動きを、再現したのです。"}, {"t": 1274.6333333333334, "x": "海王星などの惑星が天体をはじき飛ばす。"}, {"t": 1277.6166666666666, "x": "天体は遠くまで運ばれる。"}, {"t": 1279.5, "x": "そこへ銀河の潮汐力が効いて、軌道を少しずつ動かす。"}, {"t": 1283.5833333333333, "x": "すると、雲の内側の部分に、"}, {"t": 1285.9666666666667, "x": "渦を巻くような形が現れました。"}, {"t": 1288.5833333333333, "x": "長さは約一万五千天文単位。"}, {"t": 1291.05, "x": "とても大きな渦です。"}, {"t": 1292.5166666666667, "x": "雲の内側の端と比べると、その三倍から"}, {"t": 1295.6833333333334, "x": "七倍ほどの長さです。"}, {"t": 1297.15, "x": "論文はこの形をオールトのらせんと呼んでいます。"}, {"t": 1300.2166666666667, "x": "計算ではらせんは長く残ります。"}, {"t": 1302.4833333333333, "x": "いまの雲の内側にもあるとされました。"}, {"t": 1304.9333333333334, "x": "ただしこれは計算機の中の模擬実験です。"}, {"t": 1307.75, "x": "本物のらせんを見た人はいません。"}, {"t": 1309.9333333333334, "x": "あるかどうかを決めるのはこれからの観測です。"}, {"t": 1312.75, "x": "論文自身も、観測で見つける"}, {"t": 1315.1333333333334, "x": "見込みは乏しいと書いています。"}, {"t": 1317.0, "x": "見つけるにはとても遠い天体がたくさん要ります。"}, {"t": 1319.9333333333334, "x": "そしてその並び方を調べなければなりません。"}, {"t": 1322.7833333333333, "x": "雲の形は見えないまま描きなおされ続けています。"}, {"t": 1326.05, "x": "では、雲の材料の氷は、そもそも"}, {"t": 1329.1, "x": "どこで生まれたのでしょうか。"}, {"t": 1330.6, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
