"}, {"t": 5.316666666666666, "x": "アポロ十七号です。"}, {"t": 5.316666666666666, "x": "アポロ十七号█"}, {"t": 7.316666666666666, "x": "それを最後に、月の表面には、"}, {"t": 9.733333333333333, "x": "人間の足が一度も下りていません。"}, {"t": 12.2, "x": "二〇二六年四月、四人を乗せた宇宙船が月の"}, {"t": 15.9, "x": "向こう側を回り、地球に帰ってきました。"}, {"t": 18.816666666666666, "x": "アルテミス二号です。"}, {"t": 18.816666666666666, "x": "アルテミス二号█"}, {"t": 20.7, "x": "人間が月のそばまで行ったのは、"}, {"t": 22.633333333333333, "x": "半世紀以上ぶりのことでした。"}, {"t": 24.866666666666667, "x": "ただし、この飛行ははじめから、"}, {"t": 27.1, "x": "月を回って帰るだけの計画でした。"}, {"t": 29.783333333333335, "x": "着陸はしていません。"}, {"t": 31.25, "x": "行く技術は、一度はありました。"}, {"t": 33.63333333333333, "x": "三年五か月のあいだに、六回、降りています。"}, {"t": 37.333333333333336, "x": "一九六九年七月のアポロ十一号から、"}, {"t": 40.78333333333333, "x": "十二号、十四号、十五号、十六号、十七号。"}, {"t": 46.266666666666666, "x": "途中の十三号は、事故のために月を回って"}, {"t": 49.45, "x": "引き返しましたが、それ以外はすべて着陸しています。"}, {"t": 53.0, "x": "それなのに、そのあと五十三年、誰も降りていません。"}, {"t": 57.06666666666667, "x": "この問いには、さまざまな説明が語られてきました。"}, {"t": 60.53333333333333, "x": "中には、表に出せない"}, {"t": 62.3, "x": "事情があったのではないか、というものもあります。"}, {"t": 65.4, "x": "この回は、その種の説明を取りません。"}, {"t": 68.28333333333333, "x": "確かめようのない話の代わりに、"}, {"t": 70.28333333333333, "x": "誰でも確かめられる一枚の表を開きます。"}, {"t": 73.38333333333334, "x": "理由を探すとき、人はよく、誰かの決断や、"}, {"t": 77.13333333333334, "x": "どこかの会議を思い浮かべます。"}, {"t": 79.41666666666667, "x": "けれども、国の事業が止まるときには、"}, {"t": 82.05, "x": "もっと地味な記録が先に動いていることがあります。"}, {"t": 85.38333333333334, "x": "毎年、毎年、少しずつ変わっていく、お金の数字です。"}, {"t": 90.31666666666666, "x": "アメリカ政府の予算をまとめる役所、"}, {"t": 92.8, "x": "行政管理予算局が、毎年公開している「歴史表」です。"}, {"t": 93.66666666666667, "x": "行政管理予算局█"}, {"t": 98.6, "x": "一九六二年から現在まで、国がどの機関に"}, {"t": 102.46666666666667, "x": "いくら払ったかが、一年ずつ横に並んでいます。"}, {"t": 105.75, "x": "その中の一行、アメリカ航空宇宙局、"}, {"t": 106.93333333333334, "x": "アメリカ航空宇宙局█"}, {"t": 108.81666666666666, "x": "NASAの行を、左から右へ読んでいきます。"}, {"t": 112.18333333333334, "x": "月に降りなくなった理由は、その一行の数字の"}, {"t": 115.33333333333333, "x": "並びに、かなりの部分まで書かれています。"}, {"t": 666666666, "x": "〇・七六は、国の経済全体の中での割合です。"}, {"t": 239.43333333333334, "x": "この回では、この先も、どちらの"}, {"t": 242.1, "x": "割合なのかを先に言ってから数字を読みます。"}, {"t": 244.86666666666667, "x": "では、同じ行の右の端、いちばん新しい実績の年を見ます。"}, {"t": 249.8, "x": "二〇二五年度。"}, {"t": 249.8, "x": "二〇二五年度█"}, {"t": 251.2, "x": "NASAの支出は、二百四十五億七千六百万ドル。"}, {"t": 252.7, "x": "二百四十五億七千六百万ドル█"}, {"t": 255.05, "x": "金額だけを見れば、一九六六年度の四倍を超えています。"}, {"t": 259.78333333333336, "x": "ところが、国の支出全体は、"}, {"t": 262.28333333333336, "x": "七兆百十一億ドル█"}, {"t": 262.3, "x": "七兆百十一億ドルに増えていました。"}, {"t": 265.56666666666666, "x": "割り算をすると、〇・三五パーセント。"}, {"t": 266.95, "x": "〇・三五パーセント█"}, {"t": 268.6666666666667, "x": "表には、丸めて〇・四と書かれています。"}, {"t": 271.81666666666666, "x": "GDPに対する割合では、〇・〇八一パーセント。"}, {"t": 276.05, "x": "百ドルのうち、八セントです。"}, {"t": 278.4166666666667, "x": "国の財布の中での割合で、四・四一から〇・三五へ。"}, {"t": 282.85, "x": "十二分の一を下回りました。"}, {"t": 284.95, "x": "この行を左から右へ読むと、"}, {"t": 286.95, "x": "途中にもう一つ、目につく動きがあります。"}, {"t": 290.26666666666665, "x": "二〇二〇年度と二〇二一年度は、"}, {"t": 292.78333333333336, "x": "割合が〇・三まで下がっています。"}, {"t": 295.4, "x": "NASAの金額が減ったわけではありません。"}, {"t": 297.81666666666666, "x": "二〇一九年度に四兆四千四百七十億ドルだった"}, {"t": 301.48333333333335, "x": "国の支出全体が、二〇二〇年度には"}, {"t": 304.3833333333333, "x": "六兆五千百六十八億ドルに膨らんでいました。"}, {"t": 307.6666666666667, "x": "感染症の流行に対応するための支出が重なった年です。"}, {"t": 311.56666666666666, "x": "分母が一年で一・五倍近くになったので、"}, {"t": 314.3666666666667, "x": "割合のほうが下がりました。"}, {"t": 316.45, "x": "割合という数字は、自分の大きさだけでなく、"}, {"t": 319.6666666666667, "x": "全体の大きさでも動きます。"}, {"t": 321.9, "x": "ここで、五十年あまりの行を、飛び飛びに読んでおきます。"}, {"t": 326.1166666666667, "x": "国の支出に占めるNASAの割合です。"}, {"t": 328.55, "x": "一九七五年度、〇・九八パーセント。"}, {"t": 332.3666666666667, "x": "一パーセントを初めて割りました。"}, {"t": 334.46666666666664, "x": "一九八六年度、〇・七五パーセント。"}, {"t": 338.3666666666667, "x": "一九九二年度、一・〇一パーセント。"}, {"t": 342.1166666666667, "x": "一度、一パーセントを上回っています。"}, {"t": 344.96666666666664, "x": "二〇〇〇年度、〇・七五パーセント。"}, {"t": 347.85, "x": "二〇〇九年度、〇・五四パーセント。"}, {"t": 350.95, "x": "二〇一九年度、〇・四五パーセント。"}, {  696.15, "x": "ローニアスは、二〇〇三年、学術誌に、有人宇宙飛行と"}, {"t": 701.2833333333333, "x": "世論調査についての論文を発表しています。"}, {"t": 704.3833333333333, "x": "この論文の内容として紹介されているところでは、"}, {"t": 707.4, "x": "一九六〇年代を通じて、宇宙に使うお金が"}, {"t": 711.5833333333334, "x": "多すぎると考えるアメリカ人が、四十五から"}, {"t": 714.7, "x": "六十パーセントいたとされています。"}, {"t": 716.7166666666667, "x": "そして、アポロ計画は費用に見合う"}, {"t": 719.25, "x": "価値があると答えた人が半数を超えたのは、"}, {"t": 721.7666666666667, "x": "ただ一度、アポロ十一号が月に降りた"}, {"t": 724.9166666666666, "x": "一九六九年七月の時期だけで、そのときでも"}, {"t": 728.7666666666667, "x": "五十三パーセントだったとされています。"}, {"t": 730.95, "x": "人類が初めて月に立った月でさえ、"}, {"t": 733.2833333333333, "x": "半分をわずかに超えただけでした。"}, {"t": 735.65, "x": "ギャラップの同じ記事には、もう一つ、"}, {"t": 738.1833333333333, "x": "着陸の直後の調査が載っています。"}, {"t": 740.8833333333333, "x": "一九六九年七月二十四日から二十九日。"}, {"t": 744.8166666666667, "x": "アポロ十一号の乗員が地球に"}, {"t": 746.9333333333333, "x": "帰ってきた、まさにその週です。"}, {"t": 749.2666666666667, "x": "次は人間を火星に着陸させる、そのための"}, {"t": 752.5333333333333, "x": "費用を出すことに賛成か、反対か。"}, {"t": 755.3, "x": "賛成は三十九パーセント。"}, {"t": 755.9333333333333, "x": "三十九パーセント█"}, {"t": 757.8666666666667, "x": "反対は五十三パーセントでした。"}, {"t": 758.5, "x": "五十三パーセント█"}, {"t": 761.05, "x": "月に降りた直後の週に、次の目的地への"}, {"t": 764.2166666666667, "x": "お金には、半数を超える人が反対していました。"}, {"t": 767.5833333333334, "x": "世論調査の数字には、聞き方に"}, {"t": 770.0666666666667, "x": "よって答えが変わるという弱点があります。"}, {"t": 772.5, "x": "「費用に見合うか」と聞くか、「宇宙開発を"}, {"t": 775.7833333333333, "x": "支持するか」と聞くかで、同じ人でも答えが変わります。"}, {"t": 779.8666666666667, "x": "それでも、費用という言葉が入った問いに、"}, {"t": 782.7333333333333, "x": "一九六〇年代のアメリカ人の多くが、"}, {"t": 785.9333333333333, "x": "はっきりとは賛成しなかった。"}, {"t": 788.0, "x": "この点では、ギャラップの記事と、ローニアスの"}, {"t": 791.2333333333333, "x": "論文の紹介は、同じ方向を向いています。"}, {"t": 794.4166666666666, "x": "この数字は、この回にとって大事な意味を持っています。"}, {"t": 798.05, "x": "もし、国民がこぞって月を求めていたのなら、"}, {"t": 801.2333333333333, "x": "予算が減っていく理由を、どこか"}, {"t": 803.7833333333333, "x": "別の場所に探さなければなりません。"}, {"t": 805.9333333333333, "x": "何かが隠されたのではないか、という説明が"}, {"t": 809.0833333333334, const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
