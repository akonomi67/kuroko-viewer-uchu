<script>
const D={"name": "ep005", "file": "ep005", "dur": 2076.05, "segs": [], "subs": [{"t": 0.0, "x": "一九七二年十二月、月面から"}, {"t": 0.0, "x": "一九七二年十二月█"}, {"t": 3.316666666666667, "x": "一機の上昇段が飛び立ちました。"}, {"t": 5.316666666666666, "x": "アポロ十七号です。"}, {"t": 5.316666666666666, "x": "アポロ十七号█"}, {"t": 6.85, "x": "それを最後に、月の表面には、"}, {"t": 9.266666666666667, "x": "人間の足が一度も下りていません。"}, {"t": 11.733333333333333, "x": "二〇二六年四月、四人を乗せた宇宙船が月の"}, {"t": 15.433333333333334, "x": "向こう側を回り、地球に帰ってきました。"}, {"t": 18.35, "x": "アルテミス二号です。"}, {"t": 18.35, "x": "アルテミス二号█"}, {"t": 19.75, "x": "人間が月のそばまで行ったのは、"}, {"t": 21.683333333333334, "x": "半世紀以上ぶりのことでした。"}, {"t": 23.916666666666668, "x": "ただし、この飛行ははじめから、"}, {"t": 26.15, "x": "月を回って帰るだけの計画でした。"}, {"t": 28.833333333333332, "x": "着陸はしていません。"}, {"t": 30.3, "x": "行く技術は、一度はありました。"}, {"t": 32.68333333333333, "x": "三年五か月のあいだに、六回、降りています。"}, {"t": 36.38333333333333, "x": "一九六九年七月のアポロ十一号から、"}, {"t": 39.833333333333336, "x": "十二号、十四号、十五号、十六号、十七号。"}, {"t": 45.31666666666667, "x": "途中の十三号は、事故のために月を回って"}, {"t": 48.5, "x": "引き返しましたが、それ以外はすべて着陸しています。"}, {"t": 52.05, "x": "それなのに、そのあと五十三年、誰も降りていません。"}, {"t": 56.11666666666667, "x": "この問いには、さまざまな説明が語られてきました。"}, {"t": 59.583333333333336, "x": "中には、表に出せない"}, {"t": 61.35, "x": "事情があったのではないか、というものもあります。"}, {"t": 64.45, "x": "この回は、その種の説明を取りません。"}, {"t": 67.33333333333333, "x": "確かめようのない話の代わりに、"}, {"t": 69.33333333333333, "x": "誰でも確かめられる一枚の表を開きます。"}, {"t": 72.43333333333334, "x": "理由を探すとき、人はよく、誰かの決断や、"}, {"t": 76.18333333333334, "x": "どこかの会議を思い浮かべます。"}, {"t": 78.46666666666667, "x": "けれども、国の事業が止まるときには、"}, {"t": 81.1, "x": "もっと地味な記録が先に動いていることがあります。"}, {"t": 84.43333333333334, "x": "毎年、毎年、少しずつ変わっていく、お金の数字です。"}, {"t": 89.36666666666666, "x": "アメリカ政府の予算をまとめる役所、"}, {"t": 91.66666666666667, "x": "行政管理予算局が、毎年公開している「歴史表」です。"}, {"t": 92.48333333333333, "x": "行政管理予算局█"}, {"t": 97.06666666666666, "x": "一九六二年から現在まで、国がどの機関に"}, {"t": 100.93333333333334, "x": "いくら払ったかが、一年ずつ横に並んでいます。"}, {"t": 104.21666666666667, "x": "その中の一行、アメリカ航空宇宙局、"}, {"t": 105.41666666666667, "x": "アメリカ航空宇宙局█"}, {"t": 107.36666666666666, "x": "NASAの行を、左から右へ読んでいきます。"}, {"t": 110.73333333333333, "x": "月に降りなくなった理由は、その一行の数字の"}, {"t": 113.96666666666667, "x": "並びに、かなりの部分まで書かれています。"}, {"t": 116.75, "x": "月の話になると、よく引かれる数字があります。"}, {"t": 120.11666666666666, "x": "アポロ計画のころ、NASAは国の予算の四・"}, {"t": 122.88333333333334, "x": "四・四パーセント█"}, {"t": 123.13333333333334, "x": "四パーセントを使っていた、という数字です。"}, {"t": 126.25, "x": "まず、これを表で確かめます。"}, {"t": 128.63333333333333, "x": "行政管理予算局の歴史表、表四・二。"}, {"t": 132.11666666666667, "x": "国の支出全体を百としたとき、それぞれの機関が"}, {"t": 135.7, "x": "いくつを占めていたかを、一年ずつ並べた表です。"}, {"t": 139.03333333333333, "x": "NASAの行の、一九六六年度の欄に、四・四とあります。"}, {"t": 140.56666666666666, "x": "一九六六年度█"}, {"t": 144.2, "x": "ここでいう支出とは、議会が「使ってよい」と決めた"}, {"t": 148.25, "x": "額ではなく、その年に実際に払われたお金のことです。"}, {"t": 152.16666666666666, "x": "二つは年によって少しずれます。"}, {"t": 154.35, "x": "この回では、実際に払われた額のほうで、"}, {"t": 157.41666666666666, "x": "すべてをそろえて読みます。"}, {"t": 159.31666666666666, "x": "隣の表四・一で、金額を見ます。"}, {"t": 162.31666666666666, "x": "一九六六年度のNASAの支出は、五十九億三千三百万ドル。"}, {"t": 165.35, "x": "五十九億三千三百万ドル█"}, {"t": 167.61666666666667, "x": "同じ年の国の支出全体は、千三百四十五億三千二百万ドル。"}, {"t": 172.75, "x": "割り算をすると、四・四一パーセントになります。"}, {"t": 176.3, "x": "表の四・四は、この数字を丸めたものです。"}, {"t": 179.71666666666667, "x": "ここで、一つはっきりさせておくことがあります。"}, {"t": 182.78333333333333, "x": "この四・四パーセントは、ときどき「GDPの"}, {"t": 186.51666666666668, "x": "四・四パーセント」と紹介されています。"}, {"t": 189.51666666666668, "x": "これは取り違えです。"}, {"t": 190.91666666666666, "x": "GDPは、国の中で一年間に"}, {"t": 193.65, "x": "生み出されたものの値打ちの合計です。"}, {"t": 195.88333333333333, "x": "国の支出は、そのうち政府が使った分にすぎません。"}, {"t": 199.5, "x": "大きさがまるで違います。"}, {"t": 201.2, "x": "同じ歴史表の表十・一に、一年ごとの"}, {"t": 204.56666666666666, "x": "GDPが載っています。"}, {"t": 206.1, "x": "一九六六年度は、七千八百四億七千五百万ドル。"}, {"t": 211.1, "x": "NASAの五十九億ドルをこれで割ると、"}, {"t": 213.43333333333334, "x": "〇・七六パーセントになります。"}, {"t": 213.8, "x": "〇・七六パーセント█"}, {"t": 215.91666666666666, "x": "表に書いてある数字ではなく、表の"}, {"t": 218.51666666666668, "x": "数字を使ってこの回で割り算した値です。"}, {"t": 221.23333333333332, "x": "アメリカの経済全体から見れば、NASAがいちばん多くを"}, {"t": 224.93333333333334, "x": "使った年でも、百ドルのうち七十六セントでした。"}, {"t": 228.46666666666667, "x": "四・四は、国の財布の中での割合です。"}, {"t": 231.86666666666667, "x": "〇・七六は、国の経済全体の中での割合です。"}, {"t": 235.88333333333333, "x": "この回では、この先も、どちらの"}, {"t": 238.55, "x": "割合なのかを先に言ってから数字を読みます。"}, {"t": 241.31666666666666, "x": "では、同じ行の右の端、いちばん新しい実績の年を見ます。"}, {"t": 246.25, "x": "二〇二五年度。"}, {"t": 246.25, "x": "二〇二五年度█"}, {"t": 247.65, "x": "NASAの支出は、二百四十五億七千六百万ドル。"}, {"t": 249.15, "x": "二百四十五億七千六百万ドル█"}, {"t": 251.5, "x": "金額だけを見れば、一九六六年度の四倍を超えています。"}, {"t": 256.23333333333335, "x": "ところが、国の支出全体は、"}, {"t": 258.53333333333336, "x": "七兆百十一億ドルに増えていました。"}, {"t": 258.53333333333336, "x": "七兆百十一億ドル█"}, {"t": 261.53333333333336, "x": "割り算をすると、〇・三五パーセント。"}, {"t": 262.9166666666667, "x": "〇・三五パーセント█"}, {"t": 264.6333333333333, "x": "表には、丸めて〇・四と書かれています。"}, {"t": 267.78333333333336, "x": "GDPに対する割合では、〇・〇八一パーセント。"}, {"t": 272.01666666666665, "x": "百ドルのうち、八セントです。"}, {"t": 274.3833333333333, "x": "国の財布の中での割合で、四・四一から〇・三五へ。"}, {"t": 278.81666666666666, "x": "十二分の一を下回りました。"}, {"t": 280.9166666666667, "x": "この行を左から右へ読むと、"}, {"t": 282.9166666666667, "x": "途中にもう一つ、目につく動きがあります。"}, {"t": 286.23333333333335, "x": "二〇二〇年度と二〇二一年度は、"}, {"t": 288.75, "x": "割合が〇・三まで下がっています。"}, {"t": 291.3666666666667, "x": "NASAの金額が減ったわけではありません。"}, {"t": 293.78333333333336, "x": "二〇一九年度に四兆四千四百七十億ドルだった"}, {"t": 297.45, "x": "国の支出全体が、二〇二〇年度には"}, {"t": 300.35, "x": "六兆五千百六十八億ドルに膨らんでいました。"}, {"t": 303.6333333333333, "x": "感染症の流行に対応するための支出が重なった年です。"}, {"t": 307.53333333333336, "x": "分母が一年で一・五倍近くになったので、"}, {"t": 310.3333333333333, "x": "割合のほうが下がりました。"}, {"t": 312.4166666666667, "x": "割合という数字は、自分の大きさだけでなく、"}, {"t": 315.6333333333333, "x": "全体の大きさでも動きます。"}, {"t": 317.8666666666667, "x": "ここで、五十年あまりの行を、飛び飛びに読んでおきます。"}, {"t": 322.0833333333333, "x": "国の支出に占めるNASAの割合です。"}, {"t": 324.51666666666665, "x": "一九七五年度、〇・九八パーセント。"}, {"t": 328.3333333333333, "x": "一パーセントを初めて割りました。"}, {"t": 330.43333333333334, "x": "一九八六年度、〇・七五パーセント。"}, {"t": 334.3333333333333, "x": "一九九二年度、一・〇一パーセント。"}, {"t": 338.0833333333333, "x": "一度、一パーセントを上回っています。"}, {"t": 340.93333333333334, "x": "二〇〇〇年度、〇・七五パーセント。"}, {"t": 343.81666666666666, "x": "二〇〇九年度、〇・五四パーセント。"}, {"t": 346.9166666666667, "x": "二〇一九年度、〇・四五パーセント。"}, {"t": 350.26666666666665, "x": "そして、二〇二五年度の〇・三五パーセント。"}, {"t": 354.05, "x": "途中で少し持ち直す年はあっても、"}, {"t": 356.26666666666665, "x": "行全体としては、右へ行くほど低くなっていきます。"}, {"t": 360.1333333333333, "x": "急な崖は、はじめの十年に一度あるだけで、"}, {"t": 363.26666666666665, "x": "そのあとは、なだらかな下り坂が五十年続いています。"}, {"t": 367.31666666666666, "x": "この点は、この回の後半で、"}, {"t": 369.65, "x": "もう一度、もっと大きな形で出てきます。"}, {"t": 372.9, "x": "その前に、一九六六年度という一つの年に、なぜ国の"}, {"t": 377.78333333333336, "x": "財布の四パーセントあまりが、月に向けられたのか。"}, {"t": 381.1, "x": "そこから見ていきます。"}, {"t": 382.48333333333335, "x": "表の左の端、一九六二年度から読みます。"}, {"t": 386.53333333333336, "x": "NASAの支出は、十二億五千七百万ドル。"}, {"t": 388.03333333333336, "x": "十二億五千七百万ドル█"}, {"t": 389.85, "x": "国の支出の一・二パーセントでした。"}, {"t": 392.26666666666665, "x": "一九六三年度、二十五億五千二百万ドル。"}, {"t": 396.43333333333334, "x": "二・三パーセント。"}, {"t": 397.93333333333334, "x": "一九六四年度、四十一億七千百万ドル。"}, {"t": 402.21666666666664, "x": "三・五パーセント。"}, {"t": 403.68333333333334, "x": "一九六五年度、五十億九千二百万ドル。"}, {"t": 407.75, "x": "四・三パーセント。"}, {"t": 409.25, "x": "一九六六年度、五十九億三千三百万ドル。"}, {"t": 413.71666666666664, "x": "四・四パーセント。"}, {"t": 415.21666666666664, "x": "四年で、金額は四・七倍になりました。"}, {"t": 416.45, "x": "四・七倍█"}, {"t": 418.4, "x": "割合は、毎年一段ずつ階段を上るように増えています。"}, {"t": 422.53333333333336, "x": "ふつうの役所の予算は、こういう増え方をしません。"}, {"t": 426.05, "x": "何がそうさせたのかを、記録でさかのぼります。"}, {"t": 429.23333333333335, "x": "一九五七年、ソビエト連邦が、世界で初めての"}, {"t": 429.23333333333335, "x": "一九五七年█"}, {"t": 433.75, "x": "人工衛星、スプートニクを打ち上げました。"}, {"t": 434.03333333333336, "x": "スプートニク█"}, {"t": 436.8, "x": "一九六一年四月十二日、ソビエトのユーリイ・"}, {"t": 436.8, "x": "一九六一年四月十二日█"}, {"t": 439.48333333333335, "x": "ユーリイ・ガガーリン█"}, {"t": 440.85, "x": "ガガーリンが、人類で初めて宇宙を飛びました。"}, {"t": 444.01666666666665, "x": "同じ四月の半ば、アメリカは、キューバの"}, {"t": 447.03333333333336, "x": "ピッグス湾█"}, {"t": 447.1333333333333, "x": "ピッグス湾で試みた上陸作戦に失敗しています。"}, {"t": 450.53333333333336, "x": "五月五日、アラン・シェパードが、"}, {"t": 450.53333333333336, "x": "五月五日█"}, {"t": 451.25, "x": "アラン・シェパード█"}, {"t": 452.76666666666665, "x": "アメリカ人として初めて宇宙へ出ました。"}, {"t": 455.5833333333333, "x": "ただし、地球を回る軌道には乗らず、打ち上げられて、"}, {"t": 459.68333333333334, "x": "そのまま海へ降りてくる短い飛行でした。"}, {"t": 462.5833333333333, "x": "人間を宇宙に送ることでも、アメリカは二番目でした。"}, {"t": 466.3, "x": "その二十日後です。"}, {"t": 467.56666666666666, "x": "一九六一年五月二十五日、ケネディ大統領は"}, {"t": 467.56666666666666, "x": "一九六一年五月二十五日█"}, {"t": 471.8333333333333, "x": "議会で、「緊急の国家的必要」と"}, {"t": 474.8666666666667, "x": "題した特別教書を読み上げました。"}, {"t": 477.03333333333336, "x": "宇宙の部分には、のちに何度も引用される一文があります。"}, {"t": 481.1166666666667, "x": "この国は、この十年が終わる前に、人間を"}, {"t": 484.6, "x": "月に着陸させ、無事に地球へ帰すという目標の"}, {"t": 488.15, "x": "達成に、身を投じるべきだと、私は信じる。"}, {"t": 491.8, "x": "同じ教書には、こういう一文も続いています。"}, {"t": 495.18333333333334, "x": "この時期のどの宇宙計画も、これほど人類に"}, {"t": 498.26666666666665, "x": "強い印象を与えるものはなく、宇宙の長い"}, {"t": 501.3833333333333, "x": "探査にとって、これほど重要なものもない。"}, {"t": 504.25, "x": "そして、これほど難しく、これほど"}, {"t": 507.23333333333335, "x": "費用のかかるものもない。"}, {"t": 508.65, "x": "費用のかかる計画だということを、提案した"}, {"t": 511.6666666666667, "x": "本人が、提案と同じ文書の中で認めていました。"}, {"t": 515.25, "x": "金額の見積もりも、書かれています。"}, {"t": 517.9, "x": "一九六二年度に、五億三千百万ドルの上乗せ。"}, {"t": 519.5833333333334, "x": "五億三千百万ドル█"}, {"t": 522.3, "x": "さらにその後の五年間で、七十億から"}, {"t": 524.3166666666667, "x": "七十億から九十億ドル█"}, {"t": 525.2666666666667, "x": "九十億ドルの追加が見込まれる、と。"}, {"t": 528.0333333333333, "x": "議会は、それを認めました。"}, {"t": 530.25, "x": "表の階段は、このあと始まります。"}, {"t": 532.9833333333333, "x": "教書が出たあとの一九六二年度から"}, {"t": 535.7333333333333, "x": "一九六六年度まで、五年間のNASAの支出を"}, {"t": 539.5166666666667, "x": "表から足し合わせると、百九十億ドルあまりになります。"}, {"t": 543.4, "x": "これはアポロだけでなく、NASA全体の支出です。"}, {"t": 546.7666666666667, "x": "ケネディの見積もりは、それまでの予算への"}, {"t": 549.4833333333333, "x": "上乗せ分の数字なので、そのまま比べることはできません。"}, {"t": 553.2666666666667, "x": "ただ、五年間で国が宇宙に払った額が、"}, {"t": 556.2, "x": "見積もりの上乗せ分の倍を超える"}, {"t": 558.5666666666667, "x": "大きさになっていたことは、表から読み取れます。"}, {"t": 561.6, "x": "NASAの歴史部門は、この決定の背景を、"}, {"t": 564.6166666666667, "x": "スプートニクの衝撃、ガガーリンの飛行、"}, {"t": 567.7333333333333, "x": "ピッグス湾の失敗、そしてシェパードの"}, {"t": 570.5833333333334, "x": "飛行という順番で並べています。"}, {"t": 572.5833333333334, "x": "どれも、月そのものの話ではありません。"}, {"t": 575.3833333333333, "x": "先に行かれた、失敗した、二番目だった、という"}, {"t": 579.4166666666666, "x": "出来事の並びです。"}, {"t": 580.6666666666666, "x": "月に行く理由は、月の上にあったのではなく、"}, {"t": 583.7666666666667, "x": "地球の上の競争の中にあった。"}, {"t": 586.2333333333333, "x": "少なくとも、お金が動き始めた順番は、そう読めます。"}, {"t": 590.45, "x": "こうして動き始めた事業は、"}, {"t": 592.25, "x": "非常に大きなものになりました。"}, {"t": 594.55, "x": "最も多い時期には、NASAの職員と、仕事を"}, {"t": 598.0833333333334, "x": "請け負った企業の人員を合わせて、およそ四十万人が"}, {"t": 600.4666666666667, "x": "四十万人█"}, {"t": 601.7166666666667, "x": "この事業に関わっていたとされています。"}, {"t": 604.0166666666667, "x": "のちにアポロ計画の費用を組み立て直した研究者の"}, {"t": 607.2166666666667, "x": "計算では、この時期に宇宙計画に使われた"}, {"t": 610.3, "x": "お金の、五ドルのうち三ドルが、アポロとそれに"}, {"t": 613.6833333333333, "x": "つながる計画に向けられていたとされています。"}, {"t": 616.2666666666667, "x": "ここで一つ、次の章へ持ち越す問いがあります。"}, {"t": 619.5666666666667, "x": "国の財布の四パーセントあまりを、ひとつの役所に回す。"}, {"t": 623.45, "x": "その決定を、お金を出していた"}, {"t": 625.6333333333333, "x": "国民の側は、どう見ていたのか。"}, {"t": 628.05, "x": "アポロのころのアメリカは、国じゅうが月に熱中していた。"}, {"t": 631.8, "x": "そういう思い出話は、よく語られます。"}, {"t": 634.75, "x": "世論調査の記録は、それとは少し違うことを書いています。"}, {"t": 638.7333333333333, "x": "調査会社ギャラップは、一九九九年、"}, {"t": 639.4166666666666, "x": "ギャラップ█"}, {"t": 642.0333333333333, "x": "アポロ十一号の着陸から三十年の節目に、"}, {"t": 645.5166666666667, "x": "過去の調査をまとめた記事を出しています。"}, {"t": 648.2666666666667, "x": "その中に、一九六五年の調査が引かれています。"}, {"t": 652.3333333333334, "x": "月に最初に着く国になるため、費用がいくらかかろうと、"}, {"t": 656.1, "x": "アメリカはできることを何でもすべきだと思うか。"}, {"t": 659.2666666666667, "x": "そう考えると答えたのは、三十九パーセントでした。"}, {"t": 661.1333333333333, "x": "三十九パーセント█"}, {"t": 662.9833333333333, "x": "費用に糸目をつけずに一番を取りにいく。"}, {"t": 665.7, "x": "その考えを支持していたのは、"}, {"t": 667.4666666666667, "x": "五人に二人に届かなかったことになります。"}, {"t": 670.3666666666667, "x": "同じ記事は、一九六〇年代の調査の多くで、"}, {"t": 674.0833333333334, "x": "月に人を送るための出費は、それに見合う価値があると"}, {"t": 677.9333333333333, "x": "答えた人が、半数に届かなかったと書いています。"}, {"t": 681.25, "x": "アメリカの宇宙開発の歴史を研究してきたロジャー・"}, {"t": 684.15, "x": "ロジャー・ローニアス█"}, {"t": 684.3166666666667, "x": "ローニアスは、二〇〇三年、学術誌に、有人宇宙飛行と"}, {"t": 688.9833333333333, "x": "世論調査についての論文を発表しています。"}, {"t": 691.8, "x": "この論文の内容として紹介されているところでは、"}, {"t": 694.8166666666667, "x": "一九六〇年代を通じて、宇宙に使うお金が"}, {"t": 699.0, "x": "多すぎると考えるアメリカ人が、四十五から"}, {"t": 702.1166666666667, "x": "六十パーセントいたとされています。"}, {"t": 704.1333333333333, "x": "そして、アポロ計画は費用に見合う"}, {"t": 706.6666666666666, "x": "価値があると答えた人が半数を超えたのは、"}, {"t": 709.1833333333333, "x": "ただ一度、アポロ十一号が月に降りた"}, {"t": 712.3333333333334, "x": "一九六九年七月の時期だけで、そのときでも"}, {"t": 716.1833333333333, "x": "五十三パーセントだったとされています。"}, {"t": 718.3666666666667, "x": "人類が初めて月に立った月でさえ、"}, {"t": 720.7, "x": "半分をわずかに超えただけでした。"}, {"t": 723.0666666666667, "x": "ギャラップの同じ記事には、もう一つ、"}, {"t": 725.6, "x": "着陸の直後の調査が載っています。"}, {"t": 728.3, "x": "一九六九年七月二十四日から二十九日。"}, {"t": 732.2333333333333, "x": "アポロ十一号の乗員が地球に"}, {"t": 734.35, "x": "帰ってきた、まさにその週です。"}, {"t": 736.6833333333333, "x": "次は人間を火星に着陸させる、そのための"}, {"t": 739.95, "x": "費用を出すことに賛成か、反対か。"}, {"t": 742.7166666666667, "x": "賛成は三十九パーセント。"}, {"t": 743.25, "x": "三十九パーセント█"}, {"t": 744.8333333333334, "x": "反対は五十三パーセントでした。"}, {"t": 745.2666666666667, "x": "五十三パーセント█"}, {"t": 747.0, "x": "月に降りた直後の週に、次の目的地への"}, {"t": 750.1666666666666, "x": "お金には、半数を超える人が反対していました。"}, {"t": 753.5333333333333, "x": "世論調査の数字には、聞き方に"}, {"t": 756.0166666666667, "x": "よって答えが変わるという弱点があります。"}, {"t": 758.45, "x": "「費用に見合うか」と聞くか、「宇宙開発を"}, {"t": 761.7333333333333, "x": "支持するか」と聞くかで、同じ人でも答えが変わります。"}, {"t": 765.8166666666667, "x": "それでも、費用という言葉が入った問いに、"}, {"t": 768.6833333333333, "x": "一九六〇年代のアメリカ人の多くが、"}, {"t": 771.8833333333333, "x": "はっきりとは賛成しなかった。"}, {"t": 773.95, "x": "この点では、ギャラップの記事と、ローニアスの"}, {"t": 777.1833333333333, "x": "論文の紹介は、同じ方向を向いています。"}, {"t": 780.3666666666667, "x": "この数字は、この回にとって大事な意味を持っています。"}, {"t": 784.0, "x": "もし、国民がこぞって月を求めていたのなら、"}, {"t": 787.1833333333333, "x": "予算が減っていく理由を、どこか"}, {"t": 789.7333333333333, "x": "別の場所に探さなければなりません。"}, {"t": 791.8833333333333, "x": "何かが隠されたのではないか、という説明が"}, {"t": 795.0333333333333, "x": "生まれる余地も、そこにあります。"}, {"t": 797.1666666666666, "x": "けれども、記録が示しているのは逆の姿です。"}, {"t": 800.55, "x": "お金を出していた側の半分前後は、"}, {"t": 802.8333333333334, "x": "はじめから、出しすぎだと考えていました。"}, {"t": 806.0, "x": "では、そういう中で、なぜ予算は"}, {"t": 808.6833333333333, "x": "四年で四・七倍にまで増えたのか。"}, {"t": 811.0166666666667, "x": "前の章で見た順番を思い出すと、答えの形が見えてきます。"}, {"t": 815.35, "x": "スプートニク、ガガーリン、ピッグス湾、シェパード。"}, {"t": 819.4166666666666, "x": "お金を動かしたのは、月への熱意というより、"}, {"t": 822.5666666666667, "x": "競争に負けているという感覚でした。"}, {"t": 825.2166666666667, "x": "ケネディの教書が「先に」という言葉の"}, {"t": 828.2, "x": "代わりに「この十年が終わる前に」という"}, {"t": 831.3166666666667, "x": "期限をつけたのも、競争の言葉です。"}, {"t": 834.0, "x": "期限つきの競争には、終わりがあります。"}, {"t": 836.8333333333334, "x": "誰かが先に着けば、競争は終わります。"}, {"t": 839.7833333333333, "x": "そして競争が終わったとき、"}, {"t": 841.4333333333333, "x": "半分前後が出しすぎだと考えていた出費を、"}, {"t": 844.6666666666666, "x": "同じ額で続ける理由も、一緒に弱くなります。"}, {"t": 848.4, "x": "この見方は、ここまでの記録からの読み取りであって、"}, {"t": 851.8166666666667, "x": "当時の誰かがそう書き残した結論ではありません。"}, {"t": 855.1833333333333, "x": "ただ、次の章で見る数字の動きは、"}, {"t": 857.7833333333333, "x": "この読み取りと、よく合っています。"}, {"t": 860.4333333333333, "x": "歴史表のNASAの行を、一九六六年度から先へ読みます。"}, {"t": 865.2, "x": "一九六七年度、五十四億二千五百万ドル。"}, {"t": 869.4833333333333, "x": "三・四パーセント。"}, {"t": 871.0166666666667, "x": "一九六八年度、四十七億二千二百万ドル。"}, {"t": 875.35, "x": "二・七パーセント。"}, {"t": 876.8833333333333, "x": "一九六九年度、四十二億五千百万ドル。"}, {"t": 881.0166666666667, "x": "二・三パーセント。"}, {"t": 882.5166666666667, "x": "NASAの支出は、一九六六年度を"}, {"t": 884.0833333333334, "x": "一九六六年度█"}, {"t": 885.5833333333334, "x": "頂点に、もう下がり始めています。"}, {"t": 66, "x": "オーガスティン委員会█"}, {"t": 1562.2833333333333, "x": "呼ばれています。"}, {"t": 1563.1833333333334, "x": "委員会は、二〇〇九年十月二十二日付けで"}, {"t": 1564.0166666666667, "x": "二〇〇九年十月二十二日█"}, {"t": 1566.55, "x": "最終報告書をまとめました。"}, {"t": 1568.4666666666667, "x": "表題は、「偉大な国にふさわしい"}, {"t": 1570.95, "x": "有人宇宙飛行計画を求めて」。"}, {"t": 1573.1666666666667, "x": "その本文には、こう書かれています。"}, {"t": 1575.7333333333333, "x": "アメリカの有人宇宙飛行計画は、"}, {"t": 1578.0166666666667, "x": "持続できない軌道の上にあるように見える。"}, {"t": 1580.8666666666666, "x": "割り当てられた資源に見合わない目標を"}, {"t": 1583.2666666666667, "x": "追い続けるという、危ういやり方を続けている。"}, {"t": 1586.4, "x": "宇宙での仕事は、人間がこれまでに手がけた中でも、"}, {"t": 1589.9666666666667, "x": "最も厳しく、失敗を許さないものの一つだ。"}, {"t": 1593.75, "x": "本当に、ロケットの科学なのだ。"}, {"t": 1596.2166666666667, "x": "そして、手段が望みに見合っていないとき、"}, {"t": 1599.1333333333334, "x": "宇宙での仕事は、なおさら難しくなる。"}, {"t": 1602.3666666666666, "x": "そして、結論の一つとして、こう書いています。"}, {"t": 1606.0, "x": "委員会は、有人宇宙飛行のこれからについて、"}, {"t": 1609.4, "x": "五つの選択肢を並べて検討しています。"}, {"t": 1612.45, "x": "その上での結論です。"}, {"t": 1614.05, "x": "二〇一〇年度の予算の見通しのもとでは、地球を"}, {"t": 1617.4166666666667, "x": "回る低い軌道より先への有人探査は、成り立たない。"}, {"t": 1621.1166666666666, "x": "どうすれば成り立つのかも、報告書は書いています。"}, {"t": 1624.4833333333333, "x": "意味のある有人探査は、実際の購買力で、年に"}, {"t": 1628.05, "x": "およそ三十億ドル█"}, {"t": 1628.4666666666667, "x": "およそ三十億ドルを上乗せすれば可能になる、と。"}, {"t": 1631.9666666666667, "x": "二〇〇九年度のNASAの支出は、"}, {"t": 1633.9, "x": "百九十一億六千八百万ドル。"}, {"t": 1636.8, "x": "国の支出の〇・五四パーセントです。"}, {"t": 1639.4666666666667, "x": "委員会が求めた年三十億ドルは、"}, {"t": 1641.8166666666666, "x": "その一割半あまりにあたります。"}, {"t": 1644.1666666666667, "x": "その上乗せも、表には現れていません。"}, {"t": 1647.0333333333333, "x": "二〇一〇年二月一日、オバマ政権は予算案の中で、"}, {"t": 1651.1, "x": "コンステレーション計画の中止を打ち出しました。"}, {"t": 1654.2166666666667, "x": "同じ年の十月、議会が通した法律によって、"}, {"t": 1657.75, "x": "計画は正式に打ち切られたとされています。"}, {"t": 1660.7333333333333, "x": "それまでに使われた額は、"}, {"t": 1662.3833333333334, "x": "およそ九十億ドルだったとされています。"}, {"t": 1665.2, "x": "ここまでの二度を並べてみます。"}, {"t": 1667.1333333333334, "x": "一九八九年。"}, {"t": 1668.9666666666667, "x": "月へ戻るという目標が示され、およそ五千億ドルという"}, {"t": 1672.9666666666667, "x": "見積もりが出て、その額は積まれなかった。"}, {"t": 1675.8, "x": "二〇〇四年。"}, {"t": 1676.7333333333333, "x": "二〇二〇年までに戻るという目標が示され、"}, {"t": 1679.7166666666667, "x": "開発が始まり、五年後に、目標に見合う"}, {"t": 1683.5333333333333, "x": "予算がないと報告され、打ち切られた。"}, {"t": 1686.2333333333333, "x": "どちらも、目標は、大統領の"}, {"t": 1688.9833333333333, "x": "言葉で、はっきり示されています。"}, {"t": 1691.35, "x": "そして、どちらも、目標の大きさに見合う"}, {"t": 1694.5833333333333, "x": "数字は、歴史表の行に現れていません。"}, {"t": 1697.6166666666666, "x": "オーガスティン委員会の言葉を借りれば、目標と"}, {"t": 1700.7666666666667, "x": "資源が見合っていなかった、ということになります。"}, {"t": 1703.8666666666666, "x": "一九六一年のケネディの教書は、目標と"}, {"t": 1707.55, "x": "一緒に、七十億から九十億ドルという上乗せの"}, {"t": 1711.1, "x": "見積もりを出し、議会がそれを認めました。"}, {"t": 1714.05, "x": "表には、四年で四・七倍という階段が刻まれています。"}, {"t": 1718.1333333333334, "x": "目標を言うことと、目標の分のお金を積むこと。"}, {"t": 1721.7833333333333, "x": "アポロのときは、その二つがそろっていました。"}, {"t": 1724.8166666666666, "x": "その後の二度は、前の一つしかありませんでした。"}, {"t": 1728.1, "x": "そして三度目の計画が、いま動いています。"}, {"t": 1731.2333333333333, "x": "三度目の計画の名前は、アルテミスです。"}, {"t": 1733.0166666666667, "x": "アルテミス█"}, {"t": 1734.3166666666666, "x": "ふたたび人を月に降ろすことを目指す計画です。"}, {"t": 1737.2666666666667, "x": "この計画の費用について、NASAの"}, {"t": 1739.7166666666667, "x": "内部で監査を行う監察総監室が、"}, {"t": 1741.3666666666666, "x": "監察総監室█"}, {"t": 1742.25, "x": "二〇二一年十一月十五日付けで報告書を出しています。"}, {"t": 1742.5333333333333, "x": "二〇二一年十一月十五日█"}, {"t": 1746.6333333333334, "x": "報告書によると、NASAがアルテミスに"}, {"t": 1749.2, "x": "使う額は、二〇二五年度までで、"}, {"t": 1751.8333333333333, "x": "およそ九百三十億ドルになる見込みでした。"}, {"t": 1752.3833333333334, "x": "九百三十億ドル█"}, {"t": 1755.0166666666667, "x": "さらに、大型ロケットと宇宙船の"}, {"t": 1757.45, "x": "一組を作って打ち上げる費用は、一回あたり"}, {"t": 1760.3333333333333, "x": "四十一億ドル█"}, {"t": 1760.6, "x": "四十一億ドルと見積もられています。"}, {"t": 1762.9166666666667, "x": "アルテミスの一号から四号についての見積もりです。"}, {"t": 1766.1666666666667, "x": "報告書は同時に、NASAには、"}, {"t": 1768.3666666666666, "x": "アルテミス全体の費用を正確にまとめた"}, {"t": 1771.2166666666 666666666, "x": "アルテミス四号に回されています。"}, {"t": 1885.9166666666667, "x": "そのあとは、少なくとも年に"}, {"t": 1887.95, "x": "一度の着陸を目指すとされています。"}, {"t": 1890.2333333333333, "x": "お金の側の記録も見ておきます。"}, {"t": 1892.4333333333334, "x": "二〇二六年度の予算について、大統領の予算案は、"}, {"t": 1896.5166666666667, "x": "NASAにおよそ百八十八億ドルを示していました。"}, {"t": 1900.0666666666666, "x": "前の年度より、およそ二十四パーセント少ない額です。"}, {"t": 1901.6, "x": "二十四パーセント█"}, {"t": 1903.9, "x": "宇宙開発を支持する団体は、これをNASAの"}, {"t": 1906.9666666666667, "x": "歴史で最大の、一年での削減案だと書いています。"}, {"t": 1910.7666666666667, "x": "案の中で最も大きく削られようとしていたのは、"}, {"t": 1913.6333333333334, "x": "科学の分野で、およそ四十七パーセントの"}, {"t": 1916.9833333333333, "x": "削減が示されていました。"}, {"t": 1918.6333333333334, "x": "議会はこの案を採らず、二〇二六年一月、"}, {"t": 1922.15, "x": "NASAにおよそ二百四十四億ドルをつける"}, {"t": 1922.8333333333333, "x": "二百四十四億ドル█"}, {"t": 1925.0833333333333, "x": "予算を成立させたと報じられています。"}, {"t": 1927.4833333333333, "x": "科学の分野も、前の年度とほぼ同じ、"}, {"t": 1930.3333333333333, "x": "およそ七十二億五千万ドルに戻されたとされています。"}, {"t": 1934.1333333333334, "x": "もう一つ、歴史表の右の端には、"}, {"t": 1936.8333333333333, "x": "実績ではなく、見通しの欄があります。"}, {"t": 1940.0, "x": "二〇二六年度から二〇三一年度まで。"}, {"t": 1943.15, "x": "二〇二六年四月に公開された版で、"}, {"t": 1945.9333333333334, "x": "政権側が見込んでいる数字です。"}, {"t": 1948.3833333333334, "x": "そこでは、NASAの支出は、二〇二六年度の"}, {"t": 1951.9, "x": "二百四十六億ドルから、二〇三一年度の"}, {"t": 1955.3833333333334, "x": "百九十億ドルへと、少しずつ下がっていきます。"}, {"t": 1958.7333333333333, "x": "国の支出に占める割合は、二〇三一年度に"}, {"t": 1962.3666666666666, "x": "〇・二一パーセント。"}, {"t": 1963.8833333333334, "x": "これは見通しであって、決まった額ではありません。"}, {"t": 1967.15, "x": "二〇二六年度に大統領案と議会の"}, {"t": 1969.7666666666667, "x": "結論が大きく違ったように、実際に"}, {"t": 1972.4666666666667, "x": "払われる額は、毎年の議会で決まります。"}, {"t": 1975.4833333333333, "x": "月への着陸の予定は、二〇二八年。"}, {"t": 1978.7333333333333, "x": "その年度の欄には、いまは見通しの数字が入っています。"}, {"t": 1982.5666666666666, "x": "一九六六年度、国の支出の四・四一パーセント。"}, {"t": 1987.2166666666667, "x": "二〇二五年度、国の支出の〇・三五パーセント。"}, {"t": 1991.2833333333333, "x": "もし今、一九六六年度と同じ割合を"}, {"t": 1994.9, "x": "国の支出からNASAに回すとすれば、"}, {"t": 1997.05, "x": "一年でおよそ三千九十億ドルになります。"}, {"t": 1998.15, "x": "三千九十億ドル█"}, {"t": 2000.3833333333334, "x": "今の支出の、十二倍あまりです。"}, {"t": 2003.0333333333333, "x": "一九六七年度から後、その割合に"}, {"t": 2006.4166666666667, "x": "届いた年は、表の上に一度もありません。"}, {"t": 2009.3833333333334, "x": "人間が月に降りなくなったのは、行く方法が"}, {"t": 2012.4666666666667, "x": "失われたからでも、何かを隠すためでもありませんでした。"}, {"t": 2016.2, "x": "競争のための特別な出費が、ほかの出費と"}, {"t": 2019.4, "x": "並べて比べられる、普通の出費に戻った。"}, {"t": 2022.4, "x": "国の財布が大きくなるあいだ、NASAの金額は、"}, {"t": 2025.6666666666667, "x": "アポロのころのおよそ半分の高さにとどまった。"}, {"t": 2028.75, "x": "月へ戻るという目標は三度示され、目標に見合う"}, {"t": 2032.55, "x": "上乗せは、そのうち二度、積まれなかった。"}, {"t": 2035.5833333333333, "x": "歴史表の一行は、その経過を、"}, {"t": 2038.1166666666666, "x": "一年に一つずつの数字で記録しています。"}, {"t": 2041.1333333333334, "x": "月が遠くなったのではありません。"}, {"t": 2043.1666666666667, "x": "月までの距離は、一九六九年から、"}, {"t": 2046.5166666666667, "x": "ほとんど変わっていません。"}, {"t": 2048.266666666667, "x": "変わったのは、その距離に国が"}, {"t": 2050.383333333333, "x": "いくら払うか、という数字のほうでした。"}, {"t": 2053.05, "x": "その数字は、誰かが一度に決めたものではありません。"}, {"t": 2056.6, "x": "毎年の予算案と、毎年の議会の結論が、"}, {"t": 2060.05, "x": "五十年あまり積み重なった結果です。"}, {"t": 2062.733333333333, "x": "どの年の一行も、その年に払われた"}, {"t": 2065.516666666667, "x": "額として、表に残っています。"}, {"t": 2067.8166666666666, "x": "三度目の計画の着陸の年の欄に、実際に払われた額が"}, {"t": 2072.0833333333335, "x": "書き込まれるのは、その年度が終わってからです。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
