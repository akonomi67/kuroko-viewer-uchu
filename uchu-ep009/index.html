x": "名前はマーズ・ポーラー・ランダー。"}, {"t": 16.766666666666666, "x": "マーズ・ポーラー・ランダー█"}, {"t": 18.633333333333333, "x": "目標は、南緯七十六度、西経百九十五度のあたり。"}, {"t": 23.216666666666665, "x": "いまも、そこにあるとされています。"}, {"t": 25.6, "x": "ただ、その姿を写した写真は、一枚もありません。"}, {"t": 29.65, "x": "火星のまわりには、地表の二十五センチほどの物まで"}, {"t": 33.2, "x": "見分けられるカメラが回っています。"}, {"t": 35.166666666666664, "x": "それでも、この着陸機が写ったという"}, {"t": 37.78333333333333, "x": "発表は、確認できていません。"}, {"t": 40.1, "x": "探した記録は残っています。"}, {"t": 42.03333333333333, "x": "見つからなかったという記録も残っています。"}, {"t": 44.63333333333333, "x": "火星には、降りようとして途中で声が"}, {"t": 47.233333333333334, "x": "途絶えた機械が、いくつか眠っています。"}, {"t": 49.916666666666664, "x": "そのうち、上から撮った写真で場所が確かめられたものは、"}, {"t": 53.71666666666667, "x": "この回で扱う範囲では二機だけです。"}, {"t": 56.36666666666667, "x": "候補として挙がっているものが一機。"}, {"t": 58.516666666666666, "x": "残りは、どこにあるのかが分かっていません。"}, {"t": 61.43333333333333, "x": "見つかったものも、写真に写っているのは、数ピクセルの"}, {"t": 65.26666666666667, "x": "明るい点と、黒い染みと、白い布のような影です。"}, {"t": 69.3, "x": "この回では、火星に降りて途絶えた探査機が、"}, {"t": 72.26666666666667, "x": "いまどこにあるとされているのかを、記録に"}, {"t": 75.26666666666667, "x": "残っているところまで順に並べていきます。"}, {"t": 77.71666666666667, "x": "見つかったもの。"}, {"t": 78.73333333333333, "x": "見つかっていないもの。"}, {"t": 80.01666666666667, "x": "見つかったと思われたが、違ったもの。"}, {"t": 82.63333333333334, "x": "乗っていた人は、一人もいません。"}, {"t": 84.96666666666667, "x": "記録に残っているのは、機械が何をして、"}, {"t": 87.86666666666666, "x": "どこで止まったか、ということだけです。"}, {"t": 90.73333333333333, "x": "残っている記録の種類は、機械によって違います。"}, {"t": 94.25, "x": "降りている途中のデータが最後まで届いたもの。"}, {"t": 97.1, "x": "数十秒の信号だけが届いたもの。"}, {"t": 99.56666666666666, "x": "何ひとつ届かなかったもの。"}, {"t": 101.33333333333333, "x": "そして、何年もたってから、上から撮った"}, {"t": 104.48333333333333, "x": "写真の中に、それらしい点が見つかったもの。"}, {"t": 107.51666666666667, "x": "行方の欄に何が書かれているかは、"}, {"t": 109.61666666666666, "x": "そのどれにあたるかで決まっています。"}, {"t": 111.95, "x": "まず、火星に降りるとはどういうことかを、"}, {"t": 114.75, "x": "順に並べておきます。"}, {"t": 116.5, "x": "火星に向かう探査機は、秒速数キロメートルという"}, {"t": 119.91666666666667, "x": "速さで、火星の大気に飛び込みます。"}, {"t": 122.55, "x": "最初に速度を落とすのは、前にかぶせた熱シールドです。"}, {"t": 126.45, "x": "空気との摩擦で高温になりながら、減速していきます。"}, {"t": 130.25, "x": "ある程度遅くなったところで、パラシュートが開きます。"}, {"t": 133.75, "x": "熱シールドは切り離され、下に落ちていきます。"}, {"t": 137.01666666666668, "x": "火星の空気は、地球よりずっと薄いものです。"}, {"t": 140.26666666666668, "x": "パラシュートだけでは、安全な速さまで落とせません。"}, {"t": 143.75, "x": "そこで最後は、逆向きに噴射するエンジンや、"}, {"t": 146.85, "x": "空気袋や、それに代わる仕組みを使って、"}, {"t": 150.18333333333334, "x": "地面の直前で速度を殺します。"}, {"t": 152.7, "x": "この途中で、背中にかぶせていた後部カバーが、"}, {"t": 155.86666666666667, "x": "パラシュートごと切り離されます。"}, {"t": 158.03333333333333, "x": "つまり、うまく降りた場合でも、火星の地面には"}, {"t": 161.6, "x": "一か所ではなく、何か所かに物が落ちます。"}, {"t": 164.6, "x": "着陸機本体。"}, {"t": 165.9, "x": "熱シールド。"}, {"t": 166.9, "x": "パラシュートと後部カバー。"}, {"t": 168.48333333333332, "x": "それぞれが、数百メートルから"}, {"t": 170.66666666666666, "x": "数キロメートル離れた場所に散らばります。"}, {"t": 173.18333333333334, "x": "そして、うまく降りられなかった場合も、"}, {"t": 175.83333333333334, "x": "同じように何か所かに物が落ちます。"}, {"t": 178.46666666666667, "x": "違うのは、着陸機本体が、形をとどめているかどうかです。"}, {"t": 183.01666666666668, "x": "では、それをどうやって探すのか。"}, {"t": 185.41666666666666, "x": "この回で扱う機械の近くに、"}, {"t": 187.43333333333334, "x": "地面から探しに行ける者はいません。"}, {"t": 190.05, "x": "探す方法は、上から撮ることだけです。"}, {"t": 193.01666666666668, "x": "火星を回る探査機のうち、いちばん細かく"}, {"t": 196.33333333333334, "x": "撮れるカメラは、アメリカの周回機、"}, {"t": 199.1, "x": "マーズ・リコネサンス・オービターに"}, {"t": 201.33333333333334, "x": "積まれたハイライズというカメラです。"}, {"t": 201.4, "x": "ハイライズ█"}, {"t": 203.46666666666667, "x": "一ピクセルがおよそ二十五センチから三十センチ。"}, {"t": 206.61666666666667, "x": "八十五センチくらいの物なら、"}, {"t": 208.5, "x": "形として見分けられるとされています。"}, {"t": 211.1, "x": "着陸機の大きさは、数メートルほどです。"}, {"t": 214.13333333333333, "x": "ハイライズで撮ると、三メートルの物でも、"}, {"t": 216.91666666666666, "x": "縦横十ピクセルほどの小さな点になります。"}, {"t": 220.08333333333334, "x": "問題は、どこを撮ればいいのかが、分からないことです。"}, {"t": 223.98333333333332, "x": "着陸機が降りる予定の範囲は、楕円で示されます。"}, {"t": 227.65, "x": "この楕円は、狭いものでも数十キロメートル、"}, {"t": 230.75, "x": "広いものでは百キロメートルを超えます。"}, {"t": 233.48333333333332, "x": "その中のどこかにある、数ピクセルの点を"}, {"t": 236.4, "x": "探すことになります。"}, {"t": 237.68333333333334, "x": "カメラの細かさが、どれほど効いてくるかは、"}, {"t": 240.58333333333334, "x": "数字で比べると分かります。"}, {"t": 242.61666666666667, "x": "ハイライズより前に火星を回っていたマーズ・"}, {"t": 245.1, "x": "グローバル・サーベイヤーのカメラは、"}, {"t": 246.93333333333334, "x": "一ピクセルが約一・五メートルでした。"}, {"t": 249.66666666666666, "x": "三メートルの着陸機は、"}, {"t": 251.3, "x": "縦横二ピクセルほどにしかなりません。"}, {"t": 253.98333333333332, "x": "周りの岩と、見分けがつかない大きさです。"}, {"t": 257.1, "x": "ハイライズでは、それが縦横十ピクセルほどになります。"}, {"t": 260.85, "x": "形が、かろうじて形として読めるようになる大きさです。"}, {"t": 264.68333333333334, "x": "ハイライズが撮影するのは、火星の"}, {"t": 267.18333333333334, "x": "地面から二百数十キロメートル上空です。"}, {"t": 269.96666666666664, "x": "そこから、地面の一メートルに"}, {"t": 272.15, "x": "満たない物を見分けています。"}, {"t": 273.85, "x": "ハイライズは、一回の撮影で、"}, {"t": 276.1666666666667, "x": "火星の地面の細長い帯を写します。"}, {"t": 279.05, "x": "楕円の全体を一度に写すことはできません。"}, {"t": 281.8333333333333, "x": "何度も撮って、並べて、一枚ずつ"}, {"t": 284.8333333333333, "x": "見比べていくしかありません。"}, {"t": 286.43333333333334, "x": "しかも、火星の地面には、着陸機と見分けの"}, {"t": 289.8666666666667, "x": "つかない明るい岩や、斜面の光の反射や、"}, {"t": 292.9166666666667, "x": "画像の乱れが無数にあります。"}, {"t": 295.1666666666667, "x": "一つの点が本物かどうかを確かめるには、別の日に、"}, {"t": 298.85, "x": "別の太陽の角度で、もう一度撮る必要があります。"}, {"t": 302.8333333333333, "x": "見つかった、と言えるのは、何枚もの写真で、"}, {"t": 306.28333333333336, "x": "形と影と色が、期待されるものと合ったときだけです。"}, {"t": 310.23333333333335, "x": "この先の章で並べる機械は、"}, {"t": 312.18333333333334, "x": "どれも、この方法で探されました。"}, {"t": 315.0833333333333, "x": "見つかったものも、見つからなかったものも、"}, {"t": 317.7, "x": "同じ方法で探されています。"}, {"t": 319.96666666666664, "x": "火星の地面に最初に届いた人工物は、"}, {"t": 322.68333333333334, "x": "ソビエト連邦の探査機でした。"}, {"t": 324.96666666666664, "x": "一九七一年五月、ソビエト連邦は、"}, {"t": 328.56666666666666, "x": "二機の探査機を相次いで打ち上げました。"}, {"t": 331.31666666666666, "x": "マルス二号とマルス三号です。"}, {"t": 331.31666666666666, "x": "マルス二号█"}, {"t": 332.81666666666666, "x": "マルス三号█"}, {"t": 334.8333333333333, "x": "どちらも、火星を回る周回機と、地面に"}, {"t": 338.2, "x": "降りる着陸機を組み合わせた機体でした。"}, {"t": 340.6166666666667, "x": "二機が火星に着いたとき、火星は、観測史上でも"}, {"t": 344.48333333333335, "x": "最大級とされる砂嵐に覆われていました。"}, {"t": 347.3, "x": "星全体が、黄色い霧の中にありました。"}, {"t": 350.3666666666667, "x": "一九七一年十一月二十七日。"}, {"t": 353.76666666666665, "x": "先に着いたマルス二号の着陸機が、大気に入りました。"}, {"t": 357.8, "x": "着陸機は、降りる手順を最後まで終えることができず、"}, {"t": 361.5, "x": "地面にぶつかったとされています。"}, {"t": 363.73333333333335, "x": "それでも、この着陸機が、火星の地面に届いた"}, {"t": 367.43333333333334, "x": "最初の人工物になった、と記録されています。"}, {"t": 370.7, "x": "形をとどめて降りたわけではありません。"}, {"t": 373.1166666666667, "x": "ただ、届いた、という記録です。"}, {"t": 375.8833333333333, "x": "マルス二号の着陸機がぶつかった場所は、"}, {"t": 378.43333333333334, "x": "いまも見つかっていません。"}, {"t": 380.2, "x": "二〇二〇年時点で火星への着陸の試みを"}, {"t": 383.21666666666664, "x": "地図にまとめた一覧でも、その場所は、"}, {"t": 385.78333333333336, "x": "見つかっていないものとして扱われています。"}, {"t": 388.55, "x": "五日後、一九七一年十二月二日。"}, {"t": 389.51666666666665, "x": "一九七一年十二月二日█"}, {"t": 392.2, "x": "マルス三号の着陸機が降りました。"}, {"t": 394.6, "x": "こちらは、地面に降りたあと、信号を送り始めました。"}, {"t": 398.8, "x": "火星の地面から、人工物が電波を"}, {"t": 401.53333333333336, "x": "送ったのは、これが初めてです。"}, {"t": 403.8, "x": "しかし、その信号は、すぐに止まりました。"}, {"t": 407.1666666666667, "x": "NASAの発表では、着陸から十四・五秒後です。"}, {"t": 410.9166666666667, "x": "一九九〇年に書かれた協会誌の記事では、"}, {"t": 414.06666666666666, "x": "約二十秒後とされています。"}, {"t": 416.26666666666665, "x": "資料によって、数字が少し違います。"}, {"t": 419.21666666666664, "x": "どちらにしても、二十秒には届かない、"}, {"t": 421.95, "x": "あるいはその程度の長さでした。"}, {"t": 424.21666666666664, "x": "止まった理由は、分かっていません。"}, {"t": 426.55, "x": "この二機の着陸機には、それぞれ、"}, {"t": 429.01666666666665, "x": "小さな移動機が積まれていたとされています。"}, {"t": 431.9166666666667, "x": "車輪ではなく、両脇のスキーのような板で"}, {"t": 434.9, "x": "地面を押して進む仕組みでした。"}, {"t": 436.78333333333336, "x": "着陸機とはケーブルでつながったまま、十五メートルほどの"}, {"t": 440.46666666666664, "x": "範囲を動く設計だったと伝えられています。"}, {"t": 443.0833333333333, "x": "障害物にぶつかると、どちら側にあるかを"}, {"t": 446.1166666666667, "x": "感じ取り、一歩下がって、向きを変える。"}, {"t": 449.26666666666665, "x": "土の硬さと密度を測る道具を積んでいました。"}, {"t": 452.25, "x": "どちらの移動機も、動いたという記録はありません。"}, {"t": 455.56666666666666, "x": "マルス三号が降りた場所は、南緯四十五度、"}, {"t": 458.6666666666667, "x": "東経二百二度のあたりと予想されていました。"}, {"t": 461.75, "x": "プトレマイオス・クレーターという、"}, {"t": 461.75, "x": "プトレマイオス・クレーター█"}, {"t": 463.68333333333334, "x": "大きなクレーターの中です。"}, {"t": 465.9166666666667, "x": "それから四十年以上がたって、その場所の写真を、"}, {"t": 469.45, "x": "ロシアの民間の愛好家たちが調べ始めました。"}, {"t": 472.8666666666667, "x": "使ったのは、ハイライズが二〇〇"}, {"t": 474.96666666666664, "x": "七年十一月に撮った画像です。"}, {"t": 477.2, "x": "NASAの説明によれば、この一枚は、"}, {"t": 479.8333333333333, "x": "約十八億ピクセルの大きさがありました。"}, {"t": 482.85, "x": "その中から、数ピクセルから"}, {"t": 484.95, "x": "数十ピクセルの物を探すことになります。"}, {"t": 487.56666666666666, "x": "中心になったのは、サンクトペテルブルクの"}, {"t": 490.31666666666666, "x": "ヴィタリー・エゴロフという人でした。"}, {"t": 492.1666666666667, "x": "愛好家たちは、パラシュートや熱シールドや"}, {"t": 494.95, "x": "着陸機が、上からどう見えるはずかを"}, {"t": 497.51666666666665, "x": "計算で描き、その形と一致するものを、"}, {"t": 500.43333333333334, "x": "画像の中から一つずつ探していきました。"}, {"t": 503.3, "x": "二〇一二年の十二月三十一日。"}, {"t": 506.06666666666666, "x": "候補が見つかりました。"}, {"t": 507.55, "x": "明るい、丸いものが一つ。"}, {"t": 509.73333333333335, "x": "直径は七・五メートルほどでした。"}, {"t": 512.0166666666667, "x": "完全に広がれば十一メートルほどになる"}, {"t": 514.5, "x": "パラシュートが、一部縮んだ状態なら、"}, {"t": 517.2, "x": "ちょうどこの大きさになります。"}, {"t": 519.2, "x": "少し離れて、盾の形をした物体。"}, {"t": 522.1666666666666, "x": "一部が砂に埋まっていれば、"}, {"t": 523.8, "x": "熱シールドの大きさと合います。"}, {"t": 526.1, "x": "着陸機を下ろしたあとに離れていく"}, {"t": 528.2166666666667, "x": "逆噴射装置も、それらしい物が見つかりました。"}, {"t": 531.5666666666667, "x": "そこから細長く延びる影は、鎖のようにも見えました。"}, {"t": 535.4333333333333, "x": "そして、花びらが四枚開いたような形の物。"}, {"t": 538.95, "x": "候補の部品は、全部で四キロメートルあまりの"}, {"t": 542.0666666666667, "x": "範囲に散らばっているとされています。"}, {"t": 544.1, "x": "NASAの説明でも、この物は、花びらが四枚"}, {"t": 547.6166666666667, "x": "開いた着陸機の形と読めるとされています。"}, {"t": 550.35, "x": "二〇一三年三月十日、ハイライズは同じ場所を、"}, {"t": 553.9833333333333, "x": "色つきで、別の光の角度から撮り直しました。"}, {"t": 557.75, "x": "NASAはこの結果を、こう発表しています。"}, {"t": 560.6833333333333, "x": "これらの特徴とその並び方は、マルス三号の"}, {"t": 563.9166666666666, "x": "着陸で期待されるものと、驚 はついていました。"}, {"t": 676.15, "x": "二〇一一年の十二月二十六日。"}, {"t": 678.9333333333333, "x": "ハイライズは、マルス六号を探すための撮影を行いました。"}, {"t": 683.1, "x": "その前に、もっと広い範囲を"}, {"t": 685.2333333333333, "x": "撮れる中解像度のカメラで、周りと違う、"}, {"t": 688.25, "x": "小さな明るい部分が見つかっていました。"}, {"t": 690.9333333333333, "x": "そこを細かく撮り直したものです。"}, {"t": 693.15, "x": "撮れた写真には、明るい地面と、"}, {"t": 695.5666666666667, "x": "細い線の模様が写っていました。"}, {"t": 697.9333333333333, "x": "調べた人たちは、これを、割れ目の"}, {"t": 700.7333333333333, "x": "入った明るい岩盤だろうと書いています。"}, {"t": 703.1333333333333, "x": "探査機の部品ではありませんでした。"}, {"t": 705.3166666666667, "x": "撮影を担当したチームは、そのときの"}, {"t": 708.0666666666667, "x": "説明に、こう添えています。"}, {"t": 710.1666666666666, "x": "火星は調べなければならない面積が広く、"}, {"t": 712.9333333333333, "x": "機体は砂ぼこりに覆われているかもしれない。"}, {"t": 715.9666666666667, "x": "マルス六号の降下機は、二百二十四秒の"}, {"t": 719.1333333333333, "x": "声を残して、どこかに降りています。"}, {"t": 721.7, "x": "どこに降りたのかを示す写真は、ありません。"}, {"t": 724.85, "x": "マルス二号も、同じです。"}, {"t": 727.0, "x": "一九七一年に火星の地面に届いた最初の"}, {"t": 730.2333333333333, "x": "人工物は、どこにあるのか分かっていません。"}, {"t": 733.2166666666667, "x": "火星の表面は広く、そのどこかに、"}, {"t": 735.9333333333333, "x": "形の定まらない、数メートルの金属の塊が、"}, {"t": 739.8166666666667, "x": "半世紀近く、砂の降る中に置かれています。"}, {"t": 743.3666666666667, "x": "見つからないのは、探していないからではありません。"}, {"t": 746.5333333333333, "x": "探す範囲が、見つけるものに"}, {"t": 748.6166666666667, "x": "比べて、あまりにも広いからです。"}, {"t": 751.1, "x": "マルス三号の候補が見つかったのは、降りた場所の"}, {"t": 754.3833333333333, "x": "見当が、比較的よくついていたからでもあります。"}, {"t": 757.6, "x": "マルス二号とマルス六号には、"}, {"t": 759.5333333333333, "x": "その手がかりが、まだ足りていません。"}, {"t": 762.2833333333333, "x": "二〇二〇年の時点でも、両方とも、"}, {"t": 765.0166666666667, "x": "見つかっていない機体として一覧に載っています。"}, {"t": 767.9833333333333, "x": "序章の着陸機に戻ります。"}, {"t": 769.9833333333333, "x": "マーズ・ポーラー・ランダーは、"}, {"t": 769.9833333333333, "x": "マーズ・ポーラー・ランダー█"}, {"t": 771.4166666666666, "x": "一九九九年一月三日に打ち上げられました。"}, {"t": 775.6833333333333, "x": "目的地は、火星の南極冠の縁。"}, {"t": 778.5166666666667, "x": "これまでどの着陸機も降りたことのない、"}, {"t": 780.85, "x": "氷に近い地域でした。"}, {"t": 782.8333333333334, "x": "打ち上げのときの質量は、約五百八十三キログラム。"}, {"t": 786.8, "x": "そのうち、熱シールドなどの覆いが"}, {"t": 789.2166666666667, "x": "百四十キログラム、燃料が六十四キログラム。"}, {"t": 792.8333333333334, "x": "そして、三・五キログラムの小さな探査体が"}, {"t": 796.0666666666667, "x": "二本、機体の外側に取り付けられていました。"}, {"t": 799.1833333333333, "x": "この二本は、ディープ・スペース二という"}, {"t": 800.1166666666667, "x": "ディープ・スペース二█"}, {"t": 801.8833333333333, "x": "別の計画の機械です。"}, {"t": 803.6666666666666, "x": "着陸機とは別に切り離され、着陸機から"}, {"t": 806.7166666666667, "x": "約六十キロメートル離れた地点に、秒速"}, {"t": 809.8, "x": "約二百メートルで、地面に突き刺さる設計でした。"}, {"t": 813.2166666666667, "x": "突き刺さった衝撃で、地上に残る後ろ半分と、"}, {"t": 816.7, "x": "地下にもぐる前半分に分かれます。"}, {"t": 819.15, "x": "二つはケーブルでつながっています。"}, {"t": 821.2333333333333, "x": "後ろ半分は約六万G、前半分は約三万Gの"}, {"t": 825.2, "x": "衝撃に耐えるように作られていました。"}, {"t": 827.5, "x": "地下の氷を調べるための機械です。"}, {"t": 829.8666666666667, "x": "後ろ半分は、零度から零下八十度の"}, {"t": 832.7166666666667, "x": "中で動くように作られていました。"}, {"t": 834.7833333333333, "x": "着陸機の地上での仕事は、九十日の予定でした。"}, {"t": 838.6, "x": "二本の探査体の仕事は、二日です。"}, {"t": 841.4, "x": "三つとも、同じ巡航用の機体に取り付けられ、"}, {"t": 844.7333333333333, "x": "同じ地域を目指していました。"}, {"t": 846.9333333333333, "x": "一九九九年十二月三日。"}, {"t": 849.65, "x": "着陸機は、健康な状態で火星に近づき、大気に入りました。"}, {"t": 854.6166666666667, "x": "それきり、着陸機からも、二本の"}, {"t": 857.4666666666667, "x": "探査体からも、何も届きませんでした。"}, {"t": 860.3166666666667, "x": "この着陸機は、降りている途中のデータを、"}, {"t": 863.3, "x": "地球に送らない設計になっていました。"}, {"t": 866.0166666666667, "x": "安全に降りることに直接つながらないものには"}, {"t": 868.7666666666667, "x": "手をかけない、という方針で決められたことでした。"}, {"t": 872.0, "x": "降下中に何が起きたのかを、あとで"}, {"t": 874.5, "x": "知る手段は、はじめからありませんでした。"}, {"t": 877.1833333333333, "x": "十二月十六日。"}, {"t": 878.7666666666667, "x": "火星を回っていたマーズ・グローバル・"}, {"t": 880.6666666666666, "x": "サーベイヤーという周回機が、予定の地点を撮りました。"}, {"t": 884.3166666666667, "x": "着陸機は見つかりませんでした。"}, {"t": 886.4, "x": "交信の試みは、年を越して続けられました。"}, {"t": 889.6833333333333, "x": "二〇〇〇年一月十七日、NASAは、"}, {"t": 892.45, "x": "すべての交信の試みを終えました。"}, {"t": 895.0833333333334, "x": "その二か月後、二〇〇〇年三月二十二日。"}, {"t": 896.3, "x": "二〇〇〇年三月二十二日█"}, {"t": 898.4, "x": "原因を調べる委員会が、報告書をまとめました。"}, {"t": 902.0166666666667, "x": "報告書は、はじめに、こう断っています。"}, {"t": 905.3833333333333, "x": "降下中のデータが全くなく、呼びかけにも"}, {"t": 908.35, "x": "一切応答がなかった以上、原因を特定できるとは、"}, {"t": 912.0, "x": "もともと期待されていなかった。"}, {"t": 914.0833333333334, "x": "それでも、委員会は、最も可能性が"}, {"t": 917.25, "x": "高いものを一つ挙げました。"}, {"t": 918.9, "x": "着陸機は、パラシュートにつられて降りている途中、"}, {"t": 922.3666666666667, "x": "高度約千五百メートルで、三本の脚を伸ばします。"}, {"t": 922.8833333333333, "x": "高度約千五百メートル█"}, {"t": 926.7166666666667, "x": "脚には、地面に触れたことを知らせる磁気の"}, {"t": 929.5666666666667, "x": "センサーが一つずつ付いています。"}, {"t": 931.4666666666667, "x": "脚が伸びきった瞬間の振動を、このセンサーが、"}, {"t": 934.8333333333334, "x": "地面に触れた信号として拾った可能性がある。"}, {"t": 938.0666666666667, "x": "本来、ソフトウェアは、その時点の"}, {"t": 940.7833333333333, "x": "信号を無視するはずでした。"}, {"t": 942.4833333333333, "x": "しかし、その処理が正しく作られておらず、"}, {"t": 945.4333333333333, "x": "偽の「着地した」という記録が、残ったままになっていた。"}, {"t": 950.3666666666667, "x": "着地を判定する仕組みは、それよりずっと下、"}, {"t": 953.75, "x": "高度四十メートルで働き始めます。"}, {"t": 954.0, "x": "高度四十メートル█"}, {"t": 956.7666666666667, "x": "働き始めたその瞬間に、残っていた偽の記録が"}, {"t": 960.4, "x": "読まれ、降下用のエンジンを止める命令が出た。"}, {"t": 963.5833333333334, "x": "報告書の計算では、高度四十メートルでの"}, {"t": 966.75, "x": "速さは、秒速約十三メートル。"}, {"t": 969.3333333333334, "x": "そこから、推力のない状態で落ちると、地面に"}, {"t": 973.0, "x": "着くときには秒速約二十二メートルになります。"}, {"t": 975.9666666666667, "x": "設計上の着地の速さは、秒速二・四メートルでした。"}, {"t": 980.2, "x": "報告書は、この速さでは着陸機は"}, {"t": 982.9333333333333, "x": "生き残れなかった、と書いています。"}, {"t": 985.3, "x": "ディープ・スペース二の二本については、委員会は、"}, {"t": 988.4, "x": "最も可能性の高い原因を特定できませんでした。"}, {"t": 992.0833333333334, "x": "考えられる失敗の形を四つ挙げるところまでで、"}, {"t": 995.3, "x": "止まっています。"}, {"t": 996.5166666666667, "x": "報告書が、次の着陸機に向けた勧告の"}, {"t": 999.5833333333334, "x": "筆頭に置いたのは、降下中のデータを"}, {"t": 1002.2166666666667, "x": "地球に送る仕組みを加えることでした。"}, {"t": 1004.6, "x": "着陸機が見つからないまま、年月がたちました。"}, {"t": 1007.9666666666667, "x": "二〇〇五年。"}, {"t": 1008.9333333333333, "x": "周回機のカメラの担当チームは、昔の画像を"}, {"t": 1012.3166666666667, "x": "見直していて、一つの候補に気づきました。"}, {"t": 1015.2666666666667, "x": "パラシュートに似た、明るい点。"}, {"t": 1017.55, "x": "そこから少し離れて、黒っぽい"}, {"t": 1019.9, "x": "地面の中に、明るい点が一つ。"}, {"t": 1022.4166666666666, "x": "エンジンの噴射で地面の砂が吹き払われ、その中心に"}, {"t": 1026.0833333333333, "x": "着陸機が残っている、と読める配置でした。"}, {"t": 1029.1, "x": "チームは、同じ場所を、より細かく撮り直そうとしました。"}, {"t": 1033.3166666666666, "x": "周回機の向きを傾けて、狙った一点を細かく撮る方法です。"}, {"t": 1037.8666666666666, "x": "狙いは簡単には当たらず、候補の"}, {"t": 1040.3333333333333, "x": "場所を写すのに、六回かかりました。"}, {"t": 1042.9666666666667, "x": "最後の撮影は、二〇〇五年九月二十七日でした。"}, {"t": 1046.8666666666666, "x": "その結論は、はっきりしていました。"}, {"t": 1049.4666666666667, "x": "ここは、マーズ・ポーラー・ランダーのある場所ではない。"}, {"t": 1052.55, "x": "パラシュートに見えたのは、"}, {"t": 1053.9333333333334, "x": "小さな丘の、日の当たっている斜面でした。"}, {"t": 1057.1833333333334, "x": "着陸機に見えた点は、周りのピクセルと"}, {"t": 1060.1, "x": "値が違っていただけの、画像の乱れでした。"}, {"t": 1063.1833333333334, "x": "NASAは、この画像に「見つからなかった」という"}, {"t": 1066.9166666666667, "x": "題を付けて公開しています。"}, {"t": 1068.65, "x": "その翌年から、ハイライズが火星を回り始めました。"}, {"t": 1072.35, "x": "一ピクセル約二十五センチのカメラです。"}, {"t": 1075.0, "x": "それでも、マーズ・ポーラー・ランダーが"}, {"t": 1077.2166666666667, "x": "写ったという発表は、確認できていません。"}, {"t": 1080.1833333333334, "x": "二本の探査体も、同じです。"}, {"t": 1082.6, "x": "南緯七十六度のあたりに、三本脚の着陸機と、"}, {"t": 1086.2333333333333, "x": "地面に刺さった二本の探査体と、パラシュートと、"}, {"t": 1089.8, "x": "熱シールドが、それぞれどこかにあるはずです。"}, {"t": 1093.1333333333334, "x": "そのどれも、写真には写っていません。"}, {"t": 1095.7833333333333, "x": "見つかった例に移ります。"}, {"t": 1097.4333333333334, "x": "二〇〇三年十二月十九日。"}, {"t": 1099.6333333333334, "x": "ヨーロッパ宇宙機関の周回機マーズ・"}, {"t": 1101.8333333333333, "x": "エクスプレスから、小さな着陸機が切り離されました。"}, {"t": 1105.4333333333334, "x": "イギリスが中心になって作った、ビーグル二号です。"}, {"t": 1107.9166666666667, "x": "ビーグル二号█"}, {"t": 1109.4166666666667, "x": "計画を率いたのは、オープン大学の"}, {"t": 1112.1166666666666, "x": "コリン・ピリンジャー教授でした。"}, {"t": 1113.8, "x": "着陸機は、数メートルに満たない大きさの、"}, {"t": 1116.8666666666666, "x": "丸い平たい容器のような形をしていました。"}, {"t": 1120.0, "x": "地面に降りたら、ふたを開き、その中から、"}, {"t": 1123.35, "x": "四枚の太陽電池板を花びらのように広げる。"}, {"t": 1126.7333333333333, "x": "広げ終わってはじめて、無線のアンテナが外に出る。"}, {"t": 1130.1833333333334, "x": "そういう仕組みでした。"}, {"t": 1131.5666666666666, "x": "降りる予定の日は、二〇〇三年十二月二十五日。"}, {"t": 1133.0666666666666, "x": "二〇〇三年十二月二十五日█"}, {"t": 1135.25, "x": "赤道に近い、イシディス平原という、"}, {"t": 1138.0, "x": "大昔の衝突でできた大きな盆地です。"}, {"t": 1141.0666666666666, "x": "予定着陸範囲は、およそ百七十キロメートルかける"}, {"t": 1144.7833333333333, "x": "百キロメートルの楕円でした。"}, {"t": 1146.4833333333333, "x": "その日から、呼びかけが続けられました。"}, {"t": 1149.1666666666667, "x": "応答はありませんでした。"}, {"t": 1150.7666666666667, "x": "ビーグル二号は、そのまま、行方の"}, {"t": 1153.5166666666667, "x": "分からない着陸機の一覧に入りました。"}, {"t": 1156.0166666666667, "x": "十年あまりがたちました。"}, {"t": 1157.6833333333334, "x": "ヨーロッパ宇宙機関の運用センターで、かつてマーズ・"}, {"t": 1160.9666666666667, "x": "エクスプレスの運用に関わっていたマイケル・"}, {"t": 1163.3166666666666, "x": "クルーンという人が、ハイライズの画像を"}, {"t": 1165.8333333333333, "x": "使って、ビーグル二号を探し続けていました。"}, {"t": 1168.9, "x": "着陸機を作った企業や研究者たちも、"}, {"t": 1171.5166666666667, "x": "並行して探していました。"}, {"t": 1173.5, "x": "候補は、二〇一三年二月二十八日に撮られた"}, {"t": 1177.1, "x": "画像の中にありました。"}, {"t": 1178.5166666666667, "x": "予定着陸範囲の中心から、約五キロメートル。"}, {"t": 1182.0166666666667, "x": "二〇一四年六月二十九日にも、同じ場所が撮られました。"}, {"t": 1186.3, "x": "そして、二〇一四年十二月十五日、色つきでもう一度。"}, {"t": 1191.0, "x": "探すのが難しかった理由は、はっきりしています。"}, {"t": 1194.3833333333334, "x": "予定着陸範囲の楕円は、百七十キロメートルかける"}, {"t": 1198.1833333333334, "x": "百キロメートル。"}, {"t": 1199.1666666666667, "x": "そこに、数メートルに満たない着陸機が一つ。"}, {"t": 1202.5166666666667, "x": "ハイライズの一ピクセルは〇・三メートルです。"}, {"t": 1205.4666666666667, "x": "楕円の全体を細かく撮りきるには、"}, {"t": 1207.6666666666667, "x": "何年もの撮影が要ります。"}, {"t": 1209.8333333333333, "x": "しかも、ビーグル二号は、降りたあとも"}, {"t": 1212.7333333333333, "x": "大きな跡を残さない機体でした。"}, {"t": 1214.6833333333334, "x": "墜落の黒い染みもなく、あるのは、"}, {"t": 1217.3, "x": "平たい着陸機と、しぼんだ布だけです。"}, {"t": 1220.5, "x": "光の角度を変えた三枚の画像で、"}, {"t": 1222.8166666666666, "x": "その点は、同じ場所にありました。"}, {"t": 1225.6333333333334, "x": "数ピクセルの明るい塊です。"}, {"t": 1227.8, "x": "形は、平たい円に、何枚かの"}, {"t": 1230.7, "x": "板がくっついたように見えました。"}, {"t": 1232.5833333333333, "x": "近くには、主パラシュートと思われる物。"}, {"t": 1235.4166666666667, "x": "少し離れて、補助のパラシュートが"}, {"t": 1237.8, "x": "ついたままの、後部カバーと思われる物。"}, {"t": 1240.6, "x": "二〇一五年一月十六日。"}, {"t": 1240.6, "x": "二〇一五年一月十六日█"}, {"t": 1242.95, "x": "ヨーロッパ宇宙機関とイギリスの宇宙機関は、"}, {"t": 1245.6833333333334, "x": "ビーグル二号が見つかったと発表しました。"}, {"t": 1248.5666666666666, "x": "この発見で、一つのことがはっきりしました。"}, {"t": 1251.65, "x": "ビーグル二号は、墜落していなかった。"}, {"t": 1254.3833333333334, "x": "突入し、減速し、パラシュートを開き、地面に降りる。"}, {"t": 1259.1333333333334, "x": "その手順は、最後まで働いていました。"}, {"t": 1262.0833333333333, "x": "ビーグル二号は、降りていました。"}, {"t": 1264.45, "x": "では、なぜ声が届かなかったのか。"}, {"t": 1266.9833333333333, "x": "画像では、四枚の太陽電池板のうち、開いているように"}, {"t": 1271.25, "x": "見えるのは、一枚か、二枚か、多くても三枚でした。"}, {"t": 1275.7666666666667, "x": "四枚すべてが開かなければ、アンテナは外に出ません。"}, {"t": 1279.5, "x": "何枚かの板が開ききらず、アンテナを"}, {"t": 1282.3, "x": "ふさいでしまった、と考えられています。"}, {"t": 1284.9833333333333, "x": "ピリンジャー教授は、その前年、"}, {"t": 1287.2333333333333, "x": "二〇一四年の五月に亡くなっていました。"}, {"t": 1290.2, "x": "最初の画像が手元に届く数か月前でした。"}, {"t": 1293.2333333333333, "x": "見つかったあとも、調べる作業は続きました。"}, {"t": 1296.3666666666666, "x": "二〇一六年、イギリスのレスター大学とデ・"}, {"t": 1299.45, "x": "モントフォート大学の研究者たちが、別の"}, {"t": 1302.35, "x": "方法で、この数ピクセルを読み直しました。"}, {"t": 1305.4333333333334, "x": "ビーグル二号の立体模型をコンピューターの"}, {"t": 1307.85, "x": "中に作り、軌道から撮られたときと"}, {"t": 1310.3333333333333, "x": "同じ太陽の角度で、光を当てる。"}, {"t": 1312.9, "x": "板が何枚開いているかを変えながら、"}, {"t": 1315.1333333333334, "x": "反射の出方を、実際の画像と見比べる。"}, {"t": 1318.5, "x": "この方法を考えたのは、ビーグル二号のミッション・"}, {"t": 1321.7666666666667, "x": "マネージャーだった、マーク・シムズ教授です。"}, {"t": 1324.5333333333333, "x": "結果は、最初の見立てと少し違いました。"}, {"t": 1327.55, "x": "最もよく合うのは、三枚の板が開き、"}, {"t": 1330.5333333333333, "x": "一枚だけが開かなかった形。"}, {"t": 1332.95, "x": "少なくとも三枚、もしかすると四枚すべてが"}, {"t": 1336.0333333333333, "x": "開いていた可能性もある、というものでした。"}, {"t": 1338.95, "x": "四枚すべてが開いていたのなら、なぜアンテナが"}, {"t": 1342.0666666666666, "x": "働かなかったのかは、また別の問いになります。"}, { const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
