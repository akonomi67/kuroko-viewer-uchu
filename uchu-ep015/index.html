<script>
const D={"name": "ep015", "file": "ep015", "dur": 1944.7333125, "segs": [], "subs": [{"t": 0.0, "x": "鹿児島県の南の島、種子島。"}, {"t": 2.8, "x": "その島の宇宙センターに、一機の"}, {"t": 5.166666666666667, "x": "探査機が運び込まれています。"}, {"t": 7.0, "x": "二〇二六年の四月一日のことでした。"}, {"t": 9.883333333333333, "x": "それから半年、打ち上げの日を待っています。"}, {"t": 13.066666666666666, "x": "予定の日時は、二〇二六年十月二十日、"}, {"t": 16.466666666666665, "x": "午前四時四十一分三秒。"}, {"t": 18.816666666666666, "x": "この記録をまとめた十月のはじめの"}, {"t": 21.033333333333335, "x": "時点では、まだ地上にあります。"}, {"t": 23.3, "x": "名前は、MMX。"}, {"t": 25.366666666666667, "x": "日本の宇宙航空研究開発機構、JAXAが作った探査機です。"}, {"t": 30.033333333333335, "x": "目指すのは、火星のそばを回る、小さな月です。"}, {"t": 33.81666666666667, "x": "名前はフォボス。"}, {"t": 34.96666666666667, "x": "長いところで二十七キロメートルほどしかない、"}, {"t": 37.71666666666667, "x": "いびつな形の岩のかたまりです。"}, {"t": 40.13333333333333, "x": "MMXは、その表面に降りて、"}, {"t": 42.833333333333336, "x": "砂を採り、地球へ持ち帰る計画です。"}, {"t": 46.11666666666667, "x": "持ち帰る量の目標は、十グラム以上。"}, {"t": 49.18333333333333, "x": "十グラムは、一円玉十枚ぶんの重さです。"}, {"t": 52.43333333333333, "x": "それだけの量を取りに行くのに、行きと"}, {"t": 54.93333333333333, "x": "帰りを合わせて、約五年かかります。"}, {"t": 57.6, "x": "JAXAの宇宙飛行士の一人は、この計画に"}, {"t": 60.63333333333333, "x": "寄せた言葉の中で、こう書いています。"}, {"t": 63.21666666666667, "x": "これまで火星圏から地球に戻ってきたものはありません。"}, {"t": 66.51666666666667, "x": "そしてもう一つ、まだ起きていないことがあります。"}, {"t": 69.71666666666667, "x": "フォボスの地面に、人間の作った機械が"}, {"t": 72.6, "x": "降りたことは、一度もありません。"}, {"t": 74.83333333333333, "x": "降りようとした探査機は、これまでに三機ありました。"}, {"t": 78.25, "x": "二機は、火星へ向かう途中や、フォボスの"}, {"t": 81.33333333333333, "x": "目の前で、声が届かなくなりました。"}, {"t": 83.98333333333333, "x": "残りの一機は、地球のまわりから"}, {"t": 86.35, "x": "離れることができませんでした。"}, {"t": 88.15, "x": "地球の月を別にすれば、人類にとって"}, {"t": 90.98333333333333, "x": "いちばん近くにある「月」は、火星の二つの衛星です。"}, {"t": 95.51666666666667, "x": "その片方に、なぜ誰も降りていないのか。"}, {"t": 98.46666666666667, "x": "残っている記録を、順に読んでいきます。"}, {"t": 101.3, "x": "話は、百五十年ほど前にさかのぼります。"}, {"t": 104.6, "x": "一八七七年の八月。"}, {"t": 107.03333333333333, "x": "アメリカの天文学者アサフ・ホールが、"}, {"t": 109.21666666666667, "x": "火星のそばに、小さな光の点を見つけました。"}, {"t": 112.86666666666666, "x": "まず見つかったのは、外側を回る小さな点でした。"}, {"t": 116.43333333333334, "x": "一八七七年八月十一日のことです。"}, {"t": 119.98333333333333, "x": "それから六日後の八月十七日。"}, {"t": 122.51666666666667, "x": "もっと火星に近いところを回る、"}, {"t": 124.5, "x": "もう一つの点が見つかりました。"}, {"t": 126.78333333333333, "x": "内側の点が、フォボス。"}, {"t": 128.85, "x": "外側の点が、ダイモスです。"}, {"t": 131.21666666666667, "x": "名前は、ギリシャ神話から取られました。"}, {"t": 133.96666666666667, "x": "戦いの神アレスは、ローマではマルス、"}, {"t": 136.75, "x": "つまり火星の名前のもとになった神です。"}, {"t": 139.55, "x": "その神の二人の息子の名前が、フォボスとダイモスでした。"}, {"t": 143.33333333333334, "x": "フォボスは「恐れ」。"}, {"t": 144.91666666666666, "x": "ダイモスは「恐怖」を意味します。"}, {"t": 147.73333333333332, "x": "火星のそばには、恐れと恐怖が、"}, {"t": 150.18333333333334, "x": "並んで回っていることになりました。"}, {"t": 152.58333333333334, "x": "ただ、望遠鏡で見えたのは、どちらも点だけです。"}, {"t": 156.41666666666666, "x": "形は分かりません。"}, {"t": 157.81666666666666, "x": "のちに、形が分かるようになってから、"}, {"t": 160.38333333333333, "x": "フォボスにあるいちばん大きなくぼみに、"}, {"t": 162.91666666666666, "x": "一つの名前が付けられました。"}, {"t": 165.01666666666668, "x": "スティックニーです。"}, {"t": 166.18333333333334, "x": "ホールの妻、クロエ・"}, {"t": 167.76666666666668, "x": "アンジェリン・スティックニー・ホールの"}, {"t": 169.33333333333334, "x": "名前から取られました。"}, {"t": 170.66666666666666, "x": "NASAは、彼女を数学者として紹介しています。"}, {"t": 174.01666666666668, "x": "このくぼみは、差し渡し九キロメートルほどあります。"}, {"t": 177.55, "x": "フォボスの長いところは、二十七キロメートルほどです。"}, {"t": 181.11666666666667, "x": "その三分の一ほどの大きさのくぼみが、"}, {"t": 183.56666666666666, "x": "一つの面に開いていることになります。"}, {"t": 186.2, "x": "NASAの解説は、フォボスについて、大きな衝突で"}, {"t": 189.98333333333332, "x": "危うく砕けるところだった、と書いています。"}, {"t": 192.83333333333334, "x": "そのほかにも、何千もの隕石が"}, {"t": 195.25, "x": "ぶつかった跡が残っています。"}, {"t": 196.96666666666667, "x": "ダイモスのほうは、さらに小さな天体です。"}, {"t": 200.0, "x": "大きさは十五キロメートル、"}, {"t": 201.63333333333333, "x": "十二キロメートル、十一キロメートルほど。"}, {"t": 205.0, "x": "火星を一周するのに、およそ三十時間かかります。"}, {"t": 208.65, "x": "ダイモスにも、くぼみはあります。"}, {"t": 210.93333333333334, "x": "いちばん大きなものでも、差し渡し二・"}, {"t": 213.5, "x": "三キロメートルほど。"}, {"t": 215.01666666666668, "x": "スティックニーの五分の一ほどの大きさです。"}, {"t": 217.61666666666667, "x": "NASAは、ダイモスのほうが、"}, {"t": 219.48333333333332, "x": "表面がなめらかに見える、と書いています。"}, {"t": 222.7, "x": "くぼみのいくつかが、途中まで埋まっているためです。"}, {"t": 226.01666666666668, "x": "同じ年の同じ八月に、同じ人が見つけた、二つの月。"}, {"t": 230.58333333333334, "x": "けれども、その姿はずいぶん違っていました。"}, {"t": 233.68333333333334, "x": "一方のフォボスは、ずっと火星の"}, {"t": 235.95, "x": "近くを、ずっと速く回っています。"}, {"t": 238.41666666666666, "x": "見つかってから百年近く、この二つの月は、"}, {"t": 241.6, "x": "地球の望遠鏡の中で、点のままでした。"}, {"t": 244.95, "x": "形が分かるのは、探査機が火星の"}, {"t": 247.48333333333332, "x": "そばまで行くようになってからです。"}, {"t": 249.36666666666667, "x": "フォボスは、火星のまわりを、一日に三回まわっています。"}, {"t": 253.65, "x": "NASAの資料にある数字では、"}, {"t": 255.33333333333334, "x": "一周にかかる時間は、〇・三一八九一日。"}, {"t": 259.46666666666664, "x": "時間にすると、約七時間三十九分です。"}, {"t": 262.85, "x": "火星の一日の長さは、約二十四時間四十分。"}, {"t": 266.6333333333333, "x": "地球の一日より、四十分ほど長いくらいです。"}, {"t": 270.21666666666664, "x": "その間に、フォボスは三周してしまいます。"}, {"t": 273.26666666666665, "x": "火星の中心からの平均の距離は、"}, {"t": 275.51666666666665, "x": "九千三百七十八キロメートル。"}, {"t": 278.2, "x": "火星の赤道の半径が"}, {"t": 279.71666666666664, "x": "三千三百九十六キロメートルほどなので、地面からの"}, {"t": 283.51666666666665, "x": "高さに直すと、約六千キロメートルになります。"}, {"t": 286.8833333333333, "x": "火星そのものの半径の、二倍にも届かない高さです。"}, {"t": 290.68333333333334, "x": "フォボスは、火星の地面のすぐ上を"}, {"t": 293.15, "x": "回っていると言ってもいいほどの近さです。"}, {"t": 295.48333333333335, "x": "外側を回るダイモスは、火星の"}, {"t": 297.8833333333333, "x": "中心から二万三千四百五十九キロメートル。"}, {"t": 301.06666666666666, "x": "一周に、一・二六日ほどかかります。"}, {"t": 304.1333333333333, "x": "フォボスは、その内側の、ずっと低いところを"}, {"t": 307.46666666666664, "x": "回っています。"}, {"t": 308.3333333333333, "x": "あまりに近いので、火星の上の"}, {"t": 310.6, "x": "どこからでも見えるわけではありません。"}, {"t": 312.6666666666667, "x": "NASAは、火星の場所によっては、いつも"}, {"t": 315.6333333333333, "x": "見えるとは限らない、と説明しています。"}, {"t": 318.4, "x": "もう一つ、フォボスには、少しずつ"}, {"t": 321.15, "x": "起きていることがあります。"}, {"t": 322.55, "x": "火星に、近づいているのです。"}, {"t": 324.85, "x": "その速さは、百年で一・八メートルほど。"}, {"t": 328.0833333333333, "x": "人間の背の高さくらいの距離を、"}, {"t": 330.05, "x": "百年かけて縮めていることになります。"}, {"t": 332.78333333333336, "x": "NASAの見積もりでは、この割合が続けば、"}, {"t": 335.6666666666667, "x": "およそ五千万年後に、大きな変化が起きます。"}, {"t": 339.3, "x": "フォボスは火星に落ちるか、砕けて"}, {"t": 341.71666666666664, "x": "火星を取り巻く輪になる、とされています。"}, {"t": 344.5, "x": "いまの形のフォボスを近くで見られる"}, {"t": 346.7, "x": "時間は、限られていることになります。"}, {"t": 349.31666666666666, "x": "ただし、その長さは、五千万年です。"}, {"t": 352.5833333333333, "x": "フォボスの自転は、火星を回る周期とぴったり同じです。"}, {"t": 356.45, "x": "どちらも〇・三一八九一日。"}, {"t": 358.96666666666664, "x": "地球の月がいつも同じ面を地球に"}, {"t": 361.2, "x": "向けているのと同じように、フォボスも"}, {"t": 363.6166666666667, "x": "いつも同じ面を火星に向けて回っています。"}, {"t": 366.15, "x": "重さも分かっています。"}, {"t": 367.5833333333333, "x": "質量は、およそ一京キログラム。"}, {"t": 370.1333333333333, "x": "平均の密度は、一立方メートルあたり"}, {"t": 373.03333333333336, "x": "千九百キログラムです。"}, {"t": 374.6166666666667, "x": "水の密度が千キログラムですから、その二倍に届きません。"}, {"t": 378.65, "x": "地球の岩石よりも、ずいぶん軽い値です。"}, {"t": 381.8833333333333, "x": "小さくて、軽い。"}, {"t": 383.56666666666666, "x": "その軽さは、そのまま降りる側の問題にもなります。"}, {"t": 387.1666666666667, "x": "ドイツ航空宇宙センター、DLRは、フォボスの重力を、"}, {"t": 391.5, "x": "地球の千分の一にも満たない、と書いています。"}, {"t": 395.05, "x": "ものを手から離しても、なかなか落ちていきません。"}, {"t": 398.26666666666665, "x": "降りるというより、ほとんど重さのない岩に、"}, {"t": 401.1333333333333, "x": "そっと寄り添うような着地になります。"}, {"t": 403.6333333333333, "x": "フォボスの形が、はじめて近くから"}, {"t": 406.0833333333333, "x": "写されたのは、一九七〇年代のはじめです。"}, {"t": 409.6166666666667, "x": "一九七一年十一月十四日、アメリカの"}, {"t": 413.5, "x": "探査機マリナー九号が、火星のまわりを回りはじめました。"}, {"t": 417.4, "x": "打ち上げは、その年の五月三十日。"}, {"t": 420.3833333333333, "x": "地球以外の惑星を回る軌道に入った、最初の探査機です。"}, {"t": 424.75, "x": "マリナー九号は、火星の表面の"}, {"t": 427.23333333333335, "x": "八十五パーセントを地図にしました。"}, {"t": 429.4166666666667, "x": "一九七二年の十月二十七日に交信が終わるまでに、"}, {"t": 433.7, "x": "送った写真は七千三百二十九枚。"}, {"t": 436.71666666666664, "x": "そのうち、少なくとも八十枚が、"}, {"t": 439.31666666666666, "x": "フォボスとダイモスを写したものでした。"}, {"t": 441.8333333333333, "x": "点だったものに、はじめて形が与えられました。"}, {"t": 445.05, "x": "写っていたのは、丸い月ではありませんでした。"}, {"t": 448.1666666666667, "x": "じゃがいものような、でこぼこのかたまりです。"}, {"t": 451.01666666666665, "x": "表面には、くぼみがいくつも並んでいました。"}, {"t": 454.1, "x": "その後も、火星を回る探査機は、"}, {"t": 456.56666666666666, "x": "フォボスを何度も写しています。"}, {"t": 458.76666666666665, "x": "NASAの解説ページには、その中の一枚が載っています。"}, {"t": 462.55, "x": "火星を回る探査機、マーズ・リコネッサンス・オービター。"}, {"t": 466.15, "x": "そのカメラ、ハイライズが撮ったものです。"}, {"t": 468.8333333333333, "x": "そこから、表面の様子が少しずつ分かってきました。"}, {"t": 472.4, "x": "表面は、細かな塵におおわれています。"}, {"t": 475.35, "x": "マーズ・グローバル・サーベイヤーという"}, {"t": 477.18333333333334, "x": "探査機も、フォボスを写しました。"}, {"t": 479.55, "x": "その写真では、スティックニーのくぼみの中が、"}, {"t": 482.51666666666665, "x": "細かい塵で埋まっているように見えます。"}, {"t": 485.2, "x": "斜面を岩が滑り落ちた跡も見つかりました。"}, {"t": 488.0, "x": "隕石のぶつかる衝撃が、長い年月をかけて、"}, {"t": 491.3833333333333, "x": "表面を粉にしてきたと考えられています。"}, {"t": 494.3333333333333, "x": "温度も測られています。"}, {"t": 495.8833333333333, "x": "日の当たる側で、いちばん高いところが、マイナス四度。"}, {"t": 499.95, "x": "日の当たらない側では、マイナス百十二度まで下がります。"}, {"t": 503.75, "x": "NASAは、この差を、たとえで説明しています。"}, {"t": 507.23333333333335, "x": "日の当たる側は、アメリカの"}, {"t": 509.18333333333334, "x": "シカゴの、穏やかな冬の一日ほど。"}, {"t": 511.95, "x": "数キロメートル離れた日の当たらない側は、"}, {"t": 514.5166666666667, "x": "南極の夜よりも厳しい寒さです。"}, {"t": 517.1666666666666, "x": "数キロメートルしか離れていないのに、"}, {"t": 519.3833333333333, "x": "百度を超える差があります。"}, {"t": 521.35, "x": "表面の細かい塵が、熱をためておけないためだろう、と"}, {"t": 525.4833333333333, "x": "NASAは説明しています。"}, {"t": 526.95, "x": "大気は、ありません。"}, {"t": 528.6666666666666, "x": "そして、とても黒い天体です。"}, {"t": 531.1, "x": "光の跳ね返しやすさを表す数字、"}, {"t": 533.5666666666667, "x": "幾何アルベドは、〇・〇七。"}, {"t": 536.1666666666666, "x": "当たった光の、ほんの一部しか返しません。"}, {"t": 539.2333333333333, "x": "NASAは、フォボスとダイモスが、"}, {"t": 541.1666666666666, "x": "黒っぽい炭素を含む小惑星に似た"}, {"t": 543.8166666666667, "x": "岩石でできているように見える、と書いています。"}, {"t": 546.9166666666666, "x": "ここから、一つの大きな問いが生まれました。"}, {"t": 549.8166666666667, "x": "この二つの月は、どこから来たのか。"}, {"t": 552.4666666666667, "x": "JAXAは、この問いに、大きく二つの"}, {"t": 555.4, "x": "考えがあると整理しています。"}, {"t": 557.2166666666667, "x": "一つは、捕獲説。"}, {"t": 559.0, "x": "太陽系の外側のほうから飛んできた"}, {"t": 561.2666666666667, "x": "小惑星が、火星の重力につかまって、"}, {"t": 564.2166666666667, "x": "そのまま回りはじめた、という考えです。"}, {"t": 567.4, "x": "黒い色や、小惑星に似た見た目は、この考えに合います。"}, {"t": 571.85, "x": "もう一つは、巨大衝突説。"}, {"t": 574.25, "x": "大昔、火星に大きな天体がぶつかり、飛び散った破片が"}, {"t": 578.6, "x": "集まって、二つの月になった、という考えです。"}, {"t": 582.25, "x": "NASAの解説も、捕獲された小惑星かも"}, {"t": 585.2, "x": "しれない、と書いています。"}, {"t": 587.0166666666667, "x": "そのうえで、それに反する証拠を"}, {"t": 589.2833333333333, "x": "示す研究者もいる、と付け加えています。"}, {"t": 592.2833333333333, "x": "遠くから撮った写真や、光の色を"}, {"t": 594.75, "x": "分けた観測だけでは、決めきれていません。"}, {"t": 597.5166666666667, "x": "JAXAは、火星とその月がどのようにできたのかは、"}, {"t": 600.7666666666667, "x": "太陽系のでき方をめぐる、まだ解けていない"}, {"t": 604.05, "x": "問いの一つだ、と書いています。"}, {"t": 606.1166666666667, "x": "小さな月の生まれを知ることが、惑星のでき方を"}, {"t": 609.5166666666667, "x": "知ることにつながる、という考えです。"}, {"t": 612.15, "x": "決めるためには、実際に表面の"}, {"t": 614.4833333333333, "x": "砂を手に取って、調べる必要があります。"}, {"t": 617.4166666666666, "x": "地球から、いちばん近くにある、よその月。"}, {"t": 620.9333333333333, "x": "その砂を取りに行こうという計画は、"}, {"t": 623.1333333333333, "x": "実は、四十年近く前から始まっていました。"}, {"t": 626.75, "x": "一九八八年七月七日。"}, {"t": 629.4333333333333, "x": "当時のソビエト連邦が、一機の探査機を打ち上げました。"}, {"t": 633.3166666666667, "x": "名前は、フォボス一号。"}, {"t": 635.3166666666667, "x": "五日後の七月十二日。"}, {"t": 637.25, "x": "同じ形をした、もう一機が打ち上げられました。"}, {"t": 640.6, "x": "フォボス二号です。"}, {"t": 641.8333333333334, "x": "どちらも、プロトンKという"}, {"t": 643.7333333333333, "x": "大きなロケットで打ち上げられています。"}, {"t": 645.9333333333333, "x": "一機の重さは、二千六百キログラム。"}, {"t": 648.8, "x": "火星を回る軌道に入るための装置をつけた"}, {"t": 651.5166666666667, "x": "状態では、六千二百二十キログラムありました。"}, {"t": 654.95, "x": "二機には、あわせて二十五を"}, {"t": 656.9833333333333, "x": "超える観測機器が積まれていました。"}, {"t": 659.15, "x": "計画は、三つの段階に分かれていました。"}, {"t": 662.2166666666667, "x": "一つ目は、地球から火星へ向かう途中で、"}, {"t": 665.1333333333333, "x": "太陽や、惑星のあいだの空間を調べること。"}, {"t": 668.8, "x": "二つ目は、火星のまわりを回りながら、"}, {"t": 671.4833333333333, "x": "火星と、その月フォボスを調べること。"}, {"t": 674.65, "x": "一つ目と二つ目の段階だけでも、"}, {"t": 676.7333333333333, "x": "調べることは多くありました。"}, {"t": 678.9, "x": "太陽の観測。"}, {"t": 680.1666666666666, "x": "火星のまわりの、電気を帯びた粒子の様子。"}, {"t": 683.3833333333333, "x": "火星の表面と大気。"}, {"t": 685.05, "x": "そして、フォボスの表面が何でできているのか。"}, {"t": 688.3, "x": "そして三つ目が、この計画の中心でした。"}, {"t": 691.45, "x": "フォボスの表面から、五十メートル以内にまで"}, {"t": 694.55, "x": "近づくことです。"}, {"t": 695.5833333333334, "x": "長さ二十七キロメートルほどの"}, {"t": 697.5166666666667, "x": "岩のかたまりに、五十メートルまで寄る。"}, {"t": 700.1833333333333, "x": "そこまで近づけば、表面をくわしく撮影し、"}, {"t": 703.5166666666667, "x": "表の砂や岩が何でできているのかを調べられるはずでした。"}, {"t": 707.45, "x": "さらに、二つの着陸機を、フォボスに下ろす計画でした。"}, {"t": 711.6833333333333, "x": "一つは、同じ場所にとどまって"}, {"t": 713.8333333333334, "x": "観測を続ける、据え置き型の着陸機。"}, {"t": 716.8833333333333, "x": "もう一つは、跳ねるようにして表面を"}, {"t": 719.4333333333333, "x": "移動する、「ホッパー」と呼ばれる着陸機でした。"}, {"t": 722.8833333333333, "x": "機体の真ん中には、中の圧力を保った、"}, {"t": 725.9166666666666, "x": "輪の形の電子機器の部屋がありました。"}, {"t": 728.6833333333333, "x": "その輪に囲まれて、観測のための円筒形の区画があります。"}, {"t": 732.8666666666667, "x": "下には、向きを整えるための燃料を入れた、"}, {"t": 735.9833333333333, "x": "丸いタンクが四つ並んでいました。"}, {"t": 738.4, "x": "探査機の向きは、太陽や星を見る"}, {"t": 740.9166666666666, "x": "センサーで保たれていました。"}, {"t": 742.5666666666667, "x": "向きを整えるための小さな噴射口は、二十八基。"}, {"t": 746.35, "x": "太陽電池の板を太陽へ向けることで、"}, {"t": 748.9166666666666, "x": "電気を作っていました。"}, {"t": 750.6833333333333, "x": "打ち上げから二か月ほどたった、八月の終わり。"}, {"t": 754.0, "x": "地上から、フォボス一号に、"}, {"t": 756.1333333333333, "x": "いつものように指令が送られました。"}, {"t": 758.6333333333333, "x": "八月二十九日から三十日にかけてのことです。"}, {"t": 761.9666666666667, "x": "その指令の中に、誤りが含まれていました。"}, {"t": 765.3, "x": "NASAの資料は、そのとき送られた"}, {"t": 767.5666666666667, "x": "ソフトウェアの誤りが、向きを保つための"}, {"t": 770.3, "x": "噴射口を止めてしまった、と記録しています。"}, {"t": 773.2833333333333, "x": "噴射口が止まると、探査機は"}, {"t": 775.5, "x": "自分の向きを保てなくなります。"}, {"t": 777.45, "x": "太陽の方向を見失い、太陽電池の板が、"}, {"t": 780.85, "x": "太陽からそれていきました。"}, {"t": 782.85, "x": "電気が作れなくなると、蓄えていた"}, {"t": 785.4666666666667, "x": "電池を使うしかありません。"}, {"t": 787.0833333333334, "x": "その電池も、やがて尽きました。"}, {"t": 789.3833333333333, "x": "九月の初め、予定されていた交信の時間になっても、"}, {"t": 793.0166666666667, "x": "フォボス一号からの声は届きませんでした。"}, {"t": 796.0166666666667, "x": "火星に着く前のことです。"}, {"t": 797.75, "x": "フォボス一号は、そのまま戻りませんでした。"}, {"t": 800.85, "x": "二機で出発した計画は、ここから、"}, {"t": 803.4666666666667, "x": "一機だけで続くことになりました。"}, {"t": 805.8166666666667, "x": "残ったフォボス二号は、順調に飛び続けました。"}, {"t": 809.2833333333333, "x": "打ち上げから九日後の七月二十一日には、"}, {"t": 812.3, "x": "最初の軌道の修正も済ませています。"}, {"t": 815.05, "x": "途中で太陽や惑星のあいだの空間を調べながら、"}, {"t": 818.3, "x": "半年あまりをかけて火星へ向かいます。"}, {"t": 821.0166666666667, "x": "一九八九年一月二十九日。"}, {"t": 824.1166666666667, "x": "フォボス二号は、エンジンを噴いて速さを"}, {"t": 826.7833333333333, "x": "落とし、火星のまわりを回る軌道に入りました。"}, {"t": 830.0833333333334, "x": "はじめは、細長い楕円の軌道です。"}, {"t": 832.7666666666667, "x": "ここから、少しずつ、フォボスに"}, {"t": 835.3, "x": "寄せていく作業が始まりました。"}, {"t": 837.2, "x": "二月には、何度か軌道を直して、フォボスと"}, {"t": 840.5833333333334, "x": "ほとんど同じ、円に近い軌道に移りました。"}, {"t": 843.7333333333333, "x": "フォボスよりも、少しだけ高いところです。"}, {"t": 846.5833333333334, "x": "三月に入ると、さらに細かい修正が重ねられました。"}, {"t": 850.5833333333334, "x": "探査機は、フォボスと歩調を合わせて回る軌道に入ります。"}, {"t": 854.4166666666666, "x": "フォボスのすぐそばを、つかず離れず、並んで飛ぶ形です。"}, {"t": 858.6666666666666, "x": "この間に、フォボス二号は、フォボスと"}, {"t": 861.5666666666667, "x": "火星についての記録を送り続けました。"}, {"t": 864.05, "x": "フランスの宇宙機関の資料は、フォボスとの"}, {"t": 866.7833333333333, "x": "会合のために火星の軌道まで入ったのは、"}, {"t": 869.3833333333333, "x": "この二号だけだった、と記しています。"}, {"t": 872.3, "x": "同じ資料は、二号に積まれた、電気を帯びた"}, {"t": 875.75, "x": "粒子の波を測る装置の記録にも触れています。"}, {"t": 878.7333333333333, "x": "太陽から吹き出す粒子の流れが、"}, {"t": 880.8666666666667, "x": "火星にぶつかってできる境目。"}, {"t": 883.2, "x": "その境目を二回横切ったときの様子を、火星の"}, {"t": 886.65, "x": "まわりで初めて測った、というものです。"}, {"t": 889.3833333333333, "x": "そして、探査機はさらにフォボスに"}, {"t": 891.7, "x": "近づけられていきました。"}, {"t": 893.1333333333333, "x": "計画の三つ目の段階、五十メートルまで寄って、"}, {"t": 896.5833333333334, "x": "二つの着陸機を下ろす段階は、もうすぐそこでした。"}, {"t": 900.5833333333334, "x": "NASAの惑星データの保管庫には、その段階で"}, {"t": 903.7, "x": "何をするはずだったのかも書かれています。"}, {"t": 906.0333333333333, "x": "表面を細かく写すこと。"}, {"t": 907.9333333333333, "x": "表面の砂の元素や鉱物を調べること。"}, {"t": 910.8166666666667, "x": "フォボスの内側のつくりを調べること。"}, {"t": 913.2333333333333, "x": "そして、着陸機を下ろすことです。"}, {"t": 915.8666666666667, "x": "一九八九年三月二十七日。"}, {"t": 919.0166666666667, "x": "その日、フォボス二号は、フォボスを"}, {"t": 921.7666666666667, "x": "撮影するために、向きを変えました。"}, {"t": 924.3333333333334, "x": "カメラの視野を、フォボスに向けるためです。"}, {"t": 927.1666666666666, "x": "撮影が行われました。"}, {"t": 928.9333333333333, "x": "そのあと、電波が途絶えました。"}, {"t": 931.2833333333333, "x": "地上では、探査機からの信号を、"}, {"t": 933.7666666666667, "x": "もう一度つかまえようとしました。"}, {"t": 936.0166666666667, "x": "けれども、うまくいきませんでした。"}, {"t": 938.3833333333333, "x": "NASAの資料は、信号を取り戻せなかったことで、"}, {"t": 941.6333333333333, "x": "この計画が終わった、と書いています。"}, {"t": 944.5666666666667, "x": "原因について、NASAの資料は、"}, {"t": 946.8666666666667, "x": "探査機に積まれていたコンピューターの"}, {"t": 949.15, "x": "故障だったと判断された、と記しています。"}, {"t": 952.05, "x": "五十メートルまで近づく段階の、少し前でした。"}, {"t": 955.5833333333334, "x": "二つの着陸機は、切り離されることのないまま、"}, {"t": 958.85, "x": "探査機と一緒に声を失いました。"}, {"t": 961.3833333333333, "x": "据え置き型の着陸機も、跳ねて進むはずだったホッパーも、"}, {"t": 965.3166666666667, "x": "フォボスの地面には一度も触れていません。"}, {"t": 968.05, "x": "それでも、この計画が"}, {"t": 969.8333333333334, "x": "何も残さなかったわけではありません。"}, {"t": 972.0, "x": "二号が火星を回っていたおよそ二か月のあいだに"}, {"t": 974.8833333333333, "x": "集めた記録は、地球に届いていました。"}, {"t": 977.65, "x": "太陽、惑星のあいだの空間、"}, {"t": 980.0166666666667, "x": "火星、そしてフォボスについての記録です。"}, {"t": 983.2166666666667, "x": "アメリカの惑星データの保管庫には、いまも"}, {"t": 986.1333333333333, "x": "フォボス二号の観測記録が収められています。"}, {"t": 988.95, "x": "一九八九年の十月には、イギリスの科学雑誌ネイチャーに、"}, {"t": 993.7333333333333, "x": "この計画の経過をまとめた報告が載りました。"}, {"t": 997.0, "x": "同じ号には、二つ目の段階で得られた成果を"}, {"t": 1000.1666666666666, "x": "まとめた論文が、十四本並んでいます。"}, {"t": 1003.1166666666667, "x": "三つ目の段階の論文は、ありません。"}, {"t": 1005.9833333333333, "x": "フォボスの五十メートル手前までの"}, {"t": 1007.9333333333333, "x": "記録は、そこで止まっています。"}, {"t": 1010.0833333333334, "x": "そのあと、ソビエト連邦という国はなくなりました。"}, {"t": 1013.6, "x": "フォボスへもう一度行く計画が形になるまでには、"}, {"t": 1016.6, "x": "二十年以上の時間がかかることになります。"}, {"t": 1019.65, "x": "二〇一一年十一月八日、世界時。"}, {"t": 1022.9166666666666, "x": "ゼニットというロケットが、"}, {"t": 1024.2833333333333, "x": "一機の探査機を打ち上げました。"}, {"t": 1026.6, "x": "名前は、フォボス・グルント。"}, {"t": 1028.6666666666667, "x": "グルントは、ロシア語で「土」を意味します。"}, {"t": 1032.4166666666667, "x": "フォボスの土。"}, {"t": 1033.5, "x": "名前が、そのまま計画の中身でした。"}, {"t": 1036.3333333333333, "x": "フォボスに降りて、表面の土を採り、地球に持ち帰る。"}, {"t": 1040.55, "x": "かつてのフォボス一号と二号が"}, {"t": 1042.3833333333334, "x": "目指した「近づく」「下ろす」の、"}, {"t": 1045.4666666666667, "x": "さらに先を行く計画です。"}, {"t": 1047.5666666666666, "x": "ヨーロッパ宇宙機関、ESAの資料に"}, {"t": 1050.2, "x": "よれば、探査機の重さは十三・五トン。"}, {"t": 1053.0833333333333, "x": "そのうち、およそ十一トンが推進剤、つまり燃料でした。"}, {"t": 1057.55, "x": "フォボス二号は、軌道に入るための装置を"}, {"t": 1060.4666666666667, "x": "含めても、六千二百二十キログラムでした。"}, {"t": 1063.6333333333334, "x": "その二倍あまりの重さです。"}, {"t": 1065.4666666666667, "x": "積み荷は、それだけではありませんでした。"}, {"t": 1068.1833333333334, "x": "一つは、中国の小さな探査機、蛍火一号です。"}, {"t": 1072.4166666666667, "x": "フォボス・グルントに運ばれて火星まで行き、"}, {"t": 1074.8166666666666, "x": "そこで切り離されて、火星を回る予定でした。"}, {"t": 1078.4166666666667, "x": "もう一つは、アメリカの惑星協会が"}, {"t": 1081.1166666666666, "x": "用意した、小さな実験です。"}, {"t": 1083.35, "x": "名前は、ライフ。"}, {"t": 1084.9, "x": "地球に帰ってくる予定のカプセルの中に、重さ"}, {"t": 1088.1333333333334, "x": "八十八グラムのチタンの筒が入っていました。"}, {"t": 1090.95, "x": "筒の中には、三十一個の小さな容器があります。"}, {"t": 1094.6166666666666, "x": "入っていたのは、十種類の小さな生き物と、"}, {"t": 1097.75, "x": "土のサンプル一つでした。"}, {"t": 1099.6666666666667, "x": "細菌、古細菌、そして細胞の中に核を持つ生き物。"}, {"t": 1104.1, "x": "地球の生き物を大きく三つに分けた、"}, {"t": 1106.3833333333334, "x": "そのすべての仲間が選ばれていました。"}, {"t": 1109.0, "x": "地球と火星のあいだを行って帰るのに、およそ三十四か月。"}, {"t": 1113.1833333333334, "x": "そのあいだ、地球の磁気に守られない宇宙を"}, {"t": 1116.1, "x": "旅した生き物が、生きて戻れるかどうか。"}, {"t": 1118.9166666666667, "x": "それを確かめる実験でした。"}, {"t": 1120.8, "x": "帰ってきたら、地球に残しておいた同じ生き物と"}, {"t": 1124.1333333333334, "x": "比べて、どう変わったのかを調べる予定でした。"}, {"t": 1127.2666666666667, "x": "実験を報告した論文は、帰還カプセルを、"}, {"t": 1130.4666666666667, "x": "バスケットボールほどの大きさ、と書いています。"}, {"t": 1133.8, "x": "打ち上げは、うまくいきました。"}, {"t": 1135.9833333333333, "x": "探査機は、最初に、地球を回る軌道に入りました。"}, {"t": 1140.0333333333333, "x": "いちばん低いところで二百六キロメートル、"}, {"t": 1142.5333333333333, "x": "いちばん高いところで三百四十一キロメートル。"}, {"t": 1146.0, "x": "ここから、探査機自身のエンジンを噴いて、"}, {"t": 1148.8166666666666, "x": "地球を離れ、火星へ向かう道に乗る予定でした。"}, {"t": 1152.5666666666666, "x": "そのエンジンが、噴きませんでした。"}, {"t": 1154.95, "x": "フォボス・グルントは、地球を回る"}, {"t": 1157.1666666666667, "x": "低い軌道に、とどまったままになりました。"}, {"t": 1159.9666666666667, "x": "しかも、地上から呼びかけても、返事がありません。"}, {"t": 1163.5666666666666, "x": "そのまま、二週間ほどが過ぎました。"}, {"t": 1166.25, "x": "十一月二十二日、世界時の二十時二十五分。"}, {"t": 1170.0666666666666, "x": "オーストラリアの西の町、パースにあるESAのアンテナが、"}, {"t": 1173.6666666666667, "x": "フォボス・グルントからの電波をとらえました。"}, {"t": 1176.3166666666666, "x": "直径十五メートルのアンテナです。"}, {"t": 1178.4333333333334, "x": "打ち上げの直後、ロケットから"}, {"t": 1180.5166666666667, "x": "切り離されたとき以来の、はじめての交信でした。"}, {"t": 1183.8666666666666, "x": "簡単なことではありませんでした。"}, {"t": 1185.9333333333334, "x": "軌道が正確には分かっていなかったため、細い"}, {"t": 1189.1166666666666, "x": "ビームのアンテナを向けるのが難しかったのです。"}, {"t": 1191.8666666666666, "x": "しかも、探査機の受信機は、"}, {"t": 1193.95, "x": "ごく弱い電波を受けるための作りでした。"}, {"t": 1196.7666666666667, "x": "パースのアンテナは、この交信のために"}, {"t": 1199.3833333333334, "x": "手を加えられました。"}, {"t": 1200.6333333333334, "x": "地上から「送信機を入れよ」という指令を送ると、"}, {"t": 1204.4833333333333, "x": "探査機はそれに応えて、電波を出しました。"}, {"t": 1207.85, "x": "このときは、中身のない電波だけでした。"}, {"t": 1210.7, "x": "翌日の二十三日には、探査機の"}, {"t": 1213.3833333333334, "x": "状態を伝えるデータが届きました。"}, {"t": 1215.5833333333333, "x": "ESAは、その日の信号は、"}, {"t": 1217.65, "x": "前日よりずっと強かったと伝えています。"}, {"t": 1220.5833333333333, "x": "ただ、交信は六分間ほどだったとされています。"}, {"t": 1223.9666666666667, "x": "二十四日の早朝。"}, {"t": 1225.4333333333334, "x": "探査機の位置が変わり、もう一つの"}, {"t": 1227.8333333333333, "x": "アンテナを使う必要が出てきました。"}, {"t": 1229.95, "x": "その交信では、信号は受かりませんでした。"}, {"t": 1233.0833333333333, "x": "その後、つながりは戻りませんでした。"}, {"t": 1235.7666666666667, "x": "十二月十三日。"}, {"t": 1237.3166666666666, "x": "ロシアの宇宙機関、ロスコスモスは、"}, {"t": 1239.9, "x": "フォボス・グルントが失われたと宣言しました。"}, {"t": 1242.9166666666667, "x": "火星へは、一歩も向かえないままでした。"}, {"t": 1245.7333333333333, "x": "地球を回る低い軌道には、ごく薄い空気が残っています。"}, {"t": 1249.8333333333333, "x": "その空気の抵抗で、探査機は"}, {"t": 1252.1666666666667, "x": "少しずつ高さを下げていきました。"}, {"t": 1254.2, "x": "いずれ、大気の中に落ちてきます。"}, {"t": 1256.7166666666667, "x": "十一トンほどの燃料を積んだまま"}, {"t": 1258.75, "x": "落ちてくる、十三・五トンの機体。"}, {"t": 1261.3166666666666, "x": "どこに、いつ落ちるのか。"}, {"t": 1263.3, "x": "年が明けた二〇一二年一月二日。"}, {"t": 1265.9166666666667, "x": "宇宙のごみについて、世界の"}, {"t": 1268.0666666666666, "x": "十二の宇宙機関が話し合う場があります。"}, {"t": 1270.6166666666666, "x": "そこで、落ちてくる時刻と場所を予測する、"}, {"t": 1273.5166666666667, "x": "国際的な取り組みが始まりました。"}, {"t": 1276.15, "x": "取りまとめたのは、ESAの宇宙ごみの担当部署です。"}, {"t": 1279.7166666666667, "x": "各国が観測した軌道の記録を持ち寄り、"}, {"t": 1282.3666666666666, "x": "予測を少しずつ絞り込んでいきました。"}, {"t": 1285.1166666666666, "x": "ESAの見積もりでは、地表まで燃え残る"}, {"t": 1287.8333333333333, "x": "破片は、多くても二十個から三十個ほど。"}, {"t": 1290.9, "x": "合わせて二百キログラムに満たない、とされました。"}, {"t": 1294.15, "x": "燃料のタンクは、地上からずっと高いところで破れ、"}, {"t": 1297.6333333333334, "x": "中の燃料は散ってしまうとされていました。"}, {"t": 1300.5, "x": "二〇一二年一月十五日。"}, {"t": 1302.7333333333333, "x": "ESAの最終的な予測は、世界時の十七時四十五分でした。"}, {"t": 1307.25, "x": "アメリカの戦略軍は、その後、大気に入った"}, {"t": 1310.7833333333333, "x": "時刻を十七時四十六分と確認しました。"}, {"t": 1313.75, "x": "位置は、高さ八十キロメートルで、"}, {"t": 1316.2333333333333, "x": "南緯四十六度、西経八十七度。"}, {"t": 1319.45, "x": "南アメリカの沿岸に近い、太平洋の上です。"}, {"t": 1323.05, "x": "ただ、惑星協会は、この時刻と場所が、"}, {"t": 1326.3833333333334, "x": "実際に見て確かめたものではなく、"}, {"t": 1328.85, "x": "計算で出した値だと注意しています。"}, {"t": 1331.5, "x": "もう少し早く、あるいは遅く、"}, {"t": 1333.8833333333334, "x": "大気に入った可能性もあります。"}, {"t": 1336.3166666666666, "x": "落ちたのが太平洋なのか、それとも別の場所なのか。"}, {"t": 1340.0, "x": "はっきりとは分かっていません。"}, {"t": 1341.7333333333333, "x": "フォボスの土を入れて帰ってくるはずだった"}, {"t": 1344.0, "x": "カプセルも、十種類の生き物を入れた"}, {"t": 1346.45, "x": "八十八グラムの筒も、その機体の中にありました。"}, {"t": 1350.0, "x": "落ちた場所がはっきりしない以上、それらが"}, {"t": 1352.75, "x": "どうなったのかも、分かっていません。"}, {"t": 1355.0, "x": "実験の論文には、地球に残しておいた比べるための試料は、"}, {"t": 1359.1833333333334, "x": "まだ開けられていない、と書かれています。"}, {"t": 1362.0666666666666, "x": "なぜ、エンジンは噴かなかったのか。"}, {"t": 1364.5333333333333, "x": "二〇一二年の二月、ロシア側の"}, {"t": 1367.1833333333334, "x": "調査の結果が伝えられました。"}, {"t": 1369.05, "x": "報道によれば、探査機のコンピューターが、"}, {"t": 1371.8, "x": "二重に再起動していたとされました。"}, {"t": 1374.3166666666666, "x": "二つの部品が同時に立ち上がりなおし、"}, {"t": 1376.7666666666667, "x": "待機の状態に入ってしまった、というのです。"}, {"t": 1380.25, "x": "その原因として、ロスコスモスの長官は、"}, {"t": 1383.2166666666667, "x": "宇宙から飛んでくる、電気を帯びた重い粒子の"}, {"t": 1386.7166666666667, "x": "影響が最も考えられる、と説明しました。"}, {"t": 1389.95, "x": "放射線が、コンピューターのメモリーの"}, {"t": 1392.4, "x": "部品に不具合を起こした、という見方です。"}, {"t": 1395.3333333333333, "x": "もう一つ、調査の結果を伝えた記事には、"}, {"t": 1398.2666666666667, "x": "設計についての指摘もありました。"}, {"t": 1400.7, "x": "この探査機は、地球を回る待機の"}, {"t": 1403.1833333333334, "x": "軌道を離れたあとでなければ、緊急の指令を"}, {"t": 1406.35, "x": "受け取れない作りだった、とされています。"}, {"t": 1408.9166666666667, "x": "そうだとすれば、答えは一つです。"}, {"t": 1411.4833333333333, "x": "地球のまわりで止まった探査機に、いくら呼びかけても、"}, {"t": 1414.9333333333334, "x": "それを受け取る仕組みがありませんでした。"}, {"t": 1417.5166666666667, "x": "フォボス一号は、送った指令の誤りで。"}, {"t": 1420.55, "x": "フォボス二号は、コンピューターの故障で。"}, {"t": 1423.3166666666666, "x": "フォボス・グルントは、地球を"}, {"t": 1425.2166666666667, "x": "離れるためのエンジンが噴かないまま。"}, {"t": 1427.3, "x": "三機のうち、フォボスのそばまで行けたのは"}, {"t": 1430.1166666666666, "x": "一機だけでした。"}, {"t": 1431.05, "x": "その一機も、五十メートルの手前で声を失っています。"}, {"t": 1434.8833333333334, "x": "フォボスそのものが、降りるのを"}, {"t": 1436.9, "x": "拒んだわけではありません。"}, {"t": 1438.4166666666667, "x": "そこへ行くまでの長い道のりのどこかで、"}, {"t": 1440.8833333333334, "x": "どの機体も止まってしまいました。"}, {"t": 1443.0833333333333, "x": "フォボス・グルントが落ちてから五年後の、二〇一七年。"}, {"t": 1446.7666666666667, "x": "日本とフランスの宇宙機関が、火星の月から"}, {"t": 1449.95, "x": "砂を持ち帰る計画の検討について、取り決めを結びました。"}, {"t": 1454.2166666666667, "x": "それが、MMXです。"}, {"t": 1456.4166666666667, "x": "英語で「火星の衛星の探査」を意味する言葉の頭文字です。"}, {"t": 1461.2333333333333, "x": "もとになったのは、日本の探査機「はやぶさ2」が"}, {"t": 1465.2833333333333, "x": "成し遂げたことでした。"}, {"t": 1466.5166666666667, "x": "小惑星まで行き、表面の砂や石を採って、地球に持ち帰る。"}, {"t": 1471.45, "x": "それを、火星の月でやる計画です。"}, {"t": 1474.2333333333333, "x": "はじめは、二〇二四年度の打ち上げが目指されていました。"}, {"t": 1478.1333333333334, "x": "二〇二三年の十二月、国の宇宙計画の工程表を"}, {"t": 1482.35, "x": "改める案の中で、打ち上げは二〇二六年度に移されました。"}, {"t": 1486.6833333333334, "x": "JAXAは、この計画の目的を、"}, {"t": 1489.1, "x": "科学と技術の二つに分けています。"}, {"t": 1491.6166666666666, "x": "科学の目的は、火星の月の生まれを明らかにし、火星と"}, {"t": 1496.0166666666667, "x": "その二つの月がどう移り変わってきたのかを知ること。"}, {"t": 1499.15, "x": "技術の目的は、火星のあたりまで行って帰ってくること。"}, {"t": 1502.9833333333333, "x": "天体の表面で砂を採ること。"}, {"t": 1505.1333333333334, "x": "そして、新しい地上のアンテナを使って、"}, {"t": 1508.1666666666667, "x": "遠くの探査機とやり取りすることです。"}, {"t": 1510.7333333333333, "x": "JAXAの計画では、打ち上げから"}, {"t": 1513.0666666666666, "x": "およそ一年で、火星の近くに着きます。"}, {"t": 1515.9333333333334, "x": "そこで、擬周回軌道と呼ばれる道に入ります。"}, {"t": 1519.35, "x": "フォボスの近くを離れずに飛び続けるための軌道です。"}, {"t": 1522.7166666666667, "x": "ここから、さまざまな観測を行います。"}, {"t": 1525.6666666666667, "x": "火星のあたりに、三年間とどまる予定です。"}, {"t": 1528.8333333333333, "x": "積んでいく科学の観測機器は、十一台。"}, {"t": 1531.9333333333334, "x": "そのうちの四台は、海外の機関から提供されています。"}, {"t": 1535.8833333333334, "x": "その顔ぶれは、フォボスに降りる前に、"}, {"t": 1538.4666666666667, "x": "フォボスをくまなく調べるためのものです。"}, {"t": 1541.1166666666666, "x": "テングーという望遠鏡は、フォボスの表面を、"}, {"t": 1544.2166666666667, "x": "約四十センチメートルの細かさで写す計画です。"}, {"t": 1547.8, "x": "この写真は、降りる場所が安全か"}, {"t": 1550.25, "x": "どうかを確かめるのにも使われます。"}, {"t": 1552.4, "x": "オロチというカメラは、表面の色を、"}, {"t": 1554.9, "x": "いくつもの波長に分けて写します。"}, {"t": 1557.4, "x": "水を含む鉱物や、有機物がどこにあるのかを探すためです。"}, {"t": 1561.6666666666667, "x": "フランスと組んで作った近赤外線の装置、"}, {"t": 1564.3666666666666, "x": "ミルスは、表面のどこに、水に"}, {"t": 1567.3666666666666, "x": "関わる鉱物や有機物があるのかを調べます。"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();

  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
