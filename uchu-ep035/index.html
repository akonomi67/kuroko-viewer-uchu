<script>
const D={"name": "ep035", "file": "ep035", "dur": 1811.7, "segs": [], "subs": [{"t": 0.0, "x": "月の上に、頭を下にして止まっている探査機があります。"}, {"t": 3.8666666666666667, "x": "日本の月着陸機スリムです。"}, {"t": 6.016666666666667, "x": "エンジンの口は空を向いています。"}, {"t": 8.15, "x": "反対側の端は、月の砂の方を向いています。"}, {"t": 11.516666666666667, "x": "本当は脚で立つはずでした。"}, {"t": 13.4, "x": "それでも着いた場所は、ねらいのすぐ近くでした。"}, {"t": 16.616666666666667, "x": "この機体が試したのは、ねらった点に降りる技術です。"}, {"t": 20.25, "x": "月に降りた機体は、それまでにもありました。"}, {"t": 23.266666666666666, "x": "ただ、ねらいからのずれは数キロから10数キロでした。"}, {"t": 26.866666666666667, "x": "スリムがめざしたのは100メートルです。"}, {"t": 29.166666666666668, "x": "降下の途中、高さ50メートルの所。"}, {"t": 32.25, "x": "スリムは、ねらいの点から3、4メートルの位置にいました。"}, {"t": 36.46666666666667, "x": "ところが、その直後です。"}, {"t": 38.5, "x": "2つあるエンジンの一つから"}, {"t": 40.11666666666667, "x": "部品が外れて落ちていきました。"}, {"t": 42.0, "x": "残る一つで、機体は降り続けます。"}, {"t": 44.71666666666667, "x": "月に着いたとき、姿勢は逆立ちになっていました。"}, {"t": 48.13333333333333, "x": "太陽の光を受ける板は西を向いていました。"}, {"t": 51.06666666666667, "x": "電気が作れず、機体はいったん眠ります。"}, {"t": 54.05, "x": "そこから、計画になかったことが続きました。"}, {"t": 57.2, "x": "目を覚まして岩を調べ、月の夜を3度越えたのです。"}, {"t": 60.96666666666667, "x": "この回は、その降下の20分と、"}, {"t": 63.56666666666667, "x": "そのあとの7か月の記録です。"}, {"t": 65.93333333333334, "x": "月に降りるのは難しい仕事です。"}, {"t": 68.25, "x": "空気が無いので、パラシュートは使えません。"}, {"t": 71.15, "x": "エンジンを下へ噴いて、速さを殺しながら降ります。"}, {"t": 74.6, "x": "やり直しはききません。"}, {"t": 76.13333333333334, "x": "だから、これまでの着陸機は安全な場所を選んできました。"}, {"t": 80.08333333333333, "x": "選ばれたのは平らに開けた土地です。"}, {"t": 82.26666666666667, "x": "広くて、大きな岩の少ない所です。"}, {"t": 85.18333333333334, "x": "ねらいの点から数キロずれても困りません。"}, {"t": 87.8, "x": "スリムの資料にも書かれています。"}, {"t": 89.9, "x": "従来の月着陸の精度は数キロから10数キロです。"}, {"t": 93.43333333333334, "x": "ところが、月の地図はどんどん細かくなりました。"}, {"t": 96.7, "x": "日本のかぐやとアメリカの月周回機が、"}, {"t": 99.28333333333333, "x": "月面を細かく写したからです。"}, {"t": 101.71666666666667, "x": "いまの研究者は、もっと細かい話をします。"}, {"t": 105.03333333333333, "x": "資料の言葉では、「あのクレーターの隣のあの岩」です。"}, {"t": 109.2, "x": "その岩をそばで調べたい。"}, {"t": 110.95, "x": "そうなると、数キロのずれでは届きません。"}, {"t": 113.9, "x": "目当ての岩のそばに降りる技術がいります。"}, {"t": 116.58333333333333, "x": "これをピンポイント着陸と呼びます。"}, {"t": 118.81666666666666, "x": "小惑星に降りた日本のはやぶさは"}, {"t": 121.01666666666667, "x": "細かい降下をこなしました。"}, {"t": 122.76666666666667, "x": "けれど小惑星の重力は、月より何桁も小さいのです。"}, {"t": 126.8, "x": "ゆっくり近づくことができます。"}, {"t": 128.73333333333332, "x": "危なければ、上へ逃げることもできます。"}, {"t": 131.6, "x": "月ではそれができません。"}, {"t": 133.23333333333332, "x": "重力が強いからです。"}, {"t": 134.85, "x": "重力に引かれながら、一度で降りきるしかないのです。"}, {"t": 138.43333333333334, "x": "月のような重力のある天体で、ねらいどおりに"}, {"t": 141.66666666666666, "x": "降りた例はまだありませんでした。"}, {"t": 143.48333333333332, "x": "その最初の1機を小さな機体でやってみる。"}, {"t": 146.2, "x": "それがスリムの計画でした。"}, {"t": 148.08333333333334, "x": "源流は2002年ごろの月着陸の検討です。"}, {"t": 151.3, "x": "2012年のことです。"}, {"t": 153.03333333333333, "x": "スリムの計画が提案されました。"}, {"t": 155.26666666666668, "x": "正式なプロジェクトになったのは2016年です。"}, {"t": 158.48333333333332, "x": "同じ年に別の出来事がありました。"}, {"t": 160.86666666666667, "x": "日本のX線天文衛星ひとみが"}, {"t": 163.38333333333333, "x": "運用をあきらめることになったのです。"}, {"t": 165.45, "x": "この出来事を受けて、スリムの計画も見直されます。"}, {"t": 169.11666666666667, "x": "使うロケットを変えることになりました。"}, {"t": 171.41666666666666, "x": "小型のイプシロンをやめて大型のH2Aに相乗りする形です。"}, {"t": 175.73333333333332, "x": "重さの条件も変わり、設計は1から見直しになりました。"}, {"t": 179.86666666666667, "x": "スリムには目的がもう一つありました。"}, {"t": 182.36666666666667, "x": "探査機を小さく軽くすることです。"}, {"t": 184.66666666666666, "x": "軽ければ、ほかの衛星と同じロケットに相乗りできます。"}, {"t": 188.56666666666666, "x": "相乗りできれば、探査の回数を増やせます。"}, {"t": 191.71666666666667, "x": "燃料を抜いた重さは、およそ200キロ。"}, {"t": 194.65, "x": "燃料を積むと、700キロあまりになります。"}, {"t": 197.86666666666667, "x": "積んだ燃料は、機体の重さの2.5倍をこえていました。"}, {"t": 201.88333333333333, "x": "高さは、およそ2.4メートル。"}, {"t": 204.41666666666666, "x": "人の背丈よりひと回り大きいくらいです。"}, {"t": 207.01666666666668, "x": "軽くする工夫は機体のあちこちにあります。"}, {"t": 209.63333333333333, "x": "燃料のタンクは、機体の骨組みも兼ねていました。"}, {"t": 213.05, "x": "メインエンジンの噴射口は焼き物の"}, {"t": 215.16666666666666, "x": "セラミックでできています。"}, {"t": 216.65, "x": "脚にも工夫があります。"}, {"t": 218.21666666666667, "x": "すき間の多い金属でできた部分があります。"}, {"t": 220.91666666666666, "x": "三Dプリンターで作った物です。"}, {"t": 223.21666666666667, "x": "機体を軽くするための工夫の一つです。"}, {"t": 225.75, "x": "太陽の光を受ける板は、薄い膜のような電池です。"}, {"t": 229.58333333333334, "x": "曲がった面に貼ったのは日本で初めてでした。"}, {"t": 232.35, "x": "電池も薄くて軽い物が選ばれました。"}, {"t": 234.8, "x": "月に降りた機体の中では、スリムがおそらく一番軽い。"}, {"t": 238.63333333333333, "x": "JAXAはそう考えています。"}, {"t": 240.45, "x": "最近の月着陸機と比べると、違いがよく分かります。"}, {"t": 244.38333333333333, "x": "JAXAの資料の数字では、ほかの機体は"}, {"t": 247.11666666666667, "x": "300キロ台から800キロほど。"}, {"t": 249.16666666666666, "x": "200キロのスリムは、その中で一番軽い部類でした。"}, {"t": 252.88333333333333, "x": "開発にかかったお金は149億円です。"}, {"t": 256.1, "x": "設計の途中でメインエンジンは"}, {"t": 258.0, "x": "一つから2つに増やされました。"}, {"t": 259.9166666666667, "x": "この2つめのエンジンがあとで機体を救うことになります。"}, {"t": 263.23333333333335, "x": "エンジンを増やしたことで機体の形は"}, {"t": 265.43333333333334, "x": "左右でそろわなくなりました。"}, {"t": 267.18333333333334, "x": "重心がかたよると、降りるときに姿勢が乱れます。"}, {"t": 270.7, "x": "技術者たちは機械の置き場所や"}, {"t": 272.55, "x": "配管の通り道を少しずつ動かしました。"}, {"t": 275.25, "x": "ミリ単位の調整です。"}, {"t": 276.8, "x": "最後はエンジンの付け位置も直して、"}, {"t": 279.0, "x": "重心を真ん中に近づけました。"}, {"t": 281.3833333333333, "x": "ただこのしくみには一つ弱いところもありました。"}, {"t": 284.3, "x": "燃料を送り出すしくみには、圧力が"}, {"t": 287.01666666666665, "x": "少しずつ下がる方式が使われていたのです。"}, {"t": 289.7, "x": "このことが、降下の最後に関わってきます。"}, {"t": 292.76666666666665, "x": "スリムが降りる場所は、長い話し合いで決まりました。"}, {"t": 296.26666666666665, "x": "月の表側の、赤道より少し南です。"}, {"t": 299.56666666666666, "x": "「神酒の海」と呼ばれる平原のそばにあります。"}, {"t": 302.8666666666667, "x": "そこに、シオリと名付けられたクレーターがあります。"}, {"t": 306.0833333333333, "x": "差し渡しは300メートルほど。"}, {"t": 308.21666666666664, "x": "月の上では、ごく小さなクレーターです。"}, {"t": 311.1, "x": "ねらいは、このクレーターのすぐそばでした。"}, {"t": 313.93333333333334, "x": "なぜ、こんな所を選んだのか。"}, {"t": 316.3333333333333, "x": "答えは、そこにある石です。"}, {"t": 318.53333333333336, "x": "スリムは、石の成分を調べるカメラを積んでいました。"}, {"t": 322.25, "x": "ねらいの一つはカンラン石という鉱物です。"}, {"t": 324.98333333333335, "x": "カンラン石は月の深い所から来たと考えられています。"}, {"t": 328.56666666666666, "x": "マントルと呼ばれる層です。"}, {"t": 330.26666666666665, "x": "クレーターができたときに深い所の石が"}, {"t": 332.68333333333334, "x": "はね飛ばされたかもしれません。"}, {"t": 334.4, "x": "その石を調べれば、月の生まれの手がかりになります。"}, {"t": 338.01666666666665, "x": "ただ、クレーターのそばは平らではありません。"}, {"t": 340.9166666666667, "x": "ねらいの点のあたりは最大で15度ほどの坂でした。"}, {"t": 344.1333333333333, "x": "小さく軽い機体が坂に立つのは危険です。"}, {"t": 346.8666666666667, "x": "脚を長く太くすれば安定します。"}, {"t": 349.28333333333336, "x": "でも、それでは重くなってしまいます。"}, {"t": 351.8666666666667, "x": "はじめの設計では、スリムは4本の脚で立つ機体でした。"}, {"t": 355.76666666666665, "x": "その形のままでは、長く太い脚が必要になります。"}, {"t": 359.56666666666666, "x": "そこで考えられたのが、2段階で降りる方法でした。"}, {"t": 363.28333333333336, "x": "案を出したのはJAXAの側でした。"}, {"t": 365.3666666666667, "x": "まず、機体の下側にある主な脚で地面に触れます。"}, {"t": 369.05, "x": "次に機体を前へ倒します。"}, {"t": 371.0, "x": "側面にある補助の脚で、体を受け止めます。"}, {"t": 374.21666666666664, "x": "最後は坂に寝そべるような姿で止まるのです。"}, {"t": 377.2, "x": "地面に触れる所は5か所ありました。"}, {"t": 379.55, "x": "この方法なら斜面でも転びにくくなります。"}, {"t": 382.3333333333333, "x": "機体を作る会社の技術者は、はじめ成功の"}, {"t": 385.46666666666664, "x": "見こみを「5分5分」と見ていたそうです。"}, {"t": 388.6333333333333, "x": "降りる場面の試算は、1000回ほども重ねられました。"}, {"t": 392.18333333333334, "x": "2023年9月7日、午前8時42分。"}, {"t": 396.0833333333333, "x": "スリムは種子島からH2Aロケットで打ち上げられました。"}, {"t": 399.8, "x": "一緒に乗っていたのは、X線で宇宙を見る天文衛星です。"}, {"t": 404.05, "x": "スリムはその相乗りでした。"}, {"t": 405.75, "x": "打ち上げは8月に2度延期され、"}, {"t": 407.8833333333333, "x": "一度は中止になっていました。"}, {"t": 410.06666666666666, "x": "9月に日にちを決め直しての出発です。"}, {"t": 412.76666666666665, "x": "打ち上げのあと、スリムはまっすぐ月へは向かいません。"}, {"t": 416.28333333333336, "x": "推進薬を節約するために、遠回りの道を選んだのです。"}, {"t": 420.6666666666667, "x": "10月1日。"}, {"t": 421.9, "x": "メインエンジンを39秒ほど噴いて、"}, {"t": 424.4, "x": "月へ向かう道に入りました。"}, {"t": 426.56666666666666, "x": "10月4日には月のそばを通ります。"}, {"t": 429.01666666666665, "x": "月の重力を借りて、向きを変えたのです。"}, {"t": 432.03333333333336, "x": "そのまま、地球から遠く離れていきました。"}, {"t": 435.06666666666666, "x": "11月6日に、いちばん遠い所を通ります。"}, {"t": 438.6333333333333, "x": "地上の局から、およそ138万キロです。"}, {"t": 442.15, "x": "月までの距離の3倍をこえる遠さでした。"}, {"t": 444.8666666666667, "x": "そこから、ゆっくり戻ってきます。"}, {"t": 447.21666666666664, "x": "12月25日。"}, {"t": 448.8333333333333, "x": "スリムは月の北極の近くでエンジンを噴きました。"}, {"t": 451.95, "x": "高さは600キロほどです。"}, {"t": 453.75, "x": "これで、月を回る軌道に入りました。"}, {"t": 456.55, "x": "打ち上げからの日数は、100日を少しこえていました。"}, {"t": 460.26666666666665, "x": "それから1か月ほどかけて、高さを下げていきます。"}, {"t": 463.75, "x": "最後は細長い軌道になりました。"}, {"t": 466.05, "x": "月面にいちばん近い所で15キロ、遠い所で600キロです。"}, {"t": 470.6, "x": "降下は、この15キロの高さから始まります。"}, {"t": 473.8666666666667, "x": "降下を始める地点は、ねらいの点の800キロほど手前です。"}, {"t": 478.03333333333336, "x": "そこから20分ほどで、ねらいの真上まで進みます。"}, {"t": 481.7, "x": "着陸の日は、2024年1月20日と決まりました。"}, {"t": 485.8, "x": "日本時間の真夜中です。"}, {"t": 487.5833333333333, "x": "ねらった点に降りるには自分の居場所を"}, {"t": 489.78333333333336, "x": "正しく知る必要があります。"}, {"t": 491.53333333333336, "x": "けれど、月にはGPSがありません。"}, {"t": 494.3, "x": "スリムが頼ったのはクレーターでした。"}, {"t": 496.53333333333336, "x": "月面には大小のクレーターが無数にあります。"}, {"t": 499.4166666666667, "x": "その並び方は、場所ごとに違います。"}, {"t": 502.25, "x": "人の顔が一人ずつ違うのと、少し似ています。"}, {"t": 505.65, "x": "スリムは降りながら、下の月面を写します。"}, {"t": 508.8, "x": "写真からクレーターだけを抜き出します。"}, {"t": 511.18333333333334, "x": "それを、かぐやのデータで作った地図と照らし合わせます。"}, {"t": 514.75, "x": "並び方が合う場所が、いまの自分の真下です。"}, {"t": 517.9666666666667, "x": "これを画像照合航法と呼びます。"}, {"t": 520.3166666666667, "x": "手順は2つに分かれます。"}, {"t": 522.0666666666667, "x": "まず写真の中の、どこがクレーターかを見つけます。"}, {"t": 525.5166666666667, "x": "次に、広い地図の中から同じ並びの場所を探します。"}, {"t": 529.45, "x": "見つかれば、自分の位置が分かります。"}, {"t": 532.0333333333333, "x": "難しかったのは時間でした。"}, {"t": 533.9166666666666, "x": "宇宙で使う計算機の力は地上の物の"}, {"t": 536.6, "x": "100分の1ほどしかありません。"}, {"t": 538.4666666666667, "x": "それでも降下中は、数秒で答えを出さなければなりません。"}, {"t": 542.5166666666667, "x": "チームは宇宙で使える専用の回路で"}, {"t": 544.8666666666667, "x": "速く動く手順を作りました。"}, {"t": 546.7833333333333, "x": "2018年には宇宙科学研究所の一般公開で"}, {"t": 550.25, "x": "このしくみを見せています。"}, {"t": 551.75, "x": "来た人のカメラの写真から撮った"}, {"t": 553.6666666666666, "x": "場所を当ててみせたのです。"}, {"t": 555.1666666666666, "x": "開発の途中には月面の写真を"}, {"t": 557.3666666666667, "x": "布に印刷して試験にも使いました。"}, {"t": 559.65, "x": "布の大きさは3メートル四方です。"}, {"t": 561.9666666666667, "x": "月面までの高さと速さは、電波で測ります。"}, {"t": 565.3333333333334, "x": "機体の動きは積んだ加速度のセンサーでも追い続けます。"}, {"t": 568.7, "x": "地上から指示を送っていては間に合いません。"}, {"t": 571.35, "x": "降下の20分は、すべて機体が自分で判断します。"}, {"t": 575.05, "x": "2024年1月19日、午後11時52分。"}, {"t": 579.3166666666667, "x": "月を回るスリムは、降下の前の確認を始めました。"}, {"t": 583.1666666666666, "x": "3つの場所で、クレーターの照合を2回ずつ行います。"}, {"t": 587.0333333333333, "x": "全部、正しく終わりました。"}, {"t": 589.2166666666667, "x": "その結果で、軌道の小さな修正も済ませます。"}, {"t": 592.6166666666667, "x": "午後11時59分ごろ、チームは降下を始めると決めました。"}, {"t": 597.2, "x": "そして11時59分58秒。"}, {"t": 599.9166666666666, "x": "メインエンジンが噴き始めます。"}, {"t": 601.8, "x": "月面へ向かって、斜めに降りていく段階です。"}, {"t": 605.15, "x": "途中、2つの場所で照合を行いました。"}, {"t": 608.2833333333333, "x": "1つ目では、高さで200メートルのずれを直します。"}, {"t": 611.8833333333333, "x": "横の位置では100メートルほどでした。"}, {"t": 614.15, "x": "2つ目では高さで1キロのずれを直しました。"}, {"t": 617.0333333333333, "x": "横方向の修正は200メートルほどになりました。"}, {"t": 620.3, "x": "直すたびに、機体はすぐに道すじを計算し直します。"}, {"t": 624.1666666666666, "x": "この段階を終えたときスリムは"}, {"t": 625.95, "x": "高さ6.2キロ付近にいました。"}, {"t": 628.0333333333333, "x": "予定どおりの高さです。"}, {"t": 629.6166666666667, "x": "横のずれは100メートル以下でした。"}, {"t": 631.7833333333333, "x": "ここから、まっすぐ下へ降りる段階に入ります。"}, {"t": 635.0666666666667, "x": "電波で高さを測る装置も、正しく動き始めました。"}, {"t": 638.8666666666667, "x": "高さ4000メートル付近で、また照合です。"}, {"t": 642.1333333333333, "x": "横の位置を100メートルほど直しました。"}, {"t": 644.6666666666666, "x": "高さ500メートル付近でも照合します。"}, {"t": 647.3666666666667, "x": "今度は50メートルほどの修正でした。"}, {"t": 649.9166666666666, "x": "降下の前から数えると、照合は7つの場所で2回ずつ。"}, {"t": 654.0166666666667, "x": "合わせて14回です。"}, {"t": 655.6, "x": "地上でも、より強力な計算機で位置を割り出していました。"}, {"t": 659.5333333333333, "x": "あとで比べると14回の答えは"}, {"t": 661.6166666666667, "x": "どれも正しかったと判断されています。"}, {"t": 663.85, "x": "高さ50メートル付近で、スリムは"}, {"t": 666.4333333333333, "x": "宙に止まる動きに入ります。"}, {"t": 668.2166666666667, "x": "ねらった点の真上で、下を見るのです。"}, {"t": 670.9666666666667, "x": "ここで2つ目の仕事が始まります。"}, {"t": 673.2666666666667, "x": "危ない岩や穴を、写真から探すことです。"}, {"t": 676.3666666666667, "x": "ねらいの点に、もし大きな岩があったら。"}, {"t": 679.2333333333333, "x": "そのまま降りれば、機体は転びます。"}, {"t": 681.9, "x": "だから、ここから先は安全を優先します。"}, {"t": 685.0, "x": "スリムは、いちばん安全そうな地点を自分で選びました。"}, {"t": 688.85, "x": "ねらいの点から12メートルほど、東南東の場所です。"}, {"t": 692.6, "x": "ここが最後の目標になりました。"}, {"t": 694.8, "x": "ねらいの点からは少し離れます。"}, {"t": 696.9666666666667, "x": "それでも、岩を避けるほうが大事でした。"}, {"t": 699.7666666666667, "x": "この探す作業は2回行われています。"}, {"t": 702.3666666666667, "x": "1回目のときに機体はねらいの点から"}, {"t": 704.6166666666667, "x": "どれだけずれていたのか。"}, {"t": 705.9666666666667, "x": "あとで、インドの月周回機の写真と重ねて調べました。"}, {"t": 709.9833333333333, "x": "細かく写った月面の写真です。"}, {"t": 712.25, "x": "その写真をもとに降下中の位置を細かく割り出したのです。"}, {"t": 715.9, "x": "答えは、3.4メートルほどでした。"}, {"t": 718.6666666666666, "x": "2回目のときは10メートルほどです。"}, {"t": 720.9666666666667, "x": "研究所の振り返りでは、宙に止まる段階に入ったときの"}, {"t": 724.6166666666667, "x": "ずれは三〜4メートル程度とされています。"}, {"t": 727.3833333333333, "x": "JAXAは着陸の精度を10メートル程度か、"}, {"t": 730.1166666666667, "x": "それよりよいと評価しました。"}, {"t": 732.2, "x": "本当の力は3、4メートル程度だった"}, {"t": 735.1666666666666, "x": "可能性が高いとしています。"}, {"t": 736.9, "x": "目標は100メートルでした。"}, {"t": 738.7166666666667, "x": "その30分の1ほどのずれです。"}, {"t": 740.95, "x": "スリムは、ねらいの点のほぼ真上にいました。"}, {"t": 743.95, "x": "月で、ねらった点に降りるのは世界で初めてのことでした。"}, {"t": 747.85, "x": "その時刻は、零時19分18秒ごろと記録されています。"}, {"t": 752.1833333333333, "x": "2つのメインエンジンが出す力の合計が、急に落ちました。"}, {"t": 756.25, "x": "もとの55パーセントほどです。"}, {"t": 758.3333333333334, "x": "噴けという命令は、ほとんど変わっていません。"}, {"t": 761.3666666666667, "x": "それなのに、押し上げる力のおよそ半分が失われたのです。"}, {"t": 765.4833333333333, "x": "降下中のスリムは、一定の間をあけて下を写していました。"}, {"t": 769.45, "x": "19分14秒の写真と、19分20秒の写真。"}, {"t": 773.6833333333333, "x": "6秒ちがいの2枚を並べてみます。"}, {"t": 776.0666666666667, "x": "あとの1枚にだけ、光る点や物が写っていました。"}, {"t": 779.6833333333333, "x": "そのうちの一つは、エンジンの噴射口のような形でした。  "x": "けれど、その姿を外から写した者がいました。"}, {"t": 1122.4333333333334, "x": "あの小さな丸いロボットです。"}, {"t": 1124.3166666666666, "x": "ロボットは月の上で体を割り、カメラを向けました。"}, {"t": 1127.85, "x": "その写真は、跳ねるロボットを通して地球へ届きます。"}, {"t": 1131.6, "x": "写っていたのは、頭を下にしたスリムでした。"}, {"t": 1134.75, "x": "機体の記録から考えていた向きと、合っていました。"}, {"t": 1138.2666666666667, "x": "2台は互いに連絡を取りながら動きました。"}, {"t": 1141.0833333333333, "x": "2台が力を合わせて月面を探ったのは"}, {"t": 1143.6333333333334, "x": "世界で初めてとされています。"}, {"t": 1145.45, "x": "丸いロボットは記録も作りました。"}, {"t": 1147.6833333333334, "x": "月面を探ったロボットとして、"}, {"t": 1149.5666666666666, "x": "世界で最も小さく軽いのです。"}, {"t": 1152.0833333333333, "x": "この写真はJAXAから発表されました。"}, {"t": 1154.5833333333333, "x": "月の砂の上の逆立ちの姿は、多くの人の目にとまりました。"}, {"t": 1158.95, "x": "スリムの名前の投稿には見られた数が"}, {"t": 1161.3166666666666, "x": "数百万に達した物がいくつもあります。"}, {"t": 1163.7833333333333, "x": "月に置いてきた荷物が、置いてきた"}, {"t": 1166.1666666666667, "x": "本体を写して送ってきたのです。"}, {"t": 1168.2333333333333, "x": "着陸から8日がたった、1月28日。"}, {"t": 1171.8, "x": "地上の局は毎日数時間ずつスリムに"}, {"t": 1174.4, "x": "呼びかけ続けていました。"}, {"t": 1175.8666666666666, "x": "その呼びかけに、返事が届きます。"}, {"t": 1178.4166666666667, "x": "月の上の太陽が西へ回り、板に光が当たり始めたのです。"}, {"t": 1182.8833333333334, "x": "スリムは、予想どおり自分で目を覚ましていました。"}, {"t": 1186.2166666666667, "x": "ここから月の日が沈むまで、残りは数日です。"}, {"t": 1189.7, "x": "時間は限られていました。"}, {"t": 1191.4, "x": "チームはすぐに、石を調べるカメラを動かします。"}, {"t": 1194.9166666666667, "x": "このカメラは光をいくつもの色に"}, {"t": 1196.9333333333334, "x": "分けて写すことができます。"}, {"t": 1198.55, "x": "色の違いから、石に何がふくまれているかを調べるのです。"}, {"t": 1202.5666666666666, "x": "一つの石を、10の色の帯で写しました。"}, {"t": 1205.6833333333334, "x": "その一つは着陸の直後に選んでおいた候補でした。"}, {"t": 1209.05, "x": "その石には呼び名が付けられていました。"}, {"t": 1211.4333333333334, "x": "トイプードルです。"}, {"t": 1212.6, "x": "10の色で写す観測がうまくいったことは、"}, {"t": 1215.1666666666667, "x": "2月1日に発表されました。"}, {"t": 1217.5833333333333, "x": "岩に付けられた呼び名は、犬の名前でした。"}, {"t": 1220.6166666666666, "x": "トイプードルのほかに、あきたいぬと"}, {"t": 1222.9166666666667, "x": "呼ばれた岩もあります。"}, {"t": 1224.25, "x": "スリムのカメラは、10個の岩を観測しました。"}, {"t": 1227.5833333333333, "x": "2か所の砂も調べています。"}, {"t": 1229.45, "x": "いずれも色を分けて写すあのカメラでの観測です。"}, {"t": 1232.5666666666666, "x": "あきたいぬは目に見えない近赤外線の"}, {"t": 1234.95, "x": "色でも詳しく写されています。"}, {"t": 1236.8666666666666, "x": "1月31日、月の上は夜になりました。"}, {"t": 1240.55, "x": "最初の観測の日々は、ここで終わります。"}, {"t": 1243.5833333333333, "x": "観測の結果は、地球で読み解かれていきました。"}, {"t": 1246.8833333333334, "x": "月で観測した岩に、カンラン石がふくまれていたのです。"}, {"t": 1250.7166666666667, "x": "それも月の深い所から来たと考えられるカンラン石でした。"}, {"t": 1254.5166666666667, "x": "この結果は学会で発表されています。"}, {"t": 1256.9833333333333, "x": "論文もいくつも投稿されています。"}, {"t": 1259.2666666666667, "x": "斜面のそばに降りなければ、この岩には届きませんでした。"}, {"t": 1263.15, "x": "ねらった点に降りる技術が、この観測を可能にしたのです。"}, {"t": 1267.1333333333334, "x": "月の1日は、およそ1か月です。"}, {"t": 1269.9166666666667, "x": "14日ほど昼が続き、14日ほど夜が続きます。"}, {"t": 1273.8166666666666, "x": "夜のあいだは、太陽の光がまったく届きません。"}, {"t": 1277.2666666666667, "x": "昼と夜とで、温度も大きく変わります。"}, {"t": 1280.1666666666667, "x": "スリムはこの夜を越えるようには作られていませんでした。"}, {"t": 1283.5, "x": "月の夜を越えて動くことを越夜と呼びます。"}, {"t": 1286.3666666666666, "x": "スリムにとって、越夜は設計の想定の外でした。"}, {"t": 1290.0666666666666, "x": "2月25日、月の上に再び朝が来た時期です。"}, {"t": 1294.0166666666667, "x": "チームは呼びかけを行いました。"}, {"t": 1296.0833333333333, "x": "返事が来ました。"}, {"t": 1297.25, "x": "設計では考えていなかった返事です。"}, {"t": 1299.7666666666667, "x": "スリムは夜を越えていたのです。"}, {"t": 1301.7333333333333, "x": "3月27日、2度目の夜のあと。"}, {"t": 1304.9, "x": "また返事が来ます。"}, {"t": 1306.2166666666667, "x": "2度目の夜も越えたのです。"}, {"t": 1307.9666666666667, "x": "このときは、電池の不調が見つかりました。"}, {"t": 1310.9166666666667, "x": "温度を測る部品の一部にも不調が出ていました。"}, {"t": 1313.9166666666667, "x": "それでも、電池は着陸のあとに切り離してあります。"}, {"t": 1317.5166666666667, "x": "動かすのに支障はありませんでした。"}, {"t": 1319.75, "x": "4月23日、3度目の夜のあと。"}, {"t": 1322.9, "x": "スリムは、またも目を覚ましました。"}, {"t": 1325.3833333333334, "x": "3度目の夜越えです。"}, {"t": 1326.9333333333334, "x": "このときは星を見て向きを知る"}, {"t": 1328.7666666666667, "x": "センサーで月面を写しています。"}, {"t": 1330.8, "x": "光を取りこむ時間をいちばん短くしても、"}, {"t": 1333.4333333333334, "x": "写真はほとんど真っ白でした。"}, {"t": 1335.6666666666667, "x": "真昼の月面は、それほど明るかったのです。"}, {"t": 1338.85, "x": "越夜のあとのデータには、別の変化も記録されていました。"}, {"t": 1342.7333333333333, "x": "機体の中の温度が、越夜の前より高くなっていたのです。"}, {"t": 1346.6666666666667, "x": "なぜ、3度も夜を越えられたのか。"}, {"t": 1349.2333333333333, "x": "答えは、まだ出ていません。"}, {"t": 1351.2666666666667, "x": "JAXAはその理由を解き明かすのは難しいと考えています。"}, {"t": 1355.0, "x": "ただ、越夜のあとの機体のデータは手に入りました。"}, {"t": 1358.4333333333334, "x": "3度目の夜のあとの運用が終わったのは4月29日です。"}, {"t": 1362.2833333333333, "x": "最後に声が届いたのは、その前日の4月28日でした。"}, {"t": 1366.75, "x": "その少し前の4月11日。"}, {"t": 1369.0833333333333, "x": "アメリカの議会で演説した日本の首相が"}, {"t": 1371.6833333333334, "x": "スリムの名前を出しました。"}, {"t": 1373.3, "x": "6月21日にはウィーンの国連の委員会でも"}, {"t": 1376.5, "x": "着陸の成功が報告されています。"}, {"t": 1378.8833333333334, "x": "5月24日、4度目の夜のあと。"}, {"t": 1381.85, "x": "チームは、いつものように呼びかけました。"}, {"t": 1384.5833333333333, "x": "返事はありませんでした。"}, {"t": 1386.15, "x": "次の日も、その次の日も同じでした。"}, {"t": 1388.9833333333333, "x": "電波そのものが確かめられなかったのです。"}, {"t": 1391.5166666666667, "x": "ずっと壊れてしまったのか。"}, {"t": 1393.2, "x": "それとも、1時的な故障なのか。"}, {"t": 1395.7833333333333, "x": "チームは両方の見方を考えました。"}, {"t": 1398.25, "x": "6月21日、5度目の夜のあと。"}, {"t": 1401.3833333333334, "x": "この月も返事は届きません。"}, {"t": 1403.3166666666666, "x": "チームは、太陽の爆発であるフレアの影響を疑いました。"}, {"t": 1407.45, "x": "フレアで機体の中の手順が書きかえられたのかもしれない。"}, {"t": 1410.8, "x": "そこで、正しい手順を地上から送り直してみます。"}, {"t": 1414.4666666666667, "x": "それでも応答はありませんでした。"}, {"t": 1416.5, "x": "7月にも呼びかけは続きました。"}, {"t": 1418.7333333333333, "x": "通信はつながらないままでした。"}, {"t": 1420.8, "x": "新田稲荷神社という神社があります。"}, {"t": 1423.1833333333334, "x": "そこには、「呼ばわり山」と"}, {"t": 1425.4833333333333, "x": "名付けられた場所があるのです。"}, {"t": 1427.1833333333334, "x": "迷子や行方の分からない者が"}, {"t": 1429.0, "x": "出たときの言い伝えがあります。"}, {"t": 1430.7166666666667, "x": "鐘や太鼓をたたいて呼べば、必ず現れるというのです。"}, {"t": 1434.6166666666666, "x": "はやぶさが宇宙で行方を絶ったときには、"}, {"t": 1436.95, "x": "当時の責任者が毎晩ここで祈りました。"}, {"t": 1439.9166666666667, "x": "スリムのチームが書いた連載の"}, {"t": 1441.7666666666667, "x": "最終回にはこの神社が出てきます。"}, {"t": 1444.0833333333333, "x": "2024年6月のある日の午後、チームはそこに集まりました。"}, {"t": 1448.55, "x": "スリムは、月を回る探査機からも写されていました。"}, {"t": 1452.1, "x": "着陸から数日後のことです。"}, {"t": 1454.1833333333334, "x": "NASAの月周回機がおよそ80キロの"}, {"t": 1456.6, "x": "高さから着陸地点を写しました。"}, {"t": 1458.8833333333334, "x": "写真の細かさは、一つの点が80センチほどです。"}, {"t": 1462.6333333333334, "x": "そこには、小さな機体の姿が写っていました。"}, {"t": 1465.95, "x": "着陸の前の写真と比べるとまわりの"}, {"t": 1468.35, "x": "明るさが少し変わっています。"}, {"t": 1470.1166666666666, "x": "エンジンの噴射が月の砂の表面を"}, {"t": 1472.3833333333334, "x": "はいたあとと考えられています。"}, {"t": 1474.2166666666667, "x": "写真の端にはシオリ・クレーターから"}, {"t": 1476.3, "x": "飛び散った白っぽい砂も見えていました。"}, {"t": 1478.6166666666666, "x": "スリムには、NASAから預かった物も積まれていました。"}, {"t": 1482.0833333333333, "x": "小さな鏡です。"}, {"t": 1483.4, "x": "光が来た方向へ、そのまま光をはね返します。"}, {"t": 1486.9833333333333, "x": "重さは21グラムほどです。"}, {"t": 1489.05, "x": "月を回る探査機から、この鏡にレーザーを当てます。"}, {"t": 1492.7666666666667, "x": "はね返ってくる光で、距離を細かく測るのです。"}, {"t": 1496.2833333333333, "x": "ところが、スリムは逆立ちで止まりました。"}, {"t": 1499.1166666666666, "x": "鏡は横を向いてしまいました。"}, {"t": 1501.1833333333334, "x": "ねらえる角度は、ずっと狭くなります。"}, {"t": 1503.95, "x": "上を向いていれば、広い角度からねらえたはずでした。"}, {"t": 1507.45, "x": "NASAの月周回機はそれまでに"}, {"t": 1509.3333333333333, "x": "8回この鏡をねらっていました。"}, {"t": 1511.4333333333334, "x": "そして、5月24日。"}, {"t": 1513.65, "x": "続けて回った2周で、2回とも光が返ってきました。"}, {"t": 1517.5166666666667, "x": "スリムからの声が途絶えた、4度目の夜のあとのことです。"}, {"t": 1521.35, "x": "電気の要らないこの鏡は何十年も使えるとされています。"}, {"t": 1525.0333333333333, "x": "スリムはこれからも距離を測る目印になれる見こみです。"}, {"t": 1528.5, "x": "あの日、エンジンの噴射口はなぜ外れたのか。"}, {"t": 1531.7333333333333, "x": "チームはメーカーと一緒に原因を調べました。"}, {"t": 1534.6333333333334, "x": "答えが示されたのは、2024年12月26日です。"}, {"t": 1539.1333333333334, "x": "プロジェクトをしめくくる記者説明会の場でした。"}, {"t": 1542.0166666666667, "x": "原因はエンジンそのものより"}, {"t": 1543.6666666666667, "x": "別の所にある可能性が高いとされました。"}, {"t": 1546.45, "x": "カギは、燃料を送るしくみにありました。"}, {"t": 1549.2833333333333, "x": "スリムの燃料の送り方は、ブローダウン方式と"}, {"t": 1552.6333333333334, "x": "呼ばれる物でした。"}, {"t": 1553.766666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
