<script>
const D={"name": "ep038", "file": "ep038", "dur": 1894.7333125, "segs": [], "subs": [{"t": 0.0, "x": "2010年の3月のことです。"}, {"t": 2.1333333333333333, "x": "月を回るアメリカの探査機が、"}, {"t": 4.05, "x": "1枚の写真を地球へ送りました。"}, {"t": 6.733333333333333, "x": "写っていたのは灰色の平らな地面です。"}, {"t": 9.283333333333333, "x": "その中に小さな明るい点がありました。"}, {"t": 11.816666666666666, "x": "点のそばには細い線が何本も走っていました。"}, {"t": 14.833333333333334, "x": "線は車輪の跡でした。"}, {"t": 16.433333333333334, "x": "明るい点は40年近く前に月へ降りた車です。"}, {"t": 19.916666666666668, "x": "名前はルノホート1号です。"}, {"t": 21.866666666666667, "x": "ソ連が地球から運転した、人の乗らない車です。"}, {"t": 25.483333333333334, "x": "1971年の秋に、車の声はとだえました。"}, {"t": 29.616666666666667, "x": "その後の居場所は、はっきりしなくなっていました。"}, {"t": 32.71666666666667, "x": "車の上には光を返す鏡が積まれていました。"}, {"t": 35.9, "x": "地球から光を送れば、同じ方向へはね返す鏡です。"}, {"t": 40.016666666666666, "x": "けれどどこへ光を送ればよいのかが"}, {"t": 42.2, "x": "分からなくなっていました。"}, {"t": 43.61666666666667, "x": "写真が届いてから、およそ1か月後のことです。"}, {"t": 47.016666666666666, "x": "アメリカの天文台が、月へ光を送りました。"}, {"t": 50.35, "x": "光は月から返ってきました。"}, {"t": 52.333333333333336, "x": "それも思っていたよりずっと強い光でした。"}, {"t": 55.016666666666666, "x": "この車にはもう1台の兄弟がいます。"}, {"t": 57.63333333333333, "x": "2年あまりあとに月へ降りた、ルノホート2号です。"}, {"t": 61.18333333333333, "x": "2号は1号よりも遠くまで走り、土をかぶって止まりました。"}, {"t": 65.4, "x": "そして地球では競売にかけられました。"}, {"t": 67.9, "x": "地球から運転された2台の車は、"}, {"t": 70.16666666666667, "x": "どこで止まり、どう見つかったのか。"}, {"t": 72.83333333333333, "x": "その道すじをたどります。"}, {"t": 74.55, "x": "話は1960年代の終わりにさかのぼります。"}, {"t": 78.1, "x": "アメリカとソ連は月をめざして競っていました。"}, {"t": 80.93333333333334, "x": "アメリカは人を月へ送る計画を進めていました。"}, {"t": 84.18333333333334, "x": "ソ連は、人を乗せない機械で"}, {"t": 86.33333333333333, "x": "月を調べる道も用意していました。"}, {"t": 88.58333333333333, "x": "その一つが月の上を走る車です。"}, {"t": 91.08333333333333, "x": "人が乗らず、地球から命令を送って動かします。"}, {"t": 94.65, "x": "ソ連の名前ではルノホートと呼ばれました。"}, {"t": 97.16666666666667, "x": "ロシア語で「月を歩くもの」といった意味の言葉です。"}, {"t": 101.13333333333334, "x": "1台目の車は、1969年の2月に打ち上げられました。"}, {"t": 106.0, "x": "けれどロケットは地球を回る軌道にも届きませんでした。"}, {"t": 109.43333333333334, "x": "車は月へ向かうことなく失われました。"}, {"t": 112.13333333333334, "x": "同じ年の7月、アメリカのアポロ11号が月に降ります。"}, {"t": 116.46666666666667, "x": "人が先に月を歩いたことになります。"}, {"t": 118.95, "x": "それでもソ連は車を月に送る計画を止めませんでした。"}, {"t": 122.65, "x": "人が乗らない車なら、何か月も月の上で働けるからです。"}, {"t": 126.91666666666667, "x": "人は、空気と水と食べ物がなければ数日しかいられません。"}, {"t": 130.96666666666667, "x": "車なら、電気と熱さえあれば動き続けられます。"}, {"t": 134.45, "x": "月の昼と夜を何度もこえて、調べ続けることができます。"}, {"t": 138.55, "x": "2台目として作られた車は、次の打ち上げを待ちました。"}, {"t": 142.46666666666667, "x": "これがのちにルノホート1号と呼ばれる車です。"}, {"t": 145.5, "x": "失われた1台目は、記録の上では"}, {"t": 148.16666666666666, "x": "先代として扱われています。"}, {"t": 150.01666666666668, "x": "1台目が届かなかった月へ、2台目が向かいます。"}, {"t": 153.53333333333333, "x": "1970年の11月10日のことです。"}, {"t": 156.8, "x": "ソ連の探査機ルナ17号が打ち上げられました。"}, {"t": 159.9, "x": "ルナ17号は車を運ぶための着陸機です。"}, {"t": 163.13333333333333, "x": "背中にルノホート1号を乗せていました。"}, {"t": 165.73333333333332, "x": "ロケットはその日のうちに、"}, {"t": 167.23333333333332, "x": "探査機を月へ向かう道に乗せました。"}, {"t": 169.95, "x": "途中で2回、進む向きを細かく直しました。"}, {"t": 173.3, "x": "11月15日、探査機は月を回る軌道に入りました。"}, {"t": 177.63333333333333, "x": "降りる場所は雨の海と呼ばれる平原です。"}, {"t": 180.25, "x": "雨の海は、月の表側の北西に"}, {"t": 182.98333333333332, "x": "広がる黒っぽい平らな地面です。"}, {"t": 185.06666666666666, "x": "昔、とけた岩が流れ出して固まった所だとされています。"}, {"t": 189.15, "x": "平らな所なら、車が走りやすいと考えられます。"}, {"t": 192.91666666666666, "x": "11月17日、ルナ17号は雨の海の西の側に降りました。"}, {"t": 197.95, "x": "世界の時刻で午前3時47分でした。"}, {"t": 200.96666666666667, "x": "着陸機は、逆向きに火を噴きます。"}, {"t": 203.7, "x": "そうして速さを落としながら、降りていきます。"}, {"t": 206.73333333333332, "x": "近くには、ヘラクレイデス岬と呼ばれる地形があります。"}, {"t": 210.48333333333332, "x": "着いた所は、そこからおよそ60キロ南です。"}, {"t": 213.93333333333334, "x": "噴射のガスはまわりの地面を吹き払いました。"}, {"t": 216.75, "x": "上からの写真では、着陸機のまわりが少し明るく見えます。"}, {"t": 220.91666666666666, "x": "噴射で表面の細かい土が動いたためと説明されています。"}, {"t": 224.71666666666667, "x": "着陸機の上にはふたをした車が乗っていました。"}, {"t": 227.8, "x": "ここから先は車を地面へ下ろす仕事です。"}, {"t": 230.73333333333332, "x": "けれどそのまま飛び降りるわけにはいきません。"}, {"t": 233.3, "x": "車を下ろすための道が着陸機に積まれていました。"}, {"t": 236.53333333333333, "x": "着陸機には坂道が2組ついていました。"}, {"t": 239.33333333333334, "x": "前と後ろ、2つの方向に"}, {"t": 242.08333333333334, "x": "下りられるようにしてあったのです。"}, {"t": 243.9, "x": "片方の先に大きな岩や穴があれば、"}, {"t": 246.3, "x": "もう片方から下りられます。"}, {"t": 248.33333333333334, "x": "一つの方向しかなければ、そこが"}, {"t": 250.78333333333333, "x": "ふさがった時点で終わりです。"}, {"t": 252.41666666666666, "x": "月の地面は、降りてみるまで細かい所は分かりません。"}, {"t": 256.25, "x": "だから逃げ道を一つ多く用意しました。"}, {"t": 258.8666666666667, "x": "着陸からおよそ2時間40分後、車は坂を下りました。"}, {"t": 263.15, "x": "世界の時刻で午前6時28分です。"}, {"t": 266.03333333333336, "x": "8つの車輪が坂の上から月の土へと進みました。"}, {"t": 269.4, "x": "月の地面で、人の乗らない車が走り始めました。"}, {"t": 273.1, "x": "自分の力で動いた、最初の時です。"}, {"t": 276.0833333333333, "x": "ルノホート1号は、地球の外の天体の上を"}, {"t": 279.3, "x": "自由に動いた最初の車とされています。"}, {"t": 281.8833333333333, "x": "坂を下りるときは、車輪がちゃんと回るかも"}, {"t": 284.76666666666665, "x": "確かめられました。"}, {"t": 285.8833333333333, "x": "月の土は細かい粉と小石が混ざったものです。"}, {"t": 288.95, "x": "車輪が空回りすれば、車は進めません。"}, {"t": 292.15, "x": "沈みこめば、抜け出せなくなるかもしれません。"}, {"t": 295.3, "x": "最初の数メートルで、心配を一つずつ消していきました。"}, {"t": 299.15, "x": "下りた側は、上からの写真の説明によると東の側です。"}, {"t": 303.3833333333333, "x": "ただし、別の写真の説明では反対の側とも書かれています。"}, {"t": 307.71666666666664, "x": "どちらの坂を使ったかは、資料に"}, {"t": 310.15, "x": "よって書き方が分かれています。"}, {"t": 311.9166666666667, "x": "確かなのは、車が無事に月の土の上に立ったことです。"}, {"t": 315.85, "x": "着陸機はそこで役目を終えました。"}, {"t": 318.18333333333334, "x": "坂を下ろしたままの着陸機は、今も雨の海に残っています。"}, {"t": 322.46666666666664, "x": "ルノホート1号の形は大きなたらいのようでした。"}, {"t": 325.6166666666667, "x": "たらいの中に機械と電池が収められていました。"}, {"t": 328.5833333333333, "x": "上には、丸く盛り上がった大きなふたがついていました。"}, {"t": 332.15, "x": "このふたが車の一番大事な仕かけの一つです。"}, {"t": 335.21666666666664, "x": "ふたの裏側には、太陽の光で"}, {"t": 337.6333333333333, "x": "電気を作る板が張ってありました。"}, {"t": 339.65, "x": "月の昼には、ふたを開けて、裏の板を太陽へ向けます。"}, {"t": 343.98333333333335, "x": "作った電気は電池にためられます。"}, {"t": 346.18333333333334, "x": "その電気で車輪を回します。"}, {"t": 348.15, "x": "カメラを動かし、地球と話します。"}, {"t": 350.9166666666667, "x": "けれど月には長い夜があります。"}, {"t": 353.0, "x": "月の上の1日は、地球の日数でおよそ29日半あります。"}, {"t": 357.56666666666666, "x": "昼がおよそ2週間続き、夜もおよそ2週間続きます。"}, {"t": 361.7, "x": "夜の間は太陽の光が届きません。"}, {"t": 364.31666666666666, "x": "月には空気がないので、熱は"}, {"t": 366.5833333333333, "x": "どんどん宇宙へ逃げていきます。"}, {"t": 368.3333333333333, "x": "夜の地面の温度は、マイナス150度近くまで"}, {"t": 371.75, "x": "下がるとされています。"}, {"t": 373.01666666666665, "x": "この寒さでは中の機械がこわれてしまいます。"}, {"t": 375.8833333333333, "x": "そこで夜になると、車は止まってふたを閉じました。"}, {"t": 379.4, "x": "ふたはふとんのように中を包みこみます。"}, {"t": 381.8666666666667, "x": "そして中には、熱を出し続ける"}, {"t": 384.2, "x": "小さな熱の源が入っていました。"}, {"t": 386.53333333333336, "x": "ポロニウム210という、放射性の物質です。"}, {"t": 390.01666666666665, "x": "放射性の物質はこわれていくときに熱を出します。"}, {"t": 393.26666666666665, "x": "その熱で、中の液体を温めました。"}, {"t": 396.28333333333336, "x": "機械を冷やしすぎないためです。"}, {"t": 398.26666666666665, "x": "昼は太陽の電気で走り、夜はふたを閉じて自分の熱で眠る。"}, {"t": 402.6666666666667, "x": "これが、ルノホートの決まった動きでした。"}, {"t": 405.43333333333334, "x": "月の昼と夜を、こうしてこえていきました。"}, {"t": 408.3833333333333, "x": "車には車輪が8つありました。"}, {"t": 410.53333333333336, "x": "左右に4つずつ並んでいます。"}, {"t": 412.5833333333333, "x": "車輪の一つ一つに、別々のモーターが入っていました。"}, {"t": 416.4166666666667, "x": "モーターは、空気の入った入れ物の"}, {"t": 418.8333333333333, "x": "中に閉じこめられていました。"}, {"t": 420.55, "x": "空気のない月の上で部品を守るためです。"}, {"t": 423.28333333333336, "x": "一つの車輪が止まっても、ほかの"}, {"t": 425.53333333333336, "x": "車輪で進むことができます。"}, {"t": 427.3, "x": "8つあるのはそれだけ止まりにくくするためです。"}, {"t": 430.1, "x": "部品に差す油にも、工夫がありました。"}, {"t": 432.95, "x": "空気のない所でも働く、特別な"}, {"t": 435.76666666666665, "x": "油が使われたとされています。"}, {"t": 437.6166666666667, "x": "車の前にはカメラの目がついていました。"}, {"t": 440.21666666666664, "x": "テレビカメラが前のようすを地球へ送ります。"}, {"t": 443.06666666666666, "x": "横には、まわりを1周見渡す"}, {"t": 445.4166666666667, "x": "写真を撮るカメラもありました。"}, {"t": 447.23333333333335, "x": "上には、地球へ電波を送るアンテナが立っていました。"}, {"t": 450.76666666666665, "x": "一つは円すいの形のアンテナです。"}, {"t": 453.06666666666666, "x": "もう一つは、ばねのように巻いた形のアンテナです。"}, {"t": 456.48333333333335, "x": "決まった方向へ、強く電波を送ります。"}, {"t": 459.43333333333334, "x": "2台目の車の大きさが、上からの"}, {"t": 462.05, "x": "写真の説明に書かれています。"}, {"t": 464.0, "x": "長さはおよそ170センチです。"}, {"t": 466.31666666666666, "x": "幅は160センチ、高さは135センチです。"}, {"t": 470.3333333333333, "x": "小さな車ほどの大きさといえます。"}, {"t": 472.68333333333334, "x": "走る速さは、2台目で時速1キロか2キロの2段でした。"}, {"t": 476.6333333333333, "x": "人が歩くより、ゆっくりです。"}, {"t": 478.8833333333333, "x": "けれど月の上では、それで足りました。"}, {"t": 481.56666666666666, "x": "急いで走れば、見えない穴に落ちるかもしれないからです。"}, {"t": 485.35, "x": "ルノホートには運転する人が乗っていません。"}, {"t": 487.96666666666664, "x": "運転していたのは地球の上の人たちです。"}, {"t": 490.65, "x": "ソ連の運転の部屋で、画面を見ながら命令を送りました。"}, {"t": 494.65, "x": "月まではおよそ38万キロあります。"}, {"t": 497.3, "x": "電波でも片道に1秒あまりかかります。"}, {"t": 499.98333333333335, "x": "車が見た景色は1秒あまり遅れて地球に届きます。"}, {"t": 503.6166666666667, "x": "地球から送った命令も、1秒あまり遅れて車に届きます。"}, {"t": 508.05, "x": "運転する人は、少し前の景色を見ることになります。"}, {"t": 511.8333333333333, "x": "そして、少し先の動きを決めます。"}, {"t": 514.5333333333333, "x": "さらにテレビの画像は動画のように続けては"}, {"t": 517.2, "x": "届きませんでした。"}, {"t": 518.35, "x": "2台目の運転用のカメラは、写真を1枚ずつ送りました。"}, {"t": 522.5166666666667, "x": "数秒から20秒あまりに1枚とされています。"}, {"t": 525.6166666666667, "x": "間かくは、3.2秒、5.7秒、10.9秒、21.1秒の4つです。"}, {"t": 532.6, "x": "写真と写真の間にも、車は進んでいます。"}, {"t": 535.9, "x": "そのすきまで何が起きたかは、見えません。"}, {"t": 538.7333333333333, "x": "運転したのは、地球の上の5人とされています。"}, {"t": 542.0666666666667, "x": "頼りは、この写真でした。"}, {"t": 544.1833333333333, "x": "進む、止まる、曲がる。"}, {"t": 546.4833333333333, "x": "それを、少ない写真で決めます。"}, {"t": 548.9166666666666, "x": "大きな岩は写真で見ればよけられます。"}, {"t": 551.3333333333334, "x": "けれど影になった穴は見落とすことがあります。"}, {"t": 554.1, "x": "月の影は空気がないので真っ黒です。"}, {"t": 556.6166666666667, "x": "穴の深さは影からは分かりにくいのです。"}, {"t": 559.2833333333333, "x": "運転は昼の間しかできません。"}, {"t": 561.4166666666666, "x": "夜になれば、車は止まって眠ります。"}, {"t": 564.2666666666667, "x": "月の昼が来るたびに、運転の部屋も忙しくなりました。"}, {"t": 568.2166666666667, "x": "ルノホート1号は、もともと月の昼を"}, {"t": 570.9833333333333, "x": "3回こえる予定で作られました。"}, {"t": 573.0833333333334, "x": "地球の日数でいえば、およそ3か月です。"}, {"t": 576.2166666666667, "x": "最初の昼は、11月17日から22日までの短い間でした。"}, {"t": 581.3833333333333, "x": "着いたのが昼の途中だったからです。"}, {"t": 583.6166666666667, "x": "この間に走ったのは197メートルです。"}, {"t": 586.6, "x": "近くを撮った写真は14枚です。"}, {"t": 588.95, "x": "まわりを見渡す写真は、12組でした。"}, {"t": 592.0, "x": "地球との交信は10回です。"}, {"t": 594.0666666666667, "x": "最初の昼は、遠くへは行きませんでした。"}, {"t": 597.0, "x": "車の調子を確かめるのが中心でした。"}, {"t": 599.7166666666667, "x": "確かめたのは、車輪の回り方です。"}, {"t": 602.4, "x": "カメラの写り方です。"}, {"t": 603.9, "x": "電気のたまり方と、ふたの開け閉めです。"}, {"t": 606.6666666666666, "x": "そして最初の夜が来ました。"}, {"t": 608.5, "x": "車はふたを閉じ、2週間の暗やみに入りました。"}, {"t": 612.1, "x": "夜が明けたら、また動くのか。"}, {"t": 614.4333333333333, "x": "それは、だれにも分かりませんでした。"}, {"t": 616.9666666666667, "x": "12月、2回目の昼がやってきます。"}, {"t": 619.8833333333333, "x": "車は目を覚まし、走り始めました。"}, {"t": 622.75, "x": "12月の昼に走ったのは、1522メートルです。"}, {"t": 626.8166666666667, "x": "1回目の昼のおよそ8倍です。"}, {"t": 629.0, "x": "年が明けた1971年の1月には、1936メートル。"}, {"t": 634.3833333333333, "x": "3月には2004メートルを走りました。"}, {"t": 637.1, "x": "予定の3回の昼はこうして過ぎていきました。"}, {"t": 639.9666666666667, "x": "車はそれでも止まりませんでした。"}, {"t": 642.0833333333334, "x": "ルノホート1号は、ただ走るだけの"}, {"t": 644.6, "x": "車ではありませんでした。"}, {"t": 646.1666666666666, "x": "月の土を調べる道具を積んでいました。"}, {"t": 648.75, "x": "一つは円すいの先をした棒です。"}, {"t": 650.9833333333333, "x": "棒を地面に押しこんで、土がどれだけ固いかを測ります。"}, {"t": 654.85, "x": "固い土なら、棒はなかなか入りません。"}, {"t": 657.7166666666667, "x": "やわらかい土なら、するりと入ります。"}, {"t": 660.4166666666666, "x": "この棒は、月の上の500か所で使われたとされています。"}, {"t": 664.2833333333333, "x": "次に来る機械が、月で沈まないように。"}, {"t": 667.2666666666667, "x": "土の固さを知ることは、大事でした。"}, {"t": 670.0, "x": "もう一つは土にふくまれる物を調べる道具です。"}, {"t": 673.0666666666667, "x": "X線を使って、土がどんな元素でできているかを"}, {"t": 676.6166666666667, "x": "読み取ります。"}, {"t": 677.4333333333333, "x": "この道具はリフマと呼ばれていました。"}, {"t": 679.65, "x": "リフマでの土の分析は、25回行われたとされています。"}, {"t": 683.9, "x": "車はほかにも、空から来る物を"}, {"t": 686.3, "x": "調べる道具を積んでいました。"}, {"t": 688.1166666666667, "x": "一つは、X線をとらえる望遠鏡です。"}, {"t": 691.3, "x": "もう一つは、宇宙から飛んでくる"}, {"t": 693.5166666666667, "x": "小さな粒を数える道具です。"}, {"t": 695.5, "x": "月には空気がありません。"}, {"t": 697.15, "x": "宇宙からの粒は、そのまま地面に届きます。"}, {"t": 700.2833333333333, "x": "それを月の上で数えることにも意味がありました。"}, {"t": 703.2666666666667, "x": "そして車は写真を撮り続けました。"}, {"t": 705.6333333333333, "x": "走りながら送ったテレビの画像は、2万枚をこえます。"}, {"t": 709.4166666666666, "x": "まわりを1周見渡す細かい写真は206組です。"}, {"t": 712.9, "x": "写真には月の小さなクレーターが写っていました。"}, {"t": 715.95, "x": "運転する人たちは、小さなクレーターを目印にしました。"}, {"t": 719.9, "x": "そして、名前をつけて呼んでいたとされます。"}, {"t": 722.8666666666667, "x": "その呼び名のいくつかは、のちに月の地図に載ります。"}, {"t": 726.3166666666667, "x": "ルノホート1号の上には、もう一つ"}, {"t": 728.8833333333333, "x": "大事な物が積まれていました。"}, {"t": 730.6333333333333, "x": "光をはね返す鏡です。"}, {"t": 732.45, "x": "この鏡はフランスで作られた物でした。"}, {"t": 734.9833333333333, "x": "ふつうの鏡はななめから来た光を"}, {"t": 737.1333333333333, "x": "ななめの向きへはね返します。"}, {"t": 738.9166666666666, "x": "けれどこの鏡は、光が来た方向へ"}, {"t": 741.5666666666667, "x": "そのまま返すように作られています。"}, {"t": 743.7333333333333, "x": "かどを3つ合わせた形の鏡をいくつも並べた物です。"}, {"t": 747.2833333333333, "x": "部屋のかどに向かって、ボールを投げたとします。"}, {"t": 750.4, "x": "ボールは壁と壁と床にはね返り、戻ってきます。"}, {"t": 753.9333333333333, "x": "光でも同じことが起きます。"}, {"t": 755.8166666666667, "x": "地球から、強い光を送ります。"}, {"t": 758.4, "x": "鏡に当たった光は、地球へ戻ってきます。"}, {"t": 761.5666666666667, "x": "光が往復する時間を測ります。"}, {"t": 763.9166666666666, "x": "すると、月までの距離が分かります。"}, {"t": 766.5333333333333, "x": "光の速さは決まっているからです。"}, {"t": 768.7333333333333, "x": "月までの往復はおよそ2.5秒です。"}, {"t": 771.4166666666666, "x": "その時間をとても細かく測ります。"}, {"t": 773.7333333333333, "x": "そうすると、ごくわずかな違いまで分かります。"}, {"t": 776.8833333333333, "x": "月がどれだけ揺れながら回っているか。"}, {"t": 779.2166666666667, "x": "月の中がどうなっているか。"}, {"t": 781.0, "x": "そうしたことを調べる手がかりになります。"}, {"t": 783.4333333333333, "x": "ただし、光は月まで行くうちに大きく広がります。"}, {"t": 787.0666666666667, "x": "返ってくる光はほんのわずかです。"}, {"t": 789.2333333333333, "x": "鏡の場所が分からなければ、光は当てられません。"}, {"t": 792.6666666666666, "x": "ルノホート1号の鏡も、測られたことがあります。"}, {"t": 796.2, "x": "着陸から3か月の間に、何回かとされています。"}, {"t": 799.9833333333333, "x": "ところがそのときの測った結果は、発表 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
