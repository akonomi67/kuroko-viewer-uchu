<script>
const D={"name": "ep002", "file": "ep002", "dur": 1950.3, "segs": [], "subs": [{"t": 0.0, "x": "月の南極のすぐそばに、直径"}, {"t": 2.433333333333333, "x": "およそ二十キロメートルのクレーターがあります。"}, {"t": 5.033333333333333, "x": "名前は、シャクルトン。"}, {"t": 5.65, "x": "シャクルトン█"}, {"t": 6.733333333333333, "x": "深さは四キロメートルを超えます。"}, {"t": 8.866666666666667, "x": "その縁の上では、太陽は沈み"}, {"t": 11.266666666666667, "x": "きることがほとんどありません。"}, {"t": 12.9, "x": "地平線すれすれのところを、"}, {"t": 14.55, "x": "低く、横へ横へと移っていきます。"}, {"t": 17.566666666666666, "x": "ところが、縁から四キロメートル"}, {"t": 19.783333333333335, "x": "下った底には、その光が届きません。"}, {"t": 22.566666666666666, "x": "今日も届いていませんし、昨日も届いていません。"}, {"t": 25.983333333333334, "x": "月に人間が行くよりずっと前から、届いていません。"}, {"t": 29.533333333333335, "x": "NASAは、月の南極のクレーターを紹介する"}, {"t": 32.516666666666666, "x": "映像の中で、こうした場所を、二十億年以上、"}, {"t": 36.21666666666667, "x": "日の光を浴びていない場所、と書いています。"}, {"t": 39.5, "x": "月には、こういう底がいくつもあります。"}, {"t": 42.333333333333336, "x": "まとめて、永久影と呼ばれています。"}, {"t": 43.3, "x": "永久影█"}, {"t": 45.63333333333333, "x": "永久影の底を、太陽の光で写した"}, {"t": 48.61666666666667, "x": "写真は、一枚もありません。"}, {"t": 50.766666666666666, "x": "光の当たらない場所は、光で写すことができないからです。"}, {"t": 54.666666666666664, "x": "それでも、人間はこの底について、"}, {"t": 57.35, "x": "いくつかのことを知っています。"}, {"t": 59.36666666666667, "x": "温度を測り、成分を調べ、一度は、"}, {"t": 62.6, "x": "そこへ物をぶつけてもいます。"}, {"t": 64.65, "x": "そこが、月の上でもとびきり冷たい場所であること。"}, {"t": 68.16666666666667, "x": "その冷たさが、半世紀以上も前に、"}, {"t": 70.98333333333333, "x": "紙の上で予想されていたこと。"}, {"t": 73.21666666666667, "x": "そして、予想どおり、そこに氷があったこと。"}, {"t": 76.8, "x": "一方で、どれだけあるのか。"}, {"t": 79.03333333333333, "x": "いつからそこにあるのか。"}, {"t": 80.56666666666666, "x": "そもそも、その影はいつから影なのか。"}, {"t": 83.41666666666667, "x": "そこには、まだはっきりしないことが残っています。"}, {"t": 86.66666666666667, "x": "写真のない場所について、なぜそこまで分かっているのか。"}, {"t": 90.41666666666667, "x": "どこまでが確かめられていて、"}, {"t": 92.11666666666666, "x": "どこから先が、まだ分かっていないのか。"}, {"t": 95.1, "x": "記録に残っているところを、順に読んでいきます。"}, {"t": 98.36666666666666, "x": "まず、影がなぜ消えないのかからです。"}, {"t": 101.06666666666666, "x": "地球には季節があります。"}, {"t": 102.8, "x": "地球の自転の軸が、太陽を回る道すじに対して、"}, {"t": 106.81666666666666, "x": "二十三・四四度傾いているからです。"}, {"t": 106.86666666666666, "x": "二十三・四四度█"}, {"t": 110.0, "x": "一年のうちに、北半球が太陽のほうへ傾く"}, {"t": 113.35, "x": "時期と、南半球が傾く時期が交互に来ます。"}, {"t": 116.81666666666666, "x": "北極にも南極にも、一年のどこかで、"}, {"t": 119.71666666666667, "x": "高いところから日が差します。"}, {"t": 121.78333333333333, "x": "月の軸は、ほとんど傾いていません。"}, {"t": 124.55, "x": "NASAが月の永久影について配っている"}, {"t": 127.2, "x": "解説資料には、月の軸の傾きは、地球と月が"}, {"t": 131.58333333333334, "x": "太陽を回る面に対して、わずか一・五度と書かれています。"}, {"t": 133.71666666666667, "x": "一・五度█"}, {"t": 135.96666666666667, "x": "地球の二十三・四四度と比べると、十五分の一ほどです。"}, {"t": 140.38333333333333, "x": "一・五度というのは、"}, {"t": 141.63333333333333, "x": "ほぼ真っすぐ立っている、ということです。"}, {"t": 144.56666666666666, "x": "そのため月には、季節と呼べるほどの変化がありません。"}, {"t": 148.18333333333334, "x": "赤道は、いつも赤道のまま。"}, {"t": 150.6, "x": "極は、いつも極のままです。"}, {"t": 152.85, "x": "これが、南極に立ったときの空の見え方を決めています。"}, {"t": 156.63333333333333, "x": "NASAの資料は、月の南極では、太陽は地平線から"}, {"t": 160.66666666666666, "x": "一・五度ほどの高さの中にとどまる、と書いています。"}, {"t": 164.16666666666666, "x": "太陽は、真上にも、斜め上にも来ません。"}, {"t": 167.61666666666667, "x": "地平線のあたりを、ぐるりと一周するように動きます。"}, {"t": 171.31666666666666, "x": "月の一日は、地球の時間でおよそ二十九・五日。"}, {"t": 175.36666666666667, "x": "太陽はそのあいだに、地平線ぎわを一回りします。"}, {"t": 179.03333333333333, "x": "たとえるなら、床に置いた懐中電灯で、"}, {"t": 181.95, "x": "部屋を照らしているようなものです。"}, {"t": 184.2, "x": "光は床すれすれを横に走ります。"}, {"t": 186.65, "x": "机の上は明るくなっても、机の下の奥には、"}, {"t": 189.96666666666667, "x": "いつまでも光が入りません。"}, {"t": 192.08333333333334, "x": "月の南極の地形は、平らではありません。"}, {"t": 195.11666666666667, "x": "大小のクレーターが重なり合い、縁は"}, {"t": 197.76666666666668, "x": "高く盛り上がり、底は深く沈んでいます。"}, {"t": 200.73333333333332, "x": "横から差す光が、高い縁に当たります。"}, {"t": 203.78333333333333, "x": "その縁の内側、深く沈んだ底は、"}, {"t": 206.48333333333332, "x": "縁そのものの影に入ります。"}, {"t": 208.65, "x": "太陽がどちらに回っても、どこかの縁が、"}, {"t": 211.55, "x": "光をさえぎります。"}, {"t": 213.16666666666666, "x": "シャクルトンで考えてみます。"}, {"t": 215.0, "x": "縁から底までの深さを、四・二キロメートルとします。"}, {"t": 218.8, "x": "太陽の高さが一・五度だとすると、"}, {"t": 221.08333333333334, "x": "その縁が落とす影の長さは、計算の上では、"}, {"t": 224.65, "x": "およそ百六十キロメートルになります。"}, {"t": 227.35, "x": "クレーターの直径は、二十キロメートルほど。"}, {"t": 230.41666666666666, "x": "影は、クレーターの底を覆っても、まだ余ります。"}, {"t": 234.13333333333333, "x": "もちろん、実際の地形は、この計算ほど"}, {"t": 237.51666666666668, "x": "単純ではありません。"}, {"t": 238.75, "x": "縁の高さは場所によって違いますし、"}, {"t": 241.1, "x": "周りの山が光をさえぎることもあります。"}, {"t": 244.06666666666666, "x": "だから、どこがいつも影なのかを知るには、"}, {"t": 246.83333333333334, "x": "地形を細かく測って、太陽の動きを一年分、"}, {"t": 250.68333333333334, "x": "二年分と当てはめてみるしかありません。"}, {"t": 253.33333333333334, "x": "それをやったのが、NASAの月周回機、"}, {"t": 256.0833333333333, "x": "ルナー・リコネサンス・オービター█"}, {"t": 256.3333333333333, "x": "ルナー・リコネサンス・オービターです。"}, {"t": 258.8333333333333, "x": "以後は、略してエル・アール・オーと呼びます。"}, {"t": 261.56666666666666, "x": "エル・アール・オーは、二〇〇九年に打ち上げられ、"}, {"t": 264.48333333333335, "x": "月の北極と南極の上を通る軌道を回り続けてきました。"}, {"t": 268.6333333333333, "x": "NASAの資料には、極を通る軌道が"}, {"t": 271.18333333333334, "x": "選ばれた大きな理由の一つは、極の近くで"}, {"t": 274.23333333333335, "x": "水を探すためだった、と書かれています。"}, {"t": 276.93333333333334, "x": "この機体には、レーザーで高さを"}, {"t": 279.21666666666664, "x": "測る装置が積まれています。"}, {"t": 280.93333333333334, "x": "月面に向けて光の点を打ち、それが戻ってくるまでの"}, {"t": 284.65, "x": "時間から、地面の高さを割り出します。"}, {"t": 287.35, "x": "これを何年も積み重ねて、南極の"}, {"t": 290.01666666666665, "x": "まわりの起伏を細かく描き出しました。"}, {"t": 292.4, "x": "その起伏に、太陽の動きを重ねると、一度も"}, {"t": 296.1333333333333, "x": "光の当たらない場所が地図の上に浮かび上がります。"}, {"t": 299.0833333333333, "x": "こうして作られた南極の地図では、いちばん暗い色で"}, {"t": 302.51666666666665, "x": "塗られた場所が永久影、いちばん明るい色の"}, {"t": 305.65, "x": "場所が、ほとんどいつも日なたにある場所です。"}, {"t": 308.46666666666664, "x": "その地図の真ん中に、シャクルトンがあります。"}, {"t": 311.3833333333333, "x": "明るい縁と、暗い底が、同じ一つの"}, {"t": 314.6, "x": "クレーターの中に収まっています。"}, {"t": 316.55, "x": "同じことは、北極でも起きています。"}, {"t": 319.21666666666664, "x": "月の軸がほとんど傾いていない以上、北の"}, {"t": 322.31666666666666, "x": "極の近くにも、日の当たらない底があります。"}, {"t": 325.31666666666666, "x": "この回で主に南極を扱うのは、これから向かう"}, {"t": 328.6666666666667, "x": "機体の多くが、南を目指しているからです。"}, {"t": 331.6166666666667, "x": "その理由は、あとの章で触れます。"}, {"t": 334.18333333333334, "x": "明るい縁と、暗い底。"}, {"t": 336.3, "x": "月の南極は、その二つが隣り合う場所です。"}, {"t": 339.53333333333336, "x": "光の当たらない場所は、どれくらい冷えるのか。"}, {"t": 342.68333333333334, "x": "これを測ったのも、エル・アール・オーでした。"}, {"t": 345.4166666666667, "x": "積まれている装置の一つ、ディバイナーは、"}, {"t": 347.35, "x": "ディバイナー█"}, {"t": 348.3333333333333, "x": "月面が出している熱を、宇宙から読み取ります。"}, {"t": 352.18333333333334, "x": "物は、温度に応じて、目には見えない光を出しています。"}, {"t": 356.45, "x": "その強さを測れば、手で触れなくても温度が分かります。"}, {"t": 360.1666666666667, "x": "光が当たっていない場所でも、この方法なら測れます。"}, {"t": 363.8333333333333, "x": "見るのではなく、熱を読むからです。"}, {"t": 366.45, "x": "ディバイナーの最初の温度地図が"}, {"t": 368.3833333333333, "x": "公表されたのは、二〇〇九年九月です。"}, {"t": 370.06666666666666, "x": "二〇〇九年九月█"}, {"t": 371.65, "x": "発表によると、昼間の赤道のあたりは、およそ百七度。"}, {"t": 376.0, "x": "夜になると、およそマイナス百八十三度まで下がります。"}, {"t": 379.96666666666664, "x": "空気がないので、日が沈むと、"}, {"t": 382.1666666666667, "x": "熱はそのまま宇宙へ逃げていきます。"}, {"t": 384.75, "x": "同じ場所で、昼と夜の差が、およそ二百九十度。"}, {"t": 388.76666666666665, "x": "地球では、まず起きないことです。"}, {"t": 391.21666666666664, "x": "けれども、赤道の夜には、終わりがあります。"}, {"t": 394.6166666666667, "x": "二週間ほどたてば、また日が昇り、地面は温め直されます。"}, {"t": 399.26666666666665, "x": "永久影には、それがありません。"}, {"t": 401.73333333333335, "x": "昇る日がないので、温め直されることもありません。"}, {"t": 405.26666666666665, "x": "冷えたものは、冷えたままです。"}, {"t": 407.46666666666664, "x": "そして、南極の大きなクレーターの、永久影の中。"}, {"t": 411.78333333333336, "x": "ここで測られた最も低い値は、三十五ケルビンでした。"}, {"t": 414.31666666666666, "x": "三十五ケルビン█"}, {"t": 416.3, "x": "摂氏に直すと、マイナス二百三十八度です。"}, {"t": 417.68333333333334, "x": "マイナス二百三十八度█"}, {"t": 420.23333333333335, "x": "ケルビンというのは、これ以上冷えようがない"}, {"t": 423.03333333333336, "x": "温度を、ゼロとした目盛りです。"}, {"t": 425.1666666666667, "x": "三十五ケルビンは、その底から、"}, {"t": 427.56666666666666, "x": "三十五度しか上にありません。"}, {"t": 429.78333333333336, "x": "この観測を率いた研究者は、この値は、太陽系の"}, {"t": 433.96666666666664, "x": "どこで測られたものと比べても、最も低い部類に"}, {"t": 437.31666666666666, "x": "入る、冥王星の表面も含めて、と述べています。"}, {"t": 441.25, "x": "この回の題にあるマイナス二百四十度は、"}, {"t": 443.8666666666667, "x": "この発表の数字を丸めたものです。"}, {"t": 446.5, "x": "ただし、数字は一つではありません。"}, {"t": 449.1166666666667, "x": "ここは、並べておく必要があります。"}, {"t": 451.8, "x": "NASAが現在、月の南極の"}, {"t": 453.93333333333334, "x": "環境をまとめている解説のページには、"}, {"t": 456.35, "x": "永久影の中は、およそマイナス二百三度まで"}, {"t": 460.0, "x": "下がることがある、と書かれています。"}, {"t": 462.3333333333333, "x": "二〇一八年のNASAの発表には、影の中で"}, {"t": 465.56666666666666, "x": "いちばん暖かいところでも、マイナス百五十七度を"}, {"t": 468.98333333333335, "x": "超えることはない、とあります。"}, {"t": 471.0, "x": "マイナス百五十七度、マイナス二百三度、"}, {"t": 474.1666666666667, "x": "マイナス二百三十八度。"}, {"t": 476.28333333333336, "x": "どれも、NASAや研究者が出した数字です。"}, {"t": 479.26666666666665, "x": "場所によって、季節によって、測った時期に"}, {"t": 482.55, "x": "よって、影の中の温度には幅があります。"}, {"t": 485.48333333333335, "x": "マイナス二百四十度は、その中でも、"}, {"t": 488.23333333333335, "x": "いちばん冷たい側の値です。"}, {"t": 490.5, "x": "さらに冷たい場所も、見つかっています。"}, {"t": 493.26666666666665, "x": "同じ二〇〇九年、ディバイナーは、"}, {"t": 495.8, "x": "エルミートというクレーターの底で、"}, {"t": 495.81666666666666, "x": "エルミート█"}, {"t": 498.28333333333336, "x": "マイナス二百四十九度を記録しました。"}, {"t": 501.3833333333333, "x": "NASAはこれを、太陽系で測られた中で"}, {"t": 504.2, "x": "最も冷たい場所、と紹介しています。"}, {"t": 507.05, "x": "ただし、エルミートがあるのは、北極のほうです。"}, {"t": 510.71666666666664, "x": "南極ではありません。"}, {"t": 512.1333333333333, "x": "月の永久影は、南にも北にもあります。"}, {"t": 515.4166666666666, "x": "では、なぜ温度がこれほど大事なのか。"}, {"t": 518.2166666666667, "x": "ディバイナーの研究者たちは、南極の超低温の"}, {"t": 521.5, "x": "場所について、水の氷をつかまえておけるだけの"}, {"t": 524.7166666666667, "x": "冷たさが間違いなくある、それより"}, {"t": 527.15, "x": "逃げやすい物質も同じだ、と述べています。"}, {"t": 529.9666666666667, "x": "月には空気がありません。"}, {"t": 531.6166666666667, "x": "月面のどこかに水の分子がやって来ても、"}, {"t": 534.1333333333333, "x": "日なたでは温められて、すぐに飛び出していきます。"}, {"t": 537.7, "x": "飛び出した分子は、月の重力に"}, {"t": 540.05, "x": "引かれて、また別の場所に落ちます。"}, {"t": 542.55, "x": "そこが日なたなら、また飛び出します。"}, {"t": 545.1166666666667, "x": "これを繰り返すうちに、ある分子は、"}, {"t": 547.6333333333333, "x": "たまたま永久影の中に落ちます。"}, {"t": 550.1666666666666, "x": "そこは、マイナス二百度を下回る世界です。"}, {"t": 553.35, "x": "落ちた分子は、動けなくなります。"}, {"t": 555.85, "x": "温まることがないので、二度と飛び出しません。"}, {"t": 558.9833333333333, "x": "入ることはできても、出ることはできない場所。"}, {"t": 562.0166666666667, "x": "研究者たちは、こうした場所をコールドトラップ、"}, {"t": 564.3, "x": "コールドトラップ█"}, {"t": 565.4333333333333, "x": "冷たいわな、と呼んでいます。"}, {"t": 568.0333333333333, "x": "月の永久影は、何億年、何十億年という"}, {"t": 571.9166666666666, "x": "時間をかけて、月面をさまよっていた物質を、"}, {"t": 575.15, "x": "少しずつためこんできたかもしれない場所です。"}, {"t": 578.05, "x": "冷たいわなという考えは、実は、"}, {"t": 580.55, "x": "人間が月に行くより前から出ていました。"}, {"t": 583.4, "x": "一九六一年。"}, {"t": 583.4, "x": "一九六一年█"}, {"t": 585.2166666666667, "x": "アメリカの地球物理学の専門誌に、"}, {"t": 587.5833333333334, "x": "三人の研究者、ワトソン、マレー、"}, {"t": 590.9333333333333, "x": "ブラウンの連名で、短い論文が載りました。"}, {"t": 594.3666666666667, "x": "題は、月に氷が存在する可能性について。"}, {"t": 597.8333333333334, "x": "アポロ十一号が月に降りる、八年前のことです。"}, {"t": 601.5666666666667, "x": "まだ、月の石は一つも地球に届いていません。"}, {"t": 604.9166666666666, "x": "月の極がどんな地形なのかも、"}, {"t": 606.8333333333334, "x": "詳しくは分かっていませんでした。"}, {"t": 609.1166666666667, "x": "それでも三人は、紙の上で考えました。"}, {"t": 612.25, "x": "月の軸はほとんど傾いていない。"}, {"t": 614.4833333333333, "x": "それなら、極の近くには、いつまでも"}, {"t": 617.4333333333333, "x": "日の当たらない場所があるはずだ。"}, {"t": 619.15, "x": "そこは極端に冷たいはずで、水の分子がそこに"}, {"t": 622.4833333333333, "x": "落ちたなら、長いあいだ逃げ出さずに残るはずだ。"}, {"t": 625.6, "x": "この論文はいま、月の氷を扱う研究の"}, {"t": 628.7666666666667, "x": "出発点として、繰り返し引用されています。"}, {"t": 632.0166666666667, "x": "ただ、予想が確かめられるまでには、"}, {"t": 634.5, "x": "長い時間がかかりました。"}, {"t": 636.4333333333333, "x": "その後の数十年、月は乾いた世界だと考えられてきました。"}, {"t": 640.7833333333333, "x": "二〇二二年のNASAの記事は、探査機の発見に"}, {"t": 644.05, "x": "よって、月がからからに乾いた、動きのない"}, {"t": 647.2666666666667, "x": "世界ではないことが確かめられた、と書いています。"}, {"t": 650.45, "x": "裏返せば、それまでは、そう見られていたということです。"}, {"t": 654.4, "x": "最初の手がかりは、一九九〇年代に来ました。"}, {"t": 658.2, "x": "一九九四年四月、アメリカの探査機クレメンタインは、"}, {"t": 658.2, "x": "一九九四年█"}, {"t": 662.6166666666667, "x": "アンテナを月の極に向けて電波を送り、"}, {"t": 665.5333333333333, "x": "はね返ってきた電波を地球で受ける実験を行いました。"}, {"t": 669.5, "x": "氷は、電波を独特のやり方ではね返します。"}, {"t": 673.0, "x": "一九九六年の論文は、南極の永久影で、氷があれば"}, {"t": 678.2333333333333, "x": "説明がつく反射が見られた、と報告しました。"}, {"t": 681.4833333333333, "x": "ただ、この結果は、そのまま"}, {"t": 683.8833333333333, "x": "受け入れられたわけではありません。"}, {"t": 685.6166666666667, "x": "一九九九年には、同じデータを"}, {"t": 688.6666666666666, "x": "解析し直した論文が出ています。"}, {"t": 690.85, "x": "電波の反射は、氷でなくても、ごつごつした"}, {"t": 694.2833333333333, "x": "地面でも強くなることがあります。"}, {"t": 696.2833333333333, "x": "クレメンタインの結果をどう読むかに"}, {"t": 698.2333333333333, "x": "ついては、議論が続いたとされています。"}, {"t": 700.9833333333333, "x": "次の手がかりは、ルナ・プロスペクターでした。"}, {"t": 702.2166666666667, "x": "ルナ・プロスペクター█"}, {"t": 704.3833333333333, "x": "一九九八年一月六日に打ち上げられた"}, {"t": 707.6166666666667, "x": "この探査機は、月面から飛び出してくる"}, {"t": 710.25, "x": "中性子を数える装置を積んでいました。"}, {"t": 712.7333333333333, "x": "宇宙から降り注ぐ粒子が月面に当たると、"}, {"t": 715.4166666666666, "x": "中性子がはじき出されます。"}, {"t": 717.4833333333333, "x": "そのとき、地面に水素が多く含まれていると、"}, {"t": 720.75, "x": "中性子の勢いがそがれます。"}, {"t": 723.0333333333333, "x": "水素は、水の分子を作っている部品の一つです。"}, {"t": 726.6166666666667, "x": "だから、中性子の勢いが弱まっている場所を"}, {"t": 729.6833333333333, "x": "地図にすれば、水がありそうな場所の地図になります。"}, {"t": 733.0333333333333, "x": "見ているのは、地面から飛び出してくる粒の勢いです。"}, {"t": 736.65, "x": "光を使わないので、日が当たっていてもいなくても、"}, {"t": 739.8666666666667, "x": "同じように数えられます。"}, {"t": 741.85, "x": "一九九八年三月、この装置は、"}, {"t": 745.2, "x": "月の両極で水素が多いことを示しました。"}, {"t": 748.3833333333333, "x": "NASAの記録には、データからは、それぞれの極に、"}, {"t": 751.9166666666666, "x": "およそ三億トンの水の氷が、砂に混じっている"}, {"t": 755.5666666666667, "x": "可能性がうかがえた、と書かれています。"}, {"t": 758.2, "x": "ここで一つ、注意が必要です。"}, {"t": 760.7333333333333, "x": "この装置が数えたのは、水素です。"}, {"t": 763.4166666666666, "x": "水そのものではありません。"}, {"t": 765.0666666666667, "x": "水素の多くが水の形で入っているなら、"}, {"t": 767.6666666666666, "x": "その量になる、という推定でした。"}, {"t": 770.45, "x": "確かめる方法が、一つだけ残っていました。"}, {"t": 773.5833333333334, "x": "ルナ・プロスペクターは、燃料が尽きかけた最後に、"}, {"t": 776.8, "x": "わざと月面にぶつけられることになりました。"}, {"t": 779.7333333333333, "x": "狙ったのは、南極の近くにある、"}, {"t": 782.2, "x": "永久影を持つクレーターです。"}, {"t": 784.5833333333334, "x": "ぶつかった衝撃で、底の氷が水蒸気になって舞い上がれば、"}, {"t": 788.65, "x": "それを地球の望遠鏡でとらえられるかもしれない。"}, {"t": 792.0, "x": "そう考えられました。"}, {"t": 793.4666666666667, "x": "一九九九年七月三十一日、世界時の九時五十二分。"}, {"t": 793.4666666666667, "x": "一九九九年七月三十一日█"}, {"t": 798.5833333333334, "x": "探査機は、南極のシューメーカー・"}, {"t": 800.8833333333333, "x": "クレーターに落ちました。"}, {"t": 802.25, "x": "そのクレーターの名前のもとになった"}, {"t": 804.15, "x": "惑星地質学者、ユージン・シューメーカーの"}, {"t": 806.95, "x": "遺灰の一部を、この探査機は積んでいました。"}, {"t": 809.9166666666666, "x": "NASAの記録にも、そう書かれています。"}, {"t": 812.5166666666667, "x": "結果は、はっきりしませんでした。"}, {"t": 814.8666666666667, "x": "NASAの記録には、地球の望遠鏡で"}, {"t": 817.4666666666667, "x": "舞い上がった塵を観測したが、水蒸気に"}, {"t": 820.2833333333333, "x": "特有の信号は見られなかった、とあります。"}, {"t": 823.3, "x": "氷がなかった、という意味ではありません。"}, {"t": 826.15, "x": "舞い上がった量が少なすぎたのかもしれませんし、"}, {"t": 829.0166666666667, "x": "地球から見るには遠すぎたのかもしれません。"}, {"t": 831.9666666666667, "x": "見えなかった、というだけです。"}, {"t": 834.15, "x": "予想から三十八年。"}, {"t": 835.8, "x": "永久影の底に何があるのかは、まだ、推定のままでした。"}, {"t": 840.25, "x": "十年後、NASAは、同じことを、"}, {"t": 842.95, "x": "もっと大きな規模でやり直しました。"}, {"t": 845.45, "x": "二〇〇九年六月十八日。"}, {"t": 845.45, "x": "二〇〇九年六月十八日█"}, {"t": 847.6833333333333, "x": "エル・アール・オーと一緒に、"}, {"t": 849.0833333333334, "x": "もう一機の探査機が打ち上げられました。"}, {"t": 851.7333333333333, "x": "名前は、エルクロス。"}, {"t": 852.45, "x": "エルクロス█"}, {"t": 853.5166666666667, "x": "月のクレーターを観測し、探るための"}, {"t": 856.3333333333334, "x": "衛星、という意味の頭文字です。"}, {"t": 858.7833333333333, "x": "エルクロスは、探査機というより、しくみそのものでした。"}, {"t": 862.6166666666667, "x": "打ち上げに使ったロケットの上段、セントールと"}, {"t": 865.6833333333333, "x": "呼ばれる部分を、切り離さずに連れていきます。"}, {"t": 868.7333333333333, "x": "燃料を使い切ったあとの、空の筒です。"}, {"t": 871.75, "x": "重さは二トンあまりとされています。"}, {"t": 873.8666666666667, "x": "この筒を、月の永久影に真上から落とします。"}, {"t": 877.35, "x": "そして、そのすぐ後ろを、エルクロス本体が追いかけます。"}, {"t": 881.5833333333334, "x": "本体には、カメラや、光の成 ": 1323.3166666666666, "x": "高解像度カメラをもとに作られました。"}, {"t": 1325.7833333333333, "x": "ただし、光に対する感度は、およそ二百倍とされています。"}, {"t": 1330.2666666666667, "x": "永久影の底には、日の光は差しこみませんが、"}, {"t": 1333.6666666666667, "x": "近くの明るい斜面や山にはね返った光が、"}, {"t": 1336.8166666666666, "x": "ほんのわずかに回りこんでいるとされています。"}, {"t": 1339.6666666666667, "x": "シャドウカムは、そのかすかな光で、底を写すしくみです。"}, {"t": 1343.8833333333334, "x": "たとえば、北極の近くにある、直径十九・"}, {"t": 1347.4, "x": "九キロメートルのエルミートAというクレーター。"}, {"t": 1350.25, "x": "その内側を、幅十一キロメートルにわたって"}, {"t": 1353.35, "x": "つなぎ合わせた画像が公開されています。"}, {"t": 1355.8333333333333, "x": "二〇二六年八月にも、新しい"}, {"t": 1358.7, "x": "データがまとめて公開されました。"}, {"t": 1360.65, "x": "ここで、はっきりさせておきます。"}, {"t": 1362.9666666666667, "x": "いま、永久影の底を写した画像はあります。"}, {"t": 1366.3666666666666, "x": "けれども、それは星の光や、自分で打ったレーザーや、"}, {"t": 1370.25, "x": "よそから回りこんだかすかな光で写したものです。"}, {"t": 1373.5333333333333, "x": "太陽に照らされた永久影の底の写真は、一枚もありません。"}, {"t": 1378.0, "x": "照らされたことが、ないからです。"}, {"t": 1380.2833333333333, "x": "この回の題には、二十億年という数字を置いています。"}, {"t": 1381.6666666666667, "x": "二十億年█"}, {"t": 1384.5833333333333, "x": "これは、NASAの言葉です。"}, {"t": 1386.6, "x": "二〇一三年に公開された映像のページには、"}, {"t": 1389.5666666666666, "x": "月の南極のクレーターの奥深くに、二十億年以上、"}, {"t": 1393.7, "x": "日の光を浴びていない場所がある、と書かれています。"}, {"t": 1397.3333333333333, "x": "二〇二二年の記事では、何十億年も、という"}, {"t": 1401.1666666666667, "x": "言い方になっています。"}, {"t": 1402.3833333333334, "x": "では、永久影は、いつからあるのでしょうか。"}, {"t": 1405.85, "x": "ここに、新しい研究があります。"}, {"t": 1408.45, "x": "二〇二三年九月、アメリカの惑星科学研究所の研究者らが、"}, {"t": 1408.45, "x": "二〇二三年█"}, {"t": 1413.5666666666666, "x": "永久影の年齢について、論文を発表しました。"}, {"t": 1417.9333333333334, "x": "手がかりにしたのは、月の軸の傾きの歴史です。"}, {"t": 1421.4666666666667, "x": "月は、生まれたころ、いまより"}, {"t": 1423.9166666666667, "x": "ずっと地球の近くを回っていました。"}, {"t": 1426.1166666666666, "x": "そこから少しずつ、地球から遠ざかってきました。"}, {"t": 1429.5666666666666, "x": "その途中で、月の自転の軸の向きが、"}, {"t": 1432.3666666666666, "x": "大きく変わった時期があるとされています。"}, {"t": 1435.0, "x": "いま、月の軸はほとんど傾いていません。"}, {"t": 1438.0, "x": "けれども、昔の月は、もっと大きく傾いていた。"}, {"t": 1441.9333333333334, "x": "傾いていれば、極の近くにも、"}, {"t": 1444.35, "x": "季節ごとに日が差しこみます。"}, {"t": 1446.4833333333333, "x": "その間は、永久影は生まれません。"}, {"t": 1449.3, "x": "研究者たちは、地球と月の距離が"}, {"t": 1451.8, "x": "どう変わってきたかという最近の計算をもとに、"}, {"t": 1454.5333333333333, "x": "月の軸の向きの移り変わりをたどり、永久影の"}, {"t": 1458.3333333333333, "x": "広さがどう変わってきたかを計算しました。"}, {"t": 1460.8166666666666, "x": "結果は、こうです。"}, {"t": 1462.4666666666667, "x": "永久影と呼べる場所は、三十四億年前より"}, {"t": 1464.4, "x": "三十四億年前█"}, {"t": 1466.1333333333334, "x": "昔には、ほとんどありませんでした。"}, {"t": 1468.8166666666666, "x": "二十一億年前には、太陽の通り道の傾きがいまの"}, {"t": 1468.8166666666666, "x": "二十一億年前█"}, {"t": 1473.05, "x": "二倍ほどで、永久影の広さは、いまの半分ほどでした。"}, {"t": 1477.65, "x": "いまある永久影の大部分は、"}, {"t": 1479.6166666666666, "x": "二十二億年前より新しい時代に生まれた。"}, {"t": 1482.8333333333333, "x": "そして、永久影の年齢は、平均すると、"}, {"t": 1486.5166666666667, "x": "長くても十八億年ほど。"}, {"t": 1488.7333333333333, "x": "エルクロスが打ちこまれたカベウスの永久影は、"}, {"t": 1491.5166666666667, "x": "十億年に満たない、とされています。"}, {"t": 1494.4666666666667, "x": "月そのものの年齢は、四十五億年です。"}, {"t": 1497.6333333333334, "x": "永久影は、月の歴史の後半になってから、"}, {"t": 1500.8, "x": "少しずつ広がってきたものでした。"}, {"t": 1503.15, "x": "こうなると、二十億年という数字の"}, {"t": 1505.8, "x": "意味も、読み方が変わります。"}, {"t": 1507.85, "x": "二十億年前より前から、ずっと影だった場所は、あります。"}, {"t": 1512.2666666666667, "x": "いまの永久影の半分ほどの広さは、"}, {"t": 1514.8166666666666, "x": "その頃にはもう影でした。"}, {"t": 1516.8, "x": "NASAの言う、二十億年以上、日の光を"}, {"t": 1520.1, "x": "浴びていない場所は、この研究とも食い違いません。"}, {"t": 1523.3833333333334, "x": "けれども、それは永久影の全部ではありません。"}, {"t": 1526.7166666666667, "x": "むしろ、いまの永久影の多くは、それより新しい。"}, {"t": 1530.7666666666667, "x": "永久影は、はじめから"}, {"t": 1532.65, "x": "永久だったわけではない、ということです。"}, {"t": 1535.3833333333334, "x": "シャクルトンも、そうかもしれません。"}, {"t": 1537.8, "x": "二〇一二年の論文によれば、"}, {"t": 1539.7333333333333, "x": "シャクルトンができたのは三十億年以上前です。"}, {"t": 1543.0833333333333, "x": "けれども、その底が、生まれたときから"}, {"t": 1545.95, "x": "影だったとはかぎりません。"}, {"t": 1547.4666666666667, "x": "クレーターのほうが、その影よりも"}, {"t": 1549.7166666666667, "x": "古い、ということがありえます。"}, const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
