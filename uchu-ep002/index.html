<script>
const D={"name": "ep002", "file": "ep002", "dur": 1938.8333125, "segs": [], "subs": [{"t": 0.0, "x": "月の南極のすぐそばに、直径"}, {"t": 2.433333333333333, "x": "およそ二十キロメートルのクレーターがあります。"}, {"t": 5.033333333333333, "x": "名前は、シャクルトン。"}, {"t": 5.65, "x": "シャクルトン█"}, {"t": 6.733333333333333, "x": "深さは四キロメートルを超えます。"}, {"t": 8.866666666666667, "x": "その縁の上では、太陽は沈み"}, {"t": 11.266666666666667, "x": "きることがほとんどありません。"}, {"t": 12.9, "x": "地平線すれすれのところを、"}, {"t": 14.55, "x": "低く、横へ横へと移っていきます。"}, {"t": 17.566666666666666, "x": "ところが、縁から四キロメートル"}, {"t": 19.783333333333335, "x": "下った底には、その光が届きません。"}, {"t": 22.566666666666666, "x": "今日も届いていませんし、昨日も届いていません。"}, {"t": 25.983333333333334, "x": "月に人間が行くよりずっと前から、届いていません。"}, {"t": 29.533333333333335, "x": "NASAは、月の南極のクレーターを紹介する"}, {"t": 32.516666666666666, "x": "映像の中で、こうした場所を、二十億年以上、"}, {"t": 36.21666666666667, "x": "日の光を浴びていない場所、と書いています。"}, {"t": 39.5, "x": "月には、こういう底がいくつもあります。"}, {"t": 42.333333333333336, "x": "まとめて、永久影と呼ばれています。"}, {"t": 43.18333333333333, "x": "永久影█"}, {"t": 45.2, "x": "永久影の底を、太陽の光で写した"}, {"t": 48.18333333333333, "x": "写真は、一枚もありません。"}, {"t": 50.333333333333336, "x": "光の当たらない場所は、光で写すことができないからです。"}, {"t": 54.233333333333334, "x": "それでも、人間はこの底について、"}, {"t": 56.916666666666664, "x": "いくつかのことを知っています。"}, {"t": 58.93333333333333, "x": "温度を測り、成分を調べ、一度は、"}, {"t": 62.166666666666664, "x": "そこへ物をぶつけてもいます。"}, {"t": 64.21666666666667, "x": "そこが、月の上でもとびきり冷たい場所であること。"}, {"t": 67.73333333333333, "x": "その冷たさが、半世紀以上も前に、"}, {"t": 70.55, "x": "紙の上で予想されていたこと。"}, {"t": 72.78333333333333, "x": "そして、予想どおり、そこに氷があったこと。"}, {"t": 76.36666666666666, "x": "一方で、どれだけあるのか。"}, {"t": 78.6, "x": "いつからそこにあるのか。"}, {"t": 80.13333333333334, "x": "そもそも、その影はいつから影なのか。"}, {"t": 82.98333333333333, "x": "そこには、まだはっきりしないことが残っています。"}, {"t": 86.23333333333333, "x": "写真のない場所について、なぜそこまで分かっているのか。"}, {"t": 89.98333333333333, "x": "どこまでが確かめられていて、"}, {"t": 91.68333333333334, "x": "どこから先が、まだ分かっていないのか。"}, {"t": 94.66666666666667, "x": "記録に残っているところを、順に読んでいきます。"}, {"t": 97.93333333333334, "x": "まず、影がなぜ消えないのかからです。"}, {"t": 100.63333333333334, "x": "地球には季節があります。"}, {"t": 102.36666666666666, "x": "地球の自転の軸が、太陽を回る道すじに対して、"}, {"t": 106.1, "x": "二十三・四四度傾いているからです。"}, {"t": 106.13333333333334, "x": "二十三・四四度█"}, {"t": 109.05, "x": "一年のうちに、北半球が太陽のほうへ傾く"}, {"t": 112.4, "x": "時期と、南半球が傾く時期が交互に来ます。"}, {"t": 115.86666666666666, "x": "北極にも南極にも、一年のどこかで、"}, {"t": 118.76666666666667, "x": "高いところから日が差します。"}, {"t": 120.83333333333333, "x": "月の軸は、ほとんど傾いていません。"}, {"t": 123.6, "x": "NASAが月の永久影について配っている"}, {"t": 126.03333333333333, "x": "解説資料には、月の軸の傾きは、地球と月が"}, {"t": 130.01666666666668, "x": "太陽を回る面に対して、わずか一・五度と書かれています。"}, {"t": 131.98333333333332, "x": "一・五度█"}, {"t": 134.03333333333333, "x": "地球の二十三・四四度と比べると、十五分の一ほどです。"}, {"t": 138.45, "x": "一・五度というのは、"}, {"t": 139.7, "x": "ほぼ真っすぐ立っている、ということです。"}, {"t": 142.63333333333333, "x": "そのため月には、季節と呼べるほどの変化がありません。"}, {"t": 146.25, "x": "赤道は、いつも赤道のまま。"}, {"t": 148.66666666666666, "x": "極は、いつも極のままです。"}, {"t": 150.91666666666666, "x": "これが、南極に立ったときの空の見え方を決めています。"}, {"t": 154.7, "x": "NASAの資料は、月の南極では、太陽は地平線から"}, {"t": 158.73333333333332, "x": "一・五度ほどの高さの中にとどまる、と書いています。"}, {"t": 162.23333333333332, "x": "太陽は、真上にも、斜め上にも来ません。"}, {"t": 165.68333333333334, "x": "地平線のあたりを、ぐるりと一周するように動きます。"}, {"t": 169.38333333333333, "x": "月の一日は、地球の時間でおよそ二十九・五日。"}, {"t": 173.43333333333334, "x": "太陽はそのあいだに、地平線ぎわを一回りします。"}, {"t": 177.1, "x": "たとえるなら、床に置いた懐中電灯で、"}, {"t": 180.01666666666668, "x": "部屋を照らしているようなものです。"}, {"t": 182.26666666666668, "x": "光は床すれすれを横に走ります。"}, {"t": 184.71666666666667, "x": "机の上は明るくなっても、机の下の奥には、"}, {"t": 188.03333333333333, "x": "いつまでも光が入りません。"}, {"t": 190.15, "x": "月の南極の地形は、平らではありません。"}, {"t": 193.18333333333334, "x": "大小のクレーターが重なり合い、縁は"}, {"t": 195.83333333333334, "x": "高く盛り上がり、底は深く沈んでいます。"}, {"t": 198.8, "x": "横から差す光が、高い縁に当たります。"}, {"t": 201.85, "x": "その縁の内側、深く沈んだ底は、"}, {"t": 204.55, "x": "縁そのものの影に入ります。"}, {"t": 206.71666666666667, "x": "太陽がどちらに回っても、どこかの縁が、"}, {"t": 209.61666666666667, "x": "光をさえぎります。"}, {"t": 211.23333333333332, "x": "シャクルトンで考えてみます。"}, {"t": 213.06666666666666, "x": "縁から底までの深さを、四・二キロメートルとします。"}, {"t": 216.86666666666667, "x": "太陽の高さが一・五度だとすると、"}, {"t": 219.15, "x": "その縁が落とす影の長さは、計算の上では、"}, {"t": 222.71666666666667, "x": "およそ百六十キロメートルになります。"}, {"t": 225.41666666666666, "x": "クレーターの直径は、二十キロメートルほど。"}, {"t": 228.48333333333332, "x": "影は、クレーターの底を覆っても、まだ余ります。"}, {"t": 232.2, "x": "もちろん、実際の地形は、この計算ほど"}, {"t": 235.58333333333334, "x": "単純ではありません。"}, {"t": 236.81666666666666, "x": "縁の高さは場所によって違いますし、"}, {"t": 239.16666666666666, "x": "周りの山が光をさえぎることもあります。"}, {"t": 242.13333333333333, "x": "だから、どこがいつも影なのかを知るには、"}, {"t": 244.9, "x": "地形を細かく測って、太陽の動きを一年分、"}, {"t": 248.75, "x": "二年分と当てはめてみるしかありません。"}, {"t": 251.4, "x": "それをやったのが、NASAの月周回機、"}, {"t": 253.91666666666666, "x": "ルナー・リコネサンス・オービター█"}, {"t": 254.13333333333333, "x": "ルナー・リコネサンス・オービターです。"}, {"t": 256.43333333333334, "x": "以後は、略してエル・アール・オーと呼びます。"}, {"t": 259.1666666666667, "x": "エル・アール・オーは、二〇〇九年に打ち上げられ、"}, {"t": 262.0833333333333, "x": "月の北極と南極の上を通る軌道を回り続けてきました。"}, {"t": 266.23333333333335, "x": "NASAの資料には、極を通る軌道が"}, {"t": 268.78333333333336, "x": "選ばれた大きな理由の一つは、極の近くで"}, {"t": 271.8333333333333, "x": "水を探すためだった、と書かれています。"}, {"t": 274.53333333333336, "x": "この機体には、レーザーで高さを"}, {"t": 276.81666666666666, "x": "測る装置が積まれています。"}, {"t": 278.53333333333336, "x": "月面に向けて光の点を打ち、それが戻ってくるまでの"}, {"t": 282.25, "x": "時間から、地面の高さを割り出します。"}, {"t": 284.95, "x": "これを何年も積み重ねて、南極の"}, {"t": 287.6166666666667, "x": "まわりの起伏を細かく描き出しました。"}, {"t": 290.0, "x": "その起伏に、太陽の動きを重ねると、一度も"}, {"t": 293.73333333333335, "x": "光の当たらない場所が地図の上に浮かび上がります。"}, {"t": 296.68333333333334, "x": "こうして作られた南極の地図では、いちばん暗い色で"}, {"t": 300.1166666666667, "x": "塗られた場所が永久影、いちばん明るい色の"}, {"t": 303.25, "x": "場所が、ほとんどいつも日なたにある場所です。"}, {"t": 306.06666666666666, "x": "その地図の真ん中に、シャクルトンがあります。"}, {"t": 308.98333333333335, "x": "明るい縁と、暗い底が、同じ一つの"}, {"t": 312.2, "x": "クレーターの中に収まっています。"}, {"t": 314.15, "x": "同じことは、北極でも起きています。"}, {"t": 316.81666666666666, "x": "月の軸がほとんど傾いていない以上、北の"}, {"t": 319.9166666666667, "x": "極の近くにも、日の当たらない底があります。"}, {"t": 322.9166666666667, "x": "この回で主に南極を扱うのは、これから向かう"}, {"t": 326.26666666666665, "x": "機体の多くが、南を目指しているからです。"}, {"t": 329.21666666666664, "x": "その理由は、あとの章で触れます。"}, {"t": 331.78333333333336, "x": "明るい縁と、暗い底。"}, {"t": 333.9, "x": "月の南極は、その二つが隣り合う場所です。"}, {"t": 337.1333333333333, "x": "光の当たらない場所は、どれくらい冷えるのか。"}, {"t": 340.28333333333336, "x": "これを測ったのも、エル・アール・オーでした。"}, {"t": 343.01666666666665, "x": "積まれている装置の一つ、ディバイナーは、"}, {"t": 344.8333333333333, "x": "ディバイナー█"}, {"t": 345.76666666666665, "x": "月面が出している熱を、宇宙から読み取ります。"}, {"t": 349.4, "x": "物は、温度に応じて、目には見えない光を出しています。"}, {"t": 353.6666666666667, "x": "その強さを測れば、手で触れなくても温度が分かります。"}, {"t": 357.3833333333333, "x": "光が当たっていない場所でも、この方法なら測れます。"}, {"t": 361.05, "x": "見るのではなく、熱を読むからです。"}, {"t": 363.6666666666667, "x": "ディバイナーの最初の温度地図が"}, {"t": 365.4166666666667, "x": "公表されたのは、二〇〇九年九月です。"}, {"t": 366.95, "x": "二〇〇九年九月█"}, {"t": 368.3666666666667, "x": "発表によると、昼間の赤道のあたりは、およそ百七度。"}, {"t": 372.71666666666664, "x": "夜になると、およそマイナス百八十三度まで下がります。"}, {"t": 376.68333333333334, "x": "空気がないので、日が沈むと、"}, {"t": 378.8833333333333, "x": "熱はそのまま宇宙へ逃げていきます。"}, {"t": 381.46666666666664, "x": "同じ場所で、昼と夜の差が、およそ二百九十度。"}, {"t": 385.48333333333335, "x": "地球では、まず起きないことです。"}, {"t": 387.93333333333334, "x": "けれども、赤道の夜には、終わりがあります。"}, {"t": 391.3333333333333, "x": "二週間ほどたてば、また日が昇り、地面は温め直されます。"}, {"t": 395.98333333333335, "x": "永久影には、それがありません。"}, {"t": 398.45, "x": "昇る日がないので、温め直されることもありません。"}, {"t": 401.98333333333335, "x": "冷えたものは、冷えたままです。"}, {"t": 404.18333333333334, "x": "そして、南極の大きなクレーターの、永久影の中。"}, {"t": 408.5, "x": "ここで測られた最も低い値は、三十五ケルビンでした。"}, {"t": 410.75, "x": "三十五ケルビン█"}, {"t": 412.51666666666665, "x": "摂氏に直すと、マイナス二百三十八度です。"}, {"t": 413.73333333333335, "x": "マイナス二百三十八度█"}, {"t": 416.0, "x": "ケルビンというのは、これ以上冷えようがない"}, {"t": 418.8, "x": "温度を、ゼロとした目盛りです。"}, {"t": 420.93333333333334, "x": "三十五ケルビンは、その底から、"}, {"t": 423.3333333333333, "x": "三十五度しか上にありません。"}, {"t": 425.55, "x": "この観測を率いた研究者は、この値は、太陽系の"}, {"t": 429.73333333333335, : 540.3666666666667, "x": "これを繰り返すうちに、ある分子は、"}, {"t": 542.8833333333333, "x": "たまたま永久影の中に落ちます。"}, {"t": 545.4166666666666, "x": "そこは、マイナス二百度を下回る世界です。"}, {"t": 548.6, "x": "落ちた分子は、動けなくなります。"}, {"t": 551.1, "x": "温まることがないので、二度と飛び出しません。"}, {"t": 554.2333333333333, "x": "入ることはできても、出ることはできない場所。"}, {"t": 557.2666666666667, "x": "研究者たちは、こうした場所をコールドトラップ、"}, {"t": 559.3666666666667, "x": "コールドトラップ█"}, {"t": 560.4, "x": "冷たいわな、と呼んでいます。"}, {"t": 562.8, "x": "月の永久影は、何億年、何十億年という"}, {"t": 566.6833333333333, "x": "時間をかけて、月面をさまよっていた物質を、"}, {"t": 569.9166666666666, "x": "少しずつためこんできたかもしれない場所です。"}, {"t": 572.8166666666667, "x": "冷たいわなという考えは、実は、"}, {"t": 575.3166666666667, "x": "人間が月に行くより前から出ていました。"}, {"t": 578.1666666666666, "x": "一九六一年。"}, {"t": 578.1666666666666, "x": "一九六一年█"}, {"t": 579.9833333333333, "x": "アメリカの地球物理学の専門誌に、"}, {"t": 582.35, "x": "三人の研究者、ワトソン、マレー、"}, {"t": 585.7, "x": "ブラウンの連名で、短い論文が載りました。"}, {"t": 589.1333333333333, "x": "題は、月に氷が存在する可能性について。"}, {"t": 592.6, "x": "アポロ十一号が月に降りる、八年前のことです。"}, {"t": 596.3333333333334, "x": "まだ、月の石は一つも地球に届いていません。"}, {"t": 599.6833333333333, "x": "月の極がどんな地形なのかも、"}, {"t": 601.6, "x": "詳しくは分かっていませんでした。"}, {"t": 603.8833333333333, "x": "それでも三人は、紙の上で考えました。"}, {"t": 607.0166666666667, "x": "月の軸はほとんど傾いていない。"}, {"t": 609.25, "x": "それなら、極の近くには、いつまでも"}, {"t": 612.2, "x": "日の当たらない場所があるはずだ。"}, {"t": 613.9166666666666, "x": "そこは極端に冷たいはずで、水の分子がそこに"}, {"t": 617.25, "x": "落ちたなら、長いあいだ逃げ出さずに残るはずだ。"}, {"t": 620.3666666666667, "x": "この論文はいま、月の氷を扱う研究の"}, {"t": 623.5333333333333, "x": "出発点として、繰り返し引用されています。"}, {"t": 626.7833333333333, "x": "ただ、予想が確かめられるまでには、"}, {"t": 629.2666666666667, "x": "長い時間がかかりました。"}, {"t": 631.2, "x": "その後の数十年、月は乾いた世界だと考えられてきました。"}, {"t": 635.55, "x": "二〇二二年のNASAの記事は、探査機の発見に"}, {"t": 638.8166666666667, "x": "よって、月がからからに乾いた、動きのない"}, {"t": 642.0333333333333, "x": "世界ではないことが確かめられた、と書いています。"}, {"t": 645.2166666666667, "x": "裏返せば、それまでは、そう見られていたということです。"}, {"t": 649.1666666666666, "x": "最初の手がかりは、一九九〇年代に来ました。"}, {"t": 652.9666666666667, "x": "一九九四年四月、アメリカの探査機クレメンタインは、"}, {"t": 652.9666666666667, "x": "一九九四年█"}, {"t": 657.2, "x": "アンテナを月の極に向けて電波を送り、"}, {"t": 659.9833333333333, "x": "はね返ってきた電波を地球で受ける実験を行いました。"}, {"t": 663.7666666666667, "x": "氷は、電波を独特のやり方ではね返します。"}, {"t": 667.2666666666667, "x": "一九九六年の論文は、南極の永久影で、氷があれば"}, {"t": 672.5, "x": "説明がつく反射が見られた、と報告しました。"}, {"t": 675.75, "x": "ただ、この結果は、そのまま"}, {"t": 678.15, "x": "受け入れられたわけではありません。"}, {"t": 679.8833333333333, "x": "一九九九年には、同じデータを"}, {"t": 682.9333333333333, "x": "解析し直した論文が出ています。"}, {"t": 685.1166666666667, "x": "電波の反射は、氷でなくても、ごつごつした"}, {"t": 688.55, "x": "地面でも強くなることがあります。"}, {"t": 690.55, "x": "クレメンタインの結果をどう読むかに"}, {"t": 692.5, "x": "ついては、議論が続いたとされています。"}, {"t": 695.25, "x": "次の手がかりは、ルナ・プロスペクターでした。"}, {"t": 696.3166666666667, "x": "ルナ・プロスペクター█"}, {"t": 698.2, "x": "一九九八年一月六日に打ち上げられた"}, {"t": 701.4333333333333, "x": "この探査機は、月面から飛び出してくる"}, {"t": 704.0666666666667, "x": "中性子を数える装置を積んでいました。"}, {"t": 706.55, "x": "宇宙から降り注ぐ粒子が月面に当たると、"}, {"t": 709.2333333333333, "x": "中性子がはじき出されます。"}, {"t": 711.3, "x": "そのとき、地面に水素が多く含まれていると、"}, {"t": 714.5666666666667, "x": "中性子の勢いがそがれます。"}, {"t": 716.85, "x": "水素は、水の分子を作っている部品の一つです。"}, {"t": 720.4333333333333, "x": "だから、中性子の勢いが弱まっている場所を"}, {"t": 723.5, "x": "地図にすれば、水がありそうな場所の地図になります。"}, {"t": 726.85, "x": "見ているのは、地面から飛び出してくる粒の勢いです。"}, {"t": 730.4666666666667, "x": "光を使わないので、日が当たっていてもいなくても、"}, {"t": 733.6833333333333, "x": "同じように数えられます。"}, {"t": 735.6666666666666, "x": "一九九八年三月、この装置は、"}, {"t": 739.0166666666667, "x": "月の両極で水素が多いことを示しました。"}, {"t": 742.2, "x": "NASAの記録には、データからは、それぞれの極に、"}, {"t": 745.7333333333333, "x": "およそ三億トンの水の氷が、砂に混じっている"}, {"t": 749.3833333333333, "x": "可能性がうかがえた、と書かれています。"}, {"t": 752.0166666666667, "x": "ここで一つ、注意が必要です。"}, {"t": 754.55, "x": "この装置が数えたのは、水素です。"}, {"t": 757.2333333333333, "x": "水そのものではありません。"}, {"t": 758.8833333333333, "x": "水素の多くが水の形で入っているなら、"}, {"t": 761.4833333333333, "x": "その量になる、という推定でした。"}, {"t": 764.2666666666667, "x": "確かめる方法が、一つだけ残っていました。"}, {"t": 767.4, "x": "ルナ・プロスペクターは、燃料が 333, "x": "二〇〇九年十一月十三日█"}, {"t": 984.45, "x": "NASAは、月の南極の近くで、"}, {"t": 986.75, "x": "水を見つけたと発表しました。"}, {"t": 989.0666666666667, "x": "翌年、詳しい結果が論文にまとまります。"}, {"t": 992.3166666666667, "x": "エルクロスの装置が見た範囲の中に舞い上がった"}, {"t": 995.0166666666667, "x": "水は、水蒸気と氷を合わせて、最大で"}, {"t": 998.3, "x": "百五十五キログラム█"}, {"t": 998.35, "x": "百五十五キログラム、誤差は前後十二キログラム。"}, {"t": 1001.8333333333334, "x": "そこから、衝突した地点の砂に"}, {"t": 1004.2166666666667, "x": "含まれていた氷の割合が見積もられました。"}, {"t": 1006.95, "x": "重さにして、五・六パーセント。"}, {"t": 1008.0166666666667, "x": "五・六パーセント█"}, {"t": 1009.6333333333333, "x": "誤差は、前後二・九パーセントです。"}, {"t": 1012.5166666666667, "x": "百キログラムの砂をすくえば、五キログラムほどが氷。"}, {"t": 1016.3, "x": "ただし、少なければ三キログラムほど、"}, {"t": 1019.05, "x": "多ければ八キログラムほど。"}, {"t": 1021.1666666666666, "x": "それくらいの幅のある数字です。"}, {"t": 1023.2, "x": "そして、これは、カベウスの底の、"}, {"t": 1025.9666666666667, "x": "ある一か所に、一度だけ打ちこんだ結果です。"}, {"t": 1029.4166666666667, "x": "永久影全体に、同じ割合で氷があるという"}, {"t": 1033.0, "x": "意味ではありません。"}, {"t": 1034.0166666666667, "x": "舞い上がったものの中には、水のほかにも、"}, {"t": 1036.8666666666666, "x": "さまざまなものが入っていました。"}, {"t": 1039.1, "x": "二〇一〇年十月のNASAの発表は、二酸化硫黄、"}, {"t": 1042.5666666666666, "x": "二酸化炭素、ホルムアルデヒド、アンモニア、"}, {"t": 1046.25, "x": "メタノール、ナトリウム、そして水銀を挙げています。"}, {"t": 1050.3166666666666, "x": "エル・アール・オーの紫外線の装置も、"}, {"t": 1052.3833333333334, "x": "同じ煙を上から見ていました。"}, {"t": 1054.7833333333333, "x": "こちらは、水素の分子、一酸化炭素、"}, {"t": 1058.0666666666666, "x": "そして水銀をとらえています。"}, {"t": 1060.1833333333334, "x": "研究者の一人は、いちばん驚いたのは、土の"}, {"t": 1063.7333333333333, "x": "中に水銀があったこと、しかもエルクロスが見つけた水と"}, {"t": 1067.3666666666666, "x": "ほぼ同じくらいの量だったことだ、と述べています。"}, {"t": 1070.4833333333333, "x": "水銀は、地球では、温度計の中にあった銀色の液体です。"}, {"t": 1075.2166666666667, "x": "月の永久影では、それが、水と並んで、"}, {"t": 1078.7166666666667, "x": "凍りついたまま眠っていたことになります。"}, {"t": 1081.4833333333333, "x": "もう一つ、発表には、こう書かれていました。"}, {"t": 1084.9333333333334, "x": "煙の中には、ほとんど混じりけのない、氷の粒が見られた。"}, {"t": 1089.45, "x": "発表の中で研究者は、混じりけのない氷の"}, {"t": 1092.6833333333334, "x": "粒が見えたということは、水が何らかの形で"}, {"t": 1095.7833333333333, "x": "運ばれてきた、ということを意味する、と述べています。"}, {"t": 1099.4666666666667, "x": "どこから、どうやって運ばれてきたのかまでは、"}, {"t": 1102.35, "x": "この観測だけでは分かりません。"}, {"t": 1104.6333333333334, "x": "冷たいわなは、実際に、ものをつかまえていました。"}, {"t": 1108.4333333333334, "x": "一九六一年の三人の予想から、四十八年後のことです。"}, {"t": 1113.35, "x": "永久影の底には、太陽の光が届きません。"}, {"t": 1116.8833333333334, "x": "それでも、いまでは、底の様子を写した画像があります。"}, {"t": 1121.0166666666667, "x": "太陽以外のものを使って、写しているからです。"}, {"t": 1124.4, "x": "一つめは、星の光です。"}, {"t": 1126.6, "x": "エル・アール・オーに積まれた紫外線の装置、"}, {"t": 1129.0333333333333, "x": "ランプは、遠い星々から届く紫外線を使います。"}, {"t": 1132.9833333333333, "x": "太陽は低い位置にしか来ませんが、夜空の"}, {"t": 1135.9, "x": "星は、真上にも、どの方向にもあります。"}, {"t": 1139.1833333333334, "x": "そのかすかな光は、クレーターの"}, {"t": 1141.4333333333334, "x": "底にも降りそそいでいます。"}, {"t": 1143.0666666666666, "x": "氷の霜は、紫外線の波長によって、"}, {"t": 1145.9166666666667, "x": "光を吸いこんだり、はね返したりします。"}, {"t": 1149.1, "x": "ランプはその違いを読み取り、"}, {"t": 1150.85, "x": "永久影の中に霜があることをとらえました。"}, {"t": 1154.05, "x": "NASAの資料にそう書かれています。"}, {"t": 1156.1333333333334, "x": "二つめは、レーザーの光です。"}, {"t": 1158.4666666666667, "x": "第一章で触れた、高さを測る装置は、"}, {"t": 1161.4166666666667, "x": "自分でレーザーを打ちます。"}, {"t": 1163.3333333333333, "x": "だから、日の当たらない場所でも測れます。"}, {"t": 1166.1666666666667, "x": "そして、戻ってきた光の強さから、"}, {"t": 1168.8333333333333, "x": "地面の明るさも分かります。"}, {"t": 1170.9, "x": "二〇一二年、この装置でシャクルトンの"}, {"t": 1170.9, "x": "二〇一二年█"}, {"t": 1173.6833333333334, "x": "内側を調べた研究が、科学誌に載りました。"}, {"t": 1176.95, "x": "論文によると、シャクルトンの底は、周りの地面や、"}, {"t": 1180.7833333333333, "x": "近くのクレーターの内側よりも明るく見えました。"}, {"t": 1184.0833333333333, "x": "ただし、内側の壁ほどは明るくありませんでした。"}, {"t": 1187.65, "x": "なぜ底が明るいのか。"}, {"t": 1189.2, "x": "論文は、二つの読み方を示しています。"}, {"t": 1192.25, "x": "いちばん単純な説明は、日が当たらないために、"}, {"t": 1195.3833333333334, "x": "地面の傷み方が遅いから、というものです。"}, {"t": 1198.7333333333333, "x": "月の地面は、日の光や、太陽から吹きつける"}, {"t": 1202.3, "x": "粒によって、少しずつ黒ずんでいきます。"}, {"t": 1205.1166666666666, "x": "日の当たらない底では、それが進みにくい。"}, {"t": 1208.1, "x": "もう一つの可能性として、厚さ一マイクロ ": "シャドウカムは、エル・アール・オーの"}, {"t": 1313.7666666666667, "x": "高解像度カメラをもとに作られました。"}, {"t": 1316.2333333333333, "x": "ただし、光に対する感度は、およそ二百倍とされています。"}, {"t": 1320.7166666666667, "x": "永久影の底には、日の光は差しこみませんが、"}, {"t": 1324.1166666666666, "x": "近くの明るい斜面や山にはね返った光が、"}, {"t": 1327.2666666666667, "x": "ほんのわずかに回りこんでいるとされています。"}, {"t": 1330.1166666666666, "x": "シャドウカムは、そのかすかな光で、底を写すしくみです。"}, {"t": 1334.3333333333333, "x": "たとえば、北極の近くにある、直径十九・"}, {"t": 1337.85, "x": "九キロメートルのエルミートAというクレーター。"}, {"t": 1340.7, "x": "その内側を、幅十一キロメートルにわたって"}, {"t": 1343.8, "x": "つなぎ合わせた画像が公開されています。"}, {"t": 1346.2833333333333, "x": "二〇二六年八月にも、新しい"}, {"t": 1349.15, "x": "データがまとめて公開されました。"}, {"t": 1351.1, "x": "ここで、はっきりさせておきます。"}, {"t": 1353.4166666666667, "x": "いま、永久影の底を写した画像はあります。"}, {"t": 1356.8166666666666, "x": "けれども、それは星の光や、自分で打ったレーザーや、"}, {"t": 1360.7, "x": "よそから回りこんだかすかな光で写したものです。"}, {"t": 1363.9833333333333, "x": "太陽に照らされた永久影の底の写真は、一枚もありません。"}, {"t": 1368.45, "x": "照らされたことが、ないからです。"}, {"t": 1370.7333333333333, "x": "この回の題には、二十億年という数字を置いています。"}, {"t": 1371.95, "x": "二十億年█"}, {"t": 1374.5333333333333, "x": "これは、NASAの言葉です。"}, {"t": 1376.55, "x": "二〇一三年に公開された映像のページには、"}, {"t": 1379.5166666666667, "x": "月の南極のクレーターの奥深くに、二十億年以上、"}, {"t": 1383.65, "x": "日の光を浴びていない場所がある、と書かれています。"}, {"t": 1387.2833333333333, "x": "二〇二二年の記事では、何十億年も、という"}, {"t": 1391.1166666666666, "x": "言い方になっています。"}, {"t": 1392.3333333333333, "x": "では、永久影は、いつからあるのでしょうか。"}, {"t": 1395.8, "x": "ここに、新しい研究があります。"}, {"t": 1398.4, "x": "二〇二三年九月、アメリカの惑星科学研究所の研究者らが、"}, {"t": 1398.4, "x": "二〇二三年█"}, {"t": 1403.2666666666667, "x": "永久影の年齢について、論文を発表しました。"}, {"t": 1407.4, "x": "手がかりにしたのは、月の軸の傾きの歴史です。"}, {"t": 1410.9333333333334, "x": "月は、生まれたころ、いまより"}, {"t": 1413.3833333333334, "x": "ずっと地球の近くを回っていました。"}, {"t": 1415.5833333333333, "x": "そこから少しずつ、地球から遠ざかってきました。"}, {"t": 1419.0333333333333, "x": "その途中で、月の自転の軸の向きが、"}, {"t": 1421.8333333333333, "x": "大きく変わった時期があるとされています。"}, {"t": 1424.4666666666667, "x": "いま、月の軸はほとんど傾いていません。"}, {"t": 1427.4666666666667, "x": "けれども、昔の月は、もっと大きく傾いていた。"}, {"t": 1431.4, "x": "傾いていれば、極の近くにも、"}, {"t": 1433.8166666666666, "x": "季節ごとに日が差しこみます。"}, {"t": 1435.95, "x": "その間は、永久影は生まれません。"}, {"t": 1438.7666666666667, "x": "研究者たちは、地球と月の距離が"}, {"t": 1441.2666666666667, "x": "どう変わってきたかという最近の計算をもとに、"}, {"t": 1444.0, "x": "月の軸の向きの移り変わりをたどり、永久影の"}, {"t": 1447.8, "x": "広さがどう変わってきたかを計算しました。"}, {"t": 1450.2833333333333, "x": "結果は、こうです。"}, {"t": 1451.9333333333334, "x": "永久影と呼べる場所は、三十四億年前より"}, {"t": 1453.7333333333333, "x": "三十四億年前█"}, {"t": 1455.3333333333333, "x": "昔には、ほとんどありませんでした。"}, {"t": 1457.8, "x": "二十一億年前には、太陽の通り道の傾きがいまの"}, {"t": 1457.8, "x": "二十一億年前█"}, {"t": 1461.8166666666666, "x": "二倍ほどで、永久影の広さは、いまの半分ほどでした。"}, {"t": 1466.1666666666667, "x": "いまある永久影の大部分は、"}, {"t": 1468.1333333333334, "x": "二十二億年前より新しい時代に生まれた。"}, {"t": 1471.35, "x": "そして、永久影の年齢は、平均すると、"}, {"t": 1475.0333333333333, "x": "長くても十八億年ほど。"}, {"t": 1477.25, "x": "エルクロスが打ちこまれたカベウスの永久影は、"}, {"t": 1480.0333333333333, "x": "十億年に満たない、とされています。"}, {"t": 1482.9833333333333, "x": "月そのものの年齢は、四十五億年です。"}, {"t": 1486.15, "x": "永久影は、月の歴史の後半になってから、"}, {"t": 1489.3166666666666, "x": "少しずつ広がってきたものでした。"}, {"t": 1491.6666666666667, "x": "こうなると、二十億年という数字の"}, {"t": 1494.3166666666666, "x": "意味も、読み方が変わります。"}, {"t": 1496.3666666666666, "x": "二十億年前より前から、ずっと影だった場所は、あります。"}, {"t": 1500.7833333333333, "x": "いまの永久影の半分ほどの広さは、"}, {"t": 1503.3333333333333, "x": "その頃にはもう影でした。"}, {"t": 1505.3166666666666, "x": "NASAの言う、二十億年以上、日の光を"}, {"t": 1508.6166666666666, "x": "浴びていない場所は、この研究とも食い違いません。"}, {"t": 1511.9, "x": "けれども、それは永久影の全部ではありません。"}, {"t": 1515.2333333333333, "x": "むしろ、いまの永久影の多くは、それより新しい。"}, {"t": 1519.2833333333333, "x": "永久影は、はじめから"}, {"t": 1521.1666666666667, "x": "永久だったわけではない、ということです。"}, {"t": 1523.9, "x": "シャクルトンも、そうかもしれません。"}, {"t": 1526.3166666666666, "x": "二〇一二年の論文によれば、"}, {"t": 1528.25, "x": "シャクルトンができたのは三十億年以上前です。"}, {"t": 1531.6, "x": "けれども、その底が、生まれたときから"}, {"t": 1534.4666666666667, "x": "影だったとはかぎりません。"}, {"t": 1535.9833333333333, "x": "クレーターのほうが、その影よりも"}, {"t": 1538.2333333333333, "x": "古い、ということがありえます。"}, {"t": 1540.35, "x": "この研究は、もう一つのことを言っています。"}, {"t": 1543.4, "x": "月に水を運んだものとして、彗星や、月の"}, {"t": 1547.05, "x": "内部からの火山の噴き出しが考えられてきました。"}, {"t": 1549.95, "x": "その多くは、月の歴史のはじめのほうに"}, {"t": 1552.75, "x": "起きたとされています。"}, {"t": 1553.9833333333333, "x": "ところが、その頃にはまだ、永久影がありませんでした。"}, {"t": 1558.1666666666667, "x": "わなが、できていなかったのです。"}, {"t": 1560.4, "x": "研究所の発表は、こう結論づけています。"}, {"t": 1563.6333333333334, "x": "いま極にある氷は、もっと新しい"}, {"t": 1566.3166666666666, "x": "時代に来たものでなければならない。"}, {"t": 1568.3333333333333, "x": "月には、太古の水の氷の貯蔵庫はない。"}, {"t": 1571.5166666666667, "x": "発表はさらに、永久影のいくつかは、比較的"}, {"t": 1575.2166666666667, "x": "最近になってから氷をつかまえた、とも書いています。"}, {"t": 1578.7166666666667, "x": "ここで、第四章の数字を思い出すと、意味が重なります。"}, {"t": 1583.15, "x": "エルクロスが打ちこまれたカベウスの影は、"}, {"t": 1585.5166666666667, "x": "十億年に満たない。"}, {"t": 1587.2333333333333, "x": "その底の砂には、重さで五・"}, {"t": 1589.4333333333334, "x": "六パーセントほどの氷が含まれていた。"}, {"t": 1592.15, "x": "もしこの二つがどちらも正しければ、あの氷は、"}, {"t": 1595.4166666666667, "x": "影ができてから後の、十億年足らずのあいだに、"}, {"t": 1599.1166666666666, "x": "どこかから来て、たまったものだということになります。"}, {"t": 1602.7166666666667, "x": "月の歴史で言えば、最近の話です。"}, {"t": 1605.6666666666667, "x": "もちろん、これは一つの研究の計算です。"}, {"t": 1608.85, "x": "月の軸の向きの歴史には、"}, {"t": 1610.6166666666666, "x": "まだ分かっていないところもあります。"}, {"t": 1612.95, "x": "ただ、二十億年という数字を、永久影全体の"}, {"t": 1616.8833333333334, "x": "年齢のように受け取ることはできない、ということは、"}, {"t": 1620.1, "x": "ここではっきりさせておきます。"}, {"t": 1622.15, "x": "では、この底へ、実際に行った機体はあるのか。"}, {"t": 1625.7833333333333, "x": "ぶつけたものは、あります。"}, {"t": 1627.7166666666667, "x": "ルナ・プロスペクター、セントール、エルクロス。"}, {"t": 1631.0166666666667, "x": "けれども、降りて測り続けたものは、まだありません。"}, {"t": 1634.8166666666666, "x": "機体が南を目指す理由は、ここまでの章に出てきています。"}, {"t": 1638.8333333333333, "x": "エルクロスが水を見つけたのは南極のカベウスでした。"}, {"t": 1642.05, "x": "赤外線の観測でも、南極では、氷が"}, {"t": 1645.6333333333334, "x": "クレーターの中にかたまって見つかっています。"}, {"t": 1648.1, "x": "NASAは二〇二二年の記事で、永久影に"}, {"t": 1651.2, "x": "とらえられた物質は、太陽系の歴史について"}, {"t": 1654.  "底そのものに降りて、そこで長く"}, {"t": 1875.9333333333334, "x": "測り続けた機体は、まだ一つもありません。"}, {"t": 1878.8833333333334, "x": "シャクルトンの底には、いまも、日の光は届いていません。"}, {"t": 1882.95, "x": "一九六一年に、紙の上で予想された冷たいわな。"}, {"t": 1887.2666666666667, "x": "三十年あまりたって、電波と"}, {"t": 1889.5166666666667, "x": "中性子が、その気配をとらえました。"}, {"t": 1892.15, "x": "四十八年目に、ロケットの筒がぶつけられ、"}, {"t": 1895.2833333333333, "x": "水と、水銀と、ほかのいくつもの物質が舞い上がりました。"}, {"t": 1899.95, "x": "星の光と、レーザーと、回りこんだ"}, {"t": 1903.05, "x": "かすかな光が、底の形を写しました。"}, {"t": 1906.0333333333333, "x": "分かったのは、そこに氷がある、ということです。"}, {"t": 1909.6333333333334, "x": "分かっていないのは、それがどれだけあるのか。"}, {"t": 1912.55, "x": "どこから来たのか。"}, {"t": 1913.75, "x": "いつから、そこにあるのか。"}, {"t": 1915.7166666666667, "x": "そして、影そのものが、いつから影なのか。"}, {"t": 1919.15, "x": "二十億年という数字も、底の全部に"}, {"t": 1921.9833333333333, "x": "当てはまるわけではありませんでした。"}, {"t": 1923.95, "x": "月の軸がこのまま傾かずにいるかぎり、"}, {"t": 1926.5, "x": "底に日が差すことはありません。"}, {"t": 1928.65, "x": "だから、あの底に最初に届くのは、"}, {"t": 1931.2, "x": "たぶん太陽の光ではありません。"}, {"t": 1933.5333333333333, "x": "人間が作って、降ろした機械の、小さな明かりのほうです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
