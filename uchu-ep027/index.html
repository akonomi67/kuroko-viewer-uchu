<script>
const D={"name": "ep027", "file": "ep027", "dur": 1830.15, "segs": [], "subs": [{"t": 0.0, "x": "四つの短い動画があります。"}, {"t": 1.9666666666666666, "x": "どれも背景は黒い空です。"}, {"t": 3.9, "x": "小さな星がたくさん散らばっています。"}, {"t": 6.233333333333333, "x": "その中を一つの光の点がゆっくり動いていきます。"}, {"t": 9.516666666666667, "x": "点の大きさは、まわりの星とほとんど同じです。"}, {"t": 12.816666666666666, "x": "星と違うのは、少しずつ位置を変えていくことだけです。"}, {"t": 16.483333333333334, "x": "形は分かりません。"}, {"t": 17.883333333333333, "x": "色も模様も分かりません。"}, {"t": 19.516666666666666, "x": "撮ったのはルーシーという探査機です。"}, {"t": 21.7, "x": "時期は二〇二六年の三月の終わりから四月の初めです。"}, {"t": 25.566666666666666, "x": "ルーシーは望遠カメラを四つの小惑星に向けました。"}, {"t": 28.966666666666665, "x": "名前は、エウリュバテス、ポリュメレ、レウコス、オルス。"}, {"t": 33.7, "x": "ポリュメレの点の後ろには、銀河も写っていました。"}, {"t": 37.083333333333336, "x": "はるか遠くの銀河が、いくつかです。"}, {"t": 39.7, "x": "四つともトロヤ群と呼ばれる小惑星の群れに属しています。"}, {"t": 43.416666666666664, "x": "木星と同じ軌道を回る群れです。"}, {"t": 45.75, "x": "この四つの点は、トロヤ群の"}, {"t": 47.93333333333333, "x": "小惑星を宇宙船が撮った記録です。"}, {"t": 50.416666666666664, "x": "ただし、遠くから点で写しただけです。"}, {"t": 53.2, "x": "トロヤ群の小惑星の表面は、まだ誰も見ていません。"}, {"t": 57.083333333333336, "x": "写した写真は、一枚もないのです。"}, {"t": 59.8, "x": "人類が知っているのは、光の点の明るさと色です。"}, {"t": 63.46666666666667, "x": "そして軌道の数字です。"}, {"t": 65.08333333333333, "x": "この群れを目指して作られた"}, {"t": 66.61666666666666, "x": "探査機は、ルーシーが初めてです。"}, {"t": 69.01666666666667, "x": "最初の一つに近づくのは、二〇二七年の夏の予定です。"}, {"t": 73.33333333333333, "x": "日本時間では、八月十二日の朝になります。"}, {"t": 76.96666666666667, "x": "ここから先は、光の点のままの群れの記録です。"}, {"t": 80.45, "x": "そこへ向かう一機の記録でもあります。"}, {"t": 82.78333333333333, "x": "話は一七七二年までさかのぼります。"}, {"t": 85.98333333333333, "x": "この年、数学者のラグランジュが"}, {"t": 88.4, "x": "一本の論文で賞を受けました。"}, {"t": 90.35, "x": "イタリア生まれで、のちにフランスで活躍した人です。"}, {"t": 93.9, "x": "題は「三体問題についての試論」です。"}, {"t": 97.35, "x": "太陽と惑星のように、大きな天体が二つ回っています。"}, {"t": 101.43333333333334, "x": "そこへとても小さな天体を一つ置きます。"}, {"t": 104.16666666666667, "x": "小さな天体は、同じ並びのまま回り続けられるのか。"}, {"t": 108.08333333333333, "x": "そんな場所があるのか、という問いです。"}, {"t": 110.7, "x": "答えは五か所でした。"}, {"t": 112.13333333333334, "x": "この五つはいまラグランジュ点と呼ばれています。"}, {"t": 114.85, "x": "番号はエル1からエル5までです。"}, {"t": 117.05, "x": "そのうち三つは、二つの天体を結ぶ線の上にあります。"}, {"t": 120.98333333333333, "x": "ここに置いた物は、少しずれると離れていきます。"}, {"t": 124.33333333333333, "x": "残りの二つは、線の上にはありません。"}, {"t": 127.16666666666667, "x": "太陽と惑星を頂点にして、正三角形を描きます。"}, {"t": 131.3, "x": "その三つめの頂点が、エル4とエル5です。"}, {"t": 134.51666666666668, "x": "エル4は惑星の前を進みます。"}, {"t": 136.78333333333333, "x": "エル5は惑星の後ろを追いかけます。"}, {"t": 139.08333333333334, "x": "この二つは物がとどまりやすい場所です。"}, {"t": 141.6, "x": "ただし、条件があります。"}, {"t": 143.66666666666666, "x": "大きな二つの天体の重さの比が、"}, {"t": 145.85, "x": "二十四・九六を超えることです。"}, {"t": 148.46666666666667, "x": "NASAによると、太陽と地球はこの条件を満たしています。"}, {"t": 152.45, "x": "地球と月も同じです。"}, {"t": 154.1, "x": "ただラグランジュの論文は計算の話でした。"}, {"t": 156.93333333333334, "x": "そこに本当に天体がいるかは、分かっていませんでした。"}, {"t": 160.61666666666667, "x": "それから百三十四年がたちます。"}, {"t": 162.88333333333333, "x": "一九〇六年二月二十二日。"}, {"t": 165.4, "x": "場所は、ドイツのハイデルベルクです。"}, {"t": 167.9, "x": "天文学者のマックス・ヴォルフが、"}, {"t": 169.78333333333333, "x": "小惑星を一つ見つけました。"}, {"t": 172.1, "x": "その軌道は木星とほぼ同じ大きさでした。"}, {"t": 174.9, "x": "しかも木星の前のエル4のあたりを回っていました。"}, {"t": 178.08333333333334, "x": "名前はアキレウスと付けられました。"}, {"t": 180.15, "x": "ギリシャの古い叙事詩「イーリアス」の英雄です。"}, {"t": 183.93333333333334, "x": "トロイアの戦争を戦った人物です。"}, {"t": 186.45, "x": "これが木星のトロヤ群の最初の一つになりました。"}, {"t": 189.7, "x": "同じ年の十月十七日にも、同じハイデルベルクで"}, {"t": 193.48333333333332, "x": "見つかります。"}, {"t": 194.28333333333333, "x": "のちに六百十七番、パトロクロスと"}, {"t": 197.03333333333333, "x": "名づけられる小惑星です。"}, {"t": 198.71666666666667, "x": "こちらは木星の後ろのエル5の側を回っていました。"}, {"t": 202.01666666666668, "x": "見つかる数が増えると、名前の"}, {"t": 204.28333333333333, "x": "付け方に決まりができました。"}, {"t": 206.0, "x": "前を進むエル4の群れには、"}, {"t": 207.76666666666668, "x": "ギリシャ側の英雄の名前を付けます。"}, {"t": 210.45, "x": "後ろを追うエル5の群れには、"}, {"t": 212.06666666666666, "x": "トロイア側の英雄の名前を付けます。"}, {"t": 214.81666666666666, "x": "そこでエル4は「ギリシャの陣地」と呼ばれます。"}, {"t": 218.5, "x": "エル5は「トロイアの陣地」です。"}, {"t": 221.35, "x": "ところが決まりより先に名前が付いた天体がありました。"}, {"t": 224.68333333333334, "x": "前の群れには、トロイアの英雄ヘクトルがいます。"}, {"t": 228.0, "x": "後ろの群れには、ギリシャの英雄パトロクロスがいます。"}, {"t": 231.58333333333334, "x": "ルーシーの計画を率いるのは、アメリカの南西研究所です。"}, {"t": 235.8, "x": "研究所はこの二つを「スパイ」と書いています。"}, {"t": 239.36666666666667, "x": "敵の陣地にまぎれこんだ者、という意味です。"}, {"t": 242.56666666666666, "x": "トロヤ群という呼び名は、木星だけのものではありません。"}, {"t": 246.26666666666668, "x": "ほかの惑星のエル4とエル5にいる"}, {"t": 248.35, "x": "天体も、トロヤ群と呼ばれます。"}, {"t": 250.75, "x": "火星と同じ軌道を回るものもいます。"}, {"t": 253.16666666666666, "x": "土星の衛星の中にも、同じ並びの"}, {"t": 255.91666666666666, "x": "仲間を連れたものがあります。"}, {"t": 257.6, "x": "それでもNASAによると、"}, {"t": 258.93333333333334, "x": "そのほとんどは木星の軌道にいます。"}, {"t": 261.6166666666667, "x": "木星のトロヤ群は、いくつ見つかっているのでしょうか。"}, {"t": 265.23333333333335, "x": "NASAは二〇二六年十月の"}, {"t": 267.23333333333335, "x": "記事で、「数千」と書いています。"}, {"t": 269.9, "x": "細かい数は別の名簿で確かめられます。"}, {"t": 272.6, "x": "国際天文学連合の小惑星センターが出している一覧です。"}, {"t": 276.65, "x": "最後の更新は、二〇二六年五月三十日でした。"}, {"t": 280.81666666666666, "x": "載っている天体は、一万五千七百六十六個です。"}, {"t": 284.75, "x": "そのうち前を進むエル4の群れが九千八百二十三個。"}, {"t": 288.55, "x": "後ろを追うエル5の群れが五千九百四十二個です。"}, {"t": 291.85, "x": "前の群れのほうが、四千個ほど多い計算です。"}, {"t": 295.2, "x": "名簿の一行目はアキレウスです。"}, {"t": 297.31666666666666, "x": "二行目はパトロクロスです。"}, {"t": 299.1166666666667, "x": "名簿に並ぶのは、軌道の数字と明るさです。"}, {"t": 302.3833333333333, "x": "形や色を書く欄はありません。"}, {"t": 304.4166666666667, "x": "最初の一つから約百二十年で、名簿はここまで伸びました。"}, {"t": 308.7, "x": "それでも、これで全部ではありません。"}, {"t": 311.25, "x": "NASAの資料には、こう書かれています。"}, {"t": 313.8666666666667, "x": "トロヤ群の数は、小惑星帯の天体とほぼ同じくらいだ。"}, {"t": 318.01666666666665, "x": "名簿の一万五千あまりは、その一部ということになります。"}, {"t": 322.0, "x": "数は多くても、群れの中はすかすかです。"}, {"t": 324.9166666666667, "x": "NASAによると、小惑星どうしは"}, {"t": 327.31666666666666, "x": "平均でとても離れています。"}, {"t": 329.1333333333333, "x": "その間隔は九百六十万キロメートルを超えます。"}, {"t": 332.46666666666664, "x": "月までの距離を、二十五回並べたほどの長さです。"}, {"t": 336.1, "x": "群れの場所も、木星のすぐそばではありません。"}, {"t": 339.28333333333336, "x": "トロヤ群から木星までは、"}, {"t": 340.93333333333334, "x": "約七億八千万キロメートルあります。"}, {"t": 343.76666666666665, "x": "これは木星から太陽までとほぼ同じ距離です。"}, {"t": 346.8, "x": "名前からは、木星にまとわりつく群れを"}, {"t": 349.56666666666666, "x": "思い浮かべるかもしれません。"}, {"t": 351.2, "x": "実際には木星の前と後ろに大きく離れています。"}, {"t": 355.18333333333334, "x": "大きさにも幅があります。"}, {"t": 356.8333333333333, "x": "NASAの資料では、最も大きなもので"}, {"t": 359.46666666666664, "x": "約二百五十キロメートルです。"}, {"t": 361.4166666666667, "x": "ヘクトルは約二百二十五キロメートルです。"}, {"t": 364.1333333333333, "x": "これは、ジェット推進研究所のデータの値です。"}, {"t": 367.5833333333333, "x": "アキレウスは約百三十キロメートルです。"}, {"t": 370.28333333333336, "x": "小さなものほど数が多くなります。"}, {"t": 372.55, "x": "まだ見つかっていないものも、"}, {"t": 374.06666666666666, "x": "たくさんあると考えられています。"}, {"t": 376.4, "x": "色にも特徴があります。"}, {"t": 378.03333333333336, "x": "トロヤ群に多いのは、暗くて赤っぽい天体です。"}, {"t": 381.51666666666665, "x": "天文学ではこうした型をDタイプやPタイプと呼びます。"}, {"t": 385.1333333333333, "x": "赤い色のもとは何か。"}, {"t": 386.75, "x": "炭素をふくむ有機物ではないかと考えられています。"}, {"t": 390.01666666666665, "x": "一方で色のかたよりが少ないCタイプもあります。"}, {"t": 393.1333333333333, "x": "小惑星帯にはよくある型です。"}, {"t": 395.4, "x": "けれどもトロヤ群では少数です。"}, {"t": 397.55, "x": "なぜこうした群れがここにいるのでしょうか。"}, {"t": 399.96666666666664, "x": "NASAによると、最初の考えは単純でした。"}, {"t": 403.18333333333334, "x": "木星ができた場所で、一緒にできた天体だという考えです。"}, {"t": 407.35, "x": "ところが、研究が進みました。"}, {"t": 409.8, "x": "若いころの太陽系のことが分かってきたのです。"}, {"t": 412.78333333333336, "x": "トロヤ群の中身も、思ったよりばらばらでした。"}, {"t": 415.93333333333334, "x": "そこで見方が変わりました。"}, {"t": 417.71666666666664, "x": "太陽系が若かったころ、大きく乱れた時期がありました。"}, {"t": 421.6666666666667, "x": "土星や天王星や海王星の重力で、"}, {"t": 424.3333333333333, "x": "天体がかき回されたのです。"}, {"t": 426.46666666666664, "x": "そのとき天体が散らばりました。"}, {"t": 428.46666666666664, "x": "その一部が、木星のエル4と"}, {"t": 430.81666666666666, "x": "エル5に捕まったのかもしれない。"}, {"t": 432.6666666666667, "x": "いまはそう考えられています。"}, {"t": 434.55, "x": "もしそうなら、トロヤ群は寄せ集めです。"}, {"t": 437.4166666666667, "x": "太陽系の外側の、あちこちの材料が"}, {"t": 440.46666666666664, "x": "並んでいることになります。"}, {"t": 441.98333333333335, "x": "NASAはトロヤ群を「タイムカプセル」と書いています。"}, {"t": 445.78333333333336, "x": "四十億年以上前の、太陽系の始まりを残した入れ物です。"}, {"t": 450.4166666666667, "x": "ただそのカプセルの外側を近くで見た人はいません。"}, {"t": 453.6166666666667, "x": "一九七四年、エチオピアで一つの化石が見つかりました。"}, {"t": 458.25, "x": "人類の祖先の骨です。"}, {"t": 459.98333333333335, "x": "見つけた研究者たちは、この化石を「ルーシー」と"}, {"t": 464.05, "x": "呼びました。"}, {"t": 464.73333333333335, "x": "その一人が古人類学者のドナルド・ジョハンソンです。"}, {"t": 467.8666666666667, "x": "この化石は人類の進化の考え方を"}, {"t": 470.43333333333334, "x": "大きく変えたとされています。"}, {"t": 472.01666666666665, "x": "それから四十年後の二〇一四年。"}, {"t": 474.4, "x": "南西研究所のハロルド・レヴィソンたちが動き出しました。"}, {"t": 477.8, "x": "新しい探査の検討を始めたのです。"}, {"t": 480.35, "x": "目的地は木星のトロヤ群です。"}, {"t": 482.6333333333333, "x": "計画の名前は、あの化石から取られました。"}, {"t": 485.76666666666665, "x": "化石は人類の成り立ちを教えてくれました。"}, {"t": 488.56666666666666, "x": "同じようにトロヤ群は惑星の成り立ちを"}, {"t": 491.1333333333333, "x": "教えてくれるかもしれない。"}, {"t": 492.6666666666667, "x": "そういう願いをこめた名前です。"}, {"t": 494.73333333333335, "x": "NASAの資料には、こんな一文もあります。"}, {"t": 497.68333333333334, "x": "ルーシーという名前は、何かの頭文字ではない。"}, {"t": 501.0, "x": "計画はNASAのディスカバリー計画に選ばれました。"}, {"t": 504.1, "x": "ルーシーはその十三番目の計画です。"}, {"t": 506.6333333333333, "x": "トーマス・ツアブーケンは、"}, {"t": 508.0, "x": "NASAの科学部門を率いた人です。"}, {"t": 510.51666666666665, "x": "打ち上げの日に、こう話しています。"}, {"t": 513.0833333333334, "x": "ルーシーは二〇一七年に自分が最初に認めた計画だった。"}, {"t": 516.9166666666666, "x": "ルーシーは小惑星のまわりを回る探査機ではありません。"}, {"t": 520.3333333333334, "x": "小惑星のそばを、速い速度で通り過ぎます。"}, {"t": 523.7, "x": "これをフライバイと呼びます。"}, {"t": 525.3833333333333, "x": "NASAはその理由を燃料だと説明しています。"}, {"t": 528.3333333333334, "x": "小惑星のまわりを回るには、ブレーキが要ります。"}, {"t": 531.7833333333333, "x": "そのための燃料がたくさん要るのです。"}, {"t": 534.1333333333333, "x": "いくつもの小惑星で同じことをするなら、もっと要ります。"}, {"t": 538.0, "x": "そこでルーシーは、止まらずに通り過ぎる道を選びました。"}, {"t": 541.8666666666667, "x": "一つの小惑星を近くで見られる"}, {"t": 544.0166666666667, "x": "時間は、とても短くなります。"}, {"t": 546.35, "x": "役目は最初の偵察です。"}, {"t": 548.2666666666667, "x": "形と色を調べます。"}, {"t": 549.8666666666667, "x": "表面の温度も測ります。"}, {"t": 551.6333333333333, "x": "重さは電波のわずかなずれから計算します。"}, {"t": 554.4333333333333, "x": "観測装置は三つです。"}, {"t": 556.1333333333333, "x": "一つめは白黒で細かく撮る望遠カメラ、エル・ローリです。"}, {"t": 560.15, "x": "二つめはエル・ラルフ。"}, {"t": 561.5166666666667, "x": "色を撮るカメラと、表面の成分を"}, {"t": 564.1166666666667, "x": "調べる装置が一つになっています。"}, {"t": 566.2666666666667, "x": "三つめはエル・テス。"}, {"t": 567.5833333333334, "x": "表面の温度を遠くから測ります。"}, {"t": 569.8166666666667, "x": "ほかに追尾用のカメラも積んでいます。"}, {"t": 572.2, "x": "小惑星を見失わないためのカメラです。"}, {"t": 574.9333333333333, "x": "二〇二一年十月十六日。"}, {"t": 577.4333333333333, "x": "アメリカ東部時間の、午前五時三十四分でした。"}, {"t": 581.1166666666667, "x": "ルーシーはフロリダ州のケープカナベラルから"}, {"t": 583.6166666666667, "x": "打ち上げられました。"}, {"t": 584.7, "x": "ロケットはアトラス・ファイブです。"}, {"t": 586.4666666666667, "x": "打ち上げまでの準備は、世界的な"}, {"t": 588.9, "x": "感染症の流行と重なりました。"}, {"t": 591.15, "x": "それでも、ルーシーは打ち上げ"}, {"t": 593.1666666666666, "x": "期間の初日に飛び立ちました。"}, {"t": 595.05, "x": "約一時間後、ルーシーはロケットから離れました。"}, {"t": 598.55, "x": "午前六時四十分には、最初の電波が地球に届きました。"}, {"t": 602.8166666666667, "x": "ルーシーは時速約十万八千キロメートルで遠ざかりました。"}, {"t": 606.6, "x": "主な任務はほぼ十二年の予定です。"}, {"t": 609.05, "x": "その間に太陽のまわりを大きく三周半します。"}, {"t": 612.25, "x": "飛ぶ距離は約六十億キロメートルです。"}, {"t": 614.85, "x": "打ち上げの日、レヴィソンは"}, {"t": 616.7666666666667, "x": "トロヤ群をこう言い表しました。"}, {"t": 618.7833333333333, "x": "まるで空のダイヤモンドのようだ。"}, {"t": 620.7833333333333, "x": "ルーシーは太陽の光で電気を作る探査機です。"}, {"t": 623.9166666666666, "x": "木星のあたりでは、太陽の光がとても弱くなります。"}, {"t": 627.8166666666667, "x": "太陽からの距離は、地球の五倍以上です。"}, {"t": 630.9666666666667, "x": "それでも足りる電気を作るため、"}, {"t": 632.9333333333333, "x": "大きな太陽電池を付けています。"}, {"t": 635.4166666666666, "x": "丸い板が二枚です。"}, {"t": 636.8833333333333, "x": "一枚の直径は約七メートルです。"}, {"t": 639.35, "x": "両方を広げると、端から端まで約十六メートルになります。"}, {"t": 643.6666666666666, "x": "NASAによると、ルーシーは記録を作ります。"}, {"t": 646.7333333333333, "x": "太陽電池で動く探査機の記録です。"}, {"t": 649.2333333333333, "x": "これまでで最も太陽から遠くで働くことになります。"}, {"t": 652.6666666666666, "x": "この丸い板は、折りたたんだ形で打ち上げられました。"}, {"t": 656.2833333333333, "x": "扇子のように開く作りです。"}, {"t": 658.25, "x": "宇宙に出たら、ひもを巻き取って広げます。"}, {"t": 661.1166666666667, "x": "最後に留め金でかちりと固定します。"}, {"t": 663.5666666666667, "x": "打ち上げから約一時間半後、二枚の板は広がりました。"}, {"t": 667.6333333333333, "x": "そして電池の充電を始めました。"}, {"t": 669.9, "x": "ここまでは計画どおりに見えました。"}, {"t": 672.1666666666666, "x": "ところが届いたデータは違うことを示していました。"}, {"t": 675.2, "x": "片方の板が最後まで開いていなかったのです。"}, {"t": 678.1166666666667, "x": "留め金もかかっていませんでした。"}, {"t": 680.1333333333333, "x": "NASAの記事は、そのときの様子を書いています。"}, {"t": 683.2333333333333, "x": "フロリダの会議室に、技術者たちが集まりました。"}, {"t": 686.6833333333333, "x": "一人は紙の皿を折ったり広げたりしていたそうです。"}, {"t": 689.8333333333334, "x": "ルーシーの板と同じ動きを、手で確かめていたのです。"}, {"t": 693.4166666666666, "x": "電話の向こうにも人がいました。"}, {"t": 695.45, "x": "探査機を作った、ロッキード・マーティンの人たちです。"}, {"t": 698.8833333333333, "x": "太陽電池を作ったノースロップ・グラマンの"}, {"t": 701.3666666666667, "x": "人たちも加わりました。"}, {"t": 702.8666666666667, "x": "さいわい、探査機のほかの部分は元気でした。"}, {"t": 706.05, "x": "計画の責任者レヴィソンは、"}, {"t": 707.8666666666667, "x": "時間はあった、と振り返っています。"}, {"t": 710.6333333333333, "x": "まず何が起きたのかを知る必要がありました。"}, {"t": 713.4, "x": "けれども宇宙の板を近くで見ることはできません。"}, {"t": 716.35, "x": "そこで技術者たちは、小さな噴射装置をふかしました。"}, {"t": 720.1833333333333, "x": "その力で板がどう揺れるかを測ったのです。"}, {"t": 722.9666666666667, "x": "揺れ方を計算の模型と比べました。"}, {"t": 725.4333333333333, "x": "すると板がどれくらいしっかりしているかが分かりました。"}, {"t": 728.5833333333334, "x": "たどりついた原因は、ひもでした。"}, {"t": 731.1, "x": "板を引いて広げるひもが、糸巻きの"}, {"t": 733.75, "x": "上でからまったらしいのです。"}, {"t": 735.3166666666667, "x": "選べる道は二つありました。"}, {"t": 737.25, "x": "一つはこのまま使う道です。"}, {"t": 739.2166666666667, "x": "板はほぼ開いていました。"}, {"t": 740.9333333333333, "x": "予定の九十パーセントを超える電気を作れていたのです。"}, {"t": 744.45, "x": "もう一つはひもをもっと強く引く道です。"}, {"t": 747.0166666666667, "x": "板にはひもを巻く動力が二つありました。"}, {"t": 749.6666666666666, "x": "ふだん使う一つと、予備の一つです。"}, {"t": 752.3833333333333, "x": "二つを同時に動かすことは、"}, {"t": 754.2, "x": "もともと考えられていませんでした。"}, {"t": 756.7, "x": "チームは地上に同じ仕組みの複製を作りました。"}, {"t": 759.9, "x": "そして限界をこえるまで試しました。"}, {"t": 762.2833333333333, "x": "宇宙での動きをまねる計算の仕組みも作りました。"}, {"t": 765.45, "x": "何か月も試したあと、二つめの道が選ばれました。"}, {"t": 769.1666666666666, "x": "二〇二二年の五月と六月です。"}, {"t": 771.65, "x": "七回にわたって、二つの動力を同時に動かしました。"}, {"t": 775.55, "x": "ひもは巻き取られ、板はさらに開きました。"}, {"t": 778.5333333333333, "x": "完全に開いた状態を、三百六十度とします。"}, {"t": 782.2, "x": "板は三百五十三度から三百五十七度まで"}, {"t": 785.2333333333333, "x": "開いたと見積もられました。"}, {"t": 786.7833333333333, "x": "留め金はかからないままでした。"}, {"t": 788.75, "x": "それでもひもは強く張られました。"}, {"t": 790.85, "x": "板は任務に使えるほどしっかりしたのです。"}, {"t": 793.5, "x": "ルーシーは閉じきらない扇を"}, {"t": 795.1833333333333, "x": "つけたまま進むことになりました。"}, {"t": 797.1666666666666, "x": "ルーシーはすぐに木星へ向かったわけではありません。"}, {"t": 800.15, "x": "まず地球のそばへ戻ってきました。"}, {"t": 802.3333333333334, "x": "惑星のそばを通ると、その重力で"}, {"t": 805.0, "x": "探査機の速さや向きが変わります。"}, {"t": 807.0666666666667, "x": "これをスイングバイと呼びます。"}, {"t": 808.8833333333333, "x": "一回目は二〇二二年十月十六日でした。"}, {"t": 812.1333333333333, "x": "打ち上げから、ちょうど一年後です。"}, {"t": 814.6333333333333, "x": "ルーシーは地表から約三百五十キロメートルの"}, {"t": 817.5333333333333, "x": "高さを通りました。"}, {"t": 818.7833333333333, "x": "大気をかすめるほどの低さです。"}, {"t": 820.8166666666667, "x": "この一回目で、ルーシーは新しい軌道に乗りました。"}, {"t": 824.45, "x": "太陽のまわりを、二年で一周する軌道です。"}, {"t": 827.7333333333333, "x": "二年後にもう一度地球へ戻るためです。"}, {"t": 830.3166666666667, "x": "二回目は二〇二四年十二月十二日でした。"}, {"t": 833.5833333333334, "x": "このときも、ルーシーは地球のすぐそばを通りました。"}, {"t": 837.1, "x": "これでルーシーは小惑星帯を横切る力を得ました。"}, {"t": 840.4666666666667, "x": "その先のトロヤ群へ向かう力でもあります。"}, {"t": 843.2833333333333, "x": "NASAの資料には、意外な一文があります。"}, {"t": 846.2666666666667, "x": "ルーシーが木星に一番近づくのは、"}, {"t": 848.6, "x": "トロヤ群にいるときではない。"}, {"t": 850.6, "x": "地球でスイングバイをするときのほうが、"}, {"t": 852.8666666666667, "x": "木星に近いというのです。"}, {"t": 854.95, "x": "トロヤ群がそれだけ木星から離れているからです。"}, {"t": 857.9833333333333, "x": "ルーシーの道のりは、ほかにも変わっています。"}, {"t": 860.9666666666667, "x": "ふだん飛ぶ速さは、"}, {"t": 862.0666666666667, "x": "平均で時速約六万二千キロメートルです。"}, {"t": 865.3333333333334, "x": "小惑星のそばでは、もっと遅くなります。"}, {"t": 868.3666666666667, "x": "小惑星とすれ違う速さは、ならすと"}, {"t": 871.1333333333333, "x": "時速約二万四千キロメートルです。"}, {"t": 873.5, "x": "木星の軌道の少し外まで出て、"}, {"t": 875.6833333333333, "x": "また地球のそばへ戻ってきます。"}, {"t": 878.0, "x": "そして三回目のスイングバイで、"}, {"t": 879.9333333333333, "x": "もう一度外へ出ていきます。"}, {"t": 881.95, "x": "こうした飛び方をする探査機は、ルーシーが初めてです。"}, {"t": 885.5833333333334, "x": "NASAはそう書いています。"}, {"t": 887.1166666666667, "x": "軌道を図に描くと、太陽のまわりに"}, {"t": 889.75, "x": "大きな輪が三つ半重なります。"}, {"t": 891.7166666666667, "x": "その輪の上に、目的の小惑星が順に並んでいます。"}, {"t": 895.5833333333334, "x": "ルーシーの目的地は、トロヤ群だけではありません。"}, {"t": 898.9, "x": "途中の小惑星帯にも、立ち寄り先があります。"}, {"t": 902.3333333333334, "x": "その一つが二〇二三年の初めに加わりました。"}, {"t": 905.7, "x": "小惑星帯の内側を回る、とても小さな小惑星です。"}, {"t": 909.9833333333333, "x": "見つかったのは一九九九年です。"}, {"t": 912.7, "x": "のちに番号は付きましたが、名前はありませんでした。"}, {"t": 916.3, "x": "小惑星帯の何百万もの小さな小惑星と同じです。"}, {"t": 920.1333333333333, "x": "ルーシーのチームが目的地に選び、名前を出しました。"}, {"t": 923.85, "x": "名前はディンキネシュ。"}, {"t": 925.2166666666667, "x": "エチオピアの言葉、アムハラ語です。"}, {"t": 927.8166666666667, "x": "意味は「あなたはすばらしい」。"}, {"t": 929.95, "x": "化石のルーシーは、エチオピアでは"}, {"t": 932.3666666666667, "x": "この名前で呼ばれています。"}, {"t": 933.9666666666667, "x": "化石は見つかった国でいまも保管されています。"}, {"t": 936.8333333333334, "x": "あまりに小さな小惑星です。"}, {"t": 938.9, "x": "チームには、「ディンキー」と呼ぶ人もいたそうです。"}, {"t": 942.4166666666666, "x": "ディンキネシュに寄る目的は、本番前の試しでした。"}, {"t": 945.9833333333333, "x": "特に確かめたかったのは、追尾の仕組みです。"}, {"t": 949.1, "x": "探査機は、速い速度で近づきます。"}, {"t": 951.8166666666667, "x": "そのとき、相手までの正しい距離はなかなか分かりません。"}, {"t": 955.6333333333333, "x": "外れないように、いそうな場所を広く撮る方法があります。"}, {"t": 959.4833333333333, "x": "ただその方法では多くの写真に暗い空しか写りません。"}, {"t": 963.1, "x": "ルーシーには、小惑星を自分で"}, {"t": 965.5166666666667, "x": "追いかける仕組みがあります。"}, {"t": 967.05, "x": "カメラの真ん中に、とらえ続けるのです。"}, {"t": 969.8666666666667, "x": "けれどもこの仕組みは新しいものでした。"}, {"t": 972.3, "x": "宇宙ではまだ使ったことがありません。"}, {"t": 974.5333333333333, "x": "そこでトロヤ群の何年も前に試すことにしたのです。"}, {"t": 977.8166666666667, "x": "近づく数週間前、チームは気になることに気づきました。"}, {"t": 981.7666666666667, "x": "ディンキネシュの明るさの変わり方が、"}, {"t": 983.8333333333334, "x": "おかしかったのです。"}, {"t": 985.3333333333334, "x": "月を連れているのではないか、と考える人もいました。"}, {"t": 989.0, "x": "ただ確かなことは近くの画像が"}, {"t": 990.95, "x": "届くまで分かりませんでした。"}, {"t": 992.6666666666666, "x": "二〇二三年十一月一日。"}, {"t": 995.1333333333333, "x": "ルーシーはディンキネシュのそばを通りました。"}, {"t": 997.6, "x": "約四百三十キロメートルまで近づきました。"}, {"t": 1000.6333333333333, "x": "速さは秒速約四・五キロメートルです。"}, {"t": 1003.45, "x": "地球からは約四億八千万キロメートル離れた場所でした。"}, {"t": 1007.25, "x": "届いた画像には、小さな天体がもう一つ写っていました。"}, {"t": 1011.1833333333333, "x": "やはり月がいたのです。"}, {"t": 1012.6833333333333, "x": "追尾の仕組みも、うまく働きました。"}, {"t": 1015.3333333333334, "x": "高速ですれ違うあいだ、小惑星を"}, {"t": 1018.0333333333333, "x": "視野にとらえ続けたのです。"}, {"t": 1019.6666666666666, "x": "しかももっと驚くことがありました。"}, {"t": 1021.8166666666667, "x": "最接近から約六分後の画像です。"}, {"t": 1024.3333333333333, "x": "その月は二つの丸い塊がくっついた形をしていました。"}, {"t": 1028.05, "x": "最接近の画像では、二つの塊が前後に重なっていました。"}, {"t": 1032.4, "x": "そのため一つに見えていたのです。"}, {"t": 1034.4833333333333, "x": "二つの天体が触れ合って一つになったものを、"}, {"t": 1037.1166666666666, "x": "接触二重天体と呼びます。"}, {"t": 1039.4166666666667, "x": "小惑星のまわりを回る接触二重天体は、"}, {"t": 1042.4166666666667, "x": "これが初めての発見でした。"}, {"t": 1044.5666666666666, "x": "月の名前は二〇二三年十一月二十七日に決まりました。"}, {"t": 1048.8833333333334, "x": "セラム。"}, {"t": 1049.9833333333333, "x": "アムハラ語で「平和」を意味する、あいさつの言葉です。"}, {"t": 1054.3166666666666, "x": "セラムは別の化石の名前でもあります。"}, {"t": 1056.9, "x": "二〇〇〇年にエチオピアで見つかった、"}, {"t": 1058.95, "x": "三歳の女の子の骨です。"}, {"t": 1061.15, "x": "ルーシーと同じ種類の人類です。"}, {"t": 1063.35, "x": "「ルーシーの赤ちゃん」と呼ばれることもあります。"}, {"t": 1066.3333333333333, "x": "ただ実際にはルーシーより十万年以上前に生きていました。"}, {"t": 1070.0833333333333, "x": "ディンキネシュは、いちばん長いところで"}, {"t": 1072.4666666666667, "x": "約七百九十メートルです。"}, {"t": 1074.3666666666666, "x": "セラムの大きさは、二〇二四年の論文に書かれています。"}, {"t": 1078.3833333333334, "x": "塊は二つとも、二百メートル台です。"}, {"t": 1081.4166666666667, "x": "直径は約二百十メートルと約二百三十メートル。"}, {"t": 1084.9166666666667, "x": "セラムは、ディンキネシュのまわりを回っています。"}, {"t": 1087.9333333333334, "x": "距離は、約三・一キロメートルです。"}, {"t": 1090.7666666666667, "x": "一周にかかるのは、約五十二・七時間です。"}, {"t": 1094.2, "x": "ディンキネシュ本体にも、変わった地形がありました。"}, {"t": 1097.4333333333334, "x": "表面に長い溝が走っていたのです。"}, {"t": 1099.9, "x": "NASAによると、それはずれた跡です。"}, {"t": 1102.5166666666667, "x": "小惑星の約四分の一の塊が、あるとき急に動いたのです。"}, {"t": 1107.1833333333334, "x": "太陽の光で温まった表面は、熱を出します。"}, {"t": 1110.85, "x": "その熱のわずかな力で、小惑星は"}, {"t": 1113.6666666666667, "x": "少しずつ速く回るようになります。"}, {"t": 1115.8166666666666, "x": "何百万年もかかる変化です。"}, {"t": 1117.9333333333334, "x": "回転が速くなると、外へ引っぱる力がたまります。"}, {"t": 1121.6, "x": "その力が限界をこえたとき、"}, {"t": 1123.6333333333334, "x": "一部がずれたと考えられています。"}, {"t": 1126.1333333333334, "x": "そのとき飛び散ったかけらが、赤道の盛り上がりになった。"}, {"t": 1129.8, "x": "そしてセラムの材料にもなったのではないか。"}, {"t": 1132.5, "x": "論文はそう考えています。"}, {"t": 1134.4, "x": "プロジェクト科学者のキース・ノルは、"}, {"t": 1136.3666666666666, "x": "地震にたとえています。"}, {"t": 1138.0833333333333, "x": "ゆっくり力がたまり、一気に"}, {"t": 1140.2333333333333, "x": "はじけたのだろうという話です。"}, {"t": 1142.1333333333334, "x": "直径一キロメートルにも満たない天体です。"}, {"t": 1144.9333333333334, "x": "そこに、これだけの出来事が残っていました。"}, {"t": 1148.0333333333333, "x": "一回目は、試しのつもりでした。"}, {"t": 1150.4833333333333, "x": "その一回目で、ルーシーは誰も"}, {"t": 1152.7666666666667, "x": "知らなかった月を見つけたのです。"}, {"t": 1154.7333333333333, "x": "二つめの小惑星を訪ねたのは、"}, {"t": 1156.9, "x": "二〇二五年四月二十日でした。"}, {"t": 1159.4, "x": "名前はドナルドジョハンソン。"}, {"t": 1161.0833333333333, "x": "化石のルーシーを見つけた、"}, {"t": 1162.7, "x": "ドナルド・ジョハンソンの名前です。"}, {"t": 1164.8833333333334, "x": "小惑星帯のまんなかあたりを回っています。"}, {"t": 1167.6666666666667, "x": "大昔の衝突で生まれた、かけらの一つです。"}, {"t": 1171.0333333333333, "x": "NASAによると、約一億五千万年前のことです。"}, {"t": 1174.7, "x": "この訪問はトロヤ群の前の通し稽古でした。"}, {"t": 1177.6833333333334, "x": "本番と同じ手順で、すべての装置を試すのです。"}, {"t": 1181.35, "x": "地上の観測では、この小惑星の"}, {"t": 1184.0333333333333, "x": "明るさは大きく変わっていました。"}, {"t": 1186.0, "x": "十日ほどの間に、明るくなったり暗くなったりするのです。"}, {"t": 1189.95, "x": "細長い形かもしれない、とチームは予想していました。"}, {"t": 1193.75, "x": "ルーシーは約九百六十キロメートル先を通りました。"}, {"t": 1197.2666666666667, "x": "速さは秒速約十三・四キロメートルです。"}, {"t": 1200.3833333333334, "x": "地球からは約二億二千三百万キロメートル。"}, {"t": 1203.4833333333333, "x": "電波が届くまで、約十二分かかる場所です。"}, {"t": 1206.7333333333333, "x": "届いた画像で、予想の一部は当たりました。"}, {"t": 1209.8333333333333, "x": "ドナルドジョハンソンも、二つの"}, {"t": 1211.9, "x": "塊がつながった天体でした。"}, {"t": 1213.8666666666666, "x": "ただチームを驚かせたものもあります。"}, {"t": 1216.2166666666667, "x": "二つの塊をつなぐ、細い首の形です。"}, {"t": 1219.5666666666666, "x": "NASAは、その形をこう書いています。"}, {"t": 1222.2, "x": "アイスクリームのコーンを、二つ重ねたような形。"}, {"t": 1225.7, "x": "大きさも思っていたより大きいものでした。"}, {"t": 1228.2166666666667, "x": "最初の分析では、長さ約八キロメートルです。"}, {"t": 1231.7166666666667, "x": "いちばん太いところで、幅約三・五キロメートル。"}, {"t": 1235.2333333333333, "x": "望遠カメラの視野に、全体が"}, {"t": 1237.5333333333333, "x": "入りきらない画像もありました。"}, {"t": 1239.4, "x": "レヴィソンは、地形のことを話しています。"}, {"t": 1242.2333333333333, "x": "この小惑星の地形は、おどろくほど複雑だ。"}, {"t": 1245.6, "x": "これでルーシーが近くで見た天体は三つになりました。"}, {"t": 1248.85, "x": "ディンキネシュとセラム、そして"}, {"t": 1250.7666666666667, "x": "ドナルドジョハンソンです。"}, {"t": 1252.1666666666667, "x": "三つとも小惑星帯の天体です。"}, {"t": 1254.55, "x": "トロヤ群の小惑星は、まだ一つもありません。"}, {"t": 1257.85, "x": "ドナルドジョハンソンを過ぎて、"}, {"t": 1259.5333333333333, "x": "ルーシーは外へ進みました。"}, {"t": 1261.6833333333334, "x": "そして二〇二六年の春に、序章の四つの点を撮りました。"}, {"t": 1266.0166666666667, "x": "エウリュバテス、ポリュメレ、レウコス、オルス。"}, {"t": 1269.8166666666666, "x": "ルーシーは、この四つのそばを順に通る予定です。"}, {"t": 1273.2666666666667, "x": "期間は、二〇二七年八月から二〇二八年十一月までです。"}, {"t": 1278.35, "x": "撮ったとき、相手までは何億キロメートルもありました。"}, {"t": 1282.0166666666667, "x": "だから画像の中では針で刺したような点です。"}, {"t": 1284.9, "x": "それでもこの撮影には意味がありました。"}, {"t": 1287.4, "x": "地球の望遠鏡は、トロヤ群を"}, {"t": 1289.8166666666666, "x": "ほぼ太陽と同じ方角から見ます。"}, {"t": 1292.05, "x": "そのため小惑星はいつも満月のように照らされて見えます。"}, {"t": 1295.75, "x": "ところがルーシーは近くを通るとき、"}, {"t": 1297.9333333333334, "x": "横から見ることになります。"}, {"t": 1299.9333333333334, "x": "表面の一部は、影になります。"}, {"t": 1302.4333333333334, "x": "暗すぎず白くとびすぎない写真を撮る必要があります。"}, {"t": 1305.8166666666666, "x": "そのためには、カメラの設定を"}, {"t": 1308.0166666666667, "x": "前もって決めておかなければなりません。"}, {"t": 1310.2333333333333, "x": "そこで本番に近い光の当たり方で、"}, {"t": 1312.6666666666667, "x": "四つの点を撮っておいたのです。"}, {"t": 1314.9166666666667, "x": "画像を地球へ送り、処理を終えたのは"}, {"t": 1317.6333333333334, "x": "二〇二六年七月でした。"}, {"t": 1319.65, "x": "オルスだけは、撮った時間が短めでした。"}, {"t": 1322.5166666666667, "x": "そのため、点の動きが小さく見えます。"}, {"t": 1325.3833333333334, "x": "チームは、近づく前にもう一度オルスを撮る予定です。"}, {"t": 1328.9833333333333, "x": "点の画像なら、ほかにもあります。"}, {"t": 1331.45, "x": "エウリュバテスには、小さな月がいます。"}, {"t": 1334.2166666666667, "x": "見つけたのは、地球を回るハッブル宇宙望遠鏡でした。"}, {"t": 1338.05, "x": "月を探すには、まず探す範囲を決めます。"}, {"t": 1341.15, "x": "その天体の重力が、まわりより強く働く範囲です。"}, {"t": 1345.0333333333333, "x": "地球の場合その範囲の半径は約百五十万キロメートルです。"}, {"t": 1349.05, "x": "月はその内側の約三十八万キロメートルを回っています。"}, {"t": 1352.95, "x": "チームは目的の小惑星ごとにこの範囲を計算しました。"}, {"t": 1356.6666666666667, "x": "そして二〇一八年の秋、ハッブルで月を探し始めました。"}, {"t": 1360.9166666666667, "x": "二〇二〇年一月三日の画像です。"}, {"t": 1363.5166666666667, "x": "エウリュバテスのすぐそばに、"}, {"t": 1365.1, "x": "かすかな点が写っていました。"}, {"t": 1367.2, "x": "前の年の十二月十一日の画像には、その点が見えません。"}, {"t": 1371.6166666666666, "x": "月がエウリュバテスに近すぎて、光にまぎれていたのです。"}, {"t": 1375.5, "x": "チームは二〇二〇年一月九日に発表しました。"}, {"t": 1378.9833333333333, "x": "訪ねる小惑星は、七つではなく八つになる。"}, {"t": 1382.3666666666666, "x": "月はケタと名づけられました。"}, {"t": 1384.1833333333334, "x": "メキシコの陸上選手、エンリケタ・バシリオに"}, {"t": 1387.3333333333333, "x": "ちなむ名前です。"}, {"t": 1388.3666666666666, "x": "一九六八年のメキシコ・オリンピックに出場しました。"}, {"t": 1392.3833333333334, "x": "女性として初めて、開会式で聖火台に火をともした人です。"}, {"t": 1396.75, "x": "大きさは約一キロメートルとみられています。"}, {"t": 1399.4833333333333, "x": "打ち上げの前に月を見つけておくことには、わけが"}, {"t": 1402.85, "x": "あります。"}, {"t": 1403.35, "x": "一つのはずの小惑星が、二つに見えたとします。"}, {"t": 1406.8833333333334, "x": "すると、追尾の仕組みが迷うかもしれません。"}, {"t": 1409.9833333333333, "x": "前もって知っていれば、その心配はなくなります。"}, {"t": 1413.2666666666667, "x": "月の軌道を調べて、観測の計画も立てられます。"}, {"t": 1416.9666666666667, "x": "二〇二二年三月には、ポリュメレにも月が見つかりました。"}, {"t": 1421.0666666666666, "x": "正式な名前はまだありません。"}, {"t": 1423.0333333333333, "x": "チームは「ショーン」というあだ名で呼んでいます。"}, {"t": 1426.3333333333333, "x": "こうした月の画像も、どれも点です。"}, {"t": 1429.0166666666667, "x": "南西研究所のページには、目的の"}, {"t": 1431.7666666666667, "x": "小惑星の想像図が載っています。"}, {"t": 1433.95, "x": "そこには断り書きが添えられています。"}, {"t": 1436.3666666666666, "x": "ルーシーがそこへ着くまで、本当の姿は分からない。"}, {"t": 1439.9, "x": "二〇二六年十月二十八日、NASAは"}, {"t": 1443.2, "x": "一つの区切りを発表しました。"}, {"t": 1445.1, "x": "打ち上げから五年がたちました。"}, {"t": 1447.0166666666667, "x": "ルーシーが飛んだ距離は、三十五億キロメートルを"}, {"t": 1450.2333333333333, "x": "超えました。"}, {"t": 1450.9166666666667, "x": "そして、木星のトロヤ群の領域に入りました。"}, {"t": 1454.4333333333334, "x": "そこへ入った宇宙船は、ルーシーが初めてです。"}, {"t": 1457.8166666666666, "x": "宇宙にはっきりした境目があるわけではありません。"}, {"t": 1460.7666666666667, "x": "チームは、ルーシーの電波で位置を確かめています。"}, {"t": 1464.1166666666666, "x": "まわりの星の画像も使います。"}, {"t": 1466.2333333333333, "x": "それで木星の前のエル4に近づいていると分かるのです。"}, {"t": 1469.7666666666667, "x": "ここでは太陽の光はとても弱くなっています。"}, {"t": 1472.75, "x": "それでも、探査機と装置は予定どおり働いています。"}, {"t": 1476.4, "x": "NASAはそう伝えています。"}, {"t": 1478.0166666666667, "x": "ここから先は、まだ起きていません。"}, {"t": 1480.5166666666667, "x": "すべて予定として並べます。"}, {"t": 1482.3666666666666, "x": "最初の目的地は、エウリュバテスです。"}, {"t": 1485.2166666666667, "x": "最接近は協定世界時で二〇二七年八月十一日の"}, {"t": 1489.4333333333334, "x": "二十時十六分。"}, {"t": 1490.6, "x": "日本時間では、八月十二日の午前五時十六分です。"}, {"t": 1494.8666666666666, "x": "アメリカの発表では、八月十一日になっています。"}, {"t": 1498.7, "x": "ルーシーは、エウリュバテスの"}, {"t": 1500.5833333333333, "x": "千キロメートル以内を通る計画です。"}, {"t": 1503.0166666666667, "x": "速さは秒速約五・八キロメートル。"}, {"t": 1505.7333333333333, "x": "そのとき地球からは約八億四千百万キロメートル"}, {"t": 1509.1666666666667, "x": "離れています。"}, {"t": 1510.0666666666666, "x": "電波が地球に届くまで、約四十七分かかります。"}, {"t": 1513.85, "x": "NASAによると、近くで調べられる"}, {"t": 1516.2166666666667, "x": "時間は数時間しかありません。"}, {"t": 1518.0833333333333, "x": "チームはその数時間に向けて計画の仕上げをしています。"}, {"t": 1521.5666666666666, "x": "四つの小惑星のそばを通る速さも、NASAが書いています。"}, {"t": 1525.6333333333334, "x": "最大で、時速約二万六千キロメートルです。"}, {"t": 1529.1166666666666, "x": "最接近の距離は、約四百八十キロから"}, {"t": 1532.25, "x": "約九百七十キロとされています。"}, {"t": 1534.5, "x": "通り過ぎながら、目に見える光と赤外線で写真を撮ります。"}, {"t": 1538.7166666666667, "x": "エウリュバテスの直径は、約六十四キロメートルです。"}, {"t": 1542.4666666666667, "x": "トロヤ群では少ない、Cタイプの小惑星です。"}, {"t": 1545.9, "x": "しかも大きな衝突でできた一家の一員です。"}, {"t": 1548.8166666666666, "x": "トロヤ群で知られている衝突の一家は、これ一つだけです。"}, {"t": 1552.7666666666667, "x": "南西研究所はそう書いています。"}, {"t": 1554.9666666666667, "x": "なぜただ一つの一家がCタイプなのか。"}, {"t": 1557.4, "x": "赤いDタイプは、ぶつかると粉々になるのか。"}, {"t": 1560.65, "x": "それともぶつかると色が変わるのか。"}, {"t": 1562.85, "x": "エウリュバテスの表面には、"}, {"t": 1564.4333333333334, "x": "小惑星の内側が出ているかもしれません。"}, {"t": 1567.4833333333333, "x": "チームはそこをのぞけると考えています。"}, {"t": 1569.95, "x": "二つめはポリュメレです。"}, {"t": 1571.5, "x": "最接近は協定世界時で二〇二七年九月十五日の予定です。"}, {"t": 1576.0833333333333, "x": "直径は約二十一キロメートル。"}, {"t": 1578.3166666666666, "x": "ルーシーが訪ねるトロヤ群の"}, {"t": 1579.95, "x": "中で、いちばん小さな天体です。"}, {"t": 1582.5, "x": "色は暗く赤っぽいPタイプです。"}, {"t": 1584.75, "x": "この型の小惑星のそばを宇宙船が"}, {"t": 1587.1, "x": "通るのは、初めてになります。"}, {"t": 1589.2666666666667, "x": "三つめはレウコスです。"}, {"t": 1590.7666666666667, "x": "二〇二八年四月十八日の予定です。"}, {"t": 1593.7666666666667, "x": "直径は約四十キロメートルで、Dタイプです。"}, {"t": 1597.1833333333334, "x": "この小惑星は、とてもゆっくり回っています。"}, {"t": 1600.4166666666667, "x": "一日の長さは、四百四十六時間です。"}, {"t": 1603.7833333333333, "x": "昼が長く夜も長い天体です。"}, {"t": 1606.0166666666667, "x": "そのぶん昼はより熱く、夜はより冷たくなりそうです。"}, {"t": 1609.8666666666666, "x": "明るさの変わり方からは、細長い形が予想されています。"}, {"t": 1614.0, "x": "四つめはオルスです。"}, {"t": 1615.35, "x": "二〇二八年十一月十一日の予定です。"}, {"t": 1618.6833333333334, "x": "直径は約五十一キロメートルで、やはりDタイプです。"}, {"t": 1622.5666666666666, "x": "エウリュバテスとは、大きさがほぼ同じで色が違います。"}, {"t": 1626.2333333333333, "x": "二つを比べることができるのです。"}, {"t": 1628.4, "x": "ルーシーの道は、よく考えて選ばれました。"}, {"t": 1631.45, "x": "大きさも色もさまざまな小惑星を通るように、です。"}, {"t": 1635.2, "x": "小さいものは約一キロメートル、"}, {"t": 1637.2, "x": "大きいものは百キロメートルを超えます。"}, {"t": 1639.9333333333334, "x": "オルスを過ぎると、ルーシーは"}, {"t": 1642.0166666666667, "x": "いったん地球のそばへ戻ります。"}, {"t": 1643.8666666666666, "x": "二〇三〇年に、三回目で最後のスイングバイをします。"}, {"t": 1647.8333333333333, "x": "その間に木星とトロヤ群は太陽のまわりを進みます。"}, {"t": 1651.5, "x": "再び外へ出たルーシーは、今度は"}, {"t": 1654.0, "x": "木星の後ろの群れへ入ります。"}, {"t": 1656.0166666666667, "x": "エル5、トロイアの陣地です。"}, {"t": 1658.2333333333333, "x": "最後の目的地は、パトロクロスとメノイティオスです。"}, {"t": 1661.7166666666667, "x": "大きさのよく似た二つの小惑星が、"}, {"t": 1664.05, "x": "たがいのまわりを回っています。"}, {"t": 1666.15, "x": "直径の平均は、パトロクロスが約百十三キロメートル。"}, {"t": 1670.2, "x": "メノイティオスが約百四キロメートルです。"}, {"t": 1672.8166666666666, "x": "どちらもPタイプです。"}, {"t": 1674.35, "x": "NASAは、メノイティオスを"}, {"t": 1676.0666666666666, "x": "ほとんど双子のような相手と書いています。"}, {"t": 1678.4166666666667, "x": "この二つは太陽系のとても古い"}, {"t": 1680.5333333333333, "x": "時代の生き残りかもしれません。"}, {"t": 1682.4333333333334, "x": "二つの軌道は、惑星が並ぶ面から約二十二度傾いています。"}, {"t": 1686.9666666666667, "x": "そのためふだんは面の上か下にいます。"}, {"t": 1689.3833333333334, "x": "探査機がたどりつくのは、とても難しい場所です。"}, {"t": 1692.7833333333333, "x": "ちょうどルーシーが行ける場所を"}, {"t": 1694.3166666666666, "x": "通るときに、出会える計算でした。"}, {"t": 1696.7666666666667, "x": "最接近はアメリカ東部時間で"}, {"t": 1698.7166666666667, "x": "二〇三三年三月三日の予定です。"}, {"t": 1701.4333333333334, "x": "一機で合わせて十一の天体のそばを通ります。"}, {"t": 1704.5, "x": "これほど多くの行き先を持つ計画は、ほかにありません。"}, {"t": 1708.25, "x": "計画の中心にいる南西研究所が、そう紹介しています。"}, {"t": 1712.4666666666667, "x": "二〇三三年に主な任務を終えても、"}, {"t": 1715.1, "x": "ルーシーは止まりません。"}, {"t": 1716.7833333333333, "x": "地球の軌道の近くからトロヤ群まで、"}, {"t": 1719.1666666666667, "x": "安定した道を行き来し続けます。"}, {"t": 1721.65, "x": "チームはその道を選ぶときに一つの条件を置きました。"}, {"t": 1725.1333333333334, "x": "十万年以上、ルーシーが地球にぶつからないことです。"}, {"t": 1728.85, "x": "南西研究所によると、この道は何十万年も続きます。"}, {"t": 1733.0666666666666, "x": "もしかすると、何百万年かもしれません。"}, {"t": 1736.1333333333334, "x": "だからルーシーには一枚の板が付いています。"}, {"t": 1738.8666666666666, "x": "昔、遠くへ向かう探査機がありました。"}, {"t": 1741.7833333333333, "x": "その探査機は、宇宙人にあてた板を積んでいました。"}, {"t": 1745.3, "x": "ルーシーの板は、宇宙人あてではありません。"}, {"t": 1748.2833333333333, "x": "あて先は遠い未来の人類です。"}, {"t": 1750.5166666666667, "x": "いつか子孫が、ルーシーを拾いに来るかもしれない。"}, {"t": 1753.8833333333334, "x": "宇宙を探り始めたころの、古い道具としてです。"}, {"t": 1757.3333333333333, "x": "チームはそう考えて板を積みました。"}, {"t": 1759.7166666666667, "x": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
