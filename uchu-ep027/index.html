<script>
const D={"name": "ep027", "file": "ep027", "dur": 1826.05, "segs": [], "subs": [{"t": 0.0, "x": "四つの短い動画があります。"}, {"t": 1.9666666666666666, "x": "どれも背景は黒い空です。"}, {"t": 3.9, "x": "小さな星がたくさん散らばっています。"}, {"t": 6.233333333333333, "x": "その中を一つの光の点がゆっくり動いていきます。"}, {"t": 9.516666666666667, "x": "点の大きさは、まわりの星とほとんど同じです。"}, {"t": 12.816666666666666, "x": "星と違うのは、少しずつ位置を変えていくことだけです。"}, {"t": 16.483333333333334, "x": "形は分かりません。"}, {"t": 17.883333333333333, "x": "色も模様も分かりません。"}, {"t": 19.516666666666666, "x": "撮ったのはルーシーという探査機です。"}, {"t": 21.7, "x": "時期は二〇二六年の三月の終わりから四月の初めです。"}, {"t": 25.566666666666666, "x": "ルーシーは望遠カメラを四つの小惑星に向けました。"}, {"t": 28.966666666666665, "x": "名前は、エウリュバテス、ポリュメレ、レウコス、オルス。"}, {"t": 33.7, "x": "ポリュメレの点の後ろには、銀河も写っていました。"}, {"t": 37.083333333333336, "x": "はるか遠くの銀河が、いくつかです。"}, {"t": 39.7, "x": "四つともトロヤ群と呼ばれる小惑星の群れに属しています。"}, {"t": 43.416666666666664, "x": "木星と同じ軌道を回る群れです。"}, {"t": 45.75, "x": "この四つの点は、トロヤ群の"}, {"t": 47.93333333333333, "x": "小惑星を宇宙船が撮った記録です。"}, {"t": 50.416666666666664, "x": "ただし近くから撮ったものではありません。"}, {"t": 52.766666666666666, "x": "トロヤ群の小惑星の表面は、まだ誰も見ていません。"}, {"t": 56.65, "x": "写した写真は、一枚もないのです。"}, {"t": 59.36666666666667, "x": "人類が知っているのは、光の点の明るさと色です。"}, {"t": 63.03333333333333, "x": "そして軌道の数字です。"}, {"t": 64.65, "x": "この群れを目指して作られた"}, {"t": 66.18333333333334, "x": "探査機は、ルーシーが初めてです。"}, {"t": 68.58333333333333, "x": "最初の一つに近づくのは、二〇二七年の夏の予定です。"}, {"t": 72.9, "x": "日本時間では、八月十二日の朝になります。"}, {"t": 76.53333333333333, "x": "ここから先は、光の点のままの群れの記録です。"}, {"t": 80.01666666666667, "x": "そこへ向かう一機の記録でもあります。"}, {"t": 82.35, "x": "話は一七七二年までさかのぼります。"}, {"t": 85.55, "x": "この年、数学者のラグランジュが"}, {"t": 87.96666666666667, "x": "一本の論文で賞を受けました。"}, {"t": 89.91666666666667, "x": "イタリア生まれで、のちにフランスで活躍した人です。"}, {"t": 93.46666666666667, "x": "題は「三体問題についての試論」です。"}, {"t": 96.91666666666667, "x": "太陽と惑星のように、大きな天体が二つ回っています。"}, {"t": 101.0, "x": "そこへとても小さな天体を一つ置きます。"}, {"t": 103.73333333333333, "x": "小さな天体は、同じ並びのまま回り続けられるのか。"}, {"t": 107.65, "x": "そんな場所があるのか、という問いです。"}, {"t": 110.26666666666667, "x": "答えは五か所でした。"}, {"t": 111.7, "x": "この五つはいまラグランジュ点と呼ばれています。"}, {"t": 114.41666666666667, "x": "番号はエル1からエル5までです。"}, {"t": 116.61666666666666, "x": "そのうち三つは、二つの天体を結ぶ線の上にあります。"}, {"t": 120.55, "x": "ここに置いた物は、少しずれると離れていきます。"}, {"t": 123.9, "x": "残りの二つは、線の上にはありません。"}, {"t": 126.73333333333333, "x": "太陽と惑星を頂点にして、正三角形を描きます。"}, {"t": 130.86666666666667, "x": "その三つめの頂点が、エル4とエル5です。"}, {"t": 134.08333333333334, "x": "エル4は惑星の前を進みます。"}, {"t": 136.35, "x": "エル5は惑星の後ろを追いかけます。"}, {"t": 138.65, "x": "この二つは物がとどまりやすい場所です。"}, {"t": 141.16666666666666, "x": "ただし、条件があります。"}, {"t": 143.23333333333332, "x": "大きな二つの天体の重さの比が、"}, {"t": 145.41666666666666, "x": "二十四・九六を超えることです。"}, {"t": 148.03333333333333, "x": "NASAによると、太陽と地球はこの条件を満たしています。"}, {"t": 152.01666666666668, "x": "地球と月も同じです。"}, {"t": 153.66666666666666, "x": "ただラグランジュの論文は計算の話でした。"}, {"t": 156.5, "x": "そこに本当に天体がいるかは、分かっていませんでした。"}, {"t": 160.18333333333334, "x": "それから百三十四年がたちます。"}, {"t": 162.45, "x": "一九〇六年二月二十二日。"}, {"t": 164.96666666666667, "x": "場所は、ドイツのハイデルベルクです。"}, {"t": 167.46666666666667, "x": "天文学者のマックス・ヴォルフが、"}, {"t": 169.35, "x": "小惑星を一つ見つけました。"}, {"t": 171.66666666666666, "x": "その軌道は木星とほぼ同じ大きさでした。"}, {"t": 174.46666666666667, "x": "しかも木星の前のエル4のあたりを回っていました。"}, {"t": 177.65, "x": "名前はアキレウスと付けられました。"}, {"t": 179.71666666666667, "x": "ギリシャの古い叙事詩「イーリアス」の英雄です。"}, {"t": 183.5, "x": "トロイアの戦争を戦った人物です。"}, {"t": 186.01666666666668, "x": "これが木星のトロヤ群の最初の一つになりました。"}, {"t": 189.26666666666668, "x": "同じ年の十月十七日にも、同じハイデルベルクで"}, {"t": 193.05, "x": "見つかります。"}, {"t": 193.85, "x": "のちに六百十七番、パトロクロスと"}, {"t": 196.6, "x": "名づけられる小惑星です。"}, {"t": 198.28333333333333, "x": "こちらは木星の後ろのエル5の側を回っていました。"}, {"t": 201.58333333333334, "x": "見つかる数が増えると、名前の"}, {"t": 203.85, "x": "付け方に決まりができました。"}, {"t": 205.56666666666666, "x": "前を進むエル4の群れには、"}, {"t": 207.33333333333334, "x": "ギリシャ側の英雄の名前を付けます。"}, {"t": 210.01666666666668, "x": "後ろを追うエル5の群れには、"}, {"t": 211.63333333333333, "x": "トロイア側の英雄の名前を付けます。"}, {"t": 214.38333333333333, "x": "そこでエル4は「ギリシャの陣地」と呼ばれます。"}, {"t": 218.06666666666666, "x": "エル5は「トロイアの陣地」です。"}, {"t": 220.91666666666666, "x": "ところが決まりより先に名前が付いた天体がありました。"}, {"t": 224.25, "x": "前の群れには、トロイアの英雄ヘクトルがいます。"}, {"t": 227.56666666666666, "x": "後ろの群れには、ギリシャの英雄パトロクロスがいます。"}, {"t": 231.15, "x": "ルーシーの計画を率いるのは、アメリカの南西研究所です。"}, {"t": 235.36666666666667, "x": "研究所はこの二つを「スパイ」と書いています。"}, {"t": 238.93333333333334, "x": "敵の陣地にまぎれこんだ者、という意味です。"}, {"t": 242.13333333333333, "x": "トロヤ群という呼び名は、木星だけのものではありません。"}, {"t": 245.83333333333334, "x": "ほかの惑星のエル4とエル5にいる"}, {"t": 247.91666666666666, "x": "天体も、トロヤ群と呼ばれます。"}, {"t": 250.31666666666666, "x": "火星と同じ軌道を回るものもいます。"}, {"t": 252.73333333333332, "x": "土星の衛星の中にも、同じ並びの"}, {"t": 255.48333333333332, "x": "仲間を連れたものがあります。"}, {"t": 257.1666666666667, "x": "それでもNASAによると、"}, {"t": 258.5, "x": "そのほとんどは木星の軌道にいます。"}, {"t": 261.18333333333334, "x": "木星のトロヤ群は、いくつ見つかっているのでしょうか。"}, {"t": 264.8, "x": "NASAは二〇二六年十月の"}, {"t": 266.8, "x": "記事で、「数千」と書いています。"}, {"t": 269.46666666666664, "x": "細かい数は別の名簿で確かめられます。"}, {"t": 272.1666666666667, "x": "国際天文学連合の小惑星センターが出している一覧です。"}, {"t": 276.21666666666664, "x": "最後の更新は、二〇二六年五月三十日でした。"}, {"t": 280.3833333333333, "x": "載っている天体は、一万五千七百六十六個です。"}, {"t": 284.31666666666666, "x": "そのうち前を進むエル4の群れが九千八百二十三個。"}, {"t": 288.1166666666667, "x": "後ろを追うエル5の群れが五千九百四十二個です。"}, {"t": 291.4166666666667, "x": "前の群れのほうが、四千個ほど多い計算です。"}, {"t": 294.76666666666665, "x": "名簿の一行目はアキレウスです。"}, {"t": 296.8833333333333, "x": "二行目はパトロクロスです。"}, {"t": 298.68333333333334, "x": "名簿に並ぶのは、軌道の数字と明るさです。"}, {"t": 301.95, "x": "形や色を書く欄はありません。"}, {"t": 303.98333333333335, "x": "最初の一つから約百二十年で、名簿はここまで伸びました。"}, {"t": 308.26666666666665, "x": "それでも、これで全部ではありません。"}, {"t": 310.81666666666666, "x": "NASAの資料には、こう書かれています。"}, {"t": 313.43333333333334, "x": "トロヤ群の数は、小惑星帯の天体とほぼ同じくらいだ。"}, {"t": 317.5833333333333, "x": "名簿の一万五千あまりは、その一部ということになります。"}, {"t": 321.56666666666666, "x": "数は多くても、群れの中はすかすかです。"}, {"t": 324.48333333333335, "x": "NASAによると、小惑星どうしは"}, {"t": 326.8833333333333, "x": "平均でとても離れています。"}, {"t": 328.7, "x": "その間隔は九百六十万キロメートルを超えます。"}, {"t": 332.03333333333336, "x": "地球と月の距離の、二十五倍ほどです。"}, {"t": 335.06666666666666, "x": "群れの場所も、木星のすぐそばではありません。"}, {"t": 338.25, "x": "トロヤ群から木星までは、"}, {"t": 339.9, "x": "約七億八千万キロメートルあります。"}, {"t": 342.73333333333335, "x": "これは木星から太陽までとほぼ同じ距離です。"}, {"t": 345.76666666666665, "x": "名前からは、木星にまとわりつく群れを"}, {"t": 348.53333333333336, "x": "思い浮かべるかもしれません。"}, {"t": 350.1666666666667, "x": "実際には木星の前と後ろに大きく離れています。"}, {"t": 354.15, "x": "大きさにも幅があります。"}, {"t": 355.8, "x": "NASAの資料では、最も大きなもので"}, {"t": 358.43333333333334, "x": "約二百五十キロメートルです。"}, {"t": 360.3833333333333, "x": "ヘクトルは約二百二十五キロメートルです。"}, {"t": 363.1, "x": "これは、ジェット推進研究所のデータの値です。"}, {"t": 366.55, "x": "アキレウスは約百三十キロメートルです。"}, {"t": 369.25, "x": "小さなものほど数が多くなります。"}, {"t": 371.51666666666665, "x": "まだ見つかっていないものも、"}, {"t": 373.03333333333336, "x": "たくさんあると考えられています。"}, {"t": 375.3666666666667, "x": "色にも特徴があります。"}, {"t": 377.0, "x": "トロヤ群に多いのは、暗くて赤っぽい天体です。"}, {"t": 380.48333333333335, "x": "天文学ではこうした型をDタイプやPタイプと呼びます。"}, {"t": 384.1, "x": "赤い色のもとは何か。"}, {"t": 385.71666666666664, "x": "炭素をふくむ有機物ではないかと考えられています。"}, {"t": 388.98333333333335, "x": "一方で色のかたよりが少ないCタイプもあります。"}, {"t": 392.1, "x": "小惑星帯にはよくある型です。"}, {"t": 394.3666666666667, "x": "けれどもトロヤ群では少数です。"}, {"t": 396.51666666666665, "x": "なぜこうした群れがここにいるのでしょうか。"}, {"t": 398.93333333333334, "x": "NASAによると、最初の考えは単純でした。"}, {"t": 402.15, "x": "木星ができた場所で、一緒にできた天体だという考えです。"}, {"t": 406.31666666666666, "x": "ところが、研究が進みました。"}, {"t": 408.76666666666665, "x": "若いころの太陽系のことが分かってきたのです。"}, {"t": 411.75, "x": "トロヤ群の中身も、思ったよりばらばらでした。"}, {"t": 414.9, "x": "そこで見方が変わりました。"}, {"t": 416.68333333333334, "x": "太陽系が若かったころ、大きく乱れた時期がありました。"}, {"t": 420.6333333333333, "x": "土星や天王星や海王星の重力で、"}, {"t": 423.3, "x": "天体がかき回されたのです。"}, {"t": 425.43333333333334, "x": "そのとき天体が散らばりました。"}, {"t": 427.43333333333334, "x": "その一部が、木星のエル4と"}, {"t": 429.78333333333336, "x": "エル5に捕まったのかもしれない。"}, {"t": 431.6333333333333, "x": "いまはそう考えられています。"}, {"t": 433.51666666666665, "x": "もしそうなら、トロヤ群は寄せ集めです。"}, {"t": 436.3833333333333, "x": "太陽系の外側の、あちこちの材料が"}, {"t": 439.43333333333334, "x": "並んでいることになります。"}, {"t": 440.95, "x": "NASAはトロヤ群を「タイムカプセル」と書いています。"}, {"t": 444.75, "x": "四十億年以上前の、太陽系の始まりを残した入れ物です。"}, {"t": 449.3833333333333, "x": "ただそのカプセルの外側を近くで見た人はいません。"}, {"t": 452.5833333333333, "x": "一九七四年、エチオピアで一つの化石が見つかりました。"}, {"t": 457.21666666666664, "x": "人類の祖先の骨です。"}, {"t": 458.95, "x": "見つけた研究者たちは、この化石を「ルーシー」と"}, {"t": 463.01666666666665, "x": "呼びました。"}, {"t": 463.7, "x": "その一人が古人類学者のドナルド・ジョハンソンです。"}, {"t": 466.8333333333333, "x": "この化石は人類の進化の考え方を"}, {"t": 469.4, "x": "大きく変えたとされています。"}, {"t": 470.98333333333335, "x": "それから四十年後の二〇一四年。"}, {"t": 473.3666666666667, "x": "南西研究所のハロルド・レヴィソンたちが動き出しました。"}, {"t": 476.76666666666665, "x": "新しい探査の検討を始めたのです。"}, {"t": 479.31666666666666, "x": "目的地は木星のトロヤ群です。"}, {"t": 481.6, "x": "計画の名前は、あの化石から取られました。"}, {"t": 484.73333333333335, "x": "化石は人類の成り立ちを教えてくれました。"}, {"t": 487.53333333333336, "x": "同じようにトロヤ群は惑星の成り立ちを"}, {"t": 490.1, "x": "教えてくれるかもしれない。"}, {"t": 491.6333333333333, "x": "そういう願いをこめた名前です。"}, {"t": 493.7, "x": "NASAの資料には、こんな一文もあります。"}, {"t": 496.65, "x": "ルーシーという名前は、何かの頭文字ではない。"}, {"t": 499.96666666666664, "x": "計画はNASAのディスカバリー計画に選ばれました。"}, {"t": 503.06666666666666, "x": "ルーシーはその十三番目の計画です。"}, {"t": 505.6, "x": "トーマス・ツアブーケンは、"}, {"t": 506.96666666666664, "x": "NASAの科学部門を率いた人です。"}, {"t": 509.48333333333335, "x": "打ち上げの日に、こう話しています。"}, {"t": 512.05, "x": "ルーシーは二〇一七年に自分が最初に認めた計画だった。"}, {"t": 515.8833333333333, "x": "ルーシーは小惑星のまわりを回る探査機ではありません。"}, {"t": 519.3, "x": "小惑星のそばを、速い速度で通り過ぎます。"}, {"t": 522.6666666666666, "x": "これをフライバイと呼びます。"}, {"t": 524.35, "x": "NASAはその理由を燃料だと説明しています。"}, {"t": 527.3, "x": "小惑星のまわりを回るには、ブレーキが要ります。"}, {"t": 530.75, "x": "そのための燃料がたくさん要るのです。"}, {"t": 533.1, "x": "いくつもの小惑星で同じことをするなら、もっと要ります。"}, {"t": 536.9666666666667, "x": "そこでルーシーは、止まらずに通り過ぎる道を選びました。"}, {"t": 540.8333333333334, "x": "一つの小惑星を近くで見られる"}, {"t": 542.9833333333333, "x": "時間は、とても短くなります。"}, {"t": 545.3166666666667, "x": "役目は最初の偵察です。"}, {"t": 547.2333333333333, "x": "形と色を調べます。"}, {"t": 548.8333333333334, "x": "表面の温度も測ります。"}, {"t": 550.6, "x": "重さは電波のわずかなずれから計算します。"}, {"t": 553.4, "x": "観測装置は三つです。"}, {"t": 555.1, "x": "一つめは白黒で細かく撮る望遠カメラ、エル・ローリです。"}, {"t": 559.1166666666667, "x": "二つめはエル・ラルフ。"}, {"t": 560.4833333333333, "x": "色を撮るカメラと、表面の成分を"}, {"t": 563.0833333333334, "x": "調べる装置が一つになっています。"}, {"t": 565.2333333333333, "x": "三つめはエル・テス。"}, {"t": 566.55, "x": "表面の温度を遠くから測ります。"}, {"t": 568.7833333333333, "x": "ほかに追尾用のカメラも積んでいます。"}, {"t": 571.1666666666666, "x": "小惑星を見失わないためのカメラです。"}, {"t": 573.9, "x": "二〇二一年十月十六日。"}, {"t": 576.4, "x": "アメリカ東部時間の、午前五時三十四分でした。"}, {"t": 580.0833333333334, "x": "ルーシーはフロリダ州のケープカナベラルから"}, {"t": 582.5833333333334, "x": "打ち上げられました。"}, {"t": 583.6666666666666, "x": "ロケットはアトラス・ファイブです。"}, {"t": 585.4333333333333, "x": "打ち上げまでの準備は、世界的な"}, {"t": 587.8666666666667, "x": "感染症の流行と重なりました。"}, {"t": 590.1166666666667, "x": "それでも、ルーシーは打ち上げ"}, {"t": 592.1333333333333, "x": "期間の初日に飛び立ちました。"}, {"t": 594.0166666666667, "x": "約一時間後、ルーシーはロケットから離れました。"}, {"t": 597.5166666666667, "x": "午前六時四十分には、最初の電波が地球に届きました。"}, {"t": 601.7833333333333, "x": "そのときの速さは、時速約十万八千キロメートルでした。"}, {"t": 605.9, "x": "主な任務はほぼ十二年の予定です。"}, {"t": 608.35, "x": "その間に太陽のまわりを大きく三周半します。"}, {"t": 611.55, "x": "飛ぶ距離は約六十億キロメートルです。"}, {"t": 614.15, "x": "打ち上げの日、レヴィソンは"}, {"t": 616.0666666666667, "x": "トロヤ群をこう言い表しました。"}, {"t": 618.0833333333334, "x": "まるで空のダイヤモンドのようだ。"}, {"t": 620.0833333333334, "x": "ルーシーは太陽の光で電気を作る探査機です。"}, {"t": 623.2166666666667, "x": "木星のあたりでは、太陽の光がとても弱くなります。"}, {"t": 627.1166666666667, "x": "太陽からの距離は、地球の五倍以上です。"}, {"t": 630.2666666666667, "x": "それでも足りる電気を作るため、"}, {"t": 632.2333333333333, "x": "大きな太陽電池を付けています。"}, {"t": 634.7166666666667, "x": "丸い板が二枚です。"}, {"t": 636.1833333333333, "x": "一枚の直径は約七メートルです。"}, {"t": 638.65, "x": "両方を広げると、端から端まで約十六メートルになります。"}, {"t": 642.9666666666667, "x": "NASAによると、ルーシーは記録を作ります。"}, {"t": 646.0333333333333, "x": "太陽電池で動く探査機の記録です。"}, {"t": 648.5333333333333, "x": "これまでで最も太陽から遠くで働くことになります。"}, {"t": 651.9666666666667, "x": "この丸い板は、折りたたんだ形で打ち上げられました。"}, {"t": 655.5833333333334, "x": "扇子のように開く作りです。"}, {"t": 657.55, "x": "宇宙に出たら、ひもを巻き取って広げます。"}, {"t": 660.4166666666666, "x": "最後に留め金でかちりと固定します。"}, {"t": 662.8666666666667, "x": "打ち上げから約一時間半後、二枚の板は広がりました。"}, {"t": 666.9333333333333, "x": "そして電池の充電を始めました。"}, {"t": 669.2, "x": "ここまでは計画どおりに見えました。"}, {"t": 671.4666666666667, "x": "ところが届いたデータは違うことを示していました。"}, {"t": 674.5, "x": "片方の板が最後まで開いていなかったのです。"}, {"t": 677.4166666666666, "x": "留め金もかかっていませんでした。"}, {"t": 679.4333333333333, "x": "NASAの記事は、そのときの様子を書いています。"}, {"t": 682.5333333333333, "x": "フロリダの会議室に、技術者たちが集まりました。"}, {"t": 685.9833333333333, "x": "一人は紙の皿を折ったり広げたりしていたそうです。"}, {"t": 689.1333333333333, "x": "ルーシーの板と同じ動きを、手で確かめていたのです。"}, {"t": 692.7166666666667, "x": "電話の向こうにも人がいました。"}, {"t": 694.75, "x": "探査機を作った、ロッキード・マーティンの人たちです。"}, {"t": 698.1833333333333, "x": "太陽電池を作ったノースロップ・グラマンの"}, {"t": 700.6666666666666, "x": "人たちも加わりました。"}, {"t": 702.1666666666666, "x": "さいわい、探査機のほかの部分は元気でした。"}, {"t": 705.35, "x": "計画の責任者レヴィソンは、"}, {"t": 707.1666666666666, "x": "時間はあった、と振り返っています。"}, {"t": 709.9333333333333, "x": "まず何が起きたのかを知る必要がありました。"}, {"t": 712.7, "x": "けれども宇宙の板を近くで見ることはできません。"}, {"t": 715.65, "x": "そこで技術者たちは、小さな噴射装置をふかしました。"}, {"t": 719.4833333333333, "x": "その力で板がどう揺れるかを測ったのです。"}, {"t": 722.2666666666667, "x": "揺れ方を計算の模型と比べました。"}, {"t": 724.7333333333333, "x": "すると板がどれくらいしっかりしているかが分かりました。"}, {"t": 727.8833333333333, "x": "たどりついた原因は、ひもでした。"}, {"t": 730.4, "x": "板を引いて広げるひもが、糸巻きの"}, {"t": 733.05, "x": "上でからまったらしいのです。"}, {"t": 734.6166666666667, "x": "選べる道は二つありました。"}, {"t": 736.55, "x": "一つはこのまま使う道です。"}, {"t": 738.5166666666667, "x": "板はほぼ開いていました。"}, {"t": 740.2333333333333, "x": "予定の九十パーセントを超える電気を作れていたのです。"}, {"t": 743.75, "x": "もう一つはひもをもっと強く引く道です。"}, {"t": 746.3166666666667, "x": "板にはひもを巻く動力が二つありました。"}, {"t": 748.9666666666667, "x": "ふだん使う一つと、予備の一つです。"}, {"t": 751.6833333333333, "x": "二つを同時に動かすことは、"}, {"t": 753.5, "x": "もともと考えられていませんでした。"}, {"t": 756.0, "x": "チームは地上に同じ仕組みの複製を作りました。"}, {"t": 759.2, "x": "そして限界をこえるまで試しました。"}, {"t": 761.5833333333334, "x": "宇宙での動きをまねる計算の仕組みも作りました。"}, {"t": 764.75, "x": "何か月も試したあと、二つめの道が選ばれました。"}, {"t": 768.4666666666667, "x": "二〇二二年の五月と六月です。"}, {"t": 770.95, "x": "七回にわたって、二つの動力を同時に動かしました。"}, {"t": 774.85, "x": "ひもは巻き取られ、板はさらに開きました。"}, {"t": 777.8333333333334, "x": "完全に開いた状態を、三百六十度とします。"}, {"t": 781.5, "x": "板は三百五十三度から三百五十七度まで"}, {"t": 784.5333333333333, "x": "開いたと見積もられました。"}, {"t": 786.0833333333334, "x": "留め金はかからないままでした。"}, {"t": 788.05, "x": "それでもひもは強く張られました。"}, {"t": 790.15, "x": "板は任務に使えるほどしっかりしたのです。"}, {"t": 792.8, "x": "ルーシーは閉じきらない扇を"}, {"t": 794.4833333333333, "x": "つけたまま進むことになりました。"}, {"t": 796.4666666666667, "x": "ルーシーはすぐに木星へ向かったわけではありません。"}, {"t": 799.45, "x": "まず地球のそばへ戻ってきました。"}, {"t": 801.6333333333333, "x": "惑星のそばを通ると、その重力で"}, {"t": 804.3, "x": "探査機の速さや向きが変わります。"}, {"t": 806.3666666666667, "x": "これをスイングバイと呼びます。"}, {"t": 808.1833333333333, "x": "一回目は二〇二二年十月十六日でした。"}, {"t": 811.4333333333333, "x": "打ち上げから、ちょうど一年後です。"}, {"t": 813.9333333333333, "x": "ルーシーは地表から約三百五十キロメートルの"}, {"t": 816.8333333333334, "x": "高さを通りました。"}, {"t": 818.0833333333334, "x": "大気をかすめるほどの低さです。"}, {"t": 820.1166666666667, "x": "この一回目で、ルーシーは新しい軌道に乗りました。"}, {"t": 823.75, "x": "太陽のまわりを、二年で一周する軌道です。"}, {"t": 827.0333333333333, "x": "二年後にもう一度地球へ戻るためです。"}, {"t": 829.6166666666667, "x": "二回目は二〇二四年十二月十二日でした。"}, {"t": 832.8833333333333, "x": "このときも、ルーシーは地球のすぐそばを通りました。"}, {"t": 836.4, "x": "これでルーシーは小惑星帯を横切る力を得ました。"}, {"t": 839.7666666666667, "x": "その先のトロヤ群へ向かう力でもあります。"}, {"t": 842.5833333333334, "x": "NASAの資料には、意外な一文があります。"}, {"t": 845.5666666666667, "x": "ルーシーが木星に一番近づくのは、"}, {"t": 847.9, "x": "トロヤ群にいるときではない。"}, {"t": 849.9, "x": "地球でスイングバイをするときのほうが、"}, {"t": 852.1666666666666, "x": "木星に近いというのです。"}, {"t": 854.25, "x": "トロヤ群がそれだけ木星から離れているからです。"}, {"t": 857.2833333333333, "x": "ルーシーの道のりは、ほかにも変わっています。"}, {"t": 860.2666666666667, "x": "ふだん飛ぶ速さは、"}, {"t": 861.3666666666667, "x": "平均で時速約六万二千キロメートルです。"}, {"t": 864.6333333333333, "x": "小惑星のそばでは、もっと遅くなります。"}, {"t": 867.6666666666666, "x": "平均で、時速約二万四千キロメートルです。"}, {"t": 871.1166666666667, "x": "木星の軌道の少し外まで出て、"}, {"t": 873.3, "x": "また地球のそばへ戻ってきます。"}, {"t": 875.6166666666667, "x": "そして三回目のスイングバイで、"}, {"t": 877.55, "x": "もう一度外へ出ていきます。"}, {"t": 879.5666666666667, "x": "こうした飛び方をする探査機は、ルーシーが初めてです。"}, {"t": 883.2, "x": "NASAはそう書いています。"}, {"t": 884.7333333333333, "x": "軌道を図に描くと、太陽のまわりに"}, {"t": 887.3666666666667, "x": "大きな輪が三つ半重なります。"}, {"t": 889.3333333333334, "x": "その輪の上に、目的の小惑星が順に並んでいます。"}, {"t": 893.2, "x": "ルーシーの目的地は、トロヤ群だけではありません。"}, {"t": 896.5166666666667, "x": "途中の小惑星帯にも、立ち寄り先があります。"}, {"t": 899.95, "x": "その一つが二〇二三年の初めに加わりました。"}, {"t": 903.3166666666667, "x": "小惑星帯の内側を回る、とても小さな小惑星です。"}, {"t": 907.6, "x": "見つかったのは一九九九年です。"}, {"t": 910.3166666666667, "x": "のちに番号は付きましたが、名前はありませんでした。"}, {"t": 913.9166666666666, "x": "小惑星帯の何百万もの小さな小惑星と同じです。"}, {"t": 917.75, "x": "ルーシーのチームが目的地に選び、名前を出しました。"}, {"t": 921.4666666666667, "x": "名前はディンキネシュ。"}, {"t": 922.8333333333334, "x": "エチオピアの言葉、アムハラ語です。"}, {"t": 925.4333333333333, "x": "意味は「あなたはすばらしい」。"}, {"t": 927.5666666666667, "x": "化石のルーシーは、エチオピアでは"}, {"t": 929.9833333333333, "x": "この名前で呼ばれています。"}, {"t": 931.5833333333334, "x": "化石は見つかった国でいまも保管されています。"}, {"t": 934.45, "x": "あまりに小さな小惑星です。"}, {"t": 936.5166666666667, "x": "チームには、「ディンキー」と呼ぶ人もいたそうです。"}, {"t": 940.0333333333333, "x": "ディンキネシュに寄る目的は、本番前の試しでした。"}, {"t": 943.6, "x": "特に確かめたかったのは、追尾の仕組みです。"}, {"t": 946.7166666666667, "x": "探査機は、速い速度で近づきます。"}, {"t": 949.4333333333333, "x": "そのとき、相手までの正しい距離はなかなか分かりません。"}, {"t": 953.25, "x": "外れないように、いそうな場所を広く撮る方法があります。"}, {"t": 957.1, "x": "ただその方法では多くの写真に暗い空しか写りません。"}, {"t": 960.7166666666667, "x": "ルーシーには、小惑星を自分で"}, {"t": 963.1333333333333, "x": "追いかける仕組みがあります。"}, {"t": 964.6666666666666, "x": "カメラの真ん中に、とらえ続けるのです。"}, {"t": 967.4833333333333, "x": "けれどもこの仕組みは新しいものでした。"}, {"t": 969.9166666666666, "x": "宇宙ではまだ使ったことがありません。"}, {"t": 972.15, "x": "そこでトロヤ群の何年も前に試すことにしたのです。"}, {"t": 975.4333333333333, "x": "近づく数週間前、チームは気になることに気づきました。"}, {"t": 979.3833333333333, "x": "ディンキネシュの明るさの変わり方が、"}, {"t": 981.45, "x": "おかしかったのです。"}, {"t": 982.95, "x": "月を連れているのではないか、と考える人もいました。"}, {"t": 986.6166666666667, "x": "ただ確かなことは近くの画像が"}, {"t": 988.5666666666667, "x": "届くまで分かりませんでした。"}, {"t": 990.2833333333333, "x": "二〇二三年十一月一日。"}, {"t": 992.75, "x": "ルーシーはディンキネシュのそばを通りました。"}, {"t": 995.2166666666667, "x": "距離は、約四百三十キロメートルです。"}, {"t": 998.2666666666667, "x": "速さは秒速約四・五キロメートルです。"}, {"t": 1001.0833333333334, "x": "地球からは約四億八千万キロメートル離れた場所でした。"}, {"t": 1004.8833333333333, "x": "届いた画像には、小さな天体がもう一つ写っていました。"}, {"t": 1008.8166666666667, "x": "やはり月がいたのです。"}, {"t": 1010.3166666666667, "x": "追尾の仕組みも、うまく働きました。"}, {"t": 1012.9666666666667, "x": "高速ですれ違うあいだ、小惑星を"}, {"t": 1015.6666666666666, "x": "視野にとらえ続けたのです。"}, {"t": 1017.3, "x": "しかももっと驚くことがありました。"}, {"t": 1019.45, "x": "最接近から約六分後の画像です。"}, {"t": 1021.9666666666667, "x": "その月は二つの丸い塊がくっついた形をしていました。"}, {"t": 1025.6833333333334, "x": "最接近の画像では、二つの塊が前後に重なっていました。"}, {"t": 1030.0333333333333, "x": "そのため一つに見えていたのです。"}, {"t": 1032.1166666666666, "x": "二つの天体が触れ合って一つになったものを、"}, {"t": 1034.75, "x": "接触二重天体と呼びます。"}, {"t": 1037.05, "x": "小惑星のまわりを回る接触二重天体は、"}, {"t": 1040.05, "x": "これが初めての発見でした。"}, {"t": 1042.2, "x": "月の名前は二〇二三年十一月二十七日に決まりました。"}, {"t": 1046.5166666666667, "x": "セラム。"}, {"t": 1047.6166666666666, "x": "アムハラ語で「平和」を意味する、あいさつの言葉です。"}, {"t": 1051.95, "x": "セラムは別の化石の名前でもあります。"}, {"t": 1054.5333333333333, "x": "二〇〇〇年にエチオピアで見つかった、"}, {"t": 1056.5833333333333, "x": "三歳の女の子の骨です。"}, {"t": 1058.7833333333333, "x": "ルーシーと同じ種類の人類です。"}, {"t": 1060.9833333333333, "x": "「ルーシーの赤ちゃん」と呼ばれることもあります。"}, {"t": 1063.9666666666667, "x": "ただ実際にはルーシーより十万年以上前に生きていました。"}, {"t": 1067.7166666666667, "x": "ディンキネシュは、いちばん長いところで"}, {"t": 1070.1, "x": "約七百九十メートルです。"}, {"t": 1072.0, "x": "セラムの大きさは、二〇二四年の論文に書かれています。"}, {"t": 1076.0166666666667, "x": "塊は二つとも、二百メートル台です。"}, {"t": 1079.05, "x": "直径は約二百十メートルと約二百三十メートル。"}, {"t": 1082.55, "x": "セラムは、ディンキネシュのまわりを回っています。"}, {"t": 1085.5666666666666, "x": "距離は、約三・一キロメートルです。"}, {"t": 1088.4, "x": "一周にかかるのは、約五十二・七時間です。"}, {"t": 1091.8333333333333, "x": "ディンキネシュ本体にも、変わった地形がありました。"}, {"t": 1095.0666666666666, "x": "表面に長い溝が走っていたのです。"}, {"t": 1097.5333333333333, "x": "NASAによると、それはずれた跡です。"}, {"t": 1100.15, "x": "小惑星の約四分の一の塊が、あるとき急に動いたのです。"}, {"t": 1104.8166666666666, "x": "太陽の光で温まった表面は、熱を出します。"}, {"t": 1108.4833333333333, "x": "その熱のわずかな力で、小惑星は"}, {"t": 1111.3, "x": "少しずつ速く回るようになります。"}, {"t": 1113.45, "x": "何百万年もかかる変化です。"}, {"t": 1115.5666666666666, "x": "回転が速くなると、外へ引っぱる力がたまります。"}, {"t": 1119.2333333333333, "x": "その力が限界をこえたとき、"}, {"t": 1121.2666666666667, "x": "一部がずれたと考えられています。"}, {"t": 1123.7666666666667, "x": "そのとき飛び散ったかけらが、赤道の盛り上がりになった。"}, {"t": 1127.4333333333334, "x": "そしてセラムの材料にもなったのではないか。"}, {"t": 1130.1333333333334, "x": "論文はそう考えています。"}, {"t": 1132.0333333333333, "x": "プロジェクト科学者のキース・ノルは、"}, {"t": 1134.0, "x": "地震にたとえています。"}, {"t": 1135.7166666666667, "x": "ゆっくり力がたまり、一気に"}, {"t": 1137.8666666666666, "x": "はじけたのだろうという話です。"}, {"t": 1139.7666666666667, "x": "直径一キロメートルにも満たない天体です。"}, {"t": 1142.5666666666666, "x": "そこに、これだけの出来事が残っていました。"}, {"t": 1145.6666666666667, "x": "一回目は、試しのつもりでした。"}, {"t": 1148.1166666666666, "x": "その一回目で、ルーシーは誰も"}, {"t": 1150.4, "x": "知らなかった月を見つけたのです。"}, {"t": 1152.3666666666666, "x": "二つめの小惑星を訪ねたのは、"}, {"t": 1154.5333333333333, "x": "二〇二五年四月二十日でした。"}, {"t": 1157.0333333333333, "x": "名前はドナルドジョハンソン。"}, {"t": 1158.7166666666667, "x": "化石のルーシーを見つけた、"}, {"t": 1160.3333333333333, "x": "ドナルド・ジョハンソンの名前です。"}, {"t": 1162.5166666666667, "x": "小惑星帯のまんなかあたりを回っています。"}, {"t": 1165.3, "x": "大昔の衝突で生まれた、かけらの一つです。"}, {"t": 1168.6666666666667, "x": "NASAによると、約一億五千万年前のことです。"}, {"t": 1172.3333333333333, "x": "この訪問はトロヤ群の前の通し稽古でした。"}, {"t": 1175.3166666666666, "x": "本番と同じ手順で、すべての装置を試すのです。"}, {"t": 1178.9833333333333, "x": "地上の観測では、この小惑星の"}, {"t": 1181.6666666666667, "x": "明るさは大きく変わっていました。"}, {"t": 1183.6333333333334, "x": "十日ほどの間に、明るくなったり暗くなったりするのです。"}, {"t": 1187.5833333333333, "x": "細長い形かもしれない、とチームは予想していました。"}, {"t": 1191.3833333333334, "x": "ルーシーは約九百六十キロメートル先を通りました。"}, {"t": 1194.9, "x": "速さは秒速約十三・四キロメートルです。"}, {"t": 1198.0166666666667, "x": "地球からは約二億二千三百万キロメートル。"}, {"t": 1201.1166666666666, "x": "電波が届くまで、約十二分かかる場所です。"}, {"t": 1204.3666666666666, "x": "届いた画像で、予想の一部は当たりました。"}, {"t": 1207.4666666666667, "x": "ドナルドジョハンソンも、二つの"}, {"t": 1209.5333333333333, "x": "塊がつながった天体でした。"}, {"t": 1211.5, "x": "ただチームを驚かせたものもあります。"}, {"t": 1213.85, "x": "二つの塊をつなぐ、細い首の形です。"}, {"t": 1217.2, "x": "NASAは、その形をこう書いています。"}, {"t": 1219.8333333333333, "x": "アイスクリームのコーンを、二つ重ねたような形。"}, {"t": 1223.3333333333333, "x": "大きさも思っていたより大きいものでした。"}, {"t": 1225.85, "x": "最初の分析では、長さ約八キロメートルです。"}, {"t": 1229.35, "x": "いちばん太いところで、幅約三・五キロメートル。"}, {"t": 1232.8666666666666, "x": "望遠カメラの視野に、全体が"}, {"t": 1235.1666666666667, "x": "入りきらない画像もありました。"}, {"t": 1237.0333333333333, "x": "レヴィソンは、地形のことを話しています。"}, {"t": 1239.8666666666666, "x": "この小惑星の地形は、おどろくほど複雑だ。"}, {"t": 1243.2333333333333, "x": "これでルーシーが近くで見た天体は三つになりました。"}, {"t": 1246.4833333333333, "x": "ディンキネシュとセラム、そして"}, {"t": 1248.4, "x": "ドナルドジョハンソンです。"}, {"t": 1249.8, "x": "三つとも小惑星帯の天体です。"}, {"t": 1252.1833333333334, "x": "トロヤ群の小惑星は、まだ一つもありません。"}, {"t": 1255.4833333333333, "x": "ドナルドジョハンソンを過ぎて、"}, {"t": 1257.1666666666667, "x": "ルーシーは外へ進みました。"}, {"t": 1259.3166666666666, "x": "そして二〇二六年の春に、序章の四つの点を撮りました。"}, {"t": 1263.65, "x": "エウリュバテス、ポリュメレ、レウコス、オルス。"}, {"t": 1267.45, "x": "ルーシーは、この四つのそばを順に通る予定です。"}, {"t": 1270.9, "x": "期間は、二〇二七年八月から二〇二八年十一月までです。"}, {"t": 1275.9833333333333, "x": "撮ったとき、相手までは何億キロメートルもありました。"}, {"t": 1279.65, "x": "だから画像の中では針で刺したような点です。"}, {"t": 1282.5333333333333, "x": "それでもこの撮影には意味がありました。"}, {"t": 1285.0333333333333, "x": "地球の望遠鏡は、トロヤ群を"}, {"t": 1287.45, "x": "ほぼ太陽と同じ方角から見ます。"}, {"t": 1289.6833333333334, "x": "そのため小惑星はいつも満月のように照らされて見えます。"}, {"t": 1293.3833333333334, "x": "ところがルーシーは近くを通るとき、"}, {"t": 1295.5666666666666, "x": "横から見ることになります。"}, {"t": 1297.5666666666666, "x": "表面の一部は、影になります。"}, {"t": 1300.0666666666666, "x": "暗すぎず白くとびすぎない写真を撮る必要があります。"}, {"t": 1303.45, "x": "そのためには、カメラの設定を"}, {"t": 1305.65, "x": "前もって決めておかなければなりません。"}, {"t": 1307.8666666666666, "x": "そこで本番に近い光の当たり方で、"}, {"t": 1310.3, "x": "四つの点を撮っておいたのです。"}, {"t": 1312.55, "x": "画像を地球へ送り、処理を終えたのは"}, {"t": 1315.2666666666667, "x": "二〇二六年七月でした。"}, {"t": 1317.2833333333333, "x": "オルスだけは、撮った時間が短めでした。"}, {"t": 1320.15, "x": "そのため、点の動きが小さく見えます。"}, {"t": 1323.0166666666667, "x": "チームは、近づく前にもう一度オルスを撮る予定です。"}, {"t": 1326.6166666666666, "x": "点の画像なら、ほかにもあります。"}, {"t": 1329.0833333333333, "x": "エウリュバテスには、小さな月がいます。"}, {"t": 1331.85, "x": "見つけたのは、地球を回るハッブル宇宙望遠鏡でした。"}, {"t": 1335.6833333333334, "x": "月を探すには、まず探す範囲を決めます。"}, {"t": 1338.7833333333333, "x": "その天体の重力が、まわりより強く働く範囲です。"}, {"t": 1342.6666666666667, "x": "地球の場合その範囲の半径は約百五十万キロメートルです。"}, {"t": 1346.6833333333334, "x": "月はその内側の約三十八万キロメートルを回っています。"}, {"t": 1350.5833333333333, "x": "チームは目的の小惑星ごとにこの範囲を計算しました。"}, {"t": 1354.3, "x": "そして二〇一八年の秋、ハッブルで月を探し始めました。"}, {"t": 1358.55, "x": "二〇二〇年一月三日の画像です。"}, {"t": 1361.15, "x": "エウリュバテスのすぐそばに、"}, {"t": 1362.7333333333333, "x": "かすかな点が写っていました。"}, {"t": 1364.8333333333333, "x": "前の年の十二月十一日の画像には、その点が見えません。"}, {"t": 1369.25, "x": "月がエウリュバテスに近すぎて、光にまぎれていたのです。"}, {"t": 1373.1333333333334, "x": "チームは二〇二〇年一月九日に発表しました。"}, {"t": 1376.6166666666666, "x": "訪ねる小惑星は、七つではなく八つになる。"}, {"t": 1380.0, "x": "月はケタと名づけられました。"}, {"t": 1381.8166666666666, "x": "メキシコの陸上選手、エンリケタ・バシリオに"}, {"t": 1384.9666666666667, "x": "ちなむ名前です。"}, {"t": 1386.0, "x": "一九六八年のメキシコ・オリンピックに出場しました。"}, {"t": 1390.0166666666667, "x": "女性として初めて、開会式で聖火台に火をともした人です。"}, {"t": 1394.3833333333334, "x": "大きさは約一キロメートルとみられています。"}, {"t": 1397.1166666666666, "x": "打ち上げの前に月を見つけておくことには、わけが"}, {"t": 1400.4833333333333, "x": "あります。"}, {"t": 1400.9833333333333, "x": "一つのはずの小惑星が、二つに見えたとします。"}, {"t": 1404.5166666666667, "x": "すると、追尾の仕組みが迷うかもしれません。"}, {"t": 1407.6166666666666, "x": "前もって知っていれば、その心配はなくなります。"}, {"t": 1410.9, "x": "月の軌道を調べて、観測の計画も立てられます。"}, {"t": 1414.6, "x": "二〇二二年三月には、ポリュメレにも月が見つかりました。"}, {"t": 1418.7, "x": "正式な名前はまだありません。"}, {"t": 1420.6666666666667, "x": "チームは「ショーン」というあだ名で呼んでいます。"}, {"t": 1423.9666666666667, "x": "こうした月の画像も、どれも点です。"}, {"t": 1426.65, "x": "南西研究所のページには、目的の"}, {"t": 1429.4, "x": "小惑星の想像図が載っています。"}, {"t": 1431.5833333333333, "x": "そこには断り書きが添えられています。"}, {"t": 1434.0, "x": "ルーシーがそこへ着くまで、本当の姿は分からない。"}, {"t": 1437.5333333333333, "x": "二〇二六年十月二十八日、NASAは"}, {"t": 1440.8333333333333, "x": "一つの区切りを発表しました。"}, {"t": 1442.7333333333333, "x": "打ち上げから五年がたちました。"}, {"t": 1444.65, "x": "ルーシーが飛んだ距離は、三十五億キロメートルを"}, {"t": 1447.8666666666666, "x": "超えました。"}, {"t": 1448.55, "x": "そして、木星のトロヤ群の領域に入りました。"}, {"t": 1452.0666666666666, "x": "そこへ入った宇宙船は、ルーシーが初めてです。"}, {"t": 1455.45, "x": "宇宙にはっきりした境目があるわけではありません。"}, {"t": 1458.4, "x": "チームは、ルーシーの電波で位置を確かめています。"}, {"t": 1461.75, "x": "まわりの星の画像も使います。"}, {"t": 1463.8666666666666, "x": "それで木星の前のエル4に近づいていると分かるのです。"}, {"t": 1467.4, "x": "ここでは太陽の光はとても弱くなっています。"}, {"t": 1470.3833333333334, "x": "それでも、探査機と装置は予定どおり働いています。"}, {"t": 1474.0333333333333, "x": "NASAはそう伝えています。"}, {"t": 1475.65, "x": "ここからはまだ起きていない出来事です。"}, {"t": 1478.0, "x": "すべて予定として並べます。"}, {"t": 1479.85, "x": "最初の目的地は、エウリュバテスです。"}, {"t": 1482.7, "x": "最接近は協定世界時で二〇二七年八月十一日の"}, {"t": 1486.9166666666667, "x": "二十時十六分。"}, {"t": 1488.0833333333333, "x": "日本時間では、八月十二日の午前五時十六分です。"}, {"t": 1492.35, "x": "アメリカの発表では、八月十一日になっています。"}, {"t": 1496.1833333333334, "x": "ルーシーは、エウリュバテスの"}, {"t": 1498.0666666666666, "x": "千キロメートル以内を通る計画です。"}, {"t": 1500.5, "x": "速さは秒速約五・八キロメートル。"}, {"t": 1503.2166666666667, "x": "そのとき地球からは約八億四千百万キロメートル"}, {"t": 1506.65, "x": "離れています。"}, {"t": 1507.55, "x": "電波が地球に届くまで、約四十七分かかります。"}, {"t": 1511.3333333333333, "x": "NASAによると、近くで調べられる"}, {"t": 1513.7, "x": "時間は数時間しかありません。"}, {"t": 1515.5666666666666, "x": "チームはその数時間に向けて計画の仕上げをしています。"}, {"t": 1519.05, "x": "四つの小惑星のそばを通る速さも、NASAが書いています。"}, {"t": 1523.1166666666666, "x": "最大で、時速約二万六千キロメートルです。"}, {"t": 1526.6, "x": "最接近の距離は、約四百八十キロから"}, {"t": 1529.7333333333333, "x": "約九百七十キロとされています。"}, {"t": 1531.9833333333333, "x": "通り過ぎながら、目に見える光と赤外線で写真を撮ります。"}, {"t": 1536.2, "x": "エウリュバテスの直径は、約六十四キロメートルです。"}, {"t": 1539.95, "x": "トロヤ群では少ない、Cタイプの小惑星です。"}, {"t": 1543.3833333333334, "x": "しかも大きな衝突でできた一家の一員です。"}, {"t": 1546.3, "x": "トロヤ群で知られている衝突の一家は、これ一つだけです。"}, {"t": 1550.25, "x": "南西研究所はそう書いています。"}, {"t": 1552.45, "x": "なぜただ一つの一家がCタイプなのか。"}, {"t": 1554.8833333333334, "x": "赤いDタイプは、ぶつかると粉々になるのか。"}, {"t": 1558.1333333333334, "x": "それともぶつかると色が変わるのか。"}, {"t": 1560.3333333333333, "x": "エウリュバテスの表面には、"}, {"t": 1561.9166666666667, "x": "小惑星の内側が出ているかもしれません。"}, {"t": 1564.9666666666667, "x": "チームはそこをのぞけると考えています。"}, {"t": 1567.4333333333334, "x": "二つめはポリュメレです。"}, {"t": 1568.9833333333333, "x": "最接近は協定世界時で二〇二七年九月十五日の予定です。"}, {"t": 1573.5666666666666, "x": "直径は約二十一キロメートル。"}, {"t": 1575.8, "x": "ルーシーが訪ねるトロヤ群の"}, {"t": 1577.4333333333334, "x": "中で、いちばん小さな天体です。"}, {"t": 1579.9833333333333, "x": "色は暗く赤っぽいPタイプです。"}, {"t": 1582.2333333333333, "x": "この型の小惑星のそばを宇宙船が"}, {"t": 1584.5833333333333, "x": "通るのは、初めてになります。"}, {"t": 1586.75, "x": "三つめはレウコスです。"}, {"t": 1588.25, "x": "二〇二八年四月十八日の予定です。"}, {"t": 1591.25, "x": "直径は約四十キロメートルで、Dタイプです。"}, {"t": 1594.6666666666667, "x": "この小惑星は、とてもゆっくり回っています。"}, {"t": 1597.9, "x": "一日の長さは、四百四十六時間です。"}, {"t": 1601.2666666666667, "x": "昼が長く夜も長い天体です。"}, {"t": 1603.5, "x": "そのぶん昼はより熱く、夜はより冷たくなりそうです。"}, {"t": 1607.35, "x": "明るさの変わり方からは、細長い形が予想されています。"}, {"t": 1611.4833333333333, "x": "四つめはオルスです。"}, {"t": 1612.8333333333333, "x": "二〇二八年十一月十一日の予定です。"}, {"t": 1616.1666666666667, "x": "直径は約五十一キロメートルで、やはりDタイプです。"}, {"t": 1620.05, "x": "エウリュバテスとは、大きさがほぼ同じで色が違います。"}, {"t": 1623.7166666666667, "x": "二つを比べることができるのです。"}, {"t": 1625.8833333333334, "x": "ルーシーの道は、よく考えて選ばれました。"}, {"t": 1628.9333333333334, "x": "大きさも色もさまざまな小惑星を通るように、です。"}, {"t": 1632.6833333333334, "x": "小さいものは約一キロメートル、"}, {"t": 1634.6833333333334, "x": "大きいものは百キロメートルを超えます。"}, {"t": 1637.4166666666667, "x": "オルスを過ぎると、ルーシーは"}, {"t": 1639.5, "x": "いったん地球のそばへ戻ります。"}, {"t": 1641.35, "x": "二〇三〇年に、三回目で最後のスイングバイをします。"}, {"t": 1645.3166666666666, "x": "その間に木星とトロヤ群は太陽のまわりを進みます。"}, {"t": 1648.9833333333333, "x": "再び外へ出たルーシーは、今度は"}, {"t": 1651.4833333333333, "x": "木星の後ろの群れへ入ります。"}, {"t": 1653.5, "x": "エル5、トロイアの陣地です。"}, {"t": 1655.7166666666667, "x": "最後の目的地は、パトロクロスとメノイティオスです。"}, {"t": 1659.2, "x": "大きさのよく似た二つの小惑星が、"}, {"t": 1661.5333333333333, "x": "たがいのまわりを回っています。"}, {"t": 1663.6333333333334, "x": "直径の平均は、パトロクロスが約百十三キロメートル。"}, {"t": 1667.6833333333334, "x": "メノイティオスが約百四キロメートルです。"}, {"t": 1670.3, "x": "どちらもPタイプです。"}, {"t": 1671.8333333333333, "x": "NASAは、メノイティオスを"}, {"t": 1673.55, "x": "ほとんど双子のような相手と書いています。"}, {"t": 1675.9, "x": "この二つは太陽系のとても古い"}, {"t": 1678.0166666666667, "x": "時代の生き残りかもしれません。"}, {"t": 1679.9166666666667, "x": "二つの軌道は、惑星が並ぶ面から約二十二度傾いています。"}, {"t": 1684.45, "x": "そのためふだんは面の上か下にいます。"}, {"t": 1686.8666666666666, "x": "探査機がたどりつくのは、とても難しい場所です。"}, {"t": 1690.2666666666667, "x": "ちょうどルーシーが行ける場所を"}, {"t": 1691.8, "x": "通るときに、出会える計算でした。"}, {"t": 1694.25, "x": "最接近はアメリカ東部時間で"}, {"t": 1696.2, "x": "二〇三三年三月三日の予定です。"}, {"t": 1698.9166666666667, "x": "一機で合わせて十一の天体のそばを通ります。"}, {"t": 1701.9833333333333, "x": "これほど多くの行き先を持つ計画は、ほかにありません。"}, {"t": 1705.7333333333333, "x": "南西研究所は、そう書いています。"}, {"t": 1708.3666666666666, "x": "二〇三三年に主な任務を終えても、"}, {"t": 1711.0, "x": "ルーシーは止まりません。"}, {"t": 1712.6833333333334, "x": "地球の軌道の近くからトロヤ群まで、"}, {"t": 1715.0666666666666, "x": "安定した道を行き来し続けます。"}, {"t": 1717.55, "x": "チームはその道を選ぶときに一つの条件を置きました。"}, {"t": 1721.0333333333333, "x": "十万年以上、ルーシーが地球にぶつからないことです。"}, {"t": 1724.75, "x": "南西研究所によると、この道は何十万年も続きます。"}, {"t": 1728.9666666666667, "x": "もしかすると、何百万年かもしれません。"}, {"t": 1732.0333333333333, "x": "だからルーシーには一枚の板が付いています。"}, {"t": 1734.7666666666667, "x": "昔、遠くへ向かう探査機がありました。"}, {"t": 1737.6833333333334, "x": "その探査機は、宇宙人にあてた板を積んでいました。"}, {"t": 1741.2, "x": "ルーシーの板は、宇宙人あてではありません。"}, {"t": 1744.1833333333334, "x": "あて先は遠い未来の人類です。"}, {"t": 1746.4166666666667, "x": "いつか子孫が、ルーシーを拾いに来るかもしれない。"}, {"t": 1749.7833333333333, "x": "宇宙を探り始めたころの、古い道具としてです。"}, {"t": 1753.2333333333333, "x": "チームはそう考えて板を積みました。"}, {"t": 1755.6166666666666, "x": "板にはいまの時代の言葉が刻まれています。"}, {"t": 1758.3833333333334, "x": "作家や詩人、科学者や音楽家たちの言葉です。"}, {"t": 1761.9333333333334, "x": "アインシュタインの言葉もあります。"}, {"t": 1763.85, "x": "大切なのは問うことをやめないことだ。"}, {"t": 1766.1666666666667, "x": "ビートルズの四人の言葉もあります。"}, {"t": 1768.3666666666666, "x": "若い詩人アマンダ・ゴーマンは、"}, {"t": 1770.1166666666666, "x": "ルーシーの骨に宿る夢、と書きました。"}, {"t": 1773.2666666666667, "x": "トルコのことわざも刻まれています。"}, {"t": 1775.4166666666667, "x": "言葉は英語だけではありません。"}, {"t": 1777.3833333333334, "x": "トルコ語や、ポーランド語や、"}, {"t": 1779.3, "x": "スペイン語の言葉も並んでいます。"}, {"t": 1781.65, "x": "そして打ち上げの日の惑星の並びを描いた図です。"}, {"t": 1784.85, "x": "NASAはこうも書いています。"}, {"t": 1786.5166666666667, "x": "もし誰も拾いに来なければ、いつか軌道は乱れる。"}, {"t": 1790.05, "x": "最後はおそらく、木星の重力に引かれる。"}, {"t": 1793.2666666666667, "x": "そして太陽へ落ちるか、太陽系の外へ投げ出される。"}, {"t": 1797.0666666666666, "x": "板を読む人が来るかどうかは、誰にも分かりません。"}, {"t": 1800.5, "x": "その前にルーシーにはやることが残っています。"}, {"t": 1803.2833333333333, "x": "一万五千を超える群れのうち、"}, {"t": 1805.2666666666667, "x": "八つの天体を近くから撮ることです。"}, {"t": 1807.9833333333333, "x": "どれもいまはまだ光の点でしか知られていません。"}, {"t": 1810.9166666666667, "x": "板に刻まれた惑星の図は、二〇二一年十月十六日の空です。"}, {"t": 1816.0166666666667, "x": "群れの最初の一つに近づくのは、六年近くあとです。"}, {"t": 1819.8666666666666, "x": "それは、夏の朝になります。"}, {"t": 1822.1333333333334, "x": "日本時間の午前五時十六分の予定です。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
