<script>
const D={"name": "ep009", "file": "ep009", "dur": 1923.76665625, "segs": [], "subs": [{"t": 0.0, "x": "火星の南極に近い、氷の縁の"}, {"t": 2.5833333333333335, "x": "平原のどこかに、一機の着陸機があります。"}, {"t": 5.683333333333334, "x": "あるはずだ、と言ったほうが正確です。"}, {"t": 8.3, "x": "一九九九年の十二月三日に、その着陸機は火星の"}, {"t": 12.816666666666666, "x": "大気に入り、そのまま一度も声を出しませんでした。"}, {"t": 16.366666666666667, "x": "名前はマーズ・ポーラー・ランダー。"}, {"t": 16.683333333333334, "x": "マーズ・ポーラー・ランダー█"}, {"t": 18.166666666666668, "x": "目標は、南緯七十六度、西経百九十五度のあたり。"}, {"t": 22.75, "x": "いまも、そこにあるとされています。"}, {"t": 25.133333333333333, "x": "ただ、その姿を写した写真は、一枚もありません。"}, {"t": 29.183333333333334, "x": "火星のまわりには、地表の二十五センチほどの物まで"}, {"t": 32.733333333333334, "x": "見分けられるカメラが回っています。"}, {"t": 34.7, "x": "それでも、この着陸機が写ったという"}, {"t": 37.31666666666667, "x": "発表は、確認できていません。"}, {"t": 39.63333333333333, "x": "探した記録は残っています。"}, {"t": 41.56666666666667, "x": "見つからなかったという記録も残っています。"}, {"t": 44.166666666666664, "x": "火星には、降りようとして途中で声が"}, {"t": 46.766666666666666, "x": "途絶えた機械が、いくつか眠っています。"}, {"t": 49.45, "x": "そのうち、上から撮った写真で場所が確かめられたものは、"}, {"t": 53.25, "x": "この回で扱う範囲では二機だけです。"}, {"t": 55.9, "x": "候補として挙がっているものが一機。"}, {"t": 58.05, "x": "残りは、どこにあるのかが分かっていません。"}, {"t": 60.96666666666667, "x": "見つかったものも、写真に写っているのは、数ピクセルの"}, {"t": 64.8, "x": "明るい点と、黒い染みと、白い布のような影です。"}, {"t": 68.83333333333333, "x": "この回では、火星に降りて途絶えた探査機が、"}, {"t": 71.8, "x": "いまどこにあるとされているのかを、記録に"}, {"t": 74.8, "x": "残っているところまで順に並べていきます。"}, {"t": 77.25, "x": "見つかったもの。"}, {"t": 78.26666666666667, "x": "見つかっていないもの。"}, {"t": 79.55, "x": "見つかったと思われたが、違ったもの。"}, {"t": 82.16666666666667, "x": "乗っていた人は、一人もいません。"}, {"t": 84.5, "x": "記録に残っているのは、機械が何をして、"}, {"t": 87.4, "x": "どこで止まったか、ということだけです。"}, {"t": 90.26666666666667, "x": "残っている記録の種類は、機械によって違います。"}, {"t": 93.78333333333333, "x": "降りている途中のデータが最後まで届いたもの。"}, {"t": 96.63333333333334, "x": "数十秒の信号だけが届いたもの。"}, {"t": 99.1, "x": "何ひとつ届かなかったもの。"}, {"t": 100.86666666666666, "x": "そして、何年もたってから、上から撮った"}, {"t": 104.01666666666667, "x": "写真の中に、それらしい点が見つかったもの。"}, {"t": 107.05, "x": "行方の欄に何が書かれているかは、"}, {"t": 109.15, "x": "そのどれにあたるかで決まっています。"}, {"t": 111.48333333333333, "x": "まず、火星に降りるとはどういうことかを、"}, {"t": 114.28333333333333, "x": "順に並べておきます。"}, {"t": 116.03333333333333, "x": "火星に向かう探査機は、秒速数キロメートルという"}, {"t": 119.45, "x": "速さで、火星の大気に飛び込みます。"}, {"t": 122.08333333333333, "x": "最初に速度を落とすのは、前にかぶせた熱シールドです。"}, {"t": 125.98333333333333, "x": "空気との摩擦で高温になりながら、減速していきます。"}, {"t": 129.78333333333333, "x": "ある程度遅くなったところで、パラシュートが開きます。"}, {"t": 133.28333333333333, "x": "熱シールドは切り離され、下に落ちていきます。"}, {"t": 136.55, "x": "火星の空気は、地球よりずっと薄いものです。"}, {"t": 139.8, "x": "パラシュートだけでは、安全な速さまで落とせません。"}, {"t": 143.28333333333333, "x": "そこで最後は、逆向きに噴射するエンジンや、"}, {"t": 146.38333333333333, "x": "空気袋や、それに代わる仕組みを使って、"}, {"t": 149.71666666666667, "x": "地面の直前で速度を殺します。"}, {"t": 152.23333333333332, "x": "この途中で、背中にかぶせていた後部カバーが、"}, {"t": 155.4, "x": "パラシュートごと切り離されます。"}, {"t": 157.56666666666666, "x": "つまり、うまく降りた場合でも、火星の地面には"}, {"t": 161.13333333333333, "x": "一か所ではなく、何か所かに物が落ちます。"}, {"t": 164.13333333333333, "x": "着陸機本体。"}, {"t": 165.43333333333334, "x": "熱シールド。"}, {"t": 166.43333333333334, "x": "パラシュートと後部カバー。"}, {"t": 168.01666666666668, "x": "それぞれが、数百メートルから"}, {"t": 170.2, "x": "数キロメートル離れた場所に散らばります。"}, {"t": 172.71666666666667, "x": "そして、うまく降りられなかった場合も、"}, {"t": 175.36666666666667, "x": "同じように何か所かに物が落ちます。"}, {"t": 178.0, "x": "違うのは、着陸機本体が、形をとどめているかどうかです。"}, {"t": 182.55, "x": "では、それをどうやって探すのか。"}, {"t": 184.95, "x": "この回で扱う機械の近くに、"}, {"t": 186.96666666666667, "x": "地面から探しに行ける者はいません。"}, {"t": 189.58333333333334, "x": "探す方法は、上から撮ることだけです。"}, {"t": 192.55, "x": "火星を回る探査機のうち、いちばん細かく"}, {"t": 195.55, "x": "撮れるカメラは、アメリカの周回機、"}, {"t": 198.05, "x": "マーズ・リコネサンス・オービターに"}, {"t": 200.06666666666666, "x": "積まれたハイライズというカメラです。"}, {"t": 200.11666666666667, "x": "ハイライズ█"}, {"t": 201.98333333333332, "x": "一ピクセルがおよそ二十五センチから三十センチ。"}, {"t": 205.13333333333333, "x": "八十五センチくらいの物なら、"}, {"t": 207.01666666666668, "x": "形として見分けられるとされています。"}, {"t": 209.61666666666667, "x": "着陸機の大きさは、数メートルほどです。"}, {"t": 212.65, "x": "ハイライズで撮ると、三メートルの物でも、"}, {"t": 215.43333333333334, "x": "縦横十ピクセルほどの小さな点になります。"}, {"t": 218.61666666666667, "x": "問題は、どこを撮ればいいのかが、分からないことです。"}, {"t": 222.51666666666668, "x": "着陸機が降りる予定の範囲は、楕円で示されます。"}, {"t": 226.18333333333334, "x": "この楕円は、狭いものでも数十キロメートル、"}, {"t": 229.28333333333333, "x": "広いものでは百キロメートルを超えます。"}, {"t": 232.01666666666668, "x": "その中のどこかにある、数ピクセルの点を"}, {"t": 234.93333333333334, "x": "探すことになります。"}, {"t": 236.21666666666667, "x": "カメラの細かさが、どれほど効いてくるかは、"}, {"t": 239.11666666666667, "x": "数字で比べると分かります。"}, {"t": 241.15, "x": "ハイライズより前に火星を回っていたマーズ・"}, {"t": 243.63333333333333, "x": "グローバル・サーベイヤーのカメラは、"}, {"t": 245.46666666666667, "x": "一ピクセルが約一・五メートルでした。"}, {"t": 248.2, "x": "三メートルの着陸機は、"}, {"t": 249.81666666666666, "x": "縦横二ピクセルほどにしかなりません。"}, {"t": 252.5, "x": "周りの岩と、見分けがつかない大きさです。"}, {"t": 255.61666666666667, "x": "ハイライズでは、それが縦横十ピクセルほどになります。"}, {"t": 259.3666666666667, "x": "形が、かろうじて形として読めるようになる大きさです。"}, {"t": 263.2, "x": "ハイライズが撮影するのは、火星の"}, {"t": 265.7, "x": "地面から二百数十キロメートル上空です。"}, {"t": 268.48333333333335, "x": "そこから、地面の一メートルに"}, {"t": 270.6666666666667, "x": "満たない物を見分けています。"}, {"t": 272.3666666666667, "x": "ハイライズは、一回の撮影で、"}, {"t": 274.68333333333334, "x": "火星の地面の細長い帯を写します。"}, {"t": 277.56666666666666, "x": "楕円の全体を一度に写すことはできません。"}, {"t": 280.35, "x": "何度も撮って、並べて、一枚ずつ"}, {"t": 283.35, "x": "見比べていくしかありません。"}, {"t": 284.95, "x": "しかも、火星の地面には、着陸機と見分けの"}, {"t": 288.3833333333333, "x": "つかない明るい岩や、斜面の光の反射や、"}, {"t": 291.43333333333334, "x": "画像の乱れが無数にあります。"}, {"t": 293.68333333333334, "x": "一つの点が本物かどうかを確かめるには、別の日に、"}, {"t": 297.3666666666667, "x": "別の太陽の角度で、もう一度撮る必要があります。"}, {"t": 301.35, "x": "見つかった、と言えるのは、何枚もの写真で、"}, {"t": 304.8, "x": "形と影と色が、期待されるものと合ったときだけです。"}, {"t": 308.75, "x": "この先の章で並べる機械は、"}, {"t": 310.7, "x": "どれも、この方法で探されました。"}, {"t": 313.6, "x": "見つかったものも、見つからなかったものも、"}, {"t": 316.21666666666664, "x": "同じ方法で探されています。"}, {"t": 318.48333333333335, "x": "火星の地面に最初に届いた人工物は、"}, {"t": 321.2, "x": "ソビエト連邦の探査機でした。"}, {"t": 323.48333333333335, "x": "一九七一年五月、ソビエト連邦は、"}, {"t": 327.0833333333333, "x": "二機の探査機を相次いで打ち上げました。"}, {"t": 329.8333333333333, "x": "マルス二号とマルス三号です。"}, {"t": 329.8333333333333, "x": "マルス二号█"}, {"t": 330.73333333333335, "x": "マルス三号█"}, {"t": 331.9166666666667, "x": "どちらも、火星を回る周回機と、地面に"}, {"t": 335.28333333333336, "x": "降りる着陸機を組み合わせた機体でした。"}, {"t": 337.7, "x": "二機が火星に着いたとき、火星は、観測史上でも"}, {"t": 341.56666666666666, "x": "最大級とされる砂嵐に覆われていました。"}, {"t": 344.3833333333333, "x": "星全体が、黄色い霧の中にありました。"}, {"t": 347.45, "x": "一九七一年十一月二十七日。"}, {"t": 350.85, "x": "先に着いたマルス二号の着陸機が、大気に入りました。"}, {"t": 354.8833333333333, "x": "着陸機は、降りる手順を最後まで終えることができず、"}, {"t": 358.5833333333333, "x": "地面にぶつかったとされています。"}, {"t": 360.81666666666666, "x": "それでも、この着陸機が、火星の地面に届いた"}, {"t": 364.51666666666665, "x": "最初の人工物になった、と記録されています。"}, {"t": 367.78333333333336, "x": "形をとどめて降りたわけではありません。"}, {"t": 370.2, "x": "ただ、届いた、という記録です。"}, {"t": 372.96666666666664, "x": "マルス二号の着陸機がぶつかった場所は、"}, {"t": 375.51666666666665, "x": "いまも見つかっていません。"}, {"t": 377.28333333333336, "x": "二〇二〇年時点で火星への着陸の試みを"}, {"t": 380.3, "x": "地図にまとめた一覧でも、その場所は、"}, {"t": 382.8666666666667, "x": "見つかっていないものとして扱われています。"}, {"t": 385.6333333333333, "x": "五日後、一九七一年十二月二日。"}, {"t": 386.6, "x": "一九七一年十二月二日█"}, {"t": 389.28333333333336, "x": "マルス三号の着陸機が降りました。"}, {"t": 391.68333333333334, "x": "こちらは、地面に降りたあと、信号を送り始めました。"}, {"t": 395.8833333333333, "x": "火星の地面から、人工物が電波を"}, {"t": 398.6166666666667, "x": "送ったのは、これが初めてです。"}, {"t": 400.8833333333333, "x": "しかし、その信号は、すぐに止まりました。"}, {"t": 404.25, "x": "NASAの発表では、着陸から十四・五秒後です。"}, {"t": 408.0, "x": "一九九〇年に書かれた協会誌の記事では、"}, {"t": 411.15, "x": "約二十秒後とされています。"}, {"t": 413.35, "x": "資料によって、数字が少し違います。"}, {"t": 416.3, "x": "どちらにしても、二十秒には届かない、"}, {"t": 419.03333333333336, "x": "あるいはその程度の長さでした。"}, {"t": 421.3, "x": "止まった理由は、分かっていません。"}, {"t": 423.6333333333333, "x": "この二機の着陸機には、それぞれ、"}, {"t": 426.1, "x": "小さな移動機が積まれていたとされています。"}, {"t": 429.0, "x": "車輪ではなく、両脇のスキーのような板で"}, {"t": 431.98333333333335, "x": "地面を押して進む仕組みでした。"}, {"t": 433.8666666666667, "x": "着陸機とはケーブルでつながったまま、十五メートルほどの"}, {"t": 437.55, "x": "範囲を動く設計だったと伝えられています。"}, {"t": 440.1666666666667, "x": "障害物にぶつかると、どちら側にあるかを"}, {"t": 443.2, "x": "感じ取り、一歩下がって、向きを変える。"}, {"t": 446.35, "x": "土の硬さと密度を測る道具を積んでいました。"}, {"t": 449.3333333333333, "x": "どちらの移動機も、動いたという記録はありません。"}, {"t": 452.65, "x": "マルス三号が降りた場所は、南緯四十五度、"}, {"t": 455.75, "x": "東経二百二度のあたりと予想されていました。"}, {"t": 458.8333333333333, "x": "プトレマイオス・クレーターという、"}, {"t": 458.8333333333333, "x": "プトレマイオス・クレーター█"}, {"t": 460.56666666666666, "x": "大きなクレーターの中です。"}, {"t": 462.5833333333333, "x": "それから四十年以上がたって、その場所の写真を、"}, {"t": 466.1166666666667, "x": "ロシアの民間の愛好家たちが調べ始めました。"}, {"t": 469.53333333333336, "x": "使ったのは、ハイライズが二〇〇"}, {"t": 471.6333333333333, "x": "七年十一月に撮った画像です。"}, {"t": 473.8666666666667, "x": "NASAの説明によれば、この一枚は、"}, {"t": 476.5, "x": "約十八億ピクセルの大きさがありました。"}, {"t": 479.51666666666665, "x": "その中から、数ピクセルから"}, {"t": 481.6166666666667, "x": "数十ピクセルの物を探すことになります。"}, {"t": 484.23333333333335, "x": "中心になったのは、サンクトペテルブルクの"}, {"t": 486.98333333333335, "x": "ヴィタリー・エゴロフという人でした。"}, {"t": 488.8333333333333, "x": "愛好家たちは、パラシュートや熱シールドや"}, {"t": 491.6166666666667, "x": "着陸機が、上からどう見えるはずかを"}, {"t": 494.18333333333334, "x": "計算で描き、その形と一致するものを、"}, {"t": 497.1, "x": "画像の中から一つずつ探していきました。"}, {"t": 499.96666666666664, "x": "二〇一二年の十二月三十一日。"}, {"t": 502.73333333333335, "x": "候補が見つかりました。"}, {"t": 504.21666666666664, "x": "明るい、丸いものが一つ。"}, {"t": 506.4, "x": "直径は七・五メートルほどでした。"}, {"t": 508.68333333333334, "x": "完全に広がれば十一メートルほどになる"}, {"t": 511.1666666666667, "x": "パラシュートが、一部縮んだ状態なら、"}, {"t": 513.8666666666667, "x": "ちょうどこの大きさになります。"}, {"t": 515.8666666666667, "x": "少し離れて、盾の形をした物体。"}, {"t": 518.8333333333334, "x": "一部が砂に埋まっていれば、"}, {"t": 520.4666666666667, "x": "熱シールドの大きさと合います。"}, {"t": 522.7666666666667, "x": "着陸機を下ろしたあとに離れていく"}, {"t": 524.8833333333333, "x": "逆噴射装置も、それらしい物が見つかりました。"}, {"t": 528.2333333333333, "x": "そこから細長く延びる影は、鎖のようにも見えました。"}, {"t": 532.1, "x": "そして、花びらが四枚開いたような形の物。"}, {"t": 535.6166666666667, "x": "候補の部品は、全部で四キロメートルあまりの"}, {"t": 538. たしていました。"}, {"t": 651.0666666666667, "x": "そして、地面に着くはずの時刻の"}, {"t": 653.5, "x": "直前で、信号は途絶えました。"}, {"t": 655.9, "x": "逆噴射の瞬間に止まったのか、地面にぶつかった"}, {"t": 659.25, "x": "瞬間に止まったのかは、分かっていません。"}, {"t": 661.95, "x": "降下機は、南半球の、マルガリティファー・テラと"}, {"t": 665.5333333333333, "x": "呼ばれる地域に降りたとされています。"}, {"t": 667.6666666666666, "x": "パラシュートが開いた時刻から、"}, {"t": 669.4666666666667, "x": "落ちていった範囲の見当はついていました。"}, {"t": 672.35, "x": "二〇一一年の十二月二十六日。"}, {"t": 675.1333333333333, "x": "ハイライズは、マルス六号を探すための撮影を行いました。"}, {"t": 679.3, "x": "その前に、もっと広い範囲を"}, {"t": 681.4333333333333, "x": "撮れる中解像度のカメラで、周りと違う、"}, {"t": 684.45, "x": "小さな明るい部分が見つかっていました。"}, {"t": 687.1333333333333, "x": "そこを細かく撮り直したものです。"}, {"t": 689.35, "x": "撮れた写真には、明るい地面と、"}, {"t": 691.7666666666667, "x": "細い線の模様が写っていました。"}, {"t": 694.1333333333333, "x": "調べた人たちは、これを、割れ目の"}, {"t": 696.9333333333333, "x": "入った明るい岩盤だろうと書いています。"}, {"t": 699.3333333333334, "x": "探査機の部品ではありませんでした。"}, {"t": 701.5166666666667, "x": "撮影を担当したチームは、そのときの"}, {"t": 704.2666666666667, "x": "説明に、こう添えています。"}, {"t": 706.3666666666667, "x": "火星は調べなければならない面積が広く、"}, {"t": 709.1333333333333, "x": "機体は砂ぼこりに覆われているかもしれない。"}, {"t": 712.1666666666666, "x": "マルス六号の降下機は、二百二十四秒の"}, {"t": 715.3333333333334, "x": "声を残して、どこかに降りています。"}, {"t": 717.9, "x": "どこに降りたのかを示す写真は、ありません。"}, {"t": 721.05, "x": "マルス二号も、同じです。"}, {"t": 723.2, "x": "一九七一年に火星の地面に届いた最初の"}, {"t": 726.7166666666667, "x": "人工物は、どこにあるのか分かっていません。"}, {"t": 729.6833333333333, "x": "火星の表面は広く、そのどこかに、"}, {"t": 732.4, "x": "形の定まらない、数メートルの金属の塊が、"}, {"t": 736.2833333333333, "x": "半世紀近く、砂の降る中に置かれています。"}, {"t": 739.8333333333334, "x": "見つからないのは、探していないからではありません。"}, {"t": 743.0, "x": "探す範囲が、見つけるものに"}, {"t": 745.0833333333334, "x": "比べて、あまりにも広いからです。"}, {"t": 747.5666666666667, "x": "マルス三号の候補が見つかったのは、降りた場所の"}, {"t": 750.85, "x": "見当が、比較的よくついていたからでもあります。"}, {"t": 754.0666666666667, "x": "マルス二号とマルス六号には、"}, {"t": 756.0, "x": "その手がかりが、まだ足りていません。"}, {"t": 758.75, "x": "二〇二〇年の時点でも、両方とも、"}, {"t": 761.4833333333333, "x": "見つかっていない機体として一覧に載っています。"}, {"t": 764.45, "x": "序章の着陸機に戻ります。"}, {"t": 766.45, "x": "マーズ・ポーラー・ランダーは、"}, {"t": 766.45, "x": "マーズ・ポーラー・ランダー█"}, {"t": 767.7833333333333, "x": "一九九九年一月三日に打ち上げられました。"}, {"t": 771.75, "x": "目的地は、火星の南極冠の縁。"}, {"t": 774.5833333333334, "x": "これまでどの着陸機も降りたことのない、"}, {"t": 776.9166666666666, "x": "氷に近い地域でした。"}, {"t": 778.9, "x": "打ち上げのときの質量は、約五百八十三キログラム。"}, {"t": 782.8666666666667, "x": "そのうち、熱シールドなどの覆いが"}, {"t": 785.2833333333333, "x": "百四十キログラム、燃料が六十四キログラム。"}, {"t": 788.9, "x": "そして、三・五キログラムの小さな探査体が"}, {"t": 792.1333333333333, "x": "二本、機体の外側に取り付けられていました。"}, {"t": 795.25, "x": "この二本は、ディープ・スペース二という"}, {"t": 796.0833333333334, "x": "ディープ・スペース二█"}, {"t": 797.6833333333333, "x": "別の計画の機械です。"}, {"t": 799.2833333333333, "x": "着陸機とは別に切り離され、着陸機から"}, {"t": 802.3333333333334, "x": "約六十キロメートル離れた地点に、秒速"}, {"t": 805.4166666666666, "x": "約二百メートルで、地面に突き刺さる設計でした。"}, {"t": 808.8333333333334, "x": "突き刺さった衝撃で、地上に残る後ろ半分と、"}, {"t": 812.3166666666667, "x": "地下にもぐる前半分に分かれます。"}, {"t": 814.75, "x": "二つはケーブルでつながっています。"}, {"t": 816.8333333333334, "x": "後ろ半分は約六万G、前半分は約三万Gの"}, {"t": 820.7833333333333, "x": "衝撃に耐えるように作られていました。"}, {"t": 823.0833333333334, "x": "地下の氷を調べるための機械です。"}, {"t": 825.45, "x": "後ろ半分は、零度から零下八十度の"}, {"t": 828.3, "x": "中で動くように作られていました。"}, {"t": 830.3666666666667, "x": "着陸機の地上での仕事は、九十日の予定でした。"}, {"t": 834.1833333333333, "x": "二本の探査体の仕事は、二日です。"}, {"t": 836.9833333333333, "x": "三つとも、同じ巡航用の機体に取り付けられ、"}, {"t": 840.3166666666667, "x": "同じ地域を目指していました。"}, {"t": 842.5166666666667, "x": "一九九九年十二月三日。"}, {"t": 845.2333333333333, "x": "着陸機は、健康な状態で火星に近づき、大気に入りました。"}, {"t": 850.2, "x": "それきり、着陸機からも、二本の"}, {"t": 853.05, "x": "探査体からも、何も届きませんでした。"}, {"t": 855.9, "x": "この着陸機は、降りている途中のデータを、"}, {"t": 858.8833333333333, "x": "地球に送らない設計になっていました。"}, {"t": 861.6, "x": "安全に降りることに直接つながらないものには"}, {"t": 864.35, "x": "手をかけない、という方針で決められたことでした。"}, {"t": 867.5833333333334, "x": "降下中に何が起きたのかを、あとで"}, {"t": 870.0833333333334, "x": "知る手段は、はじめからありませんでした。"}, {"t": 872.7666666666667, "x": "十二月十六日。"}, {"t": 874.35, "x": "火星を回っていたマーズ・グローバル・"}, {"t": 876.25, "x": "サーベイヤーという周回機が、予定の地点を撮りました。"}, {"t": 879.9, "x": "着陸機は見つかりませんでした。"}, {"t": 881.9833333333333, "x": "交信の試みは、年を越して続けられました。"}, {"t": 885.2666666666667, "x": "二〇〇〇年一月十七日、NASAは、"}, {"t": 888.0333333333333, "x": "すべての交信の試みを終えました。"}, {"t": 890.6666666666666, "x": "その二か月後、二〇〇〇年三月二十二日。"}, {"t": 891.8833333333333, "x": "二〇〇〇年三月二十二日█"}, {"t": 893.9833333333333, "x": "原因を調べる委員会が、報告書をまとめました。"}, {"t": 897.6, "x": "報告書は、はじめに、こう断っています。"}, {"t": 900.9666666666667, "x": "降下中のデータが全くなく、呼びかけにも"}, {"t": 903.9333333333333, "x": "一切応答がなかった以上、原因を特定できるとは、"}, {"t": 907.5833333333334, "x": "もともと期待されていなかった。"}, {"t": 909.6666666666666, "x": "それでも、委員会は、最も可能性が"}, {"t": 912.8333333333334, "x": "高いものを一つ挙げました。"}, {"t": 914.4833333333333, "x": "着陸機は、パラシュートにつられて降りている途中、"}, {"t": 917.75, "x": "高度約千五百メートルで、三本の脚を伸ばします。"}, {"t": 918.25, "x": "高度約千五百メートル█"}, {"t": 921.85, "x": "脚には、地面に触れたことを知らせる磁気の"}, {"t": 924.7, "x": "センサーが一つずつ付いています。"}, {"t": 926.6, "x": "脚が伸びきった瞬間の振動を、このセンサーが、"}, {"t": 929.9666666666667, "x": "地面に触れた信号として拾った可能性がある。"}, {"t": 933.2, "x": "本来、ソフトウェアは、その時点の"}, {"t": 935.9166666666666, "x": "信号を無視するはずでした。"}, {"t": 937.6166666666667, "x": "しかし、その処理が正しく作られておらず、"}, {"t": 940.5666666666667, "x": "偽の「着地した」という記録が、残ったままになっていた。"}, {"t": 945.5, "x": "着地を判定する仕組みは、それよりずっと下、"}, {"t": 948.6333333333333, "x": "高度四十メートルで働き始めます。"}, {"t": 948.85, "x": "高度四十メートル█"}, {"t": 951.4166666666666, "x": "働き始めたその瞬間に、残っていた偽の記録が"}, {"t": 955.05, "x": "読まれ、降下用のエンジンを止める命令が出た。"}, {"t": 958.2333333333333, "x": "報告書の計算では、高度四十メートルでの"}, {"t": 961.4, "x": "速さは、秒速約十三メートル。"}, {"t": 963.9833333333333, "x": "そこから、推力のない状態で落ちると、地面に"}, {"t": 967.65, "x": "着くときには秒速約二十二メートルになります。"}, {"t": 970.6166666666667, "x": "設計上の着地の速さは、秒速二・四メートルでした。"}, {"t": 974.85, "x": "報告書は、この速さでは着陸機は"}, {"t": 977.5833333333334, "x": "生き残れなかった、と書いています。"}, {"t": 979.95, "x": "ディープ・スペース二の二本については、委員会は、"}, {"t": 983.05, "x": "最も可能性の高い原因を特定できませんでした。"}, {"t": 986.7333333333333, "x": "考えられる失敗の形を四つ挙げるところまでで、"}, {"t": 989.95, "x": "止まっています。"}, {"t": 991.1666666666666, "x": "報告書が、次の着陸機に向けた勧告の"}, {"t": 994.2333333333333, "x": "筆頭に置いたのは、降下中のデータを"}, {"t": 996.8666666666667, "x": "地球に送る仕組みを加えることでした。"}, {"t": 999.25, "x": "着陸機が見つからないまま、年月がたちました。"}, {"t": 1002.6166666666667, "x": "二〇〇五年。"}, {"t": 1003.5833333333334, "x": "周回機のカメラの担当チームは、昔の画像を"}, {"t": 1006.9666666666667, "x": "見直していて、一つの候補に気づきました。"}, {"t": 1009.9166666666666, "x": "パラシュートに似た、明るい点。"}, {"t": 1012.2, "x": "そこから少し離れて、黒っぽい"}, {"t": 1014.55, "x": "地面の中に、明るい点が一つ。"}, {"t": 1017.0666666666667, "x": "エンジンの噴射で地面の砂が吹き払われ、その中心に"}, {"t": 1020.7333333333333, "x": "着陸機が残っている、と読める配置でした。"}, {"t": 1023.75, "x": "チームは、同じ場所を、より細かく撮り直そうとしました。"}, {"t": 1027.9666666666667, "x": "周回機の向きを傾けて、狙った一点を細かく撮る方法です。"}, {"t": 1032.5166666666667, "x": "狙いは簡単には当たらず、候補の"}, {"t": 1034.9833333333333, "x": "場所を写すのに、六回かかりました。"}, {"t": 1037.6166666666666, "x": "最後の撮影は、二〇〇五年九月二十七日でした。"}, {"t": 1041.5166666666667, "x": "その結論は、はっきりしていました。"}, {"t": 1044.1166666666666, "x": "ここは、マーズ・ポーラー・ランダーのある場所ではない。"}, {"t": 1047.2, "x": "パラシュートに見えたのは、"}, {"t": 1048.5833333333333, "x": "小さな丘の、日の当たっている斜面でした。"}, {"t": 1051.8333333333333, "x": "着陸機に見えた点は、周りのピクセルと"}, {"t": 1054.75, "x": "値が違っていただけの、画像の乱れでした。"}, {"t": 1057.8333333333333, "x": "NASAは、この画像に「見つからなかった」という"}, {"t": 1061.5666666666666, "x": "題を付けて公開しています。"}, {"t": 1063.3, "x": "その翌年から、ハイライズが火星を回り始めました。"}, {"t": 1067.0, "x": "一ピクセル約二十五センチのカメラです。"}, {"t": 1069.65, "x": "それでも、マーズ・ポーラー・ランダーが"}, {"t": 1071.8666666666666, "x": "写ったという発表は、確認できていません。"}, {"t": 1074.8333333333333, "x": "二本の探査体も、同じです。"}, {"t": 1077.25, "x": "南緯七十六度のあたりに、三本脚の着陸機と、"}, {"t": 1080.8833333333334, "x": "地面に刺さった二本の探査体と、パラシュートと、"}, {"t": 1084.45, "x": "熱シールドが、それぞれどこかにあるはずです。"}, {"t": 1087.7833333333333, "x": "そのどれも、写真には写っていません。"}, {"t": 1090.4333333333334, "x": "見つかった例に移ります。"}, {"t": 1092.0833333333333, "x": "二〇〇三年十二月十九日。"}, {"t": 1094.2833333333333, "x": "ヨーロッパ宇宙機関の周回機マーズ・"}, {"t": 1096.4833333333333, "x": "エクスプレスから、小さな着陸機が切り離されました。"}, {"t": 1100.0833333333333, "x": "イ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
