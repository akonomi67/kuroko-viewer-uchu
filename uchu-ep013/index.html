<script>
const D={"name": "ep013", "file": "ep013", "dur": 1913.55, "segs": [], "subs": [{"t": 0.0, "x": "二〇一四年十一月十二日。"}, {"t": 2.45, "x": "ドイツのダルムシュタットにある、ヨーロッパ宇宙機関の"}, {"t": 5.65, "x": "管制センターに、一つの信号が届きました。"}, {"t": 8.866666666666667, "x": "世界時で、十六時三分ごろのことです。"}, {"t": 11.983333333333333, "x": "彗星の上に、着陸機が触れた。"}, {"t": 14.666666666666666, "x": "そういう知らせでした。"}, {"t": 16.066666666666666, "x": "ただ、その知らせは、遅れて届いたものです。"}, {"t": 19.466666666666665, "x": "その日、彗星から地球まで、電波が"}, {"t": 22.566666666666666, "x": "届くのに二十八分二十秒かかりました。"}, {"t": 25.233333333333334, "x": "信号が地上に着いたとき、着陸機はもう、"}, {"t": 28.383333333333333, "x": "三十分近く前に彗星に触れていたことになります。"}, {"t": 32.03333333333333, "x": "そして、そのころ着陸機は、"}, {"t": 34.25, "x": "もう地面の上にいませんでした。"}, {"t": 36.46666666666667, "x": "体を地面につなぎとめるはずの"}, {"t": 38.416666666666664, "x": "仕掛けが、動いていなかったのです。"}, {"t": 40.78333333333333, "x": "着陸機は表面で跳ね返り、ゆっくりと"}, {"t": 43.766666666666666, "x": "宇宙へ浮き上がっていました。"}, {"t": 45.28333333333333, "x": "着陸機の名前は、フィラエ。"}, {"t": 47.483333333333334, "x": "重さは百キログラムです。"}, {"t": 49.233333333333334, "x": "ヨーロッパ宇宙機関は、この日の発表で、こう書きました。"}, {"t": 53.516666666666666, "x": "彗星に追いついて周りを回った初めての"}, {"t": 56.05, "x": "計画であり、いま、彗星の表面へ"}, {"t": 59.13333333333333, "x": "着陸機を届けた初めての計画にもなった。"}, {"t": 61.916666666666664, "x": "降りた先は、チュリュモフ・ゲラシメンコ彗星。"}, {"t": 64.88333333333334, "x": "記号をつけて、六十七ピーとも呼ばれます。"}, {"t": 68.11666666666666, "x": "フィラエは、そのあと二時間近く宙を漂い、"}, {"t": 71.11666666666666, "x": "最初に触れた場所から一キロメートル"}, {"t": 73.56666666666666, "x": "あまり離れたところで止まりました。"}, {"t": 75.5, "x": "まわりを崖に囲まれ、日がほとんど差さない場所でした。"}, {"t": 79.13333333333334, "x": "どこに止まったのかは、地上の誰にも、"}, {"t": 81.71666666666667, "x": "はっきりとは分かりませんでした。"}, {"t": 83.86666666666666, "x": "その姿が写真で確かめられたのは、"}, {"t": 86.11666666666666, "x": "着陸の日から数えて六百六十日後です。"}, {"t": 89.41666666666667, "x": "フィラエを運んできた母船、ロゼッタの"}, {"t": 92.0, "x": "運用が終わる、二十八日前のことでした。"}, {"t": 95.05, "x": "この回では、一つの彗星の上に残された、"}, {"t": 98.16666666666667, "x": "二つの機械の記録を読んでいきます。"}, {"t": 100.75, "x": "崖の影に転がった小さな着陸機と、最後に"}, {"t": 104.11666666666666, "x": "自分も彗星へ降りていった母船の記録です。"}, {"t": 106.83333333333333, "x": "話は、一九六九年の秋にさかのぼります。"}, {"t": 110.78333333333333, "x": "場所は、いまのカザフスタンにあった、"}, {"t": 113.11666666666666, "x": "アルマアタの天体物理学研究所の天文台です。"}, {"t": 116.85, "x": "ウクライナのキエフから、天文学者の一団が来ていました。"}, {"t": 120.66666666666667, "x": "目的は、すでに知られている彗星を観測し、"}, {"t": 124.0, "x": "あわせて新しい彗星を探すことです。"}, {"t": 126.88333333333334, "x": "調査を率いていたのは、クリム・チュリュモフ。"}, {"t": 129.76666666666668, "x": "一緒に観測していたのが、スベトラーナ・"}, {"t": 132.46666666666667, "x": "ゲラシメンコです。"}, {"t": 133.51666666666668, "x": "方法は、写真でした。"}, {"t": 135.45, "x": "同じ空の同じところを、二十分から"}, {"t": 138.13333333333333, "x": "三十分おいて、二回写します。"}, {"t": 140.68333333333334, "x": "星は動きませんが、彗星は少しずつ位置を変えます。"}, {"t": 144.51666666666668, "x": "二枚を見比べて、ずれている点を探すのです。"}, {"t": 147.9, "x": "九月十一日に撮られた一枚に、問題がありました。"}, {"t": 151.76666666666668, "x": "現像の途中で失敗があり、写真の"}, {"t": 154.48333333333332, "x": "濃さにむらが出ていたのです。"}, {"t": 156.08333333333334, "x": "写真の作業を受け持っていた助手は、"}, {"t": 158.21666666666667, "x": "その乾板を捨てようとしました。"}, {"t": 160.45, "x": "止めたのは、研究所の教授でした。"}, {"t": 163.05, "x": "出来の悪い乾板からでも、役に"}, {"t": 165.41666666666666, "x": "立つ情報が見つかることがある。"}, {"t": 167.28333333333333, "x": "そう言って、残しておくように伝えたと、"}, {"t": 170.03333333333333, "x": "ヨーロッパ宇宙機関の記事は書いています。"}, {"t": 172.81666666666666, "x": "その乾板には、目当ての彗星、"}, {"t": 175.25, "x": "コマス・ソラ彗星が写っていました。"}, {"t": 177.71666666666667, "x": "ところが、測ってみると、ぼんやりした"}, {"t": 180.51666666666668, "x": "光の点は、コマス・ソラ彗星のあるはずの"}, {"t": 183.46666666666667, "x": "位置から、二度近く離れていました。"}, {"t": 185.86666666666667, "x": "一団がキエフに戻ってから、"}, {"t": 187.6, "x": "ほかの乾板も調べなおしました。"}, {"t": 190.03333333333333, "x": "すると、同じ天体の像が、さらに四つ見つかりました。"}, {"t": 194.23333333333332, "x": "知られていない、新しい彗星でした。"}, {"t": 197.01666666666668, "x": "むらのある乾板を捨てていれば、"}, {"t": 198.83333333333334, "x": "この発見はなかったかもしれません。"}, {"t": 201.33333333333334, "x": "少なくとも、この年、この二人の"}, {"t": 204.18333333333334, "x": "名前で記録されることはなかったはずです。"}, {"t": 206.6, "x": "名前は、見つけた二人から取られました。"}, {"t": 209.43333333333334, "x": "チュリュモフ・ゲラシメンコ彗星です。"}, {"t": 211.53333333333333, "x": "二人は、その後も長く連絡を取り合いました。"}, {"t": 214.71666666666667, "x": "晩年は、主にインターネットでやりとりしていたと、"}, {"t": 217.93333333333334, "x": "ヨーロッパ宇宙機関の記事は書いています。"}, {"t": 220.7, "x": "この彗星は、およそ六年半で太陽を一周します。"}, {"t": 224.51666666666668, "x": "アメリカ航空宇宙局ジェット推進研究所の"}, {"t": 227.4, "x": "軌道の記録では、一周は二千三百五十日です。"}, {"t": 231.11666666666667, "x": "太陽に最も近づくときは、約一億八千六百万キロメートル。"}, {"t": 235.88333333333333, "x": "地球の軌道と火星の軌道のあいだです。"}, {"t": 238.43333333333334, "x": "最も遠ざかるときは、八億五千万キロメートルを"}, {"t": 242.01666666666668, "x": "超え、木星の軌道の外側まで出ていきます。"}, {"t": 245.2, "x": "本体の大きさは、差しわたし四キロメートルほど。"}, {"t": 248.6, "x": "富士山の高さと、あまり変わりません。"}, {"t": 251.36666666666667, "x": "それほどの大きさでも、地球の望遠鏡から見れば、"}, {"t": 254.83333333333334, "x": "ぼんやりした光のしみにしか見えません。"}, {"t": 257.5, "x": "まわりにガスやちりがまとわりつき、"}, {"t": 259.55, "x": "本体の形も、表面も分かりません。"}, {"t": 262.68333333333334, "x": "捨てられかけた一枚の乾板に"}, {"t": 264.53333333333336, "x": "写った、形の分からない光のしみ。"}, {"t": 267.3, "x": "三十年あまりのち、この彗星に、"}, {"t": 270.01666666666665, "x": "ヨーロッパの探査機が向かうことになります。"}, {"t": 272.8, "x": "ただし、はじめから"}, {"t": 274.31666666666666, "x": "行き先だったわけではありませんでした。"}, {"t": 276.46666666666664, "x": "探査機の名前は、ロゼッタ。"}, {"t": 278.65, "x": "名前は、ロゼッタ・ストーンから取られています。"}, {"t": 281.6, "x": "一七九九年に、エジプトのナイル川の河口近くで"}, {"t": 285.78333333333336, "x": "見つかった、重さ七百六十二キログラムの石の板です。"}, {"t": 289.76666666666665, "x": "古代エジプトの文字とギリシャ語が並べて刻まれていて、"}, {"t": 292.96666666666664, "x": "古代エジプトの文字を読み解く鍵になりました。"}, {"t": 296.06666666666666, "x": "ヨーロッパ宇宙機関は、この名前をこう説明しています。"}, {"t": 300.0, "x": "石の板が古い文明を解く鍵になったように、探査機は、"}, {"t": 303.8, "x": "太陽系で最も古い材料である彗星の謎を解いていく。"}, {"t": 307.85, "x": "着陸機のフィラエという名前も、エジプトから来ています。"}, {"t": 311.53333333333336, "x": "ナイル川にあった、フィラエという島の名前です。"}, {"t": 314.75, "x": "最初の行き先は、別の彗星でした。"}, {"t": 317.6166666666667, "x": "ウィルタネン彗星。"}, {"t": 318.8666666666667, "x": "打ち上げは、二〇〇三年の一月に予定されていました。"}, {"t": 322.6333333333333, "x": "ところが、その一か月ほど前、"}, {"t": 324.85, "x": "二〇〇二年十二月十一日に、事故が起きます。"}, {"t": 328.6333333333333, "x": "アリアン5という大型ロケットの、力を強めた"}, {"t": 331.81666666666666, "x": "新しい型が、初めての打ち上げで失敗したのです。"}, {"t": 335.4166666666667, "x": "調べが済むまで、アリアン5は飛べなくなりました。"}, {"t": 338.8, "x": "ロゼッタを載せるはずのロケットも、同じアリアン5です。"}, {"t": 342.43333333333334, "x": "打ち上げは見送られました。"}, {"t": 344.1666666666667, "x": "彗星へ向かう探査機は、決まった時期に"}, {"t": 346.8666666666667, "x": "出発しなければ、相手に追いつけません。"}, {"t": 349.71666666666664, "x": "予定の時期を逃したロゼッタには、"}, {"t": 351.76666666666665, "x": "新しい行き先が要りました。"}, {"t": 353.93333333333334, "x": "選ばれたのが、チュリュモフ・ゲラシメンコ彗星です。"}, {"t": 357.18333333333334, "x": "これまでと同じ型のアリアン5で、"}, {"t": 359.1666666666667, "x": "届けることができる相手でした。"}, {"t": 361.4, "x": "二〇〇四年三月二日、ロゼッタは打ち上げられました。"}, {"t": 365.1333333333333, "x": "打ち上げのときの重さは、三千キログラム。"}, {"t": 368.23333333333335, "x": "そのうち千六百七十キログラムが、"}, {"t": 370.5833333333333, "x": "進む向きを変えるための推進剤です。"}, {"t": 373.35, "x": "両側に長さ十四メートルの太陽電池の板を広げ、"}, {"t": 376.9, "x": "端から端までは三十二メートルになります。"}, {"t": 379.9, "x": "積んでいる観測装置は、十一種類。"}, {"t": 382.75, "x": "そのうちいくつかは、アメリカ航空宇宙局が"}, {"t": 385.81666666666666, "x": "作ったものでした。"}, {"t": 386.9166666666667, "x": "計画全体にかかった費用は、十四億ユーロ近く。"}, {"t": 390.71666666666664, "x": "そのうち二億二千万ユーロが、"}, {"t": 392.6, "x": "着陸機フィラエの分だとされています。"}, {"t": 395.25, "x": "地球から最も離れたときには、命令が"}, {"t": 398.1166666666667, "x": "探査機に届くまで、最大で五十分かかります。"}, {"t": 401.48333333333335, "x": "ただ、ロケットの力だけでは、彗星には届きません。"}, {"t": 405.51666666666665, "x": "ロゼッタは、惑星のそばを通って、"}, {"t": 408.03333333333336, "x": "その重力で速さを上げていきました。"}, {"t": 410.68333333333334, "x": "二〇〇五年、二〇〇七年、二〇〇九年に地球のそばを、"}, {"t": 414.93333333333334, "x": "二〇〇七年には火星のそばを通っています。"}, {"t": 417.8833333333333, "x": "途中、二〇〇八年と二〇一〇年には、"}, {"t": 420.73333333333335, "x": "小惑星のそばも通り過ぎました。"}, {"t": 423.23333333333335, "x": "一つ目はシュタインス、二つ目は"}, {"t": 425.48333333333335, "x": "ルテティアという小惑星です。"}, {"t": 427.28333333333336, "x": "地球のそばを三回、火星のそばを"}, {"t": 429.8333333333333, "x": "一回、小惑星のそばを二回。"}, {"t": 432.26666666666665, "x": "まっすぐ向かえば近いはずの相手に、"}, {"t": 434.3833333333333, "x": "遠回りを重ねて近づいていきました。"}, {"t": 437.06666666666666, "x": "そして二〇一一年六月八日、ロゼッタは眠りにつきました。"}, {"t": 441.5, "x": "太陽から遠く離れると、太陽電池で"}, {"t": 444.3833333333333, "x": "作れる電気が足りなくなります。"}, {"t": 446.25, "x": "そこで、ほとんどの装置を止めて、"}, {"t": 448.65, "x": "太陽のもとへ戻ってくるのを待ったのです。"}, {"t": 451.48333333333335, "x": "眠っていた期間は、三十一か月。"}, {"t": 454.23333333333335, "x": "そのあいだ、地上からロゼッタの"}, {"t": 456.3666666666667, "x": "様子を知る手段はありませんでした。"}, {"t": 458.45, "x": "二〇一四年一月二十日、ロゼッタは、"}, {"t": 461.3333333333333, "x": "あらかじめ決めておいた時刻に、"}, {"t": 463.53333333333336, "x": "自分で目を覚ましたとされています。"}, {"t": 465.9, "x": "地上がその信号を受け取ったとき、彗星までの"}, {"t": 469.1666666666667, "x": "残りの道のりは、あと半年あまりでした。"}, {"t": 472.1, "x": "二〇一四年の五月から八月にかけて、"}, {"t": 474.75, "x": "ロゼッタは十回、エンジンを噴きました。"}, {"t": 477.8333333333333, "x": "彗星に対する速さを、一秒間に七百七十五メートルから、"}, {"t": 482.3666666666667, "x": "一秒間に一メートルまで落とすためです。"}, {"t": 485.25, "x": "一秒間に一メートルは、人が歩くほどの速さです。"}, {"t": 488.9166666666667, "x": "どの一回をしくじっても、計画はそこで終わる、と"}, {"t": 492.5833333333333, "x": "ヨーロッパ宇宙機関は書いています。"}, {"t": 494.6666666666667, "x": "そして二〇一四年八月六日、ロゼッタは彗星の"}, {"t": 498.35, "x": "表面から百キロメートルのところに着きました。"}, {"t": 501.1166666666667, "x": "地球からは四億五百万キロメートル。"}, {"t": 503.68333333333334, "x": "彗星は、時速五万五千キロメートル近い"}, {"t": 506.8, "x": "速さで、太陽のほうへ向かっていました。"}, {"t": 509.51666666666665, "x": "この日、ヨーロッパ宇宙機関の長官は、"}, {"t": 512.3666666666667, "x": "旅の長さを数字で言いました。"}, {"t": 514.65, "x": "十年と五か月と四日。"}, {"t": 516.35, "x": "その末に、ようやく「着いた」と言える、という言葉です。"}, {"t": 521.25, "x": "近づくにつれて、形が見えてきました。"}, {"t": 524.15, "x": "一万二千キロメートルほど手前から"}, {"t": 526.3333333333334, "x": "撮った画像に、その形が写っていました。"}, {"t": 529.1833333333333, "x": "大きな塊と小さな塊が、細い"}, {"t": 531.9666666666667, "x": "首のような部分でつながっています。"}, {"t": 534.05, "x": "水に浮かぶアヒルのおもちゃに"}, {"t": 535.6666666666666, "x": "似ている、と言われた形です。"}, {"t": 537.8333333333334, "x": "のちの測定では、全体の長さは約四・三キロメートル。"}, {"t": 542.0, "x": "大きいほうの塊が体積の三分の二ほど、"}, {"t": 544.8166666666667, "x": "小さいほうが四分の一あまりを占めます。"}, {"t": 547.7333333333333, "x": "十二時間あまりで一回転しています。"}, {"t": 550.1833333333333, "x": "重さを大きさで割ると、一立方メートルあたり"}, {"t": 553.5, "x": "約五百三十キログラム。"}, {"t": 555.2, "x": "水のおよそ半分の重さです。"}, {"t": 557.1666666666666, "x": "中の七割ほどがすき間だと見積もられています。"}, {"t": 560.0833333333334, "x": "この形の上の、どこに着陸機を降ろすのか。"}, {"t": 563.4833333333333, "x": "地上のチームは、まず十か所の候補を選び、"}, {"t": 566.5666666666667, "x": "アルファベットのエーからジェイまでの記号を付けました。"}, {"t": 569.7666666666667, "x": "八月の終わりには、それを五か所に絞りました。"}, {"t": 573.1333333333333, "x": "このとき使われたのは、ロゼッタがまだ彗星から"}, {"t": 576.25, "x": "百キロメートルほど離れていたころのデータです。"}, {"t": 578.95, "x": "九月十二日、ジェイと呼ばれた場所が、"}, {"t": 581.7333333333333, "x": "全員一致で第一候補に決まりました。"}, {"t": 584.5666666666667, "x": "小さいほうの塊、アヒルで言えば頭の部分にあります。"}, {"t": 588.5166666666667, "x": "第二候補には、大きいほうの塊にある、"}, {"t": 591.5166666666667, "x": "シーと呼ばれる場所が選ばれました。"}, {"t": 593.9166666666666, "x": "降ろし方も、二通り用意されました。"}, {"t": 596.6333333333333, "x": "ジェイなら、彗星の中心から二十二・"}, {"t": 599.2166666666667, "x": "五キロメートルで切り離し、七時間かけて降ろす。"}, {"t": 602.8833333333333, "x": "シーなら、十二・五キロメートルで"}, {"t": 605.3666666666667, "x": "切り離し、四時間ほどで降ろす。"}, {"t": 607.7833333333333, "x": "当日使われたのは、ジェイのほうの計画です。"}, {"t": 611.0666666666667, "x": "ジェイが選ばれた理由は、斜面の多くが"}, {"t": 613.6333333333333, "x": "三十度より緩く、大きな岩が比較的少ないこと。"}, {"t": 617.3666666666667, "x": "そして、太陽電池に十分な光が当たることでした。"}, {"t": 621.1166666666667, "x": "彗星が一回転する十二・四時間のうち、"}, {"t": 624.0666666666667, "x": "七時間近く日が当たる見込みでした。"}, {"t": 626.6666666666666, "x": "十月、この場所に名前を付ける募集が行われました。"}, {"t": 630.55, "x": "受付は、十月十六日から二十二日までの一週間です。"}, {"t": 634.95, "x": "案は、ヨーロッパ宇宙機関と、ドイツ、フランス、"}, {"t": 638.9666666666667, "x": "イタリアの宇宙機関で受け付けられました。"}, {"t": 641.7333333333333, "x": "集まったのは、約八千三百。"}, {"t": 644.3, "x": "ドイツ航空宇宙センターの記録にある数です。"}, {"t": 647.2166666666667, "x": "名前は何でもよいが、人の名前は使えない。"}, {"t": 650.4, "x": "選ばれた案を出した人は、着陸の日に"}, {"t": 653.1, "x": "ダルムシュタットの管制センターへ招かれる。"}, {"t": 655.5166666666667, "x": "そういう決まりでした。"}, {"t": 656.9, "x": "選ばれた名前は、アギルキア。"}, {"t": 659.1333333333333, "x": "ナイル川の島の名前です。"}, {"t": 660.9833333333333, "x": "もともとフィラエ島にあった神殿は、ダムの"}, {"t": 663.8, "x": "建設で、島ごと水に沈むことになりました。"}, {"t": 667.0833333333334, "x": "そこで神殿は、一九八〇年、"}, {"t": 669.9666666666667, "x": "近くのアギルキア島へ移されました。"}, {"t": 672.6166666666667, "x": "着陸機フィラエの名前と、つながりのある島です。"}, {"t": 676.0666666666667, "x": "百五十人を超える人が、この名前を出していました。"}, {"t": 679.7333333333333, "x": "ただ、決まるまでは、ぎりぎりの争いでした。"}, {"t": 683.1166666666667, "x": "二番目になった案は、アビドス。"}, {"t": 685.5, "x": "ナイル川沿いにあった古い都市の名前です。"}, {"t": 688.1166666666667, "x": "差は、たった一点だったと記録されています。"}, {"t": 691.1166666666667, "x": "一点差で選ばれなかったその名前は、このあと、"}, {"t": 694.3, "x": "別の場所に付けられることになります。"}, {"t": 696.85, "x": "フィラエには、地面にしがみつくための"}, {"t": 699.2666666666667, "x": "仕掛けが三つありました。"}, {"t": 700.7166666666667, "x": "一つ目は、三本の脚の先に付いた、氷に食い込むねじです。"}, {"t": 705.3666666666667, "x": "二つ目は、二本の銛です。"}, {"t": 707.55, "x": "着地した瞬間に地面へ撃ち込み、"}, {"t": 709.6666666666666, "x": "ひもで体を引き寄せる仕組みでした。"}, {"t": 712.2, "x": "三つ目は、上向きにガスを噴き出す装置です。"}, {"t": 715.4, "x": "着地の瞬間に体を地面へ押しつけ、"}, {"t": 717.9666666666667, "x": "跳ね返らないようにする役目がありました。"}, {"t": 720.7833333333333, "x": "着陸地点の名前の募集には、"}, {"t": 722.8333333333334, "x": "銛にちなんだ案も寄せられていました。"}, {"t": 725.4, "x": "銛を打ち込まれた鯨の物語から取った、"}, {"t": 728.1, "x": "モビー・ディックという名前です。"}, {"t": 730.1333333333333, "x": "着陸機が二本の銛で体をつなぎとめるから、という"}, {"t": 733.7333333333333, "x": "理由でした。"}, {"t": 734.5, "x": "彗星の重力は、とても弱いものです。"}, {"t": 737.4666666666667, "x": "何もしなければ、軽く触れただけで、"}, {"t": 740.0333333333333, "x": "体が浮き上がってしまいます。"}, {"t": 742.1333333333333, "x": "三つの仕掛けは、そのためのものでした。"}, {"t": 744.85, "x": "ところが、着陸の日の未明、分離の"}, {"t": 747.8, "x": "前の最後の点検で、ガスを噴く装置がうまく"}, {"t": 751.0166666666667, "x": "動かないことが分かったとされています。"}, {"t": 753.15, "x": "直す手立ては、ありませんでした。"}, {"t": 755.5166666666667, "x": "チームは、そのまま進めると決めました。"}, {"t": 758.3, "x": "フィラエを受け持つドイツ航空宇宙センターの"}, {"t": 760.7833333333333, "x": "責任者は、着陸の前から、これは"}, {"t": 763.7833333333333, "x": "大きな挑戦になる、と話していました。"}, {"t": 766.5, "x": "ねらいの範囲は、差しわたし"}, {"t": 768.5166666666667, "x": "一キロメートルほどの楕円です。"}, {"t": 770.3333333333334, "x": "その中にも、岩や斜面があります。"}, {"t": 772.9, "x": "十一月十二日、世界時の八時三十五分。"}, {"t": 776.5833333333334, "x": "ロゼッタは、彗星の中心から二十二・"}, {"t": 779.3166666666667, "x": "五キロメートルのところで、フィラエを切り離しました。"}, {"t": 782.8833333333333, "x": "ここから先、フィラエは自分で進む向きを変えられません。"}, {"t": 786.6666666666666, "x": "切り離された勢いと、彗星の弱い重力に"}, {"t": 789.9333333333333, "x": "まかせて、七時間かけて落ちていきます。"}, {"t": 792.6666666666666, "x": "降りていく途中、フィラエは下向きのカメラで、"}, {"t": 795.5666666666667, "x": "近づいてくる地面を撮り続けました。"}, {"t": 798.1666666666666, "x": "十五時三十四分。"}, {"t": 799.7, "x": "フィラエは、ねらった場所から"}, {"t": 801.55, "x": "数十メートルのところに触れました。"}, {"t": 803.7, "x": "降下そのものは、ほぼ計画どおりでした。"}, {"t": 806.6166666666667, "x": "しかし、銛は撃ち出されませんでした。"}, {"t": 809.2833333333333, "x": "ガスを噴く装置も、動きませんでした。"}, {"t": 812.0166666666667, "x": "脚のねじだけでは、体を止めておけませんでした。"}, {"t": 815.3833333333333, "x": "フィラエは、跳ね返りました。"}, {"t": 817.4833333333333, "x": "一秒間に三十八センチメートルほどの、"}, {"t": 820.15, "x": "ゆっくりとした速さです。"}, {"t": 821.9666666666667, "x": "重力が弱いため、そのまま落ちてこずに、"}, {"t": 824.85, "x": "一時間五十分ものあいだ、宙を進み続けました。"}, {"t": 828.75, "x": "十六時二十分ごろ、フィラエは"}, {"t": 831.0, "x": "崖のふちにぶつかったと考えられています。"}, {"t": 833.5, "x": "そこから体が回りはじめ、二度目に"}, {"t": 836.1333333333333, "x": "触れる場所へ向かっていきました。"}, {"t": 837.9, "x": "十七時二十五分、二度目の接地。"}, {"t": 840.7166666666667, "x": "フィラエはそこで、二分近くのあいだに、"}, {"t": 843.35, "x": "少なくとも四回、地面に当たりました。"}, {"t": 846.4833333333333, "x": "そこから、一秒間に三センチメートルほどで、"}, {"t": 849.6833333333333, "x": "もう一度小さく跳ねます。"}, {"t": 851.6166666666667, "x": "十七時三十二分、フィラエは止まりました。"}, {"t": 854.7166666666667, "x": "最初に触れた場所から、一キロメートル"}, {"t": 857.4, "x": "あまり離れていました。"}, {"t": 858.7166666666667, "x": "フィラエの運用を受け持つ部屋は、"}, {"t": 860.5666666666667, "x": "ドイツのケルンにありました。"}, {"t": 862.4666666666667, "x": "そこでも、ダルムシュタットでも、地上に届いていたのは、"}, {"t": 866.25, "x": "この出来事の、およそ二十八分遅れの記録です。"}, {"t": 870.15, "x": "十六時三分に「触れた」という知らせを"}, {"t": 873.4333333333333, "x": "受け取ったときには、フィラエはすでに宙にいました。"}, {"t": 876.5, "x": "知らせの根拠になったのは、"}, {"t": 878.1333333333333, "x": "フィラエの脚にある感知器でした。"}, {"t": 880.3833333333333, "x": "最初に触れたとき、脚が押し込まれたことを"}, {"t": 883.3666666666667, "x": "記録していたのです。"}, {"t": 884.5666666666667, "x": "ただ、そのあと体が浮き上がったことまでは、"}, {"t": 887.41666 6666666667, "x": "同じ日の夜、二十二時十九分、交信が戻ります。"}, {"t": 1001.0666666666667, "x": "電池は、残りわずかでした。"}, {"t": 1003.2166666666667, "x": "最後にチームは、フィラエの体を"}, {"t": 1005.5333333333333, "x": "四センチメートルほど持ち上げ、三十五度回しました。"}, {"t": 1009.1833333333333, "x": "わずかでも多く、太陽電池に光を当てるためです。"}, {"t": 1012.8166666666667, "x": "送られてきた記録の中には、写真、"}, {"t": 1015.35, "x": "地面の近くのガスや物質を調べた結果、"}, {"t": 1018.4666666666667, "x": "そして地面を掘る装置の記録がありました。"}, {"t": 1021.3666666666667, "x": "十一月十五日の零時三十六分、"}, {"t": 1023.9666666666667, "x": "フィラエからの通信が途絶えました。"}, {"t": 1026.35, "x": "最後の交信までに、いくつもの"}, {"t": 1028.7, "x": "装置が記録を地上へ送り終えていました。"}, {"t": 1031.3166666666666, "x": "写真、物質の分析、地面の下を通った電波の記録です。"}, {"t": 1036.0166666666667, "x": "彗星の上で過ごした時間は、五十七時間近く。"}, {"t": 1039.7666666666667, "x": "予定していた観測のうち、約八割を終えていたと、"}, {"t": 1043.3666666666666, "x": "ヨーロッパ宇宙機関はのちに書いています。"}, {"t": 1046.1333333333334, "x": "ここから、フィラエは眠りに入りました。"}, {"t": 1048.85, "x": "太陽電池で作れる電気は、わずかです。"}, {"t": 1051.8333333333333, "x": "それが、体を温め、装置を動かせるほどになるまで、"}, {"t": 1056.05, "x": "目を覚ますことはできません。"}, {"t": 1057.9666666666667, "x": "フィラエの装置が動くには、中の温度が"}, {"t": 1060.6666666666667, "x": "零下四十五度より高くなる必要がありました。"}, {"t": 1063.55, "x": "彗星は、太陽に近づいていく途中でした。"}, {"t": 1066.7333333333333, "x": "近づけば、日差しは強くなります。"}, {"t": 1069.3, "x": "チームは、その時を待つことにしました。"}, {"t": 1072.1, "x": "フィラエが最後に止まった場所には、"}, {"t": 1074.05, "x": "のちに名前が付けられました。"}, {"t": 1076.15, "x": "アビドス。"}, {"t": 1077.2666666666667, "x": "着陸地点の名前を決めるとき、"}, {"t": 1079.3333333333333, "x": "一点差で選ばれなかった、あの名前です。"}, {"t": 1082.65, "x": "二〇一五年三月、ロゼッタは、眠っている"}, {"t": 1086.15, "x": "フィラエに向けて、耳をすませはじめました。"}, {"t": 1089.0, "x": "フィラエからの声が届いたのは、それから三か月後です。"}, {"t": 1092.7166666666667, "x": "二〇一五年六月十三日、中央"}, {"t": 1095.7, "x": "ヨーロッパ夏時間の二十二時二十八分。"}, {"t": 1098.2666666666667, "x": "フィラエは、ロゼッタを経由して、地上の"}, {"t": 1101.3166666666666, "x": "チームと八十五秒のあいだ、交信しました。"}, {"t": 1104.5, "x": "七か月ぶりの信号でした。"}, {"t": 1106.5, "x": "中の温度は、零下三十五度。"}, {"t": 1108.9333333333334, "x": "使える電気は、二十四ワット。"}, {"t": 1111.45, "x": "届いたデータの中身は、三百を"}, {"t": 1113.8333333333333, "x": "超える記録のまとまりでした。"}, {"t": 1115.5333333333333, "x": "そこには、フィラエの過去の記録も含まれていました。"}, {"t": 1118.9333333333334, "x": "それを読むと、フィラエはこれより"}, {"t": 1121.1, "x": "前にも目を覚ましていた。"}, {"t": 1122.5833333333333, "x": "けれども、ロゼッタと交信できなかった、ということが"}, {"t": 1126.3666666666666, "x": "分かりました。"}, {"t": 1127.1666666666667, "x": "のちのまとめでは、フィラエが目を覚ましたのは、"}, {"t": 1130.0333333333333, "x": "四月二十六日だったとされています。"}, {"t": 1132.75, "x": "そこから一か月半、声は誰にも届いていませんでした。"}, {"t": 1136.65, "x": "フィラエの記憶装置には、まだ送られていない"}, {"t": 1139.55, "x": "記録が、八千以上残っていました。"}, {"t": 1142.15, "x": "そのあと数週間のうちに、フィラエからは、"}, {"t": 1144.9333333333334, "x": "さらに七回の信号が届きました。"}, {"t": 1147.55, "x": "六月十四日、十九日、二十日、"}, {"t": 1150.6833333333334, "x": "二十一日、二十三日、二十四日。"}, {"t": 1154.5666666666666, "x": "そして、七月九日です。"}, {"t": 1156.8666666666666, "x": "どれも短く、途切れがちでした。"}, {"t": 1159.3166666666666, "x": "観測の命令を送り込めるほど、"}, {"t": 1161.4166666666667, "x": "安定したつながりにはなりませんでした。"}, {"t": 1164.1333333333334, "x": "そして、七月九日を最後に、"}, {"t": 1166.65, "x": "フィラエは何も言わなくなりました。"}, {"t": 1168.9166666666667, "x": "八月十三日、彗星は太陽に最も近づきました。"}, {"t": 1173.1333333333334, "x": "約一億八千六百万キロメートル。"}, {"t": 1175.75, "x": "このころ、フィラエの中の温度は"}, {"t": 1177.9166666666667, "x": "零度ほどまで上がっていたと見られています。"}, {"t": 1180.2833333333333, "x": "ただ、太陽に近づいた彗星は、最も活発になります。"}, {"t": 1184.7333333333333, "x": "表面からガスとちりが勢いよく吹き出すため、"}, {"t": 1187.5166666666667, "x": "ロゼッタは、安全のために彗星から"}, {"t": 1190.4833333333333, "x": "離れていなければなりませんでした。"}, {"t": 1192.45, "x": "ロゼッタは、ふだんは彗星から"}, {"t": 1194.5833333333333, "x": "十キロメートルほどまで近づくこともありました。"}, {"t": 1197.3333333333333, "x": "けれども、この時期には、二百キロメートルより"}, {"t": 1200.6333333333334, "x": "遠くから観測することもありました。"}, {"t": 1202.8, "x": "フィラエとの交信には、遠すぎる距離です。"}, {"t": 1205.75, "x": "ロゼッタのほうは、そのあいだも観測を続けていました。"}, {"t": 1209.35, "x": "彗星から出てくる水を調べると、重い水素を"}, {"t": 1212.6666666666667, "x": "含む水の割合が、地球の海の三倍を超えていました。"}, {"t": 1216.5333333333333, "x": "地球の海の水が、主にこの種の"}, {"t": 1219.15, "x": "彗星から来たとは考えにくい、という結果です。"}, {"t": 1222.3, "x": "のちには、生き物の体を作る材料の一つ、アミノ酸の"}, {"t": 1226.6, "x": "グリシンも、彗星のまわりから見つかっています。"}, {"t": 1229.6666666666667, "x": "フィラエは、黙ったままでした。"}, {"t": 1231.85, "x": "二〇一六年一月、チームは最後の"}, {"t": 1234.7333333333333, "x": "手段として、フィラエの中の回転する部品を"}, {"t": 1237.7666666666667, "x": "動かす命令を送ったとされています。"}, {"t": 1239.95, "x": "揺すって、太陽電池の向きやほこりの"}, {"t": 1242.6, "x": "具合が変わらないか、という試みでした。"}, {"t": 1245.4166666666667, "x": "返事はありませんでした。"}, {"t": 1246.9833333333333, "x": "二〇一六年二月、ヨーロッパ宇宙機関は、"}, {"t": 1250.2333333333333, "x": "一つの言葉を伝えました。"}, {"t": 1252.2666666666667, "x": "フィラエを受け持つドイツ航空宇宙センターの"}, {"t": 1254.8166666666666, "x": "責任者の言葉です。"}, {"t": 1256.2166666666667, "x": "フィラエがチームと交信できる見込みは、"}, {"t": 1258.5, "x": "残念ながらゼロに近づいている。"}, {"t": 1260.85, "x": "七月二十七日、ロゼッタの中で、フィラエとの通信を"}, {"t": 1265.2333333333333, "x": "受け持っていた装置の電源が切られたとされています。"}, {"t": 1268.1666666666667, "x": "太陽から五億二千万キロメートルほど離れ、ロゼッタの"}, {"t": 1271.9166666666667, "x": "電気が一日に四ワットずつ減っていく時期でした。"}, {"t": 1274.8166666666666, "x": "残りの二か月の観測に、少しでも"}, {"t": 1277.5333333333333, "x": "多くの電気を回すためでした。"}, {"t": 1279.3333333333333, "x": "それまでは、万が一フィラエが声を上げたときのために、"}, {"t": 1282.9, "x": "電源を入れたままにしてあったのです。"}, {"t": 1285.3666666666666, "x": "フィラエの声を待つ耳は、これで閉じられました。"}, {"t": 1288.6166666666666, "x": "けれども、フィラエがどこにいるのかは、"}, {"t": 1290.9666666666667, "x": "まだ写真で確かめられていませんでした。"}, {"t": 1293.6666666666667, "x": "手がかりは、ありました。"}, {"t": 1295.5666666666666, "x": "フィラエとロゼッタのあいだでは、着陸のあとの"}, {"t": 1298.4333333333334, "x": "数日間、電波のやりとりが行われていました。"}, {"t": 1301.8, "x": "彗星の本体を通り抜ける電波で、"}, {"t": 1304.1666666666667, "x": "中の様子を調べるための観測です。"}, {"t": 1306.9833333333333, "x": "ロゼッタが電波を送ると、フィラエがそれを"}, {"t": 1309.7666666666667, "x": "受け取り、すぐに新しい電波を送り返します。"}, {"t": 1312.9833333333333, "x": "電波が本体を通るとき、通る場所によって、"}, {"t": 1316.1666666666667, "x": "届く時間や強さが変わります。"}, {"t": 1318.4833333333333, "x": "電波が届くまでの時間を測れば、"}, {"t": 1320.6166666666666, "x": "二機のあいだの距離が分かります。"}, {"t": 1322.8833333333334, "x": "見通しがきいているときの距離と、"}, {"t": 1324.8666666666666, "x": "本体を通り抜けたときの距離。"}, {"t": 1327.1333333333334, "x": "それを重ね合わせると、フィラエがいそうな"}, {"t": 1329.85, "x": "場所を絞り込めます。"}, {"t": 1331.15, "x": "着陸から間もないころ、候補は、長さ三百五十メートル、"}, {"t": 1335.5166666666667, "x": "幅三十メートルほどの細長い帯だとされました。"}, {"t": 1338.95, "x": "二〇一五年六月には、その範囲は、"}, {"t": 1341.75, "x": "およそ十六メートルかける百六十メートルの"}, {"t": 1344.8333333333333, "x": "楕円にまで狭められました。"}, {"t": 1346.4333333333334, "x": "ただ、これは、ここにいるはずだ、という範囲です。"}, {"t": 1350.2833333333333, "x": "写真に写ったわけではありません。"}, {"t": 1352.35, "x": "ロゼッタのカメラで探すと、候補になる"}, {"t": 1354.9833333333333, "x": "明るい点は、いくつも見つかりました。"}, {"t": 1357.5833333333333, "x": "けれども、どれも画面の上では数ピクセルの大きさです。"}, {"t": 1361.3, "x": "フィラエの体は、差しわたし一メートルほど。"}, {"t": 1364.35, "x": "遠くから撮った画像では、岩の"}, {"t": 1366.5333333333333, "x": "かけらと見分けがつきませんでした。"}, {"t": 1368.5, "x": "もっと近づいて撮れば、分かるかもしれません。"}, {"t": 1371.5, "x": "しかし、彗星が活発な時期には、"}, {"t": 1374.1, "x": "ロゼッタは近づけませんでした。"}, {"t": 1376.3, "x": "太陽から離れ、ガスとちりが落ち着いてきて、"}, {"t": 1379.35, "x": "ようやく低いところを飛べるようになります。"}, {"t": 1382.1166666666666, "x": "二〇一六年の夏には、表面から十キロメートルより"}, {"t": 1385.8833333333334, "x": "ずっと低いところを飛んでいたとされています。"}, {"t": 1388.3, "x": "それでも、はっきりした姿は写りませんでした。"}, {"t": 1391.55, "x": "その時期は、ロゼッタの運用の"}, {"t": 1393.7166666666667, "x": "終わりが近づく時期と、重なっていました。"}, {"t": 1396.4833333333333, "x": "二〇一六年九月二日。"}, {"t": 1398.4166666666667, "x": "ロゼッタは、彗星の表面から"}, {"t": 1400.7166666666667, "x": "二・七キロメートルのところを通りました。"}, {"t": 1403.3166666666666, "x": "細かい画像を撮るカメラが、その範囲を写しました。"}, {"t": 1406.8666666666666, "x": "一つの画素が、五センチメートルにあたる細かさです。"}, {"t": 1410.35, "x": "そこに、フィラエが写っていました。"}, {"t": 1412.7, "x": "暗い割れ目に、はまり込むようにして止まっていました。"}, {"t": 1416.0333333333333, "x": "一メートルほどの本体と、三本の"}, {"t": 1418.6333333333334, "x": "脚のうち二本が見えていました。"}, {"t": 1420.5, "x": "写真から、フィラエの体の向きも分かりました。"}, {"t": 1423.65, "x": "それを見れば、着陸のあと交信がなぜあれほど"}, {"t": 1426.8333333333333, "x": "難しかったのかが、はっきりする、と"}, {"t": 1429.6, "x": "ヨーロッパ宇宙機関は書いています。"}, {"t": 1431.6666666666667, "x": "着陸の日から、六百六十日。"}, {"t": 1434.45, "x": "発表は、九月五日でした。"}, {"t": 1436.7, "x": "カメラのチームの研究者は、こう話しています。"}, {"t": 1439.9666666666667, " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
