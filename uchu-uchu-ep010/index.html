<script>
const D={"name": "ep010", "file": "ep010", "dur": 1991.36665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇一九年一月一日、世界時の五時三十三分。"}, {"t": 4.35, "x": "太陽から六十億キロメートルあまり離れた暗がりで、"}, {"t": 7.65, "x": "一機の探査機が、長さ三十五キロメートルほどの"}, {"t": 11.25, "x": "小さな氷のかたまりの横を通り過ぎました。"}, {"t": 14.0, "x": "そのとき、地球でそれを見ていた者はいません。"}, {"t": 17.233333333333334, "x": "見られなかった、と言ったほうが正確です。"}, {"t": 20.116666666666667, "x": "探査機からの電波は、光の速さで進んでも、"}, {"t": 23.333333333333332, "x": "地球に届くまでに六時間あまりかかりました。"}, {"t": 26.483333333333334, "x": "しかも探査機は、通り過ぎるまで、"}, {"t": 28.883333333333333, "x": "撮った画像を地球へ送りませんでした。"}, {"t": 31.533333333333335, "x": "撮ることを先にする計画だったからです。"}, {"t": 34.05, "x": "通り過ぎたあとも、画像はすぐには届きませんでした。"}, {"t": 37.65, "x": "一日に送れる量には限りがあり、全部を"}, {"t": 40.68333333333333, "x": "地球に下ろし終えるまでには、二〇二〇年の"}, {"t": 43.766666666666666, "x": "終わりごろまでかかる見込みだとされました。"}, {"t": 46.03333333333333, "x": "探査機の名前は、ニューホライズンズ。"}, {"t": 47.18333333333333, "x": "ニューホライズンズ█"}, {"t": 48.63333333333333, "x": "通り過ぎた天体は、いまはアロコスと呼ばれています。"}, {"t": 50.3, "x": "アロコス█"}, {"t": 52.1, "x": "人類が宇宙船を近づけて撮った"}, {"t": 54.13333333333333, "x": "天体のうち、これが最も遠いものです。"}, {"t": 57.06666666666667, "x": "そして、カイパーベルトと呼ばれる帯の"}, {"t": 57.65, "x": "カイパーベルト█"}, {"t": 59.56666666666667, "x": "中で、近くから形を撮れた小さな天体は、"}, {"t": 62.78333333333333, "x": "いまのところこれ一つしかありません。"}, {"t": 65.18333333333334, "x": "帯の中には、直径百キロメートルを超えるものだけで、"}, {"t": 68.86666666666666, "x": "数十万個あると見積もられています。"}, {"t": 71.41666666666667, "x": "そのうち、形が分かるほど近くに寄れたのは、"}, {"t": 74.55, "x": "冥王星とその衛星を別にすれば、この一つだけです。"}, {"t": 78.75, "x": "しかも、そのアロコスでさえ、写っているのは半分です。"}, {"t": 82.78333333333333, "x": "この回では、冥王星のさらに先に広がる帯と、そこで"}, {"t": 86.98333333333333, "x": "たった一度だけ行われた接近の記録を読んでいきます。"}, {"t": 90.33333333333333, "x": "何が写り、何が写らず、写らなかった部分が"}, {"t": 93.98333333333333, "x": "どうやって「分かった」ことにされたのかを、"}, {"t": 97.06666666666666, "x": "残っている記録の範囲で並べます。"}, {"t": 99.56666666666666, "x": "最初に、この帯がいつから知られていたのかを"}, {"t": 102.53333333333333, "x": "確かめておきます。"}, {"t": 103.7, "x": "カイパーベルトという名前は、天文学者の"}, {"t": 106.55, "x": "ジェラルド・カイパーから来ています。"}, {"t": 108.36666666666666, "x": "カイパーは一九五一年の論文で、冥王星より"}, {"t": 112.36666666666666, "x": "外側にある天体について考えを述べました。"}, {"t": 115.23333333333333, "x": "それより前、一九四〇年代には、ケネス・エッジワースも"}, {"t": 119.66666666666667, "x": "冥王星の外にある天体について書いています。"}, {"t": 122.53333333333333, "x": "そのため、エッジワース・カイパーベルトと"}, {"t": 125.65, "x": "呼ばれることもあります。"}, {"t": 126.98333333333333, "x": "ただ、それは考えの話でした。"}, {"t": 129.45, "x": "実物は、長いあいだ一つも見つかっていませんでした。"}, {"t": 133.08333333333334, "x": "そのあいだに、帯のある方角へ向かって、"}, {"t": 135.85, "x": "二機の探査機が飛んでいきました。"}, {"t": 138.1, "x": "一九七七年に打ち上げられた、ボイジャー一号と二号です。"}, {"t": 140.56666666666666, "x": "ボイジャー█"}, {"t": 142.85, "x": "NASAの記録には、二機が観測装置を"}, {"t": 145.6, "x": "いつ止めたかが一つずつ書かれています。"}, {"t": 147.81666666666666, "x": "撮影装置の項には、こうあります。"}, {"t": 150.6, "x": "ボイジャー二号、一九八九年十月十日と"}, {"t": 154.26666666666668, "x": "十二月五日、広角と狭角のカメラを停止。"}, {"t": 157.75, "x": "電力節約のため。"}, {"t": 159.3, "x": "ボイジャー一号、一九九〇年二月十四日、"}, {"t": 162.96666666666667, "x": "広角と狭角のカメラを停止。"}, {"t": 165.41666666666666, "x": "電力節約のため。"}, {"t": 166.96666666666667, "x": "一号がカメラを止めた日は、"}, {"t": 168.66666666666666, "x": "有名な写真が撮られた日でもあります。"}, {"t": 171.38333333333333, "x": "太陽から六十億キロメートルほどの位置から"}, {"t": 174.06666666666666, "x": "振り返って、地球を小さな点として写した一枚です。"}, {"t": 177.83333333333334, "x": "それが、一号のカメラが撮った"}, {"t": 180.05, "x": "最後の写真の一つになりました。"}, {"t": 182.11666666666667, "x": "六十億キロメートルというのは、"}, {"t": 184.06666666666666, "x": "太陽と地球の距離のおよそ四十倍です。"}, {"t": 187.05, "x": "いまの知識で言えば、そこはもう、"}, {"t": 189.3, "x": "カイパーベルトが広がっている距離でした。"}, {"t": 192.0, "x": "つまりボイジャーは、帯のあたりを、"}, {"t": 194.28333333333333, "x": "目を閉じて通り過ぎていたことになります。"}, {"t": 197.0, "x": "ただ、カメラを止めた一九九〇年の時点では、"}, {"t": 200.46666666666667, "x": "帯にどんな天体があるのか、そもそも本当に"}, {"t": 203.88333333333333, "x": "帯があるのかも、まだ確かめられていませんでした。"}, {"t": 207.0, "x": "最初の一つが望遠鏡で見つかったのは、"}, {"t": 209.55, "x": "その二年後の、一九九二年です。"}, {"t": 211.51666666666668, "x": "一九九二年█"}, {"t": 212.96666666666667, "x": "仮の符号は、一九九二キュービーワン。"}, {"t": 216.28333333333333, "x": "見つけたのは、デビッド・ジューイットと"}, {"t": 218.46666666666667, "x": "ジェーン・ルーの二人で、翌年、"}, {"t": 220.48333333333332, "x": "科学誌ネイチャーに「カイパーベルト天体の"}, {"t": 223.66666666666666, "x": "候補の発見」という題で報告しました。"}, {"t": 226.61666666666667, "x": "冥王星は、それより前の一九三〇年に見つかっていました。"}, {"t": 231.2, "x": "いまでは冥王星も、この帯に"}, {"t": 233.45, "x": "属する天体の一つとして数えられています。"}, {"t": 236.16666666666666, "x": "一九九二年の発見は、冥王星が"}, {"t": 239.48333333333332, "x": "一人きりではなかったことを示した、最初の一件でした。"}, {"t": 243.16666666666666, "x": "そこから、見つかる数は増えていきました。"}, {"t": 245.96666666666667, "x": "NASAの解説によれば、登録された"}, {"t": 248.46666666666667, "x": "天体は二千個を超えています。"}, {"t": 250.35, "x": "それでも、あると考えられている"}, {"t": 252.63333333333333, "x": "数のほんの一部にすぎません。"}, {"t": 254.46666666666667, "x": "帯の範囲も、おおよそ決められています。"}, {"t": 257.23333333333335, "x": "内側の端は、太陽から地球までの"}, {"t": 259.98333333333335, "x": "距離の約三十倍、海王星の軌道のあたり。"}, {"t": 263.26666666666665, "x": "主な部分は、その約五十倍の"}, {"t": 265.7, "x": "あたりで終わるとされてきました。"}, {"t": 267.5, "x": "その外側には、さらに遠くまで散らばった天体の"}, {"t": 270.8, "x": "群れが、約千倍の距離まで続いています。"}, {"t": 273.71666666666664, "x": "中身はどうか。"}, {"t": 274.8666666666667, "x": "直径百キロメートルを超えるものが数十万個。"}, {"t": 277.98333333333335, "x": "もっと小さいものは、さらに多いと考えられています。"}, {"t": 281.56666666666666, "x": "数は多いのですが、全部を集めても、重さは"}, {"t": 285.15, "x": "地球の十分の一を超えないと見積もられています。"}, {"t": 288.1666666666667, "x": "数十万個という数字は、望遠鏡で"}, {"t": 291.0, "x": "見えた一部から、全体を見積もった数です。"}, {"t": 294.05, "x": "一つ一つを数えた人はいません。"}, {"t": 296.23333333333335, "x": "そして、見つかった二千個あまりの大半は、"}, {"t": 299.1666666666667, "x": "地球の望遠鏡から見ると、ただの光の点です。"}, {"t": 303.01666666666665, "x": "形も、色の濃淡も、表面の様子も写りません。"}, {"t": 307.15, "x": "帯の天体は小さく、暗く、遠すぎるからです。"}, {"t": 311.1166666666667, "x": "ボイジャーは目を閉じて通り過ぎ、"}, {"t": 312.96666666666664, "x": "望遠鏡には点しか映らない。"}, {"t": 315.3333333333333, "x": "一九九〇年代から二〇一〇年代まで、"}, {"t": 318.3833333333333, "x": "カイパーベルトの天体は、そういうものでした。"}, {"t": 321.71666666666664, "x": "ニューホライズンズが打ち上げられたのは、"}, {"t": 323.81666666666666, "x": "二〇〇六年一月十九日です。"}, {"t": 324.55, "x": "二〇〇六年一月十九日█"}, {"t": 326.3833333333333, "x": "目的地は冥王星でした。"}, {"t": 328.28333333333336, "x": "重さは四百七十八キログラム。"}, {"t": 330.6666666666667, "x": "太陽から遠く、太陽電池では電気が足りないため、"}, {"t": 334.3333333333333, "x": "放射性物質の熱で電気を作る装置を積んでいます。"}, {"t": 338.15, "x": "土星探査機カッシーニの予備として作られたものでした。"}, {"t": 341.4166666666667, "x": "打ち上げのときに約二百五十ワット、冥王星に"}, {"t": 344.9, "x": "着くころには約二百ワットに減る設計です。"}, {"t": 347.6, "x": "木星の重力を借りて速度を上げ、"}, {"t": 349.9, "x": "九年半かけて冥王星に着きました。"}, {"t": 352.68333333333334, "x": "二〇一五年七月十四日、冥王星の地表から"}, {"t": 352.68333333333334, "x": "二〇一五年七月十四日█"}, {"t": 356.4, "x": "約七千八百キロメートルのところを通過しています。"}, {"t": 359.6333333333333, "x": "冥王星については、一つだけ記録を引いておきます。"}, {"t": 363.3666666666667, "x": "冥王星とその衛星で集めたデータは、"}, {"t": 365.8833333333333, "x": "全部で約六・二五ギガバイトでした。"}, {"t": 368.76666666666665, "x": "これを地球に送り終えるのに、"}, {"t": 370.6166666666667, "x": "十五か月以上かかっています。"}, {"t": 372.8833333333333, "x": "完了は二〇一六年十月二十五日。"}, {"t": 375.8, "x": "探査機から地球まで、光の速さで約四時間半。"}, {"t": 379.43333333333334, "x": "一秒間に送れるのは、一千ビットから二千ビットでした。"}, {"t": 383.4166666666667, "x": "冥王星を通り過ぎたあとも、"}, {"t": 385.35, "x": "探査機には燃料が少し残る計画でした。"}, {"t": 388.5, "x": "その燃料で進路を少しだけ曲げ、"}, {"t": 390.68333333333334, "x": "帯の中の別の天体にもう一度近づく。"}, {"t": 393.71666666666664, "x": "探査チームは、冥王星に着く前から、"}, {"t": 396.5, "x": "その相手を探していました。"}, {"t": 398.51666666666665, "x": "問題は、行き先が決まっていなかったことです。"}, {"t": 401.6166666666667, "x": "探査機はすでに、決まった方角へ、"}, {"t": 404.1, "x": "決まった速さで飛んでいます。"}, {"t": 406.0833333333333, "x": "残った燃料で曲げられる角度は、わずかです。"}, {"t": 409.3333333333333, "x": "その狭い範囲の中に、ちょうどいい時期にちょうどいい"}, {"t": 412.5833333333333, "x": "場所を通る天体がなければ、行き先はありません。"}, {"t": 415.8833333333333, "x": "しかも、その範囲にある帯の天体は、"}, {"t": 418.55, "x": "どれも小さく、暗いものばかりです。"}, {"t": 421.55, "x": "候補探しに使われたのが、ハッブル宇宙望遠鏡でした。"}, {"t": 423.45, "x": "ハッブル宇宙望遠鏡█"}, {"t": 425.5, "x": "二〇一四年六月二十六日、探査チームの"}, {"t": 428.95, "x": "一員だったマーク・ビュイが、ハッブルの"}, {"t": 431.31666666666666, "x": "画像の中に、一つの暗い点を見つけました。"}, {"t": 434.3833333333333, "x": "探索の中で付けられた番号は、一一一〇一一三ワイ。"}, {"t": 438.8, "x": "仲間内では短く「イレブン」と"}, {"t": 441.68333333333334, "x": "呼ばれていたとされています。"}, {"t": 443.23333333333335, "x": "二〇一四年十月に行き先の候補として"}, {"t": 445.8333333333333, "x": "発表されたときには、候補の一番目という意味で、"}, {"t": 449.21666666666664, "x": "ピーティーワンと呼ばれたとされています。"}, {"t": 451.5833333333333, "x": "二〇一五年三月には、正式な仮符号として、"}, {"t": 455.1666666666667, "x": "二〇一四エムユー六十九が付いたとされています。"}, {"t": 458.73333333333335, "x": "NASAの解説は、この天体をこう書いています。"}, {"t": 462.0, "x": "候補の中で、最も暗く、最も小さかった。"}, {"t": 465.9, "x": "しかし、ミッションの期限の中で、最も行きやすかった。"}, {"t": 469.95, "x": "いちばん見栄えのする相手ではなく、いちばん手の"}, {"t": 473.06666666666666, "x": "届く相手が選ばれた、ということです。"}, {"t": 475.76666666666665, "x": "二〇一五年の秋、冥王星を通り過ぎたあと、"}, {"t": 479.3, "x": "探査機はエンジンを噴いて、"}, {"t": 481.23333333333335, "x": "進路をこの暗い点のほうへ曲げました。"}, {"t": 483.85, "x": "ただ、行き先が決まっても、相手のことは"}, {"t": 486.95, "x": "ほとんど分かっていませんでした。"}, {"t": 488.68333333333334, "x": "ハッブルで見えるのは、点だけです。"}, {"t": 491.15, "x": "大きさは、明るさから推し量るしかありません。"}, {"t": 494.3, "x": "どのくらい光を反射する表面なのかが"}, {"t": 496.7, "x": "分からなければ、大きさも決まりません。"}, {"t": 499.31666666666666, "x": "形は、まったく分かりませんでした。"}, {"t": 501.93333333333334, "x": "どこにあるのかも、ぴったりとは分かっていませんでした。"}, {"t": 505.3333333333333, "x": "探査機を数千キロメートルの距離まで寄せるには、"}, {"t": 508.23333333333335, "x": "相手の位置を、それより細かく知っておく必要があります。"}, {"t": 512.3666666666667, "x": "点を何度か撮っただけでは、"}, {"t": 513.9833333333333, "x": "その精度には足りませんでした。"}, {"t": 516.2, "x": "そこで探査チームは、もう一つ別の"}, {"t": 518.8, "x": "方法を使うことにしました。"}, {"t": 520.5333333333333, "x": "相手が、遠くの星の前を横切る瞬間を待つ方法です。"}, {"t": 524.7, "x": "小さな天体が、遠くの星の前を横切ると、"}, {"t": 528.0, "x": "その星の光が、ほんの一瞬だけ消えます。"}, {"t": 531.4, "x": "これを掩蔽と呼びます。"}, {"t": 531.8333333333334, "x": "掩蔽█"}, {"t": 533.0166666666667, "x": "地上のあちこちに望遠鏡を並べておけば、"}, {"t": 535.6666666666666, "x": "ある場所では星が消え、ある場所では"}, {"t": 538.5333333333333, "x": "消えない、という違いが出ます。"}, {"t": 540.65, "x": "消えた場所と、消えた長さを並べていけば、"}, {"t": 543.5166666666667, "x": "天体の影の形を、地面の上に写しとることができます。"}, {"t": 547.8833333333333, "x": "写真には写らない大きさの天体でも、影の形なら測れる。"}, {"t": 552.1666666666666, "x": "それが、この方法の考え方です。"}, {"t": 554.9, "x": "ただし、条件は厳しいものでした。"}, {"t": 557.6333333333333, "x": "相手は直径数十キロメートル。"}, {"t": 559.8166666666667, "x": "影が地球の上を横切る幅も、"}, {"t": 561.9333333333333, "x": "それと同じくらいしかありません。"}, {"t": 564.15, "x": "影が通る時刻と場所を先に正確に"}, {"t": 566.5166666666667, "x": "予測しておかなければ、望遠鏡を並べても、"}, {"t": 569.6, "x": "影は外れた場所を通り過ぎてしまいます。"}, {"t": 572.4666666666667, "x": "それを可能にしたのは、ヨーロッパ宇宙機関の"}, {"t": 575.4333333333333, "x": "衛星ガイアが作っていた、星の位置の一覧でした。"}, {"t": 575.8333333333334, "x": "ガイア█"}, {"t": 578.9, "x": "探査チームは、正式に公開される前の"}, {"t": 581.7333333333333, "x": "版を使うことができ、それで影の通り道を"}, {"t": 584.8666666666667, "x": "細かく予測したと、論文に書いています。"}, {"t": 587.8333333333334, "x": "最初の挑戦は、二〇一七年六月三日でした。"}, {"t": 589.15, "x": "二〇一七年六月三日█"}, {"t": 591.6166666666667, "x": "アルゼンチン北部と南アフリカに、持ち運べる"}, {"t": 594.8, "x": "望遠鏡を二十五か所に置き、固定された望遠鏡も"}, {"t": 598.4833333333333, "x": "加えて、星が消える瞬間を待ちました。"}, {"t": 601.35, "x": "星は、一つの観測点でも消えませんでした。"}, {"t": 604.5666666666667, "x": "検出はゼロです。"}, {"t": 605.8666666666667, "x": "影は、並べた望遠鏡のどこにもかかりませんでした。"}, {"t": 609.55, "x": "ただ、何も写らなかったこと自体も記録として残りました。"}, {"t": 613.4833333333333, "x": "この範囲には環やちりはなかった、という"}, {"t": 616.1833333333333, "x": "意味での記録です。"}, {"t": 617.3166666666667, "x": "二回目は、同じ年の七月十日。"}, {"t": 620.1666666666666, "x": "今度は地上ではなく、空の上からでした。"}, {"t": 623.2666666666667, "x": "大型の旅客機に望遠鏡を積んだ空飛ぶ天文台、"}, {"t": 626.5833333333334, "x": "ソフィアが、影の通り道の上を飛びました。"}, {"t": 626.6833333333333, "x": "ソフィア█"}, {"t": 629.95, "x": "得られたのは、影のふちをかすめた、"}, {"t": 632.3666666666667, "x": "ごく短い一本の記録だけでした。"}, {"t": 634.95, "x": "三回目は、その一週間後の二〇一七年七月十七日。"}, {"t": 637.35, "x": "二〇一七年七月十七日█"}, {"t": 639.55, "x": "場所は、アルゼンチンの南部です。"}, {"t": 641.9166666666666, "x": "観測点は二十四か所。"}, {"t": 643.7666666666667, "x": "影の通り道を横切るように、"}, {"t": 645.7666666666667, "x": "望遠鏡が一列に並べられました。"}, {"t": 648.45, "x": "このとき、五つの観測点で、星が消えました。"}, {"t": 652.25, "x": "五本の線が、影を横切って引かれたことになります。"}, {"t": 655.85, "x": "それぞれの線の長さを並べると、"}, {"t": 657.95, "x": "影の形が浮かび上がりました。"}, {"t": 660.2666666666667, "x": "全体でおよそ縦二十キロメートル、横三十キロメートル。"}, {"t": 664.3166666666667, "x": "そして、一つの丸ではありませんでした。"}, {"t": 667.15, "x": "二つの丸がくっついたような、くびれのある形でした。"}, {"t": 670.7333333333333, "x": "この時点では、探査機はまだ一年半先を飛んでいました。"}, {"t": 674.6666666666666, "x": "誰もその天体を近くから見たことはありません。"}, {"t": 677.5833333333334, "x": "それでも、星の光が消えた長さだけから、二つの"}, {"t": 681.35, "x": "丸がくっついているらしい、というところまでは"}, {"t": 684.25, "x": "分かっていました。"}, {"t": 685.2166666666667, "x": "四回目は、二〇一八年八月四日。"}, {"t": 688.35, "x": "二十二か所に望遠鏡が置かれ、二本の記録が得られました。"}, {"t": 692.4833333333333, "x": "四回の挑戦で分かったのは、おおよその大きさと"}, {"t": 695.7333333333333, "x": "形、周りに環やちりが見つからないこと。"}, {"t": 698.6833333333333, "x": "そして探査機にとって最も大事な、"}, {"t": 700.8333333333334, "x": "天体の細かい位置でした。"}, {"t": 702.85, "x": "この位置の情報があったので、探査機は、目標から"}, {"t": 706.55, "x": "三千五百キロメートルあまりという近さまで"}, {"t": 709.1166666666667, "x": "寄せることができ、しかもカメラの視野の中に天体を"}, {"t": 712.5166666666667, "x": "きちんと収めることができた、と後の論文は書いています。"}, {"t": 716.25, "x": "同じころ、この天体には愛称が付けられました。"}, {"t": 719.6666666666666, "x": "二〇一八年三月、一般から寄せられた"}, {"t": 722.7833333333333, "x": "案の中から、「ウルティマ・"}, {"t": 724.4, "x": "トゥーレ」が選ばれたとされています。"}, {"t": 726.7333333333333, "x": "古い文学に出てくる、知られた世界の"}, {"t": 729.4, "x": "果てのさらに先、という意味の言葉です。"}, {"t": 732.2, "x": "のちに、この言葉が歴史の中で別の意味にも"}, {"t": 735.35, "x": "使われてきたことを指摘する声が上がりました。"}, {"t": 738.0166666666667, "x": "正式な名前は、フライバイのあとで、"}, {"t": 740.6, "x": "あらためて決められることになります。"}, {"t": 742.9833333333333, "x": "二〇一八年の年末、探査機は天体に"}, {"t": 746.1333333333333, "x": "向かって、最後の距離を詰めていました。"}, {"t": 748.8, "x": "十二月三十日、最接近の二日前。"}, {"t": 752.0666666666667, "x": "細かい画像を撮れるカメラ、"}, {"t": 753.7, "x": "ロリが、初めて天体の輪郭を捉えました。"}, {"t": 754.15, "x": "ロリ█"}, {"t": 757.1833333333333, "x": "それまでは点だったものが、"}, {"t": 758.75, "x": "ようやく細長い形として写った瞬間です。"}, {"t": 761.9166666666666, "x": "後の論文は、この時の輪郭を「ボウリングの"}, {"t": 765.5666666666667, "x": "ピンのような」と書いています。"}, {"t": 767.55, "x": "ところが、この先の画像は、"}, {"t": 769.6666666666666, "x": "すぐには地球に送られてきませんでした。"}, {"t": 772.4333333333333, "x": "探査機は撮ることに専念し、送るのは"}, {"t": 775.2333333333333, "x": "通り過ぎたあとに回す計画だったからです。"}, {"t": 777.85, "x": "そして、二〇一九年一月一日、"}, {"t": 778.6666666666666, "x": "二〇一九年一月一日█"}, {"t": 780.8833333333333, "x": "世界時の五時三十三分二十二秒。"}, {"t": 783.7833333333333, "x": "探査機は、天体の中心から"}, {"t": 785.65, "x": "三千五百三十八キロメートル█"}, {"t": 785.9833333333333, "x": "三千五百三十八キロメートルのところを通過しました。"}, {"t": 789.5166666666667, "x": "すれ違う速さは、一秒間に十四・四三キロメートル。"}, {"t": 793.6666666666666, "x": "東京から大阪までのおよそ四百キロメートルを、"}, {"t": 796.6666666666666, "x": "三十秒足らずで進む速さです。"}, {"t": 799.1833333333333, "x": "最も細かい画像が撮られたのは、天体から"}, {"t": 802.2333333333333, "x": "六千六百五十キロメートルのところでした。"}, {"t": 804.9666666666667, "x": "一つの画素が、地面の上の三十三メートル四方に"}, {"t": 808.5, "x": "あたります。"}, {"t": 809.1833333333333, "x": "ただし、論文はこの数字に但し書きを付けています。"}, {"t": 812.9166666666666, "x": "探査機が速く動いていたため画像は"}, {"t": 815.1333333333333, "x": "わずかにぶれ、光も弱かった。"}, {"t": 817.4333333333333, "x": "そのため、実際にどこまで細かく"}, {"t": 819.8333333333334, "x": "見分けられるかでいえば、別のカメラで"}, {"t": 822.2666666666667, "x": "撮った一画素百三十メートルの画像の、"}, {"t": 824.7333333333333, "x": "約二倍の細かさにとどまる、というものです。"}, {"t": 828.1166666666667, "x": "三十三メートルは、カメラの目盛りの数字です。"}, {"t": 831.4666666666667, "x": "実際に見分けられた細かさは、それよりも粗いものでした。"}, {"t": 835.3, "x": "最接近の前後に、形が分かる画像の"}, {"t": 838.2666666666667, "x": "撮影は三十回行われました。"}, {"t": 840.5333333333333, "x": "それが、この天体について、"}, {"t": 842.7, "x": "人類が持っているすべての画像です。"}, {"t": 845.2666666666667, "x": "最初の画像が地球に届いたのは、フライバイのあとでした。"}, {"t": 849.1333333333333, "x": "そこに写っていたのは、二つの丸い部分が"}, {"t": 851.9666666666667, "x": "くっついた、雪だるまのような形です。"}, {"t": 854.6833333333333, "x": "一年半前、アルゼンチンで星が消えた"}, {"t": 857.5166666666667, "x": "長さから推し量った形と、合っていました。"}, {"t": 860.5333333333333, "x": "チームは、大きいほうの丸を「ウルティマ」、"}, {"t": 863.6166666666667, "x": "小さいほうを「トゥーレ」と呼んだとされています。"}, {"t": 867.2833333333333, "x": "全体の長さは、およそ三十五キロメートル。"}, {"t": 870.4666666666667, "x": "二つの丸が、細いくびれでつながっています。"}, {"t": 873.5333333333333, "x": "色は赤く、冥王星よりも赤いものでした。"}, {"t": 876.7833333333333, "x": "データの受信は、その後も長く続きました。"}, {"t": 879.8333333333334, "x": "フライバイの一週間あまりあとにまとめられた"}, {"t": 882.3833333333333, "x": "最初の報告には、その時点で手元にあるのは"}, {"t": 885.5, "x": "四日分のデータだけだと記されています。"}, {"t": 887.8833333333333, "x": "最も細かい画像を含むデータが届き、それを"}, {"t": 891.1666666666666, "x": "使った論文がそろって出たのは、翌二〇二〇年の二月です。"}, {"t": 895.3, "x": "そのときも、全部を下ろし終えるには、"}, {"t": 897.9, "x": "二〇二〇年の終わりまでかかると書かれていました。"}, {"t": 901.1833333333333, "x": "撮影にかかったのは、最接近をはさんだ数日間です。"}, {"t": 905.1666666666666, "x": "それを受け取るのに、およそ二年かかりました。"}, {"t": 908.2333333333333, "x": "同じ二〇一九年の十一月、天体には"}, {"t": 911.55, "x": "正式な名前が付きました。"}, {"t": 913.25, "x": "アロコス。"}, {"t": 913.25, "x": "アロコス█"}, {"t": 914.3666666666667, "x": "アメリカ東部の、いまのバージニア州と"}, {"t": 916.9333333333333, "x": "メリーランド州の沿岸に暮らしてきたポウハタンの"}, {"t": 919.6, "x": "人々のことばで、「空」を意味するとされる言葉です。"}, {"t": 923.45, "x": "ハッブル望遠鏡の運用拠点も、探査機を作って"}, {"t": 926.8833333333333, "x": "動かしている研究所も、同じ地域にあったことから、"}, {"t": 930.3333333333334, "x": "この言葉が選ばれたとされています。"}, {"t": 932.7666666666667, "x": "NASAは、ポウハタンの部族の長老の"}, {"t": 935.25, "x": "同意を得て名前を決めたと書いています。"}, {"t": 937.55, "x": "ポウハタンの言葉は、十八世紀の"}, {"t": 940.05, "x": "終わりごろには話されなくなりました。"}, {"t": 942.15, "x": "残っているのは、十七世紀のはじめにイギリス人が"}, {"t": 945.6166666666667, "x": "書き留めた、短い単語の一覧だけだとされています。"}, {"t": 949.1333333333333, "x": "その一覧では「空」と訳されていますが、本来は「雲」を"}, {"t": 954.5833333333334, "x": "意味していた可能性もあると指摘されています。"}, {"t": 957.1666666666666, "x": "大きいほうの丸はウェヌ、小さいほうは"}, {"t": 958.2333333333333, "x": "ウェヌ█"}, {"t": 959.55, "x": "ウィーヨ█"}, {"t": 959.7666666666667, "x": "ウィーヨという正式な名前になりました。"}, {"t": 962.0666666666667, "x": "ウェヌは南アメリカのマプチェ語、ウィーヨは"}, {"t": 964.7333333333333, "x": "西アフリカのプラール語で、どちらも「空」を"}, {"t": 968.4166666666666, "x": "意味する言葉だとされています。"}, {"t": 970.1666666666666, "x": "名前は、写真の上で付けられていきました。"}, {"t": 973.1166666666667, "x": "ただ、その写真には、写っていない部分がありました。"}, {"t": 976.9166666666666, "x": "アロコスは、横倒しになって回っています。"}, {"t": 979.9166666666666, "x": "自転の軸が、公転する面に対して、九十八度傾いています。"}, {"t": 984.8833333333333, "x": "地球の軸の傾きが二十三度あまりですから、"}, {"t": 987.8166666666667, "x": "ほとんど寝転んだ状態です。"}, {"t": 989.9666666666667, "x": "一回転するのに、約十五・九時間かかります。"}, {"t": 993.55, "x": "軸が寝ていると、一方の極が長いあいだ太陽を向き続け、"}, {"t": 997.7166666666667, "x": "反対側の極はそのあいだずっと夜になります。"}, {"t": 1000.9333333333333, "x": "アロコスが太陽を一周するのには、"}, {"t": 1003.0833333333334, "x": "約二百九十三年かかります。"}, {"t": 1005.6, "x": "そして、探査機が通り過ぎた二〇一九年、アロコスは、"}, {"t": 1009.8666666666667, "x": "南極をほとんど真っすぐ太陽に向けていました。"}, {"t": 1013.0666666666667, "x": "加えて、探査機が近づいてきた方向も、"}, {"t": 1016.05, "x": "太陽の方向とほぼそろっていました。"}, {"t": 1018.6666666666666, "x": "つまり探査機は、太陽を背にして、"}, {"t": 1021.15, "x": "昼の側からまっすぐ近づいたことになります。"}, {"t": 1024.2166666666667, "x": "接近の最後の十数時間、探査機は天体を撮り続け、"}, {"t": 1028.2833333333333, "x": "自転一回ぶんの時間の八十五パーセントをカバーしました。"}, {"t": 1032.2, "x": "天体は探査機の目の前で、ほぼ一回転したことになります。"}, {"t": 1036.35, "x": "それでも、見えたのは片方の半球だけでした。"}, {"t": 1039.6166666666666, "x": "軸が探査機のほうを向いていたので、"}, {"t": 1041.7, "x": "いくら回っても、見えている面は同じ南側のままです。"}, {"t": 1045.9166666666667, "x": "北側は、回転の向こう側ではなく、"}, {"t": 1048.6833333333334, "x": "軸の反対側にありました。"}, {"t": 1050.85, "x": "回るのを待っても、こちらを向いてはくれません。"}, {"t": 1053.9333333333334, "x": "そしてそこは、長い冬の夜の中にありました。"}, {"t": 1057.2166666666667, "x": "二〇二六年に発表された形の解析は、"}, {"t": 1060.2833333333333, "x": "この点をはっきり書いています。"}, {"t": 1062.4166666666667, "x": "照らされていて、画像に写っていたのは、"}, {"t": 1065.1166666666666, "x": "南半分だけだった。"}, {"t": 1066.9166666666667, "x": "では、北半分の形はどうやって決めたのか。"}, {"t": 1070.1, "x": "答えは、第3章と同じ方法でした。"}, {"t": 1073.1, "x": "星が消えるかどうかです。"}, {"t": 1074.7333333333333, "x": "最接近を過ぎたあと、探査機はカメラを後ろに向け、"}, {"t": 1078.45, "x": "遠ざかっていく天体を振り返って撮りました。"}, {"t": 1081.95, "x": "このとき天体は、太陽の光を後ろから受けています。"}, {"t": 1085.7, "x": "探査機から見えるのは、ふちだけが"}, {"t": 1087.95, "x": "光る、細い三日月の形です。"}, {"t": 1090.3833333333334, "x": "二つの丸があるので、三日月も二つ並びます。"}, {"t": 1093.7166666666667, "x": "この振り返りの撮影では、全部で"}, {"t": 1096.25, "x": "三百三十六枚が撮られました。"}, {"t": 1098.4166666666667, "x": "そのうち、薄い二重の三日月が"}, {"t": 1100.8666666666666, "x": "写っていたのは、十三枚です。"}, {"t": 1103.1166666666666, "x": "光の当たっていない部分は、何も写りません。"}, {"t": 1106.35, "x": "けれども、その向こうには遠くの星があります。"}, {"t": 1109.5333333333333, "x": "暗い半分が星の前にかかれば、"}, {"t": 1111.6, "x": "その星は隠れて見えなくなります。"}, {"t": 1114.1166666666666, "x": "かからなければ、見えたままです。"}, {"t": 1116.4666666666667, "x": "研究チームは、写っている星の一つ一つについて、"}, {"t": 1120.1166666666666, "x": "隠れたか、隠れなかったかを調べました。"}, {"t": 1123.3666666666666, "x": "隠れた星の位置を結ぶと、暗い側が"}, {"t": 1126.2, "x": "どこまで張り出しているのかが分かります。"}, {"t": 1128.4166666666667, "x": "アルゼンチンの地上で待った方法を、今度は"}, {"t": 1131.3833333333334, "x": "探査機のカメラの中で行ったことになります。"}, {"t": 1134.1666666666667, "x": "分かったのは、厚みの限界でした。"}, {"t": 1136.7333333333333, "x": "北半分はここより厚くはない、"}, {"t": 1138.7166666666667, "x": "ここまでは張り出している、という幅です。"}, {"t": 1141.8166666666666, "x": "表面にどんなくぼみや盛り上がりがあるのかは、"}, {"t": 1144.5166666666667, "x": "分かりません。"}, {"t": 1145.6833333333334, "x": "二〇二六年の形の解析では、"}, {"t": 1148.0666666666666, "x": "北側の凹凸による形の不確かさは、最大で"}, {"t": 1151.8, "x": "一キロメートルほどだろうとされています。"}, {"t": 1154.0333333333333, "x": "図では、その部分が赤く塗られています。"}, {"t": 1156.8, "x": "凡例には、こう書かれています。"}, {"t": 1159.15, "x": "撮影されておらず、写っていないことからのみ"}, {"t": 1162.2833333333333, "x": "制約された領域。"}, {"t": 1163.6833333333334, "x": "この「見えていない半分」は、天体の"}, {"t": 1167.0, "x": "姿の理解そのものを一度変えています。"}, {"t": 1169.4333333333334, "x": "フライバイの翌月、二〇一九年の二月には、"}, {"t": 1172.8166666666666, "x": "振り返りの画像をもとに、アロコスは"}, {"t": 1175.5833333333333, "x": "雪だるまというより、平たいパンケーキのような"}, {"t": 1178.5333333333333, "x": "形だという見方が示されたとされています。"}, {"t": 1181.15, "x": "二〇二〇年に発表された形の"}, {"t": 1183.3166666666666, "x": "モデルも、平たく薄いものでした。"}, {"t": 1185.6833333333334, "x": "ところが、二〇二六年、すべての画像を新しい"}, {"t": 1189.6166666666666, "x": "方法で解析しなおしたモデルでは、アロコスは、"}, {"t": 1192.7833333333333, "x": "それより「はっきり厚く、体積も大きい」とされました。"}, {"t": 1197.5, "x": "小さいほうの丸はほぼ球に近く、大きいほうの丸は平たい。"}, {"t": 1201.8166666666666, "x": "体積の比は、ほぼ二対一です。"}, {"t": 1204.35, "x": "新しい写真が届いたわけではありません。"}, {"t": 1206.95, "x": "探査機はもう、はるか遠くを飛んでいます。"}, {"t": 1209.7833333333333, "x": "同じ三十本の撮影の記録を、別の方法で"}, {"t": 1213.25, "x": "読みなおしただけで、形が変わりました。"}, {"t": 1215.9666666666667, "x": "それだけ、写っていない部分が"}, {"t": 1218.2, "x": "大きかったということでもあります。"}, {"t": 1220.1333333333334, "x": "見えていない側の温度も、測られています。"}, {"t": 1223.05, "x": "探査機には、電波を使って天体の"}, {"t": 1225.6166666666666, "x": "温度を測る仕組みもありました。"}, {"t": 1227.4, "x": "通り過ぎたあとに夜の側を測ると、"}, {"t": 1229.6666666666667, "x": "温度は零下二百四十四度前後。"}, {"t": 1232.4666666666667, "x": "数字で言えば二十九ケルビン、"}, {"t": 1234.3333333333333, "x": "誤差はプラスマイナス五ケルビンです。"}, {"t": 1236.8166666666666, "x": "昼の側の平衡温度として予想されていた"}, {"t": 1239.4, "x": "約五十ケルビンより、ずっと低い値でした。"}, {"t": 1242.55, "x": "ただし電波は、表面より少し深いところから出てきます。"}, {"t": 1246.4333333333334, "x": "地下にまだ残っている温かさを拾っている"}, {"t": 1248.9166666666667, "x": "可能性がある、と考えられています。"}, {"t": 1251.5666666666666, "x": "写真には写らなかった北半分について、"}, {"t": 1254.0833333333333, "x": "いま手元にあるのは、星が隠れた位置と、"}, {"t": 1257.2666666666667, "x": "電波で測った温度の二つです。"}, {"t": 1259.6, "x": "北半分に、次に日が当たるのはいつなのか。"}, {"t": 1262.7166666666667, "x": "季節が約二百九十三年の公転に合わせて"}, {"t": 1265.7, "x": "巡ることは分かっていますが、その時期を"}, {"t": 1268.3333333333333, "x": "具体的に示した資料は、確認できていません。"}, {"t": 1271.5833333333333, "x": "いずれにせよ、そのとき近くにいる探査機は、ありません。"}, {"t": 1275.6333333333334, "x": "では、写っていた南半分には、何があったのか。"}, {"t": 1279.4333333333334, "x": "最初に目立つのは、傷の少なさです。"}, {"t": 1282.2166666666667, "x": "アロコスの表面には、衝突でできたくぼみ、"}, {"t": 1285.3, "x": "クレーターが、ほとんどありません。"}, {"t": 1287.8666666666666, "x": "月や水星の表面が、無数のクレーターで"}, {"t": 1290.9166666666667, "x": "覆われているのとは対照的です。"}, {"t": 1292.9833333333333, "x": "これは、帯の中での衝突が、とても少なく、"}, {"t": 1296.5333333333333, "x": "とても遅いからだと考えられています。"}, {"t": 1299.1666666666667, "x": "帯の天体は、ほぼ同じ向きに、"}, {"t": 1301.5666666666666, "x": "ゆっくりと太陽を回っています。"}, {"t": 1303.8333333333333, "x": "ぶつかることはまれで、ぶつかっても速さは"}, {"t": 1306.5, "x": "一秒間に三百メートルほどが多いとされます。"}, {"t": 1309.4333333333334, "x": "惑星の近くで起きる衝突に比べれば、ずっとおだやかです。"}, {"t": 1313.5666666666666, "x": "それでも、少ないクレーターの数を"}, {"t": 1315.9, "x": "数えることで、表面の年齢は推し量れます。"}, {"t": 1319.1666666666667, "x": "論文の見積もりは、約四十億年以上。"}, {"t": 1322.3666666666666, "x": "アロコスの表面は、太陽系ができたころの姿を"}, {"t": 1325.8333333333333, "x": "ほとんどそのまま保っている可能性が高い、とされました。"}, {"t": 1329.5, "x": "この古さは、アロコスが属している"}, {"t": 1331.9, "x": "群れの性質とも合っています。"}, {"t": 1333.6333333333334, "x": "アロコスは、「コールド・クラシカル」と"}, {"t": 1336.2833333333333, "x": "呼ばれる群れに属しています。"}, {"t": 1337.9833333333333, "x": "コールド、冷たいという言葉が"}, {"t": 1340.15, "x": "付いていますが、温度の話ではありません。"}, {"t": 1343.1, "x": "軌道の話です。"}, {"t": 1344.4166666666667, "x": "軌道がほぼ円く、傾きも小さい。"}, {"t": 1347.2833333333333, "x": "大きな惑星の重力で揺さぶられた跡がなく、"}, {"t": 1350.15, "x": "生まれたときからほぼ同じ場所を"}, {"t": 1352.3, "x": "回り続けてきたと考えられている群れです。"}, {"t": 1354.8833333333334, "x": "二つ目は、形そのものです。"}, {"t": 1357.1833333333334, "x": "二つの丸は、それぞれ別々にできたと考えられています。"}, {"t": 1361.1333333333334, "x": "さらに、それぞれの丸も、もっと小さなかたまりが"}, {"t": 1364.65, "x": "たくさん、ゆっくりと集まってできたらしいことが、"}, {"t": 1367.7333333333333, "x": "表面の模様から読み取られました。"}, {"t": 1370.1333333333334, "x": "大きいほうの丸の表面には、大きさのそろった"}, {"t": 1373.2666666666667, "x": "塊のような区画がいくつも並んでいます。"}, {"t": 1375.8333333333333, "x": "そうしてできた二つの丸は、しばらくのあいだ、"}, {"t": 1378.75, "x": "互いの周りを回っていたと考えられています。"}, {"t": 1381.8666666666666, "x": "やがて少しずつ近づき、ぶつかるというより、"}, {"t": 1384.9, "x": "そっと触れるようにしてくっついた。"}, {"t": 1387.1333333333334, "x": "くびれの部分がつぶれずに残っているのは、"}, {"t": 1389.55, "x": "合わさったときの速さが、"}, {"t": 1391.3666666666666, "x": "とても遅かったためだとされています。"}, {"t": 1393.7833333333333, "x": "太陽系の惑星は、小さなかたまりが"}, {"t": 1396.6, "x": "集まって大きくなったと考えられています。"}, {"t": 1399.1166666666666, "x": "ただ、その最初の段階、かたまりどうしが"}, {"t": 1402.25, "x": "どんなふうに集まったのかを、直接見られる"}, {"t": 1405.0333333333333, "x": "場所は、ほとんど残っていません。"}, {"t": 1407.1833333333334, "x": "惑星になったものは、そのあとの熱や"}, {"t": 1409.7833333333333, "x": "衝突で、はじめの姿を失っているからです。"}, {"t": 1413.0333333333333, "x": "アロコスは、その途中で止まったまま、"}, {"t": 1415.5, "x": "四十億年以上そこにあった、とされています。"}, {"t": 1419.1, "x": "三つ目は、色と成分です。"}, {"t": 1421.3166666666666, "x": "アロコスは赤い天体です。"}, {"t": 1423.1, "x": "冥王星よりも赤く、これまでに"}, {"t": 1425.5166666666667, "x": "探査機が訪れた外側の太陽系の天体の中で、"}, {"t": 1428.9, "x": "最も赤いとNASAは書いています。"}, {"t": 1431.2333333333333, "x": "表面の分析からは、メタノール、水の氷、そして"}, {"t": 1435.55, "x": "複雑な有機物の手がかりが見つかりました。"}, {"t": 1438.2666666666667, "x": "赤い色は、長いあいだ紫外線や"}, {"t": 1440.7333333333333, "x": "宇宙から降りそそぐ粒子を浴びて、表面の"}, {"t": 1443.6833333333334, "x": "物質が変わったためだと考えられています。"}, {"t": 1446.2, "x": "周りに、ほかの天体もありませんでした。"}, {"t": 1449.1, "x": "半径八千キロメートルの範囲に、直径百八十メートルを"}, {"t": 1453.25, "x": "超える衛星はなく、環も見つかりませんでした。"}, {"t": 1456.3833333333334, "x": "表面の地形には、少しずつ名前が付けられています。"}, {"t": 1460.0666666666666, "x": "国際天文学連合は二〇二〇年、アロコスの地形の"}, {"t": 1463.9666666666667, "x": "名前は、世界の過去と現在の言語の「空」という"}, {"t": 1468.1, "x": "言葉から取る、と決めたとされています。"}, {"t": 1470.6833333333334, "x": "小さいほうの丸にある大きなくぼみは、"}, {"t": 1473.0333333333333, "x": "英語で空を意味する「スカイ」。"}, {"t": 1475.6166666666666, "x": "二つの丸のつなぎめにある明るい帯は、"}, {"t": 1478.0666666666666, "x": "ベンガル語で空を意味する「アカサ」。"}, {"t": 1480.9333333333334, "x": "大きいほうの丸の真ん中を丸く囲む筋は、"}, {"t": 1483.65, "x": "マヤの言葉で空を意味する「カアン」と"}, {"t": 1487.0333333333333, "x": "名付けられたとされています。"}, {"t": 1488.5666666666666, "x": "写っていた南半分には、こうして空の名前が並んでいます。"}, {"t": 1492.7, "x": "写っていない北半分には、まだ一つもありません。"}, {"t": 1496.05, "x": "アロコスを過ぎたあとも、探査機は"}, {"t": 1498.3833333333334, "x": "帯の中を進み続けました。"}, {"t": 1500.25, "x": "近くを通るほかの天体を、遠くから撮る"}, {"t": 1503.0833333333333, "x": "観測は、冥王星の前後から始まっていました。"}, {"t": 1506.4666666666667, "x": "最初の例は、一九九四ジェイアールワンという天体です。"}, {"t": 1507.4833333333333, "x": "一九九四ジェイアールワン█"}, {"t": 1510.9, "x": "探査機は二〇一五年十一月に約二・八億キロメートル、"}, {"t": 1514.9333333333334, "x": "二〇一六年四月には約一億キロメートルの"}, {"t": 1518.3166666666666, "x": "距離から、この天体を撮りました。"}, {"t": 1520.65, "x": "太陽と地球の距離の〇・七一倍です。"}, {"t": 1523.4833333333333, "x": "冥王星以外の帯の天体を、これほど"}, {"t": 1526.35, "x": "近くから観測したのは初めてでした。"}, {"t": 1528.6833333333334, "x": "ただ、一億キロメートル離れていれば、"}, {"t": 1531.3333333333333, "x": "直径数十キロメートルの天体は、やはり光の点です。"}, {"t": 1535.6, "x": "形は写りません。"}, {"t": 1537.0, "x": "分かったのは、自転が約五・五時間であることなど、点の"}, {"t": 1541.2333333333333, "x": "明るさの変化から読み取れる性質でした。"}, {"t": 1543.7666666666667, "x": "そのあと、探査機は帯の中の五つの天体に、地球の"}, {"t": 1547.9333333333334, "x": "望遠鏡では届かない距離まで近づいて撮影しています。"}, {"t": 1551.4333333333334, "x": "距離は、太陽と地球の距離の〇・〇九二倍から〇・二九倍。"}, {"t": 1556.2666666666667, "x": "それでも、見分けられる細かさは、"}, {"t": 1558.5833333333333, "x": "百三十六キロメートルから四百三十キロメートルでした。"}, {"t": 1562.6, "x": "天体そのものの大きさより、見分けられる"}, {"t": 1565.3833333333334, "x": "細かさのほうが大きい、ということです。"}, {"t": 1568.1, "x": "表面は写りません。"}, {"t": 1569.5666666666666, "x": "それでも、分かったことはありました。"}, {"t": 1572.0166666666667, "x": "二〇一一ジェイワイサーティーワンと名付けられた"}, {"t": 1574.6333333333334, "x": "天体は、一つの点ではなく、二つの点でした。"}, {"t": 1578.35, "x": "明るさのほぼ等しい二つの天体が、"}, {"t": 1580.6333333333334, "x": "約百九十九キロメートル離れて、約一・"}, {"t": 1584.1166666666666, "x": "九四日で互いの周りを回っていました。"}, {"t": 1586.8166666666666, "x": "互いの周りを回る、二つの天体。"}, {"t": 1589.5833333333333, "x": "アロコスの二つの丸も、くっつく前は"}, {"t": 1592.1666666666667, "x": "こうだったと考えられています。"}, {"t": 1594.0, "x": "NASAは二〇二六年、フライバイのあと探査機が"}, {"t": 1597.3, "x": "観測した帯の天体は数十にのぼる、と書いています。"}, {"t": 1601.05, "x": "けれども、その中で形が写ったものは、"}, {"t": 1603.8333333333333, "x": "アロコスのほかにはありません。"}, {"t": 1605.8166666666666, "x": "もう一度、どれかに近づくことはできないのか。"}, {"t": 1608.9833333333333, "x": "探査チームは、地上の望遠鏡で、残りの"}, {"t": 1612.4, "x": "燃料で届く範囲の天体を探し続けています。"}, {"t": 1615.4166666666667, "x": "そこで使われている望遠鏡の一つが、"}, {"t": 1617.8833333333334, "x": "ハワイにある日本のすばる望遠鏡です。"}, {"t": 1619.4166666666667, "x": "すばる望遠鏡█"}, {"t": 1620.8, "x": "探査機の進む先は、夜空で言えば、"}, {"t": 1623.45, "x": "いて座の方角にあたります。"}, {"t": 1625.5333333333333, "x": "天の川の中でも星がとても込み合っていて、"}, {"t": 1628.2666666666667, "x": "暗い天体を見つけるのが難しい方角です。"}, {"t": 1631.5333333333333, "x": "二〇二四年の報告では、機械学習の技術を"}, {"t": 1635.1, "x": "使って大量の偽物の候補をふるい落とし、"}, {"t": 1637.8166666666666, "x": "二百三十九個の天体を見つけたとされています。"}, {"t": 1641.3, "x": "ただし、二〇二四年の時点で、"}, {"t": 1643.8833333333334, "x": "NASAは次のように書いています。"}, {"t": 1646.1166666666666, "x": "科学界は現在、到達できるカイパーベルト天体を"}, {"t": 1649.7833333333333, "x": "把握していない。"}, {"t": 1650.6833333333334, "x": "候補は見つかっていても、残りの燃料で進路を"}, {"t": 1653.8166666666666, "x": "曲げて届く相手は、まだ一つもない、という意味です。"}, {"t": 1657.55, "x": "その代わりに、別のことが分かり始めています。"}, {"t": 1660.7666666666667, "x": "すばる望遠鏡での探索では、太陽から"}, {"t": 1663.75, "x": "地球までの距離の七十倍より遠いところに、"}, {"t": 1666.5, "x": "予想よりも多くの天体が見つかりました。"}, {"t": 1669.3166666666666, "x": "帯は五十倍あたりで終わると"}, {"t": 1671.1, "x": "考えられてきたので、その外側にまだ天体がある"}, {"t": 1674.45, "x": "可能性が出てきたことになります。"}, {"t": 1676.4333333333334, "x": "もう一つの手がかりは、探査機に"}, {"t": 1678.7, "x": "積まれた、ちりを数える装置です。"}, {"t": 1681.15, "x": "この装置は、大学の学生たちが専門の技術者の"}, {"t": 1684.75, "x": "指導を受けて設計し、作ったものです。"}, {"t": 1687.5833333333333, "x": "NASAの惑星探査で、学生が"}, {"t": 1689.9, "x": "作った初めての科学機器でした。"}, {"t": 1691.9166666666667, "x": "二〇二四年の報告によれば、太陽からの距離が"}, {"t": 1695.4333333333334, "x": "四十五倍から五十五倍のあたりで、この装置が"}, {"t": 1698.7166666666667, "x": "数えたちりは、予想よりも多いものでした。"}, {"t": 1701.5666666666666, "x": "その後の報告では、六十一倍の距離まで、予想の"}, {"t": 1705.55, "x": "二倍から三倍という値が続いているとされています。"}, {"t": 1708.75, "x": "ちりは、帯の天体どうしがぶつかったり、"}, {"t": 1711.5, "x": "外からの細かい粒に削られたりしてできます。"}, {"t": 1714.6833333333334, "x": "天体の数が減っていくはずの場所で、ちりが減っていない。"}, {"t": 1718.3666666666666, "x": "NASAはこれについて、帯の外側の端が、"}, {"t": 1721.2666666666667, "x": "これまでの見積もりより数十億キロメートル先まで"}, {"t": 1724.6, "x": "延びているか、あるいは、知られている帯の外に、"}, {"t": 1728.0833333333333, "x": "もう一つ別の帯がある可能性がある、と書いています。"}, {"t": 1731.95, "x": "ただし、どれもまだ確定した話ではありません。"}, {"t": 1735.25, "x": "太陽の光に押されて内側のちりが外へ運ばれている"}, {"t": 1738.6666666666667, "x": "可能性など、ほかの説明も検討されています。"}, {"t": 1742.0166666666667, "x": "帯の外側には、まだ誰も形を見たことのない"}, {"t": 1745.2666666666667, "x": "天体が、あるのかもしれないし、ないのかもしれない。"}, {"t": 1749.1666666666667, "x": "いまの記録で言えるのは、そこまでです。"}, {"t": 1751.8833333333334, "x": "ニューホライズンズは、いまも飛び続けています。"}, {"t": 1754.9, "x": "二〇二四年十月一日、探査機は、太陽から"}, {"t": 1758.9666666666667, "x": "地球までの距離の六十倍の地点を越えました。"}, {"t": 1761.85, "x": "冥王星のそばを通ったときの、ちょうど二倍の遠さです。"}, {"t": 1765.6833333333334, "x": "一年に、約四億八千万キロメートルずつ遠ざかっています。"}, {"t": 1769.9, "x": "NASAは二〇二四年、この探査機の役目を少し変えました。"}, {"t": 1774.15, "x": "二〇二五会計年度からは、太陽から吹き出す"}, {"t": 1777.5166666666667, "x": "粒子の流れや、太陽の影響が及ぶ範囲の"}, {"t": 1780.6333333333334, "x": "外側の様子を調べることが中心になります。"}, {"t": 1783.55, "x": "帯の天体に近づく機会が来たときのために、"}, {"t": 1786.35, "x": "燃料は取っておく。"}, {"t": 1787.9666666666667, "x": "そして、探査機が帯の外に出るのは、二〇二八年から"}, {"t": 1792.3, "x": "二〇二九年ごろの見込みだとしています。"}, {"t": 1794.95, "x": "二〇二五年八月七日、探査機は冬眠に入りました。"}, {"t": 1799.2, "x": "冬眠のあいだ、探査機はゆっくりと回りながら、"}, {"t": 1802.35, "x": "機体の多くの部分の電源を切って過ごします。"}, {"t": 1805.5166666666667, "x": "地上から命令は送らず、データも受け取りません。"}, {"t": 1808.9333333333334, "x": "探査機の側から届くのは、週に一度の、"}, {"t": 1811.8833333333334, "x": "状態を知らせる短い信号だけです。"}, {"t": 1814.75, "x": "冬眠に入ったことを知らせる信号が、地上に"}, {"t": 1817.8833333333334, "x": "届くまでにかかった時間は、八時間三十一分でした。"}, {"t": 1821.7, "x": "地球からの距離は、九十二億キロメートルを"}, {"t": 1824.7833333333333, "x": "超えていました。"}, {"t": 1825.6833333333334, "x": "冬眠は、二〇〇七年以来二十三回目。"}, {"t": 1828.9333333333334, "x": "それまでで最も長かったのは、二〇二二年から"}, {"t": 1832.3166666666666, "x": "二〇二三年にかけての二百七十三日でした。"}, {"t": 1835.5833333333333, "x": "今回はそれより長く、目覚めは翌年の"}, {"t": 1838.4333333333334, "x": "二〇二六年六月下旬の予定とされました。"}, {"t": 1841.4666666666667, "x": "ただし、NASAの発表には、二〇二六会計年度の予算が"}, {"t": 1845.9666666666667, "x": "最終的に決まれば、という条件が添えられていました。"}, {"t": 1849.5833333333333, "x": "眠っているあいだも、粒子を測る二つの"}, {"t": 1852.3, "x": "装置と、ちりを数える装置は記録を取り続け、"}, {"t": 1855.6833333333334, "x": "目覚めたときにまとめて送ります。"}, {"t": 1857.95, "x": "そして、二〇二六年六月二十三日。"}, {"t": 1858.8166666666666, "x": "二〇二六年六月二十三日█"}, {"t": 1861.4333333333334, "x": "探査機は、三百二十一日の冬眠から目覚めました。"}, {"t": 1865.3166666666666, "x": "目覚めを知らせる信号は、スペインの"}, {"t": 1867.8, "x": "マドリード近くにあるアンテナで受け取られています。"}, {"t": 1870.5833333333333, "x": "届くまでにかかった時間は、約八時間五十二分。"}, {"t": 1874.2333333333333, "x": "地球からの距離は、"}, {"t": 1875.4, "x": "約九十五億キロメートルになっていました。"}, {"t": 1878.4, "x": "眠っていたあいだに、信号が届くまでの"}, {"t": 1881.1333333333334, "x": "時間は二十分あまり延びています。"}, {"t": 1883.2666666666667, "x": "運用の責任者は、冬眠中に届いた週ごとの報告は、"}, {"t": 1887.3333333333333, "x": "すべて異常なしを示す「緑」だったと話しています。"}, {"t": 1891.7666666666667, "x": "探査機はいま、太陽から遠い場所で動くために、"}, {"t": 1895.0666666666666, "x": "自分で判断する仕組みを書き換えた状態で飛んでいます。"}, {"t": 1898.75, "x": "電気を作る装置の出力は、年ごとに"}, {"t": 1901.6166666666666, "x": "少しずつ下がっていきます。"}, {"t": 1903.1833333333334, "x": "信号が届くまでの時間は、年ごとに延びていきます。"}, {"t": 1906.9, "x": "それを見越した作り替えです。"}, {"t": 1908.75, "x": "NASAの見通しでは、推進剤と電力は、"}, {"t": 1911.6833333333334, "x": "二〇四〇年代まで、太陽から地球までの距離の"}, {"t": 1915.5166666666667, "x": "百倍を超える遠さまで持つとされています。"}, {"t": 1918.1, "x": "ただ、どれだけ遠くへ行っても、"}, {"t": 1920.1333333333334, "x": "あのとき後ろを振り返って撮った三百三十六枚の"}, {"t": 1923.6666666666667, "x": "画像を、撮りなおすことはできません。"}, {"t": 1926.05, "x": "探査機は同じ道を戻りません。"}, {"t": 1928.2, "x": "アロコスの北半分を、もう一度見に行く"}, {"t": 1931.0, "x": "機会は、この探査機にはありません。"}, {"t": 1933.4666666666667, "x": "NASAの言葉で言えば、カイパーベルトの"}, {"t": 1935.95, "x": "中で動き、新しい情報を集めている探査機は、"}, {"t": 1939.5333333333333, "x": "いまもニューホライズンズ一機だけです。"}, {"t": 1941.9333333333334, "x": "冥王星の先には、数十万個の氷の"}, {"t": 1944.95, "x": "天体が回っていると見積もられています。"}, {"t": 1947.3, "x": "そのうち、近くから形を撮られたものは、一つだけです。"}, {"t": 1951.4833333333333, "x": "その一つも、南半分しか写っていません。"}, {"t": 1954.65, "x": "北半分について分かっているのは、遠くの星を"}, {"t": 1957.8166666666666, "x": "隠したかどうかと、電波で測った冷たさだけです。"}, {"t": 1961.1833333333334, "x": "名前は、空。"}, {"t": 1962.6166666666666, "x": "ただ、その言葉は、本当は雲を指していたのかも"}, {"t": 1966.1333333333334, "x": "しれない、とも言われています。"}, {"t": 1968.15, "x": "写った半分には、世界の言葉で"}, {"t": 1970.5666666666666, "x": "空を意味する名前が付いています。"}, {"t": 1972.6333333333334, "x": "写らなかった半分には、まだ名前がありません。"}, {"t": 1975.8166666666666, "x": "アロコスは、約二百九十三年かけて"}, {"t": 1978.65, "x": "太陽を回り続けています。"}, {"t": 1980.4, "x": "季節が巡れば、いつか北半分にも"}, {"t": 1983.05, "x": "日が当たる時期が来るはずです。"}, {"t": 1984.75, "x": "そのとき、それを近くで見る探査機がいるか"}, {"t": 1987.7166666666667, "x": "どうかは、どの記録にも書かれていません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
