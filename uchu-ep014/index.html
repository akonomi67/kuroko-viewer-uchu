<script>
const D={"name": "ep014", "file": "ep014", "dur": 1866.51665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇一八年十月三十一日。"}, {"t": 2.6166666666666667, "x": "カリフォルニアにある、直径七十メートルの"}, {"t": 5.533333333333333, "x": "アンテナが、空の一点に向けられていました。"}, {"t": 8.416666666666666, "x": "聞いていたのは、一機の探査機の電波です。"}, {"t": 11.366666666666667, "x": "探査機は、地球から五億キロメートル"}, {"t": 13.933333333333334, "x": "あまり離れたところにいました。"}, {"t": 15.683333333333334, "x": "その電波には、文字も数字も乗っていませんでした。"}, {"t": 19.05, "x": "探査機は地面すれすれを飛んでいて、"}, {"t": 21.216666666666665, "x": "大きなアンテナを地球に向けていなかったからです。"}, {"t": 24.4, "x": "届いていたのは、補助のアンテナから出る、"}, {"t": 27.0, "x": "変化のない一つの音のような電波だけでした。"}, {"t": 30.066666666666666, "x": "それでも、その音には意味がありました。"}, {"t": 32.78333333333333, "x": "音の高さのわずかなずれから、探査機の動きが分かります。"}, {"t": 36.65, "x": "動きが分かれば、その下にある"}, {"t": 38.766666666666666, "x": "天体の重さの偏りが分かります。"}, {"t": 41.016666666666666, "x": "その日の朝、探査機は軌道の"}, {"t": 43.266666666666666, "x": "いちばん低い点を通り過ぎました。"}, {"t": 45.333333333333336, "x": "二十分ほどたったころ、音の様子が変わりました。"}, {"t": 48.78333333333333, "x": "機体の向きを保つための燃料が、尽きたのです。"}, {"t": 52.1, "x": "探査機の名前は、ドーン。"}, {"t": 54.083333333333336, "x": "回っていた天体は、火星と木星のあいだにある"}, {"t": 57.31666666666667, "x": "準惑星、ケレスです。"}, {"t": 59.18333333333333, "x": "ドーンは、いまもケレスを回っています。"}, {"t": 61.86666666666667, "x": "動いていない機体が、落ちずに回り続けています。"}, {"t": 65.3, "x": "ただし、それは偶然ではありません。"}, {"t": 67.9, "x": "落ちないように、わざとその軌道に置かれました。"}, {"t": 71.05, "x": "どこを回らせておけば落ちないのか。"}, {"t": 73.25, "x": "その場所は、燃料が残っているうちに、"}, {"t": 75.95, "x": "計算して選んでありました。"}, {"t": 77.91666666666667, "x": "燃料が尽きたのは、そのあとです。"}, {"t": 80.4, "x": "この回では、燃料が尽きる前の十一年と、尽きたあとも"}, {"t": 84.61666666666666, "x": "残されている理由を、記録の順に読んでいきます。"}, {"t": 87.85, "x": "そして、到着前から光って見えていた"}, {"t": 90.48333333333333, "x": "白い点が、最後に何だと分かったのかも。"}, {"t": 93.4, "x": "最初に、ケレスがどんな天体として"}, {"t": 95.88333333333334, "x": "知られてきたのかを確かめておきます。"}, {"t": 98.03333333333333, "x": "ケレスが見つかったのは、一八〇一年です。"}, {"t": 101.21666666666667, "x": "見つけたのは、イタリアの天文学者"}, {"t": 103.71666666666667, "x": "ジュゼッペ・ピアッツィでした。"}, {"t": 105.08333333333333, "x": "火星と木星のあいだで、最初に見つかった天体です。"}, {"t": 108.8, "x": "名前は、ローマ神話の穀物と収穫の女神から取られました。"}, {"t": 113.08333333333333, "x": "英語で穀物の食品を指すシリアルという"}, {"t": 115.7, "x": "言葉も、同じ名前から来ています。"}, {"t": 118.25, "x": "見つかったあと、ケレスは長いあいだ"}, {"t": 120.66666666666667, "x": "小惑星と呼ばれてきました。"}, {"t": 122.46666666666667, "x": "分類が変わったのは、二〇〇六年です。"}, {"t": 125.26666666666667, "x": "まわりの岩の天体とは大きさも性質も"}, {"t": 127.78333333333333, "x": "違いすぎるとして、準惑星に分けられました。"}, {"t": 131.03333333333333, "x": "見つかったのは、冥王星より百二十九年も前でした。"}, {"t": 134.98333333333332, "x": "大きさは、半径がおよそ四百七十六キロメートル。"}, {"t": 138.73333333333332, "x": "地球の半径の十三分の一ほどです。"}, {"t": 141.38333333333333, "x": "NASAの説明では、地球を五セント硬貨に"}, {"t": 144.25, "x": "たとえると、ケレスはけしの実くらいになります。"}, {"t": 147.28333333333333, "x": "それでも、小惑星帯の中では飛び抜けています。"}, {"t": 150.75, "x": "小惑星帯にあるものを全部集めた重さの、"}, {"t": 153.63333333333333, "x": "四分の一をケレス一つが占めています。"}, {"t": 156.48333333333332, "x": "太陽からの距離は、平均で四億一千三百万キロメートル。"}, {"t": 160.85, "x": "太陽と地球の距離の二・八倍です。"}, {"t": 163.5, "x": "太陽の光がケレスに届くまで、二十二分かかります。"}, {"t": 167.4, "x": "一年は、地球の日数で千六百八十二日。"}, {"t": 171.13333333333333, "x": "一日は九時間しかありません。"}, {"t": 173.15, "x": "中身についても、NASAはいくつかの見方を示しています。"}, {"t": 176.96666666666667, "x": "岩の芯のまわりを、氷の層が包んでいるらしいこと。"}, {"t": 180.75, "x": "重さの四分の一ほどが水かもしれないこと。"}, {"t": 183.66666666666666, "x": "もしそうなら、ケレスには地球より"}, {"t": 186.03333333333333, "x": "多くの水があることになります。"}, {"t": 187.9, "x": "NASAはケレスを、「生まれかけの"}, {"t": 189.96666666666667, "x": "惑星」と呼ぶ科学者がいるとも書いています。"}, {"t": 193.03333333333333, "x": "惑星になり始めたものの、近くの木星の強い"}, {"t": 196.43333333333334, "x": "重力のせいで、なりきれなかった天体、という意味です。"}, {"t": 200.41666666666666, "x": "表面の広さは、およそ二百八十万平方キロメートル。"}, {"t": 204.55, "x": "チームの記録は、アメリカ本土の面積の"}, {"t": 207.36666666666667, "x": "三十六パーセントにあたると書いています。"}, {"t": 209.86666666666667, "x": "不思議なこともありました。"}, {"t": 211.48333333333332, "x": "ケレスには、直径二百八十キロメートルを"}, {"t": 214.55, "x": "超えるクレーターが一つもありません。"}, {"t": 216.56666666666666, "x": "四十五億年のあいだに、大きな小惑星が"}, {"t": 219.76666666666668, "x": "何度もぶつかってきたはずです。"}, {"t": 221.5, "x": "表面のすぐ下にある氷や塩が、長い時間をかけて"}, {"t": 225.18333333333334, "x": "大きなくぼみをならしてしまったのかも"}, {"t": 227.26666666666668, "x": "しれない、とNASAは書いています。"}, {"t": 229.41666666666666, "x": "これだけのことは、望遠鏡と計算で分かっていました。"}, {"t": 233.15, "x": "ただ、表面がどうなっているかは、"}, {"t": 235.45, "x": "ほとんど分かっていませんでした。"}, {"t": 237.56666666666666, "x": "遠く、小さいからです。"}, {"t": 239.58333333333334, "x": "二百年あまりのあいだ、ケレスは"}, {"t": 241.9, "x": "望遠鏡の中で、ほとんど点のままでした。"}, {"t": 244.9, "x": "それでも、望遠鏡でぼんやりと、明るい"}, {"t": 248.15, "x": "場所があることには気づかれていました。"}, {"t": 250.25, "x": "NASAの二〇二〇年の発表は、そのことを「探査機が"}, {"t": 254.16666666666666, "x": "着くよりずっと前から」と書いています。"}, {"t": 256.71666666666664, "x": "ただ、その正体は分かりませんでした。"}, {"t": 259.43333333333334, "x": "その明るい場所を、近くから見に行く探査機が"}, {"t": 262.45, "x": "打ち上げられたのは、二〇〇七年九月二十七日です。"}, {"t": 266.1166666666667, "x": "ドーンが積んでいたのは、ふつうの"}, {"t": 268.1666666666667, "x": "ロケットエンジンではありませんでした。"}, {"t": 270.2, "x": "イオンエンジンです。"}, {"t": 271.48333333333335, "x": "キセノンという気体に電気を帯びさせ、"}, {"t": 273.73333333333335, "x": "電気の力で押し出して進みます。"}, {"t": 276.26666666666665, "x": "打ち上げのとき、ドーンはキセノンを"}, {"t": 278.6666666666667, "x": "四百二十五キログラム積んでいました。"}, {"t": 281.0, "x": "エンジンは直径三十センチメートルのものが三基。"}, {"t": 284.25, "x": "一度に動かすのは一基だけで、一基は予備でした。"}, {"t": 287.7, "x": "その力は、とても弱いものです。"}, {"t": 290.25, "x": "いちばん強く噴かしても、一基で九十一ミリニュートン。"}, {"t": 293.95, "x": "NASAはこれを、ノートの紙一枚を手に"}, {"t": 296.6333333333333, "x": "持ったときくらいの力だと説明しています。"}, {"t": 299.21666666666664, "x": "どれくらい遅いかも、NASAは書いています。"}, {"t": 302.01666666666665, "x": "止まった状態から時速九十七キロメートルほどまで"}, {"t": 305.2, "x": "速くするのに、四日かかる。"}, {"t": 307.21666666666664, "x": "その代わり、燃料をほとんど使いません。"}, {"t": 310.1333333333333, "x": "いちばん強く噴かしても、キセノンの"}, {"t": 312.46666666666664, "x": "消費は一秒に三・二五ミリグラムです。"}, {"t": 315.26666666666665, "x": "そして、何年も噴かし続けることができます。"}, {"t": 318.48333333333335, "x": "この仕組みは、ディープ・スペース・ワンという"}, {"t": 320.93333333333334, "x": "試験機で、すでに確かめられていました。"}, {"t": 323.6166666666667, "x": "その試験機がイオンエンジンを"}, {"t": 325.3333333333333, "x": "動かした日数は、六百七十八日。"}, {"t": 328.3333333333333, "x": "ドーンはそれを大きく超えて、"}, {"t": 330.05, "x": "二千日以上噴かす計画でした。"}, {"t": 332.55, "x": "電気は、太陽の光でまかないました。"}, {"t": 335.4, "x": "機体の両側に太陽電池の翼が一枚ずつ付いていて、"}, {"t": 339.06666666666666, "x": "端から端までは十九・七メートルあります。"}, {"t": 342.26666666666665, "x": "エンジンに初めて火が入ったのは、打ち上げから"}, {"t": 345.28333333333336, "x": "九日後の、二〇〇七年十月六日でした。"}, {"t": 348.45, "x": "最後の噴射は、二〇一八年六月二十一日です。"}, {"t": 352.51666666666665, "x": "そのあいだに噴かしていた時間を"}, {"t": 354.28333333333336, "x": "合わせると、五・八七年になります。"}, {"t": 357.15, "x": "エンジンだけで生み出した速さの変化は、"}, {"t": 359.43333333333334, "x": "合計で時速四万一千三百六十キロメートル。"}, {"t": 363.0833333333333, "x": "秒速にすると、およそ十一・五キロメートルです。"}, {"t": 366.68333333333334, "x": "この力で、ドーンは二つの天体を順に"}, {"t": 369.56666666666666, "x": "回るという、それまでにない旅をしました。"}, {"t": 372.4, "x": "一つめは、小惑星帯で二番めに大きい天体、ベスタです。"}, {"t": 376.95, "x": "二〇一一年から二〇一二年まで、十四か月周回しました。"}, {"t": 381.5833333333333, "x": "ベスタの話は、この回ではここまでにします。"}, {"t": 384.8, "x": "その前、二〇〇九年には火星の"}, {"t": 387.1666666666667, "x": "そばを通り、その重力も借りています。"}, {"t": 389.93333333333334, "x": "ベスタの周回を抜け出したドーンは、"}, {"t": 392.0, "x": "二年半かけてケレスへ向かいました。"}, {"t": 394.5, "x": "ケレスの重力につかまったのは、二〇一五年三月六日です。"}, {"t": 398.75, "x": "場所はケレスから六万一千キロメートルほど。"}, {"t": 401.51666666666665, "x": "そのとき、ドーンはケレスの、太陽と反対の側にいました。"}, {"t": 405.93333333333334, "x": "だから、到着の直前に届いた画像の"}, {"t": 408.71666666666664, "x": "ケレスは、細い三日月の形をしていました。"}, {"t": 411.81666666666666, "x": "ドーンが昼の側へ回りこむのは、四月の半ばです。"}, {"t": 415.4166666666667, "x": "JPLの管制室に、「健全で、イオンエンジンで"}, {"t": 419.35, "x": "推進中」という確認が届いたのは、"}, {"t": 422.1, "x": "つかまってから一時間ほどあとでした。"}, {"t": 424.5833333333333, "x": "この日、ドーンは準惑星を回った"}, {"t": 427.1166666666667, "x": "初めての探査機になりました。"}, {"t": 428.93333333333334, "x": "そして、地球の外で二つの天体を周回した、"}, {"t": 432.4, "x": "初めての探査機にもなりました。"}, {"t": 434.71666666666664, "x": "チームの主任技術者は、そのときこう述べています。"}, {"t": 438.1666666666667, "x": "四十九億キロメートル、七年半の"}, {"t": 440.95, "x": "旅のあとで、ドーンはケレスを家と呼ぶ。"}, {"t": 443.7, "x": "ここで一つ、区別しておきます。"}, {"t": 446.18333333333334, "x": "ドーンが進むためのエンジンは、"}, {"t": 447.96666666666664, "x": "キセノンで動いていました。"}, {"t": 449.8833333333333, "x": "けれど、機体の向きを変えたり"}, {"t": 451.9, "x": "保ったりするのは、別の仕組みでした。"}, {"t": 454.5, "x": "この回の結末を決めたのは、そちらのほうです。"}, {"t": 457.85, "x": "宇宙で機体の向きを変えるのは、簡単ではありません。"}, {"t": 461.3666666666667, "x": "足場も、空気もありません。"}, {"t": 463.48333333333335, "x": "ドーンはそのために、リアクションホイールという"}, {"t": 466.3, "x": "装置を積んでいました。"}, {"t": 467.7, "x": "機体の中で円盤を回し、その回転の速さを"}, {"t": 471.0833333333333, "x": "変えることで、機体を回したり、止めたりします。"}, {"t": 474.6, "x": "円盤は、速いときには一秒に七十五回転します。"}, {"t": 478.46666666666664, "x": "空間には縦、横、奥行きの三つの向きがあるので、"}, {"t": 482.56666666666666, "x": "ホイールは三つあれば足ります。"}, {"t": 484.71666666666664, "x": "設計した人たちは用心して、四つ積みました。"}, {"t": 488.18333333333334, "x": "一つめが止まったのは、二〇一〇年六月です。"}, {"t": 491.48333333333335, "x": "まだベスタに着く一年ほど前でした。"}, {"t": 493.8333333333333, "x": "これは、想定の範囲でした。"}, {"t": 496.03333333333336, "x": "予備があったからです。"}, {"t": 497.3666666666667, "x": "二つめが止まったのは、二〇一二年八月。"}, {"t": 500.53333333333336, "x": "ベスタを離れる途中でした。"}, {"t": 502.3333333333333, "x": "ホイールが二つになると、三つの"}, {"t": 504.65, "x": "向きを全部はまかなえません。"}, {"t": 506.3666666666667, "x": "チームの記録には、二つが壊れる場合は、設計のときに"}, {"t": 510.48333333333335, "x": "想定も検討もされていなかった、と書かれています。"}, {"t": 513.9, "x": "チームは大きな手間と工夫を重ねて、ホイールが"}, {"t": 517.1166666666667, "x": "足りないまま機体を動かす方法を作りました。"}, {"t": 519.95, "x": "足りない分を補ったのは、ヒドラジンという燃料でした。"}, {"t": 523.6666666666666, "x": "ヒドラジンは、機体のまわりに付いた"}, {"t": 526.05, "x": "小さな噴射口から吹き出して、向きを変えます。"}, {"t": 529.2833333333333, "x": "ホイールと違って、使えば使うだけ減ります。"}, {"t": 532.4333333333333, "x": "そして、宇宙で補給する方法はありません。"}, {"t": 535.5833333333334, "x": "打ち上げのとき、ドーンのヒドラジンのタンクには、"}, {"t": 538.6666666666666, "x": "四十五・三キログラムが入っていました。"}, {"t": 541.6833333333333, "x": "タンクの大きさは四十五リットル。"}, {"t": 543.7833333333333, "x": "そこから管と弁を通って、機体の"}, {"t": 546.2666666666667, "x": "あちこちにある十二の噴射口へ送られます。"}, {"t": 548.9666666666667, "x": "ここから、ドーンの旅は、残りの"}, {"t": 551.6, "x": "ヒドラジンを数えながらの旅になりました。"}, {"t": 554.1166666666667, "x": "チームは、噴射口が火を噴くたびに、その時間を"}, {"t": 557.65, "x": "千分の一秒の単位で記録させていました。"}, {"t": 560.3666666666667, "x": "その記録と、タンクの温度と圧力から、残りを計算します。"}, {"t": 564.8833333333333, "x": "ただ、燃料計はありません。"}, {"t": 567.0833333333334, "x": "残りはあくまで、計算で出した数でした。"}, {"t": 570.0666666666667, "x": "節約の工夫もしました。"}, {"t": 571.8666666666667, "x": "夜の側を飛ぶときは、暗くて何も写らない"}, {"t": 574.9, "x": "地面を向いたまま、あえて機体を回さない。"}, {"t": 577.7666666666667, "x": "回らなければ、ヒドラジンを使わずにすみます。"}, {"t": 581.0166666666667, "x": "残った二つのホイールについて、チームの"}, {"t": 583.75, "x": "主任技術者は、半ば冗談でこう呼んでいました。"}, {"t": 587.1, "x": "壊れた二つと、壊れる運命の二つ。"}, {"t": 590.0166666666667, "x": "三つめが止まったのは、二〇一七年四月二十三日です。"}, {"t": 594.15, "x": "すでにケレスを回っていたころでした。"}, {"t": 596.45, "x": "そこから先、ドーンの向きを保つものは、"}, {"t": 599.3, "x": "ヒドラジンだけになりました。"}, {"t": 601.2333333333333, "x": "四つ積んだのに、三つそろっていた期間は、"}, {"t": 604.05, "x": "宇宙にいた時間の半分ほどしかありませんでした。"}, {"t": 607.3333333333334, "x": "ホイールが止まっても、ドーンは進むことはできました。"}, {"t": 610.7833333333333, "x": "キセノンは十分に残っていたからです。"}, {"t": 613.15, "x": "足りなくなるのは、向きを変える力でした。"}, {"t": 616.1, "x": "向きが変えられなければ、太陽電池を"}, {"t": 618.75, "x": "太陽に向けられません。"}, {"t": 620.1666666666666, "x": "アンテナも地球に向けられません。"}, {"t": 622.15, "x": "カメラも地面に向けられません。"}, {"t": 624.05, "x": "ドーンの寿命は、ヒドラジンの"}, {"t": 626.0666666666667, "x": "残りで決まることになりました。"}, {"t": 627.8833333333333, "x": "話を、ケレスへの到着の少し前に戻します。"}, {"t": 631.4333333333333, "x": "二〇一五年の初め、近づいていくドーンの"}, {"t": 634.45, "x": "画像に、明るい点が写っていました。"}, {"t": 637.1, "x": "二月十八日、NASAの天文写真の"}, {"t": 639.9333333333333, "x": "ページは、こう書いています。"}, {"t": 641.8833333333333, "x": "ケレスの明るい点の正体は何か。"}, {"t": 644.2333333333333, "x": "近づくほど、謎は深まっている。"}, {"t": 646.7333333333333, "x": "新しい画像では、ケレスの表面の大部分は暗く、"}, {"t": 650.4666666666667, "x": "月や水星のようにクレーターだらけでした。"}, {"t": 653.35, "x": "その中で、明るい点だけが目立っていました。"}, {"t": 656.4833333333333, "x": "しかも、近づくと数が増えていました。"}, {"t": 659.15, "x": "そのページには、読者への問いかけが付いていました。"}, {"t": 662.5666666666667, "x": "ケレスの明るい点は、何だと思いますか。"}, {"t": 665.5833333333334, "x": "五月には、七千二百キロメートルの距離から、"}, {"t": 668.75, "x": "さらに細かい画像が撮られました。"}, {"t": 671.1166666666667, "x": "そのとき、ドーンの主任研究者は、"}, {"t": 673.7166666666667, "x": "明るさの理由をこう説明しています。"}, {"t": 676.4, "x": "表面にある、よく光を跳ね返す物質のせい。"}, {"t": 679.8166666666667, "x": "氷かもしれない。"}, {"t": 681.0833333333334, "x": "この時点では、まだ「かもしれない」でした。"}, {"t": 684.7166666666667, "x": "明るい点がいちばん集まっていたのは、"}, {"t": 686.9166666666666, "x": "オッカトルと名付けられたクレーターの中でした。"}, {"t": 689.8333333333334, "x": "明るい場所は、あとで二つの"}, {"t": 691.8833333333333, "x": "名前で呼ばれるようになります。"}, {"t": 693.6666666666666, "x": "クレーターの中心にあるものがセレアリア白斑。"}, {"t": 696.55, "x": "その東に散らばるものがヴィナリア白斑。"}, {"t": 699.15, "x": "白斑というのは、明るい場所という意味の言葉です。"}, {"t": 702.65, "x": "幅は九十二キロメートル。"}, {"t": 704.4666666666667, "x": "中心には、幅十キロメートルほどのくぼみがあります。"}, {"t": 708.0666666666667, "x": "そのくぼみの中に、明るい物質に覆われた"}, {"t": 711.1, "x": "丸い盛り上がりがあり、まわりに放射状と"}, {"t": 713.8666666666667, "x": "同心円状の割れ目が走っていました。"}, {"t": 716.2, "x": "正体について、最初の答えは二〇一五年に出ました。"}, {"t": 720.1333333333333, "x": "カメラのチームが科学誌ネイチャーで、"}, {"t": 722.2333333333333, "x": "硫酸マグネシウムという塩ではないかと考えを示しました。"}, {"t": 726.3166666666667, "x": "一年後の二〇一六年、別の答えが出ます。"}, {"t": 729.8, "x": "赤外線で表面を調べたチームが、同じネイチャーで、"}, {"t": 733.5833333333334, "x": "主な成分は炭酸ナトリウムだと報告しました。"}, {"t": 736.9666666666667, "x": "炭酸ナトリウムは、地球では"}, {"t": 739.1, "x": "熱い水が関わる場所で見つかる塩です。"}, {"t": 741.65, "x": "地球の外で見つかった炭酸塩の中では、"}, {"t": 744.3833333333333, "x": "最も濃く集まっていました。"}, {"t": 746.5333333333333, "x": "同じ場所からは、アンモニアを含む塩も見つかりました。"}, {"t": 750.2666666666667, "x": "アンモニアは、太陽から遠い、冷たい場所に多い物質です。"}, {"t": 754.7166666666667, "x": "ケレスがもっと外側で生まれ、あとから内側へ"}, {"t": 757.8833333333333, "x": "移ってきた可能性もある、とチームは書いています。"}, {"t": 761.1666666666666, "x": "大事なのは、その出どころです。"}, {"t": 763.4666666666667, "x": "ぶつかってきた小惑星が運んできたものではない、と"}, {"t": 766.85, "x": "チームは書いています。"}, {"t": 768.1166666666667, "x": "ケレスの内側から出てきたもの。"}, {"t": 770.15, "x": "つまり、ケレスの中には、かつて塩を溶かした水があった。"}, {"t": 774.3666666666667, "x": "それも、それほど昔ではないころに。"}, {"t": 777.0666666666667, "x": "明るい場所は、オッカトルの中だけではありませんでした。"}, {"t": 780.6333333333333, "x": "ほかのクレーターのふちや底にも、同じように"}, {"t": 783.5833333333334, "x": "光を跳ね返す塩が見つかっています。"}, {"t": 785.95, "x": "氷かもしれないと言われた白い点は、"}, {"t": 788.3333333333334, "x": "氷ではありませんでした。"}, {"t": 790.2666666666667, "x": "水が残していった、塩でした。"}, {"t": 792.6666666666666, "x": "では、その水はどこから来て、いまもあるのか。"}, {"t": 796.1833333333333, "x": "この問いは、ここでは答えが出ませんでした。"}, {"t": 799.1333333333333, "x": "もう一つ、この時期に見つかったものがあります。"}, {"t": 802.2666666666667, "x": "赤道の近くに、ぽつんと一つだけ立っている山です。"}, {"t": 805.9333333333333, "x": "名前は、アフナ山。"}, {"t": 807.6833333333333, "x": "平均の高さはおよそ四キロメートル、"}, {"t": 810.0, "x": "直径はおよそ二十キロメートルあります。"}, {"t": 812.7833333333333, "x": "調べたチームは、これを火山だと考えました。"}, {"t": 816.0333333333333, "x": "ただし、溶けた岩ではなく、"}, {"t": 818.1166666666667, "x": "冷たい塩水と泥を押し出す火山です。"}, {"t": 820.8833333333333, "x": "できたのは過去十億年以内、もしかすると数億年以内。"}, {"t": 824.9333333333333, "x": "近くに引っぱり合う大きな惑星もない、小さな天体です。"}, {"t": 828.9833333333333, "x": "そこに若い火山があることは、驚きとして報告されました。"}, {"t": 833.0, "x": "二〇一六年六月三十日、ドーンの"}, {"t": 836.0666666666667, "x": "本来の任務は、正式に終わりました。"}, {"t": 838.7833333333333, "x": "予定していた観測は、ベスタでも"}, {"t": 841.0666666666667, "x": "ケレスでも、予定以上に終わっていました。"}, {"t": 843.8166666666667, "x": "それでも機体は動いていたので、任務は延長されました。"}, {"t": 847.6833333333333, "x": "このとき、チームは一つの選択肢を用意していました。"}, {"t": 851.45, "x": "長いあいだ、チームはケレスがドーンの"}, {"t": 853.8833333333333, "x": "最後の住みかになると言い続けていました。"}, {"t": 856.3333333333334, "x": "ホイールが二つ壊れた機体で、別の"}, {"t": 858.9, "x": "場所へ向かうことは現実的ではない、と。"}, {"t": 861.7666666666667, "x": "その年の初めに、ケレスを離れることはできるのかと"}, {"t": 865.25, "x": "聞かれても、チームは、それは現実的ではない、"}, {"t": 868.7, "x": "考えられない、と答えていました。"}, {"t": 871.4166666666666, "x": "記録にそう書かれています。"}, {"t": 873.1333333333333, "x": "ところが、ヒドラジンの節約が、予想を"}, {"t": 876.2166666666667, "x": "はるかに超えてうまくいっていました。"}, {"t": 878.1833333333333, "x": "もう一つ、分かっていたことがあります。"}, {"t": 880.8333333333334, "x": "ヒドラジンは、天体の近くを低く飛ぶほど速く減ります。"}, {"t": 884.7666666666667, "x": "地面を向き続けるために機体を速く回す"}, {"t": 887.3333333333334, "x": "必要があり、重力が機体を傾けようとする"}, {"t": 890.55, "x": "力にも逆らう必要があるからです。"}, {"t": 892.7666666666667, "x": "逆に、何もない宇宙を長く旅するあいだは、"}, {"t": 896.0, "x": "あまり減りません。"}, {"t": 897.3666666666667, "x": "このころ、ドーンはケレスの地表から"}, {"t": 899.8, "x": "三百八十五キロメートルの高さを回っていました。"}, {"t": 902.9833333333333, "x": "国際宇宙ステーションが地球の"}, {"t": 904.9333333333333, "x": "上を回る高さより、低いところです。"}, {"t": 907.5666666666667, "x": "小さな天体とはいえ、ケレスの重力はそれなりに強く、"}, {"t": 911.4, "x": "そこを低く回るにはヒドラジンを多く使います。"}, {"t": 914.6666666666666, "x": "それなら、ケレスを離れて、"}, {"t": 916.7333333333333, "x": "もう一つ別の天体へ行けるかもしれない。"}, {"t": 919.6, "x": "候補は、アデオナという大きな小惑星でした。"}, {"t": 922.9333333333333, "x": "二〇一六年三月、チームはNASAの"}, {"t": 925.7, "x": "本部に、二つの道を示しました。"}, {"t": 928.2666666666667, "x": "ケレスに残るか。"}, {"t": 929.5, "x": "ケレスを離れるか。"}, {"t": 930.85, "x": "チームの中でも、意見は分かれていました。"}, {"t": 933.8333333333334, "x": "外部の科学者による評価も行われました。"}, {"t": 936.6333333333333, "x": "結論は、ケレスに残る、でした。"}, {"t": 939.55, "x": "発表は、二〇一六年七月です。"}, {"t": 942.4666666666667, "x": "どちらにも価値はある。"}, {"t": 943.8666666666667, "x": "ただ、ケレスを続けて調べるほうが好ましい。"}, {"t": 947.1, "x": "それが評価の結論でした。"}, {"t": 948.95, "x": "この決定は、ドーンの最後の"}, {"t": 951.0333333333333, "x": "場所を決めた決定でもありました。"}, {"t": 952.9833333333333, "x": "チームの主任技術者は、この結論をよい"}, {"t": 955.8833333333333, "x": "決定だったと書いています。"}, {"t": 957.4166666666666, "x": "予定の任務を超えた機体を、さらに役立てるいちばんの"}, {"t": 960.9, "x": "使い道は、いまやっていることを続けることだ、と。"}, {"t": 964.55, "x": "アデオナへ向かっていれば、ドーンは別の天体の"}, {"t": 967.6333333333333, "x": "そばで、別の終わり方をしていたはずです。"}, {"t": 970.4333333333333, "x": "ケレスに残ると決めた時点で、ドーンの燃料は、"}, {"t": 973.6333333333333, "x": "最後の一滴までケレスのために使われることになりました。"}, {"t": 977.3833333333333, "x": "では、残ったドーンは、何をしたのか。"}, {"t": 980.45, "x": "チームは、残りのヒドラジンでできる、"}, {"t": 982.95, "x": "いちばん無理な観測を考え始めました。"}, {"t": 985.9166666666666, "x": "ケレスの地面に、それまでよりはるかに近づくことです。"}, {"t": 989.5166666666667, "x": "それまで、ドーンがケレスにいちばん近づいたのは、"}, {"t": 992.6666666666666, "x": "三百八十五キロメートルでした。"}, {"t": 995.15, "x": "新しい計画は、その十分の一より"}, {"t": 997.9833333333333, "x": "低くまで降りることでした。"}, {"t": 999.55, "x": "問題は、ここでもヒドラジンです。"}, {"t": 1002.0666666666667, "x": "地面すれすれを回り続けると、"}, {"t": 1004.05, "x": "ヒドラジンはすぐになくなります。"}, {"t": 1006.2833333333333, "x": "そこでチームは、丸い軌道ではなく、"}, {"t": 1008.8833333333333, "x": "細長い楕円の軌道を選びました。"}, {"t": 1011.4333333333333, "x": "低いところは速く通り過ぎ、高いところでゆっくり過ごす。"}, {"t": 1015.3666666666667, "x": "ブランコのような動きです。"}, {"t": 1017.0, "x": "低いところにいる時間が短ければ、"}, {"t": 1019.1833333333333, "x": "ヒドラジンの消費も抑えられます。"}, {"t": 1021.5833333333334, "x": "二〇一八年六月、ドーンは最後の軌道に入りました。"}, {"t": 1025.7, "x": "二十七時間に一回、高さ四千キロメートルから、"}, {"t": 1029.3, "x": "地表から三十五キロメートルまで降りてきます。"}, {"t": 1032.4, "x": "そしてまた、四千キロメートルまで上がっていきます。"}, {"t": 1035.8166666666666, "x": "三十五キロメートルは、旅客機が飛ぶ高さの三倍ほどです。"}, {"t": 1039.9, "x": "その高さを、ドーンは時速千六百九十キロメートルで"}, {"t": 1043.7833333333333, "x": "通り過ぎました。"}, {"t": 1044.8, "x": "楕円の軌道でいちばん低くなる点には、"}, {"t": 1047.1, "x": "チームがふだん使っていた呼び名があります。"}, {"t": 1049.8166666666666, "x": "ペリデメテル。"}, {"t": 1050.7666666666667, "x": "ケレスにあたるギリシャ神話の女神、"}, {"t": 1052.8666666666666, "x": "デメテルの名前から作られた言葉です。"}, {"t": 1055.6166666666666, "x": "ペリデメテルの近くでは、写真の"}, {"t": 1057.9166666666667, "x": "一枚一枚が、ごく狭い範囲しか写しません。"}, {"t": 1061.1833333333334, "x": "近すぎるからです。"}, {"t": 1062.4833333333333, "x": "そのため、同じ場所を何度も通って、"}, {"t": 1065.1833333333334, "x": "少しずつ写真を集めていきました。"}, {"t": 1067.6833333333334, "x": "写す先は、おもにオッカトル・クレーターでした。"}, {"t": 1070.7333333333333, "x": "白い点の場所です。"}, {"t": 1072.1666666666667, "x": "最後の軌道で、ドーンは一万一千枚を"}, {"t": 1075.1666666666667, "x": "超える写真を地球へ送りました。"}, {"t": 1077.2666666666667, "x": "ベスタとケレスで撮った写真は、"}, {"t": 1079.05, "x": "合わせて十万枚を超えました。"}, {"t": 1081.3666666666666, "x": "赤外線で測ったデータは三百万件を超えました。"}, {"t": 1084.75, "x": "写真だけではありません。"}, {"t": 1086.3, "x": "ドーンは、地面から出るかすかなガンマ線と"}, {"t": 1089.1166666666666, "x": "中性子も測っていました。"}, {"t": 1090.7666666666667, "x": "地下一メートルほどまでの物質が、"}, {"t": 1092.85, "x": "どんな元素でできているかが分かります。"}, {"t": 1095.4666666666667, "x": "このガンマ線と中性子は、宇宙線が"}, {"t": 1098.1833333333334, "x": "地面に当たって出てくるものです。"}, {"t": 1100.0166666666667, "x": "二〇一八年は、太陽の磁場が弱まる時期に入っていました。"}, {"t": 1104.25, "x": "太陽の磁場が弱いと、太陽系の"}, {"t": 1106.8333333333333, "x": "外から来る宇宙線が多くなります。"}, {"t": 1109.0166666666667, "x": "チームの記録は、その年を、ガンマ線や中性子を"}, {"t": 1112.8833333333334, "x": "測るにはそれまでで最もよい年になると書いていました。"}, {"t": 1116.1833333333334, "x": "この装置は、光を必要としません。"}, {"t": 1118.9166666666667, "x": "軌道がずれて、いちばん低い点が夜の側に"}, {"t": 1122.0333333333333, "x": "移ってからも、真っ暗な地面の上で測り続けました。"}, {"t": 1125.6, "x": "集まったデータは、科学者が目標としていた"}, {"t": 1128.5666666666666, "x": "量の、およそ四倍になりました。"}, {"t": 1130.95, "x": "重力も測り続けました。"}, {"t": 1132.7666666666667, "x": "序章で触れた、変化のない一つの音です。"}, {"t": 1135.8, "x": "地下に重いところと軽いところがあれば、上を"}, {"t": 1138.8166666666666, "x": "通るドーンは、わずかに速くなったり遅くなったりします。"}, {"t": 1142.45, "x": "そのずれが、地下の姿を教えました。"}, {"t": 1145.1833333333334, "x": "二〇一八年九月一日、ドーンは高いところから"}, {"t": 1148.8, "x": "ケレスを振り返り、最後の写真を撮りました。"}, {"t": 1151.9666666666667, "x": "そこには、ケレスのふちに立つアフナ山が写っていました。"}, {"t": 1155.7, "x": "撮影した高さは三千五百七十キロメートル。"}, {"t": 1158.95, "x": "アフナ山までの距離は、四千三十キロメートルでした。"}, {"t": 1162.7166666666667, "x": "チームの記録によれば、ケレスにはアフナ山のほかにも、"}, {"t": 1166.25, "x": "氷の火山らしい地形が二十以上見つかっています。"}, {"t": 1169.7666666666667, "x": "ただ、どれもアフナ山ほどはっきりしていません。"}, {"t": 1172.8666666666666, "x": "時間とともに、少しずつならされて"}, {"t": 1175.2666666666667, "x": "消えていくからだと考えられています。"}, {"t": 1177.4333333333334, "x": "九月二十八日と二十九日、ドーンはカメラと分光計を、"}, {"t": 1181.6833333333334, "x": "ベガとアルクトゥルスという二つの星に向けました。"}, {"t": 1184.7333333333333, "x": "装置の感度を確かめる、最後の較正です。"}, {"t": 1188.0, "x": "二〇〇七年の旅の始まりにも、同じ星を見ていました。"}, {"t": 1191.9333333333334, "x": "このときも、向きを変えるために、"}, {"t": 1194.15, "x": "ヒドラジンが少しずつ使われていきました。"}, {"t": 1196.9833333333333, "x": "残りは、六月の時点で約七リットル。"}, {"t": 1199.9833333333333, "x": "そのうち約〇・八リットルは、"}, {"t": 1201.9666666666667, "x": "管の中に残って、もう出せない分でした。"}, {"t": 1205.3166666666666, "x": "ヒドラジンが尽きる日は、チームにも"}, {"t": 1207.6333333333334, "x": "正確には分かっていませんでした。"}, {"t": 1209.6333333333334, "x": "理由はいくつもありました。"}, {"t": 1211.3, "x": "残りは計算で出した数で、測った数ではありません。"}, {"t": 1214.9333333333334, "x": "十年以上宇宙にいる温度計や圧力計の値が、"}, {"t": 1218.2333333333333, "x": "少しずれているかもしれません。"}, {"t": 1220.3666666666666, "x": "一回ごとの観測でどれだけ使うかも、正確には読めません。"}, {"t": 1224.5, "x": "予想は、九月の半ばから十月の半ば。"}, {"t": 1227.6333333333334, "x": "ただし、もっと早いか、遅いかも"}, {"t": 1230.4, "x": "しれない、とされていました。"}, {"t": 1232.3166666666666, "x": "尽きる前に、前触れはないとも書かれていました。"}, {"t": 1235.5666666666666, "x": "最後まで、それまでと同じように動く。"}, {"t": 1238.45, "x": "そしてある時、最後のひと吹きを使い切る。"}, {"t": 1241.55, "x": "チームの記録は、その瞬間をこうたとえています。"}, {"t": 1244.95, "x": "すっかりしぼんだ風船の口を開けるようなもの。"}, {"t": 1247.8666666666666, "x": "何も出てこない。"}, {"t": 1249.0166666666667, "x": "ドーンは、十月の最後の週までもちました。"}, {"t": 1252.2, "x": "十月三十一日、アメリカ西海岸の時刻で午前五時すぎ。"}, {"t": 1256.7666666666667, "x": "ドーンはいつものように、軌道の"}, {"t": 1258.9, "x": "いちばん低い点を通過しました。"}, {"t": 1260.8666666666666, "x": "それから約二十分後。"}, {"t": 1262.5666666666666, "x": "まだ低いところにいて、上り始めたころです。"}, {"t": 1265.8, "x": "噴射口が、効かなくなりました。"}, {"t": 1268.2333333333333, "x": "ドーンは、向きを保てなくなったことに気づきました。"}, {"t": 1271.5666666666666, "x": "理由は分かりません。"}, {"t": 1272.95, "x": "そこで、用意された手順を順に試しました。"}, {"t": 1276.1, "x": "予備の噴射口に切り替える。"}, {"t": 1277.9666666666667, "x": "主コンピュータを再起動する。"}, {"t": 1279.7333333333333, "x": "どれも、ヒドラジンがない以上、効きませんでした。"}, {"t": 1283.3, "x": "チームの予想では、この次に"}, {"t": 1285.4666666666667, "x": "ドーンは身を守る手順に入ります。"}, {"t": 1287.6, "x": "電気を節約するため、まず送信機を切る。"}, {"t": 1290.8166666666666, "x": "太陽電池を太陽に向けてから、地球へ助けを求める。"}, {"t": 1294.7666666666667, "x": "ところが、太陽の方を向くためにも、"}, {"t": 1297.3333333333333, "x": "ヒドラジンが要るのです。"}, {"t": 1299.0666666666666, "x": "このとき、偶然にも、その電波を"}, {"t": 1301.8666666666666, "x": "聞いていたアンテナがありました。"}, {"t": 1303.55, "x": "序章のアンテナです。"}, {"t": 1304.9166666666667, "x": "カリフォルニアのゴールドストーンにある、"}, {"t": 1306.9666666666667, "x": "直径七十メートルのアンテナでした。"}, {"t": 1309.65, "x": "その日の夜、地球が回って、今度は"}, {"t": 1312.6833333333334, "x": "スペインのマドリードにある七十メートルの"}, {"t": 1315.0166666666667, "x": "アンテナがドーンの方角を向きました。"}, {"t": 1317.1333333333334, "x": "管制室は、もう一度耳を澄ませました。"}, {"t": 1320.1666666666667, "x": "何も、聞こえませんでした。"}, {"t": 1322.25, "x": "十一月一日、アメリカ西海岸の時刻で午前一時半の少し前。"}, {"t": 1327.3166666666666, "x": "ミッション責任者が、任務の終わりを宣言しました。"}, {"t": 1330.8833333333334, "x": "そのあとの一日あまり、アンテナの予定は"}, {"t": 1333.8, "x": "組み替えられないまま残っていました。"}, {"t": 1335.8666666666666, "x": "カリフォルニアのゴールドストーン、"}, {"t": 1337.6, "x": "オーストラリアのキャンベラ、スペインのマドリード。"}, {"t": 1340.9833333333333, "x": "三つの局が、順番に最後の一度、"}, {"t": 1343.7, "x": "ケレスの方角に耳を向けました。"}, {"t": 1346.1833333333334, "x": "何も、起きませんでした。"}, {"t": 1348.15, "x": "NASAの発表で、ミッション責任者はこう述べています。"}, {"t": 1351.7833333333333, "x": "この素晴らしい宇宙船に別れを告げるのはつらい。"}, {"t": 1354.8333333333333, "x": "でも、その時が来た。"}, {"t": 1356.6, "x": "地球を出てから、十一年あまり。"}, {"t": 1359.2166666666667, "x": "旅した距離は、六十九億キロメートルほどでした。"}, {"t": 1362.7333333333333, "x": "ミッション責任者は、任務の終わりを宣言した"}, {"t": 1365.8333333333333, "x": "あとに、自分のための覚え書きを残しています。"}, {"t": 1368.9833333333333, "x": "その中に、こういう一文があります。"}, {"t": 1371.7, "x": "大事なのはドーンの終わりではない。"}, {"t": 1373.7, "x": "それより前のすべてが大事なのだ。"}, {"t": 1375.85, "x": "止まったドーンが、そのあとどうなるか。"}, {"t": 1378.3833333333334, "x": "チームは前もって書いていました。"}, {"t": 1380.35, "x": "向きを保てない機体は、ゆっくりと回り続けます。"}, {"t": 1383.7666666666667, "x": "太陽電池は太陽を向いたり外れたりし、日が当たれば"}, {"t": 1387.4, "x": "目を覚ましかけ、また暗がりに入って電池が尽きる。"}, {"t": 1390.7166666666667, "x": "ただ、それとは関係なく、ドーンはケレスを回り続けます。"}, {"t": 1395.05, "x": "向きが保てないことと、軌道から"}, {"t": 1397.3666666666666, "x": "落ちることは、別の話です。"}, {"t": 1399.6, "x": "月は、エンジンがなくても地球を回っています。"}, {"t": 1402.85, "x": "地球も、エンジンなしで太陽を回っています。"}, {"t": 1406.0333333333333, "x": "軌道に乗っているものは、押す力がなくても回り続けます。"}, {"t": 1409.9166666666667, "x": "ドーンも同じでした。"}, {"t": 1411.2333333333333, "x": "燃料が尽きても、ケレスのまわりを"}, {"t": 1413.6333333333334, "x": "回る軌道は、ほとんど変わりません。"}, {"t": 1416.1, "x": "では、なぜ最後に、ケレスへ落とさなかったのか。"}, {"t": 1419.6833333333334, "x": "答えは、ケレスがどういう場所だと"}, {"t": 1422.0, "x": "分かったか、にあります。"}, {"t": 1423.75, "x": "ケレスには、大量の水があります。"}, {"t": 1426.2833333333333, "x": "ほとんどは氷ですが、地下には"}, {"t": 1428.5333333333333, "x": "液体がまだ残っているかもしれない。"}, {"t": 1430.6166666666666, "x": "かつては表面が海に覆われていたと考えられています。"}, {"t": 1434.0333333333333, "x": "内側には熱が残り、有機物も見つかっています。"}, {"t": 1437.6333333333334, "x": "これだけの材料がそろうと、生命につながる化学が"}, {"t": 1441.1333333333334, "x": "起きうる場所として、科学者の関心が向きます。"}, {"t": 1444.3, "x": "生き物がいる、という意味ではありません。"}, {"t": 1447.0166666666667, "x": "調べる価値がある、という意味です。"}, {"t": 1449.5333333333333, "x": "すべての天体に、同じ決まりがあるわけではありません。"}, {"t": 1453.1666666666667, "x": "月や水星、金星は、生命を探す場所とは"}, {"t": 1456.8166666666666, "x": "考えられていないため、探査機を降ろしたり"}, {"t": 1459.6333333333334, "x": "落としたりしてもかまわないとされています。"}, {"t": 1461.8666666666666, "x": "小さな小惑星も、こうした決まりの外にあります。"}, {"t": 1465.4, "x": "ケレスは同じ小惑星帯にありますが、大きさも"}, {"t": 1468.8, "x": "中身も、それらとはまったく違う天体です。"}, {"t": 1471.75, "x": "ケレスは、そうではありませんでした。"}, {"t": 1474.2166666666667, "x": "そういう場所に、地球から来た"}, {"t": 1476.3333333333333, "x": "機体をぶつけるとどうなるか。"}, {"t": 1478.0166666666667, "x": "ドーンは、地球で組み立てられました。"}, {"t": 1480.5833333333333, "x": "どれほど気をつけても、地球の微生物や、地球の"}, {"t": 1484.2333333333333, "x": "物質がついたまま飛んできた可能性はあります。"}, {"t": 1487.0, "x": "もし、いつか別の探査機がケレスに降りて、"}, {"t": 1490.0, "x": "生命に関わる手がかりを探したとき。"}, {"t": 1492.7166666666667, "x": "見つけたものがケレスのものなのか、"}, {"t": 1494.6666666666667, "x": "ドーンが持ちこんだものなのか、"}, {"t": 1496.7333333333333, "x": "区別がつかなくなるおそれがあります。"}, {"t": 1499.2333333333333, "x": "そのため、ケレスには決まりがありました。"}, {"t": 1502.0166666666667, "x": "ドーンを、少なくとも二十年は、"}, {"t": 1504.3833333333334, "x": "ケレスに触れさせないこと。"}, {"t": 1506.2833333333333, "x": "チームの記録は、ここでよくある誤解を正しています。"}, {"t": 1509.85, "x": "二十年という数字は、宇宙の寒さや放射線で"}, {"t": 1513.2333333333333, "x": "微生物が死ぬのを待つための時間ではない、と。"}, {"t": 1516.4166666666667, "x": "地球の微生物の中には、とても丈夫なものがいます。"}, {"t": 1520.15, "x": "二十年より長く生き延びるものがいても、"}, {"t": 1522.6, "x": "おかしくないと書かれています。"}, {"t": 1524.6, "x": "二十年は、次の探査機を送るための時間です。"}, {"t": 1528.0833333333333, "x": "ドーンの発見を受けて、もし次の探査が決まったとき、"}, {"t": 1531.6, "x": "準備して送り届けるまでに、それくらいはかかる。"}, {"t": 1535.2166666666667, "x": "そのあいだ、ケレスを汚さずにおく。"}, {"t": 1537.8666666666666, "x": "この決まりが、最後の軌道の形を決めていました。"}, {"t": 1541.3666666666666, "x": "チームは、いちばん低い点の高さを"}, {"t": 1543.8166666666666, "x": "変えながら、たくさんの軌道を計算しました。"}, {"t": 1546.7666666666667, "x": "地球と同じように、ケレスの地下にも"}, {"t": 1549.35, "x": "重いところと軽いところがあります。"}, {"t": 1551.3166666666666, "x": "上を通るたびに、その引っぱりが、"}, {"t": 1553.6666666666667, "x": "何年もかけて軌道を少しずつゆがめます。"}, {"t": 1556.6166666666666, "x": "太陽の光が機体を押す、ほんのわずかな"}, {"t": 1559.5666666666666, "x": "力まで計算に入れました。"}, {"t": 1561.2833333333333, "x": "そうして出てきたのが、三十五キロメートルでした。"}, {"t": 1564.5333333333333, "x": "二十年は落ちないとチームが"}, {"t": 1566.2666666666667, "x": "確信できる、いちばん低い高さです。"}, {"t": 1569.0166666666667, "x": "もっと低い軌道に入れて、あとから上げるという"}, {"t": 1572.0, "x": "手は取れませんでした。"}, {"t": 1573.2833333333333, "x": "そのときまで、ヒドラジンが"}, {"t": 1575.1833333333334, "x": "残っている保証がなかったからです。"}, {"t": 1577.2666666666667, "x": "計算の答えは、二十年より先まで出ていました。"}, {"t": 1580.7833333333333, "x": "五十年たっても、ケレスに落ちる"}, {"t": 1583.0666666666666, "x": "確率は一パーセントに満たない。"}, {"t": 1585.1, "x": "九十九パーセントを超える確かさで、"}, {"t": 1587.4666666666667, "x": "半世紀後もドーンはケレスを回っている。"}, {"t": 1590.2166666666667, "x": "別の記録には、数十年、あるいは"}, {"t": 1593.2166666666667, "x": "何世紀も、と書かれています。"}, {"t": 1595.3333333333333, "x": "燃料が尽きたから、落とせなかったのではありません。"}, {"t": 1598.6666666666667, "x": "落ちないところに、先に置いてから、"}, {"t": 1601.0833333333333, "x": "燃料を使い切りました。"}, {"t": 1602.9833333333333, "x": "ドーンが止まったあとも、送られてきた"}, {"t": 1605.3666666666666, "x": "データは残りました。"}, {"t": 1606.6, "x": "二〇二〇年八月十日。"}, {"t": 1608.5833333333333, "x": "ネイチャーの名前がつく三つの科学誌に、ドーンの"}, {"t": 1611.6833333333334, "x": "最後の観測をもとにした論文が、まとめて載りました。"}, {"t": 1615.4166666666667, "x": "その中心にあったのは、あの白い点の、"}, {"t": 1618.2666666666667, "x": "その先の答えでした。"}, {"t": 1620.05, "x": "白い点が塩であることは、すでに分かっていました。"}, {"t": 1623.5333333333333, "x": "分かっていなかったのは、塩を"}, {"t": 1625.5, "x": "運んできた水が、どこから来たのかです。"}, {"t": 1628.2666666666667, "x": "答えは、重力の測定から出ました。"}, {"t": 1631.0333333333333, "x": "ずっと鳴っていた、あの一つの音です。"}, {"t": 1633.7, "x": "オッカトル・クレーターの下、深さ"}, {"t": 1635.8833333333334, "x": "およそ四十キロメートルに、塩水のたまりがある。"}, {"t": 1639.1833333333334, "x": "幅は、数百キロメートルを超える。"}, {"t": 1641.75, "x": "オッカトルをつくった衝突は、"}, {"t": 1643.4833333333333, "x": "約二千万年前と見積もられました。"}, {"t": 1646.1833333333334, "x": "二〇一六年の時点では八千万年前とされていたので、"}, {"t": 1649.8166666666666, "x": "ずっと若くなりました。"}, {"t": 1651.5333333333333, "x": "衝突の熱で、浅いところの氷が溶け、"}, {"t": 1654.5666666666666, "x": "そこから塩がしみ出しました。"}, {"t": 1656.7, "x": "熱は数百万年で冷めます。"}, {"t": 1658.7666666666667, "x": "けれど、衝突でできた深い割れ目が、"}, {"t": 1661.35, "x": "下の塩水のたまりまで届いていた。"}, {"t": 1663.8666666666666, "x": "そこから、塩水がしみ出し続けた、と"}, {"t": 1666.85, "x": "主任研究者は説明しています。"}, {"t": 1669.0, "x": "もう一つ、決め手になった発見があります。"}, {"t": 1671.8833333333334, "x": "白い点の中心、セレアリア白斑と呼ばれる"}, {"t": 1675.05, "x": "場所で、水と結びついた塩が見つかりました。"}, {"t": 1678.1833333333334, "x": "水を抱えた塩化ナトリウムです。"}, {"t": 1680.3333333333333, "x": "ケレスの表面では、水を抱えた塩は、"}, {"t": 1683.2333333333333, "x": "数百年ほどで水を失ってしまいます。"}, {"t": 1686.1666666666667, "x": "それなのに、まだ水を抱えていた。"}, {"t": 1688.7666666666667, "x": "ということは、その塩が地表に"}, {"t": 1691.0, "x": "出てきたのは、ごく最近です。"}, {"t": 1693.1833333333334, "x": "明るい場所の一部は、二百万年前より新しい。"}, {"t": 1696.7833333333333, "x": "地下から地表への動きは、いまも続いているかも"}, {"t": 1699.95, "x": "しれない、とNASAは書いています。"}, {"t": 1702.1333333333334, "x": "クレーターの床には、小さな丘もたくさん見つかりました。"}, {"t": 1705.85, "x": "地球の寒い土地で、凍った地下水が"}, {"t": 1708.4333333333334, "x": "地面を押し上げてできる丘に似ています。"}, {"t": 1710.8, "x": "準惑星でこうした丘が見つかったのは、初めてでした。"}, {"t": 1714.4666666666667, "x": "重力の測定からは、地下の固い層が、"}, {"t": 1717.3333333333333, "x": "深くなるほど重くなっていることも分かりました。"}, {"t": 1720.3833333333334, "x": "圧力だけでは説明できないほどです。"}, {"t": 1722.8333333333333, "x": "地下の塩水が凍っていくのにつれて、塩や泥が下のほうに"}, {"t": 1726.7833333333333, "x": "取り込まれているのではないか、と考えられています。"}, {"t": 1730.1333333333334, "x": "二〇一五年、白い点は氷かもしれないと言われました。"}, {"t": 1734.15, "x": "二〇一六年、それは塩だと分かりました。"}, {"t": 1737.3833333333334, "x": "二〇二〇年、その塩の下には、いまも液体の"}, {"t": 1741.1333333333334, "x": "水があるかもしれないと分かりました。"}, {"t": 1743.2, "x": "この答えを最後に運んできたのは、燃料が尽きる"}, {"t": 1746.5, "x": "直前の、地表三十五キロメートルの観測でした。"}, {"t": 1750.05, "x": "そしてそれは、ドーンを落とさなかった理由を、"}, {"t": 1752.95, "x": "あとから裏づけることにもなりました。"}, {"t": 1755.4166666666667, "x": "NASAは、この発表の中で、ドーンを長く"}, {"t": 1758.6166666666666, "x": "落ちない軌道に置いた理由をあらためて書いています。"}, {"t": 1761.5333333333333, "x": "表面 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
