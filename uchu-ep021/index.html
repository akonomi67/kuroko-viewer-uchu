<script>
const D={"name": "ep021", "file": "ep021", "dur": 1865.6333125, "segs": [], "subs": [{"t": 0.0, "x": "太陽系の外へ向かう探査機、パイオニア10号。"}, {"t": 3.533333333333333, "x": "二十一か月の予定で打ち上げられ、"}, {"t": 5.75, "x": "三十年あまり地球へ電波を送り続けました。"}, {"t": 9.083333333333334, "x": "最後の電波を地上のアンテナが"}, {"t": 11.0, "x": "とらえたのは、二〇〇三年一月です。"}, {"t": 13.7, "x": "地球から約百二十二億キロメートル先から"}, {"t": 16.533333333333335, "x": "届いた、かすかな電波でした。"}, {"t": 18.716666666666665, "x": "光の速さで進む電波でも、届くまでに"}, {"t": 21.683333333333334, "x": "十一時間二十分かかる距離でした。"}, {"t": 23.983333333333334, "x": "届いた信号はとても弱いものでした。"}, {"t": 26.416666666666668, "x": "機体の様子を伝える数字は、もう読み取れません。"}, {"t": 29.833333333333332, "x": "かすかな電波がそこにあると分かるだけでした。"}, {"t": 32.483333333333334, "x": "翌月にも地上のアンテナは耳をすませました。"}, {"t": 35.45, "x": "何も聞こえませんでした。"}, {"t": 37.083333333333336, "x": "三年後の呼びかけにも、返事は戻りませんでした。"}, {"t": 40.583333333333336, "x": "これが、パイオニア10号から"}, {"t": 42.63333333333333, "x": "届いた最後の信号になりました。"}, {"t": 44.8, "x": "この探査機はいまどこを飛んでいるのか。"}, {"t": 47.18333333333333, "x": "いまの姿をとらえた写真は、どこにもありません。"}, {"t": 50.583333333333336, "x": "電波も、もう届きません。"}, {"t": 52.6, "x": "あるのは打ち上げからの記録と、"}, {"t": 54.43333333333333, "x": "それをもとにした計算だけです。"}, {"t": 56.75, "x": "パイオニア10号には兄弟の機体がありました。"}, {"t": 59.666666666666664, "x": "翌年に打ち上げられたパイオニア11号です。"}, {"t": 62.65, "x": "二機は太陽系の外へ向かって飛び続けています。"}, {"t": 65.73333333333333, "x": "どちらからも声は届きません。"}, {"t": 67.71666666666667, "x": "そして二機には、不思議な記録が残りました。"}, {"t": 70.8, "x": "計算で出した位置と実際の位置が、"}, {"t": 72.95, "x": "少しずつずれていったのです。"}, {"t": 75.0, "x": "二機とも、太陽の側へわずかに"}, {"t": 77.3, "x": "引き戻されているように見えました。"}, {"t": 79.3, "x": "なぜなのか。"}, {"t": 80.23333333333333, "x": "答えは長いあいだ出ませんでした。"}, {"t": 82.35, "x": "その原因をめぐって長い調べものが続きました。"}, {"t": 85.45, "x": "古い磁気テープを探し出す作業。"}, {"t": 87.6, "x": "捨てられかけた機械を救い出す作業。"}, {"t": 89.96666666666667, "x": "それも、この調べものの一部でした。"}, {"t": 92.61666666666666, "x": "ここから先は、二機の声が消えるまでの記録をたどります。"}, {"t": 96.5, "x": "そして残された小さなずれの行方を追います。"}, {"t": 99.33333333333333, "x": "はじめの計画は、とても短いものでした。"}, {"t": 102.36666666666666, "x": "木星のそばを一度だけ通り過ぎて、観測を終える。"}, {"t": 106.11666666666666, "x": "それだけです。"}, {"t": 107.13333333333334, "x": "計画が認められたのは、一九六九年二月でした。"}, {"t": 111.43333333333334, "x": "認めたのはNASAです。"}, {"t": 112.83333333333333, "x": "二機の探査機で木星を目指す計画でした。"}, {"t": 115.65, "x": "翌年、機体づくりはカリフォルニア州の"}, {"t": 118.38333333333334, "x": "会社、TRWに任されます。"}, {"t": 121.11666666666666, "x": "工場はレドンドビーチという町にありました。"}, {"t": 123.81666666666666, "x": "運用を受け持つのは、NASAのエイムズ研究センターです。"}, {"t": 127.51666666666667, "x": "パイオニア10号の打ち上げは、一九七二年三月でした。"}, {"t": 132.06666666666666, "x": "場所はアメリカのフロリダ州、ケープ・カナベラルです。"}, {"t": 135.43333333333334, "x": "ロケットはアトラス・セントールでした。"}, {"t": 137.5, "x": "機体は時速約五万一千七百キロメートルで、"}, {"t": 140.61666666666667, "x": "地球を離れました。"}, {"t": 142.26666666666668, "x": "それまでに人が作った物の中で、最も速い物でした。"}, {"t": 146.26666666666668, "x": "月の軌道を越えるまでに、十一時間もかかりませんでした。"}, {"t": 150.25, "x": "目的は木星のそばを通り過ぎることです。"}, {"t": 153.08333333333334, "x": "予定された期間は二十一か月でした。"}, {"t": 155.6, "x": "木星に着いて観測を終えるまでの長さです。"}, {"t": 158.51666666666668, "x": "打ち上げの月のうちに、進路の"}, {"t": 160.75, "x": "細かい直しが二回行われました。"}, {"t": 163.06666666666666, "x": "三月七日と三月二十六日です。"}, {"t": 165.71666666666667, "x": "機体の重さは二百五十八キログラムです。"}, {"t": 168.56666666666666, "x": "小さな乗用車よりずっと軽い機体でした。"}, {"t": 171.25, "x": "いちばん目立つのは、皿の形をした大きなアンテナです。"}, {"t": 175.01666666666668, "x": "直径は二・七四メートルあります。"}, {"t": 177.33333333333334, "x": "機体の本体はこの皿の裏側に付いていました。"}, {"t": 180.4, "x": "電波を送る装置は二つ積まれていました。"}, {"t": 183.08333333333334, "x": "出力はそれぞれ八ワットです。"}, {"t": 185.16666666666666, "x": "小さな電球ほどの力しかありません。"}, {"t": 187.66666666666666, "x": "その弱い電波を、地上の大きなアンテナで受け止めます。"}, {"t": 191.33333333333334, "x": "電気をつくる仕組みにも特徴がありました。"}, {"t": 193.93333333333334, "x": "木星の近くまで来ると、太陽の光は頼りなくなります。"}, {"t": 198.03333333333333, "x": "太陽電池の板では電気が足りません。"}, {"t": 200.53333333333333, "x": "そこで積まれたのが、放射性同位体熱電気転換器です。"}, {"t": 204.61666666666667, "x": "中に入っているのはプルトニウム238です。"}, {"t": 207.5, "x": "ゆっくり壊れながら、長いあいだ熱を出し続ける物質です。"}, {"t": 211.56666666666666, "x": "燃やさなくても、置くだけで熱が出ます。"}, {"t": 214.3, "x": "その熱を電気に変える装置です。"}, {"t": 216.53333333333333, "x": "燃料を足す必要はありません。"}, {"t": 218.6, "x": "何年も電気をつくり続けられます。"}, {"t": 220.9, "x": "この装置は四つありました。"}, {"t": 222.73333333333332, "x": "四つとも、機体から伸びた腕の先に付いています。"}, {"t": 226.15, "x": "機体の中心から約三メートル離れた場所です。"}, {"t": 229.2, "x": "打ち上げのときの電気は約百五十五ワットでした。"}, {"t": 232.36666666666667, "x": "木星に着いたころには、約百四十ワットに"}, {"t": 235.55, "x": "下がっていました。"}, {"t": 236.53333333333333, "x": "熱のもとは少しずつ減っていきます。"}, {"t": 238.8, "x": "だから電気も年ごとに減ります。"}, {"t": 240.83333333333334, "x": "この減り方がのちに機体の寿命を決めます。"}, {"t": 243.56666666666666, "x": "そして、この熱はもう一つの形で記録に残ります。"}, {"t": 247.35, "x": "それは第8章で触れます。"}, {"t": 249.2, "x": "機体は回りながら飛びました。"}, {"t": 251.06666666666666, "x": "回ることで向きが安定するからです。"}, {"t": 253.38333333333333, "x": "運用の終わりのころの回転は、十四・一秒に一回でした。"}, {"t": 257.73333333333335, "x": "積まれた観測の装置は十を超えていました。"}, {"t": 260.55, "x": "磁場を測るもの、粒を数えるもの、光を測るものなどです。"}, {"t": 265.05, "x": "費用も記録に残っています。"}, {"t": 266.98333333333335, "x": "開発から一九九七年までで、"}, {"t": 269.6333333333333, "x": "約三億五千万ドルと見積もられています。"}, {"t": 272.6333333333333, "x": "二〇〇一年のドルに直した額です。"}, {"t": 275.05, "x": "二十一か月の予定で作られた機体でした。"}, {"t": 277.81666666666666, "x": "実際には三十年以上働くことになります。"}, {"t": 280.85, "x": "木星へ向かう途中には、越えなければならない"}, {"t": 283.95, "x": "場所がありました。"}, {"t": 284.95, "x": "火星と木星のあいだの、小惑星帯です。"}, {"t": 288.1, "x": "そこには岩のかけらが数多く回っています。"}, {"t": 290.9, "x": "それまでここを通り抜けた探査機はありませんでした。"}, {"t": 293.98333333333335, "x": "機体を傷つける粒がどれほど多いのか。"}, {"t": 296.55, "x": "それが分かっていなかったのです。"}, {"t": 298.46666666666664, "x": "無事に通り抜けられるかどうかは、"}, {"t": 300.3666666666667, "x": "確かではありませんでした。"}, {"t": 302.25, "x": "パイオニア10号は一九七二年七月十五日に"}, {"t": 305.98333333333335, "x": "小惑星帯へ入りました。"}, {"t": 307.71666666666664, "x": "八月二日には、直径約八百メートルの"}, {"t": 310.8666666666667, "x": "小惑星のそばを通りました。"}, {"t": 312.76666666666665, "x": "そばといっても、約八百八十万キロメートル先です。"}, {"t": 316.5833333333333, "x": "十二月二日には、ニケという小惑星のそばも通りました。"}, {"t": 320.71666666666664, "x": "差し渡しが約二十四キロメートルの小惑星です。"}, {"t": 324.1166666666667, "x": "抜け出したのは一九七三年二月十五日でした。"}, {"t": 327.8833333333333, "x": "入ってから約七か月後です。"}, {"t": 329.9166666666667, "x": "そのあいだに進んだ道のりは、"}, {"t": 331.73333333333335, "x": "約四億三千五百万キロメートルでした。"}, {"t": 334.85, "x": "機体は無事でした。"}, {"t": 336.1166666666667, "x": "小惑星帯を越えた最初の探査機になりました。"}, {"t": 339.25, "x": "一九七三年十一月六日、木星を撮る作業が始まります。"}, {"t": 344.48333333333335, "x": "このとき、木星までは"}, {"t": 346.3, "x": "まだ約二千六百万キロメートルありました。"}, {"t": 349.05, "x": "十一月二十六日には、一つの境目を横切りました。"}, {"t": 353.3, "x": "木星の磁場がつくる境目です。"}, {"t": 355.5, "x": "そして十二月。"}, {"t": 356.75, "x": "パイオニア10号は木星に最も近づきました。"}, {"t": 359.85, "x": "雲の上から約十三万キロメートルのところです。"}, {"t": 363.0, "x": "機体は時速約十二万六千キロメートルで飛んでいました。"}, {"t": 366.68333333333334, "x": "木星を間近に観測した最初の探査機です。"}, {"t": 369.73333333333335, "x": "木星の雲の模様も、間近から写されました。"}, {"t": 373.1, "x": "十二月一日の時点で、届いた画像は"}, {"t": 376.03333333333336, "x": "地上の望遠鏡の写真を上回っていました。"}, {"t": 378.8333333333333, "x": "撮られた画像は全部で約五百枚とされています。"}, {"t": 381.93333333333334, "x": "細かいものでは、約三百二十キロメートルの"}, {"t": 385.1333333333333, "x": "大きさまで見分けられました。"}, {"t": 386.73333333333335, "x": "衛星も写されています。"}, {"t": 388.4, "x": "カリスト、ガニメデ、エウロパです。"}, {"t": 391.31666666666666, "x": "どれも粗い画像でした。"}, {"t": 392.8666666666667, "x": "木星の裏側へ回り込むときの電波も、役に立ちました。"}, {"t": 396.9, "x": "電波が木星の大気をくぐる様子から、"}, {"t": 399.3, "x": "大気のつくりが調べられたのです。"}, {"t": 401.71666666666664, "x": "木星は、ほとんどが液体でできた惑星らしい。"}, {"t": 405.15, "x": "そのことも、この旅で確かめられました。"}, {"t": 408.0, "x": "木星のまわりには、強い放射線の帯があります。"}, {"t": 411.5, "x": "10号はその帯の広がりを測り、"}, {"t": 413.6333333333333, "x": "木星の磁場の様子もとらえました。"}, {"t": 416.15, "x": "ただ、その放射線は機体にも影響しました。"}, {"t": 419.4166666666667, "x": "衛星イオの画像は、強い放射線のせいで失われています。"}, {"t": 423.56666666666666, "x": "偽の命令が引き起こされたこともありました。"}, {"t": 426.3333333333333, "x": "そのため、観測の目標のうち一つだけを"}, {"t": 429.3666666666667, "x": "果たせませんでした。"}, {"t": 430.5, "x": "ほかの目標はすべて果たされています。"}, {"t": 432.9, "x": "十一ある装置のうち六つは、木星に"}, {"t": 435.71666666666664, "x": "近づくあいだも休まず動き続けました。"}, {"t": 438.18333333333334, "x": "一九七四年一月二日、木星での"}, {"t": 441.7, "x": "観測は終わったとされました。"}, {"t": 443.43333333333334, "x": "ここで、当初の二十一か月の仕事は終わりです。"}, {"t": 446.95, "x": "けれども、パイオニア10号は止まりませんでした。"}, {"t": 450.15, "x": "木星の重力を受けて、機体は速さを増していました。"}, {"t": 453.96666666666664, "x": "その向きは太陽系の外です。"}, {"t": 456.03333333333336, "x": "もう、どの惑星にも寄りません。"}, {"t": 458.3833333333333, "x": "あとは太陽から遠ざかるだけです。"}, {"t": 460.5833333333333, "x": "地上の人々はその後も電波を受け続けました。"}, {"t": 463.6, "x": "遠くへ行くほど、太陽系の外側の様子が分かるからです。"}, {"t": 467.6666666666667, "x": "一九七六年二月には、土星の軌道より外へ出ていました。"}, {"t": 472.46666666666664, "x": "その後もパイオニア10号は、外へ外へと進みます。"}, {"t": 476.1333333333333, "x": "その一方で、もう一機のパイオニアは"}, {"t": 478.75, "x": "別の道を進んでいました。"}, {"t": 480.51666666666665, "x": "パイオニア11号が打ち上げられたのは、"}, {"t": 482.98333333333335, "x": "一九七三年四月です。"}, {"t": 485.6333333333333, "x": "10号が木星に着く八か月ほど前でした。"}, {"t": 488.5, "x": "外へ向かう途中で、気がかりなことが一つありました。"}, {"t": 492.1, "x": "電気をつくる装置の腕の一本が、"}, {"t": 494.28333333333336, "x": "すぐには伸びなかったのです。"}, {"t": 496.26666666666665, "x": "ただ、それはほんの一時のことでした。"}, {"t": 498.9166666666667, "x": "11号には、もう一つ事情がありました。"}, {"t": 501.98333333333335, "x": "電波を送る装置は二つあります。"}, {"t": 504.25, "x": "そのうち予備の方を、打ち上げのときから"}, {"t": 506.96666666666664, "x": "ずっと使っていたのです。"}, {"t": 508.35, "x": "機体の回転は一分に約四・八回でした。"}, {"t": 511.4, "x": "重さでいえば、こちらは二百五十九キログラムです。"}, {"t": 515.0833333333334, "x": "10号とほぼ同じでした。"}, {"t": 516.7833333333333, "x": "11号も、まず木星を目指しました。"}, {"t": 519.7666666666667, "x": "一九七四年十二月三日、木星に最も近づきます。"}, {"t": 524.55, "x": "雲の上から約四万二千五百キロメートルでした。"}, {"t": 527.7666666666667, "x": "10号の三分の一ほどの距離です。"}, {"t": 530.1166666666667, "x": "木星のあたりでは、電波の一往復に九十二分かかりました。"}, {"t": 534.55, "x": "電気は約百四十四ワット出ていました。"}, {"t": 537.2666666666667, "x": "ここで11号は進路を大きく曲げます。"}, {"t": 539.95, "x": "木星の重力を使って、次の行き先へ向かいました。"}, {"t": 543.8, "x": "行き先は土星です。"}, {"t": 545.1833333333333, "x": "木星から土星までは長い道のりでした。"}, {"t": 547.8833333333333, "x": "土星に着いたのは一九七九年九月一日です。"}, {"t": 551.6833333333333, "x": "木星を離れてから五年近くがたっていました。"}, {"t": 554.6333333333333, "x": "11号は、土星の雲の上から"}, {"t": 557.0833333333334, "x": "約二万九百キロメートルのところを通りました。"}, {"t": 560.0666666666667, "x": "土星のそばを通った最初の探査機です。"}, {"t": 562.6, "x": "この旅ではいくつもの発見がありました。"}, {"t": 565.0666666666667, "x": "一つは新しい環です。"}, {"t": 566.6666666666666, "x": "A環の外側に細い環が見つかりました。"}, {"t": 569.3666666666667, "x": "のちにF環と名付けられます。"}, {"t": 571.2833333333333, "x": "もう一つは新しい衛星です。"}, {"t": 573.3666666666667, "x": "差し渡し約二百キロメートルの小さな衛星でした。"}, {"t": 576.7666666666667, "x": "土星の温度も測られました。"}, {"t": 578.6333333333333, "x": "結果はマイナス百八十度です。"}, {"t": 580.7833333333333, "x": "土星で最も大きな衛星、タイタンも測られました。"}, {"t": 584.4166666666666, "x": "平均でマイナス百九十三度とされています。"}, {"t": 587.35, "x": "分析からは、土星の中身は主に液体の"}, {"t": 590.3333333333334, "x": "水素らしいと示されました。"}, {"t": 592.0833333333334, "x": "土星に着いたころ、電気は約百ワットまで落ちていました。"}, {"t": 596.0333333333333, "x": "土星を過ぎた11号は、太陽系の外へ向かいます。"}, {"t": 599.9333333333333, "x": "向かう先は銀河の中心の方角です。"}, {"t": 602.5666666666667, "x": "星座で言えば、いて座のあたりです。"}, {"t": 605.1, "x": "電気はその後も減り続けました。"}, {"t": 607.1666666666666, "x": "一九八五年二月からは、やり方を変えます。"}, {"t": 611.0, "x": "観測の装置どうしで電気を分け合うのです。"}, {"t": 613.7666666666667, "x": "全部を一度に動かす電気が、もう無かったからです。"}, {"t": 617.25, "x": "けれども、11号の声は10号より先に消えました。"}, {"t": 621.0833333333334, "x": "一九九五年九月三十日、毎日の"}, {"t": 624.6833333333333, "x": "記録の受け取りが終わりました。"}, {"t": 626.4333333333333, "x": "どの装置を動かすにも、電気が足りなくなったのです。"}, {"t": 630.0166666666667, "x": "この年の終わり、11号は太陽から"}, {"t": 632.8333333333334, "x": "四十四・七天文単位のところにいました。"}, {"t": 635.6333333333333, "x": "一年に二・五天文単位ずつ離れる速さです。"}, {"t": 638.75, "x": "エイムズ研究センターが最後に11号と"}, {"t": 641.4, "x": "連絡をとったのも、九月三十日です。"}, {"t": 644.25, "x": "その年の十一月二十四日にも、"}, {"t": 646.5666666666667, "x": "数分間だけ機体の記録が届きました。"}, {"t": 649.4666666666667, "x": "そのあと、連絡は再び途絶えます。"}, {"t": 652.2666666666667, "x": "それから先、11号の声は戻っていません。"}, {"t": 655.7166666666667, "x": "NASAは、11号の運用は"}, {"t": 657.8333333333334, "x": "一九九五年に終わったとしています。"}, {"t": 660.55, "x": "土星を初めて間近に見た機体は、"}, {"t": 662.7333333333333, "x": "こうして静かになりました。"}, {"t": 664.6666666666666, "x": "先に旅立った10号はまだ話し続けていました。"}, {"t": 667.8, "x": "目指す惑星がなくなったあと、"}, {"t": 669.65, "x": "パイオニア10号の仕事は二度変わりました。"}, {"t": 672.6166666666667, "x": "一度目のきっかけは、一九八三年に訪れます。"}, {"t": 676.7166666666667, "x": "一九八三年六月十三日。"}, {"t": 679.6166666666667, "x": "パイオニア10号は海王星の軌道を越えました。"}, {"t": 682.6833333333333, "x": "当時、太陽から最も遠くを回る惑星は海王星でした。"}, {"t": 687.05, "x": "冥王星が、海王星の軌道の内側に"}, {"t": 690.1, "x": "入っていた時期だったからです。"}, {"t": 691.7833333333333, "x": "パイオニア10号は、その外に"}, {"t": 693.9666666666667, "x": "出た最初の人工物になりました。"}, {"t": 696.15, "x": "海王星の通り道は、太陽から約四十五億キロメートルです。"}, {"t": 700.7, "x": "10号は打ち上げから十一年あまりで、"}, {"t": 703.1666666666666, "x": "そこを越えたことになります。"}, {"t": 705.1666666666666, "x": "この先に目指す惑星はありません。"}, {"t": 707.4166666666666, "x": "それでも10号は、外へ進むことをやめません。"}, {"t": 710.65, "x": "地上のアンテナも、耳を向け続けます。"}, {"t": 713.5166666666667, "x": "一度目の変わり目です。"}, {"t": 715.05, "x": "機体には新しい役目がありました。"}, {"t": 717.3666666666667, "x": "太陽の影響がどこまで届くかを測る役目です。"}, {"t": 720.5833333333334, "x": "太陽から吹き出す粒の流れ。"}, {"t": 722.5833333333334, "x": "宇宙から飛んでくる粒の数。"}, {"t": 724.5, "x": "それを記録し続けたのです。"}, {"t": 726.3833333333333, "x": "そして一九九七年三月三十一日。"}, {"t": 729.8666666666667, "x": "決まった時間に連絡をとる運用が終わりました。"}, {"t": 732.8166666666667, "x": "理由は予算です。"}, {"t": 734.1166666666667, "x": "このとき機体は、地球から"}, {"t": 736.0666666666667, "x": "六十七天文単位のところにいました。"}, {"t": 738.55, "x": "一天文単位は、地球と太陽の距離です。"}, {"t": 741.7, "x": "つまり、太陽と地球の距離の六十七倍です。"}, {"t": 745.2, "x": "機体はそこから、毎年二・六天文単位ずつ"}, {"t": 748.5166666666667, "x": "遠ざかっていました。"}, {"t": 749.6666666666666, "x": "科学の観測としての仕事は、ここで一区切りになりました。"}, {"t": 753.6833333333333, "x": "それでも電波を聞く作業は続きます。"}, {"t": 756.1333333333333, "x": "ここが二度目の変わり目です。"}, {"t": 757.9, "x": "次の役目は、通信の技術を調べることでした。"}, {"t": 761.45, "x": "遠くて弱い電波を、どこまで拾えるか。"}, {"t": 764.4333333333333, "x": "それを試す相手として、パイオニア10号は使われました。"}, {"t": 768.3833333333333, "x": "宇宙からの電波をつかまえる"}, {"t": 770.0166666666667, "x": "手順を、運用の担当者が覚える。"}, {"t": 772.8166666666667, "x": "その練習の相手にもなりました。"}, {"t": 774.9, "x": "一九九八年二月十七日には、一つの節目がありました。"}, {"t": 779.7833333333333, "x": "ボイジャー1号が、パイオニア10号を追い越したのです。"}, {"t": 783.3166666666667, "x": "それまで長いあいだ、パイオニア10号は"}, {"t": 786.0333333333333, "x": "最も遠くにいる人工物でした。"}, {"t": 788.2166666666667, "x": "この日から、その役はボイジャー1号に移ります。"}, {"t": 791.5666666666667, "x": "このとき、パイオニア10号は"}, {"t": 793.6666666666666, "x": "六十九・四天文単位のところにいました。"}, {"t": 796.5666666666667, "x": "二〇〇〇年八月五日にも、機体の状態を"}, {"t": 799.5833333333334, "x": "伝える信号が届いています。"}, {"t": 801.4333333333333, "x": "ところが、そのあと連絡が途絶えました。"}, {"t": 804.1833333333333, "x": "つながったのは、翌年の四月です。"}, {"t": 806.8166666666667, "x": "機体の通信の方式を切り替えて、ようやく声が戻りました。"}, {"t": 811.0333333333333, "x": "二〇〇一年七月九日にも連絡がとれています。"}, {"t": 814.3833333333333, "x": "そして二〇〇二年三月一日。"}, {"t": 816.55, "x": "場所はカリフォルニア州のゴールドストーンです。"}, {"t": 819.2333333333333, "x": "そこのアンテナから、10号へ電波が送られました。"}, {"t": 822.6333333333333, "x": "返事を聞いたのは、スペインのマドリードにある施設です。"}, {"t": 826.2166666666667, "x": "直径七十メートルのアンテナが、"}, {"t": 828.2666666666667, "x": "10号の返事をとらえました。"}, {"t": 830.4333333333333, "x": "送ってから二十二時間後のことでした。"}, {"t": 832.8333333333334, "x": "返事が届いたのは三月二日です。"}, {"t": 835.1666666666666, "x": "打ち上げからちょうど三十年の日でした。"}, {"t": 837.6, "x": "そのころの10号は、地球から"}, {"t": 839.8, "x": "約百十九億キロメートル先です。"}, {"t": 842.2166666666667, "x": "エイムズ研究センターの担当者は、こう話しています。"}, {"t": 845.9166666666666, "x": "これまでも見限られかけたが、"}, {"t": 847.6166666666667, "x": "なぜかいつも持ちこたえてきた、と。"}, {"t": 850.35, "x": "打ち上げにも立ち会った別の担当者は、こう話しました。"}, {"t": 854.0666666666667, "x": "これほど長くもつとは驚きだ、と。"}, {"t": 856.6333333333333, "x": "そして二〇〇二年四月二十七日。"}, {"t": 859.0833333333334, "x": "この日が、機体の記録を読み取れた"}, {"t": 861.5, "x": "最後の連絡になりました。"}, {"t": 863.2, "x": "記録を送る速さもずいぶん落ちていました。"}, {"t": 865.8833333333333, "x": "木星へ向かうころは、一秒に二千四十八ビットでした。"}, {"t": 870.0, "x": "運用の終わりのころには、一秒に"}, {"t": 872.4833333333333, "x": "十六ビットまで下がっています。"}, {"t": 874.3166666666667, "x": "文字にすれば、一秒に二文字ほどです。"}, {"t": 877.25, "x": "それでも電波は届いていました。"}, {"t": 879.2833333333333, "x": "パイオニア10号が電波を送り出す"}, {"t": 881.45, "x": "力は、八ワットしかありません。"}, {"t": 883.7666666666667, "x": "その電波が弱くなっていった理由は二つあります。"}, {"t": 886.8, "x": "一つは距離です。"}, {"t": 888.0, "x": "遠くへ行くほど、電波は薄く広がって届きます。"}, {"t": 891.4166666666666, "x": "もう一つは電気です。"}, {"t": 892.8833333333333, "x": "パイオニア10号の電気は、"}, {"t": 894.5666666666667, "x": "プルトニウムの熱からつくられていました。"}, {"t": 897.25, "x": "その熱は、時がたつほど弱まっていきます。"}, {"t": 900.3166666666667, "x": "電気が減れば、使える装置も減ります。"}, {"t": 903.1833333333333, "x": "観測の装置も、一つまた一つと止まっていきました。"}, {"t": 906.7166666666667, "x": "小さな塵の粒を数える装置は、"}, {"t": 908.9166666666666, "x": "一九七三年十二月に止まっています。"}, {"t": 912.3833333333333, "x": "磁場を測る装置の一つは、一九七五年十一月に"}, {"t": 916.7666666666667, "x": "止まりました。"}, {"t": 917.55, "x": "二〇〇〇年八月の時点で、まだ記録を"}, {"t": 920.3, "x": "送っていた観測の装置は一つだけでした。"}, {"t": 922.9, "x": "エネルギーの高い粒を数える装置です。"}, {"t": 925.5166666666667, "x": "やがて、電波を送るための電気も"}, {"t": 927.9666666666667, "x": "足りなくなっていきました。"}, {"t": 929.35, "x": "二〇〇二年四月二十七日の連絡では、"}, {"t": 932.05, "x": "まだ記録を読み取れました。"}, {"t": 934.0333333333333, "x": "そのあとの三回はどれも信号がかすかでした。"}, {"t": 936.9166666666666, "x": "機体の状態を示す数字は、もう受け取れません。"}, {"t": 940.3666666666667, "x": "その三回目が二〇〇三年一月の信号です。"}, {"t": 943.5333333333333, "x": "最後に記録が読めた日から、九か月ほどあとのことでした。"}, {"t": 947.4333333333333, "x": "このとき地上からは、一つの命令が送られていました。"}, {"t": 951.15, "x": "最後まで動いていた観測の装置を止める命令です。"}, {"t": 954.5666666666667, "x": "その後に届いたのが、このかすかな信号でした。"}, {"t": 957.9333333333333, "x": "記録を受け取るための信号の"}, {"t": 959.7333333333333, "x": "部分には、合わせられませんでした。"}, {"t": 962.1166666666667, "x": "このときパイオニア10号は、地球から"}, {"t": 964.7166666666667, "x": "約百二十二億キロメートルにいました。"}, {"t": 967.2166666666667, "x": "地球と太陽の間を、約八十二個並べた遠さです。"}, {"t": 971.1166666666667, "x": "光の速さで進む電波でも、片道十一時間二十分かかります。"}, {"t": 975.8666666666667, "x": "あの八ワットの電波が、百二十億キロメートルを"}, {"t": 979.2833333333333, "x": "超えて旅をします。"}, {"t": 980.45, "x": "地上に着くころには、とても弱くなっています。"}, {"t": 983.5833333333334, "x": "それを拾うのが、深宇宙通信網と"}, {"t": 986.3333333333334, "x": "呼ばれる地上のアンテナです。"}, {"t": 987.9833333333333, "x": "前の年の連絡では、直径七十メートルの"}, {"t": 991.2333333333333, "x": "アンテナが返事をとらえていました。"}, {"t": 993.15, "x": "二〇〇三年二月七日、NASAはもう一度連絡を試みました。"}, {"t": 997.55, "x": "何も検出されませんでした。"}, {"t": 999.4833333333333, "x": "NASAは、電気をつくる装置の力が落ちたと考えました。"}, {"t": 1003.4, "x": "電波を送るだけの電気が、もう無いのかもしれない。"}, {"t": 1006.7833333333333, "x": "そういう見立てです。"}, {"t": 1008.1, "x": "そして、これ以上の連絡は予定しないと発表しました。"}, {"t": 1012.0166666666667, "x": "発表の日付は二〇〇三年二月二十五日です。"}, {"t": 1015.2833333333333, "x": "ただ、これで最後にはなりませんでした。"}, {"t": 1018.0166666666667, "x": "三年がたちました。"}, {"t": 1019.4, "x": "二〇〇六年三月、パイオニア10号へ"}, {"t": 1022.2333333333333, "x": "もう一度だけ呼びかけが行われました。"}, {"t": 1024.5666666666666, "x": "機体からの声は、届きませんでした。"}, {"t": 1027.25, "x": "二十一か月の予定で打ち上げられた機体です。"}, {"t": 1030.1666666666667, "x": "それが三十年以上、声を届けました。"}, {"t": 1033.2, "x": "最後の声は意味のある言葉を運んでいません。"}, {"t": 1036.1, "x": "そこにいる、ということだけを伝える電波でした。"}, {"t": 1039.3333333333333, "x": "ただ、二機が残したものは声だけではありません。"}, {"t": 1042.5666666666666, "x": "電波が届くたびに、もう一つの情報が刻まれていました。"}, {"t": 1046.4833333333333, "x": "二機がどれだけの速さで遠ざかっているか、という"}, {"t": 1049.65, "x": "情報です。"}, {"t": 1050.45, "x": "その記録の中に、説明のつかない"}, {"t": 1053.0, "x": "ずれが見つかっていました。"}, {"t": 1054.4166666666667, "x": "探査機の速さは電波の高さで測ります。"}, {"t": 1057.1, "x": "救急車のサイレンを思い浮かべると"}, {"t": 1059.2333333333333, "x": "分かりやすいかもしれません。"}, {"t": 1060.8333333333333, "x": "近づくときは高く聞こえます。"}, {"t": 1062.7833333333333, "x": "遠ざかるときは低く聞こえます。"}, {"t": 1064.85, "x": "電波でも同じことが起こります。"}, {"t": 1066.8166666666666, "x": "遠ざかる探査機の電波は、ほんの少し低くなって届きます。"}, {"t": 1070.9, "x": "その違いを測れば、遠ざかる速さが分かります。"}, {"t": 1074.35, "x": "パイオニアの二機はこの測り方に向いていました。"}, {"t": 1077.2833333333333, "x": "回りながら飛ぶので、向きを"}, {"t": 1079.35, "x": "直す噴射がめったにありません。"}, {"t": 1081.2166666666667, "x": "余計な力が加わりにくい機体でした。"}, {"t": 1083.7833333333333, "x": "太陽や惑星の重力だけで飛んでいると"}, {"t": 1086.3166666666666, "x": "考えやすかったのです。"}, {"t": 1087.7666666666667, "x": "ところが、計算と測った速さが合いませんでした。"}, {"t": 1091.1333333333334, "x": "二機とも、計算よりわずかに遅いのです。"}, {"t": 1094.0666666666666, "x": "まるで太陽の側へ、"}, {"t": 1095.45, "x": "ほんの少し引き戻されているようでした。"}, {"t": 1098.1666666666667, "x": "最初に気づいたのは一九八〇年代の初めです。"}, {"t": 1101.7333333333333, "x": "二機が土星のあたりにさしかかったころでした。"}, {"t": 1104.3833333333334, "x": "運用の担当者たちは、はじめ燃料の"}, {"t": 1107.15, "x": "残りが漏れていると考えました。"}, {"t": 1109.1166666666666, "x": "けれども、ずれは消えませんでした。"}, {"t": 1111.5333333333333, "x": "何年たっても、同じ向きに残り続けたのです。"}, {"t": 1114.8833333333334, "x": "一九九八年になりました。"}, {"t": 1117.3666666666666, "x": "二機は太陽から百三十億キロメートルを"}, {"t": 1120.0666666666666, "x": "超えるところにいます。"}, {"t": 1121.3333333333333, "x": "この年、ジェット推進研究所の"}, {"t": 1123.8833333333334, "x": "ジョン・アンダーソンらが論文を出しました。"}, {"t": 1126.1333333333334, "x": "題は、弱くて遠くまで届く、"}, {"t": 1128.3666666666666, "x": "見かけ上の異常な加速の兆しです。"}, {"t": 1131.0333333333333, "x": "二機に加えて、木星へ向かった"}, {"t": 1133.4166666666667, "x": "ガリレオの記録も調べました。"}, {"t": 1135.2333333333333, "x": "太陽の極の上を回ったユリシーズの記録もです。"}, {"t": 1138.4166666666667, "x": "アンダーソンたちは、二つの"}, {"t": 1140.2833333333333, "x": "別々の計算の方法で記録を調べました。"}, {"t": 1143.2333333333333, "x": "いくつもの原因を、一つずつ外していきました。"}, {"t": 1146.5, "x": "論文によれば、二機には小さな力が"}, {"t": 1149.2833333333333, "x": "働いているように見えました。"}, {"t": 1151.0166666666667, "x": "向きは太陽の方です。"}, {"t": 1152.65, "x": "大きさは一定でした。"}, {"t": 1154.1166666666666, "x": "二〇〇二年の論文では、その大きさが詳しく出されました。"}, {"t": 1157.9666666666667, "x": "一秒ごとに、速さが秒速十億分の"}, {"t": 1160.9333333333334, "x": "〇・八七四メートルずつ落ちていく。"}, {"t": 1163.7666666666667, "x": "そんな程度の、とても小さなブレーキです。"}, {"t": 1166.7333333333333, "x": "数字にすれば、ごくわずかです。"}, {"t": 1169.1333333333334, "x": "それでも何十年も積み重なれば、"}, {"t": 1171.3, "x": "位置のずれは大きくなります。"}, {"t": 1173.45, "x": "探査機の位置を計算する人にとって、"}, {"t": 1175.7833333333333, "x": "見過ごせない問題でした。"}, {"t": 1177.7333333333333, "x": "計算の土台にあるのは、重力の決まりです。"}, {"t": 1180.9333333333334, "x": "その決まりどおりに動かない物があるなら、"}, {"t": 1183.3333333333333, "x": "どこかに見落としがあります。"}, {"t": 1185.3333333333333, "x": "機体の側か。"}, {"t": 1186.4333333333334, "x": "計算の側か。"}, {"t": 1187.6333333333334, "x": "それとも決まりの側か。"}, {"t": 1189.2166666666667, "x": "それを確かめる必要がありました。"}, {"t": 1191.4, "x": "このとき使われたのは、10号の"}, {"t": 1193.6333333333334, "x": "一九八七年から一九九八年までの記録でした。"}, {"t": 1198.0666666666666, "x": "11号は一九八七年から一九九〇年までです。"}, {"t": 1202.5333333333333, "x": "ずれが測られたのは、太陽から"}, {"t": 1204.75, "x": "二十天文単位から七十天文単位のあいだです。"}, {"t": 1207.9, "x": "ずれには名前が付きました。"}, {"t": 1209.6333333333334, "x": "パイオニア・アノマリーです。"}, {"t": 1211.2166666666667, "x": "アノマリーとは、説明のつかない食い違いのことです。"}, {"t": 1214.7833333333333, "x": "ボイジャーでは、同じ測り方が難しいとされました。"}, {"t": 1218.3333333333333, "x": "こまめな噴射で向きを保つ機体だからです。"}, {"t": 1221.05, "x": "燃料の漏れ。"}, {"t": 1222.1333333333334, "x": "太陽の光が押す力。"}, {"t": 1223.9, "x": "機体の熱。"}, {"t": 1224.8833333333334, "x": "いくつもの原因が考えられ、"}, {"t": 1226.7166666666667, "x": "一つずつ確かめられていきました。"}, {"t": 1229.05, "x": "まだ知られていない物理が働いているのでは、という"}, {"t": 1232.3666666666666, "x": "考えまで出てきました。"}, {"t": 1233.8, "x": "それでも、決め手は見つかりませんでした。"}, {"t": 1236.5333333333333, "x": "理由の一つは記録が足りないことでした。"}, {"t": 1239.0666666666666, "x": "調べに使われていたのは全体の一部にすぎません。"}, {"t": 1242.2833333333333, "x": "三十年分の記録の多くは、古い媒体に眠ったままでした。"}, {"t": 1246.5666666666666, "x": "眠っていた記録を探し出したのは、"}, {"t": 1248.6833333333334, "x": "スラバ・トゥリシェフです。"}, {"t": 1250.25, "x": "ジェット推進研究所の研究者です。"}, {"t": 1252.7666666666667, "x": "一九九八年の論文にも名を連ねていました。"}, {"t": 1256.3833333333334, "x": "トゥリシェフは二〇〇四年から記録を集め始めます。"}, {"t": 1259.4166666666667, "x": "集めた先は、いくつもありました。"}, {"t": 1261.9166666666667, "x": "まず、研究所の航法の担当者たちが残した電子の記録です。"}, {"t": 1266.4166666666667, "x": "次に、NASAゴダード宇宙飛行センターの"}, {"t": 1269.1666666666667, "x": "データセンターにあるファイル。"}, {"t": 1270.6666666666667, "x": "さらに、エイムズ研究センターに残されていたテープです。"}, {"t": 1274.4666666666667, "x": "研究所の階段の下からも、十数箱分の"}, {"t": 1277.65, "x": "磁気テープが見つかりました。"}, {"t": 1279.2, "x": "テープは、何十年も前に記録されたものでした。"}, {"t": 1282.5666666666666, "x": "テープを読むには、それに合った古い機械が要ります。"}, {"t": 1286.0, "x": "トゥリシェフは、捨てられる寸前だった"}, {"t": 1288.3, "x": "古いテープの装置も救い出しました。"}, {"t": 1290.4833333333333, "x": "集めた記録は四十三ギガバイトを超えました。"}, {"t": 1293.4666666666667, "x": "記録の形も、さまざまでした。"}, {"t": 1295.8833333333334, "x": "一つは、地上で電波を追った生の記録のファイルです。"}, {"t": 1299.5333333333333, "x": "もう一つは、機体から届いた"}, {"t": 1301.6333333333334, "x": "送信をまとめたファイルでした。"}, {"t": 1303.4666666666667, "x": "二機の送信は、機体の状態の記録まで"}, {"t": 1306.4166666666667, "x": "含めて、すべて保管されていたのです。"}, {"t": 1309.0666666666666, "x": "それまでの調べで使われていたのは、"}, {"t": 1311.2166666666667, "x": "約十一年分の速さの記録です。"}, {"t": 1313.9333333333334, "x": "テープの中には、十九年分を超える記録が眠っていました。"}, {"t": 1318.1166666666666, "x": "ただ、古い記録はそのままでは使えません。"}, {"t": 1321.1333333333334, "x": "今の計算機で読める形に、直す必要がありました。"}, {"t": 1325.0, "x": "ここで、一人の協力者が加わります。"}, {"t": 1327.8833333333334, "x": "カナダのプログラマー、ビクター・トートです。"}, {"t": 1330.6666666666667, "x": "トートは自分から、トゥリシェフに連絡をとりました。"}, {"t": 1333.9666666666667, "x": "そして古いテープを読み、記録を"}, {"t": 1336.3, "x": "整える仕組みを一緒に作りました。"}, {"t": 1338.5166666666667, "x": "お金の問題もありました。"}, {"t": 1340.2833333333333, "x": "記録を取り戻すには費用がかかります。"}, {"t": 1342.8, "x": "そこでアメリカの惑星協会が会員に寄付を呼びかけました。"}, {"t": 1346.5666666666666, "x": "のちにNASAも費用を出しています。"}, {"t": 1348.6, "x": "トゥリシェフは後にこう話しています。"}, {"t": 1350.6666666666667, "x": "惑星協会がなければ実現しなかった、と。"}, {"t": 1353.9833333333333, "x": "二〇〇六年六月までに、二機の"}, {"t": 1356.4333333333334, "x": "航行の記録の多くが取り戻されました。"}, {"t": 1358.9666666666667, "x": "三十年あまりにわたる記録です。"}, {"t": 1361.2333333333333, "x": "二〇〇七年十月には、研究所での"}, {"t": 1363.9333333333334, "x": "掘り起こしが終わったと報告されました。"}, {"t": 1366.25, "x": "10号は約三十年分。"}, {"t": 1368.0833333333333, "x": "11号は約二十年分です。"}, {"t": 1370.3166666666666, "x": "そのほとんどは、それまでの調べに"}, {"t": 1372.6666666666667, "x": "使われていなかった記録でした。"}, {"t": 1374.5166666666667, "x": "トゥリシェフの言葉も残っています。"}, {"t": 1376.5166666666667, "x": "夢にも思わなかったほど多くの記録を取り戻せた、と。"}, {"t": 1380.2666666666667, "x": "記録には、速さだけでなく機体の"}, {"t": 1382.65, "x": "中の温度も残っていました。"}, {"t": 1384.3666666666666, "x": "ここが大きな意味を持ちました。"}, {"t": 1386.3, "x": "速さのずれと、機体の熱の変わり方。"}, {"t": 1389.2166666666667, "x": "その二つを同じ時の目盛りで並べられるからです。"}, {"t": 1392.3666666666666, "x": "新しく分かったこともありました。"}, {"t": 1394.4833333333333, "x": "ずれは一定ではなかったのです。"}, {"t": 1396.4166666666667, "x": "時とともに変わっているように見えました。"}, {"t": 1398.8166666666666, "x": "一定の力ではなく、変わっていく力です。"}, {"t": 1401.9833333333333, "x": "それなら、機体の中で変わっていく何かと"}, {"t": 1404.7666666666667, "x": "結びついているのかもしれません。"}, {"t": 1406.6666666666667, "x": "調べの焦点は、機体そのものの熱へ移っていきました。"}, {"t": 1410.5666666666666, "x": "熱は、目に見えない光として機体から出ていきます。"}, {"t": 1414.0833333333333, "x": "光にはわずかながら押す力があります。"}, {"t": 1416.6, "x": "熱が四方へ同じように出れば、押す力は打ち消し合います。"}, {"t": 1420.7166666666667, "x": "けれども、一方へ多く出れば話は別です。"}, {"t": 1424.0333333333333, "x": "機体は反対の向きに押されます。"}, {"t": 1426.15, "x": "パイオニアの機体には、熱の出どころが二つありました。"}, {"t": 1429.8333333333333, "x": "一つは、電気をつくる四つの装置です。"}, {"t": 1432.7666666666667, "x": "プルトニウムの熱のうち、電気に"}, {"t": 1435.15, "x": "変えきれない分は外へ出ていきます。"}, {"t": 1437.25, "x": "もう一つは、機体の中の電子の機械です。"}, {"t": 1440.3166666666666, "x": "電気が流れれば熱が生まれます。"}, {"t": 1442.3833333333334, "x": "問題はその熱がどちらへ出ていくかでした。"}, {"t": 1444.9833333333333, "x": "大きなアンテナの皿は地球の方を向いていました。"}, {"t": 1447.9833333333333, "x": "機体から見ると、地球と太陽はほぼ同じ方角にあります。"}, {"t": 1452.05, "x": "皿の裏側はその反対です。"}, {"t": 1454.1, "x": "進んでいく先の側にあたります。"}, {"t": 1456.2666666666667, "x": "機体の本体もこの裏側にありました。"}, {"t": 1458.7333333333333, "x": "電気をつくる装置の熱の一部は、皿の裏側に当たります。"}, {"t": 1462.85, "x": "そして、進む先の方へはね返ります。"}, {"t": 1465.8, "x": "本体の温かい機械の熱も、進む先の側へ多く出ていきます。"}, {"t": 1470.3166666666666, "x": "熱が前へ多く出れば、その反動で機体は後ろへ押されます。"}, {"t": 1474.5, "x": "後ろとは、太陽の側です。"}, {"t": 1476.7666666666667, "x": "トゥリシェフたちは、機体の細かな熱の模型を作りました。"}, {"t": 1480.5666666666666, "x": "模型といっても、手で組む物ではありません。"}, {"t": 1483.45, "x": "計算機の中に作る、機体の写しです。"}, {"t": 1486.45, "x": "機体の形を小さな面に分けます。"}, {"t": 1488.85, "x": "面ごとに、出ていく熱の量と向きを計算します。"}, {"t": 1492.3333333333333, "x": "はね返る熱も追いかけます。"}, {"t": 1494.15, "x": "模型の条件には、10号の中にあった"}, {"t": 1496.9666666666667, "x": "六つの温度計の記録を使いました。"}, {"t": 1499.25, "x": "取り戻したテープに残っていた、"}, {"t": 1501.1, "x": "飛んでいたときの本物の温度です。"}, {"t": 1503.5166666666667, "x": "機械が出す熱も、プルトニウムが"}, {"t": 1505.7833333333333, "x": "減っていく様子も、計算に入れました。"}, {"t": 1508.3833333333334, "x": "結果は二〇一二年に論文として出されます。"}, {"t": 1511.2166666666667, "x": "題は、パイオニア・アノマリーが"}, {"t": 1513.1666666666667, "x": "熱から来ていることを支える証拠です。"}, {"t": 1515.5333333333333, "x": "結論はこうでした。"}, {"t": 1516.9333333333334, "x": "熱による力は、ずれの大きさと合っている。"}, {"t": 1520.0, "x": "時による変わり方とも合っている。"}, {"t": 1522.05, "x": "向きとも合っている。"}, {"t": 1523.25, "x": "そして、熱の力を計算に入れると、"}, {"t": 1526.05, "x": "説明のつかない加速は残らない。"}, {"t": 1528.5666666666666, "x": "ずれが時とともに変わって見えた"}, {"t": 1530.35, "x": "理由も、これで説明できます。"}, {"t": 1532.6333333333334, "x": "熱のもとが、年ごとに減っていたからです。"}, {"t": 1535.55, "x": "結果は二〇一二年七月十七日、"}, {"t": 1538.1833333333334, "x": "ジェット推進研究所が発表しました。"}, {"t": 1541.0333333333333, "x": "見出しは短いものでした。"}, {"t": 1542.7833333333333, "x": "熱がパイオニア・アノマリーの原因と研究で判明。"}, {"t": 1546.0166666666667, "x": "トゥリシェフは、こうたとえています。"}, {"t": 1548.2833333333333, "x": "車を運転しているとします。"}, {"t": 1550.2666666666667, "x": "自分のヘッドライトの光に後ろへ"}, {"t": 1552.3833333333334, "x": "押されるようなものだ、と。"}, {"t": 1554.2166666666667, "x": "こうも話しています。"}, {"t": 1555.5666666666666, "x": "新しい物理を見つけていたら、もちろん胸が躍っただろう。"}, {"t": 1559.55, "x": "それでも、謎は解いた。"}, {"t": 1561.5166666666667, "x": "惑星協会も、同じ年の四月に、"}, {"t": 1564.3333333333333, "x": "謎が解けたとする記事を出しています。"}, {"t": 1566.8833333333334, "x": "新しい物理は要らない、という内容でした。"}, {"t": 1570.05, "x": "熱で説明できるとした研究は、ほかにもあります。"}, {"t": 1573.6166666666666, "x": "まず二〇一一年です。"}, {"t": 1575.35, "x": "ベニー・リーバースとクラウス・"}, {"t": 1576.7166666666667, "x": "レンマーツァールが論文を出しました。"}, {"t": 1578.7666666666667, "x": "機体の形を細かく計算機に写し取って、"}, {"t": 1581.55, "x": "熱の流れを追った研究です。"}, {"t": 1583.85, "x": "二人は、10号のずれは熱の反動で"}, {"t": 1586.5333333333333, "x": "おそらく説明できる、と書いています。"}, {"t": 1589.1166666666666, "x": "次は二〇一四年です。"}, {"t": 1590.85, "x": "ダリオ・モデニーニとパオロ・トルトーラが"}, {"t": 1592.9166666666667, "x": "論文を出しました。"}, {"t": 1594.15, "x": "二人は自分たちで機体の熱の模型を作りました。"}, {"t": 1597.35, "x": "そして、NASAの軌道の計算の仕組みと組み合わせました。"}, {"t": 1601.1333333333334, "x": "結論はこうです。"}, {"t": 1602.45, "x": "熱のほかに、知られていない加速を足す必要はない。"}, {"t": 1606.0166666666667, "x": "それでも二機の軌道は説明できる。"}, {"t": 1608.2833333333333, "x": "研究者も方法も別々でした。"}, {"t": 1610.5166666666667, "x": "それでも同じ答えにたどり着いたことになります。"}, {"t": 1613.4666666666667, "x": "重力の決まりが、遠くで変わっていたわけではありません。"}, {"t": 1617.0666666666666, "x": "探査機を引き戻していたのは、"}, {"t": 1618.8166666666666, "x": "探査機自身の体温だったのです。"}, {"t": 1621.2666666666667, "x": "では、パイオニア10号はいまどこにいるのでしょうか。"}, {"t": 1624.65, "x": "答えは計算の中にあります。"}, {"t": 1626.6666666666667, "x": "最後の信号のあと、機体からは何も届いていません。"}, {"t": 1630.45, "x": "電波で位置を確かめることは、もうできないのです。"}, {"t": 1633.7833333333333, "x": "望遠鏡で探すこともできません。"}, {"t": 1635.9833333333333, "x": "機体は小さく、自分では光りません。"}, {"t": 1638.85, "x": "太陽の光も、ほとんど届かない場所にいます。"}, {"t": 1642.15, "x": "それでも打ち上げからの記録が"}, {"t": 1643.9166666666667, "x": "あれば、位置は計算で追えます。"}, {"t": 1646.2166666666667, "x": "使うのは、最後に分かった位置と速さです。"}, {"t": 1649.2, "x": "そこに太陽や惑星の重力を足していきます。"}, {"t": 1652.2, "x": "遠くの機体ほど、重力の影響は小さくなります。"}, {"t": 1655.9, "x": "そのため、進み方はほとんど変わりません。"}, {"t": 1658.9, "x": "NASAの見積もりがあります。"}, {"t": 1660.5333333333333, "x": "二〇一七年十一月五日の時点で、"}, {"t": 1663.2, "x": "地球から約百十八・八天文単位です。"}, {"t": 1666.5333333333333, "x": "約百七十七億キロメートルにあたる距離です。"}, {"t": 1669.65, "x": "人が作った物の中で、ボイジャー1号に"}, {"t": 1672.55, "x": "次いで遠いとされていました。"}, {"t": 1674.1833333333334, "x": "パイオニア11号は、同じ日に約九十七・六天文単位でした。"}, {"t": 1679.05, "x": "11号は、太陽の赤道の面から上へ外れて進んでいます。"}, {"t": 1683.45, "x": "一九九五年の終わりで、その角度は十七・四度でした。"}, {"t": 1688.05, "x": "10号は、おうし座の方角へ進んでいます。"}, {"t": 1691.15, "x": "その先には、アルデバランという星があります。"}, {"t": 1694.2833333333333, "x": "おうし座の赤い星です。"}, {"t": 1695.85, "x": "地球からは約六十八光年離れています。"}, {"t": 1698.8666666666666, "x": "10号がそのそばを通るのは、"}, {"t": 1700.6666666666667, "x": "二百万年ほど先と見積もられています。"}, {"t": 1703.5, "x": "11号はいて座の方角へ進んでいます。"}, {"t": 1706.25, "x": "わし座のラムダ星の近くを通るのは、"}, {"t": 1708.5166666666667, "x": "四百万年近く先とされています。"}, {"t": 1711.1833333333334, "x": "どちらも、星に着くわけではありません。"}, {"t": 1713.85, "x": "そのそばを通り過ぎるだけです。"}, {"t": 1715.8, "x": "二機にはそれぞれ金属の板が付いています。"}, {"t": 1718.5333333333333, "x": "男女の絵と、太陽と地球の場所を示す図が描かれた板です。"}, {"t": 1722.7666666666667, "x": "それが誰かの手に届くのかは、分かりません。"}, {"t": 1725.85, "x": "一つ確かなのは、二機が止まらないことです。"}, {"t": 1728.85, "x": "ブレーキになるものは、もうほとんどありません。"}, {"t": 1731.7666666666667, "x": "熱の反動も、熱のもとが減るにつれて弱まっていきます。"}, {"t": 1735.7, "x": "その姿を見た人は、打ち上げのあと一人もいません。"}, {"t": 1739.2833333333333, "x": "地上には実物大の模型が残っています。"}, {"t": 1742.0666666666666, "x": "ワシントンにある国立航空宇宙博物館です。"}, {"t": 1745.1833333333334, "x": "皿の形のアンテナも、腕の先の装置も、"}, {"t": 1748.2833333333333, "x": "そこで見ることができます。"}, {"t": 1750.1666666666667, "x": "本物はいまも暗い中を進んでいます。"}, {"t": 1752.6666666666667, "x": "パイオニア10号は、二十一か月の"}, {"t": 1755.2666666666667, "x": "仕事のために作られました。"}, {"t": 1756.9833333333333, "x": "木星までの約束は果たしました。"}, {"t": 1759.2833333333333, "x": "そのあとも三十年以上、電波を送り続けました。"}, {"t": 1762.9666666666667, "x": "その電波には二つのことが刻まれていました。"}, {"t": 1765.8, "x": "一つは、機体がまだ動いているということ。"}, {"t": 1768.75, "x": "もう一つは、機体がどれだけの"}, {"t": 1770.8666666666666, "x": "速さで遠ざかっているかです。"}, {"t": 1772.6, "x": "二つ目の記録から小さなずれが見つかりました。"}, {"t": 1775.5, "x": "ずれを解く手がかりは、階段の下の箱の中にありました。"}, {"t": 1779.3, "x": "捨てられかけた機械の中にもありました。"}, {"t": 1781.75, "x": "そして答えは、機体の中にありました。"}, {"t": 1784.5, "x": "電気をつくるための熱が、機体を"}, {"t": 1786.9166666666667, "x": "太陽の側へ押していたのです。"}, {"t": 1788.8166666666666, "x": "同じ熱が、パイオニア10号の声を支えていました。"}, {"t": 1792.4833333333333, "x": "熱のもとが減るにつれて、ブレーキは弱まりました。"}, {"t": 1795.9666666666667, "x": "電波を送る力も同じように弱まりました。"}, {"t": 1798.7666666666667, "x": "二〇〇二年三月、打ち上げから"}, {"t": 1801.1, "x": "三十年の日に、返事が届きました。"}, {"t": 1803.7666666666667, "x": "二〇〇三年一月、最後のかすかな信号が届きました。"}, {"t": 1807.8333333333333, "x": "二〇〇六年三月の呼びかけには、返事がありませんでした。"}, {"t": 1811.7833333333333, "x": "二機の声は、それきり戻っていません。"}, {"t": 1814.4833333333333, "x": "謎を生んだ熱と、声を支えた熱は、同じものでした。"}, {"t": 1818.7, "x": "その熱が冷めていきました。"}, {"t": 1820.45, "x": "それにつれて謎は解けました。"}, {"t": 1822.35, "x": "そして声は消えました。"}, {"t": 1823.9, "x": "太陽や惑星の重力に、機体自身の熱を足して計算する。"}, {"t": 1828.2666666666667, "x": "そうすれば、記録に残った動きと合う。"}, {"t": 1831.0666666666666, "x": "それが、二〇一二年に出た答えでした。"}, {"t": 1833.95, "x": "別の研究者たちも同じ答えを出しました。"}, {"t": 1836.75, "x": "重力の決まりは、太陽系の外れでも"}, {"t": 1839.55, "x": "変わっていませんでした。"}, {"t": 1840.85, "x": "赤い星アルデバランのそばを"}, {"t": 1842.5166666666667, "x": "通るまで、およそ二百万年です。"}, {"t": 1845.0166666666667, "x": "パイオニアという名前は、英語で"}, {"t": 1847.3166666666666, "x": "先に道を切り開く者という意味です。"}, {"t": 1849.75, "x": "小惑星帯。"}, {"t": 1850.9166666666667, "x": "木星のそば。"}, {"t": 1851.9833333333333, "x": "土星のそば。"}, {"t": 1852.95, "x": "そして海王星の軌道の外。"}, {"t": 1854.9666666666667, "x": "どの場所にも、最初に入ったのはこの二機でした。"}, {"t": 1858.2166666666667, "x": "最後に残した謎にも、二機は自分の体で答えを出しました。"}, {"t": 1862.4666666666667, "x": "答えは、自分の熱でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
