<script>
const D={"name": "ep021", "file": "ep021", "dur": 1865.2333125, "segs": [], "subs": [{"t": 0.0, "x": "太陽系の外へ向かう探査機、パイオニア10号。"}, {"t": 3.533333333333333, "x": "二十一か月の予定で打ち上げられ、"}, {"t": 5.75, "x": "三十年あまり地球へ電波を送り続けました。"}, {"t": 9.083333333333334, "x": "最後の電波を地上のアンテナが"}, {"t": 11.0, "x": "とらえたのは、二〇〇三年一月です。"}, {"t": 13.7, "x": "地球から約百二十二億キロメートル先から"}, {"t": 16.533333333333335, "x": "届いた、かすかな電波でした。"}, {"t": 18.716666666666665, "x": "光の速さで進む電波でも、届くまでに"}, {"t": 21.683333333333334, "x": "十一時間二十分かかる距離でした。"}, {"t": 23.983333333333334, "x": "届いた信号はとても弱いものでした。"}, {"t": 26.416666666666668, "x": "機体の様子を伝える数字は、もう読み取れません。"}, {"t": 29.833333333333332, "x": "かすかな電波がそこにあると分かるだけでした。"}, {"t": 32.483333333333334, "x": "翌月にも地上のアンテナは耳をすませました。"}, {"t": 35.45, "x": "何も聞こえませんでした。"}, {"t": 37.083333333333336, "x": "三年後の呼びかけにも、返事は戻りませんでした。"}, {"t": 40.583333333333336, "x": "これが、パイオニア10号から"}, {"t": 42.63333333333333, "x": "届いた最後の信号になりました。"}, {"t": 44.8, "x": "この探査機はいまどこを飛んでいるのか。"}, {"t": 47.18333333333333, "x": "それを写した写真は一枚もありません。"}, {"t": 49.75, "x": "電波も、もう届きません。"}, {"t": 51.766666666666666, "x": "あるのは打ち上げからの記録と、"}, {"t": 53.6, "x": "それをもとにした計算だけです。"}, {"t": 55.916666666666664, "x": "パイオニア10号には兄弟の機体がありました。"}, {"t": 58.833333333333336, "x": "翌年に打ち上げられたパイオニア11号です。"}, {"t": 61.81666666666667, "x": "二機は太陽系の外へ向かって飛び続けています。"}, {"t": 64.9, "x": "どちらからも声は届きません。"}, {"t": 66.88333333333334, "x": "そして二機には、不思議な記録が残りました。"}, {"t": 69.96666666666667, "x": "計算で出した位置と実際の位置が、"}, {"t": 72.11666666666666, "x": "少しずつずれていったのです。"}, {"t": 74.16666666666667, "x": "二機とも、太陽の側へわずかに"}, {"t": 76.46666666666667, "x": "引き戻されているように見えました。"}, {"t": 78.46666666666667, "x": "なぜなのか。"}, {"t": 79.4, "x": "答えは長いあいだ出ませんでした。"}, {"t": 81.51666666666667, "x": "その原因をめぐって長い調べものが続きました。"}, {"t": 84.61666666666666, "x": "古い磁気テープを探し出す作業。"}, {"t": 86.76666666666667, "x": "捨てられかけた機械を救い出す作業。"}, {"t": 89.13333333333334, "x": "それも、この調べものの一部でした。"}, {"t": 91.78333333333333, "x": "ここから先は、二機の声が消えるまでの記録をたどります。"}, {"t": 95.66666666666667, "x": "そして残された小さなずれの行方を追います。"}, {"t": 98.5, "x": "はじめの計画は、とても短いものでした。"}, {"t": 101.53333333333333, "x": "木星のそばを一度だけ通り過ぎて、観測を終える。"}, {"t": 105.28333333333333, "x": "それだけです。"}, {"t": 106.3, "x": "計画が認められたのは、一九六九年二月でした。"}, {"t": 110.6, "x": "認めたのはNASAです。"}, {"t": 112.0, "x": "二機の探査機で木星を目指す計画でした。"}, {"t": 114.81666666666666, "x": "翌年、機体づくりはカリフォルニア州の"}, {"t": 117.55, "x": "会社、TRWに任されます。"}, {"t": 120.28333333333333, "x": "工場はレドンドビーチという町にありました。"}, {"t": 122.98333333333333, "x": "運用を受け持つのは、NASAのエイムズ研究センターです。"}, {"t": 126.68333333333334, "x": "パイオニア10号の打ち上げは、一九七二年三月でした。"}, {"t": 131.23333333333332, "x": "場所はアメリカのフロリダ州、ケープ・カナベラルです。"}, {"t": 134.6, "x": "ロケットはアトラス・セントールでした。"}, {"t": 136.66666666666666, "x": "地球を離れたときの速さは、"}, {"t": 138.53333333333333, "x": "時速約五万一千七百キロメートルです。"}, {"t": 141.68333333333334, "x": "それまでに人が作った物の中で、最も速い物でした。"}, {"t": 145.68333333333334, "x": "月の軌道を越えるまでに、十一時間もかかりませんでした。"}, {"t": 149.66666666666666, "x": "目的は木星のそばを通り過ぎることです。"}, {"t": 152.5, "x": "予定された期間は二十一か月でした。"}, {"t": 155.01666666666668, "x": "木星に着いて観測を終えるまでの長さです。"}, {"t": 157.93333333333334, "x": "打ち上げの月のうちに、進路の"}, {"t": 160.16666666666666, "x": "細かい直しが二回行われました。"}, {"t": 162.48333333333332, "x": "三月七日と三月二十六日です。"}, {"t": 165.13333333333333, "x": "機体の重さは二百五十八キログラムです。"}, {"t": 167.98333333333332, "x": "小さな乗用車よりずっと軽い機体でした。"}, {"t": 170.66666666666666, "x": "いちばん目立つのは、皿の形をした大きなアンテナです。"}, {"t": 174.43333333333334, "x": "直径は二・七四メートルあります。"}, {"t": 176.75, "x": "機体の本体はこの皿の裏側に付いていました。"}, {"t": 179.81666666666666, "x": "電波を送る装置は二つ積まれていました。"}, {"t": 182.5, "x": "出力はそれぞれ八ワットです。"}, {"t": 184.58333333333334, "x": "小さな電球ほどの力しかありません。"}, {"t": 187.08333333333334, "x": "その弱い電波を、地上の大きなアンテナで受け止めます。"}, {"t": 190.75, "x": "電気をつくる仕組みにも特徴がありました。"}, {"t": 193.35, "x": "木星のあたりでは、太陽の光がとても弱くなります。"}, {"t": 197.25, "x": "太陽電池の板では電気が足りません。"}, {"t": 199.75, "x": "そこで積まれたのが、放射性同位体熱電気転換器です。"}, {"t": 203.83333333333334, "x": "中に入っているのはプルトニウム238です。"}, {"t": 206.71666666666667, "x": "ゆっくり壊れながら、長いあいだ熱を出し続ける物質です。"}, {"t": 210.78333333333333, "x": "プルトニウムは壊れていくときに熱を出します。"}, {"t": 213.61666666666667, "x": "その熱を電気に変える装置です。"}, {"t": 215.85, "x": "燃料を足す必要はありません。"}, {"t": 217.91666666666666, "x": "何年も電気をつくり続けられます。"}, {"t": 220.21666666666667, "x": "この装置は四つありました。"}, {"t": 222.05, "x": "四つとも、機体から伸びた腕の先に付いています。"}, {"t": 225.46666666666667, "x": "機体の中心から約三メートル離れた場所です。"}, {"t": 228.51666666666668, "x": "打ち上げのときの電気は約百五十五ワットでした。"}, {"t": 231.68333333333334, "x": "木星に着いたころには、約百四十ワットに"}, {"t": 234.86666666666667, "x": "下がっていました。"}, {"t": 235.85, "x": "熱のもとは少しずつ減っていきます。"}, {"t": 238.11666666666667, "x": "だから電気も年ごとに減ります。"}, {"t": 240.15, "x": "この減り方がのちに機体の寿命を決めます。"}, {"t": 242.88333333333333, "x": "そして、この熱はもう一つの形で記録に残ります。"}, {"t": 246.66666666666666, "x": "それは第8章で触れます。"}, {"t": 248.51666666666668, "x": "機体は回りながら飛びました。"}, {"t": 250.38333333333333, "x": "回ることで向きが安定するからです。"}, {"t": 252.7, "x": "運用の終わりのころの回転は、十四・一秒に一回でした。"}, {"t": 257.05, "x": "積まれた観測の装置は十を超えていました。"}, {"t": 259.8666666666667, "x": "磁場を測るもの、粒を数えるもの、光を測るものなどです。"}, {"t": 264.3666666666667, "x": "費用も記録に残っています。"}, {"t": 266.3, "x": "開発から一九九七年までで、"}, {"t": 268.95, "x": "約三億五千万ドルと見積もられています。"}, {"t": 271.95, "x": "二〇〇一年のドルに直した額です。"}, {"t": 274.3666666666667, "x": "二十一か月の予定で作られた機体でした。"}, {"t": 277.1333333333333, "x": "実際には三十年以上働くことになります。"}, {"t": 280.1666666666667, "x": "木星へ向かう途中には、越えなければならない"}, {"t": 283.26666666666665, "x": "場所がありました。"}, {"t": 284.26666666666665, "x": "火星と木星のあいだの、小惑星帯です。"}, {"t": 287.4166666666667, "x": "そこには岩のかけらが数多く回っています。"}, {"t": 290.21666666666664, "x": "それまでここを通り抜けた探査機はありませんでした。"}, {"t": 293.3, "x": "機体を傷つける粒がどれほど多いのか。"}, {"t": 295.8666666666667, "x": "それが分かっていなかったのです。"}, {"t": 297.78333333333336, "x": "無事に通り抜けられるかどうかは、"}, {"t": 299.68333333333334, "x": "確かではありませんでした。"}, {"t": 301.56666666666666, "x": "パイオニア10号は一九七二年七月十五日に"}, {"t": 305.3, "x": "小惑星帯へ入りました。"}, {"t": 307.03333333333336, "x": "八月二日には、直径約八百メートルの"}, {"t": 310.18333333333334, "x": "小惑星のそばを通りました。"}, {"t": 312.0833333333333, "x": "距離は約八百八十万キロメートルです。"}, {"t": 314.85, "x": "十二月二日には、ニケという小惑星のそばも通りました。"}, {"t": 318.98333333333335, "x": "差し渡しが約二十四キロメートルの小惑星です。"}, {"t": 322.3833333333333, "x": "抜け出したのは一九七三年二月十五日でした。"}, {"t": 326.15, "x": "入ってから約七か月後です。"}, {"t": 328.18333333333334, "x": "そのあいだに進んだ道のりは、"}, {"t": 330.0, "x": "約四億三千五百万キロメートルでした。"}, {"t": 333.1166666666667, "x": "機体は無事でした。"}, {"t": 334.3833333333333, "x": "小惑星帯を越えた最初の探査機になりました。"}, {"t": 337.51666666666665, "x": "一九七三年十一月六日、木星を撮る作業が始まります。"}, {"t": 342.75, "x": "このとき、木星までは"}, {"t": 344.56666666666666, "x": "まだ約二千六百万キロメートルありました。"}, {"t": 347.31666666666666, "x": "十一月二十六日には、一つの境目を横切りました。"}, {"t": 351.56666666666666, "x": "木星の磁場がつくる境目です。"}, {"t": 353.76666666666665, "x": "そして十二月。"}, {"t": 355.01666666666665, "x": "パイオニア10号は木星に最も近づきました。"}, {"t": 358.1166666666667, "x": "雲の上から約十三万キロメートルのところです。"}, {"t": 361.26666666666665, "x": "このときの速さは、時速約十二万六千キロメートルでした。"}, {"t": 365.48333333333335, "x": "木星を間近に観測した最初の探査機です。"}, {"t": 368.53333333333336, "x": "木星の雲の模様も、間近から写されました。"}, {"t": 371.9, "x": "十二月一日の時点で、届いた画像は"}, {"t": 374.8333333333333, "x": "地上の望遠鏡の写真を上回っていました。"}, {"t": 377.6333333333333, "x": "撮られた画像は全部で約五百枚とされています。"}, {"t": 380.73333333333335, "x": "細かいものでは、約三百二十キロメートルの"}, {"t": 383.93333333333334, "x": "大きさまで見分けられました。"}, {"t": 385.53333333333336, "x": "衛星も写されています。"}, {"t": 387.2, "x": "カリスト、ガニメデ、エウロパです。"}, {"t": 390.1166666666667, "x": "どれも粗い画像でした。"}, {"t": 391.6666666666667, "x": "木星の裏側へ回り込むときの電波も、役に立ちました。"}, {"t": 395.7, "x": "電波が木星の大気をくぐる様子から、"}, {"t": 398.1, "x": "大気のつくりが調べられたのです。"}, {"t": 400.51666666666665, "x": "木星は、ほとんどが液体でできた惑星らしい。"}, {"t": 403.95, "x": "そのことも、この旅で確かめられました。"}, {"t": 406.8, "x": "木星のまわりには、強い放射線の帯があります。"}, {"t": 410.3, "x": "10号はその帯の広がりを測り、"}, {"t": 412.43333333333334, "x": "木星の磁場の様子もとらえました。"}, {"t": 414.95, "x": "ただ、その放射線は機体にも影響しました。"}, {"t": 418.21666666666664, "x": "衛星イオの画像は、強い放射線のせいで失われています。"}, {"t": 422.3666666666667, "x": "偽の命令が引き起こされたこともありました。"}, {"t": 425.1333333333333, "x": "そのため、観測の目標のうち一つだけを"}, {"t": 428.1666666666667, "x": "果たせませんでした。"}, {"t": 429.3, "x": "ほかの目標はすべて果たされています。"}, {"t": 431.7, "x": "十一ある装置のうち六つは、木星に"}, {"t": 434.51666666666665, "x": "近づくあいだも休まず動き続けました。"}, {"t": 436.98333333333335, "x": "一九七四年一月二日、木星での"}, {"t": 440.5, "x": "観測は終わったとされました。"}, {"t": 442.23333333333335, "x": "ここで、当初の二十一か月の仕事は終わりです。"}, {"t": 445.75, "x": "けれども、パイオニア10号は止まりませんでした。"}, {"t": 448.95, "x": "木星の重力を受けて、機体は速さを増していました。"}, {"t": 452.76666666666665, "x": "その向きは太陽系の外です。"}, {"t": 454.8333333333333, "x": "もう、どの惑星にも寄りません。"}, {"t": 457.18333333333334, "x": "あとは太陽から遠ざかるだけです。"}, {"t": 459.3833333333333, "x": "地上の人々はその後も電波を受け続けました。"}, {"t": 462.4, "x": "遠くへ行くほど、太陽系の外側の様子が分かるからです。"}, {"t": 466.46666666666664, "x": "一九七六年二月には、土星の軌道より外へ出ていました。"}, {"t": 471.26666666666665, "x": "その後もパイオニア10号は、外へ外へと進みます。"}, {"t": 474.93333333333334, "x": "その一方で、もう一機のパイオニアは"}, {"t": 477.55, "x": "別の道を進んでいました。"}, {"t": 479.31666666666666, "x": "パイオニア11号の打ち上げは、一九七三年四月です。"}, {"t": 484.01666666666665, "x": "10号が木星に着く八か月ほど前でした。"}, {"t": 486.8833333333333, "x": "外へ向かう途中で、気がかりなことが一つありました。"}, {"t": 490.48333333333335, "x": "電気をつくる装置の腕の一本が、"}, {"t": 492.6666666666667, "x": "すぐには伸びなかったのです。"}, {"t": 494.65, "x": "ただ、それはほんの一時のことでした。"}, {"t": 497.3, "x": "11号には、もう一つ事情がありました。"}, {"t": 500.3666666666667, "x": "電波を送る装置は二つあります。"}, {"t": 502.6333333333333, "x": "そのうち予備の方を、打ち上げのときから"}, {"t": 505.35, "x": "ずっと使っていたのです。"}, {"t": 506.73333333333335, "x": "機体の回転は一分に約四・八回でした。"}, {"t": 509.78333333333336, "x": "機体の重さは二百五十九キログラムです。"}, {"t": 512.65, "x": "10号とほぼ同じでした。"}, {"t": 514.35, "x": "11号も、まず木星を目指しました。"}, {"t": 517.3333333333334, "x": "一九七四年十二月三日、木星に最も近づきます。"}, {"t": 522.1166666666667, "x": "雲の上から約四万二千五百キロメートルでした。"}, {"t": 525.3333333333334, "x": "10号の三分の一ほどの距離です。"}, {"t": 527.6833333333333, "x": "木星のあたりでは、電波の一往復に九十二分かかりました。"}, {"t": 532.1166666666667, "x": "電気は約百四十四ワット出ていました。"}, {"t": 534.8333333333334, "x": "ここで11号は進路を大きく曲げます。"}, {"t": 537.5166666666667, "x": "木星の重力を使って、次の行き先へ向かいました。"}, {"t": 541.3666666666667, "x": "行き先は土星です。"}, {"t": 542.75, "x": "木星から土星までは長い道のりでした。"}, {"t": 545.45, "x": "土星に着いたのは一九七九年九月一日です。"}, {"t": 549.25, "x": "木星を離れてから五年近くがたっていました。"}, {"t": 552.2, "x": "11号は、土星の雲の上から"}, {"t": 554.65, "x": "約二万九百キロメートルのところを通りました。"}, {"t": 557.6333333333333, "x": "土星のそばを通った最初の探査機です。"}, {"t": 560.1666666666666, "x": "この旅ではいくつもの発見がありました。"}, {"t": 562.6333333333333, "x": "一つは新しい環です。"}, {"t": 564.2333333333333, "x": "A環の外側に細い環が見つかりました。"}, {"t": 566.9333333333333, "x": "のちにF環と名付けられます。"}, {"t": 568.85, "x": "もう一つは新しい衛星です。"}, {"t": 570.9333333333333, "x": "差し渡し約二百キロメートルの小さな衛星でした。"}, {"t": 574.3333333333334, "x": "土星の温度も測られました。"}, {"t": 576.2, "x": "結果はマイナス百八十度です。"}, {"t": 578.35, "x": "土星で最も大きな衛星、タイタンも測られました。"}, {"t": 581.9833333333333, "x": "平均でマイナス百九十三度とされています。"}, {"t": 584.9166666666666, "x": "分析からは、土星の中身は主に液体の"}, {"t": 587.9, "x": "水素らしいと示されました。"}, {"t": 589.65, "x": "土星に着いたころ、電気は約百ワットまで落ちていました。"}, {"t": 593.6, "x": "土星を過ぎた11号は、太陽系の外へ向かいます。"}, {"t": 597.5, "x": "向かう先は銀河の中心の方角です。"}, {"t": 600.1333333333333, "x": "星座で言えば、いて座のあたりです。"}, {"t": 602.6666666666666, "x": "電気はその後も減り続けました。"}, {"t": 604.7333333333333, "x": "一九八五年二月からは、やり方を変えます。"}, {"t": 608.5666666666667, "x": "観測の装置どうしで電気を分け合うのです。"}, {"t": 611.3333333333334, "x": "全部を一度に動かす電気が、もう無かったからです。"}, {"t": 614.8166666666667, "x": "けれども、11号の声は10号より先に消えました。"}, {"t": 618.65, "x": "一九九五年九月三十日、毎日の"}, {"t": 622.25, "x": "記録の受け取りが終わりました。"}, {"t": 624.0, "x": "どの装置を動かすにも、電気が足りなくなったのです。"}, {"t": 627.5833333333334, "x": "この年の終わり、11号は太陽から"}, {"t": 630.4, "x": "四十四・七天文単位のところにいました。"}, {"t": 633.2, "x": "毎年、二・五天文単位ずつ遠ざかっていました。"}, {"t": 636.8666666666667, "x": "エイムズ研究センターが最後に11号と"}, {"t": 639.5166666666667, "x": "連絡をとったのも、九月三十日です。"}, {"t": 642.3666666666667, "x": "その年の十一月二十四日にも、"}, {"t": 644.6833333333333, "x": "数分間だけ機体の記録が届きました。"}, {"t": 647.5833333333334, "x": "そのあと、連絡は再び途絶えます。"}, {"t": 650.3833333333333, "x": "それから先、11号の声は戻っていません。"}, {"t": 653.8333333333334, "x": "NASAは、11号の運用は"}, {"t": 655.95, "x": "一九九五年に終わったとしています。"}, {"t": 658.6666666666666, "x": "土星を初めて間近に見た機体は、"}, {"t": 660.85, "x": "こうして静かになりました。"}, {"t": 662.7833333333333, "x": "先に旅立った10号はまだ話し続けていました。"}, {"t": 665.9166666666666, "x": "目指す惑星がなくなったあと、"}, {"t": 667.7666666666667, "x": "パイオニア10号の仕事は二度変わりました。"}, {"t": 670.7333333333333, "x": "一度目のきっかけは、一九八三年に訪れます。"}, {"t": 674.8333333333334, "x": "一九八三年六月十三日。"}, {"t": 677.7333333333333, "x": "パイオニア10号は海王星の軌道を越えました。"}, {"t": 680.8, "x": "当時、太陽から最も遠くを回る惑星は海王星でした。"}, {"t": 685.1666666666666, "x": "冥王星が、海王星の軌道の内側に"}, {"t": 688.2166666666667, "x": "入っていた時期だったからです。"}, {"t": 689.9, "x": "パイオニア10号は、その外に"}, {"t": 692.0833333333334, "x": "出た最初の人工物になりました。"}, {"t": 694.2666666666667, "x": "海王星は、太陽から約四十五億キロメートルのところを"}, {"t": 698.3166666666667, "x": "回っています。"}, {"t": 699.1833333333333, "x": "10号は打ち上げから十一年あまりで、"}, {"t": 701.65, "x": "そこを越えたことになります。"}, {"t": 703.65, "x": "この先に目指す惑星はありません。"}, {"t": 705.9, "x": "それでも10号は、外へ進むことをやめません。"}, {"t": 709.1333333333333, "x": "地上ではその後も電波を受け続けました。"}, {"t": 711.7666666666667, "x": "一度目の変わり目です。"}, {"t": 713.3, "x": "機体には新しい役目がありました。"}, {"t": 715.6166666666667, "x": "太陽の影響がどこまで届くかを測る役目です。"}, {"t": 718.8333333333334, "x": "太陽から吹き出す粒の流れ。"}, {"t": 720.8333333333334, "x": "宇宙から飛んでくる粒の数。"}, {"t": 722.75, "x": "それを記録し続けたのです。"}, {"t": 724.6333333333333, "x": "そして一九九七年三月三十一日。"}, {"t": 728.1166666666667, "x": "決まった時間に連絡をとる運用が終わりました。"}, {"t": 731.0666666666667, "x": "理由は予算です。"}, {"t": 732.3666666666667, "x": "このとき機体は、地球から"}, {"t": 734.3166666666667, "x": "六十七天文単位のところにいました。"}, {"t": 736.8, "x": "天文単位は、太陽と地球の距離を一とする物差しです。"}, {"t": 740.8833333333333, "x": "つまり、太陽と地球の距離の六十七倍です。"}, {"t": 744.3833333333333, "x": "機体はそこから、毎年二・六天文単位ずつ"}, {"t": 747.7, "x": "遠ざかっていました。"}, {"t": 748.85, "x": "科学の観測としての仕事は、ここで一区切りになりました。"}, {"t": 752.8666666666667, "x": "それでも電波を聞く作業は続きます。"}, {"t": 755.3166666666667, "x": "ここが二度目の変わり目です。"}, {"t": 757.0833333333334, "x": "次の役目は、通信の技術を調べることでした。"}, {"t": 760.6333333333333, "x": "遠くて弱い電波を、どこまで拾えるか。"}, {"t": 763.6166666666667, "x": "それを試す相手として、パイオニア10号は使われました。"}, {"t": 767.5666666666667, "x": "宇宙からの電波をつかまえる"}, {"t": 769.2, "x": "手順を、運用の担当者が覚える。"}, {"t": 772.0, "x": "その練習の相手にもなりました。"}, {"t": 774.0833333333334, "x": "一九九八年二月十七日には、一つの節目がありました。"}, {"t": 778.9666666666667, "x": "ボイジャー1号が、パイオニア10号を追い越したのです。"}, {"t": 782.5, "x": "それまで長いあいだ、パイオニア10号は"}, {"t": 785.2166666666667, "x": "最も遠くにいる人工物でした。"}, {"t": 787.4, "x": "この日から、その役はボイジャー1号に移ります。"}, {"t": 790.75, "x": "このとき、パイオニア10号は"}, {"t": 792.85, "x": "六十九・四天文単位のところにいました。"}, {"t": 795.75, "x": "二〇〇〇年八月五日にも、機体の状態を"}, {"t": 798.7666666666667, "x": "伝える信号が届いています。"}, {"t": 800.6166666666667, "x": "ところが、そのあと連絡が途絶えました。"}, {"t": 803.3666666666667, "x": "つながったのは、翌年の四月です。"}, {"t": 806.0, "x": "機体の通信の方式を切り替えて、ようやく声が戻りました。"}, {"t": 810.2166666666667, "x": "二〇〇一年七月九日にも連絡がとれています。"}, {"t": 813.5666666666667, "x": "そして二〇〇二年三月一日。"}, {"t": 815.7333333333333, "x": "場所はカリフォルニア州のゴールドストーンです。"}, {"t": 818.4166666666666, "x": "そこのアンテナから、10号へ電波が送られました。"}, {"t": 821.8166666666667, "x": "返事を聞いたのは、スペインのマドリードにある施設です。"}, {"t": 825.4, "x": "直径七十メートルのアンテナが、"}, {"t": 827.45, "x": "10号の返事をとらえました。"}, {"t": 829.6166666666667, "x": "送ってから二十二時間後のことでした。"}, {"t": 832.0166666666667, "x": "返事が届いたのは三月二日です。"}, {"t": 834.35, "x": "打ち上げからちょうど三十年の日でした。"}, {"t": 836.7833333333333, "x": "このとき、10号は地球から"}, {"t": 838.95, "x": "約百十九億キロメートルのところにいました。"}, {"t": 841.8666666666667, "x": "エイムズ研究センターの担当者は、こう話しています。"}, {"t": 845.5666666666667, "x": "これまでも見限られかけたが、"}, {"t": 847.2666666666667, "x": "なぜかいつも持ちこたえてきた、と。"}, {"t": 850.0, "x": "打ち上げにも立ち会った別の担当者は、こう話しました。"}, {"t": 853.7166666666667, "x": "これほど長くもつとは驚きだ、と。"}, {"t": 856.2833333333333, "x": "そして二〇〇二年四月二十七日。"}, {"t": 858.7333333333333, "x": "この日が、機体の記録を読み取れた"}, {"t": 861.15, "x": "最後の連絡になりました。"}, {"t": 862.85, "x": "記録を送る速さもずいぶん落ちていました。"}, {"t": 865.5333333333333, "x": "木星へ向かうころは、一秒に二千四十八ビットでした。"}, {"t": 869.65, "x": "運用の終わりのころには、一秒に"}, {"t": 872.1333333333333, "x": "十六ビットまで下がっています。"}, {"t": 873.9666666666667, "x": "文字にすれば、一秒に二文字ほどです。"}, {"t": 876.9, "x": "それでも電波は届いていました。"}, {"t": 878.9333333333333, "x": "パイオニア10号が電波を送り出す"}, {"t": 881.1, "x": "力は、八ワットしかありません。"}, {"t": 883.4166666666666, "x": "その電波が弱くなっていった理由は二つあります。"}, {"t": 886.45, "x": "一つは距離です。"}, {"t": 887.65, "x": "遠くへ行くほど、電波は薄く広がって届きます。"}, {"t": 891.0666666666667, "x": "もう一つは電気です。"}, {"t": 892.5333333333333, "x": "パイオニア10号の電気は、"}, {"t": 894.2166666666667, "x": "プルトニウムの熱からつくられていました。"}, {"t": 896.9, "x": "熱のもとは年ごとに少しずつ減っていきます。"}, {"t": 899.7166666666667, "x": "電気が減れば、使える装置も減ります。"}, {"t": 902.5833333333334, "x": "観測の装置も、一つまた一つと止まっていきました。"}, {"t": 906.1166666666667, "x": "小さな塵の粒を数える装置は、"}, {"t": 908.3166666666667, "x": "一九七三年十二月に止まっています。"}, {"t": 911.7833333333333, "x": "磁場を測る装置の一つは、一九七五年十一月に"}, {"t": 916.1666666666666, "x": "止まりました。"}, {"t": 916.95, "x": "二〇〇〇年八月の時点で、まだ記録を"}, {"t": 919.7, "x": "送っていた観測の装置は一つだけでした。"}, {"t": 922.3, "x": "エネルギーの高い粒を数える装置です。"}, {"t": 924.9166666666666, "x": "やがて、電波を送るための電気も"}, {"t": 927.3666666666667, "x": "足りなくなっていきました。"}, {"t": 928.75, "x": "二〇〇二年四月二十七日の連絡では、"}, {"t": 931.45, "x": "まだ記録を読み取れました。"}, {"t": 933.4333333333333, "x": "そのあとの三回はどれも信号がかすかでした。"}, {"t": 936.3166666666667, "x": "機体の状態を示す数字は、もう受け取れません。"}, {"t": 939.7666666666667, "x": "その三回目が二〇〇三年一月の信号です。"}, {"t": 942.9333333333333, "x": "最後に記録が読めた日から、九か月ほどあとのことでした。"}, {"t": 946.8333333333334, "x": "このとき地上からは、一つの命令が送られていました。"}, {"t": 950.55, "x": "最後まで動いていた観測の装置を止める命令です。"}, {"t": 953.9666666666667, "x": "その後に届いたのが、このかすかな信号でした。"}, {"t": 957.3333333333334, "x": "記録を受け取るための信号の"}, {"t": 959.1333333333333, "x": "部分には、合わせられませんでした。"}, {"t": 961.5166666666667, "x": "このときパイオニア10号は、地球から"}, {"t": 964.1166666666667, "x": "約百二十二億キロメートルにいました。"}, {"t": 966.6166666666667, "x": "太陽と地球の距離の、約八十二倍です。"}, {"t": 969.8833333333333, "x": "光の速さで進む電波でも、片道十一時間二十分かかります。"}, {"t": 974.6333333333333, "x": "あの八ワットの電波が、百二十億キロメートルを"}, {"t": 978.05, "x": "超えて旅をします。"}, {"t": 979.2166666666667, "x": "地上に着くころには、とても弱くなっています。"}, {"t": 982.35, "x": "それを拾うのが、深宇宙通信網と"}, {"t": 985.1, "x": "呼ばれる地上のアンテナです。"}, {"t": 986.75, "x": "前の年の連絡では、直径七十メートルの"}, {"t": 990.0, "x": "アンテナが返事をとらえていました。"}, {"t": 991.9166666666666, "x": "二〇〇三年二月七日、NASAはもう一度連絡を試みました。"}, {"t": 996.3166666666667, "x": "何も検出されませんでした。"}, {"t": 998.25, "x": "NASAは、電気をつくる装置の力が落ちたと考えました。"}, {"t": 1002.1666666666666, "x": "電波を送るだけの電気が、もう無いのかもしれない。"}, {"t": 1005.55, "x": "そういう見立てです。"}, {"t": 1006.8666666666667, "x": "そして、これ以上の連絡は予定しないと発表しました。"}, {"t": 1010.7833333333333, "x": "発表の日付は二〇〇三年二月二十五日です。"}, {"t": 1014.05, "x": "ただ、話はそこで終わりませんでした。"}, {"t": 1016.8333333333334, "x": "三年がたちました。"}, {"t": 1018.2166666666667, "x": "二〇〇六年三月、パイオニア10号へ"}, {"t": 1021.05, "x": "もう一度だけ呼びかけが行われました。"}, {"t": 1023.3833333333333, "x": "この呼びかけにも返事はありませんでした。"}, {"t": 1025.8333333333333, "x": "二十一か月の予定で打ち上げられた機体です。"}, {"t": 1028.75, "x": "それが三十年以上、声を届けました。"}, {"t": 1031.7833333333333, "x": "最後の声は意味のある言葉を運んでいません。"}, {"t": 1034.6833333333334, "x": "そこにいる、ということだけを伝える電波でした。"}, {"t": 1037.9166666666667, "x": "ただ、二機が残したものは声だけではありません。"}, {"t": 1041.15, "x": "電波が届くたびに、もう一つの情報が刻まれていました。"}, {"t": 1045.0666666666666, "x": "二機がどれだけの速さで遠ざかっているか、という"}, {"t": 1048.2333333333333, "x": "情報です。"}, {"t": 1049.0333333333333, "x": "その記録の中に、説明のつかない"}, {"t": 1051.5833333333333, "x": "ずれが見つかっていました。"}, {"t": 1053.0, "x": "探査機の速さは電波の高さで測ります。"}, {"t": 1055.6833333333334, "x": "救急車のサイレンを思い浮かべると"}, {"t": 1057.8166666666666, "x": "分かりやすいかもしれません。"}, {"t": 1059.4166666666667, "x": "近づくときは高く聞こえます。"}, {"t": 1061.3666666666666, "x": "遠ざかるときは低く聞こえます。"}, {"t": 1063.4333333333334, "x": "電波でも同じことが起こります。"}, {"t": 1065.4, "x": "遠ざかる探査機の電波は、ほんの少し低くなって届きます。"}, {"t": 1069.4833333333333, "x": "その違いを測れば、遠ざかる速さが分かります。"}, {"t": 1072.9333333333334, "x": "パイオニアの二機はこの測り方に向いていました。"}, {"t": 1075.8666666666666, "x": "回りながら飛ぶので、向きを"}, {"t": 1077.9333333333334, "x": "直す噴射がめったにありません。"}, {"t": 1079.8, "x": "余計な力が加わりにくい機体でした。"}, {"t": 1082.3666666666666, "x": "太陽や惑星の重力だけで飛んでいると"}, {"t": 1084.9, "x": "考えやすかったのです。"}, {"t": 1086.35, "x": "ところが、計算と測った速さが合いませんでした。"}, {"t": 1089.7166666666667, "x": "二機とも、計算よりわずかに遅いのです。"}, {"t": 1092.65, "x": "まるで太陽の側へ、"}, {"t": 1094.0333333333333, "x": "ほんの少し引き戻されているようでした。"}, {"t": 1096.75, "x": "最初に気づいたのは一九八〇年代の初めです。"}, {"t": 1100.3166666666666, "x": "二機が土星のあたりにさしかかったころでした。"}, {"t": 1102.9666666666667, "x": "運用の担当者たちは、はじめ燃料の"}, {"t": 1105.7333333333333, "x": "残りが漏れていると考えました。"}, {"t": 1107.7, "x": "けれども、ずれは消えませんでした。"}, {"t": 1110.1166666666666, "x": "何年たっても、同じ向きに残り続けたのです。"}, {"t": 1113.4666666666667, "x": "一九九八年になりました。"}, {"t": 1115.95, "x": "二機は太陽から百三十億キロメートルを"}, {"t": 1118.65, "x": "超えるところにいます。"}, {"t": 1119.9166666666667, "x": "この年、ジェット推進研究所の"}, {"t": 1122.4666666666667, "x": "ジョン・アンダーソンらが論文を出しました。"}, {"t": 1124.7166666666667, "x": "題は、弱くて遠くまで届く、"}, {"t": 1126.95, "x": "見かけ上の異常な加速の兆しです。"}, {"t": 1129.6166666666666, "x": "二機に加えて、木星へ向かった"}, {"t": 1132.0, "x": "ガリレオの記録も調べました。"}, {"t": 1133.8166666666666, "x": "太陽の極の上を回ったユリシーズの記録もです。"}, {"t": 1137.0, "x": "アンダーソンたちは、二つの"}, {"t": 1138.8666666666666, "x": "別々の計算の方法で記録を調べました。"}, {"t": 1141.8166666666666, "x": "いくつもの原因を、一つずつ外していきました。"}, {"t": 1145.0833333333333, "x": "論文によれば、二機には小さな力が"}, {"t": 1147.8666666666666, "x": "働いているように見えました。"}, {"t": 1149.6, "x": "向きは太陽の方です。"}, {"t": 1151.2333333333333, "x": "大きさは一定でした。"}, {"t": 1152.7, "x": "二〇〇二年の論文では、その大きさが詳しく出されました。"}, {"t": 1156.55, "x": "一秒ごとに、速さが秒速十億分の"}, {"t": 1159.5166666666667, "x": "〇・八七四メートルずつ落ちていく。"}, {"t": 1162.35, "x": "そんな程度の、とても小さなブレーキです。"}, {"t": 1165.3166666666666, "x": "数字にすれば、ごくわずかです。"}, {"t": 1167.7166666666667, "x": "それでも何十年も積み重なれば、"}, {"t": 1169.8833333333334, "x": "位置のずれは大きくなります。"}, {"t": 1172.0333333333333, "x": "探査機の位置を計算する人にとって、"}, {"t": 1174.3666666666666, "x": "見過ごせない問題でした。"}, {"t": 1176.3166666666666, "x": "計算の土台にあるのは、重力の決まりです。"}, {"t": 1179.5166666666667, "x": "その決まりどおりに動かない物があるなら、"}, {"t": 1181.9166666666667, "x": "どこかに見落としがあります。"}, {"t": 1183.9166666666667, "x": "機体の側か。"}, {"t": 1185.0166666666667, "x": "計算の側か。"}, {"t": 1186.2166666666667, "x": "それとも決まりの側か。"}, {"t": 1187.8, "x": "それを確かめる必要がありました。"}, {"t": 1189.9833333333333, "x": "このとき使われたのは、10号の"}, {"t": 1192.2166666666667, "x": "一九八七年から一九九八年までの記録でした。"}, {"t": 1196.65, "x": "11号は一九八七年から一九九〇年までです。"}, {"t": 1201.1166666666666, "x": "ずれが測られたのは、太陽から"}, {"t": 1203.3333333333333, "x": "二十天文単位から七十天文単位のあいだです。"}, {"t": 1206.4833333333333, "x": "ずれには名前が付きました。"}, {"t": 1208.2166666666667, "x": "パイオニア・アノマリーです。"}, {"t": 1209.8, "x": "アノマリーとは、説明のつかない食い違いのことです。"}, {"t": 1213.3666666666666, "x": "ボイジャーでは、同じ測り方が難しいとされました。"}, {"t": 1216.9166666666667, "x": "こまめな噴射で向きを保つ機体だからです。"}, {"t": 1219.6333333333334, "x": "燃料の漏れ。"}, {"t": 1220.7166666666667, "x": "太陽の光が押す力。"}, {"t": 1222.4833333333333, "x": "機体の熱。"}, {"t": 1223.4666666666667, "x": "いくつもの原因が考えられ、"}, {"t": 1225.3, "x": "一つずつ確かめられていきました。"}, {"t": 1227.6333333333334, "x": "まだ知られていない物理が働いているのでは、という"}, {"t": 1230.95, "x": "考えまで出てきました。"}, {"t": 1232.3833333333334, "x": "それでも、決め手は見つかりませんでした。"}, {"t": 1235.1166666666666, "x": "理由の一つは記録が足りないことでした。"}, {"t": 1237.65, "x": "調べに使われていたのは全体の一部にすぎません。"}, {"t": 1240.8666666666666, "x": "三十年分の記録の多くは、古い媒体に眠ったままでした。"}, {"t": 1245.15, "x": "眠っていた記録を探し出したのは、"}, {"t": 1247.2666666666667, "x": "スラバ・トゥリシェフです。"}, {"t": 1248.8333333333333, "x": "ジェット推進研究所の研究者です。"}, {"t": 1251.35, "x": "一九九八年の論文にも名を連ねていました。"}, {"t": 1254.9666666666667, "x": "トゥリシェフは二〇〇四年から記録を集め始めます。"}, {"t": 1258.0, "x": "集めた先は、いくつもありました。"}, {"t": 1260.5, "x": "まず、研究所の航法の担当者たちが残した電子の記録です。"}, {"t": 1265.0, "x": "次に、NASAゴダード宇宙飛行センターの"}, {"t": 1267.75, "x": "データセンターにあるファイル。"}, {"t": 1269.25, "x": "さらに、エイムズ研究センターに残されていたテープです。"}, {"t": 1273.05, "x": "研究所の階段の下からも、十数箱分の"}, {"t": 1276.2333333333333, "x": "磁気テープが見つかりました。"}, {"t": 1277.7833333333333, "x": "テープは、何十年も前に記録されたものでした。"}, {"t": 1281.15, "x": "テープを読むには、それに合った古い機械が要ります。"}, {"t": 1284.5833333333333, "x": "トゥリシェフは、捨てられる寸前だった"}, {"t": 1286.8833333333334, "x": "古いテープの装置も救い出しました。"}, {"t": 1289.0666666666666, "x": "集めた記録は四十三ギガバイトを超えました。"}, {"t": 1292.05, "x": "記録の形も、さまざまでした。"}, {"t": 1294.4666666666667, "x": "一つは、地上で電波を追った生の記録のファイルです。"}, {"t": 1298.1166666666666, "x": "もう一つは、機体から届いた"}, {"t": 1300.2166666666667, "x": "送信をまとめたファイルでした。"}, {"t": 1302.05, "x": "二機の送信は、機体の状態の記録まで"}, {"t": 1305.0, "x": "含めて、すべて保管されていたのです。"}, {"t": 1307.65, "x": "それまでの調べで使われていたのは、"}, {"t": 1309.8, "x": "約十一年分の速さの記録です。"}, {"t": 1312.5166666666667, "x": "テープの中には、十九年分を超える記録が眠っていました。"}, {"t": 1316.7, "x": "ただ、古い記録はそのままでは使えません。"}, {"t": 1319.7166666666667, "x": "今の計算機で読める形に、直す必要がありました。"}, {"t": 1323.5833333333333, "x": "ここで、一人の協力者が加わります。"}, {"t": 1326.4666666666667, "x": "カナダのプログラマー、ビクター・トートです。"}, {"t": 1329.25, "x": "トートは自分から、トゥリシェフに連絡をとりました。"}, {"t": 1332.55, "x": "そして古いテープを読み、記録を"}, {"t": 1334.8833333333334, "x": "整える仕組みを一緒に作りました。"}, {"t": 1337.1, "x": "お金の問題もありました。"}, {"t": 1338.8666666666666, "x": "記録を取り戻すには費用がかかります。"}, {"t": 1341.3833333333334, "x": "そこでアメリカの惑星協会が会員に寄付を呼びかけました。"}, {"t": 1345.15, "x": "のちにNASAも費用を出しています。"}, {"t": 1347.1833333333334, "x": "トゥリシェフは後にこう話しています。"}, {"t": 1349.25, "x": "惑星協会がなければ実現しなかった、と。"}, {"t": 1352.5666666666666, "x": "二〇〇六年六月までに、二機の"}, {"t": 1355.0166666666667, "x": "航行の記録の多くが取り戻されました。"}, {"t": 1357.55, "x": "三十年あまりにわたる記録です。"}, {"t": 1359.8166666666666, "x": "二〇〇七年十月には、研究所での"}, {"t": 1362.5166666666667, "x": "掘り起こしが終わったと報告されました。"}, {"t": 1364.8333333333333, "x": "10号は約三十年分。"}, {"t": 1366.6666666666667, "x": "11号は約二十年分です。"}, {"t": 1368.9, "x": "そのほとんどは、それまでの調べに"}, {"t": 1371.25, "x": "使われていなかった記録でした。"}, {"t": 1373.1, "x": "トゥリシェフはこう話しています。"}, {"t": 1374.9166666666667, "x": "夢にも思わなかったほど多くの記録を取り戻せた、と。"}, {"t": 1378.6666666666667, "x": "記録には、速さだけでなく機体の"}, {"t": 1381.05, "x": "中の温度も残っていました。"}, {"t": 1382.7666666666667, "x": "ここが大きな意味を持ちました。"}, {"t": 1384.7, "x": "速さのずれと、機体の熱の変わり方。"}, {"t": 1387.6166666666666, "x": "その二つを同じ時の目盛りで並べられるからです。"}, {"t": 1390.7666666666667, "x": "新しく分かったこともありました。"}, {"t": 1392.8833333333334, "x": "ずれは一定ではなかったのです。"}, {"t": 1394.8166666666666, "x": "時とともに変わっているように見えました。"}, {"t": 1397.2166666666667, "x": "一定の力ではなく、変わっていく力です。"}, {"t": 1400.3833333333334, "x": "それなら、機体の中で変わっていく何かと"}, {"t": 1403.1666666666667, "x": "結びついているのかもしれません。"}, {"t": 1405.0666666666666, "x": "調べの焦点は、機体そのものの熱へ移っていきました。"}, {"t": 1408.9666666666667, "x": "熱は、目に見えない光として機体から出ていきます。"}, {"t": 1412.4833333333333, "x": "光にはわずかながら押す力があります。"}, {"t": 1415.0, "x": "熱が四方へ同じように出れば、押す力は打ち消し合います。"}, {"t": 1419.1166666666666, "x": "けれども、一方へ多く出れば話は別です。"}, {"t": 1422.4333333333334, "x": "機体は反対の向きに押されます。"}, {"t": 1424.55, "x": "パイオニアの機体には、熱の出どころが二つありました。"}, {"t": 1428.2333333333333, "x": "一つは、電気をつくる四つの装置です。"}, {"t": 1431.1666666666667, "x": "プルトニウムの熱のうち、電気に"}, {"t": 1433.55, "x": "変えきれない分は外へ出ていきます。"}, {"t": 1435.65, "x": "もう一つは、機体の中の電子の機械です。"}, {"t": 1438.7166666666667, "x": "電気が流れれば熱が生まれます。"}, {"t": 1440.7833333333333, "x": "問題はその熱がどちらへ出ていくかでした。"}, {"t": 1443.3833333333334, "x": "大きなアンテナの皿は地球の方を向いていました。"}, {"t": 1446.3833333333334, "x": "機体から見ると、地球と太陽はほぼ同じ方角にあります。"}, {"t": 1450.45, "x": "皿の裏側はその反対です。"}, {"t": 1452.5, "x": "進んでいく先の側にあたります。"}, {"t": 1454.6666666666667, "x": "機体の本体もこの裏側にありました。"}, {"t": 1457.1333333333334, "x": "電気をつくる装置の熱の一部は、皿の裏側に当たります。"}, {"t": 1461.25, "x": "そして、進む先の方へはね返ります。"}, {"t": 1464.2, "x": "本体の温かい機械の熱も、進む先の側へ多く出ていきます。"}, {"t": 1468.7166666666667, "x": "熱が前へ多く出れば、その反動で機体は後ろへ押されます。"}, {"t": 1472.9, "x": "後ろとは、太陽の側です。"}, {"t": 1475.1666666666667, "x": "トゥリシェフたちは、機体の細かな熱の模型を作りました。"}, {"t": 1478.9666666666667, "x": "模型といっても、手で組む物ではありません。"}, {"t": 1481.85, "x": "計算機の中に作る、機体の写しです。"}, {"t": 1484.85, "x": "機体の形を小さな面に分けます。"}, {"t": 1487.25, "x": "面ごとに、出ていく熱の量と向きを計算します。"}, {"t": 1490.7333333333333, "x": "はね返る熱も追いかけます。"}, {"t": 1492.55, "x": "模型の条件には、10号の中にあった"}, {"t": 1495.3666666666666, "x": "六つの温度計の記録を使いました。"}, {"t": 1497.65, "x": "取り戻したテープに残っていた、"}, {"t": 1499.5, "x": "飛んでいたときの本物の温度です。"}, {"t": 1501.9166666666667, "x": "機械が出す熱も、プルトニウムが"}, {"t": 1504.1833333333334, "x": "減っていく様子も、計算に入れました。"}, {"t": 1506.7833333333333, "x": "結果は二〇一二年に論文として出されます。"}, {"t": 1509.6166666666666, "x": "題は、パイオニア・アノマリーが"}, {"t": 1511.5666666666666, "x": "熱から来ていることを支える証拠です。"}, {"t": 1513.9333333333334, "x": "結論はこうでした。"}, {"t": 1515.3333333333333, "x": "熱による力は、ずれの大きさと合っている。"}, {"t": 1518.4, "x": "時による変わり方とも合っている。"}, {"t": 1520.45, "x": "向きとも合っている。"}, {"t": 1521.65, "x": "そして、熱の力を計算に入れると、"}, {"t": 1524.45, "x": "説明のつかない加速は残らない。"}, {"t": 1526.9666666666667, "x": "ずれが時とともに変わって見えた"}, {"t": 1528.75, "x": "理由も、これで説明できます。"}, {"t": 1531.0333333333333, "x": "熱のもとが、年ごとに減っていたからです。"}, {"t": 1533.95, "x": "二〇一二年七月十七日、ジェット推進研究所が"}, {"t": 1538.0166666666667, "x": "この結果を発表しました。"}, {"t": 1539.6833333333334, "x": "見出しは短いものでした。"}, {"t": 1541.4333333333334, "x": "熱がパイオニア・アノマリーの原因と研究で判明。"}, {"t": 1544.6666666666667, "x": "トゥリシェフは、こうたとえています。"}, {"t": 1546.9333333333334, "x": "車を運転しているとします。"}, {"t": 1548.9166666666667, "x": "自分のヘッドライトの光に後ろへ"}, {"t": 1551.0333333333333, "x": "押されるようなものだ、と。"}, {"t": 1552.8666666666666, "x": "こうも話しています。"}, {"t": 1554.2166666666667, "x": "新しい物理を見つけていたら、もちろん胸が躍っただろう。"}, {"t": 1558.2, "x": "それでも、謎は解いた。"}, {"t": 1560.1666666666667, "x": "惑星協会も、同じ年の四月に、"}, {"t": 1562.9833333333333, "x": "謎が解けたとする記事を出しています。"}, {"t": 1565.5333333333333, "x": "新しい物理は要らない、という内容でした。"}, {"t": 1568.7, "x": "熱で説明できるとした研究は、ほかにもあります。"}, {"t": 1572.2666666666667, "x": "まず二〇一一年です。"}, {"t": 1574.0, "x": "ベニー・リーバースとクラウス・"}, {"t": 1575.3666666666666, "x": "レンマーツァールが論文を出しました。"}, {"t": 1577.4166666666667, "x": "機体の形を細かく計算機に写し取って、"}, {"t": 1580.2, "x": "熱の流れを追った研究です。"}, {"t": 1582.5, "x": "二人は、10号のずれは熱の反動で"}, {"t": 1585.1833333333334, "x": "おそらく説明できる、と書いています。"}, {"t": 1587.7666666666667, "x": "次は二〇一四年です。"}, {"t": 1589.5, "x": "ダリオ・モデニーニとパオロ・トルトーラが"}, {"t": 1591.5666666666666, "x": "論文を出しました。"}, {"t": 1592.8, "x": "二人は自分たちで機体の熱の模型を作りました。"}, {"t": 1596.0, "x": "そして、NASAの軌道の計算の仕組みと組み合わせました。"}, {"t": 1599.7833333333333, "x": "結論はこうです。"}, {"t": 1601.1, "x": "熱のほかに、知られていない加速を足す必要はない。"}, {"t": 1604.6666666666667, "x": "それでも二機の軌道は説明できる。"}, {"t": 1606.9333333333334, "x": "研究者も方法も別々でした。"}, {"t": 1609.1666666666667, "x": "それでも同じ答えにたどり着いたことになります。"}, {"t": 1612.1166666666666, "x": "重力の決まりが、遠くで変わっていたわけではありません。"}, {"t": 1615.7166666666667, "x": "探査機を引き戻していたのは、"}, {"t": 1617.4666666666667, "x": "探査機自身の体温だったのです。"}, {"t": 1619.9166666666667, "x": "では、パイオニア10号はいまどこにいるのでしょうか。"}, {"t": 1623.3, "x": "答えは計算の中にあります。"}, {"t": 1625.3166666666666, "x": "最後の信号のあと、機体からは何も届いていません。"}, {"t": 1629.1, "x": "電波で位置を確かめることは、もうできないのです。"}, {"t": 1632.4333333333334, "x": "望遠鏡で探すこともできません。"}, {"t": 1634.6333333333334, "x": "機体は小さく、自分では光りません。"}, {"t": 1637.5, "x": "太陽の光も、ほとんど届かない場所にいます。"}, {"t": 1640.8, "x": "それでも打ち上げからの記録が"}, {"t": 1642.5666666666666, "x": "あれば、位置は計算で追えます。"}, {"t": 1644.8666666666666, "x": "使うのは、最後に分かった位置と速さです。"}, {"t": 1647.85, "x": "そこに太陽や惑星の重力を足していきます。"}, {"t": 1650.85, "x": "遠くの機体ほど、重力の影響は小さくなります。"}, {"t": 1654.55, "x": "そのため、進み方はほとんど変わりません。"}, {"t": 1657.55, "x": "NASAの見積もりがあります。"}, {"t": 1659.1833333333334, "x": "二〇一七年十一月五日の時点で、"}, {"t": 1661.85, "x": "地球から約百十八・八天文単位です。"}, {"t": 1665.1833333333334, "x": "キロメートルにすると、約百七十七億キロメートルです。"}, {"t": 1669.25, "x": "人が作った物の中で、ボイジャー1号に"}, {"t": 1672.15, "x": "次いで遠いとされていました。"}, {"t": 1673.7833333333333, "x": "パイオニア11号は、同じ日に約九十七・六天文単位でした。"}, {"t": 1678.65, "x": "11号は、太陽の赤道の面から上へ外れて進んでいます。"}, {"t": 1683.05, "x": "一九九五年の終わりで、その角度は十七・四度でした。"}, {"t": 1687.65, "x": "10号は、おうし座の方角へ進んでいます。"}, {"t": 1690.75, "x": "その先には、アルデバランという星があります。"}, {"t": 1693.8833333333334, "x": "おうし座の赤い星です。"}, {"t": 1695.45, "x": "地球からは約六十八光年離れています。"}, {"t": 1698.4666666666667, "x": "10号がそのそばを通るのは、"}, {"t": 1700.2666666666667, "x": "二百万年ほど先と見積もられています。"}, {"t": 1703.1, "x": "11号はいて座の方角へ進んでいます。"}, {"t": 1705.85, "x": "わし座のラムダ星の近くを通るのは、"}, {"t": 1708.1166666666666, "x": "四百万年近く先とされています。"}, {"t": 1710.7833333333333, "x": "どちらも、星に着くわけではありません。"}, {"t": 1713.45, "x": "そのそばを通り過ぎるだけです。"}, {"t": 1715.4, "x": "二機にはそれぞれ金属の板が付いています。"}, {"t": 1718.1333333333334, "x": "男女の絵と、太陽と地球の場所を示す図が描かれた板です。"}, {"t": 1722.3666666666666, "x": "それが誰かの手に届くのかは、分かりません。"}, {"t": 1725.45, "x": "一つ確かなのは、二機が止まらないことです。"}, {"t": 1728.45, "x": "ブレーキになるものは、もうほとんどありません。"}, {"t": 1731.3666666666666, "x": "熱の反動も、熱のもとが減るにつれて弱まっていきます。"}, {"t": 1735.3, "x": "その姿を見た人は、打ち上げのあと一人もいません。"}, {"t": 1738.8833333333334, "x": "地上には実物大の模型が残っています。"}, {"t": 1741.6666666666667, "x": "ワシントンにある国立航空宇宙博物館です。"}, {"t": 1744.7833333333333, "x": "皿の形のアンテナも、腕の先の装置も、"}, {"t": 1747.8833333333334, "x": "そこで見ることができます。"}, {"t": 1749.7666666666667, "x": "本物はいまも暗い中を進んでいます。"}, {"t": 1752.2666666666667, "x": "パイオニア10号は、二十一か月の"}, {"t": 1754.8666666666666, "x": "仕事のために作られました。"}, {"t": 1756.5833333333333, "x": "木星までの約束は果たしました。"}, {"t": 1758.8833333333334, "x": "そのあとも三十年以上、電波を送り続けました。"}, {"t": 1762.5666666666666, "x": "その電波には二つのことが刻まれていました。"}, {"t": 1765.4, "x": "一つは、機体がまだ動いているということ。"}, {"t": 1768.35, "x": "もう一つは、機体がどれだけの"}, {"t": 1770.4666666666667, "x": "速さで遠ざかっているかです。"}, {"t": 1772.2, "x": "二つ目の記録から小さなずれが見つかりました。"}, {"t": 1775.1, "x": "ずれを解く手がかりは、階段の下の箱の中にありました。"}, {"t": 1778.9, "x": "捨てられかけた機械の中にもありました。"}, {"t": 1781.35, "x": "そして答えは、機体の中にありました。"}, {"t": 1784.1, "x": "電気をつくるための熱が、機体を"}, {"t": 1786.5166666666667, "x": "太陽の側へ押していたのです。"}, {"t": 1788.4166666666667, "x": "同じ熱が、パイオニア10号の声を支えていました。"}, {"t": 1792.0833333333333, "x": "熱のもとが減るにつれて、ブレーキは弱まりました。"}, {"t": 1795.5666666666666, "x": "電波を送る力も同じように弱まりました。"}, {"t": 1798.3666666666666, "x": "二〇〇二年三月、打ち上げから"}, {"t": 1800.7, "x": "三十年の日に、返事が届きました。"}, {"t": 1803.3666666666666, "x": "二〇〇三年一月、最後のかすかな信号が届きました。"}, {"t": 1807.4333333333334, "x": "二〇〇六年三月の呼びかけには、返事がありませんでした。"}, {"t": 1811.3833333333334, "x": "二機の声は、それきり戻っていません。"}, {"t": 1814.0833333333333, "x": "謎を生んだ熱と、声を支えた熱は、同じものでした。"}, {"t": 1818.3, "x": "その熱が冷めていきました。"}, {"t": 1820.05, "x": "それにつれて謎は解けました。"}, {"t": 1821.95, "x": "そして声は消えました。"}, {"t": 1823.5, "x": "太陽や惑星の重力に、機体自身の熱を足して計算する。"}, {"t": 1827.8666666666666, "x": "そうすれば、記録に残った動きと合う。"}, {"t": 1830.6666666666667, "x": "それが、二〇一二年に出た答えでした。"}, {"t": 1833.55, "x": "別の研究者たちも同じ答えを出しました。"}, {"t": 1836.35, "x": "重力の決まりは、太陽系の外れでも"}, {"t": 1839.15, "x": "変わっていませんでした。"}, {"t": 1840.45, "x": "赤い星アルデバランのそばを"}, {"t": 1842.1166666666666, "x": "通るまで、およそ二百万年です。"}, {"t": 1844.6166666666666, "x": "パイオニアという名前は、英語で"}, {"t": 1846.9166666666667, "x": "先に道を切り開く者という意味です。"}, {"t": 1849.35, "x": "小惑星帯。"}, {"t": 1850.5166666666667, "x": "木星のそば。"}, {"t": 1851.5833333333333, "x": "土星のそば。"}, {"t": 1852.55, "x": "そして海王星の軌道の外。"}, {"t": 1854.5666666666666, "x": "どの場所にも、最初に入ったのはこの二機でした。"}, {"t": 1857.8166666666666, "x": "最後に残した謎にも、二機は自分の体で答えを出しました。"}, {"t": 1862.0666666666666, "x": "答えは、自分の熱でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
