 "i": 675}, {"t": 1909.2, "i": 676}, {"t": 1911.5, "i": 677}, {"t": 1914.5166666666667, "i": 678}, {"t": 1917.6166666666666, "i": 679}, {"t": 1920.8833333333334, "i": 680}, {"t": 1923.3833333333334, "i": 681}, {"t": 1926.15, "i": 682}, {"t": 1929.0, "i": 683}, {"t": 1931.6, "i": 684}, {"t": 1935.8166666666666, "i": 685}, {"t": 1939.65, "i": 686}, {"t": 1941.9, "i": 687}, {"t": 1944.2166666666667, "i": 688}, {"t": 1947.8833333333334, "i": 689}, {"t": 1951.1666666666667, "i": 690}, {"t": 1953.7333333333333, "i": 691}, {"t": 1956.55, "i": 692}, {"t": 1958.8166666666666, "i": 693}, {"t": 1962.1666666666667, "i": 694}, {"t": 1964.9833333333333, "i": 695}, {"t": 1967.9, "i": 696}, {"t": 1970.8166666666666, "i": 697}, {"t": 1972.6833333333334, "i": 698}, {"t": 1974.9833333333333, "i": 698}], "subs": [{"t": 0.0, "x": "天王星の衛星アリエルには、北半分の写真がありません。"}, {"t": 4.1, "x": "撮りそこねたのではありません。"}, {"t": 5.883333333333334, "x": "撮れなかったのです。"}, {"t": 7.15, "x": "一九八六年一月、探査機がそばを通ったとき、"}, {"t": 11.366666666666667, "x": "アリエルの北半分は、長い夜の中にありました。"}, {"t": 15.133333333333333, "x": "光の当たっていない地面は、カメラには写りません。"}, {"t": 18.583333333333332, "x": "同じことが、天王星のほかの"}, {"t": 20.883333333333333, "x": "大きな衛星にも起きていました。"}, {"t": 22.75, "x": "ミランダも、ウンブリエルも、チタニアも、"}, {"t": 25.633333333333333, "x": "オベロンも、記録に残っているのは、南の側だけです。"}, {"t": 29.983333333333334, "x": "三年半後、同じ探査機は海王星に着きました。"}, {"t": 33.733333333333334, "x": "海王星でいちばん大きな衛星、トリトンでも、"}, {"t": 36.96666666666667, "x": "写真に残ったのは南半球でした。"}, {"t": 39.65, "x": "その探査機の名前は、ボイジャー2号です。"}, {"t": 41.38333333333333, "x": "ボイジャー2号█"}, {"t": 43.1, "x": "天王星と海王星のそばを通った人工物は、"}, {"t": 46.18333333333333, "x": "いまもこの一機しかありません。"}, {"t": 48.21666666666667, "x": "通ったのは、一度だけです。"}, {"t": 50.333333333333336, "x": "止まってもいません。"}, {"t": 51.53333333333333, "x": "近づいて、すれ違って、そのまま先へ抜けていきました。"}, {"t": 55.666666666666664, "x": "天王星でも、海王星でも、同じでした。"}, {"t": 59.18333333333333, "x": "天王星への最接近から、四十年がたちます。"}, {"t": 62.7, "x": "海王星からは、三十七年。"}, {"t": 65.16666666666667, "x": "そのあいだに、二つの星を目指して"}, {"t": 67.6, "x": "打ち上げられた探査機は、一機もありません。"}, {"t": 70.43333333333334, "x": "天王星と海王星の姿そのものは、写真に残っています。"}, {"t": 74.65, "x": "青緑色の球と、青い球。"}, {"t": 77.18333333333334, "x": "遠くから撮った像も、その後何枚も撮られてきました。"}, {"t": 80.75, "x": "けれども、その衛星の半分の地面と、"}, {"t": 83.58333333333333, "x": "二つの星の雲の下には、写真がありません。"}, {"t": 87.06666666666666, "x": "一度行った場所の、すぐ隣に、"}, {"t": 89.38333333333334, "x": "誰も見ていない場所が残っている。"}, {"t": 91.73333333333333, "x": "それが、この二つの星です。"}, {"t": 94.0, "x": "計画が無かったわけではありません。"}, {"t": 96.15, "x": "天王星へ行く探査機は、アメリカの科学者たちが"}, {"t": 99.4, "x": "まとめた十年ごとの方針で、新しく始める"}, {"t": 102.66666666666667, "x": "大型計画のいちばん上に置かれています。"}, {"t": 105.2, "x": "それでも、打ち上げの年は、まだ決まっていません。"}, {"t": 108.83333333333333, "x": "ボイジャー2号が、たった一度の通過で"}, {"t": 111.36666666666666, "x": "何を持ち帰り、何を持ち帰れなかったのか。"}, {"t": 114.56666666666666, "x": "そして、なぜそのあと誰も続かないのか。"}, {"t": 117.53333333333333, "x": "残っている記録を、順に読んでいきます。"}, {"t": 120.36666666666666, "x": "話は、打ち上げの前から始まります。"}, {"t": 123.25, "x": "木星、土星、天王星、海王星。"}, {"t": 126.91666666666667, "x": "外側を回る四つの大きな惑星が、太陽のまわりで、"}, {"t": 130.83333333333334, "x": "ちょうど一続きにたどれる位置に並ぶことがあります。"}, {"t": 134.16666666666666, "x": "NASAの記録では、その並びは"}, {"t": 136.71666666666667, "x": "およそ百七十五年に一度とされています。"}, {"t": 137.23333333333332, "x": "百七十五年に一度█"}, {"t": 139.96666666666667, "x": "並んでいると、何ができるのか。"}, {"t": 142.41666666666666, "x": "探査機は、惑星のそばを通るとき、その惑星の"}, {"t": 146.23333333333332, "x": "重力に引かれて、向きと速さを変えます。"}, {"t": 149.11666666666667, "x": "うまく通れば、燃料をほとんど使わずに速くなれます。"}, {"t": 152.9, "x": "スイングバイと呼ばれるやり方です。"}, {"t": 155.01666666666668, "x": "四つの惑星が並んでいれば、一つ目の惑星で"}, {"t": 158.25, "x": "勢いをもらって二つ目へ、二つ目で勢いをもらって"}, {"t": 161.65, "x": "三つ目へと、次々に乗り継ぐことができます。"}, {"t": 164.71666666666667, "x": "NASAは、この乗り継ぎによって、海王星までの"}, {"t": 168.2, "x": "道のりが三十年から十二年に縮まった、と説明しています。"}, {"t": 172.51666666666668, "x": "この並びが、一九七〇年代の終わりにめぐってきました。"}, {"t": 176.8, "x": "逃せば、次は百七十五年後です。"}, {"t": 179.7, "x": "打ち上げは、一九七七年。"}, {"t": 182.56666666666666, "x": "二機の探査機が、夏の終わりに相次いで飛び立ちました。"}, {"t": 186.25, "x": "先に上がったのは、ボイジャー2号のほうです。"}, {"t": 189.33333333333334, "x": "八月二十日。"}, {"t": 190.5, "x": "ボイジャー1号は、九月五日。"}, {"t": 192.88333333333333, "x": "1号は、より速く、より短い道筋に乗せられていました。"}, {"t": 197.48333333333332, "x": "番号の小さいほうが、あとから出て、先を行く形です。"}, {"t": 201.8, "x": "ボイジャー2号の重さは、七百二十一・九キログラム。"}, {"t": 205.75, "x": "積んでいた観測機器は、十一。"}, {"t": 208.3, "x": "電源は、プルトニウムを使ったものが三台です。"}, {"t": 211.63333333333333, "x": "この電源の話は、あとでもう一度出てきます。"}, {"t": 214.96666666666667, "x": "ただし、はじめから四つの惑星を"}, {"t": 217.46666666666667, "x": "回ると決まっていたわけではありません。"}, {"t": 219.6, "x": "NASAの記録によれば、ボイジャーは木星と"}, {"t": 222.31666666666666, "x": "土星の二つを調べる計画として始まり、あとから"}, {"t": 225.73333333333332, "x": "四つの惑星へと行き先が広げられました。"}, {"t": 228.35, "x": "天王星と海王星は、最初の約束には"}, {"t": 231.51666666666668, "x": "入っていない行き先でした。"}, {"t": 233.1, "x": "そして、二機のうち、天王星へ"}, {"t": 235.88333333333333, "x": "向かえたのは、一機だけです。"}, {"t": 237.88333333333333, "x": "ボイジャー1号は、土星に着いたとき、土星で"}, {"t": 241.3, "x": "いちばん大きな衛星タイタンのすぐそばを"}, {"t": 243.66666666666666, "x": "通るよう、狙いをつけられていました。"}, {"t": 246.18333333333334, "x": "厚い大気に包まれたタイタンは、"}, {"t": 248.18333333333334, "x": "どうしても近くで調べたい相手でした。"}, {"t": 250.85, "x": "その代わり、1号は土星の南極の側を"}, {"t": 253.81666666666666, "x": "回りこむ形になり、惑星たちが回っている"}, {"t": 256.9, "x": "平らな面から、北の方へ外れていきました。"}, {"t": 259.9, "x": "これで、1号が天王星や海王星へ向かう道は、閉じました。"}, {"t": 264.7, "x": "残ったのは、2号です。"}, {"t": 266.6666666666667, "x": "2号は一九七九年七月に木星を、"}, {"t": 269.95, "x": "一九八一年八月に土星を通り過ぎ、そのたびに"}, {"t": 274.56666666666666, "x": "重力で向きを変えて、次の目的地へ進みました。"}, {"t": 278.1166666666667, "x": "一九八六年に、天王星。"}, {"t": 281.1, "x": "一九八九年に、海王星。"}, {"t": 284.1666666666667, "x": "この二つの日付のあと、天王星と海王星の"}, {"t": 287.46666666666664, "x": "そばを通った探査機の記録は、ありません。"}, {"t": 290.31666666666666, "x": "言いかえると、人類が天王星と海王星について"}, {"t": 293.76666666666665, "x": "近くから知っていることの多くは、一機の探査機が、"}, {"t": 297.01666666666665, "x": "それぞれ一回ずつ、通りすがりに見たものです。"}, {"t": 300.5, "x": "木星と土星には、その後、別の探査機が何度も"}, {"t": 304.25, "x": "向かい、まわりを回りながら何年も調べました。"}, {"t": 307.43333333333334, "x": "天王星と海王星には、それがありません。"}, {"t": 310.55, "x": "四つの大きな惑星のうち、二つは何度も"}, {"t": 313.6, "x": "訪れられ、二つは一度通り過ぎられただけ。"}, {"t": 316.71666666666664, "x": "記録の厚さは、そこではっきりと分かれています。"}, {"t": 319.93333333333334, "x": "乗り継ぎには、もう一つの面があります。"}, {"t": 322.6666666666667, "x": "惑星の重力で勢いをつけて進む探査機は、"}, {"t": 325.73333333333335, "x": "そこで止まることができません。"}, {"t": 327.76666666666665, "x": "天王星のまわりを回るためには、到着したところで"}, {"t": 331.25, "x": "大きく速さを落とす必要があります。"}, {"t": 333.56666666666666, "x": "そのための燃料を積めば、探査機は重くなり、"}, {"t": 336.78333333333336, "x": "重くなれば打ち上げが難しくなります。"}, {"t": 339.53333333333336, "x": "ボイジャーは、はじめから、通り過ぎることを"}, {"t": 342.6, "x": "前提に作られた探査機でした。"}, {"t": 344.53333333333336, "x": "だから、ボイジャー2号にとっての天王星は、"}, {"t": 347.46666666666664, "x": "近づいて、すれ違って、離れていく、その一回きりでした。"}, {"t": 352.55, "x": "その一回で、撮れるものを撮るしかありませんでした。"}, {"t": 355.9166666666667, "x": "天王星は、太陽から地球までの、"}, {"t": 358.56666666666666, "x": "およそ十九倍のところを回っています。"}, {"t": 361.35, "x": "太陽の光が届くのに、二時間四十分かかる距離です。"}, {"t": 365.43333333333334, "x": "光の強さは、距離の二乗に比例して弱くなります。"}, {"t": 369.18333333333334, "x": "十九倍遠ければ、明るさは三百六十分の一ほど。"}, {"t": 373.25, "x": "これはNASAの示す距離から"}, {"t": 374.73333333333335, "x": "計算した目安ですが、天王星のあたりが、"}, {"t": 377.73333333333335, "x": "地球の真昼とは比べものにならないほど暗い"}, {"t": 380.7, "x": "場所だということは、この数字からも分かります。"}, {"t": 383.75, "x": "NASAの歴史部門の記録には、天王星での"}, {"t": 387.05, "x": "光の量は、その前に訪れた土星のときの"}, {"t": 389.98333333333335, "x": "二十五パーセント█"}, {"t": 390.48333333333335, "x": "二十五パーセントしかなかった、と書かれています。"}, {"t": 393.93333333333334, "x": "四分の一の光です。"}, {"t": 395.6, "x": "暗い場所で写真を撮るには、シャッターを"}, {"t": 398.1666666666667, "x": "長く開けておく必要があります。"}, {"t": 400.18333333333334, "x": "ところが、探査機は猛烈な速さで動いています。"}, {"t": 403.6333333333333, "x": "長く開ければ、写真はぶれます。"}, {"t": 406.1333333333333, "x": "そこで、探査機の側に、写真のぶれを"}, {"t": 409.21666666666664, "x": "打ち消すための工夫が組みこまれました。"}, {"t": 411.35, "x": "記録では「画像の動きの補正」と呼ばれています。"}, {"t": 415.1666666666667, "x": "撮影のあいだ、機体の向きをゆっくり動かして、カメラが"}, {"t": 419.25, "x": "目標を追いかけるようにする方法だったとされています。"}, {"t": 422.4166666666667, "x": "打ち上げから八年以上たってから、地球から送った指令で、"}, {"t": 426.35, "x": "撮り方そのものを作り変えたことになります。"}, {"t": 429.21666666666664, "x": "送る側にも、問題がありました。"}, {"t": 431.71666666666664, "x": "遠くなるほど、地球に届く電波は弱くなります。"}, {"t": 435.23333333333335, "x": "天王星からの電波を受けるために、地上では複数の"}, {"t": 438.85, "x": "アンテナをつなぎ、一つの大きな耳のように使いました。"}, {"t": 442.45, "x": "オーストラリアのパークスにある、直径六十四メートルの"}, {"t": 446.0833333333333, "x": "アンテナも、観測に加わっています。"}, {"t": 448.5833333333333, "x": "さらに、途中で傷ついても元に戻せる形で"}, {"t": 451.8, "x": "データを送る、新しい符号の方式が、"}, {"t": 454.7, "x": "このときはじめて使われました。"}, {"t": 456.8666666666667, "x": "記録によれば、そのおかげで、その場で送る"}, {"t": 460.0833333333333, "x": "画像のデータ量は、七割近く減らせました。"}, {"t": 463.2, "x": "こうして、一九八六年一月二十四日。"}, {"t": 467.06666666666666, "x": "ボイジャー2号は、天王星の雲の上、"}, {"t": 469.9, "x": "八万千五百キロメートル█"}, {"t": 469.98333333333335, "x": "八万千五百キロメートルのところを通過しました。"}, {"t": 473.71666666666664, "x": "持ち帰った写真は、NASAの記録で、七千枚以上です。"}, {"t": 478.03333333333336, "x": "写っていた天王星そのものは、"}, {"t": 479.9166666666667, "x": "青緑色の、ほとんど模様のない球でした。"}, {"t": 483.4166666666667, "x": "それでも、見つかったものは少なくありません。"}, {"t": 486.4, "x": "それまで五つしか知られていなかった"}, {"t": 488.43333333333334, "x": "衛星に、新しい衛星が十個加わりました。"}, {"t": 491.81666666666666, "x": "NASAの別の資料には十一個と"}, {"t": 493.75, "x": "書かれたものもあり、数え方にずれがあります。"}, {"t": 496.78333333333336, "x": "環は、新たに二本見つかりました。"}, {"t": 499.26666666666665, "x": "天王星は、一七八一年に、ウィリアム・"}, {"t": 502.9166666666667, "x": "ハーシェルが望遠鏡で見つけた星です。"}, {"t": 505.25, "x": "見つかってから二百年あまり、地球から"}, {"t": 507.93333333333334, "x": "知られていた衛星は五つだけでした。"}, {"t": 510.1, "x": "いま、NASAが数えている天王星の衛星は、二十八個。"}, {"t": 514.5166666666667, "x": "そのうちの多くは、ボイジャー2号の一度の通過と、"}, {"t": 517.9, "x": "そのあとの望遠鏡の観測で加わったものです。"}, {"t": 521.25, "x": "そして、磁場です。"}, {"t": 522.9, "x": "天王星の磁場は、自転の軸から五十九度も"}, {"t": 526.0666666666667, "x": "傾いていて、しかも磁場の中心が、星の中心から、"}, {"t": 530.1333333333333, "x": "半径のおよそ三分の一ほどずれていました。"}, {"t": 533.1333333333333, "x": "天王星は、自転の軸そのものが、"}, {"t": 535.7, "x": "九十七・七七度倒れています。"}, {"t": 538.3666666666667, "x": "ほぼ横倒しのまま回っている星です。"}, {"t": 540.85, "x": "その上、磁場までずれている。"}, {"t": 542.9833333333333, "x": "ボイジャー2号が送ってきた磁場の姿は、それまで"}, {"t": 546.25, "x": "知られていたどの惑星とも違う、奇妙なものでした。"}, {"t": 549.75, "x": "それから四十年近く、この奇妙な姿が、天王星の"}, {"t": 554.05, "x": "磁場を語るときの土台になってきました。"}, {"t": 556.3166666666667, "x": "ほかに、近くで測った記録が無いからです。"}, {"t": 559.35, "x": "二〇二四年十一月、その土台を揺らす論文が、"}, {"t": 563.1666666666666, "x": "学術誌『ネイチャー・アストロノミー』に出ました。"}, {"t": 563.6166666666667, "x": "ネイチャー・アストロノミー█"}, {"t": 567.0333333333333, "x": "ボイジャー2号が着いたころ、太陽から"}, {"t": 569.6, "x": "吹き出す粒子の流れ、つまり太陽風が、"}, {"t": 572.4666666666667, "x": "たまたま強まっていたというのです。"}, {"t": 574.75, "x": "論文は、天王星の磁場のまわりがそれほど"}, {"t": 577.7833333333333, "x": "押しつぶされた形になるのは、全体の五パーセントに"}, {"t": 581.1833333333333, "x": "満たない時間だけだと見積もっています。"}, {"t": 583.3333333333334, "x": "そして、もし探査機が数日早く着いていれば、"}, {"t": 586.4833333333333, "x": "太陽風の押す力はおよそ二十分の一で、磁場の"}, {"t": 590.3166666666667, "x": "姿はまるで違って見えていたはずだ、と書いています。"}, {"t": 593.6833333333333, "x": "一度しか見ていないということは、"}, {"t": 595.5166666666667, "x": "その一度が普段どおりだったのかどうかを、"}, {"t": 598.2166666666667, "x": "確かめる方法が無いということです。"}, {"t": 600.7166666666667, "x": "四十年間語られてきた天王星の磁場は、めずらしい"}, {"t": 604.4, "x": "数日間の、一回きりの記録だったのかもしれません。"}, {"t": 608.0666666666667, "x": "それを確かめるには、もう一度、行くしかありません。"}, {"t": 611.9333333333333, "x": "天王星が横倒しで回っていることは、"}, {"t": 614.4166666666666, "x": "写真の問題にもつながります。"}, {"t": 616.6833333333333, "x": "地球の軸は、二十三度あまり傾いています。"}, {"t": 619.9833333333333, "x": "その傾きが、四季を生みます。"}, {"t": 622.3333333333334, "x": "天王星の傾きは、九十七・七七度。"}, {"t": 625.7, "x": "軸の片方の端が、ほとんど太陽の方を"}, {"t": 628.7333333333333, "x": "向いてしまう時期があります。"}, {"t": 630.2666666666667, "x": "天王星は、太陽のまわりを一周するのに、"}, {"t": 634.0333333333333, "x": "およそ八十四年かかります。"}, {"t": 634.6166666666667, "x": "八十四年█"}, {"t": 636.6, "x": "NASAの説明では、その一年のおよそ四分の"}, {"t": 639.6333333333333, "x": "一のあいだ、太陽は片方の極の真上近くを照らし続け、"}, {"t": 643.7, "x": "反対側の半球は、二十一年つづく暗い冬に入ります。"}, {"t": 648.2, "x": "一九八六年一月、天王星の南半球は、夏の盛りでした。"}, {"t": 653.9, "x": "太陽は南極の方から照らし、"}, {"t": 655.9666666666667, "x": "北半球は冬の夜の中にありました。"}, {"t": 658.8, "x": "天王星の大きな衛星たちも、天王星と"}, {"t": 661.9333333333333, "x": "同じ向きに傾いた面を回っています。"}, {"t": 664.3, "x": "だから、衛星たちも、照らされていたのは"}, {"t": 667.3666666666667, "x": "南半分だけでした。"}, {"t": 668.7833333333333, "x": "北半分は、ボイジャー2号が"}, {"t": 670.9333333333333, "x": "通り過ぎるあいだ、ずっと影の中でした。"}, {"t": 673.7333333333333, "x": "アリエルの写真は、表面のおよそ四割を写しています。"}, {"t": 677.6, "x": "ただし、地形を描き、クレーターを"}, {"t": 680.45, "x": "数えられるだけの質で写っていたのは、"}, {"t": 682.7, "x": "三十五パーセントにとどまると報告されています。"}, {"t": 686.0, "x": "一九八七年に学術誌『ネイチャー』に出た論文の数字です。"}, {"t": 691.3333333333334, "x": "いちばん細かい写真でも、一つの点が"}, {"t": 694.05, "x": "およそ二キロメートル。"}, {"t": 695.2666666666667, "x": "それより小さなものは、見分けられません。"}, {"t": 698.1, "x": "ミランダは、直径およそ四百八十キロメートルの、"}, {"t": 701.65, "x": "小さな衛星です。"}, {"t": 703.2333333333333, "x": "天王星の五つの大きな衛星の中で、"}, {"t": 705.8, "x": "いちばん内側を回り、いちばん小さい。"}, {"t": 709.0333333333333, "x": "ボイジャー2号は、このミランダに、一万八千マイル、"}, {"t": 712.9, "x": "およそ二万九千キロメートルまで近づきました。"}, {"t": 716.1666666666666, "x": "九枚の写真をつなぎ合わせた、"}, {"t": 718.15, "x": "南極の側から見た全体の像が残っています。"}, {"t": 721.5166666666667, "x": "その像には、奇妙な地面が写っていました。"}, {"t": 724.6166666666667, "x": "古い、クレーターだらけのなだらかな土地。"}, {"t": 727.4666666666667, "x": "そして、明るい帯と暗い帯が何本も重なり、"}, {"t": 730.8666666666667, "x": "崖と尾根が入り組んだ、若くて複雑な土地。"}, {"t": 734.35, "x": "その中に、山形の模様が一つ。"}, {"t": 737.0, "x": "NASAの説明は、この二種類の地形が"}, {"t": 739.6666666666666, "x": "隣り合って並んでいる、と記しています。"}, {"t": 742.3833333333333, "x": "では、北半分はどうなっているのか。"}, {"t": 745.0166666666667, "x": "分かりません。"}, {"t": 745.9666666666667, "x": "南半分から北半分を想像することは、できます。"}, {"t": 749.7666666666667, "x": "ですが、想像は写真ではありません。"}, {"t": 752.3833333333333, "x": "ミランダの入り組んだ地形が北側にも続いているのか、"}, {"t": 755.6166666666667, "x": "北側だけまったく別の地形が広がっているのか。"}, {"t": 759.0, "x": "それを示す写真は、一枚もありません。"}, {"t": 762.0166666666667, "x": "ウンブリエルも、チタニアも、オベロンも、同じです。"}, {"t": 766.0333333333333, "x": "チタニアのそばを通ったのは、"}, {"t": 767.65, "x": "ちょうど南半球の夏至のころで、北半球は"}, {"t": 771.15, "x": "ほとんどすべてが光の外にありました。"}, {"t": 773.45, "x": "天王星の五つの大きな衛星について、"}, {"t": 776.0666666666667, "x": "北半球の地図は、どれも白いままです。"}, {"t": 779.2833333333333, "x": "光の当たっていない地面を撮る方法は、"}, {"t": 781.6833333333333, "x": "このときの探査機にはありませんでした。"}, {"t": 784.2666666666667, "x": "カメラは、太陽の光が地面で"}, {"t": 786.5833333333334, "x": "はね返ったものを写す道具です。"}, {"t": 788.55, "x": "はね返る光が無ければ、そこには黒い色しか残りません。"}, {"t": 792.5666666666667, "x": "影の中の半分は、写真の上では、"}, {"t": 795.25, "x": "ただの黒い欠けとして記録されています。"}, {"t": 797.8833333333333, "x": "ボイジャー2号の到着の日は、百七十五年に"}, {"t": 801.1666666666666, "x": "一度の惑星の並びと、乗り継ぎの道筋で決まっていました。"}, {"t": 805.2333333333333, "x": "天王星の季節に合わせて、着く日を"}, {"t": 807.9333333333333, "x": "選ぶことはできませんでした。"}, {"t": 809.6, "x": "着いたとき、たまたま南が夏だった。"}, {"t": 812.4, "x": "写真に残った半分と、残らなかった"}, {"t": 815.1666666666666, "x": "半分は、そうやって分かれました。"}, {"t": 817.5166666666667, "x": "もう一つ、写真の存在しない場所があります。"}, {"t": 820.7666666666667, "x": "天王星そのものの、雲の下です。"}, {"t": 823.4166666666666, "x": "天王星には、地面と呼べるものがありません。"}, {"t": 826.5166666666667, "x": "NASAの説明では、天王星は氷の巨大惑星と呼ばれ、"}, {"t": 828.9166666666666, "x": "氷の巨大惑星█"}, {"t": 830.9833333333333, "x": "ほとんどが渦を巻く液体や気体でできています。"}, {"t": 834.5833333333334, "x": "雲の下に何があるのか。"}, {"t": 836.3, "x": "どこまで降りれば、何が変わるのか。"}, {"t": 838.9166666666666, "x": "見た者はいません。"}, {"t": 840.1833333333333, "x": "大気のいちばん冷たいところで、"}, {"t": 842.0833333333334, "x": "マイナス二百二十四度とされています。"}, {"t": 844.85, "x": "地球のそばの望遠鏡は、その後も"}, {"t": 847.4333333333333, "x": "天王星を撮り続けています。"}, {"t": 849.3166666666667, "x": "けれども、それは遠くから見た円盤の模様です。"}, {"t": 852.6166666666667, "x": "衛星の地面の起伏を見分けられるものではありません。"}, {"t": 855.8833333333333, "x": "誰も行ったことのない星に写真が無いのは、"}, {"t": 858.3833333333333, "x": "当たり前のことです。"}, {"t": 860.0166666666667, "x": "天王星の衛星は、そうではありません。"}, {"t": 862.9, "x": "一度は探査機が行き、何千枚もの写真を撮った場所の、"}, {"t": 866.7833333333333, "x": "すぐ裏側に、写真の無い半分が残っています。"}, {"t": 870.4166666666666, "x": "天王星から、三年半。"}, {"t": 872.5333333333333, "x": "一九八九年八月二十五日、ボイジャー2号は"}, {"t": 876.9666666666667, "x": "海王星█"}, {"t": 877.5166666666667, "x": "海王星に着きました。"}, {"t": 879.1833333333333, "x": "海王星は、太陽から地球までの、"}, {"t": 881.8666666666667, "x": "およそ三十倍のところを回っています。"}, {"t": 884.6166666666667, "x": "太陽の光が届くのに、四 2.5333333333333, "x": "新しい衛星が六個、新しい環が四本、見つかりました。"}, {"t": 997.2, "x": "大暗斑は、その後、消えました。"}, {"t": 1000.05, "x": "NASAの説明にある言葉は、それだけです。"}, {"t": 1003.0, "x": "どのように消えていったのかを、"}, {"t": 1004.6166666666667, "x": "そばで見ていた探査機はありません。"}, {"t": 1006.95, "x": "海王星への最接近から、およそ五時間後。"}, {"t": 1010.35, "x": "ボイジャー2号は、海王星でいちばん大きな衛星、"}, {"t": 1014.0166666666667, "x": "トリトン█"}, {"t": 1014.05, "x": "トリトンから、約四万キロメートルのところを通りました。"}, {"t": 1018.3333333333334, "x": "トリトンは、直径およそ二千七百キロメートル。"}, {"t": 1021.7833333333333, "x": "海王星のまわりを、ほかの多くの"}, {"t": 1024.2666666666667, "x": "衛星とは逆の向きに回っています。"}, {"t": 1026.5, "x": "惑星のまわりで一緒に生まれた"}, {"t": 1028.4166666666667, "x": "衛星なら、ふつうはこうなりません。"}, {"t": 1030.7833333333333, "x": "そのため、トリトンはもともと海王星より"}, {"t": 1033.6, "x": "さらに外側で生まれた天体で、あとから海王星に"}, {"t": 1037.1333333333334, "x": "つかまったのではないか、と考えられています。"}, {"t": 1040.1333333333334, "x": "表面の温度は、マイナス二百三十五度。"}, {"t": 1043.25, "x": "ボイジャーがそれまでに測った自然の"}, {"t": 1045.2166666666667, "x": "天体の中で、いちばん冷たい地面でした。"}, {"t": 1048.2666666666667, "x": "その凍った地面から、何かが噴き出していました。"}, {"t": 1051.6, "x": "高さおよそ八キロメートルの、黒っぽい柱です。"}, {"t": 1055.1166666666666, "x": "噴き上がったものは上空の風に流され、"}, {"t": 1057.6166666666666, "x": "百五十キロメートルほど横にたなびいていました。"}, {"t": 1060.9166666666667, "x": "当時の発表では、地面の下から、"}, {"t": 1063.4166666666667, "x": "おそらく窒素のガスが吹き上がり、黒い粒を"}, {"t": 1066.75, "x": "持ち上げている、と説明されています。"}, {"t": 1069.35, "x": "表面には、同じような噴き出しが残したとみられる"}, {"t": 1072.65, "x": "黒い筋が、百二十本以上見つかったとされています。"}, {"t": 1076.2833333333333, "x": "ただし、この噴き出しが見えたのも、南半球でした。"}, {"t": 1080.3, "x": "トリトンもこのとき、南半球が夏を"}, {"t": 1083.1, "x": "迎えていて、北の方は影の中にありました。"}, {"t": 1086.2833333333333, "x": "写真に残ったのは、南の側だけです。"}, {"t": 1089.2666666666667, "x": "このトリトンのそばを通ったのが、"}, {"t": 1091.0833333333333, "x": "ボイジャー2号にとって、惑星と"}, {"t": 1093.7166666666667, "x": "その衛星に近づく最後の機会でした。"}, {"t": 1096.1666666666667, "x": "凍った地面を近くから見たのも、これが最後です。"}, {"t": 1099.6666666666667, "x": "ボイジャー2号の道筋は、はじめから"}, {"t": 1102.2333333333333, "x": "トリトンに近づくように決められていました。"}, {"t": 1104.6666666666667, "x": "海王星の重力 function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
