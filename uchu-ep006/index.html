<script>
const D={"name": "ep006", "file": "ep006", "dur": 1964.41665625, "segs": [], "subs": [{"t": 0.0, "x": "天王星の衛星アリエルには、北半分の写真がありません。"}, {"t": 4.1, "x": "撮りそこねたのではありません。"}, {"t": 5.883333333333334, "x": "撮れなかったのです。"}, {"t": 7.15, "x": "一九八六年一月、探査機がそばを通ったとき、"}, {"t": 11.366666666666667, "x": "アリエルの北半分は、長い夜の中にありました。"}, {"t": 15.133333333333333, "x": "光の当たっていない地面は、カメラには写りません。"}, {"t": 18.583333333333332, "x": "同じことが、天王星のほかの"}, {"t": 20.883333333333333, "x": "大きな衛星にも起きていました。"}, {"t": 22.75, "x": "ミランダも、ウンブリエルも、チタニアも、"}, {"t": 25.633333333333333, "x": "オベロンも、記録に残っているのは、南の側だけです。"}, {"t": 29.983333333333334, "x": "三年半後、同じ探査機は海王星に着きました。"}, {"t": 33.733333333333334, "x": "海王星でいちばん大きな衛星、トリトンでも、"}, {"t": 36.96666666666667, "x": "写真に残ったのは南半球でした。"}, {"t": 39.65, "x": "その探査機の名前は、ボイジャー2号です。"}, {"t": 41.15, "x": "ボイジャー2号█"}, {"t": 42.65, "x": "天王星と海王星のそばを通った人工物は、"}, {"t": 45.733333333333334, "x": "いまもこの一機しかありません。"}, {"t": 47.766666666666666, "x": "通ったのは、一度だけです。"}, {"t": 49.88333333333333, "x": "止まってもいません。"}, {"t": 51.083333333333336, "x": "近づいて、すれ違って、そのまま先へ抜けていきました。"}, {"t": 55.21666666666667, "x": "天王星でも、海王星でも、同じでした。"}, {"t": 58.733333333333334, "x": "天王星への最接近から、四十年がたちます。"}, {"t": 62.25, "x": "海王星からは、三十七年。"}, {"t": 64.71666666666667, "x": "そのあいだに、二つの星を目指して"}, {"t": 67.15, "x": "打ち上げられた探査機は、一機もありません。"}, {"t": 69.98333333333333, "x": "天王星と海王星の姿そのものは、写真に残っています。"}, {"t": 74.2, "x": "青緑色の球と、青い球。"}, {"t": 76.73333333333333, "x": "遠くから撮った像も、その後何枚も撮られてきました。"}, {"t": 80.3, "x": "けれども、その衛星の半分の地面と、"}, {"t": 83.13333333333334, "x": "二つの星の雲の下には、写真がありません。"}, {"t": 86.61666666666666, "x": "一度行った場所の、すぐ隣に、"}, {"t": 88.93333333333334, "x": "誰も見ていない場所が残っている。"}, {"t": 91.28333333333333, "x": "それが、この二つの星です。"}, {"t": 93.55, "x": "計画が無かったわけではありません。"}, {"t": 95.7, "x": "天王星へ行く探査機は、アメリカの科学者たちが"}, {"t": 98.95, "x": "まとめた十年ごとの方針で、新しく始める"}, {"t": 102.21666666666667, "x": "大型計画のいちばん上に置かれています。"}, {"t": 104.75, "x": "それでも、打ち上げの年は、まだ決まっていません。"}, {"t": 108.38333333333334, "x": "ボイジャー2号が、たった一度の通過で"}, {"t": 110.91666666666667, "x": "何を持ち帰り、何を持ち帰れなかったのか。"}, {"t": 114.11666666666666, "x": "そして、なぜそのあと誰も続かないのか。"}, {"t": 117.08333333333333, "x": "残っている記録を、順に読んでいきます。"}, {"t": 119.91666666666667, "x": "話は、打ち上げの前から始まります。"}, {"t": 122.8, "x": "木星、土星、天王星、海王星。"}, {"t": 126.46666666666667, "x": "外側を回る四つの大きな惑星が、太陽のまわりで、"}, {"t": 130.38333333333333, "x": "ちょうど一続きにたどれる位置に並ぶことがあります。"}, {"t": 133.71666666666667, "x": "NASAの記録では、その並びは"}, {"t": 135.83333333333334, "x": "およそ百七十五年に一度とされています。"}, {"t": 136.26666666666668, "x": "百七十五年に一度█"}, {"t": 138.53333333333333, "x": "並んでいると、何ができるのか。"}, {"t": 140.98333333333332, "x": "探査機は、惑星のそばを通るとき、その惑星の"}, {"t": 144.8, "x": "重力に引かれて、向きと速さを変えます。"}, {"t": 147.68333333333334, "x": "うまく通れば、燃料をほとんど使わずに速くなれます。"}, {"t": 151.46666666666667, "x": "スイングバイと呼ばれるやり方です。"}, {"t": 153.58333333333334, "x": "四つの惑星が並んでいれば、一つ目の惑星で"}, {"t": 156.81666666666666, "x": "勢いをもらって二つ目へ、二つ目で勢いをもらって"}, {"t": 160.21666666666667, "x": "三つ目へと、次々に乗り継ぐことができます。"}, {"t": 163.28333333333333, "x": "NASAは、この乗り継ぎによって、海王星までの"}, {"t": 166.76666666666668, "x": "道のりが三十年から十二年に縮まった、と説明しています。"}, {"t": 171.08333333333334, "x": "この並びが、一九七〇年代の終わりにめぐってきました。"}, {"t": 175.36666666666667, "x": "逃せば、次は百七十五年後です。"}, {"t": 178.26666666666668, "x": "打ち上げは、一九七七年。"}, {"t": 181.13333333333333, "x": "二機の探査機が、夏の終わりに相次いで飛び立ちました。"}, {"t": 184.81666666666666, "x": "先に上がったのは、ボイジャー2号のほうです。"}, {"t": 187.9, "x": "八月二十日。"}, {"t": 189.06666666666666, "x": "ボイジャー1号は、九月五日。"}, {"t": 191.45, "x": "1号は、より速く、より短い道筋に乗せられていました。"}, {"t": 196.05, "x": "番号の小さいほうが、あとから出て、先を行く形です。"}, {"t": 200.36666666666667, "x": "ボイジャー2号の重さは、七百二十一・九キログラム。"}, {"t": 204.31666666666666, "x": "積んでいた観測機器は、十一。"}, {"t": 206.86666666666667, "x": "電源は、プルトニウムを使ったものが三台です。"}, {"t": 210.2, "x": "この電源の話は、あとでもう一度出てきます。"}, {"t": 213.53333333333333, "x": "ただし、はじめから四つの惑星を"}, {"t": 216.03333333333333, "x": "回ると決まっていたわけではありません。"}, {"t": 218.16666666666666, "x": "NASAの記録によれば、ボイジャーは木星と"}, {"t": 220.88333333333333, "x": "土星の二つを調べる計画として始まり、あとから"}, {"t": 224.3, "x": "四つの惑星へと行き先が広げられました。"}, {"t": 226.91666666666666, "x": "天王星と海王星は、最初の約束には"}, {"t": 230.08333333333334, "x": "入っていない行き先でした。"}, {"t": 231.66666666666666, "x": "そして、二機のうち、天王星へ"}, {"t": 234.45, "x": "向かえたのは、一機だけです。"}, {"t": 236.45, "x": "ボイジャー1号は、土星に着いたとき、土星で"}, {"t": 239.86666666666667, "x": "いちばん大きな衛星タイタンのすぐそばを"}, {"t": 242.23333333333332, "x": "通るよう、狙いをつけられていました。"}, {"t": 244.75, "x": "厚い大気に包まれたタイタンは、"}, {"t": 246.75, "x": "どうしても近くで調べたい相手でした。"}, {"t": 249.41666666666666, "x": "その代わり、1号は土星の南極の側を"}, {"t": 252.38333333333333, "x": "回りこむ形になり、惑星たちが回っている"}, {"t": 255.46666666666667, "x": "平らな面から、北の方へ外れていきました。"}, {"t": 258.46666666666664, "x": "これで、1号が天王星や海王星へ向かう道は、閉じました。"}, {"t": 263.26666666666665, "x": "残ったのは、2号です。"}, {"t": 265.23333333333335, "x": "2号は一九七九年七月に木星を、"}, {"t": 268.51666666666665, "x": "一九八一年八月に土星を通り過ぎ、そのたびに"}, {"t": 273.1333333333333, "x": "重力で向きを変えて、次の目的地へ進みました。"}, {"t": 276.68333333333334, "x": "一九八六年に、天王星。"}, {"t": 279.6666666666667, "x": "一九八九年に、海王星。"}, {"t": 282.73333333333335, "x": "この二つの日付のあと、天王星と海王星の"}, {"t": 286.03333333333336, "x": "そばを通った探査機の記録は、ありません。"}, {"t": 288.8833333333333, "x": "言いかえると、人類が天王星と海王星について"}, {"t": 292.3333333333333, "x": "近くから知っていることの多くは、一機の探査機が、"}, {"t": 295.5833333333333, "x": "それぞれ一回ずつ、通りすがりに見たものです。"}, {"t": 299.06666666666666, "x": "木星と土星には、その後、別の探査機が何度も"}, {"t": 302.81666666666666, "x": "向かい、まわりを回りながら何年も調べました。"}, {"t": 306.0, "x": "天王星と海王星には、それがありません。"}, {"t": 309.1166666666667, "x": "四つの大きな惑星のうち、二つは何度も"}, {"t": 312.1666666666667, "x": "訪れられ、二つは一度通り過ぎられただけ。"}, {"t": 315.28333333333336, "x": "記録の厚さは、そこではっきりと分かれています。"}, {"t": 318.5, "x": "乗り継ぎには、もう一つの面があります。"}, {"t": 321.23333333333335, "x": "惑星の重力で勢いをつけて進む探査機は、"}, {"t": 324.3, "x": "そこで止まることができません。"}, {"t": 326.3333333333333, "x": "天王星のまわりを回るためには、到着したところで"}, {"t": 329.81666666666666, "x": "大きく速さを落とす必要があります。"}, {"t": 332.1333333333333, "x": "そのための燃料を積めば、探査機は重くなり、"}, {"t": 335.35, "x": "重くなれば打ち上げが難しくなります。"}, {"t": 338.1, "x": "ボイジャーは、はじめから、通り過ぎることを"}, {"t": 341.1666666666667, "x": "前提に作られた探査機でした。"}, {"t": 343.1, "x": "だから、ボイジャー2号にとっての天王星は、"}, {"t": 346.03333333333336, "x": "近づいて、すれ違って、離れていく、その一回きりでした。"}, {"t": 351.1166666666667, "x": "その一回で、撮れるものを撮るしかありませんでした。"}, {"t": 354.48333333333335, "x": "天王星は、太陽から地球までの、"}, {"t": 357.1333333333333, "x": "およそ十九倍のところを回っています。"}, {"t": 359.9166666666667, "x": "太陽の光が届くのに、二時間四十分かかる距離です。"}, {"t": 364.0, "x": "光の強さは、距離の二乗に比例して弱くなります。"}, {"t": 367.75, "x": "十九倍遠ければ、明るさは三百六十分の一ほど。"}, {"t": 371.81666666666666, "x": "これはNASAの示す距離から"}, {"t": 373.3, "x": "計算した目安ですが、天王星のあたりが、"}, {"t": 376.3, "x": "地球の真昼とは比べものにならないほど暗い"}, {"t": 379.26666666666665, "x": "場所だということは、この数字からも分かります。"}, {"t": 382.31666666666666, "x": "NASAの歴史部門の記録には、天王星での"}, {"t": 385.28333333333336, "x": "光の量は、その前に訪れた土星のときの"}, {"t": 387.93333333333334, "x": "二十五パーセント█"}, {"t": 388.3833333333333, "x": "二十五パーセントしかなかった、と書かれています。"}, {"t": 391.48333333333335, "x": "四分の一の光です。"}, {"t": 393.15, "x": "暗い場所で写真を撮るには、シャッターを"}, {"t": 395.71666666666664, "x": "長く開けておく必要があります。"}, {"t": 397.73333333333335, "x": "ところが、探査機は猛烈な速さで動いています。"}, {"t": 401.18333333333334, "x": "長く開ければ、写真はぶれます。"}, {"t": 403.68333333333334, "x": "そこで、探査機の側に、写真のぶれを"}, {"t": 406.76666666666665, "x": "打ち消すための工夫が組みこまれました。"}, {"t": 408.9, "x": "記録では「画像の動きの補正」と呼ばれています。"}, {"t": 412.71666666666664, "x": "撮影のあいだ、機体の向きをゆっくり動かして、カメラが"}, {"t": 416.8, "x": "目標を追いかけるようにする方法だったとされています。"}, {"t": 419.96666666666664, "x": "打ち上げから八年以上たってから、地球から送った指令で、"}, {"t": 423.9, "x": "撮り方そのものを作り変えたことになります。"}, {"t": 426.76666666666665, "x": "送る側にも、問題がありました。"}, {"t": 429.26666666666665, "x": "遠くなるほど、地球に届く電波は弱くなります。"}, {"t": 432.78333333333336, "x": "天王星からの電波を受けるために、地上では複数の"}, {"t": 436.4, "x": "アンテナをつなぎ、一つの大きな耳のように使いました。"}, {"t": 440.0, "x": "オーストラリアのパークスにある、直径六十四メートルの"}, {"t": 443.6333333333333, "x": "アンテナも、観測に加わっています。"}, {"t": 446.1333333333333, "x": "さらに、途中で傷ついても元に戻せる形で"}, {"t": 449.35, "x": "データを送る、新しい符号の方式が、"}, {"t": 452.25, "x": "このときはじめて使われました。"}, {"t": 454.4166666666667, "x": "記録によれば、そのおかげで、その場で送る"}, {"t": 457.6333333333333, "x": "画像のデータ量は、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
