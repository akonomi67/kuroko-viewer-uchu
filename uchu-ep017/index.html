<script>
const D={"name": "ep017", "file": "ep017", "dur": 1912.4, "segs": [], "subs": [{"t": 0.0, "x": "二〇二二年九月二十六日、世界時の二十三時十四分。"}, {"t": 4.7, "x": "地球から千百万キロメートルほど離れた"}, {"t": 7.25, "x": "場所から、一枚の画像が届きかけていました。"}, {"t": 10.4, "x": "写っていたのは、岩でした。"}, {"t": 12.466666666666667, "x": "大きさのそろわない岩が、灰色の"}, {"t": 14.916666666666666, "x": "地面いっぱいに転がっています。"}, {"t": 16.766666666666666, "x": "一つの画素が、地面の上の二・"}, {"t": 18.916666666666668, "x": "六センチメートルにあたる細かさです。"}, {"t": 21.45, "x": "ただ、その画像は、下の部分が欠けています。"}, {"t": 24.866666666666667, "x": "画像を送り終える前に、送っていた機体そのものが、"}, {"t": 28.333333333333332, "x": "写っていた地面にぶつかったからです。"}, {"t": 30.783333333333335, "x": "撮られたのは、衝突の〇・八五五秒前。"}, {"t": 34.2, "x": "送り主は、NASAの探査機DARTです。"}, {"t": 37.53333333333333, "x": "重さは約五百八十キログラム。"}, {"t": 39.86666666666667, "x": "一秒間に約六・一四キロメートルの速さで、"}, {"t": 43.06666666666667, "x": "小さな天体に正面からぶつかりました。"}, {"t": 45.9, "x": "ぶつけられた天体の名前は、ディモルフォス。"}, {"t": 48.78333333333333, "x": "直径百五十メートルほどの小さな小惑星で、"}, {"t": 51.9, "x": "もう一つの小惑星のまわりを回る、衛星です。"}, {"t": 55.75, "x": "この衝突で、ディモルフォスの動きは変わりました。"}, {"t": 59.11666666666667, "x": "親の小惑星のまわりを一周する時間が、"}, {"t": 61.88333333333333, "x": "三十分あまり短くなりました。"}, {"t": 64.38333333333334, "x": "人の手で、太陽系の天体の軌道が、測れるほど変わった。"}, {"t": 68.83333333333333, "x": "ヨーロッパ宇宙機関、ESAは、これを"}, {"t": 71.83333333333333, "x": "太陽系で初めての例だと書いています。"}, {"t": 74.33333333333333, "x": "その後の解析では、形も変わった"}, {"t": 76.86666666666666, "x": "可能性が高いとされています。"}, {"t": 78.75, "x": "それでも、衝突のあとのディモルフォスを、"}, {"t": 81.45, "x": "近くから撮った写真はありません。"}, {"t": 83.7, "x": "二〇二六年九月の終わりの時点で、一枚もありません。"}, {"t": 87.85, "x": "ぶつかった跡に、大きな穴が開いたのか。"}, {"t": 90.83333333333333, "x": "それとも、天体全体の形が崩れたのか。"}, {"t": 94.08333333333333, "x": "どちらなのかは、まだ誰も見ていません。"}, {"t": 96.76666666666667, "x": "この回では、ぶつけた瞬間から数えて、その前と"}, {"t": 100.56666666666666, "x": "後に残された記録を順に読んでいきます。"}, {"t": 103.08333333333333, "x": "話は、衝突の二十六年前に戻ります。"}, {"t": 106.48333333333333, "x": "一九九六年四月十一日。"}, {"t": 109.4, "x": "アメリカ、アリゾナ州のキットピーク国立天文台で、"}, {"t": 113.16666666666667, "x": "一つの小惑星が見つかりました。"}, {"t": 115.63333333333334, "x": "見つけたのは、スペースウォッチという"}, {"t": 117.85, "x": "観測計画の、ジョセフ・モンタニです。"}, {"t": 120.5, "x": "小惑星は、のちにディディモスと名付けられました。"}, {"t": 123.8, "x": "ディディモスの直径は、約七百八十メートル。"}, {"t": 127.2, "x": "二・二時間あまりで一回転する、回転の速い小惑星です。"}, {"t": 131.7, "x": "太陽のまわりを一周するのには、七百六十九日かかります。"}, {"t": 136.13333333333333, "x": "太陽にいちばん近づくと、地球の"}, {"t": 138.6, "x": "軌道のすぐ外側まで来ます。"}, {"t": 140.46666666666667, "x": "いちばん遠いときは、太陽から地球までの"}, {"t": 143.36666666666667, "x": "距離の二・二七倍のところまで離れます。"}, {"t": 146.11666666666667, "x": "見つかった時点では、ただの小惑星の一つでした。"}, {"t": 149.55, "x": "変わったのは、二〇〇三年です。"}, {"t": 151.85, "x": "この年、ディディモスは地球に近づきました。"}, {"t": 154.98333333333332, "x": "距離は、太陽から地球までの〇・〇四八倍。"}, {"t": 158.61666666666667, "x": "七百万キロメートルあまりのところです。"}, {"t": 161.18333333333334, "x": "近づいたディディモスに、アメリカの"}, {"t": 163.4, "x": "ゴールドストーンにあるアンテナから"}, {"t": 165.11666666666667, "x": "電波が当てられました。"}, {"t": 166.38333333333333, "x": "はね返ってきた電波の中に、ディディモスとは"}, {"t": 169.18333333333334, "x": "別の、小さな何かの反射が混じっていました。"}, {"t": 172.35, "x": "望遠鏡で明るさの変化を追うと、ときどき、"}, {"t": 175.58333333333334, "x": "ほんの少し暗くなる時間がありました。"}, {"t": 178.23333333333332, "x": "小さな天体が、大きいほうの前や後ろに回り込んで、"}, {"t": 182.05, "x": "光を隠していると考えると説明がつきます。"}, {"t": 185.33333333333334, "x": "同じ年の十一月二十三日には、プエルトリコの"}, {"t": 188.93333333333334, "x": "アレシボにあった大きなアンテナの"}, {"t": 190.71666666666667, "x": "レーダー画像でも、確かめられました。"}, {"t": 193.2, "x": "ディディモスには、衛星がありました。"}, {"t": 195.73333333333332, "x": "一周にかかる時間は、約十一・九時間です。"}, {"t": 199.21666666666667, "x": "のちに分かった大きさで比べると、親の"}, {"t": 202.01666666666668, "x": "ディディモスは直径約七百八十メートル。"}, {"t": 204.75, "x": "ESAは、山ほどの大きさ、と書いています。"}, {"t": 208.11666666666667, "x": "衛星のほうは、直径百五十メートルほど。"}, {"t": 211.33333333333334, "x": "ESAのたとえでは、エジプトの"}, {"t": 213.36666666666667, "x": "ギザの大ピラミッドくらいの大きさです。"}, {"t": 215.61666666666667, "x": "山のまわりを、ピラミッドほどの"}, {"t": 217.76666666666668, "x": "岩の集まりが、半日かけて回っている。"}, {"t": 220.6, "x": "それが、この二つ一組の姿でした。"}, {"t": 223.48333333333332, "x": "ディディモスという名前は、"}, {"t": 224.78333333333333, "x": "ギリシャ語で「双子」を意味します。"}, {"t": 227.91666666666666, "x": "二つで一組の小惑星であることに、ちなんだ名前です。"}, {"t": 231.85, "x": "この二つ一組という形が、のちに大事な意味を持ちます。"}, {"t": 235.9, "x": "小惑星を押して動かす実験をするとします。"}, {"t": 238.9, "x": "一つだけで太陽のまわりを回っている小惑星なら、"}, {"t": 242.1, "x": "どれだけ動いたかを測るのはとても難しい。"}, {"t": 245.18333333333334, "x": "太陽を一周するのに何年もかかる天体の、"}, {"t": 248.01666666666668, "x": "わずかなずれを見つけなければならないからです。"}, {"t": 251.0, "x": "ところが、衛星なら話が違います。"}, {"t": 253.88333333333333, "x": "衛星は、親のまわりを半日で一周しています。"}, {"t": 257.3833333333333, "x": "押されて一周の時間が少しでも変われば、"}, {"t": 259.9, "x": "その差は一周ごとに積み重なります。"}, {"t": 262.5833333333333, "x": "何日か見ていれば、地球からでも測れます。"}, {"t": 265.7, "x": "親の前を衛星が横切るたびに、"}, {"t": 267.85, "x": "二つを合わせた明るさがわずかに落ちる。"}, {"t": 270.6, "x": "その落ちる時刻がずれていけば、"}, {"t": 272.4, "x": "一周の時間が変わったと分かります。"}, {"t": 274.98333333333335, "x": "ESAによれば、知られている小惑星は約百三十万個。"}, {"t": 279.1333333333333, "x": "そのうち約十五パーセントが、"}, {"t": 280.96666666666664, "x": "こうした二つ一組の形をしています。"}, {"t": 283.8, "x": "もう一つ、選ばれた理由がありました。"}, {"t": 286.56666666666666, "x": "この二つは、地球にぶつかる心配がありません。"}, {"t": 289.8, "x": "NASAは、ディディモスとディモルフォスは"}, {"t": 291.9166666666667, "x": "地球への脅威ではない、と書いています。"}, {"t": 294.65, "x": "ただ、比較的近くを通るので、探査機が行きやすい。"}, {"t": 298.6666666666667, "x": "ぶつけても危なくない。"}, {"t": 300.1, "x": "けれど、行ける近さにある。"}, {"t": 302.15, "x": "測るための時計も付いている。"}, {"t": 304.0833333333333, "x": "実験の相手として、これ以上ない条件がそろっていました。"}, {"t": 308.01666666666665, "x": "衝突の六年前、二〇一六年。"}, {"t": 310.8833333333333, "x": "ヨーロッパでは、この二つ一組の小惑星へ、"}, {"t": 314.15, "x": "もう一機の探査機を送る計画が出されていました。"}, {"t": 317.53333333333336, "x": "名前はエイム。"}, {"t": 318.6, "x": "小惑星の衝撃を見るミッション、という意味の名前です。"}, {"t": 322.51666666666665, "x": "ESAの記録によれば、エイムは、"}, {"t": 324.78333333333336, "x": "その年の閣僚理事会に提出されました。"}, {"t": 327.8333333333333, "x": "打ち上げは二〇二〇年、到着は二〇二二年。"}, {"t": 331.46666666666664, "x": "この日付が必要だと、強く言われていました。"}, {"t": 334.73333333333335, "x": "理由は二つありました。"}, {"t": 336.31666666666666, "x": "一つ目は、ぶつける前の状態を、"}, {"t": 338.78333333333336, "x": "近くで測っておくためです。"}, {"t": 340.78333333333336, "x": "衛星の軌道や回り方が、ぶつける前にどうだったのか。"}, {"t": 344.6166666666667, "x": "それを細かく知っておかなければ、ぶつけたあとに"}, {"t": 347.7, "x": "どれだけ変わったのかを、正確には言えません。"}, {"t": 350.65, "x": "二つ目は、ぶつかる瞬間に、そばにいるためです。"}, {"t": 354.3666666666667, "x": "アメリカの探査機がぶつかり、"}, {"t": 356.03333333333336, "x": "ヨーロッパの探査機がそれを横から見る。"}, {"t": 358.7, "x": "二機がそろっていなければ、飛び散ったものの"}, {"t": 361.43333333333334, "x": "大きさや速さを、近くから記録することはできません。"}, {"t": 364.93333333333334, "x": "当時、この衛星には、まだ正式な名前がありませんでした。"}, {"t": 369.4166666666667, "x": "ESAの記録では、仮に「ディディムーン」と"}, {"t": 372.9, "x": "呼ばれています。"}, {"t": 373.81666666666666, "x": "ディディモスの月、という意味です。"}, {"t": 376.1666666666667, "x": "しかし、エイムは、この日付のまま"}, {"t": 378.96666666666664, "x": "飛ぶことはありませんでした。"}, {"t": 380.5, "x": "ESAの記録は、計画がその後、形を"}, {"t": 383.68333333333334, "x": "変えて受け継がれたことを書いています。"}, {"t": 385.76666666666665, "x": "受け継いだ探査機はヘラと名付けられました。"}, {"t": 388.3, "x": "そしてヘラが着くのは、二〇二二年ではなく、"}, {"t": 391.5, "x": "二〇二六年の後半になりました。"}, {"t": 394.3, "x": "ぶつける前にそばにいて、ぶつかる瞬間も見る。"}, {"t": 397.55, "x": "二機がそろうその形は、実現しませんでした。"}, {"t": 400.8333333333333, "x": "一つ目の理由については、別の方法で補われました。"}, {"t": 404.76666666666665, "x": "二〇一七年の二月から五月にかけて、"}, {"t": 407.4, "x": "ディディモスは再び地球に近づきました。"}, {"t": 410.2, "x": "このとき、地上の望遠鏡で観測が集められました。"}, {"t": 414.0, "x": "ディディモスの自転の軸の向きには、"}, {"t": 416.0, "x": "それまで二通りの答えが残っていました。"}, {"t": 418.9, "x": "この観測で、それが一つに絞られました。"}, {"t": 422.0, "x": "二〇一九年と二〇二一年にも、"}, {"t": 424.53333333333336, "x": "追加の観測が行われています。"}, {"t": 426.98333333333335, "x": "ぶつける前の状態は、遠くからでも、"}, {"t": 429.5833333333333, "x": "ある程度まで測れるようになりました。"}, {"t": 432.15, "x": "二つ目の理由、ぶつかる瞬間をそばで見ることは、"}, {"t": 435.48333333333335, "x": "ヨーロッパの探査機にはできなくなりました。"}, {"t": 438.25, "x": "その役目は、別の小さな機体に回ります。"}, {"t": 441.43333333333334, "x": "イタリアで作られた、小さな衛星です。"}, {"t": 444.31666666666666, "x": "こうして、ぶつける機体と、横で見る小さな機体の"}, {"t": 448.06666666666666, "x": "二機が、先に出発することになりました。"}, {"t": 450.93333333333334, "x": "後から着いて跡を調べる機体は、そのあとになります。"}, {"t": 454.5833333333333, "x": "ぶつける日と、跡を調べる日のあいだには、"}, {"t": 457.4, "x": "四年あまりの空白ができることになりました。"}, {"t": 460.4166666666667, "x": "衝突の十か月前。"}, {"t": 462.06666666666666, "x": "二〇二一年十一月二十四日、"}, {"t": 464.6333333333333, "x": "アメリカ東部の時刻で午前一時二十一分。"}, {"t": 467.9166666666667, "x": "カリフォルニア州のヴァンデンバーグ宇宙軍基地から、"}, {"t": 470.68333333333334, "x": "スペースXのファルコン九ロケットが打ち上げられました。"}, {"t": 474.26666666666665, "x": "積まれていたのが、DARTです。"}, {"t": 477.03333333333336, "x": "DARTという名前は、二重小惑星の進路を"}, {"t": 480.75, "x": "変える試験、という英語の頭文字から来ています。"}, {"t": 484.15, "x": "英語のダートには、投げ矢という意味もあります。"}, {"t": 487.21666666666664, "x": "この探査機は、何かを持ち帰るためのものではありません。"}, {"t": 491.0, "x": "着陸もしません。"}, {"t": 492.31666666666666, "x": "周りを回ることもしません。"}, {"t": 494.15, "x": "目的地に着いたら、そこで終わる。"}, {"t": 496.6666666666667, "x": "はじめからそう作られた探査機でした。"}, {"t": 499.0, "x": "打ち上げから二時間ほどで、"}, {"t": 500.6166666666667, "x": "探査機は太陽電池のパネルを広げました。"}, {"t": 503.6666666666667, "x": "長さ約八・五メートルのパネルが二枚、"}, {"t": 506.18333333333334, "x": "巻き物をほどくように伸びていく形のものです。"}, {"t": 509.3666666666667, "x": "目的地までの道のりは、十か月。"}, {"t": 512.2, "x": "そのあいだ、探査機は太陽のまわりを回りながら、"}, {"t": 515.5166666666667, "x": "少しずつ小惑星に追いついていきます。"}, {"t": 518.3166666666667, "x": "ぶつかるとき、二つの小惑星は、地球から"}, {"t": 521.7333333333333, "x": "約千百万キロメートルの場所にいる予定でした。"}, {"t": 524.6666666666666, "x": "地球と月の距離の、三十倍ほどです。"}, {"t": 527.65, "x": "積まれたカメラは、一台だけでした。"}, {"t": 530.25, "x": "名前はドラコ。"}, {"t": 531.3666666666667, "x": "行き先を見定めるためのカメラで、同時に、"}, {"t": 534.3333333333334, "x": "最後の画像を撮るカメラでもあります。"}, {"t": 536.9, "x": "このカメラがディディモスを"}, {"t": 538.2, "x": "初めて捉えたのは、衝突の六十一日前でした。"}, {"t": 541.9, "x": "それも一枚の画像では写らず、何枚もの画像を"}, {"t": 545.4, "x": "重ね合わせて、ようやく見つかる暗さでした。"}, {"t": 548.3666666666667, "x": "そのとき、衛星のディモルフォスは、まだ見えていません。"}, {"t": 552.3166666666667, "x": "親のディディモスと離れて見えるほどの"}, {"t": 554.3666666666667, "x": "近さではなかったからです。"}, {"t": 555.9333333333333, "x": "ぶつける相手は、まだ一度も、姿を見せていませんでした。"}, {"t": 560.15, "x": "直径百五十メートルほどの天体です。"}, {"t": 562.8, "x": "千百万キロメートル離れた地球からは、"}, {"t": 565.3833333333333, "x": "親と分けて見ることができません。"}, {"t": 567.65, "x": "レーダーの反射と、明るさの変化から、"}, {"t": 570.3666666666667, "x": "そこにあることは分かっていました。"}, {"t": 572.6166666666667, "x": "形は分かりませんでした。"}, {"t": 574.3666666666667, "x": "探査機には、もう一つの荷物がありました。"}, {"t": 577.3166666666667, "x": "イタリア宇宙機関の小さな衛星、リシアキューブです。"}, {"t": 581.05, "x": "作ったのは、イタリアのアルゴテック社。"}, {"t": 583.6666666666666, "x": "六Uと呼ばれる規格の、小さな機体です。"}, {"t": 586.75, "x": "カメラを二台積んでいます。"}, {"t": 588.4333333333333, "x": "一台は視野が狭く、細かいところを写す白黒のカメラ。"}, {"t": 592.5, "x": "もう一台は視野が広い、カラーのカメラです。"}, {"t": 595.6166666666667, "x": "イタリア宇宙機関は、この衛星を、"}, {"t": 598.2166666666667, "x": "すべてイタリアのチームで作って動かす"}, {"t": 600.75, "x": "初めての深宇宙ミッションだとしています。"}, {"t": 603.1666666666666, "x": "リシアキューブの役目は、見届けることでした。"}, {"t": 606.3, "x": "DARTから離れて、少し後ろを飛ぶ。"}, {"t": 609.6, "x": "DARTがぶつかった直後に、その場所の"}, {"t": 612.7333333333333, "x": "近くを通り過ぎながら、何が起きたのかを撮る。"}, {"t": 615.9, "x": "エイムが担うはずだった、ぶつかる瞬間をそばで見る仕事。"}, {"t": 619.7666666666667, "x": "その一部を、この小さな箱が引き受けました。"}, {"t": 622.9166666666666, "x": "NASAによれば、リシアキューブがDARTから"}, {"t": 626.1, "x": "切り離されたのは、衝突のおよそ二週間前です。"}, {"t": 629.5833333333334, "x": "そこから先、二機は別々に飛びました。"}, {"t": 632.6166666666667, "x": "一機は、ぶつかるために。"}, {"t": 634.55, "x": "もう一機は、それを見るために。"}, {"t": 636.8, "x": "二〇二二年九月二十六日、世界時の十九時九分二十四秒。"}, {"t": 641.8666666666667, "x": "衝突の四時間五分前、探査機の操縦は、"}, {"t": 645.1166666666667, "x": "地上から探査機自身に移りました。"}, {"t": 647.6666666666666, "x": "ここから先、地上の管制室は、探査機に指示を出しません。"}, {"t": 652.2166666666667, "x": "探査機に積まれた自律航法の仕組みが、自分で"}, {"t": 655.4666666666667, "x": "カメラの画像を見て、自分で進む向きを直していきます。"}, {"t": 659.2833333333333, "x": "地上から指示を出していたのでは、間に合わないからです。"}, {"t": 662.8833333333333, "x": "電波が届くのに時間がかかり、そのあいだにも探査機は、"}, {"t": 666.5666666666667, "x": "一秒間に六キロメートル以上進んでいます。"}, {"t": 669.7333333333333, "x": "地上にできることは、送られてくる"}, {"t": 672.1333333333333, "x": "画像を見ていることだけでした。"}, {"t": 673.8666666666667, "x": "画像は、撮られるたびに地球へ送られ、"}, {"t": 676.5833333333334, "x": "そのまま一般にも公開されていきました。"}, {"t": 679.4166666666666, "x": "はじめ、画面に写っているのは、光の点でした。"}, {"t": 683.1166666666667, "x": "点は少しずつ大きくなります。"}, {"t": 685.1666666666666, "x": "衝突の七十三分前。"}, {"t": 687.1, "x": "自律航法の仕組みが、ディモルフォスを"}, {"t": 689.7333333333333, "x": "初めて見つけました。"}, {"t": 691.0166666666667, "x": "親のディディモスの横に、もう一つ、"}, {"t": 693.4833333333333, "x": "小さな点が分かれて見えたのです。"}, {"t": 695.8833333333333, "x": "衝突の五十分前。"}, {"t": 697.5333333333333, "x": "探査機は、狙いをディディモスから"}, {"t": 699.75, "x": "ディモルフォスへ移しました。"}, {"t": 701.2333333333333, "x": "大きいほうの小惑星を目印に"}, {"t": 703.3333333333334, "x": "進んできた探査機が、最後の五十分で、"}, {"t": 706.3, "x": "小さいほうへ向きを変えたことになります。"}, {"t": 708.9833333333333, "x": "形が見えてきました。"}, {"t": 710.5166666666667, "x": "少しつぶれた、丸い形です。"}, {"t": 712.95, "x": "のちの論文は、縦横が百七十七メートルと"}, {"t": 716.3, "x": "百七十四メートル、厚みが百十六メートルの、"}, {"t": 719.9, "x": "平たい球のような形だったと書いています。"}, {"t": 722.7833333333333, "x": "同じ体積の球にすると、直径は約百五十一メートルです。"}, {"t": 727.2666666666667, "x": "表面は、岩で覆われていました。"}, {"t": 729.8666666666667, "x": "大小の岩が、ぎっしりと積み重なっています。"}, {"t": 733.0833333333334, "x": "はっきりとした衝突の穴、クレーターは、"}, {"t": 735.8166666666667, "x": "見当たりませんでした。"}, {"t": 737.45, "x": "論文は、ディモルフォスが一つの固い"}, {"t": 739.9666666666667, "x": "岩ではなく、岩やがれきが寄り集まってできた"}, {"t": 743.0, "x": "天体だろう、と書いています。"}, {"t": 745.0666666666667, "x": "画面いっぱいに、岩が広がっていきます。"}, {"t": 747.95, "x": "最後の一枚の全体が写った画像は、"}, {"t": 750.4333333333333, "x": "衝突の一・八一八秒前に撮られました。"}, {"t": 753.75, "x": "一つの画素が、地面の上の五・"}, {"t": 755.95, "x": "五センチメートルにあたります。"}, {"t": 757.9333333333333, "x": "次の画像は、衝突の〇・八五五秒前。"}, {"t": 761.5333333333333, "x": "序章で読んだ、下が欠けた一枚です。"}, {"t": 764.3, "x": "そして、世界時の二十三時十四分二十四秒。"}, {"t": 768.05, "x": "DARTは、ディモルフォスにぶつかりました。"}, {"t": 771.3, "x": "そのときの速さは、一秒間に六・一四四九キロメートル。"}, {"t": 775.7333333333333, "x": "重さは五百七十九・四キログラム。"}, {"t": 778.4833333333333, "x": "これが持っていた運動のエネルギーは、"}, {"t": 780.5666666666667, "x": "十・九四ギガジュールと計算されています。"}, {"t": 783.65, "x": "当たった場所は、ディモルフォスの"}, {"t": 785.6, "x": "中心から二十五メートルのところでした。"}, {"t": 788.05, "x": "そこには、二つの大きな岩がありました。"}, {"t": 790.9166666666666, "x": "長さ六・五メートルと六・一メートル。"}, {"t": 793.5666666666667, "x": "DARTの本体は、その二つの"}, {"t": 796.35, "x": "岩のあいだに飛び込んでいます。"}, {"t": 798.1, "x": "そして、広げ 3333333, "x": "リシアキューブの画像には、"}, {"t": 920.5666666666667, "x": "噴き出したものが写っていました。"}, {"t": 922.7333333333333, "x": "一方で、ぶつかった場所の地面そのものが"}, {"t": 925.5666666666667, "x": "どうなったのかは、この記録からは分かっていません。"}, {"t": 928.7166666666667, "x": "地球からも、見ている望遠鏡がありました。"}, {"t": 931.85, "x": "世界各地の市民の天文家がつなぐ望遠鏡の"}, {"t": 934.9166666666666, "x": "網が、この二つの小惑星を狙っていました。"}, {"t": 938.1333333333333, "x": "衝突のあと、二つを合わせた明るさは、急に上がりました。"}, {"t": 942.5333333333333, "x": "明るさの等級で言えば、二・二九等ぶんです。"}, {"t": 946.1666666666666, "x": "イタリアのチームの論文は、この明るさの"}, {"t": 949.0166666666667, "x": "上がり方を、約八・三倍と書いています。"}, {"t": 952.0166666666667, "x": "市民の望遠鏡の網で見た研究チームは、明るさの変化から、"}, {"t": 956.3833333333333, "x": "噴き出したちりの重さも見積もっています。"}, {"t": 959.0333333333333, "x": "少なくとも、ディモルフォスの重さの"}, {"t": 961.35, "x": "〇・三パーセントから〇・五パーセント。"}, {"t": 963.9666666666667, "x": "ちりの粒の大きさをどう考えるかで、この幅が出ます。"}, {"t": 967.75, "x": "明るくなったのは、噴き出したちりが、"}, {"t": 970.15, "x": "太陽の光を反射していたためです。"}, {"t": 972.7666666666667, "x": "そのちりが散っていくにつれ、"}, {"t": 974.4166666666666, "x": "明るさは少しずつ戻っていきました。"}, {"t": 977.0833333333334, "x": "元の明るさに戻るまでには、約二十三・七日かかりました。"}, {"t": 981.4166666666666, "x": "ハッブル宇宙望遠鏡も、衝突の"}, {"t": 984.0, "x": "あとのディモルフォスを見ていました。"}, {"t": 985.85, "x": "ESAによれば、ハッブルの画像には、ディモルフォスから"}, {"t": 989.4333333333333, "x": "離れていく三十七個の岩が写っていました。"}, {"t": 992.1833333333333, "x": "大きさは、一メートルから六・七メートル。"}, {"t": 995.2666666666667, "x": "時速約一キロメートルという、人が歩くよりも"}, {"t": 998.4666666666667, "x": "遅い速さで、ゆっくりと離れていきます。"}, {"t": 1001.15, "x": "三十七個を合わせた重さは、"}, {"t": 1003.1, "x": "ディモルフォスの約〇・一パーセント。"}, {"t": 1005.8, "x": "チームは、表面にあった岩の約二パーセントが、"}, {"t": 1009.0166666666667, "x": "衝突で振り落とされたと見積もっています。"}, {"t": 1011.8333333333334, "x": "岩は、遠くから見れば点です。"}, {"t": 1014.2166666666667, "x": "ハッブルに写った三十七個も、"}, {"t": 1016.15, "x": "一つ一つの形は分かりません。"}, {"t": 1018.5, "x": "そこにあって、離れていく。"}, {"t": 1020.65, "x": "分かるのは、そこまでです。"}, {"t": 1022.65, "x": "三百二十秒で、近くから見ていた機体はいなくなりました。"}, {"t": 1026.7333333333333, "x": "残ったのは、地球から見える、明るさの変化だけでした。"}, {"t": 1030.9333333333334, "x": "衝突の前、ディモルフォスは、ディディモスの"}, {"t": 1033.9666666666667, "x": "まわりを、十一時間五十五分で一周していました。"}, {"t": 1037.55, "x": "この時間が変わったかどうかを、地球から測る。"}, {"t": 1040.7333333333333, "x": "それが、この実験のいちばんの目的でした。"}, {"t": 1043.8166666666666, "x": "使われたのは、第1章で読んだのと同じ方法です。"}, {"t": 1047.5, "x": "二つの小惑星は、地球から見ると一つの光の点です。"}, {"t": 1051.5666666666666, "x": "けれども、ディモルフォスがディディモスの"}, {"t": 1053.7833333333333, "x": "前や後ろを通るたびに、全体の明るさがわずかに落ちます。"}, {"t": 1057.8166666666666, "x": "その落ちる時刻を何回も測れば、一周の時間が分かります。"}, {"t": 1062.0166666666667, "x": "チリにあるラスカンパナス天文台とラ・シヤ天文台の"}, {"t": 1065.0833333333333, "x": "望遠鏡、南アフリカとチリにある望遠鏡の網。"}, {"t": 1068.7833333333333, "x": "さらに、アメリカのゴールドストーンとグリーンバンクの"}, {"t": 1071.9833333333333, "x": "アンテナから、レーダーも当てられました。"}, {"t": 1074.4333333333334, "x": "NASAは、あらかじめ合格の線を決めていました。"}, {"t": 1077.7666666666667, "x": "一周の時間が、七十三秒以上変われば成功。"}, {"t": 1081.5166666666667, "x": "事前の見込みでは、変わるのは"}, {"t": 1083.65, "x": "およそ十分とされていました。"}, {"t": 1085.4166666666667, "x": "見込みには、幅がありました。"}, {"t": 1087.5666666666666, "x": "市民の望遠鏡の網で観測した研究チームは、"}, {"t": 1090.7333333333333, "x": "ふつうに考えられる場合で、約八・八分から"}, {"t": 1094.3333333333333, "x": "十七分の短縮という予測があったと書いています。"}, {"t": 1097.35, "x": "別の論文は、約七分という見込みを挙げています。"}, {"t": 1101.0333333333333, "x": "中身がどうなっているのか分からない"}, {"t": 1103.0, "x": "天体に、初めてぶつけるのです。"}, {"t": 1105.4666666666667, "x": "どれだけ動くかは、ぶつけてみるまで分かりませんでした。"}, {"t": 1109.0666666666666, "x": "ぶつけるのは五百八十キログラムほど。"}, {"t": 1111.55, "x": "相手は、同じ体積の球で直径百五十メートルの"}, {"t": 1115.2833333333333, "x": "岩の集まりです。"}, {"t": 1116.4, "x": "十分縮めば、それで十分な結果でした。"}, {"t": 1119.5, "x": "衝突から十五日後の、二〇二二年十月十一日。"}, {"t": 1123.9, "x": "NASAは、測った結果を発表しました。"}, {"t": 1126.6666666666667, "x": "十一時間五十五分だった一周の時間は、"}, {"t": 1129.4833333333333, "x": "十一時間二十三分になっていました。"}, {"t": 1132.3, "x": "三十二分の短縮です。"}, {"t": 1134.1333333333334, "x": "誤差は、前後二分ほど。"}, {"t": 1136.1666666666667, "x": "合格の線だった七十三秒の、二十五倍を超えていました。"}, {"t": 1140.4666666666667, "x": "見込みの約十分と比べても、三倍ほどです。"}, {"t": 1143.8666666666666, "x": "なぜ、見込みよりずっと大きく変わったのか。"}, {"t": 1146.8166666666666, "x": "翌年、二〇二三年に、科学誌ネイチャーに"}, {"t": 1150.4666666666667, "x": "いくつもの論文がそろって出ました。"}, {"t": 1152.4666666666667, "x": "周期の変化は、あらためて三十三分と計算されました。"}, {"t": 1156.5166666666667, "x": "誤差は前後一分です。"}, {"t": 1158.1, "x": "別の論文は、衝突した瞬間に、ディモルフォスの"}, {"t": 1161.8666666666666, "x": "公転の向きの速さが、一秒間に二・"}, {"t": 1164.5833333333333, "x": "七〇ミリメートル遅くなったと計算しています。"}, {"t": 1167.7166666666667, "x": "一秒に三ミリメートルに満たない変化です。"}, {"t": 1170.5333333333333, "x": "その小さな差が、一周するごとに積み重なって、"}, {"t": 1173.9, "x": "三十分あまりの差になりました。"}, {"t": 1176.2833333333333, "x": "そして、見込みより大きかった理由として、"}, {"t": 1179.1833333333334, "x": "論文が挙げたのが、噴き出したものです。"}, {"t": 1182.1666666666667, "x": "探査機がぶつかると、ディモルフォスの"}, {"t": 1184.5333333333333, "x": "表面から、岩やちりが大量に噴き出しました。"}, {"t": 1187.7833333333333, "x": "噴き出したものは、ぶつかってきた"}, {"t": 1189.8333333333333, "x": "向きとは逆の方へ飛んでいきます。"}, {"t": 1191.8666666666666, "x": "飛んでいったものに押し返されるようにして、"}, {"t": 1194.25, "x": "ディモルフォスはさらに押されました。"}, {"t": 1196.5166666666667, "x": "ボートの上から重い荷物を投げると、"}, {"t": 1198.7833333333333, "x": "ボートは反対に動きます。"}, {"t": 1200.8166666666666, "x": "それと同じ理屈です。"}, {"t": 1202.3666666666666, "x": "論文は、この押す力の増え方を、探査機がそのまま"}, {"t": 1206.3, "x": "持ってきた力の二・二倍から四・九倍と見積もっています。"}, {"t": 1210.0833333333333, "x": "幅があるのは、ディモルフォスの"}, {"t": 1212.0833333333333, "x": "重さがまだ分かっていないからです。"}, {"t": 1214.0166666666667, "x": "ディモルフォスの重さは、体積と"}, {"t": 1216.1833333333334, "x": "密度から推し量るしかありません。"}, {"t": 1218.15, "x": "体積は、DARTの画像から計算できます。"}, {"t": 1221.9, "x": "けれど、中身がどれだけ詰まっているかは、"}, {"t": 1224.6333333333334, "x": "外からは分かりません。"}, {"t": 1226.3333333333333, "x": "中身がすかすかなら軽く、ぎっしりなら重い。"}, {"t": 1229.5333333333333, "x": "重さが分からなければ、どれだけの力で"}, {"t": 1232.3, "x": "押されたのかも、一つの数字には決まりません。"}, {"t": 1235.3333333333333, "x": "一周の時間が縮んだことは、地球から測れました。"}, {"t": 1238.9666666666667, "x": "けれど、それがどれだけの力によるものかは、"}, {"t": 1241.9166666666667, "x": "そばに行って重さを測らないと、決まらないのです。"}, {"t": 1245.5666666666666, "x": "その数字を測りに行く機体は、このとき、"}, {"t": 1248.5, "x": "まだ地球を出発していませんでした。"}, {"t": 1251.1166666666666, "x": "衝突から一年五か月後の二〇二四年二月。"}, {"t": 1254.5166666666667, "x": "ESAは、ある研究の結果を紹介しました。"}, {"t": 1257.7333333333333, "x": "それまで、多くの人が思い描いていたのは、"}, {"t": 1260.7666666666667, "x": "ぶつかった場所に開いた穴でした。"}, {"t": 1263.0833333333333, "x": "大きなクレーターが一つ、ディモルフォスの"}, {"t": 1265.7666666666667, "x": "表面に残っている。"}, {"t": 1267.0333333333333, "x": "のちに着く探査機は、その穴の大きさを測ればいい。"}, {"t": 1270.5666666666666, "x": "ところが、その研究は、別の答えを出しました。"}, {"t": 1274.2666666666667, "x": "研究チームは、衝突のあとの二時間を、"}, {"t": 1277.2166666666667, "x": "計算機の中で再現しました。"}, {"t": 1279.5833333333333, "x": "条件を変えながら、全部で約二百五十回。"}, {"t": 1282.9666666666667, "x": "一回の計算に、約一週間半かかったとされています。"}, {"t": 1286.9333333333334, "x": "その結果、ESAは次のように書いています。"}, {"t": 1290.0833333333333, "x": "クレーターは見つからないだろう。"}, {"t": 1291.9, "x": "DARTの衝突は、天体全体を作り変えた可能性が高い。"}, {"t": 1296.7166666666667, "x": "計算では、ディモルフォスの"}, {"t": 1298.55, "x": "重さの約一パーセントが宇宙へ飛ばされ、"}, {"t": 1301.05, "x": "約八パーセントが天体の中で位置を変えました。"}, {"t": 1304.35, "x": "岩どうしの結びつきが弱い、がれきの集まり。"}, {"t": 1307.65, "x": "そこに、秒速六キロメートルの"}, {"t": 1309.9, "x": "機体が飛び込めば、穴を開けるよりも、"}, {"t": 1312.5, "x": "全体が揺さぶられて形そのものが崩れる。"}, {"t": 1315.4833333333333, "x": "そういう答えでした。"}, {"t": 1316.8666666666666, "x": "その後、別の研究も出ています。"}, {"t": 1319.4333333333334, "x": "NASAのジェット推進研究所の、"}, {"t": 1321.4, "x": "シャンタヌ・ナイドゥが率いた研究です。"}, {"t": 1323.9, "x": "衝突の前、ディモルフォスは、ディディモスから"}, {"t": 1326.9833333333333, "x": "約千百八十九メートル離れた、円い軌道を回っていました。"}, {"t": 1331.3666666666666, "x": "研究によれば、衝突のあと、その平均の"}, {"t": 1334.8166666666666, "x": "距離は約千百五十二メートルになりました。"}, {"t": 1337.55, "x": "三十七メートルほど、親に近づいたことになります。"}, {"t": 1341.2666666666667, "x": "一周の時間の短縮は、三十三分十五秒と計算されました。"}, {"t": 1345.8666666666666, "x": "形についても書かれています。"}, {"t": 1347.8333333333333, "x": "ディモルフォスは、比較的対称な形から、三つの"}, {"t": 1351.4666666666667, "x": "軸の長さがそろわない、細長い楕円の形に変わった。"}, {"t": 1355.25, "x": "NASAはこれを、細長いスイカのような"}, {"t": 1357.8166666666666, "x": "形、とたとえています。"}, {"t": 1359.7333333333333, "x": "ぶつかる前の形は、DARTの最後の画像で分かっています。"}, {"t": 1364.2666666666667, "x": "けれど、ぶつかったあとの形を、"}, {"t": 1366.5, "x": "近くで実際に撮 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
