": 674}, {"t": 1958.6, "i": 675}, {"t": 1962.7833333333333, "i": 676}, {"t": 1965.9166666666667, "i": 677}, {"t": 1968.7166666666667, "i": 678}, {"t": 1970.4666666666667, "i": 679}, {"t": 1973.3166666666666, "i": 680}, {"t": 1976.7666666666667, "i": 681}, {"t": 1980.2833333333333, "i": 682}, {"t": 1984.1166666666666, "i": 683}, {"t": 1986.5833333333333, "i": 684}, {"t": 1989.4833333333333, "i": 685}, {"t": 1992.55, "i": 686}, {"t": 1995.15, "i": 687}, {"t": 1997.8333333333333, "i": 688}, {"t": 2000.7, "i": 689}, {"t": 2002.8, "i": 690}, {"t": 2005.55, "i": 691}, {"t": 2008.4333333333334, "i": 692}, {"t": 2010.4166666666667, "i": 693}, {"t": 2012.9666666666667, "i": 694}, {"t": 2015.75, "i": 695}, {"t": 2017.7166666666667, "i": 695}], "subs": [{"t": 0.0, "x": "宇宙の奥、百億光年を超える先の"}, {"t": 2.9166666666666665, "x": "銀河まで写してきた望遠鏡があります。"}, {"t": 5.35, "x": "ハッブル宇宙望遠鏡です。"}, {"t": 5.35, "x": "ハッブル宇宙望遠鏡█"}, {"t": 7.683333333333334, "x": "その望遠鏡が、一度も向けられたことのない"}, {"t": 10.766666666666667, "x": "惑星があります。"}, {"t": 11.85, "x": "太陽にいちばん近い惑星、水星です。"}, {"t": 14.383333333333333, "x": "水星█"}, {"t": 15.433333333333334, "x": "理由は単純です。"}, {"t": 16.816666666666666, "x": "水星は、地球から見るといつも太陽のすぐそばにあります。"}, {"t": 20.916666666666668, "x": "望遠鏡を水星に向けることは、"}, {"t": 23.0, "x": "太陽のすぐ隣に向けることになります。"}, {"t": 25.883333333333333, "x": "ヨーロッパ宇宙機関、ESAは、光学系を"}, {"t": 29.316666666666666, "x": "傷めるおそれがあるため、ハッブルは"}, {"t": 31.583333333333332, "x": "水星を見たことがない、と説明しています。"}, {"t": 34.583333333333336, "x": "地上からも、水星が見えるのは、日の出の少し前と、"}, {"t": 38.6, "x": "日が沈んだ少しあとの、短い時間だけです。"}, {"t": 42.13333333333333, "x": "では、近くまで行って見ればいい。"}, {"t": 44.43333333333333, "x": "そう考えるのは自然です。"}, {"t": 46.28333333333333, "x": "水星は、地球からの距離で言えば、"}, {"t": 48.833333333333336, "x": "木星よりもずっと近い惑星です。"}, {"t": 51.483333333333334, "x": "ところが、人類がこれまでに水星まで"}, {"t": 54.21666666666667, "x": "送り届けた探査の計画は、三つしかありません。"}, {"t": 57.56666666666667, "x": "一九七〇年代のマリナー十号。"}, {"t": 60.333333333333336, "x": "二〇〇〇年代のメッセンジャー。"}, {"t": 62.06666666666667, "x": "そして、いまちょうど到着しようとしている、"}, {"t": 65.01666666666667, "x": "ベピコロンボです。"}, {"t": 66.43333333333334, "x": "機体の数で数えても、四機です。"}, {"t": 69.03333333333333, "x": "木星よりずっと近い水星に、"}, {"t": 71.08333333333333, "x": "なぜこれだけしか行っていないのか。"}, {"t": 73.36666666666666, "x": "答えは、距離ではありません。"}, {"t": 75.46666666666667, "x": "速さです。"}, {"t": 76.35, "x": "水星に行くことは、難しくありません。"}, {"t": 79.23333333333333, "x": "難しいのは、水星で止まることです。"}, {"t": 82.05, "x": "ESAの資料には、水星の周りを回る軌道に"}, {"t": 85.23333333333333, "x": "入るまでに必要な速度の変化が、およそ秒速十八・"}, {"t": 89.01666666666667, "x": "五キロメートルと書かれています。"}, {"t": 90.91666666666667, "x": "遠く離れた冥王星に向かう場合は、"}, {"t": 93.25, "x": "およそ秒速十七キロメートル。"}, {"t": 95.63333333333334, "x": "いちばん近い惑星のほうが、準惑星の"}, {"t": 98.53333333333333, "x": "冥王星よりも、多くの燃料を必要とします。"}, {"t": 101.98333333333333, "x": "この回では、その三つの計画の"}, {"t": 104.38333333333334, "x": "記録を、順に読んでいきます。"}, {"t": 106.53333333333333, "x": "水星の近くまで行くのに、なぜ何年もかかるのか。"}, {"t": 110.16666666666667, "x": "そして、たどり着いた機体が、その後どうなったのかを。"}, {"t": 114.03333333333333, "x": "まず、水星がどこにあるのかを、数字で確かめておきます。"}, {"t": 118.35, "x": "NASAの惑星データによると、水星は、太陽から"}, {"t": 122.06666666666666, "x": "およそ五千七百九十万キロメートルのところを"}, {"t": 124.98333333333333, "x": "回っています。"}, {"t": 125.83333333333333, "x": "地球と太陽の距離のおよそ四割です。"}, {"t": 128.38333333333333, "x": "一周にかかるのは、およそ八十八日。"}, {"t": 131.48333333333332, "x": "地球の一年のあいだに、水星は"}, {"t": 133.93333333333334, "x": "太陽の周りを四回ほど回ります。"}, {"t": 136.26666666666668, "x": "ESAは、水星と地球の距離を、"}, {"t": 138.68333333333334, "x": "およそ七千七百万キロメートルと説明しています。"}, {"t": 142.35, "x": "木星までは、およそ六億三千万キロメートル。"}, {"t": 145.85, "x": "距離だけを比べれば、水星のほうが"}, {"t": 148.36666666666667, "x": "八倍以上も近いことになります。"}, {"t": 150.51666666666668, "x": "それでも、ESAは、水星のほうが行くのが"}, {"t": 153.73333333333332, "x": "難しい、と書いています。"}, {"t": 155.68333333333334, "x": "理由を、ESAは坂道にたとえています。"}, {"t": 158.65, "x": "太陽の周りの空間は、太陽を底にした、深い"}, {"t": 162.48333333333332, "x": "すり鉢のような形をしていると考えることができます。"}, {"t": 165.8, "x": "地球は、そのすり鉢の途中を、ぐるぐると回っています。"}, {"t": 169.95, "x": "水星は、それよりずっと底に近いところを回っています。"}, {"t": 173.8, "x": "地球から水星へ向かうということは、このすり鉢の"}, {"t": 177.18333333333334, "x": "斜面を、底に向かって下りていくことです。"}, {"t": 180.05, "x": "下り坂を走る車が、ブレーキをかけなければ"}, {"t": 183.23333333333332, "x": "どんどん速くなるのと同じように、探査機も、"}, {"t": 186.2, "x": "太陽に近づくほど速くなっていきます。"}, {"t": 188.91666666666666, "x": "水星そのものも、速く動いています。"}, {"t": 191.76666666666668, "x": "水星が太陽の周りを回る速さは、"}, {"t": 194.25, "x": "平均で秒速およそ四十七キロメートル。"}, {"t": 197.36666666666667, "x": "地球の秒速およそ三十キロメートルと"}, {"t": 199.85, "x": "比べて、一・六倍ほどの速さです。"}, {"t": 202.68333333333334, "x": "ここで、水星へ行く探査機に起きることを考えます。"}, {"t": 206.35, "x": "ただ水星の近くを通り過ぎるだけなら、"}, {"t": 208.83333333333334, "x": "話はそれほど難しくありません。"}, {"t": 211.35, "x": "坂を下りていって、水星の横を駆け抜ければいいからです。"}, {"t": 215.3, "x": "けれども、水星の周りを回る軌道に"}, {"t": 218.0, "x": "入ろうとすると、話が変わります。"}, {"t": 220.55, "x": "坂を下って速くなりすぎた探査機は、水星の"}, {"t": 223.85, "x": "横を、ものすごい速さで通り過ぎてしまいます。"}, {"t": 227.08333333333334, "x": "水星の重力は、地球の重力の四割ほどしかありません。"}, {"t": 231.25, "x": "その弱い重力では、速すぎる探査機を"}, {"t": 234.15, "x": "つかまえておくことができません。"}, {"t": 235.93333333333334, "x": "つかまえてもらうためには、探査機のほうで"}, {"t": 238.61666666666667, "x": "速度を落とすしかありません。"}, {"t": 240.25, "x": "坂を下りながら、ずっとブレーキをかけ続ける"}, {"t": 243.25, "x": "必要があります。"}, {"t": 244.31666666666666, "x": "宇宙でブレーキをかけるには、進む向きと"}, {"t": 247.06666666666666, "x": "反対に燃料を噴くしかありません。"}, {"t": 249.18333333333334, "x": "ESAの説明では、そのブレーキを"}, {"t": 251.5, "x": "すべて燃料だけでまかなおうとすると、"}, {"t": 253.73333333333332, "x": "積まなければならない燃料が多くなりすぎて、"}, {"t": 256.75, "x": "機体が重くなり、打ち上げられなくなります。"}, {"t": 260.1, "x": "これが、冒頭の数字の意味です。"}, {"t": 262.6, "x": "水星の周りを回る軌道に入るために必要な速度の"}, {"t": 266.03333333333336, "x": "変化は、秒速およそ十八・五キロメートル。"}, {"t": 269.25, "x": "冥王星に向かうのに必要なのは、"}, {"t": 271.48333333333335, "x": "秒速およそ十七キロメートル。"}, {"t": 273.9, "x": "ESAの彗星探査機ロゼッタは、長い旅の全体を"}, {"t": 277.4166666666667, "x": "通して、およそ秒速五キロメートルでした。"}, {"t": 280.3666666666667, "x": "同じ数字を、ESAは別のページで、"}, {"t": 283.0833333333333, "x": "もっと短く言っています。"}, {"t": 284.95, "x": "水星の周りに探査機を置くには、冥王星に"}, {"t": 288.2, "x": "探査機を送るよりも多くのエネルギーが要る、と。"}, {"t": 291.4, "x": "冥王星は、地球から数十億キロメートルも離れています。"}, {"t": 295.6, "x": "それでも、そこへ向かう探査機は、坂を上っていく側です。"}, {"t": 299.9166666666667, "x": "上りきってしまえば、あとは勢いのまま進めばいい。"}, {"t": 303.48333333333335, "x": "水星へ向かう探査機は、その反対の問題を抱えています。"}, {"t": 307.6, "x": "もう一つ、比べると分かりやすい例があります。"}, {"t": 310.81666666666666, "x": "NASAのパーカー・ソーラー・プローブという探査機は、"}, {"t": 313.4, "x": "二〇二四年十二月二十四日、太陽の表面から"}, {"t": 317.6333333333333, "x": "およそ六百十万キロメートルのところを通過しました。"}, {"t": 320.85, "x": "水星の軌道よりも、はるかに太陽に近い場所です。"}, {"t": 324.55, "x": "そのときの速さは、"}, {"t": 325.75, "x": "時速およそ六十九万キロメートルでした。"}, {"t": 328.8333333333333, "x": "パーカーは、水星よりも太陽に近づいています。"}, {"t": 332.28333333333336, "x": "それができたのは、パーカーが"}, {"t": 334.23333333333335, "x": "止まる必要のない探査機だからです。"}, {"t": 336.45, "x": "太陽のそばを、猛烈な速さで"}, {"t": 338.8, "x": "通り過ぎて、また遠くへ戻っていく。"}, {"t": 341.4166666666667, "x": "その繰り返しで観測をします。"}, {"t": 343.5, "x": "ESAの太陽観測機ソーラーオービターも、"}, {"t": 346.0, "x": "打ち上げから二年足らずで、水星より太陽に"}, {"t": 349.46666666666664, "x": "近い軌道に入ったと、ESAは説明しています。"}, {"t": 352.73333333333335, "x": "近づくだけなら、できる。"}, {"t": 354.68333333333334, "x": "とどまるのが、難しい。"}, {"t": 356.68333333333334, "x": "それが、水星という場所の性質です。"}, {"t": 359.55, "x": "そして、もう一つの問題があります。"}, {"t": 362.23333333333335, "x": "熱です。"}, {"t": 363.03333333333336, "x": "水星のあたりでは、太陽の光の強さが、平均で"}, {"t": 367.06666666666666, "x": "地球の周りのおよそ六・七倍になります。"}, {"t": 369.76666666666665, "x": "NASAの惑星データによる数字です。"}, {"t": 372.03333333333336, "x": "ESAは、太陽に近い側では地球付近の"}, {"t": 375.1166666666667, "x": "およそ十倍になると説明しています。"}, {"t": 377.3833333333333, "x": "さらに、水星の表面そのものが熱を照り返します。"}, {"t": 381.18333333333334, "x": "ESAによると、水星を周回する機体は、最高で"}, {"t": 385.1166666666667, "x": "四百五十度、鉛が溶けるほどの温度にさらされます。"}, {"t": 388.78333333333336, "x": "水星の一日、つまり昼と夜がひと回りするのには、"}, {"t": 392.56666666666666, "x": "地球の日数でおよそ百七十六日かかります。"}, {"t": 396.1, "x": "昼の側は長いあいだ焼かれ続け、夜の側は冷え続けます。"}, {"t": 400.43333333333334, "x": "止まるのが難しく、止まったあとも"}, {"t": 402.8833333333333, "x": "熱に耐えなければならない。"}, {"t": 404.48333333333335, "x": "水星に向かった機体が三つの計画ぶんしかないのは、"}, {"t": 407.73333333333335, "x": "こうした条件が重なっているからです。"}, {"t": 410.3333333333333, "x": "では、最初にこの条件に挑んだ機体は、"}, {"t": 413.18333333333334, "x": "どうやって水星まで行ったのか。"}, {"t": 415.3833333333333, "x": "それは、止まることをあきらめた探査機でした。"}, {"t": 418.3333333333333, "x": "一九七三年十一月三日、アメリカで、"}, {"t": 418.3333333333333, "x": "一九七三年█"}, {"t": 422.48333333333335, "x": "一機の探査機が打ち上げられました。"}, {"t": 425.1333333333333, "x": "マリナー十号です。"}, {"t": 425.1333333333333, "x": "マリナー十号█"}, {"t": 426.98333333333335, "x": "打ち上げのときの重さは、およそ四百七十四キログラム。"}, {"t": 431.03333333333336, "x": "マリナー十号の目的地は、二つありました。"}, {"t": 434.25, "x": "金星と、水星です。"}, {"t": 436.26666666666665, "x": "最初に向かったのは、金星でした。"}, {"t": 438.81666666666666, "x": "一九七四年二月五日、マリナー十号は、金星から"}, {"t": 443.56666666666666, "x": "およそ五千八百キロメートルのところを通過しました。"}, {"t": 446.71666666666664, "x": "このとき、マリナー十号は、ただ金星を"}, {"t": 449.95, "x": "撮影しただけではありませんでした。"}, {"t": 452.03333333333336, "x": "金星の重力を借りて、自分の進む向きと速さを変えました。"}, {"t": 456.31666666666666, "x": "惑星のそばを通るとき、その惑星の"}, {"t": 459.1166666666667, "x": "重力に引かれて、軌道が曲がります。"}, {"t": 461.75, "x": "どちら側を、どの角度で通るかを決めておけば、燃料を"}, {"t": 465.8333333333333, "x": "使わずに、速さを上げることも、下げることもできます。"}, {"t": 469.75, "x": "NASAの記録は、これを、ある惑星の重力を"}, {"t": 473.21666666666664, "x": "使って別の惑星へ向かった、最初の例としています。"}, {"t": 476.8833333333333, "x": "いまでは多くの探査機が当たり前に使っている"}, {"t": 479.53333333333336, "x": "方法が、このとき初めて使われました。"}, {"t": 482.3666666666667, "x": "金星のそばを通り過ぎるあいだにも、"}, {"t": 484.55, "x": "マリナー十号は撮影を続けていました。"}, {"t": 487.48333333333335, "x": "NASAによると、金星で送ってきた"}, {"t": 489.9, "x": "画像は、四千枚を超えます。"}, {"t": 492.1666666666667, "x": "ただ、この探査機にとって、金星は途中の通過点でした。"}, {"t": 496.56666666666666, "x": "本当の目的地は、その先にありました。"}, {"t": 499.56666666666666, "x": "金星で向きを変えたマリナー十号は、水星へ向かいました。"}, {"t": 503.5833333333333, "x": "一九七四年三月二十九日、水星の表面から"}, {"t": 508.0, "x": "およそ七百キロメートルのところを通過しました。"}, {"t": 510.8666666666667, "x": "人類が初めて、水星を間近で見た日です。"}, {"t": 514.2, "x": "NASAによると、この一回目の通過で、"}, {"t": 516.8833333333333, "x": "二千枚を超える画像が送られてきました。"}, {"t": 519.8, "x": "ここまで、打ち上げから、およそ百四十七日。"}, {"t": 523.6833333333333, "x": "ESAは、マリナー十号がこれほど短い期間で着けたのは、"}, {"t": 527.6, "x": "周回をしなかったからだと説明しています。"}, {"t": 530.6, "x": "止まらずに、通り過ぎたからです。"}, {"t": 532.9833333333333, "x": "ただ、マリナー十号の記録は、"}, {"t": 535.2666666666667, "x": "一回の通過では終わりません。"}, {"t": 537.45, "x": "この探査機には、もう一つ仕掛けがありました。"}, {"t": 540.5333333333333, "x": "それを考えたのが、イタリアのパドヴァ大学の"}, {"t": 543.85, "x": "研究者、ジュゼッペ・コロンボです。"}, {"t": 544.4, "x": "ジュゼッペ・コロンボ█"}, {"t": 546.4166666666666, "x": "周りからは、ベピ、と呼ばれていました。"}, {"t": 549.5, "x": "コロンボが気づいたのは、軌道の周期の合わせ方でした。"}, {"t": 553.1666666666666, "x": "水星は、およそ八十八日で太陽を一周します。"}, {"t": 557.0666666666667, "x": "もし探査機が、太陽の周りをちょうど百七十六日で"}, {"t": 560.8333333333334, "x": "一周する軌道に乗っていれば、探査機が"}, {"t": 563.5, "x": "一周するあいだに、水星はちょうど二周します。"}, {"t": 566.6666666666666, "x": "すると、探査機と水星は、百七十六日ごとに、"}, {"t": 570.7666666666667, "x": "同じ場所で出会うことになります。"}, {"t": 573.05, "x": "NASAの記録によると、コロンボは、マリナー十号を"}, {"t": 576.7, "x": "そのような軌道に乗せられることを示しました。"}, {"t": 579.4, "x": "止まることはできなくても、同じ場所を"}, {"t": 581.8833333333333, "x": "何度も通ることはできる、という考え方です。"}, {"t": 585.05, "x": "実際に、マリナー十号は、水星と三回出会いました。"}, {"t": 589.3333333333334, "x": "二回目は、一九七四年九月二十一日。"}, {"t": 593.2833333333333, "x": "このときは、水星の表面から四万八千キロメートルほど"}, {"t": 597.2333333333333, "x": "離れたところを通過しました。"}, {"t": 598.9833333333333, "x": "一回目よりずっと遠い通過です。"}, {"t": 601.15, "x": "それでも、NASAによると、"}, {"t": 603.0, "x": "およそ五百枚の新しい画像が届きました。"}, {"t": 606.2166666666667, "x": "三回目は、一九七五年三月十六日。"}, {"t": 610.2333333333333, "x": "今度は、表面からおよそ三百三十キロメートルという、"}, {"t": 614.1, "x": "三回の中でいちばん近いところを通りました。"}, {"t": 617.2666666666667, "x": "NASAの記録では、このとき使える細長い帯状の"}, {"t": 620.7, "x": "写真が、およそ四百五十本得られています。"}, {"t": 623.9166666666666, "x": "一回目から三回目まで、およそ一年。"}, {"t": 626.8333333333334, "x": "そのあいだ、マリナー十号は、"}, {"t": 628.9833333333333, "x": "太陽の周りを二周しています。"}, {"t": 631.35, "x": "水星はその間に四周しています。"}, {"t": 633.8, "x": "コロンボの計算どおりに、二つの軌道は、"}, {"t": 636.6666666666666, "x": "決まった場所で重なり続けました。"}, {"t": 639.0833333333334, "x": "そして、三回目の通過から八日後の三月二十四日、"}, {"t": 642.9833333333333, "x": "マリナー十号は、機体の向きを保つための"}, ことになります。"}, {"t": 1228.5, "x": "細長い軌道にすれば、水星に近づいているのは"}, {"t": 1231.8666666666666, "x": "一周のうち短い時間だけで、残りの時間は、"}, {"t": 1235.15, "x": "水星から離れて機体を冷ますことができます。"}, {"t": 1238.2333333333333, "x": "機体そのものにも、熱への備えがありました。"}, {"t": 1241.35, "x": "メッセンジャーの前には、常に太陽の側を向く、"}, {"t": 1244.65, "x": "大きな日よけが取り付けられていました。"}, {"t": 1247.2833333333333, "x": "NASAの記録では、高さおよそ二・"}, {"t": 1249.55, "x": "五メートル、幅およそ二メートル。"}, {"t": 1252.1333333333334, "x": "研究所の記録によると、セラミックの布でできていました。"}, {"t": 1256.0666666666666, "x": "機体の本体は、この日よけの"}, {"t": 1258.2166666666667, "x": "影の中に入るように作られていました。"}, {"t": 1260.6666666666667, "x": "太陽電池パネルにも、工夫がありました。"}, {"t": 1263.5833333333333, "x": "研究所の記録によると、パネルの三分の二が"}, {"t": 1266.7833333333333, "x": "鏡になっていて、熱を反射するようになっていました。"}, {"t": 1270.35, "x": "太陽の光が強すぎる場所では、電池を全面に並べると、"}, {"t": 1274.5166666666667, "x": "パネルそのものが熱くなりすぎるからです。"}, {"t": 1277.2166666666667, "x": "日よけの陰に機体を隠し、電池の大部分を"}, {"t": 1280.45, "x": "鏡にし、細長い軌道で熱から逃げる時間を作る。"}, {"t": 1284.2833333333333, "x": "六年半の旅と、それだけの備えが、"}, {"t": 1287.0333333333333, "x": "水星の周りにとどまるために必要でした。"}, {"t": 1290.0333333333333, "x": "打ち上げで持っていった重さの半分以上は燃料で、"}, {"t": 1293.15, "x": "その燃料は、ほとんどがブレーキのために使われました。"}, {"t": 1297.0666666666666, "x": "メッセンジャーの旅は、どこかへ急ぐための旅ではなく、"}, {"t": 1300.6, "x": "速くなりすぎないようにするための旅でした。"}, {"t": 1303.5833333333333, "x": "水星の周りを回り始めたメッセンジャーは、"}, {"t": 1306.3, "x": "撮影を続けました。"}, {"t": 1308.05, "x": "NASAの記録によると、最初の一年の"}, {"t": 1310.6666666666667, "x": "主な観測を終えた二〇一二年三月の時点で、"}, {"t": 1313.7833333333333, "x": "撮った画像はおよそ十万枚。"}, {"t": 1315.9166666666667, "x": "二〇一四年二月には、周回中に撮った"}, {"t": 1318.9666666666667, "x": "画像が二十万枚に達しました。"}, {"t": 1321.05, "x": "NASAは、当初の見込みは"}, {"t": 1322.8166666666666, "x": "少なくとも千枚だった、と書いています。"}, {"t": 1325.5666666666666, "x": "NASAの別の記録では、最終的に"}, {"t": 1328.1166666666666, "x": "送られてきた写真は、およそ三十万枚。"}, {"t": 1331.1333333333334, "x": "データは十テラバイトを超えました。"}, {"t": 1333.2166666666667, "x": "マリナー十号が送ってきた水星の"}, {"t": 1335.4, "x": "画像は、二千三百枚あまりでした。"}, {"t": 1338.0833333333333, "x": "その百倍を超える写真が、四年 : 1570.7833333333333, "x": "南アメリカのフランス領ギアナから、"}, {"t": 1573.0, "x": "アリアン五型ロケットが打ち上げられました。"}, {"t": 1575.8333333333333, "x": "載っていたのは、ヨーロッパ宇宙機関、ESAと、"}, {"t": 1579.3666666666666, "x": "日本の宇宙航空研究開発機構、JAXAが共同で"}, {"t": 1583.85, "x": "進めてきた水星探査計画、ベピコロンボです。"}, {"t": 1585.8333333333333, "x": "ベピコロンボ█"}, {"t": 1587.4166666666667, "x": "名前は、第二章に出てきた、マリナー十号の"}, {"t": 1590.9666666666667, "x": "軌道を考えたジュゼッペ・コロンボからとられています。"}, {"t": 1593.9166666666667, "x": "ベピコロンボは、一機の探査機ではありません。"}, {"t": 1596.95, "x": "三つの部分を縦に積み重ねた、"}, {"t": 1599.0166666666667, "x": "一つのかたまりとして打ち上げられました。"}, {"t": 1601.7, "x": "一つめは、ESAの水星表面探査機、MPO。"}, {"t": 1605.9166666666667, "x": "水星の表面と内部を調べる機体です。"}, {"t": 1608.6666666666667, "x": "ESAの資料では、重さはおよそ千二百三十キログラム。"}, {"t": 1612.6833333333334, "x": "そのうち観測装置は八十五キログラムです。"}, {"t": 1615.6166666666666, "x": "太陽電池の翼は、広げると七・五メートル。"}, {"t": 1619.15, "x": "熱を逃がすための放熱板は、幅三・七メートルあります。"}, {"t": 1623.35, "x": "第一章で見た、最高で四百五十度という"}, {"t": 1626.5666666666666, "x": "温度にさらされるのは、この機体です。"}, {"t": 1629.1166666666666, "x": "二つめは、JAXAの水星磁気圏探査機、みお。"}, {"t": 1632.4, "x": "みお█"}, {"t": 1632.9166666666667, "x": "水星の周りの磁場や、水星から出ている、"}, {"t": 1635.9333333333334, "x": "ごく薄い大気を調べる機体です。"}, {"t": 1638.4166666666667, "x": "三つめは、ESAの水星輸送モジュール、MTM。"}, {"t": 1642.5, "x": "水星まで二機を運ぶためだけの、推進用の部分です。"}, {"t": 1646.5166666666667, "x": "全体の重さは、ESAの資料によると、四千百キログラム。"}, {"t": 1651.0666666666666, "x": "そのうち千四百キログラムが燃料でした。"}, {"t": 1653.8, "x": "みおの重さは、資料によって少し違います。"}, {"t": 1656.95, "x": "ESAの資料では二百五十五キログラム、JAXAの資料では、"}, {"t": 1660.9833333333333, "x": "およそ二百八十キログラムとされています。"}, {"t": 1663.9333333333334, "x": "みおは、八角形の柱のような形をしています。"}, {"t": 1667.4666666666667, "x": "高さ一・一メートル、直径一・八メートル。"}, {"t": 1670.9666666666667, "x": "ESAの説明によると、一分間に"}, {"t": 1673.5166666666667, "x": "十五回転しながら、その姿勢を保ちます。"}, {"t": 1676.5833333333333, "x": "水星に着いたあとは、長さ五メートルの棒を"}, {"t": 1679.5833333333333, "x": "二本、長さ十五メートルのアンテナを四本、"}, {"t": 1682.5833333333333, "x": "機体の外へ伸ばす設計です。"}, {"t": 1684.8333333333333, "x": "JAXAが挙げるみおの目的は、水星の"}, {"t": "t": 1924.75, "x": "MPOとみお、二機を一緒に運び、九回の通過と"}, {"t": 1928.8666666666666, "x": "八年の旅を経て、いま、水星の手前にいます。"}, {"t": 1932.7666666666667, "x": "計画は三つ。"}, {"t": 1933.9333333333334, "x": "機体として数えれば四機。"}, {"t": 1935.7833333333333, "x": "そのうち、水星の周りを回ったことがあるのは、"}, {"t": 1939.05, "x": "この台本を書いている時点で、一機だけです。"}, {"t": 1942.4666666666667, "x": "太陽系のいちばん内側の惑星は、望遠鏡を"}, {"t": 1946.0166666666667, "x": "向けることもできず、近くまで行っても、"}, {"t": 1948.5833333333333, "x": "止まるのに何年もかかる場所でした。"}, {"t": 1950.9833333333333, "x": "距離だけで言えば、いちばん近い惑星の一つです。"}, {"t": 1954.45, "x": "必要な速度の変化で言えば、冥王星よりも遠い場所です。"}, {"t": 1958.6, "x": "水星へ向かった機体は、どれも、同じことをしてきました。"}, {"t": 1962.7833333333333, "x": "坂を下りながら、ブレーキをかけ続けること。"}, {"t": 1965.9166666666667, "x": "惑星のそばを何度も通り、そのたびに"}, {"t": 1968.7166666666667, "x": "少しずつ速さを捨てること。"}, {"t": 1970.4666666666667, "x": "そして、熱から身を隠し続けること。"}, {"t": 1973.3166666666666, "x": "マリナー十号は、その途中で燃料が尽きました。"}, {"t": 1976.7666666666667, "x": "メッセンジャーは、たどり着いたあとで燃料が尽きました。"}, {"t": 1980.2833333333333, "x": "水星の北極の近く、一度も光の届かない穴の"}, {"t": 1984.1166666666666, "x": "底には、氷があるとされています。"}, {"t": 1986.5833333333333, "x": "水星の表面のどこかには、メッセンジャーが"}, {"t": 1989.4833333333333, "x": "落ちたときにできた、新しいくぼみがあります。"}, {"t": 1992.55, "x": "そして、いま、その上空に、"}, {"t": 1995.15, "x": "二機を積んだ探査機が近づいています。"}, {"t": 1997.8333333333333, "x": "二〇二六年十一月二十一日。"}, {"t": 2000.7, "x": "そこから、三つめの計画の、"}, {"t": 2002.8, "x": "いちばん長い仕事が始まる予定です。"}, {"t": 2005.55, "x": "水星に行くことは、難しくありません。"}, {"t": 2008.4333333333334, "x": "止まることが、難しい。"}, {"t": 2010.4166666666667, "x": "その難しさを、三つの計画が、"}, {"t": 2012.9666666666667, "x": "それぞれの方法で越えようとしてきました。"}, {"t": 2015.75, "x": "記録は、まだ途中です。"}], "w": 720, "h": 405, "n_cuts": 696, "noimage": false};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
