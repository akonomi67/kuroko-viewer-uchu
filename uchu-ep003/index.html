<script>
const D={"name": "ep003", "file": "ep003", "dur": 2012.7833125, "segs": [], "subs": [{"t": 0.0, "x": "宇宙の奥、百億光年を超える先の"}, {"t": 2.9166666666666665, "x": "銀河まで写してきた望遠鏡があります。"}, {"t": 5.35, "x": "ハッブル宇宙望遠鏡です。"}, {"t": 5.35, "x": "ハッブル宇宙望遠鏡█"}, {"t": 7.233333333333333, "x": "その望遠鏡が、一度も向けられたことのない"}, {"t": 10.316666666666666, "x": "惑星があります。"}, {"t": 11.4, "x": "太陽にいちばん近い惑星、水星です。"}, {"t": 13.583333333333334, "x": "水星█"}, {"t": 14.5, "x": "理由は単純です。"}, {"t": 15.883333333333333, "x": "水星は、地球から見るといつも太陽のすぐそばにあります。"}, {"t": 19.983333333333334, "x": "望遠鏡を水星に向けることは、"}, {"t": 22.066666666666666, "x": "太陽のすぐ隣に向けることになります。"}, {"t": 24.95, "x": "ヨーロッパ宇宙機関、ESAは、光学系を"}, {"t": 28.383333333333333, "x": "傷めるおそれがあるため、ハッブルは"}, {"t": 30.65, "x": "水星を見たことがない、と説明しています。"}, {"t": 33.65, "x": "地上からも、水星が見えるのは、日の出の少し前と、"}, {"t": 37.666666666666664, "x": "日が沈んだ少しあとの、短い時間だけです。"}, {"t": 41.2, "x": "では、近くまで行って見ればいい。"}, {"t": 43.5, "x": "そう考えるのは自然です。"}, {"t": 45.35, "x": "水星は、地球からの距離で言えば、"}, {"t": 47.9, "x": "木星よりもずっと近い惑星です。"}, {"t": 50.55, "x": "ところが、人類がこれまでに水星まで"}, {"t": 53.28333333333333, "x": "送り届けた探査の計画は、三つしかありません。"}, {"t": 56.63333333333333, "x": "一九七〇年代のマリナー十号。"}, {"t": 59.4, "x": "二〇〇〇年代のメッセンジャー。"}, {"t": 61.13333333333333, "x": "そして、いまちょうど到着しようとしている、"}, {"t": 64.08333333333333, "x": "ベピコロンボです。"}, {"t": 65.5, "x": "機体の数で数えても、四機です。"}, {"t": 68.1, "x": "木星よりずっと近い水星に、"}, {"t": 70.15, "x": "なぜこれだけしか行っていないのか。"}, {"t": 72.43333333333334, "x": "答えは、距離ではありません。"}, {"t": 74.53333333333333, "x": "速さです。"}, {"t": 75.41666666666667, "x": "水星に行くことは、難しくありません。"}, {"t": 78.3, "x": "難しいのは、水星で止まることです。"}, {"t": 81.11666666666666, "x": "ESAの資料には、水星の周りを回る軌道に"}, {"t": 84.3, "x": "入るまでに必要な速度の変化が、およそ秒速十八・"}, {"t": 88.08333333333333, "x": "五キロメートルと書かれています。"}, {"t": 89.98333333333333, "x": "遠く離れた冥王星に向かう場合は、"}, {"t": 92.31666666666666, "x": "およそ秒速十七キロメートル。"}, {"t": 94.7, "x": "いちばん近い惑星のほうが、準惑星の"}, {"t": 97.6, "x": "冥王星よりも、多くの燃料を必要とします。"}, {"t": 101.05, "x": "この回では、その三つの計画の"}, {"t": 103.45, "x": "記録を、順に読んでいきます。"}, {"t": 105.6, "x": "水星の近くまで行くのに、なぜ何年もかかるのか。"}, {"t": 109.23333333333333, "x": "そして、たどり着いた機体が、その後どうなったのかを。"}, {"t": 113.1, "x": "まず、水星がどこにあるのかを、数字で確かめておきます。"}, {"t": 117.41666666666667, "x": "NASAの惑星データによると、水星は、太陽から"}, {"t": 121.13333333333334, "x": "およそ五千七百九十万キロメートルのところを"}, {"t": 124.05, "x": "回っています。"}, {"t": 124.9, "x": "地球と太陽の距離のおよそ四割です。"}, {"t": 127.45, "x": "一周にかかるのは、およそ八十八日。"}, {"t": 130.55, "x": "地球の一年のあいだに、水星は"}, {"t": 133.0, "x": "太陽の周りを四回ほど回ります。"}, {"t": 135.33333333333334, "x": "ESAは、水星と地球の距離を、"}, {"t": 137.75, "x": "およそ七千七百万キロメートルと説明しています。"}, {"t": 141.41666666666666, "x": "木星までは、およそ六億三千万キロメートル。"}, {"t": 144.91666666666666, "x": "距離だけを比べれば、水星のほうが"}, {"t": 147.43333333333334, "x": "八倍以上も近いことになります。"}, {"t": 149.58333333333334, "x": "それでも、ESAは、水星のほうが行くのが"}, {"t": 152.8, "x": "難しい、と書いています。"}, {"t": 154.75, "x": "理由を、ESAは坂道にたとえています。"}, {"t": 157.71666666666667, "x": "太陽の周りの空間は、太陽を底にした、深い"}, {"t": 161.55, "x": "すり鉢のような形をしていると考えることができます。"}, {"t": 164.86666666666667, "x": "地球は、そのすり鉢の途中を、ぐるぐると回っています。"}, {"t": 169.01666666666668, "x": "水星は、それよりずっと底に近いところを回っています。"}, {"t": 172.86666666666667, "x": "地球から水星へ向かうということは、このすり鉢の"}, {"t": 176.25, "x": "斜面を、底に向かって下りていくことです。"}, {"t": 179.11666666666667, "x": "下り坂を走る車が、ブレーキをかけなければ"}, {"t": 182.3, "x": "どんどん速くなるのと同じように、探査機も、"}, {"t": 185.26666666666668, "x": "太陽に近づくほど速くなっていきます。"}, {"t": 187.98333333333332, "x": "水星そのものも、速く動いています。"}, {"t": 190.83333333333334, "x": "水星が太陽の周りを回る速さは、"}, {"t": 193.31666666666666, "x": "平均で秒速およそ四十七キロメートル。"}, {"t": 196.43333333333334, "x": "地球の秒速およそ三十キロメートルと"}, {"t": 198.91666666666666, "x": "比べて、一・六倍ほどの速さです。"}, {"t": 201.75, "x": "ここで、水星へ行く探査機に起きることを考えます。"}, {"t": 205.41666666666666, "x": "ただ水星の近くを通り過ぎるだけなら、"}, {"t": 207.9, "x": "話はそれほど難しくありません。"}, {"t": 210.41666666666666, "x": "坂を下りていって、水星の横を駆け抜ければいいからです。"}, {"t": 214.36666666666667, "x": "けれども、水星の周りを回る軌道に"}, {"t": 217.06666666666666, "x": "入ろうとすると、話が変わります。"}, {"t": 219.61666666666667, "x": "坂を下って速くなりすぎた探査機は、水星の"}, {"t": 222.91666666666666, "x": "横を、ものすごい速さで通り過ぎてしまいます。"}, {"t": 226.15, "x": "水星の重力は、地球の重力の四割ほどしかありません。"}, {"t": 230.31666666666666, "x": "その弱い重力では、速すぎる探査機を"}, {"t": 233.21666666666667, "x": "つかまえておくことができません。"}, {"t": 235.0, "x": "つかまえてもらうためには、探査機のほうで"}, {"t": 237.68333333333334, "x": "速度を落とすしかありません。"}, {"t": 239.31666666666666, "x": "坂を下りながら、ずっとブレーキをかけ続ける"}, {"t": 242.31666666666666, "x": "必要があります。"}, {"t": 243.38333333333333, "x": "宇宙でブレーキをかけるには、進む向きと"}, {"t": 246.13333333333333, "x": "反対に燃料を噴くしかありません。"}, {"t": 248.25, "x": "ESAの説明では、そのブレーキを"}, {"t": 250.56666666666666, "x": "すべて燃料だけでまかなおうとすると、"}, {"t": 252.8, "x": "積まなければならない燃料が多くなりすぎて、"}, {"t": 255.81666666666666, "x": "機体が重くなり、打ち上げられなくなります。"}, {"t": 259.1666666666667, "x": "これが、冒頭の数字の意味です。"}, {"t": 261.6666666666667, "x": "水星の周りを回る軌道に入るために必要な速度の"}, {"t": 265.1, "x": "変化は、秒速およそ十八・五キロメートル。"}, {"t": 268.31666666666666, "x": "冥王星に向かうのに必要なのは、"}, {"t": 270.55, "x": "秒速およそ十七キロメートル。"}, {"t": 272.96666666666664, "x": "ESAの彗星探査機ロゼッタは、長い旅の全体を"}, {"t": 276.48333333333335, "x": "通して、およそ秒速五キロメートルでした。"}, {"t": 279.43333333333334, "x": "同じ数字を、ESAは別のページで、"}, {"t": 282.15, "x": "もっと短く言っています。"}, {"t": 284.01666666666665, "x": "水星の周りに探査機を置くには、冥王星に"}, {"t": 287.26666666666665, "x": "探査機を送るよりも多くのエネルギーが要る、と。"}, {"t": 290.46666666666664, "x": "冥王星は、地球から数十億キロメートルも離れています。"}, {"t": 294.6666666666667, "x": "それでも、そこへ向かう探査機は、坂を上っていく側です。"}, {"t": 298.98333333333335, "x": "上りきってしまえば、あとは勢いのまま進めばいい。"}, {"t": 302.55, "x": "水星へ向かう探査機は、その反対の問題を抱えています。"}, {"t": 306.6666666666667, "x": "もう一つ、比べると分かりやすい例があります。"}, {"t": 309.8833333333333, "x": "NASAのパーカー・ソーラー・プローブという探査機は、"}, {"t": 312.46666666666664, "x": "二〇二四年十二月二十四日、太陽の表面から"}, {"t": 316.7, "x": "およそ六百十万キロメートルのところを通過しました。"}, {"t": 319.9166666666667, "x": "水星の軌道よりも、はるかに太陽に近い場所です。"}, {"t": 323.6166666666667, "x": "そのときの速さは、"}, {"t": 324.81666666666666, "x": "時速およそ六十九万キロメートルでした。"}, {"t": 327.9, "x": "パーカーは、水星よりも太陽に近づいています。"}, {"t": 331.35, "x": "それができたのは、パーカーが"}, {"t": 333.3, "x": "止まる必要のない探査機だからです。"}, {"t": 335.51666666666665, "x": "太陽のそばを、猛烈な速さで"}, {"t": 337.8666666666667, "x": "通り過ぎて、また遠くへ戻っていく。"}, {"t": 340.48333333333335, "x": "その繰り返しで観測をします。"}, {"t": 342.56666666666666, "x": "ESAの太陽観測機ソーラーオービターも、"}, {"t": 345.06666666666666, "x": "打ち上げから二年足らずで、水星より太陽に"}, {"t": 348.53333333333336, "x": "近い軌道に入ったと、ESAは説明しています。"}, {"t": 351.8, "x": "近づくだけなら、できる。"}, {"t": 353.75, "x": "とどまるのが、難しい。"}, {"t": 355.75, "x": "それが、水星という場所の性質です。"}, {"t": 358.6166666666667, "x": "そして、もう一つの問題があります。"}, {"t": 361.3, "x": "熱です。"}, {"t": 362.1, "x": "水星のあたりでは、太陽の光の強さが、平均で"}, {"t": 366.1333333333333, "x": "地球の周りのおよそ六・七倍になります。"}, {"t": 368.8333333333333, "x": "NASAの惑星データによる数字です。"}, {"t": 371.1, "x": "ESAは、太陽に近い側では地球付近の"}, {"t": 374.18333333333334, "x": "およそ十倍になると説明しています。"}, {"t": 376.45, "x": "さらに、水星の表面そのものが熱を照り返します。"}, {"t": 380.25, "x": "ESAによると、水星を周回する機体は、最高で"}, {"t": 384.18333333333334, "x": "四百五十度、鉛が溶けるほどの温度にさらされます。"}, {"t": 387.85, "x": "水星の一日、つまり昼と夜がひと回りするのには、"}, {"t": 391.6333333333333, "x": "地球の日数でおよそ百七十六日かかります。"}, {"t": 395.1666666666667, "x": "昼の側は長いあいだ焼かれ続け、夜の側は冷え続けます。"}, {"t": 399.5, "x": "止まるのが難しく、止まったあとも"}, {"t": 401.95, "x": "熱に耐えなければならない。"}, {"t": 403.55, "x": "水星に向かった機体が三つの計画ぶんしかないのは、"}, {"t": 406.8, "x": "こうした条件が重なっているからです。"}, {"t": 409.4, "x": "では、最初にこの条件に挑んだ機体は、"}, {"t": 412.25, "x": "どうやって水星まで行ったのか。"}, {"t": 414.45, "x": "それは、止まることをあきらめた探査機でした。"}, {"t": 417.4, "x": "一九七三年十一月三日、アメリカで、"}, {"t": 417.4, "x": "一九七三年█"}, {"t": 421.21666666666664, "x": "一機の探査機が打ち上げられました。"}, {"t": 423.6333333333333, "x": "マリナー十号です。"}, {"t": 423.6333333333333, "x": "マリナー十号█"}, {"t": 425.01666666666665, "x": "打ち上げのときの重さは、およそ四百七十四キログラム。"}, {"t": 429.06666666666666, "x": "マリナー十号の目的地は、二つありました。"}, {"t": 432.28333333333336, "x": "金星と、水星です。"}, {"t": 434.3, "x": "最初に向かったのは、金星でした。"}, {"t": 436.85, "x": "一九七四年二月五日、マリナー十号は、金星から"}, {"t": 441.6, "x": "およそ五千八百キロメートルのところを通過しました。"}, {"t": 444.75, "x": "このとき、マリナー十号は、ただ金星を"}, {"t": 447.98333333333335, "x": "撮影しただけではありませんでした。"}, {"t": 450.06666666666666, "x": "金星の重力を借りて、自分の進む向きと速さを変えました。"}, {"t": 454.35, "x": "惑星のそばを通るとき、その惑星の"}, {"t": 457.15, "x": "重力に引かれて、軌道が曲がります。"}, {"t": 459.78333333333336, "x": "どちら側を、どの角度で通るかを決めておけば、燃料を"}, {"t": 463.8666666666667, "x": "使わずに、速さを上げることも、下げることもできます。"}, {"t": 467.78333333333336, "x": "NASAの記録は、これを、ある惑星の重力を"}, {"t": 471.25, "x": "使って別の惑星へ向かった、最初の例としています。"}, {"t": 474.9166666666667, "x": "いまでは多くの探査機が当たり前に使っている"}, {"t": 477.56666666666666, "x": "方法が、このとき初めて使われました。"}, {"t": 480.4, "x": "金星のそばを通り過ぎるあいだにも、"}, {"t": 482.5833333333333, "x": "マリナー十号は撮影を続けていました。"}, {"t": 485.51666666666665, "x": "NASAによると、金星で送ってきた"}, {"t": 487.93333333333334, "x": "画像は、四千枚を超えます。"}, {"t": 490.2, "x": "ただ、この探査機にとって、金星は途中の通過点でした。"}, {"t": 494.6, "x": "本当の目的地は、その先にありました。"}, {"t": 497.6, "x": "金星で向きを変えたマリナー十号は、水星へ向かいました。"}, {"t": 501.6166666666667, "x": "一九七四年三月二十九日、水星の表面から"}, {"t": 506.03333333333336, "x": "およそ七百キロメートルのところを通過しました。"}, {"t": 508.9, "x": "人類が初めて、水星を間近で見た日です。"}, {"t": 512.2333333333333, "x": "NASAによると、この一回目の通過で、"}, {"t": 514.9166666666666, "x": "二千枚を超える画像が送られてきました。"}, {"t": 517.8333333333334, "x": "ここまで、打ち上げから、およそ百四十七日。"}, {"t": 521.7166666666667, "x": "ESAは、マリナー十号がこれほど短い期間で着けたのは、"}, {"t": 525.6333333333333, "x": "周回をしなかったからだと説明しています。"}, {"t": 528.6333333333333, "x": "止まらずに、通り過ぎたからです。"}, {"t": 531.0166666666667, "x": "ただ、マリナー十号の記録は、"}, {"t": 533.3, "x": "一回の通過では終わりません。"}, {"t": 535.4833333333333, "x": "この探査機には、もう一つ仕掛けがありました。"}, {"t": 538.5666666666667, "x": "それを考えたのが、イタリアのパドヴァ大学の"}, {"t": 541.6166666666667, "x": "研究者、ジュゼッペ・コロンボです。"}, {"t": 542.1166666666667, "x": "ジュゼッペ・コロンボ█"}, {"t": 543.9666666666667, "x": "周りからは、ベピ、と呼ばれていました。"}, {"t": 547.05, "x": "コロンボが気づいたのは、軌道の周期の合わせ方でした。"}, {"t": 550.7166666666667, "x": "水星は、およそ八十八日で太陽を一周します。"}, {"t": 554.6166666666667, "x": "もし探査機が、太陽の周りをちょうど百七十六日で"}, {"t": 558.3833333333333, "x": "一周する軌道に乗っていれば、探査機が"}, {"t": 561.05, "x": "一周するあいだに、水星はちょうど二周します。"}, {"t": 564.2166666666667, "x": "すると、探査機と水星は、百七十六日ごとに、"}, {"t": 568.3166666666667, "x": "同じ場所で出会うことになります。"}, {"t": 570.6, "x": "NASAの記録によると、コロンボは、マリナー十号を"}, {"t": 574.25, "x": "そのような軌道に乗せられることを示しました。"}, {"t": 576.95, "x": "止まることはできなくても、同じ場所を"}, {"t": 579.4333333333333, "x": "何度も通ることはできる、という考え方です。"}, {"t": 582.6, "x": "実際に、マリナー十号は、水星と三回出会いました。"}, {"t": 586.8833333333333, "x": "二回目は、一九七四年九月二十一日。"}, {"t": 590.8333333333334, "x": "このときは、水星の表面から四万八千キロメートルほど"}, {"t": 594.7833333333333, "x": "離れたところを通過しました。"}, {"t": 596.5333333333333, "x": "一回目よりずっと遠い通過です。"}, {"t": 598.7, "x": "それでも、NASAによると、"}, {"t": 600.55, "x": "およそ五百枚の新しい画像が届きました。"}, {"t": 603.7666666666667, "x": "三回目は、一九七五年三月十六日。"}, {"t": 607.7833333333333, "x": "今度は、表面からおよそ三百三十キロメートルという、"}, {"t": 611.65, "x": "三回の中でいちばん近いところを通りました。"}, {"t": 614.8166666666667, "x": "NASAの記録では、このとき使える細長い帯状の"}, {"t": 618.25, "x": "写真が、およそ四百五十本得られています。"}, {"t": 621.4666666666667, "x": "一回目から三回目まで、およそ一年。"}, {"t": 624.3833333333333, "x": "そのあいだ、マリナー十号は、"}, {"t": 626.5333333333333, "x": "太陽の周りを二周しています。"}, {"t": 628.9, "x": "水星はその間に四周しています。"}, {"t": 631.35, "x": "コロンボの計算どおりに、二つの軌道は、"}, {"t": 634.2166666666667, "x": "決まった場所で重なり続けました。"}, {"t": 636.6333333333333, "x": "そして、三回目の通過から八日後の三月二十四日、"}, {"t": 640.5333333333333, "x": "マリナー十号は、機体の向きを保つための"}, {"t": 643.8333333333334, "x": "ガスを使い切り、運用を終えました。"}, {"t": 646.3833333333333, "x": "三回通過して、撮影できたのは、水星の"}, {"t": 649.8833333333333, "x": "表面のおよそ四割から四割五分でした。"}, {"t": 652.4666666666667, "x": "半分に届かなかった理由も、記録に残っています。"}, {"t": 656.0166666666667, "x": "百七十六日ごとに出会うということは、"}, {"t": 658.6, "x": "出会うたびに、水星と太陽と探査機の"}, {"t": 661.7166666666667, "x": "位置関係が、ほぼ同じになるということです。"}, {"t": 664.7166666666667, "x": "NASAの記録によると、二回目の通過で"}, {"t": 667.4333333333333, "x": "照らされていた半球は、一回目とほとんど同じでした。"}, {"t": 670.9833333333333, "x": "水星の、太陽に照らされた同じ側を、同じような"}, {"t": 675.0333333333333, "x": "角度から、繰り返し見ることになりました。"}, {"t": 677.85, "x": "何度も会える軌道だったからこそ、"}, {"t": 679.8333333333334, "x": "毎回、同じ面しか見られなかった。"}, {"t": 682.8333333333334, "x": "一つの工夫が、そのまま限界にもなっていました。"}, {"t": 686.2, "x": "照らされていない側、残りの半分以上が"}, {"t": 689.0666666666667, "x": "どうなっているのかは、分からないままでした。"}, {"t": 691.7833333333333, "x": "ESAの資料によると、マリナー十号が送ってきた"}, {"t": 695.0833333333334, "x": "水星の白黒画像は、二千三百枚を超えます。"}, {"t": 698.7, "x": "それが、それから三十年以上にわたって、人類が"}, {"t": 702.5166666666667, "x": "持っていた水星の間近の姿のほとんどすべてでした。"}, {"t": 705.6833333333333, "x": "運用を終えたマリナー十号が、その後、"}, {"t": 708.4, "x": "太陽の周りのどこを回っているのか。"}, {"t": 711.0666666666667, "x": "今回調べた一次資料の範囲では、"}, {"t": 713.3666666666667, "x": "それを追った記録は確認できていません。"}, {"t": 716.1166666666667, "x": "マリナー十号が運用を終えたのは、一九七五年三月です。"}, {"t": 720.85, "x": "次の水星探査機が打ち上げられるのは、"}, {"t": 723.3666666666667, "x": "二〇〇四年八月です。"}, {"t": 725.25, "x": "そのあいだ、およそ二十九年。"}, {"t": 727.6333333333333, "x": "水星へは、一機も向かいませんでした。"}, {"t": 730.4333333333333, "x": "水星のことを知りたいと考える"}, {"t": 732.4333333333333, "x": "研究者がいなかったわけではありません。"}, {"t": 734.7166666666667, "x": "NASAの記録には、マリナー十号の三回の"}, {"t": 737.6333333333333, "x": "通過のあと、研究者たちは、もっと長く、"}, {"t": 741.0, "x": "もっと詳しい調査を望んだ、と書かれています。"}, {"t": 744.5666666666667, "x": "問題は、はっきりしていました。"}, {"t": 746.85, "x": "通り過ぎるだけでは足りない。"}, {"t": 748.5833333333334, "x": "水星の周りを回って、全体を、"}, {"t": 751.2333333333333, "x": "何度も、時間をかけて調べる必要がある。"}, {"t": 754.5166666666667, "x": "けれども、周りを回るためには、第一章で見たとおり、"}, {"t": 758.55, "x": "とんでもない量のブレーキが必要になります。"}, {"t": 761.5166666666667, "x": "当時、その答えは、見つかっていませんでした。"}, {"t": 765.0333333333333, "x": "答えの一つを示したのが、NASAの"}, {"t": 767.4333333333333, "x": "ジェット推進研究所、JPLで軌道の"}, {"t": 770.5333333333333, "x": "設計をしていた研究者、チェンワン・イェンです。"}, {"t": 771.8166666666667, "x": "チェンワン・イェン█"}, {"t": 773.6333333333333, "x": "NASAの技術報告の記録に、イェンの論文が残っています。"}, {"t": 777.75, "x": "題名は、「金星と水星の重力を使った、"}, {"t": 780.9666666666667, "x": "弾道飛行による水星周回機のミッション」。"}, {"t": 784.1, "x": "アメリカ宇宙航行学会の論文番号は、八十五の三百四十六。"}, {"t": 789.2166666666667, "x": "記録上の登録は一九八六年です。"}, {"t": 792.4, "x": "この論文の要旨は、短いものです。"}, {"t": 795.2, "x": "NASAがすでに持っている打ち上げの"}, {"t": 796.9333333333333, "x": "手段と、化学燃料のロケットを使って、"}, {"t": 799.7833333333333, "x": "六百キログラムから二千キログラムの荷物を、"}, {"t": 802.9, "x": "水星の上空三百キロメートルの円い軌道に"}, {"t": 806.1, "x": "届けることができる、と書かれています。"}, {"t": 808.65, "x": "その方法として示されたのが、金星の重力を"}, {"t": 811.95, "x": "使い、さらに水星に近づくときの速さを"}, {"t": 814.9, "x": "落とす工夫を組み合わせることでした。"}, {"t": 816.9666666666667, "x": "考え方は、マリナー十号の延長にあります。"}, {"t": 820.3666666666667, "x": "マリナー十号は、金星の重力を借りて向きを変えました。"}, {"t": 824.35, "x": "イェンの案は、それを一回ではなく、何回も重ねます。"}, {"t": 828.6, "x": "金星のそばを通るたびに、少しずつ速さを落とす。"}, {"t": 832.2, "x": "水星のそばを通るたびに、水星に対する"}, {"t": 835.2833333333333, "x": "速さを、さらに少しずつ落とす。"}, {"t": 837.6666666666666, "x": "ブレーキを燃料だけでかけるのではなく、"}, {"t": 840.0166666666667, "x": "惑星の重力に少しずつ肩代わりしてもらう。"}, {"t": 843.3, "x": "燃料で一度に落とせない分を、時間をかけて、"}, {"t": 846.5666666666667, "x": "何度にも分けて落とす、という方法です。"}, {"t": 849.8333333333334, "x": "これには、代わりに差し出すものがあります。"}, {"t": 852.6666666666666, "x": "時間です。"}, {"t": 853.5333333333333, "x": "惑星のそばを通るためには、その惑星が、"}, {"t": 856.5833333333334, "x": "ちょうどいい位置に来るのを待たなければなりません。"}, {"t": 859.5666666666667, "x": "一回通過するごとに、次の通過まで、"}, {"t": 862.3833333333333, "x": "何か月も、ときには一年以上も、"}, {"t": 865.35, "x": "太陽の周りを回り続けることになります。"}, {"t": 868.3666666666667, "x": "燃料を減らせる代わりに、旅は何年にも延びます。"}, {"t": 871.9, "x": "論文には、一九九〇年から二〇一〇年までに"}, {"t": 875.65, "x": "打ち上げる場合の案が示されていました。"}, {"t": 878.0, "x": "惑星どうしの並び方は、毎年変わります。"}, {"t": 881.2333333333333, "x": "どの年に打ち上げれば、どの惑星の"}, {"t": 883.7666666666667, "x": "そばを、どの順番で通れるのか。"}, {"t": 886.1666666666666, "x": "それを、二十年ぶん先まで調べておく必要がありました。"}, {"t": 890.15, "x": "のちに実際に打ち上げられたメッセンジャーは、"}, {"t": 892.7333333333333, "x": "打ち上げのときの重さがおよそ千百キログラム。"}, {"t": 895.9666666666667, "x": "燃料を除いた機体の重さは、NASAの"}, {"t": 898.5833333333334, "x": "記録でおよそ四百八十五キログラムでした。"}, {"t": 901.3666666666667, "x": "ただし、実際のメッセンジャーが入ったのは、論文が"}, {"t": 905.1333333333333, "x": "想定した円い軌道ではなく、細長い楕円の軌道でした。"}, {"t": 909.0833333333334, "x": "その理由は、次の章で見ます。"}, {"t": 911.5333333333333, "x": "この論文が出たあとも、すぐに水星へ向かう"}, {"t": 914.5166666666667, "x": "計画が動き出したわけではありません。"}, {"t": 916.7333333333333, "x": "NASAがメッセンジャーを選んだのは、一九九九年です。"}, {"t": 920.9166666666666, "x": "論文の登録から、さらに十年以上がたっていました。"}, {"t": 924.6333333333333, "x": "その間、水星の地図は、半分に届かないままでした。"}, {"t": 928.8, "x": "一つの惑星について、その表面の"}, {"t": 931.45, "x": "半分以上が一度も間近で見られていない。"}, {"t": 934.0333333333333, "x": "それが、太陽系のいちばん内側の惑星に"}, {"t": 937.1833333333333, "x": "ついて、人類が持っていた記録の状態でした。"}, {"t": 940.3833333333333, "x": "地球からいちばん近い惑星の一つでありながら、"}, {"t": 943.3166666666667, "x": "いちばん見られていない惑星の一つでもあった。"}, {"t": 946.4166666666666, "x": "水星がそういう場所になったのは、遠いからでも、"}, {"t": 949.65, "x": "関心がなかったからでもありませんでした。"}, {"t": 952.3833333333333, "x": "行って、止まる方法が、"}, {"t": 954.1666666666666, "x": "まだ組み上がっていなかったからです。"}, {"t": 956.5, "x": "一九九九年に選ばれたその計画は、マリナー十号とは"}, {"t": 961.0666666666667, "x": "まったく違う旅をすることになります。"}, {"t": 963.2666666666667, "x": "まっすぐ水星に向かうのではなく、まず地球に"}, {"t": 966.35, "x": "戻り、金星を二回まわり、水星のそばを三回"}, {"t": 970.2166666666667, "x": "通り過ぎてから、ようやく止まる旅です。"}, {"t": 972.85, "x": "二〇〇四年八月三日、フロリダの"}, {"t": 972.85, "x": "二〇〇四年█"}, {"t": 975.4166666666666, "x": "ケープカナベラルから、デルタ"}, {"t": 977.3166666666667, "x": "二型ロケットが打ち上げられました。"}, {"t": 979.2666666666667, "x": "載っていたのは、NASAの"}, {"t": 980.8333333333334, "x": "水星探査機、メッセンジャーです。"}, {"t": 981.8833333333333, "x": "メッセンジャー█"}, {"t": 983.2666666666667, "x": "名前は、水星の表面、宇宙の環境、地球化学、"}, {"t": 987.8666666666667, "x": "距離の測定を意味する英語の頭文字を並べたものです。"}, {"t": 991.75, "x": "そして、英語で「使者」という意味にもなります。"}, {"t": 995.7666666666667, "x": "ローマ神話で、水星にあたる神は、"}, {"t": 998.35, "x": "神々の使者とされていました。"}, {"t": 1000.5166666666667, "x": "メッセンジャーを設計し、作ったのは、"}, {"t": 1003.1166666666667, "x": "ジョンズ・ホプキンス大学の応用物理研究所です。"}, {"t": 1006.55, "x": "研究所の記録によると、この研究所が"}, {"t": 1009.4666666666667, "x": "作った六十一機目の宇宙機でした。"}, {"t": 1011.6833333333333, "x": "打ち上げのときの重さは、NASAの"}, {"t": 1013.9, "x": "記録の一つでは、千九十三キログラム。"}, {"t": 1016.95, "x": "別の資料では、千百七・九キログラムとされていて、"}, {"t": 1020.85, "x": "数字に少し開きがあります。"}, {"t": 1022.9833333333333, "x": "どちらにしても、およそ千百キログラムです。"}, {"t": 1026.0333333333333, "x": "注目すべきは、その中身です。"}, {"t": 1028.5, "x": "NASAの記録によると、千九十三キログラムのうち、"}, {"t": 1032.05, "x": "六百七・八キログラムが、燃料と、"}, {"t": 1035.35, "x": "燃料を押し出すためのヘリウムでした。"}, {"t": 1037.85, "x": "機体の重さの半分以上が、燃料だったことになります。"}, {"t": 1041.7166666666667, "x": "それでも、燃料だけでは足りません。"}, {"t": 1044.3166666666666, "x": "第一章で見たとおり、水星で止まるためのブレーキを"}, {"t": 1047.8333333333333, "x": "燃料だけでかけることはできないからです。"}, {"t": 1050.25, "x": "メッセンジャーは、第三章で見た考え方、"}, {"t": 1053.2166666666667, "x": "惑星の重力にブレーキを肩代わりしてもらう"}, {"t": 1056.3166666666666, "x": "方法で、水星に向かいました。"}, {"t": 1058.65, "x": "NASAの記録に残る、その旅の順番は、次のとおりです。"}, {"t": 1062.9833333333333, "x": "二〇〇五年八月二日、地球。"}, {"t": 1065.5833333333333, "x": "打ち上げから一年後、メッセンジャーは、いったん地球の"}, {"t": 1069.3666666666666, "x": "そばに戻ってきて、地球の重力を借りました。"}, {"t": 1072.5666666666666, "x": "二〇〇六年十月二十四日、金星。"}, {"t": 1075.6333333333334, "x": "一回目の金星通過。"}, {"t": 1077.3, "x": "二〇〇七年六月五日、金星。"}, {"t": 1080.0166666666667, "x": "二回目の金星通過。"}, {"t": 1081.6833333333334, "x": "このときは、金星の表面から、"}, {"t": 1084.05, "x": "およそ三百四十キロメートルのところを通りました。"}, {"t": 1087.6166666666666, "x": "二〇〇八年一月十四日、水星。"}, {"t": 1090.65, "x": "一回目の水星通過。"}, {"t": 1092.35, "x": "マリナー十号から、およそ三十三年ぶりに、"}, {"t": 1095.55, "x": "探査機が水星のそばを通りました。"}, {"t": 1098.1166666666666, "x": "二〇〇八年十月六日、水星。"}, {"t": 1100.8833333333334, "x": "二回目の水星通過。"}, {"t": 1102.5833333333333, "x": "二〇〇九年九月二十九日、水星。"}, {"t": 1105.6833333333334, "x": "三回目の水星通過。"}, {"t": 1107.4833333333333, "x": "地球に一回、金星に二回、水星に三回。"}, {"t": 1111.4, "x": "合わせて六回、惑星のそばを通るたびに、"}, {"t": 1114.3833333333334, "x": "少しずつ、太陽の周りを回る速さと、"}, {"t": 1117.6833333333334, "x": "水星に対する速さを落としていきました。"}, {"t": 1120.5666666666666, "x": "NASAの記録によると、この旅の"}, {"t": 1122.8333333333333, "x": "道のりは、四十九億マイル。"}, {"t": 1125.2, "x": "およそ七十九億キロメートルです。"}, {"t": 1127.5833333333333, "x": "地球から水星までの距離の、百倍を超えます。"}, {"t": 1131.0333333333333, "x": "打ち上げから水星の周回軌道に"}, {"t": 1133.2, "x": "入るまで、六年半以上かかりました。"}, {"t": 1136.0333333333333, "x": "途中で三回、水星のそばを通っています。"}, {"t": 1139.2333333333333, "x": "それでも、そのたびに通り過ぎました。"}, {"t": 1141.9166666666667, "x": "まだ速すぎて、止まれなかったからです。"}, {"t": 1144.6666666666667, "x": "そして、二〇一一年三月十八日。"}, {"t": 1145.55, "x": "二〇一一年█"}, {"t": 1147.9666666666667, "x": "四回目に水星に近づいたとき、メッセンジャーは、"}, {"t": 1151.35, "x": "自分のエンジンを噴いて、最後のブレーキをかけました。"}, {"t": 1155.15, "x": "水星の重力が、ようやくメッセンジャーをつかまえました。"}, {"t": 1158.8666666666666, "x": "水星の周りを回る軌道に入った、"}, {"t": 1161.2, "x": "初めての探査機になりました。"}, {"t": 1163.4, "x": "入った軌道は、細長い楕円でした。"}, {"t": 1166.1, "x": "NASAの記録では、水星にいちばん近づくところで"}, {"t": 1169.35, "x": "高度二百キロメートル、いちばん離れるところで"}, {"t": 1172.4833333333333, "x": "一万五千キロメートルあまり。"}, {"t": 1174.3166666666666, "x": "一周はおよそ十二時間でした。"}, {"t": 1176.4, "x": "軌道は、水星の赤道に対して八十度傾いていました。"}, {"t": 1180.5666666666666, "x": "ほとんど、北極と南極の上を通る軌道です。"}, {"t": 1183.9833333333333, "x": "そして、いちばん水星に近づく場所は、"}, {"t": 1186.85, "x": "北緯六十度のあたりに置かれていました。"}, {"t": 1189.6, "x": "北半球を、低い高さから詳しく見るための配置です。"}, {"t": 1193.4333333333334, "x": "この軌道は、のちに変えられています。"}, {"t": 1196.05, "x": "NASAによると、二〇一二年四月までに、"}, {"t": 1198.95, "x": "一周の時間は十二時間から八時間に縮められました。"}, {"t": 1202.8333333333333, "x": "一日に水星へ近づく回数は、"}, {"t": 1205.0833333333333, "x": "二回から三回に増えたことになります。"}, {"t": 1207.8, "x": "この軌道の形にも、理由があります。"}, {"t": 1210.5666666666666, "x": "水星の表面は、太陽に焼かれて高温になり、"}, {"t": 1213.9833333333333, "x": "その熱を宇宙に向かって照り返しています。"}, {"t": 1216.9, "x": "水星のすぐ近くを回り続けると、太陽からの熱と、"}, {"t": 1220.7833333333333, "x": "水星からの熱の両方を浴びることになります。"}, {"t": 1223.9666666666667, "x": "細長い軌道にすれば、水星に近づいているのは"}, {"t": 1227.3333333333333, "x": "一周のうち短い時間だけで、残りの時間は、"}, {"t": 1230.6166666666666, "x": "水星から離れて機体を冷ますことができます。"}, {"t": 1233.7, "x": "機体そのものにも、熱への備えがありました。"}, {"t": 1236.8166666666666, "x": "メッセンジャーの前には、常に太陽の側を向く、"}, {"t": 1240.1166666666666, "x": "大きな日よけが取り付けられていました。"}, {"t": 1242.75, "x": "NASAの記録では、高さおよそ二・"}, {"t": 1245.0166666666667, "x": "五メートル、幅およそ二メートル。"}, {"t": 1247.6, "x": "研究所の記録によると、セラミックの布でできていました。"}, {"t": 1251.5333333333333, "x": "機体の本体は、この日よけの"}, {"t": 1253.6833333333334, "x": "影の中に入るように作られていました。"}, {"t": 1256.1333333333334, "x": "太陽電池パネルにも、工夫がありました。"}, {"t": 1259.05, "x": "研究所の記録によると、パネルの三分の二が"}, {"t": 1262.25, "x": "鏡になっていて、熱を反射するようになっていました。"}, {"t": 1265.8166666666666, "x": "太陽の光が強すぎる場所では、電池を全面に並べると、"}, {"t": 1269.9833333333333, "x": "パネルそのものが熱くなりすぎるからです。"}, {"t": 1272.6833333333334, "x": "日よけの陰に機体を隠し、電池の大部分を"}, {"t": 1275.9166666666667, "x": "鏡にし、細長い軌道で熱から逃げる時間を作る。"}, {"t": 1279.75, "x": "六年半の旅と、それだけの備えが、"}, {"t": 1282.5, "x": "水星の周りにとどまるために必要でした。"}, {"t": 1285.5, "x": "打ち上げで持っていった重さの半分以上は燃料で、"}, {"t": 1288.6166666666666, "x": "その燃料は、ほとんどがブレーキのために使われました。"}, {"t": 1292.5333333333333, "x": "メッセンジャーの旅は、どこかへ急ぐための旅ではなく、"}, {"t": 1296.0666666666666, "x": "速くなりすぎないようにするための旅でした。"}, {"t": 1299.05, "x": "水星の周りを回り始めたメッセンジャーは、"}, {"t": 1301.7666666666667, "x": "撮影を続けました。"}, {"t": 1303.5166666666667, "x": "NASAの記録によると、最初の一年の"}, {"t": 1306.1333333333334, "x": "主な観測を終えた二〇一二年三月の時点で、"}, {"t": 1309.25, "x": "撮った画像はおよそ十万枚。"}, {"t": 1311.3833333333334, "x": "二〇一四年二月には、周回中に撮った"}, {"t": 1314.4333333333334, "x": "画像が二十万枚に達しました。"}, {"t": 1316.5166666666667, "x": "NASAは、当初の見込みは"}, {"t": 1318.2833333333333, "x": "少なくとも千枚だった、と書いています。"}, {"t": 1321.0333333333333, "x": "NASAの別の記録では、最終的に"}, {"t": 1323.5833333333333, "x": "送られてきた写真は、およそ三十万枚。"}, {"t": 1326.6, "x": "データは十テラバイトを超えました。"}, {"t": 1328.6833333333334, "x": "マリナー十号が送ってきた水星の"}, {"t": 1330.8666666666666, "x": "画像は、二千三百枚あまりでした。"}, {"t": 1333.55, "x": "その百倍を超える写真が、四年あまりのあいだに"}, {"t": 1336.8833333333334, "x": "届いたことになります。"}, {"t": 1338.25, "x": "そして、マリナー十号の時代には見られなかった"}, {"t": 1341.4166666666667, "x": "残りの半分も、撮影されました。"}, {"t": 1344.0166666666667, "x": "水星の表面の全体が、初めて一つの地図になりました。"}, {"t": 1348.1666666666667, "x": "ただ、水星には、それでも写らない場所がありました。"}, {"t": 1352.0833333333333, "x": "水星の北極の近くには、クレーターの底が、"}, {"t": 1355.3666666666666, "x": "一年を通して一度も太陽の光に当たらない場所があります。"}, {"t": 1359.5166666666667, "x": "NASAの惑星データによると、"}, {"t": 1361.2, "x": "水星の自転の軸の傾きは、〇・〇三四度。"}, {"t": 1365.3333333333333, "x": "ほとんど傾いていません。"}, {"t": 1366.9833333333333, "x": "そのため、極の近くの深い穴の底には、"}, {"t": 1370.0, "x": "太陽の光が低い角度からしか届かず、"}, {"t": 1372.95, "x": "影になったままの部分が残ります。"}, {"t": 1375.4166666666667, "x": "NASAの記録によると、メッセンジャーは、"}, {"t": 1377.9166666666667, "x": "二〇一二年、この永久に影になる場所に、"}, {"t": 1381.5, "x": "水の氷と有機物があることを見つけました。"}, {"t": 1384.5833333333333, "x": "太陽にいちばん近い惑星に、氷がある。"}, {"t": 1387.7333333333333, "x": "それが、水星の周りを回った探査機が"}, {"t": 1390.5333333333333, "x": "残した、大きな発見の一つでした。"}, {"t": 1393.2333333333333, "x": "太陽の光が一度も届かない場所に、氷がある。"}, {"t": 1396.8333333333333, "x": "そこは、光で写すことのできない場所でもあります。"}, {"t": 1400.3, "x": "見つかったのは、氷だけではありません。"}, {"t": 1403.0, "x": "NASAによると、メッセンジャーは、"}, {"t": 1405.0666666666666, "x": "水星の夜の側に、マグネシウムとカルシウムが"}, {"t": 1408.6833333333334, "x": "多く集まっていることを見つけました。"}, {"t": 1410.7833333333333, "x": "もう一つは、磁場です。"}, {"t": 1412.6333333333334, "x": "水星には、地球と同じように、自分の磁場があります。"}, {"t": 1416.7666666666667, "x": "メッセンジャーが周回しながら測ったところ、その磁場の"}, {"t": 1420.2333333333333, "x": "中心は、水星の中心から北へ大きくずれていました。"}, {"t": 1424.1333333333334, "x": "NASAは、これを大きな発見の一つとして記録しています。"}, {"t": 1427.9166666666667, "x": "JAXAは、次の探査機の目的の一つに、"}, {"t": 1430.8666666666666, "x": "水星の磁場の解明を挙げています。"}, {"t": 1433.4833333333333, "x": "観測は、予定より長く続きました。"}, {"t": 1436.25, "x": "一年の予定だった観測は、二回延長されました。"}, {"t": 1439.9166666666667, "x": "けれども、周回を続けるあいだにも、"}, {"t": 1442.4833333333333, "x": "メッセンジャーは、少しずつ燃料を使っていました。"}, {"t": 1446.1, "x": "水星の周りを回る探査機には、"}, {"t": 1448.2333333333333, "x": "太陽の重力が常に働いています。"}, {"t": 1451.0, "x": "太陽の重力に引かれて、軌道の形は少しずつ"}, {"t": 1454.5166666666667, "x": "変わり、水星にいちばん近づく高さが、"}, {"t": 1457.2833333333333, "x": "少しずつ下がっていきます。"}, {"t": 1459.1666666666667, "x": "放っておけば、いずれ水星の表面にぶつかります。"}, {"t": 1462.7, "x": "それを防ぐためには、ときどきエンジンを"}, {"t": 1465.3333333333333, "x": "噴いて、高さを持ち上げ直す必要がありました。"}, {"t": 1468.6666666666667, "x": "水星の周りにとどまるためには、とどまったあとも、"}, {"t": 1471.9833333333333, "x": "燃料を払い続けなければなりませんでした。"}, {"t": 1474.9666666666667, "x": "NASAの発表によると、メッセンジャーは、"}, {"t": 1477.5666666666666, "x": "最後の軌道修正を繰り返したあと、燃料が尽きました。"}, {"t": 1481.8833333333334, "x": "高さを持ち上げる燃料がなくなれば、"}, {"t": 1484.2, "x": "太陽の重力に逆らう手段はありません。"}, {"t": 1487.1, "x": "二〇一五年四月三十日。"}, {"t": 1487.1, "x": "二〇一五年█"}, {"t": 1489.3, "x": "アメリカ東部時間の午後三時二十六分、"}, {"t": 1491.9, "x": "メッセンジャーは、水星の表面に落ちました。"}, {"t": 1495.3166666666666, "x": "事前に予定されていたとおりの落下でした。"}, {"t": 1497.85, "x": "衝突したときの速さは、NASAによると、"}, {"t": 1500.65, "x": "時速およそ一万四千八十キロメートル。"}, {"t": 1503.7833333333333, "x": "午後三時四十分。"}, {"t": 1505.25, "x": "地上の管制室で、メッセンジャーからの信号が、"}, {"t": 1508.55, "x": "予定の時刻になっても戻ってこないことが確認されました。"}, {"t": 1512.35, "x": "それが、運用の終わりでした。"}, {"t": 1514.6166666666666, "x": "NASAの発表によると、メッセンジャーは、"}, {"t": 1517.2333333333333, "x": "水星の周りを四千百五回まわりました。"}, {"t": 1520.4, "x": "落ちた場所には、幅およそ十五メートルの"}, {"t": 1523.15, "x": "新しいクレーターができたと推定されています。"}, {"t": 1525.95, "x": "打ち上げから、およそ十年九か月。"}, {"t": 1528.7166666666667, "x": "そのうち六年半あまりが、水星まで行って"}, {"t": 1531.6666666666667, "x": "止まるための旅でした。"}, {"t": 1533.0166666666667, "x": "水星の周りにいたのは、四年あまりです。"}, {"t": 1536.0166666666667, "x": "メッセンジャーは、いまも水星の表面にあります。"}, {"t": 1539.3166666666666, "x": "自分で作ったくぼみの中に、そのまま置かれています。"}, {"t": 1542.9, "x": "回収に行く予定はありません。"}, {"t": 1544.85, "x": "ここで、水星へ行った探査機の記録は、また途切れます。"}, {"t": 1548.9833333333333, "x": "メッセンジャーが落ちてから、次の探査機が"}, {"t": 1551.6333333333334, "x": "水星のそばに来るまで、およそ六年半かかりました。"}, {"t": 1555.2166666666667, "x": "次にやってきたのは、ヨーロッパと"}, {"t": 1557.4166666666667, "x": "日本が一緒に作った、二機の探査機でした。"}, {"t": 1560.55, "x": "二〇一八年十月二十日、日本時間の午前十時四十五分。"}, {"t": 1560.55, "x": "二〇一八年█"}, {"t": 1565.2166666666667, "x": "南アメリカのフランス領ギアナから、"}, {"t": 1567.4333333333334, "x": "アリアン五型ロケットが打ち上げられました。"}, {"t": 1570.2666666666667, "x": "載っていたのは、ヨーロッパ宇宙機関、ESAと、"}, {"t": 1573.6666666666667, "x": "日本の宇宙航空研究開発機構、JAXAが共同で"}, {"t": 1577.9666666666667, "x": "進めてきた水星探査計画、ベピコロンボです。"}, {"t": 1579.8666666666666, "x": "ベピコロンボ█"}, {"t": 1581.3833333333334, "x": "名前は、第二章に出てきた、マリナー十号の"}, {"t": 1584.9333333333334, "x": "軌道を考えたジュゼッペ・コロンボからとられています。"}, {"t": 1587.8833333333334, "x": "ベピコロンボは、一機の探査機ではありません。"}, {"t": 1590.9166666666667, "x": "三つの部分を縦に積み重ねた、"}, {"t": 1592.9833333333333, "x": "一つのかたまりとして打ち上げられました。"}, {"t": 1595.6666666666667, "x": "一つめは、ESAの水星表面探査機、MPO。"}, {"t": 1599.8833333333334, "x": "水星の表面と内部を調べる機体です。"}, {"t": 1602.6333333333334, "x": "ESAの資料では、重さはおよそ千二百三十キログラム。"}, {"t": 1606.65, "x": "そのうち観測装置は八十五キログラムです。"}, {"t": 1609. const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
