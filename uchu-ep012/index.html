<script>
const D={"name": "ep012", "file": "ep012", "dur": 1945.11665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇一九年十一月十三日、日本時間の午前十時五分。"}, {"t": 4.866666666666666, "x": "探査機はやぶさ２は、小惑星リュウグウの"}, {"t": 5.3, "x": "はやぶさ２█"}, {"t": 6.716666666666667, "x": "リュウグウ█"}, {"t": 7.7, "x": "そばを離れました。"}, {"t": 8.866666666666667, "x": "到着してから、一年五か月近くがたっていました。"}, {"t": 12.5, "x": "出発の十分後に撮られた一枚には、黒く、こまのような"}, {"t": 16.866666666666667, "x": "形をした小惑星が、まだ大きく写っています。"}, {"t": 20.3, "x": "この探査機が地球に届けたのは、小さなカプセル一つです。"}, {"t": 24.333333333333332, "x": "カプセルは、二〇二〇年十二月六日に地球へ戻りました。"}, {"t": 28.583333333333332, "x": "よく語られるのは、そちらの話です。"}, {"t": 31.333333333333332, "x": "リュウグウの地面に二度降りて、"}, {"t": 33.0, "x": "砂や石を取ってきた、という話です。"}, {"t": 36.083333333333336, "x": "けれども、出発の日のリュウグウには、"}, {"t": 38.56666666666667, "x": "探査機が地球から運んできて、そのまま"}, {"t": 41.68333333333333, "x": "残していったものが、いくつもありました。"}, {"t": 44.28333333333333, "x": "白いボールのような目印が、四つ。"}, {"t": 47.016666666666666, "x": "跳ねて動くように作られた、小さな機械が、三台。"}, {"t": 51.03333333333333, "x": "電池だけで動く着陸機が、一台。"}, {"t": 53.86666666666667, "x": "そして、わざとぶつけた銅の"}, {"t": 55.88333333333333, "x": "かたまりと、そのぶつかった跡。"}, {"t": 58.11666666666667, "x": "どれも、リュウグウの上で使い"}, {"t": 60.06666666666667, "x": "切るために積まれてきたものでした。"}, {"t": 61.95, "x": "それより十四年前、同じ日本の探査機が、"}, {"t": 65.16666666666667, "x": "別の小惑星に残してきたものもあります。"}, {"t": 68.16666666666667, "x": "そちらには、残すつもりだったのに"}, {"t": 70.43333333333334, "x": "残せなかったものと、残したつもりで、実は"}, {"t": 73.8, "x": "残っていなかったものが混じっています。"}, {"t": 75.88333333333334, "x": "この回では、持ち帰ったものではなく、置いてきたものを"}, {"t": 79.81666666666666, "x": "数えます。"}, {"t": 80.53333333333333, "x": "一つずつ、置いた日と、置いた"}, {"t": 82.98333333333333, "x": "理由と、いまどこにあるのかを、"}, {"t": 85.15, "x": "公開されている記録の範囲でたどります。"}, {"t": 87.96666666666667, "x": "最初の小惑星は、イトカワです。"}, {"t": 89.4, "x": "イトカワ█"}, {"t": 90.66666666666667, "x": "大きさは、長い方向で五百三十五メートル、"}, {"t": 93.98333333333333, "x": "短い方向で二百九メートルほど。"}, {"t": 96.71666666666667, "x": "細長い形をした、小さな天体です。"}, {"t": 99.75, "x": "初代の探査機はやぶさは、二〇〇三年五月九日に"}, {"t": 100.68333333333334, "x": "はやぶさ█"}, {"t": 103.33333333333333, "x": "打ち上げられ、二〇〇五年九月十二日に、"}, {"t": 106.31666666666666, "x": "イトカワのそばに着きました。"}, {"t": 108.26666666666667, "x": "燃料を積んだ状態での重さは、五百十キログラムほど。"}, {"t": 112.26666666666667, "x": "地球からおよそ三億キロメートル離れた場所で、"}, {"t": 115.13333333333334, "x": "探査機は、自分の目と判断を頼りに動く必要がありました。"}, {"t": 119.6, "x": "この探査機は、一つの小さな機械を積んでいました。"}, {"t": 123.16666666666667, "x": "名前は、ミネルバ。"}, {"t": 123.9, "x": "ミネルバ█"}, {"t": 124.83333333333333, "x": "小惑星の表面を跳ねて動くように"}, {"t": 127.18333333333334, "x": "作られた、小さな探査ロボットです。"}, {"t": 129.73333333333332, "x": "カメラを三台、光を測る部品を六個、"}, {"t": 132.73333333333332, "x": "温度を測る部品を十個、積んでいました。"}, {"t": 136.06666666666666, "x": "イトカワの重力は、とても弱いものです。"}, {"t": 138.98333333333332, "x": "地球のように、物を落とせば下に着く、とは限りません。"}, {"t": 143.18333333333334, "x": "ミネルバは、表面すれすれまで近づいてから、"}, {"t": 146.21666666666667, "x": "そっと手放す必要がありました。"}, {"t": 148.53333333333333, "x": "投下の日は、二〇〇五年十一月十二日です。"}, {"t": 152.1, "x": "この日、探査機は午前三時に、高度一・"}, {"t": 155.35, "x": "四キロメートルほどから降り始めました。"}, {"t": 157.86666666666667, "x": "いちばん低いところで、高度は五十五メートルほどでした。"}, {"t": 161.61666666666667, "x": "ミネルバを切り離す指令は、"}, {"t": 163.33333333333334, "x": "地上の管制を経由して送られました。"}, {"t": 166.18333333333334, "x": "そのため、実際に切り離されるまでに十数分かかり、"}, {"t": 169.9, "x": "そのあいだに探査機の位置はずれていきました。"}, {"t": 172.76666666666668, "x": "切り離しは、日本時間の午後三時二十四分に行われました。"}, {"t": 177.28333333333333, "x": "そのときの高度は、二百メートル近くになっていました。"}, {"t": 180.96666666666667, "x": "しかも探査機は、重力に負けないよう小さな噴射を"}, {"t": 184.46666666666667, "x": "繰り返していて、ちょうど上に向かう速さを"}, {"t": 187.26666666666668, "x": "持った瞬間に、手を放すことになりました。"}, {"t": 190.16666666666666, "x": "切り離しそのものは、うまくいっていました。"}, {"t": 193.0, "x": "探査機とミネルバの両方から届いた信号で"}, {"t": 195.65, "x": "確かめられ、探査機の障害物を見張る装置も、"}, {"t": 199.06666666666666, "x": "ミネルバが離れていくのをとらえていました。"}, {"t": 201.78333333333333, "x": "ただ、ミネルバは、イトカワの表面に降りませんでした。"}, {"t": 205.68333333333334, "x": "JAXAの発表は、こう書いています。"}, {"t": 208.26666666666668, "x": "残念ながら、ミネルバをイトカワ表面に"}, {"t": 211.05, "x": "とどめることはできなかった模様です。"}, {"t": 213.18333333333334, "x": "それでも、ミネルバは働きました。"}, {"t": 215.75, "x": "回りながら離れていく途中で、ミネルバは、"}, {"t": 218.7, "x": "探査機の方にカメラを向けていました。"}, {"t": 221.3, "x": "届いた一枚には、太陽電池の板の先にある"}, {"t": 224.56666666666666, "x": "金具と、裏側を走る白い配線が写っていました。"}, {"t": 228.25, "x": "打ち上げ前の整備のときに撮られた写真と見比べて、"}, {"t": 231.41666666666666, "x": "たしかにはやぶさの板だと確かめられています。"}, {"t": 232.0, "x": "はやぶさ█"}, {"t": 234.41666666666666, "x": "探査機の側からも、切り離しの"}, {"t": 236.7, "x": "二百十二秒後に、小さな点が撮られました。"}, {"t": 239.85, "x": "複数の画素にまたがる点で、"}, {"t": 241.66666666666666, "x": "ミネルバと思われる物体とされています。"}, {"t": 244.4, "x": "ミネルバからの電波は、十八時間、途切れずに届きました。"}, {"t": 248.83333333333334, "x": "中の温度は、切り離したあとも上がり続けていました。"}, {"t": 252.43333333333334, "x": "イトカワの表面から出る熱を"}, {"t": 254.31666666666666, "x": "受けていたためと考えられています。"}, {"t": 256.31666666666666, "x": "十八時間後、電波は届かなくなりました。"}, {"t": 259.51666666666665, "x": "アンテナの向きの問題ではないか、と"}, {"t": 262.01666666666665, "x": "当時の記事は書いています。"}, {"t": 263.6333333333333, "x": "その後、ミネルバがどこをどう回っているのかを示す観測の"}, {"t": 267.45, "x": "記録は、公開されている資料の中には見当たりません。"}, {"t": 271.1166666666667, "x": "小惑星の上に置くはずだった最初の機械は、"}, {"t": 273.95, "x": "表面に触れないまま、離れていきました。"}, {"t": 277.03333333333336, "x": "置いてくる、ということは、"}, {"t": 278.8333333333333, "x": "手を放すだけでは済まない作業でした。"}, {"t": 281.5, "x": "ミネルバの八日後、はやぶさは、"}, {"t": 282.76666666666665, "x": "はやぶさ█"}, {"t": 283.71666666666664, "x": "もう一つのものをイトカワへ落としました。"}, {"t": 286.4, "x": "ターゲットマーカと呼ばれる目印です。"}, {"t": 286.4, "x": "ターゲットマーカ█"}, {"t": 288.73333333333335, "x": "目印が要る理由は、イトカワの形にあります。"}, {"t": 292.06666666666666, "x": "表面は岩だらけで、平らな場所がほとんどありません。"}, {"t": 295.7, "x": "そこへ降りていく探査機は、自分がどれくらい"}, {"t": 298.6166666666667, "x": "横に流れているのかを、自分で知る必要があります。"}, {"t": 302.0833333333333, "x": "そこで、先に目印を落とします。"}, {"t": 304.76666666666665, "x": "目印は光をよく跳ね返す素材で包まれていて、"}, {"t": 307.95, "x": "探査機が閃光を当てると、明るく光ります。"}, {"t": 311.46666666666664, "x": "探査機は、その光る点を目で追いながら、"}, {"t": 314.23333333333335, "x": "ずれを直して降りていく仕組みです。"}, {"t": 316.65, "x": "大きさは、ソフトボールほどです。"}, {"t": 318.98333333333335, "x": "中には、打ち上げ前に募った人々の名前を"}, {"t": 322.1166666666667, "x": "刻んだ膜も入っていましたが、この章で"}, {"t": 324.8666666666667, "x": "追うのは、目印としての働きのほうです。"}, {"t": 327.73333333333335, "x": "この目印の使い方は、リハーサルのときに、"}, {"t": 330.8333333333333, "x": "切り離すところまでは試してありました。"}, {"t": 333.5, "x": "けれども、光る目印を探査機が自分で"}, {"t": 336.31666666666666, "x": "撮りながら、その方向へ自分を導いていく。"}, {"t": 339.5, "x": "その本番は、この日が初めてでした。"}, {"t": 342.23333333333335, "x": "投下は、二〇〇五年十一月二十日の明け方です。"}, {"t": 345.81666666666666, "x": "前の晩の九時ごろ、探査機は高度"}, {"t": 348.4166666666667, "x": "一キロメートルほどから降り始めました。"}, {"t": 350.73333333333335, "x": "降りる速さは、秒速数センチメートル。"}, {"t": 353.6, "x": "当時の記事は、アリの歩く速さほどの"}, {"t": 356.25, "x": "制御だ、と書いています。"}, {"t": 358.0833333333333, "x": "高度五十四メートルで、目印を探査機の底に"}, {"t": 361.46666666666664, "x": "つないでいたワイヤーが、カッターで切られました。"}, {"t": 364.35, "x": "目印は、ゆっくりと落ちていきました。"}, {"t": 367.01666666666665, "x": "探査機はそれを撮り続けていました。"}, {"t": 369.25, "x": "分離のおよそ三分後、高度三十数メートルから撮った"}, {"t": 372.95, "x": "画像には、太陽の光を受けて光る丸い目印が写っています。"}, {"t": 377.26666666666665, "x": "そのすぐ横には、探査機の影と、"}, {"t": 379.75, "x": "目印自身の小さな影も並んでいました。"}, {"t": 382.8, "x": "目印が表面に着いたのは、切り離しから"}, {"t": 385.75, "x": "およそ六分後とされています。"}, {"t": 387.5, "x": "目印を離したあとも、探査機は降り続けました。"}, {"t": 390.95, "x": "高度三十五メートルからは、それまで"}, {"t": 393.46666666666664, "x": "使っていたレーザー高度計をやめ、近い"}, {"t": 396.21666666666664, "x": "距離専用のレーザー距離計に切り替えます。"}, {"t": 398.73333333333335, "x": "四本の光を斜め下へ出して、地面の傾きまで測る装置です。"}, {"t": 403.3833333333333, "x": "これを使って降りるのも、初めての経験でした。"}, {"t": 406.68333333333334, "x": "高度二十五メートルでは、その場に"}, {"t": 409.1166666666667, "x": "浮いたまま止まることもできました。"}, {"t": 410.98333333333335, "x": "この日の着陸は、予定どおりには進みませんでした。"}, {"t": 414.6166666666667, "x": "探査機は、表面の近くまで降りたあと、"}, {"t": 417.45, "x": "上がるはずの時刻になっても上がりませんでした。"}, {"t": 420.5, "x": "ゆっくり降りる動きが続き、およそ三十分、"}, {"t": 423.6666666666667, "x": "表面のすぐ近くにとどまりました。"}, {"t": 426.23333333333335, "x": "地面は百度を超える熱さだったとされます。"}, {"t": 428.9166666666667, "x": "地上からの指令で、探査機は強引に上昇させられました。"}, {"t": 432.98333333333335, "x": "探査機は、身を守るための姿勢に入ったまま、"}, {"t": 436.1, "x": "イトカワから遠ざかっていきました。"}, {"t": 438.4166666666667, "x": "一時は、百キロメートルほど離れたところまで"}, {"t": 441.45, "x": "飛び去っていたとされています。"}, {"t": 443.0833333333333, "x": "一週間かけて、元の位置に戻されました。"}, {"t": 446.23333333333335, "x": "一回目の着陸がどうなったかは、"}, {"t": 448.28333333333336, "x": "しばらく分かりませんでした。"}, {"t": 450.23333333333335, "x": "六日後の十一月二十六日、探査機は"}, {"t": 453.45, "x": "二回目の降下に入りました。"}, {"t": 455.25, "x": "その途中、午前六時二十四分に撮られた画像の"}, {"t": 458.75, "x": "中に、白く光る点が一つ、写っていました。"}, {"t": 462.35, "x": "二十日に落とした目印です。"}, {"t": 464.2, "x": "JAXAの記事は、投下前に撮った"}, {"t": 466.43333333333334, "x": "同じ場所の画像と並べて、赤い丸の中の"}, {"t": 469.55, "x": "白く光る点を、その目印だと示しています。"}, {"t": 472.8666666666667, "x": "目印が落ちた場所は、ミューゼスの海と"}, {"t": 474.4, "x": "ミューゼスの海█"}, {"t": 475.53333333333336, "x": "呼ばれる、小石の多い平らな一帯の近くです。"}, {"t": 478.81666666666666, "x": "当時の記事は、目印はイトカワの上に、"}, {"t": 481.68333333333334, "x": "半永久的にとどまることになる、と書いています。"}, {"t": 485.4166666666667, "x": "イトカワに置かれた人工物のうち、置いたあとに"}, {"t": 488.6, "x": "写真で居場所が確かめられたのは、この目印です。"}, {"t": 492.01666666666665, "x": "二回目の降下では、新しい目印は落とされませんでした。"}, {"t": 496.0833333333333, "x": "理由は、一回目の目印が、すでに降りる先の"}, {"t": 499.71666666666664, "x": "すぐ近くにあったからです。"}, {"t": 501.26666666666665, "x": "もう一つ落とせば、探査機の"}, {"t": 503.35, "x": "カメラには光る点が二つ映ります。"}, {"t": 505.6333333333333, "x": "どちらを追えばよいのか、探査機が"}, {"t": 508.0, "x": "取り違えるおそれがありました。"}, {"t": 509.76666666666665, "x": "すでにある目印を確実に見分けられる"}, {"t": 512.25, "x": "保証もありませんでした。"}, {"t": 513.7, "x": "そのため、目印は使わない、と決められました。"}, {"t": 517.4, "x": "先に置いた一つが、"}, {"t": 518.6833333333333, "x": "次の一つを置かせなかったことになります。"}, {"t": 521.5333333333333, "x": "二回目の降下で大事だったのは、弾丸です。"}, {"t": 524.7166666666667, "x": "はやぶさの試料の取り方は、こうでした。"}, {"t": 524.7166666666667, "x": "はやぶさ█"}, {"t": 527.5666666666667, "x": "探査機の下から、ラッパのような筒が伸びています。"}, {"t": 530.9833333333333, "x": "筒の先が地面に触れると、その瞬間に、筒の"}, {"t": 534.6666666666666, "x": "中から地面へ向けて、小さな弾丸を撃ち込みます。"}, {"t": 538.1333333333333, "x": "弾丸は、直径十ミリメートル、重さ五グラム。"}, {"t": 541.9333333333333, "x": "砕けて舞い上がったかけらを、筒の奥で"}, {"t": 544.5166666666667, "x": "受け止め、一秒ほどで上昇に移る設計でした。"}, {"t": 548.0, "x": "二回目の降下では、途中で止まらないように、"}, {"t": 551.05, "x": "手順も変えられていました。"}, {"t": 552.9333333333333, "x": "一回目は、障害物を感じ取る装置が何かの"}, {"t": 556.2666666666667, "x": "光に反応して、手順を打ち切っていました。"}, {"t": 559.2666666666667, "x": "二回目は、その信号では止まらないことにしました。"}, {"t": 562.7666666666667, "x": "レーザーで距離を測る装置への"}, {"t": 564.5666666666667, "x": "切り替えも、より低い高度に下げました。"}, {"t": 567.3166666666667, "x": "十一月二十六日、日本時間の午前七時七分ごろ、"}, {"t": 571.7, "x": "探査機は地面に触れました。"}, {"t": 573.75, "x": "地面に触れたときの速さは、"}, {"t": 575.4333333333333, "x": "秒速十センチメートルほどと見積もられています。"}, {"t": 578.7, "x": "直後にまとめられた報告は、こう書いています。"}, {"t": 581.9333333333333, "x": "筒の変形で着陸を知り、二本の発射装置から弾丸を撃ち、"}, {"t": 586.3166666666667, "x": "ただちに秒速五十センチメートルで離れた。"}, {"t": 589.3833333333333, "x": "探査機に残された記録から、"}, {"t": 591.1333333333333, "x": "発射の指令が出されたことが分かった、と。"}, {"t": 594.35, "x": "この時点では、弾丸は撃たれたものと考えられていました。"}, {"t": 598.2, "x": "ところが、その後の詳しい調べで、見方が変わります。"}, {"t": 602.2333333333333, "x": "JAXAがまとめた資料には、二回目の着陸について、"}, {"t": 605.8166666666667, "x": "弾丸の発射は指令されたが、プログラムの問題で、"}, {"t": 609.6166666666667, "x": "おそらく撃たれなかった、と書かれています。"}, {"t": 612.6166666666667, "x": "一回目の着陸は、障害物を感じ取った"}, {"t": 615.6833333333333, "x": "探査機が、手順を途中で打ち切っていました。"}, {"t": 618.6, "x": "イトカワの表面に打ち込まれるはずだった弾丸は、"}, {"t": 621.4833333333333, "x": "たぶん、発射装置の中に入ったままでした。"}, {"t": 624.8666666666667, "x": "この探査機は、その後も不具合に見舞われ、"}, {"t": 627.7333333333333, "x": "イトカワを離れたのは二〇〇七年四月二十五日です。"}, {"t": 631.5, "x": "地球に戻ったのは、二〇一〇年六月十三日でした。"}, {"t": 635.4, "x": "それでも、試料の望みが消えたわけではありませんでした。"}, {"t": 639.1166666666667, "x": "着陸のあいだに、筒の先が地面の細かい粒を"}, {"t": 642.5166666666667, "x": "跳ね上げ、そのごく一部が中に入った"}, {"t": 645.1166666666667, "x": "可能性がある、と資料は書いています。"}, {"t": 647.75, "x": "置いてくるつもりだったものが、置いてこられなかった。"}, {"t": 651.0666666666667, "x": "その記録も、この小惑星の記録の一部です。"}, {"t": 654.4833333333333, "x": "イトカワに残ったとはっきり言えるものは、"}, {"t": 656.7833333333333, "x": "光る目印一つです。"}, {"t": 658.65, "x": "十三年後、次の探査機が、別の小惑星に着きました。"}, {"t": 663.1666666666666, "x": "はやぶさ２は、二〇一四年十二月三日に打ち上げられ、"}, {"t": 663.1666666666666, "x": "はやぶさ２█"}, {"t": 666.9666666666667, "x": "二〇一八年六月二十七日に、リュウグウに着きました。"}, {"t": 671.35, "x": "重さは、およそ六百九キログラムです。"}, {"t": 674.3, "x": "リュウグウは、地球からの観測では、"}, {"t": 676.7, "x": "差し渡し九百メートルほど、七時間半"}, {"t": 680.05, "x": "あまりで一回転すると見積もられていました。"}, {"t": 682.5333333333333, "x": "光をあまり跳ね返さない、黒っぽい天体です。"}, {"t": 685.9, "x": "水や有機物を含む物質があると考えられていたことが、"}, {"t": 689.45, "x": "行き先に選ばれた理由の一つでした。"}, {"t": 692.1, "x": "近づいてみると、そろばんの玉のような形をしていました。"}, {"t": 695.9833333333333, "x": "置いていく機械は、前回より増えていました。"}, {"t": 699.0166666666667, "x": "跳ねて動く小さな機械、ミネルバ・ツーが三台。"}, {"t": 700.7, "x": "ミネルバ・ツー█"}, {"t": 702.3833333333333, "x": "ドイツとフランスが作った着陸機が一台。"}, {"t": 705.05, "x": "どれも、表面に置いたら、それきりです。"}, {"t": 708.2, "x": "最初に降ろされたのは、二台の小さな機械です。"}, {"t": 711.6, "x": "二〇一八年九月二十一日、日本時間の午後一時六分。"}, {"t": 716.3, "x": "探査機は、高度五十五メートルほどまで"}, {"t": 719.0, "x": "降りて、二台を手放しました。"}, {"t": 721.2333333333333, "x": "前の失敗は、ここで繰り返されませんでした。"}, {"t": 724.4833333333333, "x": "二台とも、リュウグウの表面に"}, {"t": 726.6, "x": "降りたことが確かめられています。"}, {"t": 728.4833333333333, "x": "一台目が、手放された直後に"}, {"t": 730.7833333333333, "x": "送ってきた最初の画像は、ぶれていました。"}, {"t": 733.65, "x": "回りながら撮ったためです。"}, {"t": 735.3333333333334, "x": "画面の上には、はやぶさ２の"}, {"t": 737.35, "x": "機体と、青く見える太陽電池の板。"}, {"t": 740.2333333333333, "x": "下には、リュウグウの表面が写っていました。"}, {"t": 743.2666666666667, "x": "二台目の最初の画像には、右下に"}, {"t": 745.9333333333333, "x": "リュウグウの表面が写っていました。"}, {"t": 747.9, "x": "左上のにじんだ色は、日の光が映り込んだものです。"}, {"t": 751.75, "x": "翌日、一台目は、跳んでいる最中の画像も送ってきました。"}, {"t": 756.3833333333333, "x": "画面の左半分が地面で、白く飛んでいる部分は日の光です。"}, {"t": 760.8166666666667, "x": "JAXAは、この二台を、小惑星の表面に降りた世界で"}, {"t": 764.9666666666667, "x": "初めての、動いて調べる機械だと発表しました。"}, {"t": 768.45, "x": "表面で自分の判断で動き、写真を"}, {"t": 771.2833333333333, "x": "撮ったのも、初めてでした。"}, {"t": 773.1833333333333, "x": "二台には、あとから名前が付けられました。"}, {"t": 776.0666666666667, "x": "一台目はイブー。"}, {"t": 776.6666666666666, "x": "イブー█"}, {"t": 777.2833333333333, "x": "フランス語で、みみずくです。"}, {"t": 779.4166666666666, "x": "二台目はアウル。"}, {"t": 779.9833333333333, "x": "アウル█"}, {"t": 780.5333333333333, "x": "英語で、ふくろうです。"}, {"t": 782.3833333333333, "x": "ローマ神話の女神ミネルヴァは、"}, {"t": 784.1833333333333, "x": "ふくろうを連れた姿で描かれることが多く、"}, {"t": 787.2166666666667, "x": "その知恵の象徴にちなんだ名前です。"}, {"t": 789.85, "x": "二台が降りたあたりには、トリトニスという"}, {"t": 791.35, "x": "トリトニス█"}, {"t": 792.5, "x": "呼び名も付けられました。"}, {"t": 793.8666666666667, "x": "女神ミネルヴァが生まれた地とされる場所の名前です。"}, {"t": 796.8833333333333, "x": "ただし、これは探査の仲間内の呼び名で、"}, {"t": 799.8166666666667, "x": "国際的に認められた地名ではありません。"}, {"t": 802.7166666666667, "x": "リュウグウの一日は、およそ七・六時間です。"}, {"t": 806.0833333333334, "x": "記録は、この一日を単位に数えられました。"}, {"t": 809.35, "x": "アウルは、十日目に電波を送っている最中に"}, {"t": 812.3666666666667, "x": "電力が落ち、それ以後、便りはありません。"}, {"t": 815.7, "x": "イブーは、百十三日目まで電波を送りました。"}, {"t": 819.1, "x": "地球の日数に直すと、およそ三十六日です。"}, {"t": 822.7, "x": "百十四日目からは、便りがありません。"}, {"t": 825.65, "x": "JAXAは、二〇一八年の暮れの時点で、こう見ていました。"}, {"t": 829.9666666666667, "x": "どちらも電力が足りず、日の"}, {"t": 832.0833333333334, "x": "当たらない場所にいるのではないか。"}, {"t": 834.0166666666667, "x": "リュウグウの季節が変われば、日の当たり方が"}, {"t": 836.8333333333334, "x": "変わって、目を覚ます可能性がある。"}, {"t": 839.3, "x": "その後、二台が目を覚ましたという発表は、"}, {"t": 842.2333333333333, "x": "確認できた範囲では見当たりません。"}, {"t": 844.7666666666667, "x": "二台の十二日後、もう一つの"}, {"t": 847.0833333333334, "x": "機械が、リュウグウに降りました。"}, {"t": 849.25, "x": "着陸機マスコットです。"}, {"t": 849.7, "x": "マスコット█"}, {"t": 850.9, "x": "ドイツ航空宇宙センターが、"}, {"t": 852.6166666666667, "x": "フランス国立宇宙研究センターと協力して作りました。"}, {"t": 856.5333333333333, "x": "積んでいた観測機器は、四つです。"}, {"t": 859.1, "x": "表面を写すカメラ。"}, {"t": 860.5666666666667, "x": "地面の温度を測る装置。"}, {"t": 862.3833333333333, "x": "石の成分を赤外線で調べる装置。"}, {"t": 865.1, "x": "そして、磁場を測る装置。"}, {"t": 867.3666666666667, "x": "どれも、小惑星の地面の上に置かれて、"}, {"t": 870.3, "x": "初めて働くものです。"}, {"t": 872.15, "x": "名前は、小惑星の表面を動いて偵察する機械、という"}, {"t": 876.5666666666667, "x": "意味の英語の頭文字から取られています。"}, {"t": 878.9833333333333, "x": "この機械には、太陽電池がありません。"}, {"t": 881.8, "x": "動く力は、積んできた電池だけです。"}, {"t": 884.5666666666667, "x": "電池が尽きれ function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
