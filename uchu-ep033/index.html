<script>
const D={"name": "ep033", "file": "ep033", "dur": 1806.0, "segs": [], "subs": [{"t": 0.0, "x": "その探査機には、着陸するための脚がありませんでした。"}, {"t": 3.8, "x": "小惑星のまわりを回って、上から"}, {"t": 6.483333333333333, "x": "調べるために作られた機体です。"}, {"t": 8.466666666666667, "x": "着陸のための作りには、なっていませんでした。"}, {"t": 11.716666666666667, "x": "それでもこの機体は小惑星の表面に降りました。"}, {"t": 14.9, "x": "2001年2月12日のことです。"}, {"t": 17.433333333333334, "x": "小惑星に降りた探査機はこれが初めてです。"}, {"t": 20.383333333333333, "x": "名前はニア・シューメーカー。"}, {"t": 21.95, "x": "降りた先はエロスという小惑星です。"}, {"t": 24.4, "x": "長さは約34キロ。"}, {"t": 26.25, "x": "形は、じゃがいもに似ています。"}, {"t": 28.583333333333332, "x": "機体は降りながら、カメラで地面を撮り続けました。"}, {"t": 32.016666666666666, "x": "最後の1枚は、地面から120メートルあまりの"}, {"t": 35.55, "x": "高さで撮られました。"}, {"t": 36.766666666666666, "x": "1枚に収まった地面の幅は、6メートルほどでした。"}, {"t": 40.483333333333334, "x": "そのあと機体は、歩くほどの速さで地面に触れました。"}, {"t": 44.15, "x": "着地のあとまで機体がもつとは、"}, {"t": 46.06666666666667, "x": "考えられていませんでした。"}, {"t": 48.083333333333336, "x": "ところが電波はそのあとも届き続けました。"}, {"t": 50.733333333333334, "x": "機体はそれから2週間、地面のすぐそばで測り続けます。"}, {"t": 54.78333333333333, "x": "そして2001年2月28日。"}, {"t": 57.38333333333333, "x": "地球からの命令で、眠りにつきました。"}, {"t": 60.333333333333336, "x": "1年9か月あまりあと、もう一度だけ"}, {"t": 63.266666666666666, "x": "呼びかけが行われました。"}, {"t": 64.85, "x": "返事はありませんでした。"}, {"t": 66.41666666666667, "x": "機体は今も、エロスの表面にあるはずです。"}, {"t": 69.55, "x": "地面に着いた機体の姿は、どの写真にも写っていません。"}, {"t": 73.5, "x": "この回の記録は、脚のない機体が"}, {"t": 76.0, "x": "どうやって降りたのかという話です。"}, {"t": 78.08333333333333, "x": "始まりは、100年あまり前のドイツです。"}, {"t": 81.0, "x": "1898年8月13日のことです。"}, {"t": 84.48333333333333, "x": "ドイツのベルリンにある天文台で、"}, {"t": 86.53333333333333, "x": "1枚の写真が撮られました。"}, {"t": 88.71666666666667, "x": "撮ったのは、グスタフ・ウィットという天文学者です。"}, {"t": 91.93333333333334, "x": "ねらっていたのは別の小惑星でした。"}, {"t": 94.33333333333333, "x": "2時間ほどかけて、光をためて撮る写真でした。"}, {"t": 97.66666666666667, "x": "その写真に、短い線が1本写っていました。"}, {"t": 101.08333333333333, "x": "長さは0.4ミリです。"}, {"t": 102.9, "x": "写しているあいだに、位置を変えたものがいたのです。"}, {"t": 106.26666666666667, "x": "同じ日、フランスのニースでも見つかっていました。"}, {"t": 109.45, "x": "見つけたのは別の天文学者です。"}, {"t": 111.7, "x": "軌道は2週間たたないうちに計算されました。"}, {"t": 114.66666666666667, "x": "この天体は、地球のかなり近くまで来る"}, {"t": 117.51666666666667, "x": "軌道を回っていました。"}, {"t": 118.88333333333334, "x": "火星の軌道の内側まで入ってきます。"}, {"t": 121.41666666666667, "x": "ただし、地球の軌道までは届きません。"}, {"t": 124.35, "x": "この天体は、エロスと名付けられました。"}, {"t": 127.11666666666666, "x": "それまで小惑星には、女性の名前を"}, {"t": 129.95, "x": "付けるのがならわしでした。"}, {"t": 131.45, "x": "エロスは男の神の名前で、そのならわしを破る名前でした。"}, {"t": 135.65, "x": "この小さな天体は、天文学の道具としても使われました。"}, {"t": 139.81666666666666, "x": "地球に近づくので、いろいろな"}, {"t": 142.06666666666666, "x": "場所から見ると位置が少しずれて見えます。"}, {"t": 144.46666666666667, "x": "そのずれから距離を割り出せます。"}, {"t": 146.48333333333332, "x": "レーダーで距離を測れるようになる前のことです。"}, {"t": 149.26666666666668, "x": "天文学者たちはエロスを使って、"}, {"t": 151.41666666666666, "x": "地球と太陽の距離を求めようとしました。"}, {"t": 154.38333333333333, "x": "地球と月を合わせた重さを求めるのにも使われました。"}, {"t": 157.98333333333332, "x": "1975年にも、地球に近づいています。"}, {"t": 161.66666666666666, "x": "その距離は約2200万キロでした。"}, {"t": 164.2, "x": "100年近くのあいだ、エロスは"}, {"t": 166.46666666666667, "x": "望遠鏡で見つめられてきました。"}, {"t": 168.48333333333332, "x": "けれども望遠鏡で見えるのは光る点だけです。"}, {"t": 171.46666666666667, "x": "表面に何があるのかを、近くで見た者はいませんでした。"}, {"t": 175.26666666666668, "x": "1990年、NASAは新しい計画の枠を作りました。"}, {"t": 179.8, "x": "名前はディスカバリー計画です。"}, {"t": 181.86666666666667, "x": "費用を低くおさえた、惑星探査の枠です。"}, {"t": 185.16666666666666, "x": "1991年10月のことです。"}, {"t": 187.96666666666667, "x": "この枠の進め方を考える科学者の"}, {"t": 190.4, "x": "集まりが、勧めを出しました。"}, {"t": 192.58333333333334, "x": "最初の1機は、地球に近い小惑星へ行くべきだという"}, {"t": 196.36666666666667, "x": "勧めです。"}, {"t": 197.1, "x": "近づくだけではありません。"}, {"t": 198.73333333333332, "x": "そばにとどまって、まわりを回りながら調べる計画です。"}, {"t": 202.65, "x": "同じ1991年、2つの研究所がこの計画の案を出しました。"}, {"t": 207.95, "x": "選ばれたのは、ジョンズ・ホプキンス大学の"}, {"t": 210.7, "x": "応用物理研究所の案です。"}, {"t": 212.55, "x": "探査機を作る仕事が始まったのは1993年12月でした。"}, {"t": 217.18333333333334, "x": "24か月ほどで、機体は打ち上げの場所へ運ばれています。"}, {"t": 221.38333333333333, "x": "機体の名前はニアです。"}, {"t": 222.95, "x": "地球に近い小惑星とのランデブー、という"}, {"t": 226.01666666666668, "x": "英語の頭文字から取られました。"}, {"t": 228.03333333333333, "x": "燃料まで積んだ重さは、805キロありました。"}, {"t": 231.48333333333332, "x": "そのうち燃料をのぞいた機体だけの"}, {"t": 233.55, "x": "重さは、468キロでした。"}, {"t": 236.23333333333332, "x": "電気は太陽電池の板で作ります。"}, {"t": 238.6, "x": "積んだ装置は6つです。"}, {"t": 240.25, "x": "写真を撮るカメラ。"}, {"t": 241.56666666666666, "x": "赤外線で鉱物を調べる装置。"}, {"t": 244.05, "x": "レーザーで距離を測る機械。"}, {"t": 245.83333333333334, "x": "表面の元素を調べる、エックス線とガンマ線の計測器。"}, {"t": 249.95, "x": "それに磁場を測る装置です。"}, {"t": 251.86666666666667, "x": "カメラなど5つの装置は、機体の"}, {"t": 254.33333333333334, "x": "同じ面に固定されていました。"}, {"t": 256.1666666666667, "x": "どれも同じ向きを見るように取り付けられています。"}, {"t": 259.06666666666666, "x": "向きを変えたいときは機体ごと回します。"}, {"t": 261.56666666666666, "x": "撮った写真は、いったん機体の記録装置にためます。"}, {"t": 265.05, "x": "1000枚を超える写真をためておけました。"}, {"t": 267.56666666666666, "x": "それを、あとでまとめて地球へ送ります。"}, {"t": 270.48333333333335, "x": "いちばん速いときで、1秒間に約2万6500ビットです。"}, {"t": 274.95, "x": "1000枚ぶんを、10時間かからずに送れました。"}, {"t": 278.2, "x": "着陸のための脚はどこにもありません。"}, {"t": 280.7, "x": "地面に下りる計画は、はじめから入っていなかったのです。"}, {"t": 284.46666666666664, "x": "費用は1億5000万ドルより少なく見積もられています。"}, {"t": 288.03333333333336, "x": "1990年代なかばのお金での値です。"}, {"t": 291.3, "x": "1996年2月17日。"}, {"t": 294.18333333333334, "x": "ニアはアメリカのフロリダから打ち上げられました。"}, {"t": 296.9166666666667, "x": "使ったのはデルタというロケットです。"}, {"t": 299.06666666666666, "x": "ニアはすぐにはエロスへ向かいませんでした。"}, {"t": 301.5833333333333, "x": "まず太陽から遠ざかる大きな軌道に入ります。"}, {"t": 304.6166666666667, "x": "1年後の1997年2月18日。"}, {"t": 308.1333333333333, "x": "ニアは、太陽からいちばん遠い点に着きました。"}, {"t": 311.3666666666667, "x": "その距離は太陽と地球の距離の2.18倍です。"}, {"t": 314.81666666666666, "x": "太陽電池だけで動く探査機として、"}, {"t": 317.0833333333333, "x": "それまでで最も遠い場所でした。"}, {"t": 319.4166666666667, "x": "太陽から離れるほど、太陽電池に届く光は弱まります。"}, {"t": 323.68333333333334, "x": "太陽電池の板は、この遠い点でも機体が"}, {"t": 326.76666666666665, "x": "動けるように大きく作られていました。"}, {"t": 328.96666666666664, "x": "その大きさが、のちの小惑星のそばでは余裕になります。"}, {"t": 332.9166666666667, "x": "ニアはこの長い道の途中で、"}, {"t": 334.81666666666666, "x": "もう一つの小惑星のそばを通る予定でした。"}, {"t": 338.03333333333336, "x": "1997年6月27日。"}, {"t": 341.15, "x": "ニアはマチルドという小惑星のそばを通りました。"}, {"t": 344.23333333333335, "x": "小惑星の帯の中を回る、黒っぽい天体です。"}, {"t": 347.9, "x": "すれちがうときの速さは秒速9.93キロでした。"}, {"t": 351.3833333333333, "x": "いちばん近づいたときの距離は、1212キロです。"}, {"t": 355.1, "x": "撮影にかけられた時間は、約25分しかありません。"}, {"t": 359.0, "x": "そのあいだにカメラは、534枚の写真を撮りました。"}, {"t": 363.06666666666666, "x": "太陽から遠く、太陽電池で作れる電気は"}, {"t": 366.31666666666666, "x": "ふだんの4分の1ほどでした。"}, {"t": 368.1166666666667, "x": "電気が足りないため、動かせた装置はカメラだけでした。"}, {"t": 371.78333333333336, "x": "最接近のとき、カメラはマチルドの中心を"}, {"t": 374.98333333333335, "x": "ねらっていました。"}, {"t": 375.95, "x": "ところが写った場所は大きなくぼみの中でした。"}, {"t": 378.81666666666666, "x": "くぼみの中は影になっていて、真っ黒に写りました。"}, {"t": 382.45, "x": "写真に写ったのはマチルドの片側の面だけです。"}, {"t": 385.5833333333333, "x": "その面だけで、大きなくぼみが少なくとも5つありました。"}, {"t": 389.53333333333336, "x": "マチルドの半径は平均で26.5キロです。"}, {"t": 392.78333333333336, "x": "どれも、天体の半径に近い大きさです。"}, {"t": 395.85, "x": "それほど大きなくぼみが、いくつも"}, {"t": 398.21666666666664, "x": "並んでいたことになります。"}, {"t": 399.73333333333335, "x": "ふつうなら、天体が割れてしまっても"}, {"t": 402.1666666666667, "x": "おかしくない大きさです。"}, {"t": 403.6, "x": "それでもマチルドは割れずに残っていました。"}, {"t": 406.21666666666664, "x": "すれちがいで分かったことは、もう一つあります。"}, {"t": 409.3333333333333, "x": "マチルドの重さです。"}, {"t": 410.75, "x": "すれちがうとき、ニアの速さは"}, {"t": 412.95, "x": "小惑星の重力でわずかに変わります。"}, {"t": 415.46666666666664, "x": "地球に届く電波の変化から、その重さを割り出しました。"}, {"t": 419.4, "x": "探査機で小惑星の重さを直接はかったのは、"}, {"t": 422.3666666666667, "x": "これが初めてでした。"}, {"t": 424.0, "x": "重さを大きさで割ると、密度が出ます。"}, {"t": 426.9, "x": "その値は水の約1.3倍でした。"}, {"t": 429.5, "x": "似た成分の隕石とくらべると、半分かそれ以下です。"}, {"t": 433.25, "x": "中身の半分以上が、すき間なのかもしれません。"}, {"t": 436.6, "x": "写真に写らない中身が、数字から見えてきました。"}, {"t": 440.06666666666666, "x": "この重さの測り方は、のちにエロスでも使われます。"}, {"t": 443.73333333333335, "x": "遠くの石の重さを、電波ではかる方法です。"}, {"t": 447.1, "x": "1997年7月3日、ニアは"}, {"t": 450.4, "x": "大きなエンジンを初めて噴かしました。"}, {"t": 452.6, "x": "燃料と、燃料を燃やす薬を混ぜて使う強いエンジンです。"}, {"t": 456.85, "x": "この噴射で、速さは秒速約270メートル変わりました。"}, {"t": 461.26666666666665, "x": "ねらいはもう一度地球のそばを通ることです。"}, {"t": 464.03333333333336, "x": "地球の重力を借りて、軌道の傾きを変えます。"}, {"t": 467.5833333333333, "x": "エロスの軌道にそろえるための近道でした。"}, {"t": 470.31666666666666, "x": "1998年1月23日、ニアは地球のそばを通りました。"}, {"t": 475.7, "x": "いちばん近づいたときの高さは、約540キロです。"}, {"t": 479.65, "x": "このときカメラは地球の南極の写真を撮りました。"}, {"t": 482.81666666666666, "x": "白い大陸が、宇宙からくっきりと写っています。"}, {"t": 486.21666666666664, "x": "地球をあとにしたニアは、いよいよエロスへ向かいました。"}, {"t": 489.8, "x": "計画では、1999年1月10日にエロスを回る軌道に入ります。"}, {"t": 495.3333333333333, "x": "そのために、何回かに分けてエンジンを噴かす予定でした。"}, {"t": 499.1166666666667, "x": "エロスは、ニアより速く太陽のまわりを回っていました。"}, {"t": 502.76666666666665, "x": "追いついてそばにとどまるには、"}, {"t": 504.46666666666664, "x": "ニアの速さを上げなければなりません。"}, {"t": 507.01666666666665, "x": "計画ではエンジンの噴射を4回行います。"}, {"t": 510.0, "x": "最初の1回が、いちばん大きな噴射でした。"}, {"t": 513.2166666666667, "x": "速さを秒速650メートル上げる計画です。"}, {"t": 516.5833333333334, "x": "噴射は、15分ほど続ける予定でした。"}, {"t": 519.6166666666667, "x": "2回目は、その8日後の予定です。"}, {"t": 522.2333333333333, "x": "そのときエロスまでは2万1000キロです。"}, {"t": 524.8, "x": "1999年1月3日に、3回目の小さな噴射。"}, {"t": 529.4666666666667, "x": "1月10日には4回目の噴射を行います。"}, {"t": 532.5166666666667, "x": "そして高さ1000キロでエロスを回り始める計画でした。"}, {"t": 535.9666666666667, "x": "運用のチームも、この日に向けて人を増やしていました。"}, {"t": 539.5166666666667, "x": "長い旅のあいだは7人ほどの規模でした。"}, {"t": 542.1833333333333, "x": "到着の前には、21人ほどになっていました。"}, {"t": 545.7, "x": "その日は1998年12月20日。"}, {"t": 548.8833333333333, "x": "エロスまではまだ23万8000キロありました。"}, {"t": 551.9, "x": "アメリカ東部時間の午後5時。"}, {"t": 553.9333333333333, "x": "まず小さな噴射口で3分ほど噴かします。"}, {"t": 556.7833333333333, "x": "タンクの中の液体を、出口に寄せるためです。"}, {"t": 560.05, "x": "続いて、大きなエンジンに火がつきました。"}, {"t": 563.0166666666667, "x": "ところがエンジンは1秒もたたずに止まりました。"}, {"t": 565.9333333333333, "x": "噴射が自分で取りやめになったのです。"}, {"t": 568.2833333333333, "x": "機体は決められた通りに、地上からの指示を"}, {"t": 571.2166666666667, "x": "待つ守りの状態に入りました。"}, {"t": 573.2666666666667, "x": "ここまでは設計の通りです。"}, {"t": 575.1833333333333, "x": "そのあとが、予想していなかったことでした。"}, {"t": 578.05, "x": "数秒のうちに、機体からの電波がすべて途絶えました。"}, {"t": 581.7, "x": "管制室には何の信号も届きませんでした。"}, {"t": 584.65, "x": "機体がどちらを向いているのかも分かりません。"}, {"t": 587.2666666666667, "x": "太陽電池に光が当たっているのかさえ、つかめません。"}, {"t": 590.8666666666667, "x": "電池が空になってしまうおそれもありました。"}, {"t": 593.4833333333333, "x": "チームは昼も夜も話し合いを続けました。"}, {"t": 596.1666666666666, "x": "翌日の夕方になっても、電波は戻りませんでした。"}, {"t": 599.8333333333334, "x": "12月22日の、世界時で午前1時1分。"}, {"t": 603.55, "x": "オーストラリアのキャンベラにある受信所。"}, {"t": 605.9, "x": "そこが、はっきりした信号をとらえました。"}, {"t": 608.7333333333333, "x": "電波が途絶えてから、27時間がたっていました。"}, {"t": 612.1833333333333, "x": "数時間後、機体はふだんの状態に戻されました。"}, {"t": 615.7, "x": "記録を調べると、機体にもエンジンにも"}, {"t": 618.45, "x": "傷はありませんでした。"}, {"t": 619.7833333333333, "x": "けれども失ったものがありました。"}, {"t": 621.85, "x": "燃料です。"}, {"t": 622.8166666666667, "x": "沈黙のあいだ、機体はぐるぐると"}, {"t": 625.2, "x": "回る動きに入っていました。"}, {"t": 626.9166666666666, "x": "それを止めて、太陽の方を向こうとしていたのです。"}, {"t": 630.3333333333334, "x": "そのたびに、小さな噴射口が噴きました。"}, {"t": 633.2833333333333, "x": "噴いた回数は何千回にもなりました。"}, {"t": 635.7833333333333, "x": "使ってしまった燃料は約29キロでした。"}, {"t": 638.7166666666667, "x": "速さに直すと、秒速96メートルを変える分にあたります。"}, {"t": 643.1, "x": "あと15キロ多く使っていたら、どうなっていたか。"}, {"t": 646.4, "x": "エロスに追いつく望みは、なくなっていました。"}, {"t": 649.4166666666666, "x": "沈黙のあいだには、電気が足りなくなる時間もありました。"}, {"t": 653.25, "x": "そのため記録装置の電源が切れ、"}, {"t": 655.45, "x": "中のデータは消えていました。"}, {"t": 657.5333333333333, "x": "あとで調査委員会が作られ、原因が調べられました。"}, {"t": 661.3166666666667, "x": "エンジンが止まった理由は、2日のうちに分かりました。"}, {"t": 664.75, "x": "火がつく瞬間には機体が横にわずかにゆれます。"}, {"t": 667.7833333333333, "x": "これはふつうの動きです。"}, {"t": 669.3666666666667, "x": "ところがそのゆれを見張る安全の線が、"}, {"t": 671.7166666666667, "x": "低すぎる値に決められていました。"}, {"t": 674.1333333333333, "x": "ふつうのゆれが、線を越えてしまったのです。"}, {"t": 677.0666666666667, "x": "誤りはもう一つありました。"}, {"t": 678.9666666666667, "x": "取りやめのあとに実行する命令の列に、"}, {"t": 681.55, "x": "命令が一つ抜けていたのです。"}, {"t": 683.7833333333333, "x": "その抜けが、回る動きの始まりになりました。"}, {"t": 687.0, "x": "ただ分からないことも残りました。"}, {"t": 689.0, "x": "なぜそれほど多くの燃料を使ったのかは、"}, {"t": 691.5166666666667, "x": "最後まで全部は説明できませんでした。"}, {"t": 694.35, "x": "委員会が説明できたのは、取りやめの"}, {"t": 697.0, "x": "あと47分ほどまでです。"}, {"t": 698.8666666666667, "x": "エンジンが止まったことで、"}, {"t": 700.2833333333333, "x": "ニアはエロスに追いつけなくなりました。"}, {"t": 702.8166666666667, "x": "ニアはエロスの横をすり抜けていくことになります。"}, {"t": 705.7333333333333, "x": "チームは1日足らずで、撮影の手順を組み直しました。"}, {"t": 709.7166666666667, "x": "通り過ぎるのは一度だけです。"}, {"t": 711.6166666666667, "x": "やり直しはききません。"}, {"t": 713.15, "x": "1998年12月23日。"}, {"t": 716.35, "x": "ニアは、エロスから3827キロのところを通り過ぎました。"}, {"t": 720.9333333333333, "x": "その間に撮った写真は1000枚を超えました。"}, {"t": 723.6833333333333, "x": "見えたのはエロスの表面の約6割です。"}, {"t": 726.3666666666667, "x": "100年間、点にしか見えなかった"}, {"t": 728.75, "x": "天体が、初めて形を見せました。"}, {"t": 731.4, "x": "細長い石のかたまりでした。"}, {"t": 733.3166666666667, "x": "そのころ、チームは次の手を考えていました。"}, {"t": 736.5666666666667, "x": "燃料は減りましたが、まだ残っています。"}, {"t": 739.45, "x": "計画には、はじめから多めの燃料が積まれていました。"}, {"t": 743.2, "x": "うまくいかなかったときの道も、"}, {"t": 745.0, "x": "あらかじめ考えてありました。"}, {"t": 747.1666666666666, "x": "1999年1月3日。"}, {"t": 749.8166666666667, "x": "ニアは大きなエンジンを、24分間噴かしました。"}, {"t": 753.5166666666667, "x": "速さは秒速900メートルあまり変わりました。"}, {"t": 756.5333333333333, "x": "エロスから遠ざかっていく動きが、逆向きに変わります。"}, {"t": 760.1666666666666, "x": "1月20日には小さな噴射で道を整えました。"}, {"t": 763.5, "x": "こうしてニアは、エロスのあとを追う道に入りました。"}, {"t": 766.85, "x": "着くのは予定より13か月遅れになります。"}, {"t": 769.8, "x": "この噴射のあとの燃料は、多くはありません。"}, {"t": 772.95, "x": "最初の噴射がうまくいった場合の、3分の1ほどでした。"}, {"t": 776.9333333333333, "x": "本来の仕事をこなすには足りる量です。"}, {"t": 779.5166666666667, "x": "ただし、余裕はもうありませんでした。"}, {"t": 782.1333333333333, "x": "2000年2月14日。"}, {"t": 783.8333333333334, "x": "バレンタインデーのこの日が、新しい到着の日でした。"}, {"t": 787.4666666666667, "x": "ニアはエロスの太陽側を通り過ぎるところでした。"}, {"t": 790.5666666666667, "x": "世界時の午後3時33分、軌道に"}, {"t": 793.6, "x": "入るための噴射が始まりました。"}, {"t": 795.6333333333333, "x": "噴射で変える速さは秒速10メートルだけです。"}, {"t": 798.65, "x": "けれども地上のチームにはまだ分かりません。"}, {"t": 801.2666666666667, "x": "電波が地球に届くまでに、時間がかかるからです。"}, {"t": 804.7833333333333, "x": "信号が届いたのは14分ほどあとでした。"}, {"t": 807.65, "x": "噴射の誤差は、0.1パーセントほどしかありませんでした。"}, {"t": 811.6, "x": "ニアはエロスのまわりを回り始めました。"}, {"t": 814.1, "x": "いちばん近いところで321キロ。"}, {"t": 816.8, "x": "いちばん遠いところで366キロの軌道です。"}, {"t": 820.2, "x": "2時間後、軌道を確かめるための写真が届きました。"}, {"t": 823.9166666666666, "x": "画面の真ん中に、大きなくぼみが写っていました。"}, {"t": 827.3166666666667, "x": "ねらった通りの位置です。"}, {"t": 828.8666666666667, "x": "このくぼみは、のちにプシケと名付けられました。"}, {"t": 831.9666666666667, "x": "軌道に入ったことが、写真でも確かめられました。"}, {"t": 835.3833333333333, "x": "小惑星や彗星のような小さな天体を"}, {"t": 838.0333333333333, "x": "回った探査機は、これが初めてでした。"}, {"t": 840.7, "x": "それまでに探査機が回った天体は、"}, {"t": 842.9166666666666, "x": "太陽をのぞけば5つです。"}, {"t": 844.95, "x": "地球。"}, {"t": 846.0333333333333, "x": "月。"}, {"t": 847.15, "x": "火星。"}, {"t": 848.2666666666667, "x": "金星。"}, {"t": 849.35, "x": "木星。"}, {"t": 850.4666666666667, "x": "その並びに、小さな石のかたまりが加わりました。"}, {"t": 854.0166666666667, "x": "軌道に入ってから1か月後の、2000年3月14日。"}, {"t": 858.0833333333334, "x": "探査機に新しい名前が付けられました。"}, {"t": 860.6166666666667, "x": "ニア・シューメーカーです。"}, {"t": 862.0166666666667, "x": "シューメーカーは、ユージン・"}, {"t": 863.7166666666667, "x": "シューメーカーという地質学者の名前です。"}, {"t": 866.2166666666667, "x": "1928年に生まれ、1997年に亡くなりました。"}, {"t": 871.2166666666667, "x": "探査機の名前に、人の名前が加えられたのです。"}, {"t": 874.6666666666666, "x": "その名前は、のちにエロスの表面にも付けられます。"}, {"t": 878.2, "x": "大きなくぼみの一つが、シューメーカーと"}, {"t": 880.8166666666667, "x": "名付けられました。"}, {"t": 881.85, "x": "ニア・シューメーカーは、少しずつ"}, {"t": 883.9666666666667, "x": "エロスに近づいていきました。"}, {"t": 885.6166666666667, "x": "レーザーで距離を測る装置も、動き始めました。"}, {"t": 888.9666666666667, "x": "初めてエロスをとらえたのは、290キロ離れたところです。"}, {"t": 893.1833333333333, "x": "エロスのまわりに小さな月がないかも探されました。"}, {"t": 896.3166666666667, "x": "探した大きさは、20メートルほどまでです。"}, {"t": 899.4666666666667, "x": "一つも見つかりませんでした。"}, {"t": 901.2666666666667, "x": "2000年4月30日には、中心から 339.5, "x": "降りるにつれて、写真は細かくなっていきました。"}, {"t": 1342.7666666666667, "x": "高さが半分になれば、写る地面の幅も半分になります。"}, {"t": 1346.8333333333333, "x": "そのぶん、小さなものまで見えるのです。"}, {"t": 1349.6, "x": "岩の一つ一つが、大きく写ります。"}, {"t": 1352.4666666666667, "x": "降下の間に撮った写真は約70枚でした。"}, {"t": 1355.5, "x": "最後の1枚が撮られたのは、"}, {"t": 1357.2833333333333, "x": "高さ120メートルあまりのところです。"}, {"t": 1360.15, "x": "その写真に写っていたのは、"}, {"t": 1361.8, "x": "幅6メートルほどの地面でした。"}, {"t": 1364.1666666666667, "x": "最後のほうの写真の1枚は、"}, {"t": 1366.1166666666666, "x": "くぼみの内側を写していました。"}, {"t": 1368.5, "x": "直径100メートルほどのくぼみです。"}, {"t": 1370.7666666666667, "x": "1センチほどの細かさまで見分けられる写真です。"}, {"t": 1373.8, "x": "最後のほうの写真には、ごつごつした"}, {"t": 1376.4666666666667, "x": "岩の地面が写っていました。"}, {"t": 1378.1333333333334, "x": "その先が、なめらかな面へと移り変わっていきます。"}, {"t": 1381.6166666666666, "x": "チームはこの写真から、降りた場所を考えました。"}, {"t": 1385.0333333333333, "x": "池の上か、そのすぐそばです。"}, {"t": 1387.4166666666667, "x": "降りる前の見込みを思い出します。"}, {"t": 1389.5333333333333, "x": "最後の写真は、高さ500メートルほどで撮るはずでした。"}, {"t": 1393.4333333333334, "x": "実際には、その4分の1ほどの"}, {"t": 1395.9, "x": "高さまで写真が撮れていました。"}, {"t": 1397.8333333333333, "x": "東部時間の午後3時すぎ。"}, {"t": 1399.7, "x": "ニア・シューメーカーは、エロスの表面に触れました。"}, {"t": 1402.9666666666667, "x": "4回目のブレーキの噴射を、まだ続けている最中でした。"}, {"t": 1406.9166666666667, "x": "小惑星の重力に引かれる力が、"}, {"t": 1409.2666666666667, "x": "弱い噴射口の力を上回っていたためです。"}, {"t": 1412.4666666666667, "x": "機体の動きは、地球に届く電波から読み取れます。"}, {"t": 1416.0, "x": "機体が動くと、電波の高さがわずかにずれます。"}, {"t": 1419.3666666666666, "x": "そのずれから速さが分かります。"}, {"t": 1421.3833333333334, "x": "触れたあとも、機体の動きはすぐには止まりませんでした。"}, {"t": 1425.0166666666667, "x": "電波の変化からは、一度地面ではね返ってから"}, {"t": 1428.25, "x": "止まったことが分かっています。"}, {"t": 1429.8833333333334, "x": "ぶつかった速さが見積もられました。"}, {"t": 1432.0, "x": "秒速1.5メートルから1.8メートルです。"}, {"t": 1435.0666666666666, "x": "時速にすると、6キロほどです。"}, {"t": 1437.55, "x": "人が歩くくらいの速さでした。"}, {"t": 1439.4666666666667, "x": "それまでの惑星などへの着陸の"}, {"t": 1441.55, "x": "中でも、とりわけ遅い速さです。"}, {"t": 1443.9833333333333, "x": "降りた場所は、ヒメロスと呼ばれる"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
