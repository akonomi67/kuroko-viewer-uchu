<script>
const D={"name": "ep018", "file": "ep018", "dur": 1995.66665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇一八年の一月、アメリカ・アリゾナ州の"}, {"t": 3.283333333333333, "x": "山の上にある望遠鏡が、暗い光の点を一つ見つけました。"}, {"t": 7.55, "x": "地球の近くを通る、小さな天体の"}, {"t": 10.3, "x": "一つとして登録されました。"}, {"t": 12.016666666666667, "x": "符号は、2018 AV2。"}, {"t": 15.05, "x": "この点の動きには、少し変わったところがありました。"}, {"t": 18.466666666666665, "x": "見つかったとき、この点は、ほかの多くの"}, {"t": 21.55, "x": "小天体と同じように、暗く小さな光でした。"}, {"t": 24.95, "x": "形も色も分かりません。"}, {"t": 26.633333333333333, "x": "分かったのは、空の上をどう動いたかだけです。"}, {"t": 29.8, "x": "太陽のまわりを一周するのに、三百八十二日かかります。"}, {"t": 34.083333333333336, "x": "地球の一年より、十七日だけ長い周期です。"}, {"t": 37.7, "x": "軌道の傾きは、地球の軌道に対して一度もありません。"}, {"t": 41.63333333333333, "x": "地球との速さの違いは、一秒間に"}, {"t": 44.483333333333334, "x": "一キロメートルもありません。"}, {"t": 46.06666666666667, "x": "そのため、この点は、一年の大半を、"}, {"t": 49.35, "x": "地球の少し後ろについて回っています。"}, {"t": 52.18333333333333, "x": "自然の小惑星が、ここまで地球とそっくりの"}, {"t": 55.43333333333333, "x": "道を回ることは、あまりありません。"}, {"t": 57.95, "x": "そっくりの道を回っている物があるとすれば、"}, {"t": 60.56666666666667, "x": "まず疑われるのは、地球から出ていった物です。"}, {"t": 64.18333333333334, "x": "イギリスの王立天文学会のフェロー、"}, {"t": 66.45, "x": "ニック・ハウズは、何年もかけて"}, {"t": 68.9, "x": "探していた物と、この点を結びつけました。"}, {"t": 71.96666666666667, "x": "一九六九年五月、アポロ10号が月の近くで切り離し、"}, {"t": 76.83333333333333, "x": "太陽を回る軌道へ送り出した、月着陸船の上半分。"}, {"t": 81.2, "x": "呼び名は、スヌーピーです。"}, {"t": 83.18333333333334, "x": "ハウズは、二〇一九年六月に、"}, {"t": 85.76666666666667, "x": "九十八パーセント確かだと話しました。"}, {"t": 88.65, "x": "そして同時に、百パーセントとは"}, {"t": 90.98333333333333, "x": "言えない、とも話しています。"}, {"t": 92.93333333333334, "x": "太陽のまわりには、人間が送り出し、回収する"}, {"t": 96.75, "x": "予定のない物が、いくつも回っています。"}, {"t": 99.48333333333333, "x": "この回では、そのうち記録が残っているものを、"}, {"t": 102.53333333333333, "x": "打ち上げの古い順に読んでいきます。"}, {"t": 105.05, "x": "そして、それらがどうやって見つかり、"}, {"t": 107.43333333333334, "x": "なぜ小惑星と見分けがつきにくいのかを、"}, {"t": 110.3, "x": "残っている記録の範囲で並べます。"}, {"t": 112.8, "x": "太陽を回る軌道に、人間の作った物が"}, {"t": 115.81666666666666, "x": "初めて入ったのは、一九五九年の一月です。"}, {"t": 119.71666666666667, "x": "一九五九年一月二日、ソビエト連邦が"}, {"t": 123.6, "x": "一機の探査機を打ち上げました。"}, {"t": 125.46666666666667, "x": "重さは七百九十六ポンド、約三百六十一キログラム。"}, {"t": 129.95, "x": "球の形をした機体でした。"}, {"t": 131.83333333333334, "x": "のちにルナ1号と呼ばれることになります。"}, {"t": 134.46666666666667, "x": "目指していたのは、月でした。"}, {"t": 136.55, "x": "打ち上げから数日のうちに、"}, {"t": 138.3, "x": "探査機は月のそばを通りました。"}, {"t": 140.68333333333334, "x": "ただし、月にはぶつかりませんでした。"}, {"t": 143.33333333333334, "x": "NASAの記録によれば、月を外れた距離は、"}, {"t": 146.18333333333334, "x": "約四千マイル、およそ六千四百キロメートルです。"}, {"t": 150.2, "x": "途中で、探査機は一つの実験をしています。"}, {"t": 153.46666666666667, "x": "地球から約七万四千マイルの所で、"}, {"t": 156.13333333333333, "x": "一キログラムのナトリウムのガスを放ちました。"}, {"t": 159.26666666666668, "x": "ガスは光を受けて輝き、地上の望遠鏡から、探査機が"}, {"t": 163.7, "x": "どこを飛んでいるのかを確かめる目印になりました。"}, {"t": 166.66666666666666, "x": "NASAの記録では、オレンジ色に"}, {"t": 168.83333333333334, "x": "光る筋が、インド洋の上空に、六等星ほどの"}, {"t": 172.6, "x": "明るさで見えたとされています。"}, {"t": 174.35, "x": "六等星は、暗い夜空で、目でやっと見える明るさです。"}, {"t": 178.48333333333332, "x": "宇宙を飛ぶ探査機の位置を、人の目で"}, {"t": 181.03333333333333, "x": "確かめられたのは、このガスがあったからでした。"}, {"t": 184.01666666666668, "x": "月を過ぎたあと、探査機はそのまま地球から"}, {"t": 187.13333333333333, "x": "離れていきました。"}, {"t": 188.23333333333332, "x": "地球の重力から抜け出した探査機は、地球と"}, {"t": 191.38333333333333, "x": "同じように、太陽のまわりを回りはじめます。"}, {"t": 194.46666666666667, "x": "探査機の電池は、打ち上げから約六十二時間で尽きました。"}, {"t": 198.61666666666667, "x": "それ以降、探査機からの信号はありません。"}, {"t": 201.63333333333333, "x": "NASAの記録は、ルナ1号を、太陽を回る"}, {"t": 204.93333333333334, "x": "軌道に入った最初の宇宙機として書いています。"}, {"t": 207.66666666666666, "x": "二か月後の一九五九年三月三日には、アメリカの"}, {"t": 211.9, "x": "パイオニア4号が打ち上げられました。"}, {"t": 214.06666666666666, "x": "こちらも月のそばを通り過ぎ、月面から"}, {"t": 216.95, "x": "約三万六千六百五十マイルの所を抜けています。"}, {"t": 220.41666666666666, "x": "そして、アメリカの宇宙機として初めて、"}, {"t": 223.26666666666668, "x": "太陽を回る軌道に入りました。"}, {"t": 225.7, "x": "パイオニア4号がいちばん月に近づいたときの距離は、"}, {"t": 228.88333333333333, "x": "キロメートルに直すと五万九千キロメートルほどです。"}, {"t": 232.41666666666666, "x": "ルナ1号よりも、さらに大きく月を外れています。"}, {"t": 236.01666666666668, "x": "どちらも、太陽を回る軌道を、はじめから"}, {"t": 239.26666666666668, "x": "目指していたわけではありません。"}, {"t": 240.93333333333334, "x": "月へ向かう途中で、月をかすめて通り過ぎ、"}, {"t": 244.06666666666666, "x": "そのまま太陽を回ることになった物です。"}, {"t": 247.0, "x": "太陽を回る人工物の歴史は、そうして始まりました。"}, {"t": 250.96666666666667, "x": "ルナ1号は、打ち上げた国で、"}, {"t": 253.31666666666666, "x": "人工の惑星とも呼ばれました。"}, {"t": 255.68333333333334, "x": "夢という意味の名前でも呼ばれています。"}, {"t": 258.1, "x": "月に届かなかった探査機に、太陽を"}, {"t": 260.73333333333335, "x": "回る物としての名前が付けられたことになります。"}, {"t": 263.6, "x": "ここで、一つだけ確かめておきます。"}, {"t": 266.21666666666664, "x": "地球を回る人工衛星なら、地上から"}, {"t": 269.15, "x": "毎日のように位置を測ることができます。"}, {"t": 271.65, "x": "けれども、太陽を回る物は、"}, {"t": 273.8833333333333, "x": "地球からどんどん離れていきます。"}, {"t": 276.23333333333335, "x": "電池が尽き、信号が止まれば、"}, {"t": 278.53333333333336, "x": "あとは望遠鏡で光を探すしかありません。"}, {"t": 281.6666666666667, "x": "重さ三百キログラムあまりの機体は、何千万キロメートルも"}, {"t": 285.6666666666667, "x": "離れると、望遠鏡で探すのが難しくなります。"}, {"t": 289.2, "x": "一九五九年に太陽を回りはじめた二機が、"}, {"t": 292.5833333333333, "x": "いまどこを回っているのか。"}, {"t": 294.5, "x": "その位置を、望遠鏡で確かめたという記録は、"}, {"t": 297.76666666666665, "x": "この回で調べた資料の中には見つかりませんでした。"}, {"t": 301.26666666666665, "x": "置いてきた物は、まず見えなくなるところから、"}, {"t": 304.2, "x": "話が始まります。"}, {"t": 305.85, "x": "一九六〇年代の終わりには、"}, {"t": 308.15, "x": "太陽を回る物が、もっと大きくなります。"}, {"t": 311.46666666666664, "x": "月へ人を運んだサターンVロケットは、"}, {"t": 313.8, "x": "三段に分かれていました。"}, {"t": 315.68333333333334, "x": "三つ目の段は、S-IVBと呼ばれます。"}, {"t": 319.3833333333333, "x": "この段は、地球を回る軌道から月へ向かう最後の"}, {"t": 322.85, "x": "加速を受け持ち、そのあと宇宙船から切り離されました。"}, {"t": 326.65, "x": "切り離したあとの段を、どこへやるのか。"}, {"t": 329.53333333333336, "x": "それは、段ごとに決められていました。"}, {"t": 332.1666666666667, "x": "宇宙船のすぐそばに置いておけば、"}, {"t": 334.23333333333335, "x": "ぶつかるおそれがあります。"}, {"t": 336.06666666666666, "x": "月へ落ちるように向けると、"}, {"t": 337.7, "x": "月面に新しい物を増やすことになります。"}, {"t": 340.76666666666665, "x": "初めのころの飛行では、月のそばを通り過ぎさせて、"}, {"t": 344.31666666666666, "x": "太陽を回る軌道へ送り出す方法が選ばれました。"}, {"t": 347.9, "x": "一九六八年十二月二十一日に打ち上げられた、アポロ8号。"}, {"t": 353.23333333333335, "x": "NASAの記録によれば、第三段は残った"}, {"t": 355.98333333333335, "x": "推進剤を放出し、その勢いで宇宙船から離れる"}, {"t": 359.8333333333333, "x": "道筋に乗り、太陽を回る軌道に入りました。"}, {"t": 363.15, "x": "記録には、それでもなお、宇宙船との距離は"}, {"t": 366.46666666666664, "x": "十分ではないと判断された、とも書かれています。"}, {"t": 369.73333333333335, "x": "捨てた段が、宇宙船のあとをついてこないようにすること。"}, {"t": 373.46666666666664, "x": "それ自体が、一つの仕事でした。"}, {"t": 376.0, "x": "一九六九年三月三日に打ち上げられた、アポロ9号。"}, {"t": 380.73333333333335, "x": "この飛行は地球を回るだけで、月へは行っていません。"}, {"t": 384.35, "x": "それでも第三段は、地球から抜け出す軌道を"}, {"t": 387.45, "x": "目指して、もう一度エンジンに火を入れました。"}, {"t": 390.3833333333333, "x": "噴いた時間は四分二秒。"}, {"t": 392.18333333333334, "x": "速さの増え方は予定より約十一パーセント"}, {"t": 394.9166666666667, "x": "足りませんでしたが、記録には、"}, {"t": 397.05, "x": "段は太陽を回る軌道に入った、とあります。"}, {"t": 400.55, "x": "パイオニア4号の打ち上げから、"}, {"t": 402.43333333333334, "x": "ちょうど十年後の同じ日でした。"}, {"t": 404.73333333333335, "x": "一九六九年五月のアポロ10号でも、"}, {"t": 407.9, "x": "第三段は太陽を回る軌道に入っています。"}, {"t": 411.0833333333333, "x": "一九六九年七月のアポロ11号では、"}, {"t": 414.55, "x": "打ち上げから四時間四十分で、第三段が"}, {"t": 417.96666666666664, "x": "切り離され、太陽を回る軌道に入りました。"}, {"t": 421.1166666666667, "x": "こうして、三つ目の段が、少なくとも四つ、"}, {"t": 424.5, "x": "太陽のまわりへ送られました。"}, {"t": 426.71666666666664, "x": "どの段も、送り出されたあとに、"}, {"t": 428.96666666666664, "x": "行き先を確かめに行った記録はありません。"}, {"t": 431.8, "x": "送り出した時点で、段の仕事は終わっていたからです。"}, {"t": 435.35, "x": "次のアポロ12号では、予定どおりにはいきませんでした。"}, {"t": 439.25, "x": "一九六九年十一月十八日、第三段は月のそばを"}, {"t": 444.1333333333333, "x": "通り過ぎましたが、太陽を回る軌道には入りきらず、"}, {"t": 447.75, "x": "地球を遠くから回る細長い軌道に残りました。"}, {"t": 451.18333333333334, "x": "一周に、およそ四十三日かかる軌道です。"}, {"t": 454.5, "x": "この段は、しばらく地球のまわりを回った"}, {"t": 457.25, "x": "あと、一九七一年の三月に地球の重力から"}, {"t": 461.3, "x": "抜け出し、太陽を回る物の仲間に加わりました。"}, {"t": 464.8, "x": "この段には、あとでもう一度出てきてもらいます。"}, {"t": 467.98333333333335, "x": "その次のアポロ13号から17号までの"}, {"t": 470.8333333333333, "x": "第三段は、行き先が変わりました。"}, {"t": 473.4166666666667, "x": "一九七〇年から一九七二年にかけて、"}, {"t": 477.03333333333336, "x": "五つとも、月の内部を調べる実験のために、"}, {"t": 480.56666666666666, "x": "わざと月へぶつけられています。"}, {"t": 482.7, "x": "月面に残ったものの話は、ここでは扱いません。"}, {"t": 486.31666666666666, "x": "つまり、太陽を回るサターンVの第三段は、"}, {"t": 489.51666666666665, "x": "アポロ8号から12号までの時期に送られたものです。"}, {"t": 493.25, "x": "一つの段は、長さ十八メートルほどの筒です。"}, {"t": 496.71666666666664, "x": "外側は白く塗られていました。"}, {"t": 498.8, "x": "大きさだけを見れば、小さな小惑星と変わりません。"}, {"t": 502.3666666666667, "x": "遠く離れてしまえば、望遠鏡には、ほかの"}, {"t": 505.78333333333336, "x": "小惑星と同じ、動く光の点としてしか写りません。"}, {"t": 509.65, "x": "そして、この時期にもう一つ、"}, {"t": 511.8333333333333, "x": "太陽のまわりへ送られた物がありました。"}, {"t": 514.7, "x": "三つ目の段よりずっと小さく、送り出すために、"}, {"t": 517.9666666666667, "x": "わざわざエンジンを最後まで噴かせた物です。"}, {"t": 520.9333333333333, "x": "一九六九年五月十八日、アポロ10号が打ち上げられました。"}, {"t": 526.1666666666666, "x": "乗っていたのは、船長のトーマス・スタフォード、"}, {"t": 529.0166666666667, "x": "月着陸船の操縦を受け持つユージン・サーナン、"}, {"t": 532.25, "x": "司令船の操縦を受け持つジョン・ヤングの三人です。"}, {"t": 535.6833333333333, "x": "この飛行は、二か月後のアポロ11号のための、"}, {"t": 539.1166666666667, "x": "最後の予行でした。"}, {"t": 540.7666666666667, "x": "NASAは、月に降りること以外の、すべての"}, {"t": 543.8666666666667, "x": "手順を行う八日間の飛行だと書いています。"}, {"t": 546.6833333333333, "x": "宇宙船には、二つの呼び名が付けられていました。"}, {"t": 549.95, "x": "司令船は、チャーリー・ブラウン。"}, {"t": 552.1333333333333, "x": "月着陸船は、スヌーピー。"}, {"t": 554.4666666666667, "x": "どちらも、アメリカの新聞漫画の"}, {"t": 556.8333333333334, "x": "登場人物から取った名前です。"}, {"t": 558.8666666666667, "x": "五月二十二日、月を回る十二周目に、"}, {"t": 562.1, "x": "スヌーピーは司令船から離れました。"}, {"t": 564.6833333333333, "x": "中にはスタフォードとサーナンの二人。"}, {"t": 566.9, "x": "司令船には、ヤングが一人で残りました。"}, {"t": 569.9, "x": "一人になった司令船について、"}, {"t": 571.7666666666667, "x": "ヤングは無線でこう話しています。"}, {"t": 574.0833333333334, "x": "中に一人しかいないと、この船が"}, {"t": 576.5333333333333, "x": "どれだけ大きくなるか、分からないだろう。"}, {"t": 579.25, "x": "スヌーピーは、月面に向かって高さを下げていきました。"}, {"t": 582.8833333333333, "x": "NASAの記録では、いちばん低いところで、"}, {"t": 585.5833333333334, "x": "月面から約四万七千四百フィート。"}, {"t": 588.6166666666667, "x": "およそ十四キロメートルです。" 67, "x": "三か月のあいだに百七十回を"}, {"t": 1072.0833333333333, "x": "超える位置の測定が集まりました。"}, {"t": 1074.1833333333334, "x": "その動きを細かく調べると、この物体は、太陽の"}, {"t": 1078.1333333333334, "x": "光に押されて、わずかに道筋がずれていました。"}, {"t": 1081.4666666666667, "x": "光に押されやすいということは、"}, {"t": 1083.3833333333334, "x": "大きさの割に、軽いということです。"}, {"t": 1086.3333333333333, "x": "中身の詰まった岩の塊なら、そこまでは押されません。"}, {"t": 1090.1166666666666, "x": "中が空の、金属の筒なら、押されます。"}, {"t": 1093.5666666666666, "x": "二つ目は、表面の色です。"}, {"t": 1095.8333333333333, "x": "アリゾナ大学の研究者、ヴィシュヌ・レディのチームは、"}, {"t": 1099.1166666666666, "x": "マウナケアにあるNASAの赤外線望遠鏡で、"}, {"t": 1102.2, "x": "2020 SOの光を色ごとに分けて調べました。"}, {"t": 1106.4333333333334, "x": "比べる相手は、一九六〇年代のセントールに"}, {"t": 1110.0333333333333, "x": "使われていた材料、三百一番と呼ばれるステンレス鋼です。"}, {"t": 1114.1666666666667, "x": "最初は、合いませんでした。"}, {"t": 1116.25, "x": "チームは、そのずれが、比べ方の"}, {"t": 1118.9166666666667, "x": "問題かもしれないと考えました。"}, {"t": 1120.9666666666667, "x": "比べていたのは、実験室にある新しい鋼です。"}, {"t": 1124.5666666666666, "x": "けれども相手は、五十四年間、宇宙の"}, {"t": 1127.7666666666667, "x": "強い光と粒子にさらされてきた鋼です。"}, {"t": 1130.4833333333333, "x": "そこでチームは、一九七一年に打ち上げられ、"}, {"t": 1134.2166666666667, "x": "いまも地球を回っている別のセントールの"}, {"t": 1137.0333333333333, "x": "段の光を測り、それと比べました。"}, {"t": 1139.6666666666667, "x": "こちらも、長く宇宙にさらされてきた段です。"}, {"t": 1142.8, "x": "今度は、合いました。"}, {"t": 1144.5166666666667, "x": "ジェット推進研究所は、二〇二〇年十二月の発表で、"}, {"t": 1148.5666666666666, "x": "2020 SOが一九六〇年代のセントールの"}, {"t": 1152.95, "x": "段であることが確かめられた、としました。"}, {"t": 1155.65, "x": "そのころ、2020 SOは地球のすぐそばにいました。"}, {"t": 1160.1666666666667, "x": "二〇二〇年十一月八日、2020 SOは、"}, {"t": 1164.4333333333334, "x": "地球の重力が太陽の重力より強く働く範囲、"}, {"t": 1168.1333333333334, "x": "地球から約百五十万キロメートルの内側に入りました。"}, {"t": 1172.1333333333334, "x": "そして、十二月一日、最も地球に近づきました。"}, {"t": 1176.5333333333333, "x": "距離は、地球から月までの約〇・一三倍。"}, {"t": 1180.0, "x": "およそ五万キロメートルです。"}, {"t": 1181.8, "x": "この間、2020 SOは、地球と"}, {"t": 1185.5, "x": "月のまわりを大きな楕円で二周しました。"}, {"t": 1188.0166666666667, "x": "光の明るさの変化からは、約九秒で"}, {"t": 1190.95, "x": "一回転していることも分かりました。"}, {"t": 1193.0333333333333, "x": "二〇二一年の二月二日にもう一度近づき、"}, {"t": 1196.1333333333334, "x": "三月には、地球の重力の範囲から出て、"}, {"t": 1199.5, "x": "また太陽を回る軌道に戻っていきました。"}, {"t": 1202.3833333333334, "x": "一九六六年に月へ向かった段は、それから"}, {"t": 1206.0166666666667, "x": "五十四年のあいだ、誰にも位置を知られないまま、"}, {"t": 1209.1833333333334, "x": "太陽のまわりを回っていたことになります。"}, {"t": 1211.9833333333333, "x": "そして、四か月だけ地球に立ち寄り、"}, {"t": 1214.7333333333333, "x": "また去っていきました。"}, {"t": 1216.3166666666666, "x": "J002E3も2020 SOも、"}, {"t": 1219.6333333333334, "x": "宇宙機関が太陽のまわりに送り出したことを、"}, {"t": 1222.7166666666667, "x": "記録の上では知っていた物です。"}, {"t": 1225.0166666666667, "x": "それでも、見つかった時点では、"}, {"t": 1227.1333333333334, "x": "どちらも小惑星として登録されました。"}, {"t": 1230.0166666666667, "x": "あとから軌道をさかのぼって、正体が分かりました。"}, {"t": 1233.5, "x": "二〇一八年に打ち上げられた物でも、"}, {"t": 1235.95, "x": "同じことが起きています。"}, {"t": 1237.8166666666666, "x": "二〇一八年二月六日、世界時の二十時四十五分。"}, {"t": 1241.9, "x": "アメリカの宇宙企業スペースXが、新しい大型ロケット、"}, {"t": 1246.0833333333333, "x": "ファルコン・ヘビーの最初の打ち上げを行いました。"}, {"t": 1249.2666666666667, "x": "試験の打ち上げなので、本物の人工衛星は積んでいません。"}, {"t": 1253.45, "x": "代わりに積まれたのは、市販の電気自動車、"}, {"t": 1256.3666666666666, "x": "テスラ・ロードスターでした。"}, {"t": 1258.1166666666666, "x": "ジェット推進研究所の軌道の記録には、"}, {"t": 1260.7166666666667, "x": "積み荷の中身まで書かれています。"}, {"t": 1263.0166666666667, "x": "運転席には、宇宙服を着たマネキン。"}, {"t": 1265.7833333333333, "x": "呼び名はスターマン。"}, {"t": 1267.0166666666667, "x": "ダッシュボードには、同じ車の小さなおもちゃの模型。"}, {"t": 1270.6666666666667, "x": "車の中には、SF作家アイザック・アシモフの"}, {"t": 1273.8666666666666, "x": "小説『ファウンデーション』のシリーズを記録した装置。"}, {"t": 1277.85, "x": "そして、車を取り付けた金具には、六千人を"}, {"t": 1281.5666666666666, "x": "超える社員の名前が刻まれていました。"}, {"t": 1283.8833333333334, "x": "車の重さは、電池を含めて約千二百五十キログラムです。"}, {"t": 1288.2833333333333, "x": "ロケットの二段目は、車を載せたまま地球を"}, {"t": 1291.2833333333333, "x": "五時間回り、二月七日の世界時二時三十分ごろ、"}, {"t": 1294.9833333333333, "x": "三度目の噴射を終えました。"}, {"t": 1297.05, "x": "これで、車は二段目ごと、太陽を回る軌道に入りました。"}, {"t": 1301.5666666666666, "x": "軌道は、太陽にいちばん近い所で、"}, {"t": 1304.35, "x": "太陽と地球の距離の〇・九九倍。"}, {"t": 1307.2333333333333, "x": "いちばん遠い所で、約一・六七倍。"}, {"t": 1310.3833333333334, "x": "地球の軌道の少し内側から、"}, {"t": 1312.4166666666667, "x": "火星の軌道の外側までを回る道です。"}, {"t": 1315.4333333333334, "x": "この車の位置は、打ち上げの直後、"}, {"t": 1318.05, "x": "地上の望遠鏡で測られました。"}, {"t": 1320.5166666666667, "x": "ジェット推進研究所の記録では、測定は"}, {"t": 1323.5333333333333, "x": "二〇一八年二月八日から三月十九日までの三百七十四回。"}, {"t": 1328.2, "x": "明るさは、二月二十日までが二十等、"}, {"t": 1330.9166666666667, "x": "四月の中ごろまでが二十二等。"}, {"t": 1333.3333333333333, "x": "六月の中ごろには、二十六等より暗くなっていきました。"}, {"t": 1337.3666666666666, "x": "車は、打ち上げから半年もたたないうちに、"}, {"t": 1340.4333333333334, "x": "大きな望遠鏡でも写すのが難しい暗さになっていきました。"}, {"t": 1344.6333333333334, "x": "それから七年近くたった、二〇二五年の一月。"}, {"t": 1348.45, "x": "二〇二五年一月二日、小惑星センターは、"}, {"t": 1352.0166666666667, "x": "新しく見つかった小天体として、"}, {"t": 1354.5166666666667, "x": "2018 CN41という符号を発表しました。"}, {"t": 1358.9833333333333, "x": "この物体の観測は、二〇一八年二月のものでした。"}, {"t": 1362.85, "x": "複数の観測所が撮った、どの天体とも結びついていない"}, {"t": 1366.7166666666667, "x": "観測の断片があり、それを一人の市民の観測者が"}, {"t": 1370.35, "x": "つなぎ合わせて、一つの軌道にしたのです。"}, {"t": 1373.1833333333334, "x": "その軌道は、地球の軌道に、約〇・〇〇一六天文単位、"}, {"t": 1378.0166666666667, "x": "つまりおよそ二十四万キロメートルまで近づくものでした。"}, {"t": 1381.8, "x": "月までの距離より近い値です。"}, {"t": 1383.9666666666667, "x": "翌日、二〇二五年一月三日。"}, {"t": 1387.0333333333333, "x": "小惑星センターは、短い通知を出しました。"}, {"t": 1390.45, "x": "前日に発表した2018 CN41の符号を、削除する。"}, {"t": 1395.7666666666667, "x": "この軌道は、人工物、2018-017A、"}, {"t": 1400.9, "x": "ファルコン・ヘビーの上段と"}, {"t": 1402.6333333333334, "x": "テスラ・ロードスターの軌道と一致すると、"}, {"t": 1404.85, "x": "指摘があったためだ、という内容です。"}, {"t": 1407.6833333333334, "x": "同じ日、ジェット推進研究所は、"}, {"t": 1410.25, "x": "この車の軌道の記録を書き直しました。"}, {"t": 1413.25, "x": "二〇一八年の観測の中に、この車のものだと"}, {"t": 1416.9, "x": "新しく分かった分があったためです。"}, {"t": 1418.9833333333333, "x": "つまり、打ち上げの直後に写っていたのに、"}, {"t": 1421.85, "x": "七年のあいだ、それが車だとは誰にも"}, {"t": 1424.95, "x": "結びつけられていなかった観測があった、ということです。"}, {"t": 1428.5166666666667, "x": "天文学の雑誌の記事は、同じように、宇宙機が"}, {"t": 1432.25, "x": "小惑星と const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
