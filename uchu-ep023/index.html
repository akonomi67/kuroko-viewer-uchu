<script>
const D={"name": "ep023", "file": "ep023", "dur": 1812.71665625, "segs": [], "subs": [{"t": 0.0, "x": "南太平洋の海の底には、宇宙から"}, {"t": 2.9, "x": "降ろされた機体が沈んでいます。"}, {"t": 4.733333333333333, "x": "その中に、ミールもあります。"}, {"t": 6.95, "x": "百三十五トンの宇宙ステーションです。"}, {"t": 9.366666666666667, "x": "ヨーロッパの補給船も。"}, {"t": 11.033333333333333, "x": "日本の補給船が積んでいた小さな球も。"}, {"t": 13.816666666666666, "x": "沈めた先は、陸から最も遠い海です。"}, {"t": 16.966666666666665, "x": "その中心から最も近い陸までは、"}, {"t": 19.3, "x": "約二千六百八十八キロメートルあります。"}, {"t": 22.533333333333335, "x": "南緯四十八度五十二・六分。"}, {"t": 24.9, "x": "西経百二十三度二十三・六分。"}, {"t": 27.65, "x": "この点はポイント・ネモと呼ばれています。"}, {"t": 30.05, "x": "役目を終えた宇宙機は地球に向けて最後の噴射をします。"}, {"t": 33.733333333333334, "x": "その行き先として選ばれてきたのが、この海の一帯です。"}, {"t": 37.46666666666667, "x": "ただ、沈んだ機体を海の底で写した写真は見当たりません。"}, {"t": 41.516666666666666, "x": "少なくとも、公開された記録の中にはありません。"}, {"t": 44.96666666666667, "x": "どこに、どれだけのかけらが積もっているのか。"}, {"t": 47.93333333333333, "x": "それを確かめに行った記録もありません。"}, {"t": 50.31666666666667, "x": "海の上には何の目印もありません。"}, {"t": 52.7, "x": "沈めた場所を示す碑もありません。"}, {"t": 54.88333333333333, "x": "そして今この海に向けて大きな予定が組まれています。"}, {"t": 58.21666666666667, "x": "国際宇宙ステーションです。"}, {"t": 60.016666666666666, "x": "運用を終えたあと、この海へ落とす計画になっています。"}, {"t": 63.766666666666666, "x": "ここから先は、陸から最も遠い海の記録をたどります。"}, {"t": 67.75, "x": "そこへ送られた機体が、どのように最後を迎えたのか。"}, {"t": 71.43333333333334, "x": "そして、何が記録に残り、何が残らなかったのか。"}, {"t": 75.53333333333333, "x": "それを順に見ていきます。"}, {"t": 77.16666666666667, "x": "ポイント・ネモの位置は、三つの島から決まります。"}, {"t": 80.41666666666667, "x": "アメリカの海洋大気庁はここを説明しています。"}, {"t": 83.63333333333334, "x": "陸から最も遠い、海の上の場所。"}, {"t": 86.43333333333334, "x": "最も近い陸は三つあります。"}, {"t": 88.58333333333333, "x": "北にあるのは、デュシー島です。"}, {"t": 90.86666666666666, "x": "ピトケアン諸島に含まれる小さな島です。"}, {"t": 93.55, "x": "北東にあるのは、モツ・ヌイです。"}, {"t": 95.93333333333334, "x": "イースター島のそばにある島の一つです。"}, {"t": 98.43333333333334, "x": "南にあるのは、マーハー島です。"}, {"t": 100.9, "x": "南極大陸に属する島です。"}, {"t": 103.01666666666667, "x": "この三つの陸から、ポイント・ネモまでの距離は同じです。"}, {"t": 106.68333333333334, "x": "どれも約二千六百八十八キロメートル離れています。"}, {"t": 110.28333333333333, "x": "三つの陸から等しく離れた点は"}, {"t": 112.35, "x": "どの陸からも遠い点になります。"}, {"t": 114.31666666666666, "x": "そういう考え方で決められた場所です。"}, {"t": 116.78333333333333, "x": "地図の上では、ただの点です。"}, {"t": 119.03333333333333, "x": "目印になるものは何もありません。"}, {"t": 121.26666666666667, "x": "島も岩も灯台もありません。"}, {"t": 123.3, "x": "あるのは緯度と経度の数字だけです。"}, {"t": 125.53333333333333, "x": "そこに立つことはできません。"}, {"t": 127.3, "x": "立てるのは船の上だけです。"}, {"t": 129.13333333333333, "x": "この点を計算で割り出したのは、一人の技術者でした。"}, {"t": 132.8, "x": "フルヴォイェ・ルカテラという人物です。"}, {"t": 134.95, "x": "地球の形を細かく扱う計算の道具を作っていました。"}, {"t": 138.78333333333333, "x": "その道具でこの点を求めたとされています。"}, {"t": 141.46666666666667, "x": "この点のまわりにはほとんど船が通りません。"}, {"t": 144.21666666666667, "x": "一方で、空のずっと上には人が通ることがあります。"}, {"t": 147.93333333333334, "x": "国際宇宙ステーションは高さ"}, {"t": 149.71666666666667, "x": "約四百十五キロメートルを回っています。"}, {"t": 152.36666666666667, "x": "軌道は赤道に対して五十一・六度傾いています。"}, {"t": 155.93333333333334, "x": "南へは南緯五十一・六度まで届きます。"}, {"t": 158.9, "x": "ポイント・ネモは南緯四十八度あまりです。"}, {"t": 161.5, "x": "ですから宇宙ステーションは"}, {"t": 162.9, "x": "この点の上空を通ることがあります。"}, {"t": 165.2, "x": "最も近い陸までは、約二千六百八十八キロメートル。"}, {"t": 169.48333333333332, "x": "真上を通る宇宙ステーションまでは、"}, {"t": 171.5, "x": "約四百十五キロメートル。"}, {"t": 173.63333333333333, "x": "その瞬間を考えてみます。"}, {"t": 175.58333333333334, "x": "最も近くにいる人間は、宇宙ステーションの"}, {"t": 178.68333333333334, "x": "乗組員かもしれません。"}, {"t": 180.21666666666667, "x": "陸から遠いことは、人の暮らしから遠いことでもあります。"}, {"t": 183.95, "x": "宇宙から重いものを降ろすとき、"}, {"t": 185.8, "x": "その遠さが意味を持ちます。"}, {"t": 187.88333333333333, "x": "アメリカ政府は大気に入る宇宙機に"}, {"t": 190.11666666666667, "x": "一つの基準を求めています。"}, {"t": 191.93333333333334, "x": "地上の人に害が及ぶ見込みを、"}, {"t": 194.03333333333333, "x": "一万分の一より小さくすること。"}, {"t": 196.68333333333334, "x": "なぜ、こうした基準が要るのでしょうか。"}, {"t": 199.36666666666667, "x": "宇宙にあるものは、いつまでも"}, {"t": 201.41666666666666, "x": "回り続けるわけではありません。"}, {"t": 203.26666666666668, "x": "低いところを回る機体は薄い大気に"}, {"t": 205.5, "x": "少しずつ速さを奪われます。"}, {"t": 207.36666666666667, "x": "やがて高さを失い、大気の中へ入ってきます。"}, {"t": 210.78333333333333, "x": "ヨーロッパ宇宙機関によると、その数は少なくありません。"}, {"t": 214.68333333333334, "x": "一メートルを超える物体がおよそ週に"}, {"t": 217.0, "x": "一度の割合で大気に入ってきます。"}, {"t": 219.25, "x": "とても大きな物体となると、一年に数えるほどです。"}, {"t": 223.03333333333333, "x": "追跡されている小さなかけらなら、"}, {"t": 225.15, "x": "一日に平均で二つほどです。"}, {"t": 227.61666666666667, "x": "毎日のように、何かが空から"}, {"t": 230.1, "x": "戻ってきていることになります。"}, {"t": 231.71666666666667, "x": "その多くは大気との摩擦で熱くなります。"}, {"t": 234.4, "x": "そして、燃えてなくなります。"}, {"t": 236.58333333333334, "x": "けれども、すべてが燃えるわけではありません。"}, {"t": 239.45, "x": "ヨーロッパ宇宙機関は、大きな機体に"}, {"t": 242.18333333333334, "x": "ついてこう書いています。"}, {"t": 243.55, "x": "制御されずに落ちた場合の話です。"}, {"t": 246.0, "x": "重さの二十パーセントから四十パーセントが"}, {"t": 248.66666666666666, "x": "燃え残ることがある。"}, {"t": 249.86666666666667, "x": "燃え残りやすいのは溶けにくい材料です。"}, {"t": 252.46666666666667, "x": "ステンレスの鋼や、チタンです。"}, {"t": 254.81666666666666, "x": "これまでに落ちてきたかけらで"}, {"t": 256.4, "x": "人がけがをした例は知られていません。"}, {"t": 258.5833333333333, "x": "それでも、重い機体ほど燃え残る量も大きくなります。"}, {"t": 262.3333333333333, "x": "そこで、はじめに挙げた一万分の一の基準が使われます。"}, {"t": 266.3666666666667, "x": "この基準を守れない大きな機体は"}, {"t": 268.48333333333335, "x": "落ちる場所を選ばなければなりません。"}, {"t": 270.6166666666667, "x": "これを制御された再突入と呼びます。"}, {"t": 273.15, "x": "やり方はこうです。"}, {"t": 274.46666666666664, "x": "まず、機体のエンジンを進む向きと逆に噴かします。"}, {"t": 278.03333333333336, "x": "すると速さが落ちます。"}, {"t": 279.6166666666667, "x": "機体は大気に向かって沈み始めます。"}, {"t": 282.06666666666666, "x": "噴射の時刻と強さを決めれば、"}, {"t": 284.06666666666666, "x": "かけらが落ちる場所を選べます。"}, {"t": 286.3, "x": "かけらが落ちる範囲は、細長い帯の形になります。"}, {"t": 290.03333333333336, "x": "その帯を人のいない海の上に置きます。"}, {"t": 292.53333333333336, "x": "それが、制御された再突入の目的です。"}, {"t": 295.76666666666665, "x": "噴射の時刻がずれれば、帯の位置もずれます。"}, {"t": 298.98333333333335, "x": "だから最後の噴射には正確さが求められます。"}, {"t": 302.06666666666666, "x": "帯を置く先は、理想的には海の上だとされています。"}, {"t": 305.8, "x": "海の中でも、船も島も少ない場所がよいことになります。"}, {"t": 309.76666666666665, "x": "そうして選ばれてきたのがポイント・ネモの"}, {"t": 311.95, "x": "まわりの海でした。"}, {"t": 313.06666666666666, "x": "アメリカ航空宇宙局の文書は、"}, {"t": 315.2, "x": "この一帯に名前をつけています。"}, {"t": 317.55, "x": "南太平洋の、人の住まない海域。"}, {"t": 320.5833333333333, "x": "英語の頭文字をとってスポウアと書かれます。"}, {"t": 323.4166666666667, "x": "ここに沈んだ宇宙機の数について"}, {"t": 325.48333333333335, "x": "公式の目録は見当たりません。"}, {"t": 327.51666666666665, "x": "アメリカの科学雑誌に、ポピュラー・サイエンスが"}, {"t": 330.51666666666665, "x": "あります。"}, {"t": 331.03333333333336, "x": "その二〇一六年の記事が、数を挙げました。"}, {"t": 334.3333333333333, "x": "一九七一年からの間に二百六十三機を"}, {"t": 337.93333333333334, "x": "超える宇宙機がここに落とされた。"}, {"t": 339.8666666666667, "x": "そういう集計です。"}, {"t": 341.26666666666665, "x": "ただし、何をもとに数えたのかは記事に書かれていません。"}, {"t": 345.1166666666667, "x": "ここでは、この数を一つの目安としてだけ扱います。"}, {"t": 348.8333333333333, "x": "記事が数え始めた一九七一年。"}, {"t": 351.78333333333336, "x": "それはある機体が初めて降ろされた年でした。"}, {"t": 354.53333333333336, "x": "世界で最初の宇宙ステーションは、"}, {"t": 356.6166666666667, "x": "最後にどこへ行ったのでしょうか。"}, {"t": 358.85, "x": "一九七一年四月十九日。"}, {"t": 361.68333333333334, "x": "ソビエト連邦がサリュートという機体を打ち上げました。"}, {"t": 364.93333333333334, "x": "人が中で暮らしながら働く、宇宙の住まいです。"}, {"t": 368.46666666666664, "x": "これが、その最初の宇宙ステーションでした。"}, {"t": 371.3333333333333, "x": "軌道に乗ったときの重さは約十八トンです。"}, {"t": 374.21666666666664, "x": "サリュートは百七十五日間、宇宙にとどまりました。"}, {"t": 378.05, "x": "半年に少し足りない長さです。"}, {"t": 380.1666666666667, "x": "そして一九七一年十月十一日。"}, {"t": 383.53333333333336, "x": "地上の管制はサリュートを大気に"}, {"t": 385.6166666666667, "x": "向けて降ろす指示を出しました。"}, {"t": 387.4166666666667, "x": "機体は燃えながら壊れていきました。"}, {"t": 389.65, "x": "落ちていった先は太平洋の上です。"}, {"t": 392.03333333333336, "x": "アメリカ航空宇宙局の記録は"}, {"t": 394.0833333333333, "x": "この降ろし方を書き留めています。"}, {"t": 395.96666666666664, "x": "壊れることを前提にした再突入。"}, {"t": 398.3666666666667, "x": "宇宙ステーションは、いつか降ろさなければなりません。"}, {"t": 401.73333333333335, "x": "最初の宇宙ステーションが、最初にその手順を踏みました。"}, {"t": 405.56666666666666, "x": "壊れる前提で降ろす。"}, {"t": 407.1666666666667, "x": "それが、宇宙ステーションの終わらせ方の始まりでした。"}, {"t": 410.71666666666664, "x": "ここで反対の例も一つ見ておきます。"}, {"t": 413.18333333333334, "x": "アメリカが最初に打ち上げた"}, {"t": 414.85, "x": "宇宙ステーション、スカイラブです。"}, {"t": 417.1166666666667, "x": "最後の乗組員が離れたのは、一九七四年二月八日でした。"}, {"t": 422.1333333333333, "x": "その後、スカイラブは誰もいないまま回り続けました。"}, {"t": 425.6666666666667, "x": "そのときの高さは、四百三十キロメートルから"}, {"t": 428.9166666666667, "x": "四百五十キロメートルほどです。"}, {"t": 430.93333333333334, "x": "すぐに落ちてくる高さではありませんでした。"}, {"t": 433.51666666666665, "x": "重さは約七十七トンです。"}, {"t": 435.6, "x": "それまでに大気へ戻った宇宙機の"}, {"t": 437.6166666666667, "x": "中で、最も重いものでした。"}, {"t": 439.8666666666667, "x": "アメリカ航空宇宙局には計画がありました。"}, {"t": 442.81666666666666, "x": "初期のスペースシャトルの飛行で、スカイラブに近づく。"}, {"t": 446.35, "x": "そこにロケットを取り付ける。"}, {"t": 448.03333333333336, "x": "そのロケットで、もっと高い軌道へ上げる。"}, {"t": 450.93333333333334, "x": "あるいは、太平洋へ降ろす。"}, {"t": 453.2, "x": "ところが、スペースシャトルの準備が遅れました。"}, {"t": 456.35, "x": "一九七八年十二月、その計画は取りやめになりました。"}, {"t": 461.1, "x": "さらに、太陽の活動が予想より強くなりました。"}, {"t": 464.75, "x": "太陽が活発になると、地球の大気がふくらみます。"}, {"t": 468.43333333333334, "x": "ふくらんだ大気はスカイラブの"}, {"t": 470.05, "x": "速さを予想より早く奪いました。"}, {"t": 472.2, "x": "一九七九年七月十一日。"}, {"t": 475.28333333333336, "x": "管制は最後に、機体をゆっくり回転させる"}, {"t": 478.46666666666664, "x": "指示を出しました。"}, {"t": 479.55, "x": "落ちる位置を、少しでも動かすためです。"}, {"t": 482.3833333333333, "x": "スカイラブはインド洋の上空で壊れました。"}, {"t": 485.06666666666666, "x": "そこから先は、地上から操れませんでした。"}, {"t": 488.21666666666664, "x": "かけらはインド洋と西オーストラリアに"}, {"t": 490.43333333333334, "x": "またがって落ちました。"}, {"t": 491.68333333333334, "x": "記録に残る落下の帯は、長さ約二千四百五十マイルです。"}, {"t": 496.1, "x": "キロメートルにすると、"}, {"t": 497.3833333333333, "x": "約三千九百キロメートルになります。"}, {"t": 500.25, "x": "重い機体を、狙った海へ確実に送り届けること。"}, {"t": 503.96666666666664, "x": "それができるかどうかで、落ちる先は大きく変わります。"}, {"t": 507.6166666666667, "x": "その手順が最も大きな規模で"}, {"t": 509.51666666666665, "x": "行われたのは、二〇〇一年でした。"}, {"t": 512.0833333333334, "x": "ミールはロシアが運用した宇宙ステーションです。"}, {"t": 514.8333333333334, "x": "組み立ては一九八六年に始まりました。"}, {"t": 518.05, "x": "いくつもの部屋をつなぎ足して、大きくなっていきました。"}, {"t": 521.5833333333334, "x": "アメリカ航空宇宙局のマーシャル宇宙飛行センターは"}, {"t": 524.7333333333333, "x": "その重さを発表しています。"}, {"t": 526.5166666666667, "x": "百三十五トンです。"}, {"t": 528.0333333333333, "x": "中心の部屋だけで約二十トン。"}, {"t": 530.1166666666667, "x": "スペクトルという部屋が約十九トン。"}, {"t": 532.4166666666666, "x": "プリローダという部屋も約十九トンありました。"}, {"t": 535.2666666666667, "x": "十五年にわたって回り続けたあとミールは"}, {"t": 537.7833333333333, "x": "降ろされることになりました。"}, {"t": 539.3333333333334, "x": "これだけ重い機体を、制御せずに"}, {"t": 541.7666666666667, "x": "落とすわけにはいきません。"}, {"t": 543.25, "x": "降ろす力は、ミールにつながれた補給船が受け持ちました。"}, {"t": 547.1166666666667, "x": "マーシャル宇宙飛行センターの発表には、こうもあります。"}, {"t": 550.75, "x": "噴射をしなければ、遅くとも"}, {"t": 552.8666666666667, "x": "三月二十八日までに落ちてくる。"}, {"t": 555.1833333333333, "x": "落ちる日は、もう遠くありませんでした。"}, {"t": 557.8666666666667, "x": "待っていれば、どこに落ちるか分からなくなります。"}, {"t": 561.05, "x": "だから自分から降ろす日を選んだのです。"}, {"t": 563.4666666666667, "x": "降りる直前のミールでは、五つの部屋に"}, {"t": 566.1833333333333, "x": "空気が満たされたままでした。"}, {"t": 567.8666666666667, "x": "人が暮らすための空気です。"}, {"t": 569.6333333333333, "x": "二〇〇一年三月二十三日。"}, {"t": 571.9666666666667, "x": "モスクワの時間で午前八時ごろ、"}, {"t": 574.0833333333334, "x": "最後の降下が始まりました。"}, {"t": 576.3333333333334, "x": "補給船のエンジンが噴かされました。"}, {"t": 578.5, "x": "ミールの速さが落ちていきます。"}, {"t": 580.4166666666666, "x": "高さ約百キロメートルで、ミールは大気に入りました。"}, {"t": 584.1, "x": "空気との摩擦で外側が熱くなっていきます。"}, {"t": 586.9333333333333, "x": "高さ約九十五キロメートル。"}, {"t": 588.9333333333333, "x": "空気の力で太陽電池の板がもぎ取られました。"}, {"t": 592.1, "x": "高さ約八十五キロメートル。"}, {"t": 594.1166666666667, "x": "外に張り出した部分は、すべて引きはがされました。"}, {"t": 597.5166666666667, "x": "中心の部屋も折れ曲がり始めました。"}, {"t": 599.8666666666667, "x": "ミールが大気に入ったのは、フィジーの上空でした。"}, {"t": 603.1666666666666, "x": "ナンディという町の近くです。"}, {"t": 605.0, "x": "燃え残ったかけらはニュージーランドの東へ"}, {"t": 607.4666666666667, "x": "落ちていきました。"}, {"t": 608.4666666666667, "x": "南太平洋の海です。"}, {"t": 610.25, "x": "その様子を見た人たちは大きな衝撃音を"}, {"t": 612.9833333333333, "x": "聞いたと伝えています。"}, {"t": 614.3166666666667, "x": "速く落ちるかけらが、音の壁を破った音だとされています。"}, {"t": 618.3833333333333, "x": "燃え残ったのは二十トンから"}, {"t": 620.0333333333333, "x": "二十五トンほどと見積もられています。"}, {"t": 622.1833333333333, "x": "百三十五トンのうち、六分の一ほどです。"}, {"t": 625.5166666666667, "x": "落ちる前、マーシャル宇宙飛行センターは"}, {"t": 628.1333333333333, "x": "説明していました。"}, {"t": 629.3333333333334, "x": "ミールは、六つかそれ以上の大きな部分に分かれる。"}, {"t": 632.75, "x": "海面に届くのは二十トンほどで、"}, {"t": 634.8666666666667, "x": "多くは小さなかけらになる。"}, {"t": 636.95, "x": "そして、こうも書いています。"}, {"t": 639.1, "x": "制御された降下なら大きな違いはない。"}, {"t": 641.7, "x": "燃え残るのが二十トンでも百三十五トン全部でも同じだ。"}, {"t": 645.3666666666667, "x": "落ちる場所を、あらかじめ人のいない海に"}, {"t": 648.1666666666666, "x": "決めてあるからです。"}, {"t": 649.3, "x": "十五年分の暮らしと実験の舞台は、南太平洋に沈みました。"}, {"t": 653.9, "x": "降下が始まってから海に届くまで、"}, {"t": 656.1333333333333, "x": "一日もかかりませんでした。"}, {"t": 658.2333333333333, "x": "ミールのかけらが、海の底のどこに横たわっているのか。"}, {"t": 661.9, "x": "それを写した写真は、公開された"}, {"t": 664.45, "x": "記録の中には見当たりません。"}, {"t": 666.2666666666667, "x": "ミールのあとも、この海には機体が送られ続けました。"}, {"t": 669.8833333333333, "x": "その中には、国際宇宙ステーションへ"}, {"t": 672.55, "x": "荷物を運んだ補給船があります。"}, {"t": 674.6833333333333, "x": "補給船は荷物を届けたあとにごみを積みます。"}, {"t": 677.7333333333333, "x": "宇宙ステーションで出たごみです。"}, {"t": 679.65, "x": "そして、ごみごと大気に入って燃えます。"}, {"t": 682.5333333333333, "x": "それが最後の仕事です。"}, {"t": 684.25, "x": "ヨーロッパの補給船、エーティーブイもその一つでした。"}, {"t": 687.9166666666666, "x": "一号機の名前は、ジュール・ヴェルヌ。"}, {"t": 690.45, "x": "ポイント・ネモの名前のもとになった"}, {"t": 692.2833333333333, "x": "小説の、作者の名前です。"}, {"t": 694.5166666666667, "x": "二〇〇八年三月九日、ジュール・ヴェルヌは"}, {"t": 697.6, "x": "打ち上げられました。"}, {"t": 698.7, "x": "南米の、フランス領ギアナからです。"}, {"t": 701.35, "x": "新しい型のアリアン5ロケットが、"}, {"t": 703.6166666666667, "x": "初めて運んだ荷物でした。"}, {"t": 705.7333333333333, "x": "宇宙ステーションには、合わせて"}, {"t": 707.7833333333333, "x": "約六トンの荷物を届けました。"}, {"t": 709.8333333333334, "x": "燃料や水、酸素。"}, {"t": 711.7666666666667, "x": "食料や服、交換用の部品です。"}, {"t": 714.6666666666666, "x": "宇宙ステーションには、約五か月間つながっていました。"}, {"t": 718.25, "x": "そのあいだに四回宇宙ステーションを"}, {"t": 720.3166666666667, "x": "高い軌道へ押し上げています。"}, {"t": 722.1833333333333, "x": "古い人工衛星のかけらを避ける動きも、一度行いました。"}, {"t": 726.4, "x": "二〇〇八年九月五日、ジュール・ヴェルヌは"}, {"t": 729.2833333333333, "x": "宇宙ステーションを離れました。"}, {"t": 731.0166666666667, "x": "積んでいたのは約二・五トンのごみです。"}, {"t": 733.5, "x": "それから二十三日間、落ちる位置を"}, {"t": 736.2333333333333, "x": "合わせる動きを続けました。"}, {"t": 737.9166666666666, "x": "二〇〇八年九月二十九日。"}, {"t": 740.1, "x": "ヨーロッパ中部の時間で、午後二時五十八分。"}, {"t": 743.4666666666667, "x": "最後の噴射が行われました。"}, {"t": 745.55, "x": "速さは秒速七十メートル落ちました。"}, {"t": 748.1666666666666, "x": "午後三時三十一分。"}, {"t": 749.7833333333333, "x": "大気に触れたのは、高さ約百二十キロメートル。"}, {"t": 753.2333333333333, "x": "高さ約七十五キロメートルで、"}, {"t": 755.3166666666667, "x": "機体はばらばらになりました。"}, {"t": 757.3166666666667, "x": "残ったかけらは、その約十二分後に太平洋へ落ちました。"}, {"t": 761.4166666666666, "x": "落ちたあたりの海は、時計で数えるとまだ夜明け前でした。"}, {"t": 765.2333333333333, "x": "ヨーロッパ宇宙機関は、そこをこう書いています。"}, {"t": 768.4666666666667, "x": "まったく人の住まない、南太平洋の海域。"}, {"t": 771.9333333333333, "x": "このとき、空の上から見ていた人たちがいました。"}, {"t": 775.3166666666667, "x": "特別な装置を積んだ、二機の観測用の飛行機です。"}, {"t": 779.2166666666667, "x": "二機は機体が通る道筋の近くを飛んでいました。"}, {"t": 782.35, "x": "宇宙ステーションからも、その様子が記録されました。"}, {"t": 785.75, "x": "なぜ、わざわざ見に行ったのでしょうか。"}, {"t": 788.4, "x": "機体がどう壊れるかはそれまで"}, {"t": 790.2, "x": "主に計算で見積もられていました。"}, {"t": 792.35, "x": "本当に計算どおりに壊れるのか。"}, {"t": 794.7, "x": "それを確かめる必要があったのです。"}, {"t": 797.0, "x": "燃えながらばらばらになる光の"}, {"t": 798.7833333333333, "x": "筋は、映像として残りました。"}, {"t": 801.25, "x": "エーティーブイの技術は、その後も生きています。"}, {"t": 804.25, "x": "アメリカの宇宙船オリオンに受け継がれました。"}, {"t": 806.9666666666667, "x": "電気や推進を受け持つ部分です。"}, {"t": 809.2166666666667, "x": "補給船そのものは海に沈みました。"}, {"t": 811.6333333333333, "x": "けれども、作り方の記録は次の機体に残りました。"}, {"t": 815.3, "x": "エーティーブイは、そのあと四機が続きました。"}, {"t": 818.2833333333333, "x": "二号機はヨハネス・ケプラー。"}, {"t": 820.0333333333333, "x": "三号機はエドアルド・アマルディ。"}, {"t": 821.9666666666667, "x": "四号機はアルベルト・アインシュタイン。"}, {"t": 824.05, "x": "五号機はジョルジュ・ルメートルです。"}, {"t": 826.0333333333333, "x": "五機で運んだ荷物は合わせて"}, {"t": 827.7, "x": "三万一千五百キログラムを超えます。"}, {"t": 830.1333333333333, "x": "そして五機とも、制御された再突入で最後を迎えました。"}, {"t": 834.1833333333333, "x": "行き先は、どれも南太平洋の人の住まない海域です。"}, {"t": 838.2333333333333, "x": "けれども、沈んだあとのかけらの姿は残っていません。"}, {"t": 841.8166666666667, "x": "記録はいつも海面の上で終わっています。"}, {"t": 844.4166666666666, "x": "日本の補給船はこうのとりと呼ばれています。"}, {"t": 847.3333333333334, "x": "二〇〇九年の一号機から、二〇二〇年の"}, {"t": 850.45, "x": "九号機まで飛びました。"}, {"t": 851.9166666666666, "x": "二〇一二年、その三号機に小さな球が積まれました。"}, {"t": 855.8833333333333, "x": "名前は、アイボールです。"}, {"t": 857.9, "x": "壊れていく機体を、内側から写すための球でした。"}, {"t": 861.5, "x": "作ったのは、日本の宇宙航空研究開発機構です。"}, {"t": 865.4833333333333, "x": "IHIエアロスペースという企業と一緒に作りました。"}, {"t": 869.0333333333333, "x": "外側の直径は四百ミリメートル。"}, {"t": 871.5166666666667, "x": "覆いを含めない重さは、十五・五キログラムです。"}, {"t": 875.1166666666667, "x": "アイボールはこうのとりの中に置かれます。"}, {"t": 877.5833333333334, "x": "そして、機体と一緒に大気に入ります。"}, {"t": 880.5333333333333, "x": "まわりの機体が壊れていくあいだ写真や"}, {"t": 882.8666666666667, "x": "揺れの記録を集めます。"}, {"t": 884.4, "x": "自分がいる位置も記録します。"}, {"t": 886.3333333333334, "x": "機体が壊れたあともアイボールは"}, {"t": 888.1666666666666, "x": "熱から守られて落ちていきます。"}, {"t": 890.1166666666667, "x": "途中でパラシュートを開き、海に降ります。"}, {"t": 893.1333333333333, "x": "そして海の上から、通信衛星を"}, {"t": 895.7, "x": "使って記録を地上へ送ります。"}, {"t": 897.7333333333333, "x": "送り終えたら、やがて沈みます。"}, {"t": 900.15, "x": "アイボールは、回収されない前提で作られていました。"}, {"t": 903.7833333333333, "x": "両手でかかえるほどの大きさの球です。"}, {"t": 906.2, "x": "拾いに行く船はいません。"}, {"t": 907.9, "x": "記録さえ届けば、それで役目は終わりです。"}, {"t": 910.9333333333333, "x": "二〇一二年九月十四日。"}, {"t": 912.9666666666667, "x": "こうのとり三号機は前の日に"}, {"t": 914.8166666666667, "x": "宇宙ステーションを離れていました。"}, {"t": 916.7833333333333, "x": "日本の時間で午後二時二十七分。"}, {"t": 919.2333333333333, "x": "機体は大気に入りました。"}, {"t": 921.0, "x": "約五十六日をかけた、荷物を運ぶ仕事の終わりです。"}, {"t": 925.0833333333334, "x": "アイボールが海に降りたのは、午後三時三分ごろです。"}, {"t": 928.8, "x": "場所は南緯五十一・八六七度。"}, {"t": 931.25, "x": "西経百二十九・〇一七度。"}, {"t": 933.7666666666667, "x": "この位置からポイント・ネモまでを計算してみます。"}, {"t": 936.5666666666667, "x": "およそ五百二十キロメートルです。"}, {"t": 938.75, "x": "宇宙航空研究開発機構は、その結果を発表しました。"}, {"t": 943.0, "x": "予定していた記録は、無事に取れた。"}, {"t": 945.5666666666667, "x": "公開された写真が一枚あります。"}, {"t": 947.8833333333333, "x": "高さ約七十キロメートルの様子が写っています。"}, {"t": 951.0166666666667, "x": "燃えながら壊れていく、こうのとり三号機の姿です。"}, {"t": 954.8166666666667, "x": "後ろ側のカメラで写したものでした。"}, {"t": 957.1666666666666, "x": "燃える機体を中から写した写真は、"}, {"t": 959.4, "x": "こうして地上に届きました。"}, {"t": 961.45, "x": "一方で、写真を送った球そのものは海に残りました。"}, {"t": 965.3333333333334, "x": "アイボールは、このあたりの"}, {"t": 967.2166666666667, "x": "海の底のどこかにあるはずです。"}, {"t": 969.1166666666667, "x": "ただ、その姿を写した写真はありません。"}, {"t": 972.1, "x": "こうのとりはそのあとも飛び続けました。"}, {"t": 974.45, "x": "最後の九号機が大気に入ったのは、"}, {"t": 976.8166666666667, "x": "二〇二〇年八月二十日です。"}, {"t": 979.2166666666667, "x": "九機すべてが、仕事を終えて燃えつきました。"}, {"t": 982.3166666666667, "x": "後を継ぐ新しい補給船も作られています。"}, {"t": 985.2333333333333, "x": "燃える瞬間の写真は残り、沈んだあとの写真は残らない。"}, {"t": 989.3333333333334, "x": "この海の記録は、いつもそこで途切れます。"}, {"t": 992.2833333333333, "x": "球は一つの海に二つのものを残しました。"}, {"t": 995.0666666666667, "x": "届いた写真と、届かない自分の姿です。"}, {"t": 998.2, "x": "エーティーブイの最後の一機は、"}, {"t": 999.95, "x": "ジョルジュ・ルメートルです。"}, {"t": 1001.6, "x": "五号機にあたります。"}, {"t": 1003.0, "x": "重さは約二十トンです。"}, {"t": 1004.7166666666667, "x": "二〇一五年のことです。"}, {"t": 1006.4333333333333, "x": "ヨーロッパ宇宙機関はこの機体で"}, {"t": 1008.4, "x": "特別な落とし方を計画していました。"}, {"t": 1010.8666666666667, "x": "ふつうより浅い角度で、大気に入れる方法です。"}, {"t": 1014.2333333333333, "x": "ねらいは国際宇宙ステーションでした。"}, {"t": 1016.55, "x": "宇宙ステーションも、いつか"}, {"t": 1018.35, "x": "大気に入れて壊すことになります。"}, {"t": 1020.35, "x": "そのときに使う計算が、正しいかどうか。"}, {"t": 1023.4166666666666, "x": "それを確かめる記録を集めようとしたのです。"}, {"t": 1026.2166666666667, "x": "ところが、離れる少し前に問題が起きました。"}, {"t": 1029.5333333333333, "x": "電源の系統は四つあります。"}, {"t": 1031.5666666666666, "x": "そのうち一つで、電池が壊れました。"}, {"t": 1034.3, "x": "もう一つ壊れれば機体を思いどおりに"}, {"t": 1036.6, "x": "動かせなくなるおそれがあります。"}, {"t": 1038.5166666666667, "x": "ヨーロッパ宇宙機関は、浅い角度の計画をあきらめました。"}, {"t": 1042.6166666666666, "x": "機体はそれまでと同じ急な角度で"}, {"t": 1044.7833333333333, "x": "落とされることになりました。"}, {"t": 1046.3833333333334, "x": "それでも、中には記録の装置が積まれていました。"}, {"t": 1049.85, "x": "日本のアイボールと同じ考え方です。"}, {"t": 1052.4666666666667, "x": "一つは、壊れていく様子を写すカメラです。"}, {"t": 1055.6333333333334, "x": "もう一つは、その記録をためておく白い球でした。"}, {"t": 1059.0833333333333, "x": "カメラと通信の装置は、スイスの企業が作りました。"}, {"t": 1062.8, "x": "球は熱に耐える覆いに包まれていました。"}, {"t": 1065.4666666666667, "x": "機体が壊れたあとも、生き残るように作られていたのです。"}, {"t": 1069.2666666666667, "x": "そして落ちていく途中で、通信衛星に"}, {"t": 1072.0666666666666, "x": "向けて記録を送ります。"}, {"t": 1073.5166666666667, "x": "そういう仕組みでした。"}, {"t": 1074.9, "x": "二〇一五年二月十四日。"}, {"t": 1076.9333333333334, "x": "ジョルジュ・ルメートルは、"}, {"t": 1078.0666666666666, "x": "宇宙ステーションを離れました。"}, {"t": 1080.2333333333333, "x": "翌日の二月十五日。"}, {"t": 1082.0833333333333, "x": "ヨーロッパ中部の時間で、午後七時四分ごろ。"}, {"t": 1085.5333333333333, "x": "機体は、南太平洋の上空で燃えつきました。"}, {"t": 1089.0333333333333, "x": "地上の担当者は、球からの知らせを待ちました。"}, {"t": 1092.45, "x": "届いたのは一通だけでした。"}, {"t": 1094.25, "x": "装置が動いたことを知らせる知らせです。"}, {"t": 1096.7166666666667, "x": "その一通には、撮った写真の枚数が書かれていました。"}, {"t": 1100.3666666666666, "x": "六千枚近く。"}, {"t": 1101.65, "x": "写真は一枚も届いていません。"}, {"t": 1103.8, "x": "届いたのは数だけでした。"}, {"t": 1105.5, "x": "カメラも球も、計画どおりに動いていたことになります。"}, {"t": 1109.25, "x": "けれども、写真そのものを運ぶ"}, {"t": 1111.45, "x": "続きの知らせは届きませんでした。"}, {"t": 1113.6, "x": "ヨーロッパ宇宙機関は、球が"}, {"t": 1115.7666666666667, "x": "壊れずに残ったと書いています。"}, {"t": 1117.6666666666667, "x": "写真が撮られたことを示す記録も、送ってきました。"}, {"t": 1121.2, "x": "ただし、写真は一枚も取り戻せませんでした。"}, {"t": 1124.5666666666666, "x": "なぜ続きが届かなかったのか。"}, {"t": 1126.5333333333333, "x": "担当者は、それを調べるとしていました。"}, {"t": 1129.4333333333334, "x": "六千枚の写真は、撮られたことだけが分かっています。"}, {"t": 1133.0666666666666, "x": "担当者は、次への備えにも触れていました。"}, {"t": 1136.2, "x": "記録を中継する別の道を用意することです。"}, {"t": 1139.3, "x": "その球も写真の記録も、この海のどこかに沈みました。"}, {"t": 1143.2, "x": "ヨーロッパの補給船は、これで"}, {"t": 1145.4333333333334, "x": "五機すべてが南太平洋へ降りました。"}, {"t": 1147.95, "x": "五機目は、最後に一枚も写真を残しませんでした。"}, {"t": 1151.55, "x": "ここまでの機体は、落ちる場所を選んで降ろされました。"}, {"t": 1155.0833333333333, "x": "最後に、選べなかった機体を一つ見ておきます。"}, {"t": 1158.5333333333333, "x": "中国の宇宙の実験室、天宮一号です。"}, {"t": 1162.0, "x": "長さは十二メートル。"}, {"t": 1163.5166666666667, "x": "直径は三・三メートル。"}, {"t": 1165.3166666666666, "x": "打ち上げたときの重さは、八千五百六キログラムでした。"}, {"t": 1169.2, "x": "打ち上げは二〇一一年九月です。"}, {"t": 1171.6, "x": "人が中に入って実験をするための機体でした。"}, {"t": 1174.5833333333333, "x": "天宮一号には二〇一三年から誰もいませんでした。"}, {"t": 1178.1666666666667, "x": "二〇一六年からは、地上との連絡も途絶えていました。"}, {"t": 1182.0333333333333, "x": "エンジンを噴かして、落ちる場所を選ぶことはできません。"}, {"t": 1185.6166666666666, "x": "ヨーロッパ宇宙機関は制御されないまま大気に"}, {"t": 1188.4166666666667, "x": "入ると見ていました。"}, {"t": 1189.6333333333334, "x": "いつ、どこに落ちるのか。"}, {"t": 1191.6666666666667, "x": "それは直前まで、細かくは決められません。"}, {"t": 1194.8, "x": "分かっていたのは、落ちうる範囲だけでした。"}, {"t": 1197.6166666666666, "x": "北緯四十二・八度から南緯四十二・八度のあいだです。"}, {"t": 1201.45, "x": "軌道の傾きからそれより北や"}, {"t": 1203.3666666666666, "x": "南には落ちないと計算されていました。"}, {"t": 1205.8166666666666, "x": "日本の多くの地域も、この範囲に入っていました。"}, {"t": 1209.3833333333334, "x": "ただ、一人の人に当たる見込みは"}, {"t": 1211.6, "x": "とても小さいとされました。"}, {"t": 1213.2, "x": "一年のうちに雷に打たれる見込みの、約一千万分の一です。"}, {"t": 1217.7166666666667, "x": "二〇一八年四月二日。"}, {"t": 1219.6833333333334, "x": "ヨーロッパ中部の時間で、午前二時十六分ごろ。"}, {"t": 1223.2333333333333, "x": "天宮一号は大気に入りました。"}, {"t": 1225.5666666666666, "x": "アメリカ空軍の確認では、場所は南太平洋の上空でした。"}, {"t": 1230.0166666666667, "x": "中国の発表では、機体のほとんどは"}, {"t": 1232.7333333333333, "x": "燃えつきたとされています。"}, {"t": 1234.2, "x": "ヨーロッパ宇宙機関のブログは"}, {"t": 1235.9833333333333, "x": "このとき一つのことを書き添えています。"}, {"t": 1238.3, "x": "落ちた場所は、たまたまある海域から遠くなかった。"}, {"t": 1241.6833333333334, "x": "南太平洋の、無人の海域です。"}, {"t": 1244.6, "x": "宇宙機を沈めるために選ばれてきた海があります。"}, {"t": 1247.6333333333334, "x": "その近くに、選ばれずに落ちた機体がたどりつきました。"}, {"t": 1251.3833333333334, "x": "偶然です。"}, {"t": 1252.3166666666666, "x": "落ちる前、ヨーロッパ宇宙機関は"}, {"t": 1254.65, "x": "各国の観測に加わっていました。"}, {"t": 1256.8666666666666, "x": "高さ約三百キロメートルを回る"}, {"t": 1258.9833333333333, "x": "機体を、みんなで見守ったのです。"}, {"t": 1261.3333333333333, "x": "それでも最後の場所は選べませんでした。"}, {"t": 1263.8666666666666, "x": "それだけ南太平洋は広い海だ、ということでもあります。"}, {"t": 1267.95, "x": "太平洋は地球で最も広い海です。"}, {"t": 1270.6666666666667, "x": "落ちる先が海になりやすいのも、そのためです。"}, {"t": 1273.9, "x": "では、この海の底には何があるのでしょうか。"}, {"t": 1277.0333333333333, "x": "宇宙ステーションの処分を説明した文書があります。"}, {"t": 1280.1833333333334, "x": "アメリカ航空宇宙局はそこにこう書いています。"}, {"t": 1283.1833333333334, "x": "かけらが海に入ったあとは海の底に"}, {"t": 1285.4, "x": "沈んで落ち着くと見込まれる。"}, {"t": 1287.1, "x": "つまり、沈んだ機体は海の底にあるはずです。"}, {"t": 1290.35, "x": "けれども、それを確かめた写真は見当たりません。"}, {"t": 1293.6333333333334, "x": "理由の一つは海の底そのものが"}, {"t": 1295.6833333333334, "x": "まだよく分かっていないことです。"}, {"t": 1297.4333333333334, "x": "海底の地図をつくる国際的な計画があります。"}, {"t": 1300.5833333333333, "x": "日本財団なども加わる計画です。"}, {"t": 1303.15, "x": "二〇三〇年までに世界の海底を"}, {"t": 1305.4666666666667, "x": "細かく地図にすることを目指しています。"}, {"t": 1307.75, "x": "その計画は、二〇二五年六月に新しい数字を発表しました。"}, {"t": 1312.6166666666666, "x": "今の基準で地図になっている海底は、"}, {"t": 1314.8666666666666, "x": "世界の二十七・三パーセント。"}, {"t": 1317.4333333333334, "x": "残りの七割あまりは、まだ細かく測られていません。"}, {"t": 1321.05, "x": "地図さえない海の底で小さなかけらを"}, {"t": 1323.3666666666666, "x": "探すのは簡単ではありません。"}, {"t": 1325.2166666666667, "x": "しかも、ここは陸から最も遠い海です。"}, {"t": 1328.2166666666667, "x": "いちばん近い陸からでも"}, {"t": 1329.6333333333334, "x": "約二千六百八十八キロメートルあります。"}, {"t": 1332.55, "x": "そこまで行って、深い海の底にカメラを降ろす。"}, {"t": 1335.8333333333333, "x": "そういう調査が行われたという記録は見当たりません。"}, {"t": 1339.1833333333334, "x": "探しに行く理由もありません。"}, {"t": 1341.0666666666666, "x": "沈めたものは、もう使わないものだからです。"}, {"t": 1344.1333333333334, "x": "落とした側にとってこの海を"}, {"t": 1345.8, "x": "選んだ理由は、まさにその遠さでした。"}, {"t": 1348.45, "x": "人が来ない場所だから、安全に沈めることができる。"}, {"t": 1352.05, "x": "同じ理由で、沈んだあとの姿を見に行く人もいません。"}, {"t": 1355.85, "x": "サリュートも、ミールも、ジュール・ヴェルヌも。"}, {"t": 1358.8833333333334, "x": "アイボールも、ジョルジュ・ルメートルの白い球も。"}, {"t": 1361.9333333333334, "x": "燃える前の姿は、写真や映像で残っています。"}, {"t": 1365.4833333333333, "x": "燃えている最中の姿も、一部は残っています。"}, {"t": 1368.9666666666667, "x": "けれども、沈んだあとの姿だけがどこにもありません。"}, {"t": 1372.45, "x": "形を保っているのか。"}, {"t": 1374.1, "x": "砂や泥に埋もれているのか。"}, {"t": 1376.0833333333333, "x": "それを知る手がかりはありません。"}, {"t": 1378.0, "x": "宇宙機の記録は、最後の一ページだけが白いままです。"}, {"t": 1381.7833333333333, "x": "その白いページが、この海の底に重なっています。"}, {"t": 1385.2666666666667, "x": "そしてこの先、この海に迎えられる予定の機体があります。"}, {"t": 1389.2333333333333, "x": "国際宇宙ステーションです。"}, {"t": 1391.0333333333333, "x": "公式の説明では、こう紹介されています。"}, {"t": 1394.25, "x": "宇宙で作られた中で、最も大きな建造物。"}, {"t": 1397.7333333333333, "x": "アメリカ航空宇宙局によると"}, {"t": 1399.6666666666667, "x": "重さは四十三万キログラムを超えます。"}, {"t": 1402.1666666666667, "x": "その巨体が、この海の真上も通る高さを回っています。"}, {"t": 1406.05, "x": "広さは、アメリカンフットボールの競技場ほどあります。"}, {"t": 1409.7166666666667, "x": "一日に地球を十六周します。"}, {"t": 1412.05, "x": "速さは一秒に約八キロメートルです。"}, {"t": 1414.6666666666667, "x": "中の部屋を合わせた広さは、千立方メートルあまりです。"}, {"t": 1418.6166666666666, "x": "十五の国が三十年近くかけて作り、動かしてきました。"}, {"t": 1422.6666666666667, "x": "二〇〇〇年十一月からは、ずっと人が暮らしています。"}, {"t": 1426.25, "x": "訪れた人は、二十の国の二百六十五人を超えます。"}, {"t": 1430.2, "x": "最初の部分が打ち上げられたのは、一九九八年でした。"}, {"t": 1434.6333333333334, "x": "ロシアが作ったザーリャと、"}, {"t": 1436.1666666666667, "x": "アメリカが作ったユニティです。"}, {"t": 1438.3, "x": "そこから少しずつ部屋がつながれました。"}, {"t": 1440.75, "x": "組み立てには、スペースシャトルの"}, {"t": 1442.7833333333333, "x": "飛行が二十七回必要でした。"}, {"t": 1444.8833333333334, "x": "宇宙服を着て外で働く船外活動は、"}, {"t": 1447.6, "x": "百六十一回に及びました。"}, {"t": 1449.9833333333333, "x": "中心の部分は、もともと三十年使う前提で作られています。"}, {"t": 1454.4166666666667, "x": "二〇三〇年になると、最初の部分は三十二年目を迎えます。"}, {"t": 1458.9833333333333, "x": "あとから加わった部屋もあります。"}, {"t": 1460.9833333333333, "x": "アメリカの実験棟デスティニーは二〇〇一年です。"}, {"t": 1464.0666666666666, "x": "ヨーロッパの実験棟コロンバスは二〇〇八年です。"}, {"t": 1467.25, "x": "日本の実験棟きぼうも二〇〇八年に加わりました。"}, {"t": 1470.75, "x": "あとから来た部屋も、最後は同じ道をたどります。"}, {"t": 1474.1666666666667, "x": "きぼうも、この海へ向かう予定です。"}, {"t": 1476.7666666666667, "x": "日本の宇宙飛行士たちが働いてきた部屋です。"}, {"t": 1479.75, "x": "その部屋も最後は陸から最も遠い海に沈みます。"}, {"t": 1483.0666666666666, "x": "アメリカの議会は運用の期限を決めています。"}, {"t": 1485.9, "x": "少なくとも二〇三〇年九月三十日までです。"}, {"t": 1489.1666666666667, "x": "その運用を終えたあと宇宙ステーションは"}, {"t": 1491.4166666666667, "x": "海へ落とされる予定です。"}, {"t": 1492.9166666666667, "x": "ほかの方法も検討されました。"}, {"t": 1495.0333333333333, "x": "一つは、ばらばらにして地上へ持ち帰る方法です。"}, {"t": 1498.5666666666666, "x": "けれども、組み立てと同じくらいの船外活動が要ります。"}, {"t": 1502.3666666666666, "x": "スペースシャトルのような大きな荷室を"}, {"t": 1504.5166666666667, "x": "持つ機体も、今はありません。"}, {"t": 1506.65, "x": "大きな部屋は持ち帰れません。"}, {"t": 1508.5833333333333, "x": "残せるのは小さな品だけです。"}, {"t": 1510.7166666666667, "x": "そのいくつかを残す計画を、"}, {"t": 1512.5333333333333, "x": "博物館などと話し合っています。"}, {"t": 1515.0, "x": "二つ目は、もっと高い軌道へ上げて残す方法です。"}, {"t": 1518.6666666666667, "x": "高くなるほど、軌道上のかけらにぶつかる危険が増えます。"}, {"t": 1522.5666666666666, "x": "今の高さなら穴が開くほどの衝突は"}, {"t": 1525.0666666666666, "x": "平均で約五十一年に一度です。"}, {"t": 1527.45, "x": "それが高さ約八百キロメートルでは、"}, {"t": 1529.7833333333333, "x": "四年に一度より多くなります。"}, {"t": 1532.0333333333333, "x": "それに、宇宙ステーションは"}, {"t": 1533.95, "x": "人が乗っていないと保てません。"}, {"t": 1535.75, "x": "高い軌道では、人や荷物を運ぶ船が届きにくくなります。"}, {"t": 1539.9166666666667, "x": "今の高さにも、ずっとはいられません。"}, {"t": 1542.5333333333333, "x": "押し上げなければ、一年から"}, {"t": 1544.6833333333334, "x": "二年で落ちてくるとされています。"}, {"t": 1546.5833333333333, "x": "太陽の光でつくる電気で進む"}, {"t": 1548.7166666666667, "x": "エンジンを使う案もありました。"}, {"t": 1550.4833333333333, "x": "目指すのは、千年は落ちてこない高さです。"}, {"t": 1553.5333333333333, "x": "ゆっくりですが、燃料が少なくてすみます。"}, {"t": 1556.5833333333333, "x": "それでも燃料は、約一万五千キログラム要ります。"}, {"t": 1560.2666666666667, "x": "けれども、上がりきるまでに"}, {"t": 1562.1333333333334, "x": "約三年かかると見積もられました。"}, {"t": 1564.2333333333333, "x": "そのあいだにも、かけらにぶつかる危険があります。"}, {"t": 1567.3833333333334, "x": "三つ目は、宇宙でばらばらにする方法です。"}, {"t": 1570.5166666666667, "x": "そうすると一ミリメートルを"}, {"t": 1572.0833333333333, "x": "超えるかけらが約二億二千万個できます。"}, {"t": 1574.7333333333333, "x": "今、地球のまわりにある同じ大きさの"}, {"t": 1577.5, "x": "かけらは、約一億個です。"}, {"t": 1579.6333333333334, "x": "それを三倍あまりに増やすことになります。"}, {"t": 1582.25, "x": "ほかにも、小分けにして落とす案や、"}, {"t": 1584.6833333333334, "x": "企業に引き継ぐ案が並びました。"}, {"t": 1587.0666666666666, "x": "どの方法も選ばれませんでした。"}, {"t": 1589.1333333333334, "x": "残ったのが、狙った海へ落とす方法です。"}, {"t": 1592.2166666666667, "x": "二〇二二年の報告書があります。"}, {"t": 1594.65, "x": "アメリカ航空宇宙局はそこで、"}, {"t": 1596.7333333333333, "x": "落とす先を名指ししています。"}, {"t": 1598.85, "x": "南太平洋の人の住まない海域。"}, {"t": 1601.4, "x": "ポイント・ネモのまわりです。"}, {"t": 1603.0166666666667, "x": "その報告書には、見積もりもありました。"}, {"t": 1605.9166666666667, "x": "ロシアの補給船三機の力で降ろせる。"}, {"t": 1608.6, "x": "アメリカの補給船シグナスを使う道も、"}, {"t": 1611.1666666666667, "x": "まだ調べている途中でした。"}, {"t": 1613.2, "x": "けれども二〇二四年の文書では、"}, {"t": 1615.4, "x": "それでは余裕が足りないとされました。"}, {"t": 1617.8833333333334, "x": "地上の人に害が及ぶ見込みを、"}, {"t": 1619.95, "x": "基準まで十分に下げられないというのです。"}, {"t": 1622.8333333333333, "x": "そこで、新しい機体を頼むことになりました。"}, {"t": 1626.1833333333334, "x": "二〇二四年六月二十六日の発表です。"}, {"t": 1629.4333333333334, "x": "作るのは、スペースエックスという企業です。"}, {"t": 1632.4166666666667, "x": "宇宙ステーションを降ろすための、専用の機体です。"}, {"t": 1635.7833333333333, "x": "契約の上限は、八億四千三百万ドルです。"}, {"t": 1639.6166666666666, "x": "完成した機体は、アメリカ航空宇宙局が"}, {"t": 1642.75, "x": "受け取って動かします。"}, {"t": 1644.0166666666667, "x": "打ち上げに使うロケットは別に選ぶことになっています。"}, {"t": 1647.3, "x": "計画では宇宙ステーションは"}, {"t": 1648.95, "x": "まず大気の抵抗で少しずつ高さを下げます。"}, {"t": 1651.8, "x": "最後の噴射には、多くの燃料がかかるからです。"}, {"t": 1655.3166666666666, "x": "下げ始める時期は、太陽の活動しだいで変わります。"}, {"t": 1659.0, "x": "太陽が活発なら、大気がふくらんで早く下がるからです。"}, {"t": 1662.8833333333334, "x": "スカイラブの時と同じ仕組みです。"}, {"t": 1665.0833333333333, "x": "今度は、それを計画の中に組み込んであります。"}, {"t": 1668.4333333333334, "x": "まず、乗組員が全員地上に戻ります。"}, {"t": 1671.6333333333334, "x": "そのあと、落ちる帯の位置を海の上に合わせます。"}, {"t": 1675.1333333333334, "x": "そして大きな噴射で、最後のひと押しをします。"}, {"t": 1678.4833333333333, "x": "宇宙ステーションは大気の中で"}, {"t": 1680.2666666666667, "x": "壊れていくと見込まれています。"}, {"t": 1682.05, "x": "燃え残ったかけらは海に入り、海の底に沈む予定です。"}, {"t": 1686.0666666666666, "x": "アメリカ航空宇宙局は、環境への影響を"}, {"t": 1689.3166666666666, "x": "調べた文書にも触れています。"}, {"t": 1691.15, "x": "長く続く大きな影響は見込まれない、という内容です。"}, {"t": 1695.0833333333333, "x": "ただし、これはまだ予定です。"}, {"t": 1697.3166666666666, "x": "アメリカ航空宇宙局は運用を二〇三〇年より"}, {"t": 1700.55, "x": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
