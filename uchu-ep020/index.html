<script>
const D={"name": "ep020", "file": "ep020", "dur": 1974.96665625, "segs": [], "subs": [{"t": 0.0, "x": "二〇一六年一月二十日。"}, {"t": 2.0833333333333335, "x": "アメリカのカリフォルニア工科大学が、"}, {"t": 4.333333333333333, "x": "一つの発表をしました。"}, {"t": 6.25, "x": "太陽系に、まだ誰も見たことのない九番目の惑星がある。"}, {"t": 10.383333333333333, "x": "その証拠を見つけた、という内容です。"}, {"t": 13.183333333333334, "x": "重さは、地球の約十倍。"}, {"t": 15.45, "x": "太陽からの平均の距離は、海王星の約二十倍。"}, {"t": 19.316666666666666, "x": "太陽を一周するのに、一万年から"}, {"t": 22.033333333333335, "x": "二万年かかるとされました。"}, {"t": 23.666666666666668, "x": "ただし、その惑星を写した写真は、"}, {"t": 26.433333333333334, "x": "一枚もありませんでした。"}, {"t": 28.35, "x": "望遠鏡でとらえた光の点すら、ありません。"}, {"t": 31.616666666666667, "x": "発表の根拠は、計算と、計算機の"}, {"t": 34.78333333333333, "x": "中で繰り返した模擬実験でした。"}, {"t": 36.85, "x": "この惑星は、のちに英語で「プラネット・"}, {"t": 39.95, "x": "ナイン」、第9惑星と呼ばれるようになります。"}, {"t": 43.03333333333333, "x": "手がかりは、海王星のさらに外を回る、"}, {"t": 45.96666666666667, "x": "いくつかの小さな天体の軌道です。"}, {"t": 48.61666666666667, "x": "細長い楕円を描いて太陽を回る天体たちが、"}, {"t": 51.7, "x": "なぜか同じ方角を向いていた。"}, {"t": 54.05, "x": "見えない何かが、軌道を一方へそろえているのではないか。"}, {"t": 57.95, "x": "そう考えられたのです。"}, {"t": 59.55, "x": "発表から、およそ十年がたちました。"}, {"t": 62.333333333333336, "x": "その惑星は、いまも見つかっていません。"}, {"t": 65.11666666666666, "x": "探された空は、年ごとに広がりました。"}, {"t": 68.08333333333333, "x": "見つからなかった場所は、地図から"}, {"t": 70.21666666666667, "x": "一つずつ消されていきました。"}, {"t": 71.86666666666666, "x": "その一方で、そもそも軌道の偏りは"}, {"t": 74.65, "x": "本物なのか、という問いも強くなっています。"}, {"t": 77.68333333333334, "x": "ここから先は、写真のない惑星を"}, {"t": 80.2, "x": "めぐる記録を、順にたどります。"}, {"t": 82.53333333333333, "x": "何が根拠で、どこまでが確かで、どこからが仮説なのか。"}, {"t": 86.81666666666666, "x": "それを分けながら見ていきます。"}, {"t": 88.66666666666667, "x": "計算で惑星を探すという考え方には、前例があります。"}, {"t": 92.88333333333334, "x": "まず、そこから確かめておきます。"}, {"t": 95.35, "x": "一八四六年九月二十三日。"}, {"t": 98.3, "x": "ベルリンの天文台で、ヨハン・ガレという"}, {"t": 100.85, "x": "天文学者が、新しい惑星を見つけました。"}, {"t": 104.18333333333334, "x": "海王星です。"}, {"t": 105.33333333333333, "x": "ガレは、夜空をやみくもに探したのではありません。"}, {"t": 108.63333333333334, "x": "フランスの数学者ユルバン・ルヴェリエから、"}, {"t": 110.93333333333334, "x": "どこを見ればよいかを示した計算が届いていました。"}, {"t": 114.43333333333334, "x": "ルヴェリエが手がかりにしたのは、天王星の動きでした。"}, {"t": 117.96666666666667, "x": "天王星は、計算どおりの道筋を進んでいませんでした。"}, {"t": 122.01666666666667, "x": "ほんの少しずつ、予想からずれていく。"}, {"t": 124.76666666666667, "x": "ルヴェリエは、そのずれを、外側にある"}, {"t": 127.66666666666667, "x": "見えない惑星の重力によるものだと考えました。"}, {"t": 130.73333333333332, "x": "そして、その惑星の位置と重さを、計算で割り出しました。"}, {"t": 135.13333333333333, "x": "ガレは、探し始めた最初の夜に、"}, {"t": 137.66666666666666, "x": "それを見つけたとされています。"}, {"t": 139.73333333333332, "x": "天王星のわずかなずれという手がかりから、"}, {"t": 142.21666666666667, "x": "見えない惑星の場所が言い当てられたことになります。"}, {"t": 145.58333333333334, "x": "NASAは海王星を、空を眺めて"}, {"t": 147.96666666666667, "x": "見つけたのではなく、数学の予測で位置を"}, {"t": 150.85, "x": "突き止めた最初の惑星だ、と書いています。"}, {"t": 153.71666666666667, "x": "実は海王星は、それより二百年以上前に、"}, {"t": 157.2, "x": "一度記録されていました。"}, {"t": 159.11666666666667, "x": "一六一二年から一六一三年にかけて、ガリレオ・"}, {"t": 163.23333333333332, "x": "ガリレイが、望遠鏡で見た海王星を書き留めています。"}, {"t": 166.98333333333332, "x": "ただ、ガリレオはそれを動かない星だと"}, {"t": 169.6, "x": "考え、惑星だとは気づきませんでした。"}, {"t": 172.41666666666666, "x": "目に入っていても、惑星だと分からなければ、"}, {"t": 175.45, "x": "見つけたことにはならない。"}, {"t": 177.31666666666666, "x": "この話は、あとの章でもう一度関わってきます。"}, {"t": 180.76666666666668, "x": "海王星は、太陽から約四十五億キロメートルのところを"}, {"t": 184.81666666666666, "x": "回っています。"}, {"t": 185.68333333333334, "x": "太陽と地球の距離の、約三十倍です。"}, {"t": 188.8, "x": "一周するのに、約百六十五年かかります。"}, {"t": 192.13333333333333, "x": "そのあと、一九三〇年には、アメリカの"}, {"t": 195.68333333333334, "x": "ローウェル天文台で冥王星が見つかりました。"}, {"t": 198.43333333333334, "x": "冥王星は長いあいだ、太陽系の"}, {"t": 201.11666666666667, "x": "九番目の惑星とされてきました。"}, {"t": 203.21666666666667, "x": "いまは、準惑星という別の仲間に分けられています。"}, {"t": 206.9, "x": "遠くの大きな惑星を探す試みは、宇宙からも行われました。"}, {"t": 211.38333333333333, "x": "二〇一四年三月、NASAは、赤外線で空全体を"}, {"t": 215.56666666666666, "x": "観測した衛星ワイズの結果を発表しました。"}, {"t": 218.48333333333332, "x": "見出しは、何千もの新しい星を見つけたが、"}, {"t": 221.65, "x": "惑星エックスは見つからなかった、というものです。"}, {"t": 225.28333333333333, "x": "発表によれば、太陽と地球の距離の一万倍より"}, {"t": 228.83333333333334, "x": "内側に、土星ほどの大きさの天体はない。"}, {"t": 231.88333333333333, "x": "二万六千倍より内側に、木星ほどの天体はない。"}, {"t": 235.83333333333334, "x": "解析した研究者は、外側の太陽系には、"}, {"t": 239.15, "x": "大きなガスの惑星も、小さな星の相棒も、"}, {"t": 242.73333333333332, "x": "おそらくない、と話しています。"}, {"t": 245.16666666666666, "x": "その代わりに、この観測では、それまで"}, {"t": 248.15, "x": "知られていなかった星や褐色矮星が、"}, {"t": 250.51666666666668, "x": "三千五百二十五個見つかりました。"}, {"t": 253.15, "x": "その中には、太陽から六・五光年のところにある、"}, {"t": 256.76666666666665, "x": "褐色矮星の二つ組も含まれていました。"}, {"t": 259.8666666666667, "x": "探していた惑星は見つからず、近くの"}, {"t": 262.6333333333333, "x": "暗い星が見つかった、という結果です。"}, {"t": 265.31666666666666, "x": "ただ、この結果が言っているのは、"}, {"t": 267.5, "x": "土星や木星ほどの大きな天体についてです。"}, {"t": 270.75, "x": "それより小さく、暗い惑星については、"}, {"t": 273.6666666666667, "x": "この観測では決着がついていませんでした。"}, {"t": 276.7, "x": "第9惑星の話は、その空白から出てきました。"}, {"t": 280.3666666666667, "x": "第9惑星の手がかりとなった天体の話に移ります。"}, {"t": 283.93333333333334, "x": "二〇〇三年、マイク・ブラウン、チャド・"}, {"t": 286.6333333333333, "x": "トルヒーヨ、デビッド・ラビノウィッツの"}, {"t": 288.93333333333334, "x": "三人が、一つの天体を見つけました。"}, {"t": 291.68333333333334, "x": "のちにセドナと名付けられる天体です。"}, {"t": 294.06666666666666, "x": "翌年の論文で、三人はこの天体を、太陽系で"}, {"t": 298.1, "x": "これまでに見つかった中で最も遠い天体だと書いています。"}, {"t": 301.6, "x": "三人は、二〇〇一年から二〇〇三年に撮られた"}, {"t": 304.85, "x": "古い画像の中にも、この天体が"}, {"t": 307.25, "x": "写っていたことを確かめ、軌道を計算しました。"}, {"t": 310.3833333333333, "x": "セドナの変わっているところは、軌道の形です。"}, {"t": 313.6, "x": "太陽のまわりを、とても細長い楕円で回っています。"}, {"t": 317.26666666666665, "x": "楕円の大きさを表す長い半径は、"}, {"t": 319.6333333333333, "x": "太陽と地球の距離の約四百八十倍。"}, {"t": 322.8, "x": "そして、太陽にいちばん近づくときでも、"}, {"t": 325.6166666666667, "x": "その距離の約七十六倍までしか近づきません。"}, {"t": 329.03333333333336, "x": "海王星は、太陽と地球の距離の"}, {"t": 331.65, "x": "約三十倍のところを回っています。"}, {"t": 333.9, "x": "セドナは、いちばん近づいたときでも、海王星の"}, {"t": 337.51666666666665, "x": "軌道の二倍以上遠くにいることになります。"}, {"t": 340.1333333333333, "x": "これが、なぜ変わっているのか。"}, {"t": 342.3333333333333, "x": "海王星の外側には、細長い軌道を"}, {"t": 345.25, "x": "回る天体がたくさんあります。"}, {"t": 347.1, "x": "その多くは、太陽に近づいたときに"}, {"t": 349.68333333333334, "x": "海王星のそばを通ります。"}, {"t": 351.45, "x": "そして重力で振り回され、細長い軌道に"}, {"t": 354.55, "x": "投げ出されたものだと考えられています。"}, {"t": 356.8333333333333, "x": "ところが、セドナは海王星に近づきません。"}, {"t": 359.96666666666664, "x": "海王星の重力では、いまの軌道に"}, {"t": 362.68333333333334, "x": "投げ出すことができないのです。"}, {"t": 364.4, "x": "では、何がセドナをここへ運んだのか。"}, {"t": 367.2, "x": "三人の論文は、いくつかの可能性を挙げています。"}, {"t": 370.85, "x": "まだ見つかっていない惑星に投げ出された。"}, {"t": 373.3333333333333, "x": "近くを通り過ぎた別の星に引っ張られた。"}, {"t": 376.1166666666667, "x": "あるいは、太陽が生まれたころ、たくさんの"}, {"t": 379.1666666666667, "x": "星が集まった中にいて、その影響を受けた。"}, {"t": 382.31666666666666, "x": "どれなのかは、この一つだけでは決められませんでした。"}, {"t": 385.78333333333336, "x": "次の一つが報告されたのは、十年後です。"}, {"t": 389.0833333333333, "x": "二〇一四年三月、トルヒーヨとスコット・シェパードの"}, {"t": 392.55, "x": "二人が、科学誌ネイチャーに論文を出しました。"}, {"t": 395.65, "x": "題は、近日点が八十天文単位の、セドナに似た天体。"}, {"t": 400.26666666666665, "x": "天文単位は、太陽と地球の距離を一とする物差しです。"}, {"t": 404.35, "x": "つまり、太陽にいちばん近づいても、"}, {"t": 406.8833333333333, "x": "その距離の八十倍までしか来ない天体が、"}, {"t": 409.8666666666667, "x": "もう一つ見つかったということです。"}, {"t": 412.1666666666667, "x": "符号は、二〇一二ブイピー百十三。"}, {"t": 415.05, "x": "セドナの直径は、約千キロメートルとされています。"}, {"t": 418.5833333333333, "x": "論文は、そのセドナが、一つだけの"}, {"t": 421.4166666666667, "x": "特別な天体ではなかったと書いています。"}, {"t": 423.93333333333334, "x": "二つとも、さらに遠くに広がる天体の"}, {"t": 426.68333333333334, "x": "群れの、内側の一員なのかもしれない。"}, {"t": 429.55, "x": "論文は、こうした天体の数が、太陽系の"}, {"t": 433.0, "x": "ほかのどの安定した天体の群れよりも"}, {"t": 435.2, "x": "多いかもしれない、とも書いています。"}, {"t": 437.51666666666665, "x": "そして二人は、もう一つ気になることを指摘しました。"}, {"t": 441.03333333333336, "x": "遠くを回る天体の軌道に、向きの"}, {"t": 443.6166666666667, "x": "偏りがあるように見える、ということです。"}, {"t": 446.4166666666667, "x": "見えていない重い天体が、それを"}, {"t": 448.73333333333335, "x": "引き起こしている可能性にも触れています。"}, {"t": 451.1333333333333, "x": "その後も、似た天体は見つかっています。"}, {"t": 453.98333333333335, "x": "二〇一八年には、シェパードらが、二〇一五ティー"}, {"t": 457.65, "x": "ジー三百八十七という天体を報告しました。"}, {"t": 460.81666666666666, "x": "太陽にいちばん近づくときで、"}, {"t": 462.68333333333334, "x": "太陽と地球の距離の約六十五倍。"}, {"t": 465.53333333333336, "x": "楕円の長い半径は、約千百七十倍です。"}, {"t": 469.01666666666665, "x": "この群れの天体としては、セドナ、"}, {"t": 471.3333333333333, "x": "二〇一二ブイピー百十三に続く、"}, {"t": 474.06666666666666, "x": "三つ目の例とされています。"}, {"t": 476.1166666666667, "x": "論文は、同じような軌道を回る"}, {"t": 478.55, "x": "直径四十キロメートルを超える天体が、"}, {"t": 481.1, "x": "全部で約二百万個あると見積もっています。"}, {"t": 484.1333333333333, "x": "こうした、海王星に近づかない遠い天体が、"}, {"t": 487.4166666666667, "x": "少しずつ増えていきました。"}, {"t": 489.3333333333333, "x": "数が増えれば、軌道の向きを比べることができます。"}, {"t": 492.8666666666667, "x": "その比べ方が、次の章の中心になります。"}, {"t": 496.18333333333334, "x": "ここで、軌道の向きとは何かを、簡単に確かめておきます。"}, {"t": 500.53333333333336, "x": "細長い楕円の軌道には、太陽に"}, {"t": 503.0833333333333, "x": "いちばん近づく点があります。"}, {"t": 504.76666666666665, "x": "近日点です。"}, {"t": 505.9166666666667, "x": "楕円のとがった側の先、と考えると"}, {"t": 508.65, "x": "分かりやすいかもしれません。"}, {"t": 510.25, "x": "遠くを回る天体は、それぞれ別々の楕円を描いています。"}, {"t": 514.4166666666666, "x": "その近日点が、太陽から見てどの方角にあるか。"}, {"t": 518.1, "x": "本来なら、ばらばらでよいはずです。"}, {"t": 520.65, "x": "大きな惑星の重力を受けて、楕円の向きは"}, {"t": 523.7666666666667, "x": "長い時間をかけて、少しずつ回っていきます。"}, {"t": 526.8833333333333, "x": "四十億年以上もたっていれば、向きは"}, {"t": 529.6666666666666, "x": "散らばっていると考えるのが自然です。"}, {"t": 531.95, "x": "ところが、いくつかの遠い天体は、近日点が"}, {"t": 535.5, "x": "同じ側に集まっているように見えました。"}, {"t": 537.8833333333333, "x": "カリフォルニア工科大学のコンスタンティン・バティギンと"}, {"t": 540.8, "x": "マイク・ブラウンは、この偏りを詳しく調べました。"}, {"t": 544.2, "x": "ブラウンは、セドナを見つけた三人のうちの一人です。"}, {"t": 547.6833333333333, "x": "二人が注目したのは、特に遠い六つの天体でした。"}, {"t": 551.4833333333333, "x": "六つの楕円は、太陽から見て、同じ方角に伸びていました。"}, {"t": 556.0666666666667, "x": "それだけではありません。"}, {"t": 557.5333333333333, "x": "軌道が傾いている向きも、そろっていました。"}, {"t": 560.65, "x": "六つとも、同じ向きに約三十度"}, {"t": 563.1166666666667, "x": "傾いていたと、大学の発表は書いています。"}, {"t": 566.35, "x": "二人は、これが偶然に起きる確率を計算しました。"}, {"t": 570.1, "x": "大学の発表によれば、近日点の"}, {"t": 572.7, "x": "向きがそろうことだけなら、偶然でも百回に"}, {"t": 575.7, "x": "一回ほどは起こりうる、というものでした。"}, {"t": 578.3666666666667, "x": "ところが、軌道の傾きの向きまでそろっていることを"}, {"t": 581.7166666666667, "x": "合わせると、数字は大きく変わります。"}, {"t": 584.3, "x": "答えは、約〇・〇〇七パーセント。"}, {"t": 587.4, "x": "一万回に一回も起こらない、という数字です。"}, {"t": 590.7666666666667, "x": "偶然ではないとすれば、何が軌道をそろえているのか。"}, {"t": 594.4833333333333, "x": "二人は、計算機の中で試しました。"}, {"t": 597.25, "x": "置いてみたのは、一つの大きな惑星です。"}, {"t": 600.2, "x": "細長い楕円を描く重い惑星があり、その近日点は、"}, {"t": 604.2, "x": "小さな天体たちの近日点と、ちょうど反対の方角にある。"}, {"t": 608.7166666666667, "x": "そう置いて計算すると、小さな天体たちの"}, {"t": 611.6833333333333, "x": "軌道は、同じ向きにそろったまま保たれました。"}, {"t": 614.8333333333334, "x": "この結果をまとめた論文は、二〇一六年、"}, {"t": 618.0166666666667, "x": "アメリカの天文学の専門誌に載りました。"}, {"t": 621.0666666666667, "x": "論文は、地球の約十倍を超える重さを持ち、"}, {"t": 624.6, "x": "遠くを細長い軌道で回る惑星を提案しています。"}, {"t": 628.3333333333334, "x": "この計算は、もう一つの予言もしていました。"}, {"t": 631.55, "x": "もし惑星があるなら、ほかの天体とは"}, {"t": 634.1833333333333, "x": "大きく違う角度で、ほぼ直角に傾いた軌道を"}, {"t": 637.55, "x": "回る天体もできるはずだ、というものです。"}, {"t": 640.3833333333333, "x": "大学の発表によれば、調べてみると、その予言に"}, {"t": 644.2666666666667, "x": "合う天体が、すでに五つ知られていたとされています。"}, {"t": 647.6166666666667, "x": "ブラウンは、発表の中でこう話しています。"}, {"t": 650.65, "x": "これは本物の九番目の惑星になる。"}, {"t": 653.1833333333333, "x": "古代から知られていた惑星のほかに、本当に"}, {"t": 656.2666666666667, "x": "見つかった惑星は、これまで二つしかない。"}, {"t": 659.1833333333333, "x": "これが三つ目になる。"}, {"t": 660.55, "x": "二つというのは、天王星と海王星を指しています。"}, {"t": 664.1833333333333, "x": "大学の発表は、惑星が近日点の近くにいるなら、"}, {"t": 667.9833333333333, "x": "これまでの観測の画像にすでに写っているかも"}, {"t": 671.0666666666667, "x": "しれない、とも書いています。"}, {"t": 672.9666666666667, "x": "遠い側にいるなら、ハワイのケック望遠鏡や、"}, {"t": 676.1166666666667, "x": "日本のすばる望遠鏡のような大きな望遠鏡が必要になる。"}, {"t": 680.4666666666667, "x": "ただし、この時点で、惑星の姿を見た人はいません。"}, {"t": 684.6666666666666, "x": "あるのは、六つの軌道の向きと、"}, {"t": 686.9333333333333, "x": "計算機の中の惑星だけでした。"}, {"t": 689.4333333333333, "x": "提案された惑星の姿は、その後の"}, {"t": 692.1333333333333, "x": "研究で何度か描き直されています。"}, {"t": 694.35, "x": "最初の発表での見積もりは、重さが"}, {"t": 697.0333333333333, "x": "地球の約十倍、冥王星の約五千倍でした。"}, {"t": 700.6166666666667, "x": "太陽からの平均の距離は海王星の約二十倍。"}, {"t": 704.0333333333333, "x": "一周に一万年から二万年です。"}, {"t": 706.3333333333334, "x": "二〇一九年、バティギンとブラウンらは、"}, {"t": 709.2, "x": "それまでの研究をまとめた長い総説を出しました。"}, {"t": 712.75, "x": "そこでは、重さは地球の五倍から十倍。"}, {"t": 715.9, "x": "軌道の大きさは、太陽と地球の距離の四百倍から八百倍。"}, {"t": 720.3333333333334, "x": "軌道の傾きは、十五度から二十五度。"}, {"t": 723.3333333333334, "x": "楕円のつぶれ具合を示す値は、"}, {"t": 725.45, "x": "〇・二から〇・五とされています。"}, {"t": 727.9833333333333, "x": "この総説は、第9惑星で説明できるとする"}, {"t": 731.3666666666667, "x": "謎を、三つにまとめています。"}, {"t": 733.5333333333333, "x": "一つ目は、軌道の大きさが太陽と地球の距離の"}, {"t": 736.8166666666667, "x": "約二百五十倍を超える天体で、軌道が集まって見えること。"}, {"t": 741.05, "x": "二つ目は、セドナのように、近日点が"}, {"t": 744.0833333333334, "x": "海王星から離れている天体があること。"}, {"t": 746.6166666666667, "x": "三つ目は、大きく傾いた軌道や、ほかの"}, {"t": 749.9, "x": "惑星と逆向きに回る軌道の天体があること。"}, {"t": 752.8833333333333, "x": "同じ二〇一九年、二人は、見つかりやすさの"}, {"t": 756.5333333333333, "x": "偏りを見積もりなおした論文も出しています。"}, {"t": 759.2666666666667, "x": "偏りを考えに入れても、近日点の向きと"}, {"t": 762.2833333333333, "x": "軌道の傾きの両方がこれほどそろう確率は、"}, {"t": 765.2666666666667, "x": "〇・二パーセントだとしています。"}, {"t": 767.5166666666667, "x": "二〇二一年には、見積もりがさらに更新されました。"}, {"t": 771.3833333333333, "x": "このときの計算では、重さは地球の約六・二倍。"}, {"t": 775.1666666666666, "x": "軌道の大きさは、太陽と地球の距離の約三百八十倍。"}, {"t": 779.4333333333333, "x": "太陽にいちばん近づくときで、約三百倍。"}, {"t": 782.7333333333333, "x": "傾きは約十六度です。"}, {"t": 784.6166666666667, "x": "どの数字にも、幅があります。"}, {"t": 786.85, "x": "重さなら、地球の四・九倍から八・四倍ほど。"}, {"t": 790.6166666666667, "x": "軌道の大きさなら、三百倍から五百二十倍ほどです。"}, {"t": 794.6, "x": "論文は、多くの妥当な仮定のもとで、"}, {"t": 797.3833333333333, "x": "第9惑星は最初に考えられていたより近く、"}, {"t": 800.8166666666667, "x": "明るいかもしれない、と書いています。"}, {"t": 803.6833333333333, "x": "近くて明るいなら、見つけやすいはずです。"}, {"t": 806.6666666666666, "x": "この見積もりが、次の探索の動きにつながっていきます。"}, {"t": 810.4, "x": "ただ、見積もりの数字は、研究者によっても変わります。"}, {"t": 814.45, "x": "二〇二四年、別の三人の研究者が、別の"}, {"t": 818.3666666666667, くなります。"}, {"t": 929.2166666666667, "x": "細長い軌道を回る天体は、太陽に近づいた近日点の"}, {"t": 933.3166666666667, "x": "あたりにいるときでなければ、ほとんど見つけられません。"}, {"t": 936.5833333333334, "x": "しかも、望遠鏡は空のどこでも"}, {"t": 939.0333333333333, "x": "同じように見ているわけではありません。"}, {"t": 941.1333333333333, "x": "観測する季節、天気、空のどの帯をどれだけ撮ったか。"}, {"t": 945.4666666666667, "x": "そうした条件によって、見つかる天体の"}, {"t": 948.2166666666667, "x": "向きには、最初から偏りが入り込みます。"}, {"t": 951.2, "x": "近日点が同じ側に集まって見えるのは、天体の側の"}, {"t": 955.0333333333333, "x": "事情ではなく、探した側の事情かもしれない。"}, {"t": 958.2833333333333, "x": "そういう疑いです。"}, {"t": 959.6666666666666, "x": "二〇一七年、オッソスと呼ばれる調査の"}, {"t": 962.5666666666667, "x": "研究チームが、この点を調べた論文を出しました。"}, {"t": 966.2, "x": "オッソスは、二〇一三年から"}, {"t": 968.35, "x": "二〇一七年にかけて、海王星より外の天体を"}, {"t": 971.9833333333333, "x": "八百個以上、新しく見つけた調査です。"}, {"t": 975.0, "x": "このチームは、自分たちがどの空を、どれだけの"}, {"t": 978.4166666666666, "x": "暗さまで見たのかを、細かく記録していました。"}, {"t": 981.5166666666667, "x": "そのため、どんな向きの天体が見つかりやすいかを、"}, {"t": 984.85, "x": "計算で確かめることができました。"}, {"t": 987.2833333333333, "x": "軌道がとても大きい天体として"}, {"t": 989.2166666666667, "x": "見つかったのは、八つでした。"}, {"t": 991.1833333333333, "x": "チームは、こうした天体の見つかり方には、"}, {"t": 994.05, "x": "はっきりした偏りがあることを示しました。"}, {"t": 996.8833333333333, "x": "二〇二一年には、さらに大きな検討が出ました。"}, {"t": 1000.6, "x": "三つの調査で見つかった、特に遠い"}, {"t": 1003.2, "x": "天体十四個を合わせて調べた研究です。"}, {"t": 1005.95, "x": "論文の題は、極端に遠い天体の軌道が"}, {"t": 1009.0166666666667, "x": "集まっている証拠はない、というものでした。"}, {"t": 1011.8, "x": "見つかりやすさの偏りを考えに入れると、"}, {"t": 1014.3333333333334, "x": "近日点の向きや軌道の傾きの分布は、ばらばらな"}, {"t": 1018.2166666666667, "x": "集団から選ばれたものとして説明できる。"}, {"t": 1020.75, "x": "それが結論でした。"}, {"t": 1022.15, "x": "論文が示した数字は、十七パーセントから"}, {"t": 1025.3166666666666, "x": "九十四パーセント。"}, {"t": 1026.7, "x": "ばらばらな集団から選んでも、この程度の"}, {"t": 1029.5166666666667, "x": "そろい方は珍しくない、という意味です。"}, {"t": 1032.3333333333333, "x": "一方で、第9惑星を唱える側も、偏りを見積もり"}, {"t": 1036.65, "x": "なおした上で、なお偶然とは考えにくいと反論しています。"}, {"t": 1040.6666666666667, "x": "前の章で触れた二〇二一年の論文では、"}, {"t": 1043.5833333333333, "x": "集まりは九十九・六パーセントの"}, {"t": 1046.2833333333333, "x": "確からしさで意味がある、とされています。"}, {"t": 1048.95, "x": "どちらの側も、同じ数十個の天体を見ています。"}, {"t": 1052.5666666666666, "x": "違うのは、どの天体を数えに入れるか、見つかりやすさの"}, {"t": 1056.65, "x": "偏りをどう見積もるか、という手順です。"}, {"t": 1059.5166666666667, "x": "そして、二〇二六年四月。"}, {"t": 1062.1166666666666, "x": "この問題に、新しい数字が加わりました。"}, {"t": 1065.4166666666667, "x": "前の章で触れたシラージュたち三人が、"}, {"t": 1067.7166666666667, "x": "偏りの測り方を作りなおしました。"}, {"t": 1070.4666666666667, "x": "数えに入れる天体も、二十一個から"}, {"t": 1073.1333333333334, "x": "二十五個に増やして、計算しなおしたのです。"}, {"t": 1076.2166666666667, "x": "結果は、近日点の向きがそろっていることの"}, {"t": 1079.1, "x": "確かさが、前より下がった、というものでした。"}, {"t": 1082.5, "x": "統計の目盛りで言えば、二・七から一・九へ。"}, {"t": 1086.0666666666666, "x": "数字が小さいほど、偶然でも起こりうる、ということです。"}, {"t": 1090.3166666666666, "x": "そろっている方角も、よく決まらないと書かれています。"}, {"t": 1093.7833333333333, "x": "二年前、同じ三人は、偏りを"}, {"t": 1096.7333333333333, "x": "手がかりに惑星の軌道を計算していました。"}, {"t": 1099.45, "x": "その三人が、今度は偏りが弱まったと"}, {"t": 1102.45, "x": "報告したことになります。"}, {"t": 1104.0166666666667, "x": "軌道の偏りそのものが、あるともないとも"}, {"t": 1106.95, "x": "言い切れない境目にある。"}, {"t": 1108.4166666666667, "x": "それが、二〇二六年の時点での記録です。"}, {"t": 1111.7833333333333, "x": "遠い天体が一つ見つかるたびに、仮説は試されます。"}, {"t": 1115.5666666666666, "x": "第2章で触れた二〇一五ティー"}, {"t": 1117.4333333333334, "x": "ジー三百八十七は、近日点の向きが、"}, {"t": 1120.5, "x": "集まっている天体たちとそろっていました。"}, {"t": 1123.25, "x": "論文は、見えない遠い惑星が"}, {"t": 1125.6166666666666, "x": "この天体に与える影響も調べています。"}, {"t": 1128.3, "x": "一方で、向きのそろわない天体も、見つかっています。"}, {"t": 1132.3, "x": "一つ目は、日本のすばる望遠鏡による発見です。"}, {"t": 1136.0, "x": "すばる望遠鏡では、二〇二〇年から、"}, {"t": 1138.8833333333334, "x": "日本と台湾の研究者が中心になって、"}, {"t": 1141.9833333333333, "x": "フォッシルと呼ばれる調査を続けています。"}, {"t": 1144.7, "x": "フォッシルは、化石という意味です。"}, {"t": 1147.0666666666666, "x": "太陽系ができたころの姿を残す天体を探す計画です。"}, {"t": 1151.0, "x": "二〇二三年の三月、五月、八月。"}, {"t": 1154.7, "x": "この調査の画像に、一つの遠い天体が写っていました。"}, {"t": 1158.5666666666666, "x": "二〇二四年七月には、同じハワイにある、カナダ・"}, {"t": 1162.6, "x": "フランス・ハワイ望遠鏡で追いかけの観測が行われました。"}, {"t": 1166.2, "x": "さらに過去の画像がさかのぼって調べられ、"}, {"t": 1168.6833333333334, "x": "二〇〇五年から二〇二四年までの、"}, {"t": 1171.3333333333333, "x": "十九年分の記録が集められました。"}, {"t": 1174.1166666666666, "x": "天体の符号は、二〇二三ケーキュー十四。"}, {"t": 1177.4833333333333, "x": "愛称は、アンモナイトです。"}, {"t": 1179.6333333333334, "x": "直径は、二百二十キロメートルから"}, {"t": 1182.2, "x": "三百八十キロメートルほど。"}, {"t": 1184.0833333333333, "x": "太陽にいちばん近づくときでも、"}, {"t": 1186.0333333333333, "x": "太陽と地球の距離の約七十一倍。"}, {"t": 1189.0166666666667, "x": "セドナのように海王星に近づかない"}, {"t": 1191.25, "x": "天体として、四つ目の例になりました。"}, {"t": 1194.0666666666666, "x": "計算では、この軌道は、少なくとも"}, {"t": 1196.9666666666667, "x": "四十五億年のあいだ安定しているとされています。"}, {"t": 1199.9166666666667, "x": "問題は、その向きでした。"}, {"t": 1201.95, "x": "アンモナイトの軌道は、ほかの三つのセドナ型の"}, {"t": 1205.0666666666666, "x": "天体と、向きがそろっていませんでした。"}, {"t": 1207.7833333333333, "x": "すばる望遠鏡の発表には、こう書かれています。"}, {"t": 1211.25, "x": "アンモナイトの現在の軌道がほかの三つと"}, {"t": 1213.7166666666667, "x": "そろっていないことは、第9惑星の仮説の可能性を下げる。"}, {"t": 1217.8, "x": "二つ目は、二〇一七オーエフ二百一という天体です。"}, {"t": 1221.75, "x": "二〇二五年に報告され、二〇二六年に専門誌に載りました。"}, {"t": 1226.5333333333333, "x": "この天体は、いま、太陽から、太陽と"}, {"t": 1230.1333333333334, "x": "地球の距離の約九十倍のところにいます。"}, {"t": 1232.8166666666666, "x": "楕円の大きさは約八百三十倍。"}, {"t": 1235.2666666666667, "x": "太陽にいちばん近づくときで、約四十五倍。"}, {"t": 1238.6666666666667, "x": "二十年間にわたる二十四回の"}, {"t": 1240.7333333333333, "x": "観測から、軌道が決められました。"}, {"t": 1243.1833333333334, "x": "光の反射の具合を仮定すると、直径は約七百キロメートル。"}, {"t": 1247.7, "x": "準惑星の候補とされています。"}, {"t": 1249.85, "x": "論文は、この天体の仲間がまだ見えないところに"}, {"t": 1253.2166666666667, "x": "たくさんあると考えています。"}, {"t": 1254.9666666666667, "x": "その重さを全部合わせると、地球の約百分の"}, {"t": 1258.3333333333333, "x": "一になるだろう、という見積もりです。"}, {"t": 1260.7833333333333, "x": "そして、この天体の軌道の向きも、"}, {"t": 1263.35, "x": "遠い天体たちの集まりの外にありました。"}, {"t": 1266.3, "x": "論文は、これを第9惑星の証拠に対する"}, {"t": 1269.6, "x": "挑戦だ、と書いています。"}, {"t": 1271.5333333333333, "x": "そろう天体と、そろわない天体。"}, {"t": 1274.15, "x": "数十個の中に、両方が混じっている。"}, {"t": 1277.0666666666666, "x": "それが、いま分かっていることです。"}, {"t": 1279.45, "x": "見つかる天体が増えれば、偏りが"}, {"t": 1281.9333333333334, "x": "本物かどうかは、はっきりしていきます。"}, {"t": 1284.5333333333333, "x": "問題は、そうした天体が、なかなか見つからないことです。"}, {"t": 1288.7, "x": "そして、惑星そのものも、見つかっていません。"}, {"t": 1292.2166666666667, "x": "ここからは、惑星そのものを探した記録です。"}, {"t": 1295.4833333333333, "x": "第9惑星を直接見つけるのは、とても難しいことです。"}, {"t": 1299.6833333333334, "x": "理由は、大きく三つあります。"}, {"t": 1302.0333333333333, "x": "一つ目は、暗さです。"}, {"t": 1303.8833333333334, "x": "惑星は、自分では光りません。"}, {"t": 1306.3333333333333, "x": "太陽の光を反射しています。"}, {"t": 1308.4, "x": "太陽から遠いと、届く光が弱くなります。"}, {"t": 1311.8, "x": "そこから地球まで戻ってくる光は、さらに弱くなります。"}, {"t": 1315.7, "x": "二つ目は、動きの遅さです。"}, {"t": 1317.95, "x": "一周に何千年、何万年とかかる惑星は、"}, {"t": 1321.3666666666666, "x": "夜空の中をほとんど動きません。"}, {"t": 1323.7333333333333, "x": "星のあいだをゆっくり動く点を、何日も、何か月もかけて"}, {"t": 1328.15, "x": "見比べなければ、止まっている星と区別できません。"}, {"t": 1331.4166666666667, "x": "第1章のガリレオが、海王星を動かない星だと"}, {"t": 1334.95, "x": "思ったのと、同じことが起こりえます。"}, {"t": 1337.5166666666667, "x": "三つ目は、空の広さです。"}, {"t": 1339.7, "x": "軌道の向きから、だいたいの通り道は計算できます。"}, {"t": 1343.3833333333334, "x": "しかし、惑星がその道のどこにいるのかは、分かりません。"}, {"t": 1347.6333333333334, "x": "一万年かけて一周する道の、"}, {"t": 1349.7333333333333, "x": "どこにいてもおかしくないのです。"}, {"t": 1351.9333333333334, "x": "そこで研究者たちは、すでにある"}, {"t": 1354.2666666666667, "x": "大きな観測の記録を掘り返しました。"}, {"t": 1356.7333333333333, "x": "二〇二一年、ブラウンとバティギンは、アメリカのある"}, {"t": 1360.6833333333334, "x": "観測の、公開されている記録を調べました。"}, {"t": 1363.9, "x": "ツビッキー・トランジェント・ファシリティという、"}, {"t": 1366.0333333333333, "x": "空を広く撮り続けている観測です。"}, {"t": 1368.7666666666667, "x": "候補は、見つかりませんでした。"}, {"t": 1371.0333333333333, "x": "二人は、予測された軌道の北側の"}, {"t": 1373.5333333333333, "x": "大部分では、明るさ二十・五等くらいまでの"}, {"t": 1376.65, "x": "惑星なら見逃さなかったはずだ、としました。"}, {"t": 1379.5833333333333, "x": "そして、予測された範囲の五十六パーセントを消しました。"}, {"t": 1383.55, "x": "二〇二二年には、南の空を撮った、ダークエネルギー・"}, {"t": 1387.7, "x": "サーベイという観測の記録も調べられました。"}, {"t": 1390.4333333333334, "x": "研究者たちは、計算機の中に、"}, {"t": 1392.9333333333334, "x": "十万個のにせの第9惑星を置きました。"}, {"t const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
