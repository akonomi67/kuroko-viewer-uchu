<script>
const D={"name": "宇宙に置いてきたもの ep001", "file": "ep001", "dur": 2047.55, "segs": [], "subs": [{"t": 0.0, "x": "月の静かの海と呼ばれる平原に、一本の旗が倒れています。"}, {"t": 4.366666666666666, "x": "倒したのは風ではありません。"}, {"t": 6.216666666666667, "x": "月に風はありません。"}, {"t": 7.683333333333334, "x": "倒したのは、その旗を立てた本人たちが"}, {"t": 10.5, "x": "乗っていた機械の噴射でした。"}, {"t": 12.216666666666667, "x": "一九六九年、上昇段が月面を離れるとき、"}, {"t": 16.433333333333334, "x": "下向きに吹き出した炎が、すぐそばに"}, {"t": 19.333333333333332, "x": "立っていた旗を、そのまま押し倒しました。"}, {"t": 22.066666666666666, "x": "機内からそれを見ていたのは、バズ・オルドリンです。"}, {"t": 25.85, "x": "見た、と彼は報告しました。"}, {"t": 28.166666666666668, "x": "それから長いあいだ、それは"}, {"t": 30.15, "x": "一人の証言でしかありませんでした。"}, {"t": 32.35, "x": "確かめる方法がなかったからです。"}, {"t": 34.53333333333333, "x": "二〇一二年、月を回っている探査機が、"}, {"t": 37.55, "x": "その場所を上から撮りました。"}, {"t": 39.6, "x": "時刻の違う写真を何枚も並べ、影が"}, {"t": 42.5, "x": "どう動くかを調べたところ、アポロ十二号、"}, {"t": 45.483333333333334, "x": "十四号、十五号、十六号、十七号の"}, {"t": 49.88333333333333, "x": "着陸地点では、旗のあるはずの一点を中心に、"}, {"t": 53.3, "x": "細い影が一日かけてぐるりと回っていました。"}, {"t": 56.45, "x": "棒は立っていました。"}, {"t": 57.75, "x": "アポロ十一号の地点にだけ、その影がありませんでした。"}, {"t": 61.68333333333333, "x": "オルドリンの証言は、四十三年後に"}, {"t": 64.41666666666667, "x": "写真で裏づけられたことになります。"}, {"t": 66.55, "x": "倒れた旗はそのままです。"}, {"t": 68.33333333333333, "x": "誰も起こしていません。"}, {"t": 69.73333333333333, "x": "起こしに行った者がいないからです。"}, {"t": 71.81666666666666, "x": "月面には、人間が持っていって、"}, {"t": 74.21666666666667, "x": "そのまま置いてきたものが残っています。"}, {"t": 76.8, "x": "機体、機械、道具、袋、そして、道具とは呼べないものが。"}, {"t": 82.33333333333333, "x": "それらは、捨てられたわけでも、"}, {"t": 84.4, "x": "忘れられたわけでもありません。"}, {"t": 86.55, "x": "持ち帰るという選択肢が、はじめから"}, {"t": 89.18333333333334, "x": "用意されていなかっただけです。"}, {"t": 90.88333333333334, "x": "NASAは、それがどこにあるのかを"}, {"t": 93.05, "x": "一冊の目録にまとめています。"}, {"t": 95.05, "x": "表紙には、月の人工物は歴史と科学の両方で"}, {"t": 98.6, "x": "価値があり、守るためにはまず、何がどこにあるのかを"}, {"t": 102.43333333333334, "x": "確かめる必要がある、と書かれています。"}, {"t": 105.16666666666667, "x": "この回では、その目録を開いていきます。"}, {"t": 108.2, "x": "何が、どこに、いくつ残っているのか。"}, {"t": 111.33333333333333, "x": "そして、それがいまどうなっているのかを、"}, {"t": 113.93333333333334, "x": "記録に残っているところまで順に並べていきます。"}, {"t": 117.21666666666667, "x": "まず、置いてきた理由からです。"}, {"t": 119.53333333333333, "x": "うっかり忘れたわけでも、面倒だから"}, {"t": 122.08333333333333, "x": "捨てたわけでもありません。"}, {"t": 123.48333333333333, "x": "置いていくことは、設計の段階から決まっていました。"}, {"t": 126.96666666666667, "x": "アポロの月着陸船は、二階建てです。"}, {"t": 129.96666666666667, "x": "下半分が降下段、上半分が上昇段。"}, {"t": 133.26666666666668, "x": "降りるときは二つがつながったまま降り、帰るときは、"}, {"t": 136.63333333333333, "x": "上昇段だけが降下段を発射台にして飛び立ちます。"}, {"t": 140.26666666666668, "x": "降下段は、はじめから月に置いてくる部品でした。"}, {"t": 143.66666666666666, "x": "数字で見ると、こうなります。"}, {"t": 145.93333333333334, "x": "アポロ十一号の着陸船は、打ち上げのときの"}, {"t": 149.33333333333334, "x": "全体で、一万五千百三キログラム。"}, {"t": 152.3, "x": "このうち、降下段の燃料を除いた"}, {"t": 154.88333333333333, "x": "重さが、二千三十四キログラム。"}, {"t": 157.5, "x": "積んでいた月面用の機材を含めた数字です。"}, {"t": 160.51666666666668, "x": "この二千三十四キログラムは、最初から地球に"}, {"t": 163.83333333333334, "x": "戻さないものとして計算されていました。"}, {"t": 166.23333333333332, "x": "上昇段のほうは、燃料を除いて二千四百四十五キログラム。"}, {"t": 170.71666666666667, "x": "持っていた推進剤は二千三百七十六キログラム。"}, {"t": 174.2, "x": "これだけで、月の重力を振り切って、上で"}, {"t": 177.56666666666666, "x": "待っている司令船に追いつかなければなりません。"}, {"t": 180.23333333333332, "x": "余裕はほとんどありませんでした。"}, {"t": 182.26666666666668, "x": "だから、飛び立つ前に、乗員は"}, {"t": 184.91666666666666, "x": "機内で捨てられるものを捨てます。"}, {"t": 186.75, "x": "使い終わったカメラ、背負っていた"}, {"t": 188.9, "x": "生命維持装置、月面用の靴と手袋、"}, {"t": 192.1, "x": "食べたあとの包み、そういうものを機外に"}, {"t": 195.18333333333334, "x": "放り出してから、上昇段のドアを閉めました。"}, {"t": 198.2, "x": "持ち帰るのは、岩と、砂と、フィルムと、人間だけです。"}, {"t": 203.18333333333334, "x": "一グラムでも軽いほうがいい、という"}, {"t": 205.61666666666667, "x": "判断が、六回ぶん積み重なりました。"}, {"t": 208.41666666666666, "x": "置いてきたものの一覧は、言いかえれば、"}, {"t": 211.08333333333334, "x": "その判断の記録です。"}, {"t": 212.9, "x": "何を持って帰り、何を置くかを、一つずつ"}, {"t": 216.23333333333332, "x": "決めた結果が、そのまま月面に並んでいます。"}, {"t": 219.3, "x": "NASAの歴史部門が、月にある"}, {"t": 221.51666666666668, "x": "人工物の目録を作っています。"}, {"t": 223.76666666666668, "x": "表題は「月面の人工物カタログ」。"}, {"t": 226.65, "x": "文書に打たれた日付は、二〇一二年七月五日。"}, {"t": 230.3, "x": "全二十二ページの一覧です。"}, {"t": 232.3, "x": "この目録は、国ごとに区分けされています。"}, {"t": 235.4, "x": "アメリカのアポロ以外の機体、"}, {"t": 237.1, "x": "アメリカのアポロ、ソビエト連邦、中国、"}, {"t": 240.76666666666668, "x": "インド、日本、そしてヨーロッパ宇宙機関。"}, {"t": 244.51666666666668, "x": "多くの項目には、北緯何度、"}, {"t": 246.86666666666667, "x": "東経何度という座標が添えられています。"}, {"t": 249.73333333333332, "x": "中身は、想像よりずっと細かい一覧です。"}, {"t": 252.93333333333334, "x": "たとえば、アポロ十一号の項には、"}, {"t": 255.6, "x": "こういう行が並んでいます。"}, {"t": 257.7, "x": "ハンマー。"}, {"t": 258.8, "x": "大きいほうの月試料用スコップ。"}, {"t": 260.9166666666667, "x": "柄の延長棒。"}, {"t": 262.03333333333336, "x": "トング。"}, {"t": 263.15, "x": "ノーモン。"}, {"t": 264.26666666666665, "x": "ノーモンというのは、砂に立てて、太陽の"}, {"t": 267.35, "x": "角度と色の基準を写しこむための小さな棒です。"}, {"t": 270.46666666666664, "x": "これらはすべて、置いてきました。"}, {"t": 272.85, "x": "回を追うごとに、道具は増えていきます。"}, {"t": 275.6333333333333, "x": "熊手。"}, {"t": 276.75, "x": "掘削機。"}, {"t": 277.6333333333333, "x": "ボーリング用の管。"}, {"t": 278.9, "x": "刃。"}, {"t": 280.0, "x": "テフロンの袋。"}, {"t": 281.1333333333333, "x": "土の採取器。"}, {"t": 282.26666666666665, "x": "カメラ。"}, {"t": 283.35, "x": "レンズ。"}, {"t": 284.45, "x": "三脚。"}, {"t": 285.56666666666666, "x": "ケーブル。"}, {"t": 286.65, "x": "ハンモック。"}, {"t": 287.48333333333335, "x": "タオル。"}, {"t": 288.56666666666666, "x": "耳栓。"}, {"t": 289.6666666666667, "x": "爪切り。"}, {"t": 290.78333333333336, "x": "石けん。"}, {"t": 291.8833333333333, "x": "ウェットティッシュ。"}, {"t": 292.8333333333333, "x": "軟膏。"}, {"t": 293.95, "x": "道具の一覧を読んでいると、途中で、これは"}, {"t": 297.28333333333336, "x": "引っ越しの荷物ではなく、住まなかった家の"}, {"t": 300.1166666666667, "x": "残置物の一覧だ、という感じがしてきます。"}, {"t": 303.15, "x": "一つ一つは、どこにでもある道具です。"}, {"t": 306.0, "x": "ハンマーも、トングも、熊手も、"}, {"t": 308.48333333333335, "x": "地球の物置にあるものとそう変わりません。"}, {"t": 311.3833333333333, "x": "違うのは、それが北緯何度、"}, {"t": 313.53333333333336, "x": "東経何度という数字つきで記録されていて、"}, {"t": 316.55, "x": "しかも誰も取りに行かないことだけです。"}, {"t": 319.05, "x": "そして、目録には、着陸していない回の記載もあります。"}, {"t": 323.45, "x": "アポロ十三号の項です。"}, {"t": 325.26666666666665, "x": "ここには、たった一行しかありません。"}, {"t": 327.8833333333333, "x": "サターン五型ロケットの第三段。"}, {"t": 330.0, "x": "座標は、南緯二・五五三度、東経二七・八八七度。"}, {"t": 335.1, "x": "アポロ十三号は、月に降りられなかった回です。"}, {"t": 338.5, "x": "それでも、月に一つ置いてきています。"}, {"t": 341.21666666666664, "x": "切り離したロケットの段が、月面に落ちているからです。"}, {"t": 344.9, "x": "同じ「第三段」の記載は、アポロ十四号、"}, {"t": 348.96666666666664, "x": "十五号、十六号、十七号の項にもあります。"}, {"t": 353.26666666666665, "x": "合わせて五つ。"}, {"t": 354.3666666666667, "x": "どれも、意図的に月へ落とされたものです。"}, {"t": 357.26666666666665, "x": "理由は第六章で述べます。"}, {"t": 359.18333333333334, "x": "さて、ここまで読むと、合計はいくつなのか、"}, {"t": 362.6666666666667, "x": "全部で何トンなのかが気になります。"}, {"t": 365.15, "x": "ところが、この目録には、それが書かれていません。"}, {"t": 368.9, "x": "合計の重さが、書かれていません。"}, {"t": 371.43333333333334, "x": "合計の個数も、書かれていません。"}, {"t": 374.01666666666665, "x": "この一覧は「何が、どこにあるか」の帳面であって、"}, {"t": 378.45, "x": "重さを足し上げた表ではないのです。"}, {"t": 381.03333333333336, "x": "よく引かれる「およそ十八万キログラム」という"}, {"t": 384.6333333333333, "x": "数字があります。"}, {"t": 385.6166666666667, "x": "日本語でも英語でも、月に残されたものの"}, {"t": 388.55, "x": "総量として、この数字が繰り返し使われています。"}, {"t": 392.05, "x": "ただ、これはNASAが公式に出した数字ではありません。"}, {"t": 395.53333333333336, "x": "残っている機体の重量を足し合わせた推計で、"}, {"t": 398.4166666666667, "x": "出典によって、十五万台のこともあれば、"}, {"t": 401.7, "x": "十八万台のこともあります。"}, {"t": 403.9, "x": "ですから、この回では、こう扱います。"}, {"t": 407.0833333333333, "x": "月にあるものの総量は、"}, {"t": 408.6333333333333, "x": "およそ十八万キログラムと言われている。"}, {"t": 411.43333333333334, "x": "ただしそれは推計であって、"}, {"t": 413.1333333333333, "x": "NASAの目録には合計欄がない。"}, {"t": 415.65, "x": "分かっているのは、個々の品目のほうです。"}, {"t": 418.56666666666666, "x": "そちらは、驚くほど細かく残っています。"}, {"t": 421.6333333333333, "x": "目録をアポロの項から順に読んでいくと、六回ぶんの"}, {"t": 425.26666666666665, "x": "着陸地点に、それぞれ一件ずつ、同じ記載があります。"}, {"t": 429.55, "x": "「フラッグキット」。"}, {"t": 430.6166666666667, "x": "あるいは「フラッグキット、月面用」。"}, {"t": 433.65, "x": "十一号に一件、十二号に一件、十四号に一件、"}, {"t": 438.1, "x": "十五号に一件、十六号に一件、十七号に一件。"}, {"t": 443.01666666666665, "x": "合わせて六本。"}, {"t": 444.1333333333333, "x": "これが、月にあるアメリカの旗のすべてです。"}, {"t": 447.1666666666667, "x": "着陸した座標も並んでいます。"}, {"t": 449.26666666666665, "x": "十一号が北緯〇・四一度、東経二三・二六度。"}, {"t": 453.6166666666667, "x": "十二号が南緯三・一一度、西経二三・二三度。"}, {"t": 457.95, "x": "十四号が南緯三・四〇度、西経一七・二八度。"}, {"t": 462.25, "x": "十五号が北緯二六・六度、東経三・三九度。"}, {"t": 466.3833333333333, "x": "十六号が南緯八・九七三度、東経一五・三一度。"}, {"t": 470.9, "x": "十七号が北緯二〇・一〇度、東経三〇・四六度。"}, {"t": 475.35, "x": "六つの点は、月の表側に散らばっています。"}, {"t": 478.7, "x": "どれも、地球から見える側です。"}, {"t": 481.1333333333333, "x": "裏側に降りた回は、一度もありません。"}, {"t": 484.01666666666665, "x": "裏側に回ると、地球との電波が"}, {"t": 486.55, "x": "直接は届かなくなるからです。"}, {"t": 488.51666666666665, "x": "座標を地図に落とすと、赤道の"}, {"t": 490.8666666666667, "x": "まわりに寄っているのが分かります。"}, {"t": 492.75, "x": "いちばん北にあるのが、北緯二六度台のアポロ十五号。"}, {"t": 496.81666666666666, "x": "いちばん南が、南緯八・九七三度のアポロ十六号。"}, {"t": 500.93333333333334, "x": "緯度の幅は、三十五度ほどしかありません。"}, {"t": 503.9166666666667, "x": "南極も、北極も、人が降りた場所ではないのです。"}, {"t": 507.76666666666665, "x": "さて、その六本が、いまどうなっているか。"}, {"t": 511.1, "x": "これを調べたのが、月を回っている"}, {"t": 513.55, "x": "探査機に載っているカメラでした。"}, {"t": 515.3833333333333, "x": "この探査機は、二〇〇九年から月を回っています。"}, {"t": 518.9166666666666, "x": "特徴は、軌道をわざと調整して、"}, {"t": 521.55, "x": "いちばん低いところが、アポロの着陸地点の"}, {"t": 525.0166666666667, "x": "上に来るようにしてあることです。"}, {"t": 526.7833333333333, "x": "高度で、およそ二十五キロから五十キロ。"}, {"t": 529.75, "x": "そこから撮ると、一メートルより"}, {"t": 532.0166666666667, "x": "小さいものまで見分けられます。"}, {"t": 533.8666666666667, "x": "二〇一一年一月二十五日に撮られたアポロ十四号の"}, {"t": 537.5666666666667, "x": "地点の写真には、着陸船アンタレスの"}, {"t": 540.3333333333334, "x": "降下段と、少し離れたところに置かれた"}, {"t": 543.0666666666667, "x": "実験装置と、その二つのあいだを何度も"}, {"t": 545.9666666666667, "x": "往復した足跡が、そのまま写っています。"}, {"t": 548.7833333333333, "x": "写真の横幅は五百メートルです。"}, {"t": 551.1166666666667, "x": "四十年前に人が歩いた線が、そのまま残っています。"}, {"t": 555.0166666666667, "x": "月面には、風も雨もありません。"}, {"t": 557.5666666666667, "x": "足跡を消すものが、ほとんどないのです。"}, {"t": 560.4, "x": "写真の中で、いちばん目立つのは降下段です。"}, {"t": 563.7, "x": "上から見ると、明るい点と、"}, {"t": 565.9, "x": "そこから伸びる長い影になります。"}, {"t": 568.35, "x": "影の長さで、そこに立体があることが分かる。"}, {"t": 571.5666666666667, "x": "この「影で判断する」というやり方が、このあと、"}, {"t": 575.6666666666666, "x": "旗の話でそのまま使われることになります。"}, {"t": 578.75, "x": "アポロ十二号の地点では、降下段と、実験装置と、"}, {"t": 582.9, "x": "その近くに立っていたサーベイヤー三号という"}, {"t": 585.8166666666667, "x": "別の探査機が、同じ一枚に収まりました。"}, {"t": 588.9833333333333, "x": "サーベイヤー三号は、アポロ十二号の"}, {"t": 591.6833333333333, "x": "二年半前に、無人で降りていた機体です。"}, {"t": 594.6333333333333, "x": "十二号は、それが立っている"}, {"t": 596.6333333333333, "x": "場所のすぐそばに着陸しました。"}, {"t": 598.6833333333333, "x": "アポロ十七号の地点では、月面車の轍が、"}, {"t": 602.1, "x": "細い平行線として残っているのが見えます。"}, {"t": 605.1833333333333, "x": "旗については、少し事情が違います。"}, {"t": 608.0666666666667, "x": "旗そのものは、上から見ても、"}, {"t": 610.2666666666667, "x": "ほとんど点にしかなりません。"}, {"t": 612.3, "x": "布の面積が小さすぎて、写真の一画素に届かないのです。"}, {"t": 616.5166666666667, "x": "そこで、カメラを運用していた"}, {"t": 618.6, "x": "研究者は、影を見ることにしました。"}, {"t": 621.2666666666667, "x": "同じ場所を、月の一日のうちの違う時刻に、何度も撮る。"}, {"t": 625.7833333333333, "x": "もし棒が立っていれば、その影は、太陽の動きに"}, {"t": 629.4666666666667, "x": "合わせて、棒を中心にぐるりと回るはずです。"}, {"t": 632.6166666666667, "x": "棒が倒れていれば、そうはなりません。"}, {"t": 635.2333333333333, "x": "二〇一二年七月二十七日に公開された"}, {"t": 638.2666666666667, "x": "報告に、その結果が書かれています。"}, {"t": 640.8666666666667, "x": "アポロ十一号を除くすべての地点で、"}, {"t": 643.35, "x": "アメリカの旗は立っていて、影を落としている。"}, {"t": 646.7166666666667, "x": "十二号、十四号、十五号、十六号、十七号。"}, {"t": 651.8666666666667, "x": "五本です。"}, {"t": 652.75, "x": "そして十一号の地点には、その影がありません。"}, {"t": 656.15, "x": "オルドリンの証言のとおりでした。"}, {"t": 658.1833333333333, "x": "ここで、一つ言っておかなければならないことがあります。"}, {"t": 661.6666666666666, "x": "分かったのは「何かが立っている」ということだけです。"}, {"t": 665.45, "x": "布がどうなっているかは、分かっていません。"}, {"t": 668.2166666666667, "x": "月面には大気がないので、紫外線がそのまま当たります。"}, {"t": 672.0833333333334, "x": "温度は、日なたと日陰で二百度以上ちがいます。"}, {"t": 675.4333333333333, "x": "四十年、五十年とそれを浴び続けた布が、"}, {"t": 678.75, "x": "どんな色になっているのか。"}, {"t": 680.65, "x": "染めた色が抜けているのか。"}, {"t": 682.4333333333333, "x": "繊維として残っているのか、それとも粉になっているのか。"}, {"t": 686.2166666666667, "x": "それを確かめた観測は、ありません。"}, {"t": 688.9, "x": "確かめるには、行って近くで見るしかないからです。"}, {"t": 692.1666666666666, "x": "立っているのは、影を作る何かです。"}, {"t": 694.8666666666667, "x": "そこまでが、記録で言えることです。"}, {"t": 697.4, "x": "旗を撮ろうとして撮れず、影を数えることで答えを出した。"}, {"t": 701.3, "x": "この回で扱うものの多くが、だいたいこの形をしています。"}, {"t": 705.35, "x": "置いてきたものは確かにそこにあるのに、直接は見えない。"}, {"t": 709.0833333333334, "x": "見えるのは、それが残した痕跡のほうです。"}, {"t": 712.15, "x": "月に置いてきたもののうち、たった一種類だけ、"}, {"t": 715.3, "x": "いまも使われ続けているものがあります。"}, {"t": 718.0, "x": "レーザーの反射鏡です。"}, {"t": 719.6, "x": "アポロ十一号、十四号、十五号が、"}, {"t": 723.0, "x": "それぞれ一つずつ、月面に据えました。"}, {"t": 726.1, "x": "見た目は、四角い板に、ガラスの角を切り出した"}, {"t": 729.6, "x": "ような小さな立方体が、びっしり並んでいるものです。"}, {"t": 733.2166666666667, "x": "この立方体には、性質が一つあります。"}, {"t": 736.3, "x": "どの方向から光が入っても、"}, {"t": 738.1833333333333, "x": "入ってきた方向へ、まっすぐ返す。"}, {"t": 741.0833333333334, "x": "鏡のように角度を合わせる必要がありません。"}, {"t": 743.95, "x": "だから、置くだけでいいのです。"}, {"t": 746.1, "x": "数は、十一号のものが百個、十四号のものが"}, {"t": 749.9833333333333, "x": "百個、十五号のものが三百個。"}, {"t": 752.5833333333334, "x": "この装置には、電源がありません。"}, {"t": 755.1, "x": "電池も、太陽電池も、ついていません。"}, {"t": 758.2833333333333, "x": "動く部分もありません。"}, {"t": 759.8333333333334, "x": "ただ、板が置いてあるだけです。"}, {"t": 762.1333333333333, "x": "地球側では、ニューメキシコ、フランス、イタリア、"}, {"t": 766.1666666666666, "x": "ドイツの望遠鏡が、この板に向けてレーザーを撃ちます。"}, {"t": 770.1833333333333, "x": "光が戻ってくるまでの時間を"}, {"t": 772.0666666666667, "x": "測れば、地球と月の距離が出ます。"}, {"t": 774.6333333333333, "x": "精度は、数ミリです。"}, {"t": 776.5333333333333, "x": "三十八万キロメートル離れたものまでの"}, {"t": 779.0833333333334, "x": "距離を、数ミリで測っていることになります。"}, {"t": 781.9666666666667, "x": "そこから分かったことが、いくつもあります。"}, {"t": 784.7666666666667, "x": "月は、地球から、一年に三・"}, {"t": 787.4333333333333, "x": "八センチメートルずつ遠ざかっています。"}, {"t": 789.95, "x": "月の内部には、流体の核があると考えられています。"}, {"t": 793.7166666666667, "x": "月は、地球の引力で毎月わずかにたわんでいて、"}, {"t": 797.2, "x": "その量は最大で十五センチほどになります。"}, {"t": 800.25, "x": "アインシュタインの重力の理論が、"}, {"t": 802.15, "x": "この測定でも成り立つことが確かめられました。"}, {"t": 805.25, "x": "設置から半世紀以上たったいまも、"}, {"t": 807.4333333333333, "x": "この観測は続いています。"}, {"t": 809.5333333333333, "x": "アポロが置いてきたもので、現役の科学の"}, {"t": 812.4333333333333, "x": "道具として動いているのは、これだけです。"}, {"t": 815.2, "x": "理由は、単純です。"}, {"t": 817.0, "x": "動く部分がなく、電気を使わないからです。"}, {"t": 820.2166666666667, "x": "反対に、電気を使っていたものは、順番に止まりました。"}, {"t": 824.4333333333333, "x": "アポロ十二号から十七号までの五回は、"}, {"t": 827.1166666666667, "x": "月面に実験装置の一式を設置しました。"}, {"t": 830.3166666666667, "x": "地震計、磁力計、太陽風の測定器、熱の流れを"}, {"t": 834.9833333333333, "x": "測る装置、月の周りの薄い大気を測る装置。"}, {"t": 838.5833333333334, "x": "これらをまとめて、アルセップと呼びます。"}, {"t": 841.35, "x": "目録には、この一式の中心にある"}, {"t": 844.0333333333333, "x": "機械が別行で載っています。"}, {"t": 845.8333333333334, "x": "セントラル・ステーション。"}, {"t": 847.65, "x": "日本語にすれば、中央局です。"}, {"t": 850.2166666666667, "x": "各地点の装置から集めたデータを、まとめて"}, {"t": 853.1333333333333, "x": "地球へ送る中継機で、アポロ十二号から十七号までの"}, {"t": 857.1666666666666, "x": "座標が、小数点以下五桁まで記録されています。"}, {"t": 860.5666666666667, "x": "一式の中身は、回ごとに少しずつ違います。"}, {"t": 863.9166666666666, "x": "アポロ十四号には、火薬を使って人工的に小さな揺れを"}, {"t": 868.0333333333333, "x": "起こし、地面の下の層を探る装置が加わりました。"}, {"t": 871.7, "x": "アポロ十七号には、月面の重力を測る装置と、"}, {"t": 875.45, "x": "飛んでくる微小な粒を数える装置が積まれています。"}, {"t": 878.9833333333333, "x": "同じ一式ではなく、前の回で分からなかったことを、"}, {"t": 882.55, "x": "次の回で測る形になっていました。"}, {"t": 885.1833333333333, "x": "電源は、原子力でした。"}, {"t": 887.3333333333334, "x": "プルトニウム二三八という物質が崩れるときに"}, {"t": 890.6, "x": "出る熱を、そのまま電気に変える装置です。"}, {"t": 893.5666666666667, "x": "燃料は酸化物の形で三・八キログラム。"}, {"t": 896.6666666666666, "x": "電気の出力は、およそ七十ワット台。"}, {"t": 899.65, "x": "熱としては千二百五十ワットぶんの熱が出ていました。"}, {"t": 903.05, "x": "十年たっても、電気の出力は"}, {"t": 905.3833333333333, "x": "最初の九割以上を保っていました。"}, {"t": 907.7, "x": "このアルセップは、設計上は、"}, {"t": 909.9166666666666, "x": "着陸から一年動けばよいとされていました。"}, {"t": 913.0666666666667, "x": "実際には、最長で八年動き続けました。"}, {"t": 916.4333333333333, "x": "止まったのは、壊れたからではありません。"}, {"t": 919.15, "x": "一九七七年九月三十日。"}, {"t": 922.05, "x": "地球側の管制が、指令を送って、"}, {"t": 924.85, "x": "五つの実験装置をすべて停止させました。"}, {"t": 927.9833333333333, "x": "理由として挙げられているのは、主に予算です。"}, {"t": 931.2166666666667, "x": "電源の出力が落ちてきて、送信機と"}, {"t": 933.9166666666666, "x": "観測機器を同時に動かせなくなっていたこと、"}, {"t": 936.5666666666667, "x": "そして、その管制室を別の作業に"}, {"t": 939.5666666666667, "x": "使う必要があったことも記録されています。"}, {"t": 942.0333333333333, "x": "つまり、月のほうはまだ喋っていられたのに、"}, {"t": 944.9, "x": "地球のほうが、聞くのをやめたということになります。"}, {"t": 948.5166666666667, "x": "話は、ここで終わりませんでした。"}, {"t": 951.05, "x": "アルセップが八年ぶんに集めたデータは、"}, {"t": 953.45, "x": "当時の磁気テープに記録されていました。"}, {"t": 956.1333333333333, "x": "ところが、アポロ計画が終わったあと、"}, {"t": 958.7166666666667, "x": "このテープの一部は、正式に保管されないまま、"}, {"t": 962.2666666666667, "x": "行方が分からなくなります。"}, {"t": 964.2333333333333, "x": "二十一世紀に入ってから、NASAは"}, {"t": 966.7, "x": "これを探し直す取り組みを始めました。"}, {"t": 969.15, "x": "散逸したテープを探し、読み出し、当時の"}, {"t": 972.6, "x": "記録形式を解読し、足りない補足情報を"}, {"t": 975.85, "x": "集め直して、いまのデータベースに入れる。"}, {"t": 978.6333333333333, "x": "月面の地震計が一九七〇年代に記録した揺れが、"}, {"t": 982.5166666666667, "x": "そうやって少しずつ復元されています。"}, {"t": 985.1666666666666, "x": "置いてきた機械はもう黙っていますが、"}, {"t": 987.25, "x": "その機械が喋っていた内容のほうは、いまも"}, {"t": 990.5333333333333, "x": "掘り返されている、ということになります。"}, {"t": 993.1833333333333, "x": "もう一つ、先に黙っていた装置があります。"}, {"t": 996.3, "x": "アポロ十一号が置いた地震計です。"}, {"t": 998.7666666666667, "x": "こちらはアルセップではなく、"}, {"t": 1000.35, "x": "太陽電池で動く簡易版でした。"}, {"t": 1002.85, "x": "一九六九年八月三日、日が沈む五時間ほど"}, {"t": 1006.9833333333333, "x": "前に送信が止まり、次の月の昼に一度は目を"}, {"t": 1010.3333333333334, "x": "覚ましたものの、八月二十七日には、"}, {"t": 1013.1833333333333, "x": "地球からの指令をもう受け付けなくなりました。"}, {"t": 1016.15, "x": "動いていたのは、実質、月の一日ぶんでした。"}, {"t": 1019.95, "x": "同じ着陸地点に、一日しか働かなかった"}, {"t": 1023.2, "x": "機械と、五十年以上働き続けている板が、"}, {"t": 1026.55, "x": "五メートルほど離れて並んでいます。"}, {"t": 1028.9833333333333, "x": "目録には、機材の一覧に混じって、"}, {"t": 1031.6833333333334, "x": "明らかに性質の違う行が並んでいます。"}, {"t": 1034.7833333333333, "x": "アポロ十一号の項には、こうあります。"}, {"t": 1037.7166666666667, "x": "金のオリーブの枝。"}, {"t": 1039.0333333333333, "x": "アポロ一号の記章。"}, {"t": 1040.55, "x": "括弧書きで、亡くなった飛行士グリソム、"}, {"t": 1043.2833333333333, "x": "ホワイト、チャフィーを悼む、と添えられています。"}, {"t": 1047.05, "x": "この三人は、一九六七年に、"}, {"t": 1050.1, "x": "地上での試験中の火災で亡くなりました。"}, {"t": 1053.05, "x": "宇宙飛行士の記章が二つ。"}, {"t": 1054.9666666666667, "x": "こちらは、亡くなったガガーリンと"}, {"t": 1057.1166666666666, "x": "コマロフを悼む、とあります。"}, {"t": 1059.2166666666667, "x": "そして、月の記念の円盤。"}, {"t": 1061.4666666666667, "x": "この円盤は、五十セント硬貨ほどの"}, {"t": 1064.1333333333334, "x": "大きさの、シリコンの板です。"}, {"t": 1066.2, "x": "七十三か国の指導者から寄せられた親善の"}, {"t": 1069.0666666666666, "x": "メッセージと、アイゼンハワー、ケネディ、"}, {"t": 1071.9, "x": "ジョンソン、ニクソンという四人の"}, {"t": 1074.3666666666666, "x": "大統領の声明が、焼き付けられています。"}, {"t": 1077.2666666666667, "x": "焼き付けの方法は、こうです。"}, {"t": 1079.5666666666666, "x": "それぞれの文面を、二百分の一に縮めて写真に撮り、"}, {"t": 1083.45, "x": "その像を通して紫外線を当てて、感光した膜に写し取る。"}, {"t": 1087.8666666666666, "x": "半導体を作るのと同じやり方です。"}, {"t": 1090.3833333333334, "x": "板の上には、こう刻まれています。"}, {"t": 1092.95, "x": "アポロ十一号の飛行士が月へ運んだ、"}, {"t": 1095.55, "x": "世界じゅうからの親善のメッセージ。"}, {"t": 1098.0833333333333, "x": "縁にはこうあります。"}, {"t": 1099.4, "x": "地球という惑星より、一九六九年七月。"}, {"t": 1103.4666666666667, "x": "刻まれているのは、メッセージだけではありません。"}, {"t": 1106.6166666666666, "x": "当時の議会の指導部の名簿、NASAに"}, {"t": 1109.2, "x": "関わる法律を扱った上下両院の四つの"}, {"t": 1111.9666666666667, "x": "委員会の議員名、そしてNASAの歴代と"}, {"t": 1114.7, "x": "当時の幹部の名前も、同じ板に入っています。"}, {"t": 1117.95, "x": "関わった人間の名前を、"}, {"t": 1119.55, "x": "まとめて置いてきた、ということになります。"}, {"t": 1122.7, "x": "シリコンが選ばれたのは、月面の温度差に耐えるからです。"}, {"t": 1126.5333333333333, "x": "紙でも、布でも、樹脂でも、そこでは残りません。"}, {"t": 1130.6333333333334, "x": "この円盤は、アルミの容器に入って、"}, {"t": 1133.35, "x": "静かの海に置かれています。"}, {"t": 1135.3833333333334, "x": "アポロ十二号の項の、最後のほうに、"}, {"t": 1138.2, "x": "こういう行があります。"}, {"t": 1139.9666666666667, "x": "宇宙飛行士の記章。"}, {"t": 1141.4333333333334, "x": "括弧の中に、二つの名前があります。"}, {"t": 1144.2333333333333, "x": "C・C・ウィリアムズ、一つ。"}, {"t": 1147.4166666666667, "x": "アラン・ビーン、一つ。"}, {"t": 1149.6, "x": "クリフトン・ウィリアムズは、アポロ十二号で"}, {"t": 1152.6166666666666, "x": "月に降りるはずだった飛行士です。"}, {"t": 1154.8, "x": "訓練中の飛行機の事故で、着陸の二年前に亡くなりました。"}, {"t": 1159.2, "x": "代わりに降りたのがアラン・ビーンで、"}, {"t": 1161.1, "x": "ビーンは、自分の銀の記章と、ウィリアムズの"}, {"t": 1164.95, "x": "記章を、月面に置いてきました。"}, {"t": 1167.4, "x": "アポロ十四号の項には、二行だけ、"}, {"t": 1170.1666666666667, "x": "こういう記載があります。"}, {"t": 1171.95, "x": "ゴルフボール、二個。"}, {"t": 1173.6833333333334, "x": "やり、一本。"}, {"t": 1175.0833333333333, "x": "一九七一年二月六日、アラン・シェパードは、"}, {"t": 1179.0833333333333, "x": "月の岩を採るための道具の柄に、"}, {"t": 1181.55, "x": "六番アイアンのヘッドを取り付けました。"}, {"t": 1184.3166666666666, "x": "与圧された服は硬く、両手で普通に"}, {"t": 1187.1, "x": "振ることができなかったので、片手で打ちました。"}, {"t": 1190.0833333333333, "x": "二球です。"}, {"t": 1191.0, "x": "本人はそのとき、二球目は「何マイルも、"}, {"t": 1194.3833333333334, "x": "何マイルも飛んだ」と冗談を言っています。"}, {"t": 1197.5666666666666, "x": "その二球が、実際にどこまで飛んだのか。"}, {"t": 1200.5166666666667, "x": "二〇二一年に、画像の専門家が当時のフィルムを"}, {"t": 1203.9833333333333, "x": "高い解像度で取り直し、月を回っている探査機の"}, {"t": 1207.5166666666667, "x": "写真を縮尺の基準にして、落下点を割り出しました。"}, {"t": 1211.2, "x": "結果は、一球目がおよそ二十四ヤード、"}, {"t": 1214.05, "x": "二球目がおよそ四十ヤードとされています。"}, {"t": 1217.0166666666667, "x": "約二十二メートルと、約三十七メートルです。"}, {"t": 1220.5333333333333, "x": "やりのほうは、同じ船外活動で、"}, {"t": 1223.4666666666667, "x": "エドガー・ミッチェルが投げたものです。"}, {"t": 1225.9666666666667, "x": "アポロ十五号の項は、いちばん長くなります。"}, {"t": 1229.2333333333333, "x": "アメリカ海兵隊の旗。"}, {"t": 1230.95, "x": "ハンマーと、羽根。"}, {"t": 1232.5166666666667, "x": "鷹の羽根。"}, {"t": 1233.4166666666667, "x": "ジェームズ・アーウィンの肖像。"}, {"t": 1235.6166666666666, "x": "聖書。"}, {"t": 1236.7333333333333, "x": "括弧書きで、ジェームズ・アーウィンが"}, {"t": 1239.1166666666666, "x": "月面車のダッシュボードに置いた、とあります。"}, {"t": 1242.4333333333334, "x": "アポロ十一号の関係資料を収めたマイクロフィルム。"}, {"t": 1245.8, "x": "二ドル紙幣、百枚。"}, {"t": 1247.7, "x": "乗員それぞれの私物の袋。"}, {"t": 1249.6666666666667, "x": "そして、「ミシガン大学 月の同窓生」と記された文書。"}, {"t": 1254.6333333333334, "x": "ハンマーと羽根というのは、船長の"}, {"t": 1257.2166666666667, "x": "デイヴィッド・スコットが月面で行った実演です。"}, {"t": 1260.1666666666667, "x": "空気がなければ、重いものと軽いものは同じ速さで落ちる。"}, {"t": 1264.15, "x": "それを、実際に落として見せました。"}, {"t": 1266.7666666666667, "x": "羽根は、そのまま月面に残されています。"}, {"t": 1269.7166666666667, "x": "そして、同じアポロ十五号の項に、"}, {"t": 1272.5, "x": "こう書かれた行があります。"}, {"t": 1274.4666666666667, "x": "倒れた宇宙飛行士の像、および銘板。"}, {"t": 1277.4166666666667, "x": "手のひらに乗る大きさの、アルミニウムの人形です。"}, {"t": 1280.9666666666667, "x": "ベルギーの美術家が作りました。"}, {"t": 1283.0166666666667, "x": "作るときの条件は、月面の温度に耐えること、"}, {"t": 1286.3166666666666, "x": "軽くて丈夫なこと、そして、男とも女とも、"}, {"t": 1290.2833333333333, "x": "どの民族とも分からない姿にすること、でした。"}, {"t": 1293.9, "x": "像のそばに置かれた銘板には、名前が刻まれています。"}, {"t": 1297.6666666666667, "x": "アメリカの宇宙飛行士が八名、"}, {"t": 1299.6833333333334, "x": "ソビエト連邦の宇宙飛行士が六名。"}, {"t": 1302.4666666666667, "x": "合わせて十四名。"}, {"t": 1303.85, "x": "宇宙を目指す過程で亡くなった人たちです。"}, {"t": 1306.4666666666667, "x": "冷戦のさなかに、アメリカの乗員が、"}, {"t": 1309.1, "x": "ソビエト連邦の飛行士の名前を刻んだ板を、"}, {"t": 1312.3166666666666, "x": "月に置いていったことになります。"}, {"t": 1314.5166666666667, "x": "同じ考え方は、アポロ十一号の項にもありました。"}, {"t": 1318.3833333333334, "x": "ガガーリンとコマロフの記章です。"}, {"t": 1320.4, "x": "最初に月へ降りた回から、最後に月へ"}, {"t": 1323.2666666666667, "x": "降りた回にかけて、相手側の死者の名前が、"}, {"t": 1326.3833333333334, "x": "繰り返し持っていかれています。"}, {"t": 1328.45, "x": "アポロ十六号の項には、三行だけあります。"}, {"t": 1331.8166666666666, "x": "チャールズ・デュークの家族写真。"}, {"t": 1334.15, "x": "アメリカ空軍創設二十五周年の銀のメダル。"}, {"t": 1337.3, "x": "ネクタイピン。"}, {"t": 1338.2, "x": "家族写真というのは、透明な袋に"}, {"t": 1340.95, "x": "入れた一枚のスナップです。"}, {"t": 1342.5666666666666, "x": "裏には手書きで、自分と妻と二人の息子の"}, {"t": 1345.6333333333334, "x": "名前が書かれていたと伝えられています。"}, {"t": 1347.9166666666667, "x": "デュークはそれを月面の砂の"}, {"t": 1349.7833333333333, "x": "上に置いて、写真を撮りました。"}, {"t": 1352.0833333333333, "x": "その写真が、いまどうなっているのか。"}, {"t": 1354.7333333333333, "x": "誰も確かめていません。"}, {"t": 1356.2833333333333, "x": "月面には紫外線を遮るものがなく、温度差も"}, {"t": 1359.7833333333333, "x": "大きいため、印画紙がそのままの色で"}, {"t": 1362.25, "x": "残っているとは考えにくい、とは言えます。"}, {"t": 1365.0833333333333, "x": "ただし、それを確かめに行った探査も、"}, {"t": 1367.7166666666667, "x": "上から撮って見分けられた例も、ありません。"}, {"t": 1370.9666666666667, "x": "分からない、というのが、いまの答えです。"}, {"t": 1374.1, "x": "目録を読み進めていくと、同じ種類の行が、"}, {"t": 1377.5666666666666, "x": "六回ぶん繰り返し出てきます。"}, {"t": 1379.7833333333333, "x": "排泄物の収集装置。"}, {"t": 1381.6833333333334, "x": "尿の収集装置。"}, {"t": 1383.1666666666667, "x": "嘔吐用の袋。"}, {"t": 1384.3333333333333, "x": "投棄用の袋。"}, {"t": 1385.5666666666666, "x": "アポロ十一号に四つ、十二号に四つ、"}, {"t": 1388.7, "x": "十四号に四つ、十六号に一つ、十七号に十二。"}, {"t": 1393.6166666666666, "x": "数の単位は、装置や袋の個数です。"}, {"t": 1396.6, "x": "十七号だけ数が多いのは、滞在が長かったからです。"}, {"t": 1400.5333333333333, "x": "アポロ十一号が月面にいた時間は"}, {"t": 1402.9333333333334, "x": "一日足らず、アポロ十七号は三日ほど。"}, {"t": 1406.05, "x": "人が長くいれば、そのぶん出るものも増えます。"}, {"t": 1409.1666666666667, "x": "目録の数字は、そのまま滞在の長さを写しています。"}, {"t": 1413.1166666666666, "x": "先ほど述べたとおり、上昇段は一グラムでも"}, {"t": 1416.3166666666666, "x": "軽くして飛び立つ必要がありました。"}, {"t": 1418.4666666666667, "x": "とくにアポロ十五号以降は、月を離れる前に、"}, {"t": 1421.8833333333334, "x": "不要な質量をすべて投棄する手順が採られています。"}, {"t": 1425.4166666666667, "x": "食べたあとの包み、医療品、使い終わった衣類、"}, {"t": 1429.1166666666666, "x": "そして人間が出したものも、その対象でした。"}, {"t": 1432.55, "x": "これらの袋について、よく引かれる数字があります。"}, {"t": 1436.0, "x": "六回の着陸を通じて、九十六個の袋と"}, {"t": 1439.3666666666666, "x": "容器が月面に残された、というものです。"}, {"t": 1442.35, "x": "ただ、この九十六という数字は、NASAの"}, {"t": 1445.55, "x": "目録から数え上げたものではありません。"}, {"t": 1447.9666666666667, "x": "長く繰り返されてきた通説の数字です。"}, {"t": 1450.65, "x": "目録に書かれているのは、各回に"}, {"t": 1453.1166666666666, "x": "こうした装置と袋が積まれていて、そして"}, {"t": 1455.85, "x": "持ち帰られなかった、というところまでです。"}, {"t": 1458.6666666666667, "x": "それでも、この袋が、ある一点で"}, {"t": 1461.5, "x": "科学の対象になっています。"}, {"t": 1463.2833333333333, "x": "袋の中には、人間の体から出たものが入っています。"}, {"t": 1467.1333333333334, "x": "つまり、地球の微生物が入っています。"}, {"t": 1470.0666666666666, "x": "いちばん古いものは、一九六九年の"}, {"t": 1473.2666666666667, "x": "七月から、静かの海に置かれたままです。"}, {"t": 1476.1833333333334, "x": "真空で、宇宙線が当たり、昼と夜で二百度以上、"}, {"t": 1480.2166666666667, "x": "温度が上下する場所に、半世紀以上。"}, {"t": 1483.45, "x": "もし、そのうちの一つを回収して調べたら、"}, {"t": 1486.5 667, "x": "袋のほうは、まだ誰も開けていません。"}, {"t": 1600.95, "x": "月に残っているものの中には、置いてきたのではなく、"}, {"t": 1604.45, "x": "狙って落としたものがあります。"}, {"t": 1606.5666666666666, "x": "アポロ十二号の上昇段は、乗員が"}, {"t": 1609.3333333333333, "x": "司令船に移ったあと、切り離されました。"}, {"t": 1612.2333333333333, "x": "そして、そのまま月面へ落とされました。"}, {"t": 1615.2, "x": "落とす先は、その少し前に自分たちが"}, {"t": 1617.9833333333333, "x": "設置した地震計の近くです。"}, {"t": 1619.9, "x": "人工的に、大きさの分かっている衝撃を"}, {"t": 1622.9333333333334, "x": "与えて、月の中がどうなっているかを調べる。"}, {"t": 1625.9833333333333, "x": "そういう実験でした。"}, {"t": 1627.4166666666667, "x": "記録された揺れは、予想と違いました。"}, {"t": 1630.1833333333334, "x": "強い信号が三十分以上続き、"}, {"t": 1632.5666666666666, "x": "弱い信号は、さらに一時間近く続きました。"}, {"t": 1636.2333333333333, "x": "地震計のデータを解析した地震学者は、"}, {"t": 1638.9, "x": "後年こう振り返っています。"}, {"t": 1640.9833333333333, "x": "非常に奇妙で、地球で起きるどの信号とも違っていた。"}, {"t": 1644.95, "x": "月にはほとんど水がなく、乾いているので、"}, {"t": 1648.0333333333333, "x": "地震波が減衰しない。"}, {"t": 1649.85, "x": "この観測から、月は鐘のように"}, {"t": 1652.2, "x": "鳴った、という言い回しが広まりました。"}, {"t": 1654.9166666666667, "x": "これはあくまで、揺れが長く続いたことを表す"}, {"t": 1658.0333333333333, "x": "比喩として使われるようになった表現です。"}, {"t": 1660.5, "x": "第一章で触れた、サターン五型ロケットの"}, {"t": 1663.35, "x": "第三段も、同じ目的で落とされています。"}, {"t": 1666.4666666666667, "x": "アポロ十三号、十四号、十五号、十六号、十七号の、五つ。"}, {"t": 1673.05, "x": "月に降りられなかったアポロ十三号が、それでも"}, {"t": 1676.3, "x": "月面に一つ残しているのは、このためです。"}, {"t": 1679.3166666666666, "x": "目録は、アメリカ以外の機体も並べています。"}, {"t": 1682.6, "x": "ソビエト連邦の欄には、ルナ二号から"}, {"t": 1685.3166666666666, "x": "二十四号までが並びます。"}, {"t": 1687.1166666666666, "x": "着陸に成功したもの、墜落したもの、"}, {"t": 1690.0, "x": "試料を採って帰ったあとの降下段。"}, {"t": 1692.4, "x": "この欄のいちばん上にあるルナ二号は、人間が"}, {"t": 1695.5333333333333, "x": "作ったもので、最初に月に届いたものです。"}, {"t": 1698.55, "x": "一九五九年のことで、アポロ十一号より"}, {"t": 1702.25, "x": "十年ちかく前になります。"}, {"t": 1703.9, "x": "月面に人工物が置かれた歴史は、そこから始まっています。"}, {"t": 1708.0166666666667, "x": "そして、ルノホート一号と二号。"}, {"t": 1710.6333333333334, "x": "これは、月面を走った無人の探査車です。"}, {"t": 1713.7666666666667, "x": "ルノホート一号は北緯三八・"}, {"t": 1715.85, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
