": "乗っていた機械の噴射でした。"}, {"t": 12.216666666666667, "x": "一九六九年、上昇段が月面を離れるとき、"}, {"t": 16.433333333333334, "x": "下向きに吹き出した炎が、すぐそばに"}, {"t": 19.333333333333332, "x": "立っていた旗を、そのまま押し倒しました。"}, {"t": 22.066666666666666, "x": "機内からそれを見ていたのは、バズ・オルドリンです。"}, {"t": 25.316666666666666, "x": "見た、と彼は報告しました。"}, {"t": 27.633333333333333, "x": "それから長いあいだ、それは"}, {"t": 29.616666666666667, "x": "一人の証言でしかありませんでした。"}, {"t": 31.816666666666666, "x": "確かめる方法がなかったからです。"}, {"t": 34.0, "x": "二〇一二年、月を回っている探査機が、"}, {"t": 37.016666666666666, "x": "その場所を上から撮りました。"}, {"t": 39.06666666666667, "x": "時刻の違う写真を何枚も並べ、影が"}, {"t": 41.96666666666667, "x": "どう動くかを調べたところ、アポロ十二号、"}, {"t": 44.95, "x": "十四号、十五号、十六号、十七号の"}, {"t": 49.35, "x": "着陸地点では、旗のあるはずの一点を中心に、"}, {"t": 52.766666666666666, "x": "細い影が一日かけてぐるりと回っていました。"}, {"t": 55.916666666666664, "x": "棒は立っていました。"}, {"t": 57.21666666666667, "x": "アポロ十一号の地点にだけ、その影がありませんでした。"}, {"t": 61.15, "x": "オルドリンの証言は、四十三年後に"}, {"t": 63.88333333333333, "x": "写真で裏づけられたことになります。"}, {"t": 66.01666666666667, "x": "倒れた旗はそのままです。"}, {"t": 67.8, "x": "誰も起こしていません。"}, {"t": 69.2, "x": "起こしに行った者がいないからです。"}, {"t": 71.28333333333333, "x": "月面には、人間が持っていって、"}, {"t": 73.68333333333334, "x": "そのまま置いてきたものが残っています。"}, {"t": 76.26666666666667, "x": "機体、機械、道具、袋、そして、道具とは呼べないものが。"}, {"t": 81.8, "x": "それらは、捨てられたわけでも、"}, {"t": 83.86666666666666, "x": "忘れられたわけでもありません。"}, {"t": 86.01666666666667, "x": "持ち帰るという選択肢が、はじめから"}, {"t": 88.65, "x": "用意されていなかっただけです。"}, {"t": 90.35, "x": "NASAは、それがどこにあるのかを"}, {"t": 92.51666666666667, "x": "一冊の目録にまとめています。"}, {"t": 94.51666666666667, "x": "表紙には、月の人工物は歴史と科学の両方で"}, {"t": 98.06666666666666, "x": "価値があり、守るためにはまず、何がどこにあるのかを"}, {"t": 101.9, "x": "確かめる必要がある、と書かれています。"}, {"t": 104.63333333333334, "x": "この回では、その目録を開いていきます。"}, {"t": 107.66666666666667, "x": "何が、どこに、いくつ残っているのか。"}, {"t": 110.8, "x": "そして、それがいまどうなっているのかを、"}, {"t": 113.4, "x": "記録に残っているところまで順に並べていきます。"}, {"t": 116.68333333333334, "x": "まず、置いてきた理由からです。"}, {"t": 119.0, "x": "うっかり忘れたわけでも、面倒だから"}, {"t": 121.55, "x": "捨てたわけでもありません。"}, {"t": 122.95, "x": "置いていくことは、設計の段階から決まっていました。"}, {"t": 126.43333333333334, "x": "アポロの月着陸船は、二階建てです。"}, {"t": 129.43333333333334, "x": "下半分が降下段、上半分が上昇段。"}, {"t": 132.73333333333332, "x": "降りるときは二つがつながったまま降り、帰るときは、"}, {"t": 136.1, "x": "上昇段だけが降下段を発射台にして飛び立ちます。"}, {"t": 139.73333333333332, "x": "降下段は、はじめから月に置いてくる部品でした。"}, {"t": 143.13333333333333, "x": "数字で見ると、こうなります。"}, {"t": 145.4, "x": "アポロ十一号の着陸船は、打ち上げのときの"}, {"t": 148.8, "x": "全体で、一万五千百三キログラム。"}, {"t": 151.76666666666668, "x": "このうち、降下段の燃料を除いた"}, {"t": 154.35, "x": "重さが、二千三十四キログラム。"}, {"t": 156.96666666666667, "x": "積んでいた月面用の機材を含めた数字です。"}, {"t": 159.98333333333332, "x": "この二千三十四キログラムは、最初から地球に"}, {"t": 163.3, "x": "戻さないものとして計算されていました。"}, {"t": 165.7, "x": "上昇段のほうは、燃料を除いて二千四百四十五キログラム。"}, {"t": 170.18333333333334, "x": "持っていた推進剤は二千三百七十六キログラム。"}, {"t": 173.66666666666666, "x": "これだけで、月の重力を振り切って、上で"}, {"t": 177.03333333333333, "x": "待っている司令船に追いつかなければなりません。"}, {"t": 179.7, "x": "余裕はほとんどありませんでした。"}, {"t": 181.73333333333332, "x": "だから、飛び立つ前に、乗員は"}, {"t": 184.38333333333333, "x": "機内で捨てられるものを捨てます。"}, {"t": 186.21666666666667, "x": "使い終わったカメラ、背負っていた"}, {"t": 188.36666666666667, "x": "生命維持装置、月面用の靴と手袋、"}, {"t": 191.56666666666666, "x": "食べたあとの包み、そういうものを機外に"}, {"t": 194.65, "x": "放り出してから、上昇段のドアを閉めました。"}, {"t": 197.66666666666666, "x": "持ち帰るのは、岩と、砂と、フィルムと、人間だけです。"}, {"t": 202.65, "x": "一グラムでも軽いほうがいい、という"}, {"t": 205.08333333333334, "x": "判断が、六回ぶん積み重なりました。"}, {"t": 207.88333333333333, "x": "置いてきたものの一覧は、言いかえれば、"}, {"t": 210.55, "x": "その判断の記録です。"}, {"t": 212.36666666666667, "x": "何を持って帰り、何を置くかを、一つずつ"}, {"t": 215.7, "x": "決めた結果が、そのまま月面に並んでいます。"}, {"t": 218.76666666666668, "x": "NASAの歴史部門が、月にある"}, {"t": 220.98333333333332, "x": "人工物の目録を作っています。"}, {"t": 223.23333333333332, "x": "表題は「月面の人工物カタログ」。"}, {"t": 226.11666666666667, "x": "文書に打たれた日付は、二〇一二年七月五日。"}, {"t": 229.76666666666668, "x": "全二十二ページの一覧です。"}, {"t": 231.76666666666668, "x": "この目録は、国ごとに区分けされています。"}, {"t": 234.83333333333334, "x": "アメリカのアポロ以外の機体、"}, {"t": 236.53333333333333, "x": "アメリカのアポロ、ソビエト連邦、中国、"}, {"t": 240.2, "x": "インド、日本、そしてヨーロッパ宇宙機関。"}, {"t": 243.95, "x": "多くの項目には、北緯何度、"}, {"t": 246.3, "x": "東経何度という座標が添えられています。"}, {"t": 249.16666666666666, "x": "中身は、想像よりずっと細かい一覧です。"}, {"t": 252.36666666666667, "x": "たとえば、アポロ十一号の項には、"}, {"t": 255.03333333333333, "x": "こういう行が並んでいます。"}, {"t": 257.1333333333333, "x": "ハンマー。"}, {"t": 258.23333333333335, "x": "大きいほうの月試料用スコップ。"}, {"t": 260.35, "x": "柄の延長棒。"}, {"t": 261.46666666666664, "x": "トング。"}, {"t": 262.5833333333333, "x": "ノーモン。"}, {"t": 263.7, "x": "ノーモンというのは、砂に立てて、太陽の"}, {"t": 266.78333333333336, "x": "角度と色の基準を写しこむための小さな棒です。"}, {"t": 269.9, "x": "これらはすべて、置いてきました。"}, {"t": 272.28333333333336, "x": "回を追うごとに、道具は増えていきます。"}, {"t": 275.06666666666666, "x": "熊手。"}, {"t": 276.18333333333334, "x": "掘削機。"}, {"t": 277.06666666666666, "x": "ボーリング用の管。"}, {"t": 278.3333333333333, "x": "刃。"}, {"t": 279.43333333333334, "x": "テフロンの袋。"}, {"t": 280.56666666666666, "x": "土の採取器。"}, {"t": 281.7, "x": "カメラ。"}, {"t": 282.78333333333336, "x": "レンズ。"}, {"t": 283.8833333333333, "x": "三脚。"}, {"t": 285.0, "x": "ケーブル。"}, {"t": 286.0833333333333, "x": "ハンモック。"}, {"t": 286.9166666666667, "x": "タオル。"}, {"t": 288.0, "x": "耳栓。"}, {"t": 289.1, "x": "爪切り。"}, {"t": 290.21666666666664, "x": "石けん。"}, {"t": 291.31666666666666, "x": "ウェットティッシュ。"}, {"t": 292.26666666666665, "x": "軟膏。"}, {"t": 293.3833333333333, "x": "道具の一覧を読んでいると、途中で、これは"}, {"t": 296.71666666666664, "x": "引っ越しの荷物ではなく、住まなかった家の"}, {"t": 299.55, "x": "残置物の一覧だ、という感じがしてきます。"}, {"t": 302.5833333333333, "x": "一つ一つは、どこにでもある道具です。"}, {"t": 305.43333333333334, "x": "ハンマーも、トングも、熊手も、"}, {"t": 307.9166666666667, "x": "地球の物置にあるものとそう変わりません。"}, {"t": 310.81666666666666, "x": "違うのは、それが北緯何度、"}, {"t": 312.96666666666664, "x": "東経何度という数字つきで記録されていて、"}, {"t": 315.98333333333335, "x": "しかも誰も取りに行かないことだけです。"}, {"t": 318.48333333333335, "x": "そして、目録には、着陸していない回の記載もあります。"}, {"t": 322.8833333333333, "x": "アポロ十三号の項です。"}, {"t": 324.7, "x": "ここには、たった一行しかありません。"}, {"t": 327.3666666666667, "x": "サターン五型ロケットの第三段。"}, {"t": 329.48333333333335, "x": "座標は、南緯二・五五三度、東経二七・八八七度。"}, {"t": 334.5833333333333, "x": "アポロ十三号は、月に降りられなかった回です。"}, {"t": 337.98333333333335, "x": "それでも、月に一つ置いてきています。"}, {"t": 340.7, "x": "切り離したロケットの段が、月面に落ちているからです。"}, {"t": 344.3833333333333, "x": "同じ「第三段」の記載は、アポロ十四号、"}, {"t": 348.45, "x": "十五号、十六号、十七号の項にもあります。"}, {"t": 352.75, "x": "合わせて五つ。"}, {"t": 353.85, "x": "どれも、意図的に月へ落とされたものです。"}, {"t": 356.75, "x": "理由は第六章で述べます。"}, {"t": 358.6666666666667, "x": "さて、ここまで読むと、合計はいくつなのか、"}, {"t": 362.15, "x": "全部で何トンなのかが気になります。"}, {"t": 364.6333333333333, "x": "ところが、この目録には、それが書かれていません。"}, {"t": 368.3833333333333, "x": "合計の重さが、書かれていません。"}, {"t": 370.9166666666667, "x": "合計の個数も、書かれていません。"}, {"t": 373.5, "x": "この一覧は「何が、どこにあるか」の帳面であって、"}, {"t": 377.93333333333334, "x": "重さを足し上げた表ではないのです。"}, {"t": 380.51666666666665, "x": "よく引かれる「およそ十八万キログラム」という"}, {"t": 384.1166666666667, "x": "数字があります。"}, {"t": 385.1, "x": "日本語でも英語でも、月に残されたものの"}, {"t": 388.03333333333336, "x": "総量として、この数字が繰り返し使われています。"}, {"t": 391.53333333333336, "x": "ただ、これはNASAが公式に出した数字ではありません。"}, {"t": 395.01666666666665, "x": "残っている機体の重量を足し合わせた推計で、"}, {"t": 397.9, "x": "出典によって、十五万台のこともあれば、"}, {"t": 401.18333333333334, "x": "十八万台のこともあります。"}, {"t": 403.3833333333333, "x": "ですから、この回では、こう扱います。"}, {"t": 406.56666666666666, "x": "月にあるものの総量は、"}, {"t": 408.1166666666667, "x": "およそ十八万キログラムと言われている。"}, {"t": 410.9166666666667, "x": "ただしそれは推計であって、"}, {"t": 412.6166666666667, "x": "NASAの目録には合計欄がない。"}, {"t": 415.1333333333333, "x": "分かっているのは、個々の品目のほうです。"}, {"t": 418.05, "x": "そちらは、驚くほど細かく残っています。"}, {"t": 421.1166666666667, "x": "目録をアポロの項から順に読んでいくと、六回ぶんの"}, {"t": 424.75, "x": "着陸地点に、それぞれ一件ずつ、同じ記載があります。"}, {"t": 429.03333333333336, "x": "「フラッグキット」。"}, {"t": 430.1, "x": "あるいは「フラッグキット、月面用」。"}, {"t": 433.1333333333333, "x": "十一号に一件、十二号に一件、十四号に一件、"}, {"t": 437.5833333333333, "x": "十五号に一件、十六号に一件、十七号に一件。"}, {"t": 442.5, "x": "合わせて六本。"}, {"t": 443.6166666666667, "x": "これが、月にあるアメリカの旗のすべてです。"}, {"t": 446.65, "x": "着陸した座標も並んでいます。"}, {"t": 448.75, "x": "十一号が北緯〇・四一度、東経二三・二六度。"}, {"t": 453.1, "x": "十二号が南緯三・一一度、西経二三・二三度。"}, {"t": 457.43333333333334, "x": "十四号が南緯三・四〇度、西経一七・二八度。"}, {"t": 461.73333333333335, "x": "十五号が北緯二六・六度、東経三・三九度。"}, {"t": 465.8666666666667, "x": "十六号が南緯八・九七三度、東経一五・三一度。"}, {"t": 470.3833333333333, "x": "十七号が北緯二〇・一〇度、東経三〇・四六度。"}, {"t": 474.8333333333333, "x": "六つの点は、月の表側に散らばっています。"}, {"t": 478.18333333333334, "x": "どれも、地球から見える側です。"}, {"t": 480.6166666666667, "x": "裏側に降りた回は、一度もありません。"}, {"t": 483.5, "x": "裏側に回ると、地球との電波が"}, {"t": 486.03333333333336, "x": "直接は届かなくなるからです。"}, {"t": 488.0, "x": "座標を地図に落とすと、赤道の"}, {"t": 490.35, "x": "まわりに寄っているのが分かります。"}, {"t": 492.23333333333335, "x": "いちばん北にあるのが、北緯二六度台のアポロ十五号。"}, {"t": 496.3, "x": "いちばん南が、南緯八・九七三度のアポロ十六号。"}, {"t": 500.4166666666667, "x": "緯度の幅は、三十五度ほどしかありません。"}, {"t": 503.4, "x": "南極も、北極も、人が降りた場所ではないのです。"}, {"t": 507.25, "x": "さて、その六本が、いまどうなっているか。"}, {"t": 510.5833333333333, "x": "これを調べたのが、月を回っている"}, {"t": 513.0333333333333, "x": "探査機に載っているカメラでした。"}, {"t": 514.8666666666667, "x": "この探査機は、二〇〇九年から月を回っています。"}, {"t": 518.4, "x": "特徴は、軌道をわざと調整して、"}, {"t": 521.0333333333333, "x": "いちばん低いところが、アポロの着陸地点の"}, {"t": 524.5, "x": "上に来るようにしてあることです。"}, {"t": 526.2666666666667, "x": "高度で、およそ二十五キロから五十キロ。"}, {"t": 529.2333333333333, "x": "そこから撮ると、一メートルより"}, {"t": 531.5, "x": "小さいものまで見分けられます。"}, {"t": 533.35, "x": "二〇一一年一月二十五日に撮られたアポロ十四号の"}, {"t": 537.05, "x": "地点の写真には、着陸船アンタレスの"}, {"t": 539.8166666666667, "x": "降下段と、少し離れたところに置かれた"}, {"t": 542.55, "x": "実験装置と、その二つのあいだを何度も"}, {"t": 545.45, "x": "往復した足跡が、そのまま写っています。"}, {"t": 548.2666666666667, "x": "写真の横幅は五百メートルです。"}, {"t": 550.6, "x": "四十年前に人が歩いた線が、そのまま残っています。"}, {"t": 554.5, "x": "月面には、風も雨もありません。"}, {"t": 557.05, "x": "足跡を消すものが、ほとんどないのです。"}, {"t": 559.8833333333333, "x": "写真の中で、いちばん目立つのは降下段です。"}, {"t": 563.1833333333333, "x": "上から見ると、明るい点と、"}, {"t": 565.3833333333333, "x": "そこから伸びる長い影になります。"}, {"t": 567.8333333333334, "x": "影の長さで、そこに立体があることが分かる。"}, {"t": 571.05, "x": "この「影で判断する」というやり方が、このあと、"}, {"t": 575.15, "x": "旗の話でそのまま使われることになります。"}, {"t": 578.2333333333333, "x": "アポロ十二号の地点では、降下段と、実験装置と、"}, {"t": 582.3833333333333, "x": "その近くに立っていたサーベイヤー三号という"}, {"t": 585.3, "x": "別の探査機が、同じ一枚に収まりました。"}, {"t": 588.4666666666667, "x": "サーベイヤー三号は、アポロ十二号の"}, {"t": 591.1666666666666, "x": "二年半前に、無人で降りていた機体です。"}, {"t": 594.1166666666667, "x": "十二号は、それが立っている"}, {"t": 596.1166666666667, "x": "場所のすぐそばに着陸しました。"}, {"t": 598.1666666666666, "x": "アポロ十七号の地点では、月面車の轍が、"}, {"t": 601.5833333333334, "x": "細い平行線として残っているのが見えます。"}, {"t": 604.6666666666666, "x": "旗については、少し事情が違います。"}, {"t": 607.55, "x": "旗そのものは、上から見ても、"}, {"t": 609.75, "x": "ほとんど点にしかなりません。"}, {"t": 611.7833333333333, "x": "布の面積が小さすぎて、写真の一画素に届かないのです。"}, {"t": 616.0, "x": "そこで、カメラを運用していた"}, {"t": 618.0833333333334, "x": "研究者は、影を見ることにしました。"}, {"t": 620.75, "x": "同じ場所を、月の一日のうちの違う時刻に、何度も撮る。"}, {"t": 625.2666666666667, "x": "もし棒が立っていれば、その影は、太陽の動きに"}, {"t": 628.95, "x": "合わせて、棒を中心にぐるりと回るはずです。"}, {"t": 632.1, "x": "棒が倒れていれば、そうはなりません。"}, {"t": 634.7166666666667, "x": "二〇一二年七月二十七日に公開された"}, {"t": 637.75, "x": "報告に、その結果が書かれています。"}, {"t": 640.35, "x": "アポロ十一号を除くすべての地点で、"}, {"t": 642.8333333333334, "x": "アメリカの旗は立っていて、影を落としている。"}, {"t": 646.2, "x": "十二号、十四号、十五号、十六号、十七号。"}, {"t": 651.35, "x": "五本です。"}, {"t": 652.2333333333333, "x": "そして十一号の地点には、その影がありません。"}, {"t": 655.6333333333333, "x": "オルドリンの証言のとおりでした。"}, {"t": 657.6666666666666, "x": "ここで、一つ言っておかなければならないことがあります。"}, {"t": 661.15, "x": "分かったのは「何かが立っている」ということだけです。"}, {"t": 664.9333333333333, "x": "布がどうなっているかは、分かっていません。"}, {"t": 667.7, "x": "月面には大気がないので、紫外線がそのまま当たります。"}, {"t": 671.5666666666667, "x": "温度は、日なたと日陰で二百度以上ちがいます。"}, {"t": 674.9166666666666, "x": "四十年、五十年とそれを浴び続けた布が、"}, {"t": 678.2333333333333, "x": "どんな色になっているのか。"}, {"t": 680.1333333333333, "x": "染めた色が抜けているのか。"}, {"t": 681.9166666666666, "x": "繊維として残っているのか、それとも粉になっているのか。"}, {"t": 685.7, "x": "それを確かめた観測は、ありません。"}, {"t": 688.3833333333333, "x": "確かめるには、行って近くで見るしかないからです。"}, {"t": 691.65, "x": "立っているのは、影を作る何かです。"}, {"t": 694.35, "x": "そこまでが、記録で言えることです。"}, {"t": 696.8833333333333, "x": "旗を撮ろうとして撮れず、影を数えることで答えを出した。"}, {"t": 700.7833333333333, "x": "この回で扱うものの多くが、だいたいこの形をしています。"}, {"t": 704.8333333333334, "x": "置いてきたものは確かにそこにあるのに、直接は見えない。"}, {"t": 708.5666666666667, "x": "見えるのは、それが残した痕跡のほうです。"}, {"t": 711.6333333333333, "x": "月に置いてきたもののうち、たった一種類だけ、"}, {"t": 714.7833333333333, "x": "いまも使われ続けているものがあります。"}, {"t": 717.4833333333333, "x": "レーザーの反射鏡です。"}, {"t": 719.0833333333334, "x": "アポロ十一号、十四号、十五号が、"}, {"t": 722.4833333333333, "x": "それぞれ一つずつ、月面に据えました。"}, {"t": 725.5833333333334, "x": "見た目は、四角い板に、ガラスの角を切り出したような"}, {"t": 729.3666666666667, "x": "小さな立方体が、びっしり並んでいるものです。"}, {"t": 732.65, "x": "この立方体には、性質が一つあります。"}, {"t": 735.7333333333333, "x": "どの方向から光が入っても、"}, {"t": 737.6166666666667, "x": "入ってきた方向へ、まっすぐ返す。"}, {"t": 740.5166666666667, "x": "鏡のように角度を合わせる必要がありません。"}, {"t": 743.3833333333333, "x": "だから、置くだけでいいのです。"}, {"t": 745.5333333333333, "x": "数は、十一号のものが百個、十四号のものが"}, {"t": 749.4166666666666, "x": "百個、十五号のものが三百個。"}, {"t": 752.0166666666667, "x": "この装置には、電源がありません。"}, {"t": 754.5333333333333, "x": "電池も、太陽電池も、ついていません。"}, {"t": 757.7166666666667, "x": "動く部分もありません。"}, {"t": 759.2666666666667, "x": "ただ、板が置いてあるだけです。"}, {"t": 761.5666666666667, "x": "地球側では、ニューメキシコ、フランス、イタリア、"}, {"t": 765.6, "x": "ドイツの望遠鏡が、この板に向けてレーザーを撃ちます。"}, {"t": 769.6166666666667, "x": "光が戻ってくるまでの時間を"}, {"t": 771.5, "x": "測れば、地球と月の距離が出ます。"}, {"t": 774.0666666666667, "x": "精度は、数ミリです。"}, {"t": 775.9666666666667, "x": "三十八万キロメートル離れたものまでの"}, {"t": 778.5166666666667, "x": "距離を、数ミリで測っていることになります。"}, {"t": 781.4, "x": "そこから分かったことが、いくつもあります。"}, {"t": 784.2, "x": "月は、地球から、一年に三・"}, {"t": 786.85, "x": "八センチメートルずつ遠ざかっています。"}, {"t": 789.3333333333334, "x": "月の内部には、流体の核があると考えられています。"}, {"t": 793.1, "x": "月は、地球の引力で毎月わずかにたわんでいて、"}, {"t": 796.5833333333334, "x": "その量は最大で十五センチほどになります。"}, {"t": 799.6333333333333, "x": "アインシュタインの重力の理論が、"}, {"t": 801.5333333333333, "x": "この測定でも成り立つことが確かめられました。"}, {"t": 804.6333333333333, "x": "設置から半世紀以上たったいまも、"}, {"t": 806.8166666666667, "x": "この観測は続いています。"}, {"t": 808.9166666666666, "x": "アポロが置いてきたもので、現役の科学の"}, {"t": 811.8166666666667, "x": "道具として動いているのは、これだけです。"}, {"t": 814.5833333333334, "x": "理由は、単純です。"}, {"t": 816.3833333333333, "x": "動く部分がなく、電気を使わないからです。"}, {"t": 819.6, "x": "反対に、電気を使っていたものは、順番に止まりました。"}, {"t": 823.8166666666667, "x": "アポロ十二号から十七号までの五回は、"}, {"t": 826.5, "x": "月面に実験装置の一式を設置しました。"}, {"t": 829.7, "x": "地震計、磁力計、太陽風の測定器、熱の流れを"}, {"t": 834.3666666666667, "x": "測る装置、月の周りの薄い大気を測る装置。"}, {"t": 837.9666666666667, "x": "これらをまとめて、アルセップと呼びます。"}, {"t": 840.7333333333333, "x": "目録には、この一式の中心にある"}, {"t": 843.4166666666666, "x": "機械が別行で載っています。"}, {"t": 845.2166666666667, "x": "セントラル・ステーション。"}, {"t": 846.5333333333333, "x": "日本語にすれば、中央局です。"}, {"t": 849.1, "x": "各地点の装置から集めたデータを、まとめて"}, {"t": 852.0166666666667, "x": "地球へ送る中継機で、アポロ十二号から十七号までの"}, {"t": 856.05, "x": "座標が、小数点以下五桁まで記録されています。"}, {"t": 859.45, "x": "一式の中身は、回ごとに少しずつ違います。"}, {"t": 862.8, "x": "アポロ十四号には、火薬を使って人工的に小さな揺れを"}, {"t": 866.9166666666666, "x": "起こし、地面の下の層を探る装置が加わりました。"}, {"t": 870.5833333333334, "x": "アポロ十七号には、月面の重力を測る装置と、"}, {"t": 874.3333333333334, "x": "飛んでくる微小な粒を数える装置が積まれています。"}, {"t": 877.8666666666667, "x": "同じ一式ではなく、前の回で分からなかったことを、"}, {"t": 881.4333333333333, "x": "次の回で測る形になっていました。"}, {"t": 884.0666666666667, "x": "電源は、原子力でした。"}, {"t": 886.2166666666667, "x": "プルトニウム二三八という物質が崩れるときに"}, {"t": 889.4833333333333, "x": "出る熱を、そのまま電気に変える装置です。"}, {"t": 892.45, "x": "燃料は酸化物の形で三・八キログラム。"}, {"t": 895.55, "x": "電気の出力は、およそ七十ワット台。"}, {"t": 898.5333333333333, "x": "熱としては千二百五十ワットぶんの熱が出ていました。"}, {"t": 902.4, "x": "十年たっても、電気の出力は"}, {"t": 904.7333333333333, "x": "最初の九割以上を保っていました。"}, {"t": 907.05, "x": "このアルセップは、設計上は、"}, {"t": 909.2666666666667, "x": "着陸から一年動けばよいとされていました。"}, {"t": 912.4166666666666, "x": "実際には、最長で八年動き続けました。"}, {"t": 915.7833333333333, "x": "止まったのは、壊れたからではありません。"}, {"t": 918.5, "x": "一九七七年九月三十日。"}, {"t": 921.4, "x": "地球側の管制が、指令を送って、"}, {"t": 924.2, "x": "五つの実験装置をすべて停止させました。"}, {"t": 927.3333333333334, "x": "理由として挙げられているのは、主に予算です。"}, {"t": 930.5666666666667, "x": "電源の出力が落ちてきて、送信機と"}, {"t": 933.2666666666667, "x": "観測機器を同時に動かせなくなっていたこと、"}, {"t": 935.9166666666666, "x": "そして、その管制室を別の作業に"}, {"t": 938.9166666666666, "x": "使う必要があったことも記録されています。"}, {"t": 941.3833333333333, "x": "つまり、月のほうはまだ喋っていられたのに、"}, {"t": 944.25, "x": "地球のほうが、聞くのをやめたということになります。"}, {"t": 947.8666666666667, "x": "話は、ここで終わりませんでした。"}, {"t": 950.4, "x": "アルセップが八年ぶんに集めたデータは、"}, {"t": 952.8, "x": "当時の磁気テープに記録されていました。"}, {"t": 955.4833333333333, "x": "ところが、アポロ計画が終わったあと、"}, {"t": 958.0666666666667, "x": "このテープの一部は、正式に保管されないまま、"}, {"t": 961.6166666666667, "x": "行方が分からなくなります。"}, {"t": 963.5833333333334, "x": "二十一世紀に入ってから、NASAは"}, {"t": 966.05, "x": "これを探し直す取り組みを始めました。"}, {"t": 968.5, "x": "散逸したテープを探し、読み出し、当時の"}, {"t": 971.95, "x": "記録形式を解読し、足りない補足情報を"}, {"t": 975.2, "x": "集め直して、いまのデータベースに入れる。"}, {"t": 977.9833333333333, "x": "月面の地震計が一九七〇年代に記録した揺れが、"}, {"t": 981.8666666666667, "x": "そうやって少しずつ復元されています。"}, {"t": 984.5166666666667, "x": "置いてきた機械はもう黙っていますが、"}, {"t": 986.6, "x": "その機械が喋っていた内容のほうは、いまも"}, {"t": 989.8833333333333, "x": "掘り返されている、ということになります。"}, {"t": 992.5333333333333, "x": "もう一つ、先に黙っていた装置があります。"}, {"t": 995.65, "x": "アポロ十一号が置いた地震計です。"}, {"t": 998.1166666666667, "x": "こちらはアルセップではなく、"}, {"t": 999.7, "x": "太陽電池で動く簡易版でした。"}, {"t": 1002.2, "x": "一九六九年八月三日、日が沈む五時間ほど"}, {"t": 1006.3333333333334, "x": "前に送信が止まり、次の月の昼に一度は目を"}, {"t": 1009.6833333333333, "x": "覚ましたものの、八月二十七日には、"}, {"t": 1012.5333333333333, "x": "地球からの指令をもう受け付けなくなりました。"}, {"t": 1015.5, "x": "動いていたのは、実質、月の一日ぶんでした。"}, {"t": 1019.3, "x": "同じ着陸地点に、一日しか働かなかった"}, {"t": 1022.55, "x": "機械と、五十年以上働き続けている板が、"}, {"t": 1025.9, "x": "五メートルほど離れて並んでいます。"}, {"t": 1028.3333333333333, "x": "目録には、機材の一覧に混じって、"}, {"t": 1031.0333333333333, "x": "明らかに性質の違う行が並んでいます。"}, {"t": 1034.1333333333334, "x": "アポロ十一号の項には、こうあります。"}, {"t": 1037.0666666666666, "x": "金のオリーブの枝。"}, {"t": 1038.3833333333334, "x": "アポロ一号の記章。"}, {"t": 1039.9, "x": "括弧書きで、亡くなった飛行士グリソム、"}, {"t": 1042.6333333333334, "x": "ホワイト、チャフィーを悼む、と添えられています。"}, {"t": 1046.4, "x": "この三人は、一九六七年に、"}, {"t": 1049.45, "x": "地上での試験中の火災で亡くなりました。"}, {"t": 1052.4, "x": "宇宙飛行士の記章が二つ。"}, {"t": 1054.3166666666666, "x": "こちらは、亡くなったガガーリンと"}, {"t": 1056.4666666666667, "x": "コマロフを悼む、とあります。"}, {"t": 1058.5666666666666, "x": "そして、月の記念の円盤。"}, {"t": 1060.8166666666666, "x": "この円盤は、五十セント硬貨ほどの"}, {"t": 1063.4833333333333, "x": "大きさの、シリコンの板です。"}, {"t": 1065.55, "x": "七十三か国の指導者から寄せられた親善の"}, {"t": 1068.4166666666667, "x": "メッセージと、アイゼンハワー、ケネディ、"}, {"t": 1071.25, "x": "ジョンソン、ニクソンという四人の"}, {"t": 1073.7166666666667, "x": "大統領の声明が、焼き付けられています。"}, {"t": 1076.6166666666666, "x": "焼き付けの方法は、こうです。"}, {"t": 1078.9166666666667, "x": "それぞれの文面を、二百分の一に縮めて写真に撮り、"}, {"t": 1082.8, "x": "その像を通して紫外線を当てて、感光した膜に写し取る。"}, {"t": 1087.2166666666667, "x": "半導体を作るのと同じやり方です。"}, {"t": 1089.7333333333333, "x": "板の上には、こう刻まれています。"}, {"t": 1092.3, "x": "アポロ十一号の飛行士が月へ運んだ、"}, {"t": 1094.9, "x": "世界じゅうからの親善のメッセージ。"}, {"t": 1097.4333333333334, "x": "縁にはこうあります。"}, {"t": 1098.8333333333333, "x": "地球という惑星より、一九六九年七月。"}, {"t": 1102.9, "x": "刻まれているのは、メッセージだけではありません。"}, {"t": 1106.05, "x": "当時の議会の指導部の名簿、NASAに"}, {"t": 1108.6333333333334, "x": "関わる法律を扱った上下両院の四つの"}, {"t": 1111.4, "x": "委員会の議員名、そしてNASAの歴代と"}, {"t": 1114.1333333333334, "x": "当時の幹部の名前も、同じ板に入っています。"}, {"t": 1117.3833333333334, "x": "関わった人間の名前を、"}, {"t": 1118.9833333333333, "x": "まとめて置いてきた、ということになります。"}, {"t": 1122.1333333333334, "x": "シリコンが選ばれたのは、月面の温度差に耐えるからです。"}, {"t": 1125.9666666666667, "x": "紙でも、布でも、樹脂でも、そこでは残りません。"}, {"t": 1130.0666666666666, "x": "この円盤は、アルミの容器に入って、"}, {"t": 1132.7833333333333, "x": "静かの海に置かれています。"}, {"t": 1134.8166666666666, "x": "アポロ十二号の項の、最後のほうに、"}, {"t": 1137.6333333333334, "x": "こういう行があります。"}, {"t": 1139.4, "x": "宇宙飛行士の記章。"}, {"t": 1140.8666666666666, "x": "括弧の中に、二つの名前があります。"}, {"t": 1143.6666666666667, "x": "C・C・ウィリアムズ、一つ。"}, {"t": 1146.85, "x": "アラン・ビーン、一つ。"}, {"t": 1148.5666666666666, "x": "クリフトン・ウィリアムズは、アポロ十二号で"}, {"t": 1151.2833333333333, "x": "月に降りるはずだった飛行士です。"}, {"t": 1153.2666666666667, "x": "訓練中の飛行機の事故で、着陸の二年前に亡くなりました。"}, {"t": 1157.6666666666667, "x": "代わりに降りたのがアラン・ビーンで、"}, {"t": 1159.4666666666667, "x": "ビーンは、自分の銀の記章と、ウィリアムズの"}, {"t": 1163.1, "x": "記章を、月面に置いてきました。"}, {"t": 1165.4166666666667, "x": "アポロ十四号の項には、二行だけ、"}, {"t": 1168.1833333333334, "x": "こういう記載があります。"}, {"t": 1169.9666666666667, "x": "ゴルフボール、二個。"}, {"t": 1171.7, "x": "やり、一本。"}, {"t": 1173.1, "x": "一九七一年二月六日、アラン・シェパードは、"}, {"t": 1176.8833333333334, "x": "月の岩を採るための道具の柄に、"}, {"t": 1179.2, "x": "六番アイアンのヘッドを取り付けました。"}, {"t": 1181.8166666666666, "x": "与圧された服は硬く、両手で普通に"}, {"t": 1184.6, "x": "振ることができなかったので、片手で打ちました。"}, {"t": 1187.5833333333333, "x": "二球です。"}, {"t": 1188.5, "x": "本人はそのとき、二球目は「何マイルも、"}, {"t": 1191.8833333333334, "x": "何マイルも飛んだ」と冗談を言っています。"}, {"t": 1195.0666666666666, "x": "その二球が、実際にどこまで飛んだのか。"}, {"t": 1198.0166666666667, "x": "二〇二一年に、画像の専門家が当時のフィルムを"}, {"t": 1201.6833333333334, "x": "高い解像度で取り直し、月を回っている探査機の"}, {"t": 1205.2, "x": "写真を縮尺の基準にして、落下点を割り出しました。"}, {"t": 1208.8833333333334, "x": "結果は、一球目がおよそ二十四ヤード、"}, {"t": 1211.7333333333333, "x": "二球目がおよそ四十ヤードとされています。"}, {"t": 1214.7, "x": "約二十二メートルと、約三十七メートルです。"}, {"t": 1218.2166666666667, "x": "やりのほうは、同じ船外活動で、"}, {"t": 1220.8833333333334, "x": "エドガー・ミッチェルが投げたものです。"}, {"t": 1223.1833333333334, "x": "アポロ十五号の項は、いちばん長くなります。"}, {"t": 1226.45, "x": "アメリカ海兵隊の旗。"}, {"t": 1228.1666666666667, "x": "ハンマーと、羽根。"}, {"t": 1229.7333333333333, "x": "鷹の羽根。"}, {"t": 1230.6333333333334, "x": "ジェームズ・アーウィンの肖像。"}, {"t": 1232.2833333333333, "x": "聖書。"}, {"t": 1233.4, "x": "括弧書きで、ジェームズ・アーウィンが"}, {"t": 1235.5666666666666, "x": "月面車のダッシュボードに置いた、とあります。"}, {"t": 1238.55, "x": "アポロ十一号の関係資料を収めたマイクロフィルム。"}, {"t": 1241.9166666666667, "x": "二ドル紙幣、百枚。"}, {"t": 1243.8166666666666, "x": "乗員それぞれの私物の袋。"}, {"t": 1245.7833333333333, "x": "そして、「ミシガン大学 月の同窓生」と記された文書。"}, {"t": 1250.75, "x": "ハンマーと羽根というのは、船長の"}, {"t": 1253.0833333333333, "x": "デイヴィッド・スコットが月面で行った実演です。"}, {"t": 1256.0166666666667, "x": "空気がなければ、重いものと軽いものは同じ速さで落ちる。"}, {"t": 1260.0, "x": "それを、実際に落として見せました。"}, {"t": 1262.6166666666666, "x": "羽根は、そのまま月面に残されています。"}, {"t": 1265.5666666666666, "x": "そして、同じアポロ十五号の項に、"}, {"t": 1268.35, "x": "こう書かれた行があります。"}, {"t": 1270.3166666666666, "x": "倒れた宇宙飛行士の像、および銘板。"}, {"t": 1273.2666666666667, "x": "手のひらに乗る大きさの、アルミニウムの人形です。"}, {"t": 1276.8166666666666, "x": "ベルギーの美術家が作りました。"}, {"t": 1278.8666666666666, "x": "作るときの条件は、月面の温度に耐えること、"}, {"t": 1282.1666666666667, "x": "軽くて丈夫なこと、そして、男とも女とも、"}, {"t": 1286.1333333333334, "x": "どの民族とも分からない姿にすること、でした。"}, {"t": 1289.75, "x": "像のそばに置かれた銘板には、名前が刻まれています。"}, {"t": 1293.5166666666667, "x": "アメリカの宇宙飛行士が八名、"}, {"t": 1295.5333333333333, "x": "ソビエト連邦の宇宙飛行士が六名。"}, {"t": 1298.3166666666666, "x": "合わせて十四名。"}, {"t": 1299.7, "x": "宇宙を目指す過程で亡くなった人たちです。"}, {"t": 1302.3166666666666, "x": "冷戦のさなかに、アメリカの乗員が、"}, {"t": 1304.95, "x": "ソビエト連邦の飛行士の名前を刻んだ板を、"}, {"t": 1308.1666666666667, "x": "月に置いていったことになります。"}, {"t": 1310.3666666666666, "x": "同じ考え方は、アポロ十一号の項にもありました。"}, {"t": 1314.2333333333333, "x": "ガガーリンとコマロフの記章です。"}, {"t": 1316.25, "x": "最初に月へ降りた回から、最後に月へ"}, {"t": 1319.1166666666666, "x": "降りた回にかけて、相手側の死者の名前が、"}, {"t": 1322.2333333333333, "x": "繰り返し持っていかれています。"}, {"t": 1324.3, "x": "アポロ十六号の項には、三行だけあります。"}, {"t": 1327.6666666666667, "x": "チャールズ・デュークの家族写真。"}, {"t": 1329.5, "x": "アメリカ空軍創設二十五周年の銀のメダル。"}, {"t": 1332.65, "x": "ネクタイピン。"}, {"t": 1333.55, "x": "家族写真というのは、透明な袋に"}, {"t": 1336.3, "x": "入れた一枚のスナップです。"}, {"t": 1337.9166666666667, "x": "裏には手書きで、自分と妻と二人の息子の"}, {"t": 1340.9833333333333, "x": "名前が書かれていたと伝えられています。"}, {"t": 1343.2666666666667, "x": "デュークはそれを月面の砂の"}, {"t": 1345.1333333333334, "x": "上に置いて、写真を撮りました。"}, {"t": 1347.4333333333334, "x": "その写真が、いまどうなっているのか。"}, {"t": 1350.0833333333333, "x": "誰も確かめていません。"}, {"t": 1351.6333333333334, "x": "月面には紫外線を遮るものがなく、温度差も"}, {"t": 1355.1333333333334, "x": "大きいため、印画紙がそのままの色で"}, {"t": 1357.6, "x": "残っているとは考えにくい、とは言えます。"}, {"t": 1360.4333333333334, "x": "ただし、それを確かめに行った探査も、"}, {"t": 1363.0666666666666, "x": "上から撮って見分けられた例も、ありません。"}, {"t": 1366.3166666666666, "x": "分からない、というのが、いまの答えです。"}, {"t": 1369.45, "x": "目録を読み進めていくと、同じ種類の行が、"}, {"t": 1372.9166666666667, "x": "六回ぶん繰り返し出てきます。"}, {"t": 1375.1333333333334, "x": "排泄物の収集装置。"}, {"t": 1377.0333333333333, "x": "尿の収集装置。"}, {"t": 1378.5166666666667, "x": "嘔吐用の袋。"}, {"t": 1379.6833333333334, "x": "投棄用の袋。"}, {"t": 1380.9166666666667, "x": "アポロ十一号に四つ、十二号に四つ、"}, {"t": 1384.05, "x": "十四号に四つ、十六号に一つ、十七号に十二。"}, {"t": 1388.9666666666667, "x": "数の単位は、装置や袋の個数です。"}, {"t": 1391.95, "x": "十七号だけ数が多いのは、滞在が長かったからです。"}, {"t": 1395.8833333333334, "x": "アポロ十一号が月面にいた時間は"}, {"t": 1398.2833333333333, "x": "一日足らず、アポロ十七号は三日ほど。"}, {"t": 1401.4, "x": "人が長くいれば、そのぶん出るものも増えます。"}, {"t": 1404.5166666666667, "x": "目録の数字は、そのまま滞在の長さを写しています。"}, {"t": 1408.4666666666667, "x": "先ほど述べたとおり、上昇段は一グラムでも"}, {"t": 1411.6666666666667, "x": "軽くして飛び立つ必要がありました。"}, {"t": 1413.8166666666666, "x": "とくにアポロ十五号以降は、月を離れる前に、"}, {"t": 1417.2333333333333, "x": "不要な質量をすべて投棄する手順が採られています。"}, {"t": 1420.7666666666667, "x": "食べたあとの包み、医療品、使い終わった衣類、"}, {"t": 1424.4666666666667, "x": "そして人間が出したものも、その対象でした。"}, {"t": 1427.9, "x": "これらの袋について、よく引かれる数字があります。"}, {"t": 1431.35, "x": "六回の着陸を通じて、九十六個の袋と"}, {"t": 1434.7166666666667, "x": "容器が月面に残された、というものです。"}, {"t": 1437.7, "x": "ただ、この九十六という数字は、NASAの"}, {"t": 1440.9, "x": "目録から数え上げたものではありません。"}, {"t": 1443.3166666666666, "x": "長く繰り返されてきた通説の数字です。"}, {"t": 1446.0, "x": "目録に書かれているのは、各回に"}, {"t": 1448.4666666666667, "x": "こうした装置と袋が積まれていて、そして"}, {"t": 1451.2, "x": "持ち帰られなかった、というところまでです。"}, {"t": 1454.0166666666667, "x": "それでも、この袋が、ある一点で"}, {"t": 1456.85, "x": "科学の対象になっています。"}, {"t": 1458.6333333333334, "x": "袋の中には、人間の体から出たものが入っています。"}, {"t": 1462.4833333333333, "x": "つまり、地球の微生物が入っています。"}, {"t": 1465.4166666666667, "x": "いちばん古いものは、一九六九年の"}, {"t": 1468.6166666666666, "x": "七月から、静かの海に置かれたままです。"}, {"t": 1471.5333333333333, "x": "真空で、宇宙線が当たり、昼と夜で二百度以上、"}, {"t": 1475.5666666666666, "x": "温度が上下する場所に、半世紀以上。"}, {"t": 1478.8, "x": "もし、そのうちの一つを回収して調べたら、"}, {"t": 1481.9166666666667, "x": "地球の生命が、他の天体でどれだけ"}, {"t": 1484.9333333333334, "x": "持ちこたえられるのかが分かるのではないか。"}, {"t": 1487.3333333333333, "x": "そう考えて、回収を提案している研究者がいます。"}, {"t": 1491.2, "x": "掃除のためではなく、実験のためです。"}, {"t": 1494.1166666666666, "x": "意図して始めた実験ではありません。"}, {"t": 1496.35, "x": "荷物を軽くするためにやったことが、"}, {"t": 1498.45, "x": "結果として、五十年以上続く生物の"}, {"t": 1501.7333333333333, "x": "試験になってしまった、ということになります。"}, {"t": 1504.5833333333333, "x": "条件としては、地球のどんな実験室でも作れないものです。"}, {"t": 1508.6833333333334, "x": "真空。"}, {"t": 1509.7666666666667, "x": "遮るもののない宇宙線。"}, {"t": 1511.5666666666666, "x": "二百度を超える温度差。"}, {"t": 1513.2333333333333, "x": "そして、五十年以上という時間。"}, {"t": 1515.85, "x": "同じ条件を人工的に用意しようとすれば、装置を"}, {"t": 1519.5833333333333, "x": "作るところから始めて、結果が出るのは五十年後です。"}, {"t": 1523.3333333333333, "x": "その試料が、すでに置いてあるわけです。"}, {"t": 1526.1, "x": "これに関係して、よく語られる出来事が一つあります。"}, {"t": 1529.9166666666667, "x": "一九六七年に月へ降りたサーベイヤー三号という"}, {"t": 1533.6833333333334, "x": "無人の探査機がありました。"}, {"t": 1535.3, "x": "その二年半後、すぐ近くに着陸したアポロ十二号の"}, {"t": 1539.0833333333333, "x": "乗員が、この探査機のテレビカメラを"}, {"t": 1541.6333333333334, "x": "取り外して、地球に持ち帰りました。"}, {"t": 1544.3, "x": "サーベイヤーは打ち上げ前に"}, {"t": 1545.8833333333334, "x": "滅菌されていなかったので、地球の菌が月で"}, {"t": 1548.9666666666667, "x": "生き延びたかどうかを調べることができたのです。"}, {"t": 1551.6333333333334, "x": "調べた結果、カメラの内部の発泡材から、"}, {"t": 1554.7666666666667, "x": "ストレプトコッカス・ミティスという、人の"}, {"t": 1557.4666666666667, "x": "口の中にいる菌が、ごく少量検出されました。"}, {"t": 1560.9, "x": "これはしばしば、月で菌が生き延びていた、という"}, {"t": 1564.3833333333334, "x": "話として紹介されます。"}, {"t": 1566.0333333333333, "x": "ただ、その後の検証で、この検出は、地球に戻したあとの"}, {"t": 1570.65, "x": "取り扱いで混入した可能性が高い、とされています。"}, {"t": 1574.3166666666666, "x": "無菌の手順が守られていなかった疑いが"}, {"t": 1576.7333333333333, "x": "指摘され、二〇〇七年には、当時の作業を撮った"}, {"t": 1580.35, "x": "記録映像を探し直す調査まで行われました。"}, {"t": 1583.4, "x": "いま言えるのは、確かめられなかった、ということです。"}, {"t": 1587.1833333333334, "x": "月で菌が生きていたという結論にも、"}, {"t": 1589.45, "x": "生きていなかったという結論にも、届いていません。"}, {"t": 1593.0333333333333, "x": "袋のほうは、まだ誰も開けていません。"}, {"t": 1595.7666666666667, "x": "月に残っているものの中には、置いてきたのではなく、"}, {"t": 1599.2666666666667, "x": "狙って落としたものがあります。"}, {"t": 1601.3833333333334, "x": "アポロ十二号の上昇段は、乗員が"}, {"t": 1604.15, "x": "司令船に移ったあと、切り離されました。"}, {"t": 1607.05, "x": "そして、そのまま月面へ落とされました。"}, {"t": 1610.0166666666667, "x": "落とす先は、その少し前に自分たちが"}, {"t": 1612.8, "x": "設置した地震計の近くです。"}, {"t": 1614.7166666666667, "x": "人工的に、大きさの分かっている衝撃を"}, {"t": 1617.75, "x": "与えて、月の中がどうなっているかを調べる。"}, {"t": 1620.8, "x": "そういう実験でした。"}, {"t": 1622.2333333333333, "x": "記録された揺れは、予想と違いました。"}, {"t": 1625.0, "x": "強い信号が三十分以上続き、"}, {"t": 1627.3833333333334, "x": "弱い信号は、さらに一時間近く続きました。"}, {"t": 1631.1, "x": "地震計のデータを解析した地震学者は、"}, {"t": 1633.7666666666667, "x": "後年こう振り返っています。"}, {"t": 1635.85, "x": "非常に奇妙で、地球で起きるどの信号とも違っていた。"}, {"t": 1639.8166666666666, "x": "月にはほとんど水がなく、乾いているので、"}, {"t": 1642.9, "x": "地震波が減衰しない。"}, {"t": 1644.7166666666667, "x": "この観測から、月は鐘のように"}, {"t": 1647.0666666666666, "x": "鳴った、という言い回しが広まりました。"}, {"t": 1649.7833333333333, "x": "これはあくまで、揺れが長く続いたことを表す"}, {"t": 1652.9, "x": "比喩として使われるようになった表現です。"}, {"t": 1655.3666666666666, "x": "第一章で触れた、サターン五型ロケットの"}, {"t": 1658.2166666666667, "x": "第三段も、同じ目的で落とされています。"}, {"t": 1661.3333333333333, "x": "アポロ十三号、十四号、十五号、十六号、十七号の、五つ。"}, {"t": 1667.9166666666667, "x": "月に降りられなかったアポロ十三号が、それでも"}, {"t": 1671.1666666666667, "x": "月面に一つ残しているのは、このためです。"}, {"t": 1674.1833333333334, "x": "目録は、アメリカ以外の機体も並べています。"}, {"t": 1677.4666666666667, "x": "ソビエト連邦の欄には、ルナ二号から"}, {"t": 1680.1833333333334, "x": "二十四号までが並びます。"}, {"t": 1681.9833333333333, "x": "着陸に成功したもの、墜落したもの、"}, {"t": 1684.8666666666666, "x": "試料を採って帰ったあとの降下段。"}, {"t": 1687.2666666666667, "x": "この欄のいちばん上にあるルナ二号は、人間が"}, {"t": 1690.3833333333334, "x": "作ったもので、最初に月に届いたものです。"}, {"t": 1693.3833333333334, "x": "一九五九年のことで、アポロ十一号より"}, {"t": 1697.0833333333333, "x": "十年ちかく前になります。"}, {"t": 1698.7333333333333, "x": "月面に人工物が置かれた歴史は、そこから始まっています。"}, {"t": 1702.85, "x": "そして、ルノホート一号と二号。"}, {"t": 1705.4666666666667, "x": "これは、月面を走った無人の探査車です。"}, {"t": 1708.6, "x": "ルノホート一号は北緯三八・"}, {"t": 1710.6833333333334, "x": "三一六度、西経三五・〇〇四度。"}, {"t": 1714.3333333333333, "x": "ルノホート二号は北緯二五・"}, {"t": 1716.1833333333334, "x": "八二七度、東経三〇・九一九度。"}, {"t": 1719.6833333333334, "x": "どちらも、走るのをやめた場所に、そのまま立っています。"}, {"t": 1723.6166666666666, "x": "中国の欄には、嫦娥一号の周回機。"}, {"t": 1726.7833333333333, "x": "インドの欄には、チャンドラヤーン一号の"}, {"t": 1729.3833333333334, "x": "周回機と、月面衝突機。"}, {"t": 1731.8, "x": "どちらも南極。"}, {"t": 1732.9833333333333, "x": "日本の欄には、飛天、羽衣、かぐや、そして、"}, {"t": 1737.3833333333334, "x": "おうな、おきな、という二機の子衛星。"}, {"t": 1740.6833333333334, "x": "羽衣については、衝突が確認できていない、と"}, {"t": 1744.4666666666667, "x": "記載されています。"}, {"t": 1745.5833333333333, "x": "ヨーロッパ宇宙機関の欄には、スマート・ワン。"}, {"t": 1748.5666666666666, "x": "制御された衝突、とあります。"}, {"t": 1751.1, "x": "ここで注意が必要です。"}, {"t": 1752.8333333333333, "x": "この目録の日付は、二〇一二年七月五日です。"}, {"t": 1756.6166666666666, "x": "それ以降に月へ到達したものは、"}, {"t": 1758.7833333333333, "x": "この一覧には載っていません。"}, {"t": 1760.85, "x": "そして、二〇一二年以降のほうが、"}, {"t": 1763.5, "x": "月に着いたものの種類は増えています。"}, {"t": 1766.1, "x": "二〇一九年四月、イスラエルの民間団体が送った"}, {"t": 1770.0, "x": "ベレシートという探査機が、着陸を試みて墜落しました。"}, {"t": 1774.0333333333333, "x": "降下の途中で姿勢を測る装置が止まり、"}, {"t": 1776.6333333333334, "x": "主エンジンが動かなくなったためとされています。"}, {"t": 1779.5833333333333, "x": "この機体には、人類の記録を薄いニッケルの板に"}, {"t": 1782.9666666666667, "x": "刻んだ書庫と、乾燥させたクマムシが積まれていました。"}, {"t": 1786.5666666666666, "x": "クマムシが月面でどうなっているのかは、"}, {"t": 1788.9, "x": "確かめられていません。"}, {"t": 1790.55, "x": "二〇二三年四月には、日本の民間企業が"}, {"t": 1794.1166666666666, "x": "送った着陸機が、着陸に失敗しています。"}, {"t": 1797.3333333333333, "x": "高度を測る装置が、クレーターの"}, {"t": 1799.6333333333334, "x": "縁を地表と取り違えたためとされています。"}, {"t": 1802.2, "x": "同じ二〇二三年、インドのチャンドラヤーン三号は、"}, {"t": 1805.9333333333334, "x": "月の南極付近への着陸に成功しました。"}, {"t": 1809.1833333333334, "x": "その四年前に送られたチャンドラヤーン二号の"}, {"t": 1811.7833333333333, "x": "着陸機は、予定の経路を外れて墜落しています。"}, {"t": 1815.3666666666666, "x": "成功したものも、失敗したものも、月面に残ります。"}, {"t": 1819.5166666666667, "x": "回収する手段がないという点では、同じです。"}, {"t": 1822.8166666666666, "x": "そして、二〇一二年で止まっている"}, {"t": 1825.3, "x": "目録は、まだ更新されていません。"}, { const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
