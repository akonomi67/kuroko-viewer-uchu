<script>
const D={"name": "ep036", "file": "ep036", "dur": 1839.25, "segs": [], "subs": [{"t": 0.0, "x": "金星を回りながら雲を見続けた、日本の探査機があります。"}, {"t": 4.266666666666667, "x": "見続けた年月は、8年あまりです。"}, {"t": 7.15, "x": "名前はあかつきです。"}, {"t": 8.533333333333333, "x": "けれど最初から回れたわけではありません。"}, {"t": 11.016666666666667, "x": "2010年の12月、あかつきは金星に着きました。"}, {"t": 14.883333333333333, "x": "大きなエンジンを噴いて、ブレーキをかけるはずでした。"}, {"t": 18.25, "x": "予定ではおよそ12分の噴射です。"}, {"t": 20.6, "x": "ところがエンジンは2分半ほどで止まりました。"}, {"t": 23.333333333333332, "x": "速さは落としきれませんでした。"}, {"t": 25.266666666666666, "x": "あかつきは金星の横を通り過ぎます。"}, {"t": 27.766666666666666, "x": "そして太陽のまわりを回る道に入りました。"}, {"t": 30.65, "x": "金星はすぐ先にあるのに届きません。"}, {"t": 33.15, "x": "チームはもう一度金星に近づける日を探しました。"}, {"t": 36.36666666666667, "x": "答えは5年後でした。"}, {"t": 37.9, "x": "その5年のあいだに壊れたエンジンをあきらめました。"}, {"t": 40.96666666666667, "x": "要らなくなった燃料を燃やすための薬を宇宙に捨てました。"}, {"t": 44.483333333333334, "x": "向きを変えるための小さな噴射口で、道を作り直しました。"}, {"t": 48.766666666666666, "x": "設計で考えていたより、ずっと太陽に近い所も通りました。"}, {"t": 53.233333333333334, "x": "その数は9回です。"}, {"t": 54.78333333333333, "x": "2015年の12月7日、あかつきは金星の"}, {"t": 58.36666666666667, "x": "後ろ側を通りながら20分の噴射をします。"}, {"t": 61.2, "x": "そして金星を回り始めました。"}, {"t": 63.38333333333333, "x": "同じロケットには相乗りの小さな衛星が"}, {"t": 65.96666666666667, "x": "いくつも乗っていました。"}, {"t": 67.21666666666667, "x": "その一つが太陽の光で進む大きな帆です。"}, {"t": 70.25, "x": "この回は、金星を通り過ぎた探査機の記録です。"}, {"t": 73.88333333333334, "x": "遅れて着くまでの5年と、そのあとの8年です。"}, {"t": 77.3, "x": "金星は地球のすぐ内側を回る惑星です。"}, {"t": 80.35, "x": "地球とほぼ同じ大きさで、双子の星とも呼ばれます。"}, {"t": 84.06666666666666, "x": "地球とよく並べて比べられる星です。"}, {"t": 86.53333333333333, "x": "それなのに天気はまるで違います。"}, {"t": 88.75, "x": "金星の空気は地球の100倍近くあります。"}, {"t": 91.68333333333334, "x": "空全体を硫酸の雲がすき間なく覆っています。"}, {"t": 94.86666666666666, "x": "そして雲の上では強い風が吹いています。"}, {"t": 97.56666666666666, "x": "速さは1秒に100メートルほどです。"}, {"t": 99.96666666666667, "x": "時速にすると360キロです。"}, {"t": 102.4, "x": "この風は星全体をぐるりと回っています。"}, {"t": 105.18333333333334, "x": "金星そのものはとてもゆっくり回ります。"}, {"t": 107.75, "x": "1回まわるのに地球の日数で243日かかります。"}, {"t": 111.65, "x": "しかも回る向きは地球とは逆です。"}, {"t": 114.05, "x": "金星が太陽を1周するのは、225日です。"}, {"t": 117.91666666666667, "x": "1回まわる時間のほうが、1年より長いのです。"}, {"t": 121.41666666666667, "x": "太陽が昇ってから次に昇るまでは117日です。"}, {"t": 125.0, "x": "ところが、雲の上の空気は、およそ4日で星を1周します。"}, {"t": 129.6, "x": "地面が回る速さの、60倍ほどです。"}, {"t": 132.65, "x": "この風は「スーパーローテーション」と呼ばれています。"}, {"t": 136.33333333333334, "x": "なぜこんな風が吹き続けるのか。"}, {"t": 138.48333333333332, "x": "それは長いあいだ分からないままでした。"}, {"t": 140.85, "x": "地球の空気と金星の空気。"}, {"t": 142.93333333333334, "x": "同じような大きさの星でなぜここまで違うのか。"}, {"t": 146.0, "x": "あかつきの仕事はそれを調べることでした。"}, {"t": 148.63333333333333, "x": "雲の動きを、金星を回りながら、何日も続けて撮る。"}, {"t": 152.9, "x": "地球で雲の流れを追うのと同じ考え方です。"}, {"t": 156.03333333333333, "x": "金星の天気のしくみを外から調べるための探査機でした。"}, {"t": 159.61666666666667, "x": "チームが挙げた問いは、ほかにもありました。"}, {"t": 162.43333333333334, "x": "全体を覆う雲のでき方。"}, {"t": 164.28333333333333, "x": "空気が上下や南北にどう回っているか。"}, {"t": 166.9, "x": "氷の粒ができない空で、雷は起きるかどうか。"}, {"t": 170.53333333333333, "x": "活きている火山はあるのか。"}, {"t": 172.21666666666667, "x": "どれも、雲の外から見続けなければ答えの出ない問いです。"}, {"t": 176.11666666666667, "x": "打ち上げたときのあかつきは、500キロあまりの機体です。"}, {"t": 179.83333333333334, "x": "そのうち、観測の道具は合わせて37キロほどです。"}, {"t": 183.75, "x": "積んだ道具は6つありました。"}, {"t": 185.65, "x": "そのうち5つがカメラです。"}, {"t": 187.41666666666666, "x": "1つ目は1マイクロメートルの光で見るカメラです。"}, {"t": 190.6, "x": "目に見えない、赤に近い光です。"}, {"t": 193.23333333333332, "x": "雲の下の様子や、地面から出る熱を探します。"}, {"t": 196.71666666666667, "x": "活きている火山があるかどうかも、"}, {"t": 198.51666666666668, "x": "手がかりを探す役でした。"}, {"t": 200.51666666666668, "x": "2つ目のカメラは波長が2マイクロメートルの光を使います。"}, {"t": 204.28333333333333, "x": "厚い雲の下の方にある雲を透かして見ます。"}, {"t": 207.11666666666667, "x": "3つ目はもっと長い波の赤外線で見るカメラです。"}, {"t": 210.4, "x": "雲のてっぺんの温度を昼も夜も測ります。"}, {"t": 213.05, "x": "4つ目は紫外線で見るカメラです。"}, {"t": 215.35, "x": "雲の上の方の模様を写します。"}, {"t": 217.48333333333332, "x": "模様が見えるのは、雲の中に"}, {"t": 219.7, "x": "紫外線を吸う物があるからです。"}, {"t": 221.7, "x": "その一つは、まだ正体が分かっていません。"}, {"t": 224.68333333333334, "x": "5つ目は、雷と、夜の空のかすかな光を探すカメラです。"}, {"t": 229.41666666666666, "x": "金星で雷が光るのか。"}, {"t": 231.35, "x": "それを確かめるためのカメラでした。"}, {"t": 233.51666666666668, "x": "光を測る速さは、1秒に3万回です。"}, {"t": 236.86666666666667, "x": "一瞬の稲光を、逃さないためです。"}, {"t": 239.76666666666668, "x": "高さ100キロあたりの空がかすかに"}, {"t": 241.83333333333334, "x": "光る様子も、このカメラで写します。"}, {"t": 244.43333333333334, "x": "そして6つ目はカメラではありません。"}, {"t": 246.63333333333333, "x": "とても正確に同じ電波を出し続ける装置です。"}, {"t": 249.76666666666668, "x": "あかつきが金星の向こう側へ隠れるときです。"}, {"t": 252.66666666666666, "x": "電波は金星の空気を通って地球に届きます。"}, {"t": 255.76666666666668, "x": "その電波の曲がり方から、高さごとの温度が分かります。"}, {"t": 259.51666666666665, "x": "カメラとは違う、電波で空気を測る道具です。"}, {"t": 262.9166666666667, "x": "5台のカメラで、雲の下から上までを、高さを変えて見る。"}, {"t": 267.18333333333334, "x": "それがあかつきの組み立てでした。"}, {"t": 269.1166666666667, "x": "雲を見る高さの違うカメラを並べた、空の観測所です。"}, {"t": 273.1333333333333, "x": "3台のカメラは、縦と横に1024ずつの点で金星を写します。"}, {"t": 277.9166666666667, "x": "写る範囲も、この3台でそろえてありました。"}, {"t": 281.1, "x": "2010年の5月21日、朝6時58分。"}, {"t": 285.2, "x": "種子島から、H2Aロケット17号機が打ち上がりました。"}, {"t": 289.5833333333333, "x": "一番の乗客はあかつきです。"}, {"t": 291.5833333333333, "x": "同じ打ち上げには、相乗りの機体がありました。"}, {"t": 294.8333333333333, "x": "名前はイカロスです。"}, {"t": 296.23333333333335, "x": "重さは310キロ。"}, {"t": 297.8666666666667, "x": "あかつきより、ずっと小さな機体です。"}, {"t": 300.5833333333333, "x": "あかつきと同じく、金星の方へ"}, {"t": 303.01666666666665, "x": "向かう道に送り出されました。"}, {"t": 304.8333333333333, "x": "ただイカロスの仕事は、金星を調べることではありません。"}, {"t": 308.6666666666667, "x": "試したのは新しい進み方です。"}, {"t": 310.9, "x": "太陽の光には当たったものを押す力があります。"}, {"t": 313.8833333333333, "x": "とても弱い力です。"}, {"t": 315.4, "x": "それでも宇宙には空気の抵抗がありません。"}, {"t": 318.1666666666667, "x": "弱い力でも長く押し続ければ、"}, {"t": 320.3333333333333, "x": "速さは少しずつ増えていきます。"}, {"t": 322.68333333333334, "x": "その力を大きな帆で受けて、進む。"}, {"t": 325.43333333333334, "x": "「ソーラーセイル」と呼ばれる方法です。"}, {"t": 328.15, "x": "考え方はずっと前からありました。"}, {"t": 330.4166666666667, "x": "けれど帆で光を受けて、本当に"}, {"t": 332.8, "x": "宇宙を進んだ機体はありませんでした。"}, {"t": 335.05, "x": "帆に貼った太陽電池で電気を作った機体もありません。"}, {"t": 338.4166666666667, "x": "イカロスの帆は一辺がおよそ14メートルの四角です。"}, {"t": 341.78333333333336, "x": "かどからかどまでは20メートルあります。"}, {"t": 344.21666666666664, "x": "厚さは1ミリの100分の1もありません。"}, {"t": 346.8833333333333, "x": "帆の重さは16キロでした。"}, {"t": 348.8, "x": "この薄い膜を宇宙で広げなければなりません。"}, {"t": 351.73333333333335, "x": "イカロスは、こまのように回ります。"}, {"t": 354.25, "x": "その回る勢いで、帆を外へ広げる設計でした。"}, {"t": 357.81666666666666, "x": "回る勢いで広げて、回る勢いで張っておく帆です。"}, {"t": 361.68333333333334, "x": "打ち上げから5日後のことです。"}, {"t": 363.65, "x": "イカロスは帆の先につけたおもりを切り離しました。"}, {"t": 366.75, "x": "6月2日から8日にかけて、帆を少しずつ外へ送り出します。"}, {"t": 371.1666666666667, "x": "そして6月9日、帆は大きく開きました。"}, {"t": 374.51666666666665, "x": "翌日、6月10日。"}, {"t": 376.6333333333333, "x": "ここで、もう一つの試しが始まります。"}, {"t": 379.5, "x": "帆に貼ってあった薄い太陽電池が、電気を作り始めました。"}, {"t": 383.6333333333333, "x": "6月14日と19日には、小さなカメラを切り離しました。"}, {"t": 388.01666666666665, "x": "そのカメラで、外から帆を撮ったのです。"}, {"t": 390.71666666666664, "x": "自分の姿を、自分から離れた"}, {"t": 393.1166666666667, "x": "カメラで写したことになります。"}, {"t": 394.9166666666667, "x": "広がった四角い帆に破れなどは見つかりませんでした。"}, {"t": 398.1166666666667, "x": "撮ったとき、イカロスは地球から"}, {"t": 400.3666666666667, "x": "およそ786万キロの所にいました。"}, {"t": 403.35, "x": "帆は、1分間に2回半の速さで回っていました。"}, {"t": 406.85, "x": "あとは本当に光で進むかどうかです。"}, {"t": 409.4, "x": "チームは地上に届く電波の、"}, {"t": 411.25, "x": "わずかな高さの変化を測りました。"}, {"t": 413.8666666666667, "x": "機体の速さが変われば、電波の高さも少しずれます。"}, {"t": 417.56666666666666, "x": "その結果光に押される力が確かめられました。"}, {"t": 420.6333333333333, "x": "力の大きさは、1ミリニュートンを少し超えるくらいです。"}, {"t": 424.45, "x": "1円玉の重さの、およそ9分の1の力です。"}, {"t": 428.1666666666667, "x": "それでもこの力はずっと効き続けます。"}, {"t": 430.7, "x": "11月までに光で増えた速さは、"}, {"t": 433.0833333333333, "x": "合わせて秒速100メートルになりました。"}, {"t": 435.8333333333333, "x": "設計で考えていた力とほとんど同じでした。"}, {"t": 438.8333333333333, "x": "イカロスはもう一つのことも試しました。"}, {"t": 441.3, "x": "帆には、特別な部品も貼ってありました。"}, {"t": 444.1666666666667, "x": "電気で、光のはね返り方を変える部品です。"}, {"t": 447.48333333333335, "x": "片側だけ光をよくはね返すようにすると、"}, {"t": 450.26666666666665, "x": "押される力に差が出ます。"}, {"t": 452.23333333333335, "x": "その差で帆の向きを少しずつ変えられます。"}, {"t": 454.81666666666666, "x": "燃料を使わずに光だけで向きを変える方法です。"}, {"t": 458.1166666666667, "x": "光で電気を作る。"}, {"t": 459.5833333333333, "x": "光で進む。"}, {"t": 460.68333333333334, "x": "光で向きを変える。"}, {"t": 462.0833333333333, "x": "この3つは、どれも初めて宇宙で確かめられたことでした。"}, {"t": 466.0, "x": "打ち上げから半年あまり。"}, {"t": 467.7, "x": "2010年の12月7日、その日がやってきました。"}, {"t": 471.43333333333334, "x": "ここで大きなエンジンを噴きます。"}, {"t": 473.46666666666664, "x": "進む向きとは逆に噴いて、速さを落とすのです。"}, {"t": 476.9166666666667, "x": "速さが落ちれば、金星の重力につかまります。"}, {"t": 480.3333333333333, "x": "そして、まわりを回り始めます。"}, {"t": 482.8666666666667, "x": "噴射の予定はおよそ720秒。"}, {"t": 485.43333333333334, "x": "12分です。"}, {"t": 486.48333333333335, "x": "噴射が始まりました。"}, {"t": 488.01666666666665, "x": "やがて届いた記録から、思わぬ様子が分かってきました。"}, {"t": 491.8, "x": "噴射を始めて、およそ152秒。"}, {"t": 494.8333333333333, "x": "機体の姿勢が大きく乱れていました。"}, {"t": 497.25, "x": "あかつきは自分でエンジンを止めました。"}, {"t": 499.6, "x": "止まったのはおよそ158秒のところです。"}, {"t": 502.55, "x": "予定の、4分の1にも届いていません。"}, {"t": 505.55, "x": "速さを落としきれず、金星にはつかまりませんでした。"}, {"t": 509.23333333333335, "x": "金星の横を通り過ぎて、太陽のまわりを回る道に出ました。"}, {"t": 513.6, "x": "あかつきの機体はそのあとも観測を続けられる状態でした。"}, {"t": 517.2666666666667, "x": "電波も届いていました。"}, {"t": 518.8166666666667, "x": "ただ金星を回るという、一番の"}, {"t": 521.2833333333333, "x": "目的だけが果たせませんでした。"}, {"t": 523.2166666666667, "x": "長い準備の末の計画が、2分半で行き先を失ったのです。"}, {"t": 527.7, "x": "その翌日のことです。"}, {"t": 529.25, "x": "国の宇宙開発の委員会は、原因を調べることを決めました。"}, {"t": 533.6166666666667, "x": "あかつきが金星を通り過ぎた次の日です。"}, {"t": 536.3833333333333, "x": "2010年の12月8日、イカロスも金星のそばを通りました。"}, {"t": 540.9833333333333, "x": "金星からの距離はおよそ8万キロでした。"}, {"t": 543.6666666666666, "x": "イカロスはもともと金星を回る機体ではありません。"}, {"t": 546.8166666666667, "x": "金星のそばを通り過ぎるのは予定どおりです。"}, {"t": 549.6833333333333, "x": "ただ一つ面白いことがありました。"}, {"t": 551.9, "x": "同じロケットで同じ道に送り出された2機です。"}, {"t": 554.9166666666666, "x": "それなのに、金星に一番近づいた日が違いました。"}, {"t": 558.5833333333334, "x": "イカロスは、あかつきより1日おそかったのです。"}, {"t": 561.9333333333333, "x": "半年のあいだ、イカロスは光に押され続けました。"}, {"t": 565.5, "x": "そのぶん道すじが少しずつずれていました。"}, {"t": 568.1333333333333, "x": "この1日のおくれは、もう一つの印でした。"}, {"t": 571.3833333333333, "x": "光が本当に帆を押していた、という印です。"}, {"t": 574.6333333333333, "x": "チームは、金星に合わせてイカロスの"}, {"t": 577.1166666666667, "x": "道を整える操作も試しました。"}, {"t": 579.3, "x": "光の帆で、行き先に向かう練習です。"}, {"t": 582.25, "x": "一方のあかつきもカメラは生きていました。"}, {"t": 584.7666666666667, "x": "12月9日、長い波の赤外線で見る"}, {"t": 588.0166666666667, "x": "カメラが金星を撮りました。"}, {"t": 589.7166666666667, "x": "この種類の光で、探査機が金星を撮ったのは初めてでした。"}, {"t": 593.8833333333333, "x": "硫酸の雲の、温度のむらが写っていました。"}, {"t": 597.0666666666667, "x": "金星の夜の側の、雲の温度です。"}, {"t": 599.9, "x": "けれどあかつきはもう、金星から離れていく途中でした。"}, {"t": 603.5666666666667, "x": "通り過ぎながら、振り返って撮ったような1枚でした。"}, {"t": 607.0166666666667, "x": "なぜ、エンジンは止まったのか。"}, {"t": 609.3166666666667, "x": "調べる手がかりは、送られてきた"}, {"t": 611.6166666666667, "x": "記録と、地上での試験です。"}, {"t": 613.8166666666667, "x": "あかつきの大きなエンジンは、"}, {"t": 615.4666666666667, "x": "2つの液体を混ぜて燃やします。"}, {"t": 617.8833333333333, "x": "燃料と燃料を燃やすための薬です。"}, {"t": 620.4166666666666, "x": "この薬は酸化剤と呼ばれます。"}, {"t": 622.6, "x": "2つの液体は、それぞれのタンクに入っています。"}, {"t": 625.9666666666667, "x": "それをガスの圧力で押し出します。"}, {"t": 628.2, "x": "押し出すガスの管には逆流を防ぐ弁がついていました。"}, {"t": 631.6666666666666, "x": "調査の結論はこの弁にありました。"}, {"t": 634.0, "x": "燃料の側の弁が、うまく働かなかったと判断されたのです。"}, {"t": 638.25, "x": "その先は推定です。"}, {"t": 639.8, "x": "弁の封をする部分を通りぬけて、酸化剤の"}, {"t": 642.95, "x": "蒸気が少しずつしみ出していました。"}, {"t": 645.05, "x": "その蒸気が、燃料の蒸気とふれて、"}, {"t": 647.7166666666667, "x": "塩のような固まりができた。"}, {"t": 649.8, "x": "固まりが弁をふさいだ、と考えられました。"}, {"t": 652.85, "x": "燃料を押すガスが届かなくなると、"}, {"t": 655.0166666666667, "x": "燃料の流れが弱くなります。"}, {"t": 657.3666666666667, "x": "燃料と酸化剤の混ざり方が設計の範囲から外れます。"}, {"t": 661.05, "x": "その燃え方が、エンジンに無理をかけます。"}, {"t": 663.9166666666666, "x": "設計では考えていない燃え方が続いたのです。"}, {"t": 666.9833333333333, "x": "そしてエンジンの首のあたりが壊れた。"}, {"t": 669.3333333333334, "x": "首とは、ガスがしぼられて噴き出す細い所です。"}, {"t": 672.75, "x": "これも推定です。"}, {"t": 674.0, "x": "その影響は、機体の向きにも出ました。"}, {"t": 676.85, "x": "機体の姿勢が乱れ、エンジンは自動で止まったのです。"}, {"t": 680.5166666666667, "x": "地上の試験では、この流れで"}, {"t": 682.7, "x": "起きたことが説明できるとされました。"}, {"t": 684.9166666666666, "x": "調べる会合は、2010年の12月に2回、"}, {"t": 688.4166666666666, "x": "翌年の6月に1回開かれました。"}, {"t": 691.1666666666666, "x": "2011年の9月の終わりには、"}, {"t": 693.3666666666667, "x": "4回目の報告がまとめられています。"}, {"t": 696.0833333333334, "x": "ただ壊れたエンジンを、宇宙で直接見ることはできません。"}, {"t": 700.0166666666667, "x": "首がどこまで壊れているのか。"}, {"t": 702.0166666666667, "x": "それは、写真では確かめられないままでした。"}, {"t": 705.0833333333334, "x": "通り過ぎたあかつきは、太陽のまわりを回る道にいました。"}, {"t": 709.0333333333333, "x": "その道は、金星の通り道より、さらに内側へ入りこみます。"}, {"t": 713.8, "x": "あかつきは、金星のまわりで使うつもりで作られています。"}, {"t": 717.65, "x": "金星のあたりの、太陽の強さに合わせた設計です。"}, {"t": 721.4333333333333, "x": "ところが、今の道では、もっと太陽に近づきます。"}, {"t": 725.3666666666667, "x": "2011年の4月17日、あかつきは"}, {"t": 728.6833333333333, "x": "太陽に一番近い所を通りました。"}, {"t": 731.1666666666666, "x": "このときの太陽の光の強さです。"}, {"t": 733.5166666666667, "x": "1平方メートルあたり、およそ3655ワット。"}, {"t": 737.6333333333333, "x": "金星に着いたときは、およそ2621ワットでした。"}, {"t": 741.8666666666667, "x": "4割ほど、強い光を浴びたことになります。"}, {"t": 745.1666666666666, "x": "設計で考えていた熱を上回る量です。"}, {"t": 748.0333333333333, "x": "チームは、熱に一番強い面を、いつも太陽に向けました。"}, {"t": 752.5833333333334, "x": "ほかの面に強い光が当たらないようにするためです。"}, {"t": 755.7666666666667, "x": "太陽に一番近づくのは一度だけではありません。"}, {"t": 758.8666666666667, "x": "太陽を1周するたびにやってきます。"}, {"t": 761.2166666666667, "x": "金星に戻るまでのあいだに、"}, {"t": 762.9666666666667, "x": "その日は全部で9回ありました。"}, {"t": 765.4166666666666, "x": "2011年の4月と11月。"}, {"t": 767.95, "x": "2012年の5月と12月。"}, {"t": 770.2833333333333, "x": "2013年の6月。"}, {"t": 772.0833333333334, "x": "2014年の1月と7月。"}, {"t": 774.3666666666667, "x": "そして2015年の2月と8月です。"}, {"t": 777.1, "x": "一番近いとき、太陽までの距離はおよそ9140万キロです。"}, {"t": 782.0333333333333, "x": "地球と太陽の距離の、6割ほどです。"}, {"t": 785.0333333333333, "x": "9回のたびにチームは機体の温度を見守りました。"}, {"t": 788.1833333333333, "x": "一番遠い所を通る日もあります。"}, {"t": 790.5666666666667, "x": "そしてまた、半年あまりで太陽に近い所へ戻ってきます。"}, {"t": 794.7666666666667, "x": "近づく日と離れる日が、交互にめぐってきました。"}, {"t": 798.1333333333333, "x": "あかつきにとって、待つ5年は、"}, {"t": 800.3833333333333, "x": "休む5年ではありませんでした。"}, {"t": 802.6166666666667, "x": "焼かれないように向きを守り続ける5年でした。"}, {"t": 805.5333333333333, "x": "金星にもう一度近づけるのはいつか。"}, {"t": 807.9833333333333, "x": "計算でいくつかの道が考えられました。"}, {"t": 810.5833333333334, "x": "どの道を選ぶにしてもまず確かめることがあります。"}, {"t": 813.6833333333333, "x": "壊れた大きなエンジンがまだ使えるかどうかです。"}, {"t": 816.6333333333333, "x": "使えるなら、もともとの計画に"}, {"t": 818.9333333333333, "x": "近い道で回れるかもしれません。"}, {"t": 820.9666666666667, "x": "チームは地上で壊れたエンジンを作って試しました。"}, {"t": 824.2166666666667, "x": "燃やした回数は全部で195回です。"}, {"t": 827.1, "x": "分かったことがあります。"}, {"t": 828.5166666666667, "x": "火をつけ直すと、壊れが広がることがあるのです。"}, {"t": 831.95, "x": "一度で、エンジンがまるごと"}, {"t": 833.9833333333333, "x": "壊れてしまう場合もありました。"}, {"t": 835.8166666666667, "x": "そこで火のつけ方を工夫しました。"}, {"t": 838.0166666666667, "x": "あかつきの大きなエンジンは、"}, {"t": 839.6666666666666, "x": "熱に強いセラミックスでできていました。"}, {"t": 842.4166666666666, "x": "地上ではまず、金属で同じ形のエンジンを作りました。"}, {"t": 846.5, "x": "火がつく瞬間の力を、細かく測るためです。"}, {"t": 849.8666666666667, "x": "そこで見つけた条件を、セラミックスの"}, {"t": 852.6333333333333, "x": "エンジンで確かめました。"}, {"t": 854.0333333333333, "x": "酸化剤をほんの少しだけ先に流す。"}, {"t": 856.6, "x": "燃料と酸化剤を、あらかじめ温めておく。"}, {"t": 859.8833333333333, "x": "そうすると、火がつく瞬間の力が"}, {"t": 862.4666666666667, "x": "弱くなることが分かりました。"}, {"t": 864.2166666666667, "x": "宇宙のあかつきでも同じ温度の条件を作れるか。"}, {"t": 867.4666666666667, "x": "ヒーターと機体の向きで、温度を合わせる練習をしました。"}, {"t": 871.3166666666667, "x": "求められた条件の一つは、燃料を吹きこむ"}, {"t": 874.3833333333333, "x": "口のあたりを150度以上に保つことです。"}, {"t": 877.2, "x": "宇宙での練習では、およそ165度まで"}, {"t": 880.4, "x": "温めることができました。"}, {"t": 881.9833333333333, "x": "条件は、そろいました。"}, {"t": 883.9333333333333, "x": "そして2011年の9月7日と14日。"}, {"t": 886.9166666666666, "x": "大きなエンジンを2秒と5秒だけ噴かせてみました。"}, {"t": 890.0333333333333, "x": "結果ははっきりしていました。"}, {"t": 891.75, "x": "得られた加速は想定のおよそ9分の1でした。"}, {"t": 894.75, "x": "燃料はちゃんと流れて const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
