邦が送った着陸機です。"}, {"t": 8.65, "x": "一九七〇年から一九八五年までのあいだに、"}, {"t": 12.516666666666667, "x": "十機が、厚い雲を抜けて、地面に届きました。"}, {"t": 16.583333333333332, "x": "NASAの解説は、その十機に"}, {"t": 18.7, "x": "ついて、短くこう書いています。"}, {"t": 21.033333333333335, "x": "最も長く生き延びたものは、二時間。"}, {"t": 23.8, "x": "最も短いものは、二十三分。"}, {"t": 26.416666666666668, "x": "二時間というのは、ベネラ13号の百二十七分のことです。"}, {"t": 28.016666666666666, "x": "ベネラ13号█"}, {"t": 31.233333333333334, "x": "設計の段階で見積もられていた寿命は、三十二分でした。"}, {"t": 35.38333333333333, "x": "予定の四倍近くを、地表で過ごしたことになります。"}, {"t": 39.083333333333336, "x": "十機が地表から送ってきた時間を、記録に残っている分だけ"}, {"t": 43.4, "x": "足し合わせると、六百四十九分になります。"}, {"t": 44.93333333333333, "x": "六百四十九分█"}, {"t": 46.95, "x": "およそ十時間四十九分。"}, {"t": 48.88333333333333, "x": "ただし、一機ぶんは、地表で"}, {"t": 51.36666666666667, "x": "何分送信したのかを、確認できていません。"}, {"t": 54.483333333333334, "x": "その一機を除いた、九機ぶんの数字です。"}, {"t": 57.55, "x": "人類が金星の地面の上から受け取った記録は、"}, {"t": 60.483333333333334, "x": "ほぼ、その十時間あまりの中に収まっています。"}, {"t": 64.08333333333333, "x": "写真も、その中にあります。"}, {"t": 66.31666666666666, "x": "地表に立った機械が、自分の足元と地平線を写した写真。"}, {"t": 70.55, "x": "それが残っているのは、四か所だけです。"}, {"t": 72.5, "x": "四か所█"}, {"t": 73.91666666666667, "x": "金星の地表のほとんどは、電波で測った地図と、"}, {"t": 77.26666666666667, "x": "遠くから熱の光を捉えた像でしか知られていません。"}, {"t": 80.83333333333333, "x": "そこに立って、地面の近くから見た記録は、"}, {"t": 83.86666666666666, "x": "四つの点にしかありません。"}, {"t": 85.8, "x": "この回では、その十機を、降りた順に並べていきます。"}, {"t": 89.85, "x": "どこに降り、何分送り、何を返して、なぜ止まったのか。"}, {"t": 94.63333333333334, "x": "そして、止まったあとの機械が、"}, {"t": 96.78333333333333, "x": "いまどうなっているのかを、記録に"}, {"t": 99.3, "x": "残っているところまで追っていきます。"}, {"t": 101.31666666666666, "x": "金星は、地球に最も近くまで来る惑星です。"}, {"t": 104.86666666666666, "x": "近いときで、およそ三千八百二十万キロメートル。"}, {"t": 108.58333333333333, "x": "大きさも、地球とほとんど変わりません。"}, {"t": 111.35, "x": "半径は、地球の九十五パーセントほどです。"}, {"t": 114.6, "x": "それでも、長いあいだ、"}, {"t": 116.36666666666666, "x": "その地面を見た者はいませんでした。"}, {"t": 118.88333333333334, "x": "望遠鏡を向けても、見えるのは雲の上の面だけです。"}, {"t": 122.6, "x": "惑星全体が、切れ目のない雲に包まれていて、"}, {"t": 125.96666666666667, "x": "その下は、一度も見えたことがありませんでした。"}, {"t": 129.43333333333334, "x": "雲の下の空気が、どれくらい熱いのか。"}, {"t": 132.35, "x": "どれくらい重いのか。"}, {"t": 133.71666666666667, "x": "それは、行って測るしかありませんでした。"}, {"t": 136.46666666666667, "x": "ソビエト連邦は、一九六一年から、"}, {"t": 139.9, "x": "金星に探査機を送り始めます。"}, {"t": 142.43333333333334, "x": "計画の名前は、ベネラ。"}, {"t": 143.75, "x": "ベネラ█"}, {"t": 144.5, "x": "ロシア語で、金星のことです。"}, {"t": 146.85, "x": "最初の数機は、途中で連絡が途絶えたり、"}, {"t": 149.88333333333333, "x": "金星のそばを通り過ぎたりしました。"}, {"t": 152.48333333333332, "x": "ベネラ3号は、一九六六年三月一日、"}, {"t": 152.48333333333332, "x": "ベネラ3号█"}, {"t": 156.8, "x": "金星に衝突しています。"}, {"t": 158.98333333333332, "x": "NASAの記録では、他の惑星の"}, {"t": 161.16666666666666, "x": "地表に届いた、最初の宇宙機です。"}, {"t": 163.85, "x": "ただ、通信は、その二週間ほど前、"}, {"t": 166.93333333333334, "x": "二月十六日に途絶えていました。"}, {"t": 169.4, "x": "金星については、何のデータも返していません。"}, {"t": 172.66666666666666, "x": "どこに落ちたのかも、はっきりしていません。"}, {"t": 175.4, "x": "北緯二十度から南緯三十度、東経六十度から"}, {"t": 178.86666666666667, "x": "八十度という、広い範囲でしか分かっていません。"}, {"t": 182.08333333333334, "x": "NASAの記録には、ベネラ3号が、ソビエト連邦の"}, {"t": 185.88333333333333, "x": "国章を刻んだメダルを積んでいた、と書かれています。"}, {"t": 189.33333333333334, "x": "そのメダルは、その広い範囲のどこかに、"}, {"t": 192.08333333333334, "x": "いまもあることになります。"}, {"t": 193.95, "x": "金星に最初に置かれたものは、"}, {"t": 195.83333333333334, "x": "声を出す前に、黙ったまま届いていました。"}, {"t": 199.28333333333333, "x": "一九六七年、ベネラ4号が、"}, {"t": 200.61666666666667, "x": "ベネラ4号█"}, {"t": 202.56666666666666, "x": "夜の側から、金星の大気に入りました。"}, {"t": 206.16666666666666, "x": "パラシュートを開き、九十三分間、"}, {"t": 208.91666666666666, "x": "測った数字を送り続けます。"}, {"t": 211.26666666666668, "x": "二十三組の測定値です。"}, {"t": 213.38333333333333, "x": "NASAの記録によれば、他の惑星の大気の"}, {"t": 216.21666666666667, "x": "中からデータを送った、最初の探査機でした。"}, {"t": 219.38333333333333, "x": "積んでいたのは、温度計が二つ、気圧計が"}, {"t": 222.78333333333333, "x": "一つ、空気の成分を調べる装置が十一。"}, {"t": 226.18333333333334, "x": "その測定で、金星の空気の九十から"}, {"t": 229.05, "x": "九十五パーセントが二酸化炭素だということが、"}, {"t": 231.86666666666667, "x": "はじめて、その場で確かめられました。"}, {"t": 234.75, "x": "測った数字を地球へ送る電波は、"}, {"t": 237.05, "x": "一秒に一ビットの速さでした。"}, {"t": 239.45, "x": "一つの数字を送るだけでも、時間がかかります。"}, {"t": 242.81666666666666, "x": "送信は、高度およそ二十五キロメートルで途絶えます。"}, {"t": 246.5, "x": "そこで測られた数字は、二十二気圧、二百七十七度でした。"}, {"t": 251.4, "x": "当初、この数字は、地表の値だと考えられました。"}, {"t": 255.53333333333333, "x": "ベネラ4号は地面に着いた、と信じられたのです。"}, {"t": 259.01666666666665, "x": "実際には、まだ、地面から"}, {"t": 261.4166666666667, "x": "二十五キロメートル上の空中でした。"}, {"t": 263.7, "x": "電池は、百分ほどもつように作られていて、"}, {"t": 266.8, "x": "九十三分で止まっています。"}, {"t": 268.98333333333335, "x": "電池が尽きたのか、圧力と熱に負けたのか。"}, {"t": 272.2, "x": "NASAの記録には、その両方の"}, {"t": 274.4166666666667, "x": "可能性が並べて書かれています。"}, {"t": 276.4166666666667, "x": "いずれにしても、二十二気圧で止まるような作りでは、"}, {"t": 279.85, "x": "地面まで届かないということが分かりました。"}, {"t": 282.75, "x": "ベネラ4号の本体のほうは、"}, {"t": 284.5833333333333, "x": "カプセルに続いて、大気に入りました。"}, {"t": 287.75, "x": "本体は、はじめから、大気に入って"}, {"t": 290.6166666666667, "x": "残るようには作られていませんでした。"}, {"t": 292.81666666666666, "x": "いま知られている金星の地表の数字は、こうです。"}, {"t": 296.28333333333336, "x": "NASAの諸元表では、気圧は九十二バール。"}, {"t": 299.51666666666665, "x": "地球の地上の、およそ九十倍です。"}, {"t": 302.4166666666667, "x": "NASAの別の解説では、地球の、"}, {"t": 304.8333333333333, "x": "水深九百メートルより深い所と同じ力で"}, {"t": 308.26666666666665, "x": "押される、と言いかえられています。"}, {"t": 310.46666666666664, "x": "温度は、諸元表で四百六十四度、別の解説で四百六十七度。"}, {"t": 315.93333333333334, "x": "およそ四百六十度台です。"}, {"t": 317.9166666666667, "x": "NASAの解説は、鉛が溶けるほどの熱さ、と書いています。"}, {"t": 322.1666666666667, "x": "しかも、昼と夜の温度差が、ほとんどありません。"}, {"t": 325.78333333333336, "x": "厚い大気が、熱を、惑星全体に行き渡らせているからです。"}, {"t": 330.45, "x": "空気の九十六・五パーセントは、二酸化炭素。"}, {"t": 334.0, "x": "雲は、硫酸の粒でできています。"}, {"t": 336.51666666666665, "x": "一日の長さも、地球とは違います。"}, {"t": 339.46666666666664, "x": "金星は、地球と逆の向きに、ゆっくり自転しています。"}, {"t": 343.6, "x": "一回転するのに、地球の日数で、およそ二百四十三日。"}, {"t": 348.35, "x": "太陽は西から昇り、東に沈みます。"}, {"t": 351.4166666666667, "x": "日の出から、次の日の出までは、およそ百十七日です。"}, {"t": 355.6666666666667, "x": "ベネラ4号のあと、ソビエトの技術者たちは、"}, {"t": 358.76666666666665, "x": "この数字に耐える機械を作ることになります。"}, {"t": 361.85, "x": "溶けず、潰れず、地面に着いてから、"}, {"t": 364.78333333333336, "x": "少しでも長く、声を出し続ける機械です。"}, {"t": 368.26666666666665, "x": "ただ、その「少しでも長く」は、はじめから、"}, {"t": 372.3666666666667, "x": "数十分の単位で考えられていました。"}, {"t": 375.1333333333333, "x": "何日も生きる機械ではなく、数十分だけ生きればよい機械。"}, {"t": 379.28333333333336, "x": "金星の着陸機は、その前提で、設計されていきます。"}, {"t": 383.6166666666667, "x": "一九七〇年八月、同じ形の探査機が二機、"}, {"t": 387.76666666666665, "x": "金星へ向けて打ち上げられました。"}, {"t": 390.1166666666667, "x": "一機は、地球を回る軌道から、出られませんでした。"}, {"t": 394.01666666666665, "x": "もう一機が、ベネラ7号です。"}, {"t": 395.23333333333335, "x": "ベネラ7号█"}, {"t": 396.85, "x": "ベネラ7号の着陸カプセルは、それまでの"}, {"t": 399.81666666666666, "x": "機体とは、作り方が違っていました。"}, {"t": 402.4166666666667, "x": "継ぎ目も、溶接の跡も、穴もない、一つの球の殻。"}, {"t": 406.9, "x": "材料はチタン。"}, {"t": 408.0, "x": "内側には、衝撃を吸う材料が貼られていました。"}, {"t": 411.53333333333336, "x": "重さは、四百九十キログラム。"}, {"t": 414.1, "x": "重くなった分、パラシュートは、"}, {"t": 416.23333333333335, "x": "あえて小さくされています。"}, {"t": 418.18333333333334, "x": "地面にぶつかるまでの時間を、短くするためです。"}, {"t": 421.6666666666667, "x": "長く耐えるより、早く降りる。"}, {"t": 423.96666666666664, "x": "熱い空気の中にいる時間を短くすれば、"}, {"t": 426.65, "x": "それだけ、地面で使える時間が残ります。"}, {"t": 430.05, "x": "カプセルを金星まで運ぶ本体は、高さ三・五メートル。"}, {"t": 434.1, "x": "両側に、太陽電池の翼を広げていました。"}, {"t": 437.6333333333333, "x": "地球と話すための皿の形のアンテナは、"}, {"t": 440.18333333333334, "x": "直径二・三メートル。"}, {"t": 442.1333333333333, "x": "カプセルから地球へ送る電波は、"}, {"t": 444.18333333333334, "x": "ベネラ4号と同じく、一秒に一ビットでした。"}, {"t": 448.03333333333336, "x": "金星に着く前に、カプセルは、"}, {"t": 450.31666666666666, "x": "マイナス八度まで冷やされました。"}, {"t": 452.6166666666667, "x": "これから四百度を超える場所に入るのに"}, {"t": 454.96666666666664, "x": "備えて、あらかじめ冷やしておくのです。"}, {"t": 457.71666666666664, "x": "一九七〇年十二月十五日、ベネラ7号は、"}, {"t": 461.76666666666665, "x": "夜の側から、金星の大気に入りました。"}, {"t": 465.1, "x": "高度およそ六十キロメートルで、パラシュートが開きます。"}, {"t": 468.81666666666666, "x": "アンテナが伸び、信号が届き始めました。"}, {"t": 471.8833333333333, "x": "その六分後、パラシュートが裂けました。"}, {"t": 474.6166666666667, "x": "裂けたパラシュートは潰れ、"}, {"t": 476.1333333333333, "x": "カプセルは、ほとんど支えのないまま、"}, {"t": 478.96666666666664, "x": "さらに二十九分間、落ち続けます。"}, {"t": 482.1, "x": "地面に着いたときの速さは、秒速およそ十七メートル。"}, {"t": 486.03333333333336, "x": "信号は弱まり、一秒ほど強くなって、"}, {"t": 489.1333333333333, "x": "そのあと、途絶えたように見えました。"}, {"t": 491.9166666666667, "x": "あとになって、録音されていた電波の"}, {"t": 494.45, "x": "記録を、細かく調べ直したところ、信号は、"}, {"t": 498.03333333333336, "x": "途絶えていなかったことが分かります。"}, {"t": 500.31666666666666, "x": "衝突のあとも、二十三分間、"}, {"t": 501.6333333333333, "x": "二十三分間█"}, {"t": 502.78333333333336, "x": "非常に弱い信号が、続いていました。"}, {"t": 505.96666666666664, "x": "NASAの記録は、その理由を、推測として書いています。"}, {"t": 509.93333333333334, "x": "カプセルは地面で跳ねて、横倒しになったのかもしれない。"}, {"t": 513.8, "x": "そのため、アンテナが地球の方を向いておらず、"}, {"t": 517.0166666666667, "x": "信号が弱くなったのかもしれない。"}, {"t": 519.4833333333333, "x": "弱い信号の中には、温度の数字が入っていました。"}, {"t": 523.2333333333333, "x": "四百七十五度。"}, {"t": 524.6666666666666, "x": "地表で、ずっと同じ値を示していました。"}, {"t": 527.8, "x": "圧力計は、降りる途中で、壊れていました。"}, {"t": 531.3833333333333, "x": "地表の気圧九十二バール、風速、"}, {"t": 534.1, "x": "秒速二・五メートルという数字は、"}, {"t": 536.7333333333333, "x": "ほかの測定から、計算で導いたものです。"}, {"t": 540.2, "x": "ベネラ7号は、他の惑星に着陸したあとで、"}, {"t": 543.45, "x": "データを送ってきた、最初の宇宙機です。"}, {"t": 546.6, "x": "NASAの記録にも、そう書かれています。"}, {"t": 549.2, "x": "ただ、その記録は、送られてきた"}, {"t": 551.7833333333333, "x": "その時には、読み取られていませんでした。"}, {"t": 554.5, "x": "弱すぎて、雑音と見分けがつかなかったからです。"}, {"t": 557.9833333333333, "x": "地球の側がそれを読み取ったのは、あとからでした。"}, {"t": 561.3333333333334, "x": "着陸した場所は、南緯五度、"}, {"t": 563.5333333333333, "x": "東経三百五十一度の付近とされています。"}, {"t": 566.8166666666667, "x": "金星の地表で最初に働いた機械は、横倒しかも"}, {"t": 570.4833333333333, "x": "しれない姿のまま、誰にもすぐには聞き取れない声で、"}, {"t": 574.1333333333333, "x": "二十三分間、温度を読み上げていたことになります。"}, {"t": 578.1, "x": "NASAの解説が、最も短いものは二十三分、と"}, {"t": 582.0666666666667, "x": "書いているのは、このベネラ7号のことです。"}, {"t": 585.0, "x": "十機の中で、最も短い時間でした。"}, {"t": 588.0, "x": "そして、最初の二十三分でもありました。"}, {"t": 591.1, "x": "一九七二年三月、ベネラ8号が打ち上げられます。"}, {"t": 592.8, "x": "ベネラ8号█"}, {"t": 596.0, "x": "このときも、同じ形の機体が二機作られ、"}, {"t": 599.0166666666667, "x": "一機は、地球の軌道を離れられませんでした。"}, {"t": 602.45, "x": "金星まで、百十七日。"}, {"t": 604.8333333333334, "x": "着く前に、カプセルの中は、"}, {"t": 606.9333333333333, "x": "マイナス十五度まで冷やされました。"}, {"t": 609.35, "x": "ベネラ8号には、それまでとは違う任務がありました。"}, {"t": 612.95, "x": "昼の側に降りることです。"}, {"t": 614.7, "x": "それまでの二機は、夜の側から入っていました。"}, {"t": 617.95, "x": "ベネラ8号が目指したのは、夜が明けたばかりの場所。"}, {"t": 621.5166666666667, "x": "朝と夜の境目から、およそ五百キロメートル、"}, {"t": 624.8333333333334, "x": "昼の側に入った地点です。"}, {"t": 626.9833333333333, "x": "目的の一つは、光を測ることでした。"}, {"t": 629.9666666666667, "x": "金星の地面は、どれくらい明るいのか。"}, {"t": 632.9, "x": "厚い雲の下に、光は届いているのか。"}, {"t": 635.9166666666666, "x": "それが分からなければ、次の機体にカメラを"}, {"t": 638.8, "x": "積んでも、何も写らないかもしれません。"}, {"t": 641.55, "x": "七月二十二日、ベネラ8号のカプセルは、本体から"}, {"t": 645.8833333333333, "x": "離れ、角度七十七度で、大気に入りました。"}, {"t": 649.6166666666667, "x": "入ったときの速さは、秒速十一・六キロメートル。"}, {"t": 653.35, "x": "それが、空気との摩擦だけで、"}, {"t": 655.5, "x": "高度六十七キロメートルまでに、"}, {"t": 657.9166666666666, "x": "秒速二百五十メートルほどに落ちます。"}, {"t": 660.7666666666667, "x": "パラシュートは、高度六十キロメートルで、"}, {"t": 663.6, "x": "絞ったまま開きました。"}, {"t": 665.4166666666666, "x": "カプセルの中では、冷やすための装置が動いていました。"}, {"t": 669.1, "x": "高度五十キロメートルで測定を始め、"}, {"t": 671.5833333333334, "x": "三十キロメートルでパラシュートを大きく開きます。"}, {"t": 674.8833333333333, "x": "高度三十五キロメートルから三十キロメートルの"}, {"t": 677.7833333333333, "x": "あたりで、光が弱くなるのが記録されました。"}, {"t": 680.9, "x": "雲の底を、抜けたところです。"}, {"t": 683.2333333333333, "x": "カプセルを運んできた本体は、そのあと、自分の"}, {"t": 686.85, "x": "測定を送りながら大気に入り、燃え尽きています。"}, {"t": 690.3333333333334, "x": "同じ日、ベネラ8号は着陸します。"}, {"t": 693.25, "x": "金星のその場所の時刻で、朝の六時二十四分でした。"}, {"t": 697.2666666666667, "x": "地表から、六十三分間、データが届きました。"}, {"t": 698.2, "x": "六十三分間█"}, {"t": 701.2, "x": "そのあと、厳しい地表の条件のために、機能を"}, {"t": 704.9333333333333, "x": "失った、とNASAの記録にはあります。"}, {"t": 707.4333333333333, "x": "六十三分のあいだに、分かったことがいくつかあります。"}, {"t": 711.0666666666667, "x": "温度はおよそ四百七十度、気圧はおよそ九十気圧。"}, {"t": 715.1, "x": "ベネラ7号の数字は正しかった、ということが、"}, {"t": 718.4, "x": "確かめられました。"}, {"t": 719.8833333333333, "x": "雲の層では、硫酸が見つかっています。"}, {"t": 722.7166666666667, "x": "地面の土を測ったのも、これが最初でした。"}, {"t": 725.8833333333333, "x": "そして、光です。"}, {"t": 727.5833333333334, "x": "ベネラ8号の測定では、地表の明るさは、"}, {"t": 730.7, "x": "写真を撮るのに足りる、という結果でした。"}, {"t": 733.85, "x": "NASAの記録は、地球の曇りの日、"}, {"t": 736.3, "x": "見通し一キロメートルほどの明るさ、と書いています。"}, {"t": 740.1833333333333, "x": "雲の下は、真っ暗ではありませんでした。"}, {"t": 743.0333333333333, "x": "この結果が、次の機体の形を決めました。"}, {"t": 746.2, "x": "カメラを積む。"}, {"t": 747.2, "x": "ただし、念のため、照明も積む。"}, {"t": 750.15, "x": "あとで分かることですが、ベネラ8号が測った明るさは、"}, {"t": 753.9, "x": "朝の、夜との境目に近い場所の明るさでした。"}, {"t": 757.7, "x": "昼に近い時刻なら、もっと明るい。"}, {"t": 760.3666666666667, "x": "その違いは、次の機体が降りたときに、はっきりします。"}, {"t": 764.4166666666666, "x": "一九七五年、ソビエト連邦は、"}, {"t": 767.55, "x": "まったく新しい形の探査機を送ります。"}, {"t": 770.6166666666667, "x": "ベネラ9号とベネラ10号です。"}, {"t": 770.6166666666667, "x": "ベネラ9号█"}, {"t": 772.05, "x": "ベネラ10号█"}, {"t": 774.1833333333333, "x": "それまでの機体とは、大きさが違いました。"}, {"t": 777.2166666666667, "x": "大気に入るときの球体は、直径二・"}, {"t": 779.8666666666667, "x": "四メートル、重さ千五百六十キログラム。"}, {"t": 783.3166666666667, "x": "その中に、高さ二メートル、重さ六百六十キログラムの"}, {"t": 787.6666666666666, "x": "着陸機が、収められていました。"}, {"t": 790.05, "x": "着陸機の芯は、直径およそ八十センチメートルの、"}, {"t": 793.8666666666667, "x": "チタンの球です。"}, {"t": 795.2333333333333, "x": "その外側を、厚さ十二センチメートルの"}, {"t": 798.1666666666666, "x": "断熱材が包んでいます。"}, {"t": 799.8, "x": "中には、熱をため込むための材料が入っていました。"}, {"t": 803.4333333333333, "x": "ソ連の金星画像を調べ直してきた研究者、ドン・"}, {"t": 806.5, "x": "ドン・ミッチェル█"}, {"t": 807.2166666666667, "x": "ミッチェルの解説によれば、三十度で溶ける塩の一種です。"}, {"t": 811.3333333333334, "x": "氷が溶けるあいだ、周りの温度が上がりにくいのと"}, {"t": 814.6, "x": "同じように、この塩が溶けているあいだ、"}, {"t": 817.2, "x": "機械の中の温度が上がるのを、遅らせます。"}, {"t": 820.4666666666667, "x": "そして、カメラです。"}, {"t": 822.2166666666667, "x": "カメラは、耐圧の球の内側に置かれていました。"}, {"t": 825.65, "x": "外が見えるのは、厚さ一センチメートルの、石英の窓だけ。"}, {"t": 830.2166666666667, "x": "カメラは、その窓の中で首を振り、"}, {"t": 832.7166666666667, "x": "横に百八十度、縦に四十度の景色を、"}, {"t": 836. : 1312.8833333333334, "x": "ミッチェルの解説によれば、11号が"}, {"t": 1315.6, "x": "降りたときには電気の乱れが激しく、"}, {"t": 1317.8666666666666, "x": "12号のときには、ずっと少なかった。"}, {"t": 1320.9666666666667, "x": "雷は、地球と同じように、場所に"}, {"t": 1323.9666666666667, "x": "よって起きたり起きなかったりするのかも"}, {"t": 1325.9666666666667, "x": "しれない、と受け止められました。"}, {"t": 1328.0666666666666, "x": "降りてくる途中の空気からは、硫黄や塩素、"}, {"t": 1331.1166666666666, "x": "低い高度での一酸化炭素も見つかっています。"}, {"t": 1334.25, "x": "写真が一枚もない二か所は、写真の数には入りません。"}, {"t": 1338.1833333333334, "x": "着陸した場所は、南緯十四度、"}, {"t": 1340.65, "x": "東経二百九十九度と、南緯七度、東経二百九十四度。"}, {"t": 1345.9666666666667, "x": "そこには、覆いを付けたままのカメラが、"}, {"t": 1348.6333333333334, "x": "いまも置かれていることになります。"}, {"t": 1350.9, "x": "一九八一年、ベネラ13号とベネラ14号が、"}, {"t": 1352.2666666666667, "x": "ベネラ13号█"}, {"t": 1353.8666666666666, "x": "ベネラ14号█"}, {"t": 1356.2666666666667, "x": "五日違いで打ち上げられます。"}, {"t": 1358.8666666666666, "x": "11号と12号でできなかったことを、"}, {"t": 1361.35, "x": "やり直すための二機でした。"}, {"t": 1363.2666666666667, "x": "着陸機の重さは、七百六十キログラム。"}, {"t": 1366.6, "x": "カメラには、赤、緑、青、そして色のない、"}, {"t": 1370.9166666666667, "x": "四つのフィルターが付けられていました。"}, {"t": 1373.3333333333333, "x": "ほかに、地面を掘るドリル、土の"}, {"t": 1376.0, "x": "成分を調べる装置、地面の硬さを測る装置、"}, {"t": 1379.6833333333334, "x": "地震計、そして、マイクが積まれていました。"}, {"t": 1383.3333333333333, "x": "一九八二年三月一日、ベネラ13号が、"}, {"t": 1387.45, "x": "フィービー地域と呼ばれる高地の、東に降ります。"}, {"t": 1391.0833333333333, "x": "雲の下では、パラシュートを使いませんでした。"}, {"t": 1394.1666666666667, "x": "高度四十七キロメートルでパラシュートを"}, {"t": 1396.5166666666667, "x": "切り離し、あとは、円盤の形をした、"}, {"t": 1399.75, "x": "空気を受ける板だけで降りていきます。"}, {"t": 1402.2833333333333, "x": "降下は、全体で、一時間ほどでした。"}, {"t": 1405.5833333333333, "x": "着地のあと、カメラの覆いが外れました。"}, {"t": 1408.5166666666667, "x": "今度は、両方の着陸機の、両方のカメラが、動きました。"}, {"t": 1413.45, "x": "ベネラ13号が送ってきたのは、"}, {"t": 1415.6833333333334, "x": "金星の地表の、最初のカラー画像です。"}, {"t": 1417.3333333333333, "x": "最初のカラー画像█"}, {"t": 1419.2666666666667, "x": "NASAの記録は、それを、橙がかった"}, {"t": 1422.2, "x": "茶色の、平らな岩盤、と書いています。"}, {"t": 1425.3833333333334, "x": "岩盤の上に、ゆるい土と、薄く平たい、"}, {"t": 1428.75, "x": "角ばった小石が、散らばっていました。"}, {"t": 1431.5833333333333, "x": "その色は、岩そのものの色ではないかもしれません。"}, {"t": 1435.05, "x": "厚い大気を通った光は、青い色が"}, {"t": 1437.8666666666666, "x": "削られて、橙色に寄っていきます。"}, {"t": 1440.5166666666667, "x": "ミッチェルの解説によれば、もし地表に"}, {"t": 1443.1333333333334, "x": "立つ者がいたとしたら、岩の景色が、のっぺりとした橙色の"}, {"t": 1447.4833333333333, "x": "霞の空に、溶けていくように見えるはずです。"}, {"t": 1450.5833333333333, "x": "色を確かめるために、着陸機は、"}, {"t": 1453.0833333333333, "x": "色見本の板を持っていきました。"}, {"t": 1455.4, "x": "灰色、赤、緑、青に塗り分けた板です。"}, {"t": 1459.6, "x": "熱に強い塗料で、塗られていました。"}, {"t": 1462.4, "x": "ところが、その塗料の色も、五百度と"}, {"t": 1465.4, "x": "百気圧の中では、変わってしまいます。"}, {"t": 1468.1166666666666, "x": "熱と圧力で、色そのものが、ずれるのです。"}, {"t": 1471.7, "x": "ミッチェルは、ベネラ13号と14号の"}, {"t": 1474.5666666666666, "x": "画像の正しい色は、いまも、完全には"}, {"t": 1477.6666666666667, "x": "割り出されていない、と書いています。"}, {"t": 1479.95, "x": "金星の地面が、本当は何色なのか。"}, {"t": 1482.9666666666667, "x": "それは、写真が残ったあとも、決まっていません。"}, {"t": 1486.5, "x": "ドリルも、動きました。"}, {"t": 1488.3166666666666, "x": "ドリルは二分間、地面を掘りました。"}, {"t": 1491.0833333333333, "x": "その部品は、五百度に熱せられて"}, {"t": 1493.5166666666667, "x": "膨らんだときに、ちょうどよく噛み合うように"}, {"t": 1496.1166666666666, "x": "作られていた、とされています。"}, {"t": 1498.2333333333333, "x": "掘った土は、密閉した部屋に送られます。"}, {"t": 1501.2166666666667, "x": "部屋の中は、三十度、〇・〇五気圧に保たれていました。"}, {"t": 1505.95, "x": "土は、地球の、カリウムを多く"}, {"t": 1508.65, "x": "含む玄武岩に、近いものでした。"}, {"t": 1511.1166666666666, "x": "マイクは、音を拾っていました。"}, {"t": 1513.45, "x": "カメラの覆いを飛ばす、火薬の音。"}, {"t": 1516.1333333333334, "x": "ドリルの音。"}, {"t": 1517.1166666666666, "x": "土を運ぶ、火薬の音。"}, {"t": 1519.3166666666666, "x": "そして、風の音。"}, {"t": 1521.0833333333333, "x": "風の速さは、秒速〇・五メートルほどでした。"}, {"t": 1524.5666666666666, "x": "金星の地表の風は、とても弱いことが分かっています。"}, {"t": 1528.3666666666666, "x": "NASAの諸元表では、秒速〇・"}, {"t": 1530.5333333333333, "x": "三メートルから一・〇メートル。"}, {"t": 1532.8833333333334, "x": "地面の近くは、ほとんど、凪いでいます。"}, {"t": 1536.0666666666666, "x": "そのため、地表の岩は、風でほとんど"}, {"t": 1539.1, "x": "削られない、とミッチェルは書いています。"}, const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}

  else if(k==='s'||k==='S')sp.onclick()});
