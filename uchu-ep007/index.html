<script>
const D={"name": "ep007", "file": "ep007", "dur": 2076.85, "segs": [], "subs": [{"t": 0.0, "x": "金星の地表には、地面に着いてから"}, {"t": 2.6, "x": "声を出した機械が、十機あります。"}, {"t": 5.116666666666666, "x": "いずれも、旧ソビエト連邦が送った着陸機です。"}, {"t": 8.65, "x": "一九七〇年から一九八五年までのあいだに、"}, {"t": 12.516666666666667, "x": "十機が、厚い雲を抜けて、地面に届きました。"}, {"t": 16.583333333333332, "x": "NASAの解説は、その十機に"}, {"t": 18.7, "x": "ついて、短くこう書いています。"}, {"t": 21.033333333333335, "x": "最も長く生き延びたものは、二時間。"}, {"t": 23.8, "x": "最も短いものは、二十三分。"}, {"t": 26.416666666666668, "x": "二時間というのは、ベネラ13号の百二十七分のことです。"}, {"t": 27.866666666666667, "x": "ベネラ13号█"}, {"t": 30.783333333333335, "x": "設計の段階で見積もられていた寿命は、三十二分でした。"}, {"t": 34.93333333333333, "x": "予定の四倍近くを、地表で過ごしたことになります。"}, {"t": 38.63333333333333, "x": "十機が地表から送ってきた時間を、記録に残っている分だけ"}, {"t": 42.666666666666664, "x": "足し合わせると、六百四十九分になります。"}, {"t": 44.1, "x": "六百四十九分█"}, {"t": 45.983333333333334, "x": "およそ十時間四十九分。"}, {"t": 47.916666666666664, "x": "ただし、一機ぶんは、地表で"}, {"t": 50.4, "x": "何分送信したのかを、確認できていません。"}, {"t": 53.516666666666666, "x": "その一機を除いた、九機ぶんの数字です。"}, {"t": 56.583333333333336, "x": "人類が金星の地面の上から受け取った記録は、"}, {"t": 59.516666666666666, "x": "ほぼ、その十時間あまりの中に収まっています。"}, {"t": 63.11666666666667, "x": "写真も、その中にあります。"}, {"t": 65.35, "x": "地表に立った機械が、自分の足元と地平線を写した写真。"}, {"t": 69.58333333333333, "x": "それが残っているのは、四か所だけです。"}, {"t": 71.2, "x": "四か所█"}, {"t": 72.38333333333334, "x": "金星の地表のほとんどは、電波で測った地図と、"}, {"t": 75.73333333333333, "x": "遠くから熱の光を捉えた像でしか知られていません。"}, {"t": 79.3, "x": "そこに立って、地面の近くから見た記録は、"}, {"t": 82.33333333333333, "x": "四つの点にしかありません。"}, {"t": 84.26666666666667, "x": "この回では、その十機を、降りた順に並べていきます。"}, {"t": 88.31666666666666, "x": "どこに降り、何分送り、何を返して、なぜ止まったのか。"}, {"t": 93.06666666666666, "x": "そして、止まったあとの機械が、"}, {"t": 95.21666666666667, "x": "いまどうなっているのかを、記録に"}, {"t": 97.73333333333333, "x": "残っているところまで追っていきます。"}, {"t": 99.75, "x": "金星は、地球に最も近くまで来る惑星です。"}, {"t": 103.3, "x": "近いときで、およそ三千八百二十万キロメートル。"}, {"t": 107.01666666666667, "x": "大きさも、地球とほとんど変わりません。"}, {"t": 109.78333333333333, "x": "半径は、地球の九十五パーセントほどです。"}, {"t": 113.03333333333333, "x": "それでも、長いあいだ、"}, {"t": 114.8, "x": "その地面を見た者はいませんでした。"}, {"t": 117.31666666666666, "x": "望遠鏡を向けても、見えるのは雲の上の面だけです。"}, {"t": 121.03333333333333, "x": "惑星全体が、切れ目のない雲に包まれていて、"}, {"t": 124.4, "x": "その下は、一度も見えたことがありませんでした。"}, {"t": 127.86666666666666, "x": "雲の下の空気が、どれくらい熱いのか。"}, {"t": 130.78333333333333, "x": "どれくらい重いのか。"}, {"t": 132.15, "x": "それは、行って測るしかありませんでした。"}, {"t": 134.9, "x": "ソビエト連邦は、一九六一年から、"}, {"t": 138.33333333333334, "x": "金星に探査機を送り始めます。"}, {"t": 140.86666666666667, "x": "計画の名前は、ベネラ。"}, {"t": 142.18333333333334, "x": "ベネラ█"}, {"t": 142.93333333333334, "x": "ロシア語で、金星のことです。"}, {"t": 145.28333333333333, "x": "最初の数機は、途中で連絡が途絶えたり、"}, {"t": 148.31666666666666, "x": "金星のそばを通り過ぎたりしました。"}, {"t": 150.91666666666666, "x": "ベネラ3号は、一九六六年三月一日、"}, {"t": 150.91666666666666, "x": "ベネラ3号█"}, {"t": 154.95, "x": "金星に衝突しています。"}, {"t": 156.98333333333332, "x": "NASAの記録では、他の惑星の"}, {"t": 159.16666666666666, "x": "地表に届いた、最初の宇宙機です。"}, {"t": 161.85, "x": "ただ、通信は、その二週間ほど前、"}, {"t": 164.93333333333334, "x": "二月十六日に途絶えていました。"}, {"t": 167.4, "x": "金星については、何のデータも返していません。"}, {"t": 170.66666666666666, "x": "どこに落ちたのかも、はっきりしていません。"}, {"t": 173.4, "x": "北緯二十度から南緯三十度、東経六十度から"}, {"t": 176.86666666666667, "x": "八十度という、広い範囲でしか分かっていません。"}, {"t": 180.08333333333334, "x": "NASAの記録には、ベネラ3号が、ソビエト連邦の"}, {"t": 183.88333333333333, "x": "国章を刻んだメダルを積んでいた、と書かれています。"}, {"t": 187.33333333333334, "x": "そのメダルは、その広い範囲のどこかに、"}, {"t": 190.08333333333334, "x": "いまもあることになります。"}, {"t": 191.95, "x": "金星に最初に置かれたものは、"}, {"t": 193.83333333333334, "x": "声を出す前に、黙ったまま届いていました。"}, {"t": 197.28333333333333, "x": "一九六七年、ベネラ4号が、"}, {"t": 198.53333333333333, "x": "ベネラ4号█"}, {"t": 200.35, "x": "夜の側から、金星の大気に入りました。"}, {"t": 203.7, "x": "パラシュートを開き、九十三分間、"}, {"t": 206.45, "x": "測った数字を送り続けます。"}, {"t": 208.8, "x": "二十三組の測定値です。"}, {"t": 210.91666666666666, "x": "NASAの記録によれば、他の惑星の大気の"}, {"t": 213.75, "x": "中からデータを送った、最初の探査機でした。"}, {"t": 216.91666666666666, "x": "積んでいたのは、温度計が二つ、気圧計が"}, {"t": 220.31666666666666, "x": "一つ、空気の成分を調べる装置が十一。"}, {"t": 223.71666666666667, "x": "その測定で、金星の空気の九十から"}, {"t": 226.58333333333334, "x": "九十五パーセントが二酸化炭素だということが、"}, {"t": 229.4, "x": "はじめて、その場で確かめられました。"}, {"t": 232.28333333333333, "x": "測った数字を地球へ送る電波は、"}, {"t": 234.58333333333334, "x": "一秒に一ビットの速さでした。"}, {"t": 236.98333333333332, "x": "一つの数字を送るだけでも、時間がかかります。"}, {"t": 240.35, "x": "送信は、高度およそ二十五キロメートルで途絶えます。"}, {"t": 244.03333333333333, "x": "そこで測られた数字は、二十二気圧、二百七十七度でした。"}, {"t": 248.93333333333334, "x": "当初、この数字は、地表の値だと考えられました。"}, {"t": 253.06666666666666, "x": "ベネラ4号は地面に着いた、と信じられたのです。"}, {"t": 256.55, "x": "実際には、まだ、地面から"}, {"t": 258.95, "x": "二十五キロメートル上の空中でした。"}, {"t": 261.23333333333335, "x": "電池は、百分ほどもつように作られていて、"}, {"t": 264.3333333333333, "x": "九十三分で止まっています。"}, {"t": 266.51666666666665, "x": "電池が尽きたのか、圧力と熱に負けたのか。"}, {"t": 269.73333333333335, "x": "NASAの記録には、その両方の"}, {"t": 271.95, "x": "可能性が並べて書かれています。"}, {"t": 273.95, "x": "いずれにしても、二十二気圧で止まるような作りでは、"}, {"t": 277.3833333333333, "x": "地面まで届かないということが分かりました。"}, {"t": 280.28333333333336, "x": "ベネラ4号の本体のほうは、"}, {"t": 282.1166666666667, "x": "カプセルに続いて、大気に入りました。"}, {"t": 285.28333333333336, "x": "本体は、はじめから、大気に入って"}, {"t": 288.15, "x": "残るようには作られていませんでした。"}, {"t": 290.35, "x": "いま知られている金星の地表の数字は、こうです。"}, {"t": 293.81666666666666, "x": "NASAの諸元表では、気圧は九十二バール。"}, {"t": 297.05, "x": "地球の地上の、およそ九十倍です。"}, {"t": 299.95, "x": "NASAの別の解説では、地球の、"}, {"t": 302.3666666666667, "x": "水深九百メートルより深い所と同じ力で"}, {"t": 305.8, "x": "押される、と言いかえられています。"}, {"t": 308.0, "x": "温度は、諸元表で四百六十四度、別の解説で四百六十七度。"}, {"t": 313.46666666666664, "x": "およそ四百六十度台です。"}, {"t": 315.45, "x": "NASAの解説は、鉛が溶けるほどの熱さ、と書いています。"}, {"t": 319.7, "x": "しかも、昼と夜の温度差が、ほとんどありません。"}, {"t": 323.31666666666666, "x": "厚い大気が、熱を、惑星全体に行き渡らせているからです。"}, {"t": 327.98333333333335, "x": "空気の九十六・五パーセントは、二酸化炭素。"}, {"t": 331.53333333333336, "x": "雲は、硫酸の粒でできています。"}, {"t": 334.05, "x": "一日の長さも、地球とは違います。"}, {"t": 337.0, "x": "金星は、地球と逆の向きに、ゆっくり自転しています。"}, {"t": 341.1333333333333, "x": "一回転するのに、地球の日数で、およそ二百四十三日。"}, {"t": 345.8833333333333, "x": "太陽は西から昇り、東に沈みます。"}, {"t": 348.95, "x": "日の出から、次の日の出までは、およそ百十七日です。"}, {"t": 353.2, "x": "ベネラ4号のあと、ソビエトの技術者たちは、"}, {"t": 356.3, "x": "この数字に耐える機械を作ることになります。"}, {"t": 359.3833333333333, "x": "溶けず、潰れず、地面に着いてから、"}, {"t": 362.31666666666666, "x": "少しでも長く、声を出し続ける機械です。"}, {"t": 365.8, "x": "ただ、その「少しでも長く」は、はじめから、"}, {"t": 369.9, "x": "数十分の単位で考えられていました。"}, {"t": 372.6666666666667, "x": "何日も生きる機械ではなく、数十分だけ生きればよい機械。"}, {"t": 376.81666666666666, "x": "金星の着陸機は、その前提で、設計されていきます。"}, {"t": 381.15, "x": "一九七〇年八月、同じ形の探査機が二機、"}, {"t": 385.3, "x": "金星へ向けて打ち上げられました。"}, {"t": 387.65, "x": "一機は、地球を回る軌道から、出られませんでした。"}, {"t": 391.55, "x": "もう一機が、ベネラ7号です。"}, {"t": 392.56666666666666, "x": "ベネラ7号█"}, {"t": 393.93333333333334, "x": "ベネラ7号の着陸カプセルは、それまでの"}, {"t": 396.9, "x": "機体とは、作り方が違っていました。"}, {"t": 399.5, "x": "継ぎ目も、溶接の跡も、穴もない、一つの球の殻。"}, {"t": 403.98333333333335, "x": "材料はチタン。"}, {"t": 405.0833333333333, "x": "内側には、衝撃を吸う材料が貼られていました。"}, {"t": 408.6166666666667, "x": "重さは、四百九十キログラム。"}, {"t": 411.18333333333334, "x": "重くなった分、パラシュートは、"}, {"t": 413.31666666666666, "x": "あえて小さくされています。"}, {"t": 415.26666666666665, "x": "地面にぶつかるまでの時間を、短くするためです。"}, {"t": 418.75, "x": "長く耐えるより、早く降りる。"}, {"t": 421.05, "x": "熱い空気の中にいる時間を短くすれば、"}, {"t": 423.73333333333335, "x": "それだけ、地面で使える時間が残ります。"}, {"t": 427.1333333333333, "x": "カプセルを金星まで運ぶ本体は、高さ三・五メートル。"}, {"t": 431.18333333333334, "x": "両側に、太陽電池の翼を広げていました。"}, {"t": 434.71666666666664, "x": "地球と話すための皿の形のアンテナは、"}, {"t": 437.26666666666665, "x": "直径二・三メートル。"}, {"t": 439.21666666666664, "x": "カプセルから地球へ送る電波は、"}, {"t": 441.26666666666665, "x": "ベネラ4号と同じく、一秒に一ビットでした。"}, {"t": 445.1166666666667, "x": "金星に着く前に、カプセルは、"}, {"t": 447.4, "x": "マイナス八度まで冷やされました。"}, {"t": 449.7, "x": "これから四百度を超える場所に入るのに"}, {"t": 452.05, "x": "備えて、あらかじめ冷やしておくのです。"}, {"t": 454.8, "x": "一九七〇年十二月十五日、ベネラ7号は、"}, {"t": 458.85, "x": "夜の側から、金星の大気に入りました。"}, {"t": 462.18333333333334, "x": "高度およそ六十キロメートルで、パラシュートが開きます。"}, {"t": 465.9, "x": "アンテナが伸び、信号が届き始めました。"}, {"t": 468.96666666666664, "x": "その六分後、パラシュートが裂けました。"}, {"t": 471.7, "x": "裂けたパラシュートは潰れ、"}, {"t": 473.21666666666664, "x": "カプセルは、ほとんど支えのないまま、"}, {"t": 476.05, "x": "さらに二十九分間、落ち続けます。"}, {"t": 479.18333333333334, "x": "地面に着いたときの速さは、秒速およそ十七メートル。"}, {"t": 483.1166666666667, "x": "信号は弱まり、一秒ほど強くなって、"}, {"t": 486.21666666666664, "x": "そのあと、途絶えたように見えました。"}, {"t": 489.0, "x": "あとになって、録音されていた電波の"}, {"t": 491.53333333333336, "x": "記録を、細かく調べ直したところ、信号は、"}, {"t": 495.1166666666667, "x": "途絶えていなかったことが分かります。"}, {"t": 497.4, "x": "衝突のあとも、二十三分間、"}, {"t": 498.71666666666664, "x": "二十三分間█"}, {"t": 499.8666666666667, "x": "非常に弱い信号が、続いていました。"}, {"t": 503.05, "x": "NASAの記録は、その理由を、推測として書いています。"}, {"t": 507.01666666666665, "x": "カプセルは地面で跳ねて、横倒しになったのかもしれない。"}, {"t": 510.8833333333333, "x": "そのため、アンテナが地球の方を向いておらず、"}, {"t": 514.1, "x": "信号が弱くなったのかもしれない。"}, {"t": 516.5666666666667, "x": "弱い信号の中には、温度の数字が入っていました。"}, {"t": 520.3166666666667, "x": "四百七十五度。"}, {"t": 521.75, "x": "地表で、ずっと同じ値を示していました。"}, {"t": 524.8833333333333, "x": "圧力計は、降りる途中で、壊れていました。"}, {"t": 528.4666666666667, "x": "地表の気圧九十二バール、風速、"}, {"t": 531.1833333333333, "x": "秒速二・五メートルという数字は、"}, {"t": 533.8166666666667, "x": "ほかの測定から、計算で導いたものです。"}, {"t": 537.2833333333333, "x": "ベネラ7号は、他の惑星に着陸したあとで、"}, {"t": 540.5333333333333, "x": "データを送ってきた、最初の宇宙機です。"}, {"t": 543.6833333333333, "x": "NASAの記録にも、そう書かれています。"}, {"t": 546.2833333333333, "x": "ただ、その記録は、送られてきた"}, {"t": 548.8666666666667, "x": "その時には、読み取られていませんでした。"}, {"t": 551.5833333333334, "x": "弱すぎて、雑音と見分けがつかなかったからです。"}, {"t": 555.0666666666667, "x": "地球の側がそれを読み取ったのは、あとからでした。"}, {"t": 558.4166666666666, "x": "着陸した場所は、南緯五度、"}, {"t": 560.6166666666667, "x": "東経三百五十一度の付近とされています。"}, {"t": 563.9, "x": "金星の地表で最初に働いた機械は、横倒しかも"}, {"t": 567.5666666666667, "x": "しれない姿のまま、誰にもすぐには聞き取れない声で、"}, {"t": 571.2166666666667, "x": "二十三分間、温度を読み上げていたことになります。"}, {"t": 575.1833333333333, "x": "NASAの解説が、最も短いものは二十三分、と"}, {"t": 579.15, "x": "書いているのは、このベネラ7号のことです。"}, {"t": 582.0833333333334, "x": "十機の中で、最も短い時間でした。"}, {"t": 585.0833333333334, "x": "そして、最初の二十三分でもありました。"}, {"t": 588.1833333333333, "x": "一九七二年三月、ベネラ8号が打ち上げられます。"}, {"t": 589.7333333333333, "x": "ベネラ8号█"}, {"t": 592.6333333333333, "x": "このときも、同じ形の機体が二機作られ、"}, {"t": 595.65, "x": "一機は、地球の軌道を離れられませんでした。"}, {"t": 599.0833333333334, "x": "金星まで、百十七日。"}, {"t": 601.4666666666667, "x": "着く前に、カプセルの中は、"}, {"t": 603.5666666666667, "x": "マイナス十五度まで冷やされました。"}, {"t": 605.9833333333333, "x": "ベネラ8号には、それまでとは違う任務がありました。"}, {"t": 609.5833333333334, "x": "昼の側に降りることです。"}, {"t": 611.3333333333334, "x": "それまでの二機は、夜の側から入っていました。"}, {"t": 614.5833333333334, "x": "ベネラ8号が目指したのは、夜が明けたばかりの場所。"}, {"t": 618.15, "x": "朝と夜の境目から、およそ五百キロメートル、"}, {"t": 621.4666666666667, "x": "昼の側に入った地点です。"}, {"t": 623.6166666666667, "x": "目的の一つは、光を測ることでした。"}, {"t": 626.6, "x": "金星の地面は、どれくらい明るいのか。"}, {"t": 629.5333333333333, "x": "厚い雲の下に、光は届いているのか。"}, {"t": 632.55, "x": "それが分からなければ、次の機体にカメラを"}, {"t": 635.4333333333333, "x": "積んでも、何も写らないかもしれません。"}, {"t": 638.1833333333333, "x": "七月二十二日、ベネラ8号のカプセルは、本体から"}, {"t": 642.5166666666667, "x": "離れ、角度七十七度で、大気に入りました。"}, {"t": 646.25, "x": "入ったときの速さは、秒速十一・六キロメートル。"}, {"t": 649.9833333333333, "x": "それが、空気との摩擦だけで、"}, {"t": 652.1333333333333, "x": "高度六十七キロメートルまでに、"}, {"t": 654.55, "x": "秒速二百五十メートルほどに落ちます。"}, {"t": 657.4, "x": "パラシュートは、高度六十キロメートルで、"}, {"t": 660.2333333333333, "x": "絞ったまま開きました。"}, {"t": 662.05, "x": "カプセルの中では、冷やすための装置が動いていました。"}, {"t": 665.7333333333333, "x": "高度五十キロメートルで測定を始め、"}, {"t": 668.2166666666667, "x": "三十キロメートルでパラシュートを大きく開きます。"}, {"t": 671.5166666666667, "x": "高度三十五キロメートルから三十キロメートルの"}, {"t": 674.4166666666666, "x": "あたりで、光が弱くなるのが記録されました。"}, {"t": 677.5333333333333, "x": "雲の底を、抜けたところです。"}, {"t": 679.8666666666667, "x": "カプセルを運んできた本体は、そのあと、自分の"}, {"t": 683.4833333333333, "x": "測定を送りながら大気に入り、燃え尽きています。"}, {"t": 686.9666666666667, "x": "同じ日、ベネラ8号は着陸します。"}, {"t": 689.8833333333333, "x": "金星のその場所の時刻で、朝の六時二十四分でした。"}, {"t": 693.9, "x": "地表から、六十三分間、データが届きました。"}, {"t": 694.8333333333334, "x": "六十三分間█"}, {"t": 697.8333333333334, "x": "そのあと、厳しい地表の条件のために、機能を"}, {"t": 701.5666666666667, "x": "失った、とNASAの記録にはあります。"}, {"t": 704.0666666666667, "x": "六十三分のあいだに、分かったことがいくつかあります。"}, {"t": 707.7, "x": "温度はおよそ四百七十度、気圧はおよそ九十気圧。"}, {"t": 711.7333333333333, "x": "ベネラ7号の数字は正しかった、ということが、"}, {"t": 715.0333333333333, "x": "確かめられました。"}, {"t": 716.5166666666667, "x": "雲の層では、硫酸が見つかっています。"}, {"t": 719.35, "x": "地面の土を測ったのも、これが最初でした。"}, {"t": 722.5166666666667, "x": "そして、光です。"}, {"t": 724.2166666666667, "x": "ベネラ8号の測定では、地表の明るさは、"}, {"t": 727.3333333333334, "x": "写真を撮るのに足りる、という結果でした。"}, {"t": 730.4833333333333, "x": "NASAの記録は、地球の曇りの日、"}, {"t": 732.9333333333333, "x": "見通し一キロメートルほどの明るさ、と書いています。"}, {"t": 736.8166666666667, "x": "雲の下は、真っ暗ではありませんでした。"}, {"t": 739.6666666666666, "x": "この結果が、次の機体の形を決めました。"}, {"t": 742.8333333333334, "x": "カメラを積む。"}, {"t": 743.8333333333334, "x": "ただし、念のため、照明も積む。"}, {"t": 746.7833333333333, "x": "あとで分かることですが、ベネラ8号が測った明るさは、"}, {"t": 750.5333333333333, "x": "朝の、夜との境目に近い場所の明るさでした。"}, {"t": 754.3333333333334, "x": "昼に近い時刻なら、もっと明るい。"}, {"t": 757.0, "x": "その違いは、次の機体が降りたときに、はっきりします。"}, {"t": 761.05, "x": "一九七五年、ソビエト連邦は、"}, {"t": 764.1833333333333, "x": "まったく新しい形の探査機を送ります。"}, {"t": 767.25, "x": "ベネラ9号とベネラ10号です。"}, {"t": 767.25, "x": "ベネラ9号█"}, {"t": 768.1166666666667, "x": "ベネラ10号█"}, {"t": 769.4333333333333, "x": "それまでの機体とは、大きさが違いました。"}, {"t": 772.4666666666667, "x": "大気に入るときの球体は、直径二・"}, {"t": 775.1166666666667, "x": "四メートル、重さ千五百六十キログラム。"}, {"t": 778.5666666666667, "x": "その中に、高さ二メートル、重さ六百六十キログラムの"}, {"t": 782.9166666666666, "x": "着陸機が、収められていました。"}, {"t": 785.3, "x": "着陸機の芯は、直径およそ八十センチメートルの、"}, {"t": 789.1166666666667, "x": "チタンの球です。"}, {"t": 790.4833333333333, "x": "その外側を、厚さ十二センチメートルの"}, {"t": 793.4166666666666, "x": "断熱材が包んでいます。"}, {"t": 795.05, "x": "中には、熱をため込むための材料が入っていました。"}, {"t": 798.6833333333333, "x": "ソ連の金星画像を調べ直してきた研究者、ドン・"}, {"t": 801.5666666666667, "x": "ドン・ミッチェル█"}, {"t": 802.2333333333333, "x": "ミッチェルの解説によれば、三十度で溶ける塩の一種です。"}, {"t": 806.1, "x": "氷が溶けるあいだ、周りの温度が上がりにくいのと"}, {"t": 809.3666666666667, "x": "同じように、この塩が溶けているあいだ、"}, {"t": 811.9666666666667, "x": "機械の中の温度が上がるのを、遅らせます。"}, {"t": 815.2333333333333, "x": "そして、カメラです。"}, {"t": 816.9833333333333, "x": "カメラは、耐圧の球の内側に置かれていました。"}, {"t": 820.4166666666666, "x": "外が見えるのは、厚さ一センチメートルの、石英の窓だけ。"}, {"t": 824.9833333333333, "x": "カメラは、その窓の中で首を振り、"}, {"t": 827.4833333333333, "x": "横に百八十度、縦に四十度の景色を、"}, {"t": 831.05, "x": "一本の線ずつ、走査して描いていきます。"}, {"t": 834.3, "x": "足元から、地平線まで。"}, {"t": 836.4833333333333, "x": "画像は、小さく作られていました。"}, {"t": 839.05, "x": "横に、五百十二の点。"}, {"t": 841.1666666666666, "x": "ミッチェルの解説では、その理由は、着陸機が"}, {"t": 844.65, "x": "最低でも三十分は生きる、という見積もりにありました。"}, {"t": 848.35, "x": "三十分で送り終えられる大きさに、"}, {"t": 850.7333333333333, "x": "はじめから、絞ってあったのです。"}, {"t": 853.35, "x": "着陸機の周りには、ハロゲンランプが"}, {"t": 855.9666666666667, "x": "四つ、付けられていました。"}, {"t": 857.9166666666666, "x": "ベネラ8号の測定から、地表が"}, {"t": 860.4, "x": "暗かった場合に備えたものです。"}, {"t": 862.4, "x": "もう一つ、新しい工夫がありました。"}, {"t": 865.1833333333333, "x": "着陸機を運んできた本体が、"}, {"t": 867.25, "x": "金星を回る軌道に入ることです。"}, {"t": 869.8666666666667, "x": "着陸機の電波は弱く、地球までは届きません。"}, {"t": 873.5333333333333, "x": "そこで、本体が金星の上空で、中継役になります。"}, {"t": 877.9333333333333, "x": "ベネラ9号と10号の本体は、"}, {"t": 880.0166666666667, "x": "金星を回る、最初の人工衛星になりました。"}, {"t": 883.8833333333333, "x": "ミッチェルの解説によれば、ベネラ9号の"}, {"t": 886.6833333333333, "x": "着陸機は、浅い角度で大気に入り、地球の"}, {"t": 890.3166666666667, "x": "重力のおよそ百七十倍の減速を受けました。"}, {"t": 893.3833333333333, "x": "パラシュートを何段階かに分けて開き、"}, {"t": 895.75, "x": "雲の層を、二十分ほどかけて抜けます。"}, {"t": 898.9666666666667, "x": "雲を抜けてしまえば、熱い空気の中に、"}, {"t": 901.8666666666667, "x": "長くいる理由はありません。"}, {"t": 903.8333333333334, "x": "高度五十キロメートルで、パラシュートは"}, {"t": 906.4333333333333, "x": "切り離されました。"}, {"t": 907.5666666666667, "x": "そこから地面までの五十五分間、"}, {"t": 909.6666666666666, "x": "着陸機は、頭に付けた円盤の形の板が"}, {"t": 913.3, "x": "受ける空気の抵抗だけで、落ちていきます。"}, {"t": 916.1166666666667, "x": "空気が濃いので、それで足ります。"}, {"t": 918.55, "x": "一九七五年十月二十二日、ベネラ9号の着陸機が、ベータ"}, {"t": 924.0833333333334, "x": "地域と呼ばれる高地の近くに降りました。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);

  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

a.ontimeupdate=()=>paint(a.currentTime);
