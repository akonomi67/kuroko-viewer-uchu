<script>
const D={"name": "ep031", "file": "ep031", "dur": 1863.0833125, "segs": [], "subs": [{"t": 0.0, "x": "太陽の北極と南極を真上から"}, {"t": 2.183333333333333, "x": "写した写真は、今も1枚もありません。"}, {"t": 5.033333333333333, "x": "極の上空を初めて飛んだ探査機には、"}, {"t": 7.533333333333333, "x": "カメラが積まれていませんでした。"}, {"t": 9.7, "x": "最初の1枚は2025年、赤道から15度ほど"}, {"t": 13.566666666666666, "x": "下がったななめの位置から撮られました。"}, {"t": 15.616666666666667, "x": "太陽そのものを写した写真は、数えきれないほどあります。"}, {"t": 19.583333333333332, "x": "地上の望遠鏡で撮ったものがあります。"}, {"t": 22.083333333333332, "x": "宇宙の観測機で撮ったものもあります。"}, {"t": 24.45, "x": "黒点の写真や、表面から噴き上がる"}, {"t": 27.166666666666668, "x": "ガスの写真も数多く残っています。"}, {"t": 29.433333333333334, "x": "けれども、それらには一つの共通点があります。"}, {"t": 32.71666666666667, "x": "どれもほぼ同じ面の中から撮られているのです。"}, {"t": 35.583333333333336, "x": "地球は、太陽のまわりの平らな面を回っています。"}, {"t": 39.11666666666667, "x": "ほかの惑星もほぼ同じ面を回っています。"}, {"t": 41.88333333333333, "x": "太陽を見張る観測機も、ほとんどがこの面の中にいます。"}, {"t": 45.833333333333336, "x": "この面と太陽の赤道との傾きは、大きくても約7度です。"}, {"t": 50.266666666666666, "x": "これまでの太陽の姿は、どれも"}, {"t": 52.68333333333333, "x": "赤道の近くから見たものでした。"}, {"t": 54.733333333333334, "x": "太陽の北極と南極は、いつも丸い姿のへりにあります。"}, {"t": 58.9, "x": "へりの近くはななめにつぶれて見えます。"}, {"t": 61.31666666666667, "x": "極のまわりで何が起きているのか。"}, {"t": 63.516666666666666, "x": "横からの姿ではほとんど分かりませんでした。"}, {"t": 66.33333333333333, "x": "極の近くの模様は、細い線のようにしか見えません。"}, {"t": 69.98333333333333, "x": "磁場の向きも、ななめからでは測りにくくなります。"}, {"t": 73.3, "x": "太陽の写真は山ほどあります。"}, {"t": 75.46666666666667, "x": "それでも極は、誰も正面から見たことのない場所でした。"}, {"t": 79.28333333333333, "x": "2025年6月11日。"}, {"t": 81.71666666666667, "x": "ヨーロッパ宇宙機関が新しい画像を公開しました。"}, {"t": 85.06666666666666, "x": "太陽の南極を、惑星の面の外から初めて写した画像です。"}, {"t": 89.56666666666666, "x": "撮ったのはソーラー・オービターという探査機でした。"}, {"t": 92.3, "x": "ただし、真上から撮ったものではありません。"}, {"t": 95.18333333333334, "x": "南極はななめから見えているだけでした。"}, {"t": 97.6, "x": "それでも、これが最初の1枚です。"}, {"t": 100.26666666666667, "x": "太陽の極は、それほど見えにくい場所でした。"}, {"t": 103.45, "x": "カメラを持たずに極の上を飛んだ探査機。"}, {"t": 106.06666666666666, "x": "カメラを持って少しずつ角度を上げている探査機。"}, {"t": 109.05, "x": "この回の記録は、その2機の話です。"}, {"t": 111.91666666666667, "x": "まず、極がなぜ見えにくいのかを確かめておきます。"}, {"t": 115.4, "x": "太陽は大きな球です。"}, {"t": 117.06666666666666, "x": "正面のまんなかの模様は、そのままの形で見えます。"}, {"t": 120.75, "x": "へりに近づくほど模様は横に押しつぶされます。"}, {"t": 123.68333333333334, "x": "同じ大きさの模様でも細い線のようにしか写りません。"}, {"t": 127.16666666666667, "x": "太陽の極は、地球から見ると"}, {"t": 129.5, "x": "いつもこのへりの近くにあります。"}, {"t": 131.43333333333334, "x": "ドイツにマックス・プランク太陽系研究所という"}, {"t": 134.21666666666667, "x": "研究所があります。"}, {"t": 135.45, "x": "その研究所は、発表の中で極の見え方に触れています。"}, {"t": 139.46666666666667, "x": "地上からは極をかすめるような角度でしか見られない。"}, {"t": 142.71666666666667, "x": "ほとんどの探査機も同じように"}, {"t": 144.48333333333332, "x": "限られた見え方しかできない。"}, {"t": 146.25, "x": "地上から見ても、探査機から見ても、"}, {"t": 148.71666666666667, "x": "極はかすめるようにしか見えません。"}, {"t": 151.08333333333334, "x": "問題は見る位置でした。"}, {"t": 152.63333333333333, "x": "2025年12月に出た論文も、この点に触れています。"}, {"t": 156.91666666666666, "x": "測った磁場の値が、見る角度によってどう変わるのか。"}, {"t": 160.55, "x": "論文はそれを論じています。"}, {"t": 162.46666666666667, "x": "そのうえで、極をじかに細かく"}, {"t": 164.73333333333332, "x": "測ることが大切だとしています。"}, {"t": 166.71666666666667, "x": "では、なぜ探査機を極の上へ送らないのか。"}, {"t": 169.86666666666667, "x": "理由は惑星が回る面にあります。"}, {"t": 172.2, "x": "地球から打ち上げた探査機は、"}, {"t": 174.01666666666668, "x": "はじめは地球と同じ面を回ります。"}, {"t": 176.68333333333334, "x": "その面から大きく外れるには、"}, {"t": 178.6, "x": "進む向きを大きく曲げなければなりません。"}, {"t": 181.46666666666667, "x": "ロケットの力だけでそれをするのは簡単ではありません。"}, {"t": 184.8, "x": "そこで使われるのが惑星の重力です。"}, {"t": 187.51666666666668, "x": "探査機を惑星のすぐそばに通します。"}, {"t": 190.01666666666668, "x": "そして、その重力で道筋を曲げてもらいます。"}, {"t": 193.43333333333334, "x": "ヨーロッパ宇宙機関の軌道の"}, {"t": 195.2, "x": "担当者は、こう説明しています。"}, {"t": 197.71666666666667, "x": "惑星にとても近づくことで、その重力を使える。"}, {"t": 201.28333333333333, "x": "燃料をあまり使わずに軌道を変えられる。"}, {"t": 203.88333333333333, "x": "ソーラー・オービターは、この方法で"}, {"t": 206.23333333333332, "x": "金星を何度も使いました。"}, {"t": 208.01666666666668, "x": "その前の探査機は、もっと大きな惑星を使いました。"}, {"t": 211.8, "x": "木星です。"}, {"t": 212.76666666666668, "x": "太陽の極を目指すのに、まず太陽から遠く離れる。"}, {"t": 216.55, "x": "木星まで行って、そこで向きを変える。"}, {"t": 219.31666666666666, "x": "ヨーロッパ宇宙機関の資料にも、こう書かれています。"}, {"t": 222.83333333333334, "x": "木星に出会ったあと、探査機は惑星の面の外へ曲げられた。"}, {"t": 227.05, "x": "遠回りに見えるこの道が、初めて極の"}, {"t": 229.98333333333332, "x": "上を飛んだ探査機の道でした。"}, {"t": 231.78333333333333, "x": "その探査機の名前はユリシーズといいます。"}, {"t": 234.43333333333334, "x": "ギリシャの物語に出てくる英雄の名前です。"}, {"t": 237.26666666666668, "x": "名前の由来は、ヨーロッパ宇宙機関の資料に載っています。"}, {"t": 241.16666666666666, "x": "惑星の面の外へ出るという考えは、"}, {"t": 243.55, "x": "ずっと前からありました。"}, {"t": 245.33333333333334, "x": "ヨーロッパ宇宙機関によると、"}, {"t": 247.11666666666667, "x": "その案は1959年に出されています。"}, {"t": 250.51666666666668, "x": "1970年代のはじめには、ヨーロッパと"}, {"t": 253.91666666666666, "x": "アメリカが一緒に検討を始めます。"}, {"t": 256.1, "x": "最初の形は探査機を2機使うものでした。"}, {"t": 258.93333333333334, "x": "2機はそろって木星へ向かいます。"}, {"t": 261.1166666666667, "x": "木星の重力で、1機は北へ曲げてもらいます。"}, {"t": 264.56666666666666, "x": "もう1機は南へ曲げてもらいます。"}, {"t": 266.78333333333336, "x": "そして太陽の北極と南極の上を、それぞれ飛ぶ計画でした。"}, {"t": 271.1166666666667, "x": "2つの極を、2機で分けて調べる考えです。"}, {"t": 274.4166666666667, "x": "計画は1976年に認められました。"}, {"t": 277.71666666666664, "x": "翌年の1977年には、積む観測装置も決まりました。"}, {"t": 282.48333333333335, "x": "打ち上げは1983年2月の予定とされていました。"}, {"t": 286.4166666666667, "x": "ところが、1980年に計画が変わります。"}, {"t": 290.1, "x": "アメリカ航空宇宙局が2機目の探査機を取りやめたのです。"}, {"t": 293.81666666666666, "x": "ヨーロッパ宇宙機関は、残った1機で"}, {"t": 296.48333333333335, "x": "計画を続けることにしました。"}, {"t": 298.43333333333334, "x": "その1機には、アメリカの観測装置の半分が"}, {"t": 301.68333333333334, "x": "積まれることになりました。"}, {"t": 303.1666666666667, "x": "アメリカ側は別の形でも加わりました。"}, {"t": 305.93333333333334, "x": "打ち上げに使うスペースシャトルを出す。"}, {"t": 308.23333333333335, "x": "探査機の電気をまかなう電池を出す。"}, {"t": 310.6, "x": "遠くの探査機と話す大きなアンテナを使わせる。"}, {"t": 313.65, "x": "アメリカ航空宇宙局の記録には、"}, {"t": 315.9166666666667, "x": "こうした分担が書かれています。"}, {"t": 318.1166666666667, "x": "2つの極を同時に調べる計画はなくなりました。"}, {"t": 321.3666666666667, "x": "残ったのは1機だけです。"}, {"t": 323.01666666666665, "x": "1機で順番に飛ぶ計画になりました。"}, {"t": 325.51666666666665, "x": "まず南極の上を飛びます。"}, {"t": 327.31666666666666, "x": "そのあと太陽の近くを通って、北極の上へ回ります。"}, {"t": 331.25, "x": "一つの極ずつ、時間をずらして調べることになりました。"}, {"t": 335.0833333333333, "x": "打ち上げは1983年からさらに先へ延びました。"}, {"t": 338.8833333333333, "x": "アメリカ航空宇宙局の記録にはこうあります。"}, {"t": 341.8833333333333, "x": "科学の会議が認めてから、13年後の打ち上げだった。"}, {"t": 345.75, "x": "カメラは積まれませんでした。"}, {"t": 347.46666666666664, "x": "ユリシーズが積んだのは、その場で測る装置でした。"}, {"t": 350.85, "x": "太陽の風や磁場を測り、飛んでくる粒を数える装置です。"}, {"t": 355.03333333333336, "x": "写すのではありません。"}, {"t": 356.45, "x": "そこを通り過ぎるものを数える探査機です。"}, {"t": 359.2, "x": "1990年10月6日。"}, {"t": 361.5833333333333, "x": "アメリカで、1機のスペースシャトルが"}, {"t": 364.01666666666665, "x": "打ち上げられました。"}, {"t": 365.1, "x": "名前はディスカバリーです。"}, {"t": 366.71666666666664, "x": "時刻は世界時で11時47分でした。"}, {"t": 369.7, "x": "荷物室にはユリシーズが載っていました。"}, {"t": 372.21666666666664, "x": "宇宙に出たシャトルの荷物室から、"}, {"t": 374.23333333333335, "x": "探査機は外へ送り出されました。"}, {"t": 376.6666666666667, "x": "そのあと上段のロケットに火がつきます。"}, {"t": 379.1166666666667, "x": "打ち上げから約7時間半。"}, {"t": 381.0, "x": "ユリシーズは太陽を回る道に入りました。"}, {"t": 383.8, "x": "地球を離れたときの速さは秒速約15.4キロメートルです。"}, {"t": 388.1666666666667, "x": "探査機の重さは約367キログラムでした。"}, {"t": 391.6333333333333, "x": "大きさは、縦と横が3メートルあまりです。"}, {"t": 394.65, "x": "高さは約2メートルです。"}, {"t": 396.4, "x": "電気は太陽電池では作りません。"}, {"t": 398.68333333333334, "x": "木星のあたりまで離れる旅です。"}, {"t": 400.93333333333334, "x": "積まれたのは原子力の電池でした。"}, {"t": 403.18333333333334, "x": "放射性の物質が出す熱から、電気を作る電池です。"}, {"t": 407.0833333333333, "x": "積まれた観測装置の名前は10を超えます。"}, {"t": 409.9166666666667, "x": "磁場を測る装置があります。"}, {"t": 411.75, "x": "太陽の風の粒を数える装置があります。"}, {"t": 414.55, "x": "電波を聞く装置もあります。"}, {"t": 416.35, "x": "宇宙のちりを受け止める装置もありました。"}, {"t": 418.93333333333334, "x": "けれども、写真を撮る装置は一つもありませんでした。"}, {"t": 422.53333333333336, "x": "ヨーロッパ宇宙機関の資料にも、カメラは載っていません。"}, {"t": 426.23333333333335, "x": "2025年の発表にも書かれています。"}, {"t": 428.96666666666664, "x": "ユリシーズは極の上を飛んだが、 6666666666, "x": "よると約3億キロメートルです。"}, {"t": 548.65, "x": "地球と太陽の間の2倍ほどです。"}, {"t": 551.0, "x": "それでも、そこは誰も行ったことのない場所でした。"}, {"t": 554.25, "x": "太陽を真上から見下ろす方向の空です。"}, {"t": 556.9666666666667, "x": "そこへ行った物は、それまで一つもありませんでした。"}, {"t": 560.4333333333333, "x": "近さではなく、角度が新しかったのです。"}, {"t": 563.5, "x": "木星を離れたユリシーズは、"}, {"t": 565.35, "x": "太陽の南へ向かって落ちていきました。"}, {"t": 568.1166666666667, "x": "南極の上の空へ着くまでに、2年あまりかかります。"}, {"t": 571.8, "x": "その間も、探査機は太陽の風を測り続けました。"}, {"t": 575.6333333333333, "x": "赤道の近くでは、遅い風と速い風が入りまじっていました。"}, {"t": 579.8, "x": "1993年には、その帯は南の35度まで広がっていました。"}, {"t": 585.0333333333333, "x": "南へ進むと、様子が変わっていきます。"}, {"t": 587.95, "x": "入りまじった帯を抜けると、"}, {"t": 589.5666666666667, "x": "速い風だけが吹く空に入りました。"}, {"t": 592.2333333333333, "x": "アメリカ航空宇宙局の記録が残っています。"}, {"t": 595.2166666666667, "x": "南の極の空に入ったのは、1994年6月26日でした。"}, {"t": 600.6166666666667, "x": "11月6日まで飛び続けました。"}, {"t": 603.0, "x": "太陽の緯度で70度より南の空です。"}, {"t": 605.8, "x": "9月には最も南の80.2度に達しました。"}, {"t": 609.1333333333333, "x": "人の作った物が、初めて太陽の極の上に来た日々でした。"}, {"t": 613.2666666666667, "x": "その日々の記録は、写真ではありません。"}, {"t": 616.0666666666667, "x": "数字の列として地球に届きました。"}, {"t": 618.45, "x": "南極の上の空で、ユリシーズは何を測ったのか。"}, {"t": 622.0166666666667, "x": "いちばんはっきりした答えは風の速さでした。"}, {"t": 624.7833333333333, "x": "太陽からは、電気を帯びた粒の"}, {"t": 627.1833333333333, "x": "流れが絶えず吹き出しています。"}, {"t": 628.95, "x": "これが太陽の風です。"}, {"t": 630.5666666666667, "x": "極の上で受けた風は、そろった速い流れでした。"}, {"t": 633.9666666666667, "x": "平均の速さは秒速約750キロメートルです。"}, {"t": 637.5833333333334, "x": "赤道のあたりの風は秒速約350キロメートルでした。"}, {"t": 641.6333333333333, "x": "極の風は、赤道の風の2倍あまり速かったのです。"}, {"t": 645.4333333333333, "x": "速い風は極の上だけにとどまりませんでした。"}, {"t": 648.35, "x": "太陽の影響が届く空間の約3分の2を満たしていました。"}, {"t": 652.2333333333333, "x": "この風の出どころは、極の近くの温度の低い場所です。"}, {"t": 656.0166666666667, "x": "コロナホールと呼ばれています。"}, {"t": 657.8166666666667, "x": "極の風は粒の数が少ない風でした。"}, {"t": 660.4333333333333, "x": "そのかわり、温度が高く、押す力も強いと測られました。"}, {"t": 664.9333333333333, "x": "極から極へ駆け抜けた間の記録もあります。"}, {"t": 667.76666666666 た瞬間でした。"}, {"t": 1359.05, "x": "この接近で、道筋の傾きは約7.7度から"}, {"t": 1362.7, "x": "約17度に上がりました。"}, {"t": 1364.3666666666666, "x": "予定表に並ぶ金星への接近は、"}, {"t": 1366.7333333333333, "x": "これから先の分も合わせて8回です。"}, {"t": 1369.4166666666667, "x": "17度は、その階段の最初の1段でした。"}, {"t": 1372.6666666666667, "x": "研究者のダニエル・ミュラーは、"}, {"t": 1374.35, "x": "これを天への階段にたとえました。"}, {"t": 1376.8166666666666, "x": "その第一歩だ、と。"}, {"t": 1378.5166666666667, "x": "2025年3月16日から17日。"}, {"t": 1381.7833333333333, "x": "ソーラー・オービターは、赤道から"}, {"t": 1384.0333333333333, "x": "15度下がった場所にいました。"}, {"t": 1385.85, "x": "ここで初めて、高い角度からの観測が行われました。"}, {"t": 1389.8333333333333, "x": "使われたのは3つの装置です。"}, {"t": 1391.9, "x": "1つ目は、見える光で太陽を写す装置です。"}, {"t": 1395.3166666666666, "x": "表面の磁場の地図も作ります。"}, {"t": 1397.4, "x": "2つ目は、紫外線でコロナを写す装置です。"}, {"t": 1400.6833333333334, "x": "コロナは、100万度のガスでできた太陽の外側の大気です。"}, {"t": 1404.75, "x": "3つ目は、温度ごとに違う光を分ける装置です。"}, {"t": 1408.3166666666666, "x": "大気の層を分けて調べます。"}, {"t": 1410.25, "x": "3月23日。"}, {"t": 1411.85, "x": "探査機は17度下がったところにいました。"}, {"t": 1414.4833333333333, "x": "南極をじかに見られる角度です。"}, {"t": 1416.6666666666667, "x": "6月11日。"}, {"t": 1418.1833333333334, "x": "その画像が公開されました。"}, {"t": 1420.1333333333334, "x": "地球からの見え方と並べた動画も公開されました。"}, {"t": 1423.4333333333334, "x": "同じ太陽を、2つの場所から見比べたものです。"}, {"t": 1426.85, "x": "キャロル・マンデルは、ヨーロッパ宇宙機関で"}, {"t": 1429.5, "x": "科学部門を率いる人物です。"}, {"t": 1431.5333333333333, "x": "彼女はこう述べています。"}, {"t": 1433.1666666666667, "x": "今日、人類が初めて見る太陽の極を明らかにする。"}, {"t": 1436.9333333333334, "x": "磁場の地図を作った装置の責任者は、サミ・ソランキです。"}, {"t": 1440.7833333333333, "x": "彼は、極のことをこう言い表しました。"}, {"t": 1443.65, "x": "太陽の極は、文字どおり未知の土地だ。"}, {"t": 1446.5166666666667, "x": "彼はそう話しました。"}, {"t": 1448.0166666666667, "x": "公開された磁場の地図もあります。"}, {"t": 1450.15, "x": "2月11日から4月29日までの記録をまとめたものです。"}, {"t": 1454.3666666666666, "x": "太陽の表面が青と赤で塗り分けられています。"}, {"t": 1457.4, "x": "青は、磁場が探査機の方を向いている場所。"}, {"t": 1460.4666666666667, "x": "赤は反対を向いている場所です。"}, {"t": 1462.5833333333333, "x": "色が濃いほど磁場が強いことを表します。"}, {"t": 1465.316666666 ": "1種の目印になると述べています。"}, {"t": 1686.1666666666667, "x": "ただし、研究者たちは注意も添えています。"}, {"t": 1689.3, "x": "今回の記録は、長い周期の中の"}, {"t": 1691.9333333333334, "x": "ほんの短い一場面にすぎない。"}, {"t": 1693.9, "x": "極の近くで流れが遅くなるのかどうかは、まだ分からない。"}, {"t": 1697.7833333333333, "x": "2025年12月。"}, {"t": 1699.6, "x": "別の研究も出されました。"}, {"t": 1701.4166666666667, "x": "北と南の極の磁場を、およそ1か月の"}, {"t": 1704.4166666666667, "x": "間をおいて測ったものです。"}, {"t": 1706.15, "x": "探査機がいたのは、緯度14.9度から16.7度の場所です。"}, {"t": 1710.6833333333334, "x": "南極は42組の記録から調べられました。"}, {"t": 1713.7666666666667, "x": "北極は8組の記録からです。"}, {"t": 1715.9, "x": "北の極は記録が少なく、そのぶん"}, {"t": 1718.5166666666667, "x": "不確かさも大きいとされました。"}, {"t": 1720.35, "x": "それでも、北と南の極では磁場の"}, {"t": 1722.9666666666667, "x": "分かれ方が違っていました。"}, {"t": 1724.6166666666666, "x": "北の極のまわりの方が、磁場の量が多く測られています。"}, {"t": 1728.5666666666666, "x": "北では、緯度65度から85度の間を見ています。"}, {"t": 1732.55, "x": "そこでは一つの向きの磁場が多くなっていました。"}, {"t": 1735.4833333333333, "x": "向きの片寄りも、北の方が大きく見えました。"}, {"t": 1738.75, "x": "論文は、高い緯度からじかに"}, {"t": 1740.9166666666667, "x": "測ることの大切さを述べています。"}, {"t": 1743.0833333333333, "x": "ユリシーズが数字で見た北と南の違い。"}, {"t": 1745.8, "x": "それを地図の上で確かめる作業が始まっています。"}, {"t": 1748.8833333333334, "x": "2025年2月から、ソーラー・オービターは"}, {"t": 1751.9, "x": "17度の傾きで回っています。"}, {"t": 1753.9833333333333, "x": "次の金星への接近は、2026年12月24日の予定です。"}, {"t": 1759.2, "x": "傾きは24度に上がる予定です。"}, {"t": 1761.65, "x": "ここから高い緯度を見る任務が始まるとされています。"}, {"t": 1764.8333333333333, "x": "10台の観測装置は、この先も"}, {"t": 1767.35, "x": "そろって記録を集めていく予定です。"}, {"t": 1769.55, "x": "さらに延長された任務では、33度に達する計画です。"}, {"t": 1773.8666666666666, "x": "2029年6月10日の金星への接近によるものです。"}, {"t": 1777.9, "x": "ヨーロッパ宇宙機関は2025年の"}, {"t": 1780.3, "x": "発表で、こう見通していました。"}, {"t": 1782.65, "x": "太陽の活動が次に最も静かになるのは、5年から6年先。"}, {"t": 1787.3166666666666, "x": "そのころ、極の磁場は最も整った"}, {"t": 1789.9666666666667, "x": "形になると考えられています。"}, {"t": 1791.95, "x": "向きの入れかわりは、やがて終わります。"}, {"t": 1794.6166666666666, "x": "そのあと極は、少しずつ一つの色に"}, {"t": 1797.2666666666667, "x": "寄っていくとされています。"}, {"t": 1798.65, "x": "33度からなら、17度のときより"}, {"t": 1801.4333333333334, "x": "正面に近い向きで極を見られます。"}, {"t": 1803.6833333333334, "x": "それでも真上ではありません。"}, {"t": 1805.4166666666667, "x": "ユリシーズは約80度の高さまで行きました。"}, {"t": 1808.2833333333333, "x": "極のほぼ上です。"}, {"t": 1809.6, "x": "けれども、カメラを持っていませんでした。"}, {"t": 1812.2666666666667, "x": "ソーラー・オービターはカメラを持っています。"}, {"t": 1814.65, "x": "けれども、今の計画で最も高い傾きは33度です。"}, {"t": 1818.9333333333334, "x": "極の真上を飛んだ探査機。"}, {"t": 1820.8, "x": "極を写せる探査機。"}, {"t": 1822.4166666666667, "x": "今のところ、2つは別々です。"}, {"t": 1824.9833333333333, "x": "惑星の面の外へ出るという案は、1959年に出されました。"}, {"t": 1829.85, "x": "それから60年あまりがたちました。"}, {"t": 1832.1833333333334, "x": "太陽の極を真上から見下ろした"}, {"t": 1834.2333333333333, "x": "1枚は、まだ撮られていません。"}, {"t": 1836.4, "x": "ユリシーズは極の上を飛びました。"}, {"t": 1838.5833333333333, "x": "ソーラー・オービターは極を写しました。"}, {"t": 1840.9, "x": "その両方をやりとげた探査機は、まだありません。"}, {"t": 1844.1666666666667, "x": "人類が持っている極の画像は、2025年からのものです。"}, {"t": 1848.3833333333334, "x": "どれも15度から17度ほどのななめから撮られています。"}, {"t": 1851.8, "x": "赤と青が入りまじった姿です。"}, {"t": 1853.9166666666667, "x": "最初に写った太陽の南極は、"}, {"t": 1856.0, "x": "整った形ではありませんでした。"}, {"t": 1858.4, "x": "ちょうど向きを入れかえている途中の、まだらの姿でした。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
