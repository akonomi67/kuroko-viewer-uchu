<script>
const D={"name": "ep032", "file": "ep032", "dur": 1845.31665625, "segs": [], "subs": [{"t": 0.0, "x": "木星の雲より下の景色を、写真で見た人はいません。"}, {"t": 3.8333333333333335, "x": "雲の中へ入っていった探査機は、これまでに1機だけです。"}, {"t": 7.7, "x": "その1機は、カメラを持たずに飛んでいきました。"}, {"t": 10.8, "x": "木星の写真そのものは、たくさんあります。"}, {"t": 13.866666666666667, "x": "しまもようの雲。"}, {"t": 15.1, "x": "大きな赤い渦。"}, {"t": 16.333333333333332, "x": "近くを通った探査機が、何度も写してきました。"}, {"t": 19.75, "x": "1970年代には、パイオニアと"}, {"t": 22.733333333333334, "x": "ボイジャーがそばを通りました。"}, {"t": 24.383333333333333, "x": "どれもあっという間に通り過ぎていきました。"}, {"t": 26.866666666666667, "x": "けれども写っているのは、どれも雲のてっぺんです。"}, {"t": 30.133333333333333, "x": "木星には、降り立つための地面がありません。"}, {"t": 33.2, "x": "雲の下にあるのは、さらに濃くなっていく気体です。"}, {"t": 36.53333333333333, "x": "深く行くほど圧力は上がります。"}, {"t": 38.63333333333333, "x": "温度も上がっていきます。"}, {"t": 40.15, "x": "外から見えるのは、いちばん上の層だけでした。"}, {"t": 43.4, "x": "1995年12月7日。"}, {"t": 46.016666666666666, "x": "円すいの形をした小さな機体が、"}, {"t": 48.233333333333334, "x": "木星の大気に飛び込みました。"}, {"t": 50.583333333333336, "x": "名前はガリレオ・プローブ。"}, {"t": 52.2, "x": "重さは339キロです。"}, {"t": 54.5, "x": "この機体はパラシュートで雲の中を降りました。"}, {"t": 57.3, "x": "降りながら、測った数字を送り続けました。"}, {"t": 60.38333333333333, "x": "送ってきた時間は58分間です。"}, {"t": 62.88333333333333, "x": "そのあと声は止まりました。"}, {"t": 64.63333333333334, "x": "機体はそのまま沈んでいきました。"}, {"t": 66.75, "x": "NASAは、翌朝までに機体が"}, {"t": 68.81666666666666, "x": "熱で蒸発したと見積もっています。"}, {"t": 70.95, "x": "木星の中から届いたものは、写真ではありません。"}, {"t": 74.43333333333334, "x": "温度。"}, {"t": 75.55, "x": "圧力。"}, {"t": 76.66666666666667, "x": "風の速さ。"}, {"t": 77.71666666666667, "x": "気体の中身。"}, {"t": 78.8, "x": "58分ぶんの数字の列です。"}, {"t": 81.01666666666667, "x": "この回の記録は、その数字が届くまでの話です。"}, {"t": 84.61666666666666, "x": "プローブが入る1年5か月前のことです。"}, {"t": 87.41666666666667, "x": "木星には、すでに別のものが落ちていました。"}, {"t": 90.63333333333334, "x": "シューメーカー・レビー第九彗星という彗星です。"}, {"t": 93.66666666666667, "x": "この彗星は木星の重力で、いくつもの"}, {"t": 96.7, "x": "かけらに割れていました。"}, {"t": 98.03333333333333, "x": "かけらは1994年7月16日から次々とぶつかりました。"}, {"t": 102.81666666666666, "x": "最後のかけらが落ちたのは7月22日です。"}, {"t": 106.0, "x": "ぶつかった場所は、木星の夜の側でした。"}, {"t": 109.0, "x": "地球からはちょうど見えない側です。"}, {"t": 111.2, "x": "そのとき、1機の探査機が木星へ向かう途中にいました。"}, {"t": 115.15, "x": "ガリレオ探査機です。"}, {"t": 116.53333333333333, "x": "いた場所は、地球から見る向きと"}, {"t": 118.78333333333333, "x": "およそ40度ずれていました。"}, {"t": 120.48333333333333, "x": "そのため夜の側をまっすぐ見ることができました。"}, {"t": 123.41666666666667, "x": "7月22日の木星までの距離は、約2億3800万キロ。"}, {"t": 128.35, "x": "地球からは、約6億2100万キロ離れていました。"}, {"t": 132.26666666666668, "x": "ガリレオのカメラは、かけらが"}, {"t": 134.23333333333332, "x": "ぶつかる瞬間の光を記録しました。"}, {"t": 136.51666666666668, "x": "ぶつかった場所そのものを写せたのは、"}, {"t": 138.63333333333333, "x": "このカメラだけでした。"}, {"t": 140.28333333333333, "x": "記録はいったん機体のテープにため込まれました。"}, {"t": 143.06666666666666, "x": "そして選びながら少しずつ地球へ送り返されました。"}, {"t": 146.4, "x": "この探査機には、もう一つの"}, {"t": 148.48333333333332, "x": "機体が取りつけられていました。"}, {"t": 150.23333333333332, "x": "小さな円すいの形をしたプローブです。"}, {"t": 152.78333333333333, "x": "彗星のかけらは、外から来て木星に落ちたものです。"}, {"t": 156.53333333333333, "x": "プローブは、木星の中を測るために"}, {"t": 159.16666666666666, "x": "人がわざと落とすものです。"}, {"t": 160.76666666666668, "x": "落ちたあとに何が残るかではありません。"}, {"t": 163.16666666666666, "x": "落ちながら何を測るか。"}, {"t": 164.83333333333334, "x": "プローブの仕事はそこにありました。"}, {"t": 166.98333333333332, "x": "ガリレオ探査機は、2つの機体を組み合わせたものでした。"}, {"t": 170.68333333333334, "x": "一つは木星のまわりを回る母船です。"}, {"t": 173.26666666666668, "x": "もう一つが、大気に入るプローブでした。"}, {"t": 176.1, "x": "打ち上げは1989年10月18日。"}, {"t": 179.66666666666666, "x": "スペースシャトル・アトランティスの"}, {"t": 181.23333333333332, "x": "荷台から宇宙へ放たれました。"}, {"t": 183.11666666666667, "x": "計画が正式に始まったのは1977年です。"}, {"t": 186.98333333333332, "x": "はじめの計画では、木星までまっすぐ飛ぶはずでした。"}, {"t": 190.68333333333334, "x": "かかる時間は2年半ほどの見込みです。"}, {"t": 193.15, "x": "ところが1986年にスペースシャトル・"}, {"t": 196.05, "x": "チャレンジャーの事故が起きました。"}, {"t": 197.71666666666667, "x": "そのあと、シャトルから探査機を押し出す"}, {"t": 200.3, "x": "ロケットが別のものに替えられました。"}, {"t": 202.38333333333333, "x": "このロケットでは、木星へまっすぐ向かう"}, {"t": 205.06666666666666, "x": "道を使えませんでした。"}, {"t": 206.58333333333334, "x": "そこで考え出されたのが、遠回りの道です。"}, {"t": 209.81666666666666, "x": "まず金星のそばを通ります。"}, {"t": 211.71666666666667, "x": "次に地球のそばを2回通ります。"}, {"t": 214.03333333333333, "x": "惑星のそばを通るたびに、その重力を"}, {"t": 216.9, "x": "借りて速さを足していく道でした。"}, {"t": 218.9, "x": "金星のそばを通ったのは1990年2月10日です。"}, {"t": 222.76666666666668, "x": "旅の途中では、2つの小惑星のそばも通りました。"}, {"t": 226.55, "x": "一つはガスプラ。"}, {"t": 227.68333333333334, "x": "もう一つはイダです。"}, {"t": 229.03333333333333, "x": "2つの小惑星のすぐそばを通った"}, {"t": 231.23333333333332, "x": "探査機は、ガリレオが初めてでした。"}, {"t": 233.75, "x": "イダの写真からは、まわりを"}, {"t": 235.73333333333332, "x": "回る小さな月も見つかりました。"}, {"t": 237.8, "x": "のちにダクティルと名づけられています。"}, {"t": 239.96666666666667, "x": "こうして木星までは6年の旅になりました。"}, {"t": 242.8, "x": "計画全体の費用は、13億5000万ドルあまり。"}, {"t": 246.58333333333334, "x": "1997年に終わるまでの見積もりです。"}, {"t": 249.83333333333334, "x": "母船の観測装置は、全部で10台です。"}, {"t": 252.93333333333334, "x": "カメラもその一つです。"}, {"t": 254.46666666666667, "x": "プローブの大きさは、直径127センチ。"}, {"t": 257.8833333333333, "x": "高さは91センチです。"}, {"t": 259.81666666666666, "x": "前には熱から身を守る盾がついています。"}, {"t": 262.5833333333333, "x": "後ろにも覆いがついています。"}, {"t": 264.45, "x": "盾と覆いを合わせた外側は、減速のための殻です。"}, {"t": 268.25, "x": "その中に、測る装置を積んだ部分が収まっていました。"}, {"t": 272.05, "x": "殻の中には、たたんだパラシュートも入っています。"}, {"t": 275.31666666666666, "x": "339キロのうち、装置の重さは30キロでした。"}, {"t": 279.65, "x": "残りの大部分は、装置を木星の中まで運ぶための重さです。"}, {"t": 284.1, "x": "積まれた装置は7つでした。"}, {"t": 285.95, "x": "1つ目は、大気の温度と圧力と密度を測る装置。"}, {"t": 289.71666666666664, "x": "2つ目は、気体の中身を重さごとに分けて調べます。"}, {"t": 293.43333333333334, "x": "3つ目は、ヘリウムの量だけを測る専用の計器。"}, {"t": 297.06666666666666, "x": "4つ目は、雲の粒を光で数える仕組みです。"}, {"t": 300.46666666666664, "x": "5つ目は、上と下から来る光と熱の量をはかります。"}, {"t": 304.3, "x": "6つ目は、稲妻の光と電波、まわりの粒子を測る装置。"}, {"t": 309.03333333333336, "x": "7つ目は、電波の高さのずれから"}, {"t": 311.46666666666664, "x": "風の速さを割り出す実験です。"}, {"t": 313.53333333333336, "x": "この7つの中に、写真を撮る装置はありません。"}, {"t": 316.9, "x": "プローブの仕事は、木星の大気を調べることでした。"}, {"t": 320.6333333333333, "x": "何でできているかを、じかに確かめるのです。"}, {"t": 323.6166666666667, "x": "それまでの数字は、遠くから"}, {"t": 325.71666666666664, "x": "光を分けて見積もったものです。"}, {"t": 327.6666666666667, "x": "いくつかの元素の量は、はっきりしていませんでした。"}, {"t": 331.06666666666666, "x": "中に入ってその場で測る。"}, {"t": 332.85, "x": "それができる機体は、プローブのほかにありませんでした。"}, {"t": 336.3833333333333, "x": "外側の惑星をその場で測るのは、これが初めてです。"}, {"t": 340.28333333333336, "x": "設計と製造を受け持ったのはヒューズ社です。"}, {"t": 343.01666666666665, "x": "計画はNASAのエイムズ研究センターがまとめました。"}, {"t": 346.1666666666667, "x": "母船とプローブの研究には、6つの国が加わりました。"}, {"t": 350.1, "x": "科学者の数は100人を超えます。"}, {"t": 352.3, "x": "1995年7月13日。"}, {"t": 355.18333333333334, "x": "木星まで、まだ150日ほどある地点でした。"}, {"t": 358.6666666666667, "x": "距離にすると約8000万キロ手前です。"}, {"t": 361.2, "x": "ここで母船とプローブは切り離されました。"}, {"t": 363.76666666666665, "x": "切り離す前に、母船は回る速さを"}, {"t": 366.53333333333336, "x": "1分間に10回転まで上げました。"}, {"t": 368.76666666666665, "x": "回る速さを上げると、向きがぶれにくくなります。"}, {"t": 372.1333333333333, "x": "プローブの先は、木星の入り口の点に向けられていました。"}, {"t": 376.15, "x": "2つをつなぐ電線は、ギロチンのような刃で"}, {"t": 379.1666666666667, "x": "断ち切られました。"}, {"t": 380.2, "x": "ここから先、プローブは5か月の"}, {"t": 382.6166666666667, "x": "間ひとりで木星へ向かいます。"}, {"t": 384.55, "x": "切り離された日の向きのまま、"}, {"t": 386.26666666666665, "x": "木星の決まった場所をめざしました。"}, {"t": 388.8, "x": "旅の間、プローブはほとんど眠っています。"}, {"t": 391.85, "x": "電気をためておく電池はリチウムと硫黄を使ったものです。"}, {"t": 395.3666666666667, "x": "ためられる電気の量は730ワット時でした。"}, {"t": 398.48333333333335, "x": "目を覚ますのは木星の大気に入る6時間前。"}, {"t": 401.6166666666667, "x": "機体の中の指令の装置が、その時刻に"}, {"t": 404.51666666666665, "x": "合図を出す仕組みでした。"}, {"t": 405.98333333333335, "x": "母船のほうには、まだ大事な作業が残っていました。"}, {"t": 409.5, "x": "それまで母船は、主エンジンを"}, {"t": 411.68333333333334, "x": "一度も噴かしたことがなかったのです。"}, {"t": 413.76666666666665, "x": "理由はプローブの取りつけ位置にありました。"}, {"t": 416.31666666666666, "x": "プローブは、エンジンの噴き出し"}, {"t": 418.3666666666667, "x": "口の前にのせられていたのです。"}, {"t": 420.3, "x": "プローブがいる間は、エンジンを"}, {"t": 422.51666666666665, "x": "試すこともできませんでした。"}, {"t": 424.23333333333335, "x": "切り離しから2週間後の7月27日。"}, {"t": 427.3833333333333, "x": "まず2秒だけ、目を覚まさせるための噴射が行われました。"}, {"t": 431.45, "x": "続いて本番の噴射です。"}, {"t": 433.25, "x": "噴かした時間は約5分。"}, {"t": 434.9, "x": "エンジンはドイツで作られたものでした。"}, {"t": 437.23333333333335, "x": "押す力は400ニュートン。"}, {"t": 438.96666666666664, "x": "40キロほどの物を持ち上げるくらいの力です。"}, {"t": 442.06666666666666, "x": "それでも5分噴かせば、速さは"}, {"t": 444.35, "x": "秒速約62メートル変わりました。"}, {"t": 446.81666666666666, "x": "時速に直せば、220キロほどの変化です。"}, {"t": 450.26666666666665, "x": "12月の大きな噴射の前の、予行演習でもありました。"}, {"t": 454.35, "x": "このままでは、母船もプローブと"}, {"t": 456.6, "x": "同じように木星へぶつかる道にいました。"}, {"t": 459.1166666666667, "x": "この噴射で、母船はぶつかる道から外れました。"}, {"t": 462.53333333333336, "x": "プローブの声を上空で受け取れる道へ移ったのです。"}, {"t": 465.85, "x": "木星の大気の中のプローブは、"}, {"t": 467.8666666666667, "x": "地球へ直接は話しかけません。"}, {"t": 470.28333333333336, "x": "声を聞くのは、頭上を通る母船です。"}, {"t": 473.1333333333333, "x": "母船はその声を記録します。"}, {"t": 475.1666666666667, "x": "そしてあとで地球へ送り直します。"}, {"t": 477.5, "x": "その日、母船はプローブの声を上空で受け取ります。"}, {"t": 481.21666666666664, "x": "離れている距離は約21万キロです。"}, {"t": 483.9, "x": "母船には、その日もう一つ大事な仕事がありました。"}, {"t": 487.4, "x": "プローブの声を聞き終えたあと、"}, {"t": 489.26666666666665, "x": "再び主エンジンを噴かすことです。"}, {"t": 491.65, "x": "今度の噴射は40分あまり。"}, {"t": 493.76666666666665, "x": "これで木星を回る軌道に入ります。"}, {"t": 496.23333333333335, "x": "うまくいかなければ、母船は木星を通り過ぎてしまいます。"}, {"t": 500.28333333333336, "x": "12月7日は、プローブにとっても"}, {"t": 502.75, "x": "母船にとっても一度きりの日でした。"}, {"t": 504.8666666666667, "x": "母船には、旅の途中から抱えていた問題がありました。"}, {"t": 508.6166666666667, "x": "地球へ記録を送るためのアンテナです。"}, {"t": 511.06666666666666, "x": "母船のてっぺんには、傘のように"}, {"t": 513.3333333333334, "x": "開く大きなアンテナがありました。"}, {"t": 515.2833333333333, "x": "開いたときの幅は4.8メートル。"}, {"t": 517.7, "x": "金属の細い網を、18本の骨で広げる作りです。"}, {"t": 521.7166666666667, "x": "1秒に13万4400ビットの記録を送れる作りでした。"}, {"t": 525.9166666666666, "x": "ただこのアンテナは熱に弱いものでした。"}, {"t": 528.3666666666667, "x": "遠回りの道では、金星のそばまで太陽に近づきます。"}, {"t": 532.3166666666667, "x": "そのため太陽から十分に離れるまで"}, {"t": 534.6333333333333, "x": "閉じたままにされました。"}, {"t": 536.0, "x": "1991年4月11日。"}, {"t": 538.9166666666666, "x": "母船は、アンテナを開く命令を実行しました。"}, {"t": 542.4, "x": "けれども、命令どおりにはいきませんでした。"}, {"t": 545.35, "x": "数分後に届いた記録が、異常を知らせていました。"}, {"t": 548.8666666666667, "x": "開くためのモーターが止まっていました。"}, {"t": 551.1166666666667, "x": "アンテナは途中までしか開いていません。"}, {"t": 553.5333333333333, "x": "100人を超える技術者が原因を調べました。"}, {"t": 556.5166666666667, "x": "地上には、同じ作りの予備のアンテナがありました。"}, {"t": 559.95, "x": "それを使って試験がくり返されました。"}, {"t": 562.4, "x": "見えてきたのは、数本の骨が"}, {"t": 564.55, "x": "引っかかっているという姿です。"}, {"t": 566.35, "x": "骨の付け根のピンと受け口が"}, {"t": 568.1166666666667, "x": "こすれて、動かなくなっていました。"}, {"t": 570.55, "x": "ピンには、すべりをよくする"}, {"t": 572.4333333333333, "x": "乾いた潤滑剤がつけてありました。"}, {"t": 574.6666666666666, "x": "それが、はがれていたとみられています。"}, {"t": 577.2666666666667, "x": "原因と考えられたのは、トラックでの長い輸送です。"}, {"t": 580.9, "x": "アンテナは、アメリカの東と"}, {"t": 582.9333333333333, "x": "西をトラックで何度も行き来していました。"}, {"t": 585.3333333333334, "x": "その揺れで、潤滑剤が失われたとされています。"}, {"t": 588.8333333333334, "x": "チームは、母船を太陽に向けたりそむけたりしました。"}, {"t": 592.45, "x": "温めたり冷やしたりして、骨を外そうとしたのです。"}, {"t": 596.0833333333334, "x": "1992年の暮れからは、モーターを"}, {"t": 599.2333333333333, "x": "何度も入れたり切ったりしました。"}, {"t": 601.0666666666667, "x": "その回数は1万3000回を超えました。"}, {"t": 603.8666666666667, "x": "それでも骨は外れませんでした。"}, {"t": 605.9833333333333, "x": "使えるのは、熱に強い小さなアンテナだけになりました。"}, {"t": 609.8, "x": "そのままでは、木星から送れる記録は"}, {"t": 612.5833333333334, "x": "1秒に8から16ビットです。"}, {"t": 614.6666666666666, "x": "大きなアンテナの、1万分の1ほどしかありません。"}, {"t": 618.2, "x": "そこで頼りにされたのが、母船のテープレコーダーでした。"}, {"t": 621.8833333333333, "x": "記録をいったんテープにためておく。"}, {"t": 624.0, "x": "あとで縮めて、少しずつ地球へ送る。"}, {"t": 626.9166666666666, "x": "そういうやり方に切り替えられました。"}, {"t": 629.15, "x": "機体のプログラムを作り直します。"}, {"t": 631.4166666666666, "x": "地上で受ける側の設備も手直しします。"}, {"t": 634.1, "x": "こうして1秒に160ビットまで上げる"}, {"t": 636.65, "x": "計画が立てられました。"}, {"t": 638.0833333333334, "x": "それでも大きなアンテナの800分の1ほどです。"}, {"t": 641.15, "x": "ただはじめの目標の7割以上は"}, {"t": 643.3333333333334, "x": "果たせる見込みだとされました。"}, {"t": 645.0833333333334, "x": "1995年10月11日。"}, {"t": 647.9666666666667, "x": "木星に着く2か月前のことです。"}, {"t": 650.3, "x": "母船は木星の姿を1枚写して、テープに記録しました。"}, {"t": 654.5333333333333, "x": "そのあとテープを巻き戻す命令が出されました。"}, {"t": 657.4166666666666, "x": "ところが、巻き戻しが止まりませんでした。"}, {"t": 660.3, "x": "テープは約15時間、動かないまま"}, {"t": 662.95, "x": "押さえつけられていました。"}, {"t": 664.3666666666667, "x": "1週間後、テープレコーダーは"}, {"t": 666.6, "x": "まだ動くと確かめられました。"}, {"t": 668.35, "x": "けれども条件によっては当てにならないことも"}, {"t": 670.8833333333333, "x": "分かりました。"}, {"t": 671.65, "x": "10月24日。"}, {"t": 673.05, "x": "傷んだかもしれない部分の上に、"}, {"t": 674.9833333333333, "x": "テープを25回よけいに巻きつけました。"}, {"t": 677.8, "x": "その部分にはこの先なにも記録しないと決められました。"}, {"t": 681.2, "x": "10月11日に写した木星の写真は、"}, {"t": 684.05, "x": "ちょうどその部分にありました。"}, {"t": 686.0666666666667, "x": "この1枚は、地球へ送られないことになりました。"}, {"t": 689.5, "x": "もう一つ、大きな決定がありました。"}, {"t": 692.25, "x": "12月7日には、衛星イオとエウロパの写真を撮らない。"}, {"t": 696.2666666666667, "x": "その日のテープは、すべてプローブの記録のために使う。"}, {"t": 699.9, "x": "プローブの記録は全部取らなければならない。"}, {"t": 702.5666666666667, "x": "計画の責任者は、そう話しています。"}, {"t": 705.4833333333333, "x": "イオに最も近づく日でしたが、"}, {"t": 707.35, "x": "写真はあきらめることになりました。"}, {"t": 709.7666666666667, "x": "NASAは、この日の流れを時刻表にまとめていました。"}, {"t": 713.3333333333334, "x": "時刻はアメリカ東部時間です。"}, {"t": 715.3333333333334, "x": "午前11時4分。"}, {"t": 716.9, "x": "プローブの仕事が始まります。"}, {"t": 718.8666666666667, "x": "大気に入るちょうど6時間前です。"}, {"t": 721.2, "x": "5か月眠っていた機体が、目を覚ましました。"}, {"t": 724.3333333333334, "x": "午後零時46分。"}, {"t": 725.95, "x": "母船は木星の衛星イオのそばを通りました。"}, {"t": 728.95, "x": "イオまでの距離は約1000キロです。"}, {"t": 731.0333333333333, "x": "火山の多い衛星のすぐそばでした。"}, {"t": 733.3333333333334, "x": "それでも10月に決めたとおり、"}, {"t": 735.1666666666666, "x": "写真も光の観測も取りませんでした。"}, {"t": 737.9833333333333, "x": "テープは、このあと届くプローブの"}, {"t": 740.2666666666667, "x": "声のために空けてあったのです。"}, {"t": 742.0666666666667, "x": "午後2時4分。"}, {"t": 743.2333333333333, "x": "目を覚ましてから3時間後です。"}, {"t": 745.2666666666667, "x": "プローブは、まわりの粒子を測り始めました。"}, {"t": 748.45, "x": "それまで誰も測ったことのない領域でした。"}, {"t": 751.1666666666666, "x": "この測定で、新しい放射線の帯が見つかっています。"}, {"t": 755.0, "x": "場所は、木星の雲のてっぺんから約5万キロ上空でした。"}, {"t": 759.0833333333334, "x": "午後4時54分。"}, {"t": 760.6, "x": "母船と木星との距離が、いちばん短くなりました。"}, {"t": 764.2, "x": "そして午後5時4分。"}, {"t": 765.7333333333333, "x": "プローブが木星の大気に入りました。"}, {"t": 768.15, "x": "日本時間では、12月8日の朝7時4分にあたります。"}, {"t": 772.4333333333333, "x": "母船はこの時から、プローブの声を待つ形に入りました。"}, {"t": 776.45, "x": "プローブが話すのは一度きりです。"}, {"t": 778.6, "x": "聞き逃せば、取り戻す方法はありません。"}, {"t": 781.55, "x": "木星の大気に触れたときの速さは、秒速約47キロでした。"}, {"t": 786.2333333333333, "x": "時速にすると約17万キロです。"}, {"t": 788.6333333333333, "x": "木星の強い重力に引かれて、ここまで速くなっていました。"}, {"t": 792.7333333333333, "x": "大気に入る角度は水平からわずか8度とされていました。"}, {"t": 796.3666666666667, "x": "これより浅いと大気にはね返されて"}, {"t": 798.4833333333333, "x": "宇宙へ飛び出してしまいます。"}, {"t": 800.15, "x": "これより深いと熱とブレーキの力に耐えられません。"}, {"t": 803.2833333333333, "x": "その間をねらった角度でした。"}, {"t": 805.2833333333333, "x": "入る場所は赤道の近くの帯です。"}, {"t": 807.6666666666666, "x": "木星が回るのと同じ向きに入る計画でした。"}, {"t": 810.8, "x": "この速さで気体にぶつかると、"}, {"t": 812.6166666666667, "x": "機体の前の気体は押しつぶされます。"}, {"t": 815.1833333333333, "x": "押しつぶされた気体は、光を放つほど熱くなります。"}, {"t": 818.7833333333333, "x": "NASAの発表では、その温度は"}, {"t": 820.9333333333333, "x": "太陽の表面の2倍に達しました。"}, {"t": 823.25, "x": "そばで見る者がいれば、太陽と"}, {"t": 825.6, "x": "同じくらいまぶしく見えたはずです。"}, {"t": 827.5833333333334, "x": "NASAの資料は、そう説明しています。"}, {"t": 830.3166666666667, "x": "機体にかかるブレーキの力も、桁が違いました。"}, {"t": 833.7166666666667, "x": "最も強いときで、地球の重力の約230倍です。"}, {"t": 837.9833333333333, "x": "体重50キロの人なら、10トンを"}, {"t": 840.5333333333333, "x": "超える重さで押されることになります。"}, {"t": 842.7333333333333, "x": "設計の段階で見込まれていた熱も、桁外れでした。"}, {"t": 846.4666666666667, "x": "1平方センチあたり、最も強いときで約30キロワット。"}, {"t": 850.8, "x": "家庭の電気ストーブなら、30台ぶんほどの熱です。"}, {"t": 854.5, "x": "それが、指先ほどの広さに集まる計算です。"}, {"t": 857.9166666666666, "x": "ブレーキの力も、設計では250倍まで見込まれていました。"}, {"t": 862.3, "x": "もう一つ、守らなければならない数字がありました。"}, {"t": 865.75, "x": "盾と中の機体をつなぐ面の温度です。"}, {"t": 868.3166666666667, "x": "パラシュートが開くまで、ここを"}, {"t": 870.4, "x": "摂氏約370度より低く保つ。"}, {"t": 873.0, "x": "それが盾に課された条件でした。"}, {"t": 875.15, "x": "この熱とブレーキを受け止めたのが前の盾でした。"}, {"t": 878.1166666666667, "x": "盾の材料は、炭素をしみ込ませた樹脂を固めたものです。"}, {"t": 882.05, "x": "熱を受けると表面が少しずつ焼けます。"}, {"t": 884.7, "x": "焼けた材料ははがれて飛んでいきます。"}, {"t": 887.0, "x": "はがれた材料が熱をいっしょに運び去ります。"}, {"t": 889.8, "x": "盾は自分を削りながら中を守る作りでした。"}, {"t": 892.8666666666667, "x": "論文には、こう書かれています。"}, {"t": 895.2, "x": "惑星に入った探査機の中で、最も激しい熱だった。"}, {"t": 899.1333333333333, "x": "音の速さの約50倍から、機体は減速していきました。"}, {"t": 903.15, "x": "パラシュートが開くまでは2分足らずです。"}, {"t": 905.6666666666666, "x": "その短い間に、プローブはほとんどの速さを失いました。"}, {"t": 909.8, "x": "計画では時速約17万キロから落としていきます。"}, {"t": 913.2, "x": "2分後には時速約160キロになるはずでした。"}, {"t": 916.5166666666667, "x": "はじめの速さの、1000分の1ほどしか残らない計算です。"}, {"t": 920.5166666666667, "x": "この間、プローブはまだ電波を送っていません。"}, {"t": 923.6666666666666, "x": "測った数字は機体の中のメモリーにためておく"}, {"t": 926.45, "x": "仕組みでした。"}, {"t": 927.2666666666667, "x": "ためた数字は、あとで母船へまとめて送られました。"}, {"t": 930.7833333333333, "x": "前の盾には、焼けて減っていく厚みを"}, {"t": 933.4166666666666, "x": "測る仕組みが埋め込まれていました。"}, {"t": 935.4, "x": "盾の中に細い検出器が10本。"}, {"t": 937.7333333333333, "x": "盾がどこまで削れたかを、時間を追って記録するものです。"}, {"t": 941.6, "x": "記録は1本につき84回。"}, {"t": 943.9333333333333, "x": "ほぼ0.57秒ごとに1回です。"}, {"t": 946.4333333333333, "x": "盾の厚さは、まんなかで14.6センチありました。"}, {"t": 950.2333333333333, "x": "外側に行くほど薄くなります。"}, {"t": 952.3, "x": "いちばん薄い所は5.1センチです。"}, {"t": 954.9, "x": "記録をもとに、盾がどれだけ減ったかが計算されました。"}, {"t": 958.6666666666666, "x": "論文に載った数字は次のとおりです。"}, {"t": 961.1166666666667, "x": "突入したときのプローブの重さは337キロ。"}, {"t": 964.6833333333333, "x": "前の盾が焼けて飛んだ分が約79キロ。"}, {"t": 967.6833333333333, "x": "後ろの覆いなどで減った分を合わせると、"}, {"t": 970.1, "x": "残りは約248キロでした。"}, {"t": 972.9333333333333, "x": "2分足らずの間に、機体の4分の1あまりが"}, {"t": 976.2666666666667, "x": "燃えて消えたことになります。"}, {"t": 977.8666666666667, "x": "盾が削れる速さも測られていました。"}, {"t": 980.35, "x": "最も速いところで、1秒に約0.4センチです。"}, {"t": 984.25, "x": "地上の試験で確かめられていた速さの4倍です。"}, {"t": 987.4166666666666, "x": "直径127センチの機体は、約121センチに縮んでいました。"}, {"t": 992.4833333333333, "x": "先のとがり方も変わりました。"}, {"t": 994.45, "x": "焼けたあとの盾は、先の丸みの半径が約23.5センチ。"}, {"t": 998.9833333333333, "x": "円すいの開きは、片側44度の形になっていました。"}, {"t": 1003.1333333333333, "x": "盾の形は、焼けながら作り変えられていたのです。"}, {"t": 1006.6166666666667, "x": "減り方は予想とずれていました。"}, {"t": 1008.65, "x": "まんなかは予想ほど削れませんでした。"}, {"t": 1011.0166666666667, "x": "一方で斜めの部分は予想より削れていました。"}, {"t": 1014.0833333333334, "x": "いちばん厳しかったのは盾の後ろのふちです。"}, {"t": 1016.8333333333334, "x": "ここに残った厚さは1.08センチでした。"}, {"t": 1019.7833333333333, "x": "2019年。"}, {"t": 1021.0333333333333, "x": "ポルトガルの研究者たちが、この記録を計算し直しました。"}, {"t": 1025.2333333333333, "x": "ふちが予想より削れた理由を、今のやり方で調べたのです。"}, {"t": 1029.3666666666666, "x": "結果は、今の計算でもふちの削れ方は"}, {"t": 1032.25, "x": "説明しきれないというものでした。"}, {"t": 1034.2333333333333, "x": "研究者たちが目を向けたのは水素の気体です。"}, {"t": 1037.1333333333334, "x": "その気体が出す熱の光が、大きく"}, {"t": 1039.7833333333333, "x": "効いていたと考えています。"}, {"t": 1041.4, "x": "それでもプローブは燃え尽きませんでした。"}, {"t": 1043.8, "x": "盾に余裕を持たせて作っていたからです。"}, {"t": 1046.3333333333333, "x": "研究者の一人は、その余裕が機体を救ったと話しています。"}, {"t": 1050.3833333333334, "x": "ガスの巨大な惑星に入った盾の記録。"}, {"t": 1053.05, "x": "それは今も、この1回ぶんしかありません。"}, {"t": 1055.9833333333333, "x": "研究者たちは、次は実験の装置で"}, {"t": 1058.65, "x": "確かめる予定だとしています。"}, {"t": 1060.3833333333334, "x": "熱の山を越えると、プローブは次の段階に移ります。"}, {"t": 1064.25, "x": "東部時間の午後5時5分52秒から6時2秒までの10秒間です。"}, {"t": 1068.9, "x": "小さなパラシュートが開きました。"}, {"t": 1070.95, "x": "見込みでは、ここの圧力は地球の"}, {"t": 1073.45, "x": "海面の100分の8ほどです。"}, {"t": 1075.3833333333334, "x": "高さは、海面と同じ圧力の所より約50キロ上でした。"}, {"t": 1079.8166666666666, "x": "続いて直径2.5メートルの主のパラシュートが開きました。"}, {"t": 1083.6, "x": "焼けた前の盾はここで切り離されました。"}, {"t": 1086.2, "x": "役目を終えた盾は、先に木星の中へ落ちていきました。"}, {"t": 1090.15, "x": "傘の下に残ったのは、装置を積んだ部分です。"}, {"t": 1093.5166666666667, "x": "4秒後の午後5時6分6秒。"}, {"t": 1095.8166666666666, "x": "直接の測定が始まりました。"}, {"t": 1098.0, "x": "さらに9秒後。"}, {"t": 1099.2833333333333, "x": "プローブは母船へ電波を送り始めました。"}, {"t": 1102.0, "x": "突入から、わずか2分あまりのことでした。"}, {"t": 1105.0666666666666, "x": "母船は約21万キロ上空でこの声を受けました。"}, {"t": 1108.6666666666667, "x": "計画では母船は50秒以内に"}, {"t": 1110.8333333333333, "x": "声をつかまえることになっていました。"}, {"t": 1112.95, "x": "プローブの送信機は2台ありました。"}, {"t": 1115.25, "x": "どちらも1秒に128ビットの速さです。"}, {"t": 1118.35, "x": "2台は、ほとんど同じ中身を母船へ送り続けました。"}, {"t": 1122.1666666666667, "x": "母船は届いた数字をしまいます。"}, {"t": 1124.35, "x": "しまう先は、テープと機体のコンピューターの両方です。"}, {"t": 1127.9166666666667, "x": "ここからは、パラシュートでゆっくり降りていく時間です。"}, {"t": 1131.3166666666666, "x": "プローブは地面に向かって降りるのではありません。"}, {"t": 1134.1166666666666, "x": "ただ、気体がしだいに濃くなる方へ沈んでいきます。"}, {"t": 1137.4833333333333, "x": "降りながら7つの装置が順番に動き出しました。"}, {"t": 1140.55, "x": "温度計は、まわりの気体の温度を刻みます。"}, {"t": 1143.7, "x": "圧力計は、機体にかかる圧力を刻みます。"}, {"t": 1147.0666666666666, "x": "気体を吸い込む口からは、中身を"}, {"t": 1149.4666666666667, "x": "調べる装置へ気体が送られます。"}, {"t": 1151.5833333333333, "x": "雲の粒を数える装置は、小さな光を外へ当てていました。"}, {"t": 1155.85, "x": "時刻表では、午後5時12分ごろ。"}, {"t": 1158.7166666666667, "x": "圧力が地球の海面と同じくらいになります。"}, {"t": 1161.7166666666667, "x": "計画の見込みでは、そこでのまわりの温度は"}, {"t": 1164.6166666666666, "x": "摂氏マイナス107度ほどでした。"}, {"t": 1166.6833333333334, "x": "木星の大気の中から、初めて数字が届きはじめたのです。"}, {"t": 1170.8166666666666, "x": "降りる前、木星の雲には3つの層が"}, {"t": 1173.6833333333334, "x": "あると考えられていました。"}, {"t": 1175.2333333333333, "x": "いちばん上はアンモニアの氷の雲。"}, {"t": 1177.5166666666667, "x": "その下に、硫黄とアンモニアがまざった雲。"}, {"t": 1180.45, "x": "さらに下に水の雲。"}, {"t": 1182.0, "x": "雲を3段に重ねた姿が、降りる前の見立てでした。"}, {"t": 1185.75, "x": "プローブはこの3つの層を順に通り抜けるはずでした。"}, {"t": 1189.05, "x": "水の雲の下のほうでは、稲妻や"}, {"t": 1191.5666666666666, "x": "激しい雨に出会うかもしれない。"}, {"t": 1193.4833333333333, "x": "降りる前の資料には、そう書かれていました。"}, {"t": 1196.4333333333334, "x": "ところが、はっきり捉えた雲の層は一つだけでした。"}, {"t": 1199.95, "x": "その雲も、地球の雲にくらべるとうすいものでした。"}, {"t": 1203.4666666666667, "x": "中身は、硫黄とアンモニアが"}, {"t": 1205.5166666666667, "x": "まざった粒だったと考えられています。"}, {"t": 1207.75, "x": "3段に重なった雲は見つかりませんでした。"}, {"t": 1210.4666666666667, "x": "水の量も予想とは違っていました。"}, {"t": 1212.8, "x": "ボイジャーの観測から出ていた見立てがあります。"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
